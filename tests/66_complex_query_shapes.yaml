  - sql: "DROP TABLE IF EXISTS cq_assignment"
  - sql: "DROP TABLE IF EXISTS cq_item"
  - sql: "DROP TABLE IF EXISTS cq_parent"
  - sql: "DROP TABLE IF EXISTS cq_ref"
