metadata:
  version: "1.0"
  description: "Scalar subselect patterns: derived tables, CASE WHEN, badge queries, permission checks"

setup:
  - sql: "DROP TABLE IF EXISTS default_document_type"
  - sql: "DROP TABLE IF EXISTS scalar_property_types"
  - sql: "DROP TABLE IF EXISTS scalar_properties"
  - sql: "DROP TABLE IF EXISTS scalar_documents"
  - sql: "DROP TABLE IF EXISTS scalar_categories"
  - sql: "DROP TABLE IF EXISTS scalar_revisions"
  - sql: "DROP TABLE IF EXISTS scalar_postal_codes"
  - sql: "CREATE TABLE default_document_type (ID INT PRIMARY KEY, deftype VARCHAR(50))"
  - sql: "INSERT INTO default_document_type (ID, deftype) VALUES (1, 'invoice')"
  - sql: "CREATE TABLE scalar_property_types (ID INT PRIMARY KEY, name VARCHAR(50), type VARCHAR(20))"
  - sql: |
      INSERT INTO scalar_property_types (ID, name, type) VALUES
        (1, 'Date', 'date'), (2, 'Amount', 'number'), (3, 'Notes', 'text')
  - sql: "CREATE TABLE scalar_properties (ID INT PRIMARY KEY, type INT, dateVal VARCHAR(20), textVal VARCHAR(100), numVal DECIMAL(10,2), doc INT)"
  - sql: |
      INSERT INTO scalar_properties (ID, type, dateVal, textVal, numVal, doc) VALUES
        (1, 1, '2025-01-01', NULL, NULL, 1),
        (2, 2, NULL, NULL, 99.50, 1),
        (3, 3, NULL, 'note', NULL, 2),
        (4, 1, '2025-06-15', NULL, NULL, 2)
  - sql: "CREATE TABLE scalar_documents (ID INT PRIMARY KEY, type VARCHAR(50), archive BOOLEAN DEFAULT FALSE, boxid INT, date VARCHAR(20))"
  - sql: |
      INSERT INTO scalar_documents (ID, type, archive, boxid, date) VALUES
        (1, 'invoice', FALSE, 1, '2025-01-01'),
        (2, 'invoice', FALSE, 2, '2025-02-01'),
        (3, 'receipt', TRUE, 1, '2025-03-01')
  - sql: "CREATE TABLE scalar_categories (ID INT PRIMARY KEY, name VARCHAR(50), parent INT)"
  - sql: |
      INSERT INTO scalar_categories (ID, name, parent) VALUES
        (1, 'Invoices', NULL), (2, 'Receipts', NULL), (3, 'Sub', 1)
  - sql: "CREATE TABLE scalar_revisions (ID INT PRIMARY KEY, doc INT, created VARCHAR(20), file INT)"
  - sql: |
      INSERT INTO scalar_revisions (ID, doc, created, file) VALUES
        (1, 1, '2025-01-01', 100), (2, 1, '2025-01-02', 101), (3, 2, '2025-02-01', 102)
  - sql: "CREATE TABLE scalar_postal_codes (ID INT PRIMARY KEY, PLZ VARCHAR(10), Ort VARCHAR(100))"
  - sql: |
      INSERT INTO scalar_postal_codes (ID, PLZ, Ort) VALUES
        (1, '10115', 'Berlin'), (2, '10117', 'Berlin'),
        (3, '80331', 'Muenchen'), (4, '80333', 'Muenchen'),
        (5, '50667', 'Koeln'), (6, '10115', 'Berlin Mitte')

cleanup:
  - sql: "DROP TABLE IF EXISTS default_document_type"
  - sql: "DROP TABLE IF EXISTS scalar_property_types"
  - sql: "DROP TABLE IF EXISTS scalar_properties"
  - sql: "DROP TABLE IF EXISTS scalar_documents"
  - sql: "DROP TABLE IF EXISTS scalar_categories"
  - sql: "DROP TABLE IF EXISTS scalar_revisions"
  - sql: "DROP TABLE IF EXISTS scalar_postal_codes"

test_cases:
  # Pattern 1: Scalar subselects in SELECT list (12s in prod)
  # Repeated scalar subselect on same correlation in SELECT list
  - name: "Scalar subselect in SELECT list - repeated type lookup"
    sql: |
      SELECT
        scalar_properties.ID,
        scalar_properties.dateVal,
        ('date') = ((SELECT scalar_property_types.type FROM scalar_property_types WHERE scalar_property_types.ID = scalar_properties.type LIMIT 1)) AS dateVis,
        ('number') = ((SELECT scalar_property_types.type FROM scalar_property_types WHERE scalar_property_types.ID = scalar_properties.type LIMIT 1)) AS numVis,
        ('text') = ((SELECT scalar_property_types.type FROM scalar_property_types WHERE scalar_property_types.ID = scalar_properties.type LIMIT 1)) AS textVis
      FROM scalar_properties
    expect:
      rows: 4

  # Pattern 2: Derived table with CASE WHEN + scalar subselect (8-10s in prod)
  # Config-lookup scalar subselect inside CASE WHEN
  - name: "Derived table with CASE WHEN scalar subselect"
    sql: |
      SELECT t.* FROM (
        SELECT
          scalar_documents.ID,
          CASE
            WHEN ((((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) IS NULL)
              AND ((scalar_documents.type) IS NULL))
              OR ((scalar_documents.type) = ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)))
            THEN 'green'
            ELSE 'gray'
          END AS color,
          scalar_documents.date
        FROM scalar_documents
        WHERE NOT scalar_documents.archive
      ) AS t
      WHERE TRUE
      LIMIT 72 OFFSET 0
    expect:
      rows: 2

  - name: "Minimal derived table CASE scalar with outer star"
    sql: |
      SELECT t.* FROM (
        SELECT
          scalar_documents.ID,
          CASE
            WHEN ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1) = 'invoice')
            THEN 'green'
            ELSE 'gray'
          END AS color
        FROM scalar_documents
        WHERE scalar_documents.ID = 1
      ) AS t
    expect:
      rows: 1
      data:
        - ID: 1
          color: green

  - name: "Minimal derived table CASE scalar with outer projection"
    sql: |
      SELECT t.color FROM (
        SELECT
          CASE
            WHEN ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1) = 'invoice')
            THEN 'green'
            ELSE 'gray'
          END AS color
        FROM scalar_documents
        WHERE scalar_documents.ID = 1
      ) AS t
    expect:
      rows: 1
      data:
        - color: green

  - name: "Direct CASE repeated scalar null-or-equals"
    sql: |
      SELECT
        scalar_documents.ID,
        CASE
          WHEN ((((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) IS NULL)
            AND ((scalar_documents.type) IS NULL))
            OR ((scalar_documents.type) = ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)))
          THEN 'green'
          ELSE 'gray'
        END AS color
      FROM scalar_documents
      WHERE scalar_documents.ID = 1
    expect:
      rows: 1
      data:
        - ID: 1
          color: green

  - name: "Derived table CASE repeated scalar with outer projection"
    sql: |
      SELECT t.color FROM (
        SELECT
          CASE
            WHEN ((((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) IS NULL)
              AND ((scalar_documents.type) IS NULL))
              OR ((scalar_documents.type) = ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)))
            THEN 'green'
            ELSE 'gray'
          END AS color
        FROM scalar_documents
        WHERE scalar_documents.ID = 1
      ) AS t
    expect:
      rows: 1
      data:
        - color: green

  - name: "Derived table CASE repeated scalar with outer star"
    sql: |
      SELECT t.* FROM (
        SELECT
          scalar_documents.ID,
          CASE
            WHEN ((((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) IS NULL)
              AND ((scalar_documents.type) IS NULL))
              OR ((scalar_documents.type) = ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)))
            THEN 'green'
            ELSE 'gray'
          END AS color
        FROM scalar_documents
        WHERE scalar_documents.ID = 1
      ) AS t
    expect:
      rows: 1
      data:
        - ID: 1
          color: green

  - name: "Arithmetic expression wraps scalar subselect in direct projection"
    sql: |
      SELECT
        scalar_documents.ID,
        (3 + 4 * (((SELECT ID FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) + 1)) AS score
      FROM scalar_documents
      WHERE scalar_documents.ID = 1
    expect:
      rows: 1
      data:
        - ID: 1
          score: 11

  - name: "Derived table arithmetic wrapper around scalar projection"
    sql: |
      SELECT t.* FROM (
        SELECT
          scalar_documents.ID,
          (3 + 4 * (((SELECT ID FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) + 1)) AS score
        FROM scalar_documents
        WHERE scalar_documents.ID = 1
      ) AS t
    expect:
      rows: 1
      data:
        - ID: 1
          score: 11

  - name: "COALESCE with scalar subselect survives derived table projection"
    sql: |
      SELECT t.color FROM (
        SELECT
          COALESCE((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1), 'fallback') AS color
        FROM scalar_documents
        WHERE scalar_documents.ID = 1
      ) AS t
    expect:
      rows: 1
      data:
        - color: invoice

  - name: "NOT IS NULL wrapper around scalar subselect"
    sql: |
      SELECT
        scalar_documents.ID,
        CASE
          WHEN NOT (((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) IS NULL)
          THEN 'present'
          ELSE 'missing'
        END AS status
      FROM scalar_documents
      WHERE scalar_documents.ID = 1
    expect:
      rows: 1
      data:
        - ID: 1
          status: present

  - name: "Correlated repeated scalar in CASE null-or-equals"
    sql: |
      SELECT
        scalar_documents.ID,
        CASE
          WHEN ((((SELECT scalar_properties.doc
                    FROM scalar_properties
                    WHERE scalar_properties.doc = scalar_documents.ID
                    ORDER BY scalar_properties.ID
                    LIMIT 1)) IS NULL)
            AND ((scalar_documents.ID) IS NULL))
            OR ((scalar_documents.ID) = ((SELECT scalar_properties.doc
                                 FROM scalar_properties
                                 WHERE scalar_properties.doc = scalar_documents.ID
                                 ORDER BY scalar_properties.ID
                                 LIMIT 1)))
          THEN 'hit'
          ELSE 'miss'
        END AS match_state
      FROM scalar_documents
      WHERE scalar_documents.ID = 1
    expect:
      rows: 1
      data:
        - ID: 1
          match_state: hit

  - name: "Derived table keeps correlated repeated scalar inside arithmetic CASE"
    sql: |
      SELECT t.* FROM (
        SELECT
          scalar_documents.ID,
          CASE
            WHEN (3 + 4 * COALESCE((SELECT scalar_properties.doc
                                     FROM scalar_properties
                                     WHERE scalar_properties.doc = scalar_documents.ID
                                     ORDER BY scalar_properties.ID
                                     LIMIT 1), 0)) = 7
            THEN 'scaled'
            ELSE 'other'
          END AS state
        FROM scalar_documents
        WHERE scalar_documents.ID = 1
      ) AS t
    expect:
      rows: 1
      data:
        - ID: 1
          state: scaled

  - name: "Derived table pruning drops unused scalar projection for outer count"
    sql: |
      EXPLAIN IR
      SELECT COUNT(*) AS cnt FROM (
        SELECT
          scalar_documents.ID,
          scalar_documents.date,
          (SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1) AS colorType
        FROM scalar_documents
        WHERE NOT scalar_documents.archive
      ) AS t
    expect:
      contains:
        - "scalar_documents"
      not_contains:
        - "domain_scalar_default_document_type_0"

  - name: "Derived table pruning keeps join key columns used only in outer ON"
    sql: |
      SELECT scalar_revisions.ID
      FROM scalar_revisions
      LEFT JOIN (
        SELECT scalar_documents.ID AS docID, scalar_documents.date AS docDate
        FROM scalar_documents
      ) refDoc ON refDoc.docID = scalar_revisions.doc
      ORDER BY scalar_revisions.ID
    expect:
      rows: 3
      data:
        - ID: 1
        - ID: 2
        - ID: 3

  - name: "EXPLAIN IR reuses uncorrelated scalar helper in CASE WHEN"
    sql: |
      EXPLAIN IR
      SELECT
        scalar_documents.ID,
        CASE
          WHEN ((((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) IS NULL)
            AND ((scalar_documents.type) IS NULL))
            OR ((scalar_documents.type) = ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)))
          THEN 'green'
          ELSE 'gray'
        END AS color,
        scalar_documents.date
      FROM scalar_documents
      WHERE NOT scalar_documents.archive
      LIMIT 72 OFFSET 0
    expect:
      rows: 8
      contains:
        - "domain_scalar_default_document_type_0"
      not_contains:
        - "domain_scalar_default_document_type_1"

  # Pattern 3: GROUP BY with MIN(CONCAT(...)) (6s in prod)
  # Aggregation with string concat in GROUP BY
  - name: "GROUP BY with MIN CONCAT"
    sql: |
      SELECT scalar_postal_codes.PLZ AS value, MIN(CONCAT(scalar_postal_codes.PLZ, ' - ', scalar_postal_codes.Ort)) AS `desc`
      FROM scalar_postal_codes
      WHERE TRUE
      GROUP BY scalar_postal_codes.PLZ
      LIMIT 20000
    expect:
      rows: 5

  # Pattern 4: Derived table with LEFT JOIN + scalar subselect (10s in prod)
  # LEFT JOIN derived table + correlated scalar subselect
  - name: "Derived table with LEFT JOIN and scalar subselect"
    sql: |
      SELECT t.* FROM (
        SELECT
          scalar_revisions.ID,
          scalar_revisions.created,
          scalar_revisions.doc,
          (SELECT scalar_documents.date FROM scalar_documents WHERE scalar_documents.ID = scalar_revisions.doc LIMIT 1) AS docDate,
          1
        FROM scalar_revisions
        LEFT JOIN (
          SELECT ID AS docID, scalar_documents.date AS docDate, (TRUE) AS canView
          FROM scalar_documents
        ) refDoc ON refDoc.docID = scalar_revisions.doc
        WHERE TRUE
      ) AS t
      WHERE TRUE
      LIMIT 72 OFFSET 0
    expect:
      rows: 3

  # Pattern 5: Badge query - multiple unrelated scalar subselects (duration overflow in prod)
  # Multiple independent scalar subselects in a single SELECT (no FROM table)
  - name: "Multiple unrelated scalar subselects (badge pattern)"
    sql: |
      SELECT 1,
        (SELECT COUNT(1) FROM scalar_documents WHERE TRUE
          AND (((((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1)) IS NULL)
            AND ((scalar_documents.type) IS NULL))
            OR ((scalar_documents.type) = ((SELECT deftype FROM default_document_type WHERE default_document_type.ID = 1 LIMIT 1))))
          AND (NOT (scalar_documents.archive))
        LIMIT 1) AS badgeDoc,
        (SELECT COUNT(1) FROM scalar_revisions WHERE TRUE LIMIT 1) AS revCount
    expect:
      rows: 1
      data:
        - badgeDoc: 2
          revCount: 3

  # Pattern 6: Nested COALESCE with scalar subselect fallback
  - name: "Nested COALESCE permission check pattern"
    sql: |
      SELECT
        scalar_properties.ID,
        (TRUE) AND (COALESCE(
          (SELECT (TRUE) FROM scalar_categories WHERE scalar_categories.ID = scalar_properties.type LIMIT 1),
          FALSE
        )) AS canView
      FROM scalar_properties
    expect:
      rows: 4
