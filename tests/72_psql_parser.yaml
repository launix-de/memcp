# PostgreSQL parser feature tests

metadata:
  version: "1.0"
  description: "PostgreSQL-specific parser features: BETWEEN, casts, functions"
  syntax: postgresql

setup:
  - sql: "DROP TABLE IF EXISTS psql_data"
  - sql: "DROP TABLE IF EXISTS psql_decimal_range"
  - sql: |
      CREATE TABLE psql_data (
        id INT PRIMARY KEY,
        name VARCHAR(50),
        val INT
      )
  - sql: |
      INSERT INTO psql_data (id, name, val) VALUES
      (1, 'Alice', 10), (2, 'Bob', 30), (3, 'Charlie', 50), (4, 'Alice', 20)
  - sql: |
      CREATE TABLE psql_decimal_range (
        id INT, extended_price DECIMAL(15,2), discount DECIMAL(15,2),
        quantity DECIMAL(15,2), ship_date DATE
      )
  - scm: |
      (begin
        (set discounts '(0.04 0.05 0.06 0.07 0.08))
        (set rows (map (produceN 5000) (lambda (i)
          (list i 100.01 (nth discounts (- i (* 5 (floor (/ i 5))))) 10.00 "1994-06-15"))))
        (insert (table "memcp-tests" "psql_decimal_range")
          '("id" "extended_price" "discount" "quantity" "ship_date") rows)
        5000)

test_cases:
  - name: "EXPLAIN COMPILE exposes PostgreSQL planner metrics"
    sql: "EXPLAIN COMPILE SELECT id FROM psql_data WHERE val BETWEEN 20 AND 40 ORDER BY id"
    expect:
      rows: 1
      contains:
        - "parse_ns"
        - "physical_prepare_ns"
        - "recipe_emit_ns"
        - "serialize_ns"
        - "planner_total_ns"
        - "compile_total_ns"
        - "plan_bytes"
        - "query_blocks"
        - "scans"

  # === pg_dump compatibility no-ops ===
  - name: "ALTER STATISTICS is ignored"
    sql: "ALTER STATISTICS public.psql_data_stats OWNER TO postgres"
    expect: {}

  # === BETWEEN / NOT BETWEEN ===
  - name: "BETWEEN filter"
    sql: |
      SELECT id, val FROM psql_data WHERE val BETWEEN 20 AND 40 ORDER BY id
    expect:
      rows: 2
      data:
        - id: 2
          val: 30
        - id: 4
          val: 20

  - name: "NOT BETWEEN filter"
    sql: |
      SELECT id, val FROM psql_data WHERE val NOT BETWEEN 20 AND 40 ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1
          val: 10
        - id: 3
          val: 50

  - name: "NOT LIKE is case-sensitive"
    sql: "SELECT id FROM psql_data WHERE name NOT LIKE '%li%' ORDER BY id"
    expect:
      rows: 1
      data:
        - id: 2

  - name: "NOT ILIKE is case-insensitive"
    sql: "SELECT id FROM psql_data WHERE name NOT ILIKE '%ALICE%' ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 2
        - id: 3

  # === Derived-table column alias lists ===
  - name: "Derived table exposes explicit column aliases"
    sql: |
      SELECT derived.renamed_id, derived.renamed_value
      FROM (SELECT id, val FROM psql_data) AS derived(renamed_id, renamed_value)
      ORDER BY derived.renamed_id
      LIMIT 2
    expect:
      rows: 2
      data:
        - renamed_id: 1
          renamed_value: 10
        - renamed_id: 2
          renamed_value: 30

  - name: "Derived table accepts a prefix column alias list"
    sql: |
      SELECT derived.renamed_id, derived.val
      FROM (SELECT id, val FROM psql_data) derived(renamed_id)
      ORDER BY derived.renamed_id
      LIMIT 1
    expect:
      rows: 1
      data:
        - renamed_id: 1
          val: 10

  - name: "TPC-H Q13-shaped derived aggregate column aliases"
    sql: |
      SELECT c_count, COUNT(*) AS custdist
      FROM (
        SELECT customer.name, COUNT(orders.id)
        FROM psql_data customer
        LEFT OUTER JOIN psql_data orders ON customer.name = orders.name
          AND orders.name NOT LIKE '%special%packages%'
        GROUP BY customer.name
      ) AS c_orders(customer_name, c_count)
      GROUP BY c_count
      ORDER BY c_count
    expect:
      rows: 2
      data:
        - c_count: 1
          custdist: 2
        - c_count: 4
          custdist: 1

  - name: "Derived table rejects excess column aliases"
    sql: "SELECT * FROM (SELECT id FROM psql_data) AS derived(one, two)"
    expect:
      error: true

  - name: "TPC-H Q6 decimal range semantics across scan batches"
    sql: |
      SELECT SUM(extended_price * discount) AS revenue
      FROM psql_decimal_range
      WHERE ship_date >= DATE '1994-01-01'
        AND ship_date < DATE '1994-01-01' + INTERVAL '1' YEAR
        AND discount BETWEEN 0.05 AND 0.07
        AND quantity < 24
    expect:
      rows: 1
      data:
        - revenue: 18001.8

  - name: "TPC-H Q1 decimal SUM preserves cents across scan batches"
    sql: "SELECT SUM(extended_price) BETWEEN 500049.99 AND 500050.01 AS cents_preserved FROM psql_decimal_range"
    expect:
      rows: 1
      data:
        - cents_preserved: true

  - name: "TPC-H Q1 grouped decimal SUM preserves cents"
    sql: |
      SELECT discount,
        SUM(extended_price) BETWEEN 100009.99 AND 100010.01 AS cents_preserved
      FROM psql_decimal_range
      GROUP BY discount
      ORDER BY discount
    expect:
      rows: 5
      data:
        - { discount: 0.04, cents_preserved: true }
        - { discount: 0.05, cents_preserved: true }
        - { discount: 0.06, cents_preserved: true }
        - { discount: 0.07, cents_preserved: true }
        - { discount: 0.08, cents_preserved: true }

  - name: "TPC-H Q6 decimal BETWEEN includes both endpoints"
    sql: |
      SELECT discount, COUNT(*) AS rows_per_discount
      FROM psql_decimal_range
      WHERE discount BETWEEN 0.05 AND 0.07
      GROUP BY discount
      ORDER BY discount
    expect:
      rows: 3
      data:
        - { discount: 0.05, rows_per_discount: 1000 }
        - { discount: 0.06, rows_per_discount: 1000 }
        - { discount: 0.07, rows_per_discount: 1000 }

  - name: "TPC-H Q6 combined predicates retain every matching row"
    sql: |
      SELECT COUNT(*) AS matching_rows
      FROM psql_decimal_range
      WHERE ship_date >= DATE '1994-01-01'
        AND ship_date < DATE '1994-01-01' + INTERVAL '1' YEAR
        AND discount BETWEEN 0.05 AND 0.07
        AND quantity < 24
    expect:
      rows: 1
      data:
        - matching_rows: 3000

  - name: "TPC-H Q6 decimal range composes with quantity predicate"
    sql: "SELECT COUNT(*) AS matching_rows FROM psql_decimal_range WHERE discount BETWEEN 0.05 AND 0.07 AND quantity < 24"
    on_fail:
      sql: "EXPLAIN SELECT COUNT(*) AS matching_rows FROM psql_decimal_range WHERE discount BETWEEN 0.05 AND 0.07 AND quantity < 24"
    expect:
      rows: 1
      data:
        - matching_rows: 3000

  - name: "TPC-H Q6 quantity predicate order does not affect decimal range"
    sql: "SELECT COUNT(*) AS matching_rows FROM psql_decimal_range WHERE quantity < 24 AND discount BETWEEN 0.05 AND 0.07"
    expect:
      rows: 1
      data:
        - matching_rows: 3000

  - name: "TPC-H Q6 quantity predicate preserves all qualifying decimals"
    sql: "SELECT COUNT(*) AS matching_rows FROM psql_decimal_range WHERE quantity < 24"
    expect:
      rows: 1
      data:
        - matching_rows: 5000

  - name: "TPC-H Q6 decimal range composes with date predicates"
    sql: "SELECT COUNT(*) AS matching_rows FROM psql_decimal_range WHERE ship_date >= DATE '1994-01-01' AND ship_date < DATE '1995-01-01' AND discount BETWEEN 0.05 AND 0.07"
    expect:
      rows: 1
      data:
        - matching_rows: 3000

  # === :: cast operator ===
  - name: "Cast integer to text"
    sql: "SELECT 42::text AS t"
    expect:
      rows: 1
      data:
        - t: "42"

  - name: "Cast string to integer"
    sql: "SELECT '123'::integer AS i"
    expect:
      rows: 1
      data:
        - i: 123

  - name: "Cast string to int"
    sql: "SELECT '456'::int AS i"
    expect:
      rows: 1
      data:
        - i: 456

  - name: "Cast string to bigint"
    sql: "SELECT '999999999999'::bigint AS b"
    expect:
      rows: 1
      data:
        - b: 999999999999

  - name: "Cast string to float"
    sql: "SELECT '3.14'::float AS f"
    expect:
      rows: 1
      data:
        - f: 3.14

  - name: "Cast string to numeric"
    sql: "SELECT '42.5'::numeric AS n"
    expect:
      rows: 1
      data:
        - n: 42.5

  - name: "Cast string to boolean"
    sql: "SELECT '1'::boolean AS b"
    expect:
      rows: 1
      data:
        - b: true

  - name: "Cast string to date"
    sql: "SELECT '2025-06-15'::date AS d"
    expect:
      rows: 1
      data:
        - d: "2025-06-15"

  - name: "Cast to varchar"
    sql: "SELECT 42::varchar AS v"
    expect:
      rows: 1
      data:
        - v: "42"

  # === COUNT(DISTINCT) ===
  - name: "COUNT DISTINCT"
    sql: "SELECT COUNT(DISTINCT name) AS cnt FROM psql_data"
    expect:
      rows: 1
      data:
        - cnt: 3

  # === CURRENT_DATE / CURRENT_TIMESTAMP ===
  - name: "CURRENT_DATE returns a value"
    sql: "SELECT CURRENT_DATE AS d"
    expect:
      rows: 1

  - name: "CURRENT_TIMESTAMP returns a value"
    sql: "SELECT CURRENT_TIMESTAMP AS ts"
    expect:
      rows: 1

  # === EXTRACT ===
  - name: "EXTRACT YEAR"
    sql: "SELECT EXTRACT(YEAR FROM '2025-06-15') AS y"
    expect:
      rows: 1
      data:
        - y: 2025

  - name: "EXTRACT MONTH"
    sql: "SELECT EXTRACT(MONTH FROM '2025-06-15') AS m"
    expect:
      rows: 1
      data:
        - m: 6

  # === IFNULL ===
  - name: "IFNULL with NULL"
    sql: "SELECT IFNULL(NULL, 42) AS v"
    expect:
      rows: 1
      data:
        - v: 42

  - name: "IFNULL without NULL"
    sql: "SELECT IFNULL(7, 42) AS v"
    expect:
      rows: 1
      data:
        - v: 7

  # === SUBSTRING FROM FOR ===
  - name: "SUBSTRING FROM FOR"
    sql: "SELECT SUBSTRING('hello world' FROM 1 FOR 5) AS s"
    expect:
      rows: 1
      data:
        - s: "hello"

  # === DATE function ===
  - name: "DATE truncation"
    sql: "SELECT DATE('2025-06-15 12:30:00') AS d"
    expect:
      rows: 1

  # === DATE_ADD / DATE_SUB ===
  - name: "DATE_ADD"
    sql: "SELECT DATE_ADD('2025-01-01', INTERVAL 1 DAY) AS d"
    expect:
      rows: 1

  - name: "DATE_SUB"
    sql: "SELECT DATE_SUB('2025-01-01', INTERVAL 1 MONTH) AS d"
    expect:
      rows: 1

  # === INTERVAL arithmetic ===
  - name: "Date plus INTERVAL"
    sql: "SELECT '2025-01-01' + INTERVAL 7 DAY AS d"
    expect:
      rows: 1

  - name: "Date minus INTERVAL"
    sql: "SELECT '2025-06-15' - INTERVAL 3 MONTH AS d"
    expect:
      rows: 1

  # === CONVERT ===
  - name: "CONVERT to SIGNED"
    sql: "SELECT CONVERT('123', SIGNED) AS v"
    expect:
      rows: 1
      data:
        - v: 123

  # === UNION ALL ordering metadata ===
  - name: "UNION ALL carries ORDER LIMIT OFFSET from right branch"
    sql: |
      SELECT id, name FROM psql_data WHERE id = 1
      UNION ALL
      SELECT id, name FROM psql_data WHERE id > 1
      ORDER BY id LIMIT 2 OFFSET 1
    expect:
      rows: 2
      data:
        - id: 2
          name: "Bob"
        - id: 3
          name: "Charlie"

  - name: "UNION ALL chained right branch preserves final ORDER"
    sql: |
      SELECT id, name FROM psql_data WHERE id = 1
      UNION ALL
      SELECT id, name FROM psql_data WHERE id = 2
      UNION ALL
      SELECT id, name FROM psql_data WHERE id = 3
      ORDER BY id DESC LIMIT 2
    expect:
      rows: 2
      data:
        - id: 3
          name: "Charlie"
        - id: 2
          name: "Bob"

cleanup:
  - sql: "DROP TABLE IF EXISTS psql_decimal_range"
  - sql: "DROP TABLE IF EXISTS psql_data"
