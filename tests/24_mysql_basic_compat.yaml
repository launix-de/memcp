# MySQL Compatibility v1 — Basics

metadata:
  version: "1.0"
  description: "MySQL v1: identifiers, casts, NULL/booleans, escapes"
  # Suite is now expected to pass fully

setup:
  - sql: DROP TABLE IF EXISTS `compat_users`

test_cases:
  - name: "CREATE TABLE with backticked identifiers"
    sql: |
      CREATE TABLE `compat_users` (
        `id` INT PRIMARY KEY,
        `name` VARCHAR(100),
        `active` BOOLEAN
      )
    expect:
      affected_rows: 1

  - name: "INSERT respects backticks"
    sql: |
      INSERT INTO `compat_users` (`id`, `name`, `active`) VALUES (1, 'Ada', true)
    expect:
      affected_rows: 1

  - name: "SELECT with backticks"
    sql: |
      SELECT `id`, `name`, `active` FROM `compat_users`
    expect:
      rows: 1
      data:
        - id: 1
          name: "Ada"
          active: true

  - name: "Implicit numeric cast: string to int comparison"
    sql: |
      SELECT '1' = 1 AS eq
    expect:
      rows: 1
      data:
        - eq: true

  - name: "Implicit boolean truthiness"
    sql: |
      SELECT IF(1, 't', 'f') AS v
    expect:
      rows: 1
      data:
        - v: "t"

  - name: "String boolean truthiness uses MySQL numeric coercion"
    sql: |
      SELECT
        IF('0', 't', 'f') AS zero_string_if,
        IF('1', 't', 'f') AS one_string_if,
        NOT '0' AS not_zero_string,
        NOT '1' AS not_one_string,
        '0' OR FALSE AS zero_string_or_false,
        '1' AND TRUE AS one_string_and_true
    expect:
      rows: 1
      data:
        - zero_string_if: "f"
          one_string_if: "t"
          not_zero_string: true
          not_one_string: false
          zero_string_or_false: false
          one_string_and_true: true

  - name: "SELECT WHERE without FROM"
    # Avoids aggregate over derived table; checks filter semantics directly
    sql: |
      SELECT 1 WHERE 1
    expect:
      rows: 1

  - name: "SELECT WHERE without FROM and false"
    # Avoids aggregate over derived table; checks filter semantics directly
    sql: |
      SELECT 1 WHERE 0
    expect:
      rows: 0

  - name: "SELECT WHERE with false string"
    sql: |
      SELECT 1 WHERE '0'
    expect:
      rows: 0

  - name: "NULL truthiness (WHERE filters out)"
    # Avoids aggregate over derived table; checks filter semantics directly
    sql: |
      SELECT 1 WHERE NULL
    expect:
      rows: 0

  - name: "String escape single quote"
    sql: |
      SELECT 'can\'t' AS s
    expect:
      rows: 1
      data:
        - s: "can't"

  - name: "Backslash literal (no escape)"
    sql: |
      SELECT 'line\\nbreak' AS s
    expect:
      rows: 1
      data:
        - s: "line\\nbreak"

cleanup: []
