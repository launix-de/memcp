      (begin
        (define cols (map (produceN 128) (lambda (i) (concat "column_" (+ i 1)))))
        (define vals (map (produceN 128) (lambda (i) (+ i 1))))
        (insert (table "memcp-tests" "resolver_values")
          (cons "id" cols)
          (list (cons 1 vals))))

