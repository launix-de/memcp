#
# UNION ALL support
# Combines file sources and joined branches with ordered delivery.
# Ordered branches use native multi-scan or bounded complete-row producer merging.

metadata:
  version: "1.0"
  description: "UNION ALL combining results from multiple tables"

setup:
  - sql: "DROP TABLE IF EXISTS renderjob"
  - sql: "DROP TABLE IF EXISTS ua_fop_files"
  - sql: "DROP TABLE IF EXISTS ua_order_a"
  - sql: "DROP TABLE IF EXISTS ua_order_b"
  - sql: "DROP TABLE IF EXISTS ua_event"
  - sql: |
      CREATE TABLE ua_fop_files (
        ID INT PRIMARY KEY,
        name VARCHAR(64)
      )
  - sql: |
      CREATE TABLE renderjob (
        ID INT NOT NULL PRIMARY KEY,
        result INT
      )
  - sql: |
      INSERT INTO ua_fop_files (ID, name) VALUES
      (1, 'image1.png'), (2, 'image2.png'), (3, 'image3.png'),
      (4, 'image4.png'), (5, 'image5.png')
  - sql: |
      INSERT INTO renderjob (ID, result) VALUES
      (101, 1), (102, 3), (103, 3)
  - sql: "CREATE TABLE ua_order_a (value VARCHAR(20) COLLATE utf8mb4_unicode_ci)"
  - sql: "CREATE TABLE ua_order_b (value VARCHAR(20) COLLATE utf8mb4_unicode_ci)"
  - sql: "INSERT INTO ua_order_a VALUES (NULL), ('beta')"
  - sql: "INSERT INTO ua_order_b VALUES ('alpha'), (NULL)"
  - sql: "CREATE TABLE ua_event (id INT PRIMARY KEY, occurred_at INT)"
  - sql: "INSERT INTO ua_event VALUES (1, 5), (2, 15), (3, 25)"
  - sql: "DROP TABLE IF EXISTS ua_parallel"
  - sql: "CREATE TABLE ua_parallel (ID INT) ENGINE=memory"
  - scm: |
      (begin
        (define previous (settings "ShardSize"))
        (try (lambda () (begin
          (settings "ShardSize" 250)
          (insert (table "memcp-tests" "ua_parallel") '("ID")
            (map (produceN 1001) (lambda (i) (list (+ i 1)))))
          (rebuild (table "memcp-tests" "ua_parallel") true false)
          (settings "ShardSize" previous) true))
          (lambda (failure) (begin (settings "ShardSize" previous) (error failure)))))

  - sql: "DROP TABLE IF EXISTS ua_period"
  - sql: "DROP TABLE IF EXISTS ua_site"
  - sql: "DROP TABLE IF EXISTS ua_tenant"
  - sql: "DROP TABLE IF EXISTS ua_access"
  - sql: "DROP TABLE IF EXISTS ua_fact"
  - sql: "CREATE TABLE ua_period (id INT PRIMARY KEY, tenant_id INT) ENGINE=memory"
  - sql: "CREATE TABLE ua_site (id INT PRIMARY KEY) ENGINE=memory"
  - sql: "CREATE TABLE ua_tenant (id INT PRIMARY KEY) ENGINE=memory"
  - sql: "CREATE TABLE ua_access (actor INT, tenant_id INT) ENGINE=memory"
  - sql: "CREATE TABLE ua_fact (period_id INT, site_id INT) ENGINE=memory"
  - sql: "INSERT INTO ua_access VALUES (7, 1), (8, NULL)"
  - scm: |
      (begin
        (insert (table "memcp-tests" "ua_period") '("id" "tenant_id")
          (map (produceN 128) (lambda (i) (list (+ i 1) (+ i 1)))))
        (insert (table "memcp-tests" "ua_tenant") '("id")
          (map (produceN 128) (lambda (i) (list (+ i 1)))))
        (insert (table "memcp-tests" "ua_site") '("id")
          (map (produceN 16) (lambda (i) (list (+ i 1)))))
        (insert (table "memcp-tests" "ua_fact") '("period_id" "site_id")
          (map (produceN 65536) (lambda (i)
            (list (+ 1 (mod (floor (/ i 16)) 128)) (+ 1 (mod i 16))))))
        (map '("ua_period" "ua_tenant" "ua_site" "ua_fact" "ua_access")
          (lambda (name) (rebuild (table "memcp-tests" name) true false))))

test_cases:

  - name: "Non-NULL truth filters prove distinguishing nullable UNIQUE prefixes"
    scm: |
      (begin
        (define src '("e" "memcp-tests" "ua_event" false nil))
        (list
          (order_prefix_column_nonnull? src "id"
            (scheme "(not (nil? (get_column \"e\" false \"id\" false)))"))
          (order_prefix_column_nonnull? src "id"
            (scheme "(or (not (nil? (get_column \"e\" false \"id\" false))) true)"))
          (order_prefix_column_nonnull? src "id"
            (scheme "(not (nil? (get_column \"e\" false \"occurred_at\" false)))"))))
    expect: {data: [[true, false, false]]}

  - name: "Filtered nullable UNIQUE prefixes stream ordered joined producers"
    sql: |
      EXPLAIN SELECT e.id AS id, r.ID AS job
      FROM ua_event e CROSS JOIN renderjob r WHERE e.id IS NOT NULL
      UNION ALL SELECT 99 AS id, 0 AS job
      ORDER BY id ASC, job ASC
    expect:
      result_contains: [scan_order_merge]
      result_not_contains: [__join_materialized_, __union_materialized_]


  - name: "Ordered UNION streams rejecting unique lookup continuations"
    sql: |
      SELECT f.ID AS id, r.ID AS job FROM ua_fop_files f
      JOIN renderjob r ON f.ID = r.ID - 100 WHERE r.result <> 1
      UNION ALL
      SELECT ID AS id, 0 AS job FROM ua_fop_files WHERE ID <= 2
      ORDER BY id DESC, job ASC LIMIT 3 OFFSET 1
    expect:
      rows: 3
      data:
        - id: 2
          job: 0
        - id: 2
          job: 102
        - id: 1
          job: 0
    performance_rows: 3
    threshold_ms: 1000
    timing_aggregation: total
    warmup: 0
    timing_samples: 4

  - name: "Ordered UNION unique join uses native merge"
    sql: |
      EXPLAIN SELECT f.ID AS id, r.ID AS job FROM ua_fop_files f
      JOIN renderjob r ON f.ID = r.ID - 100 WHERE r.result <> 1
      UNION ALL SELECT ID AS id, 0 AS job FROM ua_fop_files WHERE ID <= 2
      ORDER BY id DESC, job ASC LIMIT 3 OFFSET 1
    expect:
      result_contains: [scan_order_multi]
      result_not_contains: [__union_materialized_]

  - name: "Ordered UNION preserves one-to-many join multiplicity"
    sql: |
      SELECT f.ID AS id, r.ID AS job FROM ua_fop_files f
      JOIN renderjob r ON f.ID = r.result
      UNION ALL SELECT 3 AS id, 0 AS job
      ORDER BY id ASC, job ASC LIMIT 3 OFFSET 1
    expect:
      rows: 3
      data:
        - id: 3
          job: 0
        - id: 3
          job: 102
        - id: 3
          job: 103

  - name: "Materialized grouped UNION orders ties and NULLs before slicing"
    sql: |
      SELECT result AS value, COUNT(*) AS amount FROM renderjob GROUP BY result
      UNION ALL
      SELECT NULL AS value, 2 AS amount
      ORDER BY amount DESC, value ASC
      LIMIT 2 OFFSET 1
    expect:
      rows: 2
      data:
        - value: 3
          amount: 2
        - value: 1
          amount: 1


  - name: "Ordered UNION merges multiplying joined producers with NULL keys"
    sql: |
      SELECT r.result AS value, r.ID AS job FROM renderjob r
      JOIN ua_order_a a ON a.value IS NULL
      UNION ALL SELECT NULL AS value, 0 AS job
      ORDER BY value ASC, job DESC LIMIT 3 OFFSET 1
    expect:
      rows: 3
      data:
        - value: 1
          job: 101
        - value: 3
          job: 103
        - value: 3
          job: 102
    performance_rows: 3
    threshold_ms: 1000
    timing_aggregation: total
    warmup: 0
    timing_samples: 4

  - name: "Joined producer UNION has no full UNION collector"
    sql: |
      EXPLAIN SELECT r.result AS value, r.ID AS job FROM renderjob r
      JOIN ua_order_a a ON a.value IS NULL
      UNION ALL SELECT NULL AS value, 0 AS job
      ORDER BY value ASC, job DESC LIMIT 3 OFFSET 1
    expect:
      result_contains: [scan_order_merge]
      result_not_contains: [__union_materialized_]

  # === Basic UNION ALL ===

  - name: "UNION ALL two tables"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT ID, CAST(result AS VARCHAR) AS name FROM renderjob WHERE ID <= 102
    expect:
      rows: 4

  - name: "UNION ALL preserves duplicates"
    sql: |
      SELECT name FROM ua_fop_files WHERE ID = 1
      UNION ALL
      SELECT name FROM ua_fop_files WHERE ID = 1
    expect:
      rows: 2
      data:
        - name: "image1.png"
        - name: "image1.png"

  - name: "UNION ALL three queries"
    sql: |
      SELECT name FROM ua_fop_files WHERE ID = 1
      UNION ALL
      SELECT name FROM ua_fop_files WHERE ID = 2
      UNION ALL
      SELECT name FROM ua_fop_files WHERE ID = 3
    expect:
      rows: 3
      data:
        - name: "image1.png"
        - name: "image2.png"
        - name: "image3.png"

  - name: "UNION ALL with WHERE filters"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT ID, name FROM ua_fop_files WHERE ID >= 4
    expect:
      rows: 4

  # === UNION ALL with ORDER BY / LIMIT ===
  # Uses scan_order_multi for materialization-free sorted merge across tables.

  - name: "UNION ALL with ORDER BY"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT ID, name FROM ua_fop_files WHERE ID >= 4
      ORDER BY ID
    expect:
      rows: 4
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "UNION ALL with LIMIT"
    sql: |
      SELECT ID, name FROM ua_fop_files
      UNION ALL
      SELECT ID, CAST(result AS VARCHAR) AS name FROM renderjob
      LIMIT 3
    expect:
      rows: 3

  - name: "UNION ALL with ORDER BY and LIMIT"
    sql: |
      SELECT ID, name FROM ua_fop_files
      UNION ALL
      SELECT ID, CAST(result AS VARCHAR) AS name FROM renderjob
      ORDER BY ID LIMIT 4
    expect:
      rows: 4
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "image3.png"
        - ID: 4
          name: "image4.png"

  - name: "UNION ALL with ORDER BY DESC and LIMIT"
    sql: |
      SELECT ID, name FROM ua_fop_files
      UNION ALL
      SELECT ID, CAST(result AS VARCHAR) AS name FROM renderjob
      ORDER BY ID DESC LIMIT 3
    expect:
      rows: 3
      data:
        - ID: 103
          name: "3"
        - ID: 102
          name: "3"
        - ID: 101
          name: "1"

  - name: "UNION ALL with ORDER BY and OFFSET"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID <= 3
      UNION ALL
      SELECT ID, name FROM ua_fop_files WHERE ID >= 4
      ORDER BY ID LIMIT 2 OFFSET 1
    expect:
      rows: 2
      data:
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "image3.png"

  - name: "Ordered joined UNION branch uses physical merge carriers"
    sql: |
      EXPLAIN
      SELECT f.ID AS value
      FROM ua_fop_files f
      JOIN renderjob r ON r.result = f.ID
      UNION ALL
      SELECT ID AS value FROM ua_fop_files
      ORDER BY value
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "scan_order_multi"
        - ".prejoin:"
        - "initialize_cache_table"
      result_not_contains:
        - "__union_rows"
        - "(sort rows"

  - name: "Ordered UNION globally merges non-unique joined prefixes"
    sql: |
      SELECT f.name AS group_name, r.ID AS rank_value
      FROM ua_fop_files AS f
      JOIN renderjob AS r ON r.result = f.ID
      UNION ALL
      SELECT name AS group_name, ID AS rank_value
      FROM ua_fop_files
      WHERE ID = 2
      ORDER BY group_name ASC, rank_value DESC
    expect:
      rows: 4
      data:
        - group_name: "image1.png"
          rank_value: 101
        - group_name: "image2.png"
          rank_value: 2
        - group_name: "image3.png"
          rank_value: 103
        - group_name: "image3.png"
          rank_value: 102

  # === scan_order_multi: cross-table merge, 3+ branches, computed sort ===

  - name: "UNION ALL ORDER BY across different tables"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT ID, CAST(result AS VARCHAR) AS name FROM renderjob WHERE ID <= 102
      ORDER BY ID
    expect:
      rows: 4
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 101
          name: "1"
        - ID: 102
          name: "3"

  - name: "UNION ALL ORDER BY three branches"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID = 3
      UNION ALL
      SELECT ID, name FROM ua_fop_files WHERE ID = 1
      UNION ALL
      SELECT ID, name FROM ua_fop_files WHERE ID = 5
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"
        - ID: 5
          name: "image5.png"

  - name: "UNION ALL ORDER BY with WHERE on both branches"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID BETWEEN 2 AND 4
      UNION ALL
      SELECT ID, CAST(result AS VARCHAR) AS name FROM renderjob WHERE result = 3
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "image3.png"
        - ID: 4
          name: "image4.png"
        - ID: 102
          name: "3"
        - ID: 103
          name: "3"

  - name: "UNION ALL ORDER BY second column"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID <= 3
      UNION ALL
      SELECT ID, name FROM ua_fop_files WHERE ID >= 4
      ORDER BY name
    expect:
      rows: 5
      data:
        - name: "image1.png"
        - name: "image2.png"
        - name: "image3.png"
        - name: "image4.png"
        - name: "image5.png"

  - name: "UNION ALL shared ASC relation puts NULL first"
    sql: |
      SELECT value FROM ua_order_a
      UNION ALL
      SELECT value FROM ua_order_b
      ORDER BY value ASC
    expect:
      data:
        - value: null
        - value: null
        - value: "alpha"
        - value: "beta"

  - name: "UNION ALL shared DESC relation puts NULL last"
    sql: |
      SELECT value FROM ua_order_a
      UNION ALL
      SELECT value FROM ua_order_b
      ORDER BY value DESC
    expect:
      data:
        - value: "beta"
        - value: "alpha"
        - value: null
        - value: null

  - name: "EXPLAIN UNION ALL ORDER BY uses scan_order_multi"
    sql: |
      EXPLAIN SELECT ID, name FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT ID, name FROM ua_fop_files WHERE ID >= 4
      ORDER BY ID
    expect:
      rows: 1
      result_contains:
        - "scan_order_multi"
        - "range"

  # === UNION ALL in subquery / derived table ===

  - name: "UNION ALL as derived table"
    sql: |
      SELECT COUNT(*) AS c FROM (
        SELECT ID FROM ua_fop_files
        UNION ALL
        SELECT ID FROM renderjob
      ) AS combined
    expect:
      rows: 1
      data:
        - c: 8

  - name: "EXPLAIN IR rewrites simple wrapper over UNION ALL"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT t.ID FROM (
        SELECT ID FROM ua_fop_files WHERE ID = 1
        UNION ALL
        SELECT ID FROM ua_fop_files WHERE ID = 2
      ) AS t
      WHERE t.ID >= 1
    expect:
      contains:
        - '"stage": "term", "kind": "root", "value": "union_all"'
        - '"kind": "branches", "value": 2'

      not_contains:
        - "inner_select"
        - "dependent-subquery"
  - name: "EXPLAIN IR top-level UNION ALL includes ordering metadata"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT ID FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT ID FROM ua_fop_files WHERE ID >= 4
      ORDER BY ID
      LIMIT 2
      OFFSET 1
    expect:
      contains:
        - '"stage": "term", "kind": "root", "value": "union_all"'
        - '"kind": "branches", "value": 2'
        - '"kind": "limit", "value": 2'
        - '"kind": "offset", "value": 1'

      not_contains:
        - "inner_select"
        - "dependent-subquery"
  - name: "UNION ALL with simple derived branch"
    sql: |
      SELECT ID FROM ua_fop_files WHERE ID = 1
      UNION ALL
      SELECT ID FROM (
        SELECT ID FROM ua_fop_files WHERE ID = 2
      ) AS picked
    expect:
      rows: 2
      data:
        - ID: 1
        - ID: 2

  - name: "EXISTS with UNION ALL subselect"
    sql: |
      SELECT ID, name FROM ua_fop_files f
      WHERE EXISTS (
        SELECT 1 FROM renderjob WHERE result = f.ID
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  # === UNION ALL branch shape / staged branch behavior ===

  - name: "UNION ALL keeps output aliases from first branch"
    sql: |
      SELECT ID AS file_id, name AS label FROM ua_fop_files WHERE ID = 1
      UNION ALL
      SELECT result AS ignored_id, CAST(result AS VARCHAR) AS ignored_label FROM renderjob WHERE ID = 102
      ORDER BY file_id
    expect:
      rows: 2
      data:
        - file_id: 1
          label: "image1.png"
        - file_id: 3
          label: "3"

  - name: "UNION ALL with inner ORDER BY/LIMIT per branch"
    sql: |
      SELECT ID FROM (
        SELECT ID FROM ua_fop_files ORDER BY ID DESC LIMIT 2
      ) AS branch_a
      UNION ALL
      SELECT ID FROM (
        SELECT result AS ID FROM renderjob ORDER BY result ASC LIMIT 1
      ) AS branch_b
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 1
        - ID: 4
        - ID: 5

  - name: "UNION ALL with grouped branch"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT result AS ID, CONCAT('r', CAST(COUNT(*) AS VARCHAR)) AS name
      FROM renderjob
      GROUP BY result
      HAVING result = 3
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "r2"

  - name: "EXPLAIN UNION ALL with grouped branch streams stage output"
    sql: |
      EXPLAIN SELECT ID, name FROM ua_fop_files WHERE ID <= 2
      UNION ALL
      SELECT result AS ID, CONCAT('r', CAST(COUNT(*) AS VARCHAR)) AS name
      FROM renderjob
      GROUP BY result
      HAVING result = 3
      ORDER BY ID
    expect:
      rows: 1
      data_contains:
        - code: "scan_order_multi"
      not_contains:
        - "__union_rows"

  - name: "UNION ALL with derived branch filtering"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID = 5
      UNION ALL
      SELECT ID, name FROM (
        SELECT ID, name FROM ua_fop_files WHERE ID <= 2 ORDER BY ID DESC LIMIT 1
      ) AS picked
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 2
          name: "image2.png"
        - ID: 5
          name: "image5.png"

  - name: "UNION ALL with NULL payload in one branch"
    sql: |
      SELECT ID, name FROM ua_fop_files WHERE ID = 1
      UNION ALL
      SELECT result AS ID, NULL AS name FROM renderjob WHERE ID = 102
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: null

  # === Must-fail cases ===

  - name: "UNION ALL column count mismatch"
    sql: |
      SELECT ID FROM ua_fop_files
      UNION ALL
      SELECT ID, name FROM ua_fop_files
    expect:
      error: true

  - name: "UNION without ALL compatibility"
    sql: |
      SELECT ID FROM ua_fop_files WHERE ID <= 2
      UNION
      SELECT ID FROM ua_fop_files WHERE ID >= 4
    expect:
      rows: 4
      data:
        - ID: 1
        - ID: 2
        - ID: 4
        - ID: 5

  - name: "UNION without ALL deduplicates literal rows"
    sql: "SELECT 1 AS x UNION SELECT 1 AS x"
    expect:
      rows: 1
      data:
        - x: 1

  - name: "UNION without ALL deduplicates overlapping table rows"
    sql: |
      SELECT result AS ID FROM renderjob WHERE ID <= 102
      UNION
      SELECT result AS ID FROM renderjob WHERE ID >= 102
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
        - ID: 3

  - name: "UNION without ALL deduplicates complete multi-column rows"
    sql: |
      SELECT result AS ID, CAST(result AS VARCHAR) AS label FROM renderjob WHERE ID <= 102
      UNION
      SELECT result AS ID, CAST(result AS VARCHAR) AS label FROM renderjob WHERE ID >= 102
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          label: "1"
        - ID: 3
          label: "3"

  - name: "UNION without ALL keeps rows distinct when any output column differs"
    sql: |
      SELECT result AS ID, CAST(ID AS VARCHAR) AS label FROM renderjob WHERE ID = 102
      UNION
      SELECT result AS ID, CAST(ID AS VARCHAR) AS label FROM renderjob WHERE ID = 103
      ORDER BY label
    expect:
      rows: 2
      data:
        - ID: 3
          label: "102"
        - ID: 3
          label: "103"

  - name: "UNION without ALL deduplicates NULL rows"
    sql: |
      SELECT NULL AS v
      UNION
      SELECT NULL AS v
    expect:
      rows: 1
      data:
        - v: null

  - name: "UNION without ALL keeps first-branch aliases"
    sql: |
      SELECT ID AS file_id FROM ua_fop_files WHERE ID = 1
      UNION
      SELECT result AS ignored_alias FROM renderjob WHERE ID = 101
    expect:
      rows: 1
      data:
        - file_id: 1

  - name: "Derived UNION value relations support correlated scalar aggregates"
    sql: |
      SELECT
        history.idx AS history_idx,
        params.idx AS param_idx,
        COALESCE((
          SELECT COUNT(*)
          FROM ua_event event
          WHERE event.occurred_at BETWEEN history.start_at AND history.end_at
        ), 0) AS event_count
      FROM (
        SELECT 0 AS idx, 0 AS start_at, 10 AS end_at
        UNION
        SELECT 1, 11, 20
      ) AS history
      CROSS JOIN (
        SELECT 0 AS idx
        UNION
        SELECT 1
      ) AS params
      ORDER BY history_idx, param_idx
    timeout: 2
    expect:
      rows: 4
      data:
        - history_idx: 0
          param_idx: 0
          event_count: 1
        - history_idx: 0
          param_idx: 1
          event_count: 1
        - history_idx: 1
          param_idx: 0
          event_count: 1
        - history_idx: 1
          param_idx: 1
          event_count: 1

  - name: "EXPLAIN IR top-level UNION without ALL keeps distinct semantics"
    steps:
      - sql: |
          EXPLAIN IR
          SELECT result AS ID FROM renderjob WHERE ID <= 102
          UNION
          SELECT result AS ID FROM renderjob WHERE ID >= 102
        expect:
          contains:
            - "union_distinct"
            - "branches"

  - name: "UNION without ALL column count mismatch"
    sql: |
      SELECT ID FROM ua_fop_files
      UNION
      SELECT ID, name FROM ua_fop_files
    expect:
      error: true

  - name: "Ordered joined producers keep lexicographic product order"
    sql: |
      SELECT r.ID AS job, a.value AS value FROM renderjob r CROSS JOIN ua_order_a a
      UNION ALL SELECT 0 AS job, 'sentinel' AS value
      ORDER BY job ASC, value ASC
    expect:
      rows: 7
      data:
        - {job: 0, value: sentinel}
        - {job: 101, value: null}
        - {job: 101, value: beta}
        - {job: 102, value: null}
        - {job: 102, value: beta}
        - {job: 103, value: null}
        - {job: 103, value: beta}
