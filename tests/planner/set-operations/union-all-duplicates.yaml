metadata:
  version: "1.0"
  description: "UNION ALL must preserve duplicate rows"

test_cases:
  - name: "UNION ALL with identical literal rows"
    sql: "SELECT 1 AS x UNION ALL SELECT 1 AS x"
    expect:
      rows: 2
      data:
        - x: 1
        - x: 1

  - name: "UNION ALL with three identical rows"
    sql: "SELECT 1 AS x UNION ALL SELECT 1 AS x UNION ALL SELECT 1 AS x"
    expect:
      rows: 3
      data:
        - x: 1
        - x: 1
        - x: 1

  - name: "UNION ALL mixed duplicates and unique"
    sql: "SELECT 1 AS x UNION ALL SELECT 2 AS x UNION ALL SELECT 1 AS x"
    expect:
      rows: 3
      data:
        - x: 1
        - x: 2
        - x: 1

  - name: "Create test table for UNION ALL"
    sql: "CREATE TABLE union_dup_test (id INT PRIMARY KEY, val VARCHAR(20))"

  - name: "Insert duplicate values"
    sql: "INSERT INTO union_dup_test (id, val) VALUES (1, 'aaa'), (2, 'aaa'), (3, 'bbb')"

  - name: "UNION ALL from table with duplicate values"
    sql: "SELECT val FROM union_dup_test WHERE val = 'aaa' UNION ALL SELECT val FROM union_dup_test WHERE val = 'aaa'"
    expect:
      rows: 4
      data:
        - val: "aaa"
        - val: "aaa"
        - val: "aaa"
        - val: "aaa"

  - name: "SELECT without UNION returns consecutive duplicates"
    sql: "SELECT val FROM union_dup_test ORDER BY val"
    expect:
      rows: 3
      data:
        - val: "aaa"
        - val: "aaa"
        - val: "bbb"

  - name: "Cleanup"
    sql: "DROP TABLE union_dup_test"

  - name: Native UNION insertion completion includes all branches
    setup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
    - sql: CREATE TABLE union_completion_counts(v INT)
    sql: INSERT INTO union_completion_counts(v) SELECT 1 AS v UNION ALL SELECT 2 AS v
    expect:
      affected_rows: 2
    cleanup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
  - name: Native UNION insertion completion includes empty first branch
    setup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
    - sql: CREATE TABLE union_completion_counts(v INT)
    sql: INSERT INTO union_completion_counts(v) SELECT 1 AS v WHERE 1=0 UNION ALL SELECT 2 AS v
    expect:
      affected_rows: 1
    cleanup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
  - name: Native UNION insertion completion includes empty final branch
    setup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
    - sql: CREATE TABLE union_completion_counts(v INT)
    sql: INSERT INTO union_completion_counts(v) SELECT 1 AS v UNION ALL SELECT 2 AS v WHERE 1=0
    expect:
      affected_rows: 1
    cleanup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
  - name: Native UNION insertion rejects unequal branch widths
    setup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
    - sql: CREATE TABLE union_completion_counts(v INT)
    sql: INSERT INTO union_completion_counts(v) SELECT 1 AS v UNION ALL SELECT 2 AS v,3 AS extra
    expect:
      error: true
    cleanup:
    - sql: DROP TABLE IF EXISTS union_completion_counts
