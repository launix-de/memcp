- name: An ordered consumer filters after numbering without changing its input
  sql: SELECT q.id,q.p,q.score,q.rn FROM (SELECT id,p,score,sort_key,ROW_NUMBER() OVER(PARTITION BY p
    ORDER BY sort_key DESC,id) AS rn FROM win_domain_input WHERE active=1) q WHERE q.id>=2 ORDER BY q.p,q.sort_key
    DESC,q.id
  expect:
    rows: 4
    data:
    - id: 4
      p: null
      score: 15
      rn: 1
    - id: 2
      p: 10
      score: 20
      rn: 2
    - id: 6
      p: 10
      score: null
      rn: 3
    - id: 5
      p: 20
      score: 10
      rn: 1
- name: A predicate-column update changes window membership
  sql: UPDATE win_domain_input SET active=1 WHERE id=3
  expect:
    affected_rows: 1
- name: A newly accepted row affects the cached ranking
  sql: SELECT id,p,score,ROW_NUMBER() OVER(PARTITION BY p ORDER BY sort_key DESC,id) AS rn FROM win_domain_input
    WHERE active=1 ORDER BY id
  expect:
    rows: 6
    data:
    - id: 1
      p: 10
      score: 30
      rn: 1
    - id: 2
      p: 10
      score: 20
      rn: 2
    - id: 3
      p: 20
      score: 40
      rn: 1
    - id: 4
      p: null
      score: 15
      rn: 1
    - id: 5
      p: 20
      score: 10
      rn: 2
    - id: 6
      p: 10
      score: null
      rn: 3
- name: Restore the original window membership
  sql: UPDATE win_domain_input SET active=0 WHERE id=3
  expect:
    affected_rows: 1
- name: A removed member no longer contributes to the cached ranking
  sql: SELECT id,p,score,ROW_NUMBER() OVER(PARTITION BY p ORDER BY sort_key DESC,id) AS rn FROM win_domain_input
    WHERE active=1 ORDER BY id
  expect:
    rows: 5
    data:
    - id: 1
      p: 10
      score: 30
      rn: 1
    - id: 2
      p: 10
      score: 20
      rn: 2
    - id: 4
      p: null
      score: 15
      rn: 1
    - id: 5
      p: 20
      score: 10
      rn: 1
    - id: 6
      p: 10
      score: null
      rn: 3
- name: Restart after computing the filtered ranking
  action: restart
- name: Reloaded window recipes preserve the original input domain
  sql: SELECT id,p,score,ROW_NUMBER() OVER(PARTITION BY p ORDER BY sort_key DESC,id) AS rn FROM win_domain_input
    WHERE active=1 ORDER BY id
  expect:
    rows: 5
    data:
    - id: 1
      p: 10
      score: 30
      rn: 1
    - id: 2
      p: 10
      score: 20
      rn: 2
    - id: 4
      p: null
      score: 15
      rn: 1
    - id: 5
      p: 20
      score: 10
      rn: 1
    - id: 6
      p: 10
      score: null
      rn: 3
- name: NULL and zero remain separate ordered partitions
  sql: SELECT id,p,ROW_NUMBER() OVER(PARTITION BY p ORDER BY id) AS rn FROM win_partition_nulls ORDER
    BY p,id
  expect:
    rows: 6
    data:
    - &id006
      id: 1
      p: null
      rn: 1
    - &id005
      id: 2
      p: null
      rn: 2
    - &id004
      id: 3
      p: 0
      rn: 1
    - &id003
      id: 4
      p: 0
      rn: 2
    - &id002
      id: 5
      p: 10
      rn: 1
    - &id001
      id: 6
      p: 10
      rn: 2
- name: NULL and zero remain separate ordered partitions with an independent output order
  sql: SELECT id,p,ROW_NUMBER() OVER(PARTITION BY p ORDER BY id) AS rn FROM win_partition_nulls ORDER
    BY id DESC
  expect:
    rows: 6
    data:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
- name: Partition equivalence uses declared text collation
  sql: SELECT id,p,ROW_NUMBER() OVER(PARTITION BY p ORDER BY id) AS rn FROM win_partition_text ORDER BY
    p,id
  expect:
    rows: 4
    data:
    - &id010
      id: 1
      p: ab
      rn: 1
    - &id009
      id: 2
      p: AB
      rn: 2
    - &id008
      id: 3
      p: xy
      rn: 1
    - &id007
      id: 4
      p: XY
      rn: 2
- name: Partition equivalence uses declared text collation with an independent output order
  sql: SELECT id,p,ROW_NUMBER() OVER(PARTITION BY p ORDER BY id) AS rn FROM win_partition_text ORDER BY
    id DESC
  expect:
    rows: 4
    data:
    - *id007
    - *id008
    - *id009
    - *id010
- name: 'win_partition_nulls: LAG retains distinct SQL partition classes'
  sql: SELECT id,LAG(id) OVER(PARTITION BY p ORDER BY id) AS previous FROM win_partition_nulls ORDER BY
    p,id
  expect:
    rows: 6
    data:
    - &id016
      id: 1
      previous: null
    - &id015
      id: 2
      previous: 1
    - &id014
      id: 3
      previous: null
    - &id013
