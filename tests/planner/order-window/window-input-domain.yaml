- name: Composite partitions retain NULL and declared text equivalence in an independent order
  sql: SELECT id,p,q,ROW_NUMBER() OVER(PARTITION BY p,q ORDER BY id) AS rn FROM win_partition_composite
    ORDER BY id DESC
  expect:
    rows: 6
    data:
    - id: 6
      p: 0
      q: A
      rn: 4
    - id: 5
      p: 0
      q: a
      rn: 3
    - id: 4
      p: 0
      q: A
      rn: 2
    - id: 3
      p: 0
      q: a
      rn: 1
    - id: 2
      p: null
      q: A
      rn: 2
    - id: 1
      p: null
      q: a
      rn: 1
- name: Composite LAG partitions reset only at a declared partition boundary
  sql: SELECT id,LAG(id) OVER(PARTITION BY p,q ORDER BY id) AS previous FROM win_partition_composite ORDER
    BY id DESC
  expect:
    rows: 6
    data:
    - id: 6
      previous: 5
    - id: 5
      previous: 4
    - id: 4
      previous: 3
    - id: 3
      previous: null
    - id: 2
      previous: 1
    - id: 1
      previous: null
- name: Rank ties preserve NULL keys and declared text order equivalence
  sql: SELECT id,v,RANK() OVER(PARTITION BY p,q ORDER BY v) AS r,DENSE_RANK() OVER(PARTITION BY p,q ORDER
    BY v) AS d FROM win_partition_composite ORDER BY id DESC
  expect:
    rows: 6
    data:
    - id: 6
      v: XY
      r: 3
      d: 2
    - id: 5
      v: xy
      r: 3
      d: 2
    - id: 4
      v: AB
      r: 1
      d: 1
    - id: 3
      v: ab
      r: 1
      d: 1
    - id: 2
      v: null
      r: 1
      d: 1
    - id: 1
      v: null
      r: 1
      d: 1
- name: Warm NULL and collated predecessor partitions
  sql: SELECT id,LAG(payload) OVER(PARTITION BY p ORDER BY stamp,id) AS previous FROM win_cache_partitions
    ORDER BY id DESC
  expect:
    rows: 4
    data:
    - id: 4
      previous: 30
    - id: 3
      previous: null
    - id: 2
      previous: 10
    - id: 1
      previous: null
- name: Change predecessor inputs without changing order keys
  sql: UPDATE win_cache_partitions SET payload=payload+1 WHERE id IN(1,3)
  expect:
    affected_rows: 2
- name: Native invalidation reaches NULL and collated partition followers
  sql: SELECT id,LAG(payload) OVER(PARTITION BY p ORDER BY stamp,id) AS previous FROM win_cache_partitions
    ORDER BY id DESC
  expect:
    rows: 4
    data:
    - id: 4
      previous: 31
