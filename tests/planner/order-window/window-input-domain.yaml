# Shared dialect cases use a non-NULL sort key so this suite does not impose
# one frontend's default NULL ordering on the other frontends.
metadata:
  version: '1.0'
  isolated: true
  description: Window input domains preserve WHERE placement, NULL membership and native invalidation
    across SQL dialects
setup:
- sql: DROP TABLE IF EXISTS win_domain_input
- sql: CREATE TABLE win_domain_input(id INT PRIMARY KEY,p INT,score INT,active INT,status INT,sort_key
    INT NOT NULL)
- sql: INSERT INTO win_domain_input VALUES(1,10,30,1,1,30),(2,10,20,1,2,20),(3,20,40,0,NULL,40),(4,NULL,15,1,1,15),(5,20,10,1,2,10),(6,10,NULL,1,1,-1),(7,20,50,NULL,1,50)
- sql: DROP TABLE IF EXISTS win_partition_nulls
- sql: DROP TABLE IF EXISTS win_partition_text
- sql: CREATE TABLE win_partition_nulls(id INT PRIMARY KEY,p INT)
- sql: INSERT INTO win_partition_nulls VALUES(1,NULL),(2,NULL),(3,0),(4,0),(5,10),(6,10)
- sql: CREATE TABLE win_partition_text(id INT PRIMARY KEY,p VARCHAR(10) COLLATE utf8mb4_general_ci)
- sql: INSERT INTO win_partition_text VALUES(1,'ab'),(2,'AB'),(3,'xy'),(4,'XY')
- sql: DROP TABLE IF EXISTS win_partition_composite
- sql: CREATE TABLE win_partition_composite(id INT PRIMARY KEY,p INT,q VARCHAR(10) COLLATE utf8mb4_general_ci,v
    VARCHAR(10) COLLATE utf8mb4_general_ci)
- sql: INSERT INTO win_partition_composite VALUES(1,NULL,'a',NULL),(2,NULL,'A',NULL),(3,0,'a','ab'),(4,0,'A','AB'),(5,0,'a','xy'),(6,0,'A','XY')
- sql: DROP TABLE IF EXISTS win_cache_partitions
- sql: CREATE TABLE win_cache_partitions(id INT PRIMARY KEY,p VARCHAR(10) COLLATE utf8mb4_general_ci,stamp
    INT NOT NULL,payload INT)
- sql: INSERT INTO win_cache_partitions VALUES(1,NULL,1,10),(2,NULL,2,20),(3,'ab',3,30),(4,'AB',4,40)
test_cases:
- name: 'mysql: Filtered ranking is independent of the final output order'
  sql: SELECT id,p,score,ROW_NUMBER() OVER(PARTITION BY p ORDER BY sort_key DESC,id) AS rn FROM win_domain_input
    WHERE active=1 ORDER BY id
  expect:
    rows: 5
    data:
    - id: 1
      p: 10
      score: 30
      rn: 1
    - id: 2
      p: 10
      score: 20
      rn: 2
    - id: 4
      p: null
      score: 15
      rn: 1
    - id: 5
      p: 20
      score: 10
      rn: 1
    - id: 6
      p: 10
      score: null
      rn: 3
  syntax: mysql
- name: 'mysql: Outer base predicate does not change the ranking input'
  sql: SELECT q.id,q.p,q.score,q.rn FROM (SELECT id,p,score,ROW_NUMBER() OVER(PARTITION BY p ORDER BY
    sort_key DESC,id) AS rn FROM win_domain_input WHERE active=1) q WHERE q.id>=2 ORDER BY q.id
  expect:
    rows: 4
    data:
    - id: 2
      p: 10
      score: 20
      rn: 2
    - id: 4
      p: null
      score: 15
      rn: 1
    - id: 5
      p: 20
      score: 10
      rn: 1
    - id: 6
      p: 10
      score: null
      rn: 3
  syntax: mysql
- name: 'mysql: Outer rank predicate reads the original filtered partitions'
  sql: SELECT q.id,q.p,q.score,q.rn FROM (SELECT id,p,score,ROW_NUMBER() OVER(PARTITION BY p ORDER BY
    sort_key DESC,id) AS rn FROM win_domain_input WHERE active=1) q WHERE q.rn=1 ORDER BY q.id
  expect:
    rows: 3
    data:
    - id: 1
      p: 10
      score: 30
      rn: 1
    - id: 4
      p: null
      score: 15
      rn: 1
    - id: 5
      p: 20
      score: 10
      rn: 1
  syntax: mysql
- name: 'mysql: Counting filtered partition leaders retains the input boundary'
  sql: SELECT COUNT(*) AS leaders FROM (SELECT id,p,score,ROW_NUMBER() OVER(PARTITION BY p ORDER BY sort_key
    DESC,id) AS rn FROM win_domain_input WHERE active=1) q WHERE q.rn=1
  expect:
    rows: 1
    data:
    - leaders: 3
  syntax: mysql
- name: 'mysql: Offset windows use their filtered input despite another output order'
  sql: SELECT q.id,q.previous,q.following FROM (SELECT id,p,score,LAG(score) OVER(PARTITION BY p ORDER
    BY sort_key DESC,id) AS previous,LEAD(score) OVER(PARTITION BY p ORDER BY sort_key DESC,id) AS following
    FROM win_domain_input WHERE active=1) q ORDER BY q.id
  expect:
    rows: 5
    data:
    - id: 1
      previous: null
      following: 20
    - id: 2
      previous: 30
      following: null
    - id: 4
      previous: null
      following: null
    - id: 5
      previous: null
      following: null
    - id: 6
      previous: 20
      following: null
  syntax: mysql
- name: 'mysql: Outer base predicate preserves offset predecessors'
  sql: SELECT q.id,q.previous,q.following FROM (SELECT id,p,score,LAG(score) OVER(PARTITION BY p ORDER
    BY sort_key DESC,id) AS previous,LEAD(score) OVER(PARTITION BY p ORDER BY sort_key DESC,id) AS following
    FROM win_domain_input WHERE active=1) q WHERE q.id>=2 ORDER BY q.id
  expect:
    rows: 4
    data:
    - id: 2
      previous: 30
      following: null
    - id: 4
      previous: null
      following: null
    - id: 5
      previous: null
      following: null
    - id: 6
      previous: 20
      following: null
  syntax: mysql
- name: 'mysql: Rank and dense rank use the same pre-window filter'
  sql: SELECT q.id,q.rnk,q.dense FROM (SELECT id,p,score,RANK() OVER(PARTITION BY p ORDER BY sort_key
    DESC) AS rnk,DENSE_RANK() OVER(PARTITION BY p ORDER BY sort_key DESC) AS dense FROM win_domain_input
    WHERE active=1) q ORDER BY q.id
  expect:
    rows: 5
    data:
    - id: 1
      rnk: 1
      dense: 1
    - id: 2
      rnk: 2
      dense: 2
    - id: 4
      rnk: 1
      dense: 1
    - id: 5
      rnk: 1
      dense: 1
    - id: 6
      rnk: 3
      dense: 3
  syntax: mysql
