metadata:
  version: '1.0'
  description: ORDER BY with COLLATE comparators
setup:
  - sql: DROP TABLE IF EXISTS coll_t
  - sql: "CREATE TABLE coll_t (\n  id INT,\n  name VARCHAR(50)\n)\n"
  - sql: INSERT INTO coll_t (id, name) VALUES (1, 'a'), (2, 'B'), (3, 'aa'), (4, 'Ä')
  - sql: DROP TABLE IF EXISTS coll_link
  - sql: DROP TABLE IF EXISTS coll_names
  - sql: CREATE TABLE coll_names (id INT PRIMARY KEY, name VARCHAR(50)) DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_520_ci
  - sql: CREATE TABLE coll_link (id INT PRIMARY KEY, name_id INT)
  - sql: INSERT INTO coll_names VALUES (1, 'apple'), (2, 'Banana'), (3, 'cherry')
  - sql: INSERT INTO coll_link VALUES (1, 1), (2, 1), (3, 2), (4, 3)
  - sql: DROP TABLE IF EXISTS coll_third
  - sql: CREATE TABLE coll_third (id INT PRIMARY KEY, link_id INT)
  - sql: INSERT INTO coll_third VALUES (1,1),(2,2),(3,3),(4,4)
test_cases:
  - name: Three-table distinct retains name collation ASC
    sql: SELECT DISTINCT n.id AS name_id, l.id AS link_id FROM coll_names n JOIN coll_link l ON n.id=l.name_id JOIN coll_third z ON z.link_id=l.id ORDER
      BY n.name ASC, l.id ASC
    expect:
      rows: 4
      data:
        - name_id: 1
          link_id: 1
        - name_id: 1
          link_id: 2
        - name_id: 2
          link_id: 3
        - name_id: 3
          link_id: 4
  - name: Three-table distinct retains name collation DESC
    sql: SELECT DISTINCT n.id AS name_id, l.id AS link_id FROM coll_names n JOIN coll_link l ON n.id=l.name_id JOIN coll_third z ON z.link_id=l.id ORDER
      BY n.name DESC, l.id ASC
    expect:
      rows: 4
      data:
        - name_id: 3
          link_id: 4
        - name_id: 2
          link_id: 3
        - name_id: 1
          link_id: 1
        - name_id: 1
          link_id: 2
  - name: Three-table distinct retains name collation COLLATE bin ASC
    sql: SELECT DISTINCT n.id AS name_id, l.id AS link_id FROM coll_names n JOIN coll_link l ON n.id=l.name_id JOIN coll_third z ON z.link_id=l.id ORDER
      BY n.name COLLATE bin ASC, l.id ASC
    expect:
      rows: 4
      data:
        - name_id: 2
          link_id: 3
        - name_id: 1
          link_id: 1
        - name_id: 1
          link_id: 2
        - name_id: 3
          link_id: 4
  - name: Three-table distinct retains name collation COLLATE bin DESC
    sql: SELECT DISTINCT n.id AS name_id, l.id AS link_id FROM coll_names n JOIN coll_link l ON n.id=l.name_id JOIN coll_third z ON z.link_id=l.id ORDER
      BY n.name COLLATE bin DESC, l.id ASC
    expect:
      rows: 4
      data:
        - name_id: 3
          link_id: 4
        - name_id: 1
          link_id: 1
        - name_id: 1
          link_id: 2
        - name_id: 2
          link_id: 3
  - name: ORDER BY binary default (uppercase before lowercase)
    sql: SELECT name FROM coll_t ORDER BY name LIMIT 4
    expect:
      rows: 4
      data:
        - name: B
        - name: a
        - name: aa
        - name: Ä
  - name: ORDER BY COLLATE general_ci (case-insensitive, a before B)
    sql: SELECT name FROM coll_t ORDER BY name COLLATE utf8mb4_general_ci LIMIT 2
    expect:
      rows: 2
      data:
        - name: a
        - name: B
  - name: ORDER BY COLLATE general_ci DESC (reverse order)
    sql: SELECT name FROM coll_t ORDER BY name COLLATE utf8mb4_general_ci DESC LIMIT 2
    expect:
      rows: 2
      data:
        - name: B
        - name: a
  - name: ORDER BY explicit COLLATE bin DESC
    sql: SELECT name FROM coll_t ORDER BY name COLLATE bin DESC LIMIT 2
    expect:
      rows: 2
      data:
        - name: Ä
        - name: aa
  - name: Text group key collation ASC
    sql: SELECT name FROM coll_names GROUP BY name ORDER BY name ASC
    expect:
      rows: 3
      data:
        - name: apple
        - name: Banana
        - name: cherry
  - name: Text group key collation DESC
    sql: SELECT name FROM coll_names GROUP BY name ORDER BY name DESC
    expect:
      rows: 3
      data:
        - name: cherry
        - name: Banana
        - name: apple
  - name: Text group key collation COLLATE bin ASC
    sql: SELECT name FROM coll_names GROUP BY name ORDER BY name COLLATE bin ASC
    expect:
      rows: 3
      data:
        - name: Banana
        - name: apple
        - name: cherry
  - name: Text group key collation COLLATE bin DESC
    sql: SELECT name FROM coll_names GROUP BY name ORDER BY name COLLATE bin DESC
    expect:
      rows: 3
      data:
        - name: cherry
        - name: apple
        - name: Banana
  - name: Reject missing explicit sort column in grouped join
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.missing_name COLLATE bin
    expect:
      error: true
  - name: DISTINCT n.id ASC pass 0
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name ASC
    expect:
      rows: 3
      data:
        - id: 1
        - id: 2
        - id: 3
  - name: DISTINCT n.id ASC pass 1
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name ASC
    expect:
      rows: 3
      data:
        - id: 1
        - id: 2
        - id: 3
  - name: DISTINCT n.id DESC pass 0
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name DESC
    expect:
      rows: 3
      data:
        - id: 3
        - id: 2
        - id: 1
  - name: DISTINCT n.id DESC pass 1
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name DESC
    expect:
      rows: 3
      data:
        - id: 3
        - id: 2
        - id: 1
  - name: DISTINCT n.id COLLATE bin ASC pass 0
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name COLLATE bin ASC
    expect:
      rows: 3
      data:
        - id: 2
        - id: 1
        - id: 3
  - name: DISTINCT n.id COLLATE bin ASC pass 1
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name COLLATE bin ASC
    expect:
      rows: 3
      data:
        - id: 2
        - id: 1
        - id: 3
  - name: DISTINCT n.id COLLATE bin DESC pass 0
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name COLLATE bin DESC
    expect:
      rows: 3
      data:
        - id: 3
        - id: 1
        - id: 2
  - name: DISTINCT n.id COLLATE bin DESC pass 1
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name COLLATE bin DESC
    expect:
      rows: 3
      data:
        - id: 3
        - id: 1
        - id: 2
  - name: n.id, COUNT(*) AS c ASC pass 0
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name ASC
    expect:
      rows: 3
      data:
        - id: 1
          c: 2
        - id: 2
          c: 1
        - id: 3
          c: 1
  - name: n.id, COUNT(*) AS c ASC pass 1
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name ASC
    expect:
      rows: 3
      data:
        - id: 1
          c: 2
        - id: 2
          c: 1
        - id: 3
          c: 1
  - name: n.id, COUNT(*) AS c DESC pass 0
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name DESC
    expect:
      rows: 3
      data:
        - id: 3
          c: 1
        - id: 2
          c: 1
        - id: 1
          c: 2
  - name: n.id, COUNT(*) AS c DESC pass 1
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name DESC
    expect:
      rows: 3
      data:
        - id: 3
          c: 1
        - id: 2
          c: 1
        - id: 1
          c: 2
  - name: n.id, COUNT(*) AS c COLLATE bin ASC pass 0
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name COLLATE bin ASC
    expect:
      rows: 3
      data:
        - id: 2
          c: 1
        - id: 1
          c: 2
        - id: 3
          c: 1
  - name: n.id, COUNT(*) AS c COLLATE bin ASC pass 1
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name COLLATE bin ASC
    expect:
      rows: 3
      data:
        - id: 2
          c: 1
        - id: 1
          c: 2
        - id: 3
          c: 1
  - name: n.id, COUNT(*) AS c COLLATE bin DESC pass 0
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name COLLATE bin DESC
    expect:
      rows: 3
      data:
        - id: 3
          c: 1
        - id: 1
          c: 2
        - id: 2
          c: 1
  - name: n.id, COUNT(*) AS c COLLATE bin DESC pass 1
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name COLLATE bin DESC
    expect:
      rows: 3
      data:
        - id: 3
          c: 1
        - id: 1
          c: 2
        - id: 2
          c: 1
  - name: Update cached sort source
    sql: UPDATE coll_names SET name = 'Zebra' WHERE id = 1
    expect:
      affected_rows: 1
  - name: Distinct order follows source update
    sql: SELECT DISTINCT n.id FROM coll_names n JOIN coll_link l ON n.id = l.name_id ORDER BY n.name
    expect:
      rows: 3
      data:
        - id: 2
        - id: 3
        - id: 1
  - name: Group order follows source update
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id = l.name_id GROUP BY n.id ORDER BY n.name DESC
    expect:
      rows: 3
      data:
        - id: 1
          c: 2
        - id: 3
          c: 1
        - id: 2
          c: 1
  - name: Three-table distinct cache follows source update
    sql: SELECT DISTINCT n.id AS name_id, l.id AS link_id FROM coll_names n JOIN coll_link l ON n.id=l.name_id JOIN coll_third z ON z.link_id=l.id ORDER BY n.name, l.id
    expect:
      rows: 4
      data:
        - {name_id: 2, link_id: 3}
        - {name_id: 3, link_id: 4}
        - {name_id: 1, link_id: 1}
        - {name_id: 1, link_id: 2}
  - name: Three-table grouped cache follows source update
    sql: SELECT n.id, COUNT(*) AS c FROM coll_names n JOIN coll_link l ON n.id=l.name_id JOIN coll_third z ON z.link_id=l.id GROUP BY n.id ORDER BY n.name DESC
    expect:
      rows: 3
      data:
        - {id: 1, c: 2}
        - {id: 3, c: 1}
        - {id: 2, c: 1}
cleanup:
  - sql: DROP TABLE IF EXISTS coll_third
  - sql: DROP TABLE IF EXISTS coll_t
  - sql: DROP TABLE IF EXISTS coll_link
  - sql: DROP TABLE IF EXISTS coll_names
