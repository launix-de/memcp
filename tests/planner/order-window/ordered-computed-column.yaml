# Tests for ORC (ordered-reduce computed) columns.
# Phase 1: full recompute only (Mode A — InvalidateAll on any mutation).
#
# ORC columns are created via createcolumn with sortcols/sortdirs/mapcols/mapreducefn/reduceinit
# in the options assoc list. The proxy is compressed after the initial scan_order pass.
# After INSERT/UPDATE/DELETE the proxy is invalidated; the next read triggers a full recompute.

metadata:
  version: "1.0"
  description: "ORC Phase 1: ROW_NUMBER, running SUM, post-mutation lazy recompute"

test_cases:

  # ── Setup ──────────────────────────────────────────────────────────────────

  - name: "Drop leftover rank table"
    sql: "DROP TABLE IF EXISTS orc_rank"

  - name: "Drop leftover sales table"
    sql: "DROP TABLE IF EXISTS orc_sales"

  # ── Test 1: ROW_NUMBER via ORC ─────────────────────────────────────────────

  - name: "Create rank table"
    sql: |
      CREATE TABLE orc_rank (
        id    INT PRIMARY KEY,
        score INT,
        rank  INT
      )

  - name: "Insert rank data"
    sql: |
      INSERT INTO orc_rank (id, score) VALUES
        (1, 50),
        (2, 100),
        (3, 75),
        (4, 25)

  - name: "Materialize rank column via createcolumn ORC"
    scm: |
      (createcolumn (table "memcp-tests" false "orc_rank" false nil) "rank" "INT" '()
        (list
          "sortcols"  '("score")
          "sortdirs"  (list false)
          "partitioncount" 0
          "mapcols"   '()
          "mapreducefn" (lambda (acc $set)
                          (begin
                            ($set (+ acc 1))
                            (+ acc 1)))
          "reduceinit" 0))

  - name: "rank values ordered by score ASC"
    sql: "SELECT id, rank FROM orc_rank ORDER BY score ASC"
    expect:
      rows: 4
      data:
        - id: 4
          rank: 1
        - id: 1
          rank: 2
        - id: 3
          rank: 3
        - id: 2
          rank: 4

  - name: "rank readable via WHERE filter"
    sql: "SELECT id FROM orc_rank WHERE rank = 1"
    expect:
      rows: 1
      data:
        - id: 4

  # ── Test 2: Running SUM via ORC ────────────────────────────────────────────

  - name: "Create sales table"
    sql: |
      CREATE TABLE orc_sales (
        id            INT PRIMARY KEY,
        day           INT,
        amount        INT,
        running_total INT
      )

  - name: "Insert sales data"
    sql: |
      INSERT INTO orc_sales (id, day, amount) VALUES
        (1, 1, 10),
        (2, 2, 30),
        (3, 3, 20)

  - name: "Materialize running_total column via createcolumn ORC"
    scm: |
      (createcolumn (table "memcp-tests" false "orc_sales" false nil) "running_total" "INT" '()
        (list
          "sortcols"  '("day")
          "sortdirs"  (list false)
          "partitioncount" 0
          "mapcols"   '("amount")
          "mapreducefn" (lambda (acc $set amount)
                          (begin
                            ($set (+ acc amount))
                            (+ acc amount)))
          "reduceinit" 0))

  - name: "running_total values ordered by day"
    sql: "SELECT day, running_total FROM orc_sales ORDER BY day ASC"
    expect:
      rows: 3
      data:
        - day: 1
          running_total: 10
        - day: 2
          running_total: 40
        - day: 3
          running_total: 60

  # ── Test 3: Post-INSERT lazy recompute (non-additive: rank) ────────────────

  - name: "Insert new row into rank table"
    sql: "INSERT INTO orc_rank (id, score) VALUES (5, 60)"

  - name: "rank recomputed after INSERT"
    sql: "SELECT id, rank FROM orc_rank ORDER BY score ASC"
    expect:
      rows: 5
      data:
        - id: 4
          rank: 1
        - id: 1
          rank: 2
        - id: 5
          rank: 3
        - id: 3
          rank: 4
        - id: 2
          rank: 5

  # ── Test 4: Post-DELETE lazy recompute ─────────────────────────────────────

  - name: "Delete row from rank table"
    sql: "DELETE FROM orc_rank WHERE id = 3"

  - name: "rank recomputed after DELETE"
    sql: "SELECT id, rank FROM orc_rank ORDER BY score ASC"
    expect:
      rows: 4
      data:
        - id: 4
          rank: 1
        - id: 1
          rank: 2
        - id: 5
          rank: 3
        - id: 2
          rank: 4

  # ── Test 5: Post-UPDATE lazy recompute ─────────────────────────────────────

  - name: "Update score in rank table"
    sql: "UPDATE orc_rank SET score = 200 WHERE id = 4"

  - name: "rank recomputed after UPDATE"
    sql: "SELECT id, rank FROM orc_rank ORDER BY score ASC"
    expect:
      rows: 4
      data:
        - id: 1
          rank: 1
        - id: 5
          rank: 2
        - id: 2
          rank: 3
        - id: 4
          rank: 4

  # ── Cleanup ────────────────────────────────────────────────────────────────

  - name: "Drop rank table"
    sql: "DROP TABLE IF EXISTS orc_rank"

  - name: "Drop sales table"
    sql: "DROP TABLE IF EXISTS orc_sales"

  # A reducer failure must release repair ownership. A later read must report
  # the same failure, rather than waiting on the previous request's mutex;
  # correcting the input must then recover the complete ordered result.
  - name: "Drop leftover repair failure table"
    sql: "DROP TABLE IF EXISTS orc_repair_failure"

  - name: "Create repair failure table"
    sql: "CREATE TABLE orc_repair_failure (id INT PRIMARY KEY, amount INT, running INT)"

  - name: "Insert repair failure input"
    sql: "INSERT INTO orc_repair_failure (id, amount) VALUES (1, 10), (2, -20), (3, 30)"

  - name: "Declare an ordered reducer that rejects negative input"
    scm: |
      (createcolumn (table "memcp-tests" false "orc_repair_failure" false nil) "running" "INT" '()
        (list
          "sortcols" '("id")
          "sortdirs" (list false)
          "partitioncount" 0
          "mapcols" '("amount")
          "mapreducefn" (lambda (acc $set amount)
            (if (< amount 0) (error "ordered-repair-negative-input")
              (begin
                (define value (+ acc amount))
                ($set value)
                value)))
          "reduceinit" 0))

  - name: "A failed ordered repair reports its original reducer error"
    sql: "SELECT id, running FROM orc_repair_failure ORDER BY id"
    expect:
      error: true
      contains: "ordered-repair-negative-input"

  - name: "Another read after repair failure reports the error without hanging"
    sql: "SELECT id, running FROM orc_repair_failure ORDER BY id"
    timeout: 2
    expect:
      error: true
      contains: "ordered-repair-negative-input"

  - name: "Correct the failed reducer input"
    sql: "UPDATE orc_repair_failure SET amount = 20 WHERE id = 2"

  - name: "An ordered repair succeeds after its input is corrected"
    sql: "SELECT id, amount, running FROM orc_repair_failure ORDER BY id"
    expect:
      rows: 3
      data:
        - {id: 1, amount: 10, running: 10}
        - {id: 2, amount: 20, running: 30}
        - {id: 3, amount: 30, running: 60}

  - name: "Delete after recovered ordered repair"
    sql: "DELETE FROM orc_repair_failure WHERE id = 1"

  - name: "Ordered repair still recomputes after a later deletion"
    sql: "SELECT id, amount, running FROM orc_repair_failure ORDER BY id"
    expect:
      rows: 2
      data:
        - {id: 2, amount: 20, running: 20}
        - {id: 3, amount: 30, running: 50}

  - name: "Drop repair failure table"
    sql: "DROP TABLE orc_repair_failure"
