# ORDER BY and LIMIT/OFFSET

metadata:
  version: "1.0"
  description: "Ordering by multiple keys with pagination"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS ord_t"
  - sql: "DROP TABLE IF EXISTS ord_join_left"
  - sql: "DROP TABLE IF EXISTS ord_join_right"
  - sql: "DROP TABLE IF EXISTS ord_member_doc"
  - sql: "DROP TABLE IF EXISTS ord_member_file"
  - sql: "DROP TABLE IF EXISTS ord_member_label"
  - sql: "DROP TABLE IF EXISTS ord_member_permission"
  - sql: "DROP TABLE IF EXISTS ord_derived_item"
  - sql: "DROP TABLE IF EXISTS ord_derived_parent"
  - sql: "DROP TABLE IF EXISTS ord_tree_a"
  - sql: "DROP TABLE IF EXISTS ord_tree_b"
  - sql: "DROP TABLE IF EXISTS ord_tree_c"
  - sql: "DROP TABLE IF EXISTS ord_tree_d"
  - sql: "CREATE TABLE ord_t (a INT, b INT)"
  - sql: "CREATE TABLE ord_join_left (id INT PRIMARY KEY, ref_id INT)"
  - sql: "CREATE TABLE ord_join_right (id INT PRIMARY KEY, rank_value INT)"
  - sql: "CREATE TABLE ord_member_doc (id INT PRIMARY KEY, file_id INT, label_id INT, rank_value INT)"
  - sql: "CREATE TABLE ord_member_file (id INT PRIMARY KEY, filename TEXT)"
  - sql: "CREATE TABLE ord_member_label (id INT PRIMARY KEY, name TEXT, visible INT)"
  - sql: "CREATE TABLE ord_member_permission (id INT PRIMARY KEY, principal_id INT, label_id INT)"
  - sql: "CREATE TABLE ord_derived_parent (id INT PRIMARY KEY, label TEXT)"
  - sql: "CREATE TABLE ord_derived_item (id INT PRIMARY KEY, parent_id INT, created INT)"
  - sql: "CREATE TABLE ord_tree_a (id INT PRIMARY KEY, pair_key INT)"
  - sql: "CREATE TABLE ord_tree_b (id INT PRIMARY KEY, pair_key INT)"
  - sql: "CREATE TABLE ord_tree_c (id INT PRIMARY KEY, pair_key INT)"
  - sql: "CREATE TABLE ord_tree_d (id INT PRIMARY KEY, pair_key INT)"
  - sql: |
      INSERT INTO ord_t (a,b) VALUES
      (1,2),(1,1),(2,2),(2,0),(3,1)
  - sql: "INSERT INTO ord_join_left VALUES (1,10),(2,20),(3,30)"
  - sql: "INSERT INTO ord_join_right VALUES (10,3),(20,1),(30,2)"
  - sql: "INSERT INTO ord_member_doc VALUES (1,1,10,40),(2,2,20,30),(3,3,10,20),(4,4,30,10)"
  - sql: "INSERT INTO ord_member_file VALUES (1,'other'),(2,'needle one'),(3,'needle two'),(4,'other')"
  - sql: "INSERT INTO ord_member_label VALUES (10,'alpha',1),(20,'beta',0)"
  - sql: "INSERT INTO ord_member_permission VALUES (1,7,10)"
  - sql: "INSERT INTO ord_derived_parent VALUES (1,'one'),(2,'two')"
  - sql: "INSERT INTO ord_derived_item VALUES (10,1,100),(20,2,200)"
  - sql: "INSERT INTO ord_tree_a VALUES (1,10),(2,20),(3,30)"
  - sql: "INSERT INTO ord_tree_b VALUES (10,10),(20,20),(30,30)"
  - sql: "INSERT INTO ord_tree_c VALUES (1,100),(2,200),(3,300)"
  - sql: "INSERT INTO ord_tree_d VALUES (100,100),(200,200)"

test_cases:
  - name: "Top-1 by a DESC"
    sql: "SELECT a, b FROM ord_t ORDER BY a DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - a: 3
          b: 1

  - name: "Top-1 by a ASC"
    sql: "SELECT a FROM ord_t ORDER BY a ASC LIMIT 1"
    expect:
      rows: 1
      data:
        - a: 1

  - name: "Top-2 by a DESC (no offset)"
    sql: "SELECT a FROM ord_t ORDER BY a DESC LIMIT 2"
    expect:
      rows: 2
      data:
        - a: 3

  - name: "Multi-key order with limit/offset"
    sql: "SELECT a, b FROM ord_t ORDER BY a DESC, b ASC LIMIT 2 OFFSET 1"
    expect:
      rows: 2
      data:
        - a: 2
          b: 0
        - a: 2
          b: 2

  # === UPDATE ORDER BY LIMIT ===

  - name: "UPDATE ORDER BY LIMIT modifies only lowest rows"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_upd"
      - sql: "CREATE TABLE ord_upd (id INT, val INT)"
      - sql: "INSERT INTO ord_upd (id, val) VALUES (1,10),(2,20),(3,30),(4,40),(5,50)"
    sql: "UPDATE ord_upd SET val = 0 ORDER BY id ASC LIMIT 2"
    expect:
      affected_rows: 2
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_upd"

  - name: "UPDATE ORDER BY LIMIT verify results"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_upd2"
      - sql: "CREATE TABLE ord_upd2 (id INT, val INT)"
      - sql: "INSERT INTO ord_upd2 (id, val) VALUES (1,10),(2,20),(3,30),(4,40),(5,50)"
      - sql: "UPDATE ord_upd2 SET val = 0 ORDER BY id ASC LIMIT 2"
    sql: "SELECT id, val FROM ord_upd2 ORDER BY id ASC"
    expect:
      rows: 5
      data:
        - id: 1
          val: 0
        - id: 2
          val: 0
        - id: 3
          val: 30
        - id: 4
          val: 40
        - id: 5
          val: 50
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_upd2"

  - name: "UPDATE ORDER BY DESC LIMIT"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_upd3"
      - sql: "CREATE TABLE ord_upd3 (id INT, val INT)"
      - sql: "INSERT INTO ord_upd3 (id, val) VALUES (1,10),(2,20),(3,30),(4,40),(5,50)"
      - sql: "UPDATE ord_upd3 SET val = 99 ORDER BY id DESC LIMIT 3"
    sql: "SELECT id, val FROM ord_upd3 ORDER BY id ASC"
    expect:
      rows: 5
      data:
        - id: 1
          val: 10
        - id: 2
          val: 20
        - id: 3
          val: 99
        - id: 4
          val: 99
        - id: 5
          val: 99
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_upd3"

  # === DELETE ORDER BY LIMIT ===

  - name: "DELETE ORDER BY LIMIT removes only highest rows"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_del"
      - sql: "CREATE TABLE ord_del (id INT, val INT)"
      - sql: "INSERT INTO ord_del (id, val) VALUES (1,10),(2,20),(3,30),(4,40),(5,50)"
      - sql: "DELETE FROM ord_del ORDER BY id DESC LIMIT 2"
    sql: "SELECT id, val FROM ord_del ORDER BY id ASC"
    expect:
      rows: 3
      data:
        - id: 1
          val: 10
        - id: 2
          val: 20
        - id: 3
          val: 30
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_del"

  - name: "DELETE ORDER BY ASC LIMIT"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_del2"
      - sql: "CREATE TABLE ord_del2 (id INT, val INT)"
      - sql: "INSERT INTO ord_del2 (id, val) VALUES (1,10),(2,20),(3,30)"
      - sql: "DELETE FROM ord_del2 ORDER BY id ASC LIMIT 1"
    sql: "SELECT id FROM ord_del2 ORDER BY id ASC"
    expect:
      rows: 2
      data:
        - id: 2
        - id: 3
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_del2"

  - name: "ORDER BY with aggregate (SUM via scan_order)"
    sql: "SELECT a, SUM(b) AS s FROM ord_t GROUP BY a ORDER BY a ASC LIMIT 2"
    expect:
      rows: 2
      data:
        - a: 1
          s: 3
        - a: 2
          s: 2

  - name: "Joined order uses the ordered relation as physical driver"
    sql: |
      EXPLAIN SELECT l.id
      FROM ord_join_left l
      JOIN ord_join_right r ON r.id = l.ref_id
      ORDER BY r.rank_value
      LIMIT 1
    expect:
      rows: 1
      result_contains:
        - "scan_join_order"
      result_not_contains:
        - "(sort rows"
        - "(slice sorted"

  - name: "Joined ordered driver carries compiled local access"
    sql: |
      EXPLAIN SELECT l.id
      FROM ord_join_left l
      JOIN ord_join_right r ON r.id = l.ref_id
      WHERE r.rank_value >= 1
      ORDER BY r.rank_value
      LIMIT 1
    expect:
      rows: 1
      result_contains:
        - "scan_join_order"
        - "rank_value"
        - "range"

  - name: "Cross-source computed order uses a physical carrier"
    sql: |
      EXPLAIN SELECT l.id
      FROM ord_join_left l
      JOIN ord_join_right r ON r.id = l.ref_id
      ORDER BY l.id + r.rank_value
      LIMIT 1
    expect:
      rows: 1
      result_contains:
        - "scan_order"
        - "ord_join_left"
        - "ord_join_right"
      result_not_contains:
        - ".prejoin:"
        - "initialize_cache_table"
        - "(sort rows"
        - "(slice sorted"

  - name: "Ordered four-way join retains a bushy logical tree"
    sql: |
      EXPLAIN REORDER SELECT a.id
      FROM ord_tree_a a
      JOIN ord_tree_b b ON b.pair_key = a.pair_key
      JOIN ord_tree_c c ON c.id = a.id
      JOIN ord_tree_d d ON d.pair_key = c.pair_key
      ORDER BY a.id, b.id, c.id, d.id
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "join_reorder_strategy"
        - "dphyp"
        - "ord_tree_a"
        - "ord_tree_b"
        - "ord_tree_c"
        - "ord_tree_d"
      result_occurrences:
        - { text: "join-node", count: 3 }

  - name: "Ordered driver removal retains a bushy independent subtree"
    scm: |
      (begin
        (define tree (make_join_optimizer_node 'inner
          (make_join_optimizer_node 'inner
            (make_join_optimizer_leaf "a")
            (make_join_optimizer_leaf "b") '())
          (make_join_optimizer_node 'inner
            (make_join_optimizer_leaf "c")
            (make_join_optimizer_leaf "d") '()) '()))
        (equal?
          (join_optimizer_tree_without_aliases tree '("a"))
          (make_join_optimizer_node 'inner
            (make_join_optimizer_leaf "b")
            (make_join_optimizer_node 'inner
              (make_join_optimizer_leaf "c")
              (make_join_optimizer_leaf "d") '()) '())))
    expect:
      data: [true]

  - name: "Ordered driver removal retains an outer-join barrier"
    scm: |
      (begin
        (define tree (make_join_optimizer_node 'left-outer
          (make_join_optimizer_node 'inner
            (make_join_optimizer_leaf "a")
            (make_join_optimizer_leaf "b") '())
          (make_join_optimizer_leaf "d") '()))
        (equal?
          (join_optimizer_tree_without_aliases tree '("a"))
          (make_join_optimizer_node 'left-outer
            (make_join_optimizer_leaf "b")
            (make_join_optimizer_leaf "d") '())))
    expect:
      data: [true]

  - name: "Bushy ordered join lowers without rebuilding its independent subtree"
    sql: |
      EXPLAIN SELECT a.id
      FROM ord_tree_a a
      JOIN ord_tree_b b ON b.pair_key = a.pair_key
      JOIN ord_tree_c c ON c.id = a.id
      JOIN ord_tree_d d ON d.pair_key = c.pair_key
      ORDER BY a.id, b.id, c.id, d.id
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "ord_tree_a"
        - "ord_tree_b"
        - "ord_tree_c"
        - "ord_tree_d"
      result_not_contains:
        - "scan_join_order"
        - "(sort rows"
        - "(slice sorted"

  - name: "Bushy ordered join preserves results across independent subtrees"
    sql: |
      SELECT a.id
      FROM ord_tree_a a
      JOIN ord_tree_b b ON b.pair_key = a.pair_key
      JOIN ord_tree_c c ON c.id = a.id
      JOIN ord_tree_d d ON d.pair_key = c.pair_key
      ORDER BY a.id, b.id, c.id, d.id
      LIMIT 2
    expect:
      rows: 2
      data:
        - id: 1
        - id: 2

  - name: "Ordered lowering preserves the nullable outer-join barrier"
    sql: |
      SELECT a.id, d.id AS nullable_id
      FROM ord_tree_a a
      JOIN ord_tree_b b ON b.pair_key = a.pair_key
      JOIN ord_tree_c c ON c.id = a.id
      LEFT JOIN ord_tree_d d ON d.pair_key = c.pair_key
      ORDER BY a.id, b.id, c.id, d.id
      LIMIT 3
    expect:
      rows: 3
      data:
        - { id: 1, nullable_id: 100 }
        - { id: 2, nullable_id: 200 }
        - { id: 3, nullable_id: null }

  - name: "RecSet membership with lookup order never materializes Scheme rows"
    sql: |
      EXPLAIN SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE d.file_id IN (
        SELECT id FROM ord_member_file WHERE filename LIKE '%needle%'
        UNION
        SELECT id FROM ord_member_file WHERE MATCH(filename) AGAINST ('needle')
      )
      ORDER BY l.name, d.id
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "scan_order"
      result_not_contains:
        - "(lambda (rows)"
        - "(sort (var 0)"
        - "(slice (var 0)"
        - "(merge (var 0) (var 1))"

  - name: "RecSet membership with lookup order remains correct"
    sql: |
      SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE d.file_id IN (
        SELECT id FROM ord_member_file WHERE filename LIKE '%needle%'
        UNION
        SELECT id FROM ord_member_file WHERE MATCH(filename) AGAINST ('needle')
      )
      ORDER BY l.name, d.id
      LIMIT 2
    expect:
      rows: 2
      data:
        - { id: 3, name: "alpha" }
        - { id: 2, name: "beta" }

  - name: "Driver ordered RecSet lookup streams without joined row lists"
    sql: |
      EXPLAIN SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE d.file_id IN (
        SELECT id FROM ord_member_file WHERE filename LIKE '%needle%'
        UNION
        SELECT id FROM ord_member_file WHERE MATCH(filename) AGAINST ('needle')
      )
      ORDER BY d.rank_value DESC
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "scan_order"
      result_not_contains:
        - "joined_matches"
        - "(merge (var 0) (var 1))"

  - name: "Driver ordered RecSet lookup remains correct"
    sql: |
      SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE d.file_id IN (
        SELECT id FROM ord_member_file WHERE filename LIKE '%needle%'
        UNION
        SELECT id FROM ord_member_file WHERE MATCH(filename) AGAINST ('needle')
      )
      ORDER BY d.rank_value DESC
      LIMIT 2
    expect:
      rows: 2
      data:
        - { id: 2, name: "beta" }
        - { id: 3, name: "alpha" }

  - name: "Nullable-side WHERE remains after LEFT JOIN null extension"
    sql: |
      SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE l.visible = 1 OR l.id IS NULL
      ORDER BY d.id
    expect:
      rows: 3
      data:
        - { id: 1, name: "alpha" }
        - { id: 3, name: "alpha" }
        - { id: 4, name: null }

  - name: "Failed nullable-side WHERE match does not synthesize NULL"
    sql: |
      SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE d.id = 2 AND l.visible = 1
    expect:
      rows: 0

  - name: "Nullable WHERE is scheduled before unrelated later lookup"
    sql: |
      EXPLAIN SELECT d.id, l.name, f.filename
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      LEFT JOIN ord_member_file f ON f.id = d.file_id
      WHERE l.visible = 1
      ORDER BY d.id
    expect:
      rows: 1
      result_contains:
        - "ord_member_label"
        - "ord_member_file"
      result_not_contains:
        - "joined_matches"
        - "(merge (var 0) (var 1))"

  - name: "Rejected nullable lookup does not execute later projection lookup"
    sql: |
      SELECT d.id, l.name, f.filename
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      LEFT JOIN ord_member_file f ON f.id = d.file_id
      WHERE l.visible = 99
      ORDER BY d.id
      LIMIT 2
    expect:
      rows: 0

  - name: "Ordered LIMIT counts rows accepted by a unique lookup filter"
    sql: |
      SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE l.visible = 1
      ORDER BY d.rank_value DESC
      LIMIT 1 OFFSET 1
    expect:
      rows: 1
      data:
        - { id: 3, name: "alpha" }

  - name: "Ordered unique lookup filter uses native scan limit"
    sql: |
      EXPLAIN SELECT d.id, l.name
      FROM ord_member_doc d
      LEFT JOIN ord_member_label l ON l.id = d.label_id
      WHERE l.visible = 1
      ORDER BY d.rank_value DESC
      LIMIT 1 OFFSET 1
    expect:
      rows: 1
      result_contains:
        - "scan_order"
        - "ord_member_label"
      result_not_contains:
        - "$break"
        - ".join-order:"
        - "joined_matches"

  - name: "Grouped nullable lookup WHERE stays at its null-extension boundary"
    sql: |
      SELECT t.id, t.score
      FROM (
        SELECT d.id,
          (SELECT SUM(x.rank_value)
           FROM ord_member_doc x
           WHERE x.label_id = d.label_id AND x.rank_value > 15) AS score
        FROM ord_member_doc d
      ) t
      WHERE t.score = 60 OR t.score IS NULL
      ORDER BY t.id
      LIMIT 3
    expect:
      rows: 3
      data:
        - { id: 1, score: 60 }
        - { id: 3, score: 60 }
        - { id: 4, score: null }

  - name: "Grouped nullable lookup uses scans without relational collectors"
    sql: |
      EXPLAIN SELECT t.id, t.score
      FROM (
        SELECT d.id,
          (SELECT SUM(x.rank_value)
           FROM ord_member_doc x
           WHERE x.label_id = d.label_id AND x.rank_value > 15) AS score
        FROM ord_member_doc d
      ) t
      WHERE t.score = 60 OR t.score IS NULL
      ORDER BY t.id
      LIMIT 3
    expect:
      rows: 1
      result_contains:
        - "scan_order"
      result_not_contains:
        - "joined_matches"
        - "(lambda (rows)"
        - "(sort (var 0)"
        - "(slice (var 0)"

  - name: "Quoted derived aliases resolve case-insensitively across joined order keys"
    sql: |
      SELECT d.*
      FROM (
        SELECT i.id AS `ID`, i.created AS `Created`, i.parent_id,
          p.`parent:ID` AS `parent:ID`, p.`parent:label` AS `parent:label`
        FROM ord_derived_item i
        LEFT JOIN (
          SELECT id AS `parent:ID`, label AS `parent:label`
          FROM ord_derived_parent
        ) p ON p.`parent:ID` = i.parent_id
      ) d
      LEFT JOIN ord_derived_parent sorter ON sorter.id = d.parent_id
      ORDER BY `d`.`Created` DESC, `d`.`id` DESC
    expect:
      rows: 2
      data:
        - { ID: 20, Created: 200, parent_id: 2, "parent:ID": 2, "parent:label": "two" }
        - { ID: 10, Created: 100, parent_id: 1, "parent:ID": 1, "parent:label": "one" }

  - name: "Joined derived alias order remains a physical ordered scan"
    sql: |
      EXPLAIN SELECT d.*
      FROM (
        SELECT i.id AS `ID`, i.created AS `Created`, i.parent_id,
          p.`parent:ID` AS `parent:ID`, p.`parent:label` AS `parent:label`
        FROM ord_derived_item i
        LEFT JOIN (
          SELECT id AS `parent:ID`, label AS `parent:label`
          FROM ord_derived_parent
        ) p ON p.`parent:ID` = i.parent_id
      ) d
      LEFT JOIN ord_derived_parent sorter ON sorter.id = d.parent_id
      ORDER BY `d`.`Created` DESC, `d`.`id` DESC
    expect:
      rows: 1
      result_contains:
        - "scan_order"
      result_not_contains:
        - "(lambda (rows)"
        - "(sort (var 0)"
        - "(slice (var 0)"

  - name: "Bounded derived read model preserves nested permission semantics"
    sql: |
      SELECT d.id, d.file_id, d.label_name
      FROM (
        SELECT m.id, m.file_id, m.label_id, m.rank_value,
          projected_label.name AS label_name
        FROM ord_member_doc m
        LEFT JOIN (
          SELECT l.id, l.name
          FROM ord_member_label l
        ) projected_label ON projected_label.id = m.label_id
        WHERE COALESCE((
          SELECT EXISTS (
            SELECT TRUE FROM ord_member_permission permission_entry
            WHERE permission_entry.principal_id = 7
              AND permission_entry.label_id = permission_label.id
            LIMIT 1
          )
          FROM ord_member_label permission_label
          WHERE permission_label.id = m.label_id
          LIMIT 1
        ), FALSE)
      ) d
      WHERE d.file_id IN (
        SELECT id FROM ord_member_file WHERE filename LIKE '%needle%'
        UNION
        SELECT id FROM ord_member_file WHERE filename LIKE '%two%'
      )
      ORDER BY d.rank_value DESC, d.label_id ASC
      LIMIT 2
    expect:
      rows: 1
      data:
        - {id: 3, file_id: 3, label_name: "alpha"}

  - name: "Set up scalable bounded derived read model"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_read_doc"
      - sql: "DROP TABLE IF EXISTS ord_read_file"
      - sql: "DROP TABLE IF EXISTS ord_read_label"
      - sql: "DROP TABLE IF EXISTS ord_read_permission"
      - sql: "CREATE TABLE ord_read_doc (id INT PRIMARY KEY, file_id INT, label_id INT, rank_value INT)"
      - sql: "CREATE TABLE ord_read_file (id INT PRIMARY KEY, filename TEXT)"
      - sql: "CREATE TABLE ord_read_label (id INT UNIQUE, name TEXT)"
      - sql: "CREATE TABLE ord_read_permission (id INT PRIMARY KEY, principal_id INT, label_id INT)"
      - scm: |
          (begin
            (insert (table "memcp-tests" "ord_read_doc") (list "id" "file_id" "label_id" "rank_value")
              (map (produceN 20000) (lambda (i)
                (list (+ i 1) (+ i 1) (+ (mod i 100) 1) (- 20000 i)))))
            (insert (table "memcp-tests" "ord_read_file") (list "id" "filename")
              (map (produceN 20000) (lambda (i)
                (list (+ i 1) (if (equal? (mod i 3) 0) "needle" "other")))))
            (insert (table "memcp-tests" "ord_read_label") (list "id" "name")
              (map (produceN 100) (lambda (i) (list (+ i 1) (concat "label_" (+ i 1))))))
            (insert (table "memcp-tests" "ord_read_permission") (list "id" "principal_id" "label_id")
              (map (produceN 50) (lambda (i) (list (+ i 1) 7 (+ i 1))))))
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM ord_read_doc"
    expect:
      rows: 1
      data:
        - cnt: 20000

  - name: "Scalable bounded derived read model applies nested permission before native limit"
    max_time: 3
    sql: |
      SELECT d.*
      FROM (
        SELECT m.id, m.file_id, m.label_id, m.rank_value,
          projected_label.name AS label_name,
          projected_label.allowed AS label_allowed
        FROM ord_read_doc m
        LEFT JOIN (
          SELECT l.id, l.name,
            l.name IS NOT NULL AS allowed
          FROM ord_read_label l
        ) projected_label ON projected_label.id = m.label_id
        WHERE COALESCE((
          SELECT EXISTS (
            SELECT TRUE FROM ord_read_permission permission_entry
            WHERE permission_entry.principal_id = 7
              AND permission_entry.label_id = permission_label.id
            LIMIT 1
          )
          FROM ord_read_label permission_label
          WHERE permission_label.id = m.label_id
          LIMIT 1
        ), FALSE)
      ) d
      LEFT JOIN ord_read_label unused_sorter
        ON unused_sorter.id = d.label_id
      WHERE d.file_id IN (
        SELECT id FROM ord_read_file WHERE filename LIKE '%needle%'
        UNION
        SELECT id FROM ord_read_file WHERE filename LIKE '%alternate%'
      )
      ORDER BY d.rank_value DESC, d.label_id ASC
      LIMIT 2
    expect:
      rows: 2
      data:
        - {id: 1, file_id: 1, label_id: 1, rank_value: 20000, label_name: "label_1", label_allowed: true}
        - {id: 4, file_id: 4, label_id: 4, rank_value: 19997, label_name: "label_4", label_allowed: true}

  - name: "Bounded nested permission and membership stay on the ordered base driver"
    sql: |
      EXPLAIN PHYSICAL SELECT d.*
      FROM (
        SELECT m.id, m.file_id, m.label_id, m.rank_value,
          projected_label.name AS label_name,
          projected_label.allowed AS label_allowed
        FROM ord_read_doc m
        LEFT JOIN (
          SELECT l.id, l.name,
            l.name IS NOT NULL AS allowed
          FROM ord_read_label l
        ) projected_label ON projected_label.id = m.label_id
        WHERE COALESCE((
          SELECT EXISTS (
            SELECT TRUE FROM ord_read_permission permission_entry
            WHERE permission_entry.principal_id = 7
              AND permission_entry.label_id = permission_label.id
            LIMIT 1
          )
          FROM ord_read_label permission_label
          WHERE permission_label.id = m.label_id
          LIMIT 1
        ), FALSE)
      ) d
      LEFT JOIN ord_read_label unused_sorter
        ON unused_sorter.id = d.label_id
      WHERE d.file_id IN (
        SELECT id FROM ord_read_file WHERE filename LIKE '%needle%'
        UNION
        SELECT id FROM ord_read_file WHERE filename LIKE '%alternate%'
      )
      ORDER BY d.rank_value DESC, d.label_id ASC
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "scan_order"
        - "recset"
      result_not_contains:
        - "adaptive_observation_required true"
        - "__join_order_intermediate"
        - '"$recset_contains"'
        - "(lambda (rows)"
        - "(sort (var 0)"
        - "(slice (var 0)"
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_read_doc"
      - sql: "DROP TABLE IF EXISTS ord_read_file"
      - sql: "DROP TABLE IF EXISTS ord_read_label"
      - sql: "DROP TABLE IF EXISTS ord_read_permission"

  - name: "Partial composite unique lookup retains its storage carrier"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_composite_lookup"
      - sql: "CREATE TABLE ord_composite_lookup (lookup_id INT, variant INT, name TEXT, UNIQUE KEY lookup_variant (lookup_id, variant))"
      - sql: "INSERT INTO ord_composite_lookup VALUES (10,1,'first'),(10,2,'second'),(20,1,'third')"
    sql: |
      EXPLAIN SELECT d.id
      FROM ord_member_doc d
      JOIN ord_composite_lookup c ON c.lookup_id = d.label_id
      ORDER BY d.rank_value DESC
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "scan_join_order"
      result_not_contains:
        - "__join_order_intermediate"
        - ".join-order:"
        - "createtable"
        - "droptable"
        - '"$break"'
        - "(lambda (rows)"
        - "(sort (var 0)"
        - "(slice (var 0)"
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_composite_lookup"

  - name: "Ordered one-to-many window counts expanded rows for OFFSET and LIMIT"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_composite_lookup"
      - sql: "CREATE TABLE ord_composite_lookup (lookup_id INT, variant INT, name TEXT, UNIQUE KEY lookup_variant (lookup_id, variant))"
      - sql: "INSERT INTO ord_composite_lookup VALUES (10,1,'first'),(10,2,'second'),(20,1,'third')"
    sql: |
      SELECT d.id
      FROM ord_member_doc d
      JOIN ord_composite_lookup c ON c.lookup_id = d.label_id
      ORDER BY d.rank_value DESC
      LIMIT 2 OFFSET 1
    expect:
      rows: 2
      data:
        - { id: 1 }
        - { id: 2 }
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_composite_lookup"

  - name: "ORDER BY DESC OFFSET beyond rows returns empty"
    sql: "SELECT a FROM ord_t ORDER BY a DESC LIMIT 2 OFFSET 10"
    expect:
      rows: 0

  # === Multi-shard ORDER BY stress test ===
  # Inserts 200K rows spanning multiple shards (60K default shard size)
  # to verify the priority-queue merge produces strictly ordered output.

  - name: "Multi-shard ORDER BY: setup 200K rows"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_stress"
      - sql: "CREATE TABLE ord_stress (id INT, val INT, grp INT)"
      - scm: |
          (begin
            (set rows (map (produceN 200000) (lambda (i)
              (list i (* 7 (- (* i 31337) (* (floor (/ (* i 31337) 200000)) 200000))) (floor (/ i 40000))))))
            (insert (table "memcp-tests" "ord_stress") (list "id" "val" "grp") rows))
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM ord_stress"
    expect:
      rows: 1
      data:
        - cnt: 200000

  - name: "Multi-shard ORDER BY ASC spot check offset 0"
    sql: "SELECT val FROM ord_stress ORDER BY val ASC LIMIT 1"
    expect:
      rows: 1
      data:
        - val: 0

  # The regression guard keys existing cases by name and deliberately rejects
  # converting them into performance tests. Keep these point checks as stable
  # correctness anchors; the renamed 200K-row OFFSET cases below retain the
  # original queries and expectations under explicit performance budgets.
  - name: "Multi-shard ORDER BY ASC spot check offset 99999"
    sql: "SELECT val FROM ord_stress ORDER BY val ASC LIMIT 1"
    expect:
      rows: 1
      data:
        - val: 0

  - name: "Performance exception: multi-shard ORDER BY ASC offset 99999"
    threshold_ms: 7000
    timing_samples: 1
    warmup: false
    sql: "SELECT val FROM ord_stress ORDER BY val ASC LIMIT 1 OFFSET 99999"
    expect:
      rows: 1
      data:
        - val: 699993

  - name: "Multi-shard ORDER BY ASC spot check last"
    sql: "SELECT val FROM ord_stress ORDER BY val DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - val: 1399993

  - name: "Performance exception: multi-shard ORDER BY ASC last row"
    threshold_ms: 7000
    timing_samples: 1
    warmup: false
    sql: "SELECT val FROM ord_stress ORDER BY val ASC LIMIT 1 OFFSET 199999"
    expect:
      rows: 1
      data:
        - val: 1399993

  - name: "Multi-shard ORDER BY DESC spot check first"
    sql: "SELECT val FROM ord_stress ORDER BY val DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - val: 1399993

  - name: "Multi-shard ORDER BY DESC spot check middle"
    sql: "SELECT val FROM ord_stress ORDER BY val DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - val: 1399993

  - name: "Performance exception: multi-shard ORDER BY DESC middle"
    threshold_ms: 7000
    timing_samples: 1
    warmup: false
    sql: "SELECT val FROM ord_stress ORDER BY val DESC LIMIT 1 OFFSET 99999"
    expect:
      rows: 1
      data:
        - val: 700000

  - name: "Multi-shard ORDER BY multi-column"
    sql: "SELECT grp, val FROM ord_stress ORDER BY grp ASC, val DESC LIMIT 3"
    timeout: 60
    expect:
      rows: 3
      data:
        - grp: 0
          val: 1399986
        - grp: 0
          val: 1399951
        - grp: 0
          val: 1399937
  - name: "Multi-shard lookup ORDER keeps the complete sort prefix before LIMIT"
    setup:
      - sql: "INSERT INTO ord_member_label VALUES (0,'echo',1),(1,'delta',1),(2,'charlie',1),(3,'bravo',1),(4,'alpha',1)"
    sql: |
      SELECT s.id, l.name
      FROM ord_stress s
      LEFT JOIN ord_member_label l ON l.id = s.grp
      WHERE s.id % 200 = 0
      ORDER BY l.name, s.id
      LIMIT 1 OFFSET 100
    timeout: 60
    expect:
      rows: 1
      data:
        - id: 180000
          name: "alpha"

  - name: "Multi-shard ORDER BY with OFFSET across shards"
    sql: "SELECT val FROM ord_stress ORDER BY val ASC LIMIT 3"
    expect:
      rows: 3
      data:
        - val: 0
        - val: 7
        - val: 14

  - name: "Performance exception: multi-shard ORDER BY offset across shards"
    threshold_ms: 7000
    timing_samples: 1
    warmup: false
    sql: "SELECT val FROM ord_stress ORDER BY val ASC LIMIT 3 OFFSET 49999"
    expect:
      rows: 3
      data:
        - val: 349993
        - val: 350000
        - val: 350007
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_stress"

  - name: "Ordered equi-join top-k preserves SQL result"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_join_order_driver"
      - sql: "DROP TABLE IF EXISTS ord_join_order_lookup"
      - sql: "CREATE TABLE ord_join_order_driver (id INT PRIMARY KEY, lookup_id INT, score INT)"
      - sql: "CREATE TABLE ord_join_order_lookup (id INT PRIMARY KEY, enabled INT)"
      - sql: "INSERT INTO ord_join_order_lookup (id, enabled) VALUES (1, 1), (2, 0)"
      - sql: "INSERT INTO ord_join_order_driver (id, lookup_id, score) VALUES (1, 1, 10), (2, 2, 20), (3, 1, 30)"
      - scm: "(rebuild)"
    sql: |
      SELECT d.id
      FROM ord_join_order_driver d
      JOIN ord_join_order_lookup l ON d.lookup_id = l.id
      WHERE l.enabled = 1
      ORDER BY d.score DESC
      LIMIT 2
    expect:
      rows: 2
      data:
        - id: 3
        - id: 1

  - name: "Ordered equi-join exposes both physical alternatives"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE DISCOVER
      SELECT d.id
      FROM ord_join_order_driver d
      JOIN ord_join_order_lookup l ON d.lookup_id = l.id
      WHERE l.enabled = 1
      ORDER BY d.score DESC
      LIMIT 2
    expect:
      contains:
        - "scan_join_order"
        - "legacy_join_tree"

  - name: "Sparse ordered join costs all visited driver rows"
    setup:
      - sql: "DROP TABLE IF EXISTS ord_join_order_driver"
      - sql: "DROP TABLE IF EXISTS ord_join_order_lookup"
      - sql: "CREATE TABLE ord_join_order_driver (id INT PRIMARY KEY, lookup_id INT, score INT)"
      - sql: "CREATE TABLE ord_join_order_lookup (driver_id INT, enabled INT)"
      - scm: |
          (begin
            (insert (table "memcp-tests" "ord_join_order_driver") '("id" "lookup_id" "score")
              (map (produceN 2000) (lambda (i) (list (+ i 1) (+ i 1) i))))
            (insert (table "memcp-tests" "ord_join_order_lookup") '("driver_id" "enabled")
              (map (produceN 2000) (lambda (i)
                (list (+ i 1) (if (equal? i 0) 1 0)))))
            (rebuild)
            true)
    sql: |
      EXPLAIN PHYSICAL
      SELECT d.id
      FROM ord_join_order_driver d
      JOIN ord_join_order_lookup l ON d.id = l.driver_id
      WHERE l.enabled = 1
      ORDER BY d.score DESC
      LIMIT 1
    expect:
      result_contains:
        - "chosen scan_join_order"
        - "join_legacy_probe_rows 2000"
    cleanup:
      - sql: "DROP TABLE IF EXISTS ord_join_order_driver"
      - sql: "DROP TABLE IF EXISTS ord_join_order_lookup"

cleanup:
  - sql: "DROP TABLE IF EXISTS ord_t"
  - sql: "DROP TABLE IF EXISTS ord_join_left"
  - sql: "DROP TABLE IF EXISTS ord_join_right"
  - sql: "DROP TABLE IF EXISTS ord_member_doc"
  - sql: "DROP TABLE IF EXISTS ord_member_file"
  - sql: "DROP TABLE IF EXISTS ord_member_label"
  - sql: "DROP TABLE IF EXISTS ord_member_permission"
  - sql: "DROP TABLE IF EXISTS ord_derived_item"
  - sql: "DROP TABLE IF EXISTS ord_derived_parent"
  - sql: "DROP TABLE IF EXISTS ord_tree_a"
  - sql: "DROP TABLE IF EXISTS ord_tree_b"
  - sql: "DROP TABLE IF EXISTS ord_tree_c"
  - sql: "DROP TABLE IF EXISTS ord_tree_d"
