metadata:
  version: "1.0"
  description: "GROUP_CONCAT in GROUP BY, OVER (PARTITION BY), and OVER (ORDER BY) contexts"
  isolated: true

test_cases:

  - name: "Drop leftover tables"
    sql: "DROP TABLE IF EXISTS gc_test"

  - name: "Create test table"
    sql: |
      CREATE TABLE gc_test (id INT PRIMARY KEY, grp INT, name VARCHAR(50), val INT)

  - name: "Insert test data"
    sql: |
      INSERT INTO gc_test VALUES
      (1, 1, 'alice', 10),
      (2, 1, 'bob', 20),
      (3, 1, 'charlie', 30),
      (4, 2, 'dave', 40),
      (5, 2, 'eve', 50)

  # ==========================================================================
  # GROUP BY context (existing functionality)
  # ==========================================================================

  - name: "GROUP_CONCAT with GROUP BY (default separator)"
    sql: "SELECT grp, GROUP_CONCAT(name) AS names FROM gc_test GROUP BY grp ORDER BY grp"
    expect:
      rows: 2

  - name: "GROUP_CONCAT with GROUP BY + SEPARATOR"
    sql: "SELECT grp, GROUP_CONCAT(name SEPARATOR '; ') AS names FROM gc_test GROUP BY grp ORDER BY grp"
    expect:
      rows: 2

  # ==========================================================================
  # OVER (PARTITION BY) — same value per partition (ordered=true → ORC needed)
  # ==========================================================================

  - name: "GROUP_CONCAT OVER (PARTITION BY grp)"
    sql: "SELECT id, grp, name, GROUP_CONCAT(name) OVER (PARTITION BY grp) AS all_names FROM gc_test ORDER BY id"
    expect:
      rows: 5

  # ==========================================================================
  # OVER (ORDER BY) — running concatenation (ordered=true)
  # ==========================================================================

  - name: "GROUP_CONCAT OVER (ORDER BY val) — running concat"
    sql: "SELECT id, name, GROUP_CONCAT(name) OVER (ORDER BY val) AS running_names FROM gc_test ORDER BY val"
    expect:
      rows: 5

  # ==========================================================================
  # OVER () — global concat
  # ==========================================================================

  - name: "GROUP_CONCAT OVER () — all names for every row"
    sql: "SELECT id, name, GROUP_CONCAT(name) OVER () AS all_names FROM gc_test ORDER BY id"
    expect:
      rows: 5

  # ==========================================================================
  # GROUP_CONCAT(... ORDER BY ...) — deterministic order inside each group
  # ==========================================================================

  - name: "Insert rows with NULL and duplicate names"
    sql: "INSERT INTO gc_test VALUES (6, 1, NULL, 60), (7, 2, 'dave', 70)"

  - name: "GROUP_CONCAT ORDER BY descending key with SEPARATOR"
    sql: "SELECT g.grp, GROUP_CONCAT(g.name ORDER BY g.val DESC SEPARATOR '|') AS names FROM gc_test g GROUP BY g.grp ORDER BY g.grp"
    expect:
      rows: 2
      data:
        - grp: 1
          names: "charlie|bob|alice"
        - grp: 2
          names: "dave|eve|dave"

  - name: "GROUP_CONCAT ORDER BY the concatenated value"
    sql: "SELECT grp, GROUP_CONCAT(name ORDER BY name) AS names FROM gc_test GROUP BY grp ORDER BY grp"
    expect:
      rows: 2
      data:
        - grp: 1
          names: "alice,bob,charlie"
        - grp: 2
          names: "dave,dave,eve"

  - name: "GROUP_CONCAT DISTINCT ORDER BY keeps each value once"
    sql: "SELECT grp, GROUP_CONCAT(DISTINCT name ORDER BY name DESC) AS names FROM gc_test GROUP BY grp ORDER BY grp"
    expect:
      rows: 2
      data:
        - grp: 1
          names: "charlie,bob,alice"
        - grp: 2
          names: "eve,dave"

  - name: "GROUP_CONCAT ORDER BY several keys sorts NULL keys last when descending"
    sql: "SELECT GROUP_CONCAT(id ORDER BY name DESC, id DESC) AS ids FROM gc_test"
    expect:
      rows: 1
      data:
        - ids: "5,7,4,3,2,1,6"

  - name: "GROUP_CONCAT ORDER BY over only NULL values is NULL"
    sql: "SELECT GROUP_CONCAT(name ORDER BY id) AS names FROM gc_test WHERE name IS NULL"
    expect:
      rows: 1
      data:
        - names: null

  # ==========================================================================
  # Cleanup
  # ==========================================================================

  - name: "Drop test table"
    sql: "DROP TABLE IF EXISTS gc_test"
