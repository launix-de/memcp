# Correlated scalar subqueries over grouped derived tables with an outer grouped
# domain. This exercises Neumann-style domain extension across multiple group
# stages without relying on app-specific table names.

metadata:
  version: "1.0"
  description: "Correlated scalar subquery across nested group domains"
  isolated: true

setup:

  - sql: CREATE TABLE cgd_range_event (id INT PRIMARY KEY,tenant INT,boundary INT,amount INT,code VARCHAR(8))
  - sql: CREATE TABLE cgd_range_parameter (request_id INT PRIMARY KEY,tenant INT,cut INT)
  - sql: INSERT INTO cgd_range_event VALUES (1,1,1,10,'first'),(2,1,10,20,'later'),(3,2,2,40,'second')
  - sql: INSERT INTO cgd_range_parameter VALUES (1,1,5),(2,1,15),(3,2,1),(4,2,5),(5,9,5),(6,1,NULL)

  - sql: "DROP TABLE IF EXISTS cgd_assignment"
  - sql: "DROP TABLE IF EXISTS cgd_document"
  - sql: "DROP TABLE IF EXISTS cgd_location"
  - sql: "DROP TABLE IF EXISTS cgd_state"
  - sql: "CREATE TABLE cgd_state (ID INT PRIMARY KEY, parent INT, grp INT)"
  - sql: "INSERT INTO cgd_state VALUES (1, NULL, 10), (2, 1, 10), (3, NULL, 20), (4, 1, 20), (5, 3, 20)"
  - sql: "CREATE TABLE cgd_document (ID INT PRIMARY KEY, location_id INT)"
  - sql: "CREATE TABLE cgd_location (ID INT PRIMARY KEY)"
  - sql: "CREATE TABLE cgd_assignment (ID INT PRIMARY KEY, actor_id INT, location_id INT)"
  - sql: "INSERT INTO cgd_location VALUES (1)"
  - sql: "INSERT INTO cgd_document VALUES (5, 1), (6, 1), (7, 1)"
  - sql: "INSERT INTO cgd_assignment VALUES (1, 42, 1)"

test_cases:

  - name: "set aggregate carrier session domain"
    session_id: "cgd_carrier"
    sql: "SET @actor_id = 42"
    expect:
      rows_affected: 0

  - name: "sibling SUM producers survive correlated probe lowering"
    session_id: "cgd_carrier"
    sql: |
      SELECT
        SUM(CASE TRUE WHEN TRUE THEN 1 ELSE 0 END) AS all_documents,
        SUM(CASE COALESCE((
          SELECT EXISTS(
            SELECT TRUE
            FROM cgd_assignment a
            WHERE a.actor_id = @actor_id
              AND a.location_id = l.ID
            LIMIT 1
          )
          FROM cgd_location l
          WHERE l.ID = cgd_document.location_id
          LIMIT 1
        ), FALSE) WHEN TRUE THEN 1 ELSE 0 END) AS permitted_documents
      FROM cgd_document
      WHERE ID IN (5, 6, 7)
    expect:
      rows: 1
      data:
        - all_documents: 3
          permitted_documents: 3

  - name: "warm literal-specialized carrier keeps every aggregate producer"
    session_id: "cgd_carrier"
    sql: |
      SELECT
        SUM(CASE COALESCE((
          SELECT EXISTS(
            SELECT TRUE
            FROM cgd_assignment a
            WHERE a.actor_id = @actor_id
              AND a.location_id = l.ID
            LIMIT 1
          )
          FROM cgd_location l
          WHERE l.ID = cgd_document.location_id
          LIMIT 1
        ), FALSE) WHEN TRUE THEN 1 ELSE 0 END) AS permitted_documents,
        SUM(CASE TRUE WHEN TRUE THEN 1 ELSE 0 END) AS all_documents
      FROM cgd_document
      WHERE ID IN (5, 6)
    expect:
      rows: 1
      data:
        - permitted_documents: 2
          all_documents: 2

  - name: "scalar subquery over grouped inner derived table"
    sql: |
      SELECT t.grp, COUNT(*) AS cnt, SUM(t.child_groups) AS child_groups
      FROM (
        SELECT s1.ID, s1.grp,
          COALESCE((SELECT COUNT(*)
            FROM (
              SELECT s2.parent, s2.grp, COUNT(*) AS cnt
              FROM cgd_state s2
              GROUP BY s2.parent, s2.grp
            ) g
            WHERE g.parent = s1.ID AND g.grp = s1.grp
          ), 0) AS child_groups
        FROM cgd_state s1
      ) t
      GROUP BY t.grp
      ORDER BY t.grp
    expect:
      rows: 2
      data:
        - grp: 10
          cnt: 2
          child_groups: 1
        - grp: 20
          cnt: 3
          child_groups: 1

  - name: "outer grouped domain feeds correlated grouped scalar subquery"
    sql: |
      SELECT o.grp,
        COALESCE((SELECT SUM(i.cnt)
          FROM (
            SELECT s2.parent, s2.grp, COUNT(*) AS cnt
            FROM cgd_state s2
            GROUP BY s2.parent, s2.grp
          ) i
          WHERE i.parent = o.sample_id AND i.grp = o.grp
        ), 0) AS score
      FROM (
        SELECT grp, MIN(ID) AS sample_id
        FROM cgd_state
        GROUP BY grp
      ) o
      ORDER BY o.grp
    expect:
      rows: 2
      data:
        - grp: 10
          score: 1
        - grp: 20
          score: 1
  - name: "outer grouped domain stays logical in EXPLAIN IR"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR SELECT o.grp,
        COALESCE((SELECT SUM(i.cnt)
          FROM (
            SELECT s2.parent, s2.grp, COUNT(*) AS cnt
            FROM cgd_state s2
            GROUP BY s2.parent, s2.grp
          ) i
          WHERE i.parent = o.sample_id AND i.grp = o.grp
        ), 0) AS score
      FROM (
        SELECT grp, MIN(ID) AS sample_id
        FROM cgd_state
        GROUP BY grp
      ) o
      ORDER BY o.grp
    expect:
      contains:
        - "\"_unn_"
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - "__mat:o:"
  - name: Grouped caller rows retain their own ordered scalar range boundaries
    syntax: tsql
    sql: |
      SELECT d.request_id,(SELECT TOP 1 e.code FROM cgd_range_event e
        WHERE e.tenant=d.tenant AND e.boundary<=d.cut ORDER BY e.boundary DESC) AS code
      FROM (SELECT request_id,tenant,MAX(cut) AS cut FROM cgd_range_parameter
        GROUP BY request_id,tenant) d ORDER BY d.request_id
    expect: {rows: 6,data: [{request_id: 1,code: first},{request_id: 2,code: later},
        {request_id: 3,code: null},{request_id: 4,code: second},{request_id: 5,code: null},{request_id: 6,code: null}]}

  - name: Grouped range bindings do not depend on caller alias spelling
    syntax: tsql
    sql: |
      SELECT __exists_parameters.request_id,(SELECT TOP 1 e.code FROM cgd_range_event e
        WHERE e.tenant=__exists_parameters.tenant AND e.boundary<=__exists_parameters.cut
        ORDER BY e.boundary DESC) AS code
      FROM (SELECT request_id,tenant,MAX(cut) AS cut FROM cgd_range_parameter
        GROUP BY request_id,tenant) __exists_parameters ORDER BY __exists_parameters.request_id
    expect: {rows: 6,data: [{request_id: 1,code: first},{request_id: 2,code: later},
        {request_id: 3,code: null},{request_id: 4,code: second},{request_id: 5,code: null},{request_id: 6,code: null}]}

  - name: Grouped caller rows retain scalar aggregate range values and empty sums
    syntax: tsql
    sql: |
      SELECT d.request_id,(SELECT SUM(e.amount) FROM cgd_range_event e
        WHERE e.tenant=d.tenant AND e.boundary<=d.cut) AS total
      FROM (SELECT request_id,tenant,MAX(cut) AS cut FROM cgd_range_parameter
        GROUP BY request_id,tenant) d ORDER BY d.request_id
    expect: {rows: 6,data: [{request_id: 1,total: 10},{request_id: 2,total: 30},
        {request_id: 3,total: null},{request_id: 4,total: 40},{request_id: 5,total: null},{request_id: 6,total: null}]}

  - name: Grouped caller rows retain zero counts for an empty correlated range
    syntax: tsql
    sql: |
      SELECT d.request_id,(SELECT COUNT(*) FROM cgd_range_event e
        WHERE e.tenant=d.tenant AND e.boundary<=d.cut) AS total
      FROM (SELECT request_id,tenant,MAX(cut) AS cut FROM cgd_range_parameter
        GROUP BY request_id,tenant) d ORDER BY d.request_id
    expect: {rows: 6,data: [{request_id: 1,total: 1},{request_id: 2,total: 2},
        {request_id: 3,total: 0},{request_id: 4,total: 1},{request_id: 5,total: 0},{request_id: 6,total: 0}]}

  - name: Aggregate payloads retain caller columns absent from inner predicates
    syntax: psql
    sql: |
      SELECT s.ID,(SELECT SUM(l.ID+s.grp) FROM cgd_location l) AS total
      FROM cgd_state s ORDER BY s.ID
    expect: {rows: 5,data: [{ID: 1,total: 11},{ID: 2,total: 11},
        {ID: 3,total: 21},{ID: 4,total: 21},{ID: 5,total: 21}]}

  - name: Nullable caller payloads preserve SQL aggregate null semantics
    syntax: psql
    sql: |
      SELECT s.ID,(SELECT SUM(l.ID+s.parent) FROM cgd_location l) AS total
      FROM cgd_state s ORDER BY s.ID
    expect: {rows: 5,data: [{ID: 1,total: null},{ID: 2,total: 2},
        {ID: 3,total: null},{ID: 4,total: 2},{ID: 5,total: 4}]}

  - name: Nullable payload domains retain inner rows for nonnull aggregate expressions
    syntax: psql
    sql: |
      SELECT s.ID,(SELECT SUM(l.ID+COALESCE(s.parent,10)) FROM cgd_location l) AS total
      FROM cgd_state s ORDER BY s.ID
    expect: {rows: 5,data: [{ID: 1,total: 11},{ID: 2,total: 2},
        {ID: 3,total: 11},{ID: 4,total: 2},{ID: 5,total: 4}]}

  - name: Aggregate counts distinguish nullable caller payloads from missing bindings
    syntax: psql
    sql: |
      SELECT s.ID,(SELECT COUNT(l.ID+s.parent) FROM cgd_location l) AS total
      FROM cgd_state s ORDER BY s.ID
    expect: {rows: 5,data: [{ID: 1,total: 0},{ID: 2,total: 1},
        {ID: 3,total: 0},{ID: 4,total: 1},{ID: 5,total: 1}]}

  - name: sql global empty input retains count and sum identities
    syntax: sql
    sql: SELECT COUNT(*) AS matches,SUM(amount) AS total FROM cgd_range_event WHERE
      tenant=9
    expect:
      rows: 1
      data:
      - matches: 0
        total: null
  - name: sql global nonempty input retains count and sum identities
    syntax: sql
    sql: SELECT COUNT(*) AS matches,SUM(amount) AS total FROM cgd_range_event WHERE
      tenant=1
    expect:
      rows: 1
      data:
      - matches: 2
        total: 30
  - name: sql correlated empty inputs retain count zero and sum NULL
    syntax: sql
    sql: "SELECT p.request_id,\n  (SELECT COUNT(*) FROM cgd_range_event e\n    WHERE\
      \ e.tenant=p.tenant AND e.boundary<=p.cut) AS matches,\n  (SELECT SUM(e.amount)\
      \ FROM cgd_range_event e\n    WHERE e.tenant=p.tenant AND e.boundary<=p.cut) AS\
      \ total\nFROM cgd_range_parameter p ORDER BY p.request_id"
    expect:
      rows: 6
      data:
      - request_id: 1
        matches: 1
        total: 10
      - request_id: 2
        matches: 2
        total: 30
      - request_id: 3
        matches: 0
        total: null
      - request_id: 4
        matches: 1
        total: 40
      - request_id: 5
        matches: 0
        total: null
      - request_id: 6
        matches: 0
        total: null
  - name: psql global empty input retains count and sum identities
    syntax: psql
    sql: SELECT COUNT(*) AS matches,SUM(amount) AS total FROM cgd_range_event WHERE
      tenant=9
    expect:
      rows: 1
      data:
      - matches: 0
        total: null
  - name: psql global nonempty input retains count and sum identities
    syntax: psql
    sql: SELECT COUNT(*) AS matches,SUM(amount) AS total FROM cgd_range_event WHERE
      tenant=1
    expect:
      rows: 1
      data:
      - matches: 2
        total: 30
  - name: psql correlated empty inputs retain count zero and sum NULL
    syntax: psql
    sql: "SELECT p.request_id,\n  (SELECT COUNT(*) FROM cgd_range_event e\n    WHERE\
      \ e.tenant=p.tenant AND e.boundary<=p.cut) AS matches,\n  (SELECT SUM(e.amount)\
      \ FROM cgd_range_event e\n    WHERE e.tenant=p.tenant AND e.boundary<=p.cut) AS\
      \ total\nFROM cgd_range_parameter p ORDER BY p.request_id"
    expect:
      rows: 6
      data:
      - request_id: 1
        matches: 1
        total: 10
      - request_id: 2
        matches: 2
        total: 30
      - request_id: 3
        matches: 0
        total: null
      - request_id: 4
        matches: 1
        total: 40
      - request_id: 5
        matches: 0
        total: null
      - request_id: 6
        matches: 0
        total: null
  - name: tsql global empty input retains count and sum identities
    syntax: tsql
    sql: SELECT COUNT(*) AS matches,SUM(amount) AS total FROM cgd_range_event WHERE
      tenant=9
    expect:
      rows: 1
      data:
      - matches: 0
        total: null
  - name: tsql global nonempty input retains count and sum identities
    syntax: tsql
    sql: SELECT COUNT(*) AS matches,SUM(amount) AS total FROM cgd_range_event WHERE
      tenant=1
    expect:
      rows: 1
      data:
      - matches: 2
        total: 30
  - name: tsql correlated empty inputs retain count zero and sum NULL
    syntax: tsql
    sql: "SELECT p.request_id,\n  (SELECT COUNT(*) FROM cgd_range_event e\n    WHERE\
      \ e.tenant=p.tenant AND e.boundary<=p.cut) AS matches,\n  (SELECT SUM(e.amount)\
      \ FROM cgd_range_event e\n    WHERE e.tenant=p.tenant AND e.boundary<=p.cut) AS\
      \ total\nFROM cgd_range_parameter p ORDER BY p.request_id"
    expect:
      rows: 6
      data:
      - request_id: 1
        matches: 1
        total: 10
      - request_id: 2
        matches: 2
        total: 30
      - request_id: 3
        matches: 0
        total: null
      - request_id: 4
        matches: 1
        total: 40
      - request_id: 5
        matches: 0
        total: null
      - request_id: 6
        matches: 0
        total: null

cleanup:
  - sql: DROP TABLE IF EXISTS cgd_range_parameter
  - sql: DROP TABLE IF EXISTS cgd_range_event
  - sql: "DROP TABLE IF EXISTS cgd_assignment"
  - sql: "DROP TABLE IF EXISTS cgd_document"
  - sql: "DROP TABLE IF EXISTS cgd_location"
  - sql: "DROP TABLE IF EXISTS cgd_state"
