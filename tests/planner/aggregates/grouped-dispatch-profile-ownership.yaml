              (output "scoped" (get_assoc row "scoped")))))
          (lambda args (output "headers" (+ (output "headers") 1))))
        (list (output "rows") (output "headers") (output "total") (output "scoped")))))
      (try (lambda () (begin
        (define public (capture nil))
        (tx_begin_acid session) (define tx (session "__memcp_tx"))
