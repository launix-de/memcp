      (define execute_fixture_write (lambda (actual_session actual_tx database command)
        (sql_execute_formula actual_session actual_tx
          (cached_parse (newcachemap) "sql" (list parse_sql) database command nil "root" actual_session false actual_tx)
          (lambda (_row) (error "fixture write unexpectedly emitted a row"))
          (lambda args true)))) (session "username" "root")
      (define scope (new_relation_scope session)) (define name (concat "." (uuid) "#mixed-dispatch-input"))
      (createtable "memcp-tests" name (list (list "column" "value" "INT" (list) (list)))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (insert (table "memcp-tests" false name false nil) (list "value") (list (list 7)))
      (define query "SELECT (SELECT SUM(value) FROM dispatch_profile_marker) AS total")
      (define scoped_query (concat "SELECT (SELECT SUM(value) FROM `" name "`) AS scoped"))
      (define factory (lambda (schema text policy planning tx)
        (list '!begin (parse_sql schema text policy planning tx) (parse_sql schema scoped_query policy planning tx))))
      (define formula (cached_parse (newcachemap) "sql" (list factory) "memcp-tests" query nil "root" session false nil))
      (define capture (lambda (tx) (begin
        (define output (newsession)) (output "rows" 0) (output "headers" 0)
        (sql_execute_formula session tx formula
          (lambda (row) (begin (output "rows" (+ (output "rows") 1))
