- name: A managed scoped scalar program binds and drains fresh local writes on every
    invocation
  tds:
    statements:
    - connection: owner
      sql: DROP FUNCTION IF EXISTS dbo.dispatch_profile_local
    - connection: owner
      sql: CREATE FUNCTION dbo.dispatch_profile_local(@n INT) RETURNS INT AS BEGIN
        DECLARE @rows TABLE(value INT); DECLARE @total INT; INSERT INTO @rows(value)
        SELECT @n; INSERT INTO @rows(value) SELECT @n+1; SELECT @total=SUM(value)
        FROM @rows; RETURN @total; END
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: SELECT dbo.dispatch_profile_local(4) AS value
      expect:
        columns:
        - value
        rows: 1
        data:
        - value: 9
    - connection: owner
      sql: SELECT dbo.dispatch_profile_local(7) AS value
      expect:
        columns:
        - value
        rows: 1
        data:
        - value: 15
    - connection: owner
      sql: SELECT dbo.dispatch_profile_local(4) AS value
      expect:
        columns:
        - value
        rows: 1
        data:
        - value: 9
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: owner
      sql: SELECT @@TRANCOUNT AS depth,XACT_STATE() AS state
      expect:
        rows: 1
        data:
        - depth: 0
          state: 0
    - connection: owner
      sql: DROP FUNCTION IF EXISTS dbo.dispatch_profile_local
