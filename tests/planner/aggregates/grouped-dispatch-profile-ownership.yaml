        (close_relation_scope scope)
        (list public private restored (nil? (table "memcp-tests" false name false nil)))))
        (lambda (failure) (begin
          (try (lambda () (tx_rollback session)) (lambda (_cleanup_failure) true))
          (try (lambda () (close_relation_scope scope)) (lambda (_cleanup_failure) true))
