- name: Guarded invocation-lifetime input with nil Tx stays in its existing shared
    map and binds each fresh native scope
  scm: |-
    (begin
      (define session (newsession)) (session "username" "root")
      (define cache (newcachemap))
      (define name (concat "." (uuid) "#dispatch-input"))
      (define query (concat "SELECT (SELECT SUM(value) FROM `" name "`) AS total,(SELECT COUNT(*) FROM `" name "`) AS n"))
      (define live (newsession))
      (define create_input (lambda (value) (begin
        (define scope (new_relation_scope session)) (live "scope" scope)
        (createtable "memcp-tests" name (list (list "column" "value" "INT" (list) (list)))
          (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
        (define input (table "memcp-tests" false name false nil))
        (insert input (list "value") (list (list value))) input)))
      (define capture (lambda (kernel_fn) (begin
        (define output (newsession)) (output "rows" 0) (output "headers" 0)
        (sql_execute_formula session nil kernel_fn
          (lambda (row) (begin (output "rows" (+ (output "rows") 1))
            (output "total" (get_assoc row "total")) (output "n" (get_assoc row "n"))))
          (lambda args (output "headers" (+ (output "headers") 1))))
        (list (output "rows") (output "headers") (output "total") (output "n")))))
      (try (lambda () (begin
        (define first (create_input 7)) (define first_address (table_address first nil))
        (define declarations (show first "declarations" nil))
        (define formula (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" session false nil))
        (define cold (capture formula)) (define warm (capture formula))
        (close_relation_scope (live "scope")) (live "scope" nil)
        (define second (create_input 13)) (define second_address (table_address second nil))
        (define rebound (capture formula)) (define rebound_warm (capture formula))
        (close_relation_scope (live "scope")) (live "scope" nil)
        (list (tx_requires_query_local_cache nil)
          (equal? (declarations "lifetime") "invocation")
          (not (expression_equal? first_address second_address))
          cold warm rebound rebound_warm
          (nil? (table "memcp-tests" false name false nil)))))
        (lambda (failure) (begin
          (try (lambda () (if (nil? (live "scope")) true (close_relation_scope (live "scope"))))
            (lambda (_cleanup_failure) true))
          (error failure)))))
  expect:
    result:
    - false
    - true
    - true
    - - 1
      - 1
      - 7
      - 1
    - - 1
      - 1
      - 7
      - 1
    - - 1
      - 1
      - 13
      - 1
    - - 1
      - 1
      - 13
      - 1
    - true
- name: A stale managed profile rejects all guard aliases before binding producers
    headers or rows even with zero preparations
  scm: |-
    (begin
      (define session (newsession))
      /* Execute through the ordinary compiled SQL interface: planning arguments
      do not bind the emitted runtime session/tx symbols for a later raw EVAL. */
      (define execute_fixture_write (lambda (actual_session actual_tx database command)
        (sql_execute_formula actual_session actual_tx
          (cached_parse (newcachemap) "sql" (list parse_sql) database command nil "root" actual_session false actual_tx)
          (lambda (_row) (error "fixture write unexpectedly emitted a row"))
          (lambda args true)))) (session "username" "root")
      (define effects (newsession)) (effects "bindings" 0) (effects "rows" 0) (effects "headers" 0)
      (session "__fixture_profile_effect" (lambda () (effects "bindings" (+ (effects "bindings") 1))))
      (define planning (sql_queryplan_compile_session session nil nil (list 'physical-dispatch-owner (newcachemap) "sql")))
      (define tail (list 'begin (list (list 'session "__fixture_profile_effect")) true))
      (sql_queryplan_register_input_alternatives planning false (list true (list) true)
        (list tail (list) true) (list true (list) true) (list false))
      (define records (sql_queryplan_input_alternatives planning))
      (define guard (sql_queryplan_compile_formula nil (list 'physical-query-program (list '__physical_input_context)
        (sql_queryplan_input_guard records true false))))
      (define eligible (sql_queryplan_compile_formula nil (list 'physical-query-program (list '__physical_input_context)
        (sql_queryplan_input_admission records))))
      (define program (sql_queryplan_compile_formula nil (list 'physical-query-program (list '__physical_input_context)
        (list 'begin (list 'resultfields (list 'quote (list "accepted")))
          (list 'resultrow (list 'list "accepted" 7))))))
      (define info (list (list 'physical_input_profile true) (list 'caller_lifetime false)
        (list 'input_program program) (list 'input_guard guard) (list 'input_source_eligibility eligible)
        (list 'source_eligibility (sql_queryplan_wrap_input_formula nil eligible false))))
      (define variant (list (sql_queryplan_wrap_input_formula nil guard false)
        (sql_queryplan_wrap_input_formula nil program false) (list) info))
      (define dispatch (sql_queryplan_compile_formula nil
        (list 'call_with_invocation_group_lifetime
          (list 'lambda (list '__physical_input_scopes '__physical_input_initializers '__physical_input_observations)
            (sql_queryplan_formula_dispatch (list variant) (make_structural_catalog 'ast) (list 'quote "not-admitted"))))))
      (define run (lambda (actual_tx) (sql_execute_formula session actual_tx dispatch
        (lambda (_row) (effects "rows" (+ (effects "rows") 1)))
        (lambda args (effects "headers" (+ (effects "headers") 1))))))
      (run nil)
      (define public (list (effects "bindings") (effects "rows") (effects "headers")))
      (effects "bindings" 0) (effects "rows" 0) (effects "headers" 0)
      (tx_begin_acid session) (define tx (session "__memcp_tx"))
      (try (lambda () (begin
        (execute_fixture_write session tx "memcp-tests" "UPDATE dispatch_profile_marker SET value=9 WHERE id=1")
        (define outcome (run tx))
        (define aliases (call_with_invocation_group_lifetime (lambda (groups initializers observations) (begin
          (define context (sql_queryplan_input_context variant tx (list groups initializers observations)))
          (list ((car variant) session tx (lambda (_row) true) (lambda args true))
            ((qassoc_get info 'source_eligibility nil) session tx (lambda (_row) true) (lambda args true))
            (sql_queryplan_apply_input (sql_queryplan_guard_kernel variant) variant session tx (lambda (_row) true) (lambda args true) context)
            (sql_queryplan_apply_input (sql_queryplan_eligibility_kernel variant) variant session tx (lambda (_row) true) (lambda args true) context))))))
        (define source (table "memcp-tests" false "dispatch_profile_marker" false tx))
        (define access (list 372734710317056 (scan_boundary "equal" "id" 0 0 true true "" false) "value"))
        (define own (scan_lookup tx source access (list 1))) (define observer (scan_lookup nil source access (list 1)))
        (tx_rollback session)
        (list public outcome aliases (effects "bindings") (effects "rows") (effects "headers") own observer
          (scan_lookup nil (table "memcp-tests" false "dispatch_profile_marker" false nil) access (list 1)))))
        (lambda (failure) (begin
          (try (lambda () (tx_rollback session)) (lambda (_cleanup_failure) true))
          (error failure)))))
