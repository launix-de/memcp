- name: Native cache owner is reselected on entering the real compile lock before
    touching old entry guards
  scm: |-
    (begin
      (define session (req "__session")) (session "username" "root")
      (define state (newsession)) (state "old_guards" 0) (state "old_preparations" 0) (state "old_program" 0) (state "old_headers" 0) (state "entered" 0) (state "rows" 0) (state "headers" 0)
      (define base_cache (newcachemap)) (define owner_context (list 'physical-dispatch-owner base_cache "sql"))
      (define query "SELECT (SELECT SUM(value) FROM dispatch_profile_marker) AS total,(SELECT COUNT(*) FROM dispatch_profile_marker) AS n")
      (define key (sql_queryplan_cache_key "root" "memcp-tests" query (fnv_hash query)))
      (with_query_request session (req "__session_state") (req "__query_seq") "native profile changes during cache lock acquisition" "cursor-stability"
        (lambda (statement) (statement "native profile changes during cache lock acquisition" false (lambda (tx)
          (try (lambda () (begin
            /* This is the actual HTTP request's native owner, not a new Session
            map with nil connection state. Refuse before any effects if absent. */
            (if (> (tx_connection_id tx) 0) true (error "acquisition control requires its native request session"))
            (define before (tx_requires_query_local_cache tx))
            (define formula (cached_parse base_cache "sql" (list parse_sql) "memcp-tests" query nil "root" session false tx))
            (define entry (car (base_cache key)))
            (define native_lock (entry "compile_lock"))
            (define guarded (map (entry "variants") (lambda (variant) (begin
              (define old_guard (sql_queryplan_guard_kernel variant))
              (define old_eligible (sql_queryplan_eligibility_kernel variant))
              (define old_program (sql_queryplan_program_kernel variant))
              (define counted_program (lambda (session tx row fields context) (begin
                (state "old_program" (+ (state "old_program") 1))
                (sql_queryplan_apply_input old_program variant session tx row
                  (lambda args (begin (state "old_headers" (+ (state "old_headers") 1)) (apply fields args))) context))))
              (define old_preparations (append (nth variant 2)
                (list "acquisition-old-preparation"
                  (list (lambda () (begin (state "old_preparations" (+ (state "old_preparations") 1)) 1))) 1)))
              (define count_guard (lambda (session tx row fields context) (begin
