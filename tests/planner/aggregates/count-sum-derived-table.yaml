#
# COUNT(*) + SUM over a derived table with scalar subselects.
# Triggers NthLocalVar index out of range when the inner derived table
# contains correlated scalar subselects that are Neumann-decorrelated.

metadata:
  version: "1.0"
  description: "COUNT + SUM over derived table with scalar subselects"

setup:
  - sql: "DROP TABLE IF EXISTS csd_main"
  - sql: "DROP TABLE IF EXISTS csd_detail"
  - sql: "CREATE TABLE csd_main (ID INT PRIMARY KEY, name TEXT, hours INT)"
  - sql: "CREATE TABLE csd_detail (ID INT PRIMARY KEY, parent INT, val INT)"
  - sql: "INSERT INTO csd_main VALUES (1, 'Alice', 10), (2, 'Bob', 20), (3, 'Carol', 30)"
  - sql: "INSERT INTO csd_detail VALUES (1, 1, 100), (2, 1, 200), (3, 2, 300)"

test_cases:

  - name: "COUNT + SUM over simple derived table"
    sql: |
      SELECT COUNT(*) AS cnt, SUM(t.hours) AS total FROM (
        SELECT ID, name, hours FROM csd_main
      ) t
    expect:
      rows: 1
      data:
        - cnt: 3
          total: 60

  - name: "COUNT + SUM over derived table with scalar subselect"
    sql: |
      SELECT COUNT(*) AS cnt, SUM(t.total_val) AS grand_total FROM (
        SELECT m.ID AS ID,
          COALESCE((SELECT SUM(d.val) FROM csd_detail d WHERE d.parent = m.ID), 0) AS total_val
        FROM csd_main m
      ) t
    expect:
      rows: 1
      data:
        - cnt: 3
          grand_total: 600

  - name: "COUNT + SUM with EXISTS in derived table"
    sql: |
      SELECT COUNT(*) AS cnt, SUM(t.hours) AS total FROM (
        SELECT m.ID AS ID, m.hours AS hours,
          EXISTS (SELECT 1 FROM csd_detail d WHERE d.parent = m.ID) AS has_detail
        FROM csd_main m
      ) t
    expect:
      rows: 1
      data:
        - cnt: 3
          total: 60

  - name: "EXPLAIN IR prunes unused scalar payload from COUNT(*) derived table"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT COUNT(*) AS cnt FROM (
        SELECT m.ID AS ID,
          COALESCE((SELECT SUM(d.val) FROM csd_detail d WHERE d.parent = m.ID), 0) AS total_val,
          EXISTS (SELECT 1 FROM csd_detail d2 WHERE d2.parent = m.ID) AS has_detail
        FROM csd_main m
      ) t
    expect:
      contains:
        - '"kind": "tables", "value": "((\"t\\u0000m\" \"memcp-tests\" \"csd_main\" false nil))"'
        - '"kind": "fields", "value": "(\"cnt\" (aggregate 1 + 0))"'
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - 'total_val'
        - 'has_detail'
        - 'csd_detail'

  - name: "EXPLAIN IR keeps non-window derived aggregates flattened"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT COUNT(*) AS cnt, SUM(t.total_val) AS grand_total FROM (
        SELECT m.ID AS ID,
          COALESCE((SELECT SUM(d.val) FROM csd_detail d WHERE d.parent = m.ID), 0) AS total_val
        FROM csd_main m
      ) t
    expect:
      contains:
        - "\"m\" \"memcp-tests\" \"csd_main\" false nil"
        - "(stage-output"
        - "(purpose scalar_aggregate)"
        - "(domain ((get_column \"m\" true \"ID\" true)))"
        - "(aggregate 1 + 0)"
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - "__mat:"
        - "(scan"

  - name: "Joined COUNT preserves duplicate matches and outer NULL rows"
    sql: |
      SELECT COUNT(*) AS cnt FROM csd_main m
      LEFT JOIN csd_detail d ON d.parent = m.ID
      LEFT JOIN csd_detail e ON e.parent = m.ID
    expect:
      rows: 1
      data: [{cnt: 6}]

  - name: "Joined COUNT preserves filtered outer matches"
    sql: |
      SELECT COUNT(*) AS cnt FROM csd_main m
      LEFT JOIN csd_detail d ON d.parent = m.ID AND d.val > 100
    expect:
      rows: 1
      data: [{cnt: 3}]

  - name: "Joined COUNT of nullable values keeps its own NULL semantics"
    sql: |
      SELECT COUNT(d.ID) AS cnt FROM csd_main m
      LEFT JOIN csd_detail d ON d.parent = m.ID
    expect:
      rows: 1
      data: [{cnt: 3}]

  - name: "Session-domain joined COUNT preserves multiplicity"
    session_id: joined-count-domain
    setup:
      - sql: SET @count_domain = 7
    sql: |
      SELECT @count_domain AS domain_key, COUNT(*) AS cnt
      FROM csd_main m LEFT JOIN csd_detail d ON d.parent = m.ID
      LEFT JOIN csd_detail e ON e.parent = m.ID
      GROUP BY @count_domain
    expect:
      rows: 1
      data: [{domain_key: 7, cnt: 6}]

  - name: "Cached joined COUNT reads the current session domain"
    session_id: joined-count-domain
    setup:
      - sql: SET @count_domain = 8
    sql: |
      SELECT @count_domain AS domain_key, COUNT(*) AS cnt
      FROM csd_main m LEFT JOIN csd_detail d ON d.parent = m.ID
      LEFT JOIN csd_detail e ON e.parent = m.ID
      GROUP BY @count_domain
    expect:
      rows: 1
      data: [{domain_key: 8, cnt: 6}]

  - name: "Empty joined global COUNT retains its zero result"
    sql: |
      SELECT COUNT(*) AS cnt FROM csd_main m
      LEFT JOIN csd_detail d ON d.parent = m.ID WHERE m.ID < 0
    expect:
      rows: 1
      data: [{cnt: 0}]

  - name: "HAVING remains after session-domain joined aggregation"
    session_id: joined-count-domain
    sql: |
      SELECT @count_domain AS domain_key, COUNT(*) AS cnt
      FROM csd_main m LEFT JOIN csd_detail d ON d.parent = m.ID
      GROUP BY @count_domain HAVING COUNT(*) > 4
    expect: {rows: 0}

  - name: "Joined COUNT rejects ungrouped row-dependent output"
    sql: |
      SELECT m.name, COUNT(*) AS cnt FROM csd_main m
      LEFT JOIN csd_detail d ON d.parent = m.ID
    expect: {error: true}

cleanup:
  - sql: "DROP TABLE IF EXISTS csd_main"
  - sql: "DROP TABLE IF EXISTS csd_detail"
