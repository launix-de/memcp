metadata:
  syntax: tsql
  isolated: true
  description: Aggregate query probes retain directly bound scoped program inputs
setup:
- sql: CREATE TABLE udf_compile_ids(id INT PRIMARY KEY)
- sql: INSERT udf_compile_ids VALUES(1),(2),(3)
- sql: CREATE TABLE udf_compile_amounts(id INT,month_id INT,amount INT,PRIMARY KEY(id,month_id))
- sql: "INSERT udf_compile_amounts(id,month_id,amount) VALUES\n  (1,1,1),(1,2,2),(1,3,3),(1,4,4),(1,5,5),(1,6,6),\n\
    \  (1,7,7),(1,8,8),(1,9,9),(1,10,10),(1,11,11),(1,12,12),\n  (2,1,NULL),(2,2,NULL),(2,3,NULL),(2,4,NULL),(2,5,NULL),(2,6,NULL),\n\
    \  (2,7,NULL),(2,8,NULL),(2,9,NULL),(2,10,NULL),(2,11,NULL),(2,12,NULL)\n"
- sql: "CREATE FUNCTION dbo.udf_compile_leaf(@id INT,@month INT) RETURNS INT AS BEGIN\n\
    \  DECLARE @part INT;\n  SELECT @part=SUM(amount) FROM udf_compile_amounts WHERE\
    \ id=@id AND month_id<=@month;\n  RETURN @part;\nEND"
- sql: "CREATE FUNCTION dbo.udf_compile_total(@id INT,@month INT) RETURNS INT AS BEGIN\n\
    \  DECLARE @total INT=0,@iteration INT=1,@part INT;\n  WHILE @iteration<=2 BEGIN\n\
    \    SELECT @part=dbo.udf_compile_leaf(@id,@month) FROM udf_compile_ids WHERE\
    \ id=@id;\n    SET @total=@total+ISNULL(@part,0);\n    SELECT @part=SUM(amount)\
    \ FROM udf_compile_amounts WHERE id=@id AND month_id<=@month;\n    SET @total=@total+ISNULL(@part,0);\n\
    \    SELECT @part=SUM(amount) FROM udf_compile_amounts WHERE id=@id AND month_id<=@month;\n\
    \    SET @total=@total+ISNULL(@part,0);\n    SET @iteration=@iteration+1;\n  END;\n\
    \  RETURN @total;\nEND"
- sql: CREATE VIEW udf_compile_view_1 AS SELECT id,dbo.udf_compile_total(id,1) AS
    c0 FROM udf_compile_ids
- sql: CREATE FUNCTION dbo.udf_compile_no_from(@id INT) RETURNS INT AS BEGIN DECLARE
    @part INT; SELECT @part=dbo.udf_compile_leaf(@id,1); RETURN @part; END
test_cases:
- name: Unchanged leaf consuming results
  sql: SELECT id,dbo.udf_compile_leaf(id,1) AS c0 FROM udf_compile_ids ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      c0: 1
    - id: 2
      c0: null
    - id: 3
      c0: null
- name: Unchanged total consuming results
  sql: SELECT id,dbo.udf_compile_total(id,1) AS c0 FROM udf_compile_ids ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      c0: 6
    - id: 2
      c0: 0
    - id: 3
      c0: 0
- name: Unchanged view consuming results
  sql: SELECT id,c0 FROM udf_compile_view_1 ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      c0: 6
    - id: 2
      c0: 0
    - id: 3
      c0: 0
- name: An empty caller relation does not invent a function invocation row
  sql: SELECT id,dbo.udf_compile_total(id,1) AS c0 FROM udf_compile_ids WHERE id<0
  expect:
    rows: 0
    data: []
- name: A FROM-less nested assignment preserves its NULL-bearing invocation domain
  sql: SELECT id,dbo.udf_compile_no_from(id) AS c0 FROM udf_compile_ids ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      c0: 1
    - id: 2
      c0: null
    - id: 3
      c0: null
cleanup:
- sql: DROP VIEW IF EXISTS udf_compile_view_1
- sql: DROP FUNCTION IF EXISTS dbo.udf_compile_no_from,dbo.udf_compile_total,dbo.udf_compile_leaf
- sql: DROP TABLE IF EXISTS udf_compile_amounts
- sql: DROP TABLE IF EXISTS udf_compile_ids
