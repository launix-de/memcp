- name: Regional guard misses preserve complete private results and emit one header
    after admission
  scm: "(begin\n  (define cache (newcachemap)) (define state (newsession))\n  (define\
    \ session (newsession)) (session \"username\" \"root\")\n  (state \"contract\"\
    \ 1) (state \"compiled\" (list))\n  (tx_begin_acid session) (define tx (session\
    \ \"__memcp_tx\"))\n  (try (lambda () (begin\n    (eval (parse_sql \"memcp-tests\"\
    \ \"UPDATE grouped_private_marker SET value=9 WHERE id=1\" nil session tx))\n\
    \    (define parser (lambda (schema query policy planning actual_tx) (begin\n\
    \      (define contract (state \"contract\"))\n      (state \"compiled\" (append\
    \ (state \"compiled\") contract))\n      (planner_record_guard_condition\n   \
    \     (list 'equal? (list state \"contract\") contract) planning)\n      (parse_sql\
    \ schema query policy planning actual_tx))))\n    (define query \"SELECT (SELECT\
    \ SUM(value) FROM grouped_private_marker) AS total,(SELECT COUNT(*) FROM grouped_private_marker)\
    \ AS n\")\n    (define formula (cached_parse cache \"sql\" (list parser (list\
    \ \"exact_guards\" true))\n      \"memcp-tests\" query nil \"root\" session false\
    \ tx))\n    (define observed (map (list 1 2 3 2 1) (lambda (contract) (begin\n\
    \      (state \"contract\" contract)\n      (define result (newsession)) (result\
    \ \"rows\" 0) (result \"headers\" 0)\n      /* Retain the first dispatcher. Its\
    \ miss must recheck newer variants;\n      failed regions must never publish partial\
    \ or duplicate metadata. */\n      (sql_execute_formula session tx formula\n \
    \       (lambda (row) (begin\n          (result \"rows\" (+ (result \"rows\")\
    \ 1))\n          (result \"total\" (row \"total\")) (result \"n\" (row \"n\"))))\n\
    \        (lambda args (result \"headers\" (+ (result \"headers\") 1))))\n    \
    \  (list (result \"rows\") (result \"headers\") (result \"total\") (result \"\
    n\"))))))\n    (define contracts (map (list 1 2 3) (lambda (contract) (contains?\
    \ (state \"compiled\") contract))))\n    (tx_rollback session)\n    (list observed\
    \ contracts)))\n    (lambda (failure) (begin (tx_rollback session) (error failure)))))"
  expect:
    result:
    - - &id001
        - 1
        - 1
        - 9
        - 2
      - *id001
      - *id001
      - *id001
      - *id001
    - - true
      - true
      - true
