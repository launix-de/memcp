metadata:
  syntax: sql
  isolated: true
  requires_tds: true
  requires_mysql: true
  description: Whole retained-stage producers and consumers preserve original private
    views
setup:
- sql: DROP TABLE IF EXISTS grouped_private_rebind
- sql: DROP TABLE IF EXISTS grouped_private_marker
- sql: CREATE TABLE grouped_private_marker(id INT PRIMARY KEY,value INT NULL)
- sql: INSERT INTO grouped_private_marker VALUES(1,0),(2,NULL)
cleanup:
- sql: DROP TABLE IF EXISTS grouped_private_rebind
- sql: DROP TABLE IF EXISTS grouped_private_marker
test_cases:
- name: Doomed CATCH reads the original grouped private value before same-batch rollback
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT ON
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE grouped_private_marker SET value=9 WHERE id=1
    - connection: owner
      sql: "BEGIN TRY\n  THROW 51009,N'grouped-private-control',1;\nEND TRY\nBEGIN\
        \ CATCH\n  SELECT ERROR_NUMBER() AS number,@@TRANCOUNT AS depth,XACT_STATE()\
        \ AS state,\n    (SELECT value FROM grouped_private_marker WHERE id=1) AS\
        \ value,\n    (SELECT COUNT(*) FROM grouped_private_marker) AS n;\n  ROLLBACK\
        \ TRANSACTION;\nEND CATCH"
      expect:
        rows: 1
        data:
        - number: 51009
          depth: 1
          state: -1
          value: 9
          n: 2
    - connection: owner
      sql: SET XACT_ABORT OFF
    - connection: owner
      sql: SELECT id,value FROM grouped_private_marker ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 0
        - id: 2
          value: null
- name: Cold warm and savepoint scalar cells follow original writes while the observer
    stays committed
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE grouped_private_marker SET value=9 WHERE id=1
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 9
          n: 2
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 9
          n: 2
    - connection: observer
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 0
          n: 2
    - connection: owner
      sql: SAVE TRANSACTION grouped_private_saved
    - connection: owner
      sql: UPDATE grouped_private_marker SET value=12 WHERE id=1
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 12
          n: 2
    - connection: owner
      sql: ROLLBACK TRANSACTION grouped_private_saved
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 9
          n: 2
    - connection: owner
      sql: UPDATE grouped_private_marker SET value=11 WHERE id=1
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 11
          n: 2
    - connection: observer
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 0
          n: 2
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 0
          n: 2
    - connection: owner
      sql: SELECT @@TRANCOUNT AS depth,XACT_STATE() AS state
      expect:
        rows: 1
        data:
        - depth: 0
          state: 0
- name: Independent and dependent retained groups share a coherent private view
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE grouped_private_marker SET value=9 WHERE id=1
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS first_value,(SELECT
        COUNT(*) FROM grouped_private_marker WHERE value IS NOT NULL) AS nonnull_rows,(SELECT
        SUM(value) FROM grouped_private_marker WHERE id <= (SELECT MAX(id) FROM grouped_private_marker
        WHERE value IS NOT NULL)) AS nested_total
      expect:
        rows: 1
        data:
        - first_value: 9
          nonnull_rows: 1
          nested_total: 9
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 0
          n: 2
- name: Private grouped cells distinguish empty NULL zero and duplicate operands
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: INSERT INTO grouped_private_marker VALUES(3,0),(4,0)
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=2) AS null_value,(SELECT
        value FROM grouped_private_marker WHERE id=99) AS absent_value,(SELECT value
        FROM grouped_private_marker WHERE id=3) AS zero_value,(SELECT COUNT(*) FROM
        grouped_private_marker) AS bag_rows,(SELECT COUNT(value) FROM grouped_private_marker)
        AS value_rows,(SELECT SUM(value) FROM grouped_private_marker) AS total,(SELECT
        COUNT(DISTINCT value) FROM grouped_private_marker) AS distinct_values
      expect:
        rows: 1
        data:
        - null_value: null
          absent_value: null
          zero_value: 0
          bag_rows: 4
          value_rows: 3
          total: 0
          distinct_values: 1
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: owner
      sql: SELECT (SELECT value FROM grouped_private_marker WHERE id=1) AS value,(SELECT
        COUNT(*) FROM grouped_private_marker) AS n
      expect:
        rows: 1
        data:
        - value: 0
          n: 2
- name: An ordinary committed scalar keeps complete shared-view results
