- name: Nil transaction group observations survive one bounded attempt chain and retire
    after the whole dispatch
  scm: "(begin\n  (define packet (call_with_invocation_group_lifetime (lambda (scope_input\
    \ initializer_input observation_input) (begin\n    (define registry (scope_input))\
    \ (define initializers (initializer_input))\n    (define session (newsession))\
    \ (define scope (new_relation_scope session))\n    (define name (concat \".\"\
    \ (uuid) \"#group-owner-control\"))\n    (createtable \"memcp-tests\" name (list\
    \ (list \"column\" \"value\" \"INT\" (list) (list)))\n      (list \"engine\" \"\
    memory\" \"ephemeral\" true \"scope\" scope) false nil)\n    (define source (table\
    \ \"memcp-tests\" false name false nil))\n    (insert source (list \"value\")\
    \ (list (list 7)))\n    (registry \"observation\" scope) (initializers \"source\"\
    \ true)\n    (define read (lambda () (scan nil source (list) (list) (list) (lambda\
    \ () true)\n      (list \"value\") (lambda (acc value) (+ acc value)) 0 +)))\n\
    \    /* Each admission has returned before the next attempt. Only the existing\n\
    \    query-owned native observation lifetime crosses that boundary. */\n    (define\
    \ first (with_cache_sources nil (list source) read read))\n    (define second\
    \ (with_cache_sources nil (list source) read read))\n    (list source name first\
    \ second (expression_equal? registry (scope_input))\n      ((initializer_input)\
    \ \"source\"))))))\n  (define retired (try (lambda () (begin\n    (scan nil (car\
    \ packet) (list) (list) (list) (lambda () true)\n      (list \"value\") (lambda\
    \ (acc value) (+ acc value)) 0 +) false))\n    (lambda (_failure) true)))\n  (list\
    \ (nth packet 2) (nth packet 3) (nth packet 4) (nth packet 5)\n    (nil? (table\
    \ \"memcp-tests\" false (cadr packet) false nil)) retired))"
  expect:
    result:
    - 7
    - 7
    - true
    - true
    - true
    - true
