# GROUP BY SUM Test Suite

metadata:
  version: "1.0"
  description: "Validate SELECT a, SUM(b) FROM tbl GROUP BY a"

setup:
  - sql: "DROP TABLE IF EXISTS tbl"
  - sql: "DROP TABLE IF EXISTS aggregate_identity"
  - sql: "CREATE TABLE tbl (a INT, b INT)"
  - sql: "CREATE TABLE aggregate_identity (id INT, grp INT, value INT)"
  - sql: |
      INSERT INTO tbl (a, b) VALUES
      (1, 10), (1, 20), (2, 5), (3, 7)
  - sql: |
      INSERT INTO aggregate_identity (id, grp, value) VALUES
      (1, 1, NULL), (2, 1, NULL),
      (3, 2, NULL), (4, 2, 5), (5, 2, 7)

  - sql: "DROP TABLE IF EXISTS group_fact"
  - sql: "DROP TABLE IF EXISTS group_dimension"
  - sql: "CREATE TABLE group_fact (id INT PRIMARY KEY, grp INT, category INT, value INT)"
  - sql: "CREATE TABLE group_dimension (id INT PRIMARY KEY, label INT)"
  - sql: "INSERT INTO group_fact VALUES (1, 1, 10, 100), (2, 1, 20, 200), (3, 2, 30, 300), (4, 2, 99, 400)"
  - sql: "INSERT INTO group_dimension VALUES (10, 10), (20, 20), (30, 30)"

test_cases:
  - name: "Group sum by a (exact query)"
    sql: "SELECT a, SUM(b) FROM tbl GROUP BY a"
    expect:
      rows: 3

  - name: "Group sum by a with ORDER"
    sql: "SELECT a, SUM(b) AS s FROM tbl GROUP BY a ORDER BY a"
    expect:
      rows: 3
      data:
        - a: 1
          s: 30
        - a: 2
          s: 5
        - a: 3
          s: 7

  - name: "Grouped order reads the physical keytable"
    sql: "EXPLAIN SELECT a, SUM(b) AS s FROM tbl GROUP BY a ORDER BY a LIMIT 2"
    expect:
      rows: 1
      result_contains:
        - "group_cache_create"
        - ".grp:"
        - "group_insert_batches"
        - "scan_order"
      result_not_contains:
        - "scan_group_into"
        - "assoc_keys_as_dataset_rows"
        - "assoc_keys_values_as_dataset_rows"
        - "(sort rows"

  - name: "Group by modulo expression"
    sql: "SELECT a % 2 AS g, COUNT(*) AS c, SUM(b) AS s FROM tbl GROUP BY a % 2"
    expect:
      rows: 2

  - name: "Group by modulo across main and delta"
    setup:
      - sql: "DROP TABLE IF EXISTS tbl_mix"
      - sql: "CREATE TABLE tbl_mix (a INT, b INT)"
      - sql: |
          INSERT INTO tbl_mix (a, b) VALUES
          (1, 10), (2, 20), (3, 30), (4, 40)
      - scm: "(rebuild (table \"memcp-tests\" \"tbl_mix\"))"
      - sql: |
          INSERT INTO tbl_mix (a, b) VALUES
          (5, 50), (6, 60), (7, 70), (8, 80)
    sql: "SELECT a % 2 AS g, COUNT(*) AS c, SUM(b) AS s FROM tbl_mix GROUP BY a % 2 ORDER BY a % 2"
    expect:
      rows: 2
      data:
        - g: 0
          c: 4
          s: 200
        - g: 1
          c: 4
          s: 160

  - name: "Empty aggregate input keeps COUNT and SUM identities distinct"
    sql: |
      SELECT COUNT(value) AS row_count, SUM(value) AS total, AVG(value) AS average
      FROM aggregate_identity
      WHERE id < 0
    expect:
      rows: 1
      data:
        - row_count: 0
          total: null
          average: null

  - name: "SUM ignores NULL values and remains NULL for an all-NULL group"
    sql: |
      SELECT grp, COUNT(value) AS row_count, SUM(value) AS total, AVG(value) AS average
      FROM aggregate_identity
      GROUP BY grp
      ORDER BY grp
    expect:
      rows: 2
      data:
        - grp: 1
          row_count: 0
          total: null
          average: null
        - grp: 2
          row_count: 2
          total: 12
          average: 6

  # Non-grouped output values may choose a member of the group. They must
  # never create additional groups; assertions deliberately do not pick a
  # deterministic label where SQL leaves the representative unspecified.
  - name: Joined output columns preserve explicit group cardinality
    sql: |
      SELECT f.grp, d.label, COUNT(*) AS n, SUM(f.value) AS total
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      GROUP BY f.grp ORDER BY f.grp
    expect:
      rows: 2
      data: [{grp: 1, n: 2, total: 300}, {grp: 2, n: 2, total: 700}]

  - name: Derived joined output preserves groups and window percentages
    sql: |
      SELECT grp, label, COUNT(*) AS n, SUM(value) AS total,
        COUNT(*) * 100 / GREATEST(SUM(COUNT(*)) OVER (), 1) AS percent
      FROM (
        SELECT f.grp, f.value, d.label
        FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      ) rows_with_label
      GROUP BY grp ORDER BY grp LIMIT 2
    expect:
      rows: 2
      data: [{grp: 1, n: 2, total: 300, percent: 50}, {grp: 2, n: 2, total: 700, percent: 50}]

  - name: Derived scalar lookup output is a representative rather than a key
    sql: |
      SELECT grp, label, COUNT(*) AS n, SUM(value) AS total,
        COUNT(*) * 100 / GREATEST(SUM(COUNT(*)) OVER (), 1) AS percent
      FROM (
        SELECT f.grp, f.value,
          (SELECT d.label FROM group_dimension d WHERE d.id = f.category LIMIT 1) AS label
        FROM group_fact f
      ) rows_with_label
      GROUP BY grp ORDER BY grp LIMIT 2
    expect:
      rows: 2
      data: [{grp: 1, n: 2, total: 300, percent: 50}, {grp: 2, n: 2, total: 700, percent: 50}]

  - name: Derived representative retains a computed explicit grouping key
    sql: |
      SELECT grp + 10 AS bucket, label, COUNT(*) AS n, SUM(value) AS total
      FROM (
        SELECT f.grp, f.value,
          (SELECT d.label FROM group_dimension d WHERE d.id = f.category LIMIT 1) AS label
        FROM group_fact f
      ) rows_with_label
      GROUP BY grp + 10 ORDER BY grp + 10
    expect:
      rows: 2
      data: [{bucket: 11, n: 2, total: 300}, {bucket: 12, n: 2, total: 700}]

  - name: Joined representative output does not move HAVING before grouping
    sql: |
      SELECT f.grp, d.label, COUNT(*) AS n, SUM(f.value) AS total
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      GROUP BY f.grp HAVING COUNT(*) > 1 ORDER BY f.grp LIMIT 1 OFFSET 1
    expect:
      rows: 1
      data: [{grp: 2, n: 2, total: 700}]

  - name: Joined output columns do not partition a global aggregate
    sql: |
      SELECT d.label, COUNT(*) AS n, SUM(f.value) AS total
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
    expect:
      rows: 1
      data: [{n: 4, total: 1000}]

  - name: Set first representative grouping session
    session_id: group_representatives
    sql: SELECT @cap := 4 AS cap
    expect: {rows: 1, data: [{cap: 4}]}

  - name: Session-filtered joined output preserves groups
    session_id: group_representatives
    sql: |
      SELECT f.grp, d.label, COUNT(*) AS n, SUM(f.value) AS total
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      WHERE f.id <= @cap GROUP BY f.grp ORDER BY f.grp
    expect:
      rows: 2
      data: [{grp: 1, n: 2, total: 300}, {grp: 2, n: 2, total: 700}]

  - name: Change representative grouping session
    session_id: group_representatives
    sql: SELECT @cap := 2 AS cap
    expect: {rows: 1, data: [{cap: 2}]}

  - name: Session-filtered joined output respects changed bindings
    session_id: group_representatives
    sql: |
      SELECT f.grp, d.label, COUNT(*) AS n, SUM(f.value) AS total
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      WHERE f.id <= @cap GROUP BY f.grp ORDER BY f.grp
    expect:
      rows: 1
      data: [{grp: 1, n: 2, total: 300}]

  - name: Representative joined values belong to their group
    sql: |
      SELECT grp, CASE WHEN grp = 1 THEN label IN (10, 20)
        ELSE label = 30 OR label IS NULL END AS member, n
      FROM (
        SELECT f.grp, d.label, COUNT(*) AS n
        FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
        GROUP BY f.grp
      ) grouped_rows ORDER BY grp
    expect:
      rows: 2
      data: [{grp: 1, member: 1, n: 2}, {grp: 2, member: 1, n: 2}]

  - name: Compound grouped expressions keep keys and aggregate their local outputs
    sql: |
      SELECT f.grp + COUNT(*) AS combined, d.label + COUNT(*) AS representative,
        COUNT(*) AS n
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      GROUP BY f.grp ORDER BY f.grp
    expect:
      rows: 2
      data: [{combined: 3, n: 2}, {combined: 4, n: 2}]

  - name: Explicit joined grouping keys remain distinct
    sql: |
      SELECT f.grp, d.label, COUNT(*) AS n
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      GROUP BY f.grp, d.label ORDER BY f.grp, d.label
    expect:
      rows: 4
      data: [{grp: 1, label: 10, n: 1}, {grp: 1, label: 20, n: 1},
        {grp: 2, label: null, n: 1}, {grp: 2, label: 30, n: 1}]

  - name: Empty global join aggregate retains its neutral row
    sql: |
      SELECT d.label, COUNT(*) AS n, SUM(f.value) AS total
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      WHERE f.id < 0
    expect:
      rows: 1
      data: [{label: null, n: 0, total: null}]

  - name: Missing joined output columns remain errors
    sql: |
      SELECT f.grp, d.missing, COUNT(*) AS n
      FROM group_fact f LEFT JOIN group_dimension d ON d.id = f.category
      GROUP BY f.grp
    expect: {error: true}

cleanup:
  - sql: "DROP TABLE IF EXISTS tbl"
  - sql: "DROP TABLE IF EXISTS tbl_mix"
  - sql: "DROP TABLE IF EXISTS aggregate_identity"
  - sql: "DROP TABLE IF EXISTS group_fact"
  - sql: "DROP TABLE IF EXISTS group_dimension"
