metadata:
  version: "1.0"
  description: "Group stage corner cases: limits in subqueries, DISTINCT+joins, nested staging"

test_cases:
  # --- Setup: two related tables ---
  - name: "Create orders table"
    sql: "CREATE TABLE gs_orders (id INT PRIMARY KEY, customer VARCHAR(50), amount INT, priority INT)"

  - name: "Create items table"
    sql: "CREATE TABLE gs_items (id INT PRIMARY KEY, order_id INT, product VARCHAR(50), qty INT)"

  - name: "Create customers table"
    sql: "CREATE TABLE gs_customers (id INT PRIMARY KEY, name VARCHAR(50))"

  - name: "Create grouped membership candidate table"
    sql: "CREATE TABLE gs_candidates (id INT PRIMARY KEY, order_id INT, qty INT)"

  - name: "Insert orders"
    sql: |
      INSERT INTO gs_orders (id, customer, amount, priority) VALUES
        (1, 'Alice', 100, 3),
        (2, 'Bob', 200, 1),
        (3, 'Alice', 150, 2),
        (4, 'Charlie', 300, 1),
        (5, 'Bob', 50, 2),
        (6, 'Alice', 250, 1)

  - name: "Insert items"
    sql: |
      INSERT INTO gs_items (id, order_id, product, qty) VALUES
        (1, 1, 'Widget', 2),
        (2, 1, 'Gadget', 1),
        (3, 2, 'Widget', 5),
        (4, 3, 'Gadget', 3),
        (5, 3, 'Doohickey', 1),
        (6, 4, 'Widget', 10),
        (7, 5, 'Gadget', 2),
        (8, 6, 'Doohickey', 4),
        (9, 6, 'Widget', 1)

  - name: "Insert customers"
    sql: |
      INSERT INTO gs_customers (id, name) VALUES
        (1, 'Alice'),
        (2, 'Bob'),
        (3, 'Charlie'),
        (4, 'Dana')

  - name: "Insert grouped membership candidates"
    sql: |
      INSERT INTO gs_candidates (id, order_id, qty) VALUES
        (1, 1, 1), (2, 1, 2), (3, 3, 1), (4, 6, 4)

  - name: "Create unordered group lookup tables"
    sql: "CREATE TABLE gs_parts (id INT, category VARCHAR(20))"

  - name: "Create unordered group bridge"
    sql: "CREATE TABLE gs_sources (part_id INT, source_id INT)"

  - name: "Create unordered anti-membership table"
    sql: "CREATE TABLE gs_blocked_sources (source_id INT, blocked BOOLEAN)"

  - name: "Insert unordered group lookup rows"
    sql: "INSERT INTO gs_parts VALUES (1, 'A'), (2, 'A'), (3, 'B')"

  - name: "Insert unordered group bridge rows"
    sql: |
      INSERT INTO gs_sources VALUES
        (1, 10), (1, 11), (1, 12),
        (2, 11), (2, 13),
        (3, 20), (3, 21)

  - name: "Insert unordered anti-membership rows"
    sql: "INSERT INTO gs_blocked_sources VALUES (20, TRUE), (21, FALSE)"

  # =================================================================
  # 1. GROUP BY inside FROM subquery (derived table with aggregation)
  # =================================================================
  - name: "Derived table with GROUP BY"
    sql: |
      SELECT t.customer, t.total
      FROM (SELECT customer, SUM(amount) AS total FROM gs_orders GROUP BY customer) t
      ORDER BY t.total DESC
    expect:
      rows: 3
      data:
        - customer: "Alice"
          total: 500
        - customer: "Charlie"
          total: 300
        - customer: "Bob"
          total: 250

  # =================================================================
  # 2. LIMIT 1 + ORDER BY inside FROM subquery (top-1 per group pattern)
  # =================================================================
  - name: "Derived table with ORDER BY and LIMIT 1"
    sql: |
      SELECT t.customer, t.amount
      FROM (SELECT customer, amount FROM gs_orders ORDER BY amount DESC LIMIT 1) t
    expect:
      rows: 1
      data:
        - customer: "Charlie"
          amount: 300

  - name: "Derived table ORDER BY LIMIT 2 with outer ORDER BY"
    sql: |
      SELECT t.customer, t.amount
      FROM (SELECT customer, amount FROM gs_orders ORDER BY amount DESC LIMIT 3) t
      ORDER BY t.amount ASC
    expect:
      rows: 3
      data:
        - customer: "Bob"
          amount: 200
        - customer: "Alice"
          amount: 250
        - customer: "Charlie"
          amount: 300

  # =================================================================
  # 3. Nested LIMIT: LIMIT in subquery + LIMIT in outer
  # =================================================================
  - name: "Nested LIMIT: inner LIMIT 4, outer LIMIT 2"
    sql: |
      SELECT t.customer, t.amount
      FROM (SELECT customer, amount FROM gs_orders ORDER BY amount DESC LIMIT 4) t
      ORDER BY t.amount ASC
      LIMIT 2
    expect:
      rows: 2
      data:
        - customer: "Alice"
          amount: 150
        - customer: "Bob"
          amount: 200

  # =================================================================
  # 4. GROUP BY in FROM subquery + outer ORDER BY
  # =================================================================
  - name: "Aggregated subquery with outer ORDER BY and LIMIT"
    sql: |
      SELECT t.customer, t.cnt
      FROM (SELECT customer, COUNT(*) AS cnt FROM gs_orders GROUP BY customer) t
      ORDER BY t.cnt DESC
      LIMIT 2
    expect:
      rows: 2
      data:
        - customer: "Alice"
          cnt: 3
        - customer: "Bob"
          cnt: 2

  - name: "Aggregate alias remains bound in a downstream join"
    sql: |
      SELECT c.id, latest.max_order_id, selected.id AS selected_id
      FROM gs_customers c
      LEFT JOIN (
        SELECT customer, MAX(id) AS max_order_id
        FROM gs_orders
        GROUP BY customer
      ) latest ON latest.customer = c.name
      LEFT JOIN gs_orders selected ON latest.max_order_id = selected.id
      ORDER BY c.id
    expect:
      rows: 4
      data:
        - id: 1
          max_order_id: 6
          selected_id: 6
        - id: 2
          max_order_id: 5
          selected_id: 5
        - id: 3
          max_order_id: 4
          selected_id: 4
        - id: 4
          max_order_id: null
          selected_id: null

  - name: "Direct grouped join costs one key probe per outer row"
    sql: |
      EXPLAIN PHYSICAL
      SELECT c.id, totals.total_amount
      FROM gs_customers c
      LEFT JOIN (
        SELECT customer, SUM(amount) AS total_amount
        FROM gs_orders
        GROUP BY customer
      ) totals ON totals.customer = c.name
      ORDER BY c.id
    expect:
      rows: 1
      result_contains:
        - "decision direct_group_join"
        - "probe_invocations 4"

  - name: "Direct grouped join calibration emits both requested operators"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE
      SELECT c.id, totals.total_amount
      FROM gs_customers c
      LEFT JOIN (
        SELECT customer, SUM(amount) AS total_amount
        FROM gs_orders
        GROUP BY customer
      ) totals ON totals.customer = c.name
      ORDER BY c.id
    expect:
      rows: 2
      result_contains:
        - '"plan": "group_carrier"'
        - '"plan": "direct_group_join"'
        - '"operator_consistent": true'
        - '"result_equal": true'
      result_not_contains:
        - '"operator_consistent": false'
        - '"result_equal": false'

  - name: "Outer GROUP BY on aggregate alias from left-joined derived table"
    sql: |
      SELECT order_count, COUNT(*) AS customer_count
      FROM (
        SELECT c.id, COUNT(o.id) AS order_count
        FROM gs_customers c
        LEFT OUTER JOIN gs_orders o
          ON o.customer = c.name
         AND o.customer NOT LIKE '%Nobody%'
        GROUP BY c.id
      ) customer_orders (customer_id, order_count)
      GROUP BY order_count
      ORDER BY customer_count DESC, order_count DESC
    expect:
      rows: 4
      data:
        - order_count: 3
          customer_count: 1
        - order_count: 2
          customer_count: 1
        - order_count: 1
          customer_count: 1
        - order_count: 0
          customer_count: 1

  - name: "Derived table rejects more column aliases than outputs"
    sql: "SELECT renamed FROM (SELECT id FROM gs_customers) customer_ids (renamed, extra)"
    expect:
      error: true

  # =================================================================
  # 5. COUNT(DISTINCT) with JOIN
  # =================================================================
  - name: "COUNT DISTINCT on joined column"
    sql: |
      SELECT o.customer, COUNT(DISTINCT i.product) AS products
      FROM gs_orders o
      JOIN gs_items i ON i.order_id = o.id
      GROUP BY o.customer
      ORDER BY o.customer
    expect:
      rows: 3
      data:
        - customer: "Alice"
          products: 3
        - customer: "Bob"
          products: 2
        - customer: "Charlie"
          products: 1

  - name: "COUNT DISTINCT ordered by aggregate after anti-membership join"
    sql: |
      SELECT p.category, COUNT(DISTINCT s.source_id) AS source_count
      FROM gs_sources s, gs_parts p
      WHERE p.id = s.part_id
        AND s.source_id NOT IN (
          SELECT blocked.source_id
          FROM gs_blocked_sources blocked
          WHERE blocked.blocked = TRUE
      )
      GROUP BY p.category
      ORDER BY source_count DESC, p.category
    expect:
      rows: 2
      data:
        - category: "A"
          source_count: 4
        - category: "B"
          source_count: 1

  # =================================================================
  # 6. COUNT(DISTINCT) with WHERE + JOIN
  # =================================================================
  - name: "COUNT DISTINCT joined with WHERE filter"
    sql: |
      SELECT o.customer, COUNT(DISTINCT i.product) AS products
      FROM gs_orders o
      JOIN gs_items i ON i.order_id = o.id
      WHERE o.amount >= 150
      GROUP BY o.customer
      ORDER BY o.customer
    expect:
      rows: 3
      data:
        - customer: "Alice"
          products: 3
        - customer: "Bob"
          products: 1
        - customer: "Charlie"
          products: 1

  - name: "COUNT DISTINCT preserves joined identifiers across shards"
    setup:
      - scm: '(settings "ShardSize" 32)'
      - sql: "CREATE TABLE gs_distinct_entities (id BIGINT PRIMARY KEY, state VARCHAR(20))"
      - sql: "CREATE TABLE gs_distinct_attributes (attribute_id BIGINT PRIMARY KEY, entity_id BIGINT, attribute_key VARCHAR(40))"
      - sql: |
          INSERT INTO gs_distinct_entities VALUES
            (1000001, 'active')
      - sql: |
          INSERT INTO gs_distinct_attributes VALUES
            (1, 1000001, 'alpha'), (2, 1000001, 'beta')
      - sql: |
          SELECT a.attribute_key, COUNT(DISTINCT a.entity_id) AS entities_found
          FROM gs_distinct_attributes a
          INNER JOIN gs_distinct_entities e ON e.id = a.entity_id
          WHERE e.state = 'active'
          GROUP BY a.attribute_key
      - scm: |
          (begin
            (define rows (produceN 127 (lambda (i) (list (+ i 1000002) "active"))))
            (insert (table "memcp-tests" "gs_distinct_entities") '("id" "state") rows '() (lambda () true) false))
      - scm: |
          (begin
            (define rows (produceN 254 (lambda (i)
              (list (+ i 3)
                    (+ (floor (/ i 2)) 1000002)
                    (if (equal? (mod i 2) 0) "alpha" "beta")))))
            (insert (table "memcp-tests" "gs_distinct_attributes") '("attribute_id" "entity_id" "attribute_key") rows '() (lambda () true) false))
      - sql: "SELECT COUNT(*) AS n FROM gs_distinct_entities WHERE id > 0"
      - sql: "SELECT COUNT(*) AS n FROM gs_distinct_attributes WHERE entity_id > 0"
      - scm: '(rebuild (table "memcp-tests" "gs_distinct_entities") true true)'
      - scm: '(rebuild (table "memcp-tests" "gs_distinct_attributes") true true)'
      - scm: '(settings "ShardSize" 60000)'
    sql: |
      SELECT a.attribute_key,
             COUNT(*) AS rows_found,
             COUNT(DISTINCT a.entity_id) AS entities_found
      FROM gs_distinct_attributes a
      INNER JOIN gs_distinct_entities e ON e.id = a.entity_id
      WHERE e.state = 'active'
      GROUP BY a.attribute_key
      HAVING COUNT(*) >= 2
      ORDER BY a.attribute_key
    expect:
      rows: 2
      data:
        - attribute_key: "alpha"
          rows_found: 128
          entities_found: 128
        - attribute_key: "beta"
          rows_found: 128
          entities_found: 128
    cleanup:
      - sql: "DROP TABLE IF EXISTS gs_distinct_attributes"
      - sql: "DROP TABLE IF EXISTS gs_distinct_entities"
      - scm: '(settings "ShardSize" 60000)'

  # =================================================================
  # 7. Scalar subquery with COUNT(DISTINCT)
  # =================================================================
  - name: "Scalar subquery returning COUNT DISTINCT"
    sql: |
      SELECT (SELECT COUNT(DISTINCT product) FROM gs_items) AS total_products
    expect:
      rows: 1
      data:
        - total_products: 3

  # =================================================================
  # 8. GROUP BY with scalar subquery in SELECT
  # =================================================================
  - name: "Loose GROUP BY with correlated scalar subquery is rejected"
    sql: |
      SELECT o.customer,
             COUNT(*) AS order_cnt,
             (SELECT SUM(qty) FROM gs_items i WHERE i.order_id = o.id) AS item_qty
      FROM gs_orders o
      GROUP BY o.customer
      ORDER BY o.customer
    expect:
      error: true

  # =================================================================
  # 9. Aggregated subquery in JOIN
  # =================================================================
  - name: "JOIN with aggregated derived table"
    sql: |
      SELECT o.customer, o.amount, t.total_qty
      FROM gs_orders o
      JOIN (SELECT order_id, SUM(qty) AS total_qty FROM gs_items GROUP BY order_id) t ON t.order_id = o.id
      ORDER BY o.id
    expect:
      rows: 6
      data:
        - customer: "Alice"
          amount: 100
          total_qty: 3
        - customer: "Bob"
          amount: 200
          total_qty: 5
        - customer: "Alice"
          amount: 150
          total_qty: 4
        - customer: "Charlie"
          amount: 300
          total_qty: 10
        - customer: "Bob"
          amount: 50
          total_qty: 2
        - customer: "Alice"
          amount: 250
          total_qty: 5

  # =================================================================
  # 10. COUNT(DISTINCT) with ORDER BY DESC + LIMIT
  # =================================================================
  - name: "COUNT DISTINCT with ORDER BY aggregate and LIMIT"
    sql: |
      SELECT customer, COUNT(DISTINCT amount) AS uniq_amounts
      FROM gs_orders
      GROUP BY customer
      ORDER BY COUNT(DISTINCT amount) DESC
      LIMIT 2
    expect:
      rows: 2
      data:
        - customer: "Alice"
          uniq_amounts: 3
        - customer: "Bob"
          uniq_amounts: 2

  # =================================================================
  # 11. Multiple different aggregates in same query (ORDER BY expression, not alias)
  # =================================================================
  - name: "Mixed aggregates SUM COUNT with GROUP BY ORDER"
    sql: |
      SELECT customer, SUM(amount) AS total, COUNT(*) AS cnt
      FROM gs_orders
      GROUP BY customer
      ORDER BY SUM(amount) DESC
    expect:
      rows: 3
      data:
        - customer: "Alice"
          total: 500
          cnt: 3
        - customer: "Charlie"
          total: 300
          cnt: 1
        - customer: "Bob"
          total: 250
          cnt: 2

  # =================================================================
  # 12. GROUP BY with HAVING + ORDER BY + LIMIT combined
  # =================================================================
  - name: "GROUP BY HAVING ORDER LIMIT together"
    sql: |
      SELECT customer, SUM(amount) AS total
      FROM gs_orders
      GROUP BY customer
      HAVING SUM(amount) > 200
      ORDER BY SUM(amount) ASC
      LIMIT 1
    expect:
      rows: 1
      data:
        - customer: "Bob"
          total: 250

  # =================================================================
  # 13. Subquery with LIMIT 1 in WHERE (scalar subselect)
  # =================================================================
  - name: "WHERE with LIMIT 1 subquery"
    sql: |
      SELECT customer, amount
      FROM gs_orders
      WHERE amount = (SELECT amount FROM gs_orders ORDER BY amount DESC LIMIT 1)
    expect:
      rows: 1
      data:
        - customer: "Charlie"
          amount: 300

  # =================================================================
  # 14. Outer ORDER BY on column from aggregated subquery in JOIN
  # =================================================================
  - name: "Outer ORDER BY on aggregated JOIN column"
    sql: |
      SELECT o.customer, o.amount, t.total_qty
      FROM gs_orders o
      JOIN (SELECT order_id, SUM(qty) AS total_qty FROM gs_items GROUP BY order_id) t ON t.order_id = o.id
      ORDER BY t.total_qty DESC
      LIMIT 3
    expect:
      rows: 3
      data:
        - customer: "Charlie"
          amount: 300
          total_qty: 10
        - customer: "Bob"
          amount: 200
          total_qty: 5
        - customer: "Alice"
          amount: 250
          total_qty: 5

  # =================================================================
  # 15. Ungrouped aggregates over an empty join still return one row
  # =================================================================
  - name: "SUM over empty join returns NULL"
    sql: |
      SELECT SUM(i.qty) AS total
      FROM gs_orders o
      JOIN gs_items i ON i.order_id = o.id
      WHERE o.id < 0
    expect:
      rows: 1
      data:
        - total: null

  - name: "COUNT over empty join returns zero"
    sql: |
      SELECT COUNT(*) AS total
      FROM gs_orders o
      JOIN gs_items i ON i.order_id = o.id
      WHERE o.id < 0
    expect:
      rows: 1
      data:
        - total: 0

  # =================================================================
  # 16. Nested stages are prepared once by their consuming main group
  # =================================================================
  - name: "Grouped membership feeding an outer group prepares once"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'gs_candidates'"
    sql: |
      SELECT o.customer, SUM(i.qty) AS total_qty
      FROM gs_orders o
      JOIN gs_items i ON i.order_id = o.id
      WHERE o.id IN (
        SELECT c.order_id
        FROM gs_candidates c
        GROUP BY c.order_id
        HAVING SUM(c.qty) > 2
      )
      GROUP BY o.customer
    expect:
      rows: 1
      data:
        - customer: "Alice"
          total_qty: 8

  - name: "Nested grouped membership scanned its input once"
    sql: |
      SELECT COUNT(*) AS scans
      FROM `system_statistic`.`scans`
      WHERE `schema` = 'memcp-tests' AND `table` = 'gs_candidates'
    expect:
      rows: 1
      data:
        - scans: 1
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  # =================================================================
  # 17. A costed star join can select fused reduction without a cold prejoin
  # =================================================================
  - name: "Create selective dimension fact reduction fixture"
    setup:
      - sql: "CREATE TABLE gs_star_driver (id INT PRIMARY KEY, name VARCHAR(20)) ENGINE=memory"
      - sql: "CREATE TABLE gs_star_d1 (id INT PRIMARY KEY, label VARCHAR(20)) ENGINE=memory"
      - sql: "CREATE TABLE gs_star_d2 (id INT PRIMARY KEY, label VARCHAR(20)) ENGINE=memory"
      - sql: "CREATE TABLE gs_star_d3 (id INT PRIMARY KEY, label VARCHAR(20)) ENGINE=memory"
      - sql: "CREATE TABLE gs_star_d4 (id INT PRIMARY KEY, label VARCHAR(20)) ENGINE=memory"
      - sql: "CREATE TABLE gs_star_facts (id INT, driver_id INT, d1_id INT, d2_id INT, d3_id INT, d4_id INT, amount INT) ENGINE=memory"
      - scm: |
          (begin
            (insert (table "memcp-tests" "gs_star_driver") '("id" "name")
              (map (produceN 8) (lambda (i)
                (list (+ i 1) (if (equal? i 0) "selected" (concat "other-" i))))))
            (define dimension_rows (map (produceN 100) (lambda (i)
              (list (+ i 1) (concat "dimension-" i)))))
            (insert (table "memcp-tests" "gs_star_d1") '("id" "label") dimension_rows)
            (insert (table "memcp-tests" "gs_star_d2") '("id" "label") dimension_rows)
            (insert (table "memcp-tests" "gs_star_d3") '("id" "label") dimension_rows)
            (insert (table "memcp-tests" "gs_star_d4") '("id" "label") dimension_rows)
            (insert (table "memcp-tests" "gs_star_facts")
              '("id" "driver_id" "d1_id" "d2_id" "d3_id" "d4_id" "amount")
              (map (produceN 100000) (lambda (i)
                (list (+ i 1) (+ 1 (mod i 8))
                  (+ 1 (mod i 100)) (+ 1 (mod (+ i 1) 100))
                  (+ 1 (mod (+ i 2) 100)) (+ 1 (mod (+ i 3) 100)) 1))))
            (rebuild)
            true)
    sql: |
      SELECT SUM(f.amount) AS total
      FROM gs_star_facts f
      JOIN gs_star_d1 d1 ON f.d1_id = d1.id
      JOIN gs_star_d2 d2 ON f.d2_id = d2.id
      JOIN gs_star_driver driver ON f.driver_id = driver.id
      JOIN gs_star_d3 d3 ON f.d3_id = d3.id
      JOIN gs_star_d4 d4 ON f.d4_id = d4.id
      WHERE driver.name = 'selected'
    expect:
      rows: 1
      data:
        - total: 12500

  - name: "Large selective star reduction chooses costed joined scan"
    sql: |
      EXPLAIN PHYSICAL
      SELECT SUM(f.amount) AS total
      FROM gs_star_facts f
      JOIN gs_star_d1 d1 ON f.d1_id = d1.id
      JOIN gs_star_d2 d2 ON f.d2_id = d2.id
      JOIN gs_star_driver driver ON f.driver_id = driver.id
      JOIN gs_star_d3 d3 ON f.d3_id = d3.id
      JOIN gs_star_d4 d4 ON f.d4_id = d4.id
      WHERE driver.name = 'selected'
    expect:
      rows: 1
      result_contains:
        - "unordered_join_reduce"
        - "chosen scan_join_order"
        - "legacy_join_tree"

cleanup:
  - sql: "DROP TABLE IF EXISTS gs_star_facts"
  - sql: "DROP TABLE IF EXISTS gs_star_d4"
  - sql: "DROP TABLE IF EXISTS gs_star_d3"
  - sql: "DROP TABLE IF EXISTS gs_star_d2"
  - sql: "DROP TABLE IF EXISTS gs_star_d1"
  - sql: "DROP TABLE IF EXISTS gs_star_driver"
  - sql: "DROP TABLE IF EXISTS gs_blocked_sources"
  - sql: "DROP TABLE IF EXISTS gs_sources"
  - sql: "DROP TABLE IF EXISTS gs_parts"
  - sql: "DROP TABLE IF EXISTS gs_customers"
  - sql: "DROP TABLE IF EXISTS gs_candidates"
  - sql: "DROP TABLE IF EXISTS gs_items"
  - sql: "DROP TABLE IF EXISTS gs_orders"
