- name: Explicit caller grouping retains empty-set cardinality separately from scalar aggregate defaults
  sql: |-
    SELECT d.ord,d.x,p.category,
      (SELECT COALESCE(SUM((SELECT h.quantity FROM caller_binding_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)),7)
        FROM caller_binding_entities e WHERE (p.category IS NULL OR e.category=p.category)
          AND COALESCE((SELECT h.end_value FROM caller_binding_history h
            WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x
        GROUP BY d.x) AS grouped_value,
      (SELECT COALESCE(SUM((SELECT h.quantity FROM caller_binding_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)),7)
        FROM caller_binding_entities e WHERE (p.category IS NULL OR e.category=p.category)
          AND COALESCE((SELECT h.end_value FROM caller_binding_history h
            WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x) AS scalar_value
    FROM caller_binding_coordinates d CROSS JOIN caller_binding_categories p
    ORDER BY d.ord,p.category
  expect:
    rows: 40
