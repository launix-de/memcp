metadata:
  version: "1.0"
  description: "Segmented reusable group caches for overlapping range aggregates"
  isolated: true
  perf_ci: true

setup:
  - sql: "DROP TABLE IF EXISTS grc_windows"
  - sql: "DROP TABLE IF EXISTS grc_events"
  - sql: "CREATE TABLE grc_events (id INT PRIMARY KEY, tenant_id INT, happened_at INT, amount INT) ENGINE=memory"
  - sql: "CREATE TABLE grc_windows (id INT PRIMARY KEY, tenant_id INT, range_from INT, range_to INT) ENGINE=memory"
  - scm: |
      (begin
        (insert (table "memcp-tests" "grc_events")
          '("id" "tenant_id" "happened_at" "amount")
          (map (produceN 6000) (lambda (i)
            (list (+ i 1) (+ 1 (mod i 2)) i 2))))
        (insert (table "memcp-tests" "grc_windows")
          '("id" "tenant_id" "range_from" "range_to")
          (list (list 1 2 0 1000) (list 2 2 500 1500)
            (list 3 1 1000 3000) (list 4 1 0 3000)))
        (rebuild)
        true)

cleanup:
  - sql: "DROP TABLE IF EXISTS grc_windows"
  - sql: "DROP TABLE IF EXISTS grc_events"

test_cases:
  - name: "constant parameter filters remove unused scalar lookup sources"
    scm: |
      (begin
        (define request (newsession))
        (define shaped (sql_parameterize_select_literals
          "SELECT d.lo,(SELECT COUNT(*) FROM grc_events e WHERE e.happened_at>=d.lo AND e.happened_at<d.hi AND (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT w.tenant_id FROM grc_windows w WHERE w.id=(SELECT x.tenant_id FROM grc_events x WHERE x.id=e.id LIMIT 1) LIMIT 1)=p.mode END) AND (p.tenant IS NULL OR e.tenant_id=p.tenant)) AS total FROM (SELECT 0 AS lo,1000 AS hi UNION ALL SELECT 500,1500) d CROSS JOIN (SELECT NULL AS tenant,0x32 AS mode) p ORDER BY d.lo" true))
        (mapIndex (cadr shaped) (lambda (i value) (request (concat "v" (+ i 1)) value)))
        (define plan (with_session request (lambda ()
          (parse_sql "memcp-tests" (car shaped) nil request nil))))
        (if (regexp_test (serialize plan) "grc_windows")
          (error "An unused optional scalar lookup survived constant domain propagation") true))
    expect:
      data: [true]

  - name: "constant parameter range aggregate retains both windows"
    session_id: "grc-constant-parameters"
    sql: |
      SELECT d.lo,(SELECT COUNT(*) FROM grc_events e
        WHERE e.happened_at>=d.lo AND e.happened_at<d.hi
          AND (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT w.tenant_id FROM grc_windows w WHERE w.id=(SELECT x.tenant_id FROM grc_events x WHERE x.id=e.id LIMIT 1) LIMIT 1)=p.mode END) AND (p.tenant IS NULL OR e.tenant_id=p.tenant)) AS total
      FROM (SELECT 0 AS lo,1000 AS hi UNION ALL SELECT 500,1500) d
      CROSS JOIN (SELECT NULL AS tenant,0x32 AS mode) p ORDER BY d.lo
    expect:
      data: [{lo: 0, total: 1000}, {lo: 500, total: 1000}]
    timing_aggregation: total
    warmup: 0
    timing_samples: 2
    threshold_ms: 5000
    performance_rows: 6000

  - name: "changed tenant parameter filters the retained range"
    session_id: "grc-constant-parameters"
    sql: |
      SELECT d.lo,(SELECT COUNT(*) FROM grc_events e
        WHERE e.happened_at>=d.lo AND e.happened_at<d.hi
          AND (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT w.tenant_id FROM grc_windows w WHERE w.id=(SELECT x.tenant_id FROM grc_events x WHERE x.id=e.id LIMIT 1) LIMIT 1)=p.mode END) AND (p.tenant IS NULL OR e.tenant_id=p.tenant)) AS total
      FROM (SELECT 0 AS lo,1000 AS hi UNION ALL SELECT 500,1500) d
      CROSS JOIN (SELECT 1 AS tenant,0x32 AS mode) p ORDER BY d.lo
    expect:
      data: [{lo: 0, total: 500}, {lo: 500, total: 500}]

  - name: "another tenant parameter retains its own qualifying counts"
    session_id: "grc-constant-parameters"
    sql: |
      SELECT d.lo,(SELECT COUNT(*) FROM grc_events e
        WHERE e.happened_at>=d.lo AND e.happened_at<d.hi
          AND (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT w.tenant_id FROM grc_windows w WHERE w.id=(SELECT x.tenant_id FROM grc_events x WHERE x.id=e.id LIMIT 1) LIMIT 1)=p.mode END) AND (p.tenant IS NULL OR e.tenant_id=p.tenant)) AS total
      FROM (SELECT 0 AS lo,1000 AS hi UNION ALL SELECT 500,1500) d
      CROSS JOIN (SELECT 2 AS tenant,0x32 AS mode) p ORDER BY d.lo
    expect:
      data: [{lo: 0, total: 500}, {lo: 500, total: 500}]

  - name: "changed optional selector evaluates its scalar branch"
    session_id: "grc-constant-parameters"
    sql: |
      SELECT d.lo,(SELECT COUNT(*) FROM grc_events e
        WHERE e.happened_at>=d.lo AND e.happened_at<d.hi
          AND (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT w.tenant_id FROM grc_windows w WHERE w.id=(SELECT x.tenant_id FROM grc_events x WHERE x.id=e.id LIMIT 1) LIMIT 1)=p.mode END)
          AND (p.tenant IS NULL OR e.tenant_id=p.tenant)) AS total
      FROM (SELECT 0 AS lo,1000 AS hi UNION ALL SELECT 500,1500) d
      CROSS JOIN (SELECT NULL AS tenant,1 AS mode) p ORDER BY d.lo
    expect:
      data: [{lo: 0, total: 0}, {lo: 500, total: 0}]

  - name: "NULL optional selector preserves unknown comparison"
    session_id: "grc-constant-parameters"
    sql: |
      SELECT d.lo,(SELECT COUNT(*) FROM grc_events e
        WHERE e.happened_at>=d.lo AND e.happened_at<d.hi
          AND (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT w.tenant_id FROM grc_windows w WHERE w.id=(SELECT x.tenant_id FROM grc_events x WHERE x.id=e.id LIMIT 1) LIMIT 1)=p.mode END)
          AND (p.tenant IS NULL OR e.tenant_id=p.tenant)) AS total
      FROM (SELECT 0 AS lo,1000 AS hi UNION ALL SELECT 500,1500) d
      CROSS JOIN (SELECT NULL AS tenant,NULL AS mode) p ORDER BY d.lo
    expect:
      data: [{lo: 0, total: 0}, {lo: 500, total: 0}]

  - name: "restored optional selector drops its scalar branch again"
    session_id: "grc-constant-parameters"
    sql: |
      SELECT d.lo,(SELECT COUNT(*) FROM grc_events e
        WHERE e.happened_at>=d.lo AND e.happened_at<d.hi
          AND (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT w.tenant_id FROM grc_windows w WHERE w.id=(SELECT x.tenant_id FROM grc_events x WHERE x.id=e.id LIMIT 1) LIMIT 1)=p.mode END)
          AND (p.tenant IS NULL OR e.tenant_id=p.tenant)) AS total
      FROM (SELECT 0 AS lo,1000 AS hi UNION ALL SELECT 500,1500) d
      CROSS JOIN (SELECT NULL AS tenant,0x32 AS mode) p ORDER BY d.lo
    expect:
      data: [{lo: 0, total: 1000}, {lo: 500, total: 1000}]

  - name: "nested scalar COUNT contributes complete reusable aggregate dependencies"
    session_id: "grc-nested-count"
    setup:
      - scm: '(globalvars "__test_grc_count-before" (count (group_value_cache)))'
    sql: &nested_count_query |
      SELECT p.cut,(SELECT SUM((SELECT x.amount FROM grc_events x WHERE x.id=e.id LIMIT 1)) FROM grc_events e
        WHERE (SELECT COUNT(*) FROM grc_windows c WHERE c.tenant_id=e.tenant_id)>p.cut) AS total
      FROM (SELECT 1 AS cut UNION ALL SELECT 2) p ORDER BY p.cut
    expect: &nested_count_result
      data: [{cut: 1, total: 12000}, {cut: 2, total: null}]

  - name: "nested scalar COUNT reuses exact aggregate points"
    session_id: "grc-nested-count"
    setup:
      - scm: '(globalvars "__test_grc_count-after" (count (group_value_cache)))'
    sql: *nested_count_query
    expect: *nested_count_result

  - name: "nested aggregate cache entries survive query completion"
    session_id: "grc-nested-count"
    scm: |
      (begin
        (define __snapshot_test_actual
          (and (> (globalvars "__test_grc_count-after") (globalvars "__test_grc_count-before")) (equal? (globalvars "__test_grc_count-after") (count (group_value_cache))))
        )
        (globalvars "__test_grc_count-before" nil)
        (globalvars "__test_grc_count-after" nil)
        (if (equal? (json_encode __snapshot_test_actual) (json_encode true))
          __snapshot_test_actual
          (error (concat "nested aggregate cache entries survive query completion: unexpected value " (serialize __snapshot_test_actual)))))
    expect:
      data: [true]

  - name: "inserting into a nested aggregate source invalidates the parent points"
    setup:
      - sql: "INSERT INTO grc_windows VALUES (5,1,0,1)"
    sql: *nested_count_query
    expect:
      data: [{cut: 1, total: 12000}, {cut: 2, total: 6000}]

  - name: "deleting from a nested aggregate source restores empty SUM semantics"
    setup:
      - sql: "DELETE FROM grc_windows WHERE id=5"
    sql: *nested_count_query
    expect: *nested_count_result

  - name: "nested volatile aggregate values are excluded from exact reuse"
    sql: |
      EXPLAIN REORDER SELECT p.cut,(SELECT SUM(e.amount) FROM grc_events e
        WHERE (SELECT SUM(RAND()) FROM grc_windows c WHERE c.tenant_id=e.tenant_id)>p.cut) AS total
      FROM (SELECT 1 AS cut UNION ALL SELECT 2) p ORDER BY p.cut
    expect:
      result_not_contains: ["stable-aggregate-domain"]

  - name: "nested HAVING retains the ordinary aggregate path"
    sql: |
      EXPLAIN REORDER SELECT p.cut,(SELECT SUM(e.amount) FROM grc_events e
        WHERE (SELECT COUNT(*) FROM grc_windows c WHERE c.tenant_id=e.tenant_id
          HAVING COUNT(*)>p.cut)>0) AS total
      FROM (SELECT 1 AS cut UNION ALL SELECT 2) p ORDER BY p.cut
    expect:
      result_not_contains: ["stable-aggregate-domain"]

  - name: "cache and candidate setup costs keep empty and tiny domains direct"
    scm: |
      (begin
        (define __snapshot_test_actual
          (map (list group_value_cache_costs invariant_property_cover_costs)
            (lambda (costs)
              (map '(0 1 6000) (lambda (rows)
                (begin
                  (define alternatives (costs rows 1))
                  (planner_cost_clear_winner? (cadr alternatives) (car alternatives)))))))
        )
        (if (equal? (json_encode __snapshot_test_actual) (json_encode (list (list false false true) (list false false true))))
          __snapshot_test_actual
          (error (concat "cache and candidate setup costs keep empty and tiny domains direct: unexpected value " (serialize __snapshot_test_actual)))))
    expect:
      data: [[[false, false, true], [false, false, true]]]

  - name: "Exact aggregate cache choices participate in physical calibration"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE DISCOVER
      SELECT w.id, (SELECT SUM((SELECT x.amount FROM grc_events x WHERE x.id=e.id LIMIT 1))
        FROM grc_events e WHERE e.tenant_id=w.tenant_id AND e.happened_at>=w.range_from
          AND e.happened_at<w.range_to) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      result_contains: ['"decision": "aggregate_point_cache"', '"direct_aggregate"', '"point_cache"']
      result_not_contains: ['"error"']

  - name: "Forced exact aggregate cache alternatives preserve all results"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE
      SELECT w.id, (SELECT SUM((SELECT x.amount FROM grc_events x WHERE x.id=e.id LIMIT 1))
        FROM grc_events e WHERE e.tenant_id=w.tenant_id AND e.happened_at>=w.range_from
          AND e.happened_at<w.range_to) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      result_contains: ['"decision": "aggregate_point_cache"', '"result_equal": true']
      result_not_contains: ['"result_equal": false', '"error"']

  - name: "Invariant property candidates expose their physical alternatives"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE DISCOVER
      SELECT w.id, (SELECT SUM(e.amount) FROM grc_events e
        WHERE (SELECT x.happened_at FROM grc_events x WHERE x.id=e.id LIMIT 1)>=w.range_from) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      result_contains: ['"decision": "invariant_property_cover"', '"property_candidates"', '"direct_aggregate"']
      result_not_contains: ['"error"']

  - name: "Forced property candidate plans preserve scalar predicate results"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE
      SELECT w.id, (SELECT SUM(e.amount) FROM grc_events e
        WHERE (SELECT x.happened_at FROM grc_events x WHERE x.id=e.id LIMIT 1)>=w.range_from) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      result_contains: ['"decision": "invariant_property_cover"', '"result_equal": true']
      result_not_contains: ['"result_equal": false', '"error"']

  - name: "aggregate purity distinguishes explicit conversion from clock reads"
    scm: |
      (begin
        (define __snapshot_test_actual
          (list
            (contribution_pure_expr? '('unix_timestamp 0))
            (contribution_pure_expr? (list + 1 2))
            (contribution_pure_expr? '('unix_timestamp))
            (contribution_pure_expr? '('sql_not '('equal?? 1 nil)))
            (contribution_outer_inputs '('format_date 0 "%Y" '('session_globalvar "time_zone")) '()))
        )
        (if (equal? (json_encode __snapshot_test_actual) (json_encode (list true true false true (list (list (quote session_globalvar) "time_zone")))))
          __snapshot_test_actual
          (error (concat "aggregate purity distinguishes explicit conversion from clock reads: unexpected value " (serialize __snapshot_test_actual)))))
    expect:
      data: [[true, true, false, true, [[{symbol: "session_globalvar"}, "time_zone"]]]]

  - name: "computed range bindings include the session timezone"
    session_id: "grc-point-timezone"
    setup:
      - sql: "SET time_zone='UTC'"
    sql: &zone_range_point_query |
      SELECT w.id,
        (SELECT SUM((SELECT x.amount FROM grc_events x WHERE x.id=e.id LIMIT 1))
         FROM grc_events e WHERE e.tenant_id=w.tenant_id AND e.happened_at>=w.range_from
           AND e.happened_at<=UNIX_TIMESTAMP(STR_TO_DATE(
             DATE_FORMAT(FROM_UNIXTIME(w.range_to),'%Y-%m-%d %H:%i:%s'),'%Y-%m-%d %H:%i:%s'))) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      data: [{id: 1, total: 1000}, {id: 2, total: 1000}, {id: 3, total: 2002}, {id: 4, total: 3002}]

  - name: "changing the timezone separates cached aggregate values"
    session_id: "grc-point-timezone"
    setup:
      - sql: "SET time_zone='+01:00'"
    sql: *zone_range_point_query
    expect:
      data: [{id: 1, total: 4600}, {id: 2, total: 4600}, {id: 3, total: 5000}, {id: 4, total: 6000}]

  - name: "restoring the timezone restores the original aggregate values"
    session_id: "grc-point-timezone"
    setup:
      - sql: "SET time_zone='UTC'"
    sql: *zone_range_point_query
    expect:
      data: [{id: 1, total: 1000}, {id: 2, total: 1000}, {id: 3, total: 2002}, {id: 4, total: 3002}]

  - name: "property candidates lower to native RecSet scan boundaries"
    scm: |
      (begin
        (define __snapshot_test_actual
          (begin
            (define source '("e" "memcp-tests" "grc_events" false nil))
            (define expression '('apply '('get_column "e" false "$recset_contains" false) '('list '__candidates)))
            (define filter (lower_column_expr_for_alias source expression))
            (define joined (lower_column_expr_for_join (list source) "e" expression))
            (if (not (equal? filter joined)) (error "membership callback lowering differs") true)
            (serialize (compile_scan_plan 'scan_recset nil '('table "memcp-tests" "grc_events")
              '('quote '("$recset_contains"))
              (list 'lambda (list recset_contains_callback_symbol) filter))))
        )
        (if (and (regexp_test __snapshot_test_actual "scan_boundary\\ \"recset\""))
          __snapshot_test_actual
          (error (concat "property candidates lower to native RecSet scan boundaries: unexpected value " (serialize __snapshot_test_actual)))))
    expect:
      result_contains: ['scan_boundary "recset"']

  - name: "nested range aggregates expose complete reusable point bindings"
    sql: |
      EXPLAIN REORDER SELECT w.id,
        (SELECT SUM((SELECT x.amount FROM grc_events x WHERE x.id=e.id LIMIT 1))
         FROM grc_events e WHERE e.tenant_id=w.tenant_id
           AND e.happened_at>=w.range_from AND e.happened_at<=w.range_to) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      result_contains: ["stable-aggregate-domain"]

  - name: "nested range aggregate values retain both interval cuts"
    sql: &nested_range_point_query |
      SELECT w.id,
        (SELECT SUM((SELECT x.amount FROM grc_events x WHERE x.id=e.id LIMIT 1))
         FROM grc_events e WHERE e.tenant_id=w.tenant_id
           AND e.happened_at>=w.range_from AND e.happened_at<=w.range_to) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      data: [{id: 1, total: 1000}, {id: 2, total: 1000}, {id: 3, total: 2002}, {id: 4, total: 3002}]

  - name: "nested range aggregate cache distinguishes a changed upper cut"
    setup:
      - sql: "UPDATE grc_windows SET range_to=10 WHERE id=1"
    sql: *nested_range_point_query
    expect:
      data: [{id: 1, total: 10}, {id: 2, total: 1000}, {id: 3, total: 2002}, {id: 4, total: 3002}]

  - name: "nested range aggregate cache distinguishes a changed lower cut"
    setup:
      - sql: "UPDATE grc_windows SET range_from=4 WHERE id=1"
    sql: *nested_range_point_query
    expect:
      data: [{id: 1, total: 6}, {id: 2, total: 1000}, {id: 3, total: 2002}, {id: 4, total: 3002}]

  - name: "nested range aggregate restores the original interval"
    setup:
      - sql: "UPDATE grc_windows SET range_from=0, range_to=1000 WHERE id=1"
    sql: *nested_range_point_query
    expect:
      data: [{id: 1, total: 1000}, {id: 2, total: 1000}, {id: 3, total: 2002}, {id: 4, total: 3002}]

  - name: "computed upper cuts retain the driver binding inside ordered range caches"
    sql: |
      SELECT w.id,
        (SELECT e.happened_at FROM grc_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at <= LEAST(1200, w.range_to)
          ORDER BY e.happened_at DESC LIMIT 1) AS latest
      FROM grc_windows w ORDER BY w.id
    expect:
      data:
        - {id: 1, latest: 999}
        - {id: 2, latest: 1199}
        - {id: 3, latest: 1200}
        - {id: 4, latest: 1200}

  - name: "ordered probes read a direct cut that is not projected"
    sql: |
      SELECT w.id,
        (SELECT e.happened_at FROM grc_events e
          WHERE e.tenant_id = w.tenant_id AND e.happened_at <= w.range_to
          ORDER BY e.happened_at DESC LIMIT 1) AS latest
      FROM grc_windows w ORDER BY w.id
    expect:
      data:
        - {id: 1, latest: 999}
        - {id: 2, latest: 1499}
        - {id: 3, latest: 3000}
        - {id: 4, latest: 3000}

  - name: "ordered probe cuts collect dependencies from another joined source"
    sql: |
      SELECT w.id,
        (SELECT e.happened_at FROM grc_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at <= LEAST(1200, bounds.range_to)
          ORDER BY e.happened_at DESC LIMIT 1) AS latest
      FROM grc_windows w JOIN grc_windows bounds ON bounds.id = w.id
      ORDER BY w.id
    expect:
      data:
        - {id: 1, latest: 999}
        - {id: 2, latest: 1199}
        - {id: 3, latest: 1200}
        - {id: 4, latest: 1200}

  - name: "computed cuts preserve both bounds across aggregate callbacks"
    sql: |
      SELECT w.id,
        (SELECT COUNT(*) FROM grc_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at >= GREATEST(500, w.range_from)
            AND e.happened_at <= LEAST(2400, w.range_to)) AS event_count
      FROM grc_windows w ORDER BY w.id
    expect:
      data:
        - {id: 1, event_count: 250}
        - {id: 2, event_count: 500}
        - {id: 3, event_count: 701}
        - {id: 4, event_count: 951}

  - name: "null computed cuts preserve an empty sum"
    sql: |
      SELECT w.id,
        (SELECT SUM(e.amount) FROM grc_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at <= NULLIF(w.range_to, 1000) + 0) AS total
      FROM grc_windows w ORDER BY w.id
    expect:
      data:
        - {id: 1, total: null}
        - {id: 2, total: 1500}
        - {id: 3, total: 3002}
        - {id: 4, total: 3002}

  - name: "computed cuts reject an unknown driver column"
    sql: |
      SELECT (SELECT COUNT(*) FROM grc_events e
        WHERE e.tenant_id = w.tenant_id
          AND e.happened_at <= w.missing_cut + 1)
      FROM grc_windows w
    expect:
      error: true

  - name: "overlapping ranges compose count sum and average from disjoint cells"
    sql: |
      SELECT w.id,
        (SELECT COUNT(*) FROM grc_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at >= w.range_from
            AND e.happened_at < w.range_to) AS event_count
      FROM grc_windows w
      ORDER BY w.id
    expect:
      rows: 4
      data:
        - {id: 1, event_count: 500}
        - {id: 2, event_count: 500}
        - {id: 3, event_count: 1000}
        - {id: 4, event_count: 1500}

  - name: "sum composes from the same disjoint cells"
    sql: |
      SELECT w.id,
        (SELECT SUM(e.amount) FROM grc_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at >= w.range_from
            AND e.happened_at < w.range_to) AS amount_sum
      FROM grc_windows w
      ORDER BY w.id
    expect:
      rows: 4
      data:
        - {id: 1, amount_sum: 1000}
        - {id: 2, amount_sum: 1000}
        - {id: 3, amount_sum: 2000}
        - {id: 4, amount_sum: 3000}

  - name: "average composes from cached sum and count states"
    sql: |
      SELECT w.id,
        (SELECT AVG(e.amount) FROM grc_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at >= w.range_from
            AND e.happened_at < w.range_to) AS amount_average
      FROM grc_windows w
      ORDER BY w.id
    expect:
      rows: 4
      data:
        - {id: 1, amount_average: 2}
        - {id: 2, amount_average: 2}
        - {id: 3, amount_average: 2}
        - {id: 4, amount_average: 2}

  - name: "one request shares range cells across count sum and average"
    setup:
      - sql: "DROP TABLE IF EXISTS grc_multi_windows"
      - sql: "DROP TABLE IF EXISTS grc_multi_events"
      - sql: "CREATE TABLE grc_multi_events (id INT PRIMARY KEY, tenant_id INT, happened_at INT, amount INT) ENGINE=memory"
      - sql: "CREATE TABLE grc_multi_windows (id INT PRIMARY KEY, tenant_id INT, range_from INT, range_to INT) ENGINE=memory"
      - scm: |
          (begin
            (insert (table "memcp-tests" "grc_multi_events")
              '("id" "tenant_id" "happened_at" "amount")
              (map (produceN 6000) (lambda (i)
                (list (+ i 1) (+ 1 (mod i 2)) i 2))))
            (insert (table "memcp-tests" "grc_multi_windows")
              '("id" "tenant_id" "range_from" "range_to")
              (list (list 1 2 0 1000) (list 2 2 500 1500)
                (list 3 1 1000 3000) (list 4 1 0 3000)))
            (rebuild)
            true)
    sql: |
      SELECT w.id,
        (SELECT COUNT(*) FROM grc_multi_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at >= w.range_from
            AND e.happened_at < w.range_to) AS event_count,
        (SELECT SUM(e.amount) FROM grc_multi_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at >= w.range_from
            AND e.happened_at < w.range_to) AS amount_sum,
        (SELECT AVG(e.amount) FROM grc_multi_events e
          WHERE e.tenant_id = w.tenant_id
            AND e.happened_at >= w.range_from
