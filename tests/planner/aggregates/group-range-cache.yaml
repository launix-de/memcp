  - name: "snapshot execution invalidates before subtracting across source changes"
    scm: |
      (begin
        (define __snapshot_test_actual
          (begin
            (define source (table "memcp-tests" "grc_state_entity"))
            (define snapshot (make_contribution_snapshot nil nil))
            (define view (lambda () (list (table_read_version source))))
            (define initial (lambda () (list 1 10)))
            (define changed (lambda (lo hi) (list)))
            (define values (lambda (keys) (list)))
            (define direct (lambda () 99))
            (define first (snapshot nil 1 view initial changed values direct))
            (insert source '("id" "category") (list (list 6 1)))
            (list first (snapshot nil 2 view initial changed values direct)))
        )
        (if (equal? (json_encode __snapshot_test_actual) (json_encode (list 10 99)))
          __snapshot_test_actual
          (error (concat "snapshot execution invalidates before subtracting across source changes: unexpected value " (serialize __snapshot_test_actual)))))
    expect:
      data: [[10, 99]]

  - name: "snapshot corrections preserve old values and skip repeated coordinates"
    scm: |
      (begin
        (define __snapshot_test_actual
          (begin
            (define snapshot (make_contribution_snapshot nil nil))
            (define view (lambda () (list 1)))
            (define full (lambda () (list 1 4 2 nil)))
            (define candidates (lambda (lo hi) (list 1 2)))
            (define changed (lambda (keys) (list 1 nil 2 -3)))
            (define invalid (lambda () (error "unexpected full scan")))
            (define first (snapshot nil 0 view full candidates changed invalid))
