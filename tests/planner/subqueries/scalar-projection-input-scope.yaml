- name: sql Scalar string payload preserves caller case spacing and duplicates
  syntax: sql
  sql: SELECT q.seq,(SELECT CONCAT(c.value,q.token) FROM projection_values c WHERE
    c.id=q.id) AS found FROM projection_string_inputs q ORDER BY q.seq
  expect:
    rows: 5
    data:
    - seq: 1
      found: 100A
    - seq: 2
      found: 100a
    - seq: 3
      found: '100A '
    - seq: 4
      found: '100a '
    - seq: 5
      found: 100A
- name: tsql Scalar string payload preserves caller case spacing and duplicates
