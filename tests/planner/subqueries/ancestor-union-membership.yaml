    - id: 5
      visible_label: null
    - id: 6
      visible_label: alpha
    - id: 7
      visible_label: alpha
    - id: 8
      visible_label: null
    - id: 9
      visible_label: gamma
    - id: 10
      visible_label: alpha
- name: A user branch filter is not replaced by mere UNION presence
  sql: |-
    SELECT p.id,
