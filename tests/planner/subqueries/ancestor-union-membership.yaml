- name: A lexical closure check detects an unknown caller without any outer catalog
  scm: |-
    (begin
      (define source (list "local" "unused" "unused" false nil
        '("columns" (("Field" "id")))))
      (define ref (list 'get_column "local" false "id" false))
      (define input (make_query_block "unused" (list source)
        (list "value" (list 'get_column "unknown_caller" false "id" false)) true '() nil '() nil nil '() '() '()))
      (empty_list? (logical_relation_free_column_refs input)))
  expect:
    result: false
- name: Quoted user data never becomes an executable free caller read
  scm: |-
    (begin
      (define source (list "local" "unused" "unused" false nil
        '("columns" (("Field" "id")))))
      (define ref (list 'get_column "local" false "id" false))
      (define input (make_query_block "unused" (list source)
        (list "value" (list 'quote (list 'get_column "unknown_caller" false "id" false))) true '() nil '() nil nil '() '() '()))
      (empty_list? (logical_relation_free_column_refs input)))
  expect:
    result: true
- name: Unqualified columns resolve through producer-owned declarations
  scm: |-
    (begin
      (define source (list "local" "unused" "unused" false nil
        '("columns" (("Field" "id")))))
      (define ref (list 'get_column "local" false "id" false))
      (define input (make_query_block "unused" (list source)
        (list "value" (list 'get_column nil false "id" false)) true '() nil '() nil nil '() '() '()))
      (empty_list? (logical_relation_free_column_refs input)))
  expect:
    result: true
- name: The first retained stage domain coordinate still belongs to its caller
  scm: |-
    (begin
      (define source (list "local" "unused" "unused" false nil
        '("columns" (("Field" "id")))))
      (define ref (list 'get_column "local" false "id" false))
      (define stage (make_group_stage "scoped" source
        (list (list 'get_column "unknown_caller" false "id" false) ref)
        (list ref) (list '(1 + 0)) true '() '() nil nil '()))
      (define input (make_query_block "unused" (list source) (list "value" ref)
        true '() nil '() nil nil '() (list stage) '()))
      (empty_list? (logical_relation_free_column_refs input)))
  expect:
    result: false
- name: An internally bound stage domain does not invent an external caller
  scm: |-
    (begin
      (define source (list "local" "unused" "unused" false nil
        '("columns" (("Field" "id")))))
      (define ref (list 'get_column "local" false "id" false))
      (define stage (make_group_stage "scoped" source (list ref)
        (list ref) (list '(1 + 0)) true '() '() nil nil '()))
      (define input (make_query_block "unused" (list source) (list "value" ref)
        true '() nil '() nil nil '() (list stage) '()))
      (empty_list? (logical_relation_free_column_refs input)))
  expect:
    result: true
- name: Window prefilters retain caller dependencies
  scm: |-
    (begin
      (define source (list "local" "unused" "unused" false nil
        '("columns" (("Field" "id")))))
      (define ref (list 'get_column "unknown_caller" false "id" false))
      (empty_list? (logical_relation_free_column_refs (make_window_stage "window" source "value" '("id") '(false) 0
        '("id") '(lambda (x) x) '+ 0 (list (list 'condition ref))))))
  expect:
    result: false
- name: Window ordering retains caller dependencies
