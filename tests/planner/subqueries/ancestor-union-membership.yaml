- name: Scalar membership and anti-membership retain UNKNOWN from NULL RHS rows
  sql: |-
    SELECT p.id,
      p.tenant_id IN (SELECT a.tenant_id FROM aum_assignments a WHERE a.actor_id=p.owner_id
        UNION ALL SELECT a.tenant_id FROM aum_assignments a WHERE a.actor_id=7) AS member,
      p.tenant_id NOT IN (SELECT a.tenant_id FROM aum_assignments a WHERE a.actor_id=p.owner_id
        UNION ALL SELECT a.tenant_id FROM aum_assignments a WHERE a.actor_id=7) AS nonmember
    FROM aum_callers p ORDER BY p.id
  expect:
    rows: 10
    data:
    - id: 1
      member: true
      nonmember: false
    - id: 2
      member: null
      nonmember: null
    - id: 3
      member: null
      nonmember: null
    - id: 4
      member: true
      nonmember: false
    - id: 5
      member: null
      nonmember: null
    - id: 6
      member: true
      nonmember: false
    - id: 7
      member: true
      nonmember: false
    - id: 8
      member: null
      nonmember: null
    - id: 9
      member: null
      nonmember: null
    - id: 10
      member: true
      nonmember: false
