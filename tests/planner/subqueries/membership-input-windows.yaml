      second_state: 0
- name: tsql Different caps retain separate row producers
  syntax: tsql
  sql: SELECT COALESCE(o.id,-1) AS id,CASE WHEN o.id IN (SELECT TOP(1) i.id FROM membership_window_rhs
    i ORDER BY i.score DESC) THEN 1 WHEN o.id NOT IN (SELECT TOP(1) i.id FROM membership_window_rhs
    i ORDER BY i.score DESC) THEN 0 ELSE -1 END AS first_state,CASE WHEN o.id IN (SELECT
    TOP(2) i.id FROM membership_window_rhs i ORDER BY i.score DESC) THEN 1 WHEN o.id
    NOT IN (SELECT TOP(2) i.id FROM membership_window_rhs i ORDER BY i.score DESC)
    THEN 0 ELSE -1 END AS second_state FROM membership_window_outer o ORDER BY COALESCE(o.id,-1)
  expect:
