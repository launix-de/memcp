      second_state: 0
- name: sql Paired scalar producers retain opposite order
  syntax: sql
  sql: SELECT (SELECT i.id FROM membership_window_rhs i ORDER BY i.score DESC LIMIT
    1) AS first_value,(SELECT i.id FROM membership_window_rhs i ORDER BY i.score ASC
    LIMIT 1) AS second_value
  expect:
    data:
    - first_value: 2
      second_value: null
- name: psql Paired scalar producers retain opposite order
  syntax: psql
  sql: SELECT (SELECT i.id FROM membership_window_rhs i ORDER BY i.score DESC LIMIT
    1) AS first_value,(SELECT i.id FROM membership_window_rhs i ORDER BY i.score ASC
    LIMIT 1) AS second_value
  expect:
    data:
    - first_value: 2
      second_value: null
- name: tsql Paired scalar producers retain opposite order
  syntax: tsql
  sql: SELECT (SELECT TOP(1) i.id FROM membership_window_rhs i ORDER BY i.score DESC)
    AS first_value,(SELECT TOP(1) i.id FROM membership_window_rhs i ORDER BY i.score
    ASC) AS second_value
  expect:
    data:
    - first_value: 2
      second_value: null
cleanup:
- sql: DROP TABLE membership_window_outer
- sql: DROP TABLE membership_window_rhs
- sql: DROP TABLE membership_key_rhs
