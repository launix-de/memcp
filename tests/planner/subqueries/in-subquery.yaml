# IN with subquery tests

metadata:
  version: "1.0"
  description: "IN and NOT IN with subquery tests"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS in_renderjob"
  - sql: "DROP TABLE IF EXISTS in_fop_files"
  - sql: |
      CREATE TABLE in_fop_files (
        ID INT PRIMARY KEY,
        name VARCHAR(64)
      )
  - sql: |
      CREATE TABLE in_renderjob (
        ID INT PRIMARY KEY,
        result INT
      )
  - sql: |
      INSERT INTO in_fop_files (ID, name) VALUES
      (1, 'image1.png'), (2, 'image2.png'), (3, 'image3.png'),
      (4, 'image4.png'), (5, 'image5.png')
  - sql: |
      INSERT INTO in_renderjob (ID, result) VALUES
      (101, 1), (102, 3), (103, 3)
  - sql: "DROP TABLE IF EXISTS membership_assignment"
  - sql: "DROP TABLE IF EXISTS membership_item"
  - sql: "CREATE TABLE membership_item (ID INT PRIMARY KEY, name VARCHAR(64))"
  - sql: "CREATE TABLE membership_assignment (ID INT PRIMARY KEY, result INT)"
  - sql: "INSERT INTO membership_item (ID, name) VALUES (1, 'item-1'), (2, 'item-2'), (3, 'item-3'), (4, 'item-4'), (5, 'item-5')"
  - sql: "INSERT INTO membership_assignment (ID, result) VALUES (101, 1), (102, 3), (103, 3)"

test_cases:
  - name: "IN subquery - files with render results"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "NOT IN subquery - files without render results"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 2
          name: "image2.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "NOT IN preserves ordering and LIMIT from a joined derived membership relation"
    max_plan_size: 20000
    sql: |
      SELECT ID, name
      FROM membership_item
      WHERE ID NOT IN (
        SELECT candidate.result
        FROM (
          SELECT job.result, job.ID AS sort_key, file.name
          FROM membership_assignment job
          LEFT JOIN membership_item file ON file.ID = job.result
        ) candidate
        LEFT JOIN membership_item sorter ON sorter.ID = candidate.result
        ORDER BY candidate.sort_key DESC
        LIMIT 1
      )
      ORDER BY ID
    expect:
      rows: 4
      data:
        - ID: 1
          name: "item-1"
        - ID: 2
          name: "item-2"
        - ID: 4
          name: "item-4"
        - ID: 5
          name: "item-5"

  - name: "Ordered joined derived membership remains decorrelated"
    max_plan_size: 20000
    sql: |
      EXPLAIN IR
      SELECT ID
      FROM membership_item
      WHERE ID NOT IN (
        SELECT candidate.result
        FROM (
          SELECT job.result, job.ID AS sort_key, file.name
          FROM membership_assignment job
          LEFT JOIN membership_item file ON file.ID = job.result
        ) candidate
        LEFT JOIN membership_item sorter ON sorter.ID = candidate.result
        ORDER BY candidate.sort_key DESC
        LIMIT 1
      )
    expect:
      contains:
        - "group-stage"
        - "stage-output"
        - "null_semantics"
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - "legacy_materialized"
        - ".grp:"

  - name: "IN ignores ordering from a joined derived membership relation"
    sql: |
      SELECT ID
      FROM membership_item
      WHERE ID IN (
        SELECT candidate.result
        FROM (
          SELECT job.result, job.ID AS sort_key, file.name
          FROM membership_assignment job
          LEFT JOIN membership_item file ON file.ID = job.result
        ) candidate
        ORDER BY candidate.sort_key DESC
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
        - ID: 3

  - name: "Ordered joined derived NOT IN preserves RHS NULL semantics"
    sql: |
      SELECT ID
      FROM membership_item
      WHERE ID NOT IN (
        SELECT candidate.result
        FROM (
          SELECT CASE WHEN job.ID = 103 THEN NULL ELSE job.result END AS result,
            job.ID AS sort_key
          FROM membership_assignment job
          LEFT JOIN membership_item file ON file.ID = job.result
        ) candidate
        ORDER BY candidate.sort_key DESC
      )
      ORDER BY ID
    expect:
      rows: 0

  - name: "IN preserves semantically relevant ordered LIMIT"
    sql: |
      SELECT ID
      FROM membership_item
      WHERE ID IN (
        SELECT candidate.result
        FROM (
          SELECT job.result, job.ID AS sort_key
          FROM membership_assignment job
          LEFT JOIN membership_item file ON file.ID = job.result
        ) candidate
        ORDER BY candidate.sort_key DESC
        LIMIT 1
      )
    expect:
      rows: 1
      data:
        - ID: 3

  - name: "NOT IN preserves arbitrary LIMIT and OFFSET from a joined derived membership relation"
    sql: |
      SELECT ID
      FROM membership_item
      WHERE ID NOT IN (
        SELECT candidate.result
        FROM (
          SELECT job.result, job.ID AS sort_key
          FROM membership_assignment job
          LEFT JOIN membership_item file ON file.ID = job.result
        ) candidate
        ORDER BY candidate.sort_key DESC
        LIMIT 2 OFFSET 1
      )
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 2
        - ID: 4
        - ID: 5

  - name: "IN subquery with WHERE in subquery"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob WHERE ID > 101)
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 3
          name: "image3.png"

  - name: "IN subquery returns no matches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob WHERE ID > 1000)
      ORDER BY ID
    expect:
      rows: 0

  - name: "NOT IN subquery returns all when subquery empty"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (SELECT result FROM in_renderjob WHERE ID > 1000)
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "image3.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "IN subquery combined with other conditions"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob) AND name LIKE '%3%'
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 3
          name: "image3.png"

  - name: "EXPLAIN IN subquery uses materialized count helper cache"
    sql: |
      EXPLAIN SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 1
      contains:
        - "touch_keytable"
        - "createcolumn"
        - "\"__cnt\""
        - ".in_renderjob:((get_column"

  - name: "EXPLAIN IR IN subquery keeps membership semantics logical"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 1
      contains:
        - "group-stage"
        - "stage-output"
        - "domain"
        - "lookup-keys"
        - "null_semantics"
        - "cardinality_mode"
      not_contains:
        - "dependent-subquery"
        - "neumann_in"
        - "inner_select"
        - "in_membership"
        - ".grp:"
        - "touch_keytable"

  # === UNION ALL inside IN subselect ===
  # Can be compiled to (or (scan...) (scan...))

  - name: "IN with UNION ALL subselect"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "NOT IN with UNION ALL subselect"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 2
          name: "image2.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "IN with UNION ALL using three branches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 103
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL duplicate branches keeps semantics"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 103
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL including empty branch"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID > 1000
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 101
      )
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 1
          name: "image1.png"

  - name: "NOT IN with UNION ALL when all branches empty"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_renderjob WHERE ID > 1000
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID > 2000
      )
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "image3.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "IN with UNION ALL and outer filter"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      AND ID > 1
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL branch using inner ORDER BY/LIMIT"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM (
          SELECT result FROM in_renderjob ORDER BY ID DESC LIMIT 1
        ) AS top_result
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 101
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL column count mismatch"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result, ID FROM in_renderjob WHERE ID = 102
      )
    expect:
      error: true

  - name: "IN with UNION without ALL compatibility"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION without ALL overlapping branches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID <= 102
        UNION
        SELECT result FROM in_renderjob WHERE ID >= 102
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "NOT IN with UNION without ALL overlapping branches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_renderjob WHERE ID <= 102
        UNION
        SELECT result FROM in_renderjob WHERE ID >= 102
      )
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 2
          name: "image2.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "EXPLAIN IN with UNION without ALL skips duplicate materialization"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    steps:
      - sql: |
          EXPLAIN IR
          SELECT ID, name FROM in_fop_files
          WHERE ID IN (
            SELECT result FROM in_renderjob WHERE ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE ID >= 102
          )
          ORDER BY ID
        expect:
          contains:
            - "in_candidate"
            - "candidate"
            - "stage-output"
            - "lookup-keys"
          not_contains:
            - "inner_select"
            - "in_membership"
            - ".grp:"
      - sql: |
          EXPLAIN
          SELECT ID, name FROM in_fop_files
          WHERE ID IN (
            SELECT result FROM in_renderjob WHERE ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE ID >= 102
          )
          ORDER BY ID
        expect:
          not_contains:
            - "__union_distinct_rows"
            - "__union_distinct_seen"

  - name: "IN UNION joined order limit uses guarded keyset fallback"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    setup:
      - sql: "DROP TABLE IF EXISTS in_dv_doc"
      - sql: "DROP TABLE IF EXISTS in_dv_file"
      - sql: "DROP TABLE IF EXISTS in_dv_acl"
      - sql: |
          CREATE TABLE in_dv_file (
            ID INT PRIMARY KEY,
            filename VARCHAR(64),
            search VARCHAR(128)
          )
      - sql: |
          CREATE TABLE in_dv_doc (
            ID INT PRIMARY KEY,
            file_id INT,
            tenant INT,
            sort_key INT
          )
      - sql: |
          CREATE TABLE in_dv_acl (
            ID INT PRIMARY KEY,
            tenant INT,
            allowed INT
          )
      - sql: |
          INSERT INTO in_dv_file (ID, filename, search) VALUES
          (10, 'invoice-hit.pdf', 'other'),
          (20, 'other.pdf', 'needle token'),
          (30, 'miss.pdf', 'other'),
          (40, 'cold-a.pdf', 'other'),
          (50, 'cold-b.pdf', 'other'),
          (60, 'cold-c.pdf', 'other'),
          (70, 'cold-d.pdf', 'other'),
          (80, 'cold-f.pdf', 'other'),
          (90, 'cold-g.pdf', 'other'),
          (100, 'cold-h.pdf', 'other')
      - sql: |
          INSERT INTO in_dv_doc (ID, file_id, tenant, sort_key) VALUES
          (1, 10, 1, 20),
          (2, 20, 1, 10),
          (3, 30, 1, 30),
          (4, 10, 2, 5)
      - sql: |
          INSERT INTO in_dv_acl (ID, tenant, allowed) VALUES
          (1, 1, 1),
          (2, 2, 0)
    steps:
      - sql: |
          SELECT d.ID
          FROM in_dv_doc d
          JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ORDER BY d.sort_key
          LIMIT 2
        expect:
          rows: 2
          data:
            - ID: 2
            - ID: 1
      - sql: |
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          rows: 2
          data:
            - ID: 2
            - ID: 1
      - sql: |
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%e%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%e%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          rows: 3
          data:
            - ID: 2
            - ID: 1
            - ID: 3
      - sql: |
          EXPLAIN REORDER
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          contains:
            - "in_candidate"
            - "candidate"
            - "membership_plan_strategy"
            - "candidate_keyset"
            - "membership_selectivity_class"
            - "selective"
            - "membership_driver_rows"
            - "membership_candidate_input_rows"
            - "membership_cost_reason"
            - "source_estimates"
            - "group_stage_strategy"
            - "group_plan_options"
            - "lookup-keys"
          not_contains:
            - "inner_select"
            - "dependent-subquery"
            - "in_membership"
            - ".grp:"
            - "touch_keytable"
            - "driver_order_membership_probe"
      - sql: |
          EXPLAIN
          SELECT d.ID
          FROM in_dv_doc d
          WHERE d.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
          )
          ORDER BY d.sort_key
          LIMIT 10
        expect:
          contains:
            - "recset_project_join"
            - "scan_order"
          not_contains:
            - "touch_keytable"
            - "__union_distinct_rows"
            - "__union_distinct_seen"
      - sql: |
          EXPLAIN
          SELECT d.ID
          FROM in_dv_doc d
          WHERE d.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%e%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%e%'
          )
          ORDER BY d.sort_key
          LIMIT 2
        expect:
          contains:
            - "recset_project_join"
            - "$recset_contains"
            - "in_dv_doc"
          not_contains:
            - "touch_keytable"
            - "__union_distinct_rows"
            - "__union_distinct_seen"
      - sql: |
          EXPLAIN
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          contains:
            - "recset_project_join"
            - "recset_union"
            - "sort"
          not_contains:
            - "driver_membership_probe"
            - "__union_distinct_rows"
            - "__union_distinct_seen"
            - "touch_keytable"
            - ".grp:"
      - sql: |
          EXPLAIN
          SELECT x.ID, r.tenant
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            WHERE d.file_id IN (
              SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
              UNION
              SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
            )
            ORDER BY d.sort_key
            LIMIT 2
          ) x
          LEFT JOIN in_dv_acl r ON r.tenant = x.tenant
        expect:
          contains:
            - "scan_order"
            - "recset_project_join"
            - "$recset_contains"
            - "in_dv_doc"
          not_contains:
            - ".grp:union"
            - "touch_keytable"
      - sql: |
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%e%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%e%'
          )
          ORDER BY t.sort_key
          LIMIT 2
        expect:
          rows: 2
          data:
            - ID: 2
            - ID: 1
      - sql: |
          EXPLAIN REORDER
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%co%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%co%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          contains:
            - "membership_plan_strategy"
            - "driver_order_membership_probe"
            - "membership_selectivity_class"
            - "broad"
            - "membership_candidate_estimated_rows"
            - "membership_candidate_estimate_input"
            - "membership_cost_reason"
            - "broad_membership_preserve_driver_order_limit"
          not_contains:
            - "inner_select"
            - "dependent-subquery"
            - "selective_membership_build_candidate_keyset"
      - sql: |
          EXPLAIN REORDER
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%e%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%e%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          contains:
            - "membership_plan_strategy"
            - "driver_order_membership_probe"
            - "membership_selectivity_class"
            - "broad"
            - "membership_driver_rows"
            - "membership_candidate_input_rows"
            - "membership_cost_reason"
            - "broad_membership_preserve_driver_order_limit"
            - "source_estimates"
            - "group_stage_strategy"
            - "group_plan_options"
          not_contains:
            - "inner_select"
            - "dependent-subquery"
            - "selective_membership_build_candidate_keyset"
            - "driver_membership_probe"
            - ".grp:"
            - "touch_keytable"
      - sql: |
          EXPLAIN
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%e%'
