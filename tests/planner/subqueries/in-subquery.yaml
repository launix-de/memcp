  # === SQL three-valued logic for IN / NOT IN with NULL RHS ===

  - name: "Setup NULL membership table"
    sql: "DROP TABLE IF EXISTS in_nullable_rhs"
    expect: {}

  - name: "Create NULL membership table"
    sql: "CREATE TABLE in_nullable_rhs (ID INT PRIMARY KEY, grp INT, result INT)"
    expect: {}

  - name: "Insert NULL membership rows"
    sql: |
      INSERT INTO in_nullable_rhs (ID, grp, result) VALUES
      (1, 1, 2),
      (2, 1, NULL),
      (3, 2, NULL)
    expect: {}

  - name: "NOT IN subquery with RHS NULL returns no nonmatching rows"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID NOT IN (SELECT result FROM in_nullable_rhs)
      ORDER BY ID
    expect:
      rows: 0

  - name: "IN subquery with RHS NULL still returns matching rows"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_nullable_rhs)
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 2

  - name: "IN subquery consumes grouped keys after HAVING"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID IN (
        SELECT grp FROM in_nullable_rhs
        GROUP BY grp
        HAVING SUM(ID) > 2
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
        - ID: 2

  - name: "Grouped outer query consumes grouped IN keys"
    sql: |
      SELECT f.ID, COUNT(*) AS job_count
      FROM in_fop_files f
      JOIN in_renderjob j ON j.result = f.ID
      WHERE f.ID IN (
        SELECT grp FROM in_nullable_rhs
        GROUP BY grp
        HAVING SUM(ID) > 2
      )
      GROUP BY f.ID
      ORDER BY f.ID
    expect:
      rows: 1
      data:
        - ID: 1
          job_count: 1

  - name: "Grouped IN lowers to group stages without a subquery marker"
    sql: |
      EXPLAIN IR
      SELECT ID FROM in_fop_files
      WHERE ID IN (
        SELECT grp FROM in_nullable_rhs
        GROUP BY grp
        HAVING SUM(ID) > 2
      )
    expect:
      contains:
        - "group-stage"
        - "stage-output"
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - ".grp:"

  - name: "Grouped IN rejects an aggregate membership value"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID IN (
        SELECT SUM(ID) FROM in_nullable_rhs
        GROUP BY grp
      )
    expect:
      error: true

  - name: "Grouped IN rejects a correlated RHS"
    sql: |
      SELECT ID FROM in_fop_files f
      WHERE ID IN (
        SELECT grp FROM in_nullable_rhs r
        WHERE r.ID >= f.ID
        GROUP BY grp
      )
    expect:
      error: true

  - name: "Grouped IN rejects ordered limited membership"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID IN (
        SELECT grp FROM in_nullable_rhs
        GROUP BY grp
        ORDER BY grp
        LIMIT 1
      )
    expect:
      error: true

  - name: "Grouped NOT IN remains explicitly unsupported"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID NOT IN (
        SELECT grp FROM in_nullable_rhs
        GROUP BY grp
      )
    expect:
      error: true

  - name: "Projected grouped IN remains explicitly unsupported"
    sql: |
      SELECT ID,
        ID IN (SELECT grp FROM in_nullable_rhs GROUP BY grp) AS grouped_match
      FROM in_fop_files
    expect:
      error: true

  - name: "NOT IN subquery with RHS NULL projects UNKNOWN"
    sql: |
      SELECT ID, ID NOT IN (SELECT result FROM in_nullable_rhs) AS ok
      FROM in_fop_files
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          ok: null
        - ID: 2
          ok: false
        - ID: 3
          ok: null
        - ID: 4
          ok: null
        - ID: 5
          ok: null

  - name: "IN subquery with RHS NULL projects UNKNOWN for nonmatch"
    sql: |
      SELECT ID, ID IN (SELECT result FROM in_nullable_rhs) AS ok
      FROM in_fop_files
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          ok: null
        - ID: 2
          ok: true
        - ID: 3
          ok: null
        - ID: 4
          ok: null
        - ID: 5
          ok: null

  - name: "Correlated NOT IN sees RHS NULL per domain"
    sql: |
      SELECT ID FROM in_fop_files f
      WHERE ID NOT IN (
        SELECT result FROM in_nullable_rhs r WHERE r.grp = f.ID
      )
      ORDER BY ID
    expect:
      rows: 3
      data:
