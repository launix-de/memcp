metadata:
  version: "1.0"
  description: "Membership statistics preserve distinct preparation and late-materialization populations"

setup: []
cleanup:
  - sql: "DROP TABLE IF EXISTS mcw_docs"
  - sql: "DROP TABLE IF EXISTS mcw_files"
  - sql: "DROP TABLE IF EXISTS mcw_acl"
test_cases:
  - name: "Late consumer fallback must not shadow measured stage work"
    scm: |
      (begin
        (define input (make_union_block 'all '() nil nil nil '()))
        (define stage (make_group_stage "work-test" input nil nil nil nil nil nil nil nil
          (list (list 'membership_candidate_input_rows 100000)
            (list 'membership_candidate_estimated_rows 4)
            (list 'membership_candidate_index_filter_rows 4)
            (list 'membership_candidate_broad_text_match_bytes 128))))
        (define block (make_query_block "memcp-tests" nil nil true nil nil nil nil nil nil nil nil))
        (define facts (membership_truth_cost_facts block stage))
        (if (and (equal? (qassoc_get facts 'membership_candidate_estimated_rows nil) 4)
              (equal? (qassoc_get facts 'membership_candidate_broad_text_match_bytes nil) 128))
          true (error "late fallback shadowed authoritative membership statistics")))

  - name: "LIMIT does not discount independently prepared downstream work"
    scm: |
      (begin
        (define facts (list
          (list 'membership_driver_input_rows 100000)
          (list 'membership_order_limit_driver true)
          (list 'membership_downstream_full_preparation_branches 1)
          (list 'membership_order_limit 72)
          (list 'membership_order_offset 8)))
        (define without (membership_projection_cost 100000 50000 72 facts))
        (define with (membership_projection_cost 100000 50000 72
          (qassoc_set facts 'membership_downstream_probe_branches 1)))
        (define extra (- (qassoc_get with 'total_ns 0) (qassoc_get without 'total_ns 0)))
        (define expected (qassoc_get (planner_membership_downstream_probe_cost 50000) 'total_ns 0))
        (if (< (sql_abs (- extra expected)) 1) true
          (error "LIMIT incorrectly discounted full downstream preparation")))

  - name: "Residual rejection does not turn full preparation into bounded probes"
    scm: |
      (begin
        (define facts (list
          (list 'membership_driver_input_rows 100000)
          (list 'membership_local_filter_rows 10000)
          (list 'membership_order_limit_driver true)
          (list 'membership_downstream_full_preparation_branches 1)
          (list 'membership_order_limit 72)
          (list 'membership_order_offset 8)))
        (define without (membership_projection_cost 100000 50000 72 facts))
        (define with (membership_projection_cost 100000 50000 72
          (qassoc_set facts 'membership_downstream_probe_branches 1)))
        (define extra (- (qassoc_get with 'total_ns 0) (qassoc_get without 'total_ns 0)))
        (define expected (qassoc_get (planner_membership_downstream_probe_cost 50000) 'total_ns 0))
        (if (< (sql_abs (- extra expected)) 1) true
          (error "residual selectivity incorrectly discounted full preparation")))

  - name: "Ordered late materialization costs only the bounded result mapper"
    scm: |
      (begin
        (define facts (list
          (list 'membership_driver_input_rows 100000)
          (list 'membership_order_limit_driver true)
          (list 'membership_order_limit 72)
          (list 'membership_order_offset 8)))
        (define without (membership_projection_cost 100000 50000 72 facts))
        (define with (membership_projection_cost 100000 50000 72
          (qassoc_set facts 'membership_downstream_probe_branches 1)))
        (define extra (- (qassoc_get with 'total_ns 0) (qassoc_get without 'total_ns 0)))
        (define expected (qassoc_get (planner_membership_downstream_probe_cost 72) 'total_ns 0))
        (if (< (sql_abs (- extra expected)) 1) true
          (error "late materialization ignored the bounded output population")))

  - name: "Ordered alternatives both pay shared candidate text work"
    scm: |
      (begin
        (define base (list
          (list 'membership_driver_input_rows 1000)
          (list 'membership_order_limit_driver true)))
        (define text_work (merge (list base (list
          (list 'membership_candidate_broad_text_match_rows 100)
          (list 'membership_candidate_broad_text_match_bytes 819200)))))
        (define candidate_base (membership_projection_cost 100 10 5 base))
        (define candidate_text (membership_projection_cost 100 10 5 text_work))
        (define driver_base (membership_ordered_driver_probe_cost 100 10 5 base))
        (define driver_text (membership_ordered_driver_probe_cost 100 10 5 text_work))
        (define candidate_extra (- (qassoc_get candidate_text 'total_ns 0)
          (qassoc_get candidate_base 'total_ns 0)))
        (define driver_extra (- (qassoc_get driver_text 'total_ns 0)
          (qassoc_get driver_base 'total_ns 0)))
        (if (and (> candidate_extra 0) (< (sql_abs (- candidate_extra driver_extra)) 1))
          true (error "shared text work biased the carrier alternatives")))

  - name: "Bounded wide text pages prefer late candidate materialization"
    scm: |
      (begin
        (define facts (list
          (list 'membership_driver_input_rows 100000)
          (list 'membership_local_filter_rows 100000)
          (list 'membership_order_limit_driver true)
          (list 'membership_order_limit 5)
          (list 'membership_order_offset 2)
          (list 'membership_candidate_probe_branches 2)
          (list 'membership_candidate_scan_invocations 2)
          (list 'membership_candidate_map_columns 1)
          (list 'membership_driver_scan_invocations 1)
          (list 'membership_driver_map_columns 20)
          (list 'membership_downstream_probe_branches 9)
          (list 'membership_candidate_broad_text_match_rows 50000)
          (list 'membership_candidate_broad_text_match_bytes 204800000)))
        (define candidate (membership_projection_cost 100000 5000 5 facts))
        (define driver (membership_ordered_driver_probe_cost 100000 5000 5 facts))
        (if (planner_cost_better? candidate driver)
          true (error "wide bounded page regressed to the ordered driver probe")))

  - name: "Unbounded candidate consumers retain complete residual work"
    scm: |
      (begin
        (define facts (list (list 'membership_driver_input_rows 100000)))
        (define without (membership_projection_cost 100000 50000 100000 facts))
        (define with (membership_projection_cost 100000 50000 100000
          (qassoc_set facts 'membership_downstream_probe_branches 1)))
        (define extra (- (qassoc_get with 'total_ns 0) (qassoc_get without 'total_ns 0)))
        (define expected (qassoc_get (planner_membership_downstream_probe_cost 50000) 'total_ns 0))
        (if (< (sql_abs (- extra expected)) 1) true
          (error "unbounded candidate consumer incorrectly received LIMIT braking")))

  - name: "COUNT lowering does not erase population-dependent residual costs"
    setup:
      - sql: "DROP TABLE IF EXISTS mcw_docs"
      - sql: "DROP TABLE IF EXISTS mcw_files"
      - sql: "DROP TABLE IF EXISTS mcw_acl"
      - sql: "CREATE TABLE mcw_docs (id INT PRIMARY KEY, file_id INT, site_id INT) ENGINE=sloppy"
      - sql: "CREATE TABLE mcw_files (id INT PRIMARY KEY, name TEXT, content TEXT) ENGINE=sloppy"
      - sql: "CREATE TABLE mcw_acl (id INT PRIMARY KEY, allowed INT) ENGINE=sloppy"
      - scm: |
          (begin
            (insert (table "memcp-tests" "mcw_docs") '("id" "file_id" "site_id")
              (map (produceN 2000) (lambda (i) (list i (mod i 100) (mod i 8)))))
            (insert (table "memcp-tests" "mcw_files") '("id" "name" "content")
              (map (produceN 100) (lambda (i) (list i (if (< i 5) "needle" "ordinary") "ordinary"))))
            (insert (table "memcp-tests" "mcw_acl") '("id" "allowed")
              (map (produceN 8) (lambda (i) (list i 1))))
            (rebuild (table "memcp-tests" "mcw_docs"))
            (rebuild (table "memcp-tests" "mcw_files"))
            (rebuild (table "memcp-tests" "mcw_acl")))
    scm: |
      (begin
        (define planning (newsession))
        (define sink (newsession))
        (planning "__memcp_explain_physical" sink)
        (parse_sql "memcp-tests"
          "SELECT COUNT(*) FROM mcw_docs d WHERE d.file_id IN (SELECT f.id FROM mcw_files f WHERE f.name LIKE '%needle%' UNION SELECT f.id FROM mcw_files f WHERE f.content LIKE '%needle%') AND COALESCE((SELECT a.allowed FROM mcw_acl a WHERE a.id=d.site_id LIMIT 1), FALSE)"
          nil planning nil)
        (define decisions (filter (planner_physical_explain_decisions sink)
          (lambda (d) (equal? (qassoc_get d "decision" nil) "membership_carrier"))))
        (define alternatives (merge (map decisions (lambda (d) (qassoc_get d "alternatives" '())))))
        (define carriers (filter alternatives (lambda (a)
          (contains? '("candidate_keyset" "prefiltered_candidate_keyset") (qassoc_get a "plan" nil)))))
        (if (and (>= (count carriers) 2)
          (reduce carriers (lambda (ok a)
            (and ok (> (qassoc_get (qassoc_get a "cost" '()) 'probe_ns 0) 0))) true))
          true (error "COUNT erased residual probe work from carrier alternatives")))
    expect:
      result_contains: ["true"]

  - name: "COUNT with projected membership and scalar ACL retains exact results"
    sql: |
      SELECT COUNT(*) AS n FROM mcw_docs d
      WHERE d.file_id IN (
        SELECT f.id FROM mcw_files f WHERE f.name LIKE '%needle%'
        UNION SELECT f.id FROM mcw_files f WHERE f.content LIKE '%needle%'
      ) AND COALESCE((SELECT a.allowed FROM mcw_acl a WHERE a.id=d.site_id LIMIT 1), FALSE)
    expect:
      rows: 1
      data: [{n: 100}]
