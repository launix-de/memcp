#
# Exercise boolean-shape recognition independently with a compact fixture. A
# missing projected RecSet proves that the compound CASE/OR tree was not
# recognized as a boolean-valued driver constraint.

metadata:
  version: "1.0"
  description: "Compound scalar boolean stages are eligible for projected RecSet drivers"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS cbr_global_acl"
  - sql: "DROP TABLE IF EXISTS cbr_node_acl"
  - sql: "DROP TABLE IF EXISTS cbr_node"
  - sql: "DROP TABLE IF EXISTS cbr_singleton"
  - sql: "DROP TABLE IF EXISTS cbr_numeric"
  - sql: "DROP TABLE IF EXISTS cbr_fallback_acl"
  - sql: "DROP TABLE IF EXISTS cbr_exists_acl"
  - sql: "DROP TABLE IF EXISTS cbr_large_item"
  - sql: "DROP TABLE IF EXISTS cbr_item"
  - sql: "DROP TABLE IF EXISTS cbr_scope"
  - sql: "CREATE TABLE cbr_scope (id INT PRIMARY KEY, direct_flag INT)"
  - sql: "CREATE TABLE cbr_global_acl (id INT PRIMARY KEY, actor INT, allowed BOOL)"
  - sql: "CREATE TABLE cbr_item (id INT PRIMARY KEY, scope_id INT)"
  - sql: "CREATE TABLE cbr_large_item (id INT PRIMARY KEY, scope_id INT)"
  - sql: "CREATE TABLE cbr_exists_acl (id INT PRIMARY KEY, scope_id INT, allowed BOOL)"
  - sql: "CREATE TABLE cbr_fallback_acl (id INT PRIMARY KEY, scope_id INT, allowed BOOL)"
  - sql: "CREATE TABLE cbr_singleton (id INT PRIMARY KEY)"
  - sql: "CREATE TABLE cbr_numeric (id INT PRIMARY KEY, scope_id INT UNIQUE, value INT)"
  - sql: "CREATE TABLE cbr_node (id INT PRIMARY KEY)"
  - sql: "CREATE TABLE cbr_node_acl (node_id INT UNIQUE, allowed BOOL)"
  - sql: "INSERT INTO cbr_scope VALUES (1, 1), (2, 0), (3, 0), (4, 0)"
  - sql: "SET @cbr_actor = 1"
  - sql: "INSERT INTO cbr_exists_acl VALUES (1, 2, TRUE)"
  - sql: "INSERT INTO cbr_fallback_acl VALUES (1, 3, TRUE), (2, NULL, TRUE)"
  - sql: "INSERT INTO cbr_singleton VALUES (1)"
  - sql: "INSERT INTO cbr_numeric VALUES (1, 1, 9), (2, 2, 7)"
  - scm: |
      (begin
        (insert (table "memcp-tests" "cbr_item") (list "id" "scope_id")
          (map (produceN 900) (lambda (i)
            (list (+ i 1) (+ (mod i 4) 1)))))
        (insert (table "memcp-tests" "cbr_large_item") (list "id" "scope_id")
          (map (produceN 5000) (lambda (i)
            (list (+ i 1) (+ (mod i 4) 1)))))
        (insert (table "memcp-tests" "cbr_node") (list "id")
          (map (produceN 100) (lambda (i) (list (+ i 1)))))
        (insert (table "memcp-tests" "cbr_node_acl") (list "node_id" "allowed")
          (map (produceN 100) (lambda (i) (list (+ i 1) true))))
        (insert (table "memcp-tests" "cbr_global_acl") (list "id" "actor" "allowed")
          (map (produceN 5000) (lambda (i) (list (+ i 1) 1 (equal? i 0)))))
        (rebuild (table "memcp-tests" "cbr_item") true false)
        (rebuild (table "memcp-tests" "cbr_large_item") true false)
        (rebuild (table "memcp-tests" "cbr_scope") true false)
        (rebuild (table "memcp-tests" "cbr_exists_acl") true false)
        (rebuild (table "memcp-tests" "cbr_fallback_acl") true false)
        (rebuild (table "memcp-tests" "cbr_singleton") true false)
        (rebuild (table "memcp-tests" "cbr_numeric") true false)
        (rebuild (table "memcp-tests" "cbr_node") true false)
        (rebuild (table "memcp-tests" "cbr_node_acl") true false)
        (rebuild (table "memcp-tests" "cbr_global_acl") true false)
        900)

test_cases:
  - name: "compound scalar boolean projection preserves CASE and OR results"
    sql: |
      SELECT i.id, COALESCE((
        SELECT CASE WHEN s.direct_flag = 1 THEN TRUE ELSE (
          EXISTS (
            SELECT TRUE FROM cbr_exists_acl ea
            WHERE ea.scope_id = s.id AND ea.allowed = TRUE
            LIMIT 1
          ) OR COALESCE((
            SELECT fa.allowed FROM cbr_fallback_acl fa
            WHERE fa.scope_id = s.id
            LIMIT 1
          ), FALSE)
        ) END
        FROM cbr_scope s WHERE s.id = i.scope_id LIMIT 1
      ), FALSE) AS permitted
      FROM cbr_item i
      WHERE i.id <= 4
      ORDER BY i.id
    expect:
      rows: 4
      data:
        - {id: 1, permitted: true}
        - {id: 2, permitted: true}
        - {id: 3, permitted: true}
        - {id: 4, permitted: false}

  - name: "repeated equivalent EXISTS aliases preserve boolean results"
    sql: |
      SELECT COUNT(*) AS permitted
      FROM cbr_item i
      WHERE EXISTS (
          SELECT TRUE FROM cbr_exists_acl first_acl
          WHERE first_acl.scope_id = i.scope_id
            AND first_acl.allowed = TRUE
          LIMIT 1
        ) OR EXISTS (
          SELECT TRUE FROM cbr_exists_acl second_acl
          WHERE second_acl.scope_id = i.scope_id
            AND second_acl.allowed = TRUE
          LIMIT 1
        )
    expect:
      rows: 1
      data:
        - {permitted: 225}

  - name: "repeated equivalent EXISTS aliases share one logical stage"
    sql: |
      EXPLAIN IR SELECT COUNT(*)
      FROM cbr_item i
      WHERE EXISTS (
          SELECT TRUE FROM cbr_exists_acl first_acl
          WHERE first_acl.scope_id = i.scope_id
            AND first_acl.allowed = TRUE
          LIMIT 1
        ) OR EXISTS (
          SELECT TRUE FROM cbr_exists_acl second_acl
          WHERE second_acl.scope_id = i.scope_id
            AND second_acl.allowed = TRUE
          LIMIT 1
        )
    expect:
      rows: 1
      result_occurrences:
        - text: "purpose exists"
          count: 2

  - name: "NOT EXISTS uses an exact RecSet complement"
    sql: |
      EXPLAIN SELECT i.id
      FROM cbr_item i
      WHERE NOT EXISTS (
        SELECT TRUE FROM cbr_exists_acl ea
        WHERE ea.scope_id = i.scope_id AND ea.allowed = TRUE
      )
    expect:
      rows: 1
      result_contains:
        - "recset_not"
        - "recset_project_join"
      result_not_contains:
        - "$recset_contains"

  - name: "selective filter and NOT EXISTS use exact RecSet difference"
    sql: |
      EXPLAIN SELECT i.id
      FROM cbr_item i
      WHERE i.id <= 700
        AND NOT EXISTS (
          SELECT TRUE FROM cbr_exists_acl ea
          WHERE ea.scope_id = i.scope_id AND ea.allowed = TRUE
        )
    expect:
      rows: 1
      result_contains:
        - "recset_difference"
        - "recset_project_join"

  - name: "RecSet NOT and difference preserve NOT EXISTS results"
    sql: |
      SELECT
        SUM(NOT EXISTS (
          SELECT TRUE FROM cbr_exists_acl ea
          WHERE ea.scope_id = i.scope_id AND ea.allowed = TRUE
        )) AS missing_exists,
        SUM(EXISTS (
          SELECT TRUE FROM cbr_exists_acl ea
          WHERE ea.scope_id = i.scope_id AND ea.allowed = TRUE
        ) AND NOT EXISTS (
          SELECT TRUE FROM cbr_fallback_acl fa
          WHERE fa.scope_id = i.scope_id AND fa.allowed = TRUE
        )) AS exists_without_fallback
      FROM cbr_item i
    expect:
      rows: 1
      data:
        - {missing_exists: 675, exists_without_fallback: 225}

  - name: "nullable NOT IN is not lowered through RecSet complement"
    sql: |
      EXPLAIN SELECT i.id
      FROM cbr_item i
      WHERE i.scope_id NOT IN (
        SELECT fa.scope_id FROM cbr_fallback_acl fa WHERE fa.allowed = TRUE
      )
    expect:
      rows: 1
      result_not_contains:
        - "recset_not"
        - "recset_difference"

  - name: "nullable NOT IN keeps UNKNOWN rows out"
    sql: |
      SELECT COUNT(*) AS matched
      FROM cbr_item i
      WHERE i.scope_id NOT IN (
        SELECT fa.scope_id FROM cbr_fallback_acl fa WHERE fa.allowed = TRUE
      )
    expect:
      rows: 1
      data:
        - {matched: 0}

  - name: "query-invariant EXISTS is realized once per query"
    sql: |
      EXPLAIN SELECT COUNT(*)
      FROM cbr_item i
      WHERE COALESCE((
        SELECT CASE WHEN EXISTS (
          SELECT TRUE FROM cbr_global_acl global_acl
          WHERE global_acl.actor = @cbr_actor
            AND global_acl.allowed = TRUE
          LIMIT 1
        ) THEN TRUE ELSE FALSE END
        FROM cbr_scope s
        WHERE s.id = i.scope_id
        LIMIT 1
      ), FALSE)
    expect:
      rows: 1
      contains:
        - "__query_presence_probe_"
        - "__physical_query_tx"
        - "get_or_compute_scoped"
      result_occurrences:
        - text: "__query_presence_probe_"
          count: 1
        - text: "__memcp_tx"
          count: 1

  - name: "observed boolean carrier closes invariant EXISTS and NOT probes"
    sql: |
      SELECT i.id
      FROM cbr_large_item i
      WHERE COALESCE((
        SELECT CASE WHEN EXISTS (
          SELECT TRUE FROM cbr_global_acl global_acl
          WHERE global_acl.actor = @cbr_actor
            AND global_acl.allowed = TRUE
          LIMIT 1
        ) THEN TRUE ELSE NOT EXISTS (
          SELECT TRUE FROM cbr_global_acl denied_acl
          WHERE denied_acl.actor = @cbr_actor
            AND denied_acl.allowed = FALSE
          LIMIT 1
        ) END
        FROM cbr_scope s
        WHERE s.id = i.scope_id
        LIMIT 1
      ), FALSE)
      ORDER BY i.id DESC
      LIMIT 3
    expect:
      rows: 3
      data:
        - {id: 5000}
        - {id: 4999}
        - {id: 4998}

  - name: "compound scalar boolean filter selects a projected RecSet driver"
    sql: |
      EXPLAIN SELECT COUNT(*) FROM cbr_item i
      WHERE COALESCE((
          SELECT CASE WHEN s.direct_flag = 1 THEN TRUE ELSE (
            EXISTS (
              SELECT TRUE FROM cbr_exists_acl ea
              WHERE ea.scope_id = s.id AND ea.allowed = TRUE
              LIMIT 1
            ) OR COALESCE((
              SELECT fa.allowed FROM cbr_fallback_acl fa
              WHERE fa.scope_id = s.id
              LIMIT 1
            ), FALSE)
          ) END
          FROM cbr_scope s WHERE s.id = i.scope_id LIMIT 1
        ), FALSE)
    expect:
      rows: 1
      result_contains:
        - "recset_project_join"
      result_not_contains:
        - "recset_key_index"

  - name: "nested compound scalar reused by filter and projections keeps its RecSet carrier"
    sql: |
      EXPLAIN SELECT i.id,
        COALESCE((
          SELECT (CASE WHEN s.direct_flag = 1 THEN TRUE ELSE EXISTS (
            SELECT TRUE FROM cbr_exists_acl ea
            WHERE ea.scope_id = s.id AND ea.allowed = TRUE
            LIMIT 1
          ) END) AND COALESCE((
            SELECT (nested_scope.direct_flag = 1) OR EXISTS (
              SELECT TRUE FROM cbr_fallback_acl fa
              WHERE fa.scope_id = nested_scope.id AND fa.allowed = TRUE
              LIMIT 1
            )
            FROM cbr_scope nested_scope
            WHERE nested_scope.id = s.id
            LIMIT 1
          ), FALSE)
          FROM cbr_scope s WHERE s.id = i.scope_id LIMIT 1
        ), FALSE) AS can_view,
        COALESCE((
          SELECT (CASE WHEN s.direct_flag = 1 THEN TRUE ELSE EXISTS (
            SELECT TRUE FROM cbr_exists_acl ea
            WHERE ea.scope_id = s.id AND ea.allowed = TRUE
            LIMIT 1
          ) END) AND COALESCE((
            SELECT (nested_scope.direct_flag = 1) OR EXISTS (
              SELECT TRUE FROM cbr_fallback_acl fa
              WHERE fa.scope_id = nested_scope.id AND fa.allowed = TRUE
              LIMIT 1
            )
            FROM cbr_scope nested_scope
            WHERE nested_scope.id = s.id
            LIMIT 1
          ), FALSE)
          FROM cbr_scope s WHERE s.id = i.scope_id LIMIT 1
        ), FALSE) AS can_edit
      FROM cbr_large_item i
      WHERE COALESCE((
        SELECT (CASE WHEN s.direct_flag = 1 THEN TRUE ELSE EXISTS (
          SELECT TRUE FROM cbr_exists_acl ea
          WHERE ea.scope_id = s.id AND ea.allowed = TRUE
          LIMIT 1
        ) END) AND COALESCE((
          SELECT (nested_scope.direct_flag = 1) OR EXISTS (
            SELECT TRUE FROM cbr_fallback_acl fa
            WHERE fa.scope_id = nested_scope.id AND fa.allowed = TRUE
            LIMIT 1
          )
          FROM cbr_scope nested_scope
          WHERE nested_scope.id = s.id
          LIMIT 1
        ), FALSE)
        FROM cbr_scope s WHERE s.id = i.scope_id LIMIT 1
      ), FALSE)
      ORDER BY i.id
      LIMIT 72
    expect:
      rows: 1
      result_contains:
        - "recset_project_join"
        - "get_or_compute_scoped"
      result_occurrences:
        - text: "get_or_compute_scoped"
          count: 1

  - name: "nullable join node costs its own scalar probe work"
    sql: |
      EXPLAIN SELECT COUNT(*)
      FROM cbr_singleton root_row
      LEFT JOIN cbr_node node_row ON COALESCE((
          SELECT node_acl.allowed = TRUE
          FROM cbr_node_acl node_acl
          WHERE node_acl.node_id = node_row.id
          LIMIT 1
        ), FALSE)
      WHERE TRUE
    expect:
      rows: 1
      contains:
        - "recset_key_index"
      result_occurrences:
        - text: "recset_key_index"
          count: 1

  - name: "boolean dependency does not change a numeric scalar value"
    sql: |
      SELECT SUM(COALESCE((
        SELECT CASE WHEN EXISTS (
          SELECT TRUE FROM cbr_exists_acl ea
          WHERE ea.scope_id = s.id
          LIMIT 1
        ) THEN COALESCE((
          SELECT n.value FROM cbr_numeric n
          WHERE n.scope_id = s.id
          LIMIT 1
        ), 0) ELSE 0 END
        FROM cbr_scope s
        WHERE s.id = i.scope_id
        LIMIT 1
      ), 0)) AS total
      FROM cbr_item i
    expect:
      rows: 1
      data:
        - {total: 1575}

  - name: "nullable boolean scalar preserves NULL in value context"
    sql: |
      SELECT COUNT((
        SELECT n.value = 7
        FROM cbr_numeric n
        WHERE n.scope_id = i.scope_id
        LIMIT 1
      )) AS present_values
      FROM cbr_item i
    expect:
      rows: 1
      data:
        - {present_values: 450}

  - name: "nullable boolean value context does not select a truth-only RecSet"
    sql: |
      EXPLAIN SELECT COUNT((
        SELECT n.value = 7
        FROM cbr_numeric n
        WHERE n.scope_id = i.scope_id
        LIMIT 1
      )) AS present_values
      FROM cbr_item i
    expect:
      rows: 1
      not_contains:
        - "recset_key_index"

  - name: "begin transaction for query-scoped carrier test"
    sql: "START TRANSACTION"
    expect:
      rows: 0

  - name: "transaction carrier sees initial values"
    sql: |
      SELECT COUNT(*) AS permitted FROM cbr_item i
      WHERE COALESCE((
        SELECT n.value = 7 FROM cbr_numeric n
        WHERE n.scope_id = i.scope_id
        LIMIT 1
      ), FALSE)
    expect:
      rows: 1
      data:
        - {permitted: 225}

  - name: "mutate carrier input inside transaction"
    sql: "UPDATE cbr_numeric SET value = 7 WHERE scope_id = 1"
    expect:
      affected_rows: 1

  - name: "next query generation rebuilds carrier inside same transaction"
    sql: |
      SELECT COUNT(*) AS permitted FROM cbr_item i
      WHERE COALESCE((
        SELECT n.value = 7 FROM cbr_numeric n
        WHERE n.scope_id = i.scope_id
        LIMIT 1
      ), FALSE)
    expect:
      rows: 1
      data:
        - {permitted: 450}

  - name: "rollback query-scoped carrier test"
    sql: "ROLLBACK"
    expect:
      rows: 0

cleanup:
  - sql: "DROP TABLE IF EXISTS cbr_global_acl"
  - sql: "DROP TABLE IF EXISTS cbr_node_acl"
  - sql: "DROP TABLE IF EXISTS cbr_node"
  - sql: "DROP TABLE IF EXISTS cbr_singleton"
  - sql: "DROP TABLE IF EXISTS cbr_numeric"
  - sql: "DROP TABLE IF EXISTS cbr_fallback_acl"
  - sql: "DROP TABLE IF EXISTS cbr_exists_acl"
  - sql: "DROP TABLE IF EXISTS cbr_large_item"
  - sql: "DROP TABLE IF EXISTS cbr_item"
  - sql: "DROP TABLE IF EXISTS cbr_scope"
