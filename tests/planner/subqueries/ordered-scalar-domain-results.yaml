- name: Native table domains retain the same aggregate coordinates
  syntax: mysql
  sql: |
    SELECT d.x,p.category,
      COALESCE((SELECT SUM((SELECT h.quantity FROM ordered_domain_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)) FROM ordered_domain_entity e WHERE (p.category IS NULL OR e.category=p.category)
          AND (SELECT k.active FROM ordered_domain_kind k WHERE k.name=(SELECT h.kind FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
          AND COALESCE((SELECT h.end_value FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total,
      (SELECT COUNT(*) FROM ordered_domain_entity e WHERE (p.category IS NULL OR e.category=p.category)
          AND (SELECT k.active FROM ordered_domain_kind k WHERE k.name=(SELECT h.kind FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
          AND COALESCE((SELECT h.end_value FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x) AS matched_rows,
      (SELECT COUNT((SELECT h.quantity FROM ordered_domain_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)) FROM ordered_domain_entity e WHERE (p.category IS NULL OR e.category=p.category)
          AND (SELECT k.active FROM ordered_domain_kind k WHERE k.name=(SELECT h.kind FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
          AND COALESCE((SELECT h.end_value FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x) AS valued_rows
    FROM ordered_domain_axis d CROSS JOIN ordered_domain_category p
    ORDER BY d.x,COALESCE(p.category,-1)
  expect: {"rows":9,"data":[{"x":5,"category":null,"total":5,"matched_rows":3,"valued_rows":2},{"x":5,"category":0,"total":2,"matched_rows":1,"valued_rows":1},{"x":5,"category":1,"total":3,"matched_rows":2,"valued_rows":1},{"x":15,"category":null,"total":10,"matched_rows":3,"valued_rows":2},{"x":15,"category":0,"total":7,"matched_rows":1,"valued_rows":1},{"x":15,"category":1,"total":3,"matched_rows":2,"valued_rows":1},{"x":25,"category":null,"total":13,"matched_rows":2,"valued_rows":1},{"x":25,"category":0,"total":13,"matched_rows":1,"valued_rows":1},{"x":25,"category":1,"total":0,"matched_rows":1,"valued_rows":0}]}
