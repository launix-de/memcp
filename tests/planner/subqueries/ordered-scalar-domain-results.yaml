- name: tsql ordered SUM retains moving and fixed caller coordinates
  syntax: tsql
  sql: |
    SELECT d.x,p.category,
      COALESCE((SELECT SUM(selected.quantity) FROM (SELECT e.category,
          (SELECT TOP 1 h.quantity FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC) AS quantity,
          (SELECT TOP 1 k.active FROM ordered_domain_kind k
            WHERE k.name=(SELECT TOP 1 h.kind FROM ordered_domain_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC)) AS active,
          (SELECT TOP 1 h.end_value FROM ordered_domain_history h
            WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC) AS end_value
        FROM ordered_domain_entity e) selected
        WHERE (p.category IS NULL OR selected.category=p.category)
          AND selected.active=1 AND COALESCE(selected.end_value,d.x)>=d.x),0) AS total
    FROM (SELECT 5 AS x UNION SELECT 15 UNION SELECT 25) d
    CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    ORDER BY d.x,COALESCE(p.category,-1)
  expect: {"rows":9,"data":[{"x":5,"category":null,"total":5},{"x":5,"category":0,"total":2},{"x":5,"category":1,"total":3},{"x":15,"category":null,"total":10},{"x":15,"category":0,"total":7},{"x":15,"category":1,"total":3},{"x":25,"category":null,"total":13},{"x":25,"category":0,"total":13},{"x":25,"category":1,"total":0}]}
