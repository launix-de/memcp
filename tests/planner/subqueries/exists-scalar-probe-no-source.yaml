# Regression for a scalar-first-probe promoted through a top-level, FROM-less
# query (a bare "SELECT EXISTS (...)" with no outer table). The compound
# correlated scalar probe promotion (PR #535) rewrites the EXISTS's field
# expression into a `(scalar_first_probe stage col ...)` IR marker, but the
# zero-source lowering path (lower_zero_source_query_block ->
# lower_scalar_marker_expr) previously had no case for that marker, so it was
# never consumed and reached Eval verbatim, panicking with
# "Unknown function: scalar_first_probe". Only triggered when the outermost
# query itself has no FROM clause -- the same EXISTS(...) expression used as
# a projected column of a query with a real FROM clause lowers correctly
# because that path goes through the per-row scan projection lowering
# instead. Pattern distilled from a "does inbox have unread mail" navbar
# access check (outer EXISTS wrapping a scalar subselect that compares a
# session variable, optionally with a further nested correlated EXISTS).

metadata:
  version: "1.0"
  description: "Top-level FROM-less SELECT EXISTS(...) wrapping a scalar subselect that references a session variable"

setup:
  - sql: "DROP TABLE IF EXISTS espn_share"
  - sql: "DROP TABLE IF EXISTS espn_parent"
  - sql: "CREATE TABLE espn_parent (id INT PRIMARY KEY, owner_id INT)"
  - sql: "CREATE TABLE espn_share (id INT PRIMARY KEY AUTO_INCREMENT, parent_id INT, user_id INT)"
  - sql: "INSERT INTO espn_parent VALUES (1, 10), (2, 20)"
  - sql: "INSERT INTO espn_share (parent_id, user_id) VALUES (2, 99)"

test_cases:

  - name: "set session user with share access"
    session_id: "sess_espn"
    sql: "SET @session_user = 99"

  - name: "minimal: bare SELECT EXISTS(...) with correlated scalar subselect comparing a session var"
    session_id: "sess_espn"
    sql: |
      SELECT EXISTS (
        SELECT TRUE FROM espn_parent k
        WHERE
          (SELECT z.owner_id = @session_user FROM espn_parent z WHERE z.id = k.id LIMIT 1)
      ) AS has_access
    expect:
      rows: 1
      data:
        - has_access: 0

  - name: "full shape: outer EXISTS, AND-wrapped CASE-projected scalar subselect, nested NOT EXISTS, session var used twice -- access via share"
    session_id: "sess_espn"
    sql: |
      SELECT EXISTS (
        SELECT TRUE FROM espn_parent k
        WHERE TRUE AND (
          (SELECT (CASE WHEN FALSE THEN TRUE ELSE
             NOT ((z.owner_id <> @session_user) AND
                  (NOT (EXISTS (SELECT TRUE FROM espn_share w
                                WHERE w.parent_id = z.id AND w.user_id = @session_user LIMIT 1))))
           END)
           AND (CASE WHEN TRUE THEN TRUE ELSE FALSE END)
           AND TRUE
           FROM espn_parent z WHERE z.id = k.id LIMIT 1)
        )
      ) AS has_access
    expect:
      rows: 1
      data:
        - has_access: 1

  - name: "switch session user to one with no owner match and no share"
    session_id: "sess_espn"
    sql: "SET @session_user = 77"

  - name: "full shape: no owner match, no share -- no access"
    session_id: "sess_espn"
    sql: |
      SELECT EXISTS (
        SELECT TRUE FROM espn_parent k
        WHERE TRUE AND (
          (SELECT (CASE WHEN FALSE THEN TRUE ELSE
             NOT ((z.owner_id <> @session_user) AND
                  (NOT (EXISTS (SELECT TRUE FROM espn_share w
                                WHERE w.parent_id = z.id AND w.user_id = @session_user LIMIT 1))))
           END)
           AND (CASE WHEN TRUE THEN TRUE ELSE FALSE END)
           AND TRUE
           FROM espn_parent z WHERE z.id = k.id LIMIT 1)
        )
      ) AS has_access
    expect:
      rows: 1
      data:
        - has_access: 0

  - name: "switch session user to direct owner match"
    session_id: "sess_espn"
    sql: "SET @session_user = 10"

  - name: "full shape: direct owner match -- access"
    session_id: "sess_espn"
    sql: |
      SELECT EXISTS (
        SELECT TRUE FROM espn_parent k
        WHERE TRUE AND (
          (SELECT (CASE WHEN FALSE THEN TRUE ELSE
             NOT ((z.owner_id <> @session_user) AND
                  (NOT (EXISTS (SELECT TRUE FROM espn_share w
                                WHERE w.parent_id = z.id AND w.user_id = @session_user LIMIT 1))))
           END)
           AND (CASE WHEN TRUE THEN TRUE ELSE FALSE END)
           AND TRUE
           FROM espn_parent z WHERE z.id = k.id LIMIT 1)
        )
      ) AS has_access
    expect:
      rows: 1
      data:
        - has_access: 1

  - name: Repeated source-free expression is evaluated exactly once
    scm: |-
      (begin
      (define calls (newsession))
      (define value (lambda () (begin (calls "count" (+ 1 (coalesceNil (calls "count") 0))) 7)))
      (define expression (list value))
      (define fields (list "a" expression "b" expression))

      (define plan (lower_zero_source_result_expr fields))
      (define output (newsession))
      ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
       (lambda (row) (output "row" row)))
      (define row (output "row"))
      (and (equal? (row "a") 7) (equal? (row "b") 7) (equal? (calls "count") 1)))
    expect:
      result: true
  - name: Source-free projection distinguishes closures with identical bodies
    scm: |-
      (begin
      (define factory (lambda (captured) (lambda () captured)))
      (define first (list (factory 1)))
      (define second (list (factory 2)))
      (define fields (list "a" first "b" second "a2" first "b2" second))

      (define plan (lower_zero_source_result_expr fields))
      (define output (newsession))
      ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
       (lambda (row) (output "row" row)))
      (define row (output "row"))
      (and (equal? (row "a") 1) (equal? (row "a2") 1)
       (equal? (row "b") 2) (equal? (row "b2") 2)))
    expect:
      result: true
  - name: Source-free expression identity preserves literal types and null
    scm: |-
      (begin
      (define fields (list "missing" nil "zero" 0 "text" "1" "number" 1))

      (define plan (lower_zero_source_result_expr fields))
      (define output (newsession))
      ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
       (lambda (row) (output "row" row)))
      (define row (output "row"))
      (and (equal? (count row) 8) (nil? (row "missing")) (number? (row "zero")) (equal? (row "zero") 0)
       (string? (row "text")) (number? (row "number"))))
    expect:
      result: true
  - name: Source annotations preserve exact expression sharing
    scm: |-
      (begin
      (define calls (newsession))
      (define value (lambda () (begin (calls "count" (+ 1 (coalesceNil (calls "count") 0))) 9)))
      (define expression (list value))
      (define fields (list "a" expression "b" (source "projection-test" 2 3 expression)))

      (define plan (lower_zero_source_result_expr fields))
      (define output (newsession))
      ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
       (lambda (row) (output "row" row)))
      (define row (output "row"))
      (and (equal? (row "a") 9) (equal? (row "b") 9) (equal? (calls "count") 1)))
    expect:
      result: true
  - name: Colliding closure hashes remain distinct through frozen AST lookup
    scm: |-
      (begin
      (define factory (lambda (captured) (lambda () captured)))
      (define expressions (map (produceN 6) (lambda (value) (list (factory value)))))
      (define forced (make_structural_catalog true))
      (reduce (produceN 6) (lambda (_ index) (forced (nth expressions index) index)) nil)
      (define lookup (forced))
      (define fields (reduce (produceN 6) (lambda (fields index)
       (merge fields (list (concat "a" index) (nth expressions index)
        (concat "b" index) (nth expressions index)))) (list)))

      (define plan (lower_zero_source_result_expr fields))
      (define output (newsession))
      ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
       (lambda (row) (output "row" row)))
      (define row (output "row"))
      (reduce (produceN 6) (lambda (correct index)
       (and correct (number? (lookup (nth expressions index))) (equal? (lookup (nth expressions index)) index)
        (equal? (row (concat "a" index)) index)
        (equal? (row (concat "b" index)) index))) true))
    expect:
      result: true
  - name: Shared source-free IR defines each exact expression once
    scm: |-
      (begin
      (define factory (lambda (captured) (lambda () captured)))
      (define first (list (factory 1)))
      (define second (list (factory 2)))
      (define plan (lower_zero_source_result_expr (list "a" first "b" second "a2" first "b2" second)))
      (match plan
       (cons (symbol !begin) tail)
       (and (equal? (count tail) 3)
        (match (car tail) ((symbol define) _name value) (equal? value first) _ false)
        (match (cadr tail) ((symbol define) _name value) (equal? value second) _ false)
        (match (nth tail 2) ((symbol resultrow) _values) true _ false))
       _ false))
    expect:
      result: true

  - name: Source-free UUID occurrences stay independent in executable IR
    scm: |
      (begin
        (define expression (list (quote uuid)))
        (expression_equal?
          (lower_zero_source_result_expr (list "first" expression "second" expression))
          (list (quote resultrow) (list (quote list) "first" expression "second" expression))))
    expect:
      result: true

  - name: Source-free nested UUID occurrences stay independent in executable IR
    scm: |
      (begin
        (define expression (list (quote concat) "token:" (list (quote uuid))))
        (expression_equal?
          (lower_zero_source_result_expr (list "first" expression "second" expression))
          (list (quote resultrow) (list (quote list) "first" expression "second" expression))))
    expect:
      result: true

  - name: Source-free projection reuses the existing volatile-call guard
    scm: |
      (reduce (list (list (quote sql_rand)) (list (quote randomBytes) 8))
        (lambda (valid expression)
          (and valid (expression_equal?
            (lower_zero_source_result_expr (list "first" expression "second" expression))
            (list (quote resultrow) (list (quote list) "first" expression "second" expression))))) true)
    expect:
      result: true

  - name: Source-free UUID projection executes each occurrence independently
    scm: |
      (begin
        (define expression (list (quote uuid)))
        (define plan (lower_zero_source_result_expr (list "first" expression "second" expression)))
        (define output (newsession))
        ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
          (lambda (row) (output "row" row)))
        (define row (output "row"))
        (and (regexp_test (row "first") "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")
          (regexp_test (row "second") "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")
          (not (equal? (row "first") (row "second")))))
    expect:
      result: true

  - name: Reused source-free UUID plan evaluates fresh values on every invocation
    scm: |
      (begin
        (define expression (list (quote uuid)))
        (define plan (lower_zero_source_result_expr (list "first" expression "second" expression)))
        (define compiled (jit (close_procedure
          (eval (optimize (list (quote lambda) (list (quote resultrow)) plan))))))
        (define first (newsession))
        (define second (newsession))
        (compiled (lambda (row) (first "row" row)))
        (compiled (lambda (row) (second "row" row)))
        (define values (list ((first "row") "first") ((first "row") "second")
          ((second "row") "first") ((second "row") "second")))
        (equal? (count (merge_unique (list values))) 4))
    expect:
      result: true

  - name: Source-free opaque expression retains its existing shared evaluation
    scm: |
      (begin
        (define calls (newsession))
        (define value (lambda () (begin (calls "count" (+ 1 (coalesceNil (calls "count") 0))) 7)))
        (define expression (list value))
        (define plan (lower_zero_source_result_expr (list "first" expression "second" expression)))
        (define output (newsession))
        ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
          (lambda (row) (output "row" row)))
        (and (equal? ((output "row") "first") 7) (equal? ((output "row") "second") 7)
          (equal? (calls "count") 1)))
    expect:
      result: true

  - name: Source-free shared opaque values coexist with independent UUID calls
    scm: |
      (begin
        (define calls (newsession))
        (define value (lambda () (begin (calls "count" (+ 1 (coalesceNil (calls "count") 0))) 7)))
        (define stable (list value))
        (define volatile (list (quote uuid)))
        (define plan (lower_zero_source_result_expr
          (list "first" stable "second" stable "first_id" volatile "second_id" volatile)))
        (define output (newsession))
        ((jit (close_procedure (eval (optimize (list (quote lambda) (list (quote resultrow)) plan)))))
          (lambda (row) (output "row" row)))
        (define row (output "row"))
        (and (equal? (row "first") 7) (equal? (row "second") 7) (equal? (calls "count") 1)
          (not (equal? (row "first_id") (row "second_id")))))
    expect:
      result: true


cleanup:
  - sql: "DROP TABLE IF EXISTS espn_share"
  - sql: "DROP TABLE IF EXISTS espn_parent"
