# Indexed membership costing regressions

metadata:
  version: "1.0"
  description: "Preserve approximate-index bounds through membership costing"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS imc_projection_key"
  - sql: "DROP TABLE IF EXISTS imc_projection_value"
  - sql: "CREATE TABLE imc_projection_key (id INT PRIMARY KEY, k INT, enabled INT) ENGINE=memory"
  - sql: "CREATE TABLE imc_projection_value (k INT, epoch INT, actor INT) ENGINE=memory"
  - sql: "INSERT INTO imc_projection_key VALUES (1,10,1),(2,10,1),(3,20,1),(4,NULL,1),(5,30,1),(6,10,0)"
  - sql: "INSERT INTO imc_projection_value VALUES (10,0,7),(10,0,7),(20,0,8),(30,1,7),(NULL,0,7),(99,0,7)"
  - sql: "DROP TABLE IF EXISTS imc_acl"
  - sql: "DROP TABLE IF EXISTS imc_assignment"
  - sql: "DROP TABLE IF EXISTS imc_domain"
  - sql: "DROP TABLE IF EXISTS imc_override"
  - sql: "DROP TABLE IF EXISTS imc_document"
  - sql: "DROP TABLE IF EXISTS imc_file"
  - sql: "CREATE TABLE imc_file (id INT PRIMARY KEY, filename VARCHAR(64), search VARCHAR(4096))"
  - sql: "CREATE TABLE imc_document (id INT PRIMARY KEY, file_id INT, sort_key INT)"
  - sql: "CREATE TABLE imc_acl (document_id INT PRIMARY KEY, allowed INT)"
  - sql: "CREATE TABLE imc_domain (id INT NOT NULL PRIMARY KEY, direct_flag INT)"
  - sql: "CREATE TABLE imc_assignment (domain_id INT NOT NULL, actor_id INT, allowed INT)"
  - sql: "CREATE TABLE imc_override (domain_id INT, actor_id INT, allowed INT)"
  - scm: |
      (begin
        (insert (table "memcp-tests" "imc_file") '("id" "filename" "search")
          (map (produceN 640) (lambda (i)
            (list i
              (concat "file-" (string i))
              (if (equal? (mod i 256) 0)
                (concat "prefix-klaus-suffix-" (string i))
                (string_repeat "kl--la--au--us--" 128))))))
        (insert (table "memcp-tests" "imc_document") '("id" "file_id" "sort_key")
          (map (produceN 1250) (lambda (i) (list i (mod i 640) i))))
        (insert (table "memcp-tests" "imc_acl") '("document_id" "allowed")
          (map (produceN 1250) (lambda (i) (list i 1))))
        (insert (table "memcp-tests" "imc_domain") '("id" "direct_flag")
          (map (produceN 640) (lambda (i) (list i (if (equal? (mod i 11) 0) 1 0)))))
        (insert (table "memcp-tests" "imc_assignment") '("domain_id" "actor_id" "allowed")
          (map (produceN 320) (lambda (i) (list (* i 2) 7 1))))
        (insert (table "memcp-tests" "imc_override") '("domain_id" "actor_id" "allowed")
          (map (produceN 214) (lambda (i) (list (* i 3) 7 1))))
        (rebuild))
  # Two scans cross the normal adaptive-index savings threshold. The EXPLAIN
  # cases below must therefore consume the hook's explicit upper bound rather
  # than a bounded table sample.
  - sql: "SELECT id FROM imc_file WHERE search LIKE '%klaus%'"
  - sql: "SELECT id FROM imc_file WHERE search LIKE '%klaus%'"

cleanup:
  - sql: "DROP TABLE IF EXISTS imc_projection_key"
  - sql: "DROP TABLE IF EXISTS imc_projection_value"
  - sql: "DROP TABLE IF EXISTS imc_acl"
  - sql: "DROP TABLE IF EXISTS imc_assignment"
  - sql: "DROP TABLE IF EXISTS imc_domain"
  - sql: "DROP TABLE IF EXISTS imc_override"
  - sql: "DROP TABLE IF EXISTS imc_document"
  - sql: "DROP TABLE IF EXISTS imc_file"

test_cases:
  - name: "Both membership projection directions preserve every invocation key and duplicate target row"
    scm: |
      (begin
        (define target '("d" "memcp-tests" "imc_projection_key" false nil))
        (define rhs '("r" "memcp-tests" "imc_projection_value" false nil))
        (define col (lambda (a c) (list 'get_column a false c false)))
        (define stage (make_group_stage "projection-direction-domain" rhs '()
          (list (col "r" "k") (col "r" "epoch") (col "r" "actor"))
          (list (list 1 '+ 0)) nil '() '() nil nil
          (list (list 'lookup-keys (list (col "d" "k") (list 'session "epoch") (list 'session "actor"))))))
        (define batch (scan_recset nil (table "memcp-tests" "imc_projection_key")
          '() '() '("enabled") (lambda (enabled) (equal? enabled 1))))
        (define run (lambda (direction epoch actor) (begin
          (define invocation (newsession))
          (with_session invocation (lambda () (begin
            (invocation "epoch" epoch)
            (invocation "actor" actor)
            (define code (batch_membership_base_expr target stage "k" '__batch direction))
            (define selected (apply (eval (list 'lambda (list 'tx '__batch 'session) code)) (list nil batch invocation)))
            (sort (scan nil selected '() '() '() (lambda () true) '("id")
              (lambda (acc id) (append acc id)) '() (lambda (a b) (merge (list a b)))) <)))))))
        (map '(false true) (lambda (direction)
          (list (run direction 0 7) (run direction 0 8)
            (run direction 1 7) (run direction 2 7) (run direction 0 99)))))
    expect:
      data: [[[[1, 2], [3], [5], [], []], [[1, 2], [3], [5], [], []]]]

  - name: "Membership projection rejects computed driver correlations rather than dropping them"
    scm: |
      (begin
        (define target '("d" "memcp-tests" "imc_projection_key" false nil))
        (define rhs '("r" "memcp-tests" "imc_projection_value" false nil))
        (define col (lambda (a c) (list 'get_column a false c false)))
        (define stage (make_group_stage "projection-computed-domain" rhs '()
          (list (col "r" "k") (col "r" "epoch"))
          (list (list 1 '+ 0)) nil '() '() nil nil
          (list (list 'lookup-keys (list (col "d" "k") (list '+ (col "d" "id") 1))))))
        (and (nil? (batch_membership_base_expr target stage "k" '__batch true))
          (nil? (batch_membership_base_expr target stage "k" '__batch false)))))
    expect:
      data: [true]

  - name: "Projection direction costs retain the selective forward alternative"
    scm: |
      (begin
        (define forward (lambda (rows)
          (membership_prefiltered_candidate_cost 800000 800000 1
            (list (list 'membership_prefiltered_candidate_rows rows)
              (list 'membership_prefiltered_projection_read_rows 1)))))
        (define reverse (lambda (rows)
          (membership_prefiltered_candidate_cost 800000 800000 1
            (list (list 'membership_prefiltered_candidate_rows rows)
              (list 'membership_prefiltered_projection_read_rows 0)
              (list 'membership_prefiltered_filter_first true)))))
        (and (planner_cost_better? (forward 1) (reverse 800000))
          (planner_cost_better? (reverse 1) (forward 800000)))))
    expect:
      data: [true]

  - name: "Enclosing domains keep empty years and actor visibility separate"
    sql: |
      SELECT epochs.e, d.id FROM
        (SELECT 0 AS e UNION ALL SELECT 1 UNION ALL SELECT 2) epochs
        CROSS JOIN imc_projection_key d
      WHERE d.enabled = 1 AND EXISTS (
        SELECT 1 FROM imc_projection_value r
        WHERE r.k = d.k AND r.epoch = epochs.e AND r.actor = 7
      ) ORDER BY epochs.e, d.id
    expect:
      data: [{e: 0, id: 1}, {e: 0, id: 2}, {e: 1, id: 5}]
  - name: "Unique partition dominance needs no per-request selectivity scan"
    scm: |
      (begin
        (define planning (sql_queryplan_compile_session (newsession) nil))
        (with_session planning (lambda ()
          (parse_sql "memcp-tests"
            "SELECT SQL_CALC_FOUND_ROWS d.id FROM imc_domain d WHERE d.direct_flag = 0 AND NOT EXISTS (SELECT 1 FROM imc_assignment a WHERE a.actor_id = 99 AND a.domain_id = d.id) ORDER BY d.id DESC LIMIT 10"
            (lambda args true) planning nil)))
        /* Zero-budget calls only read published feedback. Reject actual
        sampling budgets, not the metadata operator's name. Positive-budget
        sentinels ensure the assertion cannot silently become permissive. */
        (define metadata_only (lambda (expr)
          (match expr
            ((symbol quote) value) true
            ((symbol scan_selectivity_estimate) tx tbl access values columns filter budget)
              (equal? budget 0)
            (cons head tail) (reduce expr (lambda (ok part) (and ok (metadata_only part))) true)
            _ true)))
        (and (metadata_only (sql_queryplan_guard_from_session planning))
          (metadata_only (list 'scan_selectivity_estimate nil nil nil nil nil nil 0))
          (not (metadata_only (list 'scan_selectivity_estimate nil nil nil nil nil nil 1)))
          (not (metadata_only (list 'scan_selectivity_estimate nil nil nil nil nil nil -1))))))
    expect:
      data: [true]

  - name: "Partition dominance requires every non-null unique key component"
    scm: |
      (begin
        (define src '("d" "memcp-tests" "imc_domain" false nil))
        (and (aggregate_pushdown_identity_partition? src '("id" "direct_flag"))
          (not (aggregate_pushdown_identity_partition? src '("direct_flag")))))
    expect:
      data: [true]

  - name: "Ordered anti-membership keeps a broad residual inside the limited scan"
    sql: |
      EXPLAIN PHYSICAL
      SELECT d.id FROM imc_domain d
      WHERE d.direct_flag = 0 AND NOT EXISTS (
        SELECT 1 FROM imc_assignment a WHERE a.actor_id = 99 AND a.domain_id = d.id
      ) ORDER BY d.id DESC LIMIT 10
    expect:
      result_contains: ["anti_membership_filter", "chosen ordered_complement_filter", "recset_not"]
      result_not_contains: ["recset_difference"]

  - name: "Ordered anti-membership returns the complete page and found-row count"
    session_id: "imc_ordered_anti"
    warmup: 5
    timing_samples: 20
    sql: |
      SELECT SQL_CALC_FOUND_ROWS d.id FROM imc_domain d
      WHERE d.direct_flag = 0 AND NOT EXISTS (
        SELECT 1 FROM imc_assignment a WHERE a.actor_id = 99 AND a.domain_id = d.id
      ) ORDER BY d.id DESC LIMIT 10
    expect:
      data: [{id: 639}, {id: 637}, {id: 636}, {id: 635}, {id: 634},
             {id: 633}, {id: 632}, {id: 631}, {id: 630}, {id: 629}]

  - name: "Ordered anti-membership counts all matches before LIMIT"
    session_id: "imc_ordered_anti"
    sql: "SELECT FOUND_ROWS() AS n"
    expect:
      data: [{n: 581}]

  - name: "Ordered anti-membership retains OFFSET and nonempty exclusions"
    sql: |
      SELECT d.id FROM imc_domain d
      WHERE d.direct_flag = 0 AND NOT EXISTS (
        SELECT 1 FROM imc_assignment a WHERE a.actor_id = 7 AND a.domain_id = d.id
      ) ORDER BY d.id DESC LIMIT 2 OFFSET 2
    expect:
      data: [{id: 635}, {id: 633}]

  - name: "Grouped anti-membership enumerates physical carriers"
    sql: |
      EXPLAIN PHYSICAL
      SELECT d.id, COUNT(*) AS n FROM imc_domain d
      WHERE d.id NOT IN (
        SELECT a.domain_id FROM imc_assignment a WHERE a.actor_id = 7
      ) GROUP BY d.id ORDER BY d.id DESC LIMIT 10
    expect:
      result_contains:
        - "candidate_keyset"
        - "driver_filter_join_probe"
        - "driver_rows 640"
      result_not_contains:
        - ".grp:imc_assignment:"

  - name: "Grouped anti-membership returns the ordered page"
    warmup: 5
    timing_samples: 20
    sql: |
      SELECT SQL_CALC_FOUND_ROWS d.id FROM imc_domain d
      WHERE d.id NOT IN (
        SELECT a.domain_id FROM imc_assignment a WHERE a.actor_id = 7
      ) GROUP BY d.id ORDER BY d.id DESC LIMIT 10
    expect:
      data: [{id: 639}, {id: 637}, {id: 635}, {id: 633}, {id: 631},
             {id: 629}, {id: 627}, {id: 625}, {id: 623}, {id: 621}]

  - name: "Grouped anti-membership alternatives preserve the complete result"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE
      SELECT d.id, COUNT(*) AS n FROM imc_domain d
      WHERE d.id NOT IN (
        SELECT a.domain_id FROM imc_assignment a WHERE a.actor_id = 7
      ) GROUP BY d.id ORDER BY d.id DESC LIMIT 10
    expect:
      result_contains: ["candidate_keyset", "driver_filter_join_probe", "result_equal"]
      result_not_contains: ['"result_equal": false']

  - name: "Primary-key projection grouping does not create a group cache"
    sql: |
      EXPLAIN PHYSICAL
      SELECT d.id FROM imc_domain d
      WHERE d.id NOT IN (SELECT a.domain_id FROM imc_assignment a WHERE a.actor_id = 7)
      GROUP BY d.id ORDER BY d.id DESC LIMIT 10
    expect:
      result_contains: ["scan_order", "membership_carrier"]
      result_not_contains: [".grp:imc_domain:"]

  - name: "Non-unique grouping still removes duplicates"
    sql: "SELECT direct_flag FROM imc_domain GROUP BY direct_flag ORDER BY direct_flag"
    expect:
      data: [{direct_flag: 0}, {direct_flag: 1}]

  - name: "Primary-key grouping retains HAVING"
    sql: "SELECT id FROM imc_domain GROUP BY id HAVING COUNT(*) > 1"
    expect: {rows: 0}

  - name: "Grouped anti-membership preserves unmatched rows"
    sql: |
      SELECT COUNT(*) AS n FROM imc_domain d
      WHERE NOT EXISTS (
        SELECT 1 FROM imc_assignment a WHERE a.domain_id = d.id AND a.actor_id = 7
      )
    expect:
      data: [{n: 320}]

  - name: "Grouped positive and negative membership preserve intersection"
    sql: |
      SELECT COUNT(*) AS n FROM imc_domain d
      WHERE EXISTS (
        SELECT 1 FROM imc_assignment a WHERE a.domain_id = d.id AND a.actor_id = 7
      ) AND NOT EXISTS (
        SELECT 1 FROM imc_override o WHERE o.domain_id = d.id AND o.actor_id = 7
      )
    expect:
      data: [{n: 213}]

  - name: "UNION estimate algebra preserves hook upper bounds"
    scm: |
      (begin
        (define estimates (list
          (list (list 'population 'index_hook_candidates) (list 'coverage 'exact))
          (list (list 'population 'index_hook_candidates) (list 'coverage 'upper_bound))))
        (if (and
          (equal? (planner_merge_estimate_population estimates) 'index_hook_candidates)
          (equal? (planner_merge_estimate_coverage estimates) 'upper_bound))
          true
          (error "UNION estimate metadata lost its index-hook upper bound")))

  - name: "Calibration family ignores an unrelated key index"
    scm: |
      (begin
        (define mixed_plan (list
          (list 'recset_key_index 'tx 'acl_rows '("id"))
          (list 'recset_project_join 'tx 'search_rows '("id") 'documents '("file_id"))))
        (define decision (list
          (list "decision" "membership_carrier")
          (list "chosen" "candidate_keyset")))
        (if (equal? (physical_operator_family_for_decision mixed_plan decision)
          "candidate_keyset")
          true
          (error "unrelated key index stole the candidate carrier family")))

  - name: "Exact candidate preparation dominates cumulative batching"
    scm: |
      (if (and
        (equal? (membership_choice_after_exact_candidate_preparation
          (list "value-key" "metric-key") "ordered_batch_accept")
          "candidate_keyset")
        (equal? (membership_choice_after_exact_candidate_preparation
          nil "ordered_batch_accept")
          "ordered_batch_accept"))
        true
        (error "exact prepared candidate did not dominate repeated batching"))

  - name: "UNION membership retains approximate index coverage"
    sql: |
      EXPLAIN PHYSICAL
      SELECT d.id
      FROM imc_document d
      WHERE d.file_id IN (
        SELECT f.id FROM imc_file f WHERE f.filename LIKE '%klaus%'
        UNION
        SELECT f.id FROM imc_file f WHERE f.search LIKE '%klaus%'
      )
      ORDER BY d.sort_key DESC
      LIMIT 72
    expect:
      result_contains:
        - "membership_carrier"
        - "candidate_index_filter_rows"

  - name: "Calibration attributes an ACL key index to its own decision"
    sql: |
      EXPLAIN PHYSICAL CALIBRATE
      SELECT d.id
      FROM imc_document d
      WHERE d.file_id IN (
        SELECT f.id FROM imc_file f WHERE f.filename LIKE '%klaus%'
        UNION
        SELECT f.id FROM imc_file f WHERE f.search LIKE '%klaus%'
      )
        AND COALESCE((
          SELECT a.allowed
          FROM imc_acl a
          WHERE a.document_id = d.id
          LIMIT 1
        ), 0) = 1
      ORDER BY d.sort_key DESC
      LIMIT 72
    expect:
      result_contains:
        - "candidate_keyset"
        - "ordered_batch_accept"
        - "operator_consistent"
        - "result_equal"
      result_not_contains:
        - "operator_consistent false"
        - "result_equal false"

  - name: "Indexed candidate carriers agree through a compound ACL suffix"
    max_time: 5.0
    sql: |
      EXPLAIN PHYSICAL CALIBRATE
      SELECT d.id
      FROM imc_document d
      WHERE d.file_id IN (
        SELECT f.id FROM imc_file f WHERE f.filename LIKE '%file-1%'
        UNION
        SELECT f.id FROM imc_file f WHERE f.search LIKE '%klaus%'
      )
        AND COALESCE((
          SELECT CASE WHEN domain.direct_flag = 1 THEN TRUE ELSE (
            EXISTS (
              SELECT TRUE FROM imc_assignment assignment
              WHERE assignment.domain_id = domain.id
                AND assignment.actor_id = 7
                AND assignment.allowed = 1
              LIMIT 1
            ) OR COALESCE((
              SELECT override.allowed FROM imc_override override
              WHERE override.domain_id = domain.id
                AND override.actor_id = 7
              LIMIT 1
            ), FALSE)
          ) END
          FROM imc_domain domain
          WHERE domain.id = d.file_id
          LIMIT 1
        ), FALSE)
      ORDER BY d.sort_key DESC
      LIMIT 72
    expect:
      result_contains:
        - "candidate_keyset"
        - "ordered_batch_accept"
        - "result_equal"
      result_not_contains:
        - '"operator_consistent": false'
        - '"result_equal": false'
