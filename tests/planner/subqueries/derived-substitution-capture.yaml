metadata:
  description: Derived UNION projection substitution preserves nested lexical aliases
setup:
- sql: CREATE TABLE capture_inputs(id INT,token INT)
- sql: CREATE TABLE capture_lookup(id INT PRIMARY KEY,value INT)
- sql: INSERT INTO capture_inputs VALUES(1,10),(2,20),(3,30),(1,40),(NULL,50)
- sql: INSERT INTO capture_lookup VALUES(1,100),(2,200),(3,NULL)
cleanup:
- sql: DROP TABLE IF EXISTS capture_inputs
- sql: DROP TABLE IF EXISTS capture_lookup
test_cases:
- name: Scalar lookup keeps its own alias after outer UNION projection substitution
  sql: |
    SELECT d.token,(SELECT c.value FROM capture_lookup c WHERE c.id=d.id) AS found
    FROM(SELECT c.id,c.token FROM capture_inputs c WHERE c.token<=20 UNION ALL
      SELECT c.id,c.token FROM capture_inputs c WHERE c.token>20)d ORDER BY d.token
  expect:
    data: [{token: 10,found: 100},{token: 20,found: 200},{token: 30,found: null},{token: 40,found: 100},{token: 50,found: null}]
- name: Scalar aggregate retains duplicate outer rows and the NULL domain
  sql: |
    SELECT d.token,(SELECT COUNT(*) FROM capture_lookup c WHERE c.id=d.id) AS matches
    FROM(SELECT c.id,c.token FROM capture_inputs c WHERE c.token<=20 UNION ALL
      SELECT c.id,c.token FROM capture_inputs c WHERE c.token>20)d ORDER BY d.token
  expect:
    data: [{token: 10,matches: 1},{token: 20,matches: 1},{token: 30,matches: 1},{token: 40,matches: 1},{token: 50,matches: 0}]
- name: A deeper local alias continues to shadow the renamed lookup binder
  sql: |
    SELECT d.token,(SELECT c.value+(SELECT MAX(c.value) FROM capture_lookup c) FROM capture_lookup c WHERE c.id=d.id) AS found
    FROM(SELECT c.id,c.token FROM capture_inputs c WHERE c.token<=20 UNION ALL
      SELECT c.id,c.token FROM capture_inputs c WHERE c.token>20)d ORDER BY d.token
  expect:
    data: [{token: 10,found: 300},{token: 20,found: 400},{token: 30,found: null},{token: 40,found: 300},{token: 50,found: null}]
- name: Scalar filtering applies to the outer coordinate rather than every local row
  sql: |
    SELECT d.token FROM(SELECT c.id,c.token FROM capture_inputs c WHERE c.token<=20 UNION ALL
      SELECT c.id,c.token FROM capture_inputs c WHERE c.token>20)d
    WHERE (SELECT c.value FROM capture_lookup c WHERE c.id=d.id)=100 ORDER BY d.token
  expect: {data: [{token: 10},{token: 40}]}
