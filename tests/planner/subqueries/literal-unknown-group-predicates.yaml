- name: sql Folded projection retains nullable value
  syntax: sql
  sql: SELECT (SELECT COUNT(value) FROM (SELECT CASE WHEN 1=1 THEN NULL ELSE 1 END AS value FROM
    boolean_group_inputs) projected) AS n
  expect:
    rows: 1
    data:
    - n: 0
- name: sql Folded ON retains UNKNOWN rather than absent join
  syntax: sql
  sql: SELECT COUNT(constants.unit) AS n FROM boolean_group_inputs driver LEFT JOIN (SELECT 1 AS
    unit) constants ON NULL=1
  expect:
    rows: 1
    data:
    - n: 0
- name: sql Folded group coordinate remains a single NULL domain
