# https://learn.microsoft.com/sql/t-sql/language-elements/null-and-unknown-transact-sql
metadata:
  isolated: true
  description: Grouped scalar predicates preserve SQL UNKNOWN during literal folding
setup:
- sql: CREATE TABLE boolean_group_inputs(id INT,flag INT)
- sql: INSERT INTO boolean_group_inputs VALUES(1,1),(2,0),(3,NULL),(4,0),(5,1)
cleanup:
- sql: DROP TABLE boolean_group_inputs
test_cases:
- name: sql Residual OR
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE id=2 OR id=7) AS n
  expect:
    rows: 1
    data:
    - n: 1
- name: sql Row-dependent CASE
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE CASE WHEN id=2 THEN 1 ELSE 0 END=1) AS n
  expect:
    rows: 1
    data:
    - n: 1
- name: sql Row-dependent nullable CASE
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE CASE WHEN flag=1 THEN id ELSE 0 END>0) AS n
  expect:
    rows: 1
    data:
    - n: 2
- name: sql Negated OR
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE NOT(flag=1 OR flag IS NULL)) AS n
  expect:
    rows: 1
    data:
    - n: 2
- name: sql Negated OR with UNKNOWN
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE NOT(flag=1 OR NULL=1)) AS n
  expect:
    rows: 1
    data:
    - n: 0
- name: sql OR with UNKNOWN
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE flag=1 OR NULL=1) AS n
  expect:
    rows: 1
    data:
    - n: 2
- name: sql AND with UNKNOWN
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE flag=1 AND NULL=1) AS n
  expect:
    rows: 1
    data:
    - n: 0
- name: sql CASE with UNKNOWN branch
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE CASE WHEN flag=1 OR NULL=1 THEN 1 ELSE 0 END=0) AS n
  expect:
    rows: 1
    data:
    - n: 3
- name: sql Literal NULL CASE predicate
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id,flag FROM boolean_group_inputs GROUP BY id,flag) grouped
    WHERE CASE WHEN NULL=1 THEN 1 ELSE 0 END=0) AS n
  expect:
    rows: 1
    data:
    - n: 5
