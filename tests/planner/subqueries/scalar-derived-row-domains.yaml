# https://learn.microsoft.com/sql/t-sql/functions/count-transact-sql
# https://learn.microsoft.com/sql/t-sql/queries/select-group-by-transact-sql
metadata:
  isolated: true
  description: Scalar aggregates preserve the multiplicity and absence of derived
    row domains
setup:
- sql: CREATE TABLE derived_count_inputs(id INT,category INT)
- sql: INSERT INTO derived_count_inputs VALUES(1,10),(1,10),(1,20),(2,10),(NULL,10)
cleanup:
- sql: DROP TABLE IF EXISTS derived_count_inputs
test_cases:
- name: sql COUNT star counts completed groups
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id FROM derived_count_inputs GROUP BY
    id) grouped) AS n
  expect:
    rows: 1
    data:
    - &id001
      n: 3
- name: sql COUNT expression retains SQL NULL operand semantics
  syntax: sql
  sql: SELECT (SELECT COUNT(id) FROM (SELECT id FROM derived_count_inputs GROUP BY
    id) grouped) AS n
  expect:
    rows: 1
    data:
    - &id002
      n: 2
- name: sql Constant SUM retains the completed group row domain
  syntax: sql
  sql: SELECT (SELECT SUM(1) FROM (SELECT id FROM derived_count_inputs GROUP BY id)
    grouped) AS n
  expect:
    rows: 1
    data:
    - &id003
      n: 3
- name: sql HAVING filters groups before outer COUNT star
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id FROM derived_count_inputs GROUP BY
    id HAVING COUNT(*)>=2) grouped) AS n
  expect:
    rows: 1
    data:
    - &id004
      n: 1
- name: sql Rejected HAVING leaves the outer aggregate empty default
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id FROM derived_count_inputs GROUP BY
    id HAVING COUNT(*)>3) grouped) AS n
  expect:
    rows: 1
    data:
    - &id005
      n: 0
- name: sql Empty grouped sources retain scalar count and minimum defaults
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id FROM derived_count_inputs WHERE 1=0
    GROUP BY id) grouped) AS n,(SELECT MIN(1) FROM (SELECT id FROM derived_count_inputs
    WHERE 1=0 GROUP BY id) grouped) AS minimum_value
  expect:
    rows: 1
    data:
    - &id006
      n: 0
      minimum_value: null
- name: sql An unused inner group join still multiplies matching rows
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM derived_count_inputs driver INNER JOIN (SELECT
    id,category FROM derived_count_inputs GROUP BY id,category) grouped ON grouped.id=driver.id)
    AS n
  expect:
    rows: 1
    data:
    - &id007
      n: 7
- name: sql An optional partial group key retains matching multiplicity
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM derived_count_inputs driver LEFT JOIN (SELECT
    id,category FROM derived_count_inputs GROUP BY id,category) grouped ON grouped.id=driver.id)
    AS n
  expect:
    rows: 1
    data:
    - &id008
      n: 8
- name: sql An optional complete group key preserves one row per caller
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM derived_count_inputs driver LEFT JOIN (SELECT
    id,category FROM derived_count_inputs GROUP BY id,category) grouped ON grouped.id=driver.id
    AND grouped.category=driver.category) AS n
  expect:
    rows: 1
    data:
    - &id009
      n: 5
- name: tsql COUNT star counts completed groups
  syntax: tsql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id FROM derived_count_inputs GROUP BY
