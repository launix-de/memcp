- name: Local table groups retain their completed cardinality
  syntax: tsql
  sql: DECLARE @items TABLE(id INT); INSERT @items VALUES(1),(1),(2),(NULL); SELECT
    (SELECT COUNT(*) FROM (SELECT id FROM @items GROUP BY id) grouped) AS n
  expect:
    rows: 1
    data:
    - n: 3
- name: An empty local group source retains an outer zero count
  syntax: tsql
  sql: DECLARE @items TABLE(id INT); SELECT (SELECT COUNT(*) FROM (SELECT id FROM
    @items GROUP BY id) grouped) AS n
  expect:
    rows: 1
    data:
    - n: 0
- name: sql residual OR filters completed groups
  syntax: sql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id FROM derived_count_inputs GROUP BY
    id) grouped WHERE grouped.id=2 OR grouped.id=7) AS n
  expect:
    rows: 1
    data:
    - n: 1
- name: tsql residual OR filters completed groups
  syntax: tsql
  sql: SELECT (SELECT COUNT(*) FROM (SELECT id FROM derived_count_inputs GROUP BY
    id) grouped WHERE grouped.id=2 OR grouped.id=7) AS n
  expect:
