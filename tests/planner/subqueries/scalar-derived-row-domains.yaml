- name: COUNT tsql A false FULL predicate preserves both unmatched domains
  syntax: tsql
  sql: SELECT (SELECT COUNT(*) FROM derived_count_inputs driver FULL JOIN (SELECT id FROM derived_count_inputs
    GROUP BY id) grouped ON 1=0) AS value
  expect:
    rows: 1
    data:
    - value: 8
- name: SUM tsql A false FULL predicate preserves both unmatched domains
  syntax: tsql
  sql: SELECT (SELECT SUM(1) FROM derived_count_inputs driver FULL JOIN (SELECT id FROM derived_count_inputs
    GROUP BY id) grouped ON 1=0) AS value
  expect:
    rows: 1
    data:
    - value: 8
- name: COUNT tsql A complete FULL group key preserves distinct NULL unmatched rows
  syntax: tsql
  sql: SELECT (SELECT COUNT(*) FROM derived_count_inputs driver FULL JOIN (SELECT id FROM derived_count_inputs
    GROUP BY id) grouped ON grouped.id=driver.id) AS value
  expect:
    rows: 1
    data:
    - value: 6
- name: SUM tsql A complete FULL group key preserves distinct NULL unmatched rows
