- name: COUNT tsql A partial FULL group key preserves matching bag multiplicity
  syntax: tsql
  sql: SELECT (SELECT COUNT(*) FROM derived_count_inputs driver FULL JOIN (SELECT id,category FROM
    derived_count_inputs GROUP BY id,category) grouped ON grouped.id=driver.id) AS value
  expect:
