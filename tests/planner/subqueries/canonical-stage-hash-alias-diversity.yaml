metadata:
  version: "1.0"
  description: >
    Two structurally identical correlated scalar subqueries, each with its
    own distinct SQL-surface alias (the shape a query builder that assigns
    fresh per-occurrence aliases actually produces), must still share one
    materialized stage. stage_id hashing canonicalizes by structural role
    (table/position), not by the disposable alias spelling.
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS csh_obj"
  - sql: "CREATE TABLE csh_obj (id INT)"
  - sql: "INSERT INTO csh_obj VALUES (1),(2),(3),(4),(5)"
  - sql: "DROP TABLE IF EXISTS csh_grp"
  - sql: "CREATE TABLE csh_grp (id INT PRIMARY KEY, grp INT, val INT)"
  - sql: "INSERT INTO csh_grp VALUES (1,1,10),(2,1,20),(3,2,30),(4,2,40),(5,2,50)"

test_cases:
  # Before this fix, stage_id hashed the raw bound subquery AST directly --
  # including the "alpha"/"beta" alias spelling -- so these two otherwise
  # identical correlated subqueries never compared equal for
  # unique_stages_by_id and each built its own copy of the csh_obj
  # group-cache table. The gate sits just above the fixed plan size so it
  # trips if a future change reintroduces the duplication.
  - name: "Two correlated scalar subqueries with different own aliases share one stage"
    max_plan_size: 9000
    sql: |
      SELECT drv.idx,
        (SELECT SUM(alpha.id) FROM csh_obj alpha WHERE alpha.id > drv.bound) AS total_a,
        (SELECT SUM(beta.id) FROM csh_obj beta WHERE beta.id > drv.bound) AS total_b
      FROM (SELECT 0 AS `idx`, 1 AS `bound` UNION SELECT 1 AS `idx`, 2 AS `bound`) AS drv
      ORDER BY drv.idx
    expect:
      rows: 2
      data:
        - idx: 0
          total_a: 14
          total_b: 14
        - idx: 1
          total_a: 12
          total_b: 12

  # scalar-agg/scalar-single stage_id deliberately excludes which aggregate
  # columns a consumer requests (see make_scalar_aggregate_stage_rewrite):
  # two metrics that only differ in aggregate function over the exact same
  # correlated row selection share one materialized carrier, with
  # merge_same_id_stage_variants unioning their aggregate columns onto it
  # instead of each rebuilding its own copy.
  - name: "SUM and COUNT over the identical correlated condition share one stage"
    max_plan_size: 6000
    sql: |
      SELECT drv.idx,
        (SELECT SUM(val) FROM csh_grp WHERE grp = drv.idx) AS total,
        (SELECT COUNT(*) FROM csh_grp WHERE grp = drv.idx) AS cnt
      FROM (SELECT 1 AS `idx` UNION SELECT 2 AS `idx`) AS drv
      ORDER BY drv.idx
    expect:
      rows: 2
      data:
        - idx: 1
          total: 30
          cnt: 2
        - idx: 2
          total: 120
          cnt: 3

  # A different HAVING makes it a genuinely different carrier (different row
  # groups survive), so the two must NOT merge despite matching subquery
  # shape, keys, domain and condition -- same_group_carrier_backbone? is the
  # real safety net once the aggregate list itself is excluded from the hash.
  - name: "Same condition with different HAVING stays distinct, not merged"
    sql: |
      SELECT
        (SELECT SUM(val) FROM csh_grp WHERE grp = 1 GROUP BY grp HAVING SUM(val) > 0) AS a,
        (SELECT SUM(val) FROM csh_grp WHERE grp = 1 GROUP BY grp HAVING SUM(val) > 1000) AS b
    expect:
      rows: 1
      data:
        - a: 30
          b: null

cleanup:
  - sql: "DROP TABLE IF EXISTS csh_obj"
  - sql: "DROP TABLE IF EXISTS csh_grp"
