# Complex subquery coverage
# Targets scan.go subquery evaluation, compute.go expression paths,
# and scan_helper.go various scan strategies.

metadata:
  version: "1.0"
  description: "Subqueries: scalar, IN, EXISTS, correlated, in HAVING and WHERE"

setup:
  - sql: "DROP TABLE IF EXISTS sq_large_dept"
  - sql: "DROP TABLE IF EXISTS sq_large_emp"
  - sql: "DROP TABLE IF EXISTS sq_dept"
  - sql: "DROP TABLE IF EXISTS sq_emp"
  - sql: "DROP TABLE IF EXISTS sq_order_product"
  - sql: "DROP TABLE IF EXISTS sq_order_vendor"
  - sql: "DROP TABLE IF EXISTS sq_order_offer"
  - sql: "DROP TABLE IF EXISTS sq_order_country"
  - sql: "DROP TABLE IF EXISTS sq_order_region"
  - sql: |
      CREATE TABLE sq_dept (did INT, dname VARCHAR(30))
  - sql: |
      INSERT INTO sq_dept VALUES
        (1, 'Engineering'), (2, 'Marketing'), (3, 'Sales'), (4, 'Empty')
  - sql: |
      CREATE TABLE sq_emp (eid INT, name VARCHAR(30), did INT, salary DOUBLE)
  - sql: |
      INSERT INTO sq_emp VALUES
        (1, 'Alice', 1, 90000),
        (2, 'Bob', 1, 80000),
        (3, 'Carol', 2, 70000),
        (4, 'Dave', 2, 75000),
        (5, 'Eve', 3, 60000),
        (6, 'Frank', 1, 95000),
        (7, 'Grace', 3, 65000),
        (8, 'Henry', NULL, 50000)
  - sql: "CREATE TABLE sq_large_dept (did INT)"
  - sql: "CREATE TABLE sq_large_emp (did INT, salary INT)"
  - sql: "CREATE TABLE sq_order_product (id INT PRIMARY KEY, size INT, kind TEXT)"
  - sql: "CREATE TABLE sq_order_vendor (id INT PRIMARY KEY, country_id INT, name TEXT, balance INT)"
  - sql: "CREATE TABLE sq_order_offer (product_id INT, vendor_id INT, cost INT)"
  - sql: "CREATE TABLE sq_order_country (id INT PRIMARY KEY, region_id INT, name TEXT)"
  - sql: "CREATE TABLE sq_order_region (id INT PRIMARY KEY, name TEXT)"
  - sql: "INSERT INTO sq_order_product VALUES (1,15,'small alloy'),(2,15,'small alloy')"
  - sql: "INSERT INTO sq_order_vendor VALUES (10,100,'vendor a',200),(20,100,'vendor b',200),(30,200,'vendor c',400)"
  - sql: "INSERT INTO sq_order_offer VALUES (1,10,50),(1,20,40),(2,10,30),(2,30,20)"
  - sql: "INSERT INTO sq_order_country VALUES (100,1000,'country a'),(200,2000,'country b')"
  - sql: "INSERT INTO sq_order_region VALUES (1000,'north'),(2000,'south')"
  - scm: |
      (insert (table "memcp-tests" "sq_large_dept") '("did")
        (map (produceN 1001) (lambda (i) (list i))))

test_cases:

  - name: "Ordered multi-join with correlated aggregate filter"
    sql: |
      SELECT v.balance, c.name AS country_name, v.name AS vendor_name, p.id
      FROM sq_order_product p, sq_order_vendor v, sq_order_offer o,
           sq_order_country c, sq_order_region r
      WHERE p.id = o.product_id
        AND v.id = o.vendor_id
        AND v.country_id = c.id
        AND c.region_id = r.id
        AND p.size = 15
        AND p.kind LIKE '%alloy'
        AND r.name = 'north'
        AND o.cost = (
          SELECT MIN(o2.cost)
          FROM sq_order_offer o2, sq_order_vendor v2,
               sq_order_country c2, sq_order_region r2
          WHERE p.id = o2.product_id
            AND v2.id = o2.vendor_id
            AND v2.country_id = c2.id
            AND c2.region_id = r2.id
            AND r2.name = 'north'
        )
      ORDER BY v.balance DESC, c.name, v.name, p.id
      LIMIT 100
    expect:
      rows: 2
      data:
        - balance: 200
          country_name: "country a"
          vendor_name: "vendor a"
          id: 2
        - balance: 200
          country_name: "country a"
          vendor_name: "vendor b"
          id: 1

  - name: "Ordered correlated join uses a storage-backed intermediate relation"
    sql: |
      EXPLAIN SELECT v.balance, c.name AS country_name, v.name AS vendor_name, p.id
      FROM sq_order_product p, sq_order_vendor v, sq_order_offer o,
           sq_order_country c, sq_order_region r
      WHERE p.id = o.product_id
        AND v.id = o.vendor_id
        AND v.country_id = c.id
        AND c.region_id = r.id
        AND p.size = 15
        AND p.kind LIKE '%alloy'
        AND r.name = 'north'
        AND o.cost = (
          SELECT MIN(o2.cost)
          FROM sq_order_offer o2, sq_order_vendor v2,
               sq_order_country c2, sq_order_region r2
          WHERE p.id = o2.product_id
            AND v2.id = o2.vendor_id
            AND v2.country_id = c2.id
            AND c2.region_id = r2.id
            AND r2.name = 'north'
        )
      ORDER BY v.balance DESC, c.name, v.name, p.id
      LIMIT 100
    expect:
      rows: 1
      result_contains:
        - ".join-order:"
        - "scan_order"
        - "droptable"
      result_not_contains:
        - "(sort rows"

  - name: "Ordered join intermediate relation is query-local"
    sql: "SHOW TABLES"
    expect:
      result_not_contains:
        - ".join-order:"

  # === Scalar subquery in SELECT ===

  - name: "Scalar subquery: total count"
    sql: "SELECT name, (SELECT COUNT(*) FROM sq_emp) AS total FROM sq_emp WHERE eid = 1"
    expect:
      rows: 1
      data:
        - name: "Alice"
          total: 8

  - name: "Scalar subquery: department name"
    sql: |
      SELECT e.name, (SELECT d.dname FROM sq_dept d WHERE d.did = e.did) AS dept
      FROM sq_emp e WHERE e.eid = 1
    expect:
      rows: 1
      data:
        - name: "Alice"
          dept: "Engineering"

  # === IN subquery ===

  - name: "IN with subquery"
    sql: |
      SELECT name FROM sq_emp
      WHERE did IN (SELECT did FROM sq_dept WHERE dname = 'Engineering')
      ORDER BY name
    expect:
      rows: 3
      data:
        - name: "Alice"
        - name: "Bob"
        - name: "Frank"

  - name: "NOT IN with subquery"
    sql: |
      SELECT name FROM sq_emp
      WHERE did NOT IN (SELECT did FROM sq_dept WHERE dname = 'Engineering')
      AND did IS NOT NULL
      ORDER BY name
    expect:
      rows: 4

  # === EXISTS subquery ===

  - name: "EXISTS: departments with employees"
    sql: |
      SELECT dname FROM sq_dept d
      WHERE EXISTS (SELECT 1 FROM sq_emp e WHERE e.did = d.did)
      ORDER BY dname
    expect:
      rows: 3

  - name: "NOT EXISTS: departments without employees"
    sql: |
      SELECT dname FROM sq_dept d
      WHERE NOT EXISTS (SELECT 1 FROM sq_emp e WHERE e.did = d.did)
    expect:
      rows: 1
      data:
        - dname: "Empty"

  # === Subquery in WHERE with comparison ===

  - name: "Subquery comparison: salary above average"
    sql: |
      SELECT e.name, e.salary
      FROM sq_emp e
      WHERE e.salary > (SELECT AVG(salary) FROM sq_emp)
      ORDER BY e.salary DESC
    expect:
      rows: 4

  - name: "Subquery: MAX from subquery"
    sql: |
      SELECT name FROM sq_emp
      WHERE salary = (SELECT MAX(salary) FROM sq_emp)
    expect:
      rows: 1
      data:
        - name: "Frank"

  # === Subquery in HAVING ===

  - name: "HAVING with scalar subquery"
    sql: |
      SELECT did, AVG(salary) AS avg_sal
      FROM sq_emp
      WHERE did IS NOT NULL
      GROUP BY did
      HAVING AVG(salary) > (SELECT AVG(salary) FROM sq_emp)
    expect:
      rows: 1

  # === Nested subqueries ===

  - name: "Nested IN subquery"
    sql: |
      SELECT name FROM sq_emp
      WHERE did IN (
        SELECT did FROM sq_dept
        WHERE dname IN ('Engineering', 'Sales')
      )
      ORDER BY name
    expect:
      rows: 5

  # === Subquery returning empty result ===

  - name: "IN empty subquery"
    sql: |
      SELECT name FROM sq_emp
      WHERE did IN (SELECT did FROM sq_dept WHERE dname = 'Nonexistent')
    expect:
      rows: 0

  - name: "EXISTS on empty subquery"
    sql: |
      SELECT dname FROM sq_dept d
      WHERE EXISTS (SELECT 1 FROM sq_emp e WHERE e.did = d.did AND e.salary > 999999)
    expect:
      rows: 0

  # === nD domain: correlated on one column + inner filter ===

  - name: "1D domain with inner filter"
    sql: |
      SELECT e.name,
        (SELECT d.dname FROM sq_dept d WHERE d.did = e.did AND d.did > 0) AS dept
      FROM sq_emp e WHERE e.eid <= 3
      ORDER BY e.eid
    expect:
      rows: 3
      data:
        - name: "Alice"
          dept: "Engineering"
        - name: "Bob"
          dept: "Engineering"
        - name: "Carol"
          dept: "Marketing"

  # === Multi-table unnested subquery ===

  - name: "Multi-table scalar subselect unnested"
    sql: |
      SELECT e.name,
        (SELECT d.dname FROM sq_dept d JOIN sq_dept d2 ON d.did = d2.did WHERE d.did = e.did) AS dept
      FROM sq_emp e WHERE e.eid = 1
    expect:
      rows: 1
      data:
        - name: "Alice"
          dept: "Engineering"

  # === Nested subselect: inner subselect unnested, then outer level ===

  - name: "Nested correlated subselect - inner and outer unnested"
    sql: |
      SELECT e.name,
        (SELECT d.dname FROM sq_dept d
         WHERE d.did = (SELECT t.did FROM sq_emp t WHERE t.eid = e.eid) LIMIT 1) AS dept
      FROM sq_emp e WHERE e.eid = 1
    expect:
      rows: 1
      data:
        - name: "Alice"
          dept: "Engineering"

  - name: "EXPLAIN IR nested correlated subselect keeps helper LEFT JOIN chain"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT e.name,
        (SELECT d.dname FROM sq_dept d
         WHERE d.did = (SELECT t.did FROM sq_emp t WHERE t.eid = e.eid) LIMIT 1) AS dept
      FROM sq_emp e WHERE e.eid = 1
    expect:
      contains:
        - '_unn_sq_emp_0'
        - '_unn_sq_dept_0'
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - '__scalar_promise_'

  # === nD domain: multiple outer references ===

  - name: "2D domain: two correlated equality conditions"
    sql: |
      SELECT e.eid, e.did,
        (SELECT d.dname FROM sq_dept d WHERE d.did = e.did AND d.did = e.eid) AS self_dept
      FROM sq_emp e WHERE e.eid <= 4
      ORDER BY e.eid
    expect:
      rows: 4
      data:
        - eid: 1
          did: 1
          self_dept: "Engineering"
        - eid: 2
          did: 1
          self_dept: null
        - eid: 3
          did: 2
          self_dept: null
        - eid: 4
          did: 2
          self_dept: null

  # === GROUP BY extension (Neumann Γ_{A∪D}) ===

  - name: "Aggregate COUNT correlated subselect (1D domain)"
    sql: |
      SELECT d.dname,
        (SELECT COUNT(1) FROM sq_emp e WHERE e.did = d.did) AS emp_count
      FROM sq_dept d WHERE d.did <= 3
      ORDER BY d.did
    expect:
      rows: 3
      data:
        - dname: "Engineering"
          emp_count: 3
        - dname: "Marketing"
          emp_count: 2
        - dname: "Sales"
          emp_count: 2

  - name: "Aggregate SUM correlated subselect"
    sql: |
      SELECT d.dname,
        (SELECT SUM(e.salary) FROM sq_emp e WHERE e.did = d.did) AS total_sal
      FROM sq_dept d WHERE d.did = 1
    expect:
      rows: 1
      data:
        - dname: "Engineering"
          total_sal: 265000

  - name: "Correlated SUM subselect over parent list"
    sql: |
      SELECT d.did,
        (SELECT SUM(e.salary) FROM sq_emp e WHERE e.did = d.did) AS total_sal
      FROM sq_dept d
      ORDER BY d.did
    expect:
      rows: 4
      data:
        - did: 1
          total_sal: 265000
        - did: 2
          total_sal: 145000
        - did: 3
          total_sal: 125000
        - did: 4
          total_sal: null

  - name: "EXPLAIN correlated SUM subselect uses reusable group carrier"
    sql: |
      EXPLAIN SELECT d.did,
        (SELECT SUM(e.salary) FROM sq_emp e WHERE e.did = d.did) AS total_sal
      FROM sq_dept d
      ORDER BY d.did
    expect:
      contains:
        - "touch_keytable"
        - "createcolumn"
        - ".grp:sq_emp:"
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - "scalar_aggregate_probe"

  - name: "Correlated SUM initializes a condition keytable"
    sql: |
      SELECT d.did,
        (SELECT SUM(e.salary) FROM sq_emp e
         WHERE e.did = d.did AND e.salary >= 0) AS metric
      FROM sq_dept d
      ORDER BY d.did
    expect:
      rows: 4
      data:
        - did: 1
          metric: 265000
        - did: 2
          metric: 145000
        - did: 3
          metric: 125000
        - did: 4
          metric: null

  - name: "Correlated COUNT extends the same condition keytable"
    sql: |
      SELECT d.did,
        (SELECT COUNT(e.salary) FROM sq_emp e
         WHERE e.did = d.did AND e.salary >= 0) AS metric
      FROM sq_dept d
      ORDER BY d.did
    expect:
      rows: 4
      data:
        - did: 1
          metric: 3
        - did: 2
          metric: 2
        - did: 3
          metric: 2
        - did: 4
          metric: 0

  - name: "Small nested aggregate scopes avoid keytable preparation"
    sql: |
      EXPLAIN SELECT candidate.did, candidate.total_salary
      FROM (
        SELECT d.did,
          (SELECT SUM(e.salary) FROM sq_emp e WHERE e.did = d.did) AS total_salary
        FROM sq_dept d
      ) candidate
      WHERE (SELECT MAX(e.salary) FROM sq_emp e WHERE e.did = candidate.did) > 0
    expect:
      rows: 1
      result_occurrences:
        - text: "touch_keytable"
          count: 0

  - name: "Broad nested aggregate scopes share one keytable initializer"
    sql: |
      EXPLAIN SELECT candidate.did, candidate.total_salary
      FROM (
        SELECT d.did,
          (SELECT SUM(e.salary) FROM sq_large_emp e WHERE e.did = d.did) AS total_salary
        FROM sq_large_dept d
      ) candidate
      WHERE (SELECT MAX(e.salary) FROM sq_large_emp e WHERE e.did = candidate.did) > 0
    expect:
      rows: 1
      result_occurrences:
        - text: "touch_keytable"
          count: 1

  - name: "Nested aggregate scopes retain every aggregate column"
    sql: |
      SELECT candidate.did, candidate.total_salary
      FROM (
        SELECT d.did,
          (SELECT SUM(e.salary) FROM sq_emp e WHERE e.did = d.did) AS total_salary
        FROM sq_dept d
      ) candidate
      WHERE (SELECT MAX(e.salary) FROM sq_emp e WHERE e.did = candidate.did) > 0
      ORDER BY candidate.did
    expect:
      rows: 3
      data:
        - did: 1
          total_salary: 265000
        - did: 2
          total_salary: 145000
        - did: 3
          total_salary: 125000

  - name: "Aggregate correlated subselect with no match returns 0"
    sql: |
      SELECT d.dname,
        (SELECT COUNT(1) FROM sq_emp e WHERE e.did = d.did) AS emp_count
      FROM sq_dept d WHERE d.did = 4
    expect:
      rows: 1
      data:
        - dname: "Empty"
          emp_count: 0

  - name: "Aggregate correlated subselect in WHERE comparison"
    sql: |
      SELECT d.dname
      FROM sq_dept d
      WHERE (SELECT COUNT(1) FROM sq_emp e WHERE e.did = d.did) >= 3
    expect:
      rows: 1
      data:
        - dname: "Engineering"

  - name: "2D domain with aggregate"
    sql: |
      SELECT e.eid,
        (SELECT COUNT(1) FROM sq_dept d WHERE d.did = e.did AND d.did = e.eid) AS matching
      FROM sq_emp e WHERE e.eid <= 4
      ORDER BY e.eid
    expect:
      rows: 4
      data:
        - eid: 1
          matching: 1
        - eid: 2
          matching: 0
        - eid: 3
          matching: 0
        - eid: 4
          matching: 0

  - name: "Nested subselect: inner unnested, outer is aggregate"
    sql: |
      SELECT d.dname,
        (SELECT COUNT(1) FROM sq_emp e
         WHERE e.did = d.did
         AND e.salary > (SELECT AVG(salary) FROM sq_emp) LIMIT 1) AS above_avg
      FROM sq_dept d WHERE d.did <= 2
      ORDER BY d.did
    expect:
      rows: 2
      data:
        - dname: "Engineering"
          above_avg: 3
        - dname: "Marketing"
          above_avg: 1

  # === Doubly-nested: innermost references outermost ===

  - name: "Doubly-nested scalar: inner references outermost table"
    sql: |
      SELECT e.name,
        (SELECT d.dname FROM sq_dept d
         WHERE d.did = (SELECT t.did FROM sq_emp t WHERE t.eid = e.eid LIMIT 1) LIMIT 1) AS dept
      FROM sq_emp e WHERE e.eid <= 3
      ORDER BY e.eid
    expect:
      rows: 3
      data:
        - name: "Alice"
          dept: "Engineering"
        - name: "Bob"
          dept: "Engineering"
        - name: "Carol"
          dept: "Marketing"

  # === 1-row constraint: LIMIT 1 on non-unique keys ===

  - name: "LIMIT 1 correlated subselect on non-unique key"
    sql: |
      SELECT d.dname,
        (SELECT e.name FROM sq_emp e WHERE e.did = d.did ORDER BY e.salary DESC LIMIT 1) AS top_earner
      FROM sq_dept d WHERE d.did <= 3
      ORDER BY d.did
    expect:
      rows: 3
      data:
        - dname: "Engineering"
          top_earner: "Frank"
        - dname: "Marketing"
          top_earner: "Dave"
        - dname: "Sales"
          top_earner: "Grace"

  - name: "LIMIT 1 correlated subselect without ORDER BY"
    sql: |
      SELECT d.dname,
        (SELECT e.name FROM sq_emp e WHERE e.did = d.did LIMIT 1) AS any_emp
      FROM sq_dept d WHERE d.did = 4
    expect:
      rows: 1
      data:
        - dname: "Empty"
          any_emp: null

  - name: "Correlated subselect without LIMIT errors on multiple rows"
    sql: |
      SELECT d.dname,
        (SELECT e.name FROM sq_emp e WHERE e.did = d.did) AS emp
      FROM sq_dept d WHERE d.did = 1
    expect:
      error: true

  - name: "COUNT correlated subselect with LIMIT 1 (redundant LIMIT)"
    sql: |
      SELECT d.dname,
        (SELECT COUNT(1) FROM sq_emp e WHERE e.did = d.did LIMIT 1) AS cnt
      FROM sq_dept d WHERE d.did <= 2
      ORDER BY d.did
    expect:
      rows: 2
      data:
        - dname: "Engineering"
          cnt: 3
        - dname: "Marketing"
          cnt: 2

  # === 1-row constraint: COUNT NULL vs 0 ===

  - name: "COUNT correlated returns 0 not NULL for empty match"
    sql: |
      SELECT d.dname,
        COALESCE((SELECT COUNT(1) FROM sq_emp e WHERE e.did = d.did), 0) AS cnt
      FROM sq_dept d WHERE d.did = 4
    expect:
      rows: 1
      data:
        - dname: "Empty"
          cnt: 0

  # === 1-row constraint: OFFSET ===

  - name: "Correlated subselect with OFFSET skips first match"
    sql: |
      SELECT d.dname,
        (SELECT e.name FROM sq_emp e WHERE e.did = d.did ORDER BY e.salary DESC LIMIT 1 OFFSET 1) AS second_earner
      FROM sq_dept d WHERE d.did = 1
    expect:
      rows: 1
      data:
        - dname: "Engineering"
          second_earner: "Alice"

  # === Aggregate in WHERE with correct 0-semantics ===

  - name: "Aggregate in WHERE with zero check"
    sql: |
      SELECT d.dname
      FROM sq_dept d
      WHERE (SELECT COUNT(1) FROM sq_emp e WHERE e.did = d.did) = 0
    expect:
      rows: 1
      data:
        - dname: "Empty"

cleanup:
  - sql: "DROP TABLE IF EXISTS sq_large_emp"
  - sql: "DROP TABLE IF EXISTS sq_large_dept"
  - sql: "DROP TABLE IF EXISTS sq_emp"
  - sql: "DROP TABLE IF EXISTS sq_dept"
