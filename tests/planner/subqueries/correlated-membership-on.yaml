# NULL comparison semantics: https://learn.microsoft.com/sql/t-sql/language-elements/in-transact-sql
metadata:
  description: Correlated membership retains ON predicates, caller multiplicity and SQL three-valued logic
  isolated: true
setup:
- sql: CREATE TABLE membership_scope_outer(id INT)
- sql: CREATE TABLE membership_scope_inner(id INT,owner INT,amount INT)
- sql: CREATE TABLE membership_scope_tags(id INT)
- sql: INSERT INTO membership_scope_outer VALUES(NULL),(1),(1),(2),(3)
- sql: INSERT INTO membership_scope_inner VALUES(10,1,5),(11,1,NULL),(20,2,NULL),(30,NULL,9)
- sql: INSERT INTO membership_scope_tags VALUES(10),(11),(20),(30)
test_cases:
- name: mysql IN retains its INNER ON correlation
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 10 IN(SELECT i.id FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id AND i.owner=o.id) ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
    - id: 1
- name: mysql WHERE and INNER ON correlations have the same membership result
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 10 IN(SELECT i.id FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id WHERE i.owner=o.id) ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
    - id: 1
- name: mysql NOT IN preserves duplicate callers and empty correlated sets
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 10 NOT IN(SELECT i.id FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id AND i.owner=o.id) ORDER BY id
  expect:
    rows: 3
    data:
    - id: -1
    - id: 2
    - id: 3
- name: mysql IN match takes precedence over a NULL RHS value
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 5 IN(SELECT i.amount FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id AND i.owner=o.id) ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
    - id: 1
- name: mysql NOT IN distinguishes NULL poison from an empty RHS
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 5 NOT IN(SELECT i.amount FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id AND i.owner=o.id) ORDER BY id
  expect:
    rows: 2
    data:
    - id: -1
    - id: 3
- name: mysql Nullable residual ON binds the complete caller domain
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 30 IN(SELECT i.id FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id AND (i.owner=o.id OR (i.owner IS NULL AND o.id IS NULL)))
    ORDER BY id
  expect:
    rows: 1
    data:
    - id: -1
- name: mysql Nullable residual WHERE binds the complete caller domain
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 30 IN(SELECT i.id FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id WHERE i.owner=o.id OR (i.owner IS NULL AND o.id IS NULL))
    ORDER BY id
  expect:
    rows: 1
    data:
    - id: -1
- name: mysql LEFT ON correlations do not filter their preserved input
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE 99 IN(SELECT COALESCE(t.id,99) FROM membership_scope_inner
    i LEFT JOIN membership_scope_tags t ON t.id=i.id AND i.owner=o.id) ORDER BY id
  expect:
    rows: 5
    data:
    - id: -1
    - id: 1
    - id: 1
    - id: 2
    - id: 3
- name: mysql projected IN and NOT IN retain SQL UNKNOWN
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id,CASE WHEN o.id IN(SELECT i.amount FROM membership_scope_inner i INNER JOIN
    membership_scope_tags t ON t.id=i.id AND i.owner=o.id) THEN 1 WHEN o.id NOT IN(SELECT i.amount FROM membership_scope_inner
    i INNER JOIN membership_scope_tags t ON t.id=i.id AND i.owner=o.id) THEN 0 ELSE -1 END AS state FROM membership_scope_outer
    o ORDER BY id
  expect:
    rows: 5
    data:
    - id: -1
      state: 0
    - id: 1
      state: -1
    - id: 1
      state: -1
    - id: 2
      state: -1
    - id: 3
      state: 0
- name: tsql IN retains its INNER ON correlation
