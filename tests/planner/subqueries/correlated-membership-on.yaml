- name: mysql EXISTS retains an empty row window
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE EXISTS(SELECT 1 FROM membership_scope_inner
    i WHERE i.owner=o.id LIMIT 0) ORDER BY id
  expect:
    rows: 0
    data: []
  noncritical: true
- name: mysql EXISTS retains its per-caller row offset
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE EXISTS(SELECT 1 FROM membership_scope_inner
    i WHERE i.owner=o.id ORDER BY i.id LIMIT 1 OFFSET 1) ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
    - id: 1
  noncritical: true
- name: mysql Scalar row selection retains its ordered bound
  syntax: mysql
  sql: SELECT (SELECT i.amount FROM membership_scope_inner i WHERE i.owner=1 ORDER BY i.id LIMIT 1) AS value_result
  expect:
    rows: 1
    data:
    - value_result: 5
- name: mysql A scalar subquery still rejects multiple result rows
  syntax: mysql
  sql: SELECT (SELECT i.amount FROM membership_scope_inner i WHERE i.owner=1) AS value_result
  expect:
    error: true
    contains: scalar subselect returned more than one row
- name: tsql EXISTS retains an empty row window
  syntax: tsql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE EXISTS(SELECT TOP(0) 1 FROM membership_scope_inner
    i WHERE i.owner=o.id) ORDER BY id
  expect:
    rows: 0
    data: []
  noncritical: true
- name: tsql EXISTS retains its per-caller row offset
  syntax: tsql
  sql: SELECT COALESCE(o.id,-1) AS id FROM membership_scope_outer o WHERE EXISTS(SELECT 1 FROM membership_scope_inner
    i WHERE i.owner=o.id ORDER BY i.id OFFSET 1 ROWS FETCH NEXT 1 ROWS ONLY) ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
    - id: 1
  noncritical: true
- name: tsql Scalar row selection retains its ordered bound
  syntax: tsql
  sql: SELECT (SELECT TOP(1) i.amount FROM membership_scope_inner i WHERE i.owner=1 ORDER BY i.id) AS value_result
  expect:
    rows: 1
    data:
    - value_result: 5
- name: tsql A scalar subquery still rejects multiple result rows
  syntax: tsql
  sql: SELECT (SELECT i.amount FROM membership_scope_inner i WHERE i.owner=1) AS value_result
