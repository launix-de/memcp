- name: mysql NOT IN subquery and value list retain UNKNOWN
  syntax: mysql
  sql: SELECT CASE WHEN 5 NOT IN(SELECT amount FROM membership_scope_inner WHERE owner=2) THEN 1 WHEN 5 IN(SELECT
    amount FROM membership_scope_inner WHERE owner=2) THEN 2 ELSE 0 END AS subquery_state,CASE WHEN 5 NOT IN(NULL)
    THEN 1 WHEN 5 IN(NULL) THEN 2 ELSE 0 END AS list_state
  expect:
    rows: 1
    data:
    - subquery_state: 0
      list_state: 0
- name: mysql A NULL probe is not in an empty subquery
  syntax: mysql
  sql: SELECT CASE WHEN NULL NOT IN(SELECT amount FROM membership_scope_inner WHERE owner=999) THEN 1 ELSE 0 END
    AS empty_state
  expect:
    rows: 1
    data:
    - empty_state: 1
- name: tsql NOT IN subquery and value list retain UNKNOWN
  syntax: tsql
  sql: SELECT CASE WHEN 5 NOT IN(SELECT amount FROM membership_scope_inner WHERE owner=2) THEN 1 WHEN 5 IN(SELECT
    amount FROM membership_scope_inner WHERE owner=2) THEN 2 ELSE 0 END AS subquery_state,CASE WHEN 5 NOT IN(NULL)
    THEN 1 WHEN 5 IN(NULL) THEN 2 ELSE 0 END AS list_state
  expect:
    rows: 1
    data:
    - subquery_state: 0
