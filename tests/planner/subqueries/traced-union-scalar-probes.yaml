metadata:
  version: "1.0"
  description: "Trace-derived UNION and scalar presence probe contracts"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS trace_asset"
  - sql: "DROP TABLE IF EXISTS trace_ref_a"
  - sql: "DROP TABLE IF EXISTS trace_ref_b"
  - sql: "DROP TABLE IF EXISTS trace_ref_c"
  - sql: "DROP TABLE IF EXISTS trace_ref_d"
  - sql: "DROP TABLE IF EXISTS trace_box"
  - sql: "DROP TABLE IF EXISTS trace_host"
  - sql: "DROP TABLE IF EXISTS trace_folder"
  - sql: "DROP TABLE IF EXISTS trace_message"
  - sql: "DROP TABLE IF EXISTS trace_share"
  - sql: |
      CREATE TABLE trace_host (
        id INT PRIMARY KEY,
        kind INT
      )
  - sql: |
      CREATE TABLE trace_box (
        id INT PRIMARY KEY,
        host_id INT,
        owner_id INT
      )
  - sql: |
      CREATE TABLE trace_folder (
        id INT PRIMARY KEY,
        box_id INT,
        name VARCHAR(64)
      )
  - sql: |
      CREATE TABLE trace_message (
        id INT PRIMARY KEY,
        box_id INT,
        folder_id INT,
        seen BOOL
      )
  - sql: |
      CREATE TABLE trace_share (
        id INT PRIMARY KEY,
        box_id INT,
        owner_id INT
      )
  - sql: "INSERT INTO trace_host (id, kind) VALUES (1, 1), (2, 2)"
  - sql: "INSERT INTO trace_box (id, host_id, owner_id) VALUES (100, 1, 7), (200, 2, 9)"
  - sql: "INSERT INTO trace_folder (id, box_id, name) VALUES (1001, 100, 'inbox'), (1002, 100, 'archive'), (2001, 200, 'other')"
  - sql: "INSERT INTO trace_message (id, box_id, folder_id, seen) VALUES (1, 100, 1001, FALSE), (2, 100, 1002, TRUE), (3, 200, 2001, FALSE)"
  - sql: "INSERT INTO trace_share (id, box_id, owner_id) VALUES (1, 100, 7)"
  - sql: |
      CREATE TABLE trace_asset (
        id INT PRIMARY KEY,
        filename VARCHAR(64),
        kind INT,
        payload VARCHAR(64)
      )
  - sql: |
      CREATE TABLE trace_ref_a (
        id INT PRIMARY KEY,
        asset_id INT,
        enabled BOOL
      )
  - sql: |
      CREATE TABLE trace_ref_b (
        id INT PRIMARY KEY,
        asset_id INT,
        enabled BOOL
      )
  - sql: |
      CREATE TABLE trace_ref_c (
        id INT PRIMARY KEY,
        asset_id INT,
        enabled BOOL
      )
  - sql: |
      CREATE TABLE trace_ref_d (
        id INT PRIMARY KEY,
        asset_id INT,
        enabled BOOL
      )
  - sql: "INSERT INTO trace_asset (id, filename, kind, payload) VALUES (1, 'asset-1.dat', 1, 'p1')"
  - sql: "INSERT INTO trace_asset SELECT id + 1, CONCAT('asset-', CAST(id + 1 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 1 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 2, CONCAT('asset-', CAST(id + 2 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 2 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 4, CONCAT('asset-', CAST(id + 4 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 4 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 8, CONCAT('asset-', CAST(id + 8 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 8 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 16, CONCAT('asset-', CAST(id + 16 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 16 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 32, CONCAT('asset-', CAST(id + 32 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 32 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 64, CONCAT('asset-', CAST(id + 64 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 64 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 128, CONCAT('asset-', CAST(id + 128 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 128 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 256, CONCAT('asset-', CAST(id + 256 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 256 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 512, CONCAT('asset-', CAST(id + 512 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 512 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_asset SELECT id + 1024, CONCAT('asset-', CAST(id + 1024 AS VARCHAR), '.dat'), CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, CONCAT('p', CAST(id + 1024 AS VARCHAR)) FROM trace_asset"
  - sql: "INSERT INTO trace_ref_a SELECT id, id, TRUE FROM trace_asset WHERE id % 997 = 0"
  - sql: "INSERT INTO trace_ref_b SELECT id, id, TRUE FROM trace_asset WHERE id IN (1, 17, 257)"
  - sql: "INSERT INTO trace_ref_c SELECT id, id, FALSE FROM trace_asset WHERE id % 257 = 0"
  - sql: "INSERT INTO trace_ref_d SELECT id, id, TRUE FROM trace_asset WHERE id % 509 = 0"

test_cases:
  - name: "ordered UNION scalar probes use the multi-scan carrier"
    sql: |
      EXPLAIN
      SELECT *
      FROM (
        SELECT
          b.id AS box_id,
          0 AS indent,
          CAST(b.owner_id AS VARCHAR) AS label,
          'box' AS kind,
          (SELECT f.id FROM trace_folder f WHERE f.box_id = b.id LIMIT 1) AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE NOT m.seen AND m.box_id = b.id) AS unseen
        FROM trace_box b
        WHERE (SELECT h.kind FROM trace_host h WHERE h.id = b.host_id) = 1
          AND (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
        UNION ALL
        SELECT
          f.box_id AS box_id,
          1 AS indent,
          f.name AS label,
          'folder' AS kind,
          f.id AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE m.folder_id = f.id AND NOT m.seen AND m.box_id = f.box_id) AS unseen
        FROM trace_folder f
        WHERE COALESCE((
          SELECT (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
          FROM trace_box b
          WHERE b.id = f.box_id
          LIMIT 1
        ), FALSE)
      ) t
      ORDER BY box_id ASC, indent ASC, label ASC
    expect:
      contains:
        - "scan_order_multi"
      not_contains:
        - "__union_rows"
        - "(sort rows"

  - name: "UNION ALL wrapper decorrelates scalar subqueries in branches"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      SELECT *
      FROM (
        SELECT
          b.id AS box_id,
          0 AS indent,
          CAST(b.owner_id AS VARCHAR) AS label,
          'box' AS kind,
          (SELECT f.id FROM trace_folder f WHERE f.box_id = b.id LIMIT 1) AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE NOT m.seen AND m.box_id = b.id) AS unseen
        FROM trace_box b
        WHERE (SELECT h.kind FROM trace_host h WHERE h.id = b.host_id) = 1
          AND (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
        UNION ALL
        SELECT
          f.box_id AS box_id,
          1 AS indent,
          f.name AS label,
          'folder' AS kind,
          f.id AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE m.folder_id = f.id AND NOT m.seen AND m.box_id = f.box_id) AS unseen
        FROM trace_folder f
        WHERE COALESCE((
          SELECT (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
          FROM trace_box b
          WHERE b.id = f.box_id
          LIMIT 1
        ), FALSE)
      ) t
      ORDER BY box_id ASC, indent ASC, label ASC
    expect:
      rows: 3
      data:
        - box_id: 100
          indent: 0
          label: "7"
          kind: "box"
          item_id: 1001
          unseen: 1
        - box_id: 100
          indent: 1
          label: "archive"
          kind: "folder"
          item_id: 1002
          unseen: 0
        - box_id: 100
          indent: 1
          label: "inbox"
          kind: "folder"
          item_id: 1001
          unseen: 1
  - name: "UNION EXISTS projection probes only selected outer rows"
    max_time: 0.4
    max_plan_size: 60000
    sql: |
      SELECT
        a.id,
        a.filename,
        EXISTS (
          SELECT r.id FROM trace_ref_a r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_b r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_c r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_d r WHERE r.enabled AND r.asset_id = a.id
        ) AS referenced
      FROM trace_asset a
      WHERE a.id IN (1, 2)
      ORDER BY a.id
    expect:
      rows: 2
      data:
        - id: 1
          filename: "asset-1.dat"
          referenced: true
        - id: 2
          filename: "asset-2.dat"
          referenced: false

  - name: "Selective UNION EXISTS keeps one logical union and bounded branch probes"
    sql: |
      EXPLAIN
      SELECT
        a.id,
        EXISTS (
          SELECT r.id FROM trace_ref_a r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_b r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_c r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_d r WHERE r.enabled AND r.asset_id = a.id
        ) AS referenced
      FROM trace_asset a
      WHERE a.id = 1
    expect:
      rows: 1
      result_contains:
        - "scan_exists"
      result_occurrences:
        - text: "scan_exists"
          count: 4
      result_not_contains:
        - "touch_keytable"
        - ".grp:"

  - name: "Selective nested UNION EXISTS keeps bounded physical probes"
    max_time: 1.0
    max_planner_time_ms: 500
    max_plan_size: 350000
    max_compile_metrics:
      group_stages: 49
      union_blocks: 1
      group_caches: 24
    sql: |
      SELECT
        a.id,
        EXISTS (
          SELECT r01.id FROM trace_ref_a r01 WHERE r01.enabled AND r01.asset_id = a.id AND COALESCE((SELECT (b01.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s01 WHERE s01.box_id = b01.id AND s01.owner_id = 7 LIMIT 1)) FROM trace_box b01 WHERE b01.id = r01.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r02.id FROM trace_ref_b r02 WHERE r02.enabled AND r02.asset_id = a.id AND COALESCE((SELECT (b02.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s02 WHERE s02.box_id = b02.id AND s02.owner_id = 7 LIMIT 1)) FROM trace_box b02 WHERE b02.id = r02.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r03.id FROM trace_ref_c r03 WHERE r03.enabled AND r03.asset_id = a.id AND COALESCE((SELECT (b03.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s03 WHERE s03.box_id = b03.id AND s03.owner_id = 7 LIMIT 1)) FROM trace_box b03 WHERE b03.id = r03.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r04.id FROM trace_ref_d r04 WHERE r04.enabled AND r04.asset_id = a.id AND COALESCE((SELECT (b04.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s04 WHERE s04.box_id = b04.id AND s04.owner_id = 7 LIMIT 1)) FROM trace_box b04 WHERE b04.id = r04.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r05.id FROM trace_ref_a r05 WHERE r05.enabled AND r05.asset_id = a.id AND COALESCE((SELECT (b05.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s05 WHERE s05.box_id = b05.id AND s05.owner_id = 7 LIMIT 1)) FROM trace_box b05 WHERE b05.id = r05.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r06.id FROM trace_ref_b r06 WHERE r06.enabled AND r06.asset_id = a.id AND COALESCE((SELECT (b06.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s06 WHERE s06.box_id = b06.id AND s06.owner_id = 7 LIMIT 1)) FROM trace_box b06 WHERE b06.id = r06.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r07.id FROM trace_ref_c r07 WHERE r07.enabled AND r07.asset_id = a.id AND COALESCE((SELECT (b07.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s07 WHERE s07.box_id = b07.id AND s07.owner_id = 7 LIMIT 1)) FROM trace_box b07 WHERE b07.id = r07.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r08.id FROM trace_ref_d r08 WHERE r08.enabled AND r08.asset_id = a.id AND COALESCE((SELECT (b08.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s08 WHERE s08.box_id = b08.id AND s08.owner_id = 7 LIMIT 1)) FROM trace_box b08 WHERE b08.id = r08.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r09.id FROM trace_ref_a r09 WHERE r09.enabled AND r09.asset_id = a.id AND COALESCE((SELECT (b09.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s09 WHERE s09.box_id = b09.id AND s09.owner_id = 7 LIMIT 1)) FROM trace_box b09 WHERE b09.id = r09.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r10.id FROM trace_ref_b r10 WHERE r10.enabled AND r10.asset_id = a.id AND COALESCE((SELECT (b10.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s10 WHERE s10.box_id = b10.id AND s10.owner_id = 7 LIMIT 1)) FROM trace_box b10 WHERE b10.id = r10.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r11.id FROM trace_ref_c r11 WHERE r11.enabled AND r11.asset_id = a.id AND COALESCE((SELECT (b11.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s11 WHERE s11.box_id = b11.id AND s11.owner_id = 7 LIMIT 1)) FROM trace_box b11 WHERE b11.id = r11.asset_id * 100 LIMIT 1), FALSE)
          UNION ALL
          SELECT r12.id FROM trace_ref_d r12 WHERE r12.enabled AND r12.asset_id = a.id AND COALESCE((SELECT (b12.owner_id = 7 OR EXISTS (SELECT TRUE FROM trace_share s12 WHERE s12.box_id = b12.id AND s12.owner_id = 7 LIMIT 1)) FROM trace_box b12 WHERE b12.id = r12.asset_id * 100 LIMIT 1), FALSE)
        ) AS referenced
      FROM trace_asset a
      WHERE a.id = 1
    expect:
      rows: 1
      data:
        - id: 1
          referenced: true

  - name: "Broad UNION EXISTS uses a RecSet semijoin without group caches"
    sql: |
      EXPLAIN
      SELECT a.id
      FROM trace_asset a
      WHERE EXISTS (
        SELECT r.id FROM trace_ref_a r WHERE r.enabled AND r.asset_id = a.id
        UNION ALL
        SELECT r.id FROM trace_ref_b r WHERE r.enabled AND r.asset_id = a.id
        UNION ALL
        SELECT r.id FROM trace_ref_c r WHERE r.enabled AND r.asset_id = a.id
        UNION ALL
        SELECT r.id FROM trace_ref_d r WHERE r.enabled AND r.asset_id = a.id
      )
      ORDER BY a.id
    expect:
      rows: 1
      result_contains:
        - "recset_union"
        - "recset_project_join"
      result_not_contains:
        - "touch_keytable"
        - ".grp:"

