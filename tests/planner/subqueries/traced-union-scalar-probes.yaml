  - name: "Derived scalar probe requalifies nested correlation keys"
    sql: |
      SELECT t.id, t.allowed
      FROM (
        SELECT
          a.id,
          ref.allowed
        FROM trace_asset a
        LEFT JOIN (
          SELECT
            b.id,
            COALESCE((
              SELECT (
                EXISTS (
                  SELECT TRUE
                  FROM trace_global_access global_access
                  WHERE global_access.actor_id = 7
                    AND global_access.scope_id IS NULL
                  LIMIT 1
                )
                AND EXISTS (
