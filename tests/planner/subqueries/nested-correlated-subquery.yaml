# Doubly-nested correlated scalar subquery
# Pattern: outer scan has doc.ID, scalar subquery A references doc.ID through
# scalar subquery B. The correlated reference must propagate through two levels.
# MySQL handles this correctly; memcp was returning NULL instead.

metadata:
  version: "1.0"
  description: "Doubly-nested correlated scalar subquery returns NULL instead of value"

cleanup:
  - sql: "DROP TABLE IF EXISTS nc_join_outer"
  - sql: "DROP TABLE IF EXISTS nc_join_history"
  - sql: "DROP TABLE IF EXISTS nc_join_value"
  - sql: "DROP TABLE IF EXISTS nc_multi_outer"
  - sql: "DROP TABLE IF EXISTS nc_multi_history"
  - sql: "DROP TABLE IF EXISTS nc_multi_value"
  - sql: "DROP TABLE IF EXISTS nc_scope_state"
  - sql: "DROP TABLE IF EXISTS nc_scope_outer"
  - sql: "DROP TABLE IF EXISTS nc_scope_lookup"
  - sql: "DROP TABLE IF EXISTS nc_alias_ref"
  - sql: "DROP TABLE IF EXISTS nc_alias_outer"
  - sql: "DROP TABLE IF EXISTS nc_folder_ref"
  - sql: "DROP TABLE IF EXISTS nc_item_ref"
  - sql: "DROP TABLE IF EXISTS nc_outer_ref"
  - sql: "DROP TABLE IF EXISTS nc_lookup_ref"
  - sql: "DROP TABLE IF EXISTS nc_doc"
  - sql: "DROP TABLE IF EXISTS nc_revision"
  - sql: "DROP TABLE IF EXISTS nc_files"
  - sql: "DROP TABLE IF EXISTS nc_config"

setup:
  - sql: "CREATE TABLE nc_join_outer (ID INT PRIMARY KEY)"
  - sql: "CREATE TABLE nc_join_history (ID INT PRIMARY KEY, outer_id INT, value_id INT, created INT)"
  - sql: "CREATE TABLE nc_join_value (ID INT PRIMARY KEY, label VARCHAR(40))"
  - sql: "INSERT INTO nc_join_outer VALUES (1), (2)"
  - sql: "INSERT INTO nc_join_history VALUES (1, 1, 10, 100), (2, 1, 20, 200), (3, 2, 10, 300)"
  - sql: "INSERT INTO nc_join_value VALUES (10, 'older'), (20, 'newer')"
  - sql: "CREATE TABLE nc_multi_outer (ID INT PRIMARY KEY)"
  - sql: "CREATE TABLE nc_multi_history (ID INT PRIMARY KEY, outer_id INT, value_id INT, created INT)"
  - sql: "CREATE TABLE nc_multi_value (ID INT PRIMARY KEY, label VARCHAR(40))"
  - sql: "INSERT INTO nc_multi_outer VALUES (8), (9)"
  - sql: "INSERT INTO nc_multi_history VALUES (1, 8, 20, 100), (2, 9, 19, 100)"
  - sql: "INSERT INTO nc_multi_value VALUES (19, 'second'), (20, 'first')"
  - sql: "CREATE TABLE nc_scope_lookup (ID INT PRIMARY KEY, value INT)"
  - sql: "CREATE TABLE nc_scope_outer (ID INT PRIMARY KEY, nc_scope_lookup INT, state_id INT)"
  - sql: "CREATE TABLE nc_scope_state (ID INT PRIMARY KEY, label VARCHAR(20), nc_scope_lookup INT)"
  - sql: "INSERT INTO nc_scope_lookup VALUES (1, 11), (2, 22)"
  - sql: "INSERT INTO nc_scope_outer VALUES (1, 1, 1), (2, 2, 1)"
  - sql: "INSERT INTO nc_scope_state VALUES (1, 'active', 2)"
  - sql: "CREATE TABLE nc_alias_ref (ID INT PRIMARY KEY, active BOOL, valid_from INT, valid_to INT)"
  - sql: "CREATE TABLE nc_alias_outer (ID INT PRIMARY KEY, ref_alias INT)"
  - sql: "CREATE TABLE nc_folder_ref (ID INT PRIMARY KEY, mailbox INT)"
  - sql: "CREATE TABLE nc_item_ref (ID INT PRIMARY KEY, directory INT, boxid INT, seen BOOL)"
  - sql: "INSERT INTO nc_alias_ref VALUES (7, TRUE, NULL, NULL), (8, FALSE, NULL, NULL)"
  - sql: "INSERT INTO nc_alias_outer VALUES (1, 7), (2, 8)"
  - sql: "CREATE TABLE nc_lookup_ref (ID INT PRIMARY KEY, flag INT)"
  - sql: "CREATE TABLE nc_outer_ref (ID INT PRIMARY KEY, lookup_id INT)"
  - sql: "INSERT INTO nc_folder_ref VALUES (1, 10), (2, 20)"
  - sql: "INSERT INTO nc_item_ref VALUES (1, 1, 10, FALSE), (2, 1, 20, FALSE), (3, 2, 20, TRUE)"
  - sql: "CREATE TABLE nc_doc (ID INT PRIMARY KEY)"
  - sql: "CREATE TABLE nc_revision (id INT, doc INT, file INT, created INT)"
  - sql: "CREATE TABLE nc_files (ID INT, filename VARCHAR(100))"
  - sql: "CREATE TABLE nc_config (ID INT PRIMARY KEY, default_file INT)"
  - sql: "INSERT INTO nc_lookup_ref VALUES (10, 1), (20, 0)"
  - sql: "INSERT INTO nc_outer_ref VALUES (1, 10), (2, 20)"
  - sql: "INSERT INTO nc_doc VALUES (10)"
  - sql: "INSERT INTO nc_revision VALUES (1, 10, 99, 1000)"
  - sql: "INSERT INTO nc_files VALUES (99, 'report.pdf')"
  - sql: "INSERT INTO nc_config VALUES (1, 99)"

test_cases:
  - name: "Correlated joined LIMIT keeps its order above the join group"
    sql: |
      SELECT o.ID, (
        SELECT v.label
        FROM nc_join_history h
        JOIN nc_join_value v ON v.ID = h.value_id
        WHERE h.outer_id = o.ID
        ORDER BY h.created DESC
        LIMIT 1
      ) AS latest
      FROM nc_join_outer o
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1, latest: "newer"}
        - {ID: 2, latest: "older"}

  - name: "Joined scalar window has local partition keys in IR"
    sql: |
      EXPLAIN IR SELECT o.ID, (
        SELECT v.label
        FROM nc_join_history h
        JOIN nc_join_value v ON v.ID = h.value_id
        WHERE h.outer_id = o.ID
        ORDER BY h.created DESC
        LIMIT 1
      ) AS latest
      FROM nc_join_outer o
    expect:
      result_contains:
        - "partition_by"
        - "partition_order"
        - "partition_offset"
        - "partition_limit"
        - "outer_id"
        - "created"

  - name: "Joined scalar LIMIT lowers through scan_join_order"
    sql: |
      EXPLAIN SELECT o.ID, (
        SELECT v.label
        FROM nc_join_history h
        JOIN nc_join_value v ON v.ID = h.value_id
        WHERE h.outer_id = o.ID
        ORDER BY h.created DESC
        LIMIT 1
      ) AS latest
      FROM nc_join_outer o
      ORDER BY o.ID
    expect:
      result_contains:
        - "scan_join_order"
        - "nc_join_history"
        - "nc_join_value"

  - name: "Nested scalar key preserves every outer domain row"
    sql: |
      SELECT o.ID,
        (SELECT v.label
          FROM nc_multi_value v
          WHERE v.ID = (
            SELECT h.value_id
            FROM nc_multi_history h
            WHERE h.outer_id = o.ID
            ORDER BY h.created DESC, h.ID DESC
            LIMIT 1)
          LIMIT 1) AS label
      FROM nc_multi_outer o
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 8, label: "first"}
        - {ID: 9, label: "second"}

  - name: "Derived join hides non-projected column from correlated scope"
    sql: |
      SELECT o.ID,
        (SELECT l.value FROM nc_scope_lookup l
          WHERE l.ID = nc_scope_lookup LIMIT 1) AS resolved_value,
        s.label
      FROM nc_scope_outer o
      LEFT JOIN (SELECT ID AS state_key, label FROM nc_scope_state) s
        ON s.state_key = o.state_id
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1, resolved_value: 11, label: "active"}
        - {ID: 2, resolved_value: 22, label: "active"}

  - name: "Single-level correlated subquery works"
    sql: "SELECT (SELECT r.file FROM nc_revision r WHERE r.doc = nc_doc.ID ORDER BY r.created DESC LIMIT 1) AS latest_file FROM nc_doc"
    expect:
      rows: 1
      data:
        - {latest_file: 99}

  - name: "Doubly-nested correlated subquery - outer.ID must propagate two levels"
    sql: "SELECT (SELECT f.filename FROM nc_files f WHERE f.ID = (SELECT r.file FROM nc_revision r WHERE r.doc = nc_doc.ID ORDER BY r.created DESC LIMIT 1) LIMIT 1) AS filename FROM nc_doc"
    expect:
      rows: 1
      data:
        - {filename: "report.pdf"}

  - name: "Bounded doubly-nested scalar probe does not build the revision domain"
    fail_comment: "a point-constrained outer row must carry the complete nested scalar dependency chain as direct probes"
    sql: "EXPLAIN SELECT ID FROM nc_doc WHERE (SELECT f.filename FROM nc_files f WHERE f.ID = (SELECT r.file FROM nc_revision r WHERE r.doc = nc_doc.ID ORDER BY r.created DESC, r.id DESC LIMIT 1) LIMIT 1) = 'report.pdf' AND ID IN (10)"
    expect:
      result_contains:
        - "scan_order"
        - "nc_revision"
      result_not_contains:
        - ".grp:nc_revision"

  - name: "Doubly-nested inside derived table"
    sql: "SELECT t.filename FROM (SELECT (SELECT f.filename FROM nc_files f WHERE f.ID = (SELECT r.file FROM nc_revision r WHERE r.doc = nc_doc.ID ORDER BY r.created DESC LIMIT 1) LIMIT 1) AS filename FROM nc_doc) t"
    expect:
      rows: 1
      data:
        - {filename: "report.pdf"}

  - name: "Simple LIMIT 1 scalar subquery with multiple outer tables remains scalar"
    sql: "SELECT d.ID FROM nc_doc d JOIN nc_revision r ON r.doc = d.ID WHERE ((((SELECT c.default_file FROM nc_config c WHERE c.ID = 1 LIMIT 1)) IS NULL) AND ((r.file) IS NULL)) OR ((r.file) = ((SELECT c.default_file FROM nc_config c WHERE c.ID = 1 LIMIT 1)))"
    expect:
      rows: 1
      data:
        - {ID: 10}

  - name: "Correlated scalar subquery resolves unqualified outer column"
    sql: |
      SELECT o.ID
      FROM nc_outer_ref o
      WHERE (SELECT l.flag FROM nc_lookup_ref l WHERE l.ID = lookup_id LIMIT 1) = 1
      ORDER BY o.ID
    expect:
      rows: 1
      data:
        - {ID: 1}

  - name: "Correlated aggregate subquery resolves unqualified outer column"
    sql: |
      SELECT o.ID,
        (SELECT COUNT(*) FROM nc_lookup_ref l WHERE l.flag = 1 AND l.ID = lookup_id) AS match_count
      FROM nc_outer_ref o
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1, match_count: 1}
        - {ID: 2, match_count: 0}

  - name: "Derived correlated aggregate prefers nearest unqualified outer column"
    sql: |
      SELECT d.ID, d.match_count
      FROM nc_outer_ref wrapper
      JOIN (
        SELECT o.ID,
          (SELECT COUNT(*) FROM nc_lookup_ref l WHERE l.flag = 1 AND l.ID = lookup_id) AS match_count
        FROM nc_outer_ref o
      ) d ON d.ID = wrapper.ID
      ORDER BY d.ID
    expect:
      rows: 2
      data:
        - {ID: 1, match_count: 1}
        - {ID: 2, match_count: 0}

  - name: "Correlated aggregate resolves unqualified outer column in multi-term predicate"
    sql: |
      SELECT f.ID,
        (SELECT COUNT(*) FROM nc_item_ref i WHERE i.directory = f.ID AND NOT i.seen AND i.boxid = mailbox) AS unseen_count
      FROM nc_folder_ref f
      ORDER BY f.ID
    expect:
      rows: 2
      data:
        - {ID: 1, unseen_count: 1}
        - {ID: 2, unseen_count: 0}

  - name: "Correlated scalar resolves unqualified outer column beside local range predicate"
    sql: |
      SELECT o.ID
      FROM nc_alias_outer o
      WHERE (SELECT r.active FROM nc_alias_ref r
        WHERE r.ID = ref_alias
          AND CASE WHEN 1 IS NULL THEN TRUE ELSE
            CASE WHEN r.valid_from IS NULL THEN 1 ELSE r.valid_from END <= 1
            AND CASE WHEN r.valid_to IS NULL THEN 1 ELSE r.valid_to END >= 1
          END
        LIMIT 1)
      ORDER BY o.ID
    expect:
      rows: 1
      data:
        - {ID: 1}

  - name: "Nested scalar lookup uses only the selected ordered RecMap window"
    setup: &recmap_window_setup
      - sql: "DROP TABLE IF EXISTS nc_recmap_driver"
      - sql: "DROP TABLE IF EXISTS nc_recmap_middle"
      - sql: "DROP TABLE IF EXISTS nc_recmap_target"
      - sql: "CREATE TABLE nc_recmap_driver (id INT, middle_id INT)"
      - sql: "CREATE TABLE nc_recmap_middle (id INT, target_id INT)"
      - sql: "CREATE TABLE nc_recmap_target (id INT, value INT)"
      - scm: |
          (begin
            (insert (table "memcp-tests" "nc_recmap_driver") '("id" "middle_id")
              (map (produceN 200) (lambda (i) (list i (mod i 50)))))
            (insert (table "memcp-tests" "nc_recmap_middle") '("id" "target_id")
              (map (produceN 50) (lambda (i) (list i i))))
            (insert (table "memcp-tests" "nc_recmap_target") '("id" "value")
              (map (produceN 50) (lambda (i) (list i 4))))
            (rebuild))
    sql: |
      EXPLAIN PHYSICAL SELECT d.id, (
        SELECT (
          SELECT t.value FROM nc_recmap_target t
          WHERE t.id = m.target_id LIMIT 1)
        FROM nc_recmap_middle m
        WHERE m.id = d.middle_id LIMIT 1) AS value
      FROM nc_recmap_driver d
      ORDER BY d.id DESC LIMIT 5
    expect:
      result_contains:
        - "scan_order_recset"
        - "scan_recmap"
        - "recmap_compose"
        - "$recmap_call"
    cleanup: &recmap_window_cleanup
      - sql: "DROP TABLE IF EXISTS nc_recmap_driver"
      - sql: "DROP TABLE IF EXISTS nc_recmap_middle"
      - sql: "DROP TABLE IF EXISTS nc_recmap_target"

  - name: "Ordered RecMap window applies OFFSET only once"
    setup: *recmap_window_setup
    sql: |
      SELECT d.id, (
        SELECT (
          SELECT t.value FROM nc_recmap_target t
          WHERE t.id = m.target_id LIMIT 1)
        FROM nc_recmap_middle m
        WHERE m.id = d.middle_id LIMIT 1) AS value
      FROM nc_recmap_driver d
      ORDER BY d.id DESC LIMIT 5 OFFSET 2
    expect:
      rows: 5
      data:
        - {id: 197, value: 4}
        - {id: 196, value: 4}
        - {id: 195, value: 4}
        - {id: 194, value: 4}
        - {id: 193, value: 4}
    cleanup: *recmap_window_cleanup
