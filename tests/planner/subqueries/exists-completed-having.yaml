- name: mysql a positive cap preserves the filtered global group
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>0
    ORDER BY n DESC LIMIT 2) ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
    - id: 1
    - id: 2
- name: tsql a positive cap preserves the filtered global group
  syntax: tsql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    TOP(2) COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>0
    ORDER BY n DESC) ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
    - id: 1
    - id: 2
- name: psql a positive cap preserves the filtered global group
  syntax: psql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>0
    ORDER BY n DESC LIMIT 2) ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
    - id: 1
    - id: 2
- name: mysql a global COUNT group is present for every caller
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>=0)
    ORDER BY id
  expect:
    rows: 5
    data:
    - id: -1
    - id: 1
    - id: 1
    - id: 2
    - id: 3
- name: mysql ON correlations remain inside the global group input
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i INNER JOIN exists_having_tags t ON t.id=i.id
    AND i.owner=o.id HAVING COUNT(*)=0) ORDER BY id
  expect:
    rows: 2
    data:
    - id: -1
    - id: 3
