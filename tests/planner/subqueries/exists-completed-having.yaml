# https://learn.microsoft.com/en-us/sql/t-sql/queries/select-having-transact-sql
metadata:
  description: EXISTS observes completed global aggregate rows after HAVING across
    SQL dialects
setup:
- sql: CREATE TABLE exists_having_outer(id INT)
- sql: CREATE TABLE exists_having_inner(id INT,owner INT,amount INT)
- sql: CREATE TABLE exists_having_tags(id INT)
- sql: INSERT INTO exists_having_outer VALUES(NULL),(1),(1),(2),(3)
- sql: INSERT INTO exists_having_inner VALUES(10,1,5),(11,1,NULL),(20,2,NULL),(30,NULL,9)
- sql: INSERT INTO exists_having_tags VALUES(10),(11),(20),(30)
cleanup:
- sql: DROP TABLE exists_having_tags
- sql: DROP TABLE exists_having_inner
- sql: DROP TABLE exists_having_outer
test_cases:
- name: mysql nonempty_count observes completed group rows
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>0)
    ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
    - id: 1
    - id: 2
- name: mysql empty_count observes completed group rows
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)=0)
    ORDER BY id
  expect:
    rows: 2
    data:
    - id: -1
    - id: 3
- name: mysql nullable_sum observes completed group rows
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    SUM(i.amount) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING SUM(i.amount)
    IS NULL) ORDER BY id
  expect:
    rows: 3
    data:
    - id: -1
    - id: 2
    - id: 3
- name: mysql caller_having_coordinate observes completed group rows
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>=o.id)
    ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
    - id: 1
- name: mysql negated_nonempty_count observes completed group rows
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE NOT EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>0)
    ORDER BY id
  expect:
    rows: 2
    data:
    - id: -1
    - id: 3
- name: mysql having_rejects_every_group observes completed group rows
  syntax: mysql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>100)
    ORDER BY id
  expect:
    rows: 0
    data: []
- name: tsql nonempty_count observes completed group rows
  syntax: tsql
  sql: SELECT COALESCE(o.id,-1) AS id FROM exists_having_outer o WHERE EXISTS(SELECT
    COUNT(*) AS n FROM exists_having_inner i WHERE i.owner=o.id HAVING COUNT(*)>0)
