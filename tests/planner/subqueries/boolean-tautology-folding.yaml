# Boolean constant-folding on the normalized IR (todos/boolean-tautology-folding.md).
# A correlated EXISTS check combined with its own negation via OR/AND is a
# boolean tautology/contradiction that never depends on the EXISTS result, but
# without folding it still compiles into real physical probe work every time.

metadata:
  version: "1.0"
  description: "Boolean tautology/contradiction folding for duplicated correlated EXISTS checks"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS taut_child"
  - sql: "DROP TABLE IF EXISTS taut_parent"
  - sql: |
      CREATE TABLE taut_parent (
        ID INT PRIMARY KEY,
        val INT
      )
  - sql: |
      CREATE TABLE taut_child (
        ID INT PRIMARY KEY,
        parent_id INT
      )
  - sql: |
      INSERT INTO taut_parent (ID, val) VALUES
      (1, 10), (2, 20), (3, -5)
  - sql: |
      INSERT INTO taut_child (ID, parent_id) VALUES
      (1, 1)

test_cases:
  - name: Common OR predicates preserve all SQL truth combinations
    setup:
      - sql: DROP TABLE IF EXISTS taut_truth
      - sql: CREATE TABLE taut_truth (id INT, v INT) ENGINE=memory
      - sql: INSERT INTO taut_truth VALUES (0,0),(1,1),(2,NULL)
    sql: |
      SELECT COUNT(*) AS mismatches
      FROM taut_truth a, taut_truth b, taut_truth c
      WHERE COALESCE(((a.v=1 AND b.v=1) OR (a.v=1 AND c.v=1)), -1)
        != COALESCE((a.v=1 AND (b.v=1 OR c.v=1)), -1)
    expect:
      data: [{mismatches: 0}]

  - name: Direct OR predicate selects only TRUE from all 27 truth combinations
    sql: |
      SELECT a.id AS a, b.id AS b, c.id AS c
      FROM taut_truth a, taut_truth b, taut_truth c
      WHERE (a.v=1 AND b.v=1) OR (a.v=1 AND c.v=1)
      ORDER BY a.id,b.id,c.id
    expect:
      data: [{a: 1, b: 0, c: 1}, {a: 1, b: 1, c: 0}, {a: 1, b: 1, c: 1},
             {a: 1, b: 1, c: 2}, {a: 1, b: 2, c: 1}]

  - name: An unrestricted OR branch must not acquire another tables local guard
    sql: |
      SELECT a.id AS a, b.id AS b FROM taut_truth a, taut_truth b
      WHERE (a.v=1 AND b.v=0) OR a.v=0
      ORDER BY a.id,b.id
    expect:
      data: [{a: 0, b: 0}, {a: 0, b: 1}, {a: 0, b: 2}, {a: 1, b: 0}]
    cleanup:
      - sql: DROP TABLE taut_truth

  - name: Shared join in OR preserves duplicate matches and residual branches
    setup:
      - sql: DROP TABLE IF EXISTS taut_or_left
      - sql: DROP TABLE IF EXISTS taut_or_right
      - sql: CREATE TABLE taut_or_left (id INT, k INT, v INT) ENGINE=memory
      - sql: CREATE TABLE taut_or_right (k INT, v INT) ENGINE=memory
      - sql: INSERT INTO taut_or_left VALUES (1,1,1),(2,2,0),(3,NULL,1),(4,3,NULL)
      - sql: INSERT INTO taut_or_right VALUES (1,0),(1,1),(2,1),(3,NULL),(NULL,1)
    sql: |
      SELECT l.id, COUNT(*) AS n FROM taut_or_left l, taut_or_right r
      WHERE (l.k=r.k AND l.v=1) OR (l.k=r.k AND r.v=1)
      GROUP BY l.id ORDER BY l.id
    expect:
      data: [{id: 1, n: 2}, {id: 2, n: 1}]

  - name: Shared OR branch retains NULL extension in outer join
    sql: |
      SELECT l.id, r.v FROM taut_or_left l LEFT JOIN taut_or_right r
      ON (l.k=r.k AND l.v=1) OR (l.k=r.k AND r.v=1)
      ORDER BY l.id, r.v
    expect:
      data: [{id: 1, v: 0}, {id: 1, v: 1}, {id: 2, v: 1}, {id: 3, v: null}, {id: 4, v: null}]

  - name: Factoring never suppresses invalid column binding
    sql: SELECT l.id FROM taut_or_left l WHERE (l.missing=1 AND FALSE) OR (l.missing=1 AND TRUE)
    expect: {error: true}
    cleanup:
      - sql: DROP TABLE taut_or_right
      - sql: DROP TABLE taut_or_left

  - name: "(A OR NOT A) tautology keeps correct rows regardless of EXISTS"
    sql: |
      SELECT ID FROM taut_parent p
      WHERE p.val > 0
        AND (
          EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
          OR NOT EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
        )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "(A AND NOT A) contradiction drops all rows regardless of EXISTS"
    sql: |
      SELECT ID FROM taut_parent p
      WHERE p.val > 0
        AND (
          EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
          AND NOT EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
        )
      ORDER BY ID
    expect:
      rows: 0

  - name: "EXPLAIN for the (A OR NOT A) tautology has no physical EXISTS probe left"
    sql: |
      EXPLAIN SELECT ID FROM taut_parent p
      WHERE p.val > 0
        AND (
          EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
          OR NOT EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
        )
      ORDER BY ID
    expect:
      rows: 1
      result_contains:
        - "taut_parent"
      result_not_contains:
        - "taut_child"
        - "touch_keytable"
        - ".grp:"
        - "recset_project_join"

  - name: "EXPLAIN IR folds the tautological branch out of the WHERE clause"
    sql: |
      EXPLAIN IR SELECT ID FROM taut_parent p
      WHERE p.val > 0
        AND (
          EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
          OR NOT EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
        )
      ORDER BY ID
    expect:
      rows: 1
      result_contains:
        - "get_column"
        - "val"
      result_not_contains:
        - "(or"
        - "(not"

  - name: "SQL truth literals and nested NOT preserve tautology folding"
    sql: |
      EXPLAIN SELECT ID FROM taut_parent p
      WHERE EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
        OR (
          NOT '0'
          AND NOT '0'
          AND NOT EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
        )
    expect:
      rows: 1
      result_contains:
        - "taut_parent"
      result_not_contains:
        - "taut_child"
        - "touch_keytable"
        - ".grp:"
        - "recset_project_join"

  - name: "Non-tautological OR of two distinct correlated EXISTS checks is not folded"
    sql: |
      EXPLAIN SELECT ID FROM taut_parent p
      WHERE p.val > 0
        AND (
          EXISTS (SELECT 1 FROM taut_child c WHERE c.parent_id = p.ID)
          OR EXISTS (SELECT 1 FROM taut_child c2 WHERE c2.parent_id = p.ID AND c2.ID > 100)
        )
      ORDER BY ID
    expect:
      rows: 1
      result_contains:
        - "taut_child"
        - "scan_order"

  - name: "Direct fold rule check: and/or/not/if simplification via /scm"
    scm: |
      (begin
        (define col (list (quote get_column) "a" false "x" false))
        (define checks (list
          (equal? (boolean_fold_expr (list (quote and) true col)) col)
          (equal? (boolean_fold_expr (list (quote and) false col)) false)
          (equal? (boolean_fold_expr (list (quote or) true col)) true)
          (equal? (boolean_fold_expr (list (quote or) false col)) col)
          (equal? (boolean_fold_expr (list (quote not) true)) false)
          (equal? (boolean_fold_expr (list (quote not) false)) true)
          (equal? (boolean_fold_expr (list (quote not) (list (quote not) col))) col)
          (equal? (boolean_fold_expr (list (quote and) col col)) col)
          (equal? (boolean_fold_expr (list (quote or) col col)) col)
          (equal? (boolean_fold_expr (list (quote or) col (list (quote not) col))) true)
          (equal? (boolean_fold_expr (list (quote and) col (list (quote not) col))) false)
          (equal? (boolean_fold_expr (list (quote or) col
            (list (quote and) (list (quote sql_not) "0")
              (list (quote sql_not) "0")
              (list (quote sql_not) col))))
            (list (quote or) col (list (quote sql_not) col)))
          (equal? (boolean_fold_expr (list (quote if) col true false)) col)
          (equal? (boolean_fold_expr (list (quote if) col false true)) (list (quote not) col))
          (equal? (fold_boolean_stage_aggregate '() nil
            (list (list (quote if) col 0 1) (quote +) 0))
            (list (list (quote if) col 0 1) (quote +) 0))))
        (if (reduce checks (lambda (acc c) (and acc c)) true)
          true
          (error (concat "boolean_fold_expr rule mismatch: " (string checks)))))

cleanup:
  - sql: "DROP TABLE IF EXISTS taut_child"
  - sql: "DROP TABLE IF EXISTS taut_parent"
