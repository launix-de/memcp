metadata:
  isolated: true
  description: Range aggregate lookup columns share the prepared point and boundary
    coordinate contract
setup:
- sql: CREATE TABLE range_lookup_events(id INT PRIMARY KEY,tenant_id INT,happened_at
    INT,amount INT)
- sql: CREATE TABLE range_lookup_windows(id INT PRIMARY KEY,tenant_id INT,range_to
    INT,include_all INT)
- scm: |-
    (insert (table "memcp-tests" false "range_lookup_events" false nil)
     '("id" "tenant_id" "happened_at" "amount")
     (map (produceN 6000) (lambda (i)
      (list (+ i 1) (+ 1 (mod i 2)) (floor (/ i 2))
       (if (< i 2) nil (* 10 (+ 1 (mod i 2))))))))
- sql: INSERT INTO range_lookup_windows VALUES(1,1,2,0),(2,1,2,0),(3,1,0,0),(4,1,-1,0),(5,1,NULL,0),(6,2,3,0),(7,9,100,0),(8,NULL,3,0),(9,2,2999,0),(10,NULL,2,1)
test_cases:
- name: A range SUM uses the same point domain for preparation and lookup
  sql: |-
    SELECT w.id, (SELECT SUM(e.amount) FROM range_lookup_events e
     WHERE e.tenant_id=w.tenant_id AND e.happened_at<=w.range_to) AS total
    FROM range_lookup_windows w ORDER BY w.id
  expect:
    rows: 10
    data:
    - id: 1
      total: 20
    - id: 2
      total: 20
    - id: 3
      total: null
    - id: 4
      total: null
    - id: 5
      total: null
    - id: 6
      total: 60
    - id: 7
      total: null
    - id: 8
      total: null
    - id: 9
      total: 59980
    - id: 10
      total: null
- name: mysql range aggregates preserve duplicate NULL and absent caller domains
  syntax: mysql
  sql: |-
    SELECT w.id,
     (SELECT SUM(e.amount) FROM range_lookup_events e WHERE e.tenant_id=w.tenant_id AND e.happened_at<=w.range_to) AS total,
     (SELECT COUNT(*) FROM range_lookup_events e WHERE e.tenant_id=w.tenant_id AND e.happened_at<=w.range_to) AS matched_rows,
     (SELECT COUNT(e.amount) FROM range_lookup_events e WHERE e.tenant_id=w.tenant_id AND e.happened_at<=w.range_to) AS nonnull_rows
    FROM range_lookup_windows w ORDER BY w.id
  expect:
    rows: 10
    data:
    - id: 1
      total: 20
      matched_rows: 3
      nonnull_rows: 2
    - id: 2
      total: 20
      matched_rows: 3
      nonnull_rows: 2
    - id: 3
      total: null
      matched_rows: 1
      nonnull_rows: 0
    - id: 4
      total: null
      matched_rows: 0
      nonnull_rows: 0
    - id: 5
      total: null
      matched_rows: 0
      nonnull_rows: 0
    - id: 6
      total: 60
      matched_rows: 4
      nonnull_rows: 3
    - id: 7
      total: null
      matched_rows: 0
      nonnull_rows: 0
    - id: 8
      total: null
      matched_rows: 0
      nonnull_rows: 0
    - id: 9
      total: 59980
      matched_rows: 3000
      nonnull_rows: 2999
    - id: 10
      total: null
      matched_rows: 0
      nonnull_rows: 0
