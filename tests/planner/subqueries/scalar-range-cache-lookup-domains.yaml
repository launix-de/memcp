- name: Restart rebuilds range lookups from their declared point and cut domains
  syntax: mysql
  sql: SHUTDOWN
  restart_timeout: 60
  expect:
    rows: 0
- name: Range values remain exact after restart
  sql: |-
    SELECT w.id, (SELECT SUM(e.amount) FROM range_lookup_events e
     WHERE e.tenant_id=w.tenant_id AND e.happened_at<=w.range_to) AS total
    FROM range_lookup_windows w ORDER BY w.id
  expect:
    rows: 10
    data: *id001
- name: Recovered residual range partitions retain NULL caller identity
  sql: |-
    SELECT w.id, (SELECT SUM(e.amount) FROM range_lookup_events e
     WHERE (e.tenant_id=w.tenant_id OR w.include_all=1) AND e.happened_at<=w.range_to) AS total
    FROM range_lookup_windows w ORDER BY w.id
