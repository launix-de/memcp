- name: Residual caller predicates remain part of the complete range domain
  sql: |-
    SELECT w.id, (SELECT SUM(e.amount) FROM range_lookup_events e
     WHERE (e.tenant_id=w.tenant_id OR w.include_all=1) AND e.happened_at<=w.range_to) AS total
    FROM range_lookup_windows w ORDER BY w.id
  expect:
    rows: 10
    data:
    - id: 1
      total: 20
    - id: 2
      total: 20
    - id: 3
      total: null
    - id: 4
      total: null
    - id: 5
      total: null
    - id: 6
      total: 60
    - id: 7
      total: null
    - id: 8
      total: null
    - id: 9
      total: 59980
    - id: 10
      total: 60
