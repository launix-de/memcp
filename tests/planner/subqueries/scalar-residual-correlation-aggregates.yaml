- name: A source mutation changes counts without assigning SUM an empty value
  sql: INSERT INTO residual_values VALUES(5,1,3),(6,9,NULL)
- name: mysql warm scalar aggregates retain COUNT and SUM distinctions
  syntax: mysql
  sql: |-
    SELECT caller.id,
           (SELECT COUNT(*) FROM residual_values entry
            WHERE entry.group_key=caller.group_key OR (entry.group_key IS NULL AND caller.group_key IS NULL)) AS matched_rows,
           (SELECT COUNT(amount) FROM residual_values entry
            WHERE entry.group_key=caller.group_key OR (entry.group_key IS NULL AND caller.group_key IS NULL)) AS nonnull_rows,
           (SELECT SUM(amount) FROM residual_values entry
            WHERE entry.group_key=caller.group_key OR (entry.group_key IS NULL AND caller.group_key IS NULL)) AS total
    FROM residual_callers caller ORDER BY caller.id
  expect:
    rows: 5
    data:
