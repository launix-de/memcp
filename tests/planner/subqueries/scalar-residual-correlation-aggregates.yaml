metadata:
  isolated: true
  description: Scalar aggregates retain residual correlation coordinates and NULL semantics across SQL dialects
setup:
- sql: CREATE TABLE residual_callers(id INT PRIMARY KEY,group_key INT)
- sql: CREATE TABLE residual_values(id INT PRIMARY KEY,group_key INT,amount INT)
- sql: INSERT INTO residual_callers VALUES(1,1),(2,1),(3,NULL),(4,2),(5,9)
- sql: INSERT INTO residual_values VALUES(1,1,4),(2,1,NULL),(3,NULL,6),(4,2,8)
cleanup:
- sql: DROP TABLE IF EXISTS residual_values
- sql: DROP TABLE IF EXISTS residual_callers
test_cases:
- name: mysql preserves repeated NULL and missing correlation domains
  syntax: mysql
  sql: |-
    SELECT caller.id,
           (SELECT COUNT(*) FROM residual_values entry
            WHERE entry.group_key=caller.group_key OR (entry.group_key IS NULL AND caller.group_key IS NULL)) AS matched_rows,
           (SELECT COUNT(amount) FROM residual_values entry
            WHERE entry.group_key=caller.group_key OR (entry.group_key IS NULL AND caller.group_key IS NULL)) AS nonnull_rows,
           (SELECT SUM(amount) FROM residual_values entry
            WHERE entry.group_key=caller.group_key OR (entry.group_key IS NULL AND caller.group_key IS NULL)) AS total
    FROM residual_callers caller ORDER BY caller.id
  expect:
    rows: 5
    data:
    - id: 1
      matched_rows: 2
      nonnull_rows: 1
      total: 4
    - id: 2
      matched_rows: 2
      nonnull_rows: 1
      total: 4
    - id: 3
      matched_rows: 1
      nonnull_rows: 1
      total: 6
    - id: 4
      matched_rows: 1
      nonnull_rows: 1
      total: 8
    - id: 5
      matched_rows: 0
      nonnull_rows: 0
      total: null
