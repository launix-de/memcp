# EXISTS subquery tests

metadata:
  version: "1.0"
  description: "EXISTS and NOT EXISTS subquery tests"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS exists_point_acl"
  - sql: "DROP TABLE IF EXISTS exists_point_child"
  - sql: "DROP TABLE IF EXISTS exists_point_parent"
  - sql: "DROP TABLE IF EXISTS exists_shipments"
  - sql: "DROP TABLE IF EXISTS exists_doc_shares"
  - sql: "DROP TABLE IF EXISTS exists_docs"
  - sql: "DROP TABLE IF EXISTS exists_orders"
  - sql: "DROP TABLE IF EXISTS exists_customers"
  - sql: |
      CREATE TABLE exists_customers (
        ID INT PRIMARY KEY,
        name VARCHAR(64)
      )
  - sql: |
      CREATE TABLE exists_orders (
        ID INT PRIMARY KEY,
        customer_id INT,
        total DECIMAL(10,2)
      )
  - sql: |
      INSERT INTO exists_customers (ID, name) VALUES
      (1, 'Alice'), (2, 'Bob'), (3, 'Charlie')
  - sql: |
      INSERT INTO exists_orders (ID, customer_id, total) VALUES
      (101, 1, 100.00), (102, 1, 200.00), (103, 2, 150.00)
  - sql: |
      CREATE TABLE exists_docs (
        ID INT PRIMARY KEY,
        owner_id INT,
        title VARCHAR(64)
      )
  - sql: |
      CREATE TABLE exists_doc_shares (
        ID INT PRIMARY KEY,
        doc_id INT,
        user_id INT
      )
  - sql: |
      INSERT INTO exists_docs (ID, owner_id, title) VALUES
      (1, 1, 'own row'), (2, 2, 'shared row'), (3, 2, 'blocked row')
  - sql: |
      INSERT INTO exists_doc_shares (ID, doc_id, user_id) VALUES
      (10, 2, 1)
  - sql: |
      CREATE TABLE exists_shipments (
        ID INT PRIMARY KEY,
        order_id INT,
        supplier_id INT,
        late BOOLEAN
      )
  - sql: |
      INSERT INTO exists_shipments (ID, order_id, supplier_id, late) VALUES
      (1, 1, 1, TRUE),
      (2, 1, 2, FALSE),
      (3, 2, 1, TRUE),
      (4, 2, 2, TRUE),
      (5, 3, 1, TRUE)

test_cases:
  - name: "Set up large point-probe EXISTS relations"
    setup:
      - sql: "CREATE TABLE exists_point_parent (ID INT PRIMARY KEY, payload INT)"
      - sql: "CREATE TABLE exists_point_child (ID INT PRIMARY KEY, parent_id INT)"
      - sql: "CREATE TABLE exists_point_acl (ID INT PRIMARY KEY, child_id INT, principal_id INT)"
      - scm: |
          (begin
            (insert (table "memcp-tests" "exists_point_parent") (list "ID" "payload")
              (map (produceN 2000) (lambda (i) (list (+ i 1) i))))
            (insert (table "memcp-tests" "exists_point_child") (list "ID" "parent_id")
              (map (produceN 2000) (lambda (i) (list (+ i 1) (+ i 1)))))
            (insert (table "memcp-tests" "exists_point_acl") (list "ID" "child_id" "principal_id")
              (map (produceN 2000) (lambda (i) (list (+ i 1) (+ i 1) 7)))))
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM exists_point_parent"
    expect:
      rows: 1
      data:
        - cnt: 2000

  - name: "Point-selected parent evaluates correlated EXISTS directly"
    sql: |
      SELECT p.ID,
        EXISTS (
          SELECT TRUE
          FROM exists_point_child c
          WHERE c.parent_id = p.ID
            AND EXISTS (
              SELECT TRUE
              FROM exists_point_acl acl
              WHERE acl.child_id = c.ID
                AND acl.principal_id = 7
              LIMIT 1
            )
          LIMIT 1
        ) AS has_child,
        EXISTS (
          SELECT TRUE
          FROM exists_point_child alternate
          WHERE alternate.parent_id = p.ID
            AND alternate.ID > 0
          LIMIT 1
        ) AS has_alternate
      FROM exists_point_parent p
      WHERE p.ID = 1500
    expect:
      rows: 1
      data:
        - {ID: 1500, has_child: true, has_alternate: true}

  - name: "Point-selected parent avoids full correlated EXISTS keytable"
    sql: |
      EXPLAIN SELECT p.ID,
        EXISTS (
          SELECT TRUE
          FROM exists_point_child c
          WHERE c.parent_id = p.ID
            AND EXISTS (
              SELECT TRUE
              FROM exists_point_acl acl
              WHERE acl.child_id = c.ID
                AND acl.principal_id = 7
              LIMIT 1
            )
          LIMIT 1
        ) AS has_child,
        EXISTS (
          SELECT TRUE
          FROM exists_point_child alternate
          WHERE alternate.parent_id = p.ID
            AND alternate.ID > 0
          LIMIT 1
        ) AS has_alternate
      FROM exists_point_parent p
      WHERE p.ID = 1500
    expect:
      rows: 1
      result_contains:
        - "scan_order"
      result_not_contains:
        - "touch_keytable"
        - ".grp:query:"
        - ".grp:exists_point_acl:"

  - name: "Bounded ordered projection probes EXISTS after native LIMIT"
    setup:
      - sql: "DELETE FROM system_statistic.scans WHERE schema = 'memcp-tests' AND (`table` LIKE '.grp:exists_point_child:%' OR `table` LIKE '.grp:query:%')"
    sql: |
      SELECT p.ID,
        EXISTS (
          SELECT TRUE
          FROM exists_point_child c
          WHERE c.parent_id = p.ID
          LIMIT 1
        ) AS has_child
      FROM exists_point_parent p
      ORDER BY p.ID
      LIMIT 72
    max_time: 2
    expect:
      rows: 72

  - name: "Bounded ordered EXISTS projection performs no carrier scan"
    sql: |
      SELECT COUNT(*) AS carrier_scans
      FROM system_statistic.scans
      WHERE schema = 'memcp-tests'
        AND (`table` LIKE '.grp:exists_point_child:%' OR `table` LIKE '.grp:query:%')
    expect:
      rows: 1
      data:
        - {carrier_scans: 0}

  - name: "Bounded ordered EXISTS projection has a direct physical probe"
    sql: |
      EXPLAIN SELECT p.ID,
        EXISTS (
          SELECT TRUE
          FROM exists_point_child c
          WHERE c.parent_id = p.ID
          LIMIT 1
        ) AS has_child
      FROM exists_point_parent p
      ORDER BY p.ID
      LIMIT 72
    expect:
      rows: 1
      result_contains:
        - "scan_order"
      result_not_contains:
        - "touch_keytable"
        - ".grp:exists_point_child:"
        - ".grp:query:"

  - name: "Set up point-selected nested access chain"
    setup:
      - sql: "CREATE TABLE exists_point_location (ID INT PRIMARY KEY, tenant_id INT)"
      - sql: "CREATE TABLE exists_point_tenant (ID INT PRIMARY KEY)"
      - sql: "CREATE TABLE exists_point_dav (ID INT PRIMARY KEY, content_id INT)"
      - scm: |
          (begin
            (insert (table "memcp-tests" "exists_point_location") (list "ID" "tenant_id")
              (map (produceN 2000) (lambda (i) (list (+ i 1) (+ (mod i 200) 1)))))
            (insert (table "memcp-tests" "exists_point_tenant") (list "ID")
              (map (produceN 200) (lambda (i) (list (+ i 1))))))
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM exists_point_location"
    expect:
      rows: 1
      data:
        - cnt: 2000

  - name: "Point-selected nested access chain preserves EXISTS semantics"
    sql: |
      SELECT p.ID,
        (
          EXISTS (
            SELECT ID
            FROM exists_point_dav
            WHERE content_id = p.ID
            LIMIT 1
          )
          OR EXISTS (
            SELECT ID
            FROM exists_point_child
            WHERE parent_id = p.ID
            AND COALESCE((
              SELECT (
                EXISTS (
                  SELECT TRUE
                  FROM exists_point_acl global_acl
                  WHERE global_acl.principal_id = 7
                    AND global_acl.child_id IS NULL
                  LIMIT 1
                )
                OR COALESCE((
                  SELECT EXISTS (
                    SELECT TRUE
                    FROM exists_point_acl tenant_acl
                    WHERE tenant_acl.principal_id = 7
                      AND tenant_acl.child_id = tenant.ID
                    LIMIT 1
                  )
                  FROM exists_point_tenant tenant
                  WHERE tenant.ID = location.tenant_id
                  LIMIT 1
                ), FALSE)
              )
              FROM exists_point_location location
              WHERE location.ID = exists_point_child.ID
              LIMIT 1
            ), FALSE)
            LIMIT 1
          )
        ) AS can_read
      FROM exists_point_parent p
      WHERE p.ID = 1500
    expect:
      rows: 1
      data:
        - {ID: 1500, can_read: true}

  - name: "EXISTS with correlated subquery - customers with orders"
    sql: |
      SELECT ID, name FROM exists_customers c
      WHERE EXISTS (SELECT 1 FROM exists_orders o WHERE o.customer_id = c.ID)
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "Alice"
        - ID: 2
          name: "Bob"

  - name: "EXPLAIN correlated EXISTS lowers to COUNT group stage"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    steps:
      - sql: |
          EXPLAIN IR SELECT ID, name FROM exists_customers c
          WHERE EXISTS (SELECT 1 FROM exists_orders o WHERE o.customer_id = c.ID)
          ORDER BY ID
        expect:
          contains:
            - "group-stage"
            - "stage-output"
            - "exists"
            - "presence_only"
            - "max_needed_per_domain"
            - "domain"
            - "lookup-keys"
            - "partition_by"
            - "result_max_rows_per_partition"
          not_contains:
            - "neumann_exists"
            - "exists_probe"
            - "inner_select"
            - ".grp:"
            - "__mat:_uncorr_cnt_"
            - "touch_keytable"

  - name: "Correlated EXISTS with range filter keeps correct SQL result"
    sql: |
      SELECT ID, name FROM exists_customers c
      WHERE EXISTS (
        SELECT 1 FROM exists_orders o
        WHERE o.customer_id = c.ID
          AND o.total > 150
      )
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 1
          name: "Alice"

  - name: "EXPLAIN correlated EXISTS can use RecSet projection carrier"
    sql: |
      EXPLAIN SELECT ID, name FROM exists_customers c
      WHERE EXISTS (
        SELECT 1 FROM exists_orders o
        WHERE o.customer_id = c.ID
          AND o.total > 150
      )
      ORDER BY ID
    expect:
      contains:
        - "recset_project_join"
        - "scan_recset"
      not_contains:
        - "exists_probe"
        - "driver_membership_probe"
        - "touch_keytable"

  - name: "EXPLAIN REORDER keeps EXISTS membership as a logical requirement"
    sql: |
      EXPLAIN REORDER SELECT ID, name FROM exists_customers c
      WHERE EXISTS (
        SELECT 1 FROM exists_orders o
        WHERE o.customer_id = c.ID
          AND o.total > 150
      )
      ORDER BY ID
    expect:
      contains:
        - "exists_membership_requirement"
        - "membership_requirement_probe"
        - "left_join_requirements"
      not_contains:
        - "driver_membership_probe"
        - "recset_project_join"
        - "group_cache_read"
        - "tempcol_materialize_reusable"
        - "subscan_partition_limit"

  - name: "Optimizer rewrites generated EXISTS scan pattern to scan_exists"
    scm: |
      (begin
        (define plan (serialize (optimize
          (list 'scan
            nil
            (list 'table "memcp-tests" "exists_orders")
            (list "customer_id" "total")
            (list 'lambda (list 'customer_id 'total)
              (list 'and (list 'equal?? 'customer_id 1) (list '> 'total 150)))
            (list)
            (list 'lambda (list) true)
            (list 'lambda (list 'acc 'row) (list 'or 'acc 'row))
            false
            nil
            false))))
        (if (not (match plan (regex "scan_exists" _) true false))
          (error (concat "expected scan_exists rewrite, got " plan)))
        (if (match plan (regex "^\\(scan " _) true false)
          (error (concat "old scan survived EXISTS rewrite: " plan)))
        true)

  - name: "Optimizer rewrites generated EXISTS scan even with ignored map columns"
    scm: |
      (begin
        (define plan (serialize (optimize
          (list 'scan
            nil
            (list 'table "memcp-tests" "exists_orders")
            (list "customer_id")
            (list 'lambda (list 'customer_id) (list 'equal?? 'customer_id 1))
            (list "ID")
            (list 'lambda (list 'ID) true)
            (list 'lambda (list 'a 'b) (list 'or 'b 'a))
            false
            nil
            false))))
        (if (not (match plan (regex "scan_exists" _) true false))
          (error (concat "expected scan_exists rewrite with ignored map column, got " plan)))
        true)

  - name: "Optimizer keeps non-EXISTS scan with projected map value"
    scm: |
      (begin
        (define plan (serialize (optimize
          (list 'scan
            nil
            (list 'table "memcp-tests" "exists_orders")
            (list "customer_id")
            (list 'lambda (list 'customer_id) (list 'equal?? 'customer_id 1))
            (list "ID")
            (list 'lambda (list 'ID) 'ID)
            (list 'lambda (list 'a 'b) (list 'or 'a 'b))
            false
            nil
            false))))
        (if (match plan (regex "scan_exists" _) true false)
          (error (concat "projecting scan must not become scan_exists: " plan)))
        true)

  - name: "NOT EXISTS - customers without orders"
    sql: |
      SELECT ID, name FROM exists_customers c
      WHERE NOT EXISTS (SELECT 1 FROM exists_orders o WHERE o.customer_id = c.ID)
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 3
          name: "Charlie"

  - name: "Residual outer column is part of EXISTS domain"
    sql: |
      SELECT l1.ID
      FROM exists_shipments l1
      WHERE l1.late = TRUE
        AND EXISTS (
          SELECT 1
          FROM exists_shipments l2
          WHERE l2.order_id = l1.order_id
            AND l2.supplier_id <> l1.supplier_id
        )
        AND NOT EXISTS (
          SELECT 1
          FROM exists_shipments l3
          WHERE l3.order_id = l1.order_id
            AND l3.supplier_id <> l1.supplier_id
            AND l3.late = TRUE
        )
      ORDER BY l1.ID
    expect:
      rows: 1
      data:
        - ID: 1

  - name: "Residual JOIN ON outer column is part of EXISTS domain"
    sql: |
      SELECT l1.ID
      FROM exists_shipments l1
      WHERE EXISTS (
        SELECT 1
        FROM exists_shipments l2
        JOIN exists_shipments l3
          ON l3.order_id = l2.order_id
         AND l3.supplier_id <> l1.supplier_id
         AND l3.late = FALSE
        WHERE l2.order_id = l1.order_id
      )
      ORDER BY l1.ID
    expect:
      rows: 1
      data:
        - ID: 1

  - name: "Derived list keeps residual EXISTS rows through scalar ordering"
    sql: |
      SELECT wrapped.*
      FROM (
        SELECT
          l1.ID,
          l1.order_id,
          l1.supplier_id,
          EXISTS (
            SELECT 1
            FROM exists_shipments peer
            WHERE peer.order_id = l1.order_id
              AND peer.supplier_id <> l1.supplier_id
          ) AS peer_exists
        FROM exists_shipments l1
        WHERE l1.late = TRUE
          AND EXISTS (
            SELECT 1
            FROM exists_shipments l2
            WHERE l2.order_id = l1.order_id
              AND l2.supplier_id <> l1.supplier_id
          )
          AND NOT EXISTS (
            SELECT 1
            FROM exists_shipments l3
            WHERE l3.order_id = l1.order_id
              AND l3.supplier_id <> l1.supplier_id
              AND l3.late = TRUE
          )
      ) wrapped
      LEFT JOIN exists_shipments sorter
        ON sorter.ID = wrapped.order_id
      WHERE TRUE
      ORDER BY (
        SELECT ordered.ID
        FROM exists_shipments ordered
        WHERE ordered.order_id = wrapped.order_id
        LIMIT 1
      ) DESC, wrapped.ID ASC
      LIMIT 72 OFFSET 0
    expect:
      rows: 1
      data:
        - ID: 1
          order_id: 1
          supplier_id: 1
          peer_exists: true

  - name: "Unqualified inner column does not enter EXISTS domain"
    steps:
      - sql: |
          EXPLAIN IR SELECT l1.ID
          FROM exists_shipments l1
          WHERE EXISTS (
            SELECT 1
            FROM exists_shipments l2
            WHERE l2.order_id = l1.order_id
              AND supplier_id > 0
          )
        expect:
          contains:
            - "group-stage"
            - "domain"
          not_contains:
            - '(get_column "l1" false "supplier_id"'

  - name: "EXISTS with uncorrelated subquery - true case"
    sql: |
      SELECT ID, name FROM exists_customers
      WHERE EXISTS (SELECT 1 FROM exists_orders WHERE total > 50)
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 1
          name: "Alice"
        - ID: 2
          name: "Bob"
        - ID: 3
          name: "Charlie"

  - name: "EXISTS with uncorrelated subquery - false case"
    sql: |
      SELECT ID, name FROM exists_customers
      WHERE EXISTS (SELECT 1 FROM exists_orders WHERE total > 1000)
      ORDER BY ID
    expect:
      rows: 0

  - name: "EXPLAIN uncorrelated EXISTS avoids materialized count cache"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    steps:
      - sql: |
          EXPLAIN IR SELECT ID, name FROM exists_customers
          WHERE EXISTS (SELECT 1 FROM exists_orders WHERE total > 50)
          ORDER BY ID
        expect:
          contains:
            - "group-stage"
            - "stage-output"
            - "exists"
            - "presence_only"
            - "max_needed_per_domain"
            - "domain"
            - "lookup-keys"
            - "partition_by"
            - "result_max_rows_per_partition"
          not_contains:
            - "neumann_exists"
            - "inner_select"
            - "exists_probe"
            - ".grp:"
            - "__mat:_uncorr_cnt_"
            - "touch_keytable"
            - "\"__cnt\""

  - name: "EXISTS with session-backed scalar predicate is true"
    sql: |
      SELECT EXISTS (SELECT 1 WHERE LAST_INSERT_ID() IS NULL) AS ok
    expect:
      rows: 1
      data:
        - ok: true

  - name: "Scalar no-FROM subquery with session-backed predicate returns one row"
    sql: |
      SELECT (SELECT 1 WHERE LAST_INSERT_ID() IS NULL) AS one_row
    expect:
      rows: 1
      data:
        - one_row: 1

  - name: "EXISTS with session-backed scalar predicate keeps outer rows"
    sql: |
      SELECT ID, name FROM exists_customers
      WHERE EXISTS (SELECT 1 WHERE LAST_INSERT_ID() IS NULL)
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 1
          name: "Alice"
        - ID: 2
          name: "Bob"
        - ID: 3
          name: "Charlie"

  - name: "EXISTS ignores session state in projection for row existence"
    sql: |
      SELECT ID, name FROM exists_customers
      WHERE EXISTS (SELECT LAST_INSERT_ID() FROM exists_orders WHERE total > 50)
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 1
          name: "Alice"
        - ID: 2
          name: "Bob"
        - ID: 3
          name: "Charlie"

  - name: "EXPLAIN EXISTS ignores session state in projection without count materialization"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    steps:
      - sql: |
          EXPLAIN IR SELECT ID, name FROM exists_customers
          WHERE EXISTS (SELECT LAST_INSERT_ID() FROM exists_orders WHERE total > 50)
          ORDER BY ID
        expect:
          contains:
            - "group-stage"
            - "stage-output"
            - "exists"
            - "presence_only"
            - "max_needed_per_domain"
            - "domain"
            - "lookup-keys"
            - "partition_by"
            - "result_max_rows_per_partition"
          not_contains:
            - "neumann_exists"
            - "inner_select"
            - "exists_probe"
            - ".grp:"
            - "__mat:_uncorr_cnt_"
            - "touch_keytable"
            - "\"__cnt\""

  - name: "Correlated NOT EXISTS access expression projects true"
    sql: |
      SELECT ID,
        NOT (
          owner_id <> 1
          AND NOT EXISTS (
            SELECT TRUE
            FROM exists_doc_shares s
            WHERE s.doc_id = d.ID
              AND s.user_id = 1
            LIMIT 1
          )
        ) AS can_read
      FROM exists_docs d
      ORDER BY ID
    expect:
      rows: 3
      data:
        - {ID: 1, can_read: true}
        - {ID: 2, can_read: true}
        - {ID: 3, can_read: false}

  - name: "Correlated NOT EXISTS access expression filters rows without CASE"
    sql: |
      SELECT ID
      FROM exists_docs d
      WHERE NOT (
        owner_id <> 1
        AND NOT EXISTS (
          SELECT TRUE
          FROM exists_doc_shares s
          WHERE s.doc_id = d.ID
            AND s.user_id = 1
          LIMIT 1
        )
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "CASE in WHERE keeps correlated NOT EXISTS access expression"
    sql: |
      SELECT ID
      FROM exists_docs d
      WHERE CASE
        WHEN FALSE THEN TRUE
        ELSE NOT (
          owner_id <> 1
          AND NOT EXISTS (
            SELECT TRUE
            FROM exists_doc_shares s
            WHERE s.doc_id = d.ID
              AND s.user_id = 1
            LIMIT 1
          )
        )
      END
      ORDER BY ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "CASE in SELECT projects correlated NOT EXISTS access expression"
    sql: |
      SELECT ID,
        CASE
          WHEN FALSE THEN TRUE
          ELSE NOT (
            owner_id <> 1
            AND NOT EXISTS (
              SELECT TRUE
              FROM exists_doc_shares s
              WHERE s.doc_id = d.ID
                AND s.user_id = 1
              LIMIT 1
            )
          )
        END AS can_read
      FROM exists_docs d
      ORDER BY ID
    expect:
      rows: 3
      data:
        - {ID: 1, can_read: true}
        - {ID: 2, can_read: true}
        - {ID: 3, can_read: false}

  - name: "Scalar query recipes reuse shared presence carrier preparation"
    sql: |
      SELECT c.ID,
        COALESCE((
          SELECT (
            EXISTS (
              SELECT TRUE FROM exists_orders global_a
              WHERE global_a.total > 1000
              LIMIT 1
            )
            OR EXISTS (
              SELECT TRUE FROM exists_orders own_a
              WHERE own_a.customer_id = parent_a.ID
              LIMIT 1
            )
          )
          FROM exists_customers parent_a
          WHERE parent_a.ID = c.ID
          LIMIT 1
        ), FALSE) AS allowed_a,
        COALESCE((
          SELECT (
            EXISTS (
              SELECT TRUE FROM exists_orders global_b
              WHERE global_b.total > 1000
              LIMIT 1
            )
            OR EXISTS (
              SELECT TRUE FROM exists_orders own_b
              WHERE own_b.customer_id = parent_b.ID
              LIMIT 1
            )
          )
          FROM exists_customers parent_b
          WHERE parent_b.ID = c.ID
          LIMIT 1
        ), FALSE) AS allowed_b
      FROM exists_customers c
      ORDER BY c.ID
    expect:
      rows: 3
      data:
        - {ID: 1, allowed_a: true, allowed_b: true}
        - {ID: 2, allowed_a: true, allowed_b: true}
        - {ID: 3, allowed_a: false, allowed_b: false}

  - name: "EXPLAIN prepares shared scalar recipe presence carriers once"
    sql: |
      EXPLAIN SELECT c.ID,
        COALESCE((
          SELECT (
            EXISTS (
              SELECT TRUE FROM exists_orders global_a
              WHERE global_a.total > 1000
              LIMIT 1
            )
            OR EXISTS (
              SELECT TRUE FROM exists_orders own_a
              WHERE own_a.customer_id = parent_a.ID
              LIMIT 1
            )
          )
          FROM exists_customers parent_a
          WHERE parent_a.ID = c.ID
          LIMIT 1
        ), FALSE) AS allowed_a,
        COALESCE((
          SELECT (
            EXISTS (
              SELECT TRUE FROM exists_orders global_b
              WHERE global_b.total > 1000
              LIMIT 1
            )
            OR EXISTS (
              SELECT TRUE FROM exists_orders own_b
              WHERE own_b.customer_id = parent_b.ID
              LIMIT 1
            )
          )
          FROM exists_customers parent_b
          WHERE parent_b.ID = c.ID
          LIMIT 1
        ), FALSE) AS allowed_b
