- name: Derived alias substitution keeps native declarations opaque inside query sources
  scm: |
    (begin
      (define declarations (sql_relation_declarations "memcp-tests" "catalog_binding_rows" nil))
      (define source (list "base" "memcp-tests" "catalog_binding_rows" false
        (list 'equal? (list 'get_column "eliminated" false "value" false) 7) declarations))
      (define query (make_query_block "memcp-tests" (list source)
