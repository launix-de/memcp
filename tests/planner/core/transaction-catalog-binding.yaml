- name: Derived alias substitution respects stage input scopes and rewrites active stage expressions
  scm: |
    (begin
      (define declarations (sql_relation_declarations "memcp-tests" "catalog_binding_rows" nil))
      (define source (list "base" "memcp-tests" "catalog_binding_rows" false nil declarations))
      (define reference (list 'get_column "eliminated" false "value" false))
      (define stage (make_group_stage "test-stage" source (list "value" reference)
