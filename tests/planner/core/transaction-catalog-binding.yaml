        (parse_psql db text policy planning tx))))
      (define run (lambda () (with_autocommit s nil nil "declaration guard" (lambda (tx)
        (sql_execute_formula s tx (cached_parse shared "psql" (list parser) "memcp-tests"
          "SELECT label FROM catalog_binding_rows WHERE id=1" nil "root" s false tx)
          (lambda (_row) true) (lambda args true))))))
      (run) (run)
      (define first (counter "compiled"))
      (altercolumn (table "memcp-tests" false "catalog_binding_rows" false nil)
        "label" "dimensions" '(83))
      (run)
      (list first (counter "compiled")))
  expect: {result: [1,2]}
- name: One compile keeps its immutable facts while its live guard observes a new declaration
  scm: |
    (begin
      (define s (newsession)) (s "username" "root")
      (define planning (sql_queryplan_compile_session s nil))
      (define query (make_query_block "memcp-tests"
        (list (list "r" "memcp-tests" "catalog_binding_rows" false nil nil))
        (list "label" (list 'get_column "r" false "label" false))
        true nil nil nil nil nil nil nil nil))
      (define first (sql_bind_catalog_declarations query nil planning))
      (define original (source_declarations (car (qb_sources first))))
      (altercolumn (table "memcp-tests" false "catalog_binding_rows" false nil)
        "label" "dimensions" '(109))
      (define second (sql_bind_catalog_declarations first nil planning))
      (define guard (sql_queryplan_compile_formula nil (sql_queryplan_guard_from_session planning)))
      (and (identical? original (source_declarations (car (qb_sources second))))
        (not (guard s nil (lambda (_row) true) (lambda args true)))))
  expect: {result: true}
- name: CTE star exports are bound before their outer consumer
  sql: WITH q AS (SELECT * FROM catalog_binding_rows) SELECT id,label FROM q ORDER BY id
  expect:
    data: [{id: 1,label: first},{id: 2,label: second}]
- name: Explicit CTE aliases consume the bound wildcard export directory
  sql: WITH q(key_value,display_value,extra_value) AS (SELECT * FROM catalog_binding_rows) SELECT key_value,display_value FROM q ORDER BY key_value
  expect:
    data: [{key_value: 1,display_value: first},{key_value: 2,display_value: second}]
- name: A live guard rejects opaque changed defaults without invoking them
  scm: |
    (begin
      (define s (newsession)) (define scope (new_relation_scope s))
      (createtable "memcp-tests" "catalog_live_opaque"
        (list (list "column" "value" "ANY" '() (list "default" 7)))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (define expected (sql_relation_declarations "memcp-tests" "catalog_live_opaque" nil))
      (altercolumn (table "memcp-tests" false "catalog_live_opaque" false nil)
        "value" "default" (lambda () (error "opaque default must never execute")))
      (define mismatch (not (sql_relation_declarations_match?
        "memcp-tests" "catalog_live_opaque" nil expected)))
      (define denied (try (lambda () (begin
        (parse_sql "memcp-tests" "SELECT value FROM catalog_live_opaque" nil (newsession) nil) false))
        (lambda (failure) (regexp_test (concat failure) "opaque native value"))))
      (close_relation_scope scope)
      (and mismatch denied))
  expect: {result: true}

- name: SQL and PSQL cold plans bind unpublished declarations with their native owner
  scm: |
    (begin
      (define s (newsession)) (s "username" "root") (s "schema" "memcp-tests") (tx_begin s)
      (define tx (s "__memcp_tx"))
      (createtable "memcp-tests" "catalog_private_binding"
        (list (list "column" "id" "INT" '() '())
          (list "column" "label" "VARCHAR" '(30) '()))
        (list "engine" "safe") false tx)
      (insert (table "memcp-tests" false "catalog_private_binding" false tx)
        '("id" "label") (list (list 1 "first") (list 2 "second")) '() nil false nil tx)
      (define shared (newcachemap))
      (define results (map (list (list "sql" parse_sql) (list "psql" parse_psql))
        (lambda (dialect)
          (reduce (list "SELECT id,label FROM catalog_private_binding ORDER BY id"
            "SELECT id,label FROM catalog_private_binding WHERE id IN(1,2) ORDER BY id")
            (lambda (ok query) (begin
              (define output (newsession))
              (output "rows" '())
              (define formula (cached_parse shared (car dialect) (list (cadr dialect))
                "memcp-tests" query nil "root" s false tx))
              (sql_execute_formula s tx formula
                (lambda (row) (output "rows" (append (output "rows") row))) (lambda args true))
              (and ok (equal? (output "rows")
                (list (list "id" 1 "label" "first") (list "id" 2 "label" "second")))))) true))))
      (define private (nil? (table "memcp-tests" false "catalog_private_binding" false nil)))
      (tx_rollback s)
      (and (reduce results (lambda (ok value) (and ok value)) true) private
        (nil? (table "memcp-tests" false "catalog_private_binding" false nil))
        (equal? (count (shared)) 0)))
  expect: {result: true}

- name: Every consumed semantic field participates in live declaration guards
  scm: |
    (begin
      (define expected (sql_relation_declarations "memcp-tests" "catalog_binding_rows" nil))
      (define columns (expected "columns"))
      (define first (car columns))
      (and (sql_relation_declarations_match? "memcp-tests" "catalog_binding_rows" nil expected)
        (reduce sql_semantic_column_fields (lambda (all_changed key)
          (begin
            (define changed_column (map (produceN (count first)) (lambda (index)
              (if (and (equal? (mod index 2) 1) (equal? (nth first (- index 1)) key))
                (list "changed declaration" key) (nth first index)))))
            (define changed (list "columns" (cons changed_column (cdr columns))
              "constraints" (expected "constraints") "references" (expected "references")))
            (and all_changed (not (sql_relation_declarations_match?
              "memcp-tests" "catalog_binding_rows" nil changed))))) true)))
  expect: {result: true}
- name: Live declaration comparisons keep boolean and null defaults distinct
  scm: |
    (begin
      (define scope (new_relation_scope (newsession)))
      (createtable "memcp-tests" "catalog_guard_null_default"
        (list (list "column" "value" "ANY" '() '()))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (define target (table "memcp-tests" false "catalog_guard_null_default" false nil))
      (define expected (sql_relation_declarations "memcp-tests" "catalog_guard_null_default" nil))
      (define before (sql_relation_declarations_match? "memcp-tests" "catalog_guard_null_default" nil expected))
      (altercolumn target "value" "default" false)
      (define changed (not (sql_relation_declarations_match? "memcp-tests" "catalog_guard_null_default" nil expected)))
      (close_relation_scope scope)
      (and before changed))
  expect: {result: true}
- name: Native declarations retain one schema description through statistics refresh
  scm: |
    (begin
      (define target (table "memcp-tests" false "catalog_binding_rows" false nil))
      (define before (show target "declarations"))
      (define column (car (before "columns")))
      (rebuild)
      (and (identical? before (show target "declarations"))
        (not (has_assoc? column "RowEstimate"))
        (not (has_assoc? column "DistinctEstimate"))
        (not (has_assoc? column "StatisticsKnown"))
        (not (has_assoc? column "MinEstimate"))
        (has_assoc? column "Computed")
        (expression_equal? before (sql_declaration_data before))))
  expect: {result: true}
- name: Native column and key metadata publish together and retain earlier descriptions
  scm: |
    (begin
      (define scope (new_relation_scope (newsession)))
      (createtable "memcp-tests" "catalog_guard_native_publication"
        (list (list "column" "value" "INT" '() '()))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (define target (table "memcp-tests" false "catalog_guard_native_publication" false nil))
      (define first (show target "declarations"))
      (createcolumn target "label" "VARCHAR" '(17) '())
      (define second (show target "declarations"))
      (createkey target "declaration_guard_key" true '("value") nil)
      (define third (show target "declarations"))
      (define valid (and (equal? (count (first "columns")) 1)
        (equal? (count (second "columns")) 2)
        (empty_list? ((first "constraints") "Unique"))
        (empty_list? ((second "constraints") "Unique"))
        (equal? (count ((third "constraints") "Unique")) 1)
        (equal? ((car (first "columns")) "Key") "")
        (equal? ((car (third "columns")) "Key") "UNI")))
      (close_relation_scope scope) valid)
  expect: {result: true}
- name: Derived alias substitution preserves quoted expression-shaped values
