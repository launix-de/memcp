      (define cache (newcachemap)) (define out (newsession))
      (define counter (newsession)) (counter "compiled" 0)
      (define parser (lambda (db text policy planning tx) (begin
        (counter "compiled" (+ 1 (counter "compiled")))
        (parse_sql db text policy planning tx))))
      (define run (lambda () (begin
        (with_autocommit s nil nil "fixed point read" (lambda (tx)
          (sql_execute_formula s tx (cached_parse cache "sql" (list parser) "memcp-tests"
            "SELECT payload FROM catalog_point_stats WHERE id=1" nil "root" s false tx)
            (lambda (row) (out "payload" (row "payload"))) (lambda args true))))
        (out "payload"))))
      (define execute (lambda (text) (with_autocommit s nil nil text (lambda (tx)
        (sql_execute_formula s tx (cached_parse (newcachemap) "sql" (list parse_sql) "memcp-tests"
          text nil "root" s false tx) (lambda (_row) true) (lambda args true))))))
      (define first (run))
      (define target (table "memcp-tests" false "catalog_point_stats" false nil))
      (define before (table_planner_statistics target))
      (execute "INSERT INTO catalog_point_stats VALUES(2,'other','two'),(3,'third','three')")
      (execute "UPDATE catalog_point_stats SET payload='updated' WHERE id=1")
      (define after (run))
