metadata:
  syntax: tsql
  isolated: true
  description: Shared declaration binding and native transaction-owned query plans
setup:
- sql: CREATE TABLE catalog_count_binding(id INT PRIMARY KEY)
- sql: CREATE TABLE catalog_binding_rows(id INT PRIMARY KEY,label NVARCHAR(23) UNIQUE)
- sql: INSERT catalog_binding_rows VALUES(1,N'first'),(2,N'second')
- sql: CREATE TABLE catalog_point_stats(id INT PRIMARY KEY,payload VARCHAR(12),note VARCHAR(12))
- sql: INSERT catalog_point_stats VALUES(1,'initial','one')
cleanup:
- sql: DROP TABLE IF EXISTS catalog_point_stats
- sql: DROP VIEW IF EXISTS catalog_union_binding
- sql: DROP VIEW IF EXISTS catalog_snapshot_view
- sql: DROP VIEW IF EXISTS catalog_legacy_view
- sql: DROP VIEW IF EXISTS catalog_current_view
- sql: DROP TABLE IF EXISTS catalog_binding_rows
- sql: DROP TABLE IF EXISTS catalog_count_binding
test_cases:
- name: Warm a shared computed reduction before native source mutation
  sql: SELECT COUNT(*) AS total FROM catalog_count_binding
  expect: {data: [{total: 0}]}
- name: Native source mutation invalidates an explicit-context computed dependency
  sql: INSERT catalog_count_binding VALUES(1),(2),(3)
  expect: {affected_rows: 3}
- name: Warm computed reduction observes subsequent native source rows
  sql: SELECT COUNT(*) AS total FROM catalog_count_binding
  expect: {data: [{total: 3}]}
- name: Native compile authority becomes pure semantic source declarations
  scm: |
    (begin
      (define s (newsession)) (s "username" "root") (tx_begin s)
      (define tx (s "__memcp_tx"))
      (define query (make_query_block "memcp-tests"
        (list (list "r" "memcp-tests" "catalog_binding_rows" false nil nil))
        (list "label" (list 'get_column "r" false "label" false)) true nil nil nil nil nil nil nil nil))
      (define bound (sql_bind_catalog_declarations query tx nil))
      (define src (car (qb_sources bound)))
      (define label (source_column_declaration src "LABEL" true))
      (define answer (and (equal? (count src) 6)
        (equal? (label "Dimensions") '(23))
        (not (has_assoc? label "RowEstimate"))
        (not (has_assoc? label "StatisticsKnown"))
        (equal? (source_primary_key_columns src) '("id"))
        (has? (source_unique_key_sets src) '("label"))
        (equal? (sql_info_type (sql_get_column_info (list src) "r" false "label" false)) "NVARCHAR")))
      (tx_rollback s) answer)
  expect: {result: true}
- name: Transaction-owned plans refresh wildcard declarations after the prior owner closes
  scm: |
    (begin
      (define shared (newcachemap))
      (define s (newsession)) (s "username" "root") (s "schema" "memcp-tests")
      (define out (newsession))
      (define row (lambda (value) (out "row" value)))
      (tx_begin s)
      (define first_tx (s "__memcp_tx"))
      (define first (cached_parse shared "sql" (list parse_sql) "memcp-tests"
        "SELECT * FROM catalog_binding_rows" nil "root" s false first_tx))
      (sql_execute_formula s first_tx first row (lambda args true))
      (define narrow (not (has_assoc? (out "row") "extra")))
      (define first_cache (tx_get_or_compute_resource first_tx "sql-query-plans:sql"
        (lambda () (error "compiler did not use the native transaction cache"))))
      (tx_rollback s)
      (define closed (try (lambda () (begin (first_cache) false)) (lambda (_failure) true)))
      (createcolumn (table "memcp-tests" false "catalog_binding_rows" false nil)
        "extra" "INT" '() '("default" 9))
      (tx_begin s)
      (define second_tx (s "__memcp_tx"))
      (define second (cached_parse shared "sql" (list parse_sql) "memcp-tests"
        "SELECT * FROM catalog_binding_rows" nil "root" s false second_tx))
      (sql_execute_formula s second_tx second row (lambda args true))
      (define wide (equal? ((out "row") "extra") 9))
      (tx_commit s)
      (and narrow closed wide (equal? (count (shared)) 0)))
  expect: {result: true}
- name: Constant domain propagation retains native declaration proofs
  scm: |
    (begin
      (define constants (make_query_block "memcp-tests" '() '("n" 7)
        true nil nil nil nil nil nil nil nil))
      (define query (make_query_block "memcp-tests"
        (list (list "r" "memcp-tests" "catalog_binding_rows" false nil nil)
          (list "d" "memcp-tests" constants false nil nil))
        (list "label" '(get_column "r" false "label" false))
        (list 'equal?? (list 'get_column "d" false "n" false) 7) nil nil nil nil nil nil nil nil))
      (define bound (sql_bind_catalog_declarations query nil nil))
      (define original (car (qb_sources bound)))
      (define rewritten (bind_constant_domain_columns bound nil false))
      (define src (car (qb_sources rewritten)))
      (and (not (expression_equal? (qb_where bound) (qb_where rewritten)))
        (expression_equal? (source_declarations src) (source_declarations original))
        (equal? (source_primary_key_columns src) '("id"))
        (has? (source_unique_key_sets src) '("label"))
        (equal? ((source_column_declaration src "label" false) "Dimensions") '(23))))
  expect: {result: true}
- name: Parameter row domain alternatives retain native declaration proofs
  scm: |
    (begin
      (define branch (lambda (n) (make_query_block "memcp-tests" '() (list "n" n)
        true nil nil nil nil nil nil nil nil)))
      (define constants (make_union_block 'all (list (branch 7) (branch 8)) nil nil nil nil))
      (define query (make_query_block "memcp-tests"
        (list (list "r" "memcp-tests" "catalog_binding_rows" false nil nil)
          (list "d" "memcp-tests" constants false nil nil))
        (list "label" '(get_column "r" false "label" false))
        true nil nil nil nil nil nil nil nil))
      (define bound (sql_bind_catalog_declarations query nil nil))
      (define original (car (qb_sources bound)))
      (define rewritten (bind_parameter_row_domains bound nil))
      (define src (car (qb_sources rewritten)))
      (and (row_domain_relation? (source_relation (cadr (qb_sources rewritten))))
        (expression_equal? (source_declarations src) (source_declarations original))
        (equal? (source_primary_key_columns src) '("id"))
        (has? (source_unique_key_sets src) '("label"))
        (equal? ((source_column_declaration src "label" false) "Dimensions") '(23))))
  expect: {result: true}
- name: Distinct query cache families remain distinct inside one native transaction
  scm: |
    (begin
      (define s (newsession)) (s "username" "root") (tx_begin s)
      (define tx (s "__memcp_tx"))
      (define shared (newcachemap))
      (define left (cached_parse shared "family-left"
        (lambda (_db _text _policy _planning _tx) 7) "memcp-tests" "SELECT 1" nil "root" s false tx))
      (define right (cached_parse shared "family-right"
        (lambda (_db _text _policy _planning _tx) 8) "memcp-tests" "SELECT 1" nil "root" s false tx))
      (define a (sql_execute_formula s tx left (lambda (_row) true) (lambda args true)))
      (define b (sql_execute_formula s tx right (lambda (_row) true) (lambda args true)))
      (tx_rollback s)
      (and (equal? a 7) (equal? b 8) (equal? (count (shared)) 0)))
  expect: {result: true}
- name: Restore migration changes source positions and preserves five-value SQL data
  scm: |
    (begin
      (define literal (list 'quote (list 1 2 3 4 5)))
      (define old (make_query_block "memcp-tests"
        (list (list "r" "memcp-tests" "catalog_binding_rows" false nil))
        (list "value" literal) true nil nil nil nil nil nil nil nil))
      (define restored (sql_restore_source_layout old))
      (and (equal? (count (car (qb_sources restored))) 6)
        (equal? ((qb_fields restored) "value") literal)
        (expression_equal? restored (sql_restore_source_layout restored))))
  expect: {result: true}
- name: Load a persisted view fixture written with the previous five-field source format
  scm: |
    (create_sql_view nil "memcp-tests" "catalog_legacy_view" "sql"
      "SELECT id,label FROM catalog_binding_rows"
      (make_query_block "memcp-tests"
        (list (list "r" "memcp-tests" "catalog_binding_rows" false nil))
        (list "id" (list 'get_column "r" false "id" false)
          "label" (list 'get_column "r" false "label" false))
        true nil nil nil nil nil nil nil nil) "error")
  expect: {result: 1}
- name: Previous persisted view source format binds current declarations
  sql: SELECT id,label FROM catalog_legacy_view ORDER BY id
  expect:
    data: [{id: 1,label: first},{id: 2,label: second}]
- name: New persisted view producers use the canonical source format
  sql: CREATE VIEW catalog_current_view AS SELECT id,label FROM catalog_binding_rows
  expect: {rows: 0, result_not_contains: '"affected_rows"'}
- name: Canonical persisted view source positions have six fields
  scm: |
    (begin
      (define stored (restore_storage_code (json_decode_scmer
        (nth (sql_find_view "memcp-tests" "catalog_current_view") 2))))
      (equal? (count (car (qb_sources stored))) 6))
  expect: {result: true}
- name: Persisted view source migration survives restart
  action: restart
- name: Prior persisted view remains usable after restart
  sql: SELECT id,label FROM catalog_legacy_view ORDER BY id
  expect:
    data: [{id: 1,label: first},{id: 2,label: second}]
- name: Canonical persisted view remains usable after restart
  sql: SELECT id,label FROM catalog_current_view ORDER BY id
  expect:
    data: [{id: 1,label: first},{id: 2,label: second}]
- name: Opaque native defaults are rejected before logical SQL binding
  scm: |
    (begin
      (define s (newsession))
      (define scope (new_relation_scope s))
      (createtable "memcp-tests" "catalog_opaque_default"
        (list (list "column" "value" "ANY" '()
          (list "default" (lambda () 7))))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (define denied (try (lambda () (begin
        (parse_sql "memcp-tests" "SELECT * FROM catalog_opaque_default" nil (newsession) nil) false))
        (lambda (failure) (regexp_test (concat failure) "opaque native value"))))
      (close_relation_scope scope)
      denied)
  expect: {result: true}
- name: Nested native resource defaults cannot enter logical source facts
  scm: |
    (begin
      (define s (newsession))
      (define scope (new_relation_scope s))
      (createtable "memcp-tests" "catalog_nested_default"
        (list (list "column" "value" "ANY" '()
          (list "default" (list "container" (newcachemap)))))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (define denied (try (lambda () (begin
        (parse_psql "memcp-tests" "SELECT * FROM catalog_nested_default" nil (newsession) nil) false))
        (lambda (failure) (regexp_test (concat failure) "opaque native value"))))
      (close_relation_scope scope)
      denied)
  expect: {result: true}
- name: Semantic declaration copying retains pure recursively nested scalar values
  scm: |
    (expression_equal?
      (sql_declaration_data (list 1 "text" true false nil (list 2 (list "nested"))))
      (list 1 "text" true false nil (list 2 (list "nested"))))
  expect: {result: true}
- name: A six-field persisted view fixture may contain a prior compile snapshot
  scm: |
    (create_sql_view nil "memcp-tests" "catalog_snapshot_view" "sql"
      "SELECT label FROM catalog_binding_rows"
      (sql_bind_catalog_declarations (make_query_block "memcp-tests"
        (list (list "r" "memcp-tests" "catalog_binding_rows" false nil nil))
        (list "label" (list 'get_column "r" false "label" false))
        true nil nil nil nil nil nil nil nil) nil nil) "error")
  expect: {result: 1}
- name: Warm view output metadata rebinds after a consumed native declaration changes
  scm: |
    (begin
      (define s (newsession)) (s "username" "root") (s "schema" "memcp-tests")
      (define output (newsession))
      (define run (lambda (text) (tsql_execute_request "memcp-tests" text s nil 0
        (lambda (_row) true)
        (lambda (titles declarations) (if (not (empty_list? declarations))
          (output "size" ((car declarations) "size")) true)))))
      (run "SELECT label FROM catalog_current_view")
      (define first (output "size"))
      (run "ALTER TABLE catalog_binding_rows ALTER COLUMN label NVARCHAR(47) NULL")
      (run "SELECT label FROM catalog_current_view")
      (list first (output "size")))
  expect: {result: [46,94]}
- name: Stored declaration snapshots are discarded before a view binds its current source
  sql: EXEC sp_columns @table_name=N'catalog_snapshot_view'
  expect:
    rows: 1
    data: [{COLUMN_NAME: label,TYPE_NAME: nvarchar,LENGTH: 94}]
- name: Restart retains the current schema and persisted view format
  action: restart
- name: Reloaded view metadata uses the current source declaration
  sql: EXEC sp_columns @table_name=N'catalog_snapshot_view'
  expect:
    rows: 1
    data: [{COLUMN_NAME: label,TYPE_NAME: nvarchar,LENGTH: 94}]
- name: UNION contract merging consumes bound source declarations
  sql: CREATE VIEW catalog_union_binding AS SELECT id FROM catalog_binding_rows UNION ALL SELECT id FROM catalog_binding_rows
  expect: {rows: 0, result_not_contains: '"affected_rows"'}
- name: UNION view columns preserve their declared types without native keys
  sql: EXEC sp_columns @table_name=N'catalog_union_binding'
  expect:
    rows: 1
    data: [{COLUMN_NAME: id,TYPE_NAME: int,NULLABLE: 1}]
- name: Plain SQL SELECT recompiles when its consumed declaration changes
  scm: |
    (begin
      (define s (newsession)) (s "username" "root") (s "schema" "memcp-tests")
      (define shared (newcachemap))
      (define counter (newsession)) (counter "compiled" 0)
      (define parser (lambda (db text policy planning tx) (begin
        (counter "compiled" (+ 1 (counter "compiled")))
        (parse_sql db text policy planning tx))))
      (define run (lambda () (with_autocommit s nil nil "declaration guard" (lambda (tx)
        (sql_execute_formula s tx (cached_parse shared "sql" (list parser) "memcp-tests"
          "SELECT label FROM catalog_binding_rows WHERE id=1" nil "root" s false tx)
          (lambda (_row) true) (lambda args true))))))
      (run) (run)
      (define first (counter "compiled"))
      (altercolumn (table "memcp-tests" false "catalog_binding_rows" false nil)
        "label" "dimensions" '(61))
      (run)
      (list first (counter "compiled")))
  expect: {result: [1,2]}
