- name: Private joins and nested probes preserve compiler transaction statistics authority
  scm: |
    (begin
      (define s (newsession)) (s "username" "root") (s "schema" "memcp-tests")
      (tx_begin s) (define tx (s "__memcp_tx"))
      (createtable "memcp-tests" "catalog_private_left"
        (list (list "column" "id" "INT" '() '())) '("engine" "memory") false tx)
      (createtable "memcp-tests" "catalog_private_right"
        (list (list "column" "id" "INT" '() '())) '("engine" "memory") false tx)
      (insert (table "memcp-tests" false "catalog_private_left" false tx)
        '("id") (list (list 1) (list 2)))
      (insert (table "memcp-tests" false "catalog_private_right" false tx)
        '("id") (list (list 1) (list 2)))
      (define cache (newcachemap)) (define counts (newsession)) (counts "compiled" 0)
      (define out (newsession))
      (define parser (lambda (db text policy planning context) (begin
        (counts "compiled" (+ 1 (counts "compiled")))
        (parse_sql db text policy planning context))))
      (define run (lambda (text) (begin
        (out "rows" 0) (out "ids" 0) (out "nested" 0)
        (sql_execute_formula s tx (cached_parse cache "private-statistics" (list parser)
          "memcp-tests" text nil "root" s false tx)
          (lambda (row) (begin
            (out "rows" (+ 1 (out "rows")))
            (out "ids" (+ (row "id") (out "ids")))
            (out "nested" (+ (coalesceNil (row "n") 0) (out "nested")))))
          (lambda args true))
        (list (out "rows") (out "ids") (out "nested") (counts "compiled")))))
      (define joined "SELECT l.id FROM catalog_private_left l JOIN catalog_private_right r ON r.id=l.id ORDER BY l.id")
      (run joined) (define join_result (run joined))
      (define nested "SELECT l.id,(SELECT COUNT(*) FROM catalog_private_right r WHERE r.id=l.id) AS n FROM catalog_private_left l ORDER BY l.id")
      (run nested) (define nested_result (run nested))
      (define private (and (nil? (table "memcp-tests" false "catalog_private_left" false nil))
        (nil? (table "memcp-tests" false "catalog_private_right" false nil))))
      (tx_rollback s)
      (list join_result nested_result private))
  expect: {result: [[2,3,0,1],[2,3,2,2],true]}
