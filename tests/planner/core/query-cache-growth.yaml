metadata:
  version: "1.0"
  description: "Cached scan access plans invalidate on data growth"
  isolated: true
setup:
  - sql: "DROP TABLE IF EXISTS cg_rows"
  - sql: "CREATE TABLE cg_rows (id INT PRIMARY KEY, label TEXT)"
  - sql: "INSERT INTO cg_rows VALUES (1, 'needle-a'), (2, 'needle-b'), (3, 'other-a'), (4, 'other-b')"
  - scm: "(rebuild (table \"memcp-tests\" \"cg_rows\") true false)"
test_cases:
  - name: "Same cached LIKE plan recompiles after cardinality growth"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define results (newsession))
        (results "count" 0)
        (results "sum" 0)
        (define resultrow (lambda (row) (begin
          (results "count" (+ (results "count") 1))
          (results "sum" (+ (results "sum") (cadr row))))))
        (define query "SELECT id FROM cg_rows WHERE label LIKE '%needle%' ORDER BY id LIMIT 4")
        (define first_formula (cached_parse cache (list parse_sql) "memcp-tests" query nil "root" sess true))
        (sql_execute_formula sess nil first_formula resultrow (lambda (_fields) nil))
        (define entry (car (cache (car (cache)))))
        (define first_variants (count (entry "variants")))
        (define first_guard (car (car (entry "variants"))))
        (insert (table "memcp-tests" "cg_rows") '("id" "label")
          (map (produceN 4096) (lambda (i) (list (+ i 10) (concat "other-" i)))))
        (rebuild (table "memcp-tests" "cg_rows") true false)
        (define guard_after_growth
          ((sql_queryplan_compile_formula first_guard)
            sess nil (lambda (_row) nil) (lambda (_fields) nil)))
        (define second_formula (cached_parse cache (list parse_sql) "memcp-tests" query nil "root" sess true))
        (sql_execute_formula sess nil second_formula resultrow (lambda (_fields) nil))
        (if (and (equal? first_variants 1) (not guard_after_growth)
          (equal? (count (entry "variants")) 2)
          (equal? (results "count") 4) (equal? (results "sum") 6))
          "ok"
          (error (concat "cached growth mismatch: guard=" guard_after_growth
            " variants=" (count (entry "variants"))
            " count=" (results "count") " sum=" (results "sum")))))
    expect:
      data: ["ok"]
cleanup:
  - sql: "DROP TABLE IF EXISTS cg_rows"
