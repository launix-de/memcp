metadata:
  version: "1.0"
  description: "Cached scan access plans invalidate on data growth"
  isolated: true
setup:
  - sql: "DROP TABLE IF EXISTS cg_rows"
  - sql: "CREATE TABLE cg_rows (id INT PRIMARY KEY, label TEXT)"
  - sql: "INSERT INTO cg_rows VALUES (1, 'needle-a'), (2, 'needle-b'), (3, 'other-a'), (4, 'other-b')"
  - scm: "(rebuild (table \"memcp-tests\" \"cg_rows\") true false)"
test_cases:
  - name: "Literal parameterizer compiles natively"
    # The token-walk implementation is being replaced by a (parser)-combinator
    # rewrite (worktree preparser-parser-kleene) that JIT-compiles; this stays
    # a visible, tracked failure rather than a silently accepted one until
    # that lands. The interpreter fallback is functionally correct and the
    # hot-path cost is still small (~100us/parse) -- this only asserts the
    # aspirational JIT property, not correctness.
    noncritical: true
    scm: |
      (if (equal? (jit? (jit parameterize_sql_select_literals)) (jit-enabled?))
        true (error "literal parameterizer fell back to the interpreter"))
  - name: "Same cached LIKE plan recompiles after cardinality growth"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define results (newsession))
        (results "count" 0)
        (results "sum" 0)
        (define resultrow (lambda (row) (begin
          (results "count" (+ (results "count") 1))
          (results "sum" (+ (results "sum") (cadr row))))))
        (define query "SELECT id FROM cg_rows WHERE label LIKE '%needle%' ORDER BY id LIMIT 4")
        (define first_formula (cached_parse cache (list parse_sql) "memcp-tests" query nil "root" sess true))
        (sql_execute_formula sess nil first_formula resultrow (lambda (_fields) nil))
        (define entry (car (cache (car (cache)))))
        (define first_variants (count (entry "variants")))
        (define first_guard (car (car (entry "variants"))))
        (insert (table "memcp-tests" "cg_rows") '("id" "label")
          (map (produceN 4096) (lambda (i) (list (+ i 10) (concat "other-" i)))))
        (rebuild (table "memcp-tests" "cg_rows") true false)
        (define guard_after_growth
          ((sql_queryplan_compile_formula first_guard)
            sess nil (lambda (_row) nil) (lambda (_fields) nil)))
        (define second_formula (cached_parse cache (list parse_sql) "memcp-tests" query nil "root" sess true))
        (sql_execute_formula sess nil second_formula resultrow (lambda (_fields) nil))
        (if (and (equal? first_variants 1) (not guard_after_growth)
          (equal? (count (entry "variants")) 2)
          (equal? (results "count") 4) (equal? (results "sum") 6))
          "ok"
          (error (concat "cached growth mismatch: guard=" guard_after_growth
            " variants=" (count (entry "variants"))
            " count=" (results "count") " sum=" (results "sum")))))
    expect:
      data: ["ok"]
  - name: "Exact aggregate cache entries retain their literal identity"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define counts (newsession))
        (counts "sum" 0)
        (map '(2 4 2 4) (lambda (minimum)
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests"
              (concat "SELECT COUNT(*) AS n FROM cg_rows WHERE id < 10 AND id >= " minimum) nil "root" sess true)
            (lambda (row) (counts "sum" (+ (counts "sum") (cadr row))))
            (lambda (_fields) nil))))
        (if (and (equal? (counts "sum") 8) (equal? (count (cache)) 2))
          "ok" (error "exact aggregate literals shared the wrong plan")))
    expect:
      data: ["ok"]

  - name: "Literal parameterization preserves conditions and bounds"
    scm: |
      (match (parameterize_sql_select_literals "SELECT id FROM items WHERE id >= 12 AND label = 'open' ORDER BY id LIMIT 5 OFFSET 2") '(normalized bindings shape_hash)
        (if (and (equal? normalized "SELECT id FROM items WHERE id >= ? AND label = ? ORDER BY id LIMIT ? OFFSET ?")
          (equal? bindings (list 12 "open" 5 2)) (equal? shape_hash (fnv_hash normalized)))
          "ok" (error (concat "parameterization mismatch: " normalized " / " bindings))))
    expect:
      data: ["ok"]
  - name: "Uncached lexical parameterization batch"
    warmup: 3
    timing_samples: 7
    threshold_ms: 100
    scm: |
      (reduce (produceN 100) (lambda (_ idx)
        (match (parameterize_sql_select_literals
          "SELECT id FROM items WHERE id >= 12 AND label = 'open' ORDER BY id LIMIT 5 OFFSET 2")
          '(normalized bindings shape_hash)
          (if (and
            (equal? normalized "SELECT id FROM items WHERE id >= ? AND label = ? ORDER BY id LIMIT ? OFFSET ?")
            (equal? bindings (list 12 "open" 5 2))
            (equal? shape_hash (fnv_hash normalized)))
            "ok" (error "parameterization batch changed the query")))) nil)
    expect:
      data: ["ok"]
  - name: "Literal parameterization preserves comments and identifiers"
    scm: |
      (match (parameterize_sql_select_literals "SELECT `value2` FROM `items7` /* 99 ? */ WHERE note = 'line\\nvalue' -- 42\nLIMIT 3") '(normalized bindings shape_hash)
        (if (and (equal? normalized "SELECT `value2` FROM `items7` /* 99 ? */ WHERE note = ? -- 42\nLIMIT ?")
          (equal? bindings (list "line\nvalue" 3)) (equal? shape_hash (fnv_hash normalized)))
          "ok" (error (concat "parameterization mismatch: " normalized " / " bindings))))
    expect:
      data: ["ok"]
  - name: "Literal parameterization preserves ordinal and cast width"
    scm: |
      (match (parameterize_sql_select_literals "SELECT CAST(score AS DECIMAL(10,2)) AS 'amount' FROM items WHERE score > 4 ORDER BY 1 LIMIT 6") '(normalized bindings shape_hash)
        (if (and (equal? normalized "SELECT CAST(score AS DECIMAL(10,2)) AS 'amount' FROM items WHERE score > ? ORDER BY 1 LIMIT ?")
          (equal? bindings (list 4 6)) (equal? shape_hash (fnv_hash normalized)))
          "ok" (error (concat "parameterization mismatch: " normalized " / " bindings))))
    expect:
      data: ["ok"]
  - name: "Literal parameterization preserves escaped string"
    scm: |
      (match (parameterize_sql_select_literals "SELECT id FROM items WHERE note = 'it\\'s\\\\ok'") '(normalized bindings shape_hash)
        (if (and (equal? normalized "SELECT id FROM items WHERE note = ?")
          (equal? bindings (list "it's\\ok")) (equal? shape_hash (fnv_hash normalized)))
          "ok" (error (concat "parameterization mismatch: " normalized " / " bindings))))
    expect:
      data: ["ok"]
  - name: "Literal parameterization preserves projection and negative literal"
    scm: |
      (match (parameterize_sql_select_literals "SELECT 1, 'fixed' AS label, score - 2 AS adjusted FROM items WHERE score >= -4") '(normalized bindings shape_hash)
        (if (and (equal? normalized "SELECT 1, 'fixed' AS label, score - 2 AS adjusted FROM items WHERE score >= ?")
          (equal? bindings (list -4)) (equal? shape_hash (fnv_hash normalized)))
          "ok" (error (concat "parameterization mismatch: " normalized " / " bindings))))
    expect:
      data: ["ok"]
  - name: "Unsafe or incomplete literal shapes retain exact cache keys"
    scm: |
      (begin
        (map (list "UPDATE items SET score = 2 WHERE id = 1" "SELECT id FROM items WHERE id = ?" "SELECT id FROM items WHERE created_at >= DATE '2026-01-01'" "SELECT category, COUNT(*) FROM items WHERE state = 'open' GROUP BY category" "SELECT COUNT(*) FROM items WHERE state = 'open'" "SELECT DISTINCT state FROM items WHERE score >= 2" "SELECT id FROM items WHERE id = 1 UNION SELECT id FROM items WHERE id = 2" "EXPLAIN COMPILE SELECT id FROM items WHERE id = 1" "SELECT id FROM items WHERE label = 'unterminated" "SELECT id FROM items WHERE id = 1 /* unterminated") (lambda (query)
          (match (parameterize_sql_select_literals query) '(normalized bindings shape_hash)
            (if (and (equal? normalized query) (equal? bindings '()) (equal? shape_hash (fnv_hash query)))
              true (error (concat "unsafe parameterization: " query))))))
        "ok")
    expect:
      data: ["ok"]
  - name: "Constant projection row folds to shared placeholders"
    scm: |
      (match (parameterize_sql_select_literals "SELECT h.i FROM (SELECT 0 AS i, 1704067200 AS s, 1789037871 AS e UNION SELECT 1 AS i, 1672531200 AS s, 1704067199 AS e) h") '(normalized bindings shape_hash)
        (if (and (equal? normalized "SELECT h.i FROM (SELECT ? AS i, ? AS s, ? AS e UNION SELECT ? AS i, ? AS s, ? AS e) h")
          (equal? bindings (list 0 1704067200 1789037871 1 1672531200 1704067199))
          (equal? shape_hash (fnv_hash normalized)))
          "ok" (error (concat "const-row mismatch: " normalized " / " bindings))))
    expect:
      data: ["ok"]
  - name: "Constant projection row shape is now()-invariant"
    scm: |
      (if (equal?
        (nth (parameterize_sql_select_literals "SELECT 0 AS i, 1704067200 AS s, 1789037871 AS e FROM dual") 2)
        (nth (parameterize_sql_select_literals "SELECT 0 AS i, 1704067200 AS s, 1789099999 AS e FROM dual") 2))
        "ok" (error "const-row shape hash still varies with the literal"))
    expect:
      data: ["ok"]
  - name: "Mixed projection keeps a lone carrier literal exact"
    scm: |
      (begin
        (map (list
          "SELECT d.id, 1 AS _count FROM items d WHERE d.label LIKE '%x%'"
          "SELECT 1 AS marker, id FROM items WHERE id = 3"
          "SELECT count(*), 5 AS n FROM items") (lambda (query)
          (match (parameterize_sql_select_literals query) '(normalized bindings shape_hash)
            (if (match normalized (regex "(?s)^SELECT (?:count\\(\\*\\)|d\\.id, 1 AS _count|1 AS marker, id)" _) true false)
              true (error (concat "carrier literal was folded: " normalized))))))
        "ok")
    expect:
      data: ["ok"]
cleanup:
  - sql: "DROP TABLE IF EXISTS cg_rows"
