metadata:
  version: "1.0"
  description: "SQL column name binding, nested scopes, and derived aliases"

setup:
  - sql: "DROP TABLE IF EXISTS nr_leaf"
  - sql: "DROP TABLE IF EXISTS nr_other"
  - sql: "DROP TABLE IF EXISTS nr_inner"
  - sql: "DROP TABLE IF EXISTS nr_outer"
  - sql: "DROP TABLE IF EXISTS nr_alias_conflict"
  - sql: "DROP TABLE IF EXISTS nr_line"
  - sql: "CREATE TABLE nr_outer (ID INT PRIMARY KEY, outer_only INT, shared INT, file_id INT)"
  - sql: "CREATE TABLE nr_inner (ID INT PRIMARY KEY, inner_only INT, shared INT, label VARCHAR(20))"
  - sql: "CREATE TABLE nr_other (ID INT PRIMARY KEY, shared INT)"
  - sql: "CREATE TABLE nr_leaf (leaf_id INT PRIMARY KEY)"
  - sql: "CREATE TABLE nr_alias_conflict (ID INT PRIMARY KEY, computed INT)"
  - sql: "CREATE TABLE nr_line (ID INT PRIMARY KEY, o INT, item_code VARCHAR(20))"
  - sql: "INSERT INTO nr_outer VALUES (1, 101, 1001, 10), (2, 102, 1002, 20)"
  - sql: "INSERT INTO nr_inner VALUES (10, 201, 2001, 'ten'), (20, 202, 2002, 'twenty')"
  - sql: "INSERT INTO nr_other VALUES (30, 3001)"
  - sql: "INSERT INTO nr_leaf VALUES (1)"
  - sql: "INSERT INTO nr_alias_conflict VALUES (1, 2), (2, 1)"
  - sql: "INSERT INTO nr_line VALUES (1, 1, 'A'), (2, 1, 'A'), (3, 1, 'B'), (4, 2, 'C')"

cleanup:
  - sql: "DROP TABLE IF EXISTS nr_line"
  - sql: "DROP TABLE IF EXISTS nr_alias_conflict"
  - sql: "DROP TABLE IF EXISTS nr_leaf"
  - sql: "DROP TABLE IF EXISTS nr_other"
  - sql: "DROP TABLE IF EXISTS nr_inner"
  - sql: "DROP TABLE IF EXISTS nr_outer"

test_cases:
  - name: "Column identifiers remain case-insensitive when quoted"
    sql: "SELECT `id` FROM nr_outer ORDER BY `Id`"
    expect:
      rows: 2
      data:
        - {id: 1}
        - {id: 2}

  - name: "Derived output column identifiers are case-insensitive"
    sql: |
      SELECT d.foo
      FROM (SELECT ID AS `Foo` FROM nr_outer) d
      ORDER BY d.fOO
    expect:
      rows: 2
      data:
        - {foo: 1}
        - {foo: 2}

  - name: "An unquoted relation qualifier is case-insensitive"
    sql: "SELECT AliasName.ID FROM nr_outer aliasname ORDER BY AliasName.ID"
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "A quoted relation qualifier is case-sensitive"
    sql: "SELECT `aliasname`.ID FROM nr_outer `AliasName`"
    expect:
      error: true

  - name: "Quoted case-distinct relation aliases remain distinguishable"
    sql: |
      SELECT `a`.ID AS outer_id, `A`.ID AS inner_id
      FROM nr_outer `a`
      JOIN nr_inner `A` ON `A`.ID = `a`.file_id
      ORDER BY `a`.ID
    expect:
      rows: 2
      data:
        - {outer_id: 1, inner_id: 10}
        - {outer_id: 2, inner_id: 20}

  - name: "An unquoted case-folded qualifier rejects case-distinct ambiguity"
    sql: "SELECT a.ID FROM nr_outer `a` JOIN nr_inner `A` ON `A`.ID = `a`.file_id"
    expect:
      error: true

  - name: "Derived column alias lists bind the exported names"
    sql: |
      SELECT d.renamed
      FROM (SELECT ID FROM nr_outer) d(renamed)
      ORDER BY d.renamed
    expect:
      rows: 2
      data:
        - {renamed: 1}
        - {renamed: 2}

  - name: "Unqualified subquery column prefers the local relation"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      WHERE EXISTS (SELECT 1 FROM nr_inner i WHERE ID = 10)
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "Unqualified subquery column falls back to the outer relation"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      WHERE EXISTS (SELECT 1 FROM nr_inner i WHERE outer_only = 101)
      ORDER BY o.ID
    expect:
      rows: 1
      data:
        - {ID: 1}

  - name: "A local alias shadows an equal outer alias"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      WHERE EXISTS (SELECT 1 FROM nr_inner o WHERE o.ID = 10)
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "Distinct scalar aggregate retains correlation when inner column matches outer alias"
    sql: |
      SELECT o.ID AS ID,
        /* item_codes */ (
          SELECT GROUP_CONCAT(DISTINCT item_code SEPARATOR ', ')
          FROM nr_line
          WHERE o AND o = o.ID
        ) AS item_codes
      FROM nr_outer o
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1, item_codes: "A, B"}
        - {ID: 2, item_codes: "C"}

  - name: "A user alias cannot collide with a generated lexical alias"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      JOIN nr_leaf `__binding:query/where:0/exists:0/source:0:o` ON TRUE
      WHERE EXISTS (SELECT 1 FROM nr_inner o WHERE o.ID = 10)
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "A deeply nested unqualified name prefers the nearest outer scope"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      WHERE EXISTS (
        SELECT 1
        FROM nr_inner i
        WHERE i.ID = 10
          AND EXISTS (SELECT 1 FROM nr_leaf l WHERE shared = 2001)
      )
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "An unqualified local column is not ambiguous with an outer column"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      WHERE EXISTS (
        SELECT 1
        FROM nr_inner i
        WHERE shared = 2001
      )
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "Derived flattening cannot capture an inner IN column"
    sql: |
      SELECT t.ID
      FROM (SELECT ID, file_id FROM nr_outer) t
      WHERE t.file_id IN (
        SELECT ID FROM nr_inner WHERE label LIKE '%ten%'
      )
      ORDER BY t.ID
    expect:
      rows: 1
      data:
        - {ID: 1}

  - name: "Explicit correlation through a derived alias survives flattening"
    sql: |
      SELECT t.ID
      FROM (SELECT ID, file_id FROM nr_outer) t
      WHERE EXISTS (
        SELECT 1 FROM nr_inner i WHERE i.ID = t.file_id
      )
      ORDER BY t.ID
    expect:
      rows: 2
      data:
        - {ID: 1}
        - {ID: 2}

  - name: "Every UNION branch binds its own unqualified membership column"
    sql: |
      SELECT t.ID
      FROM (SELECT ID, file_id FROM nr_outer) t
      WHERE t.file_id IN (
        SELECT ID FROM nr_inner WHERE label LIKE '%missing%'
        UNION
        SELECT ID FROM nr_inner WHERE label LIKE '%twenty%'
      )
      ORDER BY t.ID
    expect:
      rows: 1
      data:
        - {ID: 2}

  - name: "GROUP BY and ORDER BY can bind an output alias"
    sql: |
      SELECT ID + 10 AS computed, COUNT(*) AS matches
      FROM nr_outer
      GROUP BY computed
      ORDER BY computed
    expect:
      rows: 2
      data:
        - {computed: 11, matches: 1}
        - {computed: 12, matches: 1}

  - name: "HAVING can bind an output alias"
    sql: |
      SELECT ID + 10 AS computed
      FROM nr_outer
      GROUP BY ID
      HAVING computed = 11
    expect:
      rows: 1
      data:
        - {computed: 11}

  - name: "GROUP BY prefers an input column over a colliding output alias"
    sql: |
      SELECT COUNT(*) AS shared
      FROM nr_inner
      GROUP BY shared
      ORDER BY shared
    expect:
      rows: 2
      data:
        - {shared: 1}
        - {shared: 1}

  - name: "HAVING prefers a colliding output alias over the input column"
    sql: |
      SELECT shared - 1000 AS shared
      FROM nr_outer
      GROUP BY ID, shared
      HAVING shared < 2
      ORDER BY shared
    expect:
      rows: 1
      data:
        - {shared: 1}

  - name: "ORDER BY prefers a colliding output alias over the input column"
    sql: |
      SELECT -shared AS shared
      FROM nr_outer
      ORDER BY shared
    expect:
      rows: 2
      data:
        - {shared: -1002}
        - {shared: -1001}

  - name: "ORDER BY resolves the review alias conflict to the output"
    sql: |
      SELECT ID AS computed
      FROM nr_alias_conflict
      ORDER BY computed
    expect:
      rows: 2
      data:
        - {computed: 1}
        - {computed: 2}

  - name: "UNION ORDER BY binds the union output alias"
    sql: |
      SELECT ID AS result_id FROM nr_outer
      UNION ALL
      SELECT ID AS result_id FROM nr_other
      ORDER BY result_id
    expect:
      rows: 3
      data:
        - {result_id: 1}
        - {result_id: 2}
        - {result_id: 30}

  - name: "UNION ORDER BY accepts an output position"
    sql: |
      SELECT ID AS result_id FROM nr_outer
      UNION ALL
      SELECT ID AS result_id FROM nr_other
      ORDER BY 1 DESC
    expect:
      rows: 3
      data:
        - {result_id: 30}
        - {result_id: 2}
        - {result_id: 1}

  - name: "UNION ORDER BY rejects a branch relation qualifier"
    sql: |
      SELECT o.ID AS result_id FROM nr_outer o
      UNION ALL
      SELECT x.ID AS result_id FROM nr_other x
      ORDER BY o.ID
    expect:
      error: true

  - name: "UNION ORDER BY rejects an unknown output name"
    sql: |
      SELECT ID AS result_id FROM nr_outer
      UNION ALL
      SELECT ID AS result_id FROM nr_other
      ORDER BY missing
    expect:
      error: true

  - name: "WHERE cannot bind an output alias"
    sql: "SELECT ID + 10 AS computed FROM nr_outer WHERE computed = 11"
    expect:
      error: true

  - name: "A derived relation hides non-projected base columns"
    sql: "SELECT d.outer_only FROM (SELECT ID FROM nr_outer) d"
    expect:
      error: true

  - name: "An ambiguous local column fails instead of selecting a driver"
    sql: "SELECT ID FROM nr_inner i JOIN nr_other x ON TRUE"
    expect:
      error: true

  - name: "Duplicate aliases in one query block are rejected"
    sql: "SELECT x.ID FROM nr_outer x JOIN nr_inner x ON TRUE"
    expect:
      error: true

  - name: "A derived FROM relation cannot capture its sibling"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      JOIN (SELECT outer_only) d ON TRUE
    expect:
      error: true

  - name: "Parallel sibling scalar scopes keep their repeated local alias"
    parallel: cold_scope_binding
    sql: |
      SELECT wrapped.*
      FROM (
        SELECT o.ID,
          COALESCE((
            SELECT probe.ID = o.file_id
            FROM nr_inner probe
            WHERE probe.ID = o.file_id
            LIMIT 1
          ), FALSE) AS first_match,
          COALESCE((
            SELECT probe.ID = o.file_id
            FROM nr_inner probe
            WHERE probe.ID = o.file_id
            LIMIT 1
          ), FALSE) AS second_match
        FROM nr_outer o
      ) wrapped
      ORDER BY wrapped.ID
    expect:
      rows: 2
      data:
        - {ID: 1, first_match: true, second_match: true}
        - {ID: 2, first_match: true, second_match: true}

  - name: "Correlated scalar values bind equality representatives locally"
    parallel: cold_scope_binding
    sql: |
      SELECT o.ID,
        (
          SELECT probe.ID = o.file_id
          FROM nr_inner probe
          WHERE probe.ID = o.file_id
        ) AS exact_match,
        (
          SELECT SUM(CASE WHEN probe.ID = o.file_id THEN 1 ELSE 0 END)
          FROM nr_inner probe
          WHERE probe.ID = o.file_id
        ) AS matching_rows
      FROM nr_outer o
      ORDER BY o.ID
    expect:
      rows: 2
      data:
        - {ID: 1, exact_match: true, matching_rows: 1}
        - {ID: 2, exact_match: true, matching_rows: 1}

  - name: "Parallel quoted numeric alias remains local in a lazy branch"
    parallel: cold_scope_binding
    sql: |
      SELECT wrapped.*
      FROM (
        SELECT o.ID,
          CASE WHEN TRUE THEN TRUE ELSE NOT ((
            SELECT `26local`.ID = o.file_id
            FROM nr_inner `26local`
            WHERE `26local`.ID = o.file_id
            LIMIT 1
          )) END AS allowed
        FROM nr_outer o
      ) wrapped
      ORDER BY wrapped.ID
    expect:
      rows: 2
      data:
        - {ID: 1, allowed: true}
        - {ID: 2, allowed: true}

  - name: "Parallel unqualified ID remains a column beside nested probes"
    parallel: cold_scope_binding
    sql: |
      SELECT CONCAT('row-', o.ID) AS description,
        COALESCE((
          SELECT probe.label
          FROM nr_inner probe
          WHERE probe.ID = o.file_id
          LIMIT 1
        ), '') AS label
      FROM nr_outer o
      WHERE ID = 1
    expect:
      rows: 1
      data:
        - {description: "row-1", label: "ten"}

  - name: "Parallel nested EXISTS keeps table names separate from aliases"
    parallel: cold_scope_binding
    sql: |
      SELECT wrapped.*
      FROM (
        SELECT o.ID, EXISTS (
          SELECT TRUE
          FROM nr_inner member_row
          WHERE member_row.ID = o.file_id
            AND EXISTS (
              SELECT TRUE
              FROM nr_leaf marker
              WHERE marker.leaf_id = o.ID
              LIMIT 1
            )
          LIMIT 1
        ) AS visible
        FROM nr_outer o
      ) wrapped
      ORDER BY wrapped.ID
    expect:
      rows: 2
      data:
        - {ID: 1, visible: true}
        - {ID: 2, visible: false}

  - name: "JOIN ON cannot reference a later source"
    sql: |
      SELECT o.ID
      FROM nr_outer o
      JOIN nr_inner i ON x.ID = i.ID
      JOIN nr_other x ON TRUE
    expect:
      error: true

cleanup:
  - sql: "DROP TABLE IF EXISTS nr_alias_conflict"
  - sql: "DROP TABLE IF EXISTS nr_leaf"
  - sql: "DROP TABLE IF EXISTS nr_other"
  - sql: "DROP TABLE IF EXISTS nr_inner"
  - sql: "DROP TABLE IF EXISTS nr_outer"
