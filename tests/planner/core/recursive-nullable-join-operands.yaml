metadata:
  syntax: tsql
  requires_tds: true
  description: Recursive nullable operands retain complete tuples and lexical ON scopes
setup:
- sql: CREATE TABLE recursive_root(id INT PRIMARY KEY,parent_id INT)
- sql: CREATE TABLE recursive_head(id INT,parent_id INT,unit INT)
- sql: CREATE TABLE recursive_detail(id INT,unit INT)
- sql: CREATE TABLE recursive_child(id INT,unit INT)
- sql: CREATE TABLE recursive_extra(id INT,unit INT,label NVARCHAR(12))
- sql: INSERT recursive_root VALUES(1,10),(2,20),(3,30),(4,40)
- sql: INSERT recursive_head VALUES(10,100,7),(20,200,8),(40,NULL,NULL)
- sql: INSERT recursive_detail VALUES(50,7),(51,7),(NULL,NULL)
- sql: INSERT recursive_child VALUES(100,9),(200,10),(NULL,11)
- sql: INSERT recursive_extra VALUES(60,9,N'sixty'),(61,9,N'sixty-one'),(NULL,10,N'actual-null'),(62,NULL,N'other')
cleanup:
- sql: DROP VIEW IF EXISTS dbo.recursive_join_view
- sql: DROP TABLE IF EXISTS recursive_extra
- sql: DROP TABLE IF EXISTS recursive_child
- sql: DROP TABLE IF EXISTS recursive_detail
- sql: DROP TABLE IF EXISTS recursive_head
- sql: DROP TABLE IF EXISTS recursive_root
test_cases:
- name: Independent nullable children preserve complete recursive tuple multiplicity
  sql: |
    SELECT a.id AS aid,b.id AS bid,d.id AS did,c.id AS cid,e.id AS eid,e.label
    FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
    ORDER BY a.id,d.id,c.id,e.id
  expect:
    rows: 7
    data: [{aid: 1,bid: 10,did: 50,cid: 100,eid: 60,label: sixty},
      {aid: 1,bid: 10,did: 50,cid: 100,eid: 61,label: sixty-one},
      {aid: 1,bid: 10,did: 51,cid: 100,eid: 60,label: sixty},
      {aid: 1,bid: 10,did: 51,cid: 100,eid: 61,label: sixty-one},
      {aid: 2,bid: 20,did: null,cid: 200,eid: null,label: actual-null},
      {aid: 3,bid: null,did: null,cid: null,eid: null,label: null},
      {aid: 4,bid: 40,did: null,cid: null,eid: null,label: null}]
- name: A nested enclosing ON may depend on the complete child operand
  sql: |
    SELECT a.id AS aid,b.id AS bid,d.id AS did,c.id AS cid,e.id AS eid
    FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id AND e.id=61 ON a.parent_id=b.id
    ORDER BY a.id,d.id
  expect:
    rows: 5
    data: [{aid: 1,bid: 10,did: 50,cid: 100,eid: 61},{aid: 1,bid: 10,did: 51,cid: 100,eid: 61},
      {aid: 2,bid: 20,did: null,cid: null,eid: null},{aid: 3,bid: null,did: null,cid: null,eid: null},
      {aid: 4,bid: 40,did: null,cid: null,eid: null}]
- name: The outermost ON may inspect a deeply nested child before extending the whole tuple
  sql: |
    SELECT a.id AS aid,b.id AS bid,e.id AS eid
    FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id AND e.id=61
    ORDER BY a.id,d.id
  expect: {rows: 5,data: [{aid: 1,bid: 10,eid: 61},{aid: 1,bid: 10,eid: 61},
      {aid: 2,bid: null,eid: null},{aid: 3,bid: null,eid: null},{aid: 4,bid: null,eid: null}]}
- name: A nested enclosing ON can see the earlier nullable sibling
  sql: |
    SELECT d.id AS did,e.id AS eid FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id AND d.id=50 ON a.parent_id=b.id
    WHERE a.id=1 ORDER BY d.id,e.id
  expect: {rows: 3,data: [{did: 50,eid: 60},{did: 50,eid: 61},{did: 51,eid: null}]}
- name: Outer selection cannot manufacture an unmatched recursive tuple
  sql: |
    SELECT a.id FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
    WHERE a.id=1 AND e.id IS NULL
  expect: {rows: 0}
- name: A null-accepting local ON never scans children for a synthetic entire operand
  sql: |
    SELECT a.id AS aid,b.id AS bid,d.id AS did,c.id AS cid,e.id AS eid
    FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit OR b.unit IS NULL
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit OR c.unit IS NULL
        ON b.parent_id=c.id ON a.parent_id=b.id
    WHERE a.id=3
  expect: {rows: 1,data: [{aid: 3,bid: null,did: null,cid: null,eid: null}]}
- name: Real nullable child keys retain all null-accepting matches
  sql: |
    SELECT b.id AS bid,c.id AS cid,e.id AS eid,e.label FROM recursive_root a
    LEFT JOIN recursive_head b LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id OR b.parent_id IS NULL ON a.parent_id=b.id
    WHERE a.id=4 ORDER BY c.id,e.id
  expect: {rows: 4,data: [{bid: 40,cid: null,eid: null,label: null},
      {bid: 40,cid: 100,eid: 60,label: sixty},{bid: 40,cid: 100,eid: 61,label: sixty-one},
      {bid: 40,cid: 200,eid: null,label: actual-null}]}
- name: Scalar reducers preserve recursive counts and actual null-valued keys
  sql: |
    SELECT COUNT(*) AS total,COUNT(b.id) AS heads,COUNT(d.id) AS details,
      COUNT(c.id) AS children,COUNT(e.id) AS extras,COUNT(e.unit) AS extra_units
    FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
  expect: {rows: 1,data: [{total: 7,heads: 6,details: 4,children: 5,extras: 4,extra_units: 5}]}
- name: A recursively nested ON cannot see its enclosing sibling
  sql: |
    SELECT a.id FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON d.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
  expect: {error: true,contains: unknown relation alias}
- name: An earlier sibling ON cannot see a later recursive child
  sql: |
    SELECT a.id FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON e.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
  expect: {error: true,contains: unknown relation alias}
- name: A nested local ON cannot see the outermost preserved alias
  sql: |
    SELECT a.id FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON a.parent_id=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
  expect: {error: true,contains: unknown relation alias}
- name: Three nullable operand levels use the same recursive producer contract
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid,e.id AS eid,d.id AS did
    FROM recursive_root a LEFT JOIN recursive_head b LEFT JOIN recursive_child c
      LEFT JOIN recursive_extra e LEFT JOIN recursive_detail d ON e.unit=d.unit
        ON c.unit=e.unit ON b.parent_id=c.id ON a.parent_id=b.id
    ORDER BY a.id,c.id,e.id
  expect: {rows: 5,data: [{aid: 1,bid: 10,cid: 100,eid: 60,did: null},
      {aid: 1,bid: 10,cid: 100,eid: 61,did: null},{aid: 2,bid: 20,cid: 200,eid: null,did: null},
      {aid: 3,bid: null,cid: null,eid: null,did: null},{aid: 4,bid: 40,cid: null,eid: null,did: null}]}
- name: Recursive native output windows count complete rows
  sql: |
    SELECT a.id AS aid,e.id AS eid FROM recursive_root a LEFT JOIN recursive_head b
      LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
    ORDER BY a.id,d.id,e.id OFFSET 3 ROWS FETCH NEXT 2 ROWS ONLY
  expect: {rows: 2,data: [{aid: 1,eid: 61},{aid: 2,eid: null}]}
- name: A stored view preserves recursively recorded lexical join boundaries
  sql: |
    CREATE VIEW dbo.recursive_join_view AS
    SELECT a.id AS aid,b.id AS bid,c.id AS cid,e.label FROM recursive_root a
    LEFT JOIN recursive_head b LEFT JOIN recursive_detail d ON b.unit=d.unit
      LEFT JOIN recursive_child c LEFT JOIN recursive_extra e ON c.unit=e.unit
        ON b.parent_id=c.id ON a.parent_id=b.id
- name: Restored recursive view outputs preserve declared national text and real null keys
  tds:
    statements:
    - sql: SELECT aid,bid,cid,label FROM dbo.recursive_join_view WHERE aid=2
      expect:
        rows: 1
        data: [{aid: 2,bid: 20,cid: 200,label: actual-null}]
        column_types: [{name: aid,type: INT},{name: bid,type: INT},{name: cid,type: INT},
          {name: label,type: NVARCHAR,length: 12}]
