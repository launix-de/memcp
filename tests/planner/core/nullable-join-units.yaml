- name: Volatile FROM-less CROSS projections export one consistent value through mysql
  syntax: mysql
  sql: |
    SELECT CASE WHEN d.payload=d.payload THEN 1 ELSE 0 END AS consistent
    FROM (SELECT RAND() AS payload) d CROSS JOIN (SELECT 1 AS unit) u
  expect: {rows: 1,data: [{consistent: 1}]}
  max_time: 5
- name: Volatile FROM-less CROSS projections export one consistent value through psql
  syntax: psql
  sql: |
    SELECT CASE WHEN d.payload=d.payload THEN 1 ELSE 0 END AS consistent
    FROM (SELECT RANDOM() AS payload) d CROSS JOIN (SELECT 1 AS unit) u
  expect: {rows: 1,data: [{consistent: 1}]}
  max_time: 5
- name: Volatile FROM-less CROSS projections export one consistent value through tsql
  syntax: tsql
  sql: |
    SELECT CASE WHEN d.payload=d.payload THEN 1 ELSE 0 END AS consistent
    FROM (SELECT NEWID() AS payload) d CROSS JOIN (SELECT 1 AS unit) u
  expect: {rows: 1,data: [{consistent: 1}]}
  max_time: 5
