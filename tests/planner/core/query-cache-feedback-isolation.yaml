metadata:
  version: "1.0"
  description: "Unrelated learned predicates must not invalidate cached ordered plans"
  isolated: true
setup:
  - sql: "DROP TABLE IF EXISTS qfi_access"
  - sql: "CREATE TABLE qfi_access (viewer INT, domain_id INT) ENGINE=sloppy"
  - sql: "INSERT INTO qfi_access VALUES (999,NULL),(998,998),(997,999)"
  - scm: '(rebuild (table "memcp-tests" "qfi_access") true false)'
  - sql: "DROP TABLE IF EXISTS qfi_single"
  - sql: "CREATE TABLE qfi_single (id INT PRIMARY KEY) ENGINE=sloppy"
  - sql: "INSERT INTO qfi_single VALUES (999)"
  - scm: '(rebuild (table "memcp-tests" "qfi_single") true false)'
  - sql: "DROP TABLE IF EXISTS qfi_document"
  - sql: "CREATE TABLE qfi_document (id INT PRIMARY KEY, label TEXT) ENGINE=sloppy"
  - scm: |
      (begin
        (insert (table "memcp-tests" "qfi_document") '("id" "label")
          (map (produceN 1000) (lambda (i) (list i (if (< i 10) "needle" "ordinary")))))
        (rebuild (table "memcp-tests" "qfi_document") true false))
test_cases:
  - name: "Observed named bindings guard their compile-time value, including false and NULL"
    scm: |
      (begin
        (define sess (newsession))
        (sess "viewer" 999)
        (sess "enabled" false)
        (define planning (sql_queryplan_compile_session sess nil))
        (define values (list
          (planner_literal_value (quote (session "viewer")) planning)
          (planner_literal_value (quote (session "enabled")) planning)
          (planner_literal_value (quote (session "missing")) planning)))
        (if (not (equal? values (list 999 false nil))) (error "planner read incorrect bindings") nil)
        (define guard (sql_queryplan_compile_formula
          (sql_queryplan_conjoin_guards (sql_queryplan_uncovered_binding_conditions planning))))
        (define original (guard sess nil nil nil))
        (sess "viewer" 998)
        (define changed (guard sess nil nil nil))
        (sess "viewer" 999)
        (sess "missing" 1)
        (define formerly_null (guard sess nil nil nil))
        (sess "missing" nil)
        (sess "enabled" true)
        (define formerly_false (guard sess nil nil nil))
        (if (and original (not changed) (not formerly_null) (not formerly_false)) true
          (error "named binding guard lost the observed value or accepted a changed binding")))
    expect:
      rows: 1
      result_contains: ["true"]
  - name: "Named lookup bindings reuse plans but still change visible rows"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT a.id,b.label FROM qfi_single a LEFT JOIN qfi_document b ON b.id=a.id WHERE b.id=@viewer ORDER BY a.id LIMIT 2")
        (define rows (newsession))
        (define run (lambda (viewer) (begin
          (sess "viewer" viewer)
          (rows "n" 0)
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
            (lambda (row) (rows "n" (+ (rows "n") 1))) (lambda (_fields) nil))
          (rows "n"))))
        (define first (run 999))
        (run 999)
        (define entry (car (cache (car (cache)))))
        (define before (count (entry "variants")))
        (define repeated (run 999))
        (define after (count (entry "variants")))
        (define changed (run 998))
        (define restored (run 999))
        (define missing (run nil))
        (if (and (equal? first 1) (equal? repeated 1) (equal? changed 0)
          (equal? restored 1) (equal? missing 0) (equal? before after)) true
          (error (concat "ACL binding results or plan reuse failed: " first "/" repeated "/"
            changed "/" restored "/" missing " variants " before " -> " after)))))
    expect:
      rows: 1
      result_contains: ["true"]
  - name: "Named ACL count guards accept their own compilation and reuse the variant"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT COUNT(*) AS n FROM qfi_single a LEFT JOIN qfi_document z ON z.id=a.id WHERE COALESCE((SELECT CASE WHEN EXISTS(SELECT 1 FROM qfi_access x WHERE x.viewer=@viewer AND x.domain_id IS NULL LIMIT 1) THEN TRUE ELSE EXISTS(SELECT 1 FROM qfi_access y WHERE y.viewer=@viewer AND y.domain_id=b.id LIMIT 1) END FROM qfi_document b WHERE b.id=a.id LIMIT 1),FALSE)")
        (define rows (newsession))
        (define run (lambda (viewer) (begin
          (sess "viewer" viewer)
          (rows "n" -1)
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
            (lambda (row) (rows "n" (cadr row))) (lambda (_fields) nil))
          (rows "n"))))
        (define first (run 999))
        (run 999)
        (define entry (car (cache (car (cache)))))
        (define before (count (entry "variants")))
        (define repeated (run 999))
        (define after (count (entry "variants")))
        (define changed (run 998))
        (define scoped (run 997))
        (define restored (run 999))
        (if (and (equal? first 1) (equal? repeated 1) (equal? changed 0)
          (equal? scoped 1) (equal? restored 1)
          (equal? before after)) true
          (error (concat "ACL count results or cache reuse failed: " first "/" repeated "/"
            changed "/" scoped "/" restored " variants " before " -> " after)))))
    expect:
      rows: 1
      result_contains: ["true"]
  - name: "Truthy guard literals are not references to statistic bindings"
    scm: |
      (begin
        (define target (symbol "__unused_statistic_binding"))
        (if (and
          (not (sql_queryplan_guard_references_symbol? true target))
          (not (sql_queryplan_guard_references_symbol?
            (list (quote equal?) (list (quote lambda) (list) true) 1) target))
          (sql_queryplan_guard_references_symbol?
            (list (quote equal?) target 1) target)) true
          (error "guard liveness treated a boolean literal as a symbol reference")))
    expect:
      data: [true]
  - name: "Access templates retain runtime binding expressions without evaluating them"
    scm: |
      (begin
        (define access (compile_scan_access '("id")
          (list 'lambda (list 'id) (list '> 'id (list 'session "unbound_guard_value"))) true false))
        (if (and (not (empty_list? (car access)))
          (equal? (cadr access) (list (list 'session "unbound_guard_value"))))
          true (error "access template froze or lost its binding expression")))
    expect:
      data: [true]
  - name: "Runtime range bindings reuse a provably constant singleton cost regime"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT a.id,b.label FROM qfi_single a LEFT JOIN qfi_document b ON b.id=a.id WHERE a.id > @cutoff ORDER BY a.id LIMIT 2")
        (define rows (newsession))
        (define run (lambda (cutoff)
          (begin
            (sess "cutoff" cutoff)
            (rows "n" 0)
            (sql_execute_formula sess nil
              (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
              (lambda (_row) (rows "n" (+ (rows "n") 1)))
              (lambda (_fields) nil))
            (rows "n"))))
        (define first (run 998))
        (define entry (car (cache (car (cache)))))
        (define before (count (entry "variants")))
        (define second (run 999))
        (define third (run 1000))
        (define null_result (run nil))
        (if (and (equal? first 1) (equal? second 0) (equal? third 0)
          (equal? null_result 0)
          (equal? before (count (entry "variants")))) true
          (error (concat "runtime binding must change results without recompiling an unchanged choice: "
            first "/" second "/" third " variants=" before " -> "
            (count (entry "variants")) " guard="
            (serialize (car (car (entry "variants"))))))))
    expect:
      data: [true]
  - name: "A binding shared by a filter and LIMIT still controls execution"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT a.id,b.label FROM qfi_single a LEFT JOIN qfi_document b ON b.id=a.id WHERE a.id > @bound ORDER BY a.id LIMIT @bound")
        (define rows (newsession))
        (define run (lambda (bound)
          (begin
            (sess "bound" bound)
            (rows "n" 0)
            (sql_execute_formula sess nil
              (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
              (lambda (_row) (rows "n" (+ (rows "n") 1))) (lambda (_fields) nil))
            (rows "n"))))
        (if (equal? (list (run 998) (run 0) (run 999)) (list 1 0 0))
          true (error "cost-only guard hid a binding needed by LIMIT")))
    expect:
      data: [true]
  - name: "Unrelated learned LIKE leaves an ordered self-join cache variant reusable"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT a.id FROM qfi_document a LEFT JOIN qfi_document b ON b.id=a.id ORDER BY a.id LIMIT 2")
        (define first (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true))
        (define rows (newsession))
        (rows "n" 0)
        (define emit (lambda (_row) (rows "n" (+ (rows "n") 1))))
        (sql_execute_formula sess nil first emit (lambda (_fields) nil))
        (define entry (car (cache (car (cache)))))
        (define variants (count (entry "variants")))
        (define pred (list 'lambda (list 'x) (list 'strlike 'x "%needle%" "utf8mb4_general_ci")))
        (define access (compile_scan_access '("label") pred))
        (scan_recset nil (table "memcp-tests" "qfi_document") (car access)
          (map (cadr access) (lambda (v) (eval v))) '("label") (eval pred))
        (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
          emit (lambda (_fields) nil))
        (if (and (equal? (rows "n") 4) (equal? (count (entry "variants")) variants))
          true
          (error (concat "unrelated feedback recompiled ordered plan: before=" variants
            " after=" (count (entry "variants")) " rows=" (rows "n")))))
    expect:
      data: [true]
  - name: "Learning the consumed predicate still recompiles and then reuses its plan"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT a.id FROM qfi_document a JOIN qfi_document b ON b.id<=a.id WHERE a.id < 4 ORDER BY a.id LIMIT 2")
        (define rows (newsession))
        (rows "n" 0)
        (define emit (lambda (_row) (rows "n" (+ (rows "n") 1))))
        (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
          emit (lambda (_fields) nil))
        (define entry (car (cache (car (cache)))))
        (define before (count (entry "variants")))
        (define pred (list 'lambda (list 'x) (list '< 'x 4)))
        (define access (compile_scan_access '("id") pred))
        (scan_recset nil (table "memcp-tests" "qfi_document") (car access)
          (map (cadr access) (lambda (v) (eval v))) '("id") (eval pred))
        (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
          emit (lambda (_fields) nil))
        (define after (count (entry "variants")))
        (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
          emit (lambda (_fields) nil))
        (if (and (> after before) (equal? after (count (entry "variants")))
          (equal? (rows "n") 6)) true
          (error (concat "relevant feedback guard failed: " before " -> " after
            " -> " (count (entry "variants")) " rows=" (rows "n")
            " guard=" (serialize (car (car (entry "variants"))))))))
    expect:
      data: [true]
  - name: "An ACL count does not reconsider a dominated singleton partition for every cutoff"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT COUNT(*) AS n FROM qfi_single a WHERE a.id > @cutoff AND COALESCE((SELECT CASE WHEN b.label='ordinary' THEN TRUE ELSE EXISTS(SELECT 1 FROM qfi_document c WHERE c.id=b.id AND c.label='needle') END FROM qfi_document b WHERE b.id=a.id LIMIT 1),FALSE)")
        (define rows (newsession))
        (rows "n" 0)
        (reduce (list 998 999 1000) (lambda (_ cutoff)
          (begin
            (sess "cutoff" cutoff)
            (sql_execute_formula sess nil
              (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
              (lambda (row) (rows "n" (+ (rows "n") (cadr row))))
              (lambda (_fields) nil)))) nil)
        (define entry (car (cache (car (cache)))))
        (if (and (equal? (rows "n") 1) (equal? (count (entry "variants")) 1))
          true (error "singleton ACL count recompiled or changed its result")))
    expect:
      data: [true]
  - name: "Growth invalidates the singleton dominance proof"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (sess "cutoff" -1)
        (define q "SELECT a.id,b.label FROM qfi_single a LEFT JOIN qfi_document b ON b.id=a.id WHERE a.id > @cutoff ORDER BY a.id LIMIT 2")
        (define rows (newsession))
        (define run (lambda ()
          (begin
            (rows "n" 0)
            (sql_execute_formula sess nil
              (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
              (lambda (_row) (rows "n" (+ (rows "n") 1))) (lambda (_fields) nil))
            (rows "n"))))
        (define first (run))
        (define entry (car (cache (car (cache)))))
        (define before (count (entry "variants")))
        (insert (table "memcp-tests" "qfi_single") '("id")
          (map (produceN 256) (lambda (i) (list i))))
        (rebuild (table "memcp-tests" "qfi_single") true false)
        (define second (run))
        (if (and (equal? first 1) (equal? second 2)
          (> (count (entry "variants")) before)) true
          (error "singleton plan survived growth without rechecking its assumptions")))
    expect:
      data: [true]
cleanup:
  - sql: "DROP TABLE IF EXISTS qfi_access"
  - sql: "DROP TABLE IF EXISTS qfi_single"
  - sql: "DROP TABLE IF EXISTS qfi_document"
