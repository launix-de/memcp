# Scalar subquery deduplication (join-merge optimization)
# When two or more scalar subqueries reference the same table with the same
# condition and field, the inner scan should be performed only once per outer row.
# When condition is the same but fields differ, each subquery still scans independently
# (Phase 2 optimization, not yet implemented).

metadata:
  version: "1.0"
  description: "Deduplicate scalar subqueries on the same table with same condition+field"

setup:
  - sql: "DROP TABLE IF EXISTS jd_item"
  - sql: "DROP TABLE IF EXISTS jd_ref"
  - sql: |
      CREATE TABLE jd_item (id INT, ref_id INT)
  - sql: |
      INSERT INTO jd_item (id, ref_id) VALUES (1, 10), (2, 20), (3, 10), (4, NULL)
  - sql: |
      CREATE TABLE jd_ref (id INT, label VARCHAR(40), score INT)
  - sql: |
      INSERT INTO jd_ref (id, label, score) VALUES
        (10, 'Alpha', 100), (20, 'Beta', 200), (30, NULL, 300),
        (40, NULL, 400), (40, 'duplicate', 401)

test_cases:

  # Identical scalar subquery repeated in SELECT list: both should return same value
  - name: "Two identical scalar subqueries return same result"
    sql: |
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c1,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c2
      FROM jd_item
      ORDER BY id
    expect:
      rows: 4
      data:
        - id: 1
          c1: Alpha
          c2: Alpha
        - id: 2
          c1: Beta
          c2: Beta
        - id: 3
          c1: Alpha
          c2: Alpha
        - id: 4
          c1: null
          c2: null

  - name: "EXPLAIN IR deduplicates identical scalar LEFT JOIN helpers"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c1,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c2
      FROM jd_item
      ORDER BY id
    expect:
      contains:
        - "(stage-output"
        - "scalar-single:"
        - "(purpose scalar_single)"
        - "(cardinality_mode single_or_error)"
        - "(physical_max_rows 2)"
        - "(on_overflow error)"
        - "jd_ref"
      not_contains:
        - "dependent-subquery"
        - "_unn_jd_ref_"
        - "scan-tagged-table"
        - "inner_select"

  # Three identical subqueries: all three must match
  - name: "Three identical scalar subqueries all agree"
    sql: |
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c1,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c2,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c3
      FROM jd_item
      WHERE id = 1
    expect:
      rows: 1
      data:
        - id: 1
          c1: Alpha
          c2: Alpha
          c3: Alpha

  # Same table, same condition, different fields: one shared LEFT JOIN can provide both columns.
  - name: "Same table same condition different fields both correct"
    sql: |
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS lbl,
        (SELECT score FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS sc
      FROM jd_item
      ORDER BY id
    expect:
      rows: 4
      data:
        - id: 1
          lbl: Alpha
          sc: 100
        - id: 2
          lbl: Beta
          sc: 200
        - id: 3
          lbl: Alpha
          sc: 100
        - id: 4
          lbl: null
          sc: null

  - name: "EXPLAIN IR reuses one LEFT JOIN helper for different projected fields"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS lbl,
        (SELECT score FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS sc
      FROM jd_item
      ORDER BY id
    expect:
      contains:
        - "(stage-output"
        - "scalar-single:"
        - "(purpose scalar_single)"
        - "(cardinality_mode single_or_error)"
        - "jd_ref"
      not_contains:
        - "dependent-subquery"
        - "_unn_jd_ref_"
        - "scan-tagged-table"
        - "inner_select"

  # Mix of identical + different-field subqueries
  - name: "Mixed identical and different-field subqueries"
    sql: |
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c1,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c2,
        (SELECT score FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS sc
      FROM jd_item
      WHERE id = 2
    expect:
      rows: 1
      data:
        - id: 2
          c1: Beta
          c2: Beta
          sc: 200

  # Non-correlated duplicate subquery (no outer ref): also should deduplicate
  - name: "Non-correlated identical scalar subqueries"
    sql: |
      SELECT id,
        (SELECT COUNT(*) FROM jd_ref) AS total1,
        (SELECT COUNT(*) FROM jd_ref) AS total2
      FROM jd_item
      WHERE id = 1
    expect:
      rows: 1
      data:
        - id: 1
          total1: 5
          total2: 5

  # Error: multiple rows for identical subquery still errors (semantics preserved)
  - name: "Multiple rows still errors even for deduplicated subquery"
    sql: |
      SELECT
        (SELECT id FROM jd_item WHERE jd_item.ref_id = 10) AS c1,
        (SELECT id FROM jd_item WHERE jd_item.ref_id = 10) AS c2
    expect:
      error: true
      contains:
        - "scalar subselect returned more than one row"

  - name: "Scalar cardinality check physically reads at most two rows per key"
    sql: |
      EXPLAIN
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS label
      FROM jd_item
      WHERE jd_item.id = 1
    expect:
      rows: 1
      result_contains:
        - "scan_order"
        - "jd_ref"
        - '\n\t\t\t\t\t0\n\t\t\t\t\t2\n'
      result_not_contains:
        - "scan_order_point"
        - ".grp:jd_ref"

  - name: "Explicit scalar LIMIT 1 physically owns an unordered bounded scan"
    sql: |
      EXPLAIN
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id LIMIT 1) AS label
      FROM jd_item
      WHERE jd_item.id = 1
    expect:
      rows: 1
      result_contains:
        - "scan_order"
        - "jd_ref"
        - "'()"
        - '\n\t\t\t\t\t0\n\t\t\t\t\t0\n\t\t\t\t\t1\n'
      result_not_contains:
        - "scan_order_point"
        - ".grp:jd_ref"

  - name: "Scalar probe distinguishes no row from its internal initializer"
    sql: |
      SELECT (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.id + 998) AS label
      FROM jd_item
      WHERE id = 1
    expect:
      rows: 1
      data:
        - label: null

  - name: "Scalar probe preserves a matching NULL value"
    sql: |
      SELECT (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.id + 29) AS label
      FROM jd_item
      WHERE id = 1
    expect:
      rows: 1
      data:
        - label: null

  - name: "Scalar probe detects a second row after a NULL value"
    sql: |
      SELECT (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.id + 39) AS label
      FROM jd_item
      WHERE id = 1
    expect:
      error: true
      contains:
        - "scalar subselect returned more than one row"

  # NULL outer ref: both identical subqueries return NULL
  - name: "NULL outer ref produces NULL in all identical subqueries"
    sql: |
      SELECT id,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c1,
        (SELECT label FROM jd_ref WHERE jd_ref.id = jd_item.ref_id) AS c2
      FROM jd_item
      WHERE id = 4
    expect:
      rows: 1
      data:
        - id: 4
          c1: null
          c2: null

cleanup:
  - sql: "DROP TABLE IF EXISTS jd_item"
  - sql: "DROP TABLE IF EXISTS jd_ref"
