    expect:
      affected_rows: 4
  - sql: |-
      SELECT t.id,CASE WHEN t.id=1 AND ((t.amount=11 AND t.marker=110)) THEN 1 WHEN t.id=2 AND ((t.amount IS NULL AND t.marker=200)) THEN 1 WHEN t.id=3 AND ((t.amount IS NULL AND t.marker IS NULL)) THEN 1 WHEN t.id=4 AND ((t.amount=-1 AND t.marker=-1)) THEN 1 WHEN t.id=5 AND ((t.amount=50 AND t.marker=500)) THEN 1 ELSE 0 END AS tuple_ok,
        COUNT(a.id) AS audit_rows,
        SUM(CASE WHEN a.id IS NOT NULL
          AND (a.amount=t.amount OR (a.amount IS NULL AND t.amount IS NULL))
          AND (a.marker=t.marker OR (a.marker IS NULL AND t.marker IS NULL))
          THEN 1 ELSE 0 END) AS audit_tuple_ok
      FROM outer_update_target t LEFT JOIN outer_update_audit a ON t.id=a.id
      GROUP BY t.id,t.amount,t.marker ORDER BY t.id
    expect:
      rows: 5
      data:
      - id: 1
        tuple_ok: 1
        audit_rows: 1
        audit_tuple_ok: 1
      - id: 2
        tuple_ok: 1
        audit_rows: 1
        audit_tuple_ok: 1
      - id: 3
