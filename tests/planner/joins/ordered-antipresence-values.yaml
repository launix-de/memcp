test_cases:
- name: Duplicate and partial RHS matches preserve the complete ordered anti output
  sql: 'SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1

    WHERE r.marker IS NULL ORDER BY d.id LIMIT 4

    '
  expect:
    rows: 4
    data:
    - id: 2
      key_a: Alpha
      key_b: 2
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
- name: OFFSET counts accepted complete rows after all ON residuals
  sql: 'SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1

    WHERE r.marker IS NULL ORDER BY d.id LIMIT 2 OFFSET 1

    '
  expect:
    rows: 2
    data:
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
- name: A conjunctive anti marker retains the full OR residual
  sql: 'SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1

    WHERE r.marker IS NULL AND (d.id<=3 OR d.flag=1) ORDER BY d.id LIMIT 4

    '
  expect:
    rows: 3
    data:
    - id: 2
      key_a: Alpha
      key_b: 2
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
- name: An OR in ON retains NULL and complete alternative matches
  sql: 'SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON (d.key_a=r.key_a OR d.key_b=r.key_b) AND r.enabled=1

    WHERE r.marker IS NULL ORDER BY d.id LIMIT 4

    '
  expect:
    rows: 2
    data:
    - id: 3
      key_a: beta
      key_b: 3
    - id: 6
      key_a: delta
      key_b: 6
- name: A nullable marker preserves duplicate matched NULL rows
  sql: 'SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_nullable r ON d.key_a=r.key_a AND d.key_b=r.key_b

    WHERE r.marker IS NULL ORDER BY d.id LIMIT 8

    '
  expect:
    rows: 8
    data:
    - id: 1
      key_a: Alpha
      key_b: 1
    - id: 1
      key_a: Alpha
      key_b: 1
    - id: 2
      key_a: Alpha
      key_b: 2
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
    - id: 7
      key_a: ALPHA
      key_b: 1
    - id: 7
      key_a: ALPHA
      key_b: 1
- name: A marker inside OR preserves matching row multiplicity
  sql: 'SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1

    WHERE r.marker IS NULL OR d.id=1 ORDER BY d.id LIMIT 6

    '
  expect:
    rows: 6
    data:
    - id: 1
      key_a: Alpha
      key_b: 1
    - id: 1
      key_a: Alpha
      key_b: 1
    - id: 2
      key_a: Alpha
      key_b: 2
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
- name: RHS projections retain the actual NULL-extended values
  sql: 'SELECT d.id,r.marker,r.key_a FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1

    WHERE r.marker IS NULL ORDER BY d.id LIMIT 4

    '
  expect:
    rows: 4
    data:
    - id: 2
      marker: null
      key_a: null
    - id: 3
      marker: null
      key_a: null
    - id: 4
      marker: null
      key_a: null
    - id: 6
      marker: null
      key_a: null
- name: PostgreSQL ordered anti presence retains the same complete rows
  syntax: psql
  sql: 'SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1

    WHERE r.marker IS NULL ORDER BY d.id LIMIT 4

    '
  expect:
    rows: 4
    data:
    - id: 2
      key_a: Alpha
      key_b: 2
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
- name: TSQL ordered anti presence retains the same complete rows
  syntax: tsql
  sql: 'SELECT TOP (4) d.id,d.key_a,d.key_b FROM ordered_anti_driver d

    LEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1

    WHERE r.marker IS NULL ORDER BY d.id

    '
  expect:
    rows: 4
    data:
