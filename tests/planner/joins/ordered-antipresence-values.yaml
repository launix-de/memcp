      key_a: Alpha
      key_b: 2
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
- name: Complete case-folded point anti presence stops at an actual duplicate match
  sql: SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d LEFT JOIN ordered_anti_points r ON d.key_a=r.key_a
    WHERE r.marker IS NULL ORDER BY d.id LIMIT 4
  expect:
    rows: 2
    data:
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
- name: Composite text points retain partial matches and actual NULL operands
  sql: SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d LEFT JOIN ordered_anti_points r ON d.key_a=r.key_a
    AND d.key_a=r.key_b WHERE r.marker IS NULL ORDER BY d.id LIMIT 4
  expect:
    rows: 3
    data:
    - id: 3
      key_a: beta
      key_b: 3
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
- name: PostgreSQL point absence evaluates full WHERE on NULL extended lookup fields
  syntax: psql
  sql: SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver d LEFT JOIN ordered_anti_points r ON d.key_a=r.key_a
    WHERE r.marker IS NULL AND COALESCE(r.marker,90)=90 AND (d.id>4 OR d.key_a IS NULL) ORDER BY d.id LIMIT 4
  expect:
    rows: 2
    data:
    - id: 4
      key_a: null
      key_b: 1
    - id: 6
      key_a: delta
      key_b: 6
- name: A recreated nullable declaration retains its duplicate rows under the same explicit plan cache
  scm: "(begin\n  (define cache (newcachemap))\n  (define input (newsession))\n  (input \"username\" \"root\") (input\
    \ \"schema\" \"memcp-tests\")\n  (define run (lambda (query) (begin\n    (define answer (newsession)) (answer\
    \ \"rows\" (list))\n    (sql_execute_formula input nil\n      (cached_parse cache (list parse_sql) \"memcp-tests\"\
    \ query nil \"root\" input true nil)\n      (lambda (row) (answer \"rows\" (append (answer \"rows\") row)))\
    \ (lambda args true))\n    (answer \"rows\"))))\n  (define query \"SELECT d.id,d.key_a,d.key_b FROM ordered_anti_driver\
    \ d\\nLEFT JOIN ordered_anti_lookup r ON d.key_a=r.key_a AND d.key_b=r.key_b AND r.enabled=1\\nWHERE r.marker\
    \ IS NULL ORDER BY d.id LIMIT 4\")\n  (define before (run query))\n  (run \"DROP TABLE IF EXISTS ordered_anti_lookup\"\
    )\n  (run \"CREATE TABLE ordered_anti_lookup(marker INT,key_a VARCHAR(20) COLLATE utf8mb4_general_ci,key_b INT,enabled\
    \ INT)\")\n  (run \"INSERT INTO ordered_anti_lookup VALUES(NULL,'alpha',1,1),(NULL,'ALPHA',1,1),(15,'GAMMA',5,1)\"\
    )\n  (list before (run query)))"
  expect:
    result:
    - - - id
        - 2
        - key_a
        - Alpha
        - key_b
        - 2
      - - id
        - 3
        - key_a
        - beta
        - key_b
        - 3
      - - id
        - 4
        - key_a
        - null
        - key_b
        - 1
      - - id
        - 6
        - key_a
        - delta
        - key_b
        - 6
    - - - id
        - 1
        - key_a
        - Alpha
        - key_b
        - 1
      - - id
        - 1
        - key_a
        - Alpha
        - key_b
        - 1
      - - id
        - 2
        - key_a
        - Alpha
        - key_b
        - 2
      - - id
        - 3
        - key_a
        - beta
        - key_b
        - 3
- name: Original transaction private composite sources retain padded collated anti rows
  syntax: tsql
  sql: 'DROP TABLE IF EXISTS #anti_declared;

    DROP TABLE IF EXISTS #anti_present;

    BEGIN TRANSACTION;

    CREATE TABLE #anti_declared(object_name VARCHAR(100) NOT NULL,permission_name VARCHAR(100) NOT NULL,PRIMARY
    KEY(object_name,permission_name));

    CREATE TABLE #anti_present(object_name VARCHAR(100) NOT NULL,permission_name VARCHAR(100) NOT NULL,PRIMARY KEY(object_name,permission_name));

    INSERT #anti_declared VALUES(''Object_A'',''SELECT''),(''Object_A'',''UPDATE''),(''Object_B'',''SELECT''),(''Object_C'',''SELECT'');

    INSERT #anti_present VALUES(''object_a '',''select ''),(''OBJECT_B'',''SELECT'');

    SELECT TOP (4) d.object_name,d.permission_name FROM #anti_declared d

    LEFT OUTER JOIN #anti_present r ON d.object_name COLLATE Latin1_General_CI_AS=r.object_name

    AND d.permission_name COLLATE Latin1_General_CI_AS=r.permission_name

    WHERE r.object_name IS NULL ORDER BY d.object_name,d.permission_name;

    COMMIT;

    DROP TABLE #anti_present;

    DROP TABLE #anti_declared;

    '
  expect:
    rows: 2
    data:
    - object_name: Object_A
      permission_name: UPDATE
    - object_name: Object_C
      permission_name: SELECT
cleanup:
- sql: DROP TABLE IF EXISTS ordered_anti_points
- sql: DROP TABLE IF EXISTS ordered_anti_nullable
- sql: DROP TABLE IF EXISTS ordered_anti_lookup
- sql: DROP TABLE IF EXISTS ordered_anti_driver
