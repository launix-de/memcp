metadata:
  version: "1.0"
  description: "Learn scalar filter cardinalities and LIKE length buckets from complete scans"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS afs_check"
  - sql: "CREATE TABLE afs_check (id INT PRIMARY KEY, label VARCHAR(64)) ENGINE=sloppy"
  - scm: |
      (begin
        (insert (table "memcp-tests" "afs_check") '("id" "label")
          (map (produceN 1000) (lambda (i)
            (list i (if (< i 900) "common" nil)))))
        (rebuild))
cleanup:
  - sql: "DROP TABLE IF EXISTS afs_check"

test_cases:
  - name: "Unified estimator reads measured feedback without evaluating the predicate again"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define callback (list 'lambda (list 'x) (list '>= 'x 200)))
        (define access (compile_scan_access '("id") callback))
        (define values (map (nth access 1) (lambda (v) (eval v))))
        (scan nil tbl (nth access 0) values '("id") (eval callback) '() scan_count 0 + false)
        (define forbidden (lambda (x) (error "measured selectivity must not rescan")))
        (define measured (scan_selectivity_estimate nil tbl (nth access 0) values '("id") forbidden 512))
        (define metadata (scan_selectivity_estimate nil tbl (nth access 0) values '("id") forbidden 0))
        (if (and (equal? measured metadata)
          (equal? (qassoc_get measured 'source nil) 'scan_feedback)
          (equal? (qassoc_get measured 'value nil) 0.8)
          (equal? (qassoc_get measured 'rows nil) 800)
          (equal? (qassoc_get measured 'sampled nil) 0)) true
          (error "unified estimator failed to reuse measured feedback")))
    expect:
      data: [true]

  - name: "Unified estimator preserves unknown bindings and permits bounded fallback explicitly"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define callback (list 'lambda (list 'x) (list '>= 'x 201)))
        (define access (compile_scan_access '("id") callback))
        (define values (map (nth access 1) (lambda (v) (eval v))))
        (define unknown (scan_selectivity_estimate nil tbl (nth access 0) values '("id")
          (lambda (x) (error "metadata miss must not sample")) 0))
        (define sampled (scan_selectivity_estimate nil tbl (nth access 0) values '("id") (eval callback) 1024))
        (if (and (nil? unknown)
          (equal? (qassoc_get sampled 'rows nil) 799)
          (> (qassoc_get sampled 'sampled 0) 0)) true
          (error "unified estimator mixed bindings or failed its bounded fallback")))
    expect:
      data: [true]

  - name: "Physical source costing consumes the same learned selectivity as reorder"
    scm: |
      (begin
        (define src (list "a" "memcp-tests" "afs_check" false nil))
        (define predicate (list '>= (list 'get_column "a" false "id" false) 200))
        (define reorder (join_optimizer_expr_selectivity_estimate (list src) "a" predicate nil))
        (define physical (planner_source_filter_estimate src predicate 512 nil nil))
        (if (and (equal? (qassoc_get reorder 'source nil) 'scan_feedback)
          (equal? (qassoc_get physical 'source nil) 'scan_feedback)
          (equal? (qassoc_get reorder 'value nil) (qassoc_get physical 'value nil))
          (equal? (qassoc_get physical 'estimated_rows nil) 800)
          (equal? (planner_merge_estimate_coverage
            (list physical (list (list 'coverage 'exact)))) 'feedback)) true
          (error "reorder and physical costing did not consume the same measured rate")))
    expect:
      data: [true]

  - name: "Bound scalar literals share feedback with their unquoted scan predicate"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define callback (list 'lambda (list 'x) (list '>= 'x (list 'quote 200))))
        (define access (compile_scan_access '("id") callback))
        (define estimate (scan_selectivity_estimate nil tbl (car access)
          (map (cadr access) (lambda (v) (eval v))) '()
          (lambda () (error "quoted binding must reuse metadata without sampling")) 0))
        (if (and (equal? (qassoc_get estimate 'source nil) 'scan_feedback)
          (equal? (qassoc_get estimate 'value nil) 0.8)) true
          (error "quoted binding lost the measured predicate identity")))
    expect:
      result_contains: ["true"]

  - name: "Quoted lists must not be interpreted as scalar feedback parameters"
    scm: |
      (begin
        (define callback (list 'lambda (list 'x) (list '>= 'x (list 'quote '(200)))))
        (define access (compile_scan_access '("id") callback))
        (if (list? (car (car access)))
          (error "quoted list incorrectly acquired a scalar feedback identity") true))
    expect:
      result_contains: ["true"]

  - name: "A different-word length prior must not suppress permitted sampling"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define rare (list 'lambda (list 'x) (list 'strlike 'x "%rarexx%" "utf8mb4_general_ci")))
        (define rare_access (compile_scan_access '("label") rare))
        (scan_recset nil tbl (nth rare_access 0)
          (map (nth rare_access 1) (lambda (v) (eval v))) '("label") (eval rare))
        (define common (list 'lambda (list 'x) (list 'strlike 'x "%common%" "utf8mb4_general_ci")))
        (define access (compile_scan_access '("label") common))
        (define values (map (nth access 1) (lambda (v) (eval v))))
        (define prior (scan_selectivity_estimate nil tbl (nth access 0) values '("label") (eval common) 0))
        (define measured (scan_selectivity_estimate nil tbl (nth access 0) values '("label") (eval common) 1024))
        (if (and (equal? (qassoc_get prior 'source nil) 'like_length_histogram)
          (equal? (qassoc_get prior 'value nil) 0)
          (equal? (qassoc_get measured 'rows nil) 900)
          (> (qassoc_get measured 'sampled 0) 0)) true
          (error "a different-word prior displaced the permitted measurement")))
    expect:
      data: [true]

  - name: "Complete filter feedback replaces a range constant and participates in plan guards"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define src (list "a" "memcp-tests" "afs_check" false nil))
        (define expr (list '< (list 'get_column "a" false "id" false) 100))
        (define before_token (table_planner_statistics_token tbl))
        (define before_fingerprint (table_planner_statistics_fingerprint tbl))
        (define callback (list 'lambda (list 'x) (list '< 'x 100)))
        (define access (compile_scan_access '("id") callback))
        (define values (map (nth access 1) (lambda (value) (eval value))))
        (define matches (scan nil tbl (nth access 0) values '("id") (eval callback)
          '() scan_count 0 + false))
        (define estimate (join_optimizer_expr_selectivity_estimate (list src) "a" expr nil))
        (and (equal? matches 100)
          (equal? (qassoc_get estimate 'source nil) 'scan_feedback)
          (equal? (qassoc_get estimate 'value nil) 0.1)
          (not (table_planner_statistics_compatible? "memcp-tests" "afs_check"
            before_token before_fingerprint))))
    expect:
      data: [true]

  - name: "LIKE length buckets interpolate unknown patterns without crossing wildcard topology"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define access_for (lambda (pattern)
          (compile_scan_access '("label") (list 'lambda (list 'x)
            (list 'strlike 'x pattern "utf8mb4_general_ci")))))
        (define train (lambda (pattern) (begin
          (define callback (list 'lambda (list 'x) (list 'strlike 'x pattern "utf8mb4_general_ci")))
          (define access (access_for pattern))
          (scan nil tbl (nth access 0) (map (nth access 1) (lambda (v) (eval v)))
            '("label") (eval callback) '() scan_count 0 + false))))
        (train "%co%")
        (train "%comm%")
        (define estimate_for (lambda (pattern) (begin
          (define access (access_for pattern))
          (scan_selectivity_estimate nil tbl (nth access 0)
            (map (nth access 1) (lambda (v) (eval v))) '() (lambda () true) 0))))
        (define interpolated (estimate_for "%com%"))
        (and (equal? (qassoc_get interpolated 'source nil) 'like_length_histogram)
          (equal? (qassoc_get interpolated 'value nil) 0.9)
          (nil? (estimate_for "com%")))))
    expect:
      data: [true]

  - name: "Observed zero LIKE matches override the nonzero text prior"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define callback (list 'lambda (list 'x) (list 'strlike 'x "%absent%" "utf8mb4_general_ci")))
        (define access (compile_scan_access '("label") callback))
        (define values (map (nth access 1) (lambda (v) (eval v))))
        (scan nil tbl (nth access 0) values '("label") (eval callback) '() scan_count 0 + false)
        (define estimate (scan_selectivity_estimate nil tbl (nth access 0) values '() (lambda () true) 0))
        (and (equal? (qassoc_get estimate 'source nil) 'scan_feedback)
          (equal? (qassoc_get estimate 'value nil) 0))))
    expect:
      data: [true]

  - name: "Feedback preserves SQL NULL filtering"
    sql: "SELECT COUNT(*) AS n FROM afs_check WHERE label LIKE '%com%'"
    expect:
      rows: 1
      data: [{n: 900}]

  - name: "Learned filters do not suppress invalid column errors"
    sql: "SELECT COUNT(*) FROM afs_check WHERE missing_column LIKE '%com%'"
    expect:
      error: true

  - name: "Complete indexed RecSet learns a table rate and refreshes plan guards"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "afs_check"))
        (define callback (list 'lambda (list 'x) (list 'strlike 'x "%common%" "utf8mb4_general_ci")))
        (define access (compile_scan_access '("label") callback))
        (define values (map (nth access 1) (lambda (v) (eval v))))
        (define before_token (table_planner_statistics_token tbl))
        (define before_fingerprint (table_planner_statistics_fingerprint tbl))
        (define matches (recset_count (scan_recset nil tbl (nth access 0) values '("label") (eval callback))))
        (define estimate (scan_selectivity_estimate nil tbl (nth access 0) values '() (lambda () true) 0))
        (if (and (equal? matches 900)
          (equal? (qassoc_get estimate 'source nil) 'scan_feedback)
          (equal? (qassoc_get estimate 'value nil) 0.9)
          (not (table_planner_statistics_compatible? "memcp-tests" "afs_check" before_token before_fingerprint)))
          true (error "complete RecSet feedback did not invalidate the planner guard"))))
    expect:
      data: [true]

  - name: "EXPLAIN cache checks never execute candidate preparations"
    scm: |
      (begin
        (define sess (newsession))
        (define cache (newcachemap))
        (define diagnostic_parser (lambda (schema query policy planning tx) (begin
          (define preparations (planning "__memcp_queryplan_preparations"))
          (preparations "count" 1)
          (preparations "preparation:0" (list "must-not-prepare"
            (list 'error "candidate preparation must not run for EXPLAIN") 0))
          (list 'resultrow (list 'list "ok" true)))))
        (with_autocommit sess nil 1 "explain feedback guard test" (lambda (tx) (begin
          (define formula (cached_parse cache (list diagnostic_parser) "memcp-tests"
            "EXPLAIN SELECT 1" nil "root" sess false tx))
          (sql_execute_formula sess tx formula (lambda (_row) true) (lambda (_fields) nil))))))
    expect:
      data: [true]

  - name: "A cache miss prepares the newly compiled variant before its first execution"
    scm: |
      (begin
        (define sess (newsession))
        (define cache (newcachemap))
        (define entry (newsession))
        (entry "compile_lock" (mutex))
        (entry "variants" '())
        (sess "v1" 17)
        (define parser (lambda (schema query policy planning tx) (begin
          (define preparations (planning "__memcp_queryplan_preparations"))
          (preparations "count" 1)
          (preparations "preparation:0" (list "new-variant-input" (list 'session "v1")
            (symbol "__queryplan_observed_value")))
          (list 'equal?
            (planner_queryplan_observation_current_read_expr
              (planner_queryplan_observation_value_key "new-variant-input"))
            17))))
        (with_autocommit sess nil 1 "cache miss preparation test" (lambda (tx)
          (if (sql_queryplan_variant_miss cache "new-variant" entry (list parser)
            "memcp-tests" "SELECT 1" nil sess tx
            (lambda (_row) true) (lambda (_fields) nil))
            true (error "newly compiled plan ran without its prepared input")))))
    expect:
      data: [true]

  - name: "Physical diagnostics follow observation producers without executing or unquoting them"
    scm: |
      (begin
        (define planning (newsession))
        (define preparations (newsession))
        (planning "__memcp_queryplan_preparations" preparations)
        (define producer (list 'error "diagnostics must not execute prepared inputs"))
        (preparations "count" 1)
        (preparations "preparation:0" (list "diagnostic-input" producer 0))
        (define key (planner_queryplan_observation_value_key "diagnostic-input"))
        (define source (planner_queryplan_observation_read_expr key))
        (define quoted (list 'quote source))
        (preparations "count" 3)
        (preparations "preparation:1" (list "dependent-input" (list '+ source 1) 0))
        (preparations "preparation:2" (list "unused-input" producer 0))
        (define dependent (planner_queryplan_observation_read_expr
          (planner_queryplan_observation_value_key "dependent-input")))
        (define view (physical_queryplan_observation_view (list 'list dependent source) planning))
        (if (and
          (equal? (map (cadr view) car) '("diagnostic-input" "dependent-input"))
          (empty_list? (cadr (physical_queryplan_observation_view quoted planning)))
          (equal? (car (physical_queryplan_observation_view source planning)) producer)
          (equal? (car (physical_queryplan_observation_view
            (planner_queryplan_observation_current_read_expr key) planning)) producer)
          (equal? (car (physical_queryplan_observation_view quoted planning)) quoted))
          true (error "physical diagnostics lost prepared input provenance or quoting"))))
    expect:
      data: [true]
