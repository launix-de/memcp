metadata:
  version: '1.0'
  description: String-space CONCAT equality decomposition across SQL frontends
  isolated: true
setup:
- sql: DROP TABLE IF EXISTS cr_values
- sql: DROP TABLE IF EXISTS cr_encoded
- sql: CREATE TABLE cr_values (id INT PRIMARY KEY, text_value VARCHAR(100) COLLATE
    utf8mb4_bin, number_value BIGINT)
- sql: CREATE TABLE cr_encoded (id INT PRIMARY KEY, encoded VARCHAR(200) COLLATE utf8mb4_bin)
- sql: INSERT INTO cr_values VALUES (1,'123',123),(2,'00123',123),(3,'0',0),(4,'',NULL),(5,NULL,NULL),(6,'body',-1),(7,'9007199254740993',9007199254740993)
- sql: INSERT INTO cr_encoded VALUES (1,'doc:123'),(2,'doc:00123'),(3,'doc:0'),(4,'doc:'),(5,NULL),(6,'pre:body:end'),(7,'doc:9007199254740993'),(8,'doc:123tail'),(9,'pre:end'),(10,'d'),(11,'end'),(12,'é:body')
- sql: DROP TABLE IF EXISTS cr_locale
- sql: CREATE TABLE cr_locale (id INT PRIMARY KEY, value VARCHAR(30) COLLATE utf8mb4_general_ci)
- sql: INSERT INTO cr_locale VALUES (1,'K'),(2,'K')
test_cases:
- name: Text identifier join mysql
  syntax: mysql
  sql: SELECT e.id AS encoded_id,v.id AS value_id FROM cr_encoded e JOIN cr_values
    v ON e.encoded=CONCAT('doc:',v.text_value) ORDER BY e.id,v.id
  expect:
    rows: 5
    data:
    - encoded_id: 1
      value_id: 1
    - encoded_id: 2
      value_id: 2
    - encoded_id: 3
      value_id: 3
    - encoded_id: 4
      value_id: 4
    - encoded_id: 7
      value_id: 7
- name: Numeric rendering stays textual mysql
  syntax: mysql
  sql: SELECT e.id AS encoded_id,v.id AS value_id FROM cr_encoded e JOIN cr_values
    v ON e.encoded=CONCAT('doc:',v.number_value) ORDER BY e.id,v.id
  expect:
    rows: 4
    data:
    - encoded_id: 1
      value_id: 1
    - encoded_id: 1
      value_id: 2
    - encoded_id: 3
      value_id: 3
    - encoded_id: 7
      value_id: 7
- name: Prefix and suffix mysql
  syntax: mysql
  sql: SELECT e.id AS encoded_id,v.id AS value_id FROM cr_encoded e JOIN cr_values
    v ON e.encoded=CONCAT('pre:',v.text_value,':end') ORDER BY e.id,v.id
  expect:
    rows: 1
    data:
    - encoded_id: 6
      value_id: 6
- name: Nested variadic prefix mysql
  syntax: mysql
  sql: SELECT e.id AS encoded_id,v.id AS value_id FROM cr_encoded e JOIN cr_values
    v ON CONCAT('d','oc:',CONCAT(v.text_value,''))=e.encoded ORDER BY e.id,v.id
  expect:
    rows: 5
    data:
    - encoded_id: 1
      value_id: 1
    - encoded_id: 2
      value_id: 2
    - encoded_id: 3
      value_id: 3
    - encoded_id: 4
      value_id: 4
    - encoded_id: 7
      value_id: 7
- name: Suffix only mysql
  syntax: mysql
  sql: SELECT e.id AS encoded_id,v.id AS value_id FROM cr_encoded e JOIN cr_values
    v ON e.encoded=CONCAT(v.text_value,'end') ORDER BY e.id,v.id
  expect:
    rows: 1
    data:
    - encoded_id: 11
      value_id: 4
- name: Empty prefix mysql
  syntax: mysql
  sql: SELECT v.id FROM cr_values v WHERE v.text_value=CONCAT('',v.text_value) ORDER
    BY v.id
  expect:
    rows: 6
    data:
    - id: 1
    - id: 2
    - id: 3
    - id: 4
    - id: 6
    - id: 7
- name: Common affixes mysql
  syntax: mysql
  sql: SELECT a.id AS aid,b.id AS bid FROM cr_values a JOIN cr_values b ON CONCAT('pre:',a.text_value,':end')=CONCAT('pre:',b.text_value,':end')
    WHERE a.id<=3 ORDER BY a.id,b.id
  expect:
    rows: 3
    data:
    - aid: 1
      bid: 1
    - aid: 2
      bid: 2
    - aid: 3
      bid: 3
- name: Outer join keeps unmatched rows mysql
  syntax: mysql
  sql: SELECT e.id AS encoded_id,v.id AS value_id FROM cr_encoded e LEFT JOIN cr_values
    v ON e.encoded=CONCAT('doc:',v.text_value) WHERE e.id IN (1,2,8,10) ORDER BY e.id,v.id
  expect:
    rows: 4
    data:
    - encoded_id: 1
      value_id: 1
    - encoded_id: 2
      value_id: 2
    - encoded_id: 8
      value_id: null
    - encoded_id: 10
      value_id: null
- name: Negation retains NULL semantics mysql
  syntax: mysql
  sql: SELECT v.id FROM cr_values v WHERE NOT (CONCAT('doc:',v.text_value)='doc:123')
    ORDER BY v.id
  expect:
    rows: 5
    data:
    - id: 2
    - id: 3
    - id: 4
    - id: 6
    - id: 7
- name: Unicode prefix retains its comparison mysql
  syntax: mysql
  sql: SELECT e.id AS encoded_id,v.id AS value_id FROM cr_encoded e JOIN cr_values
    v ON e.encoded=CONCAT('é:',v.text_value) ORDER BY e.id,v.id
  expect:
    rows: 1
    data:
    - encoded_id: 12
      value_id: 6
