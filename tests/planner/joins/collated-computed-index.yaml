metadata:
  syntax: mysql
  isolated: true
  description: Computed text access preserves explicit equality and current probe values
setup:
- sql: DROP TABLE IF EXISTS collated_scan_empty
- sql: DROP TABLE IF EXISTS collated_scan_rows
- sql: DROP TABLE IF EXISTS collated_scan_work
- sql: CREATE TABLE collated_scan_empty(id INT PRIMARY KEY,label VARCHAR(100))
- sql: CREATE TABLE collated_scan_rows(id INT PRIMARY KEY,label VARCHAR(100))
- sql: INSERT INTO collated_scan_rows VALUES(1,'ALPHA  '),(2,'alpha'),(3,'Σ'),(4,'ς'),(5,'σ'),(6,'K'),(7,'K'),(8,'k'),(9,'İ'),(10,'i'),(11,'I'),(12,NULL)
- sql: CREATE TABLE collated_scan_work(object_name VARCHAR(100),permission_name VARCHAR(100))
- scm: (insert (table "memcp-tests" false "collated_scan_work" false) '("object_name" "permission_name") (map (produceN
    1000) (lambda (i) (list (concat "object_" i) "SELECT"))))
test_cases:
- name: Padded composite text input preserves spaces and case
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace "alpha " " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result:
    - 1
    - 2
- name: Unicode sigma variants retain native case folding
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace "σ" " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result:
    - 3
    - 4
    - 5
- name: Kelvin sign and ASCII keys share their true equality class
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace "k" " +$" "") "LATIN1_GENERAL_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result:
    - 6
    - 7
    - 8
- name: Dotted I remains distinct from the ASCII fold class
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace "i" " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result:
    - 10
    - 11
- name: Explicit case sensitive equality keeps separate keys
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace "alpha" " +$" "") "utf8mb4_bin"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result:
    - 2
- name: NULL probe remains an empty SQL match
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace nil " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result: []
- name: Reversed normalized comparison retains every matching row
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace "alpha" " +$" "") (list regexp_replace (quote label) " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result:
    - 1
    - 2
- name: Opaque scalar producer keeps its original comparison semantics
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list (list (quote lambda) (list (quote value)) (quote value)) (quote label)) (list regexp_replace "alpha" " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result:
    - 2
- name: One compiled scan reads each current session text key
  scm: |-
    (begin
     (define run (eval (list (quote lambda) (list (quote session)) (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace (list (quote session) "needle") " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false))))
     (define values (newsession))
     (map '("alpha" "σ" "k" "i" "absent") (lambda (needle)
      (begin (values "needle" needle) (sort (run values) <)))))
  expect:
    result:
    - - 1
      - 2
    - - 3
      - 4
      - 5
    - - 6
      - 7
      - 8
    - - 10
      - 11
    - []
- name: Different constant regex patterns retain different computed keys
  scm: |-
    (list
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) "^." "") (list regexp_replace "lpha" " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace "alpha " " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_rows" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) "^." "") (list regexp_replace "lpha" " +$" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <))
  expect:
    result:
    - - 2
    - - 1
      - 2
    - - 2
- name: Invalid bound regex remains unevaluated over an empty row domain
  scm: |-
    (sort (eval (compile_scan_plan (quote scan) nil
      (list (quote table) "memcp-tests" false "collated_scan_empty" false)
      '("label") (list (quote lambda) (list (quote label))
        (list equal_collate (list regexp_replace (quote label) " +$" "") (list regexp_replace "alpha " "[" "") "Latin1_General_CI_AS"))
      (list (quote quote) '("id")) (list (quote lambda) (list (quote acc) (quote id)) (list (quote cons) (quote id) (quote acc))) '()
      (list (quote lambda) (list (quote a) (quote b)) (list (quote merge) (list (quote list) (quote a) (quote b)))) false)) <)
  expect:
    result: []
- name: Repeated normalized composite probes verify every matching key
  scm: |-
    (begin
     (define lookup (eval (list (quote lambda) (list (quote needle)) (compile_scan_plan (quote scan_exists) nil
     (list (quote table) "memcp-tests" false "collated_scan_work" false)
     '("object_name" "permission_name")
     (list (quote lambda) (list (quote object_name) (quote permission_name))
      (list (quote and)
       (list equal_collate (list regexp_replace (quote object_name) " +$" "")
        (list regexp_replace (list (quote outer) 1 (quote needle)) " +$" "") "Latin1_General_CI_AS")
       (list equal_collate (list regexp_replace (quote permission_name) " +$" "") "select" "Latin1_General_CI_AS")))))))
     (reduce (produceN 1000) (lambda (found i)
      (+ found (if (lookup (concat "OBJECT_" i " ")) 1 0))) 0))
  expect:
    result: 1000
  warmup: 0
  timing_samples: 3
  timing_aggregation: total
cleanup:
- sql: DROP TABLE IF EXISTS collated_scan_work
- sql: DROP TABLE IF EXISTS collated_scan_rows
- sql: DROP TABLE IF EXISTS collated_scan_empty
