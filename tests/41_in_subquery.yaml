# IN with subquery tests

metadata:
  version: "1.0"
  description: "IN and NOT IN with subquery tests"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS in_renderjob"
  - sql: "DROP TABLE IF EXISTS in_fop_files"
  - sql: |
      CREATE TABLE in_fop_files (
        ID INT PRIMARY KEY,
        name VARCHAR(64)
      )
  - sql: |
      CREATE TABLE in_renderjob (
        ID INT PRIMARY KEY,
        result INT
      )
  - sql: |
      INSERT INTO in_fop_files (ID, name) VALUES
      (1, 'image1.png'), (2, 'image2.png'), (3, 'image3.png'),
      (4, 'image4.png'), (5, 'image5.png')
  - sql: |
      INSERT INTO in_renderjob (ID, result) VALUES
      (101, 1), (102, 3), (103, 3)

test_cases:
  - name: "IN subquery - files with render results"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "NOT IN subquery - files without render results"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 2
          name: "image2.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "IN subquery with WHERE in subquery"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob WHERE ID > 101)
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 3
          name: "image3.png"

  - name: "IN subquery returns no matches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob WHERE ID > 1000)
      ORDER BY ID
    expect:
      rows: 0

  - name: "NOT IN subquery returns all when subquery empty"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (SELECT result FROM in_renderjob WHERE ID > 1000)
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "image3.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "IN subquery combined with other conditions"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob) AND name LIKE '%3%'
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 3
          name: "image3.png"

  - name: "EXPLAIN IN subquery uses materialized count helper cache"
    sql: |
      EXPLAIN SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 1
      contains:
        - "touch_keytable"
        - "createcolumn"
        - "\"__cnt\""
        - ".in_renderjob:((get_column"

  - name: "EXPLAIN IR IN subquery keeps membership semantics logical"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR SELECT ID, name FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_renderjob)
      ORDER BY ID
    expect:
      rows: 1
      contains:
        - "group-stage"
        - "stage-output"
        - "domain"
        - "lookup-keys"
        - "null_semantics"
        - "cardinality_mode"
      not_contains:
        - "dependent-subquery"
        - "neumann_in"
        - "inner_select"
        - "in_membership"
        - ".grp:"
        - "touch_keytable"

  # === UNION ALL inside IN subselect ===
  # Can be compiled to (or (scan...) (scan...))

  - name: "IN with UNION ALL subselect"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "NOT IN with UNION ALL subselect"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 2
          name: "image2.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "IN with UNION ALL using three branches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 103
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL duplicate branches keeps semantics"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 103
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL including empty branch"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID > 1000
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 101
      )
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 1
          name: "image1.png"

  - name: "NOT IN with UNION ALL when all branches empty"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_renderjob WHERE ID > 1000
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID > 2000
      )
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          name: "image1.png"
        - ID: 2
          name: "image2.png"
        - ID: 3
          name: "image3.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "IN with UNION ALL and outer filter"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      AND ID > 1
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL branch using inner ORDER BY/LIMIT"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM (
          SELECT result FROM in_renderjob ORDER BY ID DESC LIMIT 1
        ) AS top_result
        UNION ALL
        SELECT result FROM in_renderjob WHERE ID = 101
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION ALL column count mismatch"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION ALL
        SELECT result, ID FROM in_renderjob WHERE ID = 102
      )
    expect:
      error: true

  - name: "IN with UNION without ALL compatibility"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID = 101
        UNION
        SELECT result FROM in_renderjob WHERE ID = 102
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "IN with UNION without ALL overlapping branches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID IN (
        SELECT result FROM in_renderjob WHERE ID <= 102
        UNION
        SELECT result FROM in_renderjob WHERE ID >= 102
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "NOT IN with UNION without ALL overlapping branches"
    sql: |
      SELECT ID, name FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_renderjob WHERE ID <= 102
        UNION
        SELECT result FROM in_renderjob WHERE ID >= 102
      )
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 2
          name: "image2.png"
        - ID: 4
          name: "image4.png"
        - ID: 5
          name: "image5.png"

  - name: "EXPLAIN IN with UNION without ALL skips duplicate materialization"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    steps:
      - sql: |
          EXPLAIN IR
          SELECT ID, name FROM in_fop_files
          WHERE ID IN (
            SELECT result FROM in_renderjob WHERE ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE ID >= 102
          )
          ORDER BY ID
        expect:
          contains:
            - "in_candidate"
            - "candidate"
            - "stage-output"
            - "lookup-keys"
          not_contains:
            - "inner_select"
            - "in_membership"
            - ".grp:"
      - sql: |
          EXPLAIN
          SELECT ID, name FROM in_fop_files
          WHERE ID IN (
            SELECT result FROM in_renderjob WHERE ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE ID >= 102
          )
          ORDER BY ID
        expect:
          not_contains:
            - "__union_distinct_rows"
            - "__union_distinct_seen"

  - name: "IN UNION dataview-shaped filter exposes joinable candidate relation"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    setup:
      - sql: "DROP TABLE IF EXISTS in_dv_doc"
      - sql: "DROP TABLE IF EXISTS in_dv_file"
      - sql: "DROP TABLE IF EXISTS in_dv_acl"
      - sql: |
          CREATE TABLE in_dv_file (
            ID INT PRIMARY KEY,
            filename VARCHAR(64),
            search VARCHAR(128)
          )
      - sql: |
          CREATE TABLE in_dv_doc (
            ID INT PRIMARY KEY,
            file_id INT,
            tenant INT,
            sort_key INT
          )
      - sql: |
          CREATE TABLE in_dv_acl (
            ID INT PRIMARY KEY,
            tenant INT,
            allowed INT
          )
      - sql: |
          INSERT INTO in_dv_file (ID, filename, search) VALUES
          (10, 'invoice-hit.pdf', 'other'),
          (20, 'other.pdf', 'needle token'),
          (30, 'miss.pdf', 'other')
      - sql: |
          INSERT INTO in_dv_doc (ID, file_id, tenant, sort_key) VALUES
          (1, 10, 1, 20),
          (2, 20, 1, 10),
          (3, 30, 1, 30),
          (4, 10, 2, 5)
      - sql: |
          INSERT INTO in_dv_acl (ID, tenant, allowed) VALUES
          (1, 1, 1),
          (2, 2, 0)
    steps:
      - sql: |
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          rows: 2
          data:
            - ID: 2
            - ID: 1
      - sql: |
          EXPLAIN IR
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          contains:
            - "in_candidate"
            - "candidate"
            - "stage-output"
            - "lookup-keys"
          not_contains:
            - "inner_select"
            - "dependent-subquery"
            - "in_membership"
            - ".grp:"
            - "touch_keytable"
      - sql: |
          EXPLAIN
          SELECT t.ID
          FROM (
            SELECT d.ID, d.file_id, d.tenant, d.sort_key
            FROM in_dv_doc d
            JOIN in_dv_acl a ON a.tenant = d.tenant AND a.allowed = 1
          ) t
          WHERE t.file_id IN (
            SELECT f.ID FROM in_dv_file f WHERE f.filename LIKE '%hit%'
            UNION
            SELECT f.ID FROM in_dv_file f WHERE f.search LIKE '%needle%'
          )
          ORDER BY t.sort_key
          LIMIT 10
        expect:
          contains:
            - "scan"
          not_contains:
            - "__union_distinct_rows"
            - "__union_distinct_seen"

  - name: "EXPLAIN NOT IN with UNION without ALL skips duplicate materialization"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    steps:
      - sql: |
          EXPLAIN IR
          SELECT ID, name FROM in_fop_files
          WHERE ID NOT IN (
            SELECT result FROM in_renderjob WHERE ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE ID >= 102
          )
          ORDER BY ID
        expect:
          contains:
            - "and"
            - "in_membership"
            - "in_rhs_nulls"
            - "stage-output"
          not_contains:
            - "union_distinct"
            - "inner_select"
            - ".grp:"
      - sql: |
          EXPLAIN
          SELECT ID, name FROM in_fop_files
          WHERE ID NOT IN (
            SELECT result FROM in_renderjob WHERE ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE ID >= 102
          )
          ORDER BY ID
        expect:
          not_contains:
            - "__union_distinct_rows"
            - "__union_distinct_seen"

  - name: "EXISTS with UNION without ALL overlapping branches"
    sql: |
      SELECT ID, name FROM in_fop_files f
      WHERE EXISTS (
        SELECT result FROM in_renderjob WHERE result = f.ID AND ID <= 102
        UNION
        SELECT result FROM in_renderjob WHERE result = f.ID AND ID >= 102
      )
      ORDER BY ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "image1.png"
        - ID: 3
          name: "image3.png"

  - name: "EXPLAIN EXISTS with UNION without ALL skips duplicate materialization"
    steps:
      - sql: |
          EXPLAIN IR
          SELECT ID, name FROM in_fop_files f
          WHERE EXISTS (
            SELECT result FROM in_renderjob WHERE result = f.ID AND ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE result = f.ID AND ID >= 102
          )
          ORDER BY ID
        expect:
          not_contains:
            - "union_distinct"
      - sql: |
          EXPLAIN
          SELECT ID, name FROM in_fop_files f
          WHERE EXISTS (
            SELECT result FROM in_renderjob WHERE result = f.ID AND ID <= 102
            UNION
            SELECT result FROM in_renderjob WHERE result = f.ID AND ID >= 102
          )
          ORDER BY ID
        expect:
          not_contains:
            - "__union_distinct_rows"
            - "__union_distinct_seen"

  # === SQL three-valued logic for IN / NOT IN with NULL RHS ===

  - name: "Setup NULL membership table"
    sql: "DROP TABLE IF EXISTS in_nullable_rhs"
    expect: {}

  - name: "Create NULL membership table"
    sql: "CREATE TABLE in_nullable_rhs (ID INT PRIMARY KEY, grp INT, result INT)"
    expect: {}

  - name: "Insert NULL membership rows"
    sql: |
      INSERT INTO in_nullable_rhs (ID, grp, result) VALUES
      (1, 1, 2),
      (2, 1, NULL),
      (3, 2, NULL)
    expect: {}

  - name: "NOT IN subquery with RHS NULL returns no nonmatching rows"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID NOT IN (SELECT result FROM in_nullable_rhs)
      ORDER BY ID
    expect:
      rows: 0

  - name: "IN subquery with RHS NULL still returns matching rows"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID IN (SELECT result FROM in_nullable_rhs)
      ORDER BY ID
    expect:
      rows: 1
      data:
        - ID: 2

  - name: "NOT IN subquery with RHS NULL projects UNKNOWN"
    sql: |
      SELECT ID, ID NOT IN (SELECT result FROM in_nullable_rhs) AS ok
      FROM in_fop_files
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          ok: null
        - ID: 2
          ok: false
        - ID: 3
          ok: null
        - ID: 4
          ok: null
        - ID: 5
          ok: null

  - name: "IN subquery with RHS NULL projects UNKNOWN for nonmatch"
    sql: |
      SELECT ID, ID IN (SELECT result FROM in_nullable_rhs) AS ok
      FROM in_fop_files
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
          ok: null
        - ID: 2
          ok: true
        - ID: 3
          ok: null
        - ID: 4
          ok: null
        - ID: 5
          ok: null

  - name: "Correlated NOT IN sees RHS NULL per domain"
    sql: |
      SELECT ID FROM in_fop_files f
      WHERE ID NOT IN (
        SELECT result FROM in_nullable_rhs r WHERE r.grp = f.ID
      )
      ORDER BY ID
    expect:
      rows: 3
      data:
        - ID: 3
        - ID: 4
        - ID: 5

  - name: "Correlated NOT IN without RHS NULL keeps nonmatching domain rows"
    sql: |
      SELECT ID FROM in_fop_files f
      WHERE ID NOT IN (
        SELECT result FROM in_nullable_rhs r WHERE r.grp = f.ID AND r.result IS NOT NULL
      )
      ORDER BY ID
    expect:
      rows: 5
      data:
        - ID: 1
        - ID: 2
        - ID: 3
        - ID: 4
        - ID: 5

  - name: "NOT IN UNION with RHS NULL returns no nonmatching rows"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_nullable_rhs WHERE ID = 1
        UNION ALL
        SELECT result FROM in_nullable_rhs WHERE ID = 2
      )
      ORDER BY ID
    expect:
      rows: 0

  - name: "EXPLAIN IR NOT IN UNION with RHS NULL keeps branch null facts"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR SELECT ID FROM in_fop_files
      WHERE ID NOT IN (
        SELECT result FROM in_nullable_rhs WHERE ID = 1
        UNION ALL
        SELECT result FROM in_nullable_rhs WHERE ID = 2
      )
      ORDER BY ID
    expect:
      rows: 1
      contains:
        - "and"
        - "in_membership"
        - "in_rhs_nulls"
        - "null_semantics"
      not_contains:
        - "dependent-subquery"
        - "union_distinct"
        - "inner_select"
        - ".grp:"

  - name: "NOT IN constant NULL subquery returns no rows"
    sql: |
      SELECT ID FROM in_fop_files
      WHERE ID NOT IN (SELECT NULL)
      ORDER BY ID
    expect:
      rows: 0

  - name: "NOT IN constant NULL subquery projects UNKNOWN"
    sql: "SELECT 1 NOT IN (SELECT NULL) AS ok"
    expect:
      rows: 1
      data:
        - ok: null

  - name: "IN constant NULL subquery projects UNKNOWN"
    sql: "SELECT 1 IN (SELECT NULL) AS ok"
    expect:
      rows: 1
      data:
        - ok: null

  - name: "NOT IN with NULL probe projects UNKNOWN"
    sql: "SELECT NULL NOT IN (SELECT 1) AS ok"
    expect:
      rows: 1
      data:
        - ok: null

  - name: "EXPLAIN IR IN with RHS NULL exposes null-aware membership semantics"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR SELECT ID FROM in_fop_files
      WHERE ID NOT IN (SELECT result FROM in_nullable_rhs)
      ORDER BY ID
    expect:
      rows: 1
      contains:
        - "in_membership"
        - "in_rhs_nulls"
        - "null_semantics"
        - "lookup-keys"
      not_contains:
        - "dependent-subquery"
        - "inner_select"
        - "neumann_in"
        - ".grp:"
        - "touch_keytable"

cleanup:
  - sql: "DROP TABLE IF EXISTS in_nullable_rhs"
  - sql: "DROP TABLE IF EXISTS in_renderjob"
  - sql: "DROP TABLE IF EXISTS in_fop_files"
