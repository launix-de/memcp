# RDF/SPARQL query planner coverage for less common WHERE and expression forms.

metadata:
  version: "1.0"
  description: "RDF/SPARQL query planner coverage"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS rdf"

test_cases:
  - name: "SPARQL OPTIONAL keeps unmatched left rows"
    ttl_data: |
      @prefix ropt: <http://rdfcov/optional/> .
      ropt:a ropt:name "Ann" .
      ropt:a ropt:nick "A" .
      ropt:b ropt:name "Bob" .
    sparql: |
      @prefix ropt: <http://rdfcov/optional/> .
      SELECT DISTINCT ?name, ?nick WHERE { ?s ropt:name ?name . OPTIONAL { ?s ropt:nick ?nick } } ORDER BY ?name
    expect:
      rows: 2

  - name: "SPARQL VALUES binds candidate constants"
    ttl_data: |
      @prefix rvals: <http://rdfcov/values/> .
      rvals:a rvals:v "1" .
      rvals:b rvals:v "2" .
      rvals:c rvals:v "3" .
    sparql: |
      @prefix rvals: <http://rdfcov/values/> .
      SELECT DISTINCT ?s WHERE { VALUES ?wanted { "1" "3" } ?s rvals:v ?wanted }
    expect:
      rows: 2

  - name: "SPARQL FILTER EXISTS and NOT EXISTS"
    ttl_data: |
      @prefix rex: <http://rdfcov/exists/> .
      rex:a rex:type rex:Thing .
      rex:a rex:flag "yes" .
      rex:b rex:type rex:Thing .
      rex:c rex:type rex:Other .
    sparql: |
      @prefix rex: <http://rdfcov/exists/> .
      SELECT ?s WHERE { ?s rex:type rex:Thing . FILTER EXISTS { ?s rex:flag "yes" } . FILTER NOT EXISTS { ?s rex:skip "1" } }
    expect:
      rows: 1
      data:
        - "?s": "http://rdfcov/exists/a"

  - name: "SPARQL UNION combines alternative groups"
    ttl_data: |
      @prefix runi: <http://rdfcov/union/> .
      runi:a runi:left "L" .
      runi:b runi:right "R" .
      runi:c runi:other "O" .
    sparql: |
      @prefix runi: <http://rdfcov/union/> .
      SELECT ?s WHERE { { ?s runi:left "L" } UNION { ?s runi:right "R" } }
    expect:
      rows: 2

  - name: "SPARQL BIND and scalar filter functions"
    ttl_data: |
      @prefix rbind: <http://rdfcov/bind/> .
      rbind:a rbind:v "alpha" .
      rbind:b rbind:v "beta" .
    sparql: |
      @prefix rbind: <http://rdfcov/bind/> .
      SELECT ?out WHERE { ?s rbind:v ?v . BIND(CONCAT(?v, "-x") AS ?out) . FILTER(STRSTARTS(?out, "alpha") && CONTAINS(?out, "-") && STRENDS(?out, "x") && regex(?out, "alpha")) }
    expect:
      rows: 1
      data:
        - "?out": "alpha-x"

  - name: "SPARQL aggregate grouping"
    ttl_data: |
      @prefix ragg: <http://rdfcov/agg/> .
      ragg:a ragg:g "one" .
      ragg:a ragg:v "2" .
      ragg:b ragg:g "one" .
      ragg:b ragg:v "4" .
      ragg:c ragg:g "two" .
      ragg:c ragg:v "5" .
    sparql: |
      @prefix ragg: <http://rdfcov/agg/> .
      SELECT ?g, (COUNT(?v) AS ?cnt), (SUM(?v) AS ?sum), (AVG(?v) AS ?avg), (MIN(?v) AS ?min), (MAX(?v) AS ?max), (GROUP_CONCAT(?v; separator="|") AS ?joined) WHERE { ?s ragg:g ?g . ?s ragg:v ?v } GROUP BY ?g ORDER BY ?g
    expect:
      rows: 2

  - name: "SPARQL property path sequence and alternative"
    ttl_data: |
      @prefix rpath: <http://rdfcov/path/> .
      rpath:a rpath:p1 rpath:b .
      rpath:b rpath:p2 "seq" .
      rpath:c rpath:left "alt-left" .
      rpath:d rpath:right "alt-right" .
    sparql: |
      @prefix rpath: <http://rdfcov/path/> .
      SELECT ?o WHERE { rpath:a rpath:p1/rpath:p2 ?o }
    expect:
      rows: 1
      data:
        - "?o": "seq"

  - name: "SPARQL property path star and plus"
    ttl_data: |
      @prefix rwalk: <http://rdfcov/walk/> .
      rwalk:a rwalk:next rwalk:b .
      rwalk:b rwalk:next rwalk:c .
    sparql: |
      @prefix rwalk: <http://rdfcov/walk/> .
      SELECT ?o WHERE { rwalk:a rwalk:next+ ?o }
    expect:
      rows: 2

  - name: "SPARQL aggregate subquery"
    ttl_data: |
      @prefix rsub: <http://rdfcov/subquery/> .
      rsub:a rsub:v "1" .
      rsub:b rsub:v "2" .
    sparql: |
      @prefix rsub: <http://rdfcov/subquery/> .
      SELECT ?total WHERE { { SELECT (COUNT(?s) AS ?total) WHERE { ?s rsub:v ?v } } }
    expect:
      rows: 1

  - name: "SPARQL ORDER BY preserves rows from a shared-variable BGP join"
    ttl_data: |
      @prefix rorder: <http://rdfcov/order-join/> .
      rorder:parent rorder:child rorder:first, rorder:second .
      rorder:first rorder:order "10" .
      rorder:second rorder:order "20" .
      rorder:noise01 rorder:order "1" . rorder:noise02 rorder:order "2" .
      rorder:noise03 rorder:order "3" . rorder:noise04 rorder:order "4" .
      rorder:noise05 rorder:order "5" . rorder:noise06 rorder:order "6" .
      rorder:noise07 rorder:order "7" . rorder:noise08 rorder:order "8" .
      rorder:noise09 rorder:order "9" . rorder:noise10 rorder:order "10" .
      rorder:noise11 rorder:order "11" . rorder:noise12 rorder:order "12" .
      rorder:noise13 rorder:order "13" . rorder:noise14 rorder:order "14" .
      rorder:noise15 rorder:order "15" . rorder:noise16 rorder:order "16" .
      rorder:noise17 rorder:order "17" . rorder:noise18 rorder:order "18" .
      rorder:noise19 rorder:order "19" . rorder:noise20 rorder:order "20" .
      rorder:noise21 rorder:order "21" . rorder:noise22 rorder:order "22" .
      rorder:noise23 rorder:order "23" . rorder:noise24 rorder:order "24" .
      rorder:noise25 rorder:order "25" . rorder:noise26 rorder:order "26" .
      rorder:noise27 rorder:order "27" . rorder:noise28 rorder:order "28" .
      rorder:noise29 rorder:order "29" . rorder:noise30 rorder:order "30" .
      rorder:noise31 rorder:order "31" . rorder:noise32 rorder:order "32" .
      rorder:noise33 rorder:order "33" . rorder:noise34 rorder:order "34" .
      rorder:noise35 rorder:order "35" . rorder:noise36 rorder:order "36" .
      rorder:noise37 rorder:order "37" . rorder:noise38 rorder:order "38" .
      rorder:noise39 rorder:order "39" . rorder:noise40 rorder:order "40" .
      rorder:noise41 rorder:order "41" . rorder:noise42 rorder:order "42" .
      rorder:noise43 rorder:order "43" . rorder:noise44 rorder:order "44" .
      rorder:noise45 rorder:order "45" . rorder:noise46 rorder:order "46" .
      rorder:noise47 rorder:order "47" . rorder:noise48 rorder:order "48" .
    sparql: |
      @prefix rorder: <http://rdfcov/order-join/> .
      SELECT ?child ?order WHERE {
        rorder:parent rorder:child ?child .
        ?child rorder:order ?order
      } ORDER BY ?order
    expect:
      rows: 2
      data:
        - {"?child": "http://rdfcov/order-join/first", "?order": "10"}
        - {"?child": "http://rdfcov/order-join/second", "?order": "20"}

cleanup:
  - sql: "DROP TABLE IF EXISTS rdf"
