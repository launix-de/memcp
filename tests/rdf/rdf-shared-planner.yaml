# Architectural contract tests for lowering SPARQL into the common query IR.

metadata:
  version: "1.0"
  description: "SPARQL basic graph patterns use the shared query planner IR"
  isolated: true

setup: []

test_cases:
  - name: "Standalone RDF does not consume an RDFHP block as ORDER BY"
    scm: |
      (rdf_select "SELECT ?child WHERE { ?parent child ?child } ORDER BY ?child BEGIN")
    expect:
      error: true

  - name: "Basic graph pattern lowers to query-block with relational modifiers"
    scm: |
      (begin
        (define fail (lambda (msg) (error (concat "rdf shared planner: " msg))))
        (define parsed (rdf_query
          "SELECT ?s, ?name WHERE { ?s a Person . ?s name ?name } ORDER BY ?name LIMIT 1"))
        (define ast (rdf_shared_query_ast "memcp-tests" parsed '()))
        (if (not (equal? (car ast) (quote query-block))) (fail "not a query-block"))
        (define input (source_relation (car (qb_sources ast))))
        (if (not (query_block? input)) (fail "BGP input is not a shared query-block"))
        (if (not (equal? (count (qb_sources input)) 2)) (fail "triple patterns not mapped to two sources"))
        (if (not (equal? (qb_limit ast) 1)) (fail "LIMIT missing from query-block"))
        (if (not (equal? (count (qb_order ast)) 1)) (fail "ORDER BY missing from query-block"))
        (if (not (rdf_contains (concat (qb_where input)) "equal??")) (fail "join predicate missing"))
        true)

  - name: "Embedded RDF query plans resolve caller prefix definitions"
    scm: |
      (begin
        (rdf_ensure_table "memcp-tests")
        (define definitions (newsession))
        (definitions "rdfop" "https://launix.de/rdfop/schema#")
        (define query (rdf_query
          "SELECT ?type WHERE { ?type rdfop:paletteVisible true }"))
        (define planning_session (newsession))
        (define tx (session "__memcp_tx"))
        (define formula (rdf_queryplan "memcp-tests" query definitions '()
          (lambda (_cols _ctx) true)))
        (define rendered (concat formula))
        (if (rdf_contains rendered "(definitions rdfop)")
          (error "rdf shared planner: unresolved caller prefix reached physical plan"))
        (if (not (rdf_contains rendered "https://launix.de/rdfop/schema#paletteVisible"))
          (error "rdf shared planner: resolved caller prefix missing from physical plan"))
        true)

  - name: "Nested RDF query plans retain outer row bindings"
    scm: |
      (begin
        (rdf_ensure_table "memcp-tests")
        (rdf_insert_triples "memcp-tests" (list
          (list "urn:test:nested-outer" "urn:test:label" "Outer label")
          (list "urn:test:nested-inner" "urn:test:value" "Inner value")))
        (define captured (newsession))
        (define definitions (newsession))
        (define outer_query (rdf_query
          "SELECT ?label WHERE { <urn:test:nested-outer> <urn:test:label> ?label }"))
        (define inner_query (rdf_query
          "SELECT ?inner WHERE { <urn:test:nested-inner> <urn:test:value> ?inner }"))
        (define resultrow (lambda (_row) true))
        (eval (rdf_queryplan "memcp-tests" outer_query definitions '()
          (lambda (_outer_cols outer_ctx)
            (rdf_queryplan "memcp-tests" inner_query definitions outer_ctx
              (lambda (_inner_cols _inner_ctx)
                (list (quote captured) "label" (get_assoc outer_ctx "?label")))))))
        (if (equal? (captured "label") "Outer label") true
          (error "nested RDF query plan shadowed its outer row binding")))

  - name: "Algebra markers are not mistaken for triple patterns"
    scm: |
      (begin
        (define parsed (rdf_query "SELECT ?x WHERE { BIND(\"hello\" AS ?x) }"))
        (define ast (rdf_shared_query_ast "memcp-tests" parsed '()))
        (if (not (equal? (car ast) (quote query-block)))
          (error "rdf shared planner: BIND did not lower to query-block"))
        true)

  - name: "FILTER joins the BGP predicate in shared query-block WHERE"
    scm: |
      (begin
        (define parsed (rdf_query
          "SELECT ?s WHERE { FILTER(?v = \"keep\") ?s value ?v }"))
        (define ast (rdf_shared_query_ast "memcp-tests" parsed '()))
        (if (not (equal? (car ast) (quote query-block)))
          (error "rdf shared planner: FILTER did not lower to query-block"))
        (define input (source_relation (car (qb_sources ast))))
        (if (not (rdf_contains (concat (qb_where input)) "equal??"))
          (error "rdf shared planner: FILTER missing from WHERE"))
        true)

  - name: "LIMIT is owned by the common physical scan"
    scm: |
      (begin
        (rdf_ensure_table "memcp-tests")
        (define formula (parse_sparql "memcp-tests"
          "SELECT ?subject WHERE { ?subject value ?value } LIMIT 1"
          nil (newsession) (session "__memcp_tx")))
        (define rendered (concat formula))
        (if (not (rdf_contains rendered "scan_order"))
          (error "rdf shared planner: LIMIT did not lower to scan_order"))
        (if (rdf_contains rendered "rdf_legacy")
          (error "rdf shared planner: legacy fallback survived compilation"))
        true)

  - name: "EXISTS is decorrelated before physical lowering"
    scm: |
      (begin
        (rdf_ensure_table "memcp-tests")
        (define formula (parse_sparql "memcp-tests"
          "SELECT ?subject WHERE { ?subject value ?value FILTER EXISTS { ?subject flag yes } }"
          nil (newsession) (session "__memcp_tx")))
        (define rendered (concat formula))
        (if (rdf_contains rendered "inner_select")
          (error "rdf shared planner: correlated EXISTS survived untangle_query"))
        (if (rdf_contains rendered "dependent-subquery")
          (error "rdf shared planner: dependent subquery fallback survived"))
        true)

cleanup: []
