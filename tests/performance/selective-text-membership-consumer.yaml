metadata:
  version: "1.0"
  description: "Selective indexed text preparation and bounded ACL consumption"
  perf_ci: true
  performance_rows: 100000
  max_regression_pct: 20

fixture_setup: &stmc_fixture
  - sql: "DROP TABLE IF EXISTS stmc_document"
  - sql: "DROP TABLE IF EXISTS stmc_file"
  - sql: "DROP TABLE IF EXISTS stmc_acl"
  - sql: "CREATE TABLE stmc_file (id INT PRIMARY KEY, name TEXT, body TEXT) ENGINE=memory"
  - sql: |
      CREATE TABLE stmc_document (
        id INT PRIMARY KEY, file_id INT, rank_value INT, domain_id INT,
        value01 INT, value02 INT, value03 INT, value04 INT,
        value05 INT, value06 INT, value07 INT, value08 INT,
        value09 INT, value10 INT, value11 INT, value12 INT,
        value13 INT, value14 INT, value15 INT, value16 INT
      ) ENGINE=memory
  # Imported read models do not always declare generated identifiers UNIQUE.
  # That prevents an ordered batch from assuming a 0:1 downstream join.
  - sql: "CREATE TABLE stmc_acl (id INT, allowed INT) ENGINE=memory"
  - scm: |
      (begin
        (define file_count 50000)
        (insert (table "memcp-tests" "stmc_file") '("id" "name" "body")
          (map (produceN file_count) (lambda (i)
            (list i "file" (concat
              (if (< i 5000) "needle" "unrelated")
              (string_repeat "padding-" 512))))))
        (insert (table "memcp-tests" "stmc_document")
          '("id" "file_id" "rank_value" "domain_id"
            "value01" "value02" "value03" "value04"
            "value05" "value06" "value07" "value08"
            "value09" "value10" "value11" "value12"
            "value13" "value14" "value15" "value16")
          (map (produceN 100000) (lambda (i)
            (list i (mod i file_count) i (mod i 16)
              i i i i i i i i i i i i i i i i))))
        (insert (table "memcp-tests" "stmc_acl") '("id" "allowed")
          (map (produceN 16) (lambda (i) (list i (mod i 2)))))
        (rebuild (table "memcp-tests" "stmc_file") true false)
        (rebuild (table "memcp-tests" "stmc_document") true false)
        (rebuild (table "memcp-tests" "stmc_acl") true false))
  - sql: "SELECT COUNT(*) FROM stmc_file WHERE body LIKE '%needle%'"
  - sql: "SELECT COUNT(*) FROM stmc_file WHERE body LIKE '%needle%'"
  # Exercise ordinary adaptive-index activation before measuring the page.
  # No forced carrier or test-only index construction is involved.
  - sql: &stmc_perf_query |
      SELECT d.*, label.allowed FROM stmc_document d
      LEFT JOIN stmc_acl label ON label.id = d.domain_id
      LEFT JOIN stmc_acl gate1 ON gate1.id = d.domain_id
      LEFT JOIN stmc_acl gate2 ON gate2.id = d.domain_id
      LEFT JOIN stmc_acl gate3 ON gate3.id = d.domain_id
      LEFT JOIN stmc_acl gate4 ON gate4.id = d.domain_id
      LEFT JOIN stmc_acl gate5 ON gate5.id = d.domain_id
      LEFT JOIN stmc_acl gate6 ON gate6.id = d.domain_id
      LEFT JOIN stmc_acl gate7 ON gate7.id = d.domain_id
      LEFT JOIN stmc_acl gate8 ON gate8.id = d.domain_id
      WHERE d.file_id IN (
        SELECT id FROM stmc_file WHERE name LIKE '%needle%'
        UNION SELECT id FROM stmc_file WHERE body LIKE '%needle%'
      ) AND label.allowed = 1
        AND gate1.allowed = 1 AND gate2.allowed = 1
        AND gate3.allowed = 1 AND gate4.allowed = 1
        AND gate5.allowed = 1 AND gate6.allowed = 1
        AND gate7.allowed = 1 AND gate8.allowed = 1
      ORDER BY d.rank_value DESC LIMIT 5 OFFSET 2

# Retain the original small fixture and its ordinary SQL-CI coverage. The
# production-shaped fixture above belongs only to the measured case.
setup:
  - sql: "DROP TABLE IF EXISTS stmc_document"
  - sql: "DROP TABLE IF EXISTS stmc_file"
  - sql: "DROP TABLE IF EXISTS stmc_acl"
  - sql: "CREATE TABLE stmc_file (id INT PRIMARY KEY, name TEXT, body TEXT) ENGINE=memory"
  - sql: "CREATE TABLE stmc_document (id INT PRIMARY KEY, file_id INT, rank_value INT, domain_id INT) ENGINE=memory"
  - sql: "CREATE TABLE stmc_acl (id INT PRIMARY KEY, allowed INT) ENGINE=memory"
  - scm: |
      (begin
        (insert (table "memcp-tests" "stmc_file") '("id" "name" "body")
          (map (produceN 6000) (lambda (i)
            (list i "file" (concat
              (if (< i 60) "needle" "unrelated") (string_repeat "padding-" 512))))))
        (insert (table "memcp-tests" "stmc_document") '("id" "file_id" "rank_value" "domain_id")
          (map (produceN 12000) (lambda (i) (list i (mod i 6000) i (mod i 16)))))
        (insert (table "memcp-tests" "stmc_acl") '("id" "allowed")
          (map (produceN 16) (lambda (i) (list i (mod i 2)))))
        (rebuild (table "memcp-tests" "stmc_file") true false)
        (rebuild (table "memcp-tests" "stmc_document") true false)
        (rebuild (table "memcp-tests" "stmc_acl") true false))
  - sql: "SELECT COUNT(*) FROM stmc_file WHERE body LIKE '%needle%'"
  - sql: "SELECT COUNT(*) FROM stmc_file WHERE body LIKE '%needle%'"
  # Exercise the ordinary adaptive-index activation before checking its work
  # facts. No forced carrier or test-only index construction is involved.
  - sql: &stmc_query |
      SELECT d.id, label.allowed FROM stmc_document d
      LEFT JOIN stmc_acl label ON label.id = d.domain_id
      WHERE d.file_id IN (
        SELECT id FROM stmc_file WHERE name LIKE '%needle%'
        UNION SELECT id FROM stmc_file WHERE body LIKE '%needle%'
      ) AND EXISTS (SELECT 1 FROM stmc_acl a WHERE a.id = d.domain_id AND a.allowed = 1)
      ORDER BY d.rank_value DESC LIMIT 5 OFFSET 2
  - sql: *stmc_query
  - sql: *stmc_query

cleanup:
  - sql: "DROP TABLE IF EXISTS stmc_document"
  - sql: "DROP TABLE IF EXISTS stmc_file"
  - sql: "DROP TABLE IF EXISTS stmc_acl"

test_cases:
  - name: "Selective text and rejecting ACL return the exact ordered page"
    performance_rows: 12000
    warmup: 3
    timing_samples: 9
    threshold_ms: 5000
    sql: *stmc_query
    expect:
      data: [{id: 6055, allowed: 1}, {id: 6053, allowed: 1}, {id: 6051, allowed: 1}, {id: 6049, allowed: 1}, {id: 6047, allowed: 1}]

  - name: "Unbounded text membership counts every ACL survivor"
    sql: |
      SELECT COUNT(*) AS n FROM stmc_document d
      WHERE d.file_id IN (
        SELECT id FROM stmc_file WHERE name LIKE '%needle%'
        UNION SELECT id FROM stmc_file WHERE body LIKE '%needle%'
      ) AND EXISTS (SELECT 1 FROM stmc_acl a WHERE a.id = d.domain_id AND a.allowed = 1)
    expect:
      data: [{n: 60}]

  - name: "Perf: wide bounded text membership with lookup chain"
    setup: *stmc_fixture
    # Measure the initial carrier/index construction together with subsequent
    # requests. A plan may not hide an expensive cold start behind warm medians.
    warmup: 0
    timing_samples: 6
    timing_aggregation: total
    threshold_ms: 5000
    sql: *stmc_perf_query
    expect:
      rows: 5
