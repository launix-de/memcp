metadata:
  # Keep this suite alone: its complete seven-pair verification is expensive.
  performance_shard_weight: 480
  version: '1.0'
  description: Selective dimension drives composite-key fact joins before grouped aggregation
  isolated: true
  performance_rows: 8192
  max_regression_pct: 20
  physical_calibration: true
  cache_state: warm_operator_state
  compile_state: cached_plan_execution_only
setup:
  - sql: DROP TABLE IF EXISTS ja_probe_fact
  - sql: DROP TABLE IF EXISTS ja_probe_keys
  - sql: CREATE TABLE ja_probe_fact (id INT PRIMARY KEY, bucket INT, value INT) ENGINE=memory
  - sql: CREATE TABLE ja_probe_keys (id INT, bucket INT) ENGINE=memory
  - sql: INSERT INTO ja_probe_keys VALUES (42000,0),(90000,0),(175000,0),(245000,0)
  # Six production-size shards; do not change ShardSize for this fixture.
  - scm: |-
      (begin
        (insert (table "memcp-tests" false "ja_probe_fact" false nil) '("id" "bucket" "value")
          (map (produceN 360000) (lambda (i) (list i (mod i 4) (+ i 1)))))
        (rebuild true false)
        true)
  - sql: DROP TABLE IF EXISTS ja_lineitem
  - sql: DROP TABLE IF EXISTS ja_partsupp
  - sql: DROP TABLE IF EXISTS ja_orders
  - sql: DROP TABLE IF EXISTS ja_part
  - sql: DROP TABLE IF EXISTS ja_supplier
  - sql: DROP TABLE IF EXISTS ja_nation
  - sql: CREATE TABLE ja_part (p_id INT PRIMARY KEY, p_name VARCHAR(32)) ENGINE=memory
  - sql: CREATE TABLE ja_supplier (s_id INT PRIMARY KEY, s_nation INT) ENGINE=memory
  - sql: CREATE TABLE ja_nation (n_id INT PRIMARY KEY, n_name VARCHAR(32)) ENGINE=memory
  - sql: CREATE TABLE ja_partsupp (ps_part INT, ps_supplier INT, ps_cost INT, PRIMARY KEY (ps_part, ps_supplier))
      ENGINE=memory
  - sql: CREATE TABLE ja_orders (o_id INT PRIMARY KEY, o_year INT) ENGINE=memory
  - sql: CREATE TABLE ja_lineitem (l_part INT, l_supplier INT, l_order INT, l_price INT, l_quantity INT) ENGINE=memory
  - scm: |-
      (begin
        (insert (table "memcp-tests" false "ja_part" false nil) '("p_id" "p_name")
          (map (produceN 256) (lambda (i) (list (+ i 1)
            (if (equal? (mod i 8) 0) "green part" "ordinary part")))))
        (insert (table "memcp-tests" false "ja_supplier" false nil) '("s_id" "s_nation")
          (map (produceN 32) (lambda (i) (list (+ i 1) (mod i 4)))))
        (insert (table "memcp-tests" false "ja_nation" false nil) '("n_id" "n_name")
          (map (produceN 4) (lambda (i) (list i (concat "nation" (string i))))))
        (insert (table "memcp-tests" false "ja_partsupp" false nil) '("ps_part" "ps_supplier" "ps_cost")
          (map (produceN 1024) (lambda (i) (begin
            (define part_id (+ 1 (mod i 256)))
            (define supplier_id (+ 1 (mod (+ (- part_id 1) (* 7 (floor (/ i 256)))) 32)))
            (list part_id supplier_id (+ 1 (mod supplier_id 5)))))))
        (insert (table "memcp-tests" false "ja_orders" false nil) '("o_id" "o_year")
          (map (produceN 1024) (lambda (i) (list (+ i 1) (+ 1992 (mod (floor (/ i 32)) 4))))))
        (insert (table "memcp-tests" false "ja_lineitem" false nil) '("l_part" "l_supplier" "l_order" "l_price" "l_quantity")
          (map (produceN 8192) (lambda (i) (begin
            (define part_id (+ 1 (mod i 256)))
            (list part_id (+ 1 (mod (+ (- part_id 1) (* 7 (mod (floor (/ i 256)) 4))) 32))
              (+ 1 (mod i 1024)) (+ 100 (mod i 10)) (+ 1 (mod i 3)))))))
        (rebuild true false)
        true)
test_cases:
  # Sparse probes need 101 requests; the slower dense controls use 11.
  # A/B gates the complete workload, so index startup cannot be hidden by warmup.
  - name: 'Perf: sparse three-table keyed reduction'
    physical_calibration: true
    calibration_decision: scan_join_order
    performance_rows: 360000
    threshold_ms: 10000
    warmup: 0
    timing_samples: 101
    timing_aggregation: total
    sql: |-
      SELECT SUM(b.value) AS total FROM ja_probe_keys k
      JOIN ja_probe_fact b ON b.id=k.id
      JOIN ja_probe_keys k2 ON k2.id=b.id
    expect: {rows: 1, data: [{total: 552004}]}
  - name: 'Perf: dense three-table unique reduction'
    physical_calibration: true
    calibration_decision: scan_join_order
    race: true
    performance_rows: 360000
    threshold_ms: 19600
    warmup: 0
    timing_samples: 11
    timing_aggregation: total
    sql: |-
      SELECT SUM(b.value) AS total FROM ja_probe_fact a
      JOIN ja_probe_fact b ON b.id=a.id
      JOIN ja_probe_fact c ON c.id=b.id
    expect: {rows: 1, data: [{total: 64800180000}]}
  - name: 'Perf: dense three-table nonunique reduction'
    physical_calibration: true
    calibration_decision: scan_join_order
    performance_rows: 360000
    threshold_ms: 6500
    warmup: 0
    timing_samples: 11
    timing_aggregation: total
    sql: |-
      SELECT SUM(b.value) AS total FROM ja_probe_keys k
      JOIN ja_probe_fact b ON b.bucket=k.bucket
      JOIN ja_probe_keys k2 ON k2.id=k.id
    expect: {rows: 1, data: [{total: 64799640000}]}
  - name: 'Perf: selective six-table profit grouping'
    threshold_ms: 60000
    timeout: 60
    warmup: 2
    timing_samples: 5
    sql: |-
      SELECT n.n_name, o.o_year,
        SUM(l.l_price - ps.ps_cost * l.l_quantity) AS profit
      FROM ja_part p, ja_supplier s, ja_lineitem l,
        ja_partsupp ps, ja_orders o, ja_nation n
      WHERE s.s_id = l.l_supplier
        AND ps.ps_supplier = l.l_supplier
        AND ps.ps_part = l.l_part
        AND p.p_id = l.l_part
        AND o.o_id = l.l_order
        AND s.s_nation = n.n_id
        AND p.p_name LIKE '%green%'
      GROUP BY n.n_name, o.o_year
      ORDER BY n.n_name, o.o_year DESC
    expect:
      rows: 16
      data:
        - n_name: nation0
          o_year: 1995
          profit: 6300
        - n_name: nation0
          o_year: 1994
          profit: 6306
        - n_name: nation0
          o_year: 1993
          profit: 6306
        - n_name: nation0
          o_year: 1992
          profit: 6306
        - n_name: nation1
          o_year: 1995
          profit: 6311
        - n_name: nation1
          o_year: 1994
          profit: 6305
        - n_name: nation1
          o_year: 1993
          profit: 6302
        - n_name: nation1
          o_year: 1992
          profit: 6307
        - n_name: nation2
          o_year: 1995
          profit: 6330
        - n_name: nation2
          o_year: 1994
          profit: 6334
        - n_name: nation2
          o_year: 1993
          profit: 6338
        - n_name: nation2
          o_year: 1992
          profit: 6336
        - n_name: nation3
          o_year: 1995
          profit: 6207
        - n_name: nation3
          o_year: 1994
          profit: 6210
        - n_name: nation3
          o_year: 1993
          profit: 6209
        - n_name: nation3
          o_year: 1992
          profit: 6203
  - name: Selective six-table profit grouping preserves all groups
    sql: |-
      SELECT n.n_name, o.o_year,
        SUM(l.l_price - ps.ps_cost * l.l_quantity) AS profit
      FROM ja_part p, ja_supplier s, ja_lineitem l,
        ja_partsupp ps, ja_orders o, ja_nation n
      WHERE s.s_id = l.l_supplier
        AND ps.ps_supplier = l.l_supplier
        AND ps.ps_part = l.l_part
        AND p.p_id = l.l_part
        AND o.o_id = l.l_order
        AND s.s_nation = n.n_id
        AND p.p_name LIKE '%green%'
      GROUP BY n.n_name, o.o_year
      ORDER BY n.n_name, o.o_year DESC
    expect:
      rows: 16
      data:
        - n_name: nation0
          o_year: 1995
          profit: 6300
        - n_name: nation0
          o_year: 1994
          profit: 6306
        - n_name: nation0
          o_year: 1993
          profit: 6306
        - n_name: nation0
          o_year: 1992
          profit: 6306
        - n_name: nation1
          o_year: 1995
          profit: 6311
        - n_name: nation1
          o_year: 1994
          profit: 6305
        - n_name: nation1
          o_year: 1993
          profit: 6302
        - n_name: nation1
          o_year: 1992
          profit: 6307
        - n_name: nation2
          o_year: 1995
          profit: 6330
        - n_name: nation2
          o_year: 1994
          profit: 6334
        - n_name: nation2
          o_year: 1993
          profit: 6338
        - n_name: nation2
          o_year: 1992
          profit: 6336
        - n_name: nation3
          o_year: 1995
          profit: 6207
        - n_name: nation3
          o_year: 1994
          profit: 6210
        - n_name: nation3
          o_year: 1993
          profit: 6209
        - n_name: nation3
          o_year: 1992
          profit: 6203
  - name: Empty dimension filter preserves empty grouped result
    sql: |-
      SELECT n.n_name, o.o_year,
        SUM(l.l_price - ps.ps_cost * l.l_quantity) AS profit
      FROM ja_part p, ja_supplier s, ja_lineitem l,
        ja_partsupp ps, ja_orders o, ja_nation n
      WHERE s.s_id = l.l_supplier
        AND ps.ps_supplier = l.l_supplier
        AND ps.ps_part = l.l_part
        AND p.p_id = l.l_part
        AND o.o_id = l.l_order
        AND s.s_nation = n.n_id
        AND p.p_name LIKE '%absent%'
      GROUP BY n.n_name, o.o_year
      ORDER BY n.n_name, o.o_year DESC
    expect:
      rows: 0
  - name: Sparse reduction alternatives preserve the same result
    sql: |-
      EXPLAIN PHYSICAL CALIBRATE SELECT SUM(b.value) AS total FROM ja_probe_keys k
      JOIN ja_probe_fact b ON b.id=k.id
      JOIN ja_probe_keys k2 ON k2.id=b.id
    expect:
      rows: 2
      data:
        - {plan: nested_scan_tree, decision_site: unordered_join_reduce, result_equal: true}
        - {plan: scan_join_order, decision_site: unordered_join_reduce, result_equal: true}
  - name: Complete composite-key bindings preserve joined aggregate values
    sql: |-
      SELECT SUM(ps.ps_cost) AS total FROM ja_part p
      JOIN ja_partsupp ps ON ps.ps_part=p.p_id
      JOIN ja_supplier s ON s.s_id=ps.ps_supplier
      WHERE p.p_id IN (1,2) AND s.s_id IN (1,8)
    expect: {rows: 1, data: [{total: 6}]}
  - name: Repeated bindings retain multiplicity and ignore NULL and missing keys
    setup:
      - sql: DELETE FROM ja_probe_keys
      - sql: INSERT INTO ja_probe_keys VALUES (42000,0),(42000,0),(175000,0),(999999,0),(NULL,0)
    sql: |-
      SELECT SUM(b.value) AS total FROM ja_probe_keys k
      JOIN ja_probe_fact b ON b.id=k.id
      JOIN ja_probe_keys k2 ON k2.id=b.id
    expect: {rows: 1, data: [{total: 343005}]}
  - name: Selective access retains residual filters and empty SUM semantics
    sql: |-
      SELECT SUM(b.value) AS total FROM ja_probe_keys k
      JOIN ja_probe_fact b ON b.id=k.id
      JOIN ja_probe_keys k2 ON k2.id=b.id WHERE b.value<0
    expect: {rows: 1, data: [{total: null}]}
  - name: Selective join still rejects an unknown mapped column
    sql: |-
      SELECT SUM(b.missing_value) FROM ja_probe_keys k
      JOIN ja_probe_fact b ON b.id=k.id
      JOIN ja_probe_keys k2 ON k2.id=b.id
    expect: {error: true}
cleanup:
  - sql: DROP TABLE IF EXISTS ja_probe_fact
  - sql: DROP TABLE IF EXISTS ja_probe_keys
  - sql: DROP TABLE IF EXISTS ja_lineitem
  - sql: DROP TABLE IF EXISTS ja_partsupp
  - sql: DROP TABLE IF EXISTS ja_orders
  - sql: DROP TABLE IF EXISTS ja_part
  - sql: DROP TABLE IF EXISTS ja_supplier
  - sql: DROP TABLE IF EXISTS ja_nation
