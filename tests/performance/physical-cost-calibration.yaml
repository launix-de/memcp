# Copyright (C) 2026  Carl-Philip Hänsch
#
# Input workload for `make costgen`. CI intentionally skips the repeated
# measurements; ordinary EXPLAIN PHYSICAL CALIBRATE coverage lives in the
# planner suites.

metadata:
  version: "1.0"
  description: "Physical membership cost calibration workload"
  isolated: true
  ci: false
  physical_calibration: true
  cache_state: "warm_operator_state"
  compile_state: "cached_plan_execution_only"

setup:
  # Keep the 100k-row text relation in one authoritative generation. Cold
  # multi-shard statistics are a separate fallback workload and must not be
  # mixed into the known-statistics coefficient fit.
  - scm: '(settings "ShardSize" 125000)'
  - sql: "DROP TABLE IF EXISTS pc_files_small"
  - sql: "DROP TABLE IF EXISTS pc_docs_small"
  - sql: "DROP TABLE IF EXISTS pc_files_large"
  - sql: "DROP TABLE IF EXISTS pc_docs_large"
  - sql: "DROP TABLE IF EXISTS pc_docs_million"
  - sql: "DROP TABLE IF EXISTS pc_doc_meta"
  - sql: "DROP TABLE IF EXISTS pc_acl_domain"
  - sql: "DROP TABLE IF EXISTS pc_acl_assignment"
  - sql: "DROP TABLE IF EXISTS pc_acl_override"
  # String-key membership prevents the target-side prefiltered projection and
  # isolates candidate startup from direct probe work.
  - sql: "DROP TABLE IF EXISTS pc_events"
  - sql: "DROP TABLE IF EXISTS pc_keys"
  # Inline values contribute more than 15 MB of candidate text work while the
  # ordered driver still exercises the production-scale million-row shape. A
  # separate component fixture below covers wider values without turning this
  # carrier benchmark into a blob-filesystem benchmark.
  - sql: "DROP TABLE IF EXISTS pc_files_text"
  # A small-row-count, wide-value fixture separates byte-dependent LIKE/MATCH
  # work from row-dependent scan work without allocating another million rows.
  - sql: "DROP TABLE IF EXISTS pc_files_wide"
  - sql: "CREATE TABLE pc_files_small (id INT PRIMARY KEY, filename VARCHAR(32), search VARCHAR(32), f1 INT, f2 INT, f3 INT, f4 INT, f5 INT, f6 INT, f7 INT, f8 INT)"
  - sql: "CREATE TABLE pc_docs_small (id INT PRIMARY KEY, file_id INT, sort_key INT, p1 INT, p2 INT, p3 INT, p4 INT, p5 INT, p6 INT, p7 INT, p8 INT)"
  - sql: "CREATE TABLE pc_files_large (id INT PRIMARY KEY, filename VARCHAR(32), search VARCHAR(32), f1 INT, f2 INT, f3 INT, f4 INT, f5 INT, f6 INT, f7 INT, f8 INT)"
  - sql: "CREATE TABLE pc_docs_large (id INT PRIMARY KEY, file_id INT, sort_key INT, p1 INT, p2 INT, p3 INT, p4 INT, p5 INT, p6 INT, p7 INT, p8 INT)"
  - sql: "CREATE TABLE pc_docs_million (id INT PRIMARY KEY, file_id INT, sort_key INT, p1 INT) ENGINE=sloppy"
  - sql: "CREATE TABLE pc_doc_meta (id INT PRIMARY KEY, label VARCHAR(32))"
  - sql: "CREATE TABLE pc_acl_domain (id INT PRIMARY KEY, direct_flag INT)"
  - sql: "CREATE TABLE pc_acl_assignment (domain_id INT, actor_id INT, allowed INT)"
  - sql: "CREATE TABLE pc_acl_override (domain_id INT, actor_id INT, allowed INT)"
  - sql: "CREATE TABLE pc_events (id INT PRIMARY KEY, entity_key VARCHAR(32), event_time INT, kind VARCHAR(16))"
  - sql: "CREATE TABLE pc_keys (id INT PRIMARY KEY, enabled INT)"
  - sql: "CREATE TABLE pc_files_text (id INT PRIMARY KEY, filename VARCHAR(255), search VARCHAR(255)) ENGINE=memory"
  - sql: "CREATE TABLE pc_files_wide (id INT PRIMARY KEY, filename VARCHAR(16384), search VARCHAR(16384)) ENGINE=sloppy"
  - scm: |
      (begin
        (define make_files (lambda (n)
          (map (produceN n) (lambda (i)
            (list i
              (if (equal? (mod i 10) 0) "filename-hit" "filename-other")
              (if (equal? (mod i 7) 0) "search-hit" "search-other")
              i i i i i i i i)))))
        (define make_docs (lambda (n file_count)
          (map (produceN n) (lambda (i) (list i (mod i file_count) i i i i i i i i i)))))
        (insert (table "memcp-tests" "pc_files_small") '("id" "filename" "search" "f1" "f2" "f3" "f4" "f5" "f6" "f7" "f8") (make_files 1000))
        (insert (table "memcp-tests" "pc_docs_small") '("id" "file_id" "sort_key" "p1" "p2" "p3" "p4" "p5" "p6" "p7" "p8") (make_docs 4000 1000))
        (insert (table "memcp-tests" "pc_files_large") '("id" "filename" "search" "f1" "f2" "f3" "f4" "f5" "f6" "f7" "f8") (make_files 5000))
        (insert (table "memcp-tests" "pc_docs_large") '("id" "file_id" "sort_key" "p1" "p2" "p3" "p4" "p5" "p6" "p7" "p8") (make_docs 20000 5000))
        (insert (table "memcp-tests" "pc_doc_meta") '("id" "label")
          (map (produceN 5000) (lambda (i) (list i (concat "meta-" (string i))))))
        (insert (table "memcp-tests" "pc_acl_domain") '("id" "direct_flag")
          (map (produceN 5000) (lambda (i) (list i (if (equal? (mod i 11) 0) 1 0)))))
        (insert (table "memcp-tests" "pc_acl_assignment") '("domain_id" "actor_id" "allowed")
          (map (produceN 2500) (lambda (i) (list (* i 2) 7 1))))
        (insert (table "memcp-tests" "pc_acl_override") '("domain_id" "actor_id" "allowed")
          (map (produceN 1667) (lambda (i) (list (* i 3) 7 1))))
        (insert (table "memcp-tests" "pc_events") '("id" "entity_key" "event_time" "kind")
          (map (produceN 10000) (lambda (i)
            (list i (if (>= i 9990) "key:1" (concat "noise:" (string i))) i
              (if (equal? (mod i 2) 0) "root" "leaf")))))
        (insert (table "memcp-tests" "pc_keys") '("id" "enabled")
          (list (list 1 1) (list 2 0))))
  - scm: |
      (insert (table "memcp-tests" "pc_docs_million") '("id" "file_id" "sort_key" "p1")
        (map (produceN 250000) (lambda (i) (list i (mod i 5000) i i))))
  - scm: "(rebuild)"
  - scm: |
      (insert (table "memcp-tests" "pc_files_text") '("id" "filename" "search")
        (map (produceN 100000) (lambda (i)
          (list i
            (concat (if (equal? (mod i 10) 0)
              "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
              "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx") (string i))
            (concat (string_repeat (if (equal? (mod i 7) 0) "c" "x") 96) (string i))))))
  - scm: "(rebuild)"
  - scm: |
      (insert (table "memcp-tests" "pc_docs_million") '("id" "file_id" "sort_key" "p1")
        (map (produceN 250000) (lambda (i)
          (list (+ i 250000) (mod (+ i 250000) 5000) (+ i 250000) (+ i 250000)))))
  - scm: "(rebuild)"
  - scm: |
      (insert (table "memcp-tests" "pc_docs_million") '("id" "file_id" "sort_key" "p1")
        (map (produceN 250000) (lambda (i)
          (list (+ i 500000) (mod (+ i 500000) 5000) (+ i 500000) (+ i 500000)))))
  - scm: "(rebuild)"
  - scm: |
      (insert (table "memcp-tests" "pc_docs_million") '("id" "file_id" "sort_key" "p1")
        (map (produceN 250000) (lambda (i)
          (list (+ i 750000) (mod (+ i 750000) 5000) (+ i 750000) (+ i 750000)))))
  - scm: "(rebuild)"
  - scm: |
      (insert (table "memcp-tests" "pc_files_wide") '("id" "filename" "search")
        (map (produceN 5000) (lambda (i)
          (list i
            (concat (string_repeat (if (equal? (mod i 10) 0) "c" "x") 8192) (string i))
            (concat (string_repeat (if (equal? (mod i 7) 0) "c" "x") 8192) (string i))))))
  - scm: "(rebuild)"

cleanup:
  - sql: "DROP TABLE IF EXISTS pc_files_small"
  - sql: "DROP TABLE IF EXISTS pc_docs_small"
  - sql: "DROP TABLE IF EXISTS pc_files_large"
  - sql: "DROP TABLE IF EXISTS pc_docs_large"
  - sql: "DROP TABLE IF EXISTS pc_docs_million"
  - sql: "DROP TABLE IF EXISTS pc_doc_meta"
  - sql: "DROP TABLE IF EXISTS pc_acl_domain"
  - sql: "DROP TABLE IF EXISTS pc_acl_assignment"
  - sql: "DROP TABLE IF EXISTS pc_acl_override"
  - sql: "DROP TABLE IF EXISTS pc_events"
  - sql: "DROP TABLE IF EXISTS pc_keys"
  - sql: "DROP TABLE IF EXISTS pc_files_text"
  - sql: "DROP TABLE IF EXISTS pc_files_wide"

test_cases:
  - name: "small broad UNION membership"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_small d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_small f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_small f WHERE f.search LIKE '%hit%'
      )

  - name: "large broad UNION membership"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )

  - name: "large high-selectivity UNION membership"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%other%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%other%'
      )

  - name: "large candidates with small driver"
    physical_calibration: true
    calibration_holdout: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_small d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )

  - name: "small candidates with large driver"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_small f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_small f WHERE f.search LIKE '%hit%'
      )

  # A branch-local membership below a highly selective outer predicate makes
  # candidate startup and direct per-probe work independently identifiable.
  # Without this row-count scale the two terms are collinear in broad scans and
  # the fitted model can only describe their large-driver sum.
  - name: "computed-key membership with tiny driver"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT e.id
      FROM pc_events e
      WHERE e.event_time >= 9990
        AND (e.kind = 'root' OR e.entity_key IN (
          SELECT CONCAT('key:', k.id) FROM pc_keys k WHERE k.enabled = 1
        ))

  # Pair the same cache-backed candidate with a larger driver. The two driver
  # cardinalities make fixed group-cache startup and per-row direct probes
  # independently identifiable instead of fitting their combined duration.
  - name: "computed-key membership with medium driver"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT e.id
      FROM pc_events e
      WHERE e.event_time >= 9900
        AND (e.kind = 'root' OR e.entity_key IN (
          SELECT CONCAT('key:', k.id) FROM pc_keys k WHERE k.enabled = 1
        ))

  - name: "selective membership below ordered limit one"
    physical_calibration: true
    calibration_holdout: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )
      ORDER BY d.sort_key
      LIMIT 1

  - name: "ordered membership startup at limit ten"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )
      ORDER BY d.sort_key
      LIMIT 10

  # The production pagination width varies driver and projection work and
  # provides the sixth independent exact observation for the common fit.
  - name: "ordered membership at limit seventy-two"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )
      ORDER BY d.sort_key
      LIMIT 72

  - name: "same candidate column with several predicate operations"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f
        WHERE f.filename LIKE '%hit%' AND f.filename IS NOT NULL AND f.filename <> 'never'
        UNION
        SELECT f.id FROM pc_files_large f
        WHERE f.search LIKE '%hit%' AND f.search IS NOT NULL AND f.search <> 'never'
      )

  - name: "five candidate filter columns"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f
        WHERE f.filename LIKE '%hit%' AND f.f1 >= 0 AND f.f2 >= 0 AND f.f3 >= 0 AND f.f4 >= 0
        UNION
        SELECT f.id FROM pc_files_large f
        WHERE f.search LIKE '%hit%' AND f.f1 >= 0 AND f.f2 >= 0 AND f.f3 >= 0 AND f.f4 >= 0
      )

  - name: "four driver filter columns"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE d.p1 >= 0 AND d.p2 >= 0 AND d.p3 >= 0 AND d.p4 >= 0
        AND d.file_id IN (
          SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
          UNION
          SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
        )

  - name: "wide driver projection"
    physical_calibration: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id, d.p1, d.p2, d.p3, d.p4, d.p5, d.p6, d.p7, d.p8
      FROM pc_docs_large d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )

  - name: "mixed width holdout"
    physical_calibration: true
    calibration_holdout: true
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id, d.p1, d.p2, d.p3
      FROM pc_docs_small d
      WHERE d.p4 >= 0 AND d.p5 >= 0
        AND d.file_id IN (
          SELECT f.id FROM pc_files_large f
          WHERE f.filename LIKE '%hit%' AND f.f1 >= 0 AND f.f2 >= 0
          UNION
          SELECT f.id FROM pc_files_large f
          WHERE f.search LIKE '%hit%' AND f.f1 >= 0 AND f.f2 >= 0
        )

  - name: "million-row four-key ordered membership constraint"
    physical_calibration: true
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    warmup: 0
    repetitions: 7
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_million d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  - name: "million-row membership count constraint"
    physical_calibration: true
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    warmup: 0
    repetitions: 1
    sql: |
      SELECT COUNT(*)
      FROM pc_docs_million d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )

  - name: "production-scale broad text ordered membership"
    physical_calibration: true
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    expected_broad_text_bytes: 15000000
    warmup: 0
    repetitions: 1
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_million d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_text f WHERE f.filename LIKE '%c%'
        UNION
        SELECT f.id FROM pc_files_text f
        WHERE MATCH(f.search) AGAINST ('c' IN NATURAL LANGUAGE MODE)
      )
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  - name: "production-scale adaptive ordered batch filter"
    physical_calibration: true
    calibration_decision: "membership_carrier"
    calibration_holdout: true
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    expected_broad_text_bytes: 15000000
    warmup: 0
    repetitions: 1
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_million d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_text f WHERE f.filename LIKE '%c%'
        UNION
        SELECT f.id FROM pc_files_text f
        WHERE MATCH(f.search) AGAINST ('c' IN NATURAL LANGUAGE MODE)
      )
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  # Exercise the exact emitted pipeline behind the ordered-batch alternative:
  # candidate membership first, then the remaining driver predicate on the
  # reduced RecSet. This keeps the downstream-work coefficient identifiable
  # instead of training only queries whose residual condition is TRUE.
  - name: "production-scale adaptive batch with residual predicate"
    physical_calibration: true
    calibration_decision: "membership_carrier"
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    expected_broad_text_bytes: 15000000
    warmup: 0
    repetitions: 1
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_million d
      WHERE d.p1 >= 0
        AND d.file_id IN (
          SELECT f.id FROM pc_files_text f WHERE f.filename LIKE '%c%'
          UNION
          SELECT f.id FROM pc_files_text f
          WHERE MATCH(f.search) AGAINST ('c' IN NATURAL LANGUAGE MODE)
        )
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  - name: "ordered batch with unique late projection"
    physical_calibration: true
    calibration_decision: "membership_carrier"
    warmup: 1
    repetitions: 5
    sql: |
      SELECT d.id, m.label
      FROM pc_docs_large d
      LEFT JOIN pc_doc_meta m ON m.id = d.file_id
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.search LIKE '%hit%'
      )
      ORDER BY d.sort_key, d.id
      LIMIT 72

  # A uniformly distributed selective equality models tenant/location filters
  # without making a random one-shard estimate depend on which range shard was
  # sampled. The physical winner should narrow the driver before text/ACL work.
  - name: "production-scale prefiltered membership carrier"
    physical_calibration: true
    calibration_decision: "membership_carrier"
    calibration_holdout: true
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    expected_broad_text_bytes: 15000000
    warmup: 0
    repetitions: 1
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_million d
      WHERE d.file_id = 4999
        AND d.file_id IN (
          SELECT f.id FROM pc_files_text f WHERE f.filename LIKE '%c%'
          UNION
          SELECT f.id FROM pc_files_text f
          WHERE MATCH(f.search) AGAINST ('c' IN NATURAL LANGUAGE MODE)
        )
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  - name: "wide-value broad text ordered membership"
    physical_calibration: true
    calibration_component: "broad_text_bytes"
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    expected_broad_text_bytes: 10000000
    warmup: 0
    repetitions: 1
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_million d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_wide f WHERE f.filename LIKE '%c%'
        UNION
        SELECT f.id FROM pc_files_wide f
        WHERE MATCH(f.search) AGAINST ('c' IN NATURAL LANGUAGE MODE)
      )
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  # A tiny exact candidate set must remain eligible to drive the ordered scan.
  # This holdout prevents a coefficient learned from broad/compound consumers
  # from turning the cost model into an unconditional base-table preference.
  - name: "production-scale tiny ordered membership holdout"
    physical_calibration: true
    calibration_decision: "membership_carrier"
    calibration_holdout: true
    race: true
    race_grace: 0.5
    cache_state: "cold_operator_state_race"
    compile_state: "variant_compile_and_execute"
    expected_driver_input_rows: 1000000
    warmup: 0
    repetitions: 1
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_million d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_large f WHERE f.id = 4999
        UNION
        SELECT f.id FROM pc_files_large f WHERE f.id = -1
      )
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  # Reproduce the complete expensive suffix rather than calibrating membership
  # in isolation. The candidate-vs-ordered-driver inequality must include the
  # compound scalar/EXISTS work which follows the projected search RecSet.
  - name: "ordered membership with compound ACL suffix"
    physical_calibration: true
    calibration_decision: "membership_carrier"
    cache_state: "warm_operator_state"
    compile_state: "cached_plan_execution_only"
    expected_driver_input_rows: 4000
    warmup: 1
    repetitions: 3
    sql: |
      SELECT d.id, d.p1
      FROM pc_docs_small d
      WHERE d.file_id IN (
        SELECT f.id FROM pc_files_small f WHERE f.filename LIKE '%hit%'
        UNION
        SELECT f.id FROM pc_files_small f WHERE f.search LIKE '%hit%'
      )
        AND COALESCE((
          SELECT CASE WHEN acl.direct_flag = 1 THEN TRUE ELSE (
            EXISTS (
              SELECT TRUE
              FROM pc_acl_assignment assignment
              WHERE assignment.domain_id = acl.id
                AND assignment.actor_id = 7
                AND assignment.allowed = 1
              LIMIT 1
            ) OR COALESCE((
              SELECT override.allowed
              FROM pc_acl_override override
              WHERE override.domain_id = acl.id
                AND override.actor_id = 7
              LIMIT 1
            ), FALSE)
          ) END
          FROM pc_acl_domain acl
          WHERE acl.id = d.file_id
          LIMIT 1
        ), FALSE)
      ORDER BY d.sort_key, d.p1, d.id, d.file_id
      LIMIT 72

  # The scalar stage is intentionally broad: its exact RecSet is cheaper to
  # consume by walking the ordered document index and probing membership than
  # by sorting the carrier. A separate decision family validates that crossover
  # without feeding the shared carrier-production work back into its coefficient
  # fit.
  - name: "ordered scalar RecSet consumer crossover"
    physical_calibration: true
    calibration_decision: "ordered_recset_consumer"
    warmup: 1
    repetitions: 3
    sql: |
      SELECT d.id
      FROM pc_docs_large d
      WHERE COALESCE((
        SELECT f.id < 4500
        FROM pc_files_large f
        WHERE f.id = d.file_id
        LIMIT 1
      ), FALSE)
      ORDER BY d.sort_key, d.id
      LIMIT 72
