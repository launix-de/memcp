metadata:
  version: '1.0'
  description: Historical scalar lookup with an upper bound from another correlated history lookup
  isolated: true
setup:
- sql: CREATE TABLE nested_metric_entity (id INT PRIMARY KEY)
- sql: CREATE TABLE nested_metric_history (parent_id INT, valid_at INT, started_at INT, category_id INT, amount INT)
- sql: CREATE TABLE nested_metric_catalog (id INT PRIMARY KEY, kind INT)
- sql: INSERT INTO nested_metric_catalog VALUES (1,1),(2,2)
- scm: |
    (begin
      (insert (table "memcp-tests" "nested_metric_entity") '("id")
        (map (produceN 2048) (lambda (i) (list (+ i 1)))))
      (insert (table "memcp-tests" "nested_metric_history") '("parent_id" "valid_at" "started_at" "category_id" "amount")
        (merge (map (produceN 2048) (lambda (i) (list
          (list (+ i 1) 10 (+ 10 (* 12 (mod i 2))) (+ 1 (mod i 2)) 1)
          (list (+ i 1) 20 (+ 10 (* 12 (mod i 2))) 2 3)))))))
test_cases:
- name: Nested upper bound keeps each entity's history domain
  sql: |
    SELECT p.n, COALESCE((SELECT SUM((SELECT h.amount FROM nested_metric_history h
      WHERE h.parent_id=e.id AND h.valid_at<=p.until_time ORDER BY h.valid_at DESC LIMIT 1))
      FROM nested_metric_entity e WHERE
      (SELECT c.kind FROM nested_metric_catalog c WHERE c.id=(SELECT h.category_id
        FROM nested_metric_history h WHERE h.parent_id=e.id AND h.valid_at<=LEAST(p.until_time,
          (SELECT h2.started_at FROM nested_metric_history h2 WHERE h2.parent_id=e.id
           AND h2.valid_at<=p.until_time ORDER BY h2.valid_at DESC LIMIT 1)+1)
        ORDER BY h.valid_at DESC LIMIT 1) LIMIT 1)=1),0) AS total
      FROM (SELECT 1 AS n,15 AS until_time UNION ALL SELECT 2,25) p ORDER BY p.n
  expect:
    data:
    - n: 1
      total: 1024
    - n: 2
      total: 3072
  performance_rows: 4096
  warmup: 0
  timing_samples: 1
  threshold_ms: 1000
cleanup:
- sql: DROP TABLE nested_metric_history
- sql: DROP TABLE nested_metric_entity
- sql: DROP TABLE nested_metric_catalog
