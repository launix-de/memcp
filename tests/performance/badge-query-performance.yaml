# Regression: badge/count queries with correlated session subselects
# must complete in reasonable time (<500ms).

metadata:
  performance_shard_weight: 2
  version: "1.0"
  description: "Badge count queries with session-filtered correlated subselects"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS bp_doc"
  - sql: "DROP TABLE IF EXISTS bp_doctype"
  - sql: "DROP TABLE IF EXISTS bp_user"
  - sql: "DROP TABLE IF EXISTS bp_userconfig"
  - sql: |
      CREATE TABLE bp_user (ID INT PRIMARY KEY, vorname VARCHAR(50), nachname VARCHAR(50), superadmin INT DEFAULT 0, archive INT DEFAULT 0)
  - sql: |
      CREATE TABLE bp_userconfig (ID INT PRIMARY KEY, default_doctype INT)
  - sql: |
      CREATE TABLE bp_doctype (ID INT PRIMARY KEY, name VARCHAR(50), hasReminder INT DEFAULT 0, capabilityRead INT)
  - sql: |
      CREATE TABLE bp_doc (ID INT PRIMARY KEY AUTO_INCREMENT, type INT, archive INT DEFAULT 0)
  - sql: |
      INSERT INTO bp_user VALUES (1, 'Alice', 'Admin', 0, 0)
  - sql: |
      INSERT INTO bp_userconfig VALUES (1, 1)
  - sql: |
      INSERT INTO bp_doctype VALUES (1, 'Invoice', 1, NULL), (2, 'Letter', 0, NULL)
  - sql: |
      INSERT INTO bp_doc (type, archive) VALUES (1, 0), (1, 0), (1, 1), (2, 0), (2, 0)

cleanup:
  - sql: "DROP TABLE IF EXISTS bp_doc"
  - sql: "DROP TABLE IF EXISTS bp_doctype"
  - sql: "DROP TABLE IF EXISTS bp_userconfig"
  - sql: "DROP TABLE IF EXISTS bp_user"

test_cases:
  - name: "set session"
    session_id: "bp_sess"
    sql: "SET @fop_user = 1"
    expect:
      rows_affected: 0

  - &badge_count
    name: "badge count with correlated session subselect"
    session_id: "bp_sess"
    # Failure-only inspection of the two mapped compiler frames. This does not
    # prepare or warm the measured query and changes no result/timing oracle.
    on_fail:
      - scm: (serialize (close_procedure correlation_inner_keys))
      - scm: (serialize (close_procedure decorrelate_expr_with_pairs))
      - scm: |
          (try (lambda () (list "direct keys"
            (correlation_inner_keys (symbol "")
              (list (list (list 'get_column "inside" false "id" false)
                (list 'get_column "outside" false "id" false)))))))
            (lambda (failure) (list "direct keys failure" (concat failure))))
      - scm: |
          (try (lambda () (list "direct rewrite"
            (decorrelate_expr_with_pairs (symbol "")
              (list (list (list 'get_column "inside" false "id" false)
                (list 'get_column "outside" false "id" false)))
              (list 'get_column "outside" false "id" false))))
            (lambda (failure) (list "direct rewrite failure" (concat failure))))
      - scm: |
          (try (lambda () (list "direct domain producer"
            (domain_correlation_pairs_with_outer_refs
              (list
                (list (list 'get_column "inside" false "id" false)
                  (list 'get_column "outside" false "id" false))
                (list (list 'get_column "inside" false "other" false)
                  (list 'get_column "outside" false "other" false))) '())))
            (lambda (failure) (list "direct domain producer failure" (concat failure))))
      - scm: |
          (try (lambda () (begin
            (define operation (jit (eval (optimize (scheme
              "(lambda (left right refs) (domain_correlation_pairs_with_outer_refs (merge (list left right)) refs))")))))
            (list "compiled domain producer" (jit? operation)
              (operation
                (list (list (list 'get_column "inside" false "id" false)
                  (list 'get_column "outside" false "id" false)))
                (list (list (list 'get_column "inside" false "other" false)
                  (list 'get_column "outside" false "other" false))) '()))))
            (lambda (failure) (list "compiled domain producer failure" (concat failure))))
      - scm: |
          (try (lambda () (begin
            (define operation (jit (eval (optimize (scheme
              "(lambda (left right) (begin (define produced (merge (list (map left (lambda (item) (+ item 1))) (map right (lambda (item) (+ item 10)))))) (define before produced) (define produced (merge (list produced (list 99)))) (list before produced)))")))))
            (list "named producer" (jit? operation) (operation (list 1 2) (list 3 4)))))
            (lambda (failure) (list "named producer failure" (concat failure))))
    sql: |
      SELECT 1,
        (SELECT COUNT(1) FROM bp_doc d
         WHERE TRUE
           AND (((SELECT default_doctype FROM bp_userconfig WHERE ID = 1 LIMIT 1) IS NULL AND d.type IS NULL)
                OR d.type = (SELECT default_doctype FROM bp_userconfig WHERE ID = 1 LIMIT 1))
           AND NOT d.archive
         LIMIT 1) AS badgeDoc
    expect:
      rows: 1
      data:
        - "1": 1
          badgeDoc: 2

  - &badge_types
    name: "docType list with permission subselects"
    session_id: "bp_sess"
    sql: |
      SELECT dt.ID, dt.name,
        (SELECT COUNT(*) FROM bp_doc WHERE type = dt.ID AND NOT archive) AS doc_count
      FROM bp_doctype dt
      WHERE dt.hasReminder = 1
      ORDER BY dt.name
    expect:
      rows: 1
      data:
        - ID: 1
          name: "Invoice"
          doc_count: 2

  - name: "badge count warm (second run, must be fast)"
    session_id: "bp_sess"
    sql: |
      SELECT 1,
        (SELECT COUNT(1) FROM bp_doc d
         WHERE TRUE
           AND (((SELECT default_doctype FROM bp_userconfig WHERE ID = 1 LIMIT 1) IS NULL AND d.type IS NULL)
                OR d.type = (SELECT default_doctype FROM bp_userconfig WHERE ID = 1 LIMIT 1))
           AND NOT d.archive
         LIMIT 1) AS badgeDoc
    expect:
      rows: 1
      data:
        - "1": 1
          badgeDoc: 2

  # Keep the original correctness/plan-size gates, and ADD measured copies.
  # Turning the originals into performance cases would exempt those gates.
  - <<: *badge_count
    name: "Perf: cached badge count with correlated session subselect"
    threshold_ms: 500

  - <<: *badge_types
    name: "Perf: cached type list with permission subselects"
    threshold_ms: 500
