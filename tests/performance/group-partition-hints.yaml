metadata:
  performance_shard_weight: 22
  version: '1.0'
  description: 'Source-derived group partition initialization shares a Cartesian shard budget'
  isolated: true

setup:
  - sql: DROP TABLE IF EXISTS partition_hint_source
  - sql: DROP TABLE IF EXISTS partition_hint_diagonal
  - sql: DROP TABLE IF EXISTS partition_hint_uniform
  - sql: DROP TABLE IF EXISTS partition_hint_oversized
  - sql: CREATE TABLE partition_hint_source (id INT, event_time INT, a INT, b INT, c INT) ENGINE=memory
  - sql: CREATE TABLE partition_hint_diagonal (k0 INT, k1 INT) ENGINE=memory
  - sql: CREATE TABLE partition_hint_uniform (k0 INT, k1 INT, k2 INT) ENGINE=memory
  - sql: CREATE TABLE partition_hint_oversized (k0 INT, k1 INT, k2 INT) ENGINE=memory
  - scm: |
      (begin
        (insert (table "memcp-tests" false "partition_hint_source" false) '("id" "event_time" "a" "b" "c")
          (map (produceN 60000) (lambda (i)
            (list i (+ 1700000000 i) (mod i 40) (mod (floor (/ i 40)) 40) (floor (/ i 1600))))))
        (rebuild (table "memcp-tests" false "partition_hint_source" false)) true)

test_cases:
  - name: Correlated ID and time group initialization
    # Eleven fresh targets retain the original first cold initialization.
    # Existing targets would be warm no-ops and must return false, failing
    # the complete result vector. Keep zero warmups and the same total budget.
    performance_rows: 60000
    warmup: 0
    timing_samples: 1
    timing_aggregation: total
    threshold_ms: 3000
    timeout: 30
    setup:
      - scm: '(settings "ShardSize" 12000)'
      - scm: |
          (map (produceN 10) (lambda (i)
            (createtable "memcp-tests" (concat "partition_hint_diagonal_cold_" (+ i 1))
              (map '("k0" "k1") (lambda (key)
                (list "column" key "INT" '() '())))
              '("engine" "memory") false)))
    scm: |
      (begin
        (define cold_results
          (map (produceN 11) (lambda (i)
            (eval (group_cache_partition_plan "memcp-tests" "partition_hint_source" "s"
              '("s" "memcp-tests" "partition_hint_source" false true)
              (if (equal? i 0) "partition_hint_diagonal" (concat "partition_hint_diagonal_cold_" i))
              (list (list 'get_column "s" false "id" false) (list 'get_column "s" false "event_time" false))
              '("k0" "k1")))
          )))
        (if (equal? cold_results '(true true true true true true true true true true true))
          true (error "cold group initialization reused or failed a target")))
    expect: {data: [true]}

  - name: Independent three-dimensional group initialization
    # Eleven fresh targets retain the original first cold initialization.
    # Existing targets would be warm no-ops and must return false, failing
    # the complete result vector. Keep zero warmups and the same total budget.
    performance_rows: 60000
    warmup: 0
    timing_samples: 1
    timing_aggregation: total
    threshold_ms: 3000
    timeout: 30
    setup:
      - scm: '(settings "ShardSize" 12000)'
      - scm: |
          (map (produceN 10) (lambda (i)
            (createtable "memcp-tests" (concat "partition_hint_uniform_cold_" (+ i 1))
              (map '("k0" "k1" "k2") (lambda (key)
                (list "column" key "INT" '() '())))
              '("engine" "memory") false)))
    scm: |
      (begin
        (define cold_results
          (map (produceN 11) (lambda (i)
            (eval (group_cache_partition_plan "memcp-tests" "partition_hint_source" "s"
              '("s" "memcp-tests" "partition_hint_source" false true)
              (if (equal? i 0) "partition_hint_uniform" (concat "partition_hint_uniform_cold_" i))
              (list (list 'get_column "s" false "a" false) (list 'get_column "s" false "b" false) (list 'get_column "s" false "c" false))
              '("k0" "k1" "k2")))
          )))
        (if (equal? cold_results '(true true true true true true true true true true true))
          true (error "cold group initialization reused or failed a target")))
    expect: {data: [true]}

  - name: Oversized three-dimensional group initialization
    # Eleven fresh targets retain the original first cold initialization.
    # Existing targets would be warm no-ops and must return false, failing
    # the complete result vector. Keep zero warmups and the same total budget.
    performance_rows: 60000
    warmup: 0
    timing_samples: 1
    timing_aggregation: total
    threshold_ms: 3000
    timeout: 30
    setup:
      - scm: '(settings "ShardSize" 4000)'
      - scm: |
          (map (produceN 10) (lambda (i)
            (createtable "memcp-tests" (concat "partition_hint_oversized_cold_" (+ i 1))
              (map '("k0" "k1" "k2") (lambda (key)
                (list "column" key "INT" '() '())))
              '("engine" "memory") false)))
    scm: |
      (begin
        (define cold_results
          (map (produceN 11) (lambda (i)
            (eval (group_cache_partition_plan "memcp-tests" "partition_hint_source" "s"
              '("s" "memcp-tests" "partition_hint_source" false true)
              (if (equal? i 0) "partition_hint_oversized" (concat "partition_hint_oversized_cold_" i))
              (list (list 'get_column "s" false "a" false) (list 'get_column "s" false "b" false) (list 'get_column "s" false "c" false))
              '("k0" "k1" "k2")))
          )))
        (if (equal? cold_results '(true true true true true true true true true true true))
          true (error "cold group initialization reused or failed a target")))
    expect: {data: [true]}

cleanup:
  - scm: |
      (map '("partition_hint_diagonal" "partition_hint_uniform" "partition_hint_oversized")
        (lambda (prefix) (map (produceN 10) (lambda (i)
          (droptable "memcp-tests" (concat prefix "_cold_" (+ i 1)) true)))))
  - scm: '(settings "ShardSize" 60000)'
  - sql: DROP TABLE IF EXISTS partition_hint_oversized
  - sql: DROP TABLE IF EXISTS partition_hint_uniform
  - sql: DROP TABLE IF EXISTS partition_hint_diagonal
  - sql: DROP TABLE IF EXISTS partition_hint_source
