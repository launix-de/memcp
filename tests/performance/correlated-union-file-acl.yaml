- name: Collated point predicate preserves byte-distinct child lookup keys
  sql: SELECT f.ID, EXISTS (SELECT ID FROM acl_text_ref WHERE file=f.ID UNION ALL SELECT ID FROM acl_text_ref WHERE
    file=f.ID AND FALSE) AS can_view FROM acl_text_file f WHERE f.ID='a' ORDER BY f.ordinal
  expect:
    rows: 2
    data:
    - ID: a
      can_view: 1
    - ID: A
      can_view: 0
