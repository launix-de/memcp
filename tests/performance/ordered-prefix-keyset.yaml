metadata:
  description: Ordered pages over dynamic equality keysets, from sparse grants to broad access
  isolated: true
  ci: false
  perf_ci: true
  performance_rows: 800000
  max_regression_pct: 20
setup:
- sql: DROP TABLE IF EXISTS prefix_event
- sql: DROP TABLE IF EXISTS prefix_grant
- sql: CREATE TABLE prefix_event (id INT PRIMARY KEY, owner_id INT, stamp INT, active INT) ENGINE=memory
- sql: CREATE TABLE prefix_grant (owner_id INT, actor_id INT) ENGINE=memory
- scm: |
    (begin
      (insert (table "memcp-tests" "prefix_event") '("id" "owner_id" "stamp" "active")
        (map (produceN 800000) (lambda (i)
          (list (+ i 1) (+ 1 (mod i 100)) i (if (equal? (mod i 7) 0) 0 1)))))
      (insert (table "memcp-tests" "prefix_grant") '("owner_id" "actor_id")
        (merge (list (list (list 1 1) (list 1 1) (list 2 2) (list 3 2) (list 4 2))
          (map (produceN 40) (lambda (i) (list (+ i 1) 3)))
          (map (produceN 100) (lambda (i) (list (+ i 1) 4))))))
      (rebuild))
test_cases:
- name: 'Perf: one dynamic equality prefix'
  sql: SELECT id FROM prefix_event WHERE COALESCE((SELECT TRUE FROM prefix_grant WHERE prefix_grant.owner_id=prefix_event.owner_id AND actor_id=1 LIMIT 1),FALSE) ORDER BY stamp DESC, id ASC LIMIT 72
  expect: {rows: 72}
  warmup: 0
  timing_samples: 10
  timing_aggregation: total
  threshold_ms: 15000
- name: 'Perf: three dynamic equality prefixes with residual acceptance'
  sql: SELECT id FROM prefix_event WHERE active=1 AND COALESCE((SELECT TRUE FROM prefix_grant WHERE prefix_grant.owner_id=prefix_event.owner_id AND actor_id=2 LIMIT 1),FALSE) ORDER BY stamp DESC, id ASC LIMIT 72 OFFSET 20
  expect: {rows: 72}
  warmup: 0
  timing_samples: 10
  timing_aggregation: total
  threshold_ms: 15000
- name: 'Perf: forty dynamic equality prefixes'
  sql: SELECT id FROM prefix_event WHERE COALESCE((SELECT TRUE FROM prefix_grant WHERE prefix_grant.owner_id=prefix_event.owner_id AND actor_id=3 LIMIT 1),FALSE) ORDER BY stamp DESC, id ASC LIMIT 72
  expect: {rows: 72}
  warmup: 0
  timing_samples: 10
  timing_aggregation: total
  threshold_ms: 15000
- name: 'Perf: broad dynamic equality keyset'
  sql: SELECT id FROM prefix_event WHERE COALESCE((SELECT TRUE FROM prefix_grant WHERE prefix_grant.owner_id=prefix_event.owner_id AND actor_id=4 LIMIT 1),FALSE) ORDER BY stamp DESC, id ASC LIMIT 72
  expect: {rows: 72}
  warmup: 0
  timing_samples: 10
  timing_aggregation: total
  threshold_ms: 15000
- name: 'Perf: skewed hot equality prefix'
  timeout: 30
  setup: &frequency_fixture
  - sql: DROP TABLE IF EXISTS frequency_event
  - sql: CREATE TABLE frequency_event (id int PRIMARY KEY, owner_id int, stamp int) ENGINE=memory
  - scm: |
      (begin
        (insert (table "memcp-tests" "frequency_event") '("id" "owner_id" "stamp")
          (map (produceN 800000) (lambda (i)
            (list (+ i 1) (if (< (mod i 20) 19) 1 (+ 2 (mod (floor (/ i 20)) 99))) i))))
        (rebuild))
  sql: SELECT id FROM frequency_event WHERE COALESCE((SELECT TRUE FROM prefix_grant WHERE prefix_grant.owner_id=frequency_event.owner_id AND actor_id=1 LIMIT 1),FALSE) ORDER BY stamp DESC, id ASC LIMIT 72
  expect: {rows: 72}
  warmup: 0
  timing_samples: 10
  timing_aggregation: total
  threshold_ms: 15000
- name: 'Perf: skewed rare equality prefix'
  timeout: 30
  setup: *frequency_fixture
  sql: SELECT id FROM frequency_event WHERE COALESCE((SELECT TRUE FROM prefix_grant WHERE prefix_grant.owner_id=frequency_event.owner_id AND actor_id=2 LIMIT 1),FALSE) ORDER BY stamp DESC, id ASC LIMIT 72
  expect: {rows: 72}
  warmup: 0
  timing_samples: 10
  timing_aggregation: total
  threshold_ms: 15000
cleanup:
- sql: DROP TABLE IF EXISTS prefix_event
- sql: DROP TABLE IF EXISTS prefix_grant
- sql: DROP TABLE IF EXISTS frequency_event
