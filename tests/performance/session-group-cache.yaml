# Performance regression test for session-sensitive GROUP BY cache.
# The group cache must be reusable across repeated queries with the same
# session binding, not dropped+rebuilt every time.

metadata:
  version: "1.0"
  description: "Session-sensitive GROUP BY cache reuse performance"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS sgc_data"
  - sql: "DROP TABLE IF EXISTS sgc_acl"
  - sql: "DROP TABLE IF EXISTS sgc_range_data"
  - sql: "DROP TABLE IF EXISTS sgc_scalar_entity"
  - sql: "DROP TABLE IF EXISTS sgc_scalar_history"
  - sql: |
      CREATE TABLE sgc_data (
        id INT PRIMARY KEY AUTO_INCREMENT,
        category INT,
        owner INT,
        val INT
      )
  - sql: |
      CREATE TABLE sgc_acl (
        id INT PRIMARY KEY AUTO_INCREMENT,
        usr INT,
        category INT
      )
  - sql: "CREATE TABLE sgc_range_data (id INT PRIMARY KEY, category INT, val INT)"
  - sql: "CREATE TABLE sgc_scalar_entity (id INT PRIMARY KEY)"
  - sql: "CREATE TABLE sgc_scalar_history (parent_id INT, valid_at INT, value_a INT, value_b INT)"
  - sql: |
      INSERT INTO sgc_data (category, owner, val) VALUES
        (2, 2, 7), (3, 3, 14), (4, 1, 21), (5, 2, 28), (1, 3, 35),
        (2, 1, 42), (3, 2, 49), (4, 3, 56), (5, 1, 63), (1, 2, 70),
        (2, 3, 77), (3, 1, 84), (4, 2, 91), (5, 3, 98), (1, 1, 105),
        (2, 2, 112), (3, 3, 119), (4, 1, 126), (5, 2, 133), (1, 3, 140)
  - sql: |
      INSERT INTO sgc_acl (usr, category) VALUES
        (1, 1), (1, 2), (1, 3),
        (2, 1), (2, 4),
        (3, 2), (3, 5)
  - sql: "INSERT INTO sgc_range_data VALUES (1, 1, 60), (2, 1, 90)"
  - sql: "INSERT INTO sgc_scalar_entity VALUES (1)"
  - sql: "INSERT INTO sgc_scalar_history VALUES (1, 10, 11, 12), (1, 20, 21, 22)"

cleanup:
  - sql: "DROP TABLE IF EXISTS sgc_data"
  - sql: "DROP TABLE IF EXISTS sgc_acl"
  - sql: "DROP TABLE IF EXISTS sgc_range_data"
  - sql: "DROP TABLE IF EXISTS sgc_scalar_entity"
  - sql: "DROP TABLE IF EXISTS sgc_scalar_history"

test_cases:
  - name: "set session user"
    session_id: "sgc_sess"
    sql: "SET @actor_id = 1"
    expect:
      rows_affected: 0

  - name: "session-filtered COUNT GROUP BY (cold)"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 4
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4

  - name: "session equality is a logical domain key"
    session_id: "sgc_sess"
    sql: |
      EXPLAIN IR SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      result_contains:
        - "btw2025_domain"
        - "btw2025_lookup_keys"
        - "(condition true) (purpose exists)"

  - name: "session-filtered COUNT GROUP BY (warm, must be fast)"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 4
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4

  - name: "session-dependent grouping projects one membership recset into its carrier"
    session_id: "sgc_sess"
    sql: |
      EXPLAIN SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      result_contains:
        - "scan_recset"
        - "recset_project_join"
        - ".grp:sgc_data:"
        - "group_insert_batches"
      result_occurrences:
        - text: "recset_project_join"
          count: 1
      result_not_contains:
        - "scan_group_into"
        - "assoc_keys_values_as_dataset_rows"

  - name: "projected session presence maps lookup domain to inner group key"
    session_id: "sgc_sess"
    sql: |
      SELECT wrapped.id, wrapped.has_global_access
      FROM (
        SELECT id,
          EXISTS (
            SELECT TRUE
            FROM sgc_acl access_rows
            WHERE access_rows.usr = @actor_id
              AND access_rows.category IS NULL
            GROUP BY access_rows.usr
            HAVING COUNT(*) > 0
          ) AS has_global_access
        FROM sgc_data
      ) wrapped
      ORDER BY wrapped.id
      LIMIT 1
    expect:
      rows: 1
      data:
        - id: 1
          has_global_access: false

  - name: "session-filtered SUM GROUP BY (warm)"
    session_id: "sgc_sess"
    sql: |
      SELECT category, SUM(val) AS total
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3

  - name: "set session user 2"
    session_id: "sgc_sess2"
    sql: "SET @actor_id = 2"
    expect:
      rows_affected: 0

  - name: "different session sees different groups"
    session_id: "sgc_sess2"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 2
      data:
        - category: 1
          cnt: 4
        - category: 4
          cnt: 4

  - name: "change the original session binding"
    session_id: "sgc_sess"
    sql: "SET @actor_id = 2"
    expect:
      rows_affected: 0

  - name: "changed session binding uses its own domain key"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE @actor_id = sgc_acl.usr
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 2
      data:
        - category: 1
          cnt: 4
        - category: 4
          cnt: 4

  - name: "restore the original session binding"
    session_id: "sgc_sess"
    sql: "SET @actor_id = 1"
    expect:
      rows_affected: 0

  - name: "null session binding"
    session_id: "sgc_sess2"
    sql: "SET @actor_id = NULL"
    expect:
      rows_affected: 0

  - name: "null session binding has no memberships"
    session_id: "sgc_sess2"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 0

  - name: "restored session binding reuses the correct carrier slice"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 4
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4

  - name: "simple COUNT with session WHERE (warm, must be fast)"
    session_id: "sgc_sess"
    sql: |
      SELECT COUNT(*) AS cnt
      FROM sgc_data
      WHERE owner = @actor_id
    expect:
      rows: 1

  - name: "set initial range binding"
    session_id: "sgc_range"
    sql: "SET @cutoff = 100"
    expect:
      rows_affected: 0

  - name: "nested grouped aggregate uses initial range binding"
    session_id: "sgc_range"
    sql: >-
      SELECT (SELECT SUM(cnt) FROM (SELECT category, SUM(1) AS cnt FROM sgc_range_data WHERE val < @cutoff GROUP BY category) grouped_rows LIMIT 1) AS total
    expect:
      rows: 1
      data:
        - total: 2

  - name: "tighten range binding"
    session_id: "sgc_range"
    sql: "SET @cutoff = 85"
    expect:
      rows_affected: 0

  - name: "nested grouped aggregate uses changed range binding"
    session_id: "sgc_range"
    sql: >-
      SELECT (SELECT SUM(cnt) FROM (SELECT category, SUM(1) AS cnt FROM sgc_range_data WHERE val < @cutoff GROUP BY category) grouped_rows LIMIT 1) AS total
    expect:
      rows: 1
      data:
        - total: 1

  - name: "set ordered scalar cutoff"
    session_id: "sgc_scalar"
    sql: "SET @scalar_cutoff = 20"
    expect:
      rows_affected: 0

  - name: "merged ordered scalar projections use session domain"
    session_id: "sgc_scalar"
    max_time: 1.0
    sql: |
      SELECT id,
        COALESCE((SELECT value_a FROM sgc_scalar_history h
          WHERE h.parent_id = e.id AND h.valid_at <= @scalar_cutoff
          ORDER BY h.valid_at DESC LIMIT 1), 0) AS value_a,
        COALESCE((SELECT value_b FROM sgc_scalar_history h
          WHERE h.parent_id = e.id AND h.valid_at <= @scalar_cutoff
          ORDER BY h.valid_at DESC LIMIT 1), 0) AS value_b
      FROM sgc_scalar_entity e
      WHERE id = 1
    expect:
      rows: 1
      data:
        - id: 1
          value_a: 21
          value_b: 22

  - name: "ordered scalar stage retains session lookup domain"
    session_id: "sgc_scalar"
    sql: |
      EXPLAIN IR SELECT id,
        (SELECT value_a FROM sgc_scalar_history h
          WHERE h.parent_id = e.id AND h.valid_at <= @scalar_cutoff
          ORDER BY h.valid_at DESC LIMIT 1) AS value_a,
        (SELECT value_b FROM sgc_scalar_history h
          WHERE h.parent_id = e.id AND h.valid_at <= @scalar_cutoff
          ORDER BY h.valid_at DESC LIMIT 1) AS value_b
      FROM sgc_scalar_entity e
      WHERE id = 1
    expect:
      result_contains:
        - "btw2025_domain"
        - "btw2025_lookup_keys"
        - "scalar_cutoff"

  - name: "change ordered scalar cutoff"
    session_id: "sgc_scalar"
    sql: "SET @scalar_cutoff = 10"
    expect:
      rows_affected: 0

  - name: "merged ordered scalar projections isolate changed session domain"
    session_id: "sgc_scalar"
    max_time: 1.0
    sql: |
      SELECT id,
        COALESCE((SELECT value_a FROM sgc_scalar_history h
          WHERE h.parent_id = e.id AND h.valid_at <= @scalar_cutoff
          ORDER BY h.valid_at DESC LIMIT 1), 0) AS value_a,
        COALESCE((SELECT value_b FROM sgc_scalar_history h
          WHERE h.parent_id = e.id AND h.valid_at <= @scalar_cutoff
          ORDER BY h.valid_at DESC LIMIT 1), 0) AS value_b
      FROM sgc_scalar_entity e
      WHERE id = 1
    expect:
      rows: 1
      data:
        - id: 1
          value_a: 11
          value_b: 12

  - name: "set first aggregate factor"
    session_id: "sgc_factor_a"
    sql: "SET @factor = 2"
    expect:
      rows_affected: 0

  - name: "session value in aggregate expression uses first domain"
    session_id: "sgc_factor_a"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 700
        - category: 2
          total: 476
        - category: 3
          total: 532
        - category: 4
          total: 588
        - category: 5
          total: 644

  - name: "set second aggregate factor"
    session_id: "sgc_factor_b"
    sql: "SET @factor = 3"
    expect:
      rows_affected: 0

  - name: "session value in aggregate expression uses second domain"
    session_id: "sgc_factor_b"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 1050
        - category: 2
          total: 714
        - category: 3
          total: 798
        - category: 4
          total: 882
        - category: 5
          total: 966

  - name: "set unrelated aggregate session"
    session_id: "sgc_factor_writer"
    sql: "SET @factor = 9"
    expect:
      rows_affected: 0

  - name: "write under unrelated aggregate session"
    session_id: "sgc_factor_writer"
    sql: "INSERT INTO sgc_data (category, owner, val) VALUES (1, 9, 5)"
    expect:
      affected_rows: 1

  - name: "first aggregate domain remains correct after write"
    session_id: "sgc_factor_a"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 710
        - category: 2
          total: 476
        - category: 3
          total: 532
        - category: 4
          total: 588
        - category: 5
          total: 644

  - name: "second aggregate domain remains correct after write"
    session_id: "sgc_factor_b"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 1065
        - category: 2
          total: 714
        - category: 3
          total: 798
        - category: 4
          total: 882
        - category: 5
          total: 966

  - name: "restore second membership domain"
    session_id: "sgc_sess2"
    sql: "SET @actor_id = 2"
    expect:
      rows_affected: 0

  - name: "write from an unrelated session updates populated membership domains"
    session_id: "sgc_writer"
    sql: "INSERT INTO sgc_data (category, owner, val) VALUES (4, 9, 200)"
    expect:
      affected_rows: 1

  - name: "second membership domain sees incremental changes"
    session_id: "sgc_sess2"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 2
      data:
        - category: 1
          cnt: 5
        - category: 4
          cnt: 5

  - name: "first membership domain remains isolated after write"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @actor_id
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 5
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4
