# Performance regression test for session-sensitive GROUP BY cache.
# The group cache must be reusable across repeated queries with the same
# session binding, not dropped+rebuilt every time.

metadata:
  version: "1.0"
  description: "Session-sensitive GROUP BY cache reuse performance"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS sgc_data"
  - sql: "DROP TABLE IF EXISTS sgc_acl"
  - sql: |
      CREATE TABLE sgc_data (
        id INT PRIMARY KEY AUTO_INCREMENT,
        category INT,
        owner INT,
        val INT
      )
  - sql: |
      CREATE TABLE sgc_acl (
        id INT PRIMARY KEY AUTO_INCREMENT,
        usr INT,
        category INT
      )
  - sql: |
      INSERT INTO sgc_data (category, owner, val) VALUES
        (2, 2, 7), (3, 3, 14), (4, 1, 21), (5, 2, 28), (1, 3, 35),
        (2, 1, 42), (3, 2, 49), (4, 3, 56), (5, 1, 63), (1, 2, 70),
        (2, 3, 77), (3, 1, 84), (4, 2, 91), (5, 3, 98), (1, 1, 105),
        (2, 2, 112), (3, 3, 119), (4, 1, 126), (5, 2, 133), (1, 3, 140)
  - sql: |
      INSERT INTO sgc_acl (usr, category) VALUES
        (1, 1), (1, 2), (1, 3),
        (2, 1), (2, 4),
        (3, 2), (3, 5)

cleanup:
  - sql: "DROP TABLE IF EXISTS sgc_data"
  - sql: "DROP TABLE IF EXISTS sgc_acl"

test_cases:
  - name: "set session user"
    session_id: "sgc_sess"
    sql: "SET @app_user = 1"
    expect:
      rows_affected: 0

  - name: "session-filtered COUNT GROUP BY (cold)"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 4
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4

  - name: "session-filtered COUNT GROUP BY (warm, must be fast)"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 4
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4

  - name: "session-filtered SUM GROUP BY (warm)"
    session_id: "sgc_sess"
    sql: |
      SELECT category, SUM(val) AS total
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3

  - name: "set session user 2"
    session_id: "sgc_sess2"
    sql: "SET @app_user = 2"
    expect:
      rows_affected: 0

  - name: "different session sees different groups"
    session_id: "sgc_sess2"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 2
      data:
        - category: 1
          cnt: 4
        - category: 4
          cnt: 4

  - name: "first session reuses its own cached groups"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 4
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4

  - name: "write from an unrelated session updates every populated domain"
    session_id: "sgc_writer"
    sql: "INSERT INTO sgc_data (category, owner, val) VALUES (4, 9, 200)"
    expect:
      affected_rows: 1

  - name: "second session sees incremental changes for its cached domain"
    session_id: "sgc_sess2"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 2
      data:
        - category: 1
          cnt: 4
        - category: 4
          cnt: 5

  - name: "first session stays isolated after an unrelated write"
    session_id: "sgc_sess"
    sql: |
      SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
      ORDER BY category
    expect:
      rows: 3
      data:
        - category: 1
          cnt: 4
        - category: 2
          cnt: 4
        - category: 3
          cnt: 4

  - name: "logical plan exposes the session binding as a domain key"
    session_id: "sgc_sess"
    sql: |
      EXPLAIN IR SELECT category, COUNT(*) AS cnt
      FROM sgc_data
      WHERE EXISTS (
        SELECT 1 FROM sgc_acl
        WHERE sgc_acl.usr = @app_user
          AND sgc_acl.category = sgc_data.category
      )
      GROUP BY category
    expect:
      contains:
        - '(domain ((get_column "sgc_data" true "category" true) (session "app_user")))'
        - '(lookup-keys ((get_column "sgc_data" true "category" true) (session "app_user")))'

  - name: "simple COUNT with session WHERE (warm, must be fast)"
    session_id: "sgc_sess"
    sql: |
      SELECT COUNT(*) AS cnt
      FROM sgc_data
      WHERE owner = @app_user
    expect:
      rows: 1

  - name: "set first aggregate factor"
    session_id: "sgc_factor_a"
    sql: "SET @factor = 2"
    expect:
      rows_affected: 0

  - name: "session value in aggregate expression uses first domain"
    session_id: "sgc_factor_a"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 700
        - category: 2
          total: 476
        - category: 3
          total: 532
        - category: 4
          total: 988
        - category: 5
          total: 644

  - name: "set second aggregate factor"
    session_id: "sgc_factor_b"
    sql: "SET @factor = 3"
    expect:
      rows_affected: 0

  - name: "session value in aggregate expression uses second domain"
    session_id: "sgc_factor_b"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 1050
        - category: 2
          total: 714
        - category: 3
          total: 798
        - category: 4
          total: 1482
        - category: 5
          total: 966

  - name: "set unrelated aggregate session"
    session_id: "sgc_factor_writer"
    sql: "SET @factor = 9"
    expect:
      rows_affected: 0

  - name: "write under unrelated aggregate session"
    session_id: "sgc_factor_writer"
    sql: "INSERT INTO sgc_data (category, owner, val) VALUES (1, 9, 5)"
    expect:
      affected_rows: 1

  - name: "first aggregate domain remains correct after write"
    session_id: "sgc_factor_a"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 710
        - category: 2
          total: 476
        - category: 3
          total: 532
        - category: 4
          total: 988
        - category: 5
          total: 644

  - name: "second aggregate domain remains correct after write"
    session_id: "sgc_factor_b"
    sql: |
      SELECT category, SUM(val * @factor) AS total
      FROM sgc_data
      GROUP BY category
      ORDER BY category
    expect:
      rows: 5
      data:
        - category: 1
          total: 1065
        - category: 2
          total: 714
        - category: 3
          total: 798
        - category: 4
          total: 1482
        - category: 5
          total: 966
