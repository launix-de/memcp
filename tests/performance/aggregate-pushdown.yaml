# Run with:
#   PERF_TEST=1 python3 run_sql_tests.py tests/performance/aggregate-pushdown.yaml --log-times
#
# The fact table is deliberately much larger than the FK domain. Aggregate
# pushdown can count each FK partition once before applying the scalar stage.

metadata:
  performance_shard_weight: 11
  version: "1.0"
  description: "COUNT aggregate pushdown across a low-cardinality FK stage"
  isolated: true

test_cases:
  - name: "Perf: aggregate pushdown cold FK partition count"
    setup:
      - sql: "DROP TABLE IF EXISTS ap_fact"
      - sql: "DROP TABLE IF EXISTS ap_access"
      - sql: |
          CREATE TABLE ap_access (
            id INT PRIMARY KEY,
            allowed BOOL NOT NULL
          )
      - sql: |
          CREATE TABLE ap_fact (
            id INT PRIMARY KEY,
            access_id INT,
            FOREIGN KEY ap_fact_access_fk (access_id) REFERENCES ap_access(id)
          )
      - scm: |
          (begin
            (define access_rows (map (produceN 64) (lambda (i)
              (list (+ i 1) (equal? 0 (- i (* 4 (floor (/ i 4)))))))))
            (define fact_rows (map (produceN {rows}) (lambda (i)
              (list (+ i 1) (+ 1 (- i (* 64 (floor (/ i 64)))))))))
            (insert (table "{database}" false "ap_access" false)
              '("id" "allowed") access_rows)
            (insert (table "{database}" false "ap_fact" false)
              '("id" "access_id") fact_rows)
            (rebuild)
            {rows})
    # Retain the cold request and ten initial reuses as separate raw phases;
    # further reuses keep a single collection from dominating the total.
    timing_group: fk-partition-count
    timing_aggregation: total
    warmup: 0
    timing_samples: 1
    sql: &ap_fk_count_query |
      SELECT COUNT(*) AS total
      FROM ap_fact fact
      WHERE COALESCE((
        SELECT access.allowed
        FROM ap_access access
        WHERE access.id = fact.access_id
        LIMIT 1
      ), FALSE)
    threshold_ms: 30000
    on_fail:
      - sql: |
          EXPLAIN REORDER
          SELECT COUNT(*) AS total
          FROM ap_fact fact
          WHERE COALESCE((
            SELECT access.allowed
            FROM ap_access access
            WHERE access.id = fact.access_id
            LIMIT 1
          ), FALSE)
    expect: &ap_fk_count_expect
      rows: 1

  - name: "Perf: aggregate pushdown warm FK partition count"
    timing_group: fk-partition-count
    timing_aggregation: total
    warmup: 0
    timing_samples: 10
    sql: *ap_fk_count_query
    threshold_ms: 15000
    expect: *ap_fk_count_expect

  - name: "Perf: aggregate pushdown steady FK partition count"
    timing_group: fk-partition-count
    timing_aggregation: total
    warmup: 0
    timing_samples: 990
    sql: *ap_fk_count_query
    threshold_ms: 15000
    expect: *ap_fk_count_expect

  - name: "Perf: filtered grouped count cold preparation"
    performance_rows: 500000
    timing_group: filtered-fk-preparation
    timing_aggregation: total
    warmup: 0
    timing_samples: 1
    threshold_ms: 5000
    setup:
      - sql: "DROP TABLE IF EXISTS ap_filtered_fact"
      - sql: "DROP TABLE IF EXISTS ap_filtered_access"
      - sql: "CREATE TABLE ap_filtered_access(id INT PRIMARY KEY, allowed BOOL NOT NULL) ENGINE=memory"
      - sql: "CREATE TABLE ap_filtered_fact(id INT PRIMARY KEY, access_id INT, FOREIGN KEY ap_filtered_fk(access_id) REFERENCES ap_filtered_access(id)) ENGINE=memory"
      - scm: |
          (begin
            (insert (table "{database}" false "ap_filtered_access" false) '("id" "allowed")
              (map (produceN 64) (lambda (i) (list (+ i 1) (equal? (mod i 4) 0)))))
            (insert (table "{database}" false "ap_filtered_fact" false) '("id" "access_id")
              (map (produceN {rows}) (lambda (i) (list (+ i 1) (+ 1 (mod i 64))))))
            (rebuild) true)
    sql: &ap_filtered_count_query |
      SELECT COUNT(*) AS total FROM ap_filtered_fact fact
      WHERE fact.access_id=1 AND MOD(fact.id,17)<>0
        AND COALESCE((SELECT access.allowed FROM ap_filtered_access access
          WHERE access.id=fact.access_id LIMIT 1),FALSE)
    expect: &ap_filtered_count_expect {rows: 1, data: [{total: 7354}]}

  - name: "Perf: identical filtered grouped count reuses prepared values"
    performance_rows: 500000
    timing_group: filtered-fk-preparation
    timing_aggregation: total
    warmup: 0
    timing_samples: 100
    threshold_ms: 5000
    sql: *ap_filtered_count_query
    expect: *ap_filtered_count_expect

  - name: "Perf: another grouped count filter extends preparation"
    performance_rows: 500000
    timing_group: filtered-fk-preparation
    timing_aggregation: total
    warmup: 0
    timing_samples: 1
    threshold_ms: 5000
    sql: |
      SELECT COUNT(*) AS total FROM ap_filtered_fact fact
      WHERE fact.access_id=5 AND MOD(fact.id,17)<>0
        AND COALESCE((SELECT access.allowed FROM ap_filtered_access access
          WHERE access.id=fact.access_id LIMIT 1),FALSE)
    expect: *ap_filtered_count_expect

  - name: "Perf: returning grouped count filter retains previous values"
    performance_rows: 500000
    timing_group: filtered-fk-preparation
    timing_aggregation: total
    warmup: 0
    timing_samples: 99
    threshold_ms: 5000
    sql: *ap_filtered_count_query
    expect: *ap_filtered_count_expect

cleanup:
  - sql: "DROP TABLE IF EXISTS ap_filtered_fact"
  - sql: "DROP TABLE IF EXISTS ap_filtered_access"
  - sql: "DROP TABLE IF EXISTS ap_fact"
  - sql: "DROP TABLE IF EXISTS ap_access"
