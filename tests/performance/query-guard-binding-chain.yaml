metadata:
  version: '1.0'
  description: Compile dependent query guard bindings and preserve their execution order
  isolated: true
test_cases:
- name: Dependent guard bindings compile once and retain session semantics
  scm: |
    (begin
      (define session (newsession))
      (session "step" 1)
      (define planning (sql_queryplan_compile_session session nil))
      (define last_value (reduce (produceN 256) (lambda (previous i)
        (planner_guard_runtime_binding
          (list (quote +) previous (list (quote session) "step")) planning '())) 0))
      (planner_record_guard_condition (list (quote equal?) last_value 256) planning)
      (define guard (sql_queryplan_guard_from_session planning))
      (define compiled (sql_queryplan_compile_formula nil guard))
      (if (equal? (jit? compiled) (jit-enabled?)) true (error "guard fell back from JIT"))
      (define first (compiled session nil nil nil))
      (session "step" 2)
      (define second (compiled session nil nil nil))
      (if (and first (not second)) true (error "guard lost binding dependencies")))
  expect:
    data: [true]
  performance_rows: 256
  warmup: 0
  timing_samples: 1
  threshold_ms: 5000
- name: Quoted preparation metadata is opaque to sampling and cache guards
  scm: |
    (begin
      (define session (newsession))
      (session "value" 7)
      (session "__prepare_stage_probe" (lambda () true))
      (define planning (sql_queryplan_compile_session session nil))
      (define payload (list (quote quote) (list (quote session) "__prepare_stage_probe")))
      (define expression (list (quote list) payload (list (quote session) "value")))
      (define bound (planner_bind_session_values expression planning))
      (planner_literal_value (list (quote session) "__prepare_stage_probe") planning)
      (planner_record_session_value_guards
        (list (quote session) "__prepare_stage_probe") planning)
      (if (equal? (cadr bound) payload) true (error "sampling rewrote quoted metadata"))
      (define compiled (sql_queryplan_compile_formula nil (sql_queryplan_guard_from_session planning)))
      (session "__prepare_stage_probe" (lambda () false))
      (define unchanged (compiled session nil nil nil))
      (session "value" 8)
      (if (and unchanged (not (compiled session nil nil nil))) true
        (error "cache guard confused metadata with executable session inputs")))
  expect:
    data: [true]
  performance_rows: 1
  warmup: 0
  timing_samples: 1
  threshold_ms: 5000
