    IS NULL) LIMIT 1))) OR ((NOT ('0')) AND (NOT ('0')) AND (NOT (EXISTS (SELECT (TRUE) FROM `nav_access` `SfzKFmFf`
    WHERE `SfzKFmFf`.`user` = @nav_actor AND ((`SfzKFmFf`.`nav_tenant`) IS NULL) LIMIT 1))))) AND (CASE WHEN (('0')
