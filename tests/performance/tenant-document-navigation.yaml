- name: 'Perf: selective point before unique scalar lookup'
  sql: >
    SELECT nav_department.ID FROM nav_department CROSS JOIN nav_check
    WHERE nav_department.ID = 1 AND nav_check.ID = 1
      AND (SELECT nav_tenant FROM nav_site WHERE ID = nav_department.nav_site) = nav_check.nav_tenant
  expect: {rows: 1, data: [{ID: 1}]}
  warmup: 0
  timing_samples: 4
  timing_aggregation: total
  threshold_ms: 5000
- name: 'Point lookup does not build a projected table carrier'
  sql: >
    EXPLAIN PHYSICAL SELECT nav_department.ID FROM nav_department CROSS JOIN nav_check
    WHERE nav_department.ID = 1 AND nav_check.ID = 1
      AND (SELECT nav_tenant FROM nav_site WHERE ID = nav_department.nav_site) = nav_check.nav_tenant
  expect:
    result_not_contains: ['chosen projected_recset']
- name: 'Perf: broad unique scalar predicate keeps late lookup'
  sql: >
    SELECT COUNT(*) AS n FROM nav_department CROSS JOIN nav_check
    WHERE nav_check.ID = 1
      AND (SELECT flag FROM nav_lookup_broad WHERE ID = nav_department.nav_site) = 1
  expect: {rows: 1, data: [{n: 5000}]}
  warmup: 0
  timing_samples: 4
  timing_aggregation: total
  threshold_ms: 5000
- name: 'Broad lookup does not build a projected table carrier'
  sql: >
    EXPLAIN PHYSICAL SELECT COUNT(*) AS n FROM nav_department CROSS JOIN nav_check
    WHERE nav_check.ID = 1
      AND (SELECT flag FROM nav_lookup_broad WHERE ID = nav_department.nav_site) = 1
  expect:
    result_not_contains: ['chosen projected_recset']
- name: 'Projected unique lookup excludes missing rows and NULL values'
  setup:
  - sql: INSERT INTO nav_site (ID, name, nav_tenant) VALUES (1001, 'nullable', NULL)
  - sql: INSERT INTO nav_department (ID, name, nav_site) VALUES (5001, 'missing', 9999), (5002, 'null-key', NULL), (5003, 'null-value', 1001)
  sql: >
    SELECT COUNT(*) AS n FROM nav_department CROSS JOIN nav_check
    WHERE nav_check.ID = 1
      AND (SELECT nav_tenant FROM nav_site WHERE ID = nav_department.nav_site) = nav_check.nav_tenant
  expect: {rows: 1, data: [{n: 50}]}
- name: 'Selective unique lookup offers the projected carrier'
  sql: >
    EXPLAIN PHYSICAL SELECT COUNT(*) AS n FROM nav_department CROSS JOIN nav_check
    WHERE nav_check.ID = 1
      AND (SELECT nav_tenant FROM nav_site WHERE ID = nav_department.nav_site) = nav_check.nav_tenant
  expect:
    result_contains: ['decision unique_scalar_filter', 'chosen projected_recset', 'recset_project_join']
