# Empty years must not inherit document membership from another year.
# Each performance case measures one cold query plus three warm queries.
metadata:
  description: Restricted tenant hierarchy with correlated document membership and counts; 800k documents, 100 tenants,
    5000 departments
  isolated: true
  performance_rows: 800000
setup:
- sql: DROP TABLE IF EXISTS nav_document
- sql: 'CREATE TABLE `nav_document` ( `inventory` text, `note` text, `customer_note` text, `ID` int PRIMARY KEY,

    `nav_department` int, `nav_year` int, `nav_tenant` int, `nav_check` int, `nav_site` int, `file` int) ENGINE=memory

    '
- sql: DROP TABLE IF EXISTS nav_document_full
- sql: 'CREATE TABLE `nav_document_full` ( `inventory` text, `note` text, `customer_note` text, `ID` int PRIMARY
    KEY,

    `nav_department` int, `nav_year` int, `nav_tenant` int, `nav_check` int, `nav_site` int, `file` int) ENGINE=memory

    '
- sql: DROP TABLE IF EXISTS nav_tenant
- sql: CREATE TABLE `nav_tenant` (`multiStandort` boolean,`multiAbteilung` boolean,`multiPruefung` boolean,`name`
    text,`ID` int PRIMARY KEY) ENGINE=memory
- sql: DROP TABLE IF EXISTS nav_site
- sql: CREATE TABLE `nav_site` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int) ENGINE=memory
- sql: DROP TABLE IF EXISTS nav_department
- sql: CREATE TABLE `nav_department` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int,`nav_site` int) ENGINE=memory
- sql: DROP TABLE IF EXISTS nav_year
- sql: CREATE TABLE `nav_year` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int) ENGINE=memory
- sql: DROP TABLE IF EXISTS nav_check
- sql: CREATE TABLE `nav_check` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int) ENGINE=memory
- sql: DROP TABLE IF EXISTS nav_access
- sql: CREATE TABLE `nav_access` (`ID` int PRIMARY KEY,`user` int,`nav_tenant` int,`nav_site` int) ENGINE=memory
- scm: "(begin\n (insert (table \"memcp-tests\" \"nav_tenant\") '(\"ID\" \"name\") (map (produceN 100) (lambda (i)\
    \ (list (+ i 1) (concat \"tenant-\" (+ i 1))))))\n (insert (table \"memcp-tests\" \"nav_year\") '(\"ID\" \"\
    name\" \"nav_tenant\") (map (produceN 1100) (lambda (i) (list (+ i 1) (concat \"year-\" (+ i 1)) (+ 1 (mod i\
    \ 100))))))\n (insert (table \"memcp-tests\" \"nav_check\") '(\"ID\" \"name\" \"nav_tenant\") (map (produceN\
    \ 100) (lambda (i) (list (+ i 1) (concat \"check-\" (+ i 1)) (+ i 1)))))\n (insert (table \"memcp-tests\" \"\
    nav_site\") '(\"ID\" \"name\" \"nav_tenant\") (map (produceN 1000) (lambda (i) (list (+ i 1) (concat \"site-\"\
    \ (+ i 1)) (+ 1 (mod i 100))))))\n (insert (table \"memcp-tests\" \"nav_department\") '(\"ID\" \"name\" \"nav_site\"\
    \ \"nav_tenant\") (map (produceN 5000) (lambda (i) (list (+ i 1) (concat \"department-\" (+ i 1)) (+ 1 (mod\
    \ i 1000)) (+ 1 (mod i 100))))))\n (insert (table \"memcp-tests\" \"nav_access\") '(\"ID\" \"user\" \"nav_tenant\"\
    \ \"nav_site\") (list (list 1 7 nil nil) (list 2 8 1 nil)))\n (insert (table \"memcp-tests\" \"nav_document\"\
    ) '(\"ID\" \"nav_tenant\" \"nav_year\" \"nav_site\" \"nav_department\" \"nav_check\") (map (produceN 800000)\
    \ (lambda (i) (list (+ i 1) (+ 1 (mod i 100)) (+ 1 (mod i 100)) (+ 1 (mod i 1000)) (+ 1 (mod i 5000)) (+ 1 (mod\
    \ i 100))))))\n (insert (table \"memcp-tests\" \"nav_document_full\") '(\"ID\" \"nav_tenant\" \"nav_year\" \"\
    nav_site\" \"nav_department\" \"nav_check\") (map (produceN 800000) (lambda (i) (list (+ i 1) (+ 1 (mod i 100))\
    \ (+ 1 (mod i 1100)) (+ 1 (mod i 1000)) (+ 1 (mod i 5000)) (+ 1 (mod i 100))))))\n (map '(\"nav_tenant\" \"\
    nav_year\" \"nav_check\" \"nav_site\" \"nav_department\" \"nav_access\" \"nav_document\" \"nav_document_full\"\
    ) (lambda (t) (rebuild (table \"memcp-tests\" t) true false)))\n true)"
- sql: DROP TABLE IF EXISTS nav_lookup_broad
- sql: CREATE TABLE nav_lookup_broad (ID INT PRIMARY KEY, flag INT) ENGINE=memory
- scm: |
    (begin
      (insert (table "memcp-tests" "nav_lookup_broad") '("ID" "flag")
        (map (produceN 1000) (lambda (i) (list (+ i 1) 1))))
      (rebuild (table "memcp-tests" "nav_lookup_broad") true false))
test_cases:
- name: 'Perf: document navigation counts in a present year'
  sql: SELECT * FROM (SELECT nav_department.`ID` AS `nav_department`, (SELECT COUNT(*) FROM nav_document WHERE nav_year
    = nav_year.`ID` AND nav_department = nav_department.`ID` AND nav_check = nav_check.`ID`) AS `amount`, 4 AS `indent`,
    nav_year.`ID` AS `nav_year`, 'nav_check' AS `kind`, nav_check.name AS `name`, nav_check.`ID` AS `nav_check`,
    nav_department.nav_site AS `nav_site`, 1 FROM `nav_check` `nav_check` CROSS JOIN `nav_department` `nav_department`
    CROSS JOIN `nav_year` `nav_year` WHERE ((SELECT nav_tenant FROM nav_site WHERE `ID` = nav_department.nav_site)
    = nav_check.nav_tenant) AND (EXISTS (SELECT * FROM nav_document WHERE nav_department = nav_department.`ID` AND
    nav_check = nav_check.`ID` AND nav_year = nav_year.`ID`)) AND (((('0') OR (EXISTS (SELECT (TRUE) FROM `nav_access`
    `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`) IS NULL) LIMIT 1))) OR ((NOT
    ('0')) AND (NOT ('0')) AND (NOT (EXISTS (SELECT (TRUE) FROM `nav_access` `SfzKFmFf` WHERE `SfzKFmFf`.`user`
    = @nav_actor AND ((`SfzKFmFf`.`nav_tenant`) IS NULL) LIMIT 1))))) AND ((('0') OR (EXISTS (SELECT (TRUE) FROM
    `nav_access` `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`) IS NULL) LIMIT 1)))
    OR ((NOT ('0')) AND (NOT ('0')) AND (NOT (EXISTS (SELECT (TRUE) FROM `nav_access` `SfzKFmFf` WHERE `SfzKFmFf`.`user`
    = @nav_actor AND ((`SfzKFmFf`.`nav_tenant`) IS NULL) LIMIT 1))))) AND (COALESCE((SELECT (((('0') OR (EXISTS
    (SELECT (TRUE) FROM `nav_access` `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`)
    IS NULL) LIMIT 1))) OR ((NOT ('0')) AND (NOT ('0')) AND (NOT (EXISTS (SELECT (TRUE) FROM `nav_access` `SfzKFmFf`
    WHERE `SfzKFmFf`.`user` = @nav_actor AND ((`SfzKFmFf`.`nav_tenant`) IS NULL) LIMIT 1))))) AND (CASE WHEN (('0')
    OR (EXISTS (SELECT (TRUE) FROM `nav_access` `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`)
    IS NULL) LIMIT 1))) OR ('0') THEN TRUE ELSE EXISTS (SELECT (TRUE) FROM `nav_access` `dsZCbLkI` WHERE `dsZCbLkI`.`nav_tenant`
    = `olakvKQI`.`ID` AND ((`dsZCbLkI`.`user`) = (@nav_actor)) LIMIT 1) END)) FROM `nav_tenant` `olakvKQI` WHERE
    `olakvKQI`.`ID` = `nav_year`.`nav_tenant` LIMIT 1), FALSE))) AND (((('0') OR (EXISTS (SELECT (TRUE) FROM `nav_access`
    `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`) IS NULL) LIMIT 1))) OR ((NOT
    ('0')) AND (NOT ('0')) AND (NOT (EXISTS (SELECT (TRUE) FROM `nav_access` `SfzKFmFf` WHERE `SfzKFmFf`.`user`
    = @nav_actor AND ((`SfzKFmFf`.`nav_tenant`) IS NULL) LIMIT 1)))) OR ('0')) AND ('1') AND ((('0') OR (EXISTS
    (SELECT (TRUE) FROM `nav_access` `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`)
    IS NULL) LIMIT 1))) OR ((NOT ('0')) AND (NOT ('0')) AND (NOT (EXISTS (SELECT (TRUE) FROM `nav_access` `SfzKFmFf`
    WHERE `SfzKFmFf`.`user` = @nav_actor AND ((`SfzKFmFf`.`nav_tenant`) IS NULL) LIMIT 1))))) AND (COALESCE((SELECT
    (((('0') OR (EXISTS (SELECT (TRUE) FROM `nav_access` `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`)
    IS NULL) LIMIT 1))) OR ((NOT ('0')) AND (NOT ('0')) AND (NOT (EXISTS (SELECT (TRUE) FROM `nav_access` `SfzKFmFf`
    WHERE `SfzKFmFf`.`user` = @nav_actor AND ((`SfzKFmFf`.`nav_tenant`) IS NULL) LIMIT 1))))) AND (CASE WHEN (('0')
    OR (EXISTS (SELECT (TRUE) FROM `nav_access` `hfjCDFco` WHERE `hfjCDFco`.`user` = @nav_actor AND ((`hfjCDFco`.`nav_tenant`)
    IS NULL) LIMIT 1))) OR ('0') THEN TRUE ELSE EXISTS (SELECT (TRUE) FROM `nav_access` `dsZCbLkI` WHERE `dsZCbLkI`.`nav_tenant`
    = `375V2drC`.`ID` AND ((`dsZCbLkI`.`user`) = (@nav_actor)) LIMIT 1) END)) FROM `nav_tenant` `375V2drC` WHERE
    `375V2drC`.`ID` = `nav_check`.`nav_tenant` LIMIT 1), FALSE)))) navigation_counts WHERE nav_year=1 ORDER BY nav_site,
    nav_department, nav_check
