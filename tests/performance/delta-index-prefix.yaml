metadata:
  performance_shard_weight: 2
  version: '1.0'
  description: Equality prefix seeks with an upper-only historical range on delta rows
  isolated: true
setup:
- sql: CREATE TABLE prefix_history (parent INT, version INT) ENGINE=memory
- scm: |
    (insert (table "memcp-tests" false "prefix_history" false) '("parent" "version")
      (map (produceN 16384) (lambda (i) (list (floor (/ i 4)) (mod i 4)))))
test_cases:
- name: Upper-only range retains the equality prefix
  sql: SELECT version FROM prefix_history WHERE parent=4095 AND version<=2 ORDER BY version
  expect:
    data:
    - version: 0
    - version: 1
    - version: 2
  performance_rows: 16384
  warmup: 10
  timing_samples: 3
  threshold_ms: 100
- name: Computed delta keys retain prepared execution and seek their prefix
  sql: SELECT COUNT(*) AS n,SUM(version) AS versions FROM prefix_history WHERE parent%97=7
  performance_rows: 16384
  warmup: 0
  timing_samples: 11
  timing_aggregation: total
  threshold_ms: 1000
  expect:
    data: [{n: 172, versions: 258}]

cleanup:
- sql: DROP TABLE prefix_history
