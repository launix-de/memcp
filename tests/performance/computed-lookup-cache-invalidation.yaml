metadata:
  version: "1.0"
  description: "Row-local invalidation of a canonical computed lookup cache"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS lookup_invalidation_driver"
  - sql: "DROP TABLE IF EXISTS lookup_invalidation_source"
  - sql: "CREATE TABLE lookup_invalidation_source (id INT PRIMARY KEY, val INT)"
  - sql: "CREATE TABLE lookup_invalidation_driver (id INT PRIMARY KEY, source_id INT)"
  - scm: |
      (begin
        (insert (table "memcp-tests" "lookup_invalidation_source") '("id" "val")
          (map (produceN 8000) (lambda (i) (list (+ i 1) (+ i 10))))
          '() (lambda () true) false)
        (insert (table "memcp-tests" "lookup_invalidation_driver") '("id" "source_id")
          (map (produceN 8000) (lambda (i) (list (+ i 1) (+ i 1))))
          '() (lambda () true) false)
        (rebuild (table "memcp-tests" "lookup_invalidation_source") true false)
        (rebuild (table "memcp-tests" "lookup_invalidation_driver") true false))

test_cases:
  - name: "Build and warm the canonical lookup cache"
    scm: |
      (begin
        (createcolumn
          (table "memcp-tests" "lookup_invalidation_driver")
          ".lookup:value" "INT" '() '("temp" true)
          '("source_id")
          (lambda (source_id)
            (scan nil (table "memcp-tests" "lookup_invalidation_source")
              (list 369436175368192 (scan_boundary "equal" "id" 0 0 true true "" false)) (list source_id)
              '("id") (lambda (id) (equal? id (outer 1 source_id)))
              '("val") (lambda (acc val) val)
              0 (lambda (old value) value) false)))
        (scan nil (table "memcp-tests" "lookup_invalidation_driver")
          (car (eval (cons (quote list) (slice (compile_scan_plan (quote scan) nil nil '() (scheme "(lambda () true)") '()) 3 5)))) (cadr (eval (cons (quote list) (slice (compile_scan_plan (quote scan) nil nil '() (scheme "(lambda () true)") '()) 3 5)))) '() (lambda () true)
          '(".lookup:value") (lambda (acc value) (+ acc value))
          0 + false))

  - name: "Mutate one lookup source"
    sql: "UPDATE lookup_invalidation_source SET val = 999999 WHERE id = 4000"
    expect:
      affected_rows: 1

  - name: "One source mutation does not rebuild every cached lookup"
    max_time: 0.5
    sql: |
      SELECT SUM(`.lookup:value`) AS total
      FROM lookup_invalidation_driver
    expect:
      rows: 1
      data:
        - total: 33071990

  - name: "Repeated canonical cache preparation does not recount retained delta values"
    setup:
      - sql: "DROP TABLE IF EXISTS lookup_accounting_driver"
      - sql: "CREATE TABLE lookup_accounting_driver (id INT) ENGINE=memory"
      # Leave appended rows in delta: prepared proxies still cache their values,
      # and repeated preparation must not recount the complete retained map.
      - scm: |
          (insert (table "memcp-tests" "lookup_accounting_driver") '("id")
            (map (produceN 8000) (lambda (i) (list (+ i 1)))))
    cleanup:
      - sql: "DROP TABLE IF EXISTS lookup_accounting_driver"
    threshold_ms: 5000
    timeout: 20
    warmup: 0
    timing_samples: 4
    timing_aggregation: total
    max_regression_pct: 20
    scm: |
      (!begin
        (define prepare (lambda ()
          (createcolumn (table "memcp-tests" "lookup_accounting_driver")
            ".account:value" "INT" '() '("temp" true)
            '("id") (lambda (id) id))))
        (reduce (produceN 64) (lambda (acc i) (!begin (prepare) true)) true)
        (scan nil (table "memcp-tests" "lookup_accounting_driver")
          (car (eval (cons (quote list) (slice (compile_scan_plan (quote scan) nil nil '() (scheme "(lambda () true)") '()) 3 5))))
          (cadr (eval (cons (quote list) (slice (compile_scan_plan (quote scan) nil nil '() (scheme "(lambda () true)") '()) 3 5))))
          '() (lambda () true)
          '(".account:value") (lambda (acc value) (+ acc value))
          0 + false))
    expect:
      data: [32004000]

cleanup:
  - sql: "DROP TABLE IF EXISTS lookup_invalidation_driver"
  - sql: "DROP TABLE IF EXISTS lookup_invalidation_source"
