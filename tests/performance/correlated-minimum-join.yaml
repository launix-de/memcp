metadata:
  version: '1.0'
  description: Selective joins with correlated multi-table MIN with supplier-first ordering
  isolated: true
  perf_ci: true
  performance_rows: 8192
setup:
- sql: DROP TABLE IF EXISTS cm_region
- sql: CREATE TABLE cm_region (r_id INT, r_name TEXT) ENGINE=memory
- sql: DROP TABLE IF EXISTS cm_nation
- sql: CREATE TABLE cm_nation (n_id INT, n_region INT, n_name TEXT) ENGINE=memory
- sql: DROP TABLE IF EXISTS cm_supplier
- sql: CREATE TABLE cm_supplier (s_id INT, s_nation INT, s_name TEXT, s_acctbal INT) ENGINE=memory
- sql: DROP TABLE IF EXISTS cm_part
- sql: CREATE TABLE cm_part (p_id INT, p_size INT, p_type TEXT) ENGINE=memory
- sql: DROP TABLE IF EXISTS cm_partsupp
- sql: CREATE TABLE cm_partsupp (ps_part INT, ps_supplier INT, ps_cost INT) ENGINE=memory
- sql: INSERT INTO cm_region VALUES (0,'EUROPE'),(1,'ASIA')
- scm: "(begin\n (insert (table \"memcp-tests\" \"cm_nation\") '(\"n_id\" \"n_region\" \"n_name\")\n  (map (produceN\
    \ 8) (lambda (i) (list i (mod i 2) (concat \"nation\" i)))))\n (insert (table \"memcp-tests\" \"cm_supplier\"\
    ) '(\"s_id\" \"s_nation\" \"s_name\" \"s_acctbal\")\n  (map (produceN 64) (lambda (i) (list i (mod i 8) (concat\
    \ \"supplier\" i) (mod i 16)))))\n (insert (table \"memcp-tests\" \"cm_part\") '(\"p_id\" \"p_size\" \"p_type\"\
    )\n  (map (produceN 2048) (lambda (i) (list (+ 1 i) (if (equal? (mod i 16) 0) 15 10)\n   (if (equal? (mod i\
    \ 3) 0) \"SMALL BRASS\" \"TIN\")))))\n (insert (table \"memcp-tests\" \"cm_partsupp\") '(\"ps_part\" \"ps_supplier\"\
    \ \"ps_cost\")\n  (map (produceN 8192) (lambda (i) (begin\n   (define part (mod i 2048)) (define slot (floor\
    \ (/ i 2048)))\n   (list (+ part 1) (mod (+ part (* slot 7)) 64) (+ 10 slot))))))\n (map '(\"region\" \"nation\"\
    \ \"supplier\" \"part\" \"partsupp\") (lambda (name)\n  (rebuild (table \"memcp-tests\" (concat \"cm_\" name))\
    \ true false))) true)"
test_cases:
- name: Correlated regional minimum preserves all selected parts
  sql: "SELECT p.p_id, s.s_id, ps.ps_cost\nFROM cm_part p, cm_supplier s, cm_partsupp ps, cm_nation n, cm_region\
    \ r\nWHERE p.p_id=ps.ps_part AND s.s_id=ps.ps_supplier\n AND p.p_size=15 AND p.p_type LIKE '%BRASS'\n AND s.s_nation=n.n_id\
    \ AND n.n_region=r.r_id AND r.r_name='EUROPE'\n AND ps.ps_cost=(SELECT MIN(p2.ps_cost) FROM cm_partsupp p2,\
    \ cm_supplier s2, cm_nation n2, cm_region r2\n  WHERE p.p_id=p2.ps_part AND s2.s_id=p2.ps_supplier AND s2.s_nation=n2.n_id\n\
    \   AND n2.n_region=r2.r_id AND r2.r_name='EUROPE')\nORDER BY s.s_acctbal DESC,n.n_name,s.s_name,p.p_id LIMIT\
    \ 100"
