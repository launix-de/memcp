- name: 'Perf: selective joined correlated minimum'
  sql: "SELECT p.p_id, s.s_id, ps.ps_cost\nFROM cm_part p, cm_supplier s, cm_partsupp ps, cm_nation n, cm_region\
    \ r\nWHERE p.p_id=ps.ps_part AND s.s_id=ps.ps_supplier\n AND p.p_size=15 AND p.p_type LIKE '%BRASS'\n AND s.s_nation=n.n_id\
    \ AND n.n_region=r.r_id AND r.r_name='EUROPE'\n AND ps.ps_cost=(SELECT MIN(p2.ps_cost) FROM cm_partsupp p2,\
    \ cm_supplier s2, cm_nation n2, cm_region r2\n  WHERE p.p_id=p2.ps_part AND s2.s_id=p2.ps_supplier AND s2.s_nation=n2.n_id\n\
    \   AND n2.n_region=r2.r_id AND r2.r_name='EUROPE')\nORDER BY s.s_acctbal DESC,n.n_name,s.s_name,p.p_id LIMIT\
    \ 100"
  warmup: 2
  timing_samples: 5
  threshold_ms: 60000
  timeout: 60
  expect:
    rows: 43
    data: *id001
- name: Introduce tied minimum, NULL costs and a missing regional domain
  sql: INSERT INTO cm_partsupp VALUES (1,2,10),(1,4,NULL)
- name: Remove the only minimum and keep remaining regional suppliers
  sql: DELETE FROM cm_partsupp WHERE ps_part=49 AND ps_cost=10
- name: Remove every regional supplier of another part
  sql: DELETE FROM cm_partsupp WHERE ps_part=97 AND ps_supplier IN (32,46)
- name: Ties survive and NULL or empty domains do not become minima
  sql: "SELECT p.p_id, s.s_id, ps.ps_cost\nFROM cm_part p, cm_supplier s, cm_partsupp ps, cm_nation n, cm_region\
    \ r\nWHERE p.p_id=ps.ps_part AND s.s_id=ps.ps_supplier\n AND p.p_size=15 AND p.p_type LIKE '%BRASS'\n AND s.s_nation=n.n_id\
    \ AND n.n_region=r.r_id AND r.r_name='EUROPE'\n AND ps.ps_cost=(SELECT MIN(p2.ps_cost) FROM cm_partsupp p2,\
    \ cm_supplier s2, cm_nation n2, cm_region r2\n  WHERE p.p_id=p2.ps_part AND s2.s_id=p2.ps_supplier AND s2.s_nation=n2.n_id\n\
    \   AND n2.n_region=r2.r_id AND r2.r_name='EUROPE')\n AND p.p_id IN (1,49,97) ORDER BY s.s_acctbal DESC,n.n_name,s.s_name,p.p_id\
    \ LIMIT 100"
  expect:
    rows: 3
    data:
    - p_id: 49
      s_id: 62
      ps_cost: 12
    - p_id: 1
      s_id: 2
      ps_cost: 10
    - p_id: 1
      s_id: 0
      ps_cost: 10
- name: Invalid correlated column remains an error
  sql: "SELECT p.p_id, s.s_id, ps.ps_cost\nFROM cm_part p, cm_supplier s, cm_partsupp ps, cm_nation n, cm_region\
    \ r\nWHERE p.p_id=ps.ps_part AND s.s_id=ps.ps_supplier\n AND p.p_size=15 AND p.p_type LIKE '%BRASS'\n AND s.s_nation=n.n_id\
    \ AND n.n_region=r.r_id AND r.r_name='EUROPE'\n AND ps.ps_cost=(SELECT MIN(p2.no_such_column) FROM cm_partsupp\
    \ p2, cm_supplier s2, cm_nation n2, cm_region r2\n  WHERE p.p_id=p2.ps_part AND s2.s_id=p2.ps_supplier AND s2.s_nation=n2.n_id\n\
    \   AND n2.n_region=r2.r_id AND r2.r_name='EUROPE')\nORDER BY s.s_acctbal DESC,n.n_name,s.s_name,p.p_id LIMIT\
    \ 100"
  expect:
    error: true
