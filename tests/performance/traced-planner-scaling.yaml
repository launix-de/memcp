metadata:
  version: "1.0"
  description: "Trace-derived planner scaling and preparation ownership budgets"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS tps_prop"
  - sql: "DROP TABLE IF EXISTS tps_parent"
  - sql: "DROP TABLE IF EXISTS tps_assignment"
  - sql: |
      CREATE TABLE tps_parent (
        id INT PRIMARY KEY,
        owner_id INT,
        is_public BOOL,
        team_id INT
      )
  - sql: |
      CREATE TABLE tps_assignment (
        id INT PRIMARY KEY,
        team_id INT,
        member_id INT
      )
  - sql: |
      CREATE TABLE tps_prop (
        id INT PRIMARY KEY,
        parent_id INT,
        archived BOOL
      )
  - sql: "INSERT INTO tps_parent (id, owner_id, is_public, team_id) VALUES (1, 7, FALSE, 10), (2, 8, TRUE, 20)"
  - sql: "INSERT INTO tps_assignment (id, team_id, member_id) VALUES (1, 10, 7), (2, 20, 9)"
  - sql: "INSERT INTO tps_prop (id, parent_id, archived) VALUES (1, 1, FALSE)"
  - sql: "INSERT INTO tps_prop SELECT id + 1, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 2, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 4, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 8, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 16, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 32, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 64, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 128, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 256, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"
  - sql: "INSERT INTO tps_prop SELECT id + 512, CASE WHEN id % 2 = 0 THEN 1 ELSE 2 END, FALSE FROM tps_prop"

test_cases:
  - name: "Independent nested scalar aggregates compile within a linear budget"
    max_time: 1.0
    max_planner_time_ms: 350
    max_compile_phase_ms:
      reorder_ns: 100
      recipe_emit_ns: 600
    max_compile_metrics:
      plan_nodes: 6500
    max_plan_size: 100000
    sql: |
      SELECT
        (SELECT SUM(1) FROM tps_prop item_1 WHERE item_1.id = 1 AND COALESCE((SELECT (parent_1.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_1 WHERE member_1.team_id = parent_1.team_id AND member_1.member_id = 7 LIMIT 1)) FROM tps_parent parent_1 WHERE parent_1.id = item_1.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_1,
        (SELECT SUM(1) FROM tps_prop item_2 WHERE item_2.id = 1 AND COALESCE((SELECT (parent_2.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_2 WHERE member_2.team_id = parent_2.team_id AND member_2.member_id = 7 LIMIT 1)) FROM tps_parent parent_2 WHERE parent_2.id = item_2.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_2,
        (SELECT SUM(1) FROM tps_prop item_3 WHERE item_3.id = 1 AND COALESCE((SELECT (parent_3.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_3 WHERE member_3.team_id = parent_3.team_id AND member_3.member_id = 7 LIMIT 1)) FROM tps_parent parent_3 WHERE parent_3.id = item_3.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_3,
        (SELECT SUM(1) FROM tps_prop item_4 WHERE item_4.id = 1 AND COALESCE((SELECT (parent_4.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_4 WHERE member_4.team_id = parent_4.team_id AND member_4.member_id = 7 LIMIT 1)) FROM tps_parent parent_4 WHERE parent_4.id = item_4.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_4,
        (SELECT SUM(1) FROM tps_prop item_5 WHERE item_5.id = 1 AND COALESCE((SELECT (parent_5.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_5 WHERE member_5.team_id = parent_5.team_id AND member_5.member_id = 7 LIMIT 1)) FROM tps_parent parent_5 WHERE parent_5.id = item_5.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_5,
        (SELECT SUM(1) FROM tps_prop item_6 WHERE item_6.id = 1 AND COALESCE((SELECT (parent_6.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_6 WHERE member_6.team_id = parent_6.team_id AND member_6.member_id = 7 LIMIT 1)) FROM tps_parent parent_6 WHERE parent_6.id = item_6.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_6,
        (SELECT SUM(1) FROM tps_prop item_7 WHERE item_7.id = 1 AND COALESCE((SELECT (parent_7.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_7 WHERE member_7.team_id = parent_7.team_id AND member_7.member_id = 7 LIMIT 1)) FROM tps_parent parent_7 WHERE parent_7.id = item_7.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_7,
        (SELECT SUM(1) FROM tps_prop item_8 WHERE item_8.id = 1 AND COALESCE((SELECT (parent_8.owner_id = 7 OR EXISTS (SELECT TRUE FROM tps_assignment member_8 WHERE member_8.team_id = parent_8.team_id AND member_8.member_id = 7 LIMIT 1)) FROM tps_parent parent_8 WHERE parent_8.id = item_8.parent_id LIMIT 1), FALSE) LIMIT 1) AS metric_8
    expect:
      rows: 1
      data:
        - metric_1: 1
          metric_2: 1
          metric_3: 1
          metric_4: 1
          metric_5: 1
          metric_6: 1
          metric_7: 1
          metric_8: 1
