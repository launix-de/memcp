- name: An invocation catalog COUNT reduces business cardinality before native group insertion
  syntax: tsql
  setup:
  - sql: CREATE TABLE catalog_count_rows(id INT PRIMARY KEY)
  - scm: |
      (begin
        (define rows (try
          (lambda () (table "memcp-tests" false "catalog_count_rows" false nil))
          (lambda (cause)
            (if (and (string? cause)
              (equal? cause "table expects database, database_ignorecase, name, name_ignorecase"))
              (table "memcp-tests" false "catalog_count_rows" false)
              (error cause)))))
        (insert rows (list "id")
          (map (produceN 8192) (lambda (id) (list id))))
        (rebuild rows true false))
  sql: |
    SELECT COUNT(*) AS n FROM catalog_count_rows b
    JOIN syscolumns c ON c.name=N'id'
    JOIN sysobjects o ON o.id=c.id AND o.name=N'catalog_count_rows'
    WHERE OBJECTPROPERTY(o.id,N'IsUserTable')=1 AND b.id>=0
  expect: {rows: 1,data: [{n: 8192}]}
  cleanup:
  - sql: DROP TABLE IF EXISTS catalog_count_rows
  performance_rows: 8192
  threshold_ms: 1500
  warmup: 0
  timing_samples: 3
  timing_aggregation: total

