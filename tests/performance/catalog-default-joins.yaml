test_cases:
- name: Default owner and legacy column joins retain every nonstandard declaration
  syntax: tsql
  sql: "SELECT   \n        b.name AS TABLE_NAME, \n        d.name AS COLUMN_NAME, \n        a.name AS CONSTRAINT_NAME,\
    \ \n        c.text AS DEFAULT_VALUE,\n        'DF_' + b.name + '_' + d.name AS STANDARD_NAME\n\nFROM sys.objects\
    \ a INNER JOIN \n        (SELECT name, object_id \n         FROM sys.objects  \n         WHERE type = 'U') b\
    \ on (a.parent_object_id = b.object_id) \n                      INNER JOIN sys.syscomments c ON (a.object_id\
    \ = c.id) \n                      INNER JOIN sys.syscolumns d ON (d.cdefault = a.object_id)                \
    \                           \n WHERE a.type = 'D' and a.name <> 'DF_' + b.name + '_' + d.name\n and schema_name(schema_id)='dbo'\n\
    \ ORDER BY b.name, a.name"
  performance_rows: 24
  warmup: 0
  timing_samples: 3
  timing_aggregation: total
  threshold_ms: 20000
  expect:
    rows: 24
    data:
    - TABLE_NAME: catalog_default_000
      COLUMN_NAME: flag
      CONSTRAINT_NAME: legacy_default_000
      DEFAULT_VALUE: '9'
      STANDARD_NAME: DF_catalog_default_000_flag
