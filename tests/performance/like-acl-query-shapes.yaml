        WHERE filename_file.filename LIKE '%rare-document%'
        UNION
        SELECT search_file.id
        FROM pla_file search_file
        WHERE search_file.search_text LIKE '%rare-document%'
      )
        AND COALESCE((
          SELECT CASE WHEN site.direct_flag = 1 THEN TRUE ELSE (
