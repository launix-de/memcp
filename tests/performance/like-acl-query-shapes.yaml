                  AND assignment.allowed = 1
                LIMIT 1
              ) OR COALESCE((
                SELECT override.allowed
                FROM pla_override override
                WHERE override.site_id = site.id
                  AND override.actor_id = 7
                LIMIT 1
              ), FALSE)
            ) END
            FROM pla_site site
            WHERE site.id = d.site_id
            LIMIT 1
