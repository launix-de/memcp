              ), FALSE)
            ) END
            FROM pla_site site
            WHERE site.id = d.site_id
            LIMIT 1
          ), FALSE)
          AND TRUE
      ) counted
    expect:
      rows: 1
      result_contains:
        - "decision global_membership_row_count"
        - "decision scan_access_path"
        - "chosen scan_recset"
