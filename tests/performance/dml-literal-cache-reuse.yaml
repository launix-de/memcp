#
# Compare identical literal INSERT/UPDATE/DELETE workloads on base and candidate.
# Assert data effects here; query-cache-growth.yaml separately enforces the DML
# cache-key bounds introduced by literal parameterization. Requiring those new
# bounds during baseline measurement would abort A/B before comparison.
#
# Each case rebuilds its table, disables warmup and runs once because INSERT,
# increment and DELETE workloads cannot safely reuse their mutated fixture.
metadata:
  version: "1.0"
  description: "Literal INSERT/UPDATE/DELETE workloads preserve data effects across A/B measurement"
  isolated: true

test_cases:
  - name: "Repeated single-row INSERT with distinct literals inserts 500 rows"
    warmup: false
    repetitions: 1
    threshold_ms: 2000
    setup:
      - sql: "DROP TABLE IF EXISTS dlc_bench"
      - sql: "CREATE TABLE dlc_bench (id INT PRIMARY KEY, col INT) ENGINE=sloppy"
      - scm: '(rebuild (table "memcp-tests" "dlc_bench") true false)'
    scm: |
      (begin
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define cache (newcachemap))
        (define exec (lambda (q) (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
          (lambda (row) nil) (lambda (_fields) nil))))
        (map (produceN 500) (lambda (i)
          (exec (concat "INSERT INTO dlc_bench VALUES (" (string i) ", " (string (* i 2)) ")"))))
        (define acc (newsession)) (acc "n" 0)
        (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" "SELECT COUNT(*) AS n FROM dlc_bench" nil "root" sess true)
          (lambda (row) (acc "n" (get_assoc row "n"))) (lambda (_fields) nil))
        (if (equal? (acc "n") 500)
          true
          (error (concat "rows=" (acc "n")))))
    expect:
      rows: 1
      result_contains: ["true"]

  - name: "Repeated UPDATE col=col+1 WHERE id=<literal> increments each row once"
    warmup: false
    repetitions: 1
    threshold_ms: 2000
    setup:
      - sql: "DROP TABLE IF EXISTS dlc_bench"
      - sql: "CREATE TABLE dlc_bench (id INT PRIMARY KEY, col INT) ENGINE=sloppy"
      - scm: |
          (begin
            (insert (table "memcp-tests" "dlc_bench") '("id" "col")
              (map (produceN 500) (lambda (i) (list i (* i 2)))))
            (rebuild (table "memcp-tests" "dlc_bench") true false)
            true)
    scm: |
      (begin
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define cache (newcachemap))
        (map (produceN 500) (lambda (i)
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests"
              (concat "UPDATE dlc_bench SET col = col + 1 WHERE id = " (string i))
              nil "root" sess true)
            (lambda (row) nil) (lambda (_fields) nil))))
        (define acc (newsession)) (acc "s" 0)
        (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" "SELECT SUM(col) AS s FROM dlc_bench" nil "root" sess true)
          (lambda (row) (acc "s" (get_assoc row "s"))) (lambda (_fields) nil))
        /* every row's col was 2*id, then incremented by exactly 1 once each:
        sum(2*id for id in [0,500)) + 500 = 2*124750 + 500 = 250000 */
        (if (equal? (acc "s") 250000)
          true
          (error (concat "sum=" (acc "s")))))
    expect:
      rows: 1
      result_contains: ["true"]

  - name: "Repeated DELETE FROM t WHERE TRUE LIMIT 1 empties the table"
    # No literal varies here at all -- the exact-text cache already covers
    # this (predates the literal-folding fix). Kept as a guard that DML
    # literal-folding never regresses the plain exact-cache path for a query
    # that has nothing to fold.
    warmup: false
    repetitions: 1
    threshold_ms: 2000
    setup:
      - sql: "DROP TABLE IF EXISTS dlc_bench"
      - sql: "CREATE TABLE dlc_bench (id INT PRIMARY KEY, col INT) ENGINE=sloppy"
      - scm: |
          (begin
            (insert (table "memcp-tests" "dlc_bench") '("id" "col")
              (map (produceN 250) (lambda (i) (list i i))))
            (rebuild (table "memcp-tests" "dlc_bench") true false)
            true)
    scm: |
      (begin
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define cache (newcachemap))
        (define q "DELETE FROM dlc_bench WHERE TRUE LIMIT 1")
        (map (produceN 250) (lambda (i)
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
            (lambda (row) nil) (lambda (_fields) nil))))
        (define acc (newsession)) (acc "n" 0)
        (sql_execute_formula sess nil
          (cached_parse cache (list parse_sql) "memcp-tests" "SELECT COUNT(*) AS n FROM dlc_bench" nil "root" sess true)
          (lambda (row) (acc "n" (get_assoc row "n"))) (lambda (_fields) nil))
        (if (equal? (acc "n") 0)
          true
          (error (concat "remaining=" (acc "n")))))
    expect:
      rows: 1
      result_contains: ["true"]

cleanup:
  - sql: "DROP TABLE IF EXISTS dlc_bench"
