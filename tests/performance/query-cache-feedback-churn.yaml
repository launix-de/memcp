metadata:
  version: "1.0"
  description: "Warm ordered queries amid unrelated bound-predicate learning"
  isolated: true
setup:
  - sql: "DROP TABLE IF EXISTS qfc_access"
  - sql: "CREATE TABLE qfc_access (viewer INT, domain_id INT) ENGINE=sloppy"
  - sql: "INSERT INTO qfc_access VALUES (999,NULL),(998,998),(997,999)"
  - scm: '(rebuild (table "memcp-tests" "qfc_access") true false)'
  - sql: "DROP TABLE IF EXISTS qfc_clock"
  - sql: "CREATE TABLE qfc_clock (id INT PRIMARY KEY) ENGINE=sloppy"
  - sql: "INSERT INTO qfc_clock (id) VALUES (999)"
  - scm: '(rebuild (table "memcp-tests" "qfc_clock") true false)'
  - sql: "DROP TABLE IF EXISTS qfc_document"
  - sql: "CREATE TABLE qfc_document (id INT PRIMARY KEY, category INT) ENGINE=sloppy"
  - scm: |
      (begin
        (insert (table "memcp-tests" "qfc_document") '("id" "category")
          (map (produceN 1000) (lambda (i) (list i (mod i 10)))))
        (rebuild (table "memcp-tests" "qfc_document") true false)
        (globalvars "qfc_sequence" 1000))
test_cases:
  - name: "ACL counts share a cost regime across different named session bindings"
    performance_rows: 1000
    threshold_ms: 5000
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT COUNT(*) AS n FROM qfc_clock a LEFT JOIN qfc_document z ON z.id=a.id WHERE a.id>@clock AND COALESCE((SELECT CASE WHEN EXISTS(SELECT 1 FROM qfc_access x WHERE x.viewer=@viewer AND x.domain_id IS NULL LIMIT 1) THEN TRUE ELSE EXISTS(SELECT 1 FROM qfc_access y WHERE y.viewer=@viewer AND y.domain_id=b.id LIMIT 1) END FROM qfc_document b WHERE b.id=a.id LIMIT 1),FALSE)")
        (define rows (newsession))
        (rows "n" 0)
        (reduce (produceN 16) (lambda (_ i) (begin
          (sess "viewer" (+ 999 i))
          (sess "clock" i)
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
            (lambda (row) (rows "n" (+ (rows "n") (cadr row)))) (lambda (_fields) nil)))) nil)
        (if (equal? (rows "n") 1) true (error "changing named ACL bindings changed counts")))
    expect:
      rows: 1
      result_contains: ["true"]
  - name: "Named session ACL counts do not recompile on every cached execution"
    performance_rows: 1000
    threshold_ms: 5000
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (sess "viewer" 999)
        (define q "SELECT COUNT(*) AS n FROM qfc_clock a LEFT JOIN qfc_document z ON z.id=a.id WHERE COALESCE((SELECT CASE WHEN EXISTS(SELECT 1 FROM qfc_access x WHERE x.viewer=@viewer AND x.domain_id IS NULL LIMIT 1) THEN TRUE ELSE EXISTS(SELECT 1 FROM qfc_access y WHERE y.viewer=@viewer AND y.domain_id=b.id LIMIT 1) END FROM qfc_document b WHERE b.id=a.id LIMIT 1),FALSE)")
        (define rows (newsession))
        (rows "n" 0)
        (reduce (produceN 16) (lambda (_ i)
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
            (lambda (row) (rows "n" (+ (rows "n") (cadr row)))) (lambda (_fields) nil))) nil)
        (if (equal? (rows "n") 16) true (error "named session ACL count changed results")))
    expect:
      rows: 1
      result_contains: ["true"]
  - name: "Changing runtime cutoffs retain a singleton ordered plan"
    performance_rows: 1000
    threshold_ms: 1000
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT a.id,b.category,c.category,d.category FROM qfc_clock a LEFT JOIN qfc_document b ON b.id=a.id LEFT JOIN qfc_document c ON c.id=a.id LEFT JOIN qfc_document d ON d.id=a.id WHERE a.id > @cutoff ORDER BY a.id LIMIT 72")
        (define rows (newsession))
        (rows "n" 0)
        (reduce (produceN 16) (lambda (_ i)
          (begin
            (sess "cutoff" (+ 998 i))
            (sql_execute_formula sess nil
              (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
              (lambda (_row) (rows "n" (+ (rows "n") 1)))
              (lambda (_fields) nil)))) nil)
        (if (equal? (rows "n") 1) true (error "runtime cutoff changed query results")))
    expect:
      rows: 1
      result_contains: ["true"]
  - name: "Changing runtime cutoffs retain an ACL count plan"
    performance_rows: 1000
    # Sixteen complete requests; measured baseline is about 2-4 seconds.
    # The A/B ratio remains enforced independently of this absolute ceiling.
    threshold_ms: 5000
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT COUNT(*) AS n FROM qfc_clock a WHERE a.id > @cutoff AND COALESCE((SELECT CASE WHEN b.category=9 THEN TRUE ELSE EXISTS(SELECT 1 FROM qfc_document c WHERE c.id=b.id AND c.category=9) END FROM qfc_document b WHERE b.id=a.id LIMIT 1),FALSE)")
        (define rows (newsession))
        (rows "n" 0)
        (reduce (produceN 16) (lambda (_ i)
          (begin
            (sess "cutoff" (+ 998 i))
            (sql_execute_formula sess nil
              (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
              (lambda (row) (rows "n" (+ (rows "n") (cadr row))))
              (lambda (_fields) nil)))) nil)
        (if (equal? (rows "n") 1) true (error "runtime cutoff changed ACL count results")))
    expect:
      rows: 1
      result_contains: ["true"]
  - name: "Ordered cache reuse survives a sequence of unrelated learned filters"
    performance_rows: 1000
    threshold_ms: 1000
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define q "SELECT a.id FROM qfc_document a LEFT JOIN qfc_document b ON b.id=a.id LEFT JOIN qfc_document c ON c.id=b.id ORDER BY a.id LIMIT 2")
        (define rows (newsession))
        (rows "n" 0)
        (define emit (lambda (_row) (rows "n" (+ (rows "n") 1))))
        (define run (lambda ()
          (sql_execute_formula sess nil
            (cached_parse cache (list parse_sql) "memcp-tests" q nil "root" sess true)
            emit (lambda (_fields) nil))))
        (run)
        (define start (globalvars "qfc_sequence"))
        (globalvars "qfc_sequence" (+ start 16))
        (map (produceN 16) (lambda (i) (begin
          (define callback (list 'lambda (list 'x) (list '< 'x (+ start i))))
          (define access (compile_scan_access '("category") callback))
          (scan_recset nil (table "memcp-tests" "qfc_document") (car access)
            (map (cadr access) (lambda (v) (eval v))) '("category") (eval callback))
          (run))))
        (if (equal? (rows "n") 34) true (error "ordered cache churn changed results")))
    expect:
      rows: 1
      result_contains: ["true"]
cleanup:
  - sql: "DROP TABLE IF EXISTS qfc_access"
  - sql: "DROP TABLE IF EXISTS qfc_clock"
  - sql: "DROP TABLE IF EXISTS qfc_document"
