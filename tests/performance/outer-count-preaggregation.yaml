metadata:
  version: '1.0'
  description: Outer count preaggregation preserves duplicate and NULL keys
  isolated: true
  perf_ci: true
  performance_rows: 8192
setup:
- sql: DROP TABLE IF EXISTS qa_customer
- sql: DROP TABLE IF EXISTS qa_orders
- sql: CREATE TABLE qa_customer(c_custkey INT) ENGINE=memory
- sql: CREATE TABLE qa_orders(o_orderkey INT, o_custkey INT, o_comment VARCHAR(64)) ENGINE=memory
- scm: |-
    (begin
     (insert (table "memcp-tests" "qa_customer") '("c_custkey") (map (produceN 512) (lambda (i) (list (+ i 1)))))
     (insert (table "memcp-tests" "qa_orders") '("o_orderkey" "o_custkey" "o_comment")
      (map (produceN 8192) (lambda (i) (list (if (equal? (mod i 17) 0) nil (+ i 1))
       (if (equal? (mod i 19) 0) nil (+ 1 (mod i 600)))
       (if (equal? (mod i 23) 0) nil (if (equal? (mod i 7) 0) "special pending requests" "ordinary"))))))
     (insert (table "memcp-tests" "qa_customer") '("c_custkey") (list (list 1) (list nil) (list nil) (list 999)))
     (rebuild (table "memcp-tests" "qa_customer") true false)
     (rebuild (table "memcp-tests" "qa_orders") true false) true)
test_cases:
- name: Outer count grouping
  sql: |
    select
      c_count,
      count(*) as custdist
    from
      (
        select
          c_custkey,
          count(o_orderkey)
        from
          qa_customer left outer join qa_orders on
            c_custkey = o_custkey
            and o_comment not like '%special%requests%'
        group by
          c_custkey
      ) as c_qa_orders (c_custkey, c_count)
    group by
      c_count
    order by
      custdist desc,
      c_count desc;
  expect: &id001
    rows: 7
    data:
    - c_count: 10
      custdist: 223
    - c_count: 11
      custdist: 134
    - c_count: 9
      custdist: 120
    - c_count: 12
      custdist: 19
    - c_count: 8
      custdist: 15
    - c_count: 0
      custdist: 2
    - c_count: 24
      custdist: 1
- name: 'Perf: Outer count grouping'
  sql: |
    select
      c_count,
      count(*) as custdist
    from
      (
        select
          c_custkey,
          count(o_orderkey)
        from
          qa_customer left outer join qa_orders on
            c_custkey = o_custkey
            and o_comment not like '%special%requests%'
        group by
          c_custkey
      ) as c_qa_orders (c_custkey, c_count)
    group by
      c_count
    order by
      custdist desc,
      c_count desc;
  warmup: 2
  timing_samples: 5
  timeout: 60
  threshold_ms: 60000
  expect: *id001
- name: Preaggregated outer count grouping
  sql: |-
    SELECT c_count, COUNT(*) AS custdist FROM (
     SELECT c.c_custkey, SUM(COALESCE(g.n,0)) AS c_count
     FROM qa_customer c LEFT JOIN (
      SELECT o_custkey, COUNT(o_orderkey) AS n FROM qa_orders
      WHERE o_comment NOT LIKE '%special%requests%' GROUP BY o_custkey
     ) g ON g.o_custkey=c.c_custkey
     GROUP BY c.c_custkey
    ) cc GROUP BY c_count ORDER BY custdist DESC,c_count DESC
  expect: *id001
- name: 'Perf: Preaggregated outer count grouping'
  sql: |-
    SELECT c_count, COUNT(*) AS custdist FROM (
     SELECT c.c_custkey, SUM(COALESCE(g.n,0)) AS c_count
     FROM qa_customer c LEFT JOIN (
      SELECT o_custkey, COUNT(o_orderkey) AS n FROM qa_orders
      WHERE o_comment NOT LIKE '%special%requests%' GROUP BY o_custkey
     ) g ON g.o_custkey=c.c_custkey
     GROUP BY c.c_custkey
    ) cc GROUP BY c_count ORDER BY custdist DESC,c_count DESC
  warmup: 2
  timing_samples: 5
  timeout: 60
  threshold_ms: 60000
  expect: *id001
- name: Both inputs preaggregated with multiplicity
  sql: |-
    SELECT COALESCE(g.n,0)*c.m AS c_count, COUNT(*) AS custdist
    FROM (SELECT c_custkey, COUNT(*) AS m FROM qa_customer GROUP BY c_custkey) c
    LEFT JOIN (SELECT o_custkey, COUNT(o_orderkey) AS n FROM qa_orders
     WHERE o_comment NOT LIKE '%special%requests%' GROUP BY o_custkey) g
    ON g.o_custkey=c.c_custkey
    GROUP BY COALESCE(g.n,0)*c.m ORDER BY custdist DESC,c_count DESC
  expect: *id001
- name: 'Perf: Both inputs preaggregated with multiplicity'
  sql: |-
    SELECT COALESCE(g.n,0)*c.m AS c_count, COUNT(*) AS custdist
    FROM (SELECT c_custkey, COUNT(*) AS m FROM qa_customer GROUP BY c_custkey) c
    LEFT JOIN (SELECT o_custkey, COUNT(o_orderkey) AS n FROM qa_orders
     WHERE o_comment NOT LIKE '%special%requests%' GROUP BY o_custkey) g
    ON g.o_custkey=c.c_custkey
    GROUP BY COALESCE(g.n,0)*c.m ORDER BY custdist DESC,c_count DESC
  expect: *id001
  warmup: 2
  timing_samples: 5
  timeout: 60
  threshold_ms: 60000
- name: Invalid right-side count operand is rejected
  sql: SELECT c.c_custkey, COUNT(o.missing_column) FROM qa_customer c LEFT JOIN qa_orders o ON o.o_custkey=c.c_custkey
    GROUP BY c.c_custkey
  expect:
    error: true
cleanup:
- sql: DROP TABLE qa_orders
- sql: DROP TABLE qa_customer
