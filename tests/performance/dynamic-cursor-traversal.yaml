test_cases:
- name: Every composite key is fetched exactly once and both result sets agree
  expect:
    result: []
  threshold_ms: 60000
  timeout: 60
  performance_rows: 512
  warmup: 0
  timing_samples: 3
  timing_aggregation: total
  scm: |-
    (begin
      (define s (newsession)) (s "username" "root") (s "schema" "memcp-tests")
      (define output (newsession)) (output "rows" '())
      (define close (lambda () (begin
        (tx_rollback s) (tsql_cursor_close_all s) (tsql_temporary_close s))))
      (define rows (try (lambda () (begin
        (tsql_execute_request "memcp-tests" "BEGIN TRANSACTION;\nCREATE TABLE #walk(object_name VARCHAR(100) NOT NULL,permission_name VARCHAR(100) NOT NULL,PRIMARY KEY(object_name,permission_name));\nCREATE TABLE #present(object_name VARCHAR(100) NOT NULL,permission_name VARCHAR(100) NOT NULL,PRIMARY KEY(object_name,permission_name));\nCREATE TABLE #seen(object_name VARCHAR(100) NOT NULL,permission_name VARCHAR(100) NOT NULL,PRIMARY KEY(object_name,permission_name));\nINSERT #walk SELECT object_name,permission_name FROM cursor_walk_source;\n\nDELETE #seen;\nDECLARE walk_cursor CURSOR FOR\n  SELECT l.object_name,l.permission_name FROM #walk l\n  LEFT JOIN #present r ON l.object_name COLLATE Latin1_General_CI_AS=r.object_name\n    AND l.permission_name COLLATE Latin1_General_CI_AS=r.permission_name\n  WHERE r.object_name IS NULL;\nDECLARE @object VARCHAR(100),@permission VARCHAR(100);\nOPEN walk_cursor;\nFETCH NEXT FROM walk_cursor INTO @object,@permission;\nWHILE @@FETCH_STATUS=0\nBEGIN\n  INSERT #seen VALUES(@object,@permission);\n  FETCH NEXT FROM walk_cursor INTO @object,@permission;\nEND;\nCLOSE walk_cursor;\nDEALLOCATE walk_cursor;\nSELECT l.object_name,l.permission_name FROM cursor_walk_source l\n  LEFT JOIN #seen r ON l.object_name=r.object_name AND l.permission_name=r.permission_name\n  WHERE r.object_name IS NULL\nUNION ALL\nSELECT r.object_name,r.permission_name FROM #seen r\n  LEFT JOIN cursor_walk_source l ON l.object_name=r.object_name AND l.permission_name=r.permission_name\n  WHERE l.object_name IS NULL;\n\nCOMMIT TRANSACTION;" s nil 0
          (lambda (row) (output "rows" (append (output "rows") row))) (lambda args true))
        (output "rows")))
        (lambda (failure) (begin (close) (error failure)))))
      (close)
      rows)
