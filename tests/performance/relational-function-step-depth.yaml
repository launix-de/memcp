# Separate depth control fixed before measurement; five cold-inclusive samples.
metadata:
  syntax: tsql
  isolated: true
  perf_ci: true
  performance_shard_weight: 6
  max_regression_pct: 20
  description: Accumulated relational assignment depth scales without repeated namespace tree scans
setup:
- sql: CREATE TABLE udf_depth_ids(id INT PRIMARY KEY)
- sql: INSERT udf_depth_ids VALUES(1),(2),(3)
- sql: CREATE TABLE udf_depth_amounts(id INT,amount INT)
- sql: INSERT udf_depth_amounts VALUES(1,3),(2,NULL)
- sql: |
    CREATE FUNCTION dbo.udf_depth_8(@id INT) RETURNS INT AS BEGIN
      DECLARE @total INT=0,@part INT;
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      SELECT @part=SUM(amount) FROM udf_depth_amounts WHERE id=@id;
      SET @total=@total+ISNULL(@part,0);
      RETURN @total;
    END
