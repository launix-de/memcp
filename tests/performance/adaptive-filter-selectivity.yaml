metadata:
  performance_shard_weight: 4
  version: "1.0"
  description: "Repeated skewed filters train cardinality estimates before join planning"
  isolated: true

fixture_setup: &afs_fixture
  - sql: "DROP TABLE IF EXISTS afs_fact"
  - sql: "DROP TABLE IF EXISTS afs_dimension"
  - sql: "CREATE TABLE afs_dimension (id INT PRIMARY KEY, label VARCHAR(80)) ENGINE=sloppy"
  - sql: "CREATE TABLE afs_fact (id INT PRIMARY KEY, dimension_id INT, amount INT) ENGINE=sloppy"
  - scm: |
      (begin
        (insert (table "memcp-tests" "afs_dimension") '("id" "label")
          (map (produceN 2000) (lambda (i)
            (list i (if (< i 1800) "very-common-long-pattern" "other")))))
        (insert (table "memcp-tests" "afs_fact") '("id" "dimension_id" "amount")
          (map (produceN {rows}) (lambda (i) (list i (mod i 2000) 1))))
        (rebuild))
  - sql: "SELECT COUNT(*) FROM afs_dimension WHERE label LIKE '%very-common-long-pattern%'"
  - sql: "SELECT COUNT(*) FROM afs_fact WHERE id < 100"

cleanup:
  - sql: "DROP TABLE IF EXISTS frequency_fact"
  - sql: "DROP TABLE IF EXISTS frequency_dimension"
  - sql: "DROP TABLE IF EXISTS afs_fact"
  - sql: "DROP TABLE IF EXISTS afs_dimension"

test_cases:
  - name: "Learned broad LIKE before selective fact join"
    setup: *afs_fixture
    performance_rows: 20000
    warmup: 3
    timing_samples: 9
    threshold_ms: 5000
    sql: |
      SELECT SUM(f.amount) AS total FROM afs_dimension d
      JOIN afs_fact f ON f.dimension_id = d.id
      WHERE d.label LIKE '%very-common-long-pattern%' AND f.id < 100
    expect:
      rows: 1
      data: [{total: 100}]
  - name: "Cached aggregate after filter feedback"
    setup: *afs_fixture
    performance_rows: 20000
    warmup: 3
    timing_samples: 9
    threshold_ms: 5000
    sql: "SELECT COUNT(*) = FLOOR({rows}/10) AS correct FROM afs_fact WHERE MOD(id, 10) = 0"
    expect:
      rows: 1
      data: [{correct: 1}]

  - name: "Broad text candidate membership with adaptive feedback"
    setup: *afs_fixture
    performance_rows: 20000
    warmup: 3
    timing_samples: 9
    threshold_ms: 5000
    sql: |
      SELECT COUNT(*) = {rows} AS complete FROM afs_fact
      WHERE dimension_id IN (
        SELECT id FROM afs_dimension WHERE label LIKE '%very-common-long-pattern%'
        UNION SELECT id FROM afs_dimension WHERE label LIKE '%other%'
      )
    expect:
      rows: 1
      data: [{complete: 1}]

  - name: "Skewed equality chooses the selective join driver"
    setup:
      - sql: "DROP TABLE IF EXISTS frequency_fact"
      - sql: "DROP TABLE IF EXISTS frequency_dimension"
      - sql: "CREATE TABLE frequency_dimension (id INT PRIMARY KEY, owner_id INT) ENGINE=memory"
      - sql: "CREATE TABLE frequency_fact (id INT PRIMARY KEY, dimension_id INT, batch_id INT, amount INT) ENGINE=memory"
      - scm: |
          (begin
            (insert (table "memcp-tests" "frequency_dimension") '("id" "owner_id")
              (map (produceN 100000) (lambda (i)
                (list i (if (< (mod i 20) 19) 1 (+ 2 (mod (floor (/ i 20)) 99)))))))
            (insert (table "memcp-tests" "frequency_fact") '("id" "dimension_id" "batch_id" "amount")
              (map (produceN 800000) (lambda (i) (list i (mod i 100000) (mod i 100) 1))))
            (rebuild))
    performance_rows: 800000
    warmup: 0
    timing_samples: 10
    timing_aggregation: total
    threshold_ms: 15000
    sql: "SELECT SUM(f.amount) AS total FROM frequency_dimension d JOIN frequency_fact f ON f.dimension_id=d.id WHERE d.owner_id=1 AND f.batch_id=1"
    expect:
      rows: 1
      data: [{total: 8000}]
