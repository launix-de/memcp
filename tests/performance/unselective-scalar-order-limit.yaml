metadata:
  version: "1.0"
  description: "Unselective scalar ORDER LIMIT late projection"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS usol_item"
  - sql: "DROP TABLE IF EXISTS usol_file"
  - sql: "DROP TABLE IF EXISTS usol_parent"
  - sql: "DROP TABLE IF EXISTS usol_assignment"
  - sql: "DROP TABLE IF EXISTS usol_projection"
  - sql: "DROP TABLE IF EXISTS usol_item_multi"
  - sql: "DROP TABLE IF EXISTS usol_file_multi"
  - sql: "DROP TABLE IF EXISTS usol_text_outer"
  - sql: "DROP TABLE IF EXISTS usol_text_inner"
  - sql: "CREATE TABLE usol_item (id INT PRIMARY KEY, parent_id INT, file_id INT)"
  - sql: "CREATE TABLE usol_file (id INT, uploaded_at INT)"
  - sql: "CREATE TABLE usol_parent (id INT PRIMARY KEY, owner_id INT, team_id INT)"
  - sql: "CREATE TABLE usol_assignment (id INT PRIMARY KEY, team_id INT, member_id INT)"
  - sql: "CREATE TABLE usol_projection (id INT PRIMARY KEY, uploaded_at INT)"
  - sql: "CREATE TABLE usol_item_multi (id INT PRIMARY KEY, bucket INT, file_id INT)"
  - sql: "CREATE TABLE usol_file_multi (bucket INT, id INT, uploaded_at INT)"
  - sql: "CREATE TABLE usol_text_outer (id INT PRIMARY KEY, lookup_key TEXT COLLATE utf8mb4_general_ci)"
  - sql: "CREATE TABLE usol_text_inner (lookup_key TEXT COLLATE utf8mb4_general_ci, value INT)"
  - sql: "INSERT INTO usol_parent VALUES (1, 7, 10), (2, 8, 20)"
  - sql: "INSERT INTO usol_assignment VALUES (1, 10, 7), (2, 20, 8)"
  - sql: "INSERT INTO usol_item_multi VALUES (1, 1, 1), (2, 2, 1), (3, 1, 2), (4, 2, 2), (5, 3, 1)"
  - sql: "INSERT INTO usol_text_outer VALUES (1, 'alpha'), (2, 'beta')"
  - sql: "INSERT INTO usol_text_inner VALUES ('ALPHA', 30), ('beta', 20)"
  - scm: |
      (begin
        (insert (table "memcp-tests" "usol_item") '("id" "parent_id" "file_id")
          (map (produceN 10000) (lambda (i) (list (+ i 1) (+ (- i (* 2 (floor (/ i 2)))) 1) (+ i 1)))))
        (insert (table "memcp-tests" "usol_file") '("id" "uploaded_at")
          (map (produceN 10000) (lambda (i) (list (+ i 1) (+ i 1)))))
        (insert (table "memcp-tests" "usol_projection") '("id" "uploaded_at")
          (map (produceN 10000) (lambda (i) (list (+ i 1) (+ i 1)))))
        (insert (table "memcp-tests" "usol_file_multi") '("bucket" "id" "uploaded_at")
          (map (produceN 2000) (lambda (i)
            (begin
              (define bucket (+ (- i (* 2 (floor (/ i 2)))) 1))
              (define id (+ (floor (/ i 2)) 1))
              (list bucket id (+ (* id 10) (if (equal? bucket 2) 5 0)))))))
        (rebuild)
        10000)

test_cases:
  - name: "Scalar ORDER LIMIT stays inside ordered scan pipelines"
    sql: |
      EXPLAIN
      SELECT projected.id
      FROM (
        SELECT item.id, item.file_id
        FROM usol_item item
      ) projected
      ORDER BY (
        SELECT file.uploaded_at FROM usol_file file
        WHERE file.id = projected.file_id LIMIT 1
      ) DESC, projected.id DESC
      LIMIT 3
    expect:
      rows: 1
      result_contains:
        - "scan_order"
      result_not_contains:
        - "scan_order_point"
        - "__scalar_order_lookup"
        - "(sort rows"

  - name: "EXPLAIN IR preserves scalar LIMIT 1 lowering contract"
    sql: |
      EXPLAIN IR
      SELECT item.id, (
        SELECT file.uploaded_at FROM usol_file file
        WHERE file.id = item.file_id LIMIT 1
      ) AS uploaded_at
      FROM usol_item item
      WHERE item.id = 1
    expect:
      rows: 1
      result_contains:
        - "(null_semantics scalar)"
        - "(partition_limit 1)"
        - "(result_max_rows_per_partition 1)"
        - "(on_overflow ignore)"
      result_not_contains:
        - "inner_select"
        - "dependent-subquery"

  - name: "Scalar LIMIT probe preserves case-insensitive SQL equality"
    sql: |
      SELECT o.id, (
        SELECT i.value FROM usol_text_inner i
        WHERE i.lookup_key = o.lookup_key LIMIT 1
      ) AS matched
      FROM usol_text_outer o
      ORDER BY o.id
    expect:
      rows: 2
      data:
        - id: 1
          matched: 30
        - id: 2
          matched: 20

  - name: "Scalar ORDER LIMIT preserves case-insensitive SQL equality"
    sql: |
      SELECT o.id
      FROM usol_text_outer o
      ORDER BY (
        SELECT i.value FROM usol_text_inner i
        WHERE i.lookup_key = o.lookup_key LIMIT 1
      ) DESC, o.id
      LIMIT 2
    expect:
      rows: 2
      data:
        - id: 1
        - id: 2

  - name: "Unselective scalar ORDER LIMIT defers nested access projections"
    max_time: 1.5
    max_plan_size: 100000
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` LIKE '.grp:query:%'"
    sql: |
      SELECT projected.id, projected.access_1, projected.access_2,
        projected.access_3, projected.access_4
      FROM (
        SELECT item.id, item.file_id,
          COALESCE((
            SELECT (parent_1.owner_id = 7 OR EXISTS (
              SELECT TRUE FROM usol_assignment member_1
              WHERE member_1.team_id = parent_1.team_id AND member_1.member_id = 7 LIMIT 1
            ))
            FROM usol_parent parent_1 WHERE parent_1.id = item.parent_id LIMIT 1
          ), FALSE) AS access_1,
          COALESCE((
            SELECT (parent_2.owner_id = 7 OR EXISTS (
              SELECT TRUE FROM usol_assignment member_2
              WHERE member_2.team_id = parent_2.team_id AND member_2.member_id = 7 LIMIT 1
            ))
            FROM usol_parent parent_2 WHERE parent_2.id = item.parent_id LIMIT 1
          ), FALSE) AS access_2,
          COALESCE((
            SELECT (parent_3.owner_id = 7 OR EXISTS (
              SELECT TRUE FROM usol_assignment member_3
              WHERE member_3.team_id = parent_3.team_id AND member_3.member_id = 7 LIMIT 1
            ))
            FROM usol_parent parent_3 WHERE parent_3.id = item.parent_id LIMIT 1
          ), FALSE) AS access_3,
          COALESCE((
            SELECT (parent_4.owner_id = 7 OR EXISTS (
              SELECT TRUE FROM usol_assignment member_4
              WHERE member_4.team_id = parent_4.team_id AND member_4.member_id = 7 LIMIT 1
            ))
            FROM usol_parent parent_4 WHERE parent_4.id = item.parent_id LIMIT 1
          ), FALSE) AS access_4
        FROM usol_item item
        WHERE COALESCE((
          SELECT (filter_parent.owner_id = 7 OR EXISTS (
            SELECT TRUE FROM usol_assignment filter_member
            WHERE filter_member.team_id = filter_parent.team_id
              AND filter_member.member_id = 7 LIMIT 1
          ))
          FROM usol_parent filter_parent
          WHERE filter_parent.id = item.parent_id LIMIT 1
        ), FALSE)
      ) projected
      ORDER BY (
        SELECT file.uploaded_at FROM usol_file file
        WHERE file.id = projected.file_id LIMIT 1
      ) DESC, projected.id DESC
      LIMIT 3
    expect:
      rows: 3
      data:
        - id: 9999
          access_1: true
          access_2: true
          access_3: true
          access_4: true
        - id: 9997
          access_1: true
          access_2: true
          access_3: true
          access_4: true
        - id: 9995
          access_1: true
          access_2: true
          access_3: true
          access_4: true
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  - name: "Ordered ACL preserves late projection results"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests'"
    sql: |
      SELECT projected.id, projected.uploaded_at
      FROM (
        SELECT item.id, projection.uploaded_at,
          COALESCE((
            SELECT (parent.owner_id = 7 OR EXISTS (
              SELECT TRUE FROM usol_assignment member
              WHERE member.team_id = parent.team_id
                AND member.member_id = 7 LIMIT 1
            ))
            FROM usol_parent parent
            WHERE parent.id = item.parent_id LIMIT 1
          ), FALSE) AS can_view
        FROM usol_item item
        LEFT JOIN usol_projection projection ON projection.id = item.file_id
      ) projected
      WHERE projected.can_view
      ORDER BY projected.id DESC
      LIMIT 3
    expect:
      rows: 3
      data:
        - id: 9999
          uploaded_at: 9999
        - id: 9997
          uploaded_at: 9997
        - id: 9995
          uploaded_at: 9995

  - name: "Ordered ACL projection probes run only for the native window"
    sql: |
      SELECT COUNT(*) AS scans, SUM(outputCount) AS outputs
      FROM `system_statistic`.`scans`
      WHERE `schema` = 'memcp-tests' AND `table` = 'usol_projection'
    expect:
      rows: 1
      data:
        - scans: 3
          outputs: 3
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  - name: "Nested direct outer correlation preserves scalar results"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` LIKE '.grp:usol_text_inner:%'"
    sql: |
      SELECT outer_row.id, (
        SELECT (
          SELECT inner_row.value
          FROM usol_text_inner inner_row
          WHERE inner_row.lookup_key = outer_row.lookup_key
          LIMIT 1
        )
        FROM usol_parent middle_row
        WHERE middle_row.id = outer_row.id
        LIMIT 1
      ) AS matched
      FROM usol_text_outer outer_row
      ORDER BY outer_row.id
    expect:
      rows: 2
      data:
        - id: 1
          matched: 30
        - id: 2
          matched: 20

  - name: "Nested decorrelation carrier probes keep their key boundary"
    sql: |
      SELECT CASE WHEN COUNT(*) > 0 THEN 1 ELSE 0 END AS indexed
      FROM `system_statistic`.`scans`
      WHERE `schema` = 'memcp-tests'
        AND `table` LIKE '.grp:usol_text_inner:%'
        AND index_cols = 'k0'
    expect:
      rows: 1
      data:
        - indexed: 1
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  - name: "Composite scalar ORDER lookup preserves every key component"
    max_time: 1.5
    sql: |
      SELECT projected.id
      FROM (
        SELECT item.id, item.bucket, item.file_id
        FROM usol_item_multi item
      ) projected
      ORDER BY (
        SELECT file.uploaded_at FROM usol_file_multi file
        WHERE file.bucket = projected.bucket AND file.id = projected.file_id
        LIMIT 1
      ) DESC
      LIMIT 2
    expect:
      rows: 2
      data:
        - id: 4
        - id: 3

  - name: "Scalar ORDER keeps ties stable and missing LEFT values last"
    setup:
      - "UPDATE usol_file_multi SET uploaded_at = 25 WHERE bucket = 1 AND id = 2"
    cleanup:
      - "UPDATE usol_file_multi SET uploaded_at = 20 WHERE bucket = 1 AND id = 2"
    sql: |
      SELECT projected.id
      FROM (
        SELECT item.id, item.bucket, item.file_id
        FROM usol_item_multi item
      ) projected
      ORDER BY (
        SELECT file.uploaded_at FROM usol_file_multi file
        WHERE file.bucket = projected.bucket AND file.id = projected.file_id
        LIMIT 1
      ) DESC, projected.id DESC
      LIMIT 5
    expect:
      rows: 5
      data:
        - id: 4
        - id: 3
        - id: 2
        - id: 1
        - id: 5

cleanup:
  - sql: "DROP TABLE IF EXISTS usol_item"
  - sql: "DROP TABLE IF EXISTS usol_file"
  - sql: "DROP TABLE IF EXISTS usol_parent"
  - sql: "DROP TABLE IF EXISTS usol_assignment"
  - sql: "DROP TABLE IF EXISTS usol_projection"
  - sql: "DROP TABLE IF EXISTS usol_item_multi"
  - sql: "DROP TABLE IF EXISTS usol_file_multi"
  - sql: "DROP TABLE IF EXISTS usol_text_outer"
  - sql: "DROP TABLE IF EXISTS usol_text_inner"
