# Fixed workload: first execution plus two repetitions for each page size.
metadata:
  performance_shard_weight: 3
  reuse_fixture: true
  restart_after_setup: true
  description: Ordered document search with OR membership over filename and extracted text
  isolated: true
  performance_rows: 80000
setup:
- sql: DROP TABLE IF EXISTS nav_document
- sql: 'CREATE TABLE `nav_document` ( `inventory` text, `note` text, `customer_note` text, `ID` int PRIMARY KEY,

    `nav_department` int, `nav_year` int, `nav_tenant` int, `nav_check` int, `nav_site` int, `file` int) ENGINE=sloppy

    '
- sql: DROP TABLE IF EXISTS nav_tenant
- sql: CREATE TABLE `nav_tenant` (`multiStandort` boolean,`multiAbteilung` boolean,`multiPruefung` boolean,`name` text,`ID`
    int PRIMARY KEY) ENGINE=sloppy
- sql: DROP TABLE IF EXISTS nav_site
- sql: CREATE TABLE `nav_site` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int) ENGINE=sloppy
- sql: DROP TABLE IF EXISTS nav_department
- sql: CREATE TABLE `nav_department` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int,`nav_site` int) ENGINE=sloppy
- sql: DROP TABLE IF EXISTS nav_year
- sql: CREATE TABLE `nav_year` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int) ENGINE=sloppy
- sql: DROP TABLE IF EXISTS nav_check
- sql: CREATE TABLE `nav_check` (`name` text,`ID` int PRIMARY KEY,`nav_tenant` int) ENGINE=sloppy
- sql: DROP TABLE IF EXISTS nav_access
- sql: CREATE TABLE `nav_access` (`ID` int PRIMARY KEY,`user` int,`nav_tenant` int,`nav_site` int) ENGINE=sloppy
- sql: DROP TABLE IF EXISTS nav_file
- sql: 'CREATE TABLE `nav_file` ( `filename` text, `type` text, `size` bigint, `width` int, `height` int, `data` longblob,

    `hash` varchar(64), `uploaded_at` bigint, `search` longtext, `lastUsed` bigint, `ID` int PRIMARY KEY) ENGINE=sloppy

    '
- sql: INSERT INTO nav_tenant (ID,name) VALUES (1,'Tenant A'),(2,'Tenant B')
- sql: INSERT INTO nav_site (ID,name,nav_tenant) VALUES (10,'Site A',1),(20,'Site B',2)
- sql: INSERT INTO nav_department (ID,name,nav_site) VALUES (100,'Dept A',10),(200,'Dept B',20)
- sql: INSERT INTO nav_year (ID,name,nav_tenant) VALUES (1000,'2026 A',1),(2000,'2026 B',2)
- sql: INSERT INTO nav_check (ID,name,nav_tenant) VALUES (10000,'Test A',1),(20000,'Test B',2)
- sql: INSERT INTO nav_access (ID,user,nav_tenant,nav_site) VALUES (1,7,NULL,NULL),(2,8,1,NULL)
- scm: |-
    (begin
     (insert (table "memcp-tests" "nav_file") '("ID" "filename" "search")
      (map (produceN 40000) (lambda (i)
       (list (+ i 1) (if (equal? (mod i 1000) 0) "1234.pdf" "ordinary.pdf")
        (concat (reduce (produceN 64) (lambda (s unused) (concat s "ordinary document text ")) "")
         (if (equal? (mod i 1000) 0) "1234" "other"))))))
     (insert (table "memcp-tests" "nav_document")
      '("ID" "nav_tenant" "nav_site" "nav_department" "nav_year" "nav_check" "file" "inventory")
      (map (produceN 80000) (lambda (i)
       (list (+ i 1) 1 10 100 1000 10000 (+ (mod i 40000) 1)
        (if (equal? (mod i 1000) 0) "1234" "ordinary")))))
     (map '("nav_file" "nav_document" "nav_tenant" "nav_site" "nav_department" "nav_year" "nav_check" "nav_access")
      (lambda (t) (rebuild (table "memcp-tests" t) true false)))
     true)
