- name: IN calculation fallback uncached
  warmup: 3
  timing_samples: 9
  threshold_ms: 200
  scm: "(begin\n  (define query \"SELECT id FROM items WHERE id IN (1+2,ABS(-4),id*2) AND label = 'open'\")\n  (define\
    \ cache (newcachemap))\n  \n  (reduce (produceN 100) (lambda (_ i)\n    (match (parameterize_sql_select_literals\
    \ query) '(normalized bindings shape_hash)\n      (if (and (> (count bindings) 0) (equal? shape_hash (fnv_hash\
    \ normalized)))\n        \"ok\" (error \"invalid template\")))) nil))"
  expect:
    data:
    - ok
- name: IN calculation fallback warm
  warmup: 3
  timing_samples: 9
  threshold_ms: 200
  scm: |-
    (begin
      (define query "SELECT id FROM items WHERE id IN (1+2,ABS(-4),id*2) AND label = 'open'")
      (define cache (newcachemap))
      (sql_parameterize_select_literals_cached cache query true)
      (reduce (produceN 100) (lambda (_ i)
        (match (sql_parameterize_select_literals_cached cache query true) '(normalized bindings shape_hash)
          (if (and (> (count bindings) 0) (equal? shape_hash (fnv_hash normalized)))
            "ok" (error "invalid template")))) nil))
  expect:
    data:
    - ok
- name: QPCache parse point 40 calls including cold compile
  warmup: 0
  timing_samples: 5
  timing_aggregation: total
  threshold_ms: 3000
  scm: |-
    (begin
      (define cache (newcachemap))
      (define sess (newsession))
      (reduce (produceN 40) (lambda (_ i)
        (cached_parse cache (list parse_sql) "memcp-tests" "SELECT id FROM ilt_perf_rows WHERE id = 1" nil "root" sess true)) nil)
      (if (and (> (count (cache)) 0) (<= (count (cache)) 40)) "ok" (error "invalid cache")))
  expect:
    data:
    - ok
- name: QPCache parse IN same length 40 calls including cold compile
  warmup: 0
  timing_samples: 5
  timing_aggregation: total
  threshold_ms: 3000
  scm: |-
    (begin
      (define cache (newcachemap))
      (define sess (newsession))
      (reduce (produceN 40) (lambda (_ i)
        (cached_parse cache (list parse_sql) "memcp-tests" "SELECT id FROM ilt_perf_rows WHERE id IN (1,2,3)" nil "root" sess true)) nil)
      (if (and (> (count (cache)) 0) (<= (count (cache)) 40)) "ok" (error "invalid cache")))
  expect:
    data:
    - ok
- name: QPCache parse IN changing lengths 40 calls including cold compile
  warmup: 0
  timing_samples: 5
  timing_aggregation: total
  threshold_ms: 3000
  scm: |-
    (begin
      (define cache (newcachemap))
      (define sess (newsession))
      (reduce (produceN 40) (lambda (_ i)
        (cached_parse cache (list parse_sql) "memcp-tests" (concat "SELECT id FROM ilt_perf_rows WHERE id IN (0" (reduce (produceN i) (lambda (s n) (concat s "," (+ n 1))) "") ")") nil "root" sess true)) nil)
      (if (and (> (count (cache)) 0) (<= (count (cache)) 40)) "ok" (error "invalid cache")))
  expect:
    data:
    - ok
- name: QPCache parse IN same length 40 forced compilations
  warmup: 0
  timing_samples: 5
  timing_aggregation: total
  threshold_ms: 3000
  scm: |
    (begin
      (define sess (newsession))
      (reduce (produceN 40) (lambda (_ i)
        (cached_parse (newcachemap) (list parse_sql) "memcp-tests"
          "SELECT id FROM ilt_perf_rows WHERE id IN (1,2,3)" nil "root" sess true)) nil)
      "ok")
  expect:
    data: ["ok"]
setup:
- sql: DROP TABLE IF EXISTS ilt_perf_rows
- sql: CREATE TABLE ilt_perf_rows (id INT PRIMARY KEY, label TEXT) ENGINE=memory
- scm: (begin (insert (table "memcp-tests" "ilt_perf_rows") '("id" "label") (map (produceN 128) (lambda (i) (list
    i "item")))) (rebuild (table "memcp-tests" "ilt_perf_rows") true false))
cleanup:
- sql: DROP TABLE IF EXISTS ilt_perf_rows

