metadata:
  version: '1.0'
  description: Disjunctive joins expose shared predicates without changing SQL truth values
  isolated: true
  perf_ci: true
  performance_rows: 1024
setup:
- sql: DROP TABLE IF EXISTS qa_part
- sql: DROP TABLE IF EXISTS qa_lineitem
- sql: CREATE TABLE qa_part(p_partkey INT, p_brand VARCHAR(16), p_container VARCHAR(16), p_size INT) ENGINE=memory
- sql: CREATE TABLE qa_lineitem(l_partkey INT,l_quantity INT,l_extendedprice INT,l_discount INT,l_shipmode VARCHAR(16),l_shipinstruct
    VARCHAR(32)) ENGINE=memory
- scm: |-
    (begin
     (insert (table "memcp-tests" "qa_part") '("p_partkey" "p_brand" "p_container" "p_size")
      (map (produceN 128) (lambda (i) (list (+ i 1) (nth '("Brand#12" "Brand#23" "Brand#34") (mod i 3))
       (nth '("SM CASE" "MED BAG" "LG CASE") (mod i 3)) (+ 1 (mod i 16))))))
     (insert (table "memcp-tests" "qa_lineitem") '("l_partkey" "l_quantity" "l_extendedprice" "l_discount" "l_shipmode" "l_shipinstruct")
      (map (produceN 1024) (lambda (i) (list (+ 1 (mod i 128)) (mod i 35) (+ 100 (mod i 10)) 0
       (if (equal? (mod i 5) 0) "AIR" "SHIP") (if (equal? (mod i 7) 0) "OTHER" "DELIVER IN PERSON")))))
     (rebuild true false) true)
test_cases:
- name: Q19 original OR
  sql: "select\n\tsum(l_extendedprice* (1 - l_discount)) as revenue\nfrom\n\tqa_lineitem,\n\tqa_part\nwhere\n\t\
    (\n\t\tp_partkey = l_partkey\n\t\tand p_brand = 'Brand#12'\n\t\tand p_container in ('SM CASE', 'SM BOX', 'SM\
    \ PACK', 'SM PKG')\n\t\tand l_quantity >= 1 and l_quantity <= 1 + 10\n\t\tand p_size between 1 and 5\n\t\tand\
    \ l_shipmode in ('AIR', 'AIR REG')\n\t\tand l_shipinstruct = 'DELIVER IN PERSON'\n\t)\n\tor\n\t(\n\t\tp_partkey\
    \ = l_partkey\n\t\tand p_brand = 'Brand#23'\n\t\tand p_container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK')\n\
    \t\tand l_quantity >= 10 and l_quantity <= 10 + 10\n\t\tand p_size between 1 and 10\n\t\tand l_shipmode in ('AIR',\
    \ 'AIR REG')\n\t\tand l_shipinstruct = 'DELIVER IN PERSON'\n\t)\n\tor\n\t(\n\t\tp_partkey = l_partkey\n\t\t\
    and p_brand = 'Brand#34'\n\t\tand p_container in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG')\n\t\tand l_quantity\
    \ >= 20 and l_quantity <= 20 + 10\n\t\tand p_size between 1 and 15\n\t\tand l_shipmode in ('AIR', 'AIR REG')\n\
    \t\tand l_shipinstruct = 'DELIVER IN PERSON'\n\t);\n"
  expect:
    rows: 1
    data:
    - revenue: 5195
- name: 'Perf: Q19 original OR'
  sql: "select\n\tsum(l_extendedprice* (1 - l_discount)) as revenue\nfrom\n\tqa_lineitem,\n\tqa_part\nwhere\n\t\
    (\n\t\tp_partkey = l_partkey\n\t\tand p_brand = 'Brand#12'\n\t\tand p_container in ('SM CASE', 'SM BOX', 'SM\
    \ PACK', 'SM PKG')\n\t\tand l_quantity >= 1 and l_quantity <= 1 + 10\n\t\tand p_size between 1 and 5\n\t\tand\
    \ l_shipmode in ('AIR', 'AIR REG')\n\t\tand l_shipinstruct = 'DELIVER IN PERSON'\n\t)\n\tor\n\t(\n\t\tp_partkey\
    \ = l_partkey\n\t\tand p_brand = 'Brand#23'\n\t\tand p_container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK')\n\
    \t\tand l_quantity >= 10 and l_quantity <= 10 + 10\n\t\tand p_size between 1 and 10\n\t\tand l_shipmode in ('AIR',\
    \ 'AIR REG')\n\t\tand l_shipinstruct = 'DELIVER IN PERSON'\n\t)\n\tor\n\t(\n\t\tp_partkey = l_partkey\n\t\t\
    and p_brand = 'Brand#34'\n\t\tand p_container in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG')\n\t\tand l_quantity\
    \ >= 20 and l_quantity <= 20 + 10\n\t\tand p_size between 1 and 15\n\t\tand l_shipmode in ('AIR', 'AIR REG')\n\
    \t\tand l_shipinstruct = 'DELIVER IN PERSON'\n\t);\n"
  threshold_ms: 60000
  timeout: 60
  warmup: 2
  timing_samples: 5
  expect:
    rows: 1
    data:
    - revenue: 5195
- name: Q19 common predicates factored
  sql: "select\n\tsum(l_extendedprice* (1 - l_discount)) as revenue\nfrom\n\tqa_lineitem,\n\tqa_part\nwhere\n p_partkey\
    \ = l_partkey\n AND l_shipmode IN ('AIR', 'AIR REG')\n AND l_shipinstruct = 'DELIVER IN PERSON'\n AND (\n\t\
    (\n\t\tp_brand = 'Brand#12'\n\t\tand p_container in ('SM CASE', 'SM BOX', 'SM PACK', 'SM PKG')\n\t\tand l_quantity\
    \ >= 1 and l_quantity <= 1 + 10\n\t\tand p_size between 1 and 5\n\t)\n\tor\n\t(\n\t\tp_brand = 'Brand#23'\n\t\
    \tand p_container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK')\n\t\tand l_quantity >= 10 and l_quantity\
    \ <= 10 + 10\n\t\tand p_size between 1 and 10\n\t)\n\tor\n\t(\n\t\tp_brand = 'Brand#34'\n\t\tand p_container\
    \ in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG')\n\t\tand l_quantity >= 20 and l_quantity <= 20 + 10\n\t\tand\
    \ p_size between 1 and 15\n\t)\n);"
  expect:
    rows: 1
    data:
    - revenue: 5195
- name: 'Perf: Q19 common predicates factored'
  sql: "select\n\tsum(l_extendedprice* (1 - l_discount)) as revenue\nfrom\n\tqa_lineitem,\n\tqa_part\nwhere\n p_partkey\
    \ = l_partkey\n AND l_shipmode IN ('AIR', 'AIR REG')\n AND l_shipinstruct = 'DELIVER IN PERSON'\n AND (\n\t\
    (\n\t\tp_brand = 'Brand#12'\n\t\tand p_container in ('SM CASE', 'SM BOX', 'SM PACK', 'SM PKG')\n\t\tand l_quantity\
    \ >= 1 and l_quantity <= 1 + 10\n\t\tand p_size between 1 and 5\n\t)\n\tor\n\t(\n\t\tp_brand = 'Brand#23'\n\t\
    \tand p_container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK')\n\t\tand l_quantity >= 10 and l_quantity\
    \ <= 10 + 10\n\t\tand p_size between 1 and 10\n\t)\n\tor\n\t(\n\t\tp_brand = 'Brand#34'\n\t\tand p_container\
    \ in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG')\n\t\tand l_quantity >= 20 and l_quantity <= 20 + 10\n\t\tand\
    \ p_size between 1 and 15\n\t)\n);"
  threshold_ms: 60000
  timeout: 60
  warmup: 2
  timing_samples: 5
  expect:
    rows: 1
    data:
    - revenue: 5195
cleanup:
- sql: DROP TABLE IF EXISTS qa_lineitem
- sql: DROP TABLE IF EXISTS qa_part
