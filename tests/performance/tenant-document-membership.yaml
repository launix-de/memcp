metadata:
  description: Limited tenant membership over documents with nested site and tenant ACLs
  isolated: true
  performance_rows: 100000
setup:
- sql: DROP TABLE IF EXISTS mf_dokument
- sql: DROP TABLE IF EXISTS mf_mandant
- sql: DROP TABLE IF EXISTS mf_standort
- sql: DROP TABLE IF EXISTS mf_jahr
- sql: DROP TABLE IF EXISTS mf_pruefung
- sql: DROP TABLE IF EXISTS mf_abteilung
- sql: DROP TABLE IF EXISTS mf_fop_files
- sql: DROP TABLE IF EXISTS mf_userMandant
- sql: CREATE TABLE mf_dokument (ID int, abteilung int, jahr int, mandant int, pruefung int, standort int, file int, inventarnr
    text, kommentar text, kommentar_kunde text) ENGINE=MEMORY
- sql: CREATE TABLE mf_mandant (ID int, name text) ENGINE=MEMORY
- sql: CREATE TABLE mf_standort (ID int, name text, mandant int) ENGINE=MEMORY
- sql: CREATE TABLE mf_jahr (ID int, name text, mandant int) ENGINE=MEMORY
- sql: CREATE TABLE mf_pruefung (ID int, name text, mandant int) ENGINE=MEMORY
- sql: CREATE TABLE mf_abteilung (ID int, name text, standort int) ENGINE=MEMORY
- sql: CREATE TABLE mf_fop_files (ID int, uploaded_at int) ENGINE=MEMORY
- sql: CREATE TABLE mf_userMandant (ID int, user int, mandant int, standort int) ENGINE=MEMORY
- scm: |-
    (begin
     (insert (table "memcp-tests" "mf_mandant") '("ID" "name") (map (produceN 100) (lambda (i) (list (+ i 1) (concat "tenant-" i)))))
     (insert (table "memcp-tests" "mf_standort") '("ID" "name" "mandant") (map (produceN 1000) (lambda (i) (list (+ i 1) (concat "site-" i) (+ 1 (mod i 100))))))
     (insert (table "memcp-tests" "mf_userMandant") '("ID" "user" "mandant" "standort") (list (list 1 7 1 nil) (list 2 7 2 nil)))
     (insert (table "memcp-tests" "mf_dokument") '("ID" "mandant" "standort") (map (produceN 100000) (lambda (i) (list (+ i 1) (+ 1 (mod i 100)) (+ 1 (mod i 1000))))))
     (map '("mf_mandant" "mf_standort" "mf_userMandant" "mf_dokument") (lambda (t) (rebuild (table "memcp-tests" t) true false)))
     true)
