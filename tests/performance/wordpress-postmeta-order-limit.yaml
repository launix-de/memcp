metadata:
  version: "1.0"
  description: "WordPress posts and postmeta filtered join with ordered Top-K"
  isolated: true
  ci: true
  restart_after_setup: true

# Reproduces the common WordPress shape which filters postmeta by key, joins
# matching posts, and returns the newest small page. The cardinalities and
# distributions match the wordpress2 installation used for the MariaDB A/B.
setup:
  - sql: "DROP TABLE IF EXISTS wordpress_perf_postmeta"
  - sql: "DROP TABLE IF EXISTS wordpress_perf_posts"
  - sql: "CREATE TABLE wordpress_perf_posts (ID BIGINT PRIMARY KEY, post_title VARCHAR(64), post_status VARCHAR(20), post_type VARCHAR(20)) ENGINE=sloppy"
  - sql: "CREATE TABLE wordpress_perf_postmeta (meta_id BIGINT PRIMARY KEY, post_id BIGINT, meta_key VARCHAR(255), meta_value VARCHAR(64)) ENGINE=sloppy"
  - scm: |
      (insert (table "memcp-tests" "wordpress_perf_posts")
        '("ID" "post_title" "post_status" "post_type")
        (map (produceN 8214) (lambda (i)
          (begin
            (define id (+ i 1))
            (list id (concat "Benchmark Post " (string id))
              (if (equal? (mod id 20) 0) "draft" "publish") "post")))))
  - scm: |
      (insert (table "memcp-tests" "wordpress_perf_postmeta")
        '("meta_id" "post_id" "meta_key" "meta_value")
        (map (produceN 75000) (lambda (i)
          (begin
            (define id (+ i 1))
            (define key_mod (mod i 5))
            (list id (+ 1 (mod i 8214))
              (if (equal? key_mod 0) "_edit_lock"
                (if (equal? key_mod 1) "_thumbnail_id"
                  (if (equal? key_mod 2) "_yoast_wpseo_title"
                    (if (equal? key_mod 3) "custom_color" "view_count"))))
              (concat "meta-value-" (string id)))))))
  - scm: "(rebuild)"

test_cases:
  - name: "WordPress post point select"
    warmup: 10
    timing_samples: 100
    threshold_ms: 2
    sql: "SELECT post_title FROM wordpress_perf_posts WHERE ID = 4242"
    expect: {rows: 1}

  - name: "WordPress post ordered limit"
    warmup: 10
    timing_samples: 50
    threshold_ms: 2
    sql: "SELECT ID, post_status, post_type FROM wordpress_perf_posts ORDER BY post_title LIMIT 5"
    expect: {rows: 5}

  - name: "WordPress filtered postmeta join ordered by newest post"
    warmup: 10
    timing_samples: 30
    threshold_ms: 6
    sql: |
      SELECT p.ID, p.post_title, pm.meta_value
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE p.post_type = 'post'
        AND p.post_status = 'publish'
        AND pm.meta_key = 'custom_color'
      ORDER BY p.ID DESC
      LIMIT 20
    expect: {rows: 20}

  - name: "WordPress filtered postmeta join physical plan"
    sql: |
      EXPLAIN PHYSICAL
      SELECT p.ID, p.post_title, pm.meta_value
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE p.post_type = 'post'
        AND p.post_status = 'publish'
        AND pm.meta_key = 'custom_color'
      ORDER BY p.ID DESC
      LIMIT 20
    expect:
      rows: 1
      result_contains:
        - "chosen scan_join_order_batched_probe"
        - "scan_join_order"
        - "legacy_join_tree"
      result_not_contains:
        - '(0 \"meta_key\")'
        - '(1 \"post_type\")'
        - '(1 \"post_status\")'

  - name: "WordPress ordered join uses the equivalent postmeta driver"
    sql: |
      EXPLAIN REORDER
      SELECT p.ID, p.post_title, pm.meta_value
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE p.post_type = 'post'
        AND p.post_status = 'publish'
        AND pm.meta_key = 'custom_color'
      ORDER BY p.ID DESC
      LIMIT 20
    expect:
      rows: 1
      result_contains:
        - '(join_driver \"pm\")'
      result_not_contains:
        - '(join_driver \"p\")'

  - name: "WordPress handwritten equivalent-driver batched scan_join_order"
    warmup: 2
    timing_samples: 5
    threshold_ms: 8
    sql: |
      SELECT p.ID, p.post_title, pm.meta_value
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE p.post_type = 'post'
        AND p.post_status = 'publish'
        AND pm.meta_key = 'custom_color'
      ORDER BY p.ID DESC, pm.meta_id DESC
      LIMIT 20
    expect:
      data:
        - {ID: 8214, post_title: "Benchmark Post 8214", meta_value: "meta-value-49284"}
        - {ID: 8214, post_title: "Benchmark Post 8214", meta_value: "meta-value-8214"}
        - {ID: 8213, post_title: "Benchmark Post 8213", meta_value: "meta-value-41069"}
        - {ID: 8212, post_title: "Benchmark Post 8212", meta_value: "meta-value-73924"}
        - {ID: 8212, post_title: "Benchmark Post 8212", meta_value: "meta-value-32854"}
        - {ID: 8211, post_title: "Benchmark Post 8211", meta_value: "meta-value-65709"}
        - {ID: 8211, post_title: "Benchmark Post 8211", meta_value: "meta-value-24639"}
        - {ID: 8210, post_title: "Benchmark Post 8210", meta_value: "meta-value-57494"}
        - {ID: 8210, post_title: "Benchmark Post 8210", meta_value: "meta-value-16424"}
        - {ID: 8209, post_title: "Benchmark Post 8209", meta_value: "meta-value-49279"}
        - {ID: 8209, post_title: "Benchmark Post 8209", meta_value: "meta-value-8209"}
        - {ID: 8208, post_title: "Benchmark Post 8208", meta_value: "meta-value-41064"}
        - {ID: 8207, post_title: "Benchmark Post 8207", meta_value: "meta-value-73919"}
        - {ID: 8207, post_title: "Benchmark Post 8207", meta_value: "meta-value-32849"}
        - {ID: 8206, post_title: "Benchmark Post 8206", meta_value: "meta-value-65704"}
        - {ID: 8206, post_title: "Benchmark Post 8206", meta_value: "meta-value-24634"}
        - {ID: 8205, post_title: "Benchmark Post 8205", meta_value: "meta-value-57489"}
        - {ID: 8205, post_title: "Benchmark Post 8205", meta_value: "meta-value-16419"}
        - {ID: 8204, post_title: "Benchmark Post 8204", meta_value: "meta-value-49274"}
        - {ID: 8204, post_title: "Benchmark Post 8204", meta_value: "meta-value-8204"}

cleanup:
  - sql: "DROP TABLE IF EXISTS wordpress_perf_postmeta"
  - sql: "DROP TABLE IF EXISTS wordpress_perf_posts"
