metadata:
  version: "1.0"
  description: "WordPress posts and postmeta filtered join with ordered Top-K"
  isolated: true
  ci: true
  restart_after_setup: true

# Reproduces the common WordPress shape which filters postmeta by key, joins
# matching posts, and returns the newest small page. The cardinalities and
# distributions match the wordpress2 installation used for the MariaDB A/B.
setup:
  - sql: "DROP TABLE IF EXISTS wordpress_perf_postmeta"
  - sql: "DROP TABLE IF EXISTS wordpress_perf_posts"
  - sql: "CREATE TABLE wordpress_perf_posts (ID BIGINT PRIMARY KEY, post_title VARCHAR(64), post_status VARCHAR(20), post_type VARCHAR(20)) ENGINE=sloppy"
  - sql: "CREATE TABLE wordpress_perf_postmeta (meta_id BIGINT PRIMARY KEY, post_id BIGINT, meta_key VARCHAR(255), meta_value VARCHAR(64)) ENGINE=sloppy"
  - scm: |
      (insert (table "memcp-tests" "wordpress_perf_posts")
        '("ID" "post_title" "post_status" "post_type")
        (map (produceN 8214) (lambda (i)
          (begin
            (define id (+ i 1))
            (list id (concat "Benchmark Post " (string id))
              (if (equal? (mod id 20) 0) "draft" "publish") "post")))))
  - scm: |
      (insert (table "memcp-tests" "wordpress_perf_postmeta")
        '("meta_id" "post_id" "meta_key" "meta_value")
        (map (produceN 75000) (lambda (i)
          (begin
            (define id (+ i 1))
            (define key_mod (mod i 5))
            (list id (+ 1 (mod i 8214))
              (if (equal? key_mod 0) "_edit_lock"
                (if (equal? key_mod 1) "_thumbnail_id"
                  (if (equal? key_mod 2) "_yoast_wpseo_title"
                    (if (equal? key_mod 3) "custom_color" "view_count"))))
              (concat "meta-value-" (string id)))))))
  - scm: "(rebuild)"

test_cases:
  - name: "WordPress post point select"
    warmup: 10
    timing_samples: 100
    threshold_ms: 2
    sql: "SELECT post_title FROM wordpress_perf_posts WHERE ID = 4242"
    expect: {rows: 1}

  - name: "WordPress post ordered limit"
    warmup: 10
    timing_samples: 50
    threshold_ms: 2
    sql: "SELECT ID, post_status, post_type FROM wordpress_perf_posts ORDER BY post_title LIMIT 5"
    expect: {rows: 5}

  - name: "WordPress post pagination with total row count"
    warmup: 10
    timing_samples: 50
    threshold_ms: 5
    sql: |
      SELECT SQL_CALC_FOUND_ROWS ID, post_title
      FROM wordpress_perf_posts
      WHERE post_type = 'post' AND post_status = 'publish'
      ORDER BY ID DESC
      LIMIT 20
    expect: {rows: 20}

  - name: "WordPress filtered postmeta join ordered by newest post"
    warmup: 10
    timing_samples: 30
    threshold_ms: 6
    sql: |
      SELECT p.ID, p.post_title, pm.meta_value
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE p.post_type = 'post'
        AND p.post_status = 'publish'
        AND pm.meta_key = 'custom_color'
      ORDER BY p.ID DESC
      LIMIT 20
    expect: {rows: 20}

  - name: "WordPress filtered postmeta join physical plan"
    sql: |
      EXPLAIN PHYSICAL
      SELECT p.ID, p.post_title, pm.meta_value
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE p.post_type = 'post'
        AND p.post_status = 'publish'
        AND pm.meta_key = 'custom_color'
      ORDER BY p.ID DESC
      LIMIT 20
    expect:
      rows: 1
      result_contains:
        - "chosen scan_join_order_batched_probe"
        - "scan_join_order"
        - "legacy_join_tree"
      result_not_contains:
        - '(0 \"meta_key\")'
        - '(1 \"post_type\")'
        - '(1 \"post_status\")'

  - name: "WordPress ordered join uses the equivalent postmeta driver"
    sql: |
      EXPLAIN REORDER
      SELECT p.ID, p.post_title, pm.meta_value
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE p.post_type = 'post'
        AND p.post_status = 'publish'
        AND pm.meta_key = 'custom_color'
      ORDER BY p.ID DESC
      LIMIT 20
    expect:
      rows: 1
      result_contains:
        - '(join_driver \"pm\")'
      result_not_contains:
        - '(join_driver \"p\")'

  - name: "Elementor empty grouped metadata lookup reuses prepared caches"
    warmup: 10
    timing_samples: 100
    threshold_ms: 1
    sql: |
      SELECT p.ID
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE pm.meta_key = '_elementor_template_type'
        AND pm.meta_value = 'landing-page'
        AND p.post_type = 'e-landing-page'
        AND p.post_status <> 'trash'
        AND p.post_status <> 'auto-draft'
      GROUP BY p.ID
      ORDER BY p.ID DESC
      LIMIT 1
    expect: {rows: 0}

  - name: "Elementor grouped metadata cache physical plan"
    sql: |
      EXPLAIN PHYSICAL
      SELECT p.ID
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE pm.meta_key = '_elementor_template_type'
        AND pm.meta_value = 'landing-page'
        AND p.post_type = 'e-landing-page'
        AND p.post_status <> 'trash'
        AND p.post_status <> 'auto-draft'
      GROUP BY p.ID
      ORDER BY p.ID DESC
      LIMIT 1
    expect:
      rows: 1
      result_contains:
        - '.prejoin:'
        - '.grp:'
        - 'scan_order'

  - name: "Prime empty Elementor grouped metadata cache"
    max_time: 15
    sql: |
      SELECT p.ID
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE pm.meta_key = '_elementor_template_type'
        AND pm.meta_value = 'landing-page'
        AND p.post_type = 'e-landing-page'
        AND p.post_status <> 'trash'
        AND p.post_status <> 'auto-draft'
      GROUP BY p.ID
      ORDER BY p.ID DESC
      LIMIT 1
    expect: {rows: 0}

  - name: "Insert Elementor post after caching empty result"
    sql: "INSERT INTO wordpress_perf_posts (ID, post_title, post_status, post_type) VALUES (90001, 'Landing page', 'publish', 'e-landing-page')"
    expect: {affected_rows: 1}

  - name: "Insert matching Elementor metadata"
    sql: "INSERT INTO wordpress_perf_postmeta (meta_id, post_id, meta_key, meta_value) VALUES (90001, 90001, '_elementor_template_type', 'landing-page')"
    expect: {affected_rows: 1}

  - name: "Elementor grouped cache observes matching insert"
    sql: |
      SELECT p.ID
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE pm.meta_key = '_elementor_template_type'
        AND pm.meta_value = 'landing-page'
        AND p.post_type = 'e-landing-page'
        AND p.post_status <> 'trash'
        AND p.post_status <> 'auto-draft'
      GROUP BY p.ID
      ORDER BY p.ID DESC
      LIMIT 1
    expect: {rows: 1, data: [{"ID": 90001}]}

  - name: "Move Elementor metadata out of the cached predicate"
    sql: "UPDATE wordpress_perf_postmeta SET meta_value = 'other' WHERE meta_id = 90001"
    expect: {affected_rows: 1}

  - name: "Elementor grouped cache observes predicate update"
    sql: |
      SELECT p.ID
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE pm.meta_key = '_elementor_template_type'
        AND pm.meta_value = 'landing-page'
        AND p.post_type = 'e-landing-page'
        AND p.post_status <> 'trash'
        AND p.post_status <> 'auto-draft'
      GROUP BY p.ID
      ORDER BY p.ID DESC
      LIMIT 1
    expect: {rows: 0}

  - name: "Restore matching Elementor metadata"
    sql: "UPDATE wordpress_perf_postmeta SET meta_value = 'landing-page' WHERE meta_id = 90001"
    expect: {affected_rows: 1}

  - name: "Elementor grouped cache observes restored predicate"
    sql: |
      SELECT p.ID
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE pm.meta_key = '_elementor_template_type'
        AND pm.meta_value = 'landing-page'
        AND p.post_type = 'e-landing-page'
        AND p.post_status <> 'trash'
        AND p.post_status <> 'auto-draft'
      GROUP BY p.ID
      ORDER BY p.ID DESC
      LIMIT 1
    expect: {rows: 1, data: [{"ID": 90001}]}

  - name: "Delete matching Elementor metadata"
    sql: "DELETE FROM wordpress_perf_postmeta WHERE meta_id = 90001"
    expect: {affected_rows: 1}

  - name: "Elementor grouped cache observes matching delete"
    sql: |
      SELECT p.ID
      FROM wordpress_perf_posts p
      JOIN wordpress_perf_postmeta pm ON pm.post_id = p.ID
      WHERE pm.meta_key = '_elementor_template_type'
        AND pm.meta_value = 'landing-page'
        AND p.post_type = 'e-landing-page'
        AND p.post_status <> 'trash'
        AND p.post_status <> 'auto-draft'
      GROUP BY p.ID
      ORDER BY p.ID DESC
      LIMIT 1
    expect: {rows: 0}

  - name: "WordPress handwritten equivalent-driver batched scan_join_order"
    warmup: 10
    timing_samples: 100
    threshold_ms: 8
    revision_specific_scm: true
    scm: |
      (begin
        (define posts (table "memcp-tests" "wordpress_perf_posts"))
        (define postmeta (table "memcp-tests" "wordpress_perf_postmeta"))
        (define found
          (scan_join_order (session "__memcp_tx")
            (list postmeta posts)
            (list
              (list 370535686995968 (scan_boundary "equal" "meta_key" 0 0 true true "" false))
              (list 370535955431424
                (scan_boundary "equal" "post_status" 0 0 true true "" false)
                (scan_boundary "equal" "post_type" 1 1 true true "" false)))
            (list "custom_color" "publish" "post")
            (list (list) (list))
            (list (lambda () true) (lambda () true))
            (list (list (list 0 "post_id" "ID")))
            (list) nil
            (list (list 0 "post_id"))
            (list (collate "utf8mb4" true))
            0 0 20
            (list (list 1 "ID") (list 1 "post_title") (list 0 "meta_value"))
            (lambda (acc _id _title _value) (+ acc 1))
            0 nil false 0 true))
        (if (equal? found 20) "ok"
          (error "wrong WordPress scan_join_order row count")))
    expect:
      data: ["ok"]

cleanup:
  - sql: "DROP TABLE IF EXISTS wordpress_perf_postmeta"
  - sql: "DROP TABLE IF EXISTS wordpress_perf_posts"
