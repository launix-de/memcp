# Fixed workload: one cold execution plus ten repetitions, all retained.
metadata:
  description: Selective text search through shared bigram caches
  isolated: true
setup:
- sql: DROP TABLE IF EXISTS search_documents
- sql: CREATE TABLE search_documents (id INT PRIMARY KEY, body TEXT) ENGINE=sloppy
- scm: |
    (begin
      (insert (table "memcp-tests" false "search_documents" false) '("id" "body")
        (map (produceN 32768) (lambda (i)
          (list i (concat "alpha manual reference ordinary text "
            (if (equal? (mod i 64) 0) "needle " "other ")
            (if (equal? (mod i 128) 0) "obsolete" "current"))))))
      (partitiontable (table "memcp-tests" false "search_documents" false)
        (list (list "id" (list 4096 8192 12288 16384 20480 24576 28672))))
      (rebuild (table "memcp-tests" false "search_documents" false) true false))
cleanup:
- sql: DROP TABLE search_documents
test_cases:
- name: selective-like-bigrams
  sql: SELECT COUNT(*) AS n FROM search_documents WHERE body LIKE '%needle%'
  threshold_ms: 5000
  timing_samples: 11
  timing_aggregation: total
  warmup: 0
  expect: {data: [{n: 512}]}
- name: boolean-positive-bigrams
  sql: SELECT COUNT(*) AS n FROM search_documents WHERE MATCH(body) AGAINST('+alpha +needle' IN BOOLEAN MODE)>0
  threshold_ms: 5000
  timing_samples: 11
  timing_aggregation: total
  warmup: 0
  expect: {data: [{n: 512}]}
- name: boolean-exclusion-bigrams
  sql: SELECT COUNT(*) AS n FROM search_documents WHERE MATCH(body) AGAINST('+alpha +needle -obsolete' IN BOOLEAN MODE)>0
  threshold_ms: 5000
  timing_samples: 11
  timing_aggregation: total
  warmup: 0
  expect: {data: [{n: 256}]}
