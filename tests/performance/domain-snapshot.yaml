  - name: "Mixed snapshot and first-event families retain independent domains"
    sql: &mixed_snapshot_first_event |
      SELECT w.window_id,p.category,COALESCE((SELECT SUM((SELECT h.quantity FROM ds_conversion_history h
          WHERE h.entity_id=e.id AND h.coordinate<=w.hi ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_conversion_history h
              WHERE h.entity_id=e.id AND h.coordinate<=w.hi ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_conversion_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),w.hi)>=w.hi),0) AS state_total,COALESCE((SELECT SUM((SELECT h.quantity
        FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.hi
        ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e
        WHERE (p.category IS NULL OR e.category=p.category)
          AND (SELECT h.coordinate FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1
            ORDER BY h.coordinate ASC LIMIT 1) BETWEEN w.lo AND w.hi
          AND ((SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind
            FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.lo
            ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=0
            OR EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
              AND h.coordinate BETWEEN w.lo AND w.hi
              AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=0 LIMIT 1))
          AND EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND h.coordinate<=w.hi
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1 LIMIT 1)),0) AS total
      FROM (SELECT 0 AS window_id,0 AS lo,15 AS hi UNION SELECT 1,500,550
        ) w
      CROSS JOIN (SELECT NULL AS category) p
    expect: &mixed_snapshot_first_event_results
      rows: 2
      result_contains:
        - "{\"window_id\": 0, \"category\": null, \"state_total\": 15, \"total\": 10}"
        - "{\"window_id\": 1, \"category\": null, \"state_total\": 1217, \"total\": 98}"

  - name: "Mixed snapshot and first-event families remain correct on repeat"
    sql: *mixed_snapshot_first_event
    expect: *mixed_snapshot_first_event_results

  - name: "First-event property remains correct across older and repeated intervals"
    sql: |
      SELECT w.window_id,p.category,COALESCE((SELECT SUM((SELECT h.quantity
        FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.hi
        ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e
        WHERE (p.category IS NULL OR e.category=p.category)
          AND (SELECT h.coordinate FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1
            ORDER BY h.coordinate ASC LIMIT 1) BETWEEN w.lo AND w.hi
          AND ((SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind
            FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.lo
            ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=0
            OR EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
              AND h.coordinate BETWEEN w.lo AND w.hi
              AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=0 LIMIT 1))
          AND EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND h.coordinate<=w.hi
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1 LIMIT 1)),0) AS total
      FROM (SELECT 0 AS window_id,3500 AS lo,4010 AS hi UNION ALL SELECT 1,3000,3499 UNION ALL SELECT 2,2500,2999 UNION ALL SELECT 3,2000,2499 UNION ALL SELECT 4,1500,1999 UNION ALL SELECT 5,1000,1499 UNION ALL SELECT 6,500,999 UNION ALL SELECT 7,0,499 UNION ALL SELECT 8,0,0 UNION ALL SELECT 9,1000,1100 UNION ALL SELECT 10,50,100 UNION ALL SELECT 11,100,150 UNION ALL SELECT 12,3000,3100 UNION ALL SELECT 13,0,15 UNION ALL SELECT 14,4000,4010 UNION ALL SELECT 15,10,10) w
      CROSS JOIN (SELECT NULL AS category) p
