metadata:
  version: "1.0"
  description: "Shared state aggregates across ordered parameter domains"
  isolated: true
  perf_ci: true
setup:
  - sql: "DROP TABLE IF EXISTS ds_entity"
  - sql: "DROP TABLE IF EXISTS ds_history"
  - sql: "DROP TABLE IF EXISTS ds_kind"
  - sql: "CREATE TABLE ds_entity (id INT PRIMARY KEY, category INT) ENGINE=memory"
  - sql: "CREATE TABLE ds_history (id INT PRIMARY KEY, entity_id INT, coordinate INT, quantity INT, end_value INT, kind VARCHAR(10), UNIQUE KEY entity_coordinate (entity_id, coordinate)) ENGINE=memory"
  - sql: "CREATE TABLE ds_kind (name VARCHAR(10) PRIMARY KEY, active INT) ENGINE=memory"
  - sql: "INSERT INTO ds_kind VALUES ('P',1),('T',0)"
  - scm: |
      (begin
        (insert (table "memcp-tests" "ds_entity") '("id" "category")
          (map (produceN 4000) (lambda (i) (list (+ i 1) (mod (+ i 1) 2)))))
        (insert (table "memcp-tests" "ds_history") '("id" "entity_id" "coordinate" "quantity" "end_value" "kind")
          (map (produceN 4000) (lambda (i) (list (+ i 1) (+ i 1) 0 1 nil "P"))))
        (insert (table "memcp-tests" "ds_history") '("id" "entity_id" "coordinate" "quantity" "end_value" "kind")
          (map (produceN 200) (lambda (i) (list (+ i 4001) (* (+ i 1) 20) 20 3 50 "P"))))
        (rebuild (table "memcp-tests" "ds_entity"))
        (rebuild (table "memcp-tests" "ds_history"))
        (rebuild (table "memcp-tests" "ds_kind"))
        true)
  - sql: "DROP TABLE IF EXISTS ds_conversion_history"
  - sql: "CREATE TABLE ds_conversion_history (id INT PRIMARY KEY, entity_id INT, coordinate INT, quantity INT, end_value INT, kind VARCHAR(10), UNIQUE KEY entity_coordinate (entity_id, coordinate)) ENGINE=memory"
  - scm: |
      (begin
        (insert (table "memcp-tests" "ds_conversion_history") '("id" "entity_id" "coordinate" "quantity" "kind")
          (map (produceN 4000) (lambda (i)
            (list (+ i 1) (+ i 1) 0 1 (if (equal? (mod i 4) 0) "T" "F")))))
        (insert (table "memcp-tests" "ds_conversion_history") '("id" "entity_id" "coordinate" "quantity" "kind")
          (map (produceN 4000) (lambda (i)
            (list (+ i 4001) (+ i 1) (+ i 10) (+ 2 (mod i 3)) "P"))))
        (insert (table "memcp-tests" "ds_conversion_history") '("id" "entity_id" "coordinate" "quantity" "kind")
          (map (produceN 1000) (lambda (j) (begin
            (define i (+ 1 (* j 4)))
            (list (+ i 8001) (+ i 1) (+ i 12) 5 "T")))))
        (rebuild (table "memcp-tests" "ds_conversion_history")) true)
test_cases:
  - name: "Ordered domain shares quantity, classification and independent predicate state"
    sql: &snapshot_state_query |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total
      FROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    expect: &domain_snapshot_results
      rows: 18
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 4000}"
        - "{\"x\": 10, \"category\": 0, \"total\": 2000}"
        - "{\"x\": 10, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 20, \"category\": null, \"total\": 4400}"
        - "{\"x\": 20, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 20, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 30, \"category\": null, \"total\": 4400}"
        - "{\"x\": 30, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 30, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 50, \"category\": null, \"total\": 4400}"
        - "{\"x\": 50, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 50, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 51, \"category\": null, \"total\": 3800}"
        - "{\"x\": 51, \"category\": 0, \"total\": 1800}"
        - "{\"x\": 51, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 60, \"category\": null, \"total\": 3800}"
        - "{\"x\": 60, \"category\": 0, \"total\": 1800}"
        - "{\"x\": 60, \"category\": 1, \"total\": 2000}"
    timing_aggregation: total
    warmup: 0
    timing_samples: 2
    threshold_ms: 20000
  - name: "Physical plan exposes contribution-domain cost alternatives"
    sql: |
      EXPLAIN PHYSICAL
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total
      FROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    expect:
      result_contains: ["contribution_domain", "domain_snapshot", "direct_aggregate", "affected_rows_per_transition"]
  - name: "An inner alias cannot hide an outer snapshot partition binding"
    sql: |
      SELECT p.id, d.x,
        (SELECT SUM((SELECT p.quantity FROM ds_history p
          WHERE p.entity_id=e.id AND p.coordinate<=d.x ORDER BY p.coordinate DESC LIMIT 1))
         FROM ds_entity e WHERE e.category=p.category
           AND COALESCE((SELECT p.end_value FROM ds_history p
             WHERE p.entity_id=e.id AND p.coordinate<=60 ORDER BY p.coordinate DESC LIMIT 1),d.x)>=d.x) AS total
      FROM ds_entity p CROSS JOIN
        (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
      WHERE p.id<=2 ORDER BY d.x,p.id
    expect:
      data:
        - {id: 1, x: 10, total: 2000}
        - {id: 2, x: 10, total: 2000}
        - {id: 1, x: 20, total: 2000}
        - {id: 2, x: 20, total: 2400}
        - {id: 1, x: 30, total: 2000}
        - {id: 2, x: 30, total: 2400}
        - {id: 1, x: 50, total: 2000}
        - {id: 2, x: 50, total: 2400}
        - {id: 1, x: 51, total: 2000}
        - {id: 2, x: 51, total: 1800}
        - {id: 1, x: 60, total: 2000}
        - {id: 2, x: 60, total: 1800}

  - name: "Snapshot domain also traverses decreasing coordinates"
    sql: |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total
      FROM (SELECT 60 AS x UNION SELECT 51 UNION SELECT 50 UNION SELECT 30 UNION SELECT 20 UNION SELECT 10) d
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    expect:
      rows: 18
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 4000}"
        - "{\"x\": 10, \"category\": 0, \"total\": 2000}"
        - "{\"x\": 10, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 20, \"category\": null, \"total\": 4400}"
        - "{\"x\": 20, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 20, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 30, \"category\": null, \"total\": 4400}"
        - "{\"x\": 30, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 30, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 50, \"category\": null, \"total\": 4400}"
        - "{\"x\": 50, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 50, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 51, \"category\": null, \"total\": 3800}"
        - "{\"x\": 51, \"category\": 0, \"total\": 1800}"
        - "{\"x\": 51, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 60, \"category\": null, \"total\": 3800}"
        - "{\"x\": 60, \"category\": 0, \"total\": 1800}"
        - "{\"x\": 60, \"category\": 1, \"total\": 2000}"
  - name: "Mixed unsupported contributions preserve the original aggregate plan"
    sql: |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total, COALESCE((SELECT SUM(d.x * (SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS scaled
      FROM (SELECT 10 AS x UNION SELECT 60) d
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0) p
    expect:
      rows: 4
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 4000, \"scaled\": 40000}"
        - "{\"x\": 10, \"category\": 0, \"total\": 2000, \"scaled\": 20000}"
        - "{\"x\": 60, \"category\": null, \"total\": 3800, \"scaled\": 228000}"
        - "{\"x\": 60, \"category\": 0, \"total\": 1800, \"scaled\": 108000}"
  - name: "Several SUM payloads in one scalar aggregate keep independent snapshots"
    sql: |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)) + SUM(2 * (SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total
      FROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
      CROSS JOIN (SELECT NULL AS category) p
    expect:
      rows: 6
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 12000}"
        - "{\"x\": 20, \"category\": null, \"total\": 13200}"
        - "{\"x\": 30, \"category\": null, \"total\": 13200}"
        - "{\"x\": 50, \"category\": null, \"total\": 13200}"
        - "{\"x\": 51, \"category\": null, \"total\": 11400}"
        - "{\"x\": 60, \"category\": null, \"total\": 11400}"
  - name: "Shared ordered row identities retain each aggregate's value projection"
    sql: |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total, COALESCE((SELECT SUM((SELECT h.id FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS scaled
      FROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
      CROSS JOIN (SELECT NULL AS category) p
    expect:
      rows: 6
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 4000, \"scaled\": 8002000}"
        - "{\"x\": 20, \"category\": null, \"total\": 4400, \"scaled\": 8420100}"
        - "{\"x\": 30, \"category\": null, \"total\": 4400, \"scaled\": 8420100}"
        - "{\"x\": 50, \"category\": null, \"total\": 4400, \"scaled\": 8420100}"
        - "{\"x\": 51, \"category\": null, \"total\": 3800, \"scaled\": 7600000}"
        - "{\"x\": 60, \"category\": null, \"total\": 3800, \"scaled\": 7600000}"
  - name: "Snapshot reducers retain row bindings across shared dependency preparation"
    sql: |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (CASE WHEN p.mode=2 THEN TRUE ELSE (SELECT k.active FROM ds_kind k WHERE k.active=e.category LIMIT 1)=p.mode END) AND (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total
      FROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
      CROSS JOIN (SELECT NULL AS category, 0x32 AS mode UNION SELECT 0, 0x32 UNION SELECT 1, 0x32) p
    expect: *domain_snapshot_results

  - name: "A coordinate used only inside the aggregate payload keeps its outer domain"
    sql: &nested_coordinate_query |
      SELECT d.n, COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
        WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e),0) AS total
      FROM (SELECT 0 AS n,10 AS x UNION SELECT 1,20 UNION SELECT 2,60) d
    expect: &nested_coordinate_results
      rows: 3
      result_contains:
        - '{"n": 0, "total": 4000}'
        - '{"n": 1, "total": 4400}'
        - '{"n": 2, "total": 4400}'
  - name: "Repeated nested-coordinate aggregate retains per-row binding"
    sql: *nested_coordinate_query
    expect: *nested_coordinate_results

  - name: "Repeated SQL requests read retained snapshot points"
    sql: *snapshot_state_query
    expect: *domain_snapshot_results

  - name: "Ordered session bounds establish a reusable source cut"
    session_id: "ds-cut-domain"
    setup:
      - scm: '(session "snapshot-cut-before" (count (snapshot_group_points)))'
      - sql: "SET @ds_cut=20"
    sql: &snapshot_cut_query |
      SELECT d.x,
        (SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
         FROM ds_entity e
         WHERE COALESCE((SELECT h.end_value FROM ds_history h
           WHERE h.entity_id=e.id AND h.coordinate<=@ds_cut ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x) AS total
      FROM (SELECT 10 AS x UNION SELECT 30 UNION SELECT 60) d ORDER BY d.x
    expect: &snapshot_cut_result
      data: [{x: 10, total: 4000}, {x: 30, total: 4400}, {x: 60, total: 3800}]

  - name: "A different bound in the same cut retains the exact snapshot points"
    session_id: "ds-cut-domain"
    setup:
      - scm: '(session "snapshot-cut-count" (count (snapshot_group_points)))'
      - sql: "SET @ds_cut=21"
    sql: *snapshot_cut_query
    expect: *snapshot_cut_result

  - name: "Equivalent source cuts did not add aggregate point entries"
    session_id: "ds-cut-domain"
    scm: '(and (> (session "snapshot-cut-count") (session "snapshot-cut-before")) (equal? (session "snapshot-cut-count") (count (snapshot_group_points))))'
    expect:
      data: [true]

  - name: "Crossing a source cut changes the aggregate partition"
    session_id: "ds-cut-domain"
    setup:
      - sql: "SET @ds_cut=19"
    sql: *snapshot_cut_query
    expect:
      data: [{x: 10, total: 4000}, {x: 30, total: 4400}, {x: 60, total: 4400}]

  - name: "Returning to a retained source cut restores its snapshot values"
    session_id: "ds-cut-domain"
    setup:
      - sql: "SET @ds_cut=22"
    sql: *snapshot_cut_query
    expect: *snapshot_cut_result

  - name: "Exact aggregates also normalize pure ordered selection bindings"
    session_id: "ds-point-cut-domain"
    setup:
      - scm: '(session "point-cut-before" (count (group_value_cache)))'
      - sql: "SET @ds_cut=20"
    sql: &point_cut_query |
      SELECT p.category, (SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=@ds_cut ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e WHERE e.category=p.category) AS total
      FROM (SELECT 0 AS category UNION SELECT 1) p ORDER BY p.category
    expect: &point_cut_result
      data: [{category: 0, total: 2400}, {category: 1, total: 2000}]

  - name: "Exact aggregates reuse a changed binding inside the same source cut"
    session_id: "ds-point-cut-domain"
    setup:
      - scm: '(session "point-cut-count" (count (group_value_cache)))'
      - sql: "SET @ds_cut=21"
    sql: *point_cut_query
    expect: *point_cut_result

  - name: "Equivalent cuts do not allocate new exact aggregate entries"
    session_id: "ds-point-cut-domain"
    scm: '(and (> (session "point-cut-count") (session "point-cut-before")) (equal? (session "point-cut-count") (count (group_value_cache))))'
    expect:
      data: [true]

  - name: "Exact aggregates distinguish a different selected source cut"
    session_id: "ds-point-cut-domain"
    setup:
      - sql: "SET @ds_cut=19"
    sql: *point_cut_query
    expect:
      data: [{category: 0, total: 2000}, {category: 1, total: 2000}]

  - name: "A raw bound in a payload must remain an exact binding"
    session_id: "ds-raw-cut-domain"
    setup:
      - sql: "SET @ds_cut=20"
    sql: &raw_cut_query |
      SELECT p.category, (SELECT SUM(@ds_cut+(SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=@ds_cut ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e WHERE e.category=p.category) AS total
      FROM (SELECT 0 AS category UNION SELECT 1) p ORDER BY p.category
    expect:
      data: [{category: 0, total: 42400}, {category: 1, total: 42000}]

  - name: "A raw payload binding changes results even within one source cut"
    session_id: "ds-raw-cut-domain"
    setup:
      - sql: "SET @ds_cut=21"
    sql: *raw_cut_query
    expect:
      data: [{category: 0, total: 44400}, {category: 1, total: 44000}]

  - name: "Joined classification updates invalidate retained snapshots"
    setup:
      - sql: "UPDATE ds_kind SET active=0 WHERE name='P'"
    sql: *snapshot_state_query
    expect:
      rows: 18
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 0}"
        - "{\"x\": 10, \"category\": 0, \"total\": 0}"
        - "{\"x\": 10, \"category\": 1, \"total\": 0}"
        - "{\"x\": 20, \"category\": null, \"total\": 0}"
        - "{\"x\": 20, \"category\": 0, \"total\": 0}"
        - "{\"x\": 20, \"category\": 1, \"total\": 0}"
        - "{\"x\": 30, \"category\": null, \"total\": 0}"
        - "{\"x\": 30, \"category\": 0, \"total\": 0}"
        - "{\"x\": 30, \"category\": 1, \"total\": 0}"
        - "{\"x\": 50, \"category\": null, \"total\": 0}"
        - "{\"x\": 50, \"category\": 0, \"total\": 0}"
        - "{\"x\": 50, \"category\": 1, \"total\": 0}"
        - "{\"x\": 51, \"category\": null, \"total\": 0}"
        - "{\"x\": 51, \"category\": 0, \"total\": 0}"
        - "{\"x\": 51, \"category\": 1, \"total\": 0}"
        - "{\"x\": 60, \"category\": null, \"total\": 0}"
        - "{\"x\": 60, \"category\": 0, \"total\": 0}"
        - "{\"x\": 60, \"category\": 1, \"total\": 0}"

  - name: "Restored classification rebuilds rather than reusing a changed view"
    setup:
      - sql: "UPDATE ds_kind SET active=1 WHERE name='P'"
    sql: *snapshot_state_query
    expect: *domain_snapshot_results

  - name: "First-event intervals combine with dynamic state predicates"
    sql: &first_event_state_query |
      SELECT w.window_id,p.category,COALESCE((SELECT SUM((SELECT h.quantity
        FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.hi
        ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e
        WHERE (p.category IS NULL OR e.category=p.category)
          AND (SELECT h.coordinate FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1
            ORDER BY h.coordinate ASC LIMIT 1) BETWEEN w.lo AND w.hi
          AND ((SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind
            FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.lo
            ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=0
            OR EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
              AND h.coordinate BETWEEN w.lo AND w.hi
              AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=0 LIMIT 1))
          AND EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND h.coordinate<=w.hi
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1 LIMIT 1)),0) AS total
      FROM (SELECT 0 AS window_id,0 AS lo,15 AS hi UNION SELECT 1,500,550
        UNION SELECT 2,1000,1030 UNION SELECT 3,10,10 UNION SELECT 4,4010,4100
        UNION SELECT 5,0,15) w
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    expect: &first_event_state_results
      rows: 18
      result_contains:
        - "{\"window_id\": 0, \"category\": null, \"total\": 10}"
        - "{\"window_id\": 0, \"category\": 0, \"total\": 5}"
