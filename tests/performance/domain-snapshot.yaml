  - name: "Ordered cut witnesses survive copied session domain keys"
    scm: |
      (begin
        (define __snapshot_test_actual
          (begin
            (define driver '("e" "memcp-tests" "ds_entity" false nil))
            (define source '("h" "memcp-tests" "ds_history" false nil))
            (define axis '('session "bound"))
            (define parent '('get_column "e" false "id" false))
            (define foreign '('get_column "h" false "entity_id" false))
            (define coordinate '('get_column "h" false "coordinate" false))
            (define value '('get_column "h" false "quantity" false))
            (define stage (make_group_stage "copied-cut" source
              (list parent axis) (list foreign axis)
              (list (list (list 'scalar_order_value value (list coordinate) (list >) 0) coalesceNil nil))
              nil '() '() 1 nil
              (list (list 'condition (list '<= coordinate axis)) (list 'partition_limit 1)
                (list 'range-point-keys (list foreign)) (list 'range-point-domain (list parent))
                (list 'lookup-keys (list parent axis)))))
            (define output (list "selected" "memcp-tests" (make_stage_output_relation (gs_id stage)) true
              (make_exists_stage_join_condition "selected" (group_key_cols (gs_keys stage)) (gs_domain stage))))
            (define raw_stage (make_group_stage "raw-cut" source (gs_domain stage)
              (list foreign coordinate) (gs_aggregates stage) nil '() '() 1 nil (gs_facts stage)))
            (define raw_output (list "selected" "memcp-tests" (make_stage_output_relation (gs_id raw_stage)) true
              (make_exists_stage_join_condition "selected" (group_key_cols (gs_keys raw_stage)) (gs_domain raw_stage))))
            (define proofs (ordered_binding_cuts (list stage) driver (list axis)))
            (define binding (lower_group_cache_binding driver axis proofs))
            (define read ((eval (list 'lambda (list 'tx 'session)
              (list 'lambda '() binding))) nil (lambda (key) 20)))
            (define at (lambda (bound)
              ((eval (list 'lambda (list 'tx 'session) binding)) nil (lambda (key) bound))))
            (list (not (empty_list? proofs))
              (not (ordered_binding_occurs? axis (ordered_binding_semantic_join axis (list stage) output)))
              (ordered_binding_occurs? axis (ordered_binding_semantic_join axis (list raw_stage) raw_output))
              (read) (at 21) (at 19) (at nil)))
        )
        (if (equal? (json_encode __snapshot_test_actual) (json_encode (list true true true (list 20) (list 20) (list 0) (list nil))))
          __snapshot_test_actual
          (error (concat "Ordered cut witnesses survive copied session domain keys: unexpected value " (serialize __snapshot_test_actual)))))
    expect:
