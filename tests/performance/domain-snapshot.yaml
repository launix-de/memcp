metadata:
  version: "1.0"
  description: "Shared state aggregates across ordered parameter domains"
  isolated: true
  perf_ci: true
setup:
  - sql: "DROP TABLE IF EXISTS ds_entity"
  - sql: "DROP TABLE IF EXISTS ds_history"
  - sql: "DROP TABLE IF EXISTS ds_kind"
  - sql: "CREATE TABLE ds_entity (id INT PRIMARY KEY, category INT) ENGINE=memory"
  - sql: "CREATE TABLE ds_history (id INT PRIMARY KEY, entity_id INT, coordinate INT, quantity INT, end_value INT, kind VARCHAR(10), UNIQUE KEY entity_coordinate (entity_id, coordinate)) ENGINE=memory"
  - sql: "CREATE TABLE ds_kind (name VARCHAR(10) PRIMARY KEY, active INT) ENGINE=memory"
  - sql: "INSERT INTO ds_kind VALUES ('P',1),('T',0)"
  - scm: |
      (begin
        (insert (table "memcp-tests" "ds_entity") '("id" "category")
          (map (produceN 4000) (lambda (i) (list (+ i 1) (mod (+ i 1) 2)))))
        (insert (table "memcp-tests" "ds_history") '("id" "entity_id" "coordinate" "quantity" "end_value" "kind")
          (map (produceN 4000) (lambda (i) (list (+ i 1) (+ i 1) 0 1 nil "P"))))
        (insert (table "memcp-tests" "ds_history") '("id" "entity_id" "coordinate" "quantity" "end_value" "kind")
          (map (produceN 200) (lambda (i) (list (+ i 4001) (* (+ i 1) 20) 20 3 50 "P"))))
        (rebuild (table "memcp-tests" "ds_entity"))
        (rebuild (table "memcp-tests" "ds_history"))
        (rebuild (table "memcp-tests" "ds_kind"))
        true)
  - sql: "DROP TABLE IF EXISTS ds_conversion_history"
  - sql: "CREATE TABLE ds_conversion_history (id INT PRIMARY KEY, entity_id INT, coordinate INT, quantity INT, end_value INT, kind VARCHAR(10), UNIQUE KEY entity_coordinate (entity_id, coordinate)) ENGINE=memory"
  - scm: |
      (begin
        (insert (table "memcp-tests" "ds_conversion_history") '("id" "entity_id" "coordinate" "quantity" "kind")
          (map (produceN 4000) (lambda (i)
            (list (+ i 1) (+ i 1) 0 1 (if (equal? (mod i 4) 0) "T" "F")))))
        (insert (table "memcp-tests" "ds_conversion_history") '("id" "entity_id" "coordinate" "quantity" "kind")
          (map (produceN 4000) (lambda (i)
            (list (+ i 4001) (+ i 1) (+ i 10) (+ 2 (mod i 3)) "P"))))
        (insert (table "memcp-tests" "ds_conversion_history") '("id" "entity_id" "coordinate" "quantity" "kind")
          (map (produceN 1000) (lambda (j) (begin
            (define i (+ 1 (* j 4)))
            (list (+ i 8001) (+ i 1) (+ i 12) 5 "T")))))
        (rebuild (table "memcp-tests" "ds_conversion_history")) true)
  - scm: |
      (globalvars "__test_group_cache_cells" (lambda (query binding)
        (begin
          (define request (newsession))
          (request (car binding) (cadr binding))
          (define shape (sql_parameterize_select_literals query true))
          (mapIndex (cadr shape) (lambda (i value) (request (concat "v" (+ i 1)) value)))
          (define plan (with_session request (lambda () (parse_sql "memcp-tests" (car shape) nil request nil))))
          (define collect (lambda (node)
            (match node
              ((symbol group_cache_execute) ((symbol quote) cache) _threshold _tx _direct _cached _retain) (list cache)
              ((symbol group_cache_point) ((symbol quote) cache) _payload _threshold _point_values _tx _read_view _producer) (list cache)
              (cons head tail) (merge (map node collect))
              _ '())))
          (define caches (merge_unique (list (collect plan))))
          (sort (map caches (lambda (cache)
            (list (group_cache_relation cache)
              (if (nil? (table (group_cache_schema cache) (group_cache_relation cache))) 0
                (scan_estimate (table (group_cache_schema cache) (group_cache_relation cache)))))))
            (lambda (a b) (< (car a) (car b)))))))
  - scm: |
      (globalvars "__test_group_cache_warm" (lambda (query binding)
        (begin
          (define request (newsession))
          (request (car binding) (cadr binding))
          (define formula (cached_parse (newcachemap) (list parse_sql) "memcp-tests" query nil "root" request true nil))
          (define warm (lambda (remaining)
            (begin
              (define cells ((globalvars "__test_group_cache_cells") query binding))
              (if (and (not (empty_list? cells)) (reduce cells (lambda (ok cell) (and ok (> (cadr cell) 0))) true)) true
                (if (<= remaining 0) (error (concat "group cache was not admitted: " (serialize cells)))
                  (begin
                    (with_autocommit request nil 0 query (lambda (tx)
                      (sql_execute_formula request tx formula (lambda (row) true) (lambda (fields) true))))
                    (warm (- remaining 1))))))))
          (warm 256))))
test_cases:
  - name: "Ordered domain shares quantity, classification and independent predicate state"
    sql: &snapshot_state_query |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e
          WHERE (p.category IS NULL OR e.category=p.category)
            AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total
      FROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    expect: &domain_snapshot_results
      rows: 18
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 4000}"
        - "{\"x\": 10, \"category\": 0, \"total\": 2000}"
        - "{\"x\": 10, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 20, \"category\": null, \"total\": 4400}"
        - "{\"x\": 20, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 20, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 30, \"category\": null, \"total\": 4400}"
        - "{\"x\": 30, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 30, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 50, \"category\": null, \"total\": 4400}"
        - "{\"x\": 50, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 50, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 51, \"category\": null, \"total\": 3800}"
        - "{\"x\": 51, \"category\": 0, \"total\": 1800}"
        - "{\"x\": 51, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 60, \"category\": null, \"total\": 3800}"
        - "{\"x\": 60, \"category\": 0, \"total\": 1800}"
        - "{\"x\": 60, \"category\": 1, \"total\": 2000}"
    timing_aggregation: total
    warmup: 0
    timing_samples: 2
    threshold_ms: 20000
  - name: "Sibling raw and derived coordinates keep separate selected states"
    sql: |
      SELECT d.x,COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)) FROM ds_entity e WHERE COALESCE((SELECT h.end_value FROM ds_history h WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS ordinary,COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h WHERE h.entity_id=e.id AND h.coordinate<=(d.x-5) ORDER BY h.coordinate DESC LIMIT 1)) FROM ds_entity e WHERE COALESCE((SELECT h.end_value FROM ds_history h WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),(d.x-5))>=(d.x-5)),0) AS shifted FROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT 60) d
    expect:
      rows: 6
      data: [{"x": 10, "ordinary": 4000, "shifted": 4000}, {"x": 20, "ordinary": 4400, "shifted": 4000}, {"x": 30, "ordinary": 4400, "shifted": 4400}, {"x": 50, "ordinary": 4400, "shifted": 4400}, {"x": 51, "ordinary": 3800, "shifted": 4400}, {"x": 60, "ordinary": 3800, "shifted": 3800}]

  - name: "Constant NULL parameter columns remove dead scalar dependencies"
    sql: &constant_null_domain_query |
      SELECT d.x, COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
        WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e WHERE p.ignored IS NULL OR
          (SELECT k.active FROM ds_kind k WHERE k.name='P' LIMIT 1)=0),0) AS total
      FROM (SELECT 10 AS x UNION SELECT 20) d
      CROSS JOIN (SELECT NULL AS ignored UNION SELECT NULL) p
    expect:
      rows: 2
      data: [{x: 10, total: 4000}, {x: 20, total: 4400}]

  - name: "Constant NULL branch has no physical dependency scan"
    sql: *constant_null_domain_query
    explain: true
    expect:
      not_contains: [ds_kind]

  - name: "Ordered parameter domains survive nested categorical lookups"
    sql: |
      SELECT d.x,p.category,COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
        WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e WHERE p.category IS NULL OR
          (SELECT 1 FROM ds_kind r WHERE r.name=(SELECT k.name FROM ds_kind k
            WHERE k.active=e.category LIMIT 1) AND r.active=p.category LIMIT 1) IS NOT NULL),0) AS total
      FROM (SELECT 10 AS x UNION SELECT 20) d
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    expect:
      rows: 6
      result_contains:
        - "{\"x\": 10, \"category\": null, \"total\": 4000}"
        - "{\"x\": 20, \"category\": null, \"total\": 4400}"
        - "{\"x\": 10, \"category\": 0, \"total\": 2000}"
        - "{\"x\": 20, \"category\": 0, \"total\": 2400}"
        - "{\"x\": 10, \"category\": 1, \"total\": 2000}"
        - "{\"x\": 20, \"category\": 1, \"total\": 2000}"

  - name: "A constant NULL predicate remains SQL UNKNOWN"
    sql: |
      SELECT d.x FROM (SELECT 10 AS x UNION SELECT 20) d
      CROSS JOIN (SELECT NULL AS ignored UNION SELECT NULL) p WHERE p.ignored
    expect:
      rows: 0

  - name: "Parameter domain rejects unequal UNION arity"
    sql: |
      SELECT d.x, (SELECT SUM((SELECT h.quantity FROM ds_history h
        WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e) AS total
      FROM (SELECT 10 AS x UNION SELECT 20, 30) d
    expect:
      error: true

  - name: "Snapshot anchor choice minimizes changed keys rather than coordinate distance"
    scm: |
      (begin
        (define name (concat "snapshot-work-choice:" (nanotime)))
        (define cache (make_group_cache 'group-keytable "memcp-tests" (concat ".grp:" name) (list (list 'snapshot 0))))
        (group_cache_ensure_cells cache "agg_sum" nil)
        (define observed (newsession))
        (define keys (map (produceN 10) (lambda (i) (+ i 1))))
        (snapshot_group_publish cache '() '(1) "agg_sum" nil 98
          (reduce keys (lambda (values key) (set_assoc values key 0)) (list))
          '(0 10 0) 20 nil (list))
        (snapshot_group_publish cache '() '(1) "agg_sum" nil 120
          (reduce keys (lambda (values key) (set_assoc values key 1)) (list))
          '(10 10 10) 20 nil (list))
        (define result (snapshot_group_cache cache "agg_sum" (lambda () (list)) nil 100 20
          (lambda () (list 1))
          (lambda () (error "unexpected full snapshot"))
          (lambda (lo hi) (if (equal? lo 98) (slice keys 0 9) (list 10)))
          (lambda (changed) (begin
            (observed "evaluated" (count changed))
            (reduce changed (lambda (values key) (set_assoc values key (if (equal? key 10) 0 1))) (list))))
          (lambda () (error "unexpected fallback"))))
        (and (equal? result 9) (equal? (observed "evaluated") 1)))
    expect:
      result: true

  - name: "Many snapshot coordinates share one invariant ordered cut"
    sql: |
      SELECT d.x, p.category,
        COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h
          WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))
          FROM ds_entity e WHERE (p.category IS NULL OR e.category=p.category)
            AND COALESCE((SELECT h.end_value FROM ds_history h
              WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total
      FROM (SELECT 1 AS x UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9 UNION ALL SELECT 10 UNION ALL SELECT 11 UNION ALL SELECT 12 UNION ALL SELECT 13 UNION ALL SELECT 14 UNION ALL SELECT 15 UNION ALL SELECT 16 UNION ALL SELECT 17 UNION ALL SELECT 18 UNION ALL SELECT 19 UNION ALL SELECT 20 UNION ALL SELECT 21 UNION ALL SELECT 22 UNION ALL SELECT 23 UNION ALL SELECT 24 UNION ALL SELECT 25 UNION ALL SELECT 26 UNION ALL SELECT 27 UNION ALL SELECT 28 UNION ALL SELECT 29 UNION ALL SELECT 30 UNION ALL SELECT 31 UNION ALL SELECT 32 UNION ALL SELECT 33 UNION ALL SELECT 34 UNION ALL SELECT 35 UNION ALL SELECT 36 UNION ALL SELECT 37 UNION ALL SELECT 38 UNION ALL SELECT 39 UNION ALL SELECT 40 UNION ALL SELECT 41 UNION ALL SELECT 42 UNION ALL SELECT 43 UNION ALL SELECT 44 UNION ALL SELECT 45 UNION ALL SELECT 46 UNION ALL SELECT 47 UNION ALL SELECT 48 UNION ALL SELECT 49 UNION ALL SELECT 50 UNION ALL SELECT 51 UNION ALL SELECT 52 UNION ALL SELECT 53 UNION ALL SELECT 54 UNION ALL SELECT 55 UNION ALL SELECT 56 UNION ALL SELECT 57 UNION ALL SELECT 58 UNION ALL SELECT 59 UNION ALL SELECT 60 UNION ALL SELECT 61 UNION ALL SELECT 62 UNION ALL SELECT 63 UNION ALL SELECT 64 UNION ALL SELECT 65 UNION ALL SELECT 66 UNION ALL SELECT 67 UNION ALL SELECT 68 UNION ALL SELECT 69 UNION ALL SELECT 70) d
      CROSS JOIN (SELECT NULL AS category UNION ALL SELECT 0 UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3) p
    expect:
      rows: 350
      result_contains:
        - '{"x": 1, "category": null, "total": 4000}'
        - '{"x": 20, "category": 0, "total": 2400}'
        - '{"x": 51, "category": 0, "total": 1800}'
        - '{"x": 70, "category": null, "total": 3800}'
        - '{"x": 70, "category": 3, "total": 0}'
    timing_aggregation: total
    warmup: 0
    timing_samples: 6
    threshold_ms: 20000
  - name: "Moving snapshot coordinates retain one parameterized plan regime"
    scm: |
      (begin
        (define cache (newcachemap))
        (define request (newsession))
        (define run (lambda (x) (begin
          (define rows (newsession))
          (define sql (concat "SELECT d.x, p.category,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (p.category IS NULL OR e.category=p.category)\n      AND (SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind FROM ds_history h\n        WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=1\n      AND COALESCE((SELECT h.end_value FROM ds_history h\n        WHERE h.entity_id=e.id AND h.coordinate<=60 ORDER BY h.coordinate DESC LIMIT 1),d.x)>=d.x),0) AS total\nFROM (SELECT 10 AS x UNION SELECT 20 UNION SELECT 30 UNION SELECT 50 UNION SELECT 51 UNION SELECT " x ") d\nCROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p\n"))
          (sql_execute_formula request nil
            (cached_parse cache (list parse_sql) "memcp-tests" sql nil "root" request true nil)
            (lambda (row) (rows (serialize (list (get_assoc row "x") (get_assoc row "category"))) row))
            (lambda (fields) true))
          (and (equal? (count (rows)) (if (or (equal? x 50) (equal? x 51)) 15 18))
            (reduce (rows) (lambda (ok key) (begin
              (define row (rows key))
              (define coordinate (get_assoc row "x"))
              (define category (get_assoc row "category"))
              (define even (if (< coordinate 20) 2000 (if (<= coordinate 50) 2400 1800)))
              (and ok (equal? (get_assoc row "total")
                (if (nil? category) (+ even 2000) (if (equal? category 0) even 2000)))))) true))))))
        (define valid (reduce (produceN 6) (lambda (valid i) (and valid (run (+ i 48)))) true))
        (define variants (count ((car (cache (car (cache)))) "variants")))
        (if (and valid (<= variants 2)) true
          (error (concat "moving coordinates changed values or recompiled: " valid "/" variants)))))
    expect:
      data: [true]
  - name: Selected property boundaries share the moving selection domain
    sql: "SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id\
      \ AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (SELECT\
      \ h.end_value FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate\
      \ DESC LIMIT 1)\n      BETWEEN 10 AND d.x),0) AS total\nFROM (SELECT 60 AS x UNION ALL SELECT 51 UNION\
      \ ALL SELECT 50 UNION ALL SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT 19 UNION ALL SELECT 10)\
      \ d"
    expect:
      rows: 7
      result_contains:
      - '{"x": 60, "total": 600}'
      - '{"x": 51, "total": 600}'
      - '{"x": 50, "total": 600}'
      - '{"x": 49, "total": 0}'
      - '{"x": 20, "total": 0}'
      - '{"x": 19, "total": 0}'
      - '{"x": 10, "total": 0}'
    timing_aggregation: total
    warmup: 0
    timing_samples: 6
    threshold_ms: 20000
  - name: Selected property boundary has a contribution cover
    sql: "EXPLAIN PHYSICAL SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n  \
      \  WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity\
      \ e\n    WHERE (SELECT h.end_value FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=d.x\
      \ ORDER BY h.coordinate DESC LIMIT 1)\n      BETWEEN 10 AND d.x),0) AS total\nFROM (SELECT 60 AS x\
      \ UNION ALL SELECT 51 UNION ALL SELECT 50 UNION ALL SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT\
      \ 19 UNION ALL SELECT 10) d"
    expect:
      result_contains:
      - contribution_domain
      - domain_snapshot
  - name: Selected property keeps independent lower-bound partitions
    sql: "SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id AND\
      \ h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (SELECT h.end_value\
      \ FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)\n\
      \      BETWEEN d.lo AND d.x),0) AS total\nFROM (SELECT 60 AS x,10 AS lo UNION ALL SELECT 60,55) d"
    expect:
      data:
      - x: 60
        total: 600
      - x: 60
        total: 0
  - name: Clamped ordered selections retain their change cover
    sql: "SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id AND\
      \ h.coordinate<=LEAST(d.x,25) ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (SELECT\
      \ h.end_value FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC\
      \ LIMIT 1)\n      BETWEEN 10 AND d.x),0) AS total\nFROM (SELECT 60 AS x UNION ALL SELECT 51 UNION ALL SELECT\
      \ 50 UNION ALL SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT 19 UNION ALL SELECT 10) d"
    expect:
      rows: 7
      result_contains:
      - '{"x": 60, "total": 600}'
      - '{"x": 51, "total": 600}'
      - '{"x": 50, "total": 600}'
      - '{"x": 49, "total": 0}'
      - '{"x": 20, "total": 0}'
      - '{"x": 19, "total": 0}'
      - '{"x": 10, "total": 0}'
  - name: Clamped ordered selection exposes snapshot alternative
    sql: "EXPLAIN PHYSICAL SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id\
      \ AND h.coordinate<=LEAST(d.x,25) ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (SELECT\
      \ h.end_value FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC\
      \ LIMIT 1)\n      BETWEEN 10 AND d.x),0) AS total\nFROM (SELECT 60 AS x UNION ALL SELECT 51 UNION ALL SELECT\
      \ 50 UNION ALL SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT 19 UNION ALL SELECT 10) d"
    expect:
      result_contains:
      - domain_snapshot
  - name: Scaled selection coordinates do not claim an identity change cover
    sql: "EXPLAIN PHYSICAL SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id\
      \ AND h.coordinate<=2*d.x ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (SELECT h.end_value\
      \ FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)\n\
      \      BETWEEN 10 AND d.x),0) AS total\nFROM (SELECT 60 AS x UNION ALL SELECT 51 UNION ALL SELECT 50 UNION ALL\
      \ SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT 19 UNION ALL SELECT 10) d"
    expect:
      result_not_contains:
      - snapshot_group_cache
      - contribution_domain
  - name: Derived parameter expressions define their own snapshot coordinates
    sql: "SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id AND\
      \ h.coordinate<=(d.x+5) ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (SELECT h.end_value\
      \ FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=(d.x+5) ORDER BY h.coordinate DESC LIMIT\
      \ 1)\n      BETWEEN 10 AND (d.x+5)),0) AS total\nFROM (SELECT 60 AS x UNION ALL SELECT 51 UNION ALL SELECT 50\
      \ UNION ALL SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT 19 UNION ALL SELECT 10) d"
    expect:
      rows: 7
      result_contains:
      - '{"x": 60, "total": 600}'
      - '{"x": 51, "total": 600}'
      - '{"x": 50, "total": 600}'
      - '{"x": 49, "total": 600}'
      - '{"x": 20, "total": 0}'
      - '{"x": 19, "total": 0}'
      - '{"x": 10, "total": 0}'
  - name: Derived parameter expression exposes snapshot alternative
    sql: "EXPLAIN PHYSICAL SELECT d.x,\n  COALESCE((SELECT SUM((SELECT h.quantity FROM ds_history h\n    WHERE h.entity_id=e.id\
      \ AND h.coordinate<=(d.x+5) ORDER BY h.coordinate DESC LIMIT 1))\n    FROM ds_entity e\n    WHERE (SELECT h.end_value\
      \ FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=(d.x+5) ORDER BY h.coordinate DESC LIMIT\
      \ 1)\n      BETWEEN 10 AND (d.x+5)),0) AS total\nFROM (SELECT 60 AS x UNION ALL SELECT 51 UNION ALL SELECT 50\
      \ UNION ALL SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT 19 UNION ALL SELECT 10) d"
    expect:
      result_contains:
      - domain_snapshot
  - name: Conditional payloads include their predicate change cover
    sql: "SELECT d.x,\n  COALESCE((SELECT SUM(CASE WHEN (SELECT h.end_value FROM ds_history h WHERE h.entity_id=e.id\
      \ AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)<=d.x THEN (SELECT h.quantity FROM ds_history h\n\
      \    WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) ELSE 0 END)\n    FROM\
      \ ds_entity e\n    WHERE (SELECT h.end_value FROM ds_history h\n      WHERE h.entity_id=e.id AND h.coordinate<=d.x\
      \ ORDER BY h.coordinate DESC LIMIT 1)\n      BETWEEN 10 AND d.x),0) AS total\nFROM (SELECT 60 AS x UNION ALL\
      \ SELECT 51 UNION ALL SELECT 50 UNION ALL SELECT 49\n  UNION ALL SELECT 20 UNION ALL SELECT 19 UNION ALL SELECT\
      \ 10) d"
    expect:
      rows: 7
      result_contains:
      - '{"x": 60, "total": 600}'
      - '{"x": 51, "total": 600}'
      - '{"x": 50, "total": 600}'
      - '{"x": 49, "total": 0}'
      - '{"x": 20, "total": 0}'
      - '{"x": 19, "total": 0}'
      - '{"x": 10, "total": 0}'
  - name: Conditional payload exposes snapshot alternative
    sql: "EXPLAIN PHYSICAL SELECT d.x,\n  COALESCE((SELECT SUM(CASE WHEN (SELECT h.end_value FROM ds_history h WHERE\
      \ h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1)<=d.x THEN (SELECT h.quantity FROM\
      \ ds_history h\n    WHERE h.entity_id=e.id AND h.coordinate<=d.x ORDER BY h.coordinate DESC LIMIT 1) ELSE 0\
