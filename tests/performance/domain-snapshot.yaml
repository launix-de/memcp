  - name: "First-event intervals combine with dynamic state predicates"
    sql: &first_event_state_query |
      SELECT w.window_id,p.category,COALESCE((SELECT SUM((SELECT h.quantity
        FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.hi
        ORDER BY h.coordinate DESC LIMIT 1))
        FROM ds_entity e
        WHERE (p.category IS NULL OR e.category=p.category)
          AND (SELECT h.coordinate FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1
            ORDER BY h.coordinate ASC LIMIT 1) BETWEEN w.lo AND w.hi
          AND ((SELECT k.active FROM ds_kind k WHERE k.name=(SELECT h.kind
            FROM ds_conversion_history h WHERE h.entity_id=e.id AND h.coordinate<=w.lo
            ORDER BY h.coordinate DESC LIMIT 1) LIMIT 1)=0
            OR EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
              AND h.coordinate BETWEEN w.lo AND w.hi
              AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=0 LIMIT 1))
          AND EXISTS(SELECT 1 FROM ds_conversion_history h WHERE h.entity_id=e.id
            AND h.coordinate<=w.hi
            AND (SELECT k.active FROM ds_kind k WHERE k.name=h.kind LIMIT 1)=1 LIMIT 1)),0) AS total
      FROM (SELECT 0 AS window_id,0 AS lo,15 AS hi UNION SELECT 1,500,550
        UNION SELECT 2,1000,1030 UNION SELECT 3,10,10 UNION SELECT 4,4010,4100
        UNION SELECT 5,0,15) w
      CROSS JOIN (SELECT NULL AS category UNION SELECT 0 UNION SELECT 1) p
    expect: &first_event_state_results
      rows: 18
      result_contains:
        - "{\"window_id\": 0, \"category\": null, \"total\": 10}"
        - "{\"window_id\": 0, \"category\": 0, \"total\": 5}"
