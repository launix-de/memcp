- name: Catalog column identities retain complete matches through a repeated native source
  syntax: tsql
  sql: |
    SELECT COUNT(*) AS n
    FROM sys.columns c
    JOIN sys.objects t ON c.object_id=t.object_id
    WHERE t.type=N'U' AND t.name LIKE N'parent_access_child_%'
  performance_rows: 128
  warmup: 0
  timing_samples: 3
  timing_aggregation: total
  threshold_ms: 10000
  expect:
    rows: 1
    data: [{n: 128}]
- name: Typed foreign existence probes retain declaration and parent identities
  syntax: tsql
  sql: |
    SELECT CASE WHEN EXISTS (
      SELECT 1 FROM sys.foreign_keys
      WHERE object_id=OBJECT_ID(N'dbo.parent_access_fk_063',N'F')
        AND parent_object_id=OBJECT_ID(N'dbo.parent_access_child_063',N'U'))
      THEN 1 ELSE 0 END AS present
  performance_rows: 64
  warmup: 0
  timing_samples: 3
  timing_aggregation: total
  threshold_ms: 3000
  expect:
    rows: 1
    data: [{present: 1}]
