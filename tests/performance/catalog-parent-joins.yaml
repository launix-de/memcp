test_cases:
- name: Catalog parent identities join every native foreign declaration
  sql: |-
    SELECT a.name AS constraint_name,b.name AS table_name
    FROM sys.objects AS a
    INNER JOIN (SELECT name,object_id FROM sys.objects WHERE type=N'U') AS b
      ON a.parent_object_id=b.object_id
    WHERE SCHEMA_NAME(a.schema_id)=N'dbo'
      AND (a.type=N'C' OR a.type=N'F')
      AND a.name LIKE N'parent_access_%'
    ORDER BY a.type DESC,a.name,a.modify_date DESC
  performance_rows: 64
  warmup: 0
  timing_samples: 3
  timing_aggregation: total
  threshold_ms: 10000
  expect:
    rows: 64
    data:
    - constraint_name: parent_access_fk_000
