- name: Shared concat affixes text join control
  sql: SELECT COUNT(*) AS n FROM cj_doc_text a JOIN cj_doc_text b ON CONCAT('urn:document:',a.id,'#v1')=CONCAT('urn:document:',b.id,'#v1')
    WHERE a.mandant=0
  warmup: 0
  timing_samples: 101
  timing_aggregation: total
  threshold_ms: 10000
  expect:
    rows: 1
    data:
    - n: 2000
- name: Scalar concat equality avoids repeated large string allocation
  sql: SELECT COUNT(*) AS n FROM cj_scalar WHERE encoded=CONCAT('document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-',payload)
  warmup: 0
  timing_samples: 101
  timing_aggregation: total
  threshold_ms: 30000
  expect:
    rows: 1
    data:
    - n: 40000
- name: Computed text input keeps its original evaluation count
  sql: SELECT COUNT(*) AS n FROM cj_scalar WHERE LOWER(encoded)=CONCAT('document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-',payload)
  warmup: 0
  timing_samples: 101
  timing_aggregation: total
  threshold_ms: 30000
  expect:
    rows: 1
    data:
    - n: 40000
cleanup:
- sql: DROP TABLE IF EXISTS cj_scalar
- sql: DROP TABLE IF EXISTS cj_doc_text
- sql: DROP TABLE IF EXISTS cj_changes
- sql: DROP TABLE IF EXISTS cj_doc
