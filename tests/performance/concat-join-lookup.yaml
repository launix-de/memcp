metadata:
  version: '1.0'
  description: Prefixed identifier equality exposes native lookup keys before auto indexing
  isolated: true
  max_regression_pct: 20
  performance_rows: 120000
setup:
- sql: DROP TABLE IF EXISTS cj_changes
- sql: DROP TABLE IF EXISTS cj_doc
- sql: DROP TABLE IF EXISTS cj_doc_text
- sql: DROP TABLE IF EXISTS cj_scalar
- sql: CREATE TABLE cj_doc (id INT PRIMARY KEY, mandant INT) ENGINE=memory
- sql: CREATE TABLE cj_changes (id INT PRIMARY KEY, item VARCHAR(100), selected INT) ENGINE=memory
- sql: CREATE TABLE cj_doc_text (id VARCHAR(30) PRIMARY KEY, mandant INT) ENGINE=memory
- sql: CREATE TABLE cj_scalar (id INT PRIMARY KEY, encoded VARCHAR(500), payload VARCHAR(30)) ENGINE=memory
- scm: |-
    (begin
     (define native_table (lambda (name) (try
      (lambda () (table "memcp-tests" false name false nil))
      (lambda (cause)
       (if (and (string? cause)
         (equal? cause "table expects database, database_ignorecase, name, name_ignorecase"))
        (table "memcp-tests" false name false)
        (error cause))))))
     (insert (native_table "cj_doc") '("id" "mandant")
      (map (produceN 40000) (lambda (i) (list i (mod i 20)))))
     (insert (native_table "cj_changes") '("id" "item" "selected")
      (map (produceN 120000) (lambda (i) (list i
       (concat (if (< i 40000) "doc:" "other:") (mod i 40000))
       (if (< i 194) 1 0)))))
     (insert (native_table "cj_doc_text") '("id" "mandant")
      (map (produceN 40000) (lambda (i) (list (concat i) (mod i 20)))))
     (insert (native_table "cj_scalar") '("id" "encoded" "payload")
      (map (produceN 120000) (lambda (i) (list i (concat (if (< i 40000) "document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-document-prefix-" "other:") i) (concat i)))))
     (rebuild true false) true)
test_cases:
- name: Prefixed document identifier join
  sql: SELECT d.mandant, COUNT(DISTINCT d.id) AS n FROM cj_changes c JOIN cj_doc d ON c.item = CONCAT('doc:', d.id)
    WHERE c.selected = 1 GROUP BY d.mandant ORDER BY d.mandant
  warmup: 0
  timing_samples: 101
  timing_aggregation: total
  threshold_ms: 5000
  expect:
    rows: 20
    data:
    - mandant: 0
      n: 10
    - mandant: 1
      n: 10
    - mandant: 2
      n: 10
    - mandant: 3
      n: 10
    - mandant: 4
      n: 10
    - mandant: 5
      n: 10
    - mandant: 6
      n: 10
    - mandant: 7
      n: 10
    - mandant: 8
      n: 10
    - mandant: 9
      n: 10
    - mandant: 10
      n: 10
    - mandant: 11
      n: 10
    - mandant: 12
      n: 10
    - mandant: 13
      n: 10
    - mandant: 14
      n: 9
    - mandant: 15
      n: 9
    - mandant: 16
      n: 9
    - mandant: 17
      n: 9
    - mandant: 18
      n: 9
    - mandant: 19
      n: 9
- name: Prefixed text identifier join
  sql: SELECT d.mandant, COUNT(DISTINCT d.id) AS n FROM cj_changes c JOIN cj_doc_text d ON c.item = CONCAT('doc:',
    d.id) WHERE c.selected = 1 GROUP BY d.mandant ORDER BY d.mandant
  warmup: 0
  timing_samples: 101
  timing_aggregation: total
  threshold_ms: 5000
  expect:
    rows: 20
    data:
    - mandant: 0
      n: 10
    - mandant: 1
      n: 10
    - mandant: 2
      n: 10
    - mandant: 3
      n: 10
    - mandant: 4
      n: 10
    - mandant: 5
      n: 10
    - mandant: 6
      n: 10
    - mandant: 7
      n: 10
    - mandant: 8
      n: 10
    - mandant: 9
      n: 10
    - mandant: 10
      n: 10
    - mandant: 11
      n: 10
    - mandant: 12
      n: 10
    - mandant: 13
      n: 10
    - mandant: 14
      n: 9
    - mandant: 15
      n: 9
    - mandant: 16
      n: 9
    - mandant: 17
      n: 9
    - mandant: 18
      n: 9
