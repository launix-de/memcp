# Fixed workload: one cold execution and 128 further executions, no warmup.
metadata:
  version: '1.0'
  description: Cold plus 128 repeated catalog joins over 128 table declarations
  isolated: true
  max_regression_pct: 20
setup:
- scm: |-
    (begin
     (map (produceN 128) (lambda (i) (begin
      (define name (concat "catalog_perf_" i))
      (droptable "memcp-tests" name true)
      (createtable "memcp-tests" name
       (map '("id" "v1" "v2" "v3") (lambda (col) (list "column" col "int" '() '())))
       '("engine" "memory") false))))
     true)
test_cases:
- name: Catalog table-column join includes cold planning and repeated indexed execution
  sql: SELECT t.table_name, COUNT(c.column_name) AS n FROM information_schema.tables t JOIN information_schema.columns
    c ON c.table_schema=t.table_schema AND c.table_name=t.table_name WHERE t.table_schema='memcp-tests' AND t.table_name
    LIKE 'catalog_perf_%' GROUP BY t.table_name ORDER BY t.table_name
  warmup: 0
  timing_samples: 129
  timing_aggregation: total
  threshold_ms: 30000
  expect:
    rows: 128
    data:
    - table_name: catalog_perf_0
      n: 4
    - table_name: catalog_perf_1
      n: 4
    - table_name: catalog_perf_10
      n: 4
    - table_name: catalog_perf_100
      n: 4
