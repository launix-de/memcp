  - name: "SO 77990392 handwritten anti-membership difference"
    scm: |
      (begin
        (define tx (session "__memcp_tx"))
        (define t1 (table "memcp-tests" "so_perf_t1"))
        (define t2 (table "memcp-tests" "so_perf_t2"))
        (define t3 (table "memcp-tests" "so_perf_t3"))
        (define all_t1 (scan_recset tx t1 (car (compile_scan_access '() (scheme "(lambda () true)"))) (cadr (compile_scan_access '() (scheme "(lambda () true)"))) '() (lambda () true)))
        (define nonnull_t2
          (scan_recset tx t2 (car (compile_scan_access '("pid") (scheme "(lambda (pid) (not (nil? pid)))"))) (cadr (compile_scan_access '("pid") (scheme "(lambda (pid) (not (nil? pid)))"))) '("pid") (lambda (pid) (not (nil? pid)))))
        (define nonnull_t3
          (scan_recset tx t3 (car (compile_scan_access '("pid") (scheme "(lambda (pid) (not (nil? pid)))"))) (cadr (compile_scan_access '("pid") (scheme "(lambda (pid) (not (nil? pid)))"))) '("pid") (lambda (pid) (not (nil? pid)))))
        (define other_t1
          (scan_recset tx t1 (car (compile_scan_access '("otherpid") (scheme "(lambda (otherpid) (not (nil? otherpid)))"))) (cadr (compile_scan_access '("otherpid") (scheme "(lambda (otherpid) (not (nil? otherpid)))"))) '("otherpid")
            (lambda (otherpid) (not (nil? otherpid)))))
        (define excluded2
          (recset_project_join tx nonnull_t2 '("pid") t1 '("pid")))
        (define excluded3
          (recset_project_join tx nonnull_t3 '("pid") t1 '("pid")))
        (define excluded1
          (recset_project_join tx other_t1 '("otherpid") t1 '("pid")))
        (define excluded
          (recset_union tx (list excluded2 excluded3 excluded1)))
        (define allowed (recset_difference tx (list all_t1 excluded)))
        (define row_count
          (scan tx allowed (car (compile_scan_access '() (scheme "(lambda () true)"))) (cadr (compile_scan_access '() (scheme "(lambda () true)"))) '() (lambda () true) '() (lambda (acc) (+ acc 1)) 0 +))
        (if (equal? row_count 60000) "ok" (error "wrong anti-membership result")))

  - name: "SO 79828237 DISTINCT cursor join"
    threshold_ms: 180000
    sql: "SELECT DISTINCT p.business_name, pf.fps_score, pf.hashed_player_id, p.first_name, p.last_name FROM so_perf_performance pf JOIN so_perf_players p ON pf.player_id = p.player_id JOIN so_perf_org_players op ON pf.player_id = op.player_id WHERE pf.year = 2019 AND op.org_id IN (1) ORDER BY pf.hashed_player_id LIMIT 5000"
    expect: {rows: 5000}

  - name: "SO 79828237 handwritten DISTINCT semijoin carrier"
    scm: |
      (begin
        (define tx (session "__memcp_tx"))
        (define org_players (table "memcp-tests" "so_perf_org_players"))
        (define performance (table "memcp-tests" "so_perf_performance"))
        (define players (table "memcp-tests" "so_perf_players"))
        (define selected_org
          (scan_recset tx org_players (car (compile_scan_access '("org_id") (scheme "(lambda (org_id) (equal? org_id 1))"))) (cadr (compile_scan_access '("org_id") (scheme "(lambda (org_id) (equal? org_id 1))"))) '("org_id")
            (lambda (org_id) (equal? org_id 1))))
        (define selected_performance
          (recset_project_join tx selected_org '("player_id") performance '("player_id")))
        (define year_performance
          (scan_recset tx selected_performance (car (compile_scan_access '("year") (scheme "(lambda (year) (equal? year 2019))"))) (cadr (compile_scan_access '("year") (scheme "(lambda (year) (equal? year 2019))"))) '("year")
            (lambda (year) (equal? year 2019))))
        (define row_count
          (scan_order tx year_performance (car (compile_scan_access '() (scheme "(lambda () true)"))) (cadr (compile_scan_access '() (scheme "(lambda () true)"))) '() (lambda () true)
            '("hashed_player_id") '(<) 0 0 5000
            '("player_id" "fps_score" "hashed_player_id")
            (lambda (acc player_id fps_score hashed_player_id)
              (begin
                (define row
                  (scan tx players (car (compile_scan_access '("player_id") (scheme "(lambda (id) (equal? id (outer 1 player_id)))"))) (cadr (compile_scan_access '("player_id") (scheme "(lambda (id) (equal? id (outer 1 player_id)))"))) '("player_id")
                    (lambda (id) (equal? id (outer 1 player_id)))
                    '("business_name" "first_name" "last_name")
                    (lambda (_old business_name first_name last_name)
                      (list business_name (outer 1 fps_score) (outer 1 hashed_player_id)
                        first_name last_name))
                    nil (lambda (_old value) value) false))
                (if (nil? row) acc (+ acc 1))))
            0 false))
        (if (equal? row_count 5000) "ok" (error "wrong DISTINCT semijoin result")))

