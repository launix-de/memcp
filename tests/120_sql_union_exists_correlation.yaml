# SQL feature regression: EXISTS over UNION ALL branches must keep each
# branch's local table scope while preserving outer-column correlations.

metadata:
  version: "1.0"
  description: "SQL EXISTS UNION ALL correlation resolves branch-local columns"
  isolated: true
  max_time: 25
  max_plan_size: 80000

setup:
  - sql: "DROP TABLE IF EXISTS sue_file"
  - sql: "DROP TABLE IF EXISTS sue_ref_content"
  - sql: "DROP TABLE IF EXISTS sue_ref_file"
  - sql: "DROP TABLE IF EXISTS sue_audit"
  - sql: "CREATE TABLE sue_file (id INT PRIMARY KEY, filename TEXT, kind TEXT, size INT, payload TEXT, width INT, height INT)"
  - sql: "CREATE TABLE sue_ref_content (id INT PRIMARY KEY, content INT)"
  - sql: "CREATE TABLE sue_ref_file (id INT PRIMARY KEY, file_id INT)"
  - sql: "CREATE TABLE sue_audit (id INT PRIMARY KEY, old_value TEXT, new_value TEXT)"
  - sql: "INSERT INTO sue_file VALUES (1, 'one.bin', 'bin', 10, 'x', 2, 3), (2, 'two.bin', 'bin', 20, 'y', 4, 5), (3, 'three.bin', 'bin', 30, 'z', 6, 7)"
  - sql: "INSERT INTO sue_ref_content VALUES (1, 1), (2, 1)"
  - sql: "INSERT INTO sue_ref_file VALUES (1, 2)"
  - sql: "INSERT INTO sue_audit VALUES (1, 'image:1', 'image:3')"

cleanup:
  - sql: "DROP TABLE IF EXISTS sue_audit"
  - sql: "DROP TABLE IF EXISTS sue_ref_file"
  - sql: "DROP TABLE IF EXISTS sue_ref_content"
  - sql: "DROP TABLE IF EXISTS sue_file"

test_cases:
  - name: "sql-union-exists-correlated-branches-resolve-local-columns"
    sql: |
      SELECT filename, kind, size, payload, width, height,
        EXISTS (
          SELECT id FROM sue_ref_content WHERE content = sue_file.id AND TRUE
          UNION ALL
          SELECT id FROM sue_ref_file WHERE file_id = sue_file.id AND TRUE
          UNION ALL
          SELECT SUBSTR(old_value, 7) FROM sue_audit WHERE old_value LIKE 'image:%' AND TRUE
        ) AS can_view
      FROM sue_file
      WHERE id = 1
    expect:
      rows: 1
      data:
        - filename: "one.bin"
          kind: "bin"
          size: 10
          payload: "x"
          width: 2
          height: 3
          can_view: true

  - name: "sql-union-exists-correlated-branches-return-false-without-match"
    sql: |
      SELECT filename,
        EXISTS (
          SELECT id FROM sue_ref_content WHERE content = sue_file.id AND TRUE
          UNION ALL
          SELECT id FROM sue_ref_file WHERE file_id = sue_file.id AND TRUE
          UNION ALL
          SELECT SUBSTR(old_value, 7) FROM sue_audit WHERE old_value LIKE 'asset:%' AND TRUE
        ) AS can_view
      FROM sue_file
      WHERE id = 3
    expect:
      rows: 1
      data:
        - filename: "three.bin"
          can_view: false
