# Fixture preparation and cleanup are explicit cases so unsupported DDL stays visible.
metadata:
  description: Streaming t-sql script import with Unicode and target confinement
  isolated: true
setup: []
test_cases:
- sql: DROP TABLE IF EXISTS tsdump_identity_observation
  name: 'Fixture setup 001: DROP TABLE IF EXISTS tsdump_identity_observation'
- sql: DROP TABLE IF EXISTS tsdump_identity
  name: 'Fixture setup 002: DROP TABLE IF EXISTS tsdump_identity'
- sql: DROP TABLE IF EXISTS tsdump_items
  name: 'Fixture setup 003: DROP TABLE IF EXISTS tsdump_items'
- sql: DROP TABLE IF EXISTS tsdump_utf16
  name: 'Fixture setup 004: DROP TABLE IF EXISTS tsdump_utf16'
- sql: DROP TABLE IF EXISTS tsdump_conditional
  name: 'Fixture setup 005: DROP TABLE IF EXISTS tsdump_conditional'
- name: Load GO-delimited export into selected target
  scm: (load_tsql "memcp-tests" (concat __DIR__ "/../tests/fixtures/tsql-export.sql") (sql_policy "root"))
  noncritical: true
- name: Multiline conditional declarations and ELSE data preserve target confinement
  sql: SELECT id,label FROM tsdump_conditional
  expect:
    rows: 1
    data:
    - id: 2
      label: ELSE; CREATE 🐘
  noncritical: true
- name: Import GO clears scope while preserving session identity
  sql: SELECT stage, value FROM tsdump_identity_observation ORDER BY stage
  expect:
    rows: 3
    data:
    - stage: 1
      value: 2
    - stage: 2
      value: null
    - stage: 3
      value: 3
  noncritical: true
- name: Imported strings and defaults survive retargeting
  sql: SELECT tenant, id, name, note, enabled FROM tsdump_items ORDER BY id
  expect:
    rows: 2
    data:
    - tenant: 1
      id: 7
      name: Grüße 🐘
      note: export_source.dbo.keep
      enabled: -1
    - tenant: 1
      id: 15
      name: Semi;colon 'quote'
      note: 'first

        GO

        last'
      enabled: -1
  noncritical: true
- name: Imported identity resumes above explicit IDs
  syntax: tsql
  sql: INSERT dbo.tsdump_items (tenant, name) VALUES (1, N'next')
  expect:
    rows: 1
  noncritical: true
- name: Imported identity generated correct successor
  sql: SELECT id FROM tsdump_items WHERE name = 'next'
  expect:
    rows: 1
    data:
    - id: 16
  noncritical: true
- name: Imported compound primary key enforces uniqueness
  syntax: tsql
  sql: INSERT dbo.tsdump_items (tenant,id,name) VALUES (1,7,N'duplicate')
  expect:
    error: true
- name: Compressed UTF16 export is decoded without data loss
  scm: (load_tsql "memcp-tests" (concat __DIR__ "/../tests/fixtures/tsql-utf16.sql.gz") (sql_policy "root"))
  noncritical: true
- name: UTF16 import preserves Unicode and nulls
  sql: SELECT id, label, note FROM tsdump_utf16
  expect:
    rows: 1
    data:
    - id: 1
      label: Zürich 🐘
      note: null
  noncritical: true
- name: Import policy is honored before opening a file
  scm: (load_tsql "memcp-tests" "/does/not/exist" (lambda (db table write) (error "denied")))
  expect:
    error: true
- name: Unsupported import statement stops execution
  scm: (load_tsql "memcp-tests" (concat __DIR__ "/../tests/fixtures/tsql-unsupported.sql") (sql_policy "root"))
  expect:
    error: true
- name: Statements after an unsupported statement are not executed
  sql: SELECT COUNT(*) AS n FROM tsdump_items WHERE id = 998
  expect:
    rows: 1
    data:
    - n: 0
  noncritical: true
- name: Uncommitted import transaction is rejected
  scm: (load_tsql "memcp-tests" (concat __DIR__ "/../tests/fixtures/tsql-uncommitted.sql") (sql_policy "root"))
  expect:
    error: true
- name: Uncommitted imported rows are rolled back
  sql: SELECT COUNT(*) AS n FROM tsdump_items WHERE id = 999
  expect:
    rows: 1
    data:
    - n: 0
  noncritical: true
- name: Import rejects references outside destination and source alias
  scm: "(begin\n  (define s (newsession))\n  (s \"tsql_import_target\" \"memcp-tests\")\n  (s \"tsql_import_source\"\
    \ \"export_source\")\n  (parse_tsql \"memcp-tests\" \"SELECT * FROM [other_db].[dbo].[tsdump_items]\" (sql_policy\
    \ \"root\") s nil))\n"
  expect:
    error: true
- name: Import rejects a second source database
  scm: "(begin (define s (newsession))\n  (tsql_import_database s \"first\")\n  (tsql_import_database s \"second\"\
    ))\n"
  expect:
    error: true
- name: Normal frontend does not silently ignore identity switching
  syntax: tsql
  sql: SET IDENTITY_INSERT dbo.tsdump_items ON
  expect:
    error: true
- sql: DROP TABLE IF EXISTS tsdump_identity_observation
  name: 'Fixture cleanup 001: DROP TABLE IF EXISTS tsdump_identity_observation'
- sql: DROP TABLE IF EXISTS tsdump_identity
  name: 'Fixture cleanup 002: DROP TABLE IF EXISTS tsdump_identity'
- sql: DROP TABLE IF EXISTS tsdump_items
  name: 'Fixture cleanup 003: DROP TABLE IF EXISTS tsdump_items'
- sql: DROP TABLE IF EXISTS tsdump_utf16
  name: 'Fixture cleanup 004: DROP TABLE IF EXISTS tsdump_utf16'
- sql: DROP TABLE IF EXISTS tsdump_conditional
  name: 'Fixture cleanup 005: DROP TABLE IF EXISTS tsdump_conditional'
- name: Import source names bind qualified DDL and leave string contents unchanged
  scm: "(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql \"memcp-tests\"\
    \ (streamString \"USE [import_source]\\nGO\\nCREATE TABLE [import_source].[dbo].[tsdump_bound] (id INT PRIMARY\
    \ KEY,label NVARCHAR(80))\\nGO\\nINSERT [import_source]..[tsdump_bound] VALUES(1,N'import_source.dbo.keep')\\\
    nGO\\n\") session)\n  true)\n"
  expect:
    result: true
- name: Imported qualified data belongs to the destination
  syntax: tsql
  sql: SELECT id,label FROM dbo.tsdump_bound
  expect:
    rows: 1
    data:
    - id: 1
      label: import_source.dbo.keep
- name: Repeated source USE and destination USE retain one import target
  scm: "(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql \"memcp-tests\"\
    \ (streamString \"USE [import_source]\\nGO\\nUSE [import_source]\\nGO\\nUSE [memcp-tests]\\nGO\\nINSERT dbo.tsdump_bound\
    \ VALUES(2,N'target')\") session)\n  true)\n"
  expect:
    result: true
- name: Source bindings never replace the callers import names
  scm: "(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (session \"tsql_import_target\"\
    \ \"caller target\")\n  (session \"tsql_import_source\" \"caller source\")\n  (load_tsql \"memcp-tests\" (streamString\
    \ \"USE [import_source]\\nGO\\nSELECT 1 AS value\") session)\n  (and (equal? (session \"tsql_import_target\"\
    ) \"caller target\")\n    (equal? (session \"tsql_import_source\") \"caller source\")))\n"
  expect:
    result: true
- name: Imports reject selecting another source through the public script path
  scm: "(try (lambda () (begin\n(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql\
    \ \"memcp-tests\" (streamString \"USE [import_source]\\nGO\\nUSE [another_source]\") session))\nfalse))\n  (lambda\
    \ (failure) (strlike (concat failure) \"%second source database%\")))\n"
  expect:
    result: true
- name: Imports reject qualified reads outside the target and source
  scm: "(try (lambda () (begin\n(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql\
    \ \"memcp-tests\" (streamString \"USE [import_source]\\nGO\\nSELECT * FROM [another_source].[dbo].[tsdump_bound]\"\
    ) session))\nfalse))\n  (lambda (failure) (strlike (concat failure) \"%outside destination%\")))\n"
  expect:
    result: true
- name: Imports reject qualified writes outside the target and source
  scm: "(try (lambda () (begin\n(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql\
    \ \"memcp-tests\" (streamString \"USE [import_source]\\nGO\\nDELETE FROM [another_source]..[tsdump_bound]\"\
    ) session))\nfalse))\n  (lambda (failure) (strlike (concat failure) \"%outside destination%\")))\n"
  expect:
    result: true
- name: Imports reject qualified declarations outside the target and source
  scm: "(try (lambda () (begin\n(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql\
    \ \"memcp-tests\" (streamString \"USE [import_source]\\nGO\\nCREATE TABLE [another_source].[dbo].[tsdump_escape](id\
    \ INT)\") session))\nfalse))\n  (lambda (failure) (strlike (concat failure) \"%outside destination%\")))\n"
  expect:
    result: true
- name: Import source mappings cannot leak through the statement cache
  scm: "(try (lambda () (begin\n(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql\
    \ \"memcp-tests\" (streamString \"USE [import_source]\\nGO\\nSELECT id FROM [import_source].[dbo].[tsdump_bound]\"\
    ) session)\n  (load_tsql \"memcp-tests\" (streamString \"USE [another_source]\\nGO\\nSELECT id FROM [import_source].[dbo].[tsdump_bound]\"\
    ) session))\nfalse))\n  (lambda (failure) (strlike (concat failure) \"%outside destination%\")))\n"
  expect:
    result: true
- name: Imports cannot issue administrative database DDL
  scm: "(try (lambda () (begin\n(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql\
    \ \"memcp-tests\" (streamString \"CREATE DATABASE tsdump_escape_database\") session))\nfalse))\n  (lambda (failure)\
    \ (strlike (concat failure) \"%outside destination%\")))\n"
  expect:
    result: true
- name: Retargeted views store the native destination query
  scm: "(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql \"memcp-tests\"\
    \ (streamString \"USE [import_source]\\nGO\\nCREATE VIEW [import_source].[dbo].[tsdump_bound_view] AS SELECT\
    \ id,label FROM [import_source]..[tsdump_bound]\") session)\n  true)\n"
  expect:
    result: true
- name: Retargeted view can be read after the import context ends
  syntax: tsql
  sql: SELECT id,label FROM dbo.tsdump_bound_view ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      label: import_source.dbo.keep
    - id: 2
      label: target
- name: Import source aliases do not leak into persisted procedure source
  scm: "(try (lambda () (begin\n(begin\n  (define session (newsession))\n  (session \"username\" \"root\")\n  (load_tsql\
    \ \"memcp-tests\" (streamString \"USE [import_source]\\nGO\\nCREATE PROCEDURE dbo.tsdump_unsafe_proc AS SELECT\
    \ id FROM [import_source]..[tsdump_bound]\") session))\nfalse))\n  (lambda (failure) (strlike (concat failure)\
    \ \"%retargeted procedure definitions%\")))\n"
  expect:
    result: true
- name: Rejected import operations leave the actual destination intact
  syntax: tsql
  sql: SELECT COUNT(*) AS n FROM dbo.tsdump_bound
  expect:
    rows: 1
    data:
    - n: 2
- name: Remove the imported view through the normal frontend
  syntax: tsql
  sql: DROP VIEW dbo.tsdump_bound_view
- name: Remove the imported target through the normal frontend
  syntax: tsql
  sql: DROP TABLE dbo.tsdump_bound
- name: HTTP options cannot enable import namespace bindings
  scm: |
    (begin
      (define session (newsession))
      (define output (newsession))
      (tsql_http_query
        (list "username" "root" "password" "admin" "body" (lambda () "SELECT 1 AS value")
          "__session" session "__session_state" nil "__query_seq" 0
          "query" (list "tsql_import_target" "another_source" "tsql_import_source" "memcp-tests"))
        (list "header" (lambda args true) "jsonl" (lambda (row) (output "row" row))
          "status" (lambda (status) (output "status" status)) "print" (lambda args (output "error" args)))
        "memcp-tests")
      (and (nil? (session "tsql_import_target")) (nil? (session "tsql_import_source"))
        (nil? (output "error")) (equal? ((output "row") "value") 1)))
  expect: {result: true}
- name: Import virtual system calls keep the native target context
  scm: |
    (begin
      (define session (newsession))
      (session "username" "root")
      (load_tsql "memcp-tests" (streamString "USE [import_source]\nGO\nEXEC sys.sp_executesql N'SELECT 1 AS value'\nGO\nEXEC sys.sp_columns @table_name=N'tsdump_console_lifecycle'") session)
      true)
  expect: {result: true}
- name: Dynamic import SQL retains the same target confinement
  scm: |
    (try (lambda () (begin
      (define session (newsession))
      (session "username" "root")
      (load_tsql "memcp-tests" (streamString "USE [import_source]\nGO\nEXEC sys.sp_executesql N'SELECT * FROM [another_source]..[tsdump_escape]'") session)
      false)) (lambda (failure) (strlike (concat failure) "%outside destination%")))
  expect: {result: true}
- name: Qualified system calls cannot select an unrelated import database
  scm: |
    (try (lambda () (begin
      (define session (newsession))
      (session "username" "root")
      (load_tsql "memcp-tests" (streamString "USE [import_source]\nGO\nEXEC [another_source].dbo.sp_columns @table_name=N'tsdump_escape'") session)
      false)) (lambda (failure) (strlike (concat failure) "%outside destination%")))
  expect: {result: true}
- name: Persisted procedure source is also rejected before any source USE
  scm: |
    (try (lambda () (begin
      (define session (newsession))
      (session "username" "root")
      (load_tsql "memcp-tests" (streamString "CREATE PROCEDURE dbo.tsdump_unsafe_proc AS SELECT * FROM [another_source]..[tsdump_escape]") session)
      false)) (lambda (failure) (strlike (concat failure) "%retargeted procedure definitions%")))
  expect: {result: true}
- name: System target imports cannot authorize database administration
  scm: |
    (begin
      (define planning (newsession))
      (planning "tsql_import_target" "system")
      (try (lambda () (begin
        (parse_tsql "system" "CREATE DATABASE tsdump_escape_database" (lambda args true) planning nil)
        false)) (lambda (failure) (strlike (concat failure) "%outside destination%"))))
  expect: {result: true}
cleanup: []
