        - {period: 1, pindex: 0, offers: 2, total: 7, per_day: 1.4, average: 7, customers: 1}
        - {period: 2, pindex: 0, offers: 0, total: 0, per_day: 0, average: 0, customers: 0}

  - name: "KPI UNION ALL retains aggregate producers across branches"
    sql: |
      SELECT history.period, params.pindex,
        COALESCE((SELECT COUNT(1) FROM nac_kpi_offer counted
          WHERE counted.created BETWEEN history.start_time AND history.end_time LIMIT 1), 0) AS offers,
        COALESCE((SELECT SUM((SELECT SUM(item.quantity * item.price)
          FROM nac_kpi_item item WHERE item.offer_id = summed.id LIMIT 1))
          FROM nac_kpi_offer summed
          WHERE summed.created BETWEEN history.start_time AND history.end_time LIMIT 1), 0) AS total,
        COALESCE((SELECT SUM((SELECT SUM(position.quantity * position.price)
          FROM nac_kpi_item position WHERE position.offer_id = repeated.id LIMIT 1))
          FROM nac_kpi_offer repeated
          WHERE repeated.created BETWEEN history.start_time AND history.end_time LIMIT 1), 0) / 5 AS per_day,
        COALESCE((SELECT AVG((SELECT SUM(element.quantity * element.price)
          FROM nac_kpi_item element WHERE element.offer_id = averaged.id LIMIT 1))
          FROM nac_kpi_offer averaged
          WHERE averaged.created BETWEEN history.start_time AND history.end_time LIMIT 1), 0) AS average,
        (SELECT COUNT(DISTINCT distinct_offer.customer) FROM nac_kpi_offer distinct_offer
          WHERE distinct_offer.created BETWEEN history.start_time AND history.end_time LIMIT 1) AS customers
      FROM (SELECT 0 AS period, 0 AS start_time, 9 AS end_time
        UNION ALL SELECT 1 AS period, 10 AS start_time, 19 AS end_time
        UNION ALL SELECT 2 AS period, 20 AS start_time, 29 AS end_time) history
      CROSS JOIN (SELECT 0 AS pindex) params
      ORDER BY history.period
    expect:
      rows: 3
      data:
        - {period: 0, pindex: 0, offers: 2, total: 55, per_day: 11, average: 27.5, customers: 1}
        - {period: 1, pindex: 0, offers: 2, total: 7, per_day: 1.4, average: 7, customers: 1}
        - {period: 2, pindex: 0, offers: 0, total: 0, per_day: 0, average: 0, customers: 0}

  - name: "KPI aggregate rejects a missing user column"
    sql: |
      SELECT (SELECT SUM(item.missing_price) FROM nac_kpi_item item
        WHERE item.offer_id = offer.id) AS total
      FROM nac_kpi_offer offer
    expect: {error: true}

  - name: KPI projected columns require a costed reusable scalar lookup
    setup:
      - scm: |-
          (insert (table "memcp-tests" "nac_kpi_offer") '("id" "created" "customer")
           (map (produceN 2000) (lambda (i) (list (+ i 100) 1000 9))))
      - sql: INSERT INTO nac_kpi_item VALUES (4, NULL, 7)
    scm: |-
      (begin
      (define planning (newsession))
      (define sink (newsession))
      (planning "__memcp_explain_physical" sink)
      (parse_sql "memcp-tests" "SELECT history.period,\n (SELECT COUNT(*) FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi) AS offers,\n COALESCE((SELECT SUM((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))\n  FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS total,\n COALESCE((SELECT AVG((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))\n  FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS average\nFROM (SELECT 0 AS period, 0 AS lo, 9 AS hi UNION SELECT 1,10,19 UNION SELECT 2,20,29) history\nORDER BY history.period" nil planning nil)
      (define decisions (filter (planner_physical_explain_decisions sink)
       (lambda (d) (equal? (qassoc_get d "decision" nil) "scalar_group_projection"))))
       (if (empty_list? decisions) (error "missing scalar projection cost alternative") true)
       (map decisions (lambda (d)
        (begin
         (if (> (qassoc_get (qassoc_get d "inputs" '()) "build_ns" 0) 0) true
          (error "projection omitted full cache build cost"))
         (group_cache_candidate_accumulate (qassoc_get d "decision_id" nil) 1000000000000 nil))))
       true)
    expect:
      result_contains:
        - 'true'
  - name: KPI projection preserves absent and all-NULL children and empty periods
    sql: |-
      SELECT history.period,
       (SELECT COUNT(*) FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi) AS offers,
       COALESCE((SELECT SUM((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS total,
       COALESCE((SELECT AVG((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS average
      FROM (SELECT 0 AS period, 0 AS lo, 9 AS hi UNION SELECT 1,10,19 UNION SELECT 2,20,29) history
      ORDER BY history.period
    expect:
      rows: 3
      data:
        - period: 0
          offers: 2
          total: 55
          average: 27.5
        - period: 1
          offers: 2
          total: 7
          average: 7
        - period: 2
          offers: 0
          total: 0
          average: 0
  - name: KPI projection is materialized and reused
    scm: |-
      (begin
      (define planning (newsession))
      (define sink (newsession))
      (planning "__memcp_explain_physical" sink)
      (parse_sql "memcp-tests" "SELECT history.period,\n (SELECT COUNT(*) FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi) AS offers,\n COALESCE((SELECT SUM((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))\n  FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS total,\n COALESCE((SELECT AVG((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))\n  FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS average\nFROM (SELECT 0 AS period, 0 AS lo, 9 AS hi UNION SELECT 1,10,19 UNION SELECT 2,20,29) history\nORDER BY history.period" nil planning nil)
      (define decisions (filter (planner_physical_explain_decisions sink)
       (lambda (d) (equal? (qassoc_get d "decision" nil) "scalar_group_projection"))))
       (if (and (not (empty_list? decisions))
        (reduce decisions (lambda (ok d)
         (and ok (qassoc_get (qassoc_get d "inputs" '()) "cache_ready" false))) true))
        true (error "query did not materialize the costed scalar projection")))
    expect:
      result_contains:
        - 'true'
  - name: Update a warmed KPI line item
    sql: UPDATE nac_kpi_item SET price=20 WHERE offer_id=1 AND quantity=2
    expect:
      rows: 1
  - name: KPI projection invalidates through the nested aggregate
    sql: |-
      SELECT history.period,
       (SELECT COUNT(*) FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi) AS offers,
       COALESCE((SELECT SUM((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS total,
       COALESCE((SELECT AVG((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS average
      FROM (SELECT 0 AS period, 0 AS lo, 9 AS hi UNION SELECT 1,10,19 UNION SELECT 2,20,29) history
      ORDER BY history.period
    expect:
      rows: 3
      data:
        - period: 0
          offers: 2
          total: 75
          average: 37.5
        - period: 1
          offers: 2
          total: 7
          average: 7
        - period: 2
          offers: 0
          total: 0
          average: 0
  - name: Insert the first non-NULL item of an existing offer
    sql: INSERT INTO nac_kpi_item VALUES (4,2,9)
    expect:
      rows: 1
