        - period: 0
          offers: 2
          total: 75
          average: 37.5
        - period: 1
          offers: 2
          total: 25
          average: 12.5
        - period: 2
          offers: 0
          total: 0
          average: 0
  - name: Remove every item of a warmed offer
    sql: DELETE FROM nac_kpi_item WHERE offer_id=1
    expect:
      rows: 1
  - name: KPI projection repairs a disappearing child group
    sql: |-
      SELECT history.period,
       (SELECT COUNT(*) FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi) AS offers,
       COALESCE((SELECT SUM((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS total,
       COALESCE((SELECT AVG((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS average
      FROM (SELECT 0 AS period, 0 AS lo, 9 AS hi UNION SELECT 1,10,19 UNION SELECT 2,20,29) history
      ORDER BY history.period
    expect:
      rows: 3
      data:
        - period: 0
          offers: 2
          total: 30
          average: 30
        - period: 1
          offers: 2
          total: 25
          average: 12.5
        - period: 2
          offers: 0
          total: 0
          average: 0
  - name: Move an offer between periods
    sql: UPDATE nac_kpi_offer SET created=12 WHERE id=2
    expect:
      rows: 1
  - name: KPI range scans use current parent dates
    sql: |-
      SELECT history.period,
       (SELECT COUNT(*) FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi) AS offers,
       COALESCE((SELECT SUM((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS total,
       COALESCE((SELECT AVG((SELECT SUM(i.quantity*i.price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS average
      FROM (SELECT 0 AS period, 0 AS lo, 9 AS hi UNION SELECT 1,10,19 UNION SELECT 2,20,29) history
      ORDER BY history.period
    expect:
      rows: 3
      data:
        - period: 0
          offers: 1
          total: 0
          average: 0
        - period: 1
          offers: 3
          total: 55
          average: 18.333333333333332
        - period: 2
          offers: 0
          total: 0
          average: 0
  - name: KPI projection rejects an unknown child column
    sql: |-
      SELECT history.period,
       (SELECT COUNT(*) FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi) AS offers,
       COALESCE((SELECT SUM((SELECT SUM(i.quantity*i.missing_price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS total,
       COALESCE((SELECT AVG((SELECT SUM(i.quantity*i.missing_price) FROM nac_kpi_item i WHERE i.offer_id=o.id))
        FROM nac_kpi_offer o WHERE o.created BETWEEN history.lo AND history.hi),0) AS average
      FROM (SELECT 0 AS period, 0 AS lo, 9 AS hi UNION SELECT 1,10,19 UNION SELECT 2,20,29) history
      ORDER BY history.period
    expect:
      error: true
