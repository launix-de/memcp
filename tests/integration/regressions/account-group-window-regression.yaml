# Regression for grouped derived-table wrappers over a materialized inner SELECT.

metadata:
  version: "1.0"
  description: "Vacation-account style grouped derived table with outer wrapper"

setup:
  - sql: "DROP TABLE IF EXISTS vac_reg_aux"
  - sql: "DROP TABLE IF EXISTS vac_reg_ref"
  - sql: "DROP TABLE IF EXISTS vac_reg_main"
  - sql: "CREATE TABLE vac_reg_main (ID INT, date INT, val INT, resultAz INT, istAz INT, sollAz INT)"
  - sql: "CREATE TABLE vac_reg_ref (ID INT, label VARCHAR(20))"
  - sql: "CREATE TABLE vac_reg_aux (ID INT, mid INT, ts INT, amount INT)"
  - sql: "INSERT INTO vac_reg_main (ID, date, val, resultAz, istAz, sollAz) VALUES (1, 1704067200, 10, 2, 3, 4), (2, 1706745600, 20, 5, 7, 8), (3, 1735689600, 30, 11, 13, 17)"
  - sql: "INSERT INTO vac_reg_ref (ID, label) VALUES (1, 'a'), (2, 'b')"
  - sql: "INSERT INTO vac_reg_aux (ID, mid, ts, amount) VALUES (1, 1, 1704067200, 5), (2, 2, 1706745600, 7)"

cleanup:
  - sql: "DROP TABLE IF EXISTS vac_reg_aux"
  - sql: "DROP TABLE IF EXISTS vac_reg_ref"
  - sql: "DROP TABLE IF EXISTS vac_reg_main"

test_cases:
  - name: "grouped derived table without outer wrapper"
    sql: |
      SELECT COUNT(*) AS _count,
        _year_date AS _year_date,
        SUM(differenz) AS differenz,
        SUM(istAz) AS istAz
      FROM (
        SELECT m.ID AS ID,
          m.date AS date,
          UNIX_TIMESTAMP((STR_TO_DATE(DATE_FORMAT(FROM_UNIXTIME((m.date)), '%Y-01-01'), '%Y-%m-%d'))) AS _year_date,
          COALESCE(m.resultAz, 0) + COALESCE(m.istAz, 0) - COALESCE(m.sollAz, 0) AS differenz,
          m.istAz AS istAz,
          COALESCE((SELECT h.amount FROM vac_reg_aux h WHERE h.mid = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS score,
          r.label AS ref_label
        FROM vac_reg_main m
        LEFT JOIN vac_reg_ref r
          ON r.ID = m.ID
          AND COALESCE((SELECT MAX(h2.ts) FROM vac_reg_aux h2 WHERE h2.mid = m.ID LIMIT 1), NULL) IS NOT NULL
      ) t
      WHERE (t.date >= '1704067200' AND t.date <= '1735689600' AND TRUE)
      GROUP BY _year_date
      ORDER BY _year_date
    expect:
      rows: 2
      data:
        - _count: 2
          _year_date: 1704067200
          differenz: 5
          istAz: 10
        - _count: 1
          _year_date: 1735689600
          differenz: 7
          istAz: 13

  - name: "outer select t star over grouped derived table with window percent"
    sql: |
      SELECT t.*
      FROM (
        SELECT COUNT(*) AS _count,
          COUNT(*)*100/GREATEST((SUM(COUNT(*)) OVER ()), 1) AS _count_percent,
          _year_date AS _year_date,
          SUM(differenz) AS differenz,
          SUM(istAz) AS istAz
        FROM (
          SELECT m.ID AS ID,
            m.date AS date,
            UNIX_TIMESTAMP((STR_TO_DATE(DATE_FORMAT(FROM_UNIXTIME((m.date)), '%Y-01-01'), '%Y-%m-%d'))) AS _year_date,
            COALESCE(m.resultAz, 0) + COALESCE(m.istAz, 0) - COALESCE(m.sollAz, 0) AS differenz,
            m.istAz AS istAz,
            COALESCE((SELECT h.amount FROM vac_reg_aux h WHERE h.mid = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS score,
            r.label AS ref_label
          FROM vac_reg_main m
          LEFT JOIN vac_reg_ref r
            ON r.ID = m.ID
            AND COALESCE((SELECT MAX(h2.ts) FROM vac_reg_aux h2 WHERE h2.mid = m.ID LIMIT 1), NULL) IS NOT NULL
        ) t
        WHERE (t.date >= '1704067200' AND t.date <= '1735689600' AND TRUE)
        GROUP BY _year_date
      ) t
      WHERE TRUE
      ORDER BY t._year_date
    expect:
      rows: 2
      data:
        - _count: 2
          _count_percent: 66.66666666666667
          _year_date: 1704067200
          differenz: 5
          istAz: 10
        - _count: 1
          _count_percent: 33.333333333333336
          _year_date: 1735689600
          differenz: 7
          istAz: 13

  - name: "nested window aggregate retains derived expression alias"
    sql: |
      SELECT _year_date,
        SUM(differenz) AS differenz,
        SUM(differenz)*100/GREATEST((SUM(SUM(differenz)) OVER ()), 1) AS differenz_percent
      FROM (
        SELECT date AS _year_date,
          COALESCE(resultAz, 0) + COALESCE(istAz, 0) - COALESCE(sollAz, 0) AS differenz
        FROM vac_reg_main
      ) t
      GROUP BY _year_date
      ORDER BY _year_date
    expect:
      data:
        - _year_date: 1704067200
          differenz: 1
          differenz_percent: 8.333333333333334
        - _year_date: 1706745600
          differenz: 4
          differenz_percent: 33.333333333333336
        - _year_date: 1735689600
          differenz: 7
          differenz_percent: 58.333333333333336

  - name: "outer wrapper retains nested window aggregate derived alias"
    sql: |
      SELECT grouped.*
      FROM (
        SELECT COUNT(*) AS _count,
          _year_date AS _year_date,
          SUM(differenz) AS differenz,
          SUM(differenz)*100/GREATEST((SUM(SUM(differenz)) OVER ()), 1) AS differenz_percent
        FROM (
          SELECT m.date AS _year_date,
            COALESCE(m.resultAz, 0) + COALESCE(m.istAz, 0) - COALESCE(m.sollAz, 0) AS differenz
          FROM vac_reg_main m
        ) account_rows
        WHERE account_rows._year_date >= 1704067200
        GROUP BY _year_date
      ) grouped
      WHERE TRUE
      ORDER BY grouped._year_date
      LIMIT 72 OFFSET 0
    expect:
      data:
        - _count: 1
          _year_date: 1704067200
          differenz: 1
          differenz_percent: 8.333333333333334
        - _count: 1
          _year_date: 1706745600
          differenz: 4
          differenz_percent: 33.333333333333336
        - _count: 1
          _year_date: 1735689600
          differenz: 7
          differenz_percent: 58.333333333333336

  - name: "window aggregate derived alias survives flattened derived left joins"
    sql: |
      SELECT grouped.*
      FROM (
        SELECT COUNT(*) AS _count,
          _year_date AS _year_date,
          SUM(differenz) AS differenz,
          SUM(differenz)*100/GREATEST((SUM(SUM(differenz)) OVER ()), 1) AS differenz_percent
        FROM (
          SELECT m.date AS _year_date,
            COALESCE(m.resultAz, 0) + COALESCE(m.istAz, 0) - COALESCE(m.sollAz, 0) AS differenz,
            ref.label AS ref_label
          FROM vac_reg_main m
          LEFT JOIN (
            SELECT ID AS ref_id, label AS label
            FROM vac_reg_ref
          ) ref ON ref.ref_id = m.ID
        ) account_rows
        WHERE account_rows._year_date >= 1704067200
        GROUP BY _year_date
      ) grouped
      WHERE TRUE
      ORDER BY grouped._year_date
      LIMIT 72 OFFSET 0
    expect:
      data:
        - _count: 1
          _year_date: 1704067200
          differenz: 1
          differenz_percent: 8.333333333333334
        - _count: 1
          _year_date: 1706745600
          differenz: 4
          differenz_percent: 33.333333333333336
        - _count: 1
          _year_date: 1735689600
          differenz: 7
          differenz_percent: 58.333333333333336

  - name: "window total retains ordered scalar dependency"
    sql: |
      SELECT category,
        SUM(score) AS subtotal,
        SUM(SUM(score)) OVER () AS total
      FROM (
        SELECT m.val AS category,
          COALESCE((
            SELECT h.amount
            FROM vac_reg_aux h
            WHERE h.mid = m.ID
            ORDER BY h.ts DESC
            LIMIT 1
          ), 0) AS score
        FROM vac_reg_main m
      ) rows_with_score
      GROUP BY category
      ORDER BY category
    expect:
      data:
        - category: 10
          subtotal: 5
          total: 12
        - category: 20
          subtotal: 7
          total: 12
        - category: 30
          subtotal: 0
          total: 12

  - name: "window total retains scalar aggregate dependency"
    sql: |
      SELECT category,
        SUM(score) AS subtotal,
        SUM(SUM(score)) OVER () AS total
      FROM (
        SELECT m.val AS category,
          (SELECT SUM(h.amount) FROM vac_reg_aux h WHERE h.mid = m.ID LIMIT 1) AS score
        FROM vac_reg_main m
      ) rows_with_score
      GROUP BY category
      ORDER BY category
    expect:
      data:
        - category: 10
          subtotal: 5
          total: 12
        - category: 20
          subtotal: 7
          total: 12
        - category: 30
          subtotal: null
          total: 12

  - name: "reused derived alias preserves grouped keys and aggregates"
    sql: |
      SELECT t.* FROM (
        SELECT date, COUNT(*) AS n, SUM(val) AS subtotal
        FROM (SELECT date, val FROM vac_reg_main) t
        GROUP BY date
      ) t ORDER BY t.date
    expect:
      rows: 3
      data:
        - {date: 1704067200, n: 1, subtotal: 10}
        - {date: 1706745600, n: 1, subtotal: 20}
        - {date: 1735689600, n: 1, subtotal: 30}

  - name: "reused derived alias preserves grouped window percentages"
    sql: |
      SELECT t.* FROM (
        SELECT year_date, COUNT(*) AS n,
          COUNT(*)*100/GREATEST(SUM(COUNT(*)) OVER (), 1) AS count_percent,
          SUM(val) AS val,
          SUM(val)*100/GREATEST(SUM(SUM(val)) OVER (), 1) AS value_percent
        FROM (
          SELECT UNIX_TIMESTAMP(STR_TO_DATE(
            DATE_FORMAT(FROM_UNIXTIME(date), '%Y-01-01'), '%Y-%m-%d')) AS year_date,
            val AS val
          FROM vac_reg_main c WHERE ID>0
        ) t
        GROUP BY year_date
      ) t WHERE TRUE ORDER BY t.year_date LIMIT 72 OFFSET 0
    expect:
      rows: 2
      data:
        - {year_date: 1704067200, n: 2, count_percent: 66.66666666666667, val: 30, value_percent: 50}
        - {year_date: 1735689600, n: 1, count_percent: 33.333333333333336, val: 30, value_percent: 50}

  - name: "outer filter and offset retain the shadowed grouped window domain"
    sql: |
      SELECT t.* FROM (
        SELECT date, SUM(val) AS subtotal, SUM(SUM(val)) OVER () AS total
        FROM (SELECT date, val FROM vac_reg_main) t
        GROUP BY date HAVING SUM(val)>=10
      ) t WHERE t.subtotal>=20 ORDER BY t.date LIMIT 1 OFFSET 1
    expect:
      rows: 1
      data: [{date: 1735689600, subtotal: 30, total: 60}]

  - name: "empty grouped input remains empty with reused derived aliases"
    sql: |
      SELECT t.* FROM (
        SELECT date, COUNT(*) AS n, SUM(SUM(val)) OVER () AS total
        FROM (SELECT date, val FROM vac_reg_main WHERE val<0) t GROUP BY date
      ) t
    expect:
      rows: 0
