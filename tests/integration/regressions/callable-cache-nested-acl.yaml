metadata:
  version: "1.0"
  description: "Deep correlated ACL plans remain valid in the callable query cache"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS cca_access"
  - sql: "DROP TABLE IF EXISTS cca_item"
  - sql: "DROP TABLE IF EXISTS cca_domain"
  - sql: "DROP TABLE IF EXISTS cca_tenant"
  - sql: "DROP TABLE IF EXISTS cca_org"
  - sql: "CREATE TABLE cca_org (id INT PRIMARY KEY, direct_flag BOOL)"
  - sql: "CREATE TABLE cca_tenant (id INT PRIMARY KEY, org_id INT, direct_flag BOOL)"
  - sql: "CREATE TABLE cca_domain (id INT PRIMARY KEY, tenant_id INT, direct_flag BOOL)"
  - sql: "CREATE TABLE cca_item (id INT PRIMARY KEY, domain_id INT, bucket_id INT, sort_key INT)"
  - sql: "CREATE TABLE cca_access (id INT PRIMARY KEY, actor_id INT, org_id INT, tenant_id INT, domain_id INT, allowed BOOL)"
  - sql: "INSERT INTO cca_org VALUES (1, FALSE), (2, FALSE)"
  - sql: "INSERT INTO cca_tenant VALUES (1, 1, FALSE), (2, 2, FALSE)"
  - sql: "INSERT INTO cca_domain VALUES (1, 1, FALSE), (2, 2, FALSE), (3, 1, TRUE), (4, 1, FALSE)"
  - scm: |
      (insert (table "memcp-tests" "cca_item") '("id" "domain_id" "bucket_id" "sort_key")
        (map (produceN 8) (lambda (i)
          (list (+ i 1) (+ (mod i 4) 1) 7 (- 8 i)))))
  - sql: "INSERT INTO cca_access VALUES (1, 101, NULL, NULL, NULL, TRUE), (2, 202, 2, 2, 2, TRUE)"
  - scm: "(rebuild)"

test_cases:
  - name: "Bind unrestricted actor"
    session_id: "cca-open"
    sql: "SET @cca_actor = 101"
    expect: {rows_affected: 0}

  - name: "Bind restricted actor"
    session_id: "cca-limited"
    sql: "SET @cca_actor = 202"
    expect: {rows_affected: 0}

  - &deep_acl
    name: "Cold deeply correlated ACL query"
    session_id: "cca-open"
    sql: |
      SELECT i.id
      FROM cca_item i
      WHERE COALESCE((
        SELECT
          CASE WHEN d.direct_flag THEN TRUE ELSE
            EXISTS (
              SELECT 1 FROM cca_access da
              WHERE da.actor_id = @cca_actor
                AND COALESCE(da.domain_id, d.id) = d.id
                AND da.allowed
              LIMIT 1
            )
            OR COALESCE((
              SELECT CASE WHEN t.direct_flag THEN TRUE ELSE
                EXISTS (
                  SELECT 1 FROM cca_access ta
                  WHERE ta.actor_id = @cca_actor
                    AND COALESCE(ta.tenant_id, t.id) = t.id
                    AND ta.allowed
                  LIMIT 1
                )
                OR COALESCE((
                  SELECT CASE WHEN o.direct_flag THEN TRUE ELSE EXISTS (
                    SELECT 1 FROM cca_access oa
                    WHERE oa.actor_id = @cca_actor
                      AND COALESCE(oa.org_id, o.id) = o.id
                      AND oa.allowed
                    LIMIT 1
                  ) END
                  FROM cca_org o
                  WHERE o.id = t.org_id
                  LIMIT 1
                ), FALSE)
              END
              FROM cca_tenant t
              WHERE t.id = d.tenant_id
              LIMIT 1
            ), FALSE)
          END
        FROM cca_domain d
        WHERE d.id = i.domain_id
        LIMIT 1
      ), FALSE)
      ORDER BY i.id
      LIMIT 4
    expect:
      rows: 4
      data: [{id: 1}, {id: 2}, {id: 3}, {id: 4}]

  - <<: *deep_acl
    name: "Warm the small callable plan and its autoindexes"

  - name: "Grow beyond the correlated carrier crossover"
    scm: |
      (begin
        (insert (table "memcp-tests" "cca_item") '("id" "domain_id" "bucket_id" "sort_key")
          (list (list 9 1 7 -1) (list 10 2 7 -2) (list 11 3 7 -3) (list 12 4 7 -4)))
        (rebuild (table "memcp-tests" "cca_item") true false))

  - <<: *deep_acl
    name: "Warm cached ACL query rebinds the restricted actor"
    session_id: "cca-limited"
    expect:
      rows: 4
      data: [{id: 2}, {id: 3}, {id: 6}, {id: 7}]

  - <<: *deep_acl
    name: "Warm cached ACL query rebinds the unrestricted actor"

  - name: "Prepare ordered ACL session alternation"
    setup:
      - sql: "DROP TABLE IF EXISTS ccp_access"
      - sql: "DROP TABLE IF EXISTS ccp_document"
      - sql: "DROP TABLE IF EXISTS ccp_site"
      - sql: "DROP TABLE IF EXISTS ccp_tenant"
      - sql: "DROP TABLE IF EXISTS ccp_file"
      - sql: "CREATE TABLE ccp_access (id INT PRIMARY KEY, actor_id INT, tenant_id INT, site_id INT)"
      - sql: "CREATE TABLE ccp_document (id INT PRIMARY KEY, site_id INT, file_id INT)"
      - sql: "CREATE TABLE ccp_site (id INT, tenant_id INT)"
      - sql: "CREATE TABLE ccp_tenant (id INT PRIMARY KEY)"
      - sql: "CREATE TABLE ccp_file (id INT PRIMARY KEY, uploaded_at INT)"
      - sql: "INSERT INTO ccp_tenant VALUES (1), (2)"
      - sql: "INSERT INTO ccp_site VALUES (1, 1), (2, 2)"
      - sql: "INSERT INTO ccp_access VALUES (1, 7, 1, NULL), (2, 9, NULL, NULL)"
      - scm: |
          (begin
            (insert (table "memcp-tests" "ccp_site") '("id" "tenant_id")
              (map (produceN 126) (lambda (i) (list (+ i 3) (+ (mod i 2) 1)))))
            (insert (table "memcp-tests" "ccp_document") '("id" "site_id" "file_id")
              (map (produceN 32000) (lambda (i) (list (+ i 1) (+ (mod i 128) 1) (+ i 1)))))
            (insert (table "memcp-tests" "ccp_file") '("id" "uploaded_at")
              (map (produceN 32000) (lambda (i) (list (+ i 1) (+ i 1)))))
            (rebuild))
    session_id: "ccp-limited"
    sql: "SET @ccp_actor = 7"
    expect: {rows_affected: 0}

  - name: "Bind ordered ACL administrator"
    session_id: "ccp-open"
    sql: "SET @ccp_actor = 9"
    expect: {rows_affected: 0}

  - &ccp_page
    name: "Cold ordered ACL limited page"
    session_id: "ccp-limited"
    sql: |
      SELECT d.id FROM ccp_document d
      WHERE (EXISTS (SELECT TRUE FROM ccp_access g WHERE g.actor_id = @ccp_actor AND g.tenant_id IS NULL LIMIT 1) OR NOT (EXISTS (SELECT TRUE FROM ccp_access g WHERE g.actor_id = @ccp_actor AND g.tenant_id IS NULL LIMIT 1)))
      AND COALESCE((SELECT
        (EXISTS (SELECT TRUE FROM ccp_access g WHERE g.actor_id = @ccp_actor AND g.tenant_id IS NULL LIMIT 1) OR NOT (EXISTS (SELECT TRUE FROM ccp_access g WHERE g.actor_id = @ccp_actor AND g.tenant_id IS NULL LIMIT 1)))
        AND CASE WHEN EXISTS (SELECT TRUE FROM ccp_access g WHERE g.actor_id = @ccp_actor AND g.tenant_id IS NULL LIMIT 1) THEN TRUE ELSE EXISTS (
          SELECT TRUE FROM ccp_access a
          WHERE a.actor_id = @ccp_actor AND COALESCE(a.site_id, p.id) = p.id LIMIT 1
        ) END
        AND COALESCE((SELECT CASE WHEN EXISTS (SELECT TRUE FROM ccp_access g WHERE g.actor_id = @ccp_actor AND g.tenant_id IS NULL LIMIT 1) THEN TRUE ELSE EXISTS (
          SELECT TRUE FROM ccp_access a
          WHERE a.actor_id = @ccp_actor AND a.tenant_id = t.id LIMIT 1
        ) END FROM ccp_tenant t WHERE t.id = p.tenant_id LIMIT 1), FALSE)
        FROM ccp_site p WHERE p.id = d.site_id LIMIT 1), FALSE)
      ORDER BY (SELECT f.uploaded_at FROM ccp_file f WHERE f.id = d.file_id LIMIT 1) DESC, d.id ASC
      LIMIT 3
    expect:
      rows: 3
      data: [{id: 31999}, {id: 31997}, {id: 31995}]

  - <<: *ccp_page
    name: "Warm ordered ACL limited page"

  - <<: *ccp_page
    name: "Ordered ACL administrator page"
    session_id: "ccp-open"
    expect:
      rows: 3
      data: [{id: 32000}, {id: 31999}, {id: 31998}]

  - <<: *ccp_page
    name: "Ordered ACL limited page after administrator"

  - <<: *ccp_page
    name: "Repeat limited page after administrator"

  - name: "Switch the limited session to administrator"
    session_id: "ccp-limited"
    sql: "SET @ccp_actor = 9"
    expect: {rows_affected: 0}

  - <<: *ccp_page
    name: "Ordered ACL page after same-session administrator switch"
    expect:
      rows: 3
      data: [{id: 32000}, {id: 31999}, {id: 31998}]

  - name: "Restore the same session to limited actor"
    session_id: "ccp-limited"
    sql: "SET @ccp_actor = 7"
    expect: {rows_affected: 0}

  - <<: *ccp_page
    name: "Ordered ACL page restores same-session isolation"

  - name: "Bind a NULL actor after populating shared domains"
    session_id: "ccp-limited"
    sql: "SET @ccp_actor = NULL"
    expect: {rows_affected: 0}

  - <<: *ccp_page
    name: "NULL actor cannot inherit another cached domain"
    expect: {rows: 0}

  - name: "Reject an unresolved correlated permission column"
    session_id: "ccp-limited"
    sql: "SELECT d.id FROM ccp_document d WHERE EXISTS (SELECT a.missing_permission FROM ccp_access a WHERE a.actor_id = d.id)"
    expect: {error: true}

cleanup:
  - sql: "DROP TABLE IF EXISTS ccp_access"
  - sql: "DROP TABLE IF EXISTS ccp_document"
  - sql: "DROP TABLE IF EXISTS ccp_site"
  - sql: "DROP TABLE IF EXISTS ccp_tenant"
  - sql: "DROP TABLE IF EXISTS ccp_file"
  - sql: "DROP TABLE IF EXISTS cca_access"
  - sql: "DROP TABLE IF EXISTS cca_item"
  - sql: "DROP TABLE IF EXISTS cca_domain"
  - sql: "DROP TABLE IF EXISTS cca_tenant"
  - sql: "DROP TABLE IF EXISTS cca_org"
