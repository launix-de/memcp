  - sql: UPDATE class_purchases SET group_id=0,root=-10,parent=-20,route=9,route_status=9 WHERE tenant=1
  - sql: UPDATE class_purchases SET group_id=0,root=-10,parent=-20,route=7,route_status=7 WHERE tenant=2
