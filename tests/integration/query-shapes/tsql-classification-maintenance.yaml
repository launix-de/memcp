    statements:
    - sql: UPDATE class_sales SET root=i.root,parent=i.parent,group_id=i.group_id FROM class_sales INNER JOIN class_items
        i ON class_sales.tenant=i.tenant AND class_sales.article=i.article WHERE i.tenant=1
    - sql: SELECT tenant,id,group_id,root,parent FROM class_sales ORDER BY tenant,id
      expect:
        rows: 4
        data: *id001
  noncritical: true
- name: A delimiter free configuration batch updates all routing defaults and overrides
  sql: |-
    UPDATE class_locations SET route=0 WHERE tenant=1
    UPDATE class_locations SET route=-1 WHERE tenant=1 AND code='BACK'
    UPDATE class_locations SET route=1 WHERE tenant=1 AND code='SIDE'
    UPDATE class_items SET route=0 WHERE tenant=1
    UPDATE class_items SET route=1 WHERE tenant=1 AND article='A'
    UPDATE class_items SET route=2 WHERE tenant=1 AND article='B'
    UPDATE class_sales SET route=0 WHERE tenant=1
    UPDATE class_sales SET route_status=0 WHERE tenant=1
- name: Configuration distinguishes negative default routing from zero and positive routes
  sql: SELECT tenant,code,route FROM class_locations ORDER BY tenant,code
  expect:
    rows: 4
    data:
    - tenant: 1
      code: BACK
      route: -1
    - tenant: 1
      code: MAIN
      route: 0
    - tenant: 1
      code: SIDE
      route: 1
    - tenant: 2
      code: MAIN
      route: 7
- name: Configuration applies per item overrides without changing the other tenant
  sql: SELECT tenant,article,route FROM class_items ORDER BY tenant,article
  expect:
    rows: 4
    data:
    - tenant: 1
      article: A
      route: 1
    - tenant: 1
      article: B
      route: 2
    - tenant: 1
      article: C
      route: 0
    - tenant: 2
      article: A
      route: 7
- name: Configuration clears both historical line routing fields together
  sql: SELECT tenant,id,route,route_status FROM class_sales ORDER BY tenant,id
  expect:
    rows: 4
    data:
    - tenant: 1
      id: 1
      route: 0
      route_status: 0
    - tenant: 1
      id: 2
      route: 0
      route_status: 0
    - tenant: 1
      id: 3
      route: 0
      route_status: 0
    - tenant: 2
      id: 1
      route: 7
      route_status: 7
