     CASE WHEN ISNULL(h.unit_cost,0)=0 THEN v.unit_cost ELSE h.unit_cost END AS unit_cost,
     CASE WHEN ISNULL(h.unit_cost,0)=0 THEN 'current' ELSE 'history' END AS cost_source
     FROM hist_variants v LEFT JOIN historical_cost h ON v.tenant=h.tenant AND v.article=h.article AND v.variant=0
    )
    SELECT tenant,article,unit_cost FROM historical_cost WHERE tenant=1 AND article='A' ORDER BY unit_cost
  expect:
    rows: 2
    data:
    - tenant: 1
      article: A
      unit_cost: 5
    - tenant: 1
      article: A
      unit_cost: 6
  setup:
  - sql: INSERT hist_costs VALUES(1,'A','2025-01-07',6)
  cleanup:
  - sql: DELETE FROM hist_costs WHERE tenant=1 AND article='A' AND effective='2025-01-07' AND unit_cost=6
- name: Declared fractional valuation weights do not use integer division
  sql: SELECT tenant,id,percentage/100 AS factor FROM hist_weights ORDER BY tenant,id
  expect:
    rows: 3
    data:
    - tenant: 1
      id: 1
      factor: 0.5
    - tenant: 1
      id: 2
      factor: 1
    - tenant: 2
      id: 3
      factor: 0.75
- name: A cost stage cutoff before any history retains current masters and source labels
  sql: |-
    WITH movements AS (
     SELECT tenant,article,source_location AS location,effect*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location=0 AND internal=0
     UNION ALL
     SELECT tenant,article,target_location AS location,effect*quantity AS quantity,booked FROM hist_movements WHERE target_location<>0 AND source_location=0 AND internal=0
     UNION ALL
     SELECT tenant,article,source_location AS location,-1*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location<>0 AND internal=0
     UNION ALL
     SELECT tenant,article,target_location AS location,+1*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location<>0 AND internal=0
    ), last_cost AS (
     SELECT tenant,article,MAX(effective) AS effective FROM hist_costs WHERE effective<=CONVERT(DATETIME,'20241231',112) GROUP BY tenant,article
    ), historical_cost AS (
     SELECT c.tenant,c.article,c.unit_cost FROM hist_costs c INNER JOIN last_cost h ON h.tenant=c.tenant AND h.article=c.article AND h.effective=c.effective
    ), balances AS (
     SELECT tenant,article,location,SUM(quantity) AS stock FROM movements WHERE booked<=CONVERT(DATETIME,'20241231',112) GROUP BY tenant,article,location HAVING SUM(quantity)>0
    ), costs AS (
     SELECT v.tenant,v.article,
     CASE WHEN ISNULL(h.unit_cost,0)=0 THEN v.unit_cost ELSE h.unit_cost END AS unit_cost,
     CASE WHEN ISNULL(h.unit_cost,0)=0 THEN 'current' ELSE 'history' END AS cost_source
     FROM hist_variants v LEFT JOIN historical_cost h ON v.tenant=h.tenant AND v.article=h.article AND v.variant=0
    )
    SELECT tenant,article,unit_cost,cost_source FROM costs WHERE article='A' ORDER BY tenant
  expect:
    rows: 2
    data:
    - tenant: 1
      article: A
      unit_cost: 7
      cost_source: current
    - tenant: 2
      article: A
      unit_cost: 21
      cost_source: current
  noncritical: true
cleanup:
- sql: DROP TABLE IF EXISTS hist_movements
- sql: DROP TABLE IF EXISTS hist_costs
- sql: DROP TABLE IF EXISTS hist_variants
- sql: DROP TABLE IF EXISTS hist_items
- sql: DROP TABLE IF EXISTS hist_locations
- sql: DROP TABLE IF EXISTS hist_weights
