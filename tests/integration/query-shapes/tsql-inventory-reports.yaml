metadata:
  version: '1.0'
  syntax: tsql
  description: Historical inventory and valuation through composed UNION CTE and nullable cost contracts
  isolated: true
  requires_tds: true
setup:
- sql: DROP TABLE IF EXISTS hist_movements
- sql: DROP TABLE IF EXISTS hist_costs
- sql: DROP TABLE IF EXISTS hist_variants
- sql: DROP TABLE IF EXISTS hist_items
- sql: DROP TABLE IF EXISTS hist_locations
- sql: DROP TABLE IF EXISTS hist_weights
- sql: CREATE TABLE hist_movements (tenant SMALLINT, article VARCHAR(20), source_location INT, target_location INT,
    effect SMALLINT, quantity DECIMAL(18,4), booked DATETIME, internal SMALLINT)
- sql: INSERT INTO hist_movements VALUES (1,'A',0,10,1,10,'2025-01-01',0),(1,'A',10,0,-1,2,'2025-01-03',0),(1,'A',10,20,0,3,'2025-01-05',0),(1,'A',20,0,-1,99,'2025-01-06',1),(1,'A',0,10,1,100,'2025-02-01',0),(1,'B',0,10,1,4,'2025-01-01',0),(1,'C',0,10,1,2,'2025-01-01',0),(1,'C',10,0,-1,2,'2025-01-02',0),(1,'D',10,0,-1,5,'2025-01-01',0),(2,'A',0,10,1,7,'2025-01-01',0),(1,'E',0,20,1,1,'2025-01-01',0),(1,'F',0,20,1,2,'2025-01-01',0),(1,'G',0,20,1,1,'2025-01-01',0)
- sql: CREATE TABLE hist_costs (tenant SMALLINT, article VARCHAR(20), effective DATETIME, unit_cost DECIMAL(18,4))
- sql: INSERT INTO hist_costs VALUES (1,'A','2025-01-01',4),(1,'A','2025-01-07',5),(1,'A','2025-02-01',9),(1,'B','2025-01-01',0),(1,'B','2025-02-01',12),(1,'F','2025-01-01',NULL),(2,'A','2025-01-01',20)
- sql: CREATE TABLE hist_variants (tenant SMALLINT, article VARCHAR(20), variant INT, unit_cost DECIMAL(18,4), PRIMARY
    KEY (tenant,article,variant))
- sql: INSERT INTO hist_variants VALUES (1,'A',0,7),(1,'B',0,8),(1,'C',0,3),(1,'D',0,1),(1,'E',0,0),(1,'F',0,6),(2,'A',0,21)
- sql: CREATE TABLE hist_items (tenant SMALLINT, article VARCHAR(20), label NVARCHAR(30), weight_id INT, PRIMARY
    KEY (tenant,article))
- sql: INSERT INTO hist_items VALUES (1,'A',N'Alpha',1),(1,'B',N'Beta',2),(1,'C',N'Closed',2),(1,'D',N'Negative',2),(1,'E',N'Zero',99),(1,'F',N'Fallback',1),(2,'A',N'Other
    tenant',3)
- sql: CREATE TABLE hist_locations (tenant SMALLINT, id INT, label NVARCHAR(20), PRIMARY KEY (tenant,id))
- sql: INSERT INTO hist_locations VALUES (1,10,N'Main'),(1,20,N'Secondary'),(2,10,N'Other')
- sql: CREATE TABLE hist_weights (tenant SMALLINT, id INT, percentage DECIMAL(18,4), PRIMARY KEY (tenant,id))
- sql: INSERT INTO hist_weights VALUES (1,1,50),(1,2,100),(2,3,75)
test_cases:
- name: Historical valuation composes four UNION branches five CTEs and nullable master joins
  sql: |-
    WITH movements AS (
     SELECT tenant,article,source_location AS location,effect*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location=0 AND internal=0
     UNION ALL
     SELECT tenant,article,target_location AS location,effect*quantity AS quantity,booked FROM hist_movements WHERE target_location<>0 AND source_location=0 AND internal=0
     UNION ALL
     SELECT tenant,article,source_location AS location,-1*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location<>0 AND internal=0
     UNION ALL
     SELECT tenant,article,target_location AS location,+1*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location<>0 AND internal=0
    ), last_cost AS (
     SELECT tenant,article,MAX(effective) AS effective FROM hist_costs WHERE effective<=CONVERT(DATETIME,'20250110',112) GROUP BY tenant,article
    ), historical_cost AS (
     SELECT c.tenant,c.article,c.unit_cost FROM hist_costs c INNER JOIN last_cost h ON h.tenant=c.tenant AND h.article=c.article AND h.effective=c.effective
    ), balances AS (
     SELECT tenant,article,location,SUM(quantity) AS stock FROM movements WHERE booked<=CONVERT(DATETIME,'20250110',112) GROUP BY tenant,article,location HAVING SUM(quantity)>0
    ), costs AS (
     SELECT v.tenant,v.article,
     CASE WHEN ISNULL(h.unit_cost,0)=0 THEN v.unit_cost ELSE h.unit_cost END AS unit_cost,
     CASE WHEN ISNULL(h.unit_cost,0)=0 THEN 'current' ELSE 'history' END AS cost_source
     FROM hist_variants v LEFT JOIN historical_cost h ON v.tenant=h.tenant AND v.article=h.article AND v.variant=0
    )
    SELECT b.tenant,b.article,b.location,b.stock,c.unit_cost,c.cost_source,
     b.stock*c.unit_cost AS value,w.percentage,b.stock*c.unit_cost*(w.percentage/100) AS weighted_value
     FROM balances b LEFT JOIN costs c ON c.tenant=b.tenant AND c.article=b.article
     INNER JOIN hist_items i ON i.tenant=b.tenant AND i.article=b.article
     INNER JOIN hist_variants v ON v.tenant=i.tenant AND v.article=i.article AND v.variant=0
     INNER JOIN hist_locations l ON l.tenant=b.tenant AND l.id=b.location
     LEFT JOIN hist_weights w ON i.tenant=w.tenant AND i.weight_id=w.id
     ORDER BY b.tenant,b.article,b.location
  expect:
    rows: 6
    data:
    - tenant: 1
      article: A
      location: 10
      stock: 5
      unit_cost: 5
      cost_source: history
      value: 25
      percentage: 50
      weighted_value: 12.5
    - tenant: 1
      article: A
      location: 20
      stock: 3
      unit_cost: 5
      cost_source: history
      value: 15
      percentage: 50
      weighted_value: 7.5
    - tenant: 1
      article: B
      location: 10
      stock: 4
      unit_cost: 8
      cost_source: current
      value: 32
      percentage: 100
      weighted_value: 32
    - tenant: 1
      article: E
      location: 20
      stock: 1
      unit_cost: 0
      cost_source: current
      value: 0
      percentage: null
      weighted_value: null
    - tenant: 1
      article: F
      location: 20
      stock: 2
      unit_cost: 6
      cost_source: current
      value: 12
      percentage: 50
      weighted_value: 6
    - tenant: 2
      article: A
      location: 10
      stock: 7
      unit_cost: 20
      cost_source: history
      value: 140
      percentage: 75
      weighted_value: 105
  noncritical: true
- name: Transfer UNION legs preserve both signs before location grouping
  sql: |-
    WITH movements AS (
     SELECT tenant,article,source_location AS location,effect*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location=0 AND internal=0
     UNION ALL
     SELECT tenant,article,target_location AS location,effect*quantity AS quantity,booked FROM hist_movements WHERE target_location<>0 AND source_location=0 AND internal=0
     UNION ALL
     SELECT tenant,article,source_location AS location,-1*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location<>0 AND internal=0
     UNION ALL
     SELECT tenant,article,target_location AS location,+1*quantity AS quantity,booked FROM hist_movements WHERE source_location<>0 AND target_location<>0 AND internal=0
    ) SELECT location,SUM(quantity) AS stock FROM movements WHERE tenant=1 AND article='A' AND booked<='2025-01-10' GROUP BY location ORDER BY location
  expect:
    rows: 2
    data:
    - location: 10
      stock: 5
    - location: 20
      stock: 3
  noncritical: true
