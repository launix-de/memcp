  - name: "Prelimit presence predicate retains shared group cache"
    sql: |
      EXPLAIN
      SELECT item.id
      FROM trace_wide_prop item
      WHERE COALESCE((
        SELECT (parent.owner_id = 7 OR EXISTS (
          SELECT TRUE
          FROM trace_wide_assignment member
          WHERE member.team_id = parent.team_id
            AND member.member_id = 7
          LIMIT 1
        ))
        FROM trace_wide_parent parent
        WHERE parent.id = item.parent_id
        LIMIT 1
      ), FALSE) = TRUE
      ORDER BY item.id
      LIMIT 2
    expect:
      rows: 1
      result_contains:
        - "touch_keytable"
        - ".grp:"
  - name: "Presence predicates remain before root limit"
    sql: |
      SELECT item.id
