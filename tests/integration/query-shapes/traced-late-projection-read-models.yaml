test_cases:
  - name: "Unreached CASE aggregate does not initialize its shared carrier column"
    noncritical: true
    fail_comment: "Known master defect: decorrelation currently prepares a scalar aggregate from an unreachable CASE branch eagerly"
    sql: |
      SELECT driver.id,
        (SELECT COUNT(*)
         FROM trace_lazy_source item
         WHERE item.group_id = driver.group_id) AS visible_count,
        CASE WHEN driver.use_extra THEN
          (SELECT SUM((
            SELECT marker.id
            FROM trace_lazy_error marker
            WHERE marker.source_id = item.id
          ))
           FROM trace_lazy_source item
           WHERE item.group_id = driver.group_id)
        ELSE 0 END AS unreachable_value
      FROM trace_lazy_driver driver
      ORDER BY driver.id
    expect:
      rows: 2
      data:
        - {id: 1, visible_count: 2, unreachable_value: 0}
        - {id: 2, visible_count: 1, unreachable_value: 0}

  - name: "Reached CASE aggregate still validates its scalar dependency"
    sql: |
      SELECT CASE WHEN TRUE THEN
        (SELECT SUM((
          SELECT marker.id
          FROM trace_lazy_error marker
          WHERE marker.source_id = item.id
        ))
         FROM trace_lazy_source item
         WHERE item.group_id = 10)
      ELSE 0 END AS reached_value
    expect:
      error: true

  - name: "Unused unique lookup is removed before decorrelation"
    sql: |
      EXPLAIN IR
      SELECT page.id
      FROM trace_page page
      LEFT JOIN trace_lookup unused_lookup ON unused_lookup.id = page.lookup_id
      WHERE page.archived = FALSE
      LIMIT 1
    expect:
      rows: 1
      result_not_contains:
        - "unused_lookup"

  - name: "Referenced unique lookup remains visible"
    sql: |
      SELECT page.id, used_lookup.label
      FROM trace_page page
      LEFT JOIN trace_lookup used_lookup ON used_lookup.id = page.lookup_id
      WHERE page.archived = FALSE
      ORDER BY page.id
    expect:
      rows: 2
      data:
        - {id: 1, label: "first"}
        - {id: 2, label: "second"}

  - name: "A later join keeps the unique lookup that supplies its condition"
    sql: |
      SELECT page.id, chained_actor.enabled
      FROM trace_page page
      LEFT JOIN trace_lookup required_lookup ON required_lookup.id = page.lookup_id
      LEFT JOIN trace_actor chained_actor ON chained_actor.id = required_lookup.id
      WHERE page.archived = FALSE
      ORDER BY page.id
    expect:
      rows: 2
      data:
        - {id: 1, enabled: true}
        - {id: 2, enabled: false}

  - name: "Unused nonunique lookup preserves row multiplicity"
    sql: |
      SELECT page.id
      FROM trace_page page
      LEFT JOIN trace_lookup_many repeated_lookup ON repeated_lookup.lookup_id = page.lookup_id
      WHERE page.id = 1
      ORDER BY repeated_lookup.id
    expect:
      rows: 2
      data:
        - {id: 1}
        - {id: 1}

  - name: "Unordered bounded lookup uses late projection braking"
    sql: |
      EXPLAIN
      SELECT page.id, used_lookup.label
      FROM trace_page page
      LEFT JOIN trace_lookup used_lookup ON used_lookup.id = page.lookup_id
      WHERE page.archived = FALSE
      LIMIT 1
    expect:
      rows: 1
      result_contains:
        - "scan_order"
        - "trace_lookup"
      result_not_contains:
        - "join-order:"
        - "collect_rows"

  - name: "Unordered bounded group lookup initializes lazily"
    sql: |
      SELECT page.id, grouped_count.item_count
      FROM trace_page page
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) grouped_count ON grouped_count.lookup_id = page.lookup_id
      WHERE page.archived = FALSE
      LIMIT 1
    expect:
      rows: 1
      data:
        - {id: 1, item_count: 2}

  - name: "One canonical carrier emits one combined initializer"
    sql: |
      EXPLAIN
      SELECT page.id, grouped_count.item_count, grouped_sum.total_amount
      FROM trace_page page
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) grouped_count ON grouped_count.lookup_id = page.lookup_id
      LEFT JOIN (
        SELECT lookup_id, SUM(amount) AS total_amount
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) grouped_sum ON grouped_sum.lookup_id = page.lookup_id
      LIMIT 1
    expect:
      rows: 1
      result_occurrences:
        - text: "createtable"
          count: 1
        - text: "touch_keytable"
          count: 1
      result_contains:
        - "item_count"
        - "total_amount"

  - name: "Nested scalar lookups share one canonical initializer"
    sql: |
      EXPLAIN
      SELECT page.id,
        COALESCE((
          SELECT actor.id = 10
          FROM trace_actor actor
          WHERE actor.id = page.lookup_id
          LIMIT 1
        ), FALSE) AS direct_access,
        COALESCE((
          SELECT COALESCE((
            SELECT nested_actor.id = 10
            FROM trace_actor nested_actor
            WHERE nested_actor.id = item.lookup_id
            LIMIT 1
          ), FALSE)
          FROM trace_lookup_many item
          WHERE item.id = page.id
          LIMIT 1
        ), FALSE) AS nested_access
      FROM trace_page page
      WHERE page.id = 1
    expect:
      rows: 1
      result_occurrences:
        - text: "createtable"
          count: 1
        - text: "touch_keytable"
          count: 1
      result_contains:
        - "direct_access"
        - "nested_access"

  - name: "Collected nested scalar lookups preserve results"
    sql: |
      SELECT page.id,
        COALESCE((
          SELECT actor.id = 10
          FROM trace_actor actor
          WHERE actor.id = page.lookup_id
          LIMIT 1
        ), FALSE) AS direct_access,
        COALESCE((
          SELECT COALESCE((
            SELECT nested_actor.id = 10
            FROM trace_actor nested_actor
            WHERE nested_actor.id = item.lookup_id
            LIMIT 1
          ), FALSE)
          FROM trace_lookup_many item
          WHERE item.id = page.id
          LIMIT 1
        ), FALSE) AS nested_access
      FROM trace_page page
      WHERE page.id = 1
    expect:
      rows: 1
      data:
        - {id: 1, direct_access: true, nested_access: true}

  - name: "Collected nested scalar lookups preserve false results"
    sql: |
      SELECT page.id,
        COALESCE((
          SELECT actor.id = 10
          FROM trace_actor actor
          WHERE actor.id = page.lookup_id
          LIMIT 1
        ), FALSE) AS direct_access,
        COALESCE((
          SELECT COALESCE((
            SELECT nested_actor.id = 10
            FROM trace_actor nested_actor
            WHERE nested_actor.id = item.lookup_id
            LIMIT 1
          ), FALSE)
          FROM trace_lookup_many item
          WHERE item.id = page.id
          LIMIT 1
        ), FALSE) AS nested_access
      FROM trace_page page
      WHERE page.id = 3
    expect:
      rows: 1
      data:
        - {id: 3, direct_access: true, nested_access: false}

  - name: "Equivalent grouped lookup stages are interned once"
    sql: |
      EXPLAIN IR
      SELECT page.id,
        first_count.item_count AS count_a,
        second_count.item_count AS count_b,
        third_count.item_count AS count_c
      FROM trace_page page
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) first_count ON first_count.lookup_id = page.lookup_id
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) second_count ON second_count.lookup_id = page.lookup_id
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) third_count ON third_count.lookup_id = page.lookup_id
      LIMIT 1
    expect:
      rows: 1
      result_occurrences:
        - text: "group-stage"
          count: 2

  - name: "Combined carrier columns preserve aggregate results"
    sql: |
      SELECT page.id, grouped_count.item_count, grouped_sum.total_amount
      FROM trace_page page
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) grouped_count ON grouped_count.lookup_id = page.lookup_id
      LEFT JOIN (
        SELECT lookup_id, SUM(amount) AS total_amount
        FROM trace_lookup_many
        GROUP BY lookup_id
      ) grouped_sum ON grouped_sum.lookup_id = page.lookup_id
      WHERE page.id = 1
    expect:
      rows: 1
      data:
        - {id: 1, item_count: 2, total_amount: 8}

  - name: "Different grouped filters keep separate stages"
    sql: |
      SELECT page.id, above_four.item_count, above_ten.total_amount
      FROM trace_page page
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_lookup_many
        WHERE amount > 4
        GROUP BY lookup_id
      ) above_four ON above_four.lookup_id = page.lookup_id
      LEFT JOIN (
        SELECT lookup_id, SUM(amount) AS total_amount
        FROM trace_lookup_many
        WHERE amount > 10
        GROUP BY lookup_id
      ) above_ten ON above_ten.lookup_id = page.lookup_id
      WHERE page.id = 1
    expect:
      rows: 1
      data:
        - {id: 1, item_count: 1, total_amount: null}

  - name: "Case-sensitive grouped filters keep distinct canonical carriers"
    sql: |
      SELECT page.id, exact_upper.item_count AS upper_count, exact_lower.item_count AS lower_count
      FROM trace_page page
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_case_item
        WHERE tag COLLATE utf8mb4_bin = 'Upper'
        GROUP BY lookup_id
      ) exact_upper ON exact_upper.lookup_id = page.lookup_id
      LEFT JOIN (
        SELECT lookup_id, COUNT(*) AS item_count
        FROM trace_case_item
        WHERE tag COLLATE utf8mb4_bin = 'upper'
        GROUP BY lookup_id
      ) exact_lower ON exact_lower.lookup_id = page.lookup_id
      WHERE page.id = 1
    expect:
      rows: 1
      data:
        - {id: 1, upper_count: 2, lower_count: 1}

  - name: "Case-sensitive base selection keeps literal case distinct"
    sql: |
      SELECT id
      FROM trace_case_item
      WHERE tag COLLATE utf8mb4_bin = 'Upper'
      ORDER BY id
    expect:
      rows: 2
      data:
        - {id: 1}
        - {id: 2}

  - name: "Derived doc list applies outer ID filter before expensive projection"
    max_time: 2.2
    max_plan_size: 60000
    sql: |
      SELECT t.*
      FROM (
        SELECT
          CASE
            WHEN (
              (((SELECT default_type FROM trace_config WHERE id = 1 LIMIT 1) IS NULL) AND d.type IS NULL)
              OR d.type = (SELECT default_type FROM trace_config WHERE id = 1 LIMIT 1)
            )
            THEN '#hit'
            ELSE NULL
          END AS color,
          d.id AS id,
          d.archived AS archived,
          (SELECT r.file_id FROM trace_revision r WHERE r.doc_id = d.id ORDER BY r.created DESC, r.id DESC LIMIT 1) AS file_id,
          (SELECT f.filename FROM trace_file f WHERE f.id = (
            SELECT r.file_id FROM trace_revision r WHERE r.doc_id = d.id ORDER BY r.created DESC, r.id DESC LIMIT 1
          ) LIMIT 1) AS filename,
          (SELECT MIN(r.created) FROM trace_revision r WHERE r.doc_id = d.id LIMIT 1) AS first_seen,
          (SELECT MAX(r.created) FROM trace_revision r WHERE r.doc_id = d.id LIMIT 1) AS last_seen,
          EXISTS (
            SELECT TRUE
            FROM trace_revision r
            WHERE r.doc_id = d.id
              AND (SELECT f.mime FROM trace_file f WHERE f.id = r.file_id LIMIT 1) = 'application/pdf'
            LIMIT 1
          ) AS has_pdf
        FROM trace_doc d
      ) t
      WHERE t.id IN (1)
        AND (t.archived IS NULL OR t.archived IN (FALSE))
      LIMIT 72
    expect:
      rows: 1
      data:
        - color: "#hit"
          id: 1
          archived: false
          file_id: 1
          filename: "one.txt"
          first_seen: 1
          last_seen: 1
          has_pdf: false
  - name: "Late projection recipe preserves columns from every join source"
    max_time: 2.0
    max_plan_size: 30000
    sql: |
      SELECT q.*
      FROM (
        SELECT d.id, d.type, r.created, f.filename
        FROM trace_doc d
        LEFT JOIN trace_revision r ON r.doc_id = d.id
        LEFT JOIN trace_file f ON f.id = r.file_id
      ) q
      WHERE q.id IN (
        SELECT id FROM trace_doc WHERE id = 1
        UNION
        SELECT doc_id FROM trace_revision WHERE file_id = 999
      )
      ORDER BY q.id
      LIMIT 1
    expect:
      rows: 1
      data:
        - id: 1
          type: 10
          created: 1
          filename: "one.txt"
  - name: "EXPLAIN uses one ordered scan for repeated scalar latest projections"
    sql: |
      EXPLAIN
      SELECT
        p.id,
        COALESCE((SELECT m.value_a FROM trace_metric m WHERE m.profile_id = p.id AND m.valid_from <= 4096 ORDER BY m.valid_from DESC LIMIT 1), 0) AS value_a,
        COALESCE((SELECT m.value_b FROM trace_metric m WHERE m.profile_id = p.id AND m.valid_from <= 4096 ORDER BY m.valid_from DESC LIMIT 1), 0) AS value_b,
        COALESCE((SELECT m.value_c FROM trace_metric m WHERE m.profile_id = p.id AND m.valid_from <= 4096 ORDER BY m.valid_from DESC LIMIT 1), 0) AS value_c,
        COALESCE((SELECT m.value_d FROM trace_metric m WHERE m.profile_id = p.id AND m.valid_from <= 4096 ORDER BY m.valid_from DESC LIMIT 1), 0) AS value_d,
        COALESCE((SELECT m.value_e FROM trace_metric m WHERE m.profile_id = p.id AND m.valid_from <= 4096 ORDER BY m.valid_from DESC LIMIT 1), 0) AS value_e,
