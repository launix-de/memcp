metadata:
  version: '1.0'
  syntax: tsql
  description: Application-shaped tenant joins, document lists and clock-bounded aggregates
  isolated: true
setup:
- sql: DROP TABLE IF EXISTS tsql_app_Controls
- sql: DROP TABLE IF EXISTS tsql_app_Projects
- sql: DROP TABLE IF EXISTS tsql_app_Accounts
- sql: DROP TABLE IF EXISTS tsql_app_Documents
- sql: DROP TABLE IF EXISTS tsql_app_Processes
- sql: DROP TABLE IF EXISTS tsql_app_Groups
- sql: DROP TABLE IF EXISTS tsql_app_DocumentKinds
- sql: DROP TABLE IF EXISTS tsql_app_TaxKinds
- sql: DROP TABLE IF EXISTS tsql_app_Periods
- sql: DROP TABLE IF EXISTS tsql_app_CustomerStats
- sql: DROP TABLE IF EXISTS tsql_app_Addresses
- sql: CREATE TABLE tsql_app_Controls (Tenant INT, Project INT, Matchcode NVARCHAR(30), Leader NVARCHAR(30), Contact
    NVARCHAR(30), Phone NVARCHAR(30), EMail NVARCHAR(60), ControlId INT)
- sql: CREATE TABLE tsql_app_Projects (Tenant INT, ProjectNumber INT, ProjectBegin DATETIME, Customer VARCHAR(20),
    Budget DECIMAL(18,4), Matchcode NVARCHAR(30), ProjectEnd DATETIME, Status INT, ProjectGroup INT)
- sql: CREATE TABLE tsql_app_Accounts (Tenant INT, Account VARCHAR(20), AccountType CHAR(1), Matchcode NVARCHAR(30),
    AddressId INT, GroupCode INT, Tour INT)
- sql: |-
    INSERT INTO tsql_app_Controls VALUES (123,10,N'Control A',N'Leader',N'Contact',N'123',N'test@example.invalid',1),
      (123,10,N'Control B',N'Leader',N'Contact',N'123',N'test@example.invalid',2),
      (999,10,N'Other tenant',N'X',N'X',N'X',N'x@example.invalid',3)
- sql: |-
    INSERT INTO tsql_app_Projects VALUES (123,10,'2025-01-02','D1',2000.1234,N'Project','2026-01-02',1,2),
      (999,10,'2025-01-02','D1',9999,N'Other tenant','2026-01-02',1,2)
- sql: INSERT INTO tsql_app_Accounts VALUES (123,'D1','D',N'Customer',1,3,4),(999,'D1','D',N'Other tenant',1,3,4)
- sql: CREATE TABLE tsql_app_Documents (Tenant INT, ContactId INT, Recipient VARCHAR(20), RecipientMatchcode NVARCHAR(30),
    OtherContactId INT, DocumentKind NVARCHAR(20), DocumentDate DATETIME, DocumentYear INT, DocumentCode VARCHAR(3),
    DocumentNumber INT, DocumentId INT, NetAmount DECIMAL(18,4), InvoiceContactId INT, ProcessId INT, SaveStatus
    INT, Status INT, Journal INT, Tax INT, Period INT)
- sql: CREATE TABLE tsql_app_Processes (Tenant INT, ProcessId INT, Fulfilled INT)
- sql: CREATE TABLE tsql_app_Groups (Tenant INT, Kind INT, GroupInt INT, GroupCode VARCHAR(20), Label NVARCHAR(30))
- sql: CREATE TABLE tsql_app_DocumentKinds (Code VARCHAR(3))
- sql: CREATE TABLE tsql_app_TaxKinds (Id INT)
- sql: CREATE TABLE tsql_app_Periods (Tenant INT, TotalPeriod INT)
