test_cases:
- name: Composite tenant project joins with optional filter mask 0000
  sql: |-
    SELECT tsql_app_Controls.Matchcode AS ProjectControl,
      tsql_app_Controls.Project,
      tsql_app_Projects.ProjectBegin,
      tsql_app_Controls.Leader,
      tsql_app_Controls.Contact,
      tsql_app_Projects.Customer,
      tsql_app_Projects.Budget,
      tsql_app_Controls.Phone,
      tsql_app_Controls.EMail,
      tsql_app_Projects.Matchcode AS ProjectMatchcode,
      tsql_app_Accounts.Matchcode AS CustomerMatchcode,
      tsql_app_Projects.ProjectEnd,
      tsql_app_Controls.ControlId
    FROM tsql_app_Controls
    INNER JOIN tsql_app_Projects ON (tsql_app_Controls.Project = tsql_app_Projects.ProjectNumber AND tsql_app_Controls.Tenant = tsql_app_Projects.Tenant)
    INNER JOIN tsql_app_Accounts ON (tsql_app_Projects.Customer = tsql_app_Accounts.Account AND tsql_app_Projects.Tenant = tsql_app_Accounts.Tenant)
    WHERE tsql_app_Controls.Tenant=123 AND tsql_app_Accounts.AccountType='D'
    ORDER BY tsql_app_Controls.Project, ControlId
  expect:
    rows: 6
    data:
    - ControlId: 1
      ProjectMatchcode: Project
      CustomerMatchcode: Customer
      Budget: 2000.1234
    - ControlId: 2
      ProjectMatchcode: Project
      CustomerMatchcode: Customer
      Budget: 2000.1234
    - ControlId: 3
      ProjectMatchcode: Project
      CustomerMatchcode: Customer
      Budget: 2000.1234
    - ControlId: 4
      ProjectMatchcode: Project
      CustomerMatchcode: Customer
      Budget: 2000.1234
    - ControlId: 5
      ProjectMatchcode: Project
      CustomerMatchcode: Customer
      Budget: 2000.1234
    - ControlId: 6
      ProjectMatchcode: Project
      CustomerMatchcode: Customer
      Budget: 2000.1234
