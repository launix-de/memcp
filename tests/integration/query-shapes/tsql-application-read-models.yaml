- name: Document list combines top case null filtering casts and six joins
  sql: |-
    SELECT TOP 301 tsql_app_Documents.ContactId AS ContactId,
      tsql_app_Documents.Recipient AS Recipient,
      tsql_app_Documents.RecipientMatchcode AS RecipientMatchcode,
      tsql_app_Documents.OtherContactId AS OtherContactId,
      tsql_app_Documents.DocumentKind AS DocumentKind,
      tsql_app_Documents.DocumentDate AS DocumentDate,
      tsql_app_Documents.DocumentYear AS DocumentYear,
      tsql_app_Documents.DocumentCode AS DocumentCode,
      tsql_app_Documents.DocumentNumber AS DocumentNumber,
      tsql_app_Documents.DocumentId AS DocumentId, CASE WHEN ISNULL(2002,0) > 0 THEN 'EUR' ELSE 'DEM' END AS Currency, ISNULL(Process.Fulfilled,-2) AS Fulfilled,
      tsql_app_Documents.NetAmount AS NetAmount,
      tsql_app_Documents.InvoiceContactId AS InvoiceContactId, Convert(Varchar,DocumentYear) + '-' + Convert(Varchar,DocumentNumber) AS Separator,
      tsql_app_Documents.ProcessId AS Process,
      tsql_app_Documents.ProcessId AS ProcessId, CASE WHEN ISNULL(SaveStatus,0) = 1 THEN 0 ELSE -1 END  AS SaveStatusMenu, 4000 AS EntryKind,
      tsql_app_TaxKinds.Id AS OptionalTaxId
    FROM tsql_app_Documents
    LEFT JOIN tsql_app_Processes AS Process ON tsql_app_Documents.Tenant = Process.Tenant AND tsql_app_Documents.ProcessId = Process.ProcessId
    INNER JOIN tsql_app_Groups OfferStatus ON OfferStatus.GroupInt = tsql_app_Documents.Status AND OfferStatus.Tenant=0 AND OfferStatus.Kind=40050
    INNER JOIN tsql_app_DocumentKinds ON tsql_app_DocumentKinds.Code = tsql_app_Documents.DocumentCode
    INNER JOIN tsql_app_Groups AccountingGroup ON AccountingGroup.GroupCode = CONVERT(varchar,tsql_app_Documents.Journal ) AND AccountingGroup.Tenant=0 AND AccountingGroup.Kind=10000
    LEFT JOIN tsql_app_TaxKinds ON tsql_app_TaxKinds.Id = tsql_app_Documents.Tax
    INNER JOIN tsql_app_Periods ON tsql_app_Periods.Tenant=tsql_app_Documents.Tenant AND tsql_app_Periods.TotalPeriod=tsql_app_documents.Period
    WHERE tsql_app_Documents.Tenant=1
    AND ISNULL(ISNULL(Process.Fulfilled,-2), 0) IN (0) AND ISNULL(tsql_app_Documents.Recipient, '') = 'C100'
    ORDER BY DocumentYear ASC,DocumentNumber ASC,DocumentId ASC
  expect:
    rows: 2
    data:
    - DocumentId: 1
      Separator: 2024-5
      SaveStatusMenu: -1
      Currency: EUR
      NetAmount: 123.4567
      OptionalTaxId: null
      Fulfilled: 0
      RecipientMatchcode: ÄÖÜ
    - DocumentId: 2
      Separator: 2025-8
      SaveStatusMenu: 0
      Currency: EUR
      NetAmount: 123.4567
      OptionalTaxId: null
      Fulfilled: 0
      RecipientMatchcode: ÄÖÜ
- name: Customer aggregate uses inclusive clock boundary and tenant keys before having
  sql: |-
    Select Customer, sum(Revenue) as Revenue,
      tsql_app_Addresses.Name,
      tsql_app_Addresses.EMail
    from tsql_app_CustomerStats
    inner join tsql_app_Accounts on tsql_app_Accounts.Tenant = tsql_app_CustomerStats.Tenant and tsql_app_Accounts.Account = tsql_app_CustomerStats.Customer
    inner join tsql_app_Addresses on tsql_app_Addresses.Tenant = tsql_app_Accounts.Tenant and tsql_app_Addresses.AddressId = tsql_app_Accounts.AddressId
    Where Period >= (year(getdate())-2) * 1000 + month(getdate())
    Group By tsql_app_CustomerStats.Customer,
      tsql_app_Addresses.Name,
      tsql_app_Addresses.EMail
    Having sum(Revenue) >= 1234
  expect:
    rows: 1
    data:
    - Customer: C2
      Revenue: 1500
      Name: Müller
      EMail: a@example.invalid
