test_cases:
- name: Document list retains the traced TOP projection joins and defaulted state filter
  sql: |-
    SELECT TOP 301 d.id,d.year,d.number,
     CASE WHEN ISNULL(2002,0)>0 THEN 'EUR' ELSE 'DEM' END AS currency,
     ISNULL(f.fulfilled,-2) AS fulfilled,d.net,
     CONVERT(VARCHAR,d.year) + '-' + CONVERT(VARCHAR,d.number) AS separator,
     d.flow_id AS flow,d.flow_id AS flow_id,
     CASE WHEN ISNULL(d.save_status,0)=1 THEN 0 ELSE -1 END AS menu_enabled,
     tax.rate AS tax_rate,4000 AS entry_kind
    FROM day_docs d
    LEFT JOIN day_flows f ON d.tenant=f.tenant AND d.flow_id=f.id
    INNER JOIN day_groups status_group ON status_group.number=d.status AND status_group.tenant=0 AND status_group.category=10
    INNER JOIN day_kinds kind ON kind.code=d.kind
    INNER JOIN day_groups journal_group ON journal_group.code=CONVERT(VARCHAR,d.journal) AND journal_group.tenant=0 AND journal_group.category=20
    LEFT JOIN day_taxes tax ON tax.id=d.tax
    INNER JOIN day_periods period ON period.tenant=d.tenant AND period.id=d.period
    WHERE d.tenant=1 AND ISNULL(d.account,'')='C1' AND ISNULL(ISNULL(f.fulfilled,-2),0) IN (0) ORDER BY d.year,d.number,d.id
  expect:
    rows: 4
    data:
    - id: 10
      year: 2025
      number: 110
      currency: EUR
      fulfilled: 0
      net: 100
      separator: 2025-110
      flow: 1
      flow_id: 1
      menu_enabled: -1
      tax_rate: 20
      entry_kind: 4000
    - id: 11
      year: 2025
      number: 111
      currency: EUR
      fulfilled: 0
      net: 20
      separator: 2025-111
      flow: 1
      flow_id: 1
      menu_enabled: 0
      tax_rate: null
      entry_kind: 4000
    - id: 15
      year: 2025
      number: 115
      currency: EUR
      fulfilled: 0
      net: 80
      separator: 2025-115
      flow: 1
      flow_id: 1
      menu_enabled: -1
      tax_rate: 20
      entry_kind: 4000
    - id: 16
      year: 2025
      number: 116
      currency: EUR
      fulfilled: 0
      net: 10
      separator: 2025-116
      flow: 1
      flow_id: 1
      menu_enabled: -1
      tax_rate: 20
      entry_kind: 4000
