- name: Delivery frequency composes an aggregate derived join and aggregate sort expression
  sql: |-
    SELECT d.tenant,l.article,COUNT(d.id) AS order_lines,
     SUM(ISNULL(deliveries.delivery_count,0)) AS deliveries
    FROM day_docs d INNER JOIN day_lines l ON d.tenant=l.tenant AND d.id=l.doc_id
    INNER JOIN day_kinds kind ON kind.code=d.kind
    INNER JOIN (
     SELECT dl.flow_line,dl.tenant,SUM(dl.quantity*dk.effect) AS delivered,COUNT(dd.number) AS delivery_count
     FROM day_docs dd INNER JOIN day_lines dl ON dd.tenant=dl.tenant AND dd.id=dl.doc_id
     INNER JOIN day_kinds dk ON dk.code=dd.kind WHERE dk.effect=1
     GROUP BY dl.flow_line,dl.tenant
    ) deliveries ON deliveries.tenant=l.tenant AND deliveries.flow_line=l.flow_line
    WHERE l.article IS NOT NULL AND kind.ordered=1
    GROUP BY d.tenant,l.article
    ORDER BY COUNT(d.id)-SUM(ISNULL(deliveries.delivery_count,0)),d.tenant,l.article
  expect:
    rows: 1
    data:
    - tenant: 1
      article: A
      order_lines: 2
      deliveries: 3
- name: A left frequency join retains order lines with no shipment history
  sql: |-
    SELECT d.tenant,l.article,COUNT(d.id) AS order_lines,
     SUM(ISNULL(deliveries.delivery_count,0)) AS deliveries
    FROM day_docs d INNER JOIN day_lines l ON d.tenant=l.tenant AND d.id=l.doc_id
    INNER JOIN day_kinds kind ON kind.code=d.kind
    LEFT JOIN (
     SELECT dl.flow_line,dl.tenant,SUM(dl.quantity*dk.effect) AS delivered,COUNT(dd.number) AS delivery_count
     FROM day_docs dd INNER JOIN day_lines dl ON dd.tenant=dl.tenant AND dd.id=dl.doc_id
     INNER JOIN day_kinds dk ON dk.code=dd.kind WHERE dk.effect=1
     GROUP BY dl.flow_line,dl.tenant
    ) deliveries ON deliveries.tenant=l.tenant AND deliveries.flow_line=l.flow_line
    WHERE l.article IS NOT NULL AND kind.ordered=1
    GROUP BY d.tenant,l.article
    ORDER BY COUNT(d.id)-SUM(ISNULL(deliveries.delivery_count,0)),d.tenant,l.article
  expect:
