# Derived table containing correlated scalar subselects with ORDER BY LIMIT.
# Pattern: SELECT t.* FROM (SELECT m.*, COALESCE((SELECT h.col
#   FROM hist h WHERE h.parent = m.ID ORDER BY h.ts DESC LIMIT 1), 0)
#   AS dynamic_val FROM main m LEFT JOIN ...) t
#
# The planner should keep inner ORDER BY/LIMIT as a pass-through stage
# when flattening is otherwise safe, instead of materializing the wrapper.

metadata:
  version: "1.0"
  description: "Derived table with ORDER BY LIMIT scalar subselects"

setup:
  - sql: "DROP TABLE IF EXISTS dtl_main"
  - sql: "DROP TABLE IF EXISTS dtl_hist"
  - sql: "DROP TABLE IF EXISTS dtl_ref"
  - sql: "DROP TABLE IF EXISTS dtl_join_main"
  - sql: "DROP TABLE IF EXISTS dtl_join_ref"
  - sql: "DROP TABLE IF EXISTS dtl_join_acl"
  - sql: "DROP TABLE IF EXISTS dtl_access_link"
  - sql: "DROP TABLE IF EXISTS dtl_access_tenant"
  - sql: "DROP TABLE IF EXISTS dtl_access_location"
  - sql: "CREATE TABLE dtl_main (ID INT PRIMARY KEY, name TEXT, category INT)"
  - sql: "CREATE TABLE dtl_hist (ID INT PRIMARY KEY, parent INT, val INT, ts INT)"
  - sql: "CREATE TABLE dtl_ref (ID INT PRIMARY KEY, label TEXT)"
  - sql: "INSERT INTO dtl_main VALUES (1, 'Alice', 10), (2, 'Bob', 20)"
  - sql: "INSERT INTO dtl_hist VALUES (1, 1, 100, 1000), (2, 1, 200, 2000), (3, 2, 300, 3000)"
  - sql: "INSERT INTO dtl_ref VALUES (10, 'Cat A'), (20, 'Cat B')"
  - sql: "CREATE TABLE dtl_join_main (ID INT PRIMARY KEY, first_ref INT, second_ref INT)"
  - sql: "CREATE TABLE dtl_join_ref (ID INT PRIMARY KEY, label TEXT)"
  - sql: "CREATE TABLE dtl_join_acl (ID INT PRIMARY KEY, ref_id INT, allowed BOOL)"
  - sql: "INSERT INTO dtl_join_main VALUES (1, 10, 20), (2, 20, 30), (3, 99, 10)"
  - sql: "INSERT INTO dtl_join_ref VALUES (10, 'ten'), (20, 'twenty'), (30, 'thirty'), (40, 'forty')"
  - sql: "INSERT INTO dtl_join_acl VALUES (1, 10, TRUE), (2, 20, FALSE), (3, 40, TRUE)"
  - sql: "CREATE TABLE dtl_access_link (ID INT PRIMARY KEY, account_id INT, tenant_id INT, location_id INT)"
  - sql: "CREATE TABLE dtl_access_tenant (ID INT PRIMARY KEY, name TEXT)"
  - sql: "CREATE TABLE dtl_access_location (ID INT PRIMARY KEY, name TEXT, tenant_id INT)"
  - sql: "INSERT INTO dtl_access_tenant VALUES (100, 'tenant-a'), (200, 'tenant-b')"
  - sql: "INSERT INTO dtl_access_location VALUES (1000, 'location-a', 100), (2000, 'location-b', 200)"
  - sql: "INSERT INTO dtl_access_link VALUES (1, 11, 100, 1000), (2, 11, 200, 2000), (3, 12, 100, 1000), (4, 11, NULL, NULL)"

test_cases:

  - name: "scalar subselect with ORDER BY LIMIT (baseline)"
    sql: |
      SELECT m.ID,
        COALESCE((SELECT h.val FROM dtl_hist h
          WHERE h.parent = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS latest
      FROM dtl_main m ORDER BY m.ID
    expect:
      rows: 2
      data:
        - ID: 1
          latest: 200
        - ID: 2
          latest: 300

  - name: "wrapped in SELECT t.* FROM (...) t"
    sql: |
      SELECT t.* FROM (
        SELECT m.ID AS ID, m.name AS name,
          COALESCE((SELECT h.val FROM dtl_hist h
            WHERE h.parent = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS latest
        FROM dtl_main m
      ) t ORDER BY t.ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "Alice"
          latest: 200
        - ID: 2
          name: "Bob"
          latest: 300

  - name: "with LEFT JOIN and multiple scalar subselects"
    sql: |
      SELECT t.* FROM (
        SELECT m.ID AS ID, m.name AS name,
          r.label AS cat_label,
          COALESCE((SELECT h.val FROM dtl_hist h
            WHERE h.parent = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS latest_val,
          COALESCE((SELECT h.ts FROM dtl_hist h
            WHERE h.parent = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS latest_ts
        FROM dtl_main m
        LEFT JOIN dtl_ref r ON r.ID = m.category
      ) t ORDER BY t.ID
    expect:
      rows: 2
      data:
        - ID: 1
          name: "Alice"
          cat_label: "Cat A"
          latest_val: 200
          latest_ts: 2000
        - ID: 2
          name: "Bob"
          cat_label: "Cat B"
          latest_val: 300
          latest_ts: 3000

  - name: "outer ORDER BY lowers correlated scalar probe"
    sql: |
      SELECT t.ID
      FROM (
        SELECT m.ID AS ID, m.category AS category
        FROM dtl_main m
      ) t
      ORDER BY (
        SELECT r.ID FROM dtl_ref r
        WHERE r.ID = t.category LIMIT 1
      ) DESC, t.ID ASC
      LIMIT 72 OFFSET 0
    expect:
      rows: 2
      data:
        - ID: 2
        - ID: 1

  - name: "cached outer ORDER BY keeps scalar probe lowered"
    sql: |
      SELECT t.ID
      FROM (
        SELECT m.ID AS ID, m.category AS category
        FROM dtl_main m
      ) t
      ORDER BY (
        SELECT r.ID FROM dtl_ref r
        WHERE r.ID = t.category LIMIT 1
      ) DESC, t.ID ASC
      LIMIT 72 OFFSET 0
    expect:
      rows: 2
      data:
        - ID: 2
        - ID: 1

  - name: "physical outer ORDER BY contains no scalar probe IR"
    sql: |
      EXPLAIN
      SELECT t.ID
      FROM (
        SELECT m.ID AS ID, m.category AS category
        FROM dtl_main m
      ) t
      ORDER BY (
        SELECT r.ID FROM dtl_ref r
        WHERE r.ID = t.category LIMIT 1
      ) DESC, t.ID ASC
      LIMIT 72 OFFSET 0
    expect:
      contains:
        - "scan_order"
      not_contains:
        - "scalar_first_probe"

  - name: "COUNT over derived table with scalar subselects"
    sql: |
      SELECT COUNT(*) AS cnt, SUM(t.latest_val) AS total FROM (
        SELECT m.ID AS ID,
          COALESCE((SELECT h.val FROM dtl_hist h
            WHERE h.parent = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS latest_val
        FROM dtl_main m
        LEFT JOIN dtl_ref r ON r.ID = m.category
      ) t
    expect:
      rows: 1
      data:
        - cnt: 2
          total: 500

  - name: "EXPLAIN IR keeps derived ORDER BY LIMIT as flattened stage"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      EXPLAIN IR
      SELECT t.ID, t.latest_val FROM (
        SELECT m.ID AS ID,
          COALESCE((SELECT h.val FROM dtl_hist h
            WHERE h.parent = m.ID ORDER BY h.ts DESC LIMIT 1), 0) AS latest_val
        FROM dtl_main m
        ORDER BY m.ID DESC LIMIT 1
      ) t
    expect:
      contains:
        - '"kind": "tables", "value": "((\"t\u0000m\" \"memcp-tests\" \"dtl_main\" false nil))"'
        - '"kind": "groups"'
        - 'limit) 1'
        - 'desc'
        - 'latest_val'
      not_contains:
        - "inner_select"
        - "dependent-subquery"
        - '__mat:'

  - name: "Flattened LEFT JOIN cascade keeps every ON predicate"
    sql: |
      SELECT t.ID, t.first_label, t.second_label
      FROM (
        SELECT m.ID, m.first_ref,
          first_lookup.label AS first_label,
          second_lookup.label AS second_label
        FROM dtl_join_main m
        LEFT JOIN (
          SELECT ID, label FROM dtl_join_ref
        ) first_lookup ON first_lookup.ID = m.first_ref
        LEFT JOIN (
          SELECT ID, label FROM dtl_join_ref
        ) second_lookup ON second_lookup.ID = m.second_ref
      ) t
      ORDER BY t.ID
    expect:
      rows: 3
      data:
        - ID: 1
          first_label: "ten"
          second_label: "twenty"
        - ID: 2
          first_label: "twenty"
          second_label: "thirty"
        - ID: 3
          first_label: null
          second_label: "ten"

  - name: "Outer sorter JOIN keeps its ON predicate after flattened cascade"
    sql: |
      SELECT t.ID, t.first_label, sorter.label AS sorted_label
      FROM (
        SELECT m.ID, m.first_ref,
          first_lookup.label AS first_label
        FROM dtl_join_main m
        LEFT JOIN (
          SELECT ID, label FROM dtl_join_ref
        ) first_lookup ON first_lookup.ID = m.first_ref
      ) t
      LEFT JOIN dtl_join_ref sorter ON sorter.ID = t.first_ref
      ORDER BY sorter.label, t.ID
      LIMIT 72 OFFSET 0
    expect:
      rows: 3
      data:
        - ID: 3
          first_label: null
          sorted_label: null
        - ID: 1
          first_label: "ten"
          sorted_label: "ten"
        - ID: 2
          first_label: "twenty"
          sorted_label: "twenty"

  - name: "LEFT JOIN with correlated EXISTS projection keeps its ON predicate"
    sql: |
      SELECT m.ID, lookup_ref.label, lookup_ref.can_view
      FROM dtl_join_main m
      LEFT JOIN (
        SELECT r.ID, r.label,
          EXISTS (
            SELECT 1 FROM dtl_join_acl acl
            WHERE acl.ref_id = r.ID AND acl.allowed = TRUE
          ) AS can_view
        FROM dtl_join_ref r
      ) lookup_ref ON lookup_ref.ID = m.first_ref
      ORDER BY m.ID
    expect:
      rows: 3
      data:
        - ID: 1
          label: "ten"
          can_view: true
        - ID: 2
          label: "twenty"
          can_view: false
        - ID: 3
          label: null
          can_view: null

  - name: "LEFT JOIN with constant and correlated stages keeps its ON predicate"
    sql: |
      SELECT m.ID, lookup_ref.label, lookup_ref.can_view
      FROM dtl_join_main m
      LEFT JOIN (
        SELECT r.ID, r.label,
          (EXISTS (
            SELECT 1 FROM dtl_join_acl global_acl
            WHERE global_acl.allowed = TRUE
          )) AND (CASE WHEN EXISTS (
            SELECT 1 FROM dtl_join_acl global_acl
            WHERE global_acl.allowed = FALSE
          ) THEN TRUE ELSE EXISTS (
            SELECT 1 FROM dtl_join_acl correlated_acl
            WHERE correlated_acl.ref_id = r.ID
              AND correlated_acl.allowed = TRUE
          ) END) AS can_view
        FROM dtl_join_ref r
      ) lookup_ref ON lookup_ref.ID = m.first_ref
      ORDER BY m.ID
    expect:
      rows: 3
      data:
        - ID: 1
          label: "ten"
          can_view: true
        - ID: 2
          label: "twenty"
          can_view: true
        - ID: 3
          label: null
          can_view: null

  - name: "Cascaded stage-producing LEFT JOINs keep every ON predicate"
    sql: |
      SELECT m.ID,
        first_lookup.label AS first_label,
        first_lookup.can_view AS first_can_view,
        second_lookup.label AS second_label,
        second_lookup.can_view AS second_can_view
      FROM dtl_join_main m
      LEFT JOIN (
        SELECT r.ID, r.label,
          EXISTS (
            SELECT 1 FROM dtl_join_acl acl
            WHERE acl.ref_id = r.ID AND acl.allowed = TRUE
          ) AS can_view
        FROM dtl_join_ref r
      ) first_lookup ON first_lookup.ID = m.first_ref
      LEFT JOIN (
        SELECT r.ID, r.label,
          EXISTS (
            SELECT 1 FROM dtl_join_acl acl
            WHERE acl.ref_id = r.ID AND acl.allowed = TRUE
          ) AS can_view
        FROM dtl_join_ref r
      ) second_lookup ON second_lookup.ID = m.second_ref
      ORDER BY m.ID
      LIMIT 72 OFFSET 0
    expect:
      rows: 3
      data:
        - ID: 1
          first_label: "ten"
          first_can_view: true
          second_label: "twenty"
          second_can_view: false
        - ID: 2
          first_label: "twenty"
          first_can_view: false
          second_label: "thirty"
          second_can_view: false
        - ID: 3
          first_label: null
          first_can_view: null
          second_label: "ten"
          second_can_view: true

  - name: "Derived access lookup retains nested scalar probe aggregates"
    sql: |
      EXPLAIN SELECT access_link.ID, location_lookup.description AS location_description,
        location_lookup.can_view AS location_can_view
      FROM dtl_access_link access_link
        JOIN (
          SELECT location.ID, location.name AS description,
            ((EXISTS (
              SELECT TRUE FROM dtl_access_link global_access
              WHERE global_access.account_id = 11
                AND global_access.tenant_id IS NULL
              LIMIT 1
            )) OR (NOT EXISTS (
              SELECT TRUE FROM dtl_access_link denied_access
              WHERE denied_access.account_id = 999
                AND denied_access.tenant_id IS NULL
              LIMIT 1
            ))) AND (CASE WHEN EXISTS (
              SELECT TRUE FROM dtl_access_link global_access
              WHERE global_access.account_id = 11
                AND global_access.tenant_id IS NULL
              LIMIT 1
            ) THEN TRUE ELSE EXISTS (
              SELECT TRUE FROM dtl_access_link location_access
              WHERE COALESCE(location_access.location_id, location.ID) = location.ID
                AND location_access.account_id = 11
              LIMIT 1
            ) END) AND COALESCE((
              SELECT ((EXISTS (
                SELECT TRUE FROM dtl_access_link nested_global_access
                WHERE nested_global_access.account_id = 11
                  AND nested_global_access.tenant_id IS NULL
                LIMIT 1
              )) OR (NOT EXISTS (
                SELECT TRUE FROM dtl_access_link nested_denied_access
                WHERE nested_denied_access.account_id = 999
                  AND nested_denied_access.tenant_id IS NULL
                LIMIT 1
              ))) AND (CASE WHEN EXISTS (
                SELECT TRUE FROM dtl_access_link nested_global_access
                WHERE nested_global_access.account_id = 11
                  AND nested_global_access.tenant_id IS NULL
                LIMIT 1
              ) THEN TRUE ELSE EXISTS (
                SELECT TRUE FROM dtl_access_link nested_tenant_access
                WHERE nested_tenant_access.tenant_id = parent_tenant.ID
                  AND nested_tenant_access.account_id = 11
                LIMIT 1
              ) END)
              FROM dtl_access_tenant parent_tenant
              WHERE parent_tenant.ID = location.tenant_id
              LIMIT 1
            ), FALSE) AS can_view
          FROM dtl_access_location location
        ) location_lookup ON location_lookup.ID = access_link.location_id
      WHERE EXISTS (
        SELECT TRUE FROM dtl_access_link global_filter
        WHERE global_filter.account_id = 11
          AND global_filter.tenant_id IS NULL
        LIMIT 1
      )
      ORDER BY access_link.ID
      LIMIT 72 OFFSET 0
    expect:
      contains:
        - "scan"
      not_contains:
        - "scalar_first_probe"


cleanup:
  - sql: "DROP TABLE IF EXISTS dtl_main"
  - sql: "DROP TABLE IF EXISTS dtl_hist"
  - sql: "DROP TABLE IF EXISTS dtl_ref"
  - sql: "DROP TABLE IF EXISTS dtl_join_main"
  - sql: "DROP TABLE IF EXISTS dtl_join_ref"
  - sql: "DROP TABLE IF EXISTS dtl_join_acl"
  - sql: "DROP TABLE IF EXISTS dtl_access_link"
  - sql: "DROP TABLE IF EXISTS dtl_access_tenant"
  - sql: "DROP TABLE IF EXISTS dtl_access_location"
