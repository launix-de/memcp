metadata:
  version: "1.0"
  description: "Prepared statement / parameterized query tests"

setup:
  - sql: "DROP TABLE IF EXISTS ps_unique"
  - sql: "DROP TABLE IF EXISTS ps_test"
  - sql: "CREATE TABLE ps_test (id int, name text, score float)"

cleanup:
  - sql: "DROP TABLE IF EXISTS ps_unique"
  - sql: "DROP TABLE IF EXISTS ps_test"

test_cases:
  # --- Basic ? placeholder (HTTP v1= binding) ---

  - name: "INSERT with ? placeholders"
    sql: "INSERT INTO ps_test (id, name, score) VALUES (?, ?, ?)"
    params: [1, "alice", 9.5]
    expect:
      affected_rows: 1

  - name: "INSERT second row with ?"
    sql: "INSERT INTO ps_test (id, name, score) VALUES (?, ?, ?)"
    params: [2, "bob", 7.0]
    expect:
      affected_rows: 1

  - name: "SELECT with ? in WHERE"
    sql: "SELECT id, name FROM ps_test WHERE id = ?"
    params: [1]
    expect:
      rows: 1
      data:
        - {id: 1, name: "alice"}

  - name: "SELECT with two ? placeholders"
    sql: "SELECT name FROM ps_test WHERE id >= ? AND score >= ?"
    params: [1, 9.0]
    expect:
      rows: 1
      data:
        - {name: "alice"}

  - name: "SELECT with ? LIKE placeholder"
    sql: "SELECT id FROM ps_test WHERE name LIKE ?"
    params: ["ali%"]
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "? with string value"
    sql: "SELECT id FROM ps_test WHERE name = ?"
    params: ["bob"]
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "Literal LIKE cache first value"
    sql: "SELECT id FROM ps_test WHERE name LIKE 'ali%'"
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "Literal LIKE cache second value"
    sql: "SELECT id FROM ps_test WHERE name LIKE 'bo%'"
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "Literal LIKE cache keeps string projection literal"
    sql: "SELECT 'fixed' AS label, id FROM ps_test WHERE name LIKE 'ali%'"
    expect:
      rows: 1
      data:
        - {label: "fixed", id: 1}

  - name: "Literal LIKE cache normalization"
    scm: |
      (match (sql_parameterize_select_like_strings
        "SELECT id FROM ps_test WHERE name LIKE 'ali%'"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "SELECT id FROM ps_test WHERE name LIKE ?")
          (equal? bindings '("ali%")))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Non-LIKE string literal cache key stays exact"
    scm: |
      (match (sql_parameterize_select_like_strings
        "SELECT 'fixed' AS label, id FROM ps_test WHERE name = 'alice'"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "SELECT 'fixed' AS label, id FROM ps_test WHERE name = 'alice'")
          (equal? bindings '()))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Already parameterized LIKE cache key stays exact"
    scm: |
      (match (sql_parameterize_select_like_strings
        "SELECT id FROM ps_test WHERE name LIKE ?"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "SELECT id FROM ps_test WHERE name LIKE ?")
          (equal? bindings '()))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "SELECT literals normalize into runtime bindings"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT id FROM ps_test WHERE id >= 1 AND name = 'alice' ORDER BY id LIMIT 2 OFFSET 0"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "SELECT id FROM ps_test WHERE id >= ? AND name = ? ORDER BY id LIMIT ? OFFSET ?")
          (equal? bindings '(1 "alice" 2 0)))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Literal variants share one cached SELECT plan"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (cached_parse cache (lambda (_schema _query _policy) 7)
          "memcp-tests" "SELECT id FROM ps_test WHERE id = 1 LIMIT 1 OFFSET 0"
          nil "root" sess true)
        (cached_parse cache (lambda (_schema _query _policy) 7)
          "memcp-tests" "SELECT id FROM ps_test WHERE id = 2 LIMIT 2 OFFSET 1"
          nil "root" sess true)
        (if (and
          (equal? (count (cache)) 1)
          (equal? (sess "v1") 2)
          (equal? (sess "v2") 2)
          (equal? (sess "v3") 1))
          "ok"
          (error (concat "unexpected cache/bindings: " (count (cache)) " / " (sess "v1") "," (sess "v2") "," (sess "v3")))))
    expect:
      data: ["ok"]

  - name: "Literal front cache stores only generalized SELECTs"
    scm: |
      (begin
        (define cache (newcachemap))
        (sql_parameterize_select_literals_cached cache
          "UPDATE ps_test SET score = 5 WHERE id = 1" true)
        (sql_parameterize_select_literals_cached cache
          "SELECT COUNT(*) FROM ps_test WHERE id = 1" true)
        (sql_parameterize_select_literals_cached cache
          "SELECT id FROM ps_test WHERE id = 1" true)
        (sql_parameterize_select_literals_cached cache
          "SELECT id FROM ps_test WHERE id = 1" true)
        (if (equal? (count (cache)) 1)
          "ok"
          (error (concat "unexpected literal front-cache size: " (count (cache))))))
    expect:
      data: ["ok"]

  - name: "Literal equality first execution"
    sql: "SELECT id FROM ps_test WHERE id = 1"
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "Literal equality second execution"
    sql: "SELECT id FROM ps_test WHERE id = 2"
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "Projection literal keeps result metadata"
    sql: "SELECT 1, 'fixed' AS label FROM ps_test LIMIT 1"
    expect:
      rows: 1
      data:
        - {"1": 1, label: "fixed"}

  - name: "Literal normalization leaves DML exact"
    scm: |
      (match (sql_parameterize_select_literals
        "UPDATE ps_test SET score = 5 WHERE id = 1"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "UPDATE ps_test SET score = 5 WHERE id = 1")
          (equal? bindings '()))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Literal LIMIT and OFFSET stay execution-local"
    sql: "SELECT id FROM ps_test ORDER BY id LIMIT 1 OFFSET 0"
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "Literal LIMIT and OFFSET second execution"
    sql: "SELECT id FROM ps_test ORDER BY id LIMIT 1 OFFSET 1"
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "? placeholder: no match returns 0 rows"
    sql: "SELECT id FROM ps_test WHERE id = ?"
    params: [99]
    expect:
      rows: 0

  # --- INSERT IGNORE with ? ---

  - name: "setup ps_unique table"
    sql: "CREATE TABLE ps_unique (id int, val text, UNIQUE KEY id_unique (id))"
    expect:
      affected_rows: 1

  - name: "INSERT IGNORE with ? placeholders"
    sql: "INSERT IGNORE INTO ps_unique (id, val) VALUES (?, ?)"
    params: [1, "first"]
    expect:
      affected_rows: 1

  - name: "INSERT IGNORE duplicate with ? is silently skipped"
    sql: "INSERT IGNORE INTO ps_unique (id, val) VALUES (?, ?)"
    params: [1, "second"]
    expect:
      affected_rows: 0

  # --- ? placeholder with type coercion ---

  - name: "? placeholder string coerced to match int column"
    sql: "SELECT id FROM ps_test WHERE id = ?"
    params: ["1"]
    expect:
      rows: 1

  # --- PostgreSQL $N placeholder ---

  - name: "SELECT with $1 placeholder (psql syntax)"
    sql: "SELECT id, name FROM ps_test WHERE id = $1"
    syntax: postgresql
    params: [2]
    expect:
      rows: 1
      data:
        - {id: 2, name: "bob"}

  - name: "SELECT with $1 and $2 (psql)"
    sql: "SELECT name FROM ps_test WHERE id = $1 OR id = $2 ORDER BY id"
    syntax: postgresql
    params: [1, 2]
    expect:
      rows: 2
      data:
        - {name: "alice"}
        - {name: "bob"}

  # --- Error cases ---

  - name: "? without params returns no rows (session key unset = nil, no match)"
    sql: "SELECT id FROM ps_test WHERE id = ?"
    expect:
      rows: 0
