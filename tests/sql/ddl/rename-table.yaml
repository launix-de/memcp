# RENAME TABLE and ALTER TABLE ADD FULLTEXT

metadata:
  version: "1.0"
  description: "RENAME TABLE support and ADD FULLTEXT no-op"

setup:
  - sql: "DROP TABLE IF EXISTS ren_new"
  - sql: "DROP TABLE IF EXISTS ren_old"

test_cases:
  - name: "Create table for rename"
    sql: "CREATE TABLE ren_old (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(100))"

  - name: "Insert data before rename"
    sql: "INSERT INTO ren_old (name) VALUES ('Alice'), ('Bob')"
    expect:
      affected_rows: 2

  - name: "Verify data in old table"
    sql: "SELECT COUNT(*) AS cnt FROM ren_old"
    expect:
      rows: 1
      data:
        - { cnt: 2 }

  - name: "RENAME TABLE old TO new"
    sql: "RENAME TABLE ren_old TO ren_new"

  - name: "Select from new table"
    sql: "SELECT name FROM ren_new ORDER BY id"
    expect:
      rows: 2
      data:
        - { name: "Alice" }
        - { name: "Bob" }

  - name: "Old table must not exist"
    sql: "SELECT * FROM ren_old"
    expect:
      error: true

  - name: "Insert into renamed table"
    sql: "INSERT INTO ren_new (name) VALUES ('Charlie')"
    expect:
      affected_rows: 1

  - name: "Verify all data after rename"
    sql: "SELECT COUNT(*) AS cnt FROM ren_new"
    expect:
      rows: 1
      data:
        - { cnt: 3 }

  - name: "ALTER TABLE ADD FULLTEXT no-op"
    sql: "ALTER TABLE ren_new ADD FULLTEXT search(name)"

  - name: "Table still works after ADD FULLTEXT"
    sql: "SELECT COUNT(*) AS cnt FROM ren_new"
    expect:
      rows: 1
      data:
        - { cnt: 3 }

  - name: Public DROP retires the renamed visible table
    steps:
    - sql: DROP TABLE IF EXISTS drop_visible_before
    - sql: DROP TABLE IF EXISTS drop_visible_after
    - sql: CREATE TABLE drop_visible_before(id INT PRIMARY KEY,payload INT)
    - sql: INSERT INTO drop_visible_before VALUES(7,11)
    - sql: RENAME TABLE drop_visible_before TO drop_visible_after
    - sql: SELECT id,payload FROM drop_visible_after ORDER BY id
      expect:
        data:
        - id: 7
          payload: 11
    - sql: DROP TABLE drop_visible_after
    - scm: (nil? (table "memcp-tests" false "drop_visible_after" false nil))
      expect:
        result: true
  - name: Public DROP does not use a renamed generation hidden behind a reused old name
    steps:
    - sql: DROP TABLE IF EXISTS drop_visible_before
    - sql: DROP TABLE IF EXISTS drop_visible_after
    - sql: CREATE TABLE drop_visible_before(id INT PRIMARY KEY,payload INT)
    - sql: INSERT INTO drop_visible_before VALUES(7,11)
    - sql: RENAME TABLE drop_visible_before TO drop_visible_after
    - sql: CREATE TABLE drop_visible_before(id INT PRIMARY KEY,payload INT)
    - sql: INSERT INTO drop_visible_before VALUES(7,22)
    - sql: DROP TABLE drop_visible_before
    - sql: SELECT id,payload FROM drop_visible_after ORDER BY id
      expect:
        data:
        - id: 7
          payload: 11
    - scm: (nil? (table "memcp-tests" false "drop_visible_before" false nil))
      expect:
        result: true
    - sql: DROP TABLE drop_visible_after
    - scm: (nil? (table "memcp-tests" false "drop_visible_after" false nil))
      expect:
        result: true

cleanup:
  - sql: "DROP TABLE IF EXISTS ren_new"
  - sql: "DROP TABLE IF EXISTS ren_old"
  - sql: "DROP TABLE IF EXISTS drop_visible_before"
  - sql: "DROP TABLE IF EXISTS drop_visible_after"
