metadata:
  syntax: tsql
  requires_tds: true
  isolated: true
  description: Declaration completion has no count while zero-row DML has a valid count
cleanup:
- sql: DROP TRIGGER IF EXISTS dbo.completion_guard
- sql: DROP PROCEDURE IF EXISTS dbo.completion_source
- sql: DROP VIEW IF EXISTS dbo.completion_view
- sql: DROP TABLE IF EXISTS completion_input
- sql: DROP TRIGGER IF EXISTS dbo.completion_wire_guard
- sql: DROP PROCEDURE IF EXISTS dbo.completion_wire_proc
- sql: DROP VIEW IF EXISTS dbo.completion_wire_view
- sql: DROP TABLE IF EXISTS completion_wire_retired
- sql: DROP TABLE IF EXISTS completion_wire
test_cases:
- name: HTTP CREATE TABLE has no affected count
  sql: CREATE TABLE completion_input(id INT PRIMARY KEY,value INT)
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Created table is a genuine catalog object
  sql: SELECT CASE WHEN OBJECT_ID(N'dbo.completion_input',N'U') IS NOT NULL THEN 1 ELSE 0 END AS installed
  expect: {rows: 1,data: [{installed: 1}]}
- name: A failed CREATE does not become a successful declaration completion
  sql: CREATE TABLE completion_input(replacement INT)
  expect: {error: true}
- name: HTTP INSERT retains its affected count
  sql: INSERT INTO completion_input VALUES(1,5)
  expect: {affected_rows: 1,result_contains: '"affected_rows"'}
- name: HTTP zero row UPDATE retains a present zero count
  sql: UPDATE completion_input SET value=99 WHERE id=99
  expect: {affected_rows: 0,result_contains: '"affected_rows"'}
- name: HTTP CREATE VIEW has no count
  sql: CREATE VIEW dbo.completion_view AS SELECT id,value FROM completion_input
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Created view reads real rows
  sql: SELECT id,value FROM dbo.completion_view
  expect: {rows: 1,data: [{id: 1,value: 5}]}
- name: HTTP ALTER VIEW has no count
  sql: ALTER VIEW dbo.completion_view AS SELECT id,value+1 AS value FROM completion_input
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Altered view publishes the new formula
  sql: SELECT id,value FROM dbo.completion_view
  expect: {rows: 1,data: [{id: 1,value: 6}]}
- name: HTTP CREATE PROCEDURE has no count despite a native numeric completion
  sql: CREATE PROCEDURE dbo.completion_source AS SELECT CAST(7 AS INT) AS value
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Procedure source really executes
  sql: EXEC dbo.completion_source
  expect: {rows: 1,data: [{value: 7}]}
- name: HTTP CREATE TRIGGER has no affected count
  sql: CREATE TRIGGER dbo.completion_guard ON completion_input AFTER INSERT AS BEGIN UPDATE completion_input SET value=value+100 WHERE id=1; END
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Installed trigger executes on a real mutation
  sql: INSERT INTO completion_input VALUES(2,20)
- name: Trigger effect is visible in native table data
  sql: SELECT value FROM completion_input WHERE id=1
  expect: {rows: 1,data: [{value: 105}]}
- name: HTTP DROP TRIGGER has no count
  sql: DROP TRIGGER dbo.completion_guard
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Mutation after trigger deletion has no trigger effect
  sql: INSERT INTO completion_input VALUES(3,30)
- name: Trigger deletion preserves the prior stored value
  sql: SELECT value FROM completion_input WHERE id=1
  expect: {rows: 1,data: [{value: 105}]}
- name: HTTP DROP PROCEDURE has no count
  sql: DROP PROCEDURE dbo.completion_source
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Dropped procedure cannot execute
  sql: EXEC dbo.completion_source
  expect: {error: true}
- name: HTTP NOCOUNT suppresses a real DML count while preserving its write
  session_id: completion_http
  sql: SET NOCOUNT ON; UPDATE completion_input SET value=6 WHERE id=1
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: NOCOUNT leaves data and query results intact
  session_id: completion_http
  sql: SELECT value FROM completion_input WHERE id=1
  expect: {rows: 1,data: [{value: 6}]}
- name: HTTP NOCOUNT OFF restores a present genuine zero count
  session_id: completion_http
  sql: SET NOCOUNT OFF; UPDATE completion_input SET value=7 WHERE id=99
  expect: {affected_rows: 0,result_contains: '"affected_rows"'}
- name: Wire DONE_COUNT distinguishes declaration absence from a valid DML zero
