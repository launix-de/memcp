- name: Wire writes are visible through the common SQL frontend
  sql: SELECT id,value FROM completion_wire
  expect: {rows: 1,data: [{id: 1,value: 8}]}
- name: HTTP DROP VIEW has no count
  sql: DROP VIEW dbo.completion_view
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Dropped view is absent
  sql: SELECT CASE WHEN OBJECT_ID(N'dbo.completion_view',N'V') IS NULL THEN 1 ELSE 0 END AS removed
  expect: {rows: 1,data: [{removed: 1}]}
- name: HTTP DROP TABLE has no affected count
  sql: DROP TABLE completion_input
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: Removed table is absent from its native catalog
  sql: SELECT CASE WHEN OBJECT_ID(N'dbo.completion_input',N'U') IS NULL THEN 1 ELSE 0 END AS removed
  expect: {rows: 1,data: [{removed: 1}]}
- name: Conditional absent DROP has no count either
  sql: DROP TABLE IF EXISTS completion_input
  expect: {rows: 0,result_not_contains: '"affected_rows"'}
- name: A failed DROP remains an error
  sql: DROP TABLE completion_input
  expect: {error: true}
