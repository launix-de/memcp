metadata:
  version: "1.0"
  description: "AUTO_INCREMENT correctness: sequential assignment, explicit ID coexistence, counter persistence"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS ai_blocks"
  - sql: "DROP TABLE IF EXISTS ai_signed_replay"
  - sql: "DROP TABLE IF EXISTS ai_signed_highwater"
  - sql: "CREATE TABLE ai_blocks (id BIGINT AUTO_INCREMENT PRIMARY KEY, name TEXT)"
  - sql: "CREATE TABLE ai_signed_replay (id BIGINT AUTO_INCREMENT PRIMARY KEY, name TEXT)"
  - sql: "CREATE TABLE ai_signed_highwater (id BIGINT AUTO_INCREMENT PRIMARY KEY, name TEXT)"
  - sql: "DROP TABLE IF EXISTS ai_basic"
  - sql: "DROP TABLE IF EXISTS ai_explicit"
  - sql: "DROP TABLE IF EXISTS ai_mixed"
  - sql: "DROP TABLE IF EXISTS ai_restart"
  - sql: "DROP TABLE IF EXISTS ai_same_col"
  - sql: "DROP TABLE IF EXISTS ai_null_explicit"
  - sql: "DROP TABLE IF EXISTS ai_tx"
  - sql: "DROP TABLE IF EXISTS ai_partitioned"
  - sql: "DROP TABLE IF EXISTS ai_seeded"
  - sql: "DROP TABLE IF EXISTS ai_seeded_copy"
  - sql: "DROP TABLE IF EXISTS ai_dump_restore"
  - sql: "CREATE TABLE ai_basic (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT)"
  - sql: "CREATE TABLE ai_explicit (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT)"
  - sql: "CREATE TABLE ai_mixed (id INT AUTO_INCREMENT PRIMARY KEY, val INT)"
  - sql: "CREATE TABLE ai_restart (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT)"
  - sql: "CREATE TABLE ai_same_col (id INT AUTO_INCREMENT PRIMARY KEY, category INT, name TEXT)"
  - sql: "CREATE TABLE ai_null_explicit (id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY, name TEXT)"

cleanup:
  - sql: "DROP TABLE IF EXISTS ai_blocks"
  - sql: "DROP TABLE IF EXISTS ai_signed_replay"
  - sql: "DROP TABLE IF EXISTS ai_signed_highwater"
  - sql: "DROP TABLE IF EXISTS ai_basic"
  - sql: "DROP TABLE IF EXISTS ai_explicit"
  - sql: "DROP TABLE IF EXISTS ai_restart"
  - sql: "DROP TABLE IF EXISTS ai_mixed"
  - sql: "DROP TABLE IF EXISTS ai_same_col"
  - sql: "DROP TABLE IF EXISTS ai_null_explicit"
  - sql: "DROP TABLE IF EXISTS ai_tx"
  - sql: "DROP TABLE IF EXISTS ai_partitioned"
  - sql: "DROP TABLE IF EXISTS ai_seeded"
  - sql: "DROP TABLE IF EXISTS ai_seeded_copy"
  - sql: "DROP TABLE IF EXISTS ai_dump_restore"

test_cases:

  # --- Basic AUTO_INCREMENT: sequential inserts without explicit ID ---

  - name: "INSERT without ID assigns auto id (first row)"
    sql: "INSERT INTO ai_basic (name) VALUES ('alpha')"
    expect:
      affected_rows: 1

  - name: "Fresh AUTO_INCREMENT starts at one"
    sql: "SELECT id FROM ai_basic WHERE name = 'alpha'"
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "Explicit NULL requests an AUTO_INCREMENT value for every row"
    sql: "INSERT INTO ai_null_explicit (id, name) VALUES (NULL, 'null-id-one'), (NULL, 'null-id-two')"
    expect:
      affected_rows: 2

  - name: "Explicit NULL AUTO_INCREMENT rows receive distinct generated IDs"
    sql: "SELECT COUNT(*) AS rows_found, COUNT(DISTINCT id) AS distinct_ids FROM ai_null_explicit"
    expect:
      rows: 1
      data:
        - {rows_found: 2, distinct_ids: 2}

  - name: "INSERT without ID assigns auto id (second row)"
    sql: "INSERT INTO ai_basic (name) VALUES ('beta')"
    expect:
      affected_rows: 1

  - name: "INSERT without ID assigns auto id (third row)"
    sql: "INSERT INTO ai_basic (name) VALUES ('gamma')"
    expect:
      affected_rows: 1

  - name: "All three rows present with distinct IDs"
    sql: "SELECT COUNT(DISTINCT id) AS cnt FROM ai_basic"
    expect:
      rows: 1
      data:
        - {cnt: 3}

  - name: "IDs are positive integers"
    sql: "SELECT COUNT(*) AS cnt FROM ai_basic WHERE id > 0"
    expect:
      rows: 1
      data:
        - {cnt: 3}

  - name: "Names match inserted order"
    sql: "SELECT name FROM ai_basic ORDER BY id"
    expect:
      rows: 3
      data:
        - {name: "alpha"}
        - {name: "beta"}
        - {name: "gamma"}

  # --- Explicit ID insert followed by auto-insert (no collision) ---

  - name: "INSERT with explicit high ID"
    sql: "INSERT INTO ai_explicit (id, name) VALUES (100, 'explicit')"
    expect:
      affected_rows: 1

  - name: "INSERT without ID after explicit high ID — no collision"
    sql: "INSERT INTO ai_explicit (name) VALUES ('auto1')"
    expect:
      affected_rows: 1

  - name: "INSERT without ID again — still no collision"
    sql: "INSERT INTO ai_explicit (name) VALUES ('auto2')"
    expect:
      affected_rows: 1

  - name: "All three rows present"
    sql: "SELECT COUNT(*) AS cnt FROM ai_explicit"
    expect:
      rows: 1
      data:
        - {cnt: 3}

  - name: "Explicit row has ID=100"
    sql: "SELECT id FROM ai_explicit WHERE name = 'explicit'"
    expect:
      rows: 1
      data:
        - {id: 100}

  - name: "Auto rows have IDs distinct from 100 and from each other"
    sql: "SELECT id, name FROM ai_explicit WHERE name IN ('auto1', 'auto2') ORDER BY id"
    expect:
      rows: 2
      data:
        - {id: 101, name: "auto1"}
        - {id: 102, name: "auto2"}

  - name: "Auto IDs do not collide with explicit ID 100"
    sql: "SELECT COUNT(*) AS cnt FROM ai_explicit WHERE name IN ('auto1', 'auto2') AND id = 100"
    expect:
      rows: 1
      data:
        - {cnt: 0}

  # --- Multiple inserts without ID on a fresh table (the FOP scenario) ---

  - name: "Batch: insert 5 rows without ID"
    sql: "INSERT INTO ai_mixed (val) VALUES (1)"
    expect:
      affected_rows: 1

  - name: "Batch: insert row 2"
    sql: "INSERT INTO ai_mixed (val) VALUES (2)"
    expect:
      affected_rows: 1

  - name: "Batch: insert row 3"
    sql: "INSERT INTO ai_mixed (val) VALUES (3)"
    expect:
      affected_rows: 1

  - name: "Batch: insert row 4"
    sql: "INSERT INTO ai_mixed (val) VALUES (4)"
    expect:
      affected_rows: 1

  - name: "Batch: insert row 5"
    sql: "INSERT INTO ai_mixed (val) VALUES (5)"
    expect:
      affected_rows: 1

  - name: "All 5 rows have unique IDs"
    sql: "SELECT COUNT(DISTINCT id) AS cnt FROM ai_mixed"
    expect:
      rows: 1
      data:
        - {cnt: 5}

  - name: "No ID is NULL"
    sql: "SELECT COUNT(*) AS cnt FROM ai_mixed WHERE id IS NULL"
    expect:
      rows: 1
      data:
        - {cnt: 0}

  # --- Same first-column value across multiple inserts (the real FOP scenario) ---
  # All rows have category=1. Before the fix, ProcessUniqueCollision used keyIdx=0
  # (mapping to 'category') as the lookup value for PRIMARY KEY 'id'. After the
  # first insert (id=1), every subsequent insert with category=1 triggered a false
  # duplicate-key panic.

  - name: "Same-col: first insert (category=1)"
    sql: "INSERT INTO ai_same_col (category, name) VALUES (1, 'Autenung')"
    expect:
      affected_rows: 1

  - name: "Same-col: second insert (category=1, different name)"
    sql: "INSERT INTO ai_same_col (category, name) VALUES (1, 'Debe')"
    expect:
      affected_rows: 1

  - name: "Same-col: third insert (category=1, different name)"
    sql: "INSERT INTO ai_same_col (category, name) VALUES (1, 'Trei')"
    expect:
      affected_rows: 1

  - name: "Same-col: all 3 rows present with distinct IDs"
    sql: "SELECT COUNT(DISTINCT id) AS cnt FROM ai_same_col"
    expect:
      rows: 1
      data:
        - {cnt: 3}

  - name: "Same-col: no ID is NULL"
    sql: "SELECT COUNT(*) AS cnt FROM ai_same_col WHERE id IS NULL"
    expect:
      rows: 1
      data:
        - {cnt: 0}

  - name: "Same-col: names in insertion order"
    sql: "SELECT name FROM ai_same_col ORDER BY id"
    expect:
      rows: 3
      data:
        - {name: "Autenung"}
        - {name: "Debe"}
        - {name: "Trei"}

  # --- Duplicate explicit ID must fail ---

  - name: "INSERT duplicate explicit ID must fail"
    sql: "INSERT INTO ai_mixed (id, val) VALUES (1, 99)"
    expect:
      error: true

  # --- Transaction scenario: INSERT in tx, commit, then new insert must not collide ---

  - name: "TX: create table for tx test"
    sql: "CREATE TABLE ai_tx (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT)"
    expect:
      affected_rows: 1

  - name: "TX: start transaction"
    sql: "START TRANSACTION"
    expect:
      affected_rows: 0

  - name: "TX: insert first row in transaction"
    sql: "INSERT INTO ai_tx (name) VALUES ('first')"
    expect:
      affected_rows: 1

  - name: "TX: commit"
    sql: "COMMIT"
    expect:
      affected_rows: 0

  - name: "TX: insert second row after commit — must not collide"
    sql: "INSERT INTO ai_tx (name) VALUES ('second')"
    expect:
      affected_rows: 1

  - name: "TX: both rows present with distinct IDs"
    sql: "SELECT COUNT(DISTINCT id) AS cnt FROM ai_tx"
    expect:
      rows: 1
      data:
        - {cnt: 2}

  # --- Partition routing: omitted AUTO_INCREMENT key is generated only after
  # shard selection and must nevertheless route to the key's range shard. ---

  - name: "Partitioned auto ID: create compact fixture"
    setup:
      - scm: '(settings "ShardSize" 3)'
      - scm: '(settings "PartitionMaxDimensions" 1)'
      - sql: "CREATE TABLE ai_partitioned (id INT AUTO_INCREMENT PRIMARY KEY, tenant INT, name TEXT)"
    scm: |
      (begin
        (insert (table "memcp-tests" false "ai_partitioned" false) '("id" "tenant" "name")
          (map (produceN 21) (lambda (i) (list (+ i 1) (mod i 2) (concat "main-" i)))))
        true)

  - name: "Partitioned auto ID: repartition by ID"
    scm: |
      (partitiontable
        (table "memcp-tests" false "ai_partitioned" false)
        (list (list "id" (list 3 6 9 12 15 18))))

  - name: "Partitioned auto ID: insert without partition key"
    sql: "INSERT INTO ai_partitioned (tenant, name) VALUES (0, 'generated-high-id')"
    expect:
      affected_rows: 1

  - name: "Partitioned auto ID: generated row exists without ID pruning"
    sql: "SELECT id, name FROM ai_partitioned WHERE name = 'generated-high-id'"
    expect:
      data:
        - id: 22
          name: "generated-high-id"

  - name: "Partitioned auto ID: generated key remains index-visible"
    sql: "SELECT id, name FROM ai_partitioned WHERE id = 22"
    expect:
      data:
        - id: 22
          name: "generated-high-id"

  - name: "Partitioned auto ID: restore shard size"
    scm: |
      (begin
        (settings "ShardSize" 60000)
        (settings "PartitionMaxDimensions" 0))

  # --- Explicit next-value state must survive SHOW CREATE and restart. ---

  - name: "Create table with mysqldump AUTO_INCREMENT state"
    sql: "CREATE TABLE ai_dump_restore (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT) ENGINE=InnoDB AUTO_INCREMENT=3"

  - name: "Restore explicit rows without consuming generated IDs"
    sql: "INSERT INTO ai_dump_restore (id, name) VALUES (1, 'one'), (2, 'two')"

  - name: "Generate the next ID after restoring explicit rows"
    sql: "INSERT INTO ai_dump_restore (name) VALUES ('three')"

  - name: "Restored AUTO_INCREMENT state generates ID three"
    sql: "SELECT id FROM ai_dump_restore WHERE name = 'three'"
    expect:
      rows: 1
      data:
        - {id: 3}

  - name: "Explicit AUTO_INCREMENT next value is accepted"
    sql: "CREATE TABLE ai_seeded (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT) ENGINE=InnoDB AUTO_INCREMENT=42"
    expect:
      affected_rows: 1

  - name: "SHOW CREATE preserves explicit AUTO_INCREMENT next value"
    sql: "SHOW CREATE TABLE ai_seeded"
    expect:
      rows: 1
      result_contains: "AUTO_INCREMENT=42"

  - name: "Explicit AUTO_INCREMENT value is the first generated ID"
    sql: "INSERT INTO ai_seeded (name) VALUES ('first-seeded')"
    expect:
      affected_rows: 1

  - name: "Verify first explicitly seeded ID"
    sql: "SELECT id FROM ai_seeded WHERE name = 'first-seeded'"
    expect:
      rows: 1
      data:
        - {id: 42}

  - name: "ALTER TABLE sets the next AUTO_INCREMENT value"
    sql: "ALTER TABLE ai_seeded AUTO_INCREMENT=80"

  - name: "SHOW CREATE preserves altered AUTO_INCREMENT next value"
    sql: "SHOW CREATE TABLE ai_seeded"
    expect:
      rows: 1
      result_contains: "AUTO_INCREMENT=80"

  - name: "Create a round-trip copy from emitted AUTO_INCREMENT state"
    sql: "CREATE TABLE ai_seeded_copy (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT) ENGINE=InnoDB AUTO_INCREMENT=80"

  - name: "Round-trip copy generates the emitted next ID"
    sql: "INSERT INTO ai_seeded_copy (name) VALUES ('copy-seeded')"

  - name: "Verify round-trip copy next ID"
    sql: "SELECT id FROM ai_seeded_copy WHERE name = 'copy-seeded'"
    expect:
      rows: 1
      data:
        - {id: 80}

  - name: "Persist explicit AUTO_INCREMENT state"
    sql: "SHUTDOWN"

  - name: "SHOW CREATE keeps explicit next value after restart"
    sql: "SHOW CREATE TABLE ai_seeded"
    expect:
      rows: 1
      result_contains: "AUTO_INCREMENT=80"

  - name: "Restarted table generates the persisted next ID"
    sql: "INSERT INTO ai_seeded (name) VALUES ('after-seed-restart')"

  - name: "Verify persisted next ID after restart"
    sql: "SELECT id FROM ai_seeded WHERE name = 'after-seed-restart'"
    expect:
      rows: 1
      data:
        - {id: 80}

  # --- Restart scenario: counter must survive server restart ---
  # ai_restart table was created and seeded in setup (no inserts yet).
  # Insert before restart, then restart, then insert after — must not collide.

  - name: "Restart: insert first row before restart"
    sql: "INSERT INTO ai_restart (name) VALUES ('before')"
    expect:
      affected_rows: 1

  - name: "Restart: persist explicit negative IDs without consuming generated values"
    sql: "INSERT INTO ai_signed_replay (id, name) VALUES (-1, 'negative'), (-9223372036854775808, 'minimum')"
    expect: {affected_rows: 2}

  - name: "Restart: mix positive high-water and negative explicit IDs"
    sql: "INSERT INTO ai_signed_highwater (id, name) VALUES (-1, 'negative'), (41, 'positive'), (-9223372036854775808, 'minimum')"
    expect: {affected_rows: 3}

  - name: "Restart: trigger server restart"
    sql: "SHUTDOWN"

  - name: "Restart: negative explicit IDs leave the first generated ID available"
    sql: "INSERT INTO ai_signed_replay (name) VALUES ('generated')"
    expect: {affected_rows: 1}

  - name: "Restart: retain signed rows and generate the first positive ID"
    sql: "SELECT id,name FROM ai_signed_replay ORDER BY id"
    expect:
      rows: 3
      data:
        - {id: -9223372036854775808, name: minimum}
        - {id: -1, name: negative}
        - {id: 1, name: generated}

  - name: "Restart: positive explicit IDs still advance the recovered allocator"
    sql: "INSERT INTO ai_signed_highwater (name) VALUES ('generated')"
    expect: {affected_rows: 1}

  - name: "Restart: recovered high-water ignores negative explicit IDs"
    sql: "SELECT id,name FROM ai_signed_highwater ORDER BY id"
    expect:
      rows: 4
      data:
        - {id: -9223372036854775808, name: minimum}
        - {id: -1, name: negative}
        - {id: 41, name: positive}
        - {id: 42, name: generated}

  - name: "Restart: insert second row after restart — must not collide"
    sql: "INSERT INTO ai_restart (name) VALUES ('after')"
    expect:
      affected_rows: 1

  - name: "Restart: both rows present with distinct IDs"
    sql: "SELECT COUNT(DISTINCT id) AS cnt FROM ai_restart"
    expect:
      rows: 1
      data:
        - {cnt: 2}

  - name: "Restart: no ID is NULL"
    sql: "SELECT COUNT(*) AS cnt FROM ai_restart WHERE id IS NULL"
    expect:
      rows: 1
      data:
        - {cnt: 0}

  - name: "Native ID reservation returns the invocation's inclusive block"
    scm: |
      (if (equal? (reserve_ids (table "memcp-tests" false "ai_blocks" false) 3) (list 1 3))
        true (error "unexpected reserved block"))

  - name: "Native zero ID reservation returns no block"
    scm: |
      (if (equal? (reserve_ids (table "memcp-tests" false "ai_blocks" false) 0) (list))
        true (error "zero reservation changed state"))

  - name: "Native negative ID reservation is rejected"
    scm: '(reserve_ids (table "memcp-tests" false "ai_blocks" false) -1)'
    expect: {error: true}

  - name: "Native fractional ID reservation is rejected"
    scm: '(reserve_ids (table "memcp-tests" false "ai_blocks" false) 1.5)'
    expect: {error: true}

  - name: "Reserved IDs can be fed to the existing native insert"
    scm: |
      (insert (table "memcp-tests" false "ai_blocks" false) '("id" "name")
        (list (list 3 "reserved-last") (list 1 "reserved-first")))

  - name: "Implicit insert after explicit reserved IDs consumes the next ID once"
    sql: "INSERT INTO ai_blocks (name) VALUES ('implicit-after-block')"
    expect: {affected_rows: 1}

  - name: "Reserved range and implicit insert share the existing counter"
    sql: "SELECT id, name FROM ai_blocks ORDER BY id"
    expect:
      rows: 3
      data:
        - {id: 1, name: "reserved-first"}
        - {id: 3, name: "reserved-last"}
        - {id: 4, name: "implicit-after-block"}

  - name: "Failed and zero reservations did not consume another block"
    scm: |
      (if (equal? (reserve_ids (table "memcp-tests" false "ai_blocks" false) 2) (list 5 6))
        true (error "reservation counter advanced unexpectedly"))
