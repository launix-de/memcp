metadata:
  version: "1.0"
  description: "Prepared statement / parameterized query tests"

setup:
  - sql: "DROP TABLE IF EXISTS ps_guard_left"
  - sql: "DROP TABLE IF EXISTS ps_guard_right"
  - sql: "DROP TABLE IF EXISTS ps_search_docs"
  - sql: "DROP TABLE IF EXISTS ps_search_files"
  - sql: "DROP TABLE IF EXISTS ps_unique"
  - sql: "DROP TABLE IF EXISTS ps_test"
  - sql: "CREATE TABLE ps_test (id int, name text, score float)"
  - sql: "CREATE TABLE ps_guard_left (id int primary key, rhs int)"
  - sql: "CREATE TABLE ps_guard_right (id int primary key)"
  - sql: "INSERT INTO ps_guard_left (id, rhs) VALUES (1, 1), (2, 1)"
  - sql: "INSERT INTO ps_guard_right (id) VALUES (1)"
  - sql: "CREATE TABLE ps_search_docs (id int primary key, file int, title text, sort_key int)"
  - sql: "CREATE TABLE ps_search_files (id int primary key, filename text, search text)"
  - sql: "INSERT INTO ps_search_docs (id, file, title, sort_key) VALUES (1, 10, NULL, 1), (2, 20, 'Ca direct', 2), (3, 30, NULL, 3)"
  - sql: "INSERT INTO ps_search_files (id, filename, search) VALUES (10, 'Scan report.pdf', NULL), (20, 'other.pdf', NULL), (30, 'C-only report.pdf', NULL)"

cleanup:
  - sql: "DROP TABLE IF EXISTS ps_guard_left"
  - sql: "DROP TABLE IF EXISTS ps_guard_right"
  - sql: "DROP TABLE IF EXISTS ps_search_docs"
  - sql: "DROP TABLE IF EXISTS ps_search_files"
  - sql: "DROP TABLE IF EXISTS ps_unique"
  - sql: "DROP TABLE IF EXISTS ps_test"

test_cases:
  # --- Basic ? placeholder (HTTP v1= binding) ---

  - name: "INSERT with ? placeholders"
    sql: "INSERT INTO ps_test (id, name, score) VALUES (?, ?, ?)"
    params: [1, "alice", 9.5]
    expect:
      affected_rows: 1

  - name: "INSERT second row with ?"
    sql: "INSERT INTO ps_test (id, name, score) VALUES (?, ?, ?)"
    params: [2, "bob", 7.0]
    expect:
      affected_rows: 1

  - name: "SELECT with ? in WHERE"
    sql: "SELECT id, name FROM ps_test WHERE id = ?"
    params: [1]
    expect:
      rows: 1
      data:
        - {id: 1, name: "alice"}

  - name: "SELECT with two ? placeholders"
    sql: "SELECT name FROM ps_test WHERE id >= ? AND score >= ?"
    params: [1, 9.0]
    expect:
      rows: 1
      data:
        - {name: "alice"}

  - name: "SELECT with ? LIKE placeholder"
    sql: "SELECT id FROM ps_test WHERE name LIKE ?"
    params: ["ali%"]
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "? with string value"
    sql: "SELECT id FROM ps_test WHERE name = ?"
    params: ["bob"]
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "Literal LIKE cache first value"
    sql: "SELECT id FROM ps_test WHERE name LIKE 'ali%'"
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "Literal LIKE cache second value"
    sql: "SELECT id FROM ps_test WHERE name LIKE 'bo%'"
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "Literal LIKE cache keeps string projection literal"
    sql: "SELECT 'fixed' AS label, id FROM ps_test WHERE name LIKE 'ali%'"
    expect:
      rows: 1
      data:
        - {label: "fixed", id: 1}

  - name: "Literal LIKE cache normalization"
    scm: |
      (match (sql_parameterize_select_like_strings
        "SELECT id FROM ps_test WHERE name LIKE 'ali%'"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "SELECT id FROM ps_test WHERE name LIKE ?")
          (equal? bindings '("ali%")))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Non-LIKE string literal cache key stays exact"
    scm: |
      (match (sql_parameterize_select_like_strings
        "SELECT 'fixed' AS label, id FROM ps_test WHERE name = 'alice'"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "SELECT 'fixed' AS label, id FROM ps_test WHERE name = 'alice'")
          (equal? bindings '()))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Already parameterized LIKE cache key stays exact"
    scm: |
      (match (sql_parameterize_select_like_strings
        "SELECT id FROM ps_test WHERE name LIKE ?"
        true)
        '(normalized bindings)
        (if (and
          (equal? normalized "SELECT id FROM ps_test WHERE name LIKE ?")
          (equal? bindings '()))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "SELECT literals normalize into runtime bindings"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT id FROM ps_test WHERE id >= 1 AND name = 'alice' ORDER BY id LIMIT 2 OFFSET 0"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "SELECT id FROM ps_test WHERE id >= ? AND name = ? ORDER BY id LIMIT ? OFFSET ?")
          (equal? bindings '(1 "alice" 2 0))
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Complex LIKE UNION search normalizes nested conditions"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT d.id FROM ps_guard_left d WHERE d.id = 7 OR d.rhs IN (SELECT f.id FROM ps_guard_right f WHERE CAST(f.id AS CHAR) LIKE '%Ca%' UNION SELECT f.id FROM ps_guard_right f WHERE CAST(f.id AS CHAR) LIKE '%Ca%')"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "SELECT d.id FROM ps_guard_left d WHERE d.id = ? OR d.rhs IN (SELECT f.id FROM ps_guard_right f WHERE CAST(f.id AS CHAR) LIKE ? UNION SELECT f.id FROM ps_guard_right f WHERE CAST(f.id AS CHAR) LIKE ?)")
          (equal? bindings '(7 "%Ca%" "%Ca%"))
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected complex normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Ordered OR search uses one source key index after RecSet union"
    sql: "EXPLAIN SELECT d.id FROM ps_search_docs d WHERE d.title COLLATE utf8mb4_unicode_ci LIKE '%C%' OR d.file IN (SELECT f.id FROM ps_search_files f WHERE f.filename COLLATE utf8mb4_unicode_ci LIKE '%C%' UNION SELECT f.id FROM ps_search_files f WHERE f.search COLLATE utf8mb4_unicode_ci LIKE '%C%') ORDER BY d.sort_key LIMIT 10"
    expect:
      rows: 1
      result_contains:
        - "recset_key_index"
        - "recset_union"
        - "scan_order"
      result_not_contains:
        - "recset_project_join"
        - "touch_keytable"
        - "scan_exists"

  - name: "Broad ordered search keeps file membership in a source key index"
    sql: "SELECT d.id FROM ps_search_docs d WHERE d.title COLLATE utf8mb4_unicode_ci LIKE '%C%' OR d.file IN (SELECT f.id FROM ps_search_files f WHERE f.filename COLLATE utf8mb4_unicode_ci LIKE '%C%' UNION SELECT f.id FROM ps_search_files f WHERE f.search COLLATE utf8mb4_unicode_ci LIKE '%C%') ORDER BY d.sort_key LIMIT 10"
    expect:
      rows: 3
      data:
        - {id: 1}
        - {id: 2}
        - {id: 3}

  - name: "Second broad literal reuses the guarded shape without losing membership rows"
    sql: "SELECT d.id FROM ps_search_docs d WHERE d.title COLLATE utf8mb4_unicode_ci LIKE '%Ca%' OR d.file IN (SELECT f.id FROM ps_search_files f WHERE f.filename COLLATE utf8mb4_unicode_ci LIKE '%Ca%' UNION SELECT f.id FROM ps_search_files f WHERE f.search COLLATE utf8mb4_unicode_ci LIKE '%Ca%') ORDER BY d.sort_key LIMIT 10"
    expect:
      rows: 2
      data:
        - {id: 1}
        - {id: 2}

  - name: "Literal variants share one cached SELECT plan"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (cached_parse cache (lambda (_schema _query _policy) 7)
          "memcp-tests" "SELECT id FROM ps_test WHERE id = 1 LIMIT 1 OFFSET 0"
          nil "root" sess true)
        (cached_parse cache (lambda (_schema _query _policy) 7)
          "memcp-tests" "SELECT id FROM ps_test WHERE id = 2 LIMIT 2 OFFSET 1"
          nil "root" sess true)
        (if (and
          (equal? (count (cache)) 1)
          (equal? (sess "v1") 2)
          (equal? (sess "v2") 2)
          (equal? (sess "v3") 1))
          "ok"
          (error (concat "unexpected cache/bindings: " (count (cache)) " / " (sess "v1") "," (sess "v2") "," (sess "v3")))))
    expect:
      data: ["ok"]

  - name: "Scalar SELECT keeps inner conditions structural"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT id, (SELECT 7 FROM ps_test inner_row WHERE inner_row.id = 1 OR inner_row.score = 6 LIMIT 1) AS marker FROM ps_test outer_row WHERE outer_row.score >= 8 LIMIT 2 OFFSET 0"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "SELECT id, (SELECT 7 FROM ps_test inner_row WHERE inner_row.id = 1 OR inner_row.score = 6 LIMIT 1) AS marker FROM ps_test outer_row WHERE outer_row.score >= ? LIMIT ? OFFSET ?")
          (equal? bindings '(8 2 0))
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected nested normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Non-aggregate OR uses runtime literals"
    sql: "SELECT id FROM ps_test WHERE score >= 9 OR id = 2 ORDER BY id"
    expect:
      rows: 2
      data:
        - {id: 1}
        - {id: 2}

  - name: "Non-aggregate OR cache reuse keeps changed literals"
    sql: "SELECT id FROM ps_test WHERE score >= 10 OR id = 99 ORDER BY id"
    expect:
      rows: 0

  - name: "Root aggregate conditions remain structural"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT COUNT(*) AS cnt FROM ps_test WHERE score >= 8 OR id = 2 HAVING COUNT(*) >= 1"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "SELECT COUNT(*) AS cnt FROM ps_test WHERE score >= 8 OR id = 2 HAVING COUNT(*) >= 1")
          (equal? bindings '())
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected aggregate normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Nested aggregate conditions remain structural"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT id, (SELECT COUNT(*) FROM ps_test inner_row WHERE inner_row.score >= 6) AS matches FROM ps_test outer_row WHERE outer_row.score >= 8 LIMIT 2"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "SELECT id, (SELECT COUNT(*) FROM ps_test inner_row WHERE inner_row.score >= 6) AS matches FROM ps_test outer_row WHERE outer_row.score >= ? LIMIT ?")
          (equal? bindings '(8 2))
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected nested aggregate normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Deep correlated conditions remain structural"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT wrapped.id FROM (SELECT outer_row.id, EXISTS (SELECT TRUE FROM ps_test inner_row WHERE inner_row.id = outer_row.id AND inner_row.score >= 6 LIMIT 1) AS visible FROM ps_test outer_row) wrapped WHERE wrapped.id = 1 LIMIT 2"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "SELECT wrapped.id FROM (SELECT outer_row.id, EXISTS (SELECT TRUE FROM ps_test inner_row WHERE inner_row.id = outer_row.id AND inner_row.score >= 6 LIMIT 1) AS visible FROM ps_test outer_row) wrapped WHERE wrapped.id = ? LIMIT ?")
          (equal? bindings '(1 2))
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected deep normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Window rank conditions remain structural"
    scm: |
      (match (sql_parameterize_select_literals
        "SELECT parent_row.id FROM ps_test parent_row LEFT JOIN (SELECT id, ROW_NUMBER() OVER (ORDER BY score DESC) AS rank_no FROM ps_test) ranked ON ranked.id = parent_row.id AND ranked.rank_no = 1 LIMIT 2"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "SELECT parent_row.id FROM ps_test parent_row LEFT JOIN (SELECT id, ROW_NUMBER() OVER (ORDER BY score DESC) AS rank_no FROM ps_test) ranked ON ranked.id = parent_row.id AND ranked.rank_no = 1 LIMIT 2")
          (equal? bindings '())
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected window normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Nested literal variants share one cached SELECT plan"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (cached_parse cache (lambda (_schema _query _policy) 7)
          "memcp-tests" "SELECT wrapped.id FROM (SELECT inner_row.id FROM ps_test inner_row WHERE inner_row.score >= 6) wrapped WHERE wrapped.id >= 1 LIMIT 2"
          nil "root" sess true)
        (cached_parse cache (lambda (_schema _query _policy) 7)
          "memcp-tests" "SELECT wrapped.id FROM (SELECT inner_row.id FROM ps_test inner_row WHERE inner_row.score >= 7) wrapped WHERE wrapped.id >= 2 LIMIT 4"
          nil "root" sess true)
        (if (and
          (equal? (count (cache)) 1)
          (equal? (sess "v1") 7)
          (equal? (sess "v2") 2)
          (equal? (sess "v3") 4))
          "ok"
          (error (concat "unexpected nested cache/bindings: " (count (cache)) " / "
            (sess "v1") "," (sess "v2") "," (sess "v3")))))
    expect:
      data: ["ok"]

  - name: "Guarded plan cache lazily prepends broad LIKE variants"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (define compiles (newsession))
        (define parser (lambda (_schema _query _policy) (begin
          (define value (planner_literal_value (list (quote session) "v1")))
          (define broad (planner_broad_like_expr?
            (list (quote session) "v1")))
          (compiles (string (count (compiles))) value)
          (list (quote quote) (if broad "broad" "selective")))))
        (sess "v1" "%C%")
        (define first_formula (cached_parse cache parser "memcp-tests"
          "SELECT id FROM ps_test WHERE name LIKE ?" nil "root" sess true))
        (define first_result (with_session sess (lambda () (eval first_formula))))
        (sess "v1" "%Needle389%")
        (define second_formula (cached_parse cache parser "memcp-tests"
          "SELECT id FROM ps_test WHERE name LIKE ?" nil "root" sess true))
        (define second_result (with_session sess (lambda () (eval second_formula))))
        (sess "v1" "%AnotherSelectiveValue%")
        (define third_formula (cached_parse cache parser "memcp-tests"
          "SELECT id FROM ps_test WHERE name LIKE ?" nil "root" sess true))
        (define third_result (with_session sess (lambda () (eval third_formula))))
        (define entry (car (cache (car (cache)))))
        (define latest_formula (entry "formula"))
        (if (and
          (equal? first_result "broad")
          (equal? second_result "selective")
          (equal? third_result "selective")
          (equal? (count (compiles)) 2)
          (equal? (count (entry "variants")) 2)
          (equal? (car latest_formula) (quote if))
          (with_session sess (lambda () (eval (nth latest_formula 1)))))
          "ok"
          (error (concat "unexpected guarded cache state: " first_result "/" second_result "/" third_result
            " compiles=" (count (compiles)) " values=" (string (map (compiles) (lambda (key) (compiles key))))
            " variants=" (count (entry "variants"))))))
    expect:
      data: ["ok"]

  - name: "Variadic concat uses the same broad class at compile and runtime"
    scm: |
      (begin
        (define planning (newsession))
        (planning "v1" "Ca")
        (planning "__memcp_queryplan_compile_bindings" planning)
        (planning "__memcp_queryplan_guard_conditions" (newsession))
        (planning "__memcp_queryplan_guard_bindings" (newsession))
        (planning "__memcp_queryplan_guarded_session_keys" (newsession))
        (planning "__memcp_queryplan_observed_session_keys" (newsession))
        (define pattern (list (quote concat) "%" (list (quote session) "v1") "%"))
        (define compile_broad (with_session planning (lambda () (planner_broad_like_expr? pattern))))
        (define guard (sql_queryplan_guard_from_session planning))
        (if (and compile_broad (with_session planning (lambda () (eval guard))))
          "ok"
          (error (concat "variadic concat broad guard disagreed: " (string guard)))))
    expect:
      data: ["ok"]

  - name: "Uncovered compile bindings fall back to exact guards"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (define compiles (newsession))
        (define parser (lambda (_schema _query _policy) (begin
          (define value (planner_literal_value (list (quote session) "v1")))
          (compiles (string value) true)
          (list (quote quote) value))))
        (sess "v1" "first")
        (define first_formula (cached_parse cache parser "memcp-tests"
          "SELECT id FROM ps_test WHERE name LIKE ?" nil "root" sess true))
        (define first_result (with_session sess (lambda () (eval first_formula))))
        (sess "v1" "second")
        (define second_formula (cached_parse cache parser "memcp-tests"
          "SELECT id FROM ps_test WHERE name LIKE ?" nil "root" sess true))
        (define second_result (with_session sess (lambda () (eval second_formula))))
        (define entry (car (cache (car (cache)))))
        (if (and
          (equal? first_result "first")
          (equal? second_result "second")
          (equal? (count (compiles)) 2)
          (equal? (count (entry "variants")) 2))
          "ok"
          (error (concat "exact fallback reused a specialized plan: " first_result "/" second_result))))
    expect:
      data: ["ok"]

  - name: "Join reorder guard detects a cardinality crossover"
    scm: |
      (begin
        (define planning (newsession))
        (planning "left" 1000)
        (planning "right" 10)
        (planning "__memcp_queryplan_guard_conditions" (newsession))
        (planning "__memcp_queryplan_guard_bindings" (newsession))
        (planning "__memcp_queryplan_guarded_session_keys" (newsession))
        (planning "__memcp_queryplan_observed_session_keys" (newsession))
        (define result (with_session planning (lambda ()
          (join_order_adaptive
            (list
              (list "left" (planning "left") (list (list (quote context) "session") "left"))
              (list "right" (planning "right") (list (list (quote context) "session") "right")))
            (list (list '("left" "right") 0.01 nil nil true nil 0.01))))))
        (define guard (sql_queryplan_guard_from_session planning))
        (define initially_valid (with_session planning (lambda () (eval guard))))
        (planning "left" 10)
        (planning "right" 1000)
        (if (and
          initially_valid
          (not (with_session planning (lambda () (eval guard))))
          (equal? (qassoc_get result (quote strategy) nil) (quote dphyp)))
          "ok"
          (error (concat "join guard did not track cardinality crossover: " (string guard)))))
    expect:
      data: ["ok"]

  - name: "Cached SQL join recompiles after cardinality guard miss"
    scm: |
      (begin
        (define cache (newcachemap))
        (define sess (newsession))
        (sess "username" "root")
        (sess "schema" "memcp-tests")
        (define resultrow (lambda (_row) nil))
        (define query "SELECT l.id FROM ps_guard_left l JOIN ps_guard_right r ON r.id = l.rhs ORDER BY l.id")
        (define first_formula (cached_parse cache parse_sql "memcp-tests" query nil "root" sess true))
        (with_session sess (lambda () (eval first_formula)))
        (define entry (car (cache (car (cache)))))
        (define variants_after_first (count (entry "variants")))
        (insert (table "memcp-tests" "ps_guard_right") '("id")
          (map (produceN 500) (lambda (i) (list (+ i 2)))))
        (rebuild (table "memcp-tests" "ps_guard_right") true false)
        (define second_formula (cached_parse cache parse_sql "memcp-tests" query nil "root" sess true))
        (with_session sess (lambda () (eval second_formula)))
        (if (and (equal? variants_after_first 1) (equal? (count (entry "variants")) 2))
          "ok"
          (error (concat "unexpected statistics variants: first=" variants_after_first
            " final=" (count (entry "variants"))))))
    expect:
      data: ["ok"]

  - name: "Literal front cache stores only generalized SELECTs"
    scm: |
      (begin
        (define cache (newcachemap))
        (sql_parameterize_select_literals_cached cache
          "UPDATE ps_test SET score = 5 WHERE id = 1" true)
        (sql_parameterize_select_literals_cached cache
          "SELECT COUNT(*) FROM ps_test WHERE id = 1" true)
        (sql_parameterize_select_literals_cached cache
          "SELECT id FROM ps_test WHERE id = 1" true)
        (define cached_shape (sql_parameterize_select_literals_cached cache
          "SELECT id FROM ps_test WHERE id = 1" true))
        (if (and
          (equal? (count (cache)) 1)
          (equal? (count cached_shape) 3)
          (equal? (nth cached_shape 2) (fnv_hash (car cached_shape))))
          "ok"
          (error (concat "unexpected literal front-cache size: " (count (cache))))))
    expect:
      data: ["ok"]

  - name: "Literal equality first execution"
    sql: "SELECT id FROM ps_test WHERE id = 1"
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "Literal equality second execution"
    sql: "SELECT id FROM ps_test WHERE id = 2"
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "Projection literal keeps result metadata"
    sql: "SELECT 1, 'fixed' AS label FROM ps_test LIMIT 1"
    expect:
      rows: 1
      data:
        - {"1": 1, label: "fixed"}

  - name: "Literal normalization leaves DML exact"
    scm: |
      (match (sql_parameterize_select_literals
        "UPDATE ps_test SET score = 5 WHERE id = 1"
        true)
        '(normalized bindings shape_hash)
        (if (and
          (equal? normalized "UPDATE ps_test SET score = 5 WHERE id = 1")
          (equal? bindings '())
          (equal? shape_hash (fnv_hash normalized)))
          "ok"
          (error (concat "unexpected normalization: " normalized " / " bindings))))
    expect:
      data: ["ok"]

  - name: "Literal LIMIT and OFFSET stay execution-local"
    sql: "SELECT id FROM ps_test ORDER BY id LIMIT 1 OFFSET 0"
    expect:
      rows: 1
      data:
        - {id: 1}

  - name: "Literal LIMIT and OFFSET second execution"
    sql: "SELECT id FROM ps_test ORDER BY id LIMIT 1 OFFSET 1"
    expect:
      rows: 1
      data:
        - {id: 2}

  - name: "? placeholder: no match returns 0 rows"
    sql: "SELECT id FROM ps_test WHERE id = ?"
    params: [99]
    expect:
      rows: 0

  # --- INSERT IGNORE with ? ---

  - name: "setup ps_unique table"
    sql: "CREATE TABLE ps_unique (id int, val text, UNIQUE KEY id_unique (id))"
    expect:
      affected_rows: 1

  - name: "INSERT IGNORE with ? placeholders"
    sql: "INSERT IGNORE INTO ps_unique (id, val) VALUES (?, ?)"
    params: [1, "first"]
    expect:
      affected_rows: 1

  - name: "INSERT IGNORE duplicate with ? is silently skipped"
    sql: "INSERT IGNORE INTO ps_unique (id, val) VALUES (?, ?)"
    params: [1, "second"]
    expect:
      affected_rows: 0

  # --- ? placeholder with type coercion ---

  - name: "? placeholder string coerced to match int column"
    sql: "SELECT id FROM ps_test WHERE id = ?"
    params: ["1"]
    expect:
      rows: 1

  # --- PostgreSQL $N placeholder ---

  - name: "SELECT with $1 placeholder (psql syntax)"
    sql: "SELECT id, name FROM ps_test WHERE id = $1"
    syntax: postgresql
    params: [2]
    expect:
      rows: 1
      data:
        - {id: 2, name: "bob"}

  - name: "SELECT with $1 and $2 (psql)"
    sql: "SELECT name FROM ps_test WHERE id = $1 OR id = $2 ORDER BY id"
    syntax: postgresql
    params: [1, 2]
    expect:
      rows: 2
      data:
        - {name: "alice"}
        - {name: "bob"}

