        (run "DROP TABLE IF EXISTS publication_insert_target")
        (run "DROP TABLE IF EXISTS publication_insert_source")
        (run "CREATE TABLE publication_insert_source(id INT,payload INT)")
        (run "CREATE TABLE publication_insert_target(id INT PRIMARY KEY,payload INT)")
        (run "INSERT INTO publication_insert_source VALUES(1,11)")
        (define statement "INSERT INTO publication_insert_target(id,payload) SELECT id,payload FROM publication_insert_source")
        (run statement)
