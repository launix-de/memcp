  - name: MySQL cached INSERT rebinds a reused visible column
    scm: |-
      (begin
        (define cache (newcachemap))
        (define input (newsession))
        (input "username" "root")
        (input "schema" "memcp-tests")
        (define run (lambda (query) (begin
          (define answer (newsession))
          (answer "rows" '())
          (sql_execute_formula input nil
            (cached_parse cache "sql" (list parse_sql) "memcp-tests"
              query nil "root" input true nil)
            (lambda (row) (answer "rows"
              (append (answer "rows") (list (row "id") (row "payload")))))
            (lambda (_fields) true))
          (answer "rows"))))
        (run "DROP TABLE IF EXISTS publication_insert_target")
        (run "DROP TABLE IF EXISTS publication_insert_source")
        (run "CREATE TABLE publication_insert_target(id INT PRIMARY KEY,payload INT)")
        (define statement "INSERT INTO publication_insert_target(id,payload) VALUES(7,11)")
        (run statement)
        (define before (run "SELECT id,payload FROM publication_insert_target ORDER BY id"))
        (run "DELETE FROM publication_insert_target")
        (run "ALTER TABLE publication_insert_target DROP COLUMN payload")
        (run "ALTER TABLE publication_insert_target ADD COLUMN payload INT")
        (run statement)
        (list before (run "SELECT id,payload FROM publication_insert_target ORDER BY id")))
    expect:
      result: [[[7,11]], [[7,11]]]

  - name: MySQL cached REPLACE rebinds a reused visible column
    scm: |-
      (begin
        (define cache (newcachemap))
        (define input (newsession))
        (input "username" "root")
        (input "schema" "memcp-tests")
        (define run (lambda (query) (begin
          (define answer (newsession))
          (answer "rows" '())
          (sql_execute_formula input nil
            (cached_parse cache "sql" (list parse_sql) "memcp-tests"
              query nil "root" input true nil)
            (lambda (row) (answer "rows"
              (append (answer "rows") (list (row "id") (row "payload")))))
            (lambda (_fields) true))
          (answer "rows"))))
        (run "DROP TABLE IF EXISTS publication_insert_target")
