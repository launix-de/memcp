# LIKE operator and patterns

metadata:
  version: "1.0"
  description: "Pattern matching with % and _"

setup: []

test_cases:
  - name: "Prefix match"
    sql: "SELECT 'alpha' LIKE 'a%' AS r"
    expect:
      rows: 1
      data:
        - r: true

  - name: "LIKE is case-insensitive (MySQL default)"
    sql: "SELECT 'Alpha' LIKE 'a%' AS r"
    expect:
      rows: 1
      data:
        - r: true

  - name: "LIKE respects binary collation (case-sensitive)"
    sql: "SELECT 'Alpha' COLLATE utf8mb4_bin LIKE 'a%' AS r"
    expect:
      rows: 1
      data:
        - r: false

  - name: "= is case-insensitive (MySQL default)"
    sql: "SELECT 'Alpha' = 'alpha' AS r"
    expect:
      rows: 1
      data:
        - r: true

  - name: "<> is case-insensitive (MySQL default)"
    sql: "SELECT 'Alpha' <> 'alpha' AS r"
    expect:
      rows: 1
      data:
        - r: false

  - name: "= respects binary collation (case-sensitive)"
    sql: "SELECT 'Alpha' COLLATE utf8mb4_bin = 'alpha' AS r"
    expect:
      rows: 1
      data:
        - r: false

  - name: "<> respects binary collation (case-sensitive)"
    sql: "SELECT 'Alpha' COLLATE utf8mb4_bin <> 'alpha' AS r"
    expect:
      rows: 1
      data:
        - r: true

  - name: "Single-char match"
    sql: "SELECT 'a1' LIKE 'a_' AS r"
    expect:
      rows: 1
      data:
        - r: true

  - name: "No match"
    sql: "SELECT 'beta' LIKE 'a%' AS r"
    expect:
      rows: 1
      data:
        - r: false

  - name: "Qualified LIKE left-hand side"
    sql: |
      CREATE TABLE like_qualified (id INT PRIMARY KEY, txt VARCHAR(50))
    expect:
      affected_rows: 0
      result_contains: '"affected_rows"'

  - name: "Completed MySQL declaration is present: Qualified LIKE left-hand side"
    syntax: mysql
    sql: "SHOW CREATE TABLE like_qualified"
    expect: {rows: 1,data: [{Table: "like_qualified"}]}

  - name: "Qualified LIKE left-hand side insert"
    sql: |
      INSERT INTO like_qualified (id, txt) VALUES (1, 'alpha'), (2, 'beta')
    expect:
      affected_rows: 2

  - name: "Qualified LIKE left-hand side filter"
    sql: |
      SELECT id FROM like_qualified WHERE like_qualified.txt LIKE 'a%' ORDER BY id
    expect:
      rows: 1
      data:
        - id: 1

  # --- NOT LIKE ---
  - name: "Create NOT LIKE test table"
    sql: "CREATE TABLE notlike_test (id INT PRIMARY KEY, name VARCHAR(50))"

  - name: "Insert NOT LIKE test data"
    sql: |
      INSERT INTO notlike_test (id, name) VALUES
        (1, 'Brand#23'), (2, 'Brand#45'), (3, 'Generic'),
        (4, 'Brand#12'), (5, 'NoName'), (6, 'Brand#99'),
        (7, 'Special'), (8, 'Brand#23'), (9, NULL)

  - name: "NOT LIKE basic"
    sql: "SELECT id FROM notlike_test WHERE name NOT LIKE 'Brand%' ORDER BY id"
    expect:
      rows: 3
      data:
        - id: 3
        - id: 5
        - id: 7

  - name: "NOT LIKE with underscore wildcard"
    sql: "SELECT id FROM notlike_test WHERE name NOT LIKE 'Brand#__' ORDER BY id"
    expect:
      rows: 3
      data:
        - id: 3
        - id: 5
        - id: 7

  - name: "Prefix NOT applies after qualified collated LIKE"
    sql: |
      SELECT id
      FROM notlike_test AS item
      WHERE NOT (item.name) COLLATE utf8mb4_unicode_ci LIKE 'Brand%'
      ORDER BY id
    expect:
      rows: 3
      data:
        - id: 3
        - id: 5
        - id: 7

  - name: "Prefix NOT LIKE preserves UNKNOWN"
    sql: |
      SELECT NOT (value) COLLATE utf8mb4_unicode_ci LIKE 'Brand%' AS matches
      FROM (SELECT NULL AS value) AS nullable_value
    expect:
      rows: 1
      data:
        - matches: null

  - name: "Prefix NOT binds below predicates and above boolean operators"
    sql: |
      SELECT
        NOT 2 = 1 AS comparison_result,
        NOT 4 BETWEEN 1 AND 3 AS between_result,
        NOT 4 IN (1, 2, 3) AS in_result,
        NOT 0 AND 0 AS and_result,
        NOT 0 OR 0 AS or_result
    expect:
      rows: 1
      data:
        - comparison_result: true
          between_result: true
          in_result: true
          and_result: false
          or_result: true

  - name: Custom LIKE escape protects wildcard characters
    sql: SELECT 'a%b' LIKE 'a!%b' ESCAPE '!' AS r
    expect: {data: [{r: true}]}
  - name: Custom NOT LIKE escape preserves ordinary wildcard matching
    sql: SELECT 'a_b' NOT LIKE 'a!_b' ESCAPE '!' AS r
    expect: {data: [{r: false}]}
  - name: Custom LIKE escape preserves a literal backslash
    sql: SELECT 'a\\b' LIKE 'a\\b' ESCAPE '!' AS r
    expect: {data: [{r: true}]}
  - name: Empty LIKE escape leaves percent as a wildcard
    sql: SELECT 'abcdef' LIKE 'a%f' ESCAPE '' AS r
    expect: {data: [{r: true}]}
  - name: Unicode LIKE escape is one character
    sql: SELECT 'a%b' LIKE 'aö%b' ESCAPE 'ö' AS r
    expect: {data: [{r: true}]}
  - name: NULL LIKE pattern propagates NULL
    sql: SELECT 'a' LIKE NULL ESCAPE '!' AS r
    expect: {data: [{r: null}]}
  - name: NULL LIKE escape propagates NULL
    sql: SELECT 'a' LIKE 'a' ESCAPE NULL AS r
    expect: {data: [{r: null}]}
  - name: LIKE escape with multiple characters is rejected
    sql: SELECT 'a' LIKE 'a' ESCAPE '!!' AS r
    expect: {error: true}
  - name: MySQL control escapes decode before literal parameterization
    sql: SELECT '\Z'=0x1a AS z, '\b'=0x08 AS b, '\t'=0x09 AS t
    expect: {data: [{z: true, b: true, t: true}]}

  - name: Unicode escape is recognized before case folding
    sql: SELECT 'a_b' LIKE 'aÄ_b' ESCAPE 'Ä' AS matched
    expect: {data: [{matched: true}]}
  - name: Percent itself may be the escape character
    sql: SELECT 'a%b' LIKE 'a%%b' ESCAPE '%' AS matched
    expect: {data: [{matched: true}]}
  - name: Empty escape leaves backslash literal
    sql: SELECT 'a\\xb' LIKE 'a\\_b' ESCAPE '' AS matched
    expect: {data: [{matched: true}]}
  - name: Multicharacter LIKE escape is rejected
    sql: SELECT 'abc' LIKE 'abc' ESCAPE 'ab'
    expect: {error: true}

cleanup:
  - sql: "DROP TABLE IF EXISTS like_qualified"
  - sql: "DROP TABLE IF EXISTS notlike_test"
