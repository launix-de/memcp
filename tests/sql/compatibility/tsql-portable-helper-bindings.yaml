metadata:
  syntax: tsql
  requires_tds: true
  description: Portable frontend helpers retain explicit scalar and permission bindings
# Use the existing Scmer JSON and source procedure codecs to restore numbered locals.
# Decode an outer lambda whose body is the closed procedure, then invoke it
# with hostile helper bindings. Nested lambda syntax is reconstructed in that
# actual lexical frame, so a missing explicit capture cannot use Globalenv as
# a fallback. Actual worker transport remains covered by cluster contracts.
setup:
- sql: CREATE TABLE portable_slice_inputs(id INT PRIMARY KEY,label NVARCHAR(9))
- sql: INSERT portable_slice_inputs VALUES(1,N'abcd')
cleanup:
- sql: DROP TABLE IF EXISTS portable_slice_inputs
test_cases:
- name: Cursor input adapters preserve the bare caller connection and identity scope owners
  scm: |
    (begin
      (define parent (newsession))
      (define request (tsql_cursor_input_session parent))
      (define nested (tsql_cursor_input_session request))
      (and (identical? (tsql_connection_session request) parent)
        (identical? (tsql_identity_scope request) parent)
        (identical? (tsql_connection_session nested) parent)
        (identical? (tsql_identity_scope nested) parent)
        (empty_list? (request)) (empty_list? (parent))))
  expect: {result: true}
- name: Cursor input sessions retain their complete status binding chain after serialization
  scm: |
    (begin
      (define names (list 'tsql_cursor_status 'tsql_cursor_variable_entries 'tsql_cursor_entries
        'tsql_cursor_directory 'tsql_cursor_key 'tsql_connection_session 'tsql_identity_scope))
      (define wire (json_encode (list 'lambda names (close_procedure tsql_cursor_input_session))))
      (define restored (apply (json_decode_scmer wire)
        (map names (lambda (_name) (lambda args (error "unbound cursor helper"))))))
      (define parent (newsession)) (parent "ordinary" 41)
      (define scope (newsession)) (parent "__tsql_scope" scope)
      (define connection (newsession)) (parent "__tsql_connection_session" connection)
      (define cursor (newsession)) (cursor "open" true) (cursor "count" 2)
      (cursor "options" (list "kind" "static"))
      (scope "__tsql_local_cursors" (list (list "local_probe" cursor)))
      (connection "__tsql_global_cursors" (list (list "global_probe" cursor)))
      (scope "__tsql_cursor_variables" (list (list "probe" cursor)))
      (define request (restored parent))
      (define status (lambda (kind name)
        (request (concat "__tsql_cursor_status:" (json_encode (list kind name))))))
      (request "ordinary" 42)
      (and (equal? (request "ordinary") 42) (equal? (parent "ordinary") 42)
        (equal? (count (request)) (count (parent)))
        (equal? (status "local" "LOCAL_PROBE") 1)
        (equal? (status "global" "GLOBAL_PROBE") 1)
        (equal? (status "variable" "@PROBE") 1)
        (equal? (status "local" "absent") -3))))
  expect: {result: true}
- name: Message session factory retains its explicit connection helper after serialization
  scm: |
    (begin
      (define wire (json_encode (list 'lambda (list 'tsql_connection_session) (close_procedure tsql_message_session))))
      (define restored ((json_decode_scmer wire)
        (lambda (_session) (error "unbound connection helper"))))
      (define parent (newsession)) (parent "username" "root") (parent "__tsql_language" "Deutsch")
      (define output (newsession))
      (define scoped (restored parent (lambda (message) (output "message" message))))
      ((scoped "__tsql_message") (list "text" "notice"))
      (and (identical? (scoped "__tsql_connection_session") parent)
        (equal? (scoped "username") "root") (equal? (scoped "__tsql_language") "Deutsch")
        (not (has? (scoped) "__tsql_message")) (equal? ((output "message") "text") "notice")))
  expect: {result: true}
- name: Portable permission expressions retain the native database check
  scm: |
    (begin
      (define planning (newsession))
      (planning "__tsql_database_access_requirements"
        (list (list (list "root" (tsql_account_id "root")) "memcp-tests" "DATABASE ACCESS")))
      (define formula (tsql_permission_formula (list '+ 1 2) planning))
      (define wire (json_encode (list 'lambda (list 'tsql_require_permission)
        (close_procedure (eval (list 'lambda '() formula))))))
      (define restored ((json_decode_scmer wire)
        (lambda args (error "unbound permission helper"))))
      (equal? (restored) 3))
  expect: {result: true}
- name: Portable permission checks still reject stale account identities
  scm: |
    (begin
      (define planning (newsession))
      (planning "__tsql_database_access_requirements"
        (list (list (list "root" "stale-account-incarnation") "memcp-tests" "DATABASE ACCESS")))
      (define formula (tsql_permission_formula true planning))
      (define restored (json_decode_scmer (json_encode (close_procedure (eval (list 'lambda '() formula))))))
      (try (lambda () (begin (restored) false))
        (lambda (cause) (equal? (failure_value cause) "access denied: database memcp-tests"))))
  expect: {result: true}
- name: Temporal style output retains its fractional formatter binding
  scm: |
    (begin
      (define wire (json_encode (list 'lambda (list 'tsql_temporal_fraction_text) (close_procedure tsql_temporal_style_output))))
      (define restored ((json_decode_scmer wire)
        (lambda args (error "unbound fractional helper"))))
      (equal? (restored (date_from_parts 1767268800 3000000 0) "%Y-%m-%d %H:%i:%s" 3 true false)
        "2026-01-01 12:00:00.003"))
  expect: {result: true}
- name: Numeric calendar text retains its complete parser closure and dateformat argument
  scm: |
    (begin
      (define wire (json_encode (list 'lambda (list 'tsql_datetime_text 'tsql_raise_error) (close_procedure tsql_calendar_text))))
      (define restored ((json_decode_scmer wire)
        (lambda args (error "unbound parser helper")) (lambda args (error "unbound error helper"))))
      (and (equal? (format_date (restored " 1 . 2 . 2026 " "mdy" "us_english" true) "%Y-%m-%d") "2026-01-02")
        (equal? (format_date (restored " 1 . 2 . 2026 " "dmy" "Deutsch" true) "%Y-%m-%d") "2026-02-01")))
  expect: {result: true}
- name: Named calendar parser retains language data and clock helpers transitively
  scm: |
    (begin
      (define wire (json_encode (list 'lambda
        (list 'tsql_named_date 'tsql_numeric_date 'tsql_english_clock 'tsql_english_date_parts)
        (close_procedure tsql_datetime_text))))
      (define restored ((json_decode_scmer wire) (lambda args (error "unbound named helper"))
        (lambda args (error "unbound numeric helper")) (lambda args (error "unbound clock helper"))
        (lambda args (error "unbound date field helper"))))
      (and (equal? (restored "1 Januar 2026 12:03:04" "dmy" "Deutsch" true) "2026-01-01 12:03:04")
        (equal? (restored "Jan 1 2026 1:03PM" "mdy" "us_english" true) "2026-01-01 13:03:00")))
  expect: {result: true}
- name: Closed calendar conversion retains its original SQL error on invalid dates
  scm: |
    (begin
      (define restored (json_decode_scmer (json_encode (close_procedure tsql_calendar_text))))
      (try (lambda () (begin (restored "31.02.2026" "dmy" "Deutsch" true) false))
        (lambda (cause) (equal? (car cause) "tsql-error"))))
  expect: {result: true}
- name: Closed legacy day shift retains its fractional carry and overflow raiser
  scm: |
    (begin
      (define restored (json_decode_scmer (json_encode (close_procedure tsql_shift_numeric_days))))
      (and (equal? (format_date (restored (parse_date "2026-01-02 12:00:00") 0.5 -1) "%Y-%m-%d %H:%i:%s")
          "2026-01-02 00:00:00")
        (try (lambda () (begin (restored (parse_date "2026-01-01") 7000000 1) false))
          (lambda (cause) (equal? (car cause) "tsql-error")))))
  expect: {result: true}
- name: Calendar conversion retains its transitive empty-list helper in a hostile lexical scope
  scm: |
    (begin
      (define wire (json_encode (list 'lambda (list 'empty_list?)
        (close_procedure tsql_calendar_text))))
      (define restored ((json_decode_scmer wire)
        (lambda args (error "unbound empty-list helper"))))
      (and (nil? (restored nil "dmy" "Deutsch" true))
        (equal? (format_date (restored "1.2.2026" "dmy" "Deutsch" true) "%Y-%m-%d") "2026-02-01")
        (equal? (format_date (restored "Jan 1 2026 1:03PM" "mdy" "us_english" true) "%Y-%m-%d %H:%i:%s")
          "2026-01-01 13:03:00")))
  expect: {result: true}
- name: Compiled slicing expressions carry their actual helper values and UTF16 boundaries
  scm: |
    (begin
      (define names (list 'tsql_left 'tsql_right 'tsql_substring 'tsql_slice_prefix))
      (define run (lambda (name arguments)
        (begin
          (define formula (sql_type_lower_annotations '()
            (sql_info_formula (tsql_compile_slicing name arguments))))
          (define code (publish_queryplan_callables formula '()))
          (define wire (serialize (list 'lambda names
            (close_procedure (eval (optimize (list 'lambda (list 'session) code)))))))
          (define restored (apply
            (apply (eval (optimize (list 'lambda '() (scheme wire)))) '())
            (map names (lambda (_name) (lambda args (error "unbound slicing helper"))))))
          (define input (newsession)) (input "text" "A😀BC")
          (restored input))))
      (define text (sql_info (list 'session "text") (list "NVARCHAR" (list 8)) '("utf8mb4_general_ci" 2)))
      (list (run "LEFT" (list text (sql_info 3 "INT" nil)))
        (run "RIGHT" (list text (sql_info 4 "INT" nil)))
        (run "SUBSTRING" (list text (sql_info 2 "INT" nil) (sql_info 2 "INT" nil))))))
  expect: {result: ['A😀','😀BC','😀']}
- name: Serialized slicing helpers retain NULL zero and invalid-length semantics
  scm: |
    (begin
      (define names (list 'tsql_slice_prefix))
      (define restore (lambda (helper)
        ((json_decode_scmer (json_encode (list 'lambda names (close_procedure helper))))
          (lambda args (error "unbound prefix helper")))))
      (define left (restore tsql_left))
      (define right (restore tsql_right))
      (define substring (restore tsql_substring))
      (and (nil? (left nil 2)) (nil? (right "abc" nil)) (nil? (substring "abc" nil 2 false))
        (equal? (right "abc" 0) "") (equal? (left "abc" 9) "abc")
        (equal? (substring "abc" 0 2 false) "a")
        (try (lambda () (begin (right "abc" -1) false))
          (lambda (cause) (equal? (failure_value cause) "RIGHT length must be nonnegative")))))
  expect: {result: true}
- name: Portable slicing keeps the declared national result widths
  tds:
    statements:
    - sql: SELECT LEFT(label,2) AS prefix,RIGHT(label,2) AS suffix,SUBSTRING(label,2,2) AS middle FROM portable_slice_inputs WHERE id=1
      expect:
        rows: 1
        data: [{prefix: ab,suffix: cd,middle: bc}]
        column_types:
        - {name: prefix,type: NVARCHAR,length: 9}
        - {name: suffix,type: NVARCHAR,length: 9}
        - {name: middle,type: NVARCHAR,length: 9}
- name: Declared NULLIF comparison keeps its actual callable under hostile names
  scm: "(begin\n  (define declaration (list \"NVARCHAR\" (list 8)))\n  (define collation\
    \ '(\"utf8mb4_bin\" 2))\n  (define left (sql_info (list 'session \"left\") declaration\
    \ collation))\n  (define right (sql_info (list 'session \"right\") declaration\
    \ collation))\n  (define formula (sql_type_lower_annotations '()\n    (sql_info_formula\
    \ (tsql_compile_nullif (list left right)))))\n  (define code (publish_queryplan_callables\
    \ formula '()))\n  (define wire (serialize (list 'lambda (list 'sql_compare)\n\
    \    (close_procedure (eval (optimize (list 'lambda (list 'session) code)))))))\n\
    \  (define restored (apply\n    (apply (eval (optimize (list 'lambda '() (scheme\
    \ wire)))) '())\n    (list (lambda args (error \"unbound comparison helper\")))))\n\
    \  (map (list (list \"A\" \"A\") (list \"A\" \"B\") (list nil \"A\") (list \"\
    A\" nil) (list \"A\" \"a\"))\n    (lambda (pair) (begin\n      (define input (newsession))\n\
    \      (input \"left\" (car pair)) (input \"right\" (cadr pair))\n      (restored\
    \ input)))))\n"
  expect:
    result:
    - null
    - A
    - null
    - A
    - A
- name: Known comparison callable keeps the declared SQL Boolean contract
  scm: "(list\n  (sql_info_type (sql_expr_info '() (list sql_compare \"A\" \"B\" (collate\
    \ \"utf8mb4_bin\" false) \"<\")))\n  (sql_info_type (sql_expr_info '() (list 'sql_compare\
    \ \"A\" \"B\" (collate \"utf8mb4_bin\" false) \"<\"))))\n"
  expect:
    result:
    - BOOLEAN
    - BOOLEAN
