# Raw RPC hex contains ordinary ALL_HEADERS + sp_executesql + explicitly typed parameters.
metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: Declared GUID scalars retain real GUIDTYPE metadata, bytes and typed NULL across TCP and RPC
setup:
- sql: CREATE TABLE guid_wire_values(id INT PRIMARY KEY,value UNIQUEIDENTIFIER)
- sql: INSERT guid_wire_values VALUES(1,'00112233-4455-6677-8899-aabbccddeeff'),(2,NULL)
cleanup:
- sql: DROP TABLE IF EXISTS guid_wire_values
test_cases:
- name: Released TCP client sees GUIDTYPE and correct mixed endian bytes
  tds:
    statements:
    - sql: SELECT value FROM guid_wire_values WHERE id=1
      expect:
        rows: 1
        data:
        - value:
            binary_hex: 33221100554477668899aabbccddeeff
        column_types:
        - name: value
          type: UNIQUEIDENTIFIER
          nullable: true
- name: Typed NULL retains GUIDTYPE without a textual fallback
  tds:
    statements:
    - sql: SELECT CAST(NULL AS UNIQUEIDENTIFIER) AS value
      expect:
        rows: 1
        data:
        - value: null
        column_types:
        - name: value
          type: UNIQUEIDENTIFIER
          nullable: true
- name: Empty GUID result retains declaration metadata
  tds:
    statements:
    - sql: SELECT TOP(0) value FROM guid_wire_values
      expect:
        rows: 0
        column_types:
        - name: value
          type: UNIQUEIDENTIFIER
          nullable: true
- name: Prepared GUID projection retains native metadata and bytes
  tds:
    statements:
    - sql: SELECT value FROM guid_wire_values WHERE id=1
      prepare: true
      expect:
        rows: 1
        data:
        - value:
            binary_hex: 33221100554477668899aabbccddeeff
        column_types:
        - name: value
          type: UNIQUEIDENTIFIER
          nullable: true
- name: Pure prepared description validates a GUID projection without rows
  tds:
    statements:
    - sql: SELECT value FROM guid_wire_values
      prepare_only: true
      expect: {}
- name: GUID cast owns its result type even with textual input
  tds:
    statements:
    - sql: SELECT CAST(N'00112233-4455-6677-8899-aabbccddeeff' AS UNIQUEIDENTIFIER) AS value
      expect:
        rows: 1
        data:
        - value:
            binary_hex: 33221100554477668899aabbccddeeff
        column_types:
        - name: value
          type: UNIQUEIDENTIFIER
- name: Frontend GUID boundary uses existing canonical UUID carriers
  scm: "(begin\n  (define declaration (tsql_wire_contract \"UNIQUEIDENTIFIER\" '()))\n  (define parameter (list\
    \ \"type\" declaration \"value\" (hex2bin \"00112233445566778899aabbccddeeff\")))\n  (and (equal? (declaration\
    \ \"kind\") 36) (equal? (declaration \"size\") 16)\n    (equal? (string (tds_parameter_value parameter)) \"\
    00112233-4455-6677-8899-aabbccddeeff\")\n    (equal? (bin2hex ((tds_result_value declaration (tds_parameter_value\
    \ parameter)) \"bytes\")) \"00112233445566778899aabbccddeeff\")))"
  expect:
    result: true
- name: Frontend rejects forged GUID payload width before parameter installation
  scm: "(try (lambda () (tds_parameter_value (list \"type\" (list \"kind\" 36 \"size\" 16) \"value\" (hex2bin \"\
    000102\"))))\n  (lambda (error) (regexp_test error \"exactly 16 bytes\")))"
  expect:
    result: true
- name: Real GUID RPC parameter round trips all mixed endian groups
  tds:
    rpc_packets:
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101033221100554477668899aabbccddeeff
      contains_hex:
      - '2410017600'
      - d11033221100554477668899aabbccddeeff
- name: Zero GUID value remains distinct from SQL NULL on the wire
  tds:
    rpc_packets:
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101000000000000000000000000000000000
      contains_hex:
      - d11000000000000000000000000000000000
- name: Typed GUID RPC NULL preserves its declared descriptor
  tds:
    rpc_packets:
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e0054004900460049004500520001760000241000
      contains_hex:
      - '2410017600'
      - d100
- name: Protocol zero width GUID descriptor represents only typed NULL
  tds:
    rpc_packets:
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e0054004900460049004500520001760000240000
      contains_hex:
      - '2410017600'
      - d100
- name: Invalid GUID declaration length fails before execution
  tds:
    rpc_packets:
    - payload_hex: 
      error: true
      contains:
      - invalid TDS GUID length
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101033221100554477668899aabbccddeeff
      contains_hex:
      - d11033221100554477668899aabbccddeeff
- name: Short GUID instance length fails before execution
  tds:
    rpc_packets:
    - payload_hex: 
      error: true
      contains:
      - invalid TDS GUID length
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101033221100554477668899aabbccddeeff
      contains_hex:
      - d11033221100554477668899aabbccddeeff
- name: Oversized GUID instance length fails before execution
  tds:
    rpc_packets:
    - payload_hex: 
      error: true
      contains:
      - invalid TDS GUID length
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101033221100554477668899aabbccddeeff
      contains_hex:
      - d11033221100554477668899aabbccddeeff
- name: Truncated sixteen byte GUID payload is rejected
  tds:
    rpc_packets:
    - payload_hex: 
      error: true
      contains:
      - unexpected EOF
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101033221100554477668899aabbccddeeff
      contains_hex:
      - d11033221100554477668899aabbccddeeff
- name: GUID NULL never bypasses invalid descriptor width
  tds:
    rpc_packets:
    - payload_hex: 
      error: true
      contains:
      - invalid TDS GUID length
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101033221100554477668899aabbccddeeff
      contains_hex:
      - d11033221100554477668899aabbccddeeff
- name: Standalone GUID support does not admit GUID inside SQL VARIANT
  tds:
    rpc_packets:
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e71c000904d000341c00400076002000530051004c005f00560041005200490041004e0054000176000062501f000012000000240033221100554477668899aabbccddeeff
      error: true
      contains:
      - unsupported sql_variant
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024101033221100554477668899aabbccddeeff
      contains_hex:
      - d11033221100554477668899aabbccddeeff
- name: Zero width GUID descriptor never admits a non NULL instance
  tds:
    rpc_packets:
    - payload_hex: 16000000120000000200000000000000000001000000ffff0a0000000000e71c000904d000341c00530045004c00450043005400200040007600200041005300200076000000e726000904d00034260040007600200055004e0049005100550045004900440045004e005400490046004900450052000176000024001033221100554477668899aabbccddeeff
      error: true
      contains:
      - invalid TDS GUID length
- name: Malformed GUID RPCs left no partially executed inserts
  sql: SELECT COUNT(*) AS total FROM guid_wire_values WHERE id=99
  expect:
    rows: 1
    data:
    - total: 0
