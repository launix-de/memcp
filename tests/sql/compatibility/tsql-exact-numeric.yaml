- name: ROUND empty descriptions preserve each declared return family
  scm: "(begin\n  (define fields (tds_describe \"memcp-tests\"\n    \"SELECT TOP(0) ROUND(CAST(NULL AS TINYINT),0) AS t,ROUND(CAST(NULL\
    \ AS SMALLINT),0) AS s,ROUND(CAST(NULL AS INT),0) AS i,ROUND(CAST(NULL AS BIGINT),0) AS b,ROUND(CAST(NULL AS REAL),0) AS r,ROUND(CAST(NULL\
    \ AS FLOAT),0) AS f,ROUND(CAST(NULL AS SMALLMONEY),0) AS sm,ROUND(CAST(NULL AS MONEY),0) AS m\" \"\" (newsession)))\n  (if\
    \ (and\n    (equal? (map fields (lambda (field) (field \"sql_type\"))) '(\"INT\" \"INT\" \"INT\" \"BIGINT\" \"FLOAT\" \"FLOAT\"\
    \ \"MONEY\" \"MONEY\"))\n    (equal? (map fields (lambda (field) (field \"kind\"))) '(38 38 38 38 109 109 110 110))\n    (equal?\
    \ (map fields (lambda (field) (field \"size\"))) '(4 4 4 8 8 8 8 8))) true\n    (error \"ROUND result family or width was not\
