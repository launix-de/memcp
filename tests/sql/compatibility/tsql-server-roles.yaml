metadata:
  version: '1.0'
  description: T-SQL server role membership follows native account state and visibility
  syntax: tsql
  requires_tds: true
  isolated: true
setup:
- scm: (eval (parse_sql "memcp-tests" "DROP USER IF EXISTS role_reader" nil (newsession) nil))
- scm: (eval (parse_sql "memcp-tests" "CREATE USER role_reader IDENTIFIED BY 'pw'" nil (newsession) nil))
- scm: (eval (parse_sql "memcp-tests" "GRANT ALL ON `memcp-tests`.* TO role_reader" nil))
cleanup:
- scm: (eval (parse_sql "memcp-tests" "DROP USER IF EXISTS role_reader" nil (newsession) nil))
test_cases:
- name: Current administrator belongs to sysadmin and public
  sql: SELECT IS_SRVROLEMEMBER('sysadmin') AS admin, IS_SRVROLEMEMBER(N'PUBLIC') AS everyone
  expect: {rows: 1, data: [{admin: 1, everyone: 1}]}
- name: Administrator can inspect another native account
  sql: SELECT IS_SRVROLEMEMBER('sysadmin','role_reader') AS admin, IS_SRVROLEMEMBER('public','role_reader') AS everyone
  expect: {rows: 1, data: [{admin: 0, everyone: 1}]}
- name: Unknown roles and accounts return NULL
  sql: SELECT IS_SRVROLEMEMBER('missing_role') AS role, IS_SRVROLEMEMBER('sysadmin','missing_login') AS login
  expect: {rows: 1, data: [{role: null, login: null}]}
- name: Explicit NULL arguments return NULL
  sql: SELECT IS_SRVROLEMEMBER(NULL) AS role, IS_SRVROLEMEMBER('sysadmin',NULL) AS login
  expect: {rows: 1, data: [{role: null, login: null}]}
- name: Administrator membership does not imply membership in other fixed roles
  sql: SELECT IS_SRVROLEMEMBER('serveradmin') AS a, IS_SRVROLEMEMBER('securityadmin') AS b, IS_SRVROLEMEMBER('processadmin') AS c, IS_SRVROLEMEMBER('setupadmin') AS d, IS_SRVROLEMEMBER('bulkadmin') AS e, IS_SRVROLEMEMBER('diskadmin') AS f, IS_SRVROLEMEMBER('dbcreator') AS g
  expect: {rows: 1, data: [{a: 0, b: 0, c: 0, d: 0, e: 0, f: 0, g: 0}]}
- name: Nonadministrator sees its own membership
  username: role_reader
  password: pw
  sql: SELECT IS_SRVROLEMEMBER('sysadmin') AS admin, IS_SRVROLEMEMBER('public','role_reader') AS everyone
  expect: {rows: 1, data: [{admin: 0, everyone: 1}]}
- name: Nonadministrator cannot inspect another account
  username: role_reader
  password: pw
  sql: SELECT IS_SRVROLEMEMBER('sysadmin','root') AS admin
  expect: {rows: 1, data: [{admin: null}]}
- name: SQL expressions supply role names
  sql: DECLARE @role NVARCHAR(128) = N'SySADMIN'; SELECT IS_SRVROLEMEMBER(@role) AS admin
  expect: {rows: 1, data: [{admin: 1}]}
- name: TDS result has declared INT metadata including NULL and prepared execution
  tds:
    statements:
    - sql: SELECT IS_SRVROLEMEMBER('sysadmin') AS member
      expect: {rows: 1, data: [{member: 1}], column_types: [{name: member, type: INT}]}
    - sql: SELECT IS_SRVROLEMEMBER(NULL) AS member
      expect: {rows: 1, data: [{member: null}], column_types: [{name: member, type: INT}]}
    - sql: SELECT IS_SRVROLEMEMBER(@role) AS member
      prepare: true
      parameters: [{name: role, value: sysadmin}]
      expect: {rows: 1, data: [{member: 1}], column_types: [{name: member, type: INT}]}
- name: Grant native administrator membership
  scm: (eval (parse_sql "memcp-tests" "GRANT ALL ON *.* TO role_reader" nil (newsession) nil))
- name: Cached probe observes a new administrator grant
  sql: SELECT IS_SRVROLEMEMBER('sysadmin','role_reader') AS admin
  expect: {rows: 1, data: [{admin: 1}]}
- name: Revoke native administrator membership
  scm: (eval (parse_sql "memcp-tests" "REVOKE ALL ON *.* FROM role_reader" nil (newsession) nil))
- name: Cached probe observes administrator revocation
  sql: SELECT IS_SRVROLEMEMBER('sysadmin','role_reader') AS admin
  expect: {rows: 1, data: [{admin: 0}]}
- name: Role argument is required
  sql: SELECT IS_SRVROLEMEMBER()
  expect: {error: true}
- name: Additional arguments are rejected
  sql: SELECT IS_SRVROLEMEMBER('sysadmin','root','extra')
  expect: {error: true}
- name: Parameterized ANSI role probes use the authenticated invocation context
  sql: EXEC sp_executesql N'SELECT IS_SRVROLEMEMBER(@role) AS member', N'@role VARCHAR(1024)', @role='sysadmin'
  expect: {rows: 1, data: [{member: 1}]}
- name: Session collation profile is explicit frontend data
  scm: (equal? tsql_session_collation (hex2bin "0904d00034"))
  expect: {result: true}
- name: Current administrator has database owner and public membership
  sql: SELECT IS_MEMBER('db_owner') AS owner, IS_MEMBER(N'PUBLIC') AS everyone
  expect: {rows: 1, data: [{owner: 1, everyone: 1}]}
- name: Native database member has all database authority without server administration
  username: role_reader
  password: pw
  sql: SELECT IS_MEMBER('db_owner') AS owner, IS_MEMBER('public') AS everyone, IS_SRVROLEMEMBER('sysadmin') AS admin
  expect: {rows: 1, data: [{owner: 1, everyone: 1, admin: 0}]}
- name: Database ownership does not invent separate fixed role memberships
  sql: SELECT IS_MEMBER('db_datareader') AS reader, IS_MEMBER('db_datawriter') AS writer, IS_MEMBER('db_denydatawriter') AS denied
  expect: {rows: 1, data: [{reader: 0, writer: 0, denied: 0}]}
- name: Unknown groups server roles and NULL have no database membership result
  sql: SELECT IS_MEMBER('missing_group') AS missing, IS_MEMBER('sysadmin') AS server_role, IS_MEMBER(NULL) AS absent
  expect: {rows: 1, data: [{missing: null, server_role: null, absent: null}]}
- name: Database role expressions retain declared INT metadata over TDS
  tds:
    username: role_reader
    password: pw
    statements:
    - sql: SELECT IS_MEMBER(@role) AS member
      prepare: true
      parameters: [{name: role, value: dB_OwNeR}]
      expect: {rows: 1, data: [{member: 1}], column_types: [{name: member, type: INT}]}
    - sql: SELECT IS_MEMBER(NULL) AS member
      expect: {rows: 1, data: [{member: null}], column_types: [{name: member, type: INT}]}
- name: Membership probe reads actual grant revocation and account incarnation
  scm: |
    (begin
      (define actor (list "role_reader" (tsql_account_id "role_reader")))
      (define before (tsql_is_member "db_owner" "memcp-tests" actor))
      (eval (parse_sql "memcp-tests" "REVOKE ALL ON `memcp-tests`.* FROM role_reader" nil))
      (define revoked (tsql_is_member "db_owner" "memcp-tests" actor))
      (eval (parse_sql "memcp-tests" "GRANT ALL ON `memcp-tests`.* TO role_reader" nil))
      (and (equal? before 1) (equal? revoked 0)
        (equal? (tsql_is_member "db_owner" "memcp-tests" actor) 1)
        (equal? (tsql_is_member "db_owner" "memcp-tests" (list "role_reader" "obsolete-incarnation")) 0)))
  expect: {result: true}
- name: Database role probe requires exactly one argument
  sql: SELECT IS_MEMBER()
  expect: {error: true}
- name: Database role probe cannot inspect a second principal
  sql: SELECT IS_MEMBER('db_owner','root')
  expect: {error: true}
