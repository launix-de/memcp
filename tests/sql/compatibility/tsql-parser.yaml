    (begin
      (define cache (newcachemap))
      (define run (lambda (declaration) (begin
        (define s (newsession))
        (s "tsql_bound:v" true)
        (s "tsql_param:v" nil)
        (s "tsql_param_type:v" declaration)
        (define output (newsession))
        (define formula (cached_parse cache (list parse_tsql) "memcp-tests" "SELECT TOP (0) @v AS value" nil "root" s false nil))
        (sql_execute_formula s nil formula (lambda rows true)
          (lambda args (if (> (count args) 1) (output "field" (car (cadr args))) true)))
        (define field (output "field"))
        (list (field "sql_type") (field "precision") (field "scale")))))
      (define first (run '("DECIMAL" 38 10)))
      (define second (run '("DECIMAL" 18 4)))
      (define repeated (run '("DECIMAL" 38 10)))
      (define time (run '("TIME" 2)))
      (if (and (equal? first '("DECIMAL" 38 10)) (equal? second '("DECIMAL" 18 4))
          (equal? repeated first) (equal? time '("TIME" nil 2)) (equal? (count (cache)) 3)) true
        (error "exact cache reused stale input type precision")))
