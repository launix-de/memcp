  scm: |
    (begin
      (define s (newsession))
      (define execute (lambda (sql) (begin
        (define output (newsession))
        (with_autocommit s nil nil sql (lambda (tx)
          (sql_execute_formula s tx (sql_queryplan_compile_formula tx (parse_tsql "memcp-tests" sql nil s tx))
            (lambda (row) (output "row" row)) (lambda fields true))))
        (output "row"))))
      (execute "CREATE TABLE dbo.tsql_identity_failure(id BIGINT IDENTITY(1,1) PRIMARY KEY,v INT UNIQUE)")
      (define failed (try (lambda () (begin (execute "INSERT INTO dbo.tsql_identity_failure(v) SELECT 10 UNION ALL SELECT 10") false)) (lambda (_) true)))
      (if failed true (error "duplicate source row unexpectedly succeeded"))
      (define remaining (execute "SELECT COUNT(*) AS n FROM dbo.tsql_identity_failure"))
      (define observed (execute "SELECT @@IDENTITY AS last_id,SCOPE_IDENTITY() AS scoped"))
      (if (and (equal? (remaining "n") 0) (equal? (observed "last_id") 1) (equal? (observed "scoped") 1))
        true (error "failed insert lost its consumed identity or retained its row"))
      (execute "INSERT INTO dbo.tsql_identity_failure(v) VALUES(42)")
      (define next (execute "SELECT id FROM dbo.tsql_identity_failure"))
      (if (equal? (next "id") 2) true (error "failed insert reused a consumed identity"))
      (execute "DROP TABLE dbo.tsql_identity_failure")
      true)
  expect: {result: true}

