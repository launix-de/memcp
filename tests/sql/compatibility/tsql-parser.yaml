- name: Multirow identity returns last allocated ID and survives rollback
  scm: |-
    (begin
      (define s (newsession))
      (s "schema" "memcp-tests")
      (define execute (lambda (sql) (begin
        (define output (newsession))
        (with_autocommit s nil nil sql (lambda (tx)
          (sql_execute_formula s tx (sql_queryplan_compile_formula tx
            (parse_tsql "memcp-tests" sql nil s tx))
            (lambda (row) (output "row" row)) (lambda fields true))))
        (output "row"))))
      (execute "CREATE TABLE dbo.tsql_identity_probe (id BIGINT IDENTITY(1,1) PRIMARY KEY, v INT)")
      (execute "INSERT INTO dbo.tsql_identity_probe(v) VALUES (10),(20),(30)")
      (define initial (execute "SELECT @@IDENTITY AS value,SCOPE_IDENTITY() AS scoped"))
      (if (and (equal? (initial "value") 3) (equal? (initial "scoped") 3)) true (error "multirow identity reported first id"))
      (execute "BEGIN TRANSACTION")
      (execute "INSERT INTO dbo.tsql_identity_probe(v) VALUES (40),(50)")
      (execute "ROLLBACK")
      (define rolled (execute "SELECT @@IDENTITY AS value,SCOPE_IDENTITY() AS scoped"))
      (if (and (equal? (rolled "value") 5) (equal? (rolled "scoped") 5)) true (error "rollback erased generated identity"))
      (s "tsql_scope_identity" nil)
      (define next_scope (execute "SELECT @@IDENTITY AS value,SCOPE_IDENTITY() AS scoped"))
      (if (and (equal? (next_scope "value") 5) (nil? (next_scope "scoped"))) true (error "scope identity leaked across batch"))
      (execute "INSERT INTO dbo.tsql_identity_probe(v) VALUES (60)")
      (define next (execute "SELECT @@IDENTITY AS value"))
      (if (equal? (next "value") 6) true (error "rolled-back generated IDs were reused"))
      (execute "INSERT INTO dbo.tsql_identity_probe(v) SELECT 10 UNION ALL SELECT 20")
      (define copied (execute "SELECT @@IDENTITY AS value"))
      (if (equal? (copied "value") 8) true (error "INSERT SELECT lost last generated identity"))
      (execute "INSERT INTO dbo.tsql_identity_probe(v) SELECT v FROM dbo.tsql_identity_probe WHERE id=-1")
      (define empty_insert (execute "SELECT @@IDENTITY AS value,SCOPE_IDENTITY() AS scoped"))
      (if (and (nil? (empty_insert "value")) (equal? (empty_insert "scoped") 8)) true (error "empty INSERT identity completion was wrong"))
      (execute "DROP TABLE dbo.tsql_identity_probe")
      true)
  setup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_identity_probe
  cleanup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_identity_probe
  expect:
    result: true
