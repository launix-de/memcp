metadata:
  version: '1.0'
  description: T-SQL syntax through the shared MemCP planner
  syntax: tsql
setup:
- &id001
  sql: DROP VIEW IF EXISTS dbo.tsql_view
- &id002
  sql: DROP TABLE IF EXISTS dbo.tsql_copy
- &id003
  sql: DROP TABLE IF EXISTS dbo.tsql_data
- sql: CREATE TABLE dbo.tsql_data (id INT PRIMARY KEY, name NVARCHAR(50), val INT)
- sql: INSERT INTO dbo.tsql_data VALUES (1,N'Alice',10),(2,N'Bob',30),(3,N'Charlie',50),(4,N'Alice',20)
test_cases:
- name: MySQL transport binds t-sql metadata before exporting null rows
  scm: |
    (begin
      (define s (newsession))
      (define output (newsession))
      (s "syntax" "tsql")
      (mysql_run_sql_statement nil "memcp-tests"
        "SELECT TOP(1) 42 AS [answer],CAST(NULL AS DECIMAL(20,2)) AS [missing]"
        s
        (lambda (row) (begin
          (if (equal? (output "fields") '("answer" "missing")) true
            (error "row preceded its MySQL field declaration"))
          (if (output "row") (error "unexpected second MySQL row") true)
          (output "row" row)))
        (lambda args (begin
          (if (and (equal? (count args) 1) (nil? (output "fields"))) true
            (error "MySQL metadata requires one argument and one declaration"))
          (output "fields" (car args)))))
      (if (equal? (output "row") (list "answer" 42 "missing" nil)) true
        (error "MySQL transport lost t-sql null presentation")))
  expect: {result: true}
- name: MySQL transport declares t-sql columns for an empty result
  scm: |
    (begin
      (define s (newsession))
      (define output (newsession))
      (s "syntax" "tsql")
      (mysql_run_sql_statement nil "memcp-tests" "SELECT TOP(0) 42 AS [answer]" s
        (lambda (_) (error "TOP zero returned a row"))
        (lambda args (begin
          (if (and (equal? (count args) 1) (nil? (output "fields"))) true
            (error "MySQL metadata requires one argument and one declaration"))
          (output "fields" (car args)))))
      (if (equal? (output "fields") '("answer")) true
        (error "empty t-sql result lost its MySQL column names")))
  expect: {result: true}
- name: Prepared declarations share qualified CAST precision and scale
  scm: |
    (begin
      (define s (newsession))
      (define declaration (car (tds_bind_declarations "memcp-tests" "@amount [sys].[DECIMAL](20,2)")))
      (s "tsql_bound:amount" true) (s "tsql_param:amount" nil)
      (s "tsql_param_type:amount" (cadr declaration))
      (define fields (tds_describe "memcp-tests" "SELECT @amount AS amount" "" s))
      (define field (car fields))
      (and (equal? (field "sql_type") "DECIMAL")
        (equal? (field "precision") 20) (equal? (field "scale") 2)))
  expect: {result: true}
- name: Metadata declarations share qualified type and MAX grammar
  scm: |
    (begin
      (define declarations (tsql_metadata_declared_parameters "memcp-tests"
        "@amount [sys].[DECIMAL](20,2),@label [sys].[NVARCHAR](MAX)"))
      (define amount (declarations "amount")) (define label (declarations "label"))
      (and (equal? (amount "type") "DECIMAL") (equal? (amount "dimensions") '(20 2))
        (equal? (label "type") "NVARCHAR") (equal? (label "dimensions") '(-1))))
  expect: {result: true}
- name: Prepared type declarations cannot escape the active database
  scm: |
    (tds_bind_declarations "memcp-tests" "@amount [other].[sys].[DECIMAL](20,2)")
  expect: {error: true}
- name: IF chooses its true single statement
  sql: IF 1=1 SELECT 5 AS n ELSE SELECT 6 AS n
  expect: {rows: 1, data: [{n: 5}]}
- name: IF chooses ELSE for false
  sql: IF 1=0 SELECT 5 AS n ELSE SELECT 6 AS n
  expect: {rows: 1, data: [{n: 6}]}
- name: IF chooses ELSE for unknown NULL comparison
  sql: IF NULL=1 SELECT 5 AS n ELSE SELECT 6 AS n
  expect: {rows: 1, data: [{n: 6}]}
- name: IF without ELSE leaves a missing table untouched
  sql: IF 1=0 DROP TABLE dbo.tsql_if_missing
  expect: {affected_rows: 0}
- name: Unselected IF SELECT is not physically planned
  sql: IF 1=0 SELECT * FROM dbo.tsql_if_missing ELSE SELECT 7 AS n
  expect: {rows: 1, data: [{n: 7}]}
- name: Unselected IF declaration is not resolved
  sql: IF 1=0 CREATE TABLE dbo.tsql_if_missing(id dbo.unknown_alias) ELSE SELECT 8 AS n
  expect: {rows: 1, data: [{n: 8}]}
- name: IF preserves CASE ELSE and quoted control words
  sql: IF (1=1) SELECT CASE WHEN 1=0 THEN N'ignored' ELSE N'ELSE; BEGIN IF' END AS value ELSE SELECT N'wrong' AS value
  expect: {rows: 1, data: [{value: 'ELSE; BEGIN IF'}]}
- name: IF preserves nested parentheses and comments
  sql: IF (1+2)=3 /* ELSE */ SELECT CAST((4+5) AS INT) AS n -- trailing comment
  expect: {rows: 1, data: [{n: 9}]}
- name: IF preserves bracket and double quoted identifier escaping
  sql: IF 1=1 SELECT 5 AS [ELSE]]value],6 AS "ELSE" ELSE SELECT 7 AS n
  expect: {rows: 1, data: [{'ELSE]value': 5, ELSE: 6}]}
- name: IF preserves escaped strings and nested CASE
  sql: IF 1=1 SELECT CASE WHEN 1=1 THEN CASE WHEN 1=0 THEN N'wrong' ELSE N'it''s ELSE' END ELSE N'wrong' END AS value ELSE SELECT N'wrong' AS value
  expect: {rows: 1, data: [{value: "it's ELSE"}]}
- name: IF rejects unbalanced parentheses even in its skipped branch
  sql: IF 1=0 SELECT CAST((1 AS INT)
  expect: {error: true}
- name: IF rejects unbalanced CASE even in its skipped branch
  sql: IF 1=0 SELECT CASE WHEN 1=1 THEN 5
  expect: {error: true}
- name: IF rejects unterminated quoted identifiers in its skipped branch
  sql: IF 1=0 SELECT 5 AS [unfinished
  expect: {error: true}
- name: IF skipped trailing syntax errors remain visible
  sql: IF 1=0 SELECT 5 AS n unexpected ELSE SELECT 6 AS n
  expect: {error: true}
- name: IF selected trailing syntax errors remain visible
  sql: IF 1=1 SELECT 5 AS n unexpected
  expect: {error: true}
- name: Conditional describe cannot run DDL
  setup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_if_describe
  cleanup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_if_describe
  scm: |
    (begin
      (define s (newsession))
      (define failure (try (lambda () (begin
        (tds_describe "memcp-tests" "IF 1=1 CREATE TABLE dbo.tsql_if_describe(id INT)" "" s) false)) (lambda (_) true)))
      (s "tsql_prepare_describe" true)
      (define prepared_failure (try (lambda () (begin
        (tds_describe "memcp-tests" "IF 1=1 CREATE TABLE dbo.tsql_if_describe(id INT)" "" s) false)) (lambda (_) true)))
      (if (and failure prepared_failure (nil? (sql_object_id "memcp-tests" "tsql_if_describe"))) true
        (error "conditional describe executed a mutation")))
  expect: {result: true}
- name: Selected IF table error remains visible
  sql: IF 1=1 DROP TABLE dbo.tsql_if_missing ELSE SELECT 1 AS n
  expect: {error: true}
- name: Selected IF scalar error remains visible
  sql: IF 1=1 SELECT 1/0 AS n ELSE SELECT 1 AS n
  expect: {error: true}
- name: IF requires a predicate
  sql: IF 1 SELECT 5 AS n
  expect: {error: true}
- name: IF rejects relational EXISTS until logical support exists
  sql: IF EXISTS(SELECT id FROM dbo.tsql_data) SELECT 5 AS n
  expect: {error: true}
- name: IF rejects scalar subqueries
  sql: IF (SELECT 1)=1 SELECT 5 AS n
  expect: {error: true}
- name: IF rejects unbound column predicates
  sql: IF id=1 SELECT 5 AS n
  expect: {error: true}
- name: IF rejects aggregate predicates
  sql: IF COUNT(*)=1 SELECT 5 AS n
  expect: {error: true}
- name: IF rejects window predicates
  sql: IF ROW_NUMBER() OVER(ORDER BY 1)=1 SELECT 5 AS n
  expect: {error: true}
- name: IF rejects BEGIN END blocks
  sql: IF 1=1 BEGIN SELECT 5 AS n END
  expect: {error: true}
- name: IF rejects nested control statements
  sql: IF 1=1 IF 1=1 SELECT 5 AS n
  expect: {error: true}
- name: IF rejects an internal semicolon before ELSE
  sql: IF 1=1 SELECT 5 AS n; ELSE SELECT 6 AS n
  expect: {error: true}
- name: IF does not dispatch arbitrary procedure text
  sql: IF 1=0 EXEC unknown_installation_procedure
  expect: {error: true}
- name: Cached IF catalog conditions observe create and drop
  setup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_if_catalog
  cleanup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_if_catalog
  scm: |
    (begin
      (define s (newsession))
      (define cache (newcachemap))
      (define execute (lambda (sql) (with_autocommit s nil nil sql (lambda (tx)
        (sql_execute_formula s tx (cached_parse cache (list parse_tsql) "memcp-tests" sql nil "root" s false tx)
          (lambda (row) true) (lambda fields true))))))
      (define create "IF OBJECT_ID(N'dbo.tsql_if_catalog',N'U') IS NULL CREATE TABLE dbo.tsql_if_catalog(id INT PRIMARY KEY)")
      (define drop "IF OBJECT_ID(N'dbo.tsql_if_catalog',N'U') IS NOT NULL DROP TABLE dbo.tsql_if_catalog")
      (execute drop)
      (execute create)
      (if (nil? (sql_object_id "memcp-tests" "tsql_if_catalog")) (error "IF CREATE was skipped") true)
      (execute create)
      (execute drop)
      (if (nil? (sql_object_id "memcp-tests" "tsql_if_catalog")) true (error "cached IF retained missing object"))
      (execute create)
      (execute drop)
      (if (nil? (sql_object_id "memcp-tests" "tsql_if_catalog")) true (error "cached IF retained old object identity")))
  expect: {result: true}
- name: Cached IF uses the current invocation session and result sink
  scm: |
    (begin
      (define cache (newcachemap))
      (define a (newsession))
      (define b (newsession))
      (map (list a b) (lambda (s) (begin (s "tsql_bound:gate" true) (s "tsql_bound:payload" true))))
      (a "tsql_param:gate" 1) (a "tsql_param:payload" 17)
      (b "tsql_param:gate" 0) (b "tsql_param:payload" 99)
      (define sql "IF @gate=1 SELECT @payload AS n ELSE SELECT -1 AS n")
      (define execute (lambda (s) (begin
        (define out (newsession))
        (with_autocommit s nil nil sql (lambda (tx)
          (sql_execute_formula s tx (cached_parse cache (list parse_tsql) "memcp-tests" sql nil "root" s false tx)
            (lambda (row) (out "row" row)) (lambda fields (out "fields" fields)))))
        ((out "row") "n"))))
      (define first (execute a))
      (define second (execute b))
      (a "tsql_param:payload" 23)
      (define third (execute a))
      (if (and (equal? first 17) (equal? second -1) (equal? third 23) (equal? (count (cache)) 1)) true
        (error "IF retained a compiling session or the wrong result sink")))
  expect: {result: true}
- name: IF DML retains its existing explicit transaction and skipped writes
  setup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_if_transaction
  - sql: CREATE TABLE dbo.tsql_if_transaction(id INT PRIMARY KEY)
  cleanup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_if_transaction
  scm: |
    (begin
      (define s (newsession))
      (define execute (lambda (sql) (begin
        (define out (newsession))
        (with_autocommit s nil nil sql (lambda (tx)
          (sql_execute_formula s tx (sql_queryplan_compile_formula tx
            (parse_tsql "memcp-tests" sql nil s tx)) (lambda (row) (out "row" row)) (lambda fields true))))
        (out "row"))))
      (execute "BEGIN TRAN")
      (execute "IF 1=0 INSERT INTO dbo.tsql_if_transaction VALUES(10)")
      (execute "IF 1=1 INSERT INTO dbo.tsql_if_transaction VALUES(20)")
      (define inside (execute "SELECT COUNT(*) AS n FROM dbo.tsql_if_transaction"))
      (execute "ROLLBACK")
      (define outside (execute "SELECT COUNT(*) AS n FROM dbo.tsql_if_transaction"))
      (if (and (equal? (inside "n") 1) (equal? (outside "n") 0) (nil? (s "transaction"))) true
        (error "IF started an independent transaction or executed its skipped write")))
  expect: {result: true}
- name: IF selected permission errors are not masked
  scm: |
    (begin
      (define s (newsession))
      (define policy (lambda (db name write) (if write (error "conditional write denied") true)))
      (define failure (try (lambda () (begin
        (with_autocommit s nil nil "IF 1=1 UPDATE dbo.tsql_data SET val=1" (lambda (tx)
          (sql_execute_formula s tx (sql_queryplan_compile_formula tx
            (parse_tsql "memcp-tests" "IF 1=1 UPDATE dbo.tsql_data SET val=1" policy s tx))
            (lambda (row) true) (lambda fields true)))) "unexpected success")) (lambda (message) (concat message))))
      (if (strlike failure "%conditional write denied%") true (error "IF lost the caller policy or swallowed its error")))
  expect: {result: true}
- name: Mixed integer and string addition converts numeric input
  sql: SELECT 2 + '3' AS n
  expect: {rows: 1, data: [{n: 5}]}
- name: Mixed integer and string addition rejects invalid numeric input
  sql: SELECT 2 + 'invalid' AS n
  expect: {error: true}
- name: Bracket identifiers and TOP
  sql: SELECT TOP (2) [id], [name] FROM [dbo].[tsql_data] ORDER BY [id]
  expect:
    rows: 2
    data:
    - id: 1
      name: Alice
    - id: 2
      name: Bob
- name: TOP without parentheses
  sql: SELECT TOP 1 id FROM tsql_data ORDER BY id DESC
  expect:
    rows: 1
    data:
    - id: 4
- name: TOP zero
  sql: SELECT TOP (0) id FROM tsql_data
  expect:
    rows: 0
    data: []
- name: OFFSET FETCH
  sql: SELECT id FROM dbo.tsql_data ORDER BY id OFFSET 1 ROWS FETCH NEXT 2 ROWS ONLY
  expect:
    rows: 2
    data:
    - id: 2
    - id: 3
- name: OFFSET without FETCH
  sql: SELECT id FROM tsql_data ORDER BY id OFFSET 3 ROWS
  expect:
    rows: 1
    data:
    - id: 4
- name: Database dbo qualification
  sql: SELECT TOP (1) id FROM [memcp-tests].[dbo].[tsql_data] ORDER BY id
  expect:
    rows: 1
    data:
    - id: 1
- name: TSQL DISTINCT
  sql: SELECT DISTINCT name FROM tsql_data ORDER BY name
  expect:
    rows: 3
    data:
    - name: Alice
    - name: Bob
    - name: Charlie
- name: TSQL bare alias
  sql: SELECT TOP (1) id item FROM tsql_data ORDER BY id
  expect:
    rows: 1
    data:
    - item: 1
- name: Unicode literals and escaped delimiters
  sql: SELECT N'Grüße it''s' AS [a]]b], 'C:\new' AS path
  expect:
    rows: 1
    data:
    - a]b: Grüße it's
      path: C:\new
- name: Double quoted identifiers
  sql: SELECT TOP (1) "id" FROM "dbo"."tsql_data" ORDER BY "id"
  expect:
    rows: 1
    data:
    - id: 1
- name: TSQL integer division and string addition
  sql: SELECT 5/2 AS integer_result, 5.0/2 AS decimal_result, N'a'+N'b' AS text_result
  expect:
    rows: 1
    data:
    - integer_result: 2
      decimal_result: 2.5
      text_result: ab
- name: ISNULL uses replacement semantics
  sql: SELECT ISNULL(NULL,7) AS a, ISNULL(0,7) AS b
  expect:
    rows: 1
    data:
    - a: 7
      b: 0
- name: TSQL CAST and CONVERT
  sql: SELECT CAST(5.9 AS INT) AS a, CONVERT(NVARCHAR(30),123) AS b
  expect:
    rows: 1
    data:
    - a: 5
      b: '123'
- name: TSQL standard aggregates
  sql: SELECT COUNT(*) AS n, SUM(val) AS total, AVG(val) AS average FROM tsql_data
  expect:
    rows: 1
    data:
    - n: 4
      total: 110
      average: 27
- name: TSQL row number partitions
  sql: SELECT id, ROW_NUMBER() OVER (PARTITION BY name ORDER BY id) AS rn FROM tsql_data
    ORDER BY id
  expect:
    rows: 4
    data:
    - id: 1
      rn: 1
    - id: 2
      rn: 1
    - id: 3
      rn: 1
    - id: 4
      rn: 2
- name: TSQL aggregate window
  sql: SELECT TOP (1) id, SUM(val) OVER (PARTITION BY name) AS total FROM tsql_data
    ORDER BY id
  expect:
    rows: 1
    data:
    - id: 1
      total: 30
- name: TSQL scalar subquery
  sql: SELECT (SELECT TOP (1) val FROM tsql_data ORDER BY id) AS value
  expect:
    rows: 1
    data:
    - value: 10
- name: TSQL correlated EXISTS
  sql: SELECT a.id FROM tsql_data a WHERE EXISTS (SELECT 1 FROM tsql_data b WHERE
    b.id=a.id AND b.val>20) ORDER BY a.id
  expect:
    rows: 2
    data:
    - id: 2
    - id: 3
- name: TSQL UNION ALL
  sql: SELECT 1 AS value UNION ALL SELECT 2 AS value
  expect:
    rows: 2
    data:
    - value: 1
    - value: 2
- name: TSQL searched CASE
  sql: SELECT CASE WHEN 1=1 THEN 7 ELSE 9 END AS value
  expect:
    rows: 1
    data:
    - value: 7
- name: TSQL simple CASE
  sql: SELECT CASE 2 WHEN 1 THEN 7 WHEN 2 THEN 8 ELSE 9 END AS value
  expect:
    rows: 1
    data:
    - value: 8
- name: TSQL NULL addition
  sql: SELECT NULL + N'x' AS value
  expect:
    rows: 1
    data:
    - value: null
- name: TSQL LEN ignores trailing spaces
  sql: SELECT LEN(N'abc  ') AS value
  expect:
    rows: 1
    data:
    - value: 3
- name: TOP PERCENT
  sql: SELECT TOP (10) PERCENT id FROM tsql_data
  expect:
    error: true
- name: TOP WITH TIES
  sql: SELECT TOP (1) WITH TIES id FROM tsql_data ORDER BY id
  expect:
    error: true
- name: OFFSET requires ORDER BY
  sql: SELECT id FROM tsql_data OFFSET 1 ROWS
  expect:
    error: true
- name: TOP and OFFSET conflict
  sql: SELECT TOP (1) id FROM tsql_data ORDER BY id OFFSET 1 ROWS
  expect:
    error: true
- name: Other T-SQL schema
  sql: SELECT id FROM sales.tsql_data
  expect:
    error: true
- name: LIMIT is rejected in t-sql mode
  sql: SELECT id FROM tsql_data LIMIT 1
  expect:
    error: true
- name: rowversion is not a datetime
  sql: SELECT CAST(GETDATE() AS TIMESTAMP) AS v
  expect:
    error: true
- name: Unsupported IDENTITY increment
  sql: CREATE TABLE tsql_bad_identity (id INT IDENTITY(3,2))
  expect:
    error: true
- name: Single-argument ISNULL is rejected
  sql: SELECT ISNULL(NULL)
  expect:
    error: true
- name: Division by zero
  sql: SELECT 1/0 AS value
  expect:
    error: true
- name: Unsupported APPLY
  sql: SELECT a.id FROM tsql_data a CROSS APPLY (SELECT 1 AS value) b
  expect:
    error: true
- name: TSQL CREATE TABLE with IDENTITY
  sql: CREATE TABLE dbo.tsql_copy (id INT IDENTITY(1,1) PRIMARY KEY, name NVARCHAR(MAX))
  expect:
    rows: 0
- name: TSQL INSERT uses generated identity
  sql: INSERT INTO dbo.tsql_copy (name) VALUES (N'first'),(N'second')
  expect:
    affected_rows: 2
- name: TSQL read generated identity
  sql: SELECT id,name FROM dbo.tsql_copy ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      name: first
    - id: 2
      name: second
- name: TSQL UPDATE
  sql: UPDATE dbo.tsql_copy SET name=N'updated' WHERE id=1
  expect:
    affected_rows: 1
- name: TSQL DELETE
  sql: DELETE FROM dbo.tsql_copy WHERE id=2
  expect:
    affected_rows: 1
- name: TSQL CREATE VIEW
  sql: CREATE VIEW dbo.tsql_view AS SELECT id,name FROM dbo.tsql_copy
  expect:
    rows: 1
- name: TSQL SELECT view
  sql: SELECT id,name FROM dbo.tsql_view
  expect:
    rows: 1
    data:
    - id: 1
      name: updated
- name: TOP remains branch-local in UNION
  sql: SELECT TOP (1) id AS v FROM tsql_data UNION ALL SELECT TOP (1) id AS v FROM
    tsql_data ORDER BY v
  expect:
    rows: 2
- name: TSQL unbound parameters fail
  sql: SELECT @missing AS v
  expect:
    error: true
- name: TSQL date boundary function
  sql: SELECT DATEDIFF(day,N'2026-01-01',N'2026-01-02') AS days
  expect:
    rows: 1
    data: [{days: 1}]
- name: IDENTITY zero seed is rejected
  sql: CREATE TABLE tsql_bad_identity (id INT IDENTITY(0,1))
  expect:
    error: true
- name: TSQL integer AVG window
  sql: SELECT TOP (1) AVG(val) OVER () AS average FROM tsql_data
  expect:
    rows: 1
    data:
    - average: 27
- name: TSQL empty integer AVG
  sql: SELECT AVG(val) AS average FROM tsql_data WHERE id<0
  expect:
    rows: 1
    data:
    - average: null
- name: INT column division follows declared type
  sql: SELECT TOP (1) val/3 AS quotient FROM tsql_data ORDER BY id
  expect:
    rows: 1
    data:
    - quotient: 3
- name: BIGINT literal remains exact
  sql: SELECT 9007199254740993 AS value
  expect:
    rows: 1
    data:
    - value: 9007199254740993
- name: CAST truncates requested character length
  sql: SELECT CAST(N'abcdef' AS NVARCHAR(3)) AS value
  expect:
    rows: 1
    data:
    - value: abc
- name: CONCAT treats NULL as empty string
  sql: SELECT CONCAT(N'a',NULL,N'b') AS value
  expect:
    rows: 1
    data:
    - value: ab
- name: Invalid integer cast is rejected
  sql: SELECT CAST(N'garbage' AS INT)
  expect:
    error: true
- name: Integer cast overflow is rejected
  sql: SELECT CAST(256 AS TINYINT)
  expect:
    error: true
- name: Ordered aggregate window is explicitly unsupported
  sql: SELECT SUM(val) OVER (ORDER BY id) AS total FROM tsql_data
  expect:
    error: true
- name: Missing USE database is rejected
  sql: USE tsql_missing_database
  expect:
    error: true
- name: TSQL INSERT SELECT through shared planner
  sql: INSERT INTO dbo.tsql_copy (name) SELECT TOP (1) name FROM dbo.tsql_data ORDER
    BY id
  expect:
    rows: 1
- name: TSQL INSERT SELECT writes one row
  sql: SELECT COUNT(*) AS n FROM dbo.tsql_copy
  expect:
    rows: 1
    data:
    - n: 2
- name: TSQL INSERT VALUES resolves omitted target columns
  sql: INSERT dbo.tsql_copy VALUES (10,N'implicit values')
  expect: {affected_rows: 1}
- name: TSQL INSERT SELECT resolves omitted target columns
  sql: INSERT dbo.tsql_copy SELECT id+10,name FROM dbo.tsql_data WHERE id=1
- name: Implicit target columns preserve names and values
  sql: SELECT id,name FROM dbo.tsql_copy WHERE id>=10 ORDER BY id
  expect: {rows: 2, data: [{id: 10, name: implicit values}, {id: 11, name: Alice}]}
- name: Implicit target columns still enforce value arity
  sql: INSERT dbo.tsql_copy VALUES (12)
  expect: {error: true}
- name: Describe empty SELECT preserves declared integer metadata
  scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (define fields (tds_describe "memcp-tests" "SELECT TOP (0) id FROM dbo.tsql_data" "" s))
      (if (and (equal? (count fields) 1) (equal? ((car fields) "name") "id")
          (equal? ((car fields) "sql_type") "INT")) true (error "empty SELECT lost its declared type")))
- name: Describe never executes INSERT
  scm: |
    (tds_describe "memcp-tests" "INSERT INTO dbo.tsql_data VALUES (999,N'unexecuted',1)" "" (newsession))
  expect: {error: true}
- name: Failed describe leaves rows unchanged
  sql: SELECT COUNT(*) AS n FROM dbo.tsql_data WHERE id=999
  expect: {rows: 1, data: [{n: 0}]}
- name: Describe derived star keeps exported columns
  scm: |
    (begin
      (define fields (tds_describe "memcp-tests" "SELECT TOP (0) d.* FROM (SELECT id,name FROM dbo.tsql_data) AS d" "" (newsession)))
      (if (and (equal? (count fields) 2) (equal? ((car fields) "sql_type") "INT")
          (equal? ((cadr fields) "name") "name")) true (error "derived star lost its exported metadata")))
- name: Numeric zero and one retain numeric result metadata
  scm: |
    (begin
      (define s (newsession))
      (define fields (tds_describe "memcp-tests" "SELECT 0 AS zero,1 AS one,2 AS two" "" s))
      (if (equal? (map fields (lambda (field) (field "sql_type"))) '("INT" "INT" "INT")) true
        (error "numeric literal became a boolean")))
