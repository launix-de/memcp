- name: Declared identity boundaries reject before rows and retain last allocated value
  setup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_identity_limit
  cleanup:
  - sql: DROP TABLE IF EXISTS dbo.tsql_identity_limit
  scm: |
    (begin
      (define s (newsession))
      (define execute (lambda (sql) (begin
        (define out (newsession))
        (with_autocommit s nil nil sql (lambda (tx)
          (sql_execute_formula s tx (sql_queryplan_compile_formula tx (parse_tsql "memcp-tests" sql nil s tx))
            (lambda (row) (out "row" row)) (lambda fields true))))
        (out "row"))))
      (execute "CREATE TABLE dbo.tsql_identity_limit (id TINYINT IDENTITY(1,1),value INT)")
      (define metadata (car (get_schema "memcp-tests" "tsql_identity_limit")))
      (if (metadata "Null") (error "identity remained nullable") true)
      (altertable (table "memcp-tests" "tsql_identity_limit") "auto_increment" 255)
      (define failed (try (lambda () (begin (execute "INSERT INTO dbo.tsql_identity_limit(value) VALUES (1),(2)") false)) (lambda (_) true)))
      (if failed true (error "tiny identity overflow was accepted"))
      (define empty (execute "SELECT COUNT(*) AS n FROM dbo.tsql_identity_limit"))
      (if (equal? (empty "n") 0) true (error "failed identity batch partially inserted"))
      (execute "INSERT INTO dbo.tsql_identity_limit(value) VALUES (3)")
      (define allocated (execute "SELECT id FROM dbo.tsql_identity_limit"))
      (if (equal? (allocated "id") 255) true (error "failed identity batch advanced the counter"))
      (define updated (try (lambda () (begin (execute "UPDATE dbo.tsql_identity_limit SET id=1") false)) (lambda (_) true)))
      (if updated true (error "identity was writable through UPDATE"))
      (define unchanged (execute "SELECT id FROM dbo.tsql_identity_limit"))
      (if (equal? (unchanged "id") 255) true (error "identity changed after rejected UPDATE"))
      (execute "DROP TABLE dbo.tsql_identity_limit")
      true)
  expect: {result: true}
