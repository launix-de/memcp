metadata:
  version: '2.0'
  description: Executable dump SET comments and session-local FK enforcement
  isolated: true
setup:
- sql: DROP TABLE IF EXISTS fk_dump_child
- sql: DROP TABLE IF EXISTS fk_dump_parent
test_cases:
- name: Execute dump unquoted charset SET
  session_id: fk-dump
  sql: /*!50003 SET character_set_client = utf8mb4 */
  expect: {}
- name: Read unquoted charset value
  session_id: fk-dump
  sql: SELECT @@character_set_client AS charset
  expect:
    data:
    - charset: utf8mb4
    rows: 1
- name: Create parent
  session_id: fk-dump
  sql: CREATE TABLE fk_dump_parent (id INT PRIMARY KEY)
  expect: {}
- name: Create child
  session_id: fk-dump
  sql: CREATE TABLE fk_dump_child (id INT PRIMARY KEY, parent_id INT, FOREIGN KEY
    (parent_id) REFERENCES fk_dump_parent(id) ON DELETE CASCADE ON UPDATE CASCADE)
  expect: {}
- name: Default checks enabled
  session_id: fk-dump
  sql: SELECT @@FOREIGN_KEY_CHECKS AS enabled
  expect:
    data:
    - enabled: 1
    rows: 1
- name: Reject missing parent by default
  session_id: fk-dump
  sql: INSERT INTO fk_dump_child VALUES (1,99)
  expect:
    error: true
- name: Execute mysqldump saved session state
  session_id: fk-dump
  sql: /*!40014 SET @OLD_FOREIGN_KEY_CHECKS=@@FOREIGN_KEY_CHECKS, FOREIGN_KEY_CHECKS=0
    */
  expect: {}
- name: Read case insensitive session state
  session_id: fk-dump
  sql: SELECT @@foreign_key_checks AS enabled, @old_foreign_key_checks AS saved
  expect:
    data:
    - enabled: 0
      saved: 1
    rows: 1
- name: Import orphan with checks disabled
  session_id: fk-dump
  sql: INSERT INTO fk_dump_child VALUES (1,99)
  expect: {}
- name: Other session still rejects orphan
  session_id: fk-other
  sql: INSERT INTO fk_dump_child VALUES (2,99)
  expect:
    error: true
- name: Update orphan with checks disabled
  session_id: fk-dump
  sql: UPDATE fk_dump_child SET parent_id=100 WHERE id=1
  expect: {}
- name: Insert valid parent
  session_id: fk-dump
  sql: INSERT INTO fk_dump_parent VALUES (100)
  expect: {}
- name: Do not cascade while disabled
  session_id: fk-dump
  sql: UPDATE fk_dump_parent SET id=101 WHERE id=100
  expect: {}
- name: Child remains unchanged
  session_id: fk-dump
  sql: SELECT parent_id FROM fk_dump_child WHERE id=1
  expect:
    data:
    - parent_id: 100
    rows: 1
- name: Insert another parent
  session_id: fk-dump
  sql: INSERT INTO fk_dump_parent VALUES (100)
  expect: {}
- name: Delete does not cascade while disabled
  session_id: fk-dump
  sql: DELETE FROM fk_dump_parent WHERE id=100
  expect: {}
- name: Child survives disabled cascade
  session_id: fk-dump
  sql: SELECT COUNT(*) AS n FROM fk_dump_child
  expect:
    data:
    - n: 1
    rows: 1
- name: Restore saved value from executable comment
  session_id: fk-dump
  sql: /*!40014 SET FOREIGN_KEY_CHECKS=@OLD_FOREIGN_KEY_CHECKS */
  expect: {}
- name: Restored checks enabled
  session_id: fk-dump
  sql: SELECT @@foreign_key_checks AS enabled
  expect:
    data:
    - enabled: 1
    rows: 1
- name: Reject invalid rows after restore
  session_id: fk-dump
  sql: INSERT INTO fk_dump_child VALUES (3,100)
  expect:
    error: true
- name: Existing imported orphan remains
  session_id: fk-dump
  sql: SELECT COUNT(*) AS n FROM fk_dump_child
  expect:
    data:
    - n: 1
    rows: 1
- name: Reinsert missing parent
  session_id: fk-dump
  sql: INSERT INTO fk_dump_parent VALUES (100)
  expect: {}
- name: Restored cascade works
  session_id: fk-dump
  sql: DELETE FROM fk_dump_parent WHERE id=100
  expect: {}
- name: Child removed by restored cascade
  session_id: fk-dump
  sql: SELECT COUNT(*) AS n FROM fk_dump_child
  expect:
    data:
    - n: 0
    rows: 1
cleanup:
- sql: DROP TABLE IF EXISTS fk_dump_child
- sql: DROP TABLE IF EXISTS fk_dump_parent
