# MySQL Compatibility v1 — Date/Time semantics

metadata:
  version: "1.0"
  description: "MySQL v1: CURRENT_TIMESTAMP defaults, NOW(), comparisons"

setup:
  - sql: "DROP TABLE IF EXISTS tstamp_rebuild"
  - sql: "DROP TABLE IF EXISTS tstamp"

test_cases:
  - name: "CREATE TABLE with default CURRENT_TIMESTAMP"
    sql: "CREATE TABLE tstamp (id INT PRIMARY KEY, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)"
    expect:
      affected_rows: 1

  - name: "INSERT row without timestamp uses default"
    sql: "INSERT INTO tstamp (id) VALUES (1)"
    expect:
      affected_rows: 1

  - name: "NOW() returns a value"
    sql: "SELECT NOW() AS nowv"
    expect: {}

  - name: "Default timestamp is not null"
    sql: "SELECT created_at IS NOT NULL AS ok FROM tstamp WHERE id = 1"
    expect:
      rows: 1
      data:
        - ok: true

  - name: "SHOW CREATE preserves CURRENT_TIMESTAMP expression"
    sql: "SHOW CREATE TABLE tstamp"
    expect:
      rows: 1
      result_contains: "DEFAULT CURRENT_TIMESTAMP"

  - name: "Date string conversion preserves the date"
    setup:
      - sql: "CREATE TABLE tstamp_rebuild (id INT PRIMARY KEY, created_at DATETIME, marker INT)"
      - sql: "INSERT INTO tstamp_rebuild VALUES (1, '2024-06-01 10:30:45', 0)"
    sql: "SELECT CONCAT(created_at, '') AS value FROM tstamp_rebuild WHERE id = 1"
    expect:
      rows: 1
      data:
        - value: "2024-06-01 10:30:45"

  - name: "Rebuild temporal values before restart"
    scm: "(begin (rebuild) true)"
    expect: {}

  - name: "Persist CURRENT_TIMESTAMP default expression"
    sql: "SHUTDOWN"

  - name: "CURRENT_TIMESTAMP default remains active after restart"
    sql: "INSERT INTO tstamp (id) VALUES (2)"
    expect:
      affected_rows: 1

  - name: "Restarted CURRENT_TIMESTAMP default is not null"
    sql: "SELECT created_at IS NOT NULL AS ok FROM tstamp WHERE id = 2"
    expect:
      rows: 1
      data:
        - ok: true

  - name: "ADD COLUMN binds a parenthesized CURRENT_TIMESTAMP default"
    sql: "ALTER TABLE tstamp ADD observed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP()"
    expect: {}

  - name: "An added timestamp default fills omitted values"
    sql: "INSERT INTO tstamp (id) VALUES (3)"
    expect:
      affected_rows: 1

  - name: "The added timestamp default fills existing and new rows"
    sql: "SELECT id,observed_at IS NOT NULL AS ok FROM tstamp ORDER BY id"
    expect:
      rows: 3
      data:
        - {id: 1, ok: true}
        - {id: 2, ok: true}
        - {id: 3, ok: true}

  - name: "Unsupported timestamp default arguments remain rejected"
    sql: "CREATE TABLE invalid_tstamp_default (id INT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP(1))"
    expect:
      error: true

  - name: "Mix reloaded and newly inserted dates before rebuild"
    sql: |
      INSERT INTO tstamp_rebuild VALUES
      (2, '2024-06-02 10:30:45', 0), (3, '2024-06-03 10:30:45', 0),
      (4, '2024-06-04 10:30:45', 0), (5, '2024-06-05 10:30:45', 0),
      (6, '2024-06-06 10:30:45', 0), (7, '2024-06-07 10:30:45', 0),
      (8, '2024-06-08 10:30:45', 0), (9, '2024-06-09 10:30:45', 0),
      (10, '2024-06-10 10:30:45', 0)
    expect:
      affected_rows: 9

  - name: "Rebuild mixed temporal representations"
    scm: "(begin (rebuild) true)"
    expect: {}

  - name: "Rebuild preserves newly inserted dates"
    sql: "SELECT created_at FROM tstamp_rebuild WHERE id = 2"
    expect:
      rows: 1
      data:
        - created_at: "2024-06-02 10:30:45"

  - name: "Unrelated update accepts the rebuilt date"
    sql: "UPDATE tstamp_rebuild SET marker = 1 WHERE id = 2"
    expect:
      affected_rows: 1

  - name: "Unrelated update preserves the rebuilt date"
    sql: "SELECT created_at, marker FROM tstamp_rebuild WHERE id = 2"
    expect:
      rows: 1
      data:
        - created_at: "2024-06-02 10:30:45"
          marker: 1

  - name: "Invalid date strings are still rejected"
    sql: "INSERT INTO tstamp_rebuild VALUES (11, 'not-a-date', 0)"
    expect:
      error: true

cleanup:
  - sql: "DROP TABLE IF EXISTS invalid_tstamp_default"
  - sql: "DROP TABLE IF EXISTS tstamp_rebuild"
  - sql: "DROP TABLE IF EXISTS tstamp"
