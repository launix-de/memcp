# MySQL Client Introspection — DBeaver/CLI probes

metadata:
  version: "1.0"
  description: "SHOW ENGINES/CHARSET/COLLATION/VARIABLES; @@GLOBAL vars"

setup: []

test_cases:
  - name: "SHOW ENGINES parses and returns rows"
    sql: "SHOW ENGINES"
    expect: {}  # Just check it runs successfully

  - name: "SHOW CHARSET returns utf8mb4"
    sql: "SHOW CHARSET LIKE 'utf8mb4'"
    expect: {}  # Presence-only for now

  - name: "SHOW COLLATION returns utf8mb4 variants"
    sql: "SHOW COLLATION LIKE 'utf8mb4%'"
    expect: {}  # Presence-only for now

  - name: "SHOW VARIABLES LIKE lower_case_table_names"
    sql: "SHOW VARIABLES LIKE 'lower_case_table_names'"
    expect: {}  # Presence-only for now

  - name: "Global character set and collation via @@GLOBAL"
    sql: "SELECT @@GLOBAL.character_set_server AS character_set_server, @@GLOBAL.collation_server AS collation_server"
    expect:
      rows: 1
      data:
        - character_set_server: "utf8mb4"
          collation_server: "utf8mb4_general_ci"

  - name: "SHOW PLUGINS (stub) succeeds"
    sql: "SHOW PLUGINS"
    expect: {}  # Accept empty result

  - name: "SET session variable to DEFAULT"
    sql: "SET optimizer_switch=DEFAULT"

  - name: "SET NAMES accepts a connection collation"
    sql: "SET NAMES 'utf8mb4' COLLATE 'utf8mb4_unicode_520_ci'"

  - name: "Leading whitespace is ignored over the MySQL frontend"
    sql: "\n\t SELECT 1 AS value"
    expect:
      rows: 1
      data:
        - value: 1

  - name: "SQL_CALC_FOUND_ROWS modifier is accepted"
    sql: "SELECT SQL_CALC_FOUND_ROWS 1 AS value LIMIT 1"
    expect:
      rows: 1
      data:
        - value: 1

  - name: "Misspelled SQL_CALC_FOUND_ROWS modifier is rejected"
    sql: "SELECT SQL_CALC_FOUND_ROW 1 AS value"
    expect:
      error: true

  - name: "mysqldump database collation probe is non-null"
    sql: "SELECT @@collation_database AS collation_database"
    expect:
      rows: 1
      data:
        - collation_database: "utf8mb4_general_ci"

cleanup: []
