metadata:
  syntax: tsql
  isolated: true
  description: Dialect factories are logical query inputs for SELECT and mutation projections, predicates and joins
setup:
- sql: DROP TABLE IF EXISTS mutation_function_keys
- sql: DROP TABLE IF EXISTS mutation_function_rows
- sql: DROP FUNCTION IF EXISTS dbo.mutation_pair
- sql: DROP FUNCTION IF EXISTS dbo.mutation_steps
- sql: DROP FUNCTION IF EXISTS dbo.mutation_nullable
- sql: CREATE TABLE mutation_function_rows(id INT PRIMARY KEY,n INT,amount INT)
- sql: INSERT mutation_function_rows VALUES(1,3,10),(2,0,10),(3,2,10),(4,3,10)
- sql: CREATE TABLE mutation_function_keys(id INT PRIMARY KEY,n INT)
- sql: INSERT mutation_function_keys VALUES(2,0),(3,2)
- sql: "CREATE FUNCTION dbo.mutation_pair() RETURNS INT AS BEGIN\n  DECLARE @t TABLE(a INT,b INT,PRIMARY KEY(a,b));\n\
    \  INSERT @t SELECT 1,2;\n  INSERT @t SELECT 1,3;\n  DECLARE @sum INT;\n  SELECT @sum=SUM(b) FROM @t;\n  RETURN\
    \ @sum;\nEND\n"
- sql: "CREATE FUNCTION dbo.mutation_steps(@n INT) RETURNS INT AS BEGIN\n  DECLARE @t TABLE(amount INT);\n  DECLARE\
    \ @i INT=0;\n  DECLARE @count INT;\n  DECLARE @total INT=0;\n  WHILE @i<@n BEGIN\n    INSERT @t SELECT 1;\n\
    \    SELECT @count=COUNT(*) FROM @t;\n    SET @total=@total+@count;\n    SET @i=@i+1;\n  END\n  RETURN @total;\n\
    END\n"
- sql: "CREATE FUNCTION dbo.mutation_nullable(@n INT) RETURNS INT AS BEGIN\n DECLARE @t TABLE(value INT);\n INSERT\
    \ INTO @t SELECT ISNULL(@n,9);\n DECLARE @result INT;\n SELECT @result=SUM(value) FROM @t;\n RETURN @result;\n\
    END"
test_cases:
- name: Scalar local-table factory in UPDATE assignment uses the shared relational projection
  sql: UPDATE mutation_function_rows SET amount=dbo.mutation_pair() WHERE id IN(1,3); SELECT id,amount FROM mutation_function_rows
    ORDER BY id
  expect:
    rows: 4
    data:
    - id: 1
      amount: 5
    - id: 2
      amount: 10
    - id: 3
      amount: 5
    - id: 4
      amount: 10
- name: Correlated scalar factory assignments preserve every caller binding
  sql: UPDATE mutation_function_rows SET amount=dbo.mutation_steps(n); SELECT id,amount FROM mutation_function_rows
    ORDER BY id
  expect:
    rows: 4
    data:
    - id: 1
      amount: 6
    - id: 2
      amount: 0
    - id: 3
      amount: 3
    - id: 4
      amount: 6
- name: A scalar factory predicate selects the same rows as SELECT
  sql: UPDATE mutation_function_rows SET amount=amount+10 WHERE dbo.mutation_steps(n)=6; SELECT id,amount FROM mutation_function_rows
    ORDER BY id
  expect:
    rows: 4
    data:
    - id: 1
      amount: 16
    - id: 2
      amount: 0
    - id: 3
      amount: 3
    - id: 4
      amount: 16
- name: Join predicates expand scalar factories before common mutation planning
  sql: UPDATE t SET amount=t.amount+100 FROM mutation_function_rows AS t INNER JOIN mutation_function_keys AS k
    ON t.id=k.id AND dbo.mutation_steps(k.n)=t.amount; SELECT id,amount FROM mutation_function_rows ORDER BY id
  expect:
    rows: 4
    data:
    - id: 1
      amount: 16
    - id: 2
      amount: 100
    - id: 3
      amount: 103
    - id: 4
      amount: 16
- name: DELETE predicates consume the same relational scalar producer
  sql: DELETE FROM mutation_function_rows WHERE dbo.mutation_steps(n)=0; SELECT id,amount FROM mutation_function_rows
    ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      amount: 16
    - id: 3
      amount: 103
    - id: 4
      amount: 16
- name: Factory assignment preserves original caller savepoint and rollback
  sql: BEGIN TRAN; SAVE TRAN kept; UPDATE mutation_function_rows SET amount=dbo.mutation_pair() WHERE id=1; ROLLBACK
    TRAN kept; SELECT id,amount,@@TRANCOUNT AS depth FROM mutation_function_rows WHERE id=1; ROLLBACK TRAN
  expect:
    rows: 1
    data:
    - id: 1
      amount: 16
      depth: 1
- name: A cardinality failure remains an error after scalar factory expansion
  sql: UPDATE mutation_function_rows SET amount=dbo.mutation_pair()+(SELECT id FROM mutation_function_keys)
  expect:
    error: true
    contains: scalar subselect returned more than one row
- name: Failed factory assignment preserves every previous target row
  sql: SELECT id,amount FROM mutation_function_rows ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      amount: 16
    - id: 3
      amount: 103
    - id: 4
      amount: 16
- name: SELECT continues to consume the same prepared factory relation
  sql: SELECT dbo.mutation_pair() AS pair_total,dbo.mutation_steps(3) AS step_total
  expect:
    rows: 1
    data:
    - pair_total: 5
      step_total: 6
- name: Duplicate NULL caller bindings stay distinct from zero in mutation factories
  sql: INSERT mutation_function_rows VALUES(7,NULL,90),(8,0,90),(9,NULL,90); UPDATE mutation_function_rows SET amount=dbo.mutation_nullable(n)
    WHERE id>=7; SELECT id,amount FROM mutation_function_rows ORDER BY id
  expect:
    rows: 6
    data:
    - id: 1
      amount: 16
    - id: 3
      amount: 103
    - id: 4
      amount: 16
    - id: 7
      amount: 9
    - id: 8
      amount: 0
    - id: 9
      amount: 9
cleanup:
- sql: DROP TABLE IF EXISTS mutation_function_keys
- sql: DROP TABLE IF EXISTS mutation_function_rows
- sql: DROP FUNCTION IF EXISTS dbo.mutation_pair
- sql: DROP FUNCTION IF EXISTS dbo.mutation_steps
- sql: DROP FUNCTION IF EXISTS dbo.mutation_nullable
