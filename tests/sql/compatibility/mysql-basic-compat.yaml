# MySQL Compatibility v1 — Basics

metadata:
  version: "1.0"
  description: "MySQL v1: identifiers, casts, NULL/booleans, escapes"
  # Suite is now expected to pass fully

setup:
  - sql: DROP TABLE IF EXISTS `compat_users`

test_cases:
  - name: "CREATE TABLE with backticked identifiers"
    sql: |
      CREATE TABLE `compat_users` (
        `id` INT PRIMARY KEY,
        `name` VARCHAR(100),
        `active` BOOLEAN
      )
    expect:
      affected_rows: 1

  - name: "INSERT respects backticks"
    sql: |
      INSERT INTO `compat_users` (`id`, `name`, `active`) VALUES (1, 'Ada', true)
    expect:
      affected_rows: 1

  - name: "SELECT with backticks"
    sql: |
      SELECT `id`, `name`, `active` FROM `compat_users`
    expect:
      rows: 1
      data:
        - id: 1
          name: "Ada"
          active: true

  - name: "Implicit numeric cast: string to int comparison"
    sql: |
      SELECT '1' = 1 AS eq
    expect:
      rows: 1
      data:
        - eq: true

  - name: "Implicit numeric cast accepts a leading numeric prefix"
    sql: |
      SELECT
        15 = '15,16' AS integer_prefix,
        15.5 = '15.5 trailing' AS decimal_prefix,
        150 = '1.5e2 trailing' AS exponent_prefix,
        9007199254740993 = '9007199254740993 trailing' AS large_integer_prefix
    expect:
      rows: 1
      data:
        - integer_prefix: true
          decimal_prefix: true
          exponent_prefix: true
          large_integer_prefix: true

  - name: "Numeric-prefix coercion applies to indexed integer columns"
    sql: |
      SELECT `id` FROM `compat_users` WHERE `id` = '1,2'
    expect:
      rows: 1
      data:
        - id: 1

  - name: "Implicit boolean truthiness"
    sql: |
      SELECT IF(1, 't', 'f') AS v
    expect:
      rows: 1
      data:
        - v: "t"

  - name: "String numerals follow SQL boolean truthiness"
    sql: |
      SELECT
        IF('0', 't', 'f') AS zero_string,
        IF(' 0 ', 't', 'f') AS spaced_zero_string,
        IF('0.0', 't', 'f') AS decimal_zero_string,
        IF('1', 't', 'f') AS one_string,
        IF('0.1', 't', 'f') AS decimal_string,
        IF('FALSE', 't', 'f') AS false_string
    expect:
      rows: 1
      data:
        - zero_string: "f"
          spaced_zero_string: "f"
          decimal_zero_string: "f"
          one_string: "t"
          decimal_string: "t"
          false_string: "f"

  - name: "SELECT WHERE without FROM"
    # Avoids aggregate over derived table; checks filter semantics directly
    sql: |
      SELECT 1 WHERE 1
    expect:
      rows: 1

  - name: "SELECT WHERE without FROM and false"
    # Avoids aggregate over derived table; checks filter semantics directly
    sql: |
      SELECT 1 WHERE 0
    expect:
      rows: 0

  - name: "NULL truthiness (WHERE filters out)"
    # Avoids aggregate over derived table; checks filter semantics directly
    sql: |
      SELECT 1 WHERE NULL
    expect:
      rows: 0

  - name: "String escape single quote"
    sql: |
      SELECT 'can\'t' AS s
    expect:
      rows: 1
      data:
        - s: "can't"

  - name: "Backslash literal (no escape)"
    sql: |
      SELECT 'line\\nbreak' AS s
    expect:
      rows: 1
      data:
        - s: "line\\nbreak"

cleanup: []
