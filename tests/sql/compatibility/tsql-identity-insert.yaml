metadata:
  version: '1.0'
  syntax: tsql
  requires_tds: true
  description: Session identity import policy on native INSERT and generated-ID blocks
test_cases:
- name: Identity explicit values require the runtime switch
  setup:
  - sql: DROP PROCEDURE IF EXISTS identity_mode_proc
  - sql: DROP TABLE IF EXISTS identity_mode_a
  - sql: DROP TABLE IF EXISTS identity_mode_b
  - sql: DROP TABLE IF EXISTS identity_mode_plain
  - sql: CREATE TABLE identity_mode_a(id INT IDENTITY PRIMARY KEY,value INT DEFAULT 7)
  - sql: CREATE TABLE identity_mode_b(id INT IDENTITY PRIMARY KEY,value INT)
  - sql: CREATE TABLE identity_mode_plain(value INT)
  scm: |-
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "memcp-tests")
      (define run (lambda (text) (begin
        (define out (newsession))
        (tsql_execute_request "memcp-tests" text s nil 0
          (lambda (row) (out "row" row)) (lambda fields true))
        (out "row"))))
      (define failure (lambda (text) (try
        (lambda () (begin (run text) (error "expected failure")))
        (lambda (cause) (match cause
          '("tsql-error" number _message _state) number
          _ (error "unexpected failure" cause))))))
      (list (failure "INSERT identity_mode_a(id,value) VALUES(50,8)")
        ((run "SELECT COUNT(*) AS n FROM identity_mode_a") "n"))
    )
  expect:
    result:
    - 544
    - 0
- name: Identity import uses the existing allocator and explicit column list
  setup:
  - sql: DROP PROCEDURE IF EXISTS identity_mode_proc
  - sql: DROP TABLE IF EXISTS identity_mode_a
  - sql: DROP TABLE IF EXISTS identity_mode_b
  - sql: DROP TABLE IF EXISTS identity_mode_plain
  - sql: CREATE TABLE identity_mode_a(id INT IDENTITY PRIMARY KEY,value INT DEFAULT 7)
  - sql: CREATE TABLE identity_mode_b(id INT IDENTITY PRIMARY KEY,value INT)
  - sql: CREATE TABLE identity_mode_plain(value INT)
  scm: |-
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "memcp-tests")
      (define run (lambda (text) (begin
        (define out (newsession))
        (tsql_execute_request "memcp-tests" text s nil 0
          (lambda (row) (out "row" row)) (lambda fields true))
        (out "row"))))
      (define failure (lambda (text) (try
        (lambda () (begin (run text) (error "expected failure")))
        (lambda (cause) (match cause
          '("tsql-error" number _message _state) number
          _ (error "unexpected failure" cause))))))
      (run "SET IDENTITY_INSERT dbo.identity_mode_a ON")
      (run "INSERT identity_mode_a(id,value) VALUES(50,8),(3,9),(0,10),(-1,11)")
      (run "SET IDENTITY_INSERT dbo.identity_mode_a OFF")
      (run "INSERT identity_mode_a(value) VALUES(12)")
      (list ((run "SELECT id FROM identity_mode_a WHERE value=12") "id")
        ((run "SELECT COUNT(*) AS n FROM identity_mode_a") "n"))
    )
  expect:
    result:
    - 51
    - 5
- name: Enabled identity requires the identity column before values execute
  setup:
  - sql: DROP PROCEDURE IF EXISTS identity_mode_proc
  - sql: DROP TABLE IF EXISTS identity_mode_a
  - sql: DROP TABLE IF EXISTS identity_mode_b
  - sql: DROP TABLE IF EXISTS identity_mode_plain
  - sql: CREATE TABLE identity_mode_a(id INT IDENTITY PRIMARY KEY,value INT DEFAULT 7)
  - sql: CREATE TABLE identity_mode_b(id INT IDENTITY PRIMARY KEY,value INT)
  - sql: CREATE TABLE identity_mode_plain(value INT)
  scm: |-
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "memcp-tests")
      (define run (lambda (text) (begin
        (define out (newsession))
        (tsql_execute_request "memcp-tests" text s nil 0
          (lambda (row) (out "row" row)) (lambda fields true))
        (out "row"))))
      (define failure (lambda (text) (try
        (lambda () (begin (run text) (error "expected failure")))
        (lambda (cause) (match cause
          '("tsql-error" number _message _state) number
          _ (error "unexpected failure" cause))))))
      (run "SET IDENTITY_INSERT identity_mode_a ON")
      (list (failure "DECLARE @bad NVARCHAR(10)=N'bad'; INSERT identity_mode_a(value) VALUES(CAST(@bad AS INT))")
        (failure "INSERT identity_mode_a DEFAULT VALUES")
        ((run "SELECT COUNT(*) AS n FROM identity_mode_a") "n")
        (reserve_ids (table "memcp-tests" false "identity_mode_a" false) 1))
    )
  expect:
    result:
    - 545
    - 545
    - 0
    - - 1
      - 1
- name: Identity statement admission precedes empty and top zero sources
  setup:
  - sql: DROP PROCEDURE IF EXISTS identity_mode_proc
  - sql: DROP TABLE IF EXISTS identity_mode_a
  - sql: DROP TABLE IF EXISTS identity_mode_b
  - sql: DROP TABLE IF EXISTS identity_mode_plain
  - sql: CREATE TABLE identity_mode_a(id INT IDENTITY PRIMARY KEY,value INT DEFAULT 7)
  - sql: CREATE TABLE identity_mode_b(id INT IDENTITY PRIMARY KEY,value INT)
  - sql: CREATE TABLE identity_mode_plain(value INT)
  scm: |-
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "memcp-tests")
      (define run (lambda (text) (begin
        (define out (newsession))
        (tsql_execute_request "memcp-tests" text s nil 0
          (lambda (row) (out "row" row)) (lambda fields true))
        (out "row"))))
      (define failure (lambda (text) (try
        (lambda () (begin (run text) (error "expected failure")))
        (lambda (cause) (match cause
          '("tsql-error" number _message _state) number
          _ (error "unexpected failure" cause))))))
      (run "SET IDENTITY_INSERT identity_mode_a ON")
      (list (failure "INSERT identity_mode_a(value) SELECT value FROM identity_mode_plain")
        (failure "INSERT TOP(0) identity_mode_a(value) VALUES(3)")
        (failure "INSERT TOP(0) identity_mode_a DEFAULT VALUES")
        (reserve_ids (table "memcp-tests" false "identity_mode_a" false) 1))
    )
  expect:
    result:
    - 545
    - 545
    - 545
    - - 1
      - 1
