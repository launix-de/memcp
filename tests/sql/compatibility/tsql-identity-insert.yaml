- name: Cached insert plans check identity mode on every execution
  setup:
  - sql: DROP PROCEDURE IF EXISTS identity_mode_proc
  - sql: DROP TABLE IF EXISTS identity_mode_a
  - sql: DROP TABLE IF EXISTS identity_mode_b
  - sql: DROP TABLE IF EXISTS identity_mode_plain
  - sql: CREATE TABLE identity_mode_a(id INT IDENTITY PRIMARY KEY,value INT DEFAULT 7)
  - sql: CREATE TABLE identity_mode_b(id INT IDENTITY PRIMARY KEY,value INT)
  - sql: CREATE TABLE identity_mode_plain(value INT)
  scm: |-
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "memcp-tests")
      (define run (lambda (text) (begin
        (define out (newsession))
        (tsql_execute_request "memcp-tests" text s nil 0
          (lambda (row) (out "row" row)) (lambda fields true))
        (out "row"))))
      (define failure (lambda (text) (try
        (lambda () (begin (run text) (error "expected failure")))
        (lambda (cause) (match cause
          '("tsql-error" number _message _state) number
          _ (error "unexpected failure" cause))))))
      (define text "INSERT identity_mode_a(id,value) VALUES(42,3)")
      (define first (failure text))
      (run "SET IDENTITY_INSERT identity_mode_a ON")
      (run text)
      (run "SET IDENTITY_INSERT identity_mode_a OFF")
      (list first (failure text) ((run "SELECT COUNT(*) AS n FROM identity_mode_a") "n"))
    )
  expect:
    result:
    - 544
    - 544
    - 1
- name: Identity state persists through ordinary GO batches
  setup:
  - sql: DROP PROCEDURE IF EXISTS identity_mode_proc
  - sql: DROP TABLE IF EXISTS identity_mode_a
  - sql: DROP TABLE IF EXISTS identity_mode_b
  - sql: DROP TABLE IF EXISTS identity_mode_plain
