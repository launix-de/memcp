  - sql: CREATE TABLE identity_mode_b(id INT IDENTITY PRIMARY KEY,value INT)
  - sql: CREATE TABLE identity_mode_plain(value INT)
  scm: |-
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "memcp-tests")
      (define run (lambda (text) (begin
        (define out (newsession))
        (tsql_execute_request "memcp-tests" text s nil 0
          (lambda (row) (out "row" row)) (lambda fields true))
        (out "row"))))
      (define failure (lambda (text) (try
        (lambda () (begin (run text) (error "expected failure")))
        (lambda (cause) (match cause
          '("tsql-error" number _message _state) number
          _ (error "unexpected failure" cause))))))
      (run "SET IDENTITY_INSERT identity_mode_a ON
    GO
    INSERT identity_mode_a(id,value) VALUES(33,4)
    GO
    SET IDENTITY_INSERT identity_mode_a OFF")
      (list ((run "SELECT id FROM identity_mode_a") "id")
        (failure "INSERT identity_mode_a(id,value) VALUES(34,4)"))
    )
  expect:
