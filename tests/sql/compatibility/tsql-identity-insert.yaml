      (s "schema" "memcp-tests")
      (define run (lambda (text) (begin
        (define out (newsession))
        (tsql_execute_request "memcp-tests" text s nil 0
          (lambda (row) (out "row" row)) (lambda fields true))
        (out "row"))))
      (define failure (lambda (text) (try
        (lambda () (begin (run text) (error "expected failure")))
        (lambda (cause) (match cause
          '("tsql-error" number _message _state) number
          _ (error "unexpected failure" cause))))))
      (run "SET IDENTITY_INSERT identity_mode_a ON")
      (define other (newsession))
      (other "username" "root")
      (other "schema" "memcp-tests")
      (define denied (try (lambda () (begin
        (tsql_execute_request "memcp-tests" "INSERT identity_mode_a(id,value) VALUES(8,3)" other nil 0
          (lambda (row) true) (lambda fields true)) 0))
        (lambda (cause) (match cause '("tsql-error" number _message _state) number _ (error cause)))))
      (run "INSERT identity_mode_a(id,value) VALUES(9,4)")
      (list denied ((run "SELECT id FROM identity_mode_a") "id"))
