  - sql: SET IDENTITY_INSERT identity_replay_mixed OFF
- name: Restart committed explicit identity values through native persistence
  syntax: mysql
  sql: SHUTDOWN
- name: Negative imported IDs do not advance the positive generator after restart
  sql: INSERT identity_replay_negative(value) VALUES(3)
  expect:
    affected_rows: 1
- name: Mixed imported IDs preserve the positive high water after restart
  sql: INSERT identity_replay_mixed(value) VALUES(3)
  expect:
    affected_rows: 1
- name: Recovered negative import keeps its row and starts generated IDs at one
  sql: SELECT id,value FROM identity_replay_negative ORDER BY id
  expect:
    rows: 2
    data:
    - id: -99
      value: 1
    - id: 1
      value: 3
- name: Recovered mixed import advances once through the same native allocator
  sql: SELECT id,value FROM identity_replay_mixed ORDER BY id
  expect:
    rows: 3
    data:
    - id: -1
      value: 1
    - id: 41
      value: 2
    - id: 42
      value: 3
  cleanup:
  - sql: DROP TABLE identity_replay_mixed
  - sql: DROP TABLE identity_replay_negative
