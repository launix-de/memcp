# Raw payloads are INSERT BULK followed by 224 INT columns, one row and
# Framework SqlClient's 32-bit zero/no-count DONE. Metadata itself exceeds
# a 4096-byte packet; continuation_status=4 reproduces its ST_BATCH header.
metadata:
  syntax: tsql
  requires_tds: true
  isolated: true
  description: Wide bulk metadata crosses packet boundaries with unused continuation status bits
setup:
- sql: CREATE TABLE fragmented_bulk_rows(field000 INT,field001 INT,field002 INT,field003 INT,field004 INT,field005
    INT,field006 INT,field007 INT,field008 INT,field009 INT,field010 INT,field011 INT,field012 INT,field013 INT,field014
    INT,field015 INT,field016 INT,field017 INT,field018 INT,field019 INT,field020 INT,field021 INT,field022 INT,field023
    INT,field024 INT,field025 INT,field026 INT,field027 INT,field028 INT,field029 INT,field030 INT,field031 INT,field032
    INT,field033 INT,field034 INT,field035 INT,field036 INT,field037 INT,field038 INT,field039 INT,field040 INT,field041
    INT,field042 INT,field043 INT,field044 INT,field045 INT,field046 INT,field047 INT,field048 INT,field049 INT,field050
    INT,field051 INT,field052 INT,field053 INT,field054 INT,field055 INT,field056 INT,field057 INT,field058 INT,field059
    INT,field060 INT,field061 INT,field062 INT,field063 INT,field064 INT,field065 INT,field066 INT,field067 INT,field068
    INT,field069 INT,field070 INT,field071 INT,field072 INT,field073 INT,field074 INT,field075 INT,field076 INT,field077
    INT,field078 INT,field079 INT,field080 INT,field081 INT,field082 INT,field083 INT,field084 INT,field085 INT,field086
    INT,field087 INT,field088 INT,field089 INT,field090 INT,field091 INT,field092 INT,field093 INT,field094 INT,field095
    INT,field096 INT,field097 INT,field098 INT,field099 INT,field100 INT,field101 INT,field102 INT,field103 INT,field104
    INT,field105 INT,field106 INT,field107 INT,field108 INT,field109 INT,field110 INT,field111 INT,field112 INT,field113
    INT,field114 INT,field115 INT,field116 INT,field117 INT,field118 INT,field119 INT,field120 INT,field121 INT,field122
    INT,field123 INT,field124 INT,field125 INT,field126 INT,field127 INT,field128 INT,field129 INT,field130 INT,field131
    INT,field132 INT,field133 INT,field134 INT,field135 INT,field136 INT,field137 INT,field138 INT,field139 INT,field140
