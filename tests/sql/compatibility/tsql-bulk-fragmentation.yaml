    INT,field222 INT,field223 INT)
cleanup:
- sql: DROP TABLE IF EXISTS fragmented_bulk_rows
test_cases:
- name: Framework bulk metadata spans packets carrying the unused batch bit
  tds:
    rpc_packets:
    - packet_type: 1
      continuation_status: 4
      payload_hex: 
    - packet_type: 7
      continuation_status: 4
      payload_hex: 
- name: Fragmented bulk request inserts exact values across the complete column domain
  sql: SELECT field000,field111,field223 FROM fragmented_bulk_rows
  expect:
    rows: 1
    data:
    - field000: 1
      field111: 1
      field223: 1
