metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: Nested module calls bind in the consuming relational function plan
setup:
- sql: CREATE TABLE nested_source_rows(id INT PRIMARY KEY,value INT)
- sql: INSERT nested_source_rows VALUES(1,3),(2,7),(3,NULL)
cleanup:
- sql: DROP FUNCTION IF EXISTS dbo.nested_read_pure
- sql: DROP FUNCTION IF EXISTS dbo.nested_read_outer
- sql: DROP FUNCTION IF EXISTS dbo.nested_read_inner
- sql: DROP FUNCTION IF EXISTS dbo.nested_scalar_add
- sql: DROP FUNCTION IF EXISTS dbo.nested_cycle_a
- sql: DROP FUNCTION IF EXISTS dbo.nested_cycle_b
- sql: DROP VIEW IF EXISTS dbo.nested_forward_view
- sql: DROP FUNCTION IF EXISTS dbo.nested_forward
- sql: DROP FUNCTION IF EXISTS dbo.nested_return
- sql: DROP FUNCTION IF EXISTS dbo.nested_kind_wrapper
- sql: DROP FUNCTION IF EXISTS dbo.nested_kind_inner
- sql: DROP FUNCTION IF EXISTS dbo.nested_date_day
- sql: DROP FUNCTION IF EXISTS dbo.nested_argument_text
- sql: DROP FUNCTION IF EXISTS dbo.nested_argument_copy
- sql: DROP TABLE IF EXISTS nested_argument_values
- sql: DROP TABLE IF EXISTS nested_source_dates
- sql: DROP TABLE IF EXISTS nested_source_rows
test_cases:
- name: Relational source admission defers nested scalar dependency binding
  tds:
    statements:
    - sql: |
        CREATE FUNCTION dbo.nested_read_pure(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SELECT @value=COUNT(*) FROM nested_source_rows WHERE id<=@key;
          SET @value=dbo.nested_scalar_add(@value);
          RETURN @value;
        END
    - sql: CREATE FUNCTION dbo.nested_scalar_add(@value INT) RETURNS INT AS BEGIN RETURN @value+10; END
    - sql: SELECT id,dbo.nested_read_pure(id) AS value FROM nested_source_rows ORDER BY id
      expect: {rows: 3,data: [{id: 1,value: 11},{id: 2,value: 12},{id: 3,value: 13}]}
- name: A relational callee expands before the shared logical decorrelator
  tds:
    statements:
    - sql: |
        CREATE FUNCTION dbo.nested_read_inner(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SELECT @value=SUM(value) FROM nested_source_rows WHERE id<=@key;
          RETURN @value;
        END
    - sql: |
        CREATE FUNCTION dbo.nested_read_outer(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SELECT @value=COUNT(*) FROM nested_source_rows;
          SET @value=dbo.nested_read_inner(@key);
          RETURN @value;
        END
    - sql: SELECT id,dbo.nested_read_outer(id) AS value FROM nested_source_rows ORDER BY id
      expect: {rows: 3,data: [{id: 1,value: 3},{id: 2,value: 10},{id: 3,value: 10}]}
    - sql: SELECT dbo.nested_read_outer(0) AS value
      expect: {rows: 1,data: [{value: null}]}
- name: Warm relational callers invalidate the callee declaration snapshot
  tds:
    statements:
    - sql: SELECT dbo.nested_read_pure(2) AS value
      expect: {rows: 1,data: [{value: 12}]}
    - sql: DROP FUNCTION dbo.nested_scalar_add
    - sql: CREATE FUNCTION dbo.nested_scalar_add(@value INT) RETURNS INT AS BEGIN RETURN @value+20; END
    - sql: SELECT dbo.nested_read_pure(2) AS value
      expect: {rows: 1,data: [{value: 22}]}
- name: Callee replacement is private to its defining transaction and rolls back
  tds:
    statements:
    - {connection: owner,sql: BEGIN TRANSACTION}
    - {connection: owner,sql: DROP FUNCTION dbo.nested_scalar_add}
    - connection: owner
      sql: CREATE FUNCTION dbo.nested_scalar_add(@value INT) RETURNS INT AS BEGIN RETURN @value+30; END
    - connection: owner
      sql: SELECT dbo.nested_read_pure(2) AS value
      expect: {rows: 1,data: [{value: 32}]}
    - sql: SELECT dbo.nested_read_pure(2) AS value
      expect: {rows: 1,data: [{value: 22}]}
    - {connection: owner,sql: ROLLBACK TRANSACTION}
    - sql: SELECT dbo.nested_read_pure(2) AS value
      expect: {rows: 1,data: [{value: 22}]}
- name: Recursive relational bindings fail before constructing an unbounded plan
  tds:
    statements:
    - sql: |
        CREATE FUNCTION dbo.nested_cycle_a(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SELECT @value=COUNT(*) FROM nested_source_rows;
          SET @value=dbo.nested_cycle_b(@key);
          RETURN @value;
        END
    - sql: |
        CREATE FUNCTION dbo.nested_cycle_b(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SELECT @value=COUNT(*) FROM nested_source_rows;
          SET @value=dbo.nested_cycle_a(@key);
          RETURN @value;
        END
    - sql: SELECT dbo.nested_cycle_a(1) AS value
      expect: {error: true,error_contains: recursive scalar function binding}
    - sql: SELECT COUNT(*) AS total FROM nested_source_rows
      expect: {rows: 1,data: [{total: 3}]}

- name: A syntactically scalar wrapper adopts its relational dependency in the consuming plan
  tds:
    statements:
    - sql: |
        CREATE FUNCTION dbo.nested_forward(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SET @value=dbo.Nested_Read_Inner(@key);
          RETURN @value;
        END
    - sql: CREATE FUNCTION dbo.nested_return(@key INT) RETURNS INT AS BEGIN RETURN dbo.nested_forward(@key); END
    - sql: SELECT id,dbo.nested_return(id) AS value FROM nested_source_rows ORDER BY id
      expect: {rows: 3,data: [{id: 1,value: 3},{id: 2,value: 10},{id: 3,value: 10}]}
- name: Scalar arithmetic arguments enter the same typed one-row state packet
  sql: SELECT id,dbo.nested_forward(id+0) AS value FROM nested_source_rows ORDER BY id
  expect: {rows: 3,data: [{id: 1,value: 3},{id: 2,value: 10},{id: 3,value: 10}]}
- name: Legacy datetime arithmetic arguments retain declared conversion and NULL semantics
  tds:
    statements:
    - sql: CREATE TABLE nested_source_dates(id INT PRIMARY KEY,occurred_at DATETIME)
    - sql: INSERT nested_source_dates VALUES(1,'2026-01-02'),(2,'2026-01-03'),(3,NULL)
    - sql: |
        CREATE FUNCTION dbo.nested_date_day(@day DATETIME) RETURNS INT AS BEGIN
          DECLARE @count INT;
          SELECT @count=COUNT(*) FROM nested_source_rows;
          RETURN DAY(@day)+@count;
        END
    - sql: SELECT id,dbo.nested_date_day(occurred_at-1) AS value FROM nested_source_dates ORDER BY id
      expect: {rows: 3,data: [{id: 1,value: 4},{id: 2,value: 5},{id: 3,value: null}]}
- name: A stored view compiles transitive relational dependencies through normal source guards
  sql: CREATE VIEW dbo.nested_forward_view AS SELECT id,dbo.nested_return(id) AS value FROM nested_source_rows
- name: MySQL consumes the stored typed relational wrapper view
  syntax: mysql
  sql: SELECT id,value FROM nested_forward_view ORDER BY id
  expect: {rows: 3,data: [{id: 1,value: 3},{id: 2,value: 10},{id: 3,value: 10}]}
- name: PostgreSQL consumes the same stored typed relational wrapper view
  syntax: psql
  sql: SELECT id,value FROM nested_forward_view ORDER BY id
  expect: {rows: 3,data: [{id: 1,value: 3},{id: 2,value: 10},{id: 3,value: 10}]}
- name: Warm wrapper plans change execution kind with the actual callee snapshot
  tds:
    statements:
    - sql: CREATE FUNCTION dbo.nested_kind_inner(@key INT) RETURNS INT AS BEGIN RETURN @key+2; END
    - sql: |
        CREATE FUNCTION dbo.nested_kind_wrapper(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SET @value=dbo.nested_kind_inner(@key);
          RETURN @value;
        END
    - sql: SELECT dbo.nested_kind_wrapper(3) AS value
      expect: {rows: 1,data: [{value: 5}]}
    - sql: DROP FUNCTION dbo.nested_kind_inner
    - sql: |
        CREATE FUNCTION dbo.nested_kind_inner(@key INT) RETURNS INT AS BEGIN
          DECLARE @value INT;
          SELECT @value=SUM(value) FROM nested_source_rows WHERE id<=@key;
          RETURN @value;
        END
    - sql: SELECT dbo.nested_kind_wrapper(3) AS value
      expect: {rows: 1,data: [{value: 10}]}
    - sql: DROP FUNCTION dbo.nested_kind_inner
    - sql: CREATE FUNCTION dbo.nested_kind_inner(@key INT) RETURNS INT AS BEGIN RETURN @key+20; END
    - sql: SELECT dbo.nested_kind_wrapper(3) AS value
      expect: {rows: 1,data: [{value: 23}]}
- name: A volatile scalar argument is evaluated once for each actual input row
  tds:
    statements:
    - sql: CREATE TABLE nested_argument_values(id INT PRIMARY KEY,value NVARCHAR(80))
    - sql: |
        CREATE FUNCTION dbo.nested_argument_text(@value NVARCHAR(36)) RETURNS NVARCHAR(80) AS BEGIN
          DECLARE @count INT;
          SELECT @count=COUNT(*) FROM nested_source_rows;
          RETURN @value+N'|'+@value;
        END
    - sql: INSERT nested_argument_values SELECT id,dbo.nested_argument_text(CONVERT(NVARCHAR(36),NEWID())) FROM nested_source_rows
    - sql: SELECT COUNT(*) AS total,COUNT(DISTINCT value) AS distinct_values,SUM(CASE WHEN LEFT(value,36)=RIGHT(value,36) THEN 1 ELSE 0 END) AS equal_halves,MIN(LEN(value)) AS width FROM nested_argument_values
      expect: {rows: 1,data: [{total: 3,distinct_values: 3,equal_halves: 3,width: 73}]}
- name: Pure state fusion and later relational assignment retain the same argument value
  tds:
    statements:
    - sql: |
        CREATE FUNCTION dbo.nested_argument_copy(@value NVARCHAR(36)) RETURNS NVARCHAR(80) AS BEGIN
          DECLARE @copy NVARCHAR(36);
          DECLARE @count INT;
          SET @copy=@value;
          SELECT @count=COUNT(*) FROM nested_source_rows;
          RETURN @copy+N'|'+@value;
        END
    - sql: DELETE FROM nested_argument_values
    - sql: INSERT nested_argument_values SELECT id,dbo.nested_argument_copy(CONVERT(NVARCHAR(36),NEWID())) FROM nested_source_rows
    - sql: SELECT COUNT(*) AS total,COUNT(DISTINCT value) AS distinct_values,SUM(CASE WHEN LEFT(value,36)=RIGHT(value,36) THEN 1 ELSE 0 END) AS equal_halves,MIN(LEN(value)) AS width FROM nested_argument_values
      expect: {rows: 1,data: [{total: 3,distinct_values: 3,equal_halves: 3,width: 73}]}
