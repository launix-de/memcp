# INFORMATION_SCHEMA virtual table coverage
# Covers: SCHEMATA, TABLES, COLUMNS queries used by ORMs, migration tools, and dbcheck

metadata:
  version: "1.0"
  description: "INFORMATION_SCHEMA virtual table queries"
  isolated: true

setup:
  - sql: "CREATE TABLE IF NOT EXISTS isc_test_tbl (id INT, name VARCHAR(50), score DOUBLE)"
  - sql: "CREATE TRIGGER isc_test_bi BEFORE INSERT ON isc_test_tbl FOR EACH ROW SET NEW.name = COALESCE(NEW.name, 'synthetic')"
  - scm: '(createtable "memcp-tests" ".is_hidden_meta" (list (list "column" "id" "int" (list) (list))) (list "engine" "sloppy") true)'

test_cases:

  # --- SCHEMATA ---

  - name: "SCHEMATA: list schemas"
    sql: "SELECT schema_name FROM INFORMATION_SCHEMA.SCHEMATA LIMIT 5"
    expect:
      min_rows: 1

  - name: "SCHEMATA: constant select from schemata"
    sql: "SELECT 1 FROM INFORMATION_SCHEMA.SCHEMATA LIMIT 1"
    expect:
      rows: 1

  # --- TABLES ---

  - name: "TABLES: constant select"
    sql: "SELECT 1 FROM INFORMATION_SCHEMA.TABLES LIMIT 1"
    expect:
      rows: 1

  - name: "TABLES: table existence check"
    sql: "SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'isc_test_tbl' LIMIT 1"
    expect:
      rows: 1

  - name: "TABLES: select table_name with filter"
    sql: "SELECT table_name FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'isc_test_tbl' LIMIT 1"
    expect:
      rows: 1
      data:
        - table_name: "isc_test_tbl"

  - name: "TABLES: non-existent table returns empty"
    sql: "SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'nonexistent_xyz_99' LIMIT 1"
    expect:
      rows: 0

  - name: "TABLES: hidden dot-table is not listed"
    sql: "SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = '.is_hidden_meta' LIMIT 1"
    expect:
      rows: 0

  - name: "TABLES: filter by schema and table"
    sql: "SELECT table_name, table_type FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = 'memcp-tests' AND TABLE_NAME = 'isc_test_tbl' LIMIT 1"
    expect:
      rows: 1

  - name: "TABLES: select star"
    sql: "SELECT * FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'isc_test_tbl' LIMIT 1"
    expect:
      rows: 1

  # --- COLUMNS ---

  - name: "COLUMNS: list columns of a table"
    sql: "SELECT column_name FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = 'isc_test_tbl' ORDER BY column_name"
    expect:
      min_rows: 3

  - name: "COLUMNS: check data_type of a column"
    sql: "SELECT data_type FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = 'isc_test_tbl' AND COLUMN_NAME = 'name' LIMIT 1"
    expect:
      rows: 1

  - name: "COLUMNS: column_type query (used by dbcheck migrations)"
    sql: "SELECT column_type FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = 'isc_test_tbl' AND COLUMN_NAME = 'id' LIMIT 1"
    expect:
      rows: 1

  - name: "COLUMNS: MySQL-compatible default expressions"
    setup:
      - sql: "DROP TABLE IF EXISTS isc_defaults"
      - sql: "CREATE TABLE isc_defaults (id INT NOT NULL, optional_value INT NULL, label VARCHAR(20) DEFAULT 'fallback')"
    sql: "SELECT column_name, column_default FROM INFORMATION_SCHEMA.COLUMNS WHERE table_schema = 'memcp-tests' AND table_name = 'isc_defaults' ORDER BY ordinal_position"
    cleanup:
      - sql: "DROP TABLE IF EXISTS isc_defaults"
    expect:
      rows: 3
      data:
        - column_name: "id"
          column_default: null
        - column_name: "optional_value"
          column_default: "NULL"
        - column_name: "label"
          column_default: "'fallback'"

  - name: "COLUMNS: mysqldump generation metadata is non-null"
    sql: >
      SELECT column_name, extra, generation_expression, data_type
      FROM INFORMATION_SCHEMA.COLUMNS
      WHERE table_schema = 'memcp-tests' AND table_name = 'isc_test_tbl'
      ORDER BY ordinal_position
    expect:
      rows: 3

  # --- STATISTICS ---

  - name: "STATISTICS: query returns without error"
    sql: "SELECT * FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_NAME = 'isc_test_tbl' LIMIT 5"
    expect:
      min_rows: 0

  # --- KEY_COLUMN_USAGE ---

  - name: "KEY_COLUMN_USAGE: query returns without error"
    sql: "SELECT * FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE WHERE TABLE_NAME = 'isc_test_tbl' LIMIT 5"
    expect:
      min_rows: 0

  # --- REFERENTIAL_CONSTRAINTS ---

  - name: "REFERENTIAL_CONSTRAINTS: query returns without error"
    sql: "SELECT * FROM INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS WHERE TABLE_NAME = 'isc_test_tbl' LIMIT 5"
    expect:
      min_rows: 0

  # --- TRIGGERS (mysqldump compat) ---

  - name: "TRIGGERS: mysqldump discovers table trigger"
    sql: >
      SELECT trigger_name
      FROM INFORMATION_SCHEMA.TRIGGERS
      WHERE event_object_schema = DATABASE()
        AND event_object_table = 'isc_test_tbl'
    expect:
      rows: 1
      data:
        - trigger_name: "isc_test_bi"

  # --- FILES (mysqldump compat) ---

  - name: "FILES: empty result for compatibility"
    sql: "SELECT * FROM INFORMATION_SCHEMA.FILES LIMIT 5"
    expect:
      min_rows: 0

  - name: "FILES: mysqldump tablespace probe accepts legacy GROUP BY semantics"
    sql: >
      SELECT LOGFILE_GROUP_NAME, FILE_NAME, TOTAL_EXTENTS, INITIAL_SIZE, ENGINE, EXTRA
      FROM INFORMATION_SCHEMA.FILES
      WHERE FILE_TYPE = 'UNDO LOG'
        AND FILE_NAME IS NOT NULL
        AND LOGFILE_GROUP_NAME IS NOT NULL
        AND LOGFILE_GROUP_NAME IN (
          SELECT DISTINCT LOGFILE_GROUP_NAME
          FROM INFORMATION_SCHEMA.FILES
          WHERE FILE_TYPE = 'DATAFILE'
            AND TABLESPACE_NAME IN (
              SELECT DISTINCT TABLESPACE_NAME
              FROM INFORMATION_SCHEMA.PARTITIONS
              WHERE TABLE_SCHEMA IN ('memcp-tests')))
      GROUP BY LOGFILE_GROUP_NAME, FILE_NAME, ENGINE, TOTAL_EXTENTS, INITIAL_SIZE
      ORDER BY LOGFILE_GROUP_NAME
    expect:
      rows: 0

  - name: "FILES: mysqldump datafile probe exposes tablespace columns"
    sql: >
      SELECT DISTINCT TABLESPACE_NAME, FILE_NAME, LOGFILE_GROUP_NAME,
             EXTENT_SIZE, INITIAL_SIZE, ENGINE
      FROM INFORMATION_SCHEMA.FILES
      WHERE FILE_TYPE = 'DATAFILE'
        AND TABLESPACE_NAME IN (
          SELECT DISTINCT TABLESPACE_NAME
          FROM INFORMATION_SCHEMA.PARTITIONS
          WHERE TABLE_SCHEMA IN ('memcp-tests'))
      ORDER BY TABLESPACE_NAME, LOGFILE_GROUP_NAME
    expect:
      rows: 0

  # --- PARTITIONS (mysqldump compat) ---

  - name: "PARTITIONS: empty result for compatibility"
    sql: "SELECT * FROM INFORMATION_SCHEMA.PARTITIONS LIMIT 5"
    expect:
      min_rows: 0

  # --- JOINs between INFORMATION_SCHEMA tables ---

  - name: "JOIN key_column_usage with referential_constraints"
    sql: >
      SELECT key_column_usage.table_name AS tbl,
             column_name AS col,
             key_column_usage.referenced_table_name AS tbl2,
             referenced_column_name AS col2,
             delete_rule
      FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE
      JOIN INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS
        ON key_column_usage.constraint_schema = referential_constraints.constraint_schema
       AND key_column_usage.constraint_name = referential_constraints.constraint_name
      WHERE key_column_usage.referenced_table_name IS NOT NULL
        AND table_schema = 'memcp-tests'
    expect:
      min_rows: 0

  - name: "Foreign key metadata includes columns and actions"
    setup:
      - sql: "DROP TABLE IF EXISTS is_fk_child"
      - sql: "DROP TABLE IF EXISTS is_fk_parent"
      - sql: "CREATE TABLE is_fk_parent (id INT PRIMARY KEY, external_id INT, UNIQUE KEY is_uq_external (external_id))"
      - sql: "CREATE TABLE is_fk_child (id INT PRIMARY KEY, parent_id INT, CONSTRAINT is_fk_child_parent FOREIGN KEY (parent_id) REFERENCES is_fk_parent(id) ON DELETE SET NULL ON UPDATE CASCADE)"
    sql: >
      SELECT key_column_usage.constraint_name AS constraint_name,
             key_column_usage.column_name AS column_name,
             key_column_usage.referenced_table_name AS referenced_table_name,
             key_column_usage.referenced_column_name AS referenced_column_name,
             referential_constraints.update_rule AS update_rule,
             referential_constraints.delete_rule AS delete_rule
      FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE
      JOIN INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS
        ON key_column_usage.constraint_schema = referential_constraints.constraint_schema
       AND key_column_usage.constraint_name = referential_constraints.constraint_name
      WHERE key_column_usage.table_schema = 'memcp-tests'
        AND key_column_usage.constraint_name = 'is_fk_child_parent'
    cleanup:
      - sql: "DROP TABLE IF EXISTS is_fk_child"
      - sql: "DROP TABLE IF EXISTS is_fk_parent"
    expect:
      rows: 1
      data:
        - constraint_name: "is_fk_child_parent"
          column_name: "parent_id"
          referenced_table_name: "is_fk_parent"
          referenced_column_name: "id"
          update_rule: "CASCADE"
          delete_rule: "SET NULL"

  - name: "Unique constraints appear in key column usage"
    setup:
      - sql: "DROP TABLE IF EXISTS is_unique_metadata"
      - sql: "CREATE TABLE is_unique_metadata (id INT PRIMARY KEY, external_id INT, UNIQUE KEY is_uq_metadata_external (external_id))"
    sql: "SELECT constraint_name, column_name FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE WHERE table_schema = 'memcp-tests' AND table_name = 'is_unique_metadata' ORDER BY ordinal_position, constraint_name"
    cleanup:
      - sql: "DROP TABLE IF EXISTS is_unique_metadata"
    expect:
      rows: 2
      data:
        - constraint_name: "PRIMARY"
          column_name: "id"
        - constraint_name: "is_uq_metadata_external"
          column_name: "external_id"

  - name: "Unique constraint remains enforced"
    setup:
      - sql: "DROP TABLE IF EXISTS is_unique_enforced"
      - sql: "CREATE TABLE is_unique_enforced (id INT PRIMARY KEY, external_id INT, UNIQUE KEY is_uq_enforced_external (external_id))"
      - sql: "INSERT INTO is_unique_enforced VALUES (1, 7)"
    sql: "INSERT INTO is_unique_enforced VALUES (2, 7)"
    cleanup:
      - sql: "DROP TABLE IF EXISTS is_unique_enforced"
    expect:
      error: true

  - name: "A genuinely ambiguous metadata column is rejected"
    sql: >
      SELECT constraint_name
      FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE
      JOIN INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS
        ON key_column_usage.constraint_schema = referential_constraints.constraint_schema
       AND key_column_usage.constraint_name = referential_constraints.constraint_name
    expect:
      error: true

  - name: "JOIN tables with columns"
    sql: >
      SELECT t.table_name, c.column_name
      FROM INFORMATION_SCHEMA.TABLES t
      JOIN INFORMATION_SCHEMA.COLUMNS c
        ON t.table_schema = c.table_schema AND t.table_name = c.table_name
      WHERE t.table_name = 'isc_test_tbl'
      ORDER BY c.column_name
    expect:
      min_rows: 3

  # --- Case insensitivity ---

  - name: "Case insensitive schema name"
    sql: "SELECT 1 FROM information_schema.tables LIMIT 1"
    expect:
      rows: 1

  - name: "Mixed case schema name"
    sql: "SELECT 1 FROM Information_Schema.Tables LIMIT 1"
    expect:
      rows: 1

  - name: "Unsupported information_schema table fails clearly"
    sql: "SELECT * FROM INFORMATION_SCHEMA.UNSUPPORTED_MEMCP_TABLE"
    expect:
      error: true

cleanup:
  - sql: "DROP TRIGGER IF EXISTS isc_test_bi"
  - sql: "DROP TABLE IF EXISTS isc_test_tbl"
  - sql: "DROP TABLE IF EXISTS `.is_hidden_meta`"
