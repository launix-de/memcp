metadata:
  syntax: tsql
  description: SELECT INTO creates typed native local relations with ordinary lexical lifetime
  requires_tds: true
  isolated: true
test_cases:
  - name: CTE SELECT INTO retains duplicate rows and typed NULL values
    sql: |
      WITH seed AS (
        SELECT 1 AS id,CAST(N'one' AS NVARCHAR(4)) AS label
        UNION ALL SELECT 1,CAST(N'one' AS NVARCHAR(4))
        UNION ALL SELECT 2,CAST(NULL AS NVARCHAR(4))
      ), selected AS (SELECT id,label FROM seed)
      SELECT * INTO #cte_selected FROM selected;
      SELECT id,label FROM #cte_selected ORDER BY id;
    expect: {rows: 3, data: [{id: 1, label: one}, {id: 1, label: one}, {id: 2, label: null}]}
  - name: Stored CTE population binds a qualified temporary input after its creation
    setup:
      - sql: |
          CREATE PROCEDURE cte_temporary_population AS
            CREATE TABLE #cte_input (id INT);
            INSERT #cte_input VALUES (7);
            WITH chosen AS (SELECT id FROM dbo.#cte_input)
            SELECT * INTO #cte_output FROM chosen;
            SELECT id FROM #cte_output;
    sql: EXEC cte_temporary_population
    expect: {rows: 1, data: [{id: 7}]}
    cleanup:
      - sql: DROP PROCEDURE cte_temporary_population
  - name: Empty CTE population retains a writable typed declaration
    sql: |
      WITH empty_seed AS (SELECT CAST(1 AS INT) AS id WHERE 1=0)
      SELECT id INTO #cte_empty FROM empty_seed;
      INSERT #cte_empty VALUES (9);
      SELECT id FROM #cte_empty;
    expect: {rows: 1, data: [{id: 9}]}
  - name: CTE definitions remain local to their population statement
    sql: SELECT id FROM empty_seed
    expect: {error: true}
  - name: CTE SELECT INTO retains native transaction rollback through TDS
    tds:
      statements:
        - sql: BEGIN TRANSACTION
        - sql: "WITH seed AS (SELECT 5 AS id) SELECT id INTO #cte_rollback FROM seed"
        - sql: "SELECT id FROM dbo.#cte_rollback"
          expect: {rows: 1, data: [{id: 5}]}
        - sql: ROLLBACK TRANSACTION
        - sql: "SELECT id FROM #cte_rollback"
          expect: {error: true}
  - name: Ordinary SELECT INTO copies complete rows and NULL payloads
    session_id: select_into_session
    sql: |
      CREATE TABLE #source(id INT NOT NULL,label NVARCHAR(20));
      INSERT #source VALUES(1,N'first'),(2,NULL),(3,N'last');
      SELECT id,label INTO #copied FROM #source WHERE id<=2;
      SELECT id,label FROM #copied ORDER BY id;
    expect:
      rows: 2
      data: [{id: 1,label: first},{id: 2,label: null}]
  - name: SELECT INTO result persists across connection requests
    session_id: select_into_session
    sql: |
      SELECT COUNT(*) AS n FROM #copied
    expect: {rows: 1,data: [{n: 2}]}
  - name: Empty SELECT INTO preserves its declared columns
    session_id: select_into_session
    sql: |
      SELECT id,label INTO #empty FROM #source WHERE id<0;
      INSERT #empty VALUES(7,N'after');
      SELECT id,label FROM #empty;
    expect: {rows: 1,data: [{id: 7,label: after}]}
  - name: SELECT INTO cannot expose its local name to another connection
    session_id: select_into_other
    sql: |
      SELECT id FROM #copied
    expect: {error: true,contains: 'local temporary table does not exist: #copied'}
  - name: SELECT INTO uses normal TDS result and lifetime ownership
    tds:
      statements:
        - sql: |
            SELECT CAST(5 AS INT) AS id INTO #wire_result
        - sql: |
            SELECT id FROM #wire_result
          expect: {rows: 1,data: [{id: 5}]}
        - sql: |
            DROP TABLE #wire_result
        - sql: |
            SELECT id FROM #wire_result
          expect: {error: true}
  - name: Failed autocommit population leaves the newly created empty table
    session_id: select_into_session
    sql: "SELECT id,10/(id-1) AS quotient INTO #failed FROM #source WHERE id=1"
    expect: {error: true}
  - name: Empty declaration after population failure remains usable
    session_id: select_into_session
    sql: |
      INSERT #failed VALUES(8,9);
      SELECT id,quotient FROM #failed;
      DROP TABLE #failed;
    expect: {rows: 1,data: [{id: 8,quotient: 9}]}
cleanup:
  - session_id: select_into_session
    sql: |
      DROP TABLE IF EXISTS #empty
  - session_id: select_into_session
    sql: |
      DROP TABLE IF EXISTS #copied
  - session_id: select_into_session
    sql: |
      DROP TABLE IF EXISTS #source
