metadata:
  syntax: tsql
  description: SELECT INTO creates typed native local relations with ordinary lexical lifetime
  requires_tds: true
  isolated: true
test_cases:
  - name: Ordinary SELECT INTO copies complete rows and NULL payloads
    session_id: select_into_session
    sql: |
      CREATE TABLE #source(id INT NOT NULL,label NVARCHAR(20));
      INSERT #source VALUES(1,N'first'),(2,NULL),(3,N'last');
      SELECT id,label INTO #copied FROM #source WHERE id<=2;
      SELECT id,label FROM #copied ORDER BY id;
    expect:
      rows: 2
      data: [{id: 1,label: first},{id: 2,label: null}]
  - name: SELECT INTO result persists across connection requests
    session_id: select_into_session
    sql: |
      SELECT COUNT(*) AS n FROM #copied
    expect: {rows: 1,data: [{n: 2}]}
  - name: Empty SELECT INTO preserves its declared columns
    session_id: select_into_session
    sql: |
      SELECT id,label INTO #empty FROM #source WHERE id<0;
      INSERT #empty VALUES(7,N'after');
      SELECT id,label FROM #empty;
    expect: {rows: 1,data: [{id: 7,label: after}]}
  - name: SELECT INTO cannot expose its local name to another connection
    session_id: select_into_other
    sql: |
      SELECT id FROM #copied
    expect: {error: true,contains: 'local temporary table does not exist: #copied'}
  - name: SELECT INTO uses normal TDS result and lifetime ownership
    tds:
      statements:
        - sql: |
            SELECT CAST(5 AS INT) AS id INTO #wire_result
        - sql: |
            SELECT id FROM #wire_result
          expect: {rows: 1,data: [{id: 5}]}
        - sql: |
            DROP TABLE #wire_result
        - sql: |
            SELECT id FROM #wire_result
          expect: {error: true}
  - name: Failed autocommit population leaves the newly created empty table
    session_id: select_into_session
    sql: "SELECT id,10/(id-1) AS quotient INTO #failed FROM #source WHERE id=1"
    expect: {error: true}
  - name: Empty declaration after population failure remains usable
    session_id: select_into_session
    sql: |
      INSERT #failed VALUES(8,9);
      SELECT id,quotient FROM #failed;
      DROP TABLE #failed;
    expect: {rows: 1,data: [{id: 8,quotient: 9}]}
cleanup:
  - session_id: select_into_session
    sql: |
      DROP TABLE IF EXISTS #empty
  - session_id: select_into_session
    sql: |
      DROP TABLE IF EXISTS #copied
  - session_id: select_into_session
    sql: |
      DROP TABLE IF EXISTS #source
