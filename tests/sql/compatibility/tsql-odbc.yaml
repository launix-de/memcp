- name: Large Unicode suggestion keeps native MAX sentinel
  sql: sp_describe_undeclared_parameters N'SELECT CAST(@p AS NVARCHAR(MAX)) AS value'
  expect:
    rows: 1
    data:
    - suggested_system_type_name: nvarchar(max)
      suggested_max_length: -1
      suggested_tds_length: 65535
  noncritical: true
- name: View columns are described from neutral expressions
  sql: sp_columns @table_name=N'odbc_fixture_view',@ODBCVer=3
  expect:
    rows: 2
    data:
    - COLUMN_NAME: id
      DATA_TYPE: -5
      ORDINAL_POSITION: 1
