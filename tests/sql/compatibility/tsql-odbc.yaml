  sql: CREATE VIEW view_catalog_nested AS SELECT [Display Id] AS id,[Display Label] AS label FROM [ViewCatalog]
- name: View metadata fixture includes computed declarations without evaluation
  sql: CREATE VIEW view_catalog_computed AS SELECT id+1 AS next_id,CAST(label AS NVARCHAR(11)) AS short_label,1/0
    AS never_evaluate FROM view_catalog_base
