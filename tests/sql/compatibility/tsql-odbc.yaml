- name: View metadata fixture keeps native declaration contracts
  sql: CREATE TABLE view_catalog_base(id INT IDENTITY NOT NULL PRIMARY KEY, label NVARCHAR(17), amount DECIMAL(9,3), enabled
    BIT NOT NULL DEFAULT 1, d DATE)
