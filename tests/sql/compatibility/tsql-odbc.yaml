- sql: DROP TABLE IF EXISTS dbo.odbc_keys_parent
  name: 'Fixture cleanup 002: DROP TABLE IF EXISTS dbo.odbc_keys_parent'
- sql: DROP TABLE IF EXISTS dbo.odbc_keys_unique
  name: 'Fixture cleanup 003: DROP TABLE IF EXISTS dbo.odbc_keys_unique'
