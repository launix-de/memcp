    - COLUMN_NAME: second
      KEY_SEQ: 1
      PK_NAME: PRIMARY
    - COLUMN_NAME: first
      KEY_SEQ: 2
      PK_NAME: PRIMARY
  noncritical: true
- name: Case independent key lookup
  sql: sp_pkeys @table_name=N'ODBC_KEYS_PARENT'
  expect:
    rows: 2
  noncritical: true
- name: Unique keys do not become fabricated primary keys
  sql: sp_pkeys N'odbc_keys_unique'
  expect:
    rows: 0
  noncritical: true
- name: Missing key tables return an empty result
  sql: sp_pkeys N'absent_odbc_keys'
