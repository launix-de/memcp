    data:
    - COLUMN_NAME: id
      TYPE_NAME: int
  noncritical: true
- name: Generated row version is identified with native binary metadata
  sql: sp_special_columns N'odbc_keys_child',N'dbo',@qualifier=N'memcp-tests',@col_type=N'V',@scope=N'T',@nullable=N'U',@ODBCVer=3
  expect:
    rows: 1
    data:
    - COLUMN_NAME: rv
      DATA_TYPE: -2
      TYPE_NAME: rowversion
      PRECISION: 8
      LENGTH: 8
      PSEUDO_COLUMN: 1
  noncritical: true
- name: Ordinary columns are not invented row versions
  sql: sp_special_columns @table_name=N'odbc_keys_parent',@col_type=N'V'
  expect:
    rows: 0
  noncritical: true
- name: Invalid special column options fail
  sql: sp_special_columns @table_name=N'odbc_keys_parent',@col_type=N'X'
  expect:
    error: true
- name: Foreign key metadata preserves actual column order and actions
  sql: sp_fkeys @fktable_name=N'odbc_keys_child',@fktable_qualifier=N'memcp-tests'
  expect:
    rows: 2
    data:
    - PKTABLE_NAME: odbc_keys_parent
      PKCOLUMN_NAME: second
      FKTABLE_NAME: odbc_keys_child
      FKCOLUMN_NAME: p_second
      KEY_SEQ: 1
      UPDATE_RULE: 0
      DELETE_RULE: 2
      FK_NAME: FK_parent
      PK_NAME: PRIMARY
    - PKCOLUMN_NAME: first
      FKCOLUMN_NAME: p_first
      KEY_SEQ: 2
  noncritical: true
- name: Referenced table metadata finds referencing relationships
  sql: sp_fkeys @pktable_name=N'ODBC_KEYS_PARENT'
  expect:
    rows: 2
  noncritical: true
- name: Foreign key discovery requires an explicit table filter
  sql: sp_fkeys
  expect:
    error: true
- name: Unrelated foreign key tables return empty results
  sql: sp_fkeys @pktable_name=N'odbc_keys_unique'
  expect:
    rows: 0
  noncritical: true
- name: Metadata tracks a dropped foreign key immediately
  scm: (dropforeignkey (table "memcp-tests" false "odbc_keys_child" false) "FK_parent")
  expect:
    result: true
- name: Dropped foreign key metadata does not survive in snapshots
  sql: sp_fkeys @fktable_name=N'odbc_keys_child'
  expect:
    rows: 0
  noncritical: true
- name: Metadata tracks dropped unique keys
  scm: (dropkey (table "memcp-tests" false "odbc_keys_unique" false) "UQ_nullable")
  expect:
    result: true
- name: Dropped unique index metadata disappears
  sql: sp_statistics @table_name=N'odbc_keys_unique'
  expect:
    rows: 1
    data:
    - INDEX_NAME: UQ_id
  noncritical: true
- sql: DROP TABLE IF EXISTS dbo.odbc_keys_child
