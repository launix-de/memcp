metadata:
  syntax: tsql
  isolated: true
  description: Scalar assignment snapshots retain the executing native source owner without leaking lexical values
setup:
- sql: CREATE TABLE assignment_scope_values(id INT PRIMARY KEY,value INT)
- sql: ALTER TABLE assignment_scope_values ADD CONSTRAINT assignment_scope_default DEFAULT 9 FOR value
- sql: CREATE PROCEDURE assignment_scope_nested AS BEGIN DECLARE @value INT=99; DECLARE @object INT=OBJECT_ID(N'assignment_scope_default',N'D'); SELECT @value AS local_value,CASE WHEN @object>0 THEN 1 ELSE 0 END AS known_default; END
cleanup:
- sql: DROP PROCEDURE IF EXISTS assignment_scope_nested
- sql: DROP TABLE IF EXISTS assignment_scope_values
test_cases:
- name: DECLARE intrinsic metadata assignment borrows the request native owner
  sql: DECLARE @object INT=OBJECT_ID(N'assignment_scope_default',N'D'); SELECT CASE WHEN @object>0 THEN 1 ELSE 0 END AS known_default;
  expect: {rows: 1, data: [{known_default: 1}]}
- name: SELECT catalog assignment retains its scalar input and completed result
  sql: DECLARE @count INT=7; SELECT @count=COUNT(*) FROM sys.default_constraints WHERE name=N'assignment_scope_default'; SELECT @count AS actual;
  expect: {rows: 1, data: [{actual: 1}]}
- name: Nested module source ownership does not overwrite a caller local
  sql: DECLARE @value INT=7; EXEC assignment_scope_nested; SELECT @value AS caller_value;
  expect: {rows: 2, data: [{local_value: 99, known_default: 1}, {caller_value: 7}]}
- name: Independent assignment sources do not commit the caller data transaction
  sql: BEGIN TRANSACTION; INSERT assignment_scope_values(id) VALUES(1); DECLARE @object INT=OBJECT_ID(N'assignment_scope_default',N'D'); SELECT CASE WHEN @object>0 THEN 1 ELSE 0 END AS known_default; ROLLBACK TRANSACTION; SELECT COUNT(*) AS total FROM assignment_scope_values;
  expect: {rows: 2, data: [{known_default: 1}, {total: 0}]}
- name: Metadata assignment retains a materialized lexical table variable
  sql: DECLARE @items TABLE(id INT); INSERT @items VALUES(7); DECLARE @object INT=OBJECT_ID(N'assignment_scope_default',N'D'); DECLARE @value INT; SELECT @value=SUM(id) FROM @items; SELECT @value AS value,CASE WHEN @object>0 THEN 1 ELSE 0 END AS known_default;
  expect: {rows: 1, data: [{value: 7, known_default: 1}]}
- name: Metadata assignment retains an open global static cursor
  sql: DECLARE @value INT; DECLARE assignment_owner_cursor CURSOR GLOBAL STATIC FOR SELECT 7 AS id; OPEN assignment_owner_cursor; DECLARE @object INT=OBJECT_ID(N'assignment_scope_default',N'D'); FETCH NEXT FROM GLOBAL assignment_owner_cursor INTO @value; CLOSE GLOBAL assignment_owner_cursor; DEALLOCATE GLOBAL assignment_owner_cursor; SELECT @value AS value,CASE WHEN @object>0 THEN 1 ELSE 0 END AS known_default;
  expect: {rows: 1, data: [{value: 7, known_default: 1}]}
# Conversion compilers introduce these invocation inputs after parsing.
# https://learn.microsoft.com/sql/t-sql/statements/set-dateformat-transact-sql
- name: SELECT assignment retains the executing date format in an explicit conversion
  sql: SET DATEFORMAT dmy; DECLARE @value DATETIME; SELECT @value=CONVERT(DATETIME,'31.12.9999'); SELECT CONVERT(VARCHAR(8),@value,112) AS value;
  expect: {rows: 1, data: [{value: '99991231'}]}
- name: Implicit assignment conversion retains the executing date format
  sql: SET DATEFORMAT dmy; DECLARE @value DATETIME; SELECT @value='31.12.2024'; SELECT CONVERT(VARCHAR(8),@value,112) AS value;
  expect: {rows: 1, data: [{value: '20241231'}]}
- name: Variable initialization uses the same conversion context as SELECT assignment
  sql: SET DATEFORMAT dmy; DECLARE @value DATETIME='31.12.2024'; SELECT CONVERT(VARCHAR(8),@value,112) AS value;
  expect: {rows: 1, data: [{value: '20241231'}]}
- name: Repeated assignment reads the current date format rather than the preceding invocation
  sql: SET DATEFORMAT dmy; DECLARE @value DATETIME,@first VARCHAR(8); SELECT @value=CONVERT(DATETIME,'04/05/2024'); SET @first=CONVERT(VARCHAR(8),@value,112); SET DATEFORMAT mdy; SELECT @value=CONVERT(DATETIME,'04/05/2024'); SELECT @first AS first_value,CONVERT(VARCHAR(8),@value,112) AS second_value;
  expect: {rows: 1, data: [{first_value: '20240504', second_value: '20240405'}]}
- name: Assignment retains language introduced by a calendar compiler
  sql: SET LANGUAGE German; DECLARE @value NVARCHAR(30); SELECT @value=DATENAME(month,CONVERT(DATE,'20240101',112)); SELECT @value AS value;
  expect: {rows: 1, data: [{value: Januar}]}
- name: Assignment retains the executing first weekday
  sql: SET DATEFIRST 1; DECLARE @value INT; SELECT @value=DATEPART(weekday,CONVERT(DATE,'20240101',112)); SELECT @value AS value;
  expect: {rows: 1, data: [{value: 1}]}
- name: Ordered self assignment retains context introduced in its compiled reducer
  setup:
  - sql: INSERT assignment_scope_values VALUES(101,7),(102,8)
  cleanup:
  - sql: DELETE FROM assignment_scope_values WHERE id IN(101,102)
  sql: SET LANGUAGE German; DECLARE @value NVARCHAR(60)=''; SELECT @value=@value+DATENAME(month,CONVERT(DATE,'20240101',112)) FROM assignment_scope_values WHERE id IN(101,102) ORDER BY id; SELECT @value AS value;
  expect: {rows: 1, data: [{value: JanuarJanuar}]}
- name: Decorrelated scalar assignment retains its conversion inputs
  setup:
  - sql: INSERT assignment_scope_values VALUES(103,7)
  cleanup:
  - sql: DELETE FROM assignment_scope_values WHERE id=103
  sql: SET DATEFORMAT dmy; DECLARE @value DATETIME; SELECT @value=(SELECT CONVERT(DATETIME,'31.12.9999') FROM assignment_scope_values WHERE id=103); SELECT CONVERT(VARCHAR(8),@value,112) AS value;
  expect: {rows: 1, data: [{value: '99991231'}]}
- name: Zero-row trigger assignment inherits the caller conversion context
  setup:
  - sql: CREATE TABLE assignment_calendar_source(id INT PRIMARY KEY)
  - sql: CREATE TABLE assignment_calendar_audit(value DATETIME)
  - sql: CREATE TRIGGER assignment_calendar_trigger ON assignment_calendar_source AFTER UPDATE AS BEGIN DECLARE @value DATETIME; SELECT @value=CONVERT(DATETIME,'31.12.9999'); INSERT assignment_calendar_audit VALUES(@value); END
  cleanup:
  - sql: DROP TABLE IF EXISTS assignment_calendar_source
  - sql: DROP TABLE IF EXISTS assignment_calendar_audit
  sql: SET DATEFORMAT dmy; UPDATE assignment_calendar_source SET id=id WHERE 1=0; SELECT CONVERT(VARCHAR(8),value,112) AS value FROM assignment_calendar_audit;
  expect: {rows: 1, data: [{value: '99991231'}]}
