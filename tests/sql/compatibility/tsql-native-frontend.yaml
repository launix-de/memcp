      - sql: CREATE TABLE tsql_identity_parallel(id BIGINT IDENTITY PRIMARY KEY,writer INT)
    scm: |
      (begin
        (define execute (lambda (s sql) (begin
          (define out (newsession))
          (with_autocommit s nil nil sql (lambda (tx)
            (sql_execute_formula s tx (sql_queryplan_compile_formula
              tx (parse_tsql "memcp-tests" sql nil s tx))
              (lambda (row) (out "row" row)) (lambda fields true))))
          (out "row"))))
        (define results (parallelN 8 (lambda (writer) (begin
          (define s (newsession))
          (execute s (concat "INSERT INTO tsql_identity_parallel(writer) VALUES (" writer "),(" writer "),(" writer ")"))
          (define own (execute s (concat "SELECT MIN(id) AS first,MAX(id) AS last,COUNT(*) AS n FROM tsql_identity_parallel WHERE writer=" writer)))
          (and (equal? (own "n") 3) (equal? (- (own "last") (own "first")) 2)
            (equal? (s "last_insert_id") (own "first")))))))
        (and (reduce results (lambda (valid result) (and valid result)) true)
          (equal? ((execute (newsession) "SELECT COUNT(*) AS n FROM tsql_identity_parallel") "n") 24)))
    expect: {result: true}
