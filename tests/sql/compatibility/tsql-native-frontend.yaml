        (define lower (sql_expr_info sources (list (quote get_column) "c" false "value" false)))
        (define upper (sql_expr_info sources (list (quote get_column) "c" false "VALUE" false)))
        (and (equal? (sql_info_type lower) "VARCHAR") (equal? (sql_info_collation lower) '("bin" 2))
          (equal? (sql_info_type upper) "INT") (nil? (sql_info_collation upper))
          (expression_equal? (sql_info_formula lower) (list (quote get_column) "c" false "value" false))
          (expression_equal? (sql_info_formula upper) (list (quote get_column) "c" false "VALUE" false))))
