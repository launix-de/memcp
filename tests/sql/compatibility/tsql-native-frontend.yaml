    scm: |-
      (begin
        (define integer (sql_expr_info (list) (tsql_try_convert_expr nil "INT" (list) nil false)))
        (define text (sql_expr_info (list) (tsql_try_convert_expr
          (list (quote sql_type_expr) "box" "NVARCHAR" '("en_ci" 0)) "NVARCHAR" '(8) nil false)))
        (and (equal? (sql_info_type integer) "INT") (nil? (eval (sql_info_formula integer)))
          (equal? (sql_info_type text) "NVARCHAR") (equal? (sql_info_collation text) '("en_ci" 0))
          (not (regexp_test (string (sql_info_formula text)) "sql_type_expr|sql_compile_expr"))))
    expect:
      result: true
  - name: TRY conversion operand evaluation occurs exactly once before recovery
    scm: |-
      (begin
        (define observed (newsession))
        (define operand (lambda () (begin (observed "calls" (+ 1 (coalesceNil (observed "calls") 0))) "invalid")))
        (define info (sql_expr_info (list) (tsql_try_convert_expr
          (list (quote sql_type_expr) (list operand) "NVARCHAR" nil) "INT" (list) nil false)))
        (and (nil? (eval (sql_info_formula info))) (equal? (observed "calls") 1)))
    expect:
      result: true
  - name: TRY conversion input failures stay outside the recovery closure
    scm: |-
      (begin
        (define observed (newsession))
        (define operand (lambda () (begin (observed "calls" (+ 1 (coalesceNil (observed "calls") 0))) (error "operand failure"))))
        (define info (sql_expr_info (list) (tsql_try_convert_expr
          (list (quote sql_type_expr) (list operand) "NVARCHAR" nil) "INT" (list) nil false)))
        (and (try (lambda () (begin (eval (sql_info_formula info)) false)) (lambda (_cause) true))
          (equal? (observed "calls") 1)))
    expect:
      result: true
