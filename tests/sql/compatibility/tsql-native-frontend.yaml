  - name: native wire callback retains int64 values and cast metadata
    scm: |
      (begin
        (define session (newsession))
        (session "username" "root")
        (session "schema" "memcp-tests")
        (session "wire_metadata" true)
        (define output (newsession))
        (tds_frontend "execute" session
          (list "database" "memcp-tests" "parameters" (list) "declarations" ""
            "text" "SELECT CAST('9007199254740993' AS BIGINT) AS exact, CAST('9223372036854775807' AS BIGINT) AS maximum, CAST('1' AS BIT) AS flag, CAST(NULL AS FLOAT) AS absent")
          (lambda (values) (output "values" values))
          (lambda (fields) (output "fields" fields)) nil nil)
        (and (expression_equal? (car (output "values")) (tsql_parse_integer "9007199254740993"))
          (expression_equal? (cadr (output "values")) (tsql_parse_integer "9223372036854775807"))
          (equal? (nth (output "values") 2) true)
          (nil? (nth (output "values") 3))
          (equal? (map (output "fields") (lambda (field) (field "kind"))) '(38 38 104 109))))
    expect: {result: true}
