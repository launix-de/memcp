          (tsql_execute_statement tx "memcp-tests" sql s
            (lambda (row) (out "row" row)) (lambda fields true))))
        (out "row"))))
      (define s (newsession))
      (s "__tsql_scope" (newsession))
      (define empty_max (execute s "SELECT MAX(SCOPE_IDENTITY()) AS id FROM tsql_identity_functions_probe"))
      (execute s "INSERT INTO tsql_identity_functions(value) VALUES(10),(20),(30)")
      (define first_max (execute s "SELECT MAX(SCOPE_IDENTITY()) AS id FROM tsql_identity_functions_probe"))
      (define first (execute s "SELECT @@IDENTITY AS id,SCOPE_IDENTITY() AS scoped"))
      (execute s "BEGIN TRANSACTION")
      (execute s "INSERT INTO tsql_identity_functions(value) VALUES(40),(50)")
      (execute s "ROLLBACK")
      (define rolled (execute s "SELECT @@IDENTITY AS id,SCOPE_IDENTITY() AS scoped"))
      (define rolled_max (execute s "SELECT MAX(SCOPE_IDENTITY()) AS id FROM tsql_identity_functions_probe"))
      (and (nil? (empty_max "id")) (equal? (first_max "id") 3) (equal? (rolled_max "id") 5)
        (equal? (first "id") 3) (equal? (first "scoped") 3)
        (equal? (s "last_insert_id") 4)
        (equal? (rolled "id") 5) (equal? (rolled "scoped") 5)
        (equal? ((execute s "SELECT COUNT(*) AS n FROM tsql_identity_functions") "n") 3))
      )
    expect:
      result: true
