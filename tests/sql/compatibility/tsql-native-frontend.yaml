        (and (equal? (sql_info_type (sql_expr_info (list) (list (quote if) false absent small))) "SMALLINT")
          (equal? (sql_info_type (sql_expr_info (list) (list coalesceNil absent small))) "SMALLINT")
          (equal? (sql_info_type (sql_expr_info (list) (list (quote +) small small))) "BIGINT")))
