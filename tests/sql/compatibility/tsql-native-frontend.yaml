metadata:
  version: '1.0'
  syntax: tsql
  requires_tds: true
  description: T-SQL grammar reuses native DDL, defaults and query planning
setup:
  - sql: DROP TABLE IF EXISTS tsql_setup_memo
  - sql: CREATE TABLE tsql_setup_memo (id INT PRIMARY KEY, note NVARCHAR(200), code INT, money_code MONEY, smallmoney_code SMALLMONEY, date_code DATE, time_code TIME, datetime_code DATETIME)
  - sql: INSERT INTO tsql_setup_memo (id,note,code,money_code,smallmoney_code) VALUES (1,N'pending',13,65.9,65.9),(2,NULL,NULL,NULL,NULL),(3,N'pending',228,65.5,65.4)
  - sql: DROP TABLE IF EXISTS tsql_optional_insert
  - sql: CREATE TABLE tsql_optional_insert (id INT PRIMARY KEY, label NVARCHAR(80))
  - sql: DROP TABLE IF EXISTS tsql_unary_contract
  - sql: CREATE TABLE tsql_unary_contract(id INT PRIMARY KEY,value TINYINT)
  - sql: INSERT INTO tsql_unary_contract VALUES (1,255)
  - sql: DROP TABLE IF EXISTS tsql_seeded_identity
  - sql: DROP TABLE IF EXISTS tsql_empty_seed
  - sql: DROP TABLE IF EXISTS tsql_bad_seed
  - sql: DROP TABLE IF EXISTS tsql_add_contracts
  - sql: DROP TABLE IF EXISTS tsql_add_copy
  - sql: CREATE TABLE tsql_add_contracts (id INT PRIMARY KEY,a INT,b SMALLINT,txt NVARCHAR(20),suffix VARCHAR(20))
  - sql: CREATE TABLE tsql_add_copy (id INT PRIMARY KEY,value INT)
  - sql: INSERT INTO tsql_add_contracts VALUES (1,10,2,N'3','x'),(2,NULL,2,NULL,'x')
  - sql: DROP TABLE IF EXISTS tsql_terminator_probe
  - sql: DROP TABLE IF EXISTS tsql_terminator_rejected
  - sql: DROP TABLE IF EXISTS tsql_index_reserved
  - sql: CREATE TABLE tsql_index_reserved (id INT)
  - sql: DROP TABLE IF EXISTS tsql_index_rows
  - sql: DROP TABLE IF EXISTS tsql_index_duplicates
  - sql: DROP TABLE IF EXISTS tsql_index_nulls
  - sql: CREATE TABLE tsql_index_rows (id INT PRIMARY KEY,tenant INT,Code NVARCHAR(80))
  - sql: INSERT INTO tsql_index_rows VALUES (1,1,N'A'),(2,2,N'A')
  - sql: CREATE TABLE tsql_index_duplicates (id INT PRIMARY KEY,value INT)
  - sql: INSERT INTO tsql_index_duplicates VALUES (1,9),(2,9)
  - sql: CREATE TABLE tsql_index_nulls (id INT PRIMARY KEY,value INT)
  - sql: INSERT INTO tsql_index_nulls VALUES (1,NULL)
  - sql: DROP TABLE IF EXISTS tsql_assignment_probe
  - sql: CREATE TABLE tsql_assignment_probe (id INT PRIMARY KEY,tiny TINYINT,amount DECIMAL(5,2))
  - sql: DROP TABLE IF EXISTS tsql_default_row
  - sql: DROP TABLE IF EXISTS tsql_default_required
  - sql: CREATE TABLE tsql_default_row (id INT IDENTITY PRIMARY KEY,amount INT NOT NULL DEFAULT ((7)),label NVARCHAR(30) DEFAULT N'Grüße',nullable_value INT)
  - sql: CREATE TABLE tsql_default_required (value INT NOT NULL)
  - sql: DROP TABLE IF EXISTS tsql_having_input
  - sql: CREATE TABLE tsql_having_input (id INT PRIMARY KEY)
  - sql: INSERT INTO tsql_having_input VALUES (1)
  - sql: DROP TABLE IF EXISTS tsql_cast_collation
  - sql: DROP TABLE IF EXISTS tsql_setup_catalog
  - sql: DROP TABLE IF EXISTS tsql_setup_columns
  - sql: DROP TABLE IF EXISTS tsql_setup_key
  - sql: DROP TABLE IF EXISTS tsql_setup_named_key
  - sql: DROP VIEW IF EXISTS [tsql_native_view]
  - sql: DROP TABLE IF EXISTS [tsql_native_copy]
  - sql: CREATE TABLE [tsql_native_copy] ([id] INT PRIMARY KEY, [name] NVARCHAR(80))
  - sql: DROP TABLE IF EXISTS [tsql_fk_child]
  - sql: DROP TABLE IF EXISTS [tsql_fk_parent]
  - sql: CREATE TABLE [tsql_fk_parent] ([id] INT PRIMARY KEY)
  - sql: CREATE TABLE [tsql_fk_child] ([id] INT PRIMARY KEY, [parent_id] INT, CONSTRAINT [tsql_native_fk] FOREIGN KEY ([parent_id]) REFERENCES [tsql_fk_parent] ([id]) ON DELETE CASCADE)
  - sql: INSERT INTO [tsql_fk_parent] VALUES (1)
  - sql: INSERT INTO [tsql_fk_child] VALUES (1,1)
  - sql: DROP TABLE IF EXISTS [tsql_native]
  - sql: CREATE TABLE [dbo].[tsql_native] ([id] INT IDENTITY(1,1) PRIMARY KEY, [name] NVARCHAR(80), [amount] INT NOT NULL DEFAULT (7))
  - sql: INSERT INTO [dbo].[tsql_native] ([name]) VALUES (N'Grüße'), (N'O''Brien')
  - sql: DROP TABLE IF EXISTS tsql_hex_copy
  - sql: DROP TABLE IF EXISTS tsql_hex_input
  - sql: CREATE TABLE tsql_hex_input(id INT PRIMARY KEY,hex NVARCHAR(20),bytes VARBINARY(4))
  - sql: INSERT tsql_hex_input VALUES(1,N'0x00Ff',0x00FF),(2,N'0x10A0',0x10A0),(3,NULL,NULL)
  - sql: CREATE TABLE tsql_hex_copy(id INT PRIMARY KEY,bytes VARBINARY(4))


test_cases:
  - name: Setup text uses national character control codes
    sql: SELECT N'first'+NCHAR(13)+NCHAR(10)+N'second' AS value
    expect: {rows: 1, data: [{value: "first\r\nsecond"}]}
  - name: National characters use declared text contracts
    sql: SELECT NCHAR(65) AS ascii_value,NCHAR(228) AS national_value,NCHAR(8364) AS currency_value
    expect: {rows: 1, data: [{ascii_value: A, national_value: ä, currency_value: €}]}
  - name: National characters convert their integer argument
    sql: SELECT NCHAR(N'65') AS text_value,NCHAR(65.9) AS truncated_value
    expect: {rows: 1, data: [{text_value: A, truncated_value: A}]}
  - name: National character invalid default range returns null
    sql: SELECT NCHAR(-1) AS negative,NCHAR(65536) AS outside,NCHAR(NULL) AS missing
    expect: {rows: 1, data: [{negative: null, outside: null, missing: null}]}
  - name: National character isolated high surrogate is explicitly unsupported
    sql: SELECT NCHAR(55296) AS value
    expect: {error: true, contains: invalid Unicode scalar value}
  - name: National character isolated low surrogate is explicitly unsupported
    sql: SELECT NCHAR(57343) AS value
    expect: {error: true, contains: invalid Unicode scalar value}
  - name: National character invalid integer text fails
    sql: SELECT NCHAR(N'13x') AS value
    expect: {error: true}
  - name: National character money inputs use declared rounding rules
    sql: SELECT id,NCHAR(money_code) AS money_value,NCHAR(smallmoney_code) AS smallmoney_value FROM tsql_setup_memo ORDER BY id
    expect: {rows: 3, data: [{id: 1, money_value: B, smallmoney_value: B}, {id: 2, money_value: null, smallmoney_value: null}, {id: 3, money_value: B, smallmoney_value: A}]}
  - name: National character derived projection retains money conversion rules
    sql: SELECT NCHAR(value) AS value FROM (SELECT money_code AS value FROM tsql_setup_memo WHERE id=1) AS projected
    expect: {rows: 1, data: [{value: B}]}
  - name: National character aggregate retains declared money conversion rules
    sql: SELECT NCHAR(SUM(money_code)) AS value FROM tsql_setup_memo WHERE id=1
    expect: {rows: 1, data: [{value: B}]}
  - name: National character coalesce retains declared money conversion rules
    sql: SELECT NCHAR(COALESCE(money_code,0)) AS value FROM tsql_setup_memo WHERE id=1
    expect: {rows: 1, data: [{value: B}]}
  - name: Null fallback retains money metadata for null input rows
    sql: SELECT id,NCHAR(COALESCE(money_code,66)) AS value FROM tsql_setup_memo ORDER BY id
    expect: {rows: 3, data: [{id: 1,value: B},{id: 2,value: B},{id: 3,value: B}]}
  - name: Null fallback converts national integer text to the declared numeric result
    sql: SELECT COALESCE(CAST(NULL AS INT),N'42')+2 AS value
    expect: {rows: 1, data: [{value: 44}]}
  - name: Null fallback preserves zero and does not evaluate a later bad conversion
    sql: SELECT COALESCE(0,N'invalid') AS value
    expect: {rows: 1, data: [{value: 0}]}
  - name: Null fallback rejects a selected invalid integer conversion
    sql: SELECT COALESCE(CAST(NULL AS INT),N'invalid') AS value
    expect: {error: true}
  - name: Null fallback rejects only untyped null arguments
    sql: SELECT COALESCE(NULL,NULL) AS value
    expect: {error: true, contains: declared non-NULL type}
  - name: Null fallback accepts a declared null result
    sql: SELECT COALESCE(CAST(NULL AS SMALLINT),NULL) AS value
    expect: {rows: 1, data: [{value: null}]}
  - name: Null fallback requires more than one argument
    sql: SELECT COALESCE(1) AS value
    expect: {error: true, contains: at least two arguments}
  - name: Null fallback uses numeric result metadata without executing rows
    scm: |
      (begin
        (define fields (tds_describe "memcp-tests" "SELECT TOP(0) COALESCE(money_code,0) AS value FROM tsql_setup_memo" "" (newsession)))
        (equal? ((car fields) "sql_type") "MONEY"))
    expect: {result: true}
  - name: National character DATE input cannot inherit its NULL carrier type
    sql: SELECT NCHAR(date_code) AS value FROM tsql_setup_memo
    expect: {error: true, contains: implicitly convertible integer expression}
  - name: National character TIME input cannot inherit its NULL carrier type
    sql: SELECT NCHAR(time_code) AS value FROM tsql_setup_memo
    expect: {error: true, contains: implicitly convertible integer expression}
  - name: National character DATETIME requires explicit integer conversion
    sql: SELECT NCHAR(datetime_code) AS value FROM tsql_setup_memo
    expect: {error: true, contains: implicitly convertible integer expression}
  - name: National character invalid input contract fails even with no rows
    sql: SELECT NCHAR(date_code) AS value FROM tsql_setup_memo WHERE id=-1
    expect: {error: true, contains: implicitly convertible integer expression}
  - name: National character description validates its declared input contract
    scm: '(tds_describe "memcp-tests" "SELECT TOP(0) NCHAR(date_code) AS value FROM tsql_setup_memo" "" (newsession))'
    expect: {error: true, contains: implicitly convertible integer expression}
  - name: National character input reads native declared columns
    sql: SELECT id,NCHAR(code) AS value FROM tsql_setup_memo ORDER BY id
    expect: {rows: 3, data: [{id: 1, value: "\r"}, {id: 2, value: null}, {id: 3, value: ä}]}
  - name: Setup memo update uses existing native mutation
    sql: UPDATE tsql_setup_memo SET note=N'approved'+NCHAR(13)+NCHAR(10)+N'pending' WHERE id=1
    expect: {affected_rows: 1}
  - name: Setup memo update stores its control characters
    sql: SELECT note FROM tsql_setup_memo WHERE id=1
    expect: {rows: 1, data: [{note: "approved\r\npending"}]}
  - name: National character description remains declared even for null or empty results
    scm: |
      (begin
        (define fields (tds_describe "memcp-tests" "SELECT TOP(0) NCHAR(NULL) AS missing,NCHAR(code) AS value FROM tsql_setup_memo" "" (newsession)))
        (reduce fields (lambda (valid field) (and valid (equal? (field "sql_type") "NCHAR"))) true))
    expect: {result: true}
  - name: National character compiled code contains no SQL metadata wrappers
    scm: |
      (not (regexp_test (string (parse_tsql "memcp-tests" "SELECT NCHAR(code) AS value FROM tsql_setup_memo" nil nil nil)) "sql_type_expr|sql_compile_expr"))
    expect: {result: true}
  - name: Tiny unsigned negation retains its signed value
    sql: SELECT -value AS value FROM tsql_unary_contract
    expect: {rows: 1, data: [{value: -255}]}
  - name: Tiny cast negation describes a signed small result
    scm: '((car (tds_describe "memcp-tests" "SELECT -CAST(1 AS TINYINT) AS value" "" (newsession))) "sql_type")'
    expect: {result: SMALLINT}
  - name: Nullable tiny negation describes a signed small result
    scm: '((car (tds_describe "memcp-tests" "SELECT -CAST(NULL AS TINYINT) AS value" "" (newsession))) "sql_type")'
    expect: {result: SMALLINT}
  - name: Empty tiny column negation describes a signed small result
    scm: '((car (tds_describe "memcp-tests" "SELECT TOP (0) -value AS value FROM tsql_unary_contract" "" (newsession))) "sql_type")'
    expect: {result: SMALLINT}
  - name: Addition chooses operators from declared contracts for identical formulas
    scm: |
      (begin
        (define numeric (sql_expr_info '()
          (tsql_add_expr (list (quote sql_type_expr) nil "INT" nil)
            (list (quote sql_type_expr) nil "SMALLINT" nil))))
        (define text (sql_expr_info '()
          (tsql_add_expr (list (quote sql_type_expr) nil "NVARCHAR" '("bin" 2))
            (list (quote sql_type_expr) nil "VARCHAR" '("bin" 4)))))
        (and (equal? (sql_info_type numeric) "INT")
          (expression_equal? (sql_info_formula numeric) (list (quote +) nil nil))
          (equal? (sql_info_type text) "NVARCHAR")
          (expression_equal? (sql_info_formula text) (list (quote concat) nil nil))
          (expression_equal? (sql_info_collation text) '("bin" 2))))
    expect: {result: true}
  - name: Addition compiler refuses unresolved contracts
    scm: |
      (try (lambda () (begin
        (tsql_compile_addition (list (sql_info nil "any" nil) (sql_info 1 "INT" nil))) false))
        (lambda (_) true))
    expect: {result: true}
  - name: Character operands concatenate even when they spell numbers
    sql: SELECT '12'+'3' AS value
    expect: {rows: 1, data: [{value: '123'}]}
  - name: Integer precedence converts the left character operand
    sql: SELECT '12'+CAST(3 AS INT) AS value
    expect: {rows: 1, data: [{value: 15}]}
  - name: Integer precedence converts the right character operand
    sql: SELECT CAST(3 AS INT)+'12' AS value
    expect: {rows: 1, data: [{value: 15}]}
  - name: Float precedence converts a fractional character operand
    sql: SELECT CAST(1 AS FLOAT)+'2.5' AS value
    expect: {rows: 1, data: [{value: 3.5}]}
  - name: Mixed numeric addition rejects invalid integer text
    sql: SELECT 'invalid'+CAST(3 AS INT) AS value
    expect: {error: true, contains: invalid integer text}
  - name: Mixed integer addition rejects fractional text
    sql: SELECT '1.5'+CAST(3 AS INT) AS value
    expect: {error: true, contains: invalid integer text}
  - name: Typed null addition keeps its integer contract
    sql: SELECT CAST(NULL AS INT)+'3' AS value
    expect: {rows: 1, data: [{value: null}]}
  - name: Character plus null keeps null propagation
    sql: SELECT CAST(NULL AS NVARCHAR(20))+'x' AS value
    expect: {rows: 1, data: [{value: null}]}
  - name: Two bit operands cannot choose an arithmetic overload
    sql: SELECT CAST(1 AS BIT)+CAST(0 AS BIT) AS value
    expect: {error: true, contains: unsupported SQL operands}
  - name: Declared columns select numeric addition and null propagation
    sql: SELECT id,a+b AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: 12}, {id: 2, value: null}]}
  - name: Column contracts convert mixed character input
    sql: SELECT a+txt AS forward,txt+a AS backward FROM tsql_add_contracts WHERE id=1
    expect: {rows: 1, data: [{forward: 13, backward: 13}]}
  - name: Character column contracts select native concatenation
    sql: SELECT id,txt+suffix AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: '3x'}, {id: 2, value: null}]}
  - name: Addition contracts survive case branches
    sql: SELECT CASE WHEN id=1 THEN a+txt ELSE NULL END AS value FROM tsql_add_contracts WHERE id=1
    expect: {rows: 1, data: [{value: 13}]}
  - name: Addition contracts resolve a derived projection
    sql: SELECT d.a+d.txt AS value FROM (SELECT a,txt FROM tsql_add_contracts) AS d WHERE d.a IS NOT NULL
    expect: {rows: 1, data: [{value: 13}]}
  - name: Addition contracts resolve aggregate input through the shared planner
    sql: SELECT SUM(a+txt) AS value FROM tsql_add_contracts WHERE id=1
    expect: {rows: 1, data: [{value: 13}]}
  - name: Addition contracts resolve window input through the shared planner
    sql: SELECT id,SUM(a+txt) OVER () AS value FROM tsql_add_contracts WHERE id=1
    expect: {rows: 1, data: [{id: 1, value: 13}]}
  - name: Addition around aggregate results keeps numeric operand contracts
    sql: SELECT SUM(a)+SUM(CAST(txt AS INT)) AS value FROM tsql_add_contracts
    expect: {rows: 1, data: [{value: 13}]}
  - name: Addition around a character aggregate keeps concatenation semantics
    sql: SELECT MAX(txt)+'2' AS value FROM tsql_add_contracts
    expect: {rows: 1, data: [{value: '32'}]}
  - name: Defaulted aggregate result keeps numeric precedence
    sql: SELECT COALESCE(SUM(a),0)+'2' AS value FROM tsql_add_contracts
    expect: {rows: 1, data: [{value: 12}]}
  - name: Count result retains its integer addition contract
    sql: SELECT COUNT(*)+'2' AS value FROM tsql_add_contracts
    expect: {rows: 1, data: [{value: 4}]}
  - name: Grouped aggregate results use the same addition compiler
    sql: SELECT suffix,SUM(a)+COUNT(*) AS value FROM tsql_add_contracts GROUP BY suffix
    expect: {rows: 1, data: [{suffix: x, value: 12}]}
  - name: Derived aggregate producer keeps its contract after scope rewrite
    sql: SELECT total+N'2' AS value FROM (SELECT SUM(a) AS total FROM tsql_add_contracts) AS d
    expect: {rows: 1, data: [{value: 12}]}
  - name: Outer aggregate keeps the grouped derived producer contract
    sql: SELECT MAX(total)+N'2' AS value FROM (SELECT SUM(a) AS total FROM tsql_add_contracts GROUP BY suffix) AS d
    expect: {rows: 1, data: [{value: 12}]}
  - name: Scalar subquery preserves its declared numeric result contract
    sql: SELECT (SELECT CAST('42' AS INT))+N'2' AS value
    expect: {rows: 1, data: [{value: 44}]}
  - name: Scalar subquery preserves its declared character result contract
    sql: SELECT (SELECT N'ab')+N'c' AS value
    expect: {rows: 1, data: [{value: abc}]}
  - name: Scalar subquery preserves its declared typed null contract
    sql: SELECT (SELECT CAST(NULL AS INT))+N'2' AS value
    expect: {rows: 1, data: [{value: null}]}
  - name: Empty scalar keeps its declared type and native null cardinality result
    sql: SELECT (SELECT a FROM tsql_add_contracts WHERE id<0)+N'2' AS value
    expect: {rows: 1, data: [{value: null}]}
  - name: Correlated scalar keeps the native planner and declared result type
    sql: SELECT p.id,(SELECT n.b FROM tsql_add_contracts AS n WHERE n.id=p.id)+N'2' AS value FROM tsql_add_contracts AS p ORDER BY p.id
    expect: {rows: 2, data: [{id: 1, value: 4}, {id: 2, value: 4}]}
  - name: Scalar metadata respects inner alias shadowing
    sql: SELECT p.id,(SELECT b FROM tsql_add_contracts AS p WHERE p.id=1)+N'2' AS value FROM tsql_add_contracts AS p ORDER BY p.id
    expect: {rows: 2, data: [{id: 1, value: 4}, {id: 2, value: 4}]}
  - name: Scalar metadata does not hide invalid multi column scalar shapes
    sql: SELECT (SELECT CAST(1 AS INT),CAST(2 AS INT))+N'2' AS value
    expect: {error: true}
  - name: Scalar metadata does not execute or collapse multiple native rows
    sql: SELECT (SELECT b FROM tsql_add_contracts)+N'2' AS value
    expect: {error: true}
  - name: Union producer keeps identical declared numeric contracts by position
    sql: SELECT v+N'2' AS value FROM (SELECT CAST('42' AS INT) AS v UNION ALL SELECT CAST('7' AS INT) AS other_name) AS d
    expect: {rows: 2, data: [{value: 44}, {value: 9}]}
  - name: Union producer keeps declared null and integer contracts
    sql: SELECT v+N'2' AS value FROM (SELECT CAST(NULL AS INT) AS v UNION ALL SELECT CAST('7' AS INT) AS v) AS d
    expect: {rows: 2, data: [{value: null}, {value: 9}]}
  - name: Ranking row number has a frontend bigint contract
    sql: SELECT id,ROW_NUMBER() OVER(ORDER BY id)+N'2' AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: 3}, {id: 2, value: 4}]}
  - name: Ranking rank has a frontend bigint contract
    sql: SELECT id,RANK() OVER(ORDER BY id)+N'2' AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: 3}, {id: 2, value: 4}]}
  - name: Ranking dense rank has a frontend bigint contract
    sql: SELECT id,DENSE_RANK() OVER(ORDER BY suffix)+N'2' AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: 3}, {id: 2, value: 3}]}
  - name: Lag output keeps its declared integer operand type
    sql: SELECT id,LAG(b) OVER(ORDER BY id)+1 AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: null}, {id: 2, value: 3}]}
  - name: Lead output keeps its declared integer operand type
    sql: SELECT id,LEAD(b) OVER(ORDER BY id)+1 AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: 3}, {id: 2, value: null}]}
  - name: Lag output keeps its declared character operand type
    sql: SELECT id,LAG(txt) OVER(ORDER BY id)+N'2' AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: null}, {id: 2, value: '32'}]}
  - name: Lead output keeps its declared character operand type
    sql: SELECT id,LEAD(suffix) OVER(ORDER BY id)+N'2' AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: x2}, {id: 2, value: null}]}
  - name: Integer average uses its frontend integer result contract
    sql: SELECT AVG(id)+'2' AS value FROM tsql_add_contracts
    expect: {rows: 1, data: [{value: 3}]}
  - name: Floating average retains its fractional arithmetic result
    sql: SELECT AVG(CAST(id AS FLOAT))+'2' AS value FROM tsql_add_contracts
    expect: {rows: 1, data: [{value: 3.5}]}
  - name: Window integer average uses the same declared result contract
    sql: SELECT id,AVG(id) OVER () AS value FROM tsql_add_contracts ORDER BY id
    expect: {rows: 2, data: [{id: 1, value: 1}, {id: 2, value: 1}]}
  - name: Numeric aggregates reject character input contracts
    sql: SELECT SUM(txt) AS value FROM tsql_add_contracts
    expect: {error: true, contains: numeric aggregate requires a declared numeric input}
  - name: Numeric aggregates reject bit input contracts
    sql: SELECT AVG(CAST(id AS BIT)) AS value FROM tsql_add_contracts
    expect: {error: true, contains: numeric aggregate requires a declared numeric input}
  - name: Aggregate and count descriptions use frontend contracts before lowering
    scm: |
      (begin
        (define small (tsql_cast_expr nil "SMALLINT" '()))
        (define aggregate (list (quote aggregate) small (quote +) 0))
        (define text (list (quote sql_type_expr) nil "NVARCHAR" '("bin" 2)))
        (and (equal? (sql_info_type (sql_expr_info '() (tsql_aggregate_expr "SUM" aggregate small))) "INT")
          (equal? (sql_info_type (sql_expr_info '() (tsql_aggregate_expr "COUNT" aggregate small))) "INT")
          (nil? (sql_info_collation (sql_expr_info '() (tsql_aggregate_expr "COUNT" aggregate text))))
          (equal? (sql_info_type (sql_expr_info '() (tsql_window_expr "COUNT" '() '('() '())))) "INT")))
    expect: {result: true}
  - name: Aggregate addition plans remove all compiler callbacks
    scm: |
      (not (regexp_test (string (parse_tsql "memcp-tests"
        "SELECT SUM(a)+SUM(CAST(txt AS INT)) AS value FROM tsql_add_contracts"
        nil nil nil)) "sql_compile_expr|sql_type_expr|tsql_compile_addition"))
    expect: {result: true}
  - name: Native update uses the compile-selected addition
    sql: UPDATE tsql_add_contracts SET a=a+txt WHERE id=1
    expect: {affected_rows: 1}
  - name: Invalid mixed update fails before publication
    sql: UPDATE tsql_add_contracts SET a=a+suffix WHERE id=1
    expect: {error: true, contains: invalid integer text}
  - name: Rejected mixed update retains its native row
    sql: SELECT a FROM tsql_add_contracts WHERE id=1
    expect: {rows: 1, data: [{a: 13}]}
  - name: Insert select uses the shared addition contract
    sql: INSERT INTO tsql_add_copy SELECT id,a+txt FROM tsql_add_contracts WHERE id=1
  - name: Inserted selected addition retains its numeric result
    sql: SELECT value FROM tsql_add_copy WHERE id=1
    expect: {rows: 1, data: [{value: 16}]}
  - name: Executable addition plan contains no compiler callback or runtime dispatch
    scm: |
      (not (regexp_test (string (parse_tsql "memcp-tests"
        "SELECT a+txt AS value FROM tsql_add_contracts" nil nil nil)) "sql_compile_expr|tsql_compile_addition"))
    expect: {result: true}
  - name: Statement terminators belong to the grammar
    scm: |
      (expression_equal?
        (parse_tsql "memcp-tests" "SELECT N'a;b' AS value" nil nil nil)
        (parse_tsql "memcp-tests" "; ; SELECT N'a;b' AS value; ; -- trailing separator" nil nil nil))
    expect: {result: true}
  - name: Leading empty statements preserve one result
    sql: ; ; SELECT 42 AS n; ;
    expect: {rows: 1, data: [{n: 42}]}
  - name: Multiline block comments are lexical whitespace
    sql: |
      /* setup text
         ; SELECT 99 AS ignored */
      SELECT /* projection
                text */ 7 AS n;
      /* trailing comment
         SELECT 99 AS ignored; */
    expect: {rows: 1, data: [{n: 7}]}
