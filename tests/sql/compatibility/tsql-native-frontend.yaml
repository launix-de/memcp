metadata:
  version: '1.0'
  syntax: tsql
  description: T-SQL grammar reuses native DDL, defaults and query planning
setup:
  - sql: DROP TABLE IF EXISTS tsql_default_row
  - sql: DROP TABLE IF EXISTS tsql_default_required
  - sql: CREATE TABLE tsql_default_row (id INT IDENTITY PRIMARY KEY,amount INT NOT NULL DEFAULT ((7)),label NVARCHAR(30) DEFAULT N'Grüße',nullable_value INT)
  - sql: CREATE TABLE tsql_default_required (value INT NOT NULL)
  - sql: DROP TABLE IF EXISTS tsql_having_input
  - sql: CREATE TABLE tsql_having_input (id INT PRIMARY KEY)
  - sql: INSERT INTO tsql_having_input VALUES (1)
  - sql: DROP TABLE IF EXISTS tsql_cast_collation
  - sql: DROP TABLE IF EXISTS tsql_setup_catalog
  - sql: DROP TABLE IF EXISTS tsql_setup_columns
  - sql: DROP TABLE IF EXISTS tsql_setup_key
  - sql: DROP TABLE IF EXISTS tsql_setup_named_key
  - sql: DROP VIEW IF EXISTS [tsql_native_view]
  - sql: DROP TABLE IF EXISTS [tsql_native_copy]
  - sql: CREATE TABLE [tsql_native_copy] ([id] INT PRIMARY KEY, [name] NVARCHAR(80))
  - sql: DROP TABLE IF EXISTS [tsql_fk_child]
  - sql: DROP TABLE IF EXISTS [tsql_fk_parent]
  - sql: CREATE TABLE [tsql_fk_parent] ([id] INT PRIMARY KEY)
  - sql: CREATE TABLE [tsql_fk_child] ([id] INT PRIMARY KEY, [parent_id] INT, CONSTRAINT [tsql_native_fk] FOREIGN KEY ([parent_id]) REFERENCES [tsql_fk_parent] ([id]) ON DELETE CASCADE)
  - sql: INSERT INTO [tsql_fk_parent] VALUES (1)
  - sql: INSERT INTO [tsql_fk_child] VALUES (1,1)
  - sql: DROP TABLE IF EXISTS [tsql_native]
  - sql: CREATE TABLE [dbo].[tsql_native] ([id] INT IDENTITY(1,1) PRIMARY KEY, [name] NVARCHAR(80), [amount] INT NOT NULL DEFAULT (7))
  - sql: INSERT INTO [dbo].[tsql_native] ([name]) VALUES (N'Grüße'), (N'O''Brien')
test_cases:
  - name: National default strings accept leading lexical whitespace
    scm: |
      (tsql_default_literal "   N'spaces'")
    expect: {result: spaces}
  - name: National string prefix must stay adjacent to the opening quote
    sql: SELECT N 'not adjacent' AS value
    expect: {error: true}
  - name: escaped closing bracket is a quoted identifier
    sql: SELECT 42 AS [answer]]suffix]
    expect: {rows: 1, data: [{"answer]suffix": 42}]}
  - name: double quoted escaping remains an identifier
    sql: SELECT 42 AS "answer""suffix"
    expect: {rows: 1, data: [{"answer\"suffix": 42}]}
  - name: backslashes remain literal in dialect strings
    sql: SELECT N'C:\new' AS [path]
    expect: {rows: 1, data: [{path: 'C:\new'}]}
  - name: bracket identifiers and native identity default values
    sql: SELECT [id], [name], [amount] FROM [dbo].[tsql_native] ORDER BY [id]
    expect:
      rows: 2
      data:
        - {id: 1, name: Grüße, amount: 7}
        - {id: 2, name: "O'Brien", amount: 7}
  - name: top clause uses shared limit planning
    sql: SELECT TOP (1) [id] FROM [dbo].[tsql_native] ORDER BY [id] DESC
    expect: {rows: 1, data: [{id: 2}]}
  - name: double quoted identifiers
    sql: SELECT TOP 1 "name" FROM "tsql_native" ORDER BY "id"
    expect: {rows: 1, data: [{name: Grüße}]}
  - name: offset fetch uses shared ordering and limit
    sql: SELECT [id] FROM [dbo].[tsql_native] ORDER BY [id] OFFSET 1 ROWS FETCH NEXT 1 ROWS ONLY
    expect: {rows: 1, data: [{id: 2}]}
  - name: dialect null function and string addition
    sql: SELECT ISNULL(NULL, N'x') + N'y' AS [value]
    expect: {rows: 1, data: [{value: xy}]}
  - name: ordinary aggregates use the canonical group stage
    sql: SELECT COUNT(*) AS n, SUM([amount]) AS total FROM [tsql_native]
    expect: {rows: 1, data: [{n: 2, total: 14}]}
  - name: union uses the canonical union block
    sql: SELECT 1 AS n UNION ALL SELECT 2 AS n
    expect: {rows: 2, data: [{n: 1}, {n: 2}]}
  - name: derived queries preserve top ordering
    sql: SELECT chosen.[id] FROM (SELECT TOP (1) [id] FROM [tsql_native] ORDER BY [id] DESC) AS chosen
    expect: {rows: 1, data: [{id: 2}]}
  - name: searched case translates to native expressions
    sql: SELECT CASE WHEN [id] = 1 THEN N'first' ELSE N'other' END AS [label] FROM [tsql_native] ORDER BY [id]
    expect: {rows: 2, data: [{label: first}, {label: other}]}
  - name: inner joins use the existing planner
    sql: SELECT c.[id] FROM [tsql_fk_child] AS c JOIN [tsql_fk_parent] AS p ON c.[parent_id] = p.[id]
    expect: {rows: 1, data: [{id: 1}]}
  - name: insert select uses native insertion
    sql: INSERT INTO [tsql_native_copy] ([id], [name]) SELECT [id], [name] FROM [tsql_native] ORDER BY [id]
    expect: {rows: 1}
  - name: insert select preserves all source rows
    sql: SELECT [id], [name] FROM [tsql_native_copy] ORDER BY [id]
    expect: {rows: 2, data: [{id: 1, name: Grüße}, {id: 2, name: "O'Brien"}]}
  - name: create view stores the canonical query
    sql: CREATE VIEW [tsql_native_view] AS SELECT [id] FROM [tsql_native]
    expect: {rows: 1}
  - name: view reads use the existing view expansion
    sql: SELECT [id] FROM [tsql_native_view] ORDER BY [id]
    expect: {rows: 2, data: [{id: 1}, {id: 2}]}
  - name: drop view uses the native catalog
    sql: DROP VIEW [tsql_native_view]
    expect: {rows: 1}
  - name: substring accepts the dialect argument syntax
    sql: SELECT SUBSTRING(N'abcdef', 2, 3) AS [part]
    expect: {rows: 1, data: [{part: bcd}]}
  - name: offset without ordering is rejected
    sql: SELECT [id] FROM [tsql_native] OFFSET 1 ROWS
    expect: {error: true}
  - name: top combined with offset is rejected
    sql: SELECT TOP (1) [id] FROM [tsql_native] ORDER BY [id] OFFSET 1 ROWS
    expect: {error: true}
  - name: limit does not leak in from another dialect
    sql: SELECT 42 AS n LIMIT 1
    expect: {error: true}
  - name: backtick identifiers do not leak in from another dialect
    sql: SELECT 42 AS `n`
    expect: {error: true}
  - name: insert ignore does not leak in from another dialect
    sql: INSERT IGNORE INTO [tsql_native_copy] VALUES (99, N'unsupported')
    expect: {error: true}
  - name: engine clauses do not leak in from another dialect
    sql: CREATE TABLE [tsql_wrong_engine] ([id] INT) ENGINE=MEMORY
    expect: {error: true}
  - name: native unique constraint remains enforced
    sql: INSERT INTO [dbo].[tsql_native] ([id]) VALUES (1)
    expect: {error: true}
  - name: unsupported identity increments fail explicitly
    sql: CREATE TABLE [tsql_wrong_identity] ([id] INT IDENTITY(10,2))
    expect: {error: true}
  - name: native add column freezes historical defaults
    sql: ALTER TABLE [dbo].[tsql_native] ADD [bonus] INT NOT NULL DEFAULT (9)
    expect: {rows: 0}
  - name: historical rows use the merged defaults implementation
    sql: SELECT [id], [bonus] FROM [dbo].[tsql_native] ORDER BY [id]
    expect: {rows: 2, data: [{id: 1, bonus: 9}, {id: 2, bonus: 9}]}
  - name: native insert also uses the new column default
    sql: INSERT INTO [dbo].[tsql_native] ([name]) VALUES (N'third')
    expect: {rows: 1}
  - name: native identity continues after add column
    sql: SELECT [id], [amount], [bonus] FROM [dbo].[tsql_native] WHERE [name] = N'third'
    expect: {rows: 1, data: [{id: 3, amount: 7, bonus: 9}]}
  - name: native null validation remains enforced
    sql: INSERT INTO [dbo].[tsql_native] ([amount]) VALUES (NULL)
    expect: {error: true}
  - name: update reuses shared dml lowering
    sql: UPDATE [tsql_native] SET [amount] = [amount] + 1 WHERE [id] = 3
    expect: {rows: 1}
  - name: update result is visible
    sql: SELECT [amount] FROM [dbo].[tsql_native] WHERE [id] = 3
    expect: {rows: 1, data: [{amount: 8}]}
  - name: delete reuses shared dml lowering
    sql: DELETE FROM [tsql_native] WHERE [id] = 3
    expect: {rows: 1}
  - name: shared window planning remains available
    sql: SELECT [id], COUNT(*) OVER () AS [n] FROM [dbo].[tsql_native] ORDER BY [id]
    expect: {rows: 2, data: [{id: 1, n: 2}, {id: 2, n: 2}]}
  - name: negative top fails
    sql: SELECT TOP (-1) [id] FROM [dbo].[tsql_native]
    expect: {error: true}
  - name: top zero returns no rows
    sql: SELECT TOP (0) [id] FROM [dbo].[tsql_native]
    expect: {rows: 0}
  - name: unmatched default parentheses fail
    sql: CREATE TABLE [tsql_bad_default] ([id] INT DEFAULT (7)
    expect: {error: true}
  - name: an omitted default is still native null
    sql: SELECT ISNULL(NULL, 42) AS [value]
    expect: {rows: 1, data: [{value: 42}]}
  - name: foreign key uses existing enforcement
    sql: INSERT INTO [tsql_fk_child] VALUES (2,999)
    expect: {error: true}
  - name: foreign cascade uses existing trigger infrastructure
    sql: DELETE FROM [tsql_fk_parent] WHERE [id] = 1
    expect: {rows: 1}
  - name: cascaded child rows are gone
    sql: SELECT [id] FROM [tsql_fk_child]
    expect: {rows: 0}
  - name: integer casts truncate numeric inputs toward zero
    sql: SELECT CAST(12.75 AS INT) AS positive, CONVERT(INT,-12.75) AS negative
    expect: {rows: 1, data: [{positive: 12, negative: -12}]}
  - name: integer text conversions accept whitespace signs and leading zeroes
    sql: SELECT CAST(' +00042 ' AS INT) AS positive, CONVERT(SMALLINT,'-00042') AS negative, CAST('' AS INT) AS empty
    expect: {rows: 1, data: [{positive: 42, negative: -42, empty: 0}]}
  - name: bigint text retains values beyond floating point precision
    sql: SELECT CAST('9007199254740993' AS BIGINT) AS exact, CAST('9223372036854775807' AS BIGINT) AS maximum, CAST('-9223372036854775808' AS BIGINT) AS minimum
    expect: {rows: 1, data: [{exact: 9007199254740993, maximum: 9223372036854775807, minimum: -9223372036854775808}]}
  - name: native wire callback retains int64 values and cast metadata
    scm: |
      (begin
        (define session (newsession))
        (session "username" "root")
        (session "schema" "memcp-tests")
        (session "wire_metadata" true)
        (define output (newsession))
        (tds_frontend "execute" session
          (list "database" "memcp-tests" "parameters" (list) "declarations" ""
            "text" "SELECT CAST('9007199254740993' AS BIGINT) AS exact, CAST('9223372036854775807' AS BIGINT) AS maximum, CAST('1' AS BIT) AS flag, CAST(NULL AS FLOAT) AS absent")
          (lambda (values) (output "values" values))
          (lambda (fields) (output "fields" fields)) nil nil)
        (and (expression_equal? (car (output "values")) (tsql_parse_integer "9007199254740993"))
          (expression_equal? (cadr (output "values")) (tsql_parse_integer "9223372036854775807"))
          (equal? (nth (output "values") 2) true)
          (nil? (nth (output "values") 3))
          (equal? (map (output "fields") (lambda (field) (field "kind"))) '(38 38 104 109))))
    expect: {result: true}
  - name: integer literals retain native int64 precision
    sql: SELECT 9007199254740993 AS exact, -9223372036854775808 AS minimum
    expect: {rows: 1, data: [{exact: 9007199254740993, minimum: -9223372036854775808}]}
  - name: every integer cast preserves null
    sql: SELECT CAST(NULL AS INT) AS i, CONVERT(BIGINT,NULL) AS b, CAST(NULL AS SMALLINT) AS s, CAST(NULL AS TINYINT) AS t
    expect: {rows: 1, data: [{i: null, b: null, s: null, t: null}]}
  - name: declared integer bounds accept their endpoints
    sql: SELECT CAST('-2147483648' AS INT) AS i, CAST('32767' AS SMALLINT) AS s, CONVERT(TINYINT,'255') AS t
    expect: {rows: 1, data: [{i: -2147483648, s: 32767, t: 255}]}
  - name: int overflow fails
    sql: SELECT CAST('2147483648' AS INT)
    expect: {error: true}
  - name: smallint overflow fails
    sql: SELECT CAST('-32769' AS SMALLINT)
    expect: {error: true}
  - name: unsigned tinyint rejects negative values
    sql: SELECT CAST('-1' AS TINYINT)
    expect: {error: true}
  - name: tinyint overflow fails
    sql: SELECT CAST('256' AS TINYINT)
    expect: {error: true}
  - name: bigint overflow fails before native arithmetic
    sql: SELECT CAST('9223372036854775808' AS BIGINT)
    expect: {error: true}
  - name: bigint underflow fails before native arithmetic
    sql: SELECT CAST('-9223372036854775809' AS BIGINT)
    expect: {error: true}
  - name: integer text does not accept a numeric prefix
    sql: SELECT CAST('12 trailing' AS INT)
    expect: {error: true}
  - name: float conversions retain fractional values and exponents
    sql: SELECT CAST('-12.75' AS FLOAT) AS fraction, CONVERT(FLOAT,'1.25e+2',0) AS exponent
    expect: {rows: 1, data: [{fraction: -12.75, exponent: 125}]}
  - name: float conversions preserve null
    sql: SELECT CAST(NULL AS FLOAT) AS value
    expect: {rows: 1, data: [{value: null}]}
  - name: approximate types use native floating precision
    sql: SELECT CAST('1.25' AS REAL) AS real_value, CONVERT(FLOAT(24),'1.25') AS short_float
    expect: {rows: 1, data: [{real_value: 1.25, short_float: 1.25}]}
  - name: invalid floating text is rejected
    sql: SELECT CAST('invalid' AS FLOAT)
    expect: {error: true}
  - name: floating overflow is rejected
    sql: SELECT CAST('1e999' AS FLOAT)
    expect: {error: true}
  - name: nonfinite floating text is rejected
    sql: SELECT CAST('NaN' AS FLOAT)
    expect: {error: true}
  - name: bit converts numeric text and boolean words
    sql: SELECT CAST(CAST('0' AS BIT) AS INT) AS zero, CAST(CAST('-42' AS BIT) AS INT) AS nonzero, CAST(CAST('TRUE' AS BIT) AS INT) AS truth, CAST(CAST('false' AS BIT) AS INT) AS falsehood
    expect: {rows: 1, data: [{zero: 0, nonzero: 1, truth: 1, falsehood: 0}]}
  - name: bit conversion preserves null
    sql: SELECT CAST(NULL AS BIT) AS value
    expect: {rows: 1, data: [{value: null}]}
  - name: bit does not accept arbitrary truthy strings
    sql: SELECT CAST('invalid' AS BIT)
    expect: {error: true}
  - name: casts operate inside shared relational planning
    sql: SELECT CAST([amount] AS BIGINT) AS value FROM [tsql_native] WHERE CONVERT(INT,'7') = [amount] ORDER BY [id]
    expect: {rows: 2, data: [{value: 7}, {value: 7}]}
  - name: invalid conversion cannot modify existing rows
    sql: UPDATE [tsql_native] SET [amount] = CAST('invalid' AS INT)
    expect: {error: true}
  - name: rejected conversion leaves table values unchanged
    sql: SELECT [amount] FROM [tsql_native] ORDER BY [id]
    expect: {rows: 2, data: [{amount: 7}, {amount: 7}]}
  - name: money precision dimensions are rejected
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] MONEY(19))
    expect: {error: true}
  - name: smallmoney precision dimensions are rejected
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] SMALLMONEY(10,4))
    expect: {error: true}
  - name: decimal precision zero is rejected
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] DECIMAL(0,0))
    expect: {error: true}
  - name: decimal precision over 38 is rejected
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] NUMERIC(39,0))
    expect: {error: true}
  - name: decimal scale over precision is rejected
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] DECIMAL(4,5))
    expect: {error: true}
  - name: temporal precision over 7 is rejected
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] DATETIME2(8))
    expect: {error: true}
  - name: unicode length over 4000 is rejected
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] NVARCHAR(4001))
    expect: {error: true}
  - name: fixed char does not accept max
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] CHAR(MAX))
    expect: {error: true}
  - name: integer display widths are not accepted by this dialect
    sql: CREATE TABLE [tsql_invalid_dimensions] ([value] INT(11))
    expect: {error: true}
  - name: max text length uses the native column metadata
    sql: ALTER TABLE [tsql_native_copy] ADD [details] NVARCHAR(MAX)
    expect: {rows: 0}
  - name: max text column is writable through native insertion
    sql: INSERT INTO [tsql_native_copy] ([id],[name],[details]) VALUES (3,N'new',N'Grüße')
    expect: {rows: 1}
  - name: max text column remains readable
    sql: SELECT [details] FROM [tsql_native_copy] WHERE [id]=3
    expect: {rows: 1, data: [{details: Grüße}]}
  - name: invalid alter dimensions are rejected before schema mutation
    sql: ALTER TABLE [tsql_native_copy] ADD [invalid] DECIMAL(40,2)
    expect: {error: true}
  - name: Character conversions default to thirty characters rather than declaration length
    sql: SELECT CONVERT(VARCHAR,2026)+'-'+CONVERT(VARCHAR,7) AS code, CAST(NULL AS NVARCHAR(3)) AS missing, CAST(N'abcdef'
      AS NVARCHAR(3)) AS short_text
    expect:
      rows: 1
      data:
      - code: 2026-7
        missing: null
        short_text: abc
  - name: National character casts preserve whole supplementary characters
    sql: SELECT CAST(N'🐘a' AS NVARCHAR(1)) AS one_unit, CAST(N'🐘a' AS NVARCHAR(2)) AS two_units, CAST(N'Grüße' AS
      NVARCHAR(3)) AS short_text, CAST(N'a🐘b' AS NVARCHAR(2)) AS stopped
    expect:
      rows: 1
      data:
      - one_unit: ''
        two_units: 🐘
        short_text: Grü
        stopped: a
  - name: Invalid character conversion lengths fail before execution
    sql: SELECT CONVERT(NVARCHAR(0),123)
    expect:
      error: true
  - name: Clock parts use the shared builtins
    sql: SELECT YEAR(GETDATE())=YEAR(CURRENT_TIMESTAMP) AS same_year, MONTH(GETDATE())=MONTH(CURRENT_TIMESTAMP) AS
      same_month, DAY(GETDATE())=DAY(CURRENT_TIMESTAMP) AS same_day
    expect:
      rows: 1
      data:
      - same_year: true
        same_month: true
        same_day: true
  - name: Create setup table with nested defaults and physical key preferences
    sql: CREATE TABLE tsql_setup_columns (tenant INT NOT NULL, id INT IDENTITY PRIMARY KEY NONCLUSTERED, label NVARCHAR(50)
      DEFAULT ((N'pending')), enabled SMALLINT NOT NULL DEFAULT ((-1)), created DATETIME DEFAULT ((GETDATE())), CONSTRAINT
      setup_label_unique UNIQUE NONCLUSTERED (tenant ASC,label DESC))
    expect:
      rows: 0
  - name: Insert uses native identity and nested defaults
    sql: INSERT INTO tsql_setup_columns (tenant) VALUES (1)
    expect:
      rows: 1
  - name: Initial setup defaults are visible
    sql: SELECT id,label,enabled,CASE WHEN created IS NOT NULL THEN 1 ELSE 0 END AS has_clock FROM tsql_setup_columns
    expect:
      rows: 1
      data:
      - id: 1
        label: pending
        enabled: -1
        has_clock: 1
  - name: Add six columns in one setup declaration
    sql: ALTER TABLE tsql_setup_columns ADD revision INT NOT NULL DEFAULT ((0)), amount DECIMAL(18,4) NOT NULL DEFAULT
      ((0.0000)), active SMALLINT NOT NULL DEFAULT ((-1)), note NVARCHAR(200) NULL, category INT DEFAULT ((7)), changed
      DATETIME DEFAULT CURRENT_TIMESTAMP
    expect:
      rows: 0
  - name: Six added columns backfill historical rows through native defaults
    sql: SELECT id,revision,amount,active,note,category,CASE WHEN changed IS NOT NULL THEN 1 ELSE 0 END AS has_clock
      FROM tsql_setup_columns
    expect:
      rows: 1
      data:
      - id: 1
        revision: 0
        amount: 0
        active: -1
        note: null
        category: 7
        has_clock: 1
  - name: Later inserts use all added defaults and preserve explicit clock nulls
    sql: INSERT INTO tsql_setup_columns (tenant,label,created,changed) VALUES (1,N'new',NULL,NULL)
    expect:
      rows: 1
  - name: Explicit null stays null instead of reevaluating clock defaults
    sql: SELECT id,revision,amount,active,category,created,changed FROM tsql_setup_columns WHERE label=N'new'
    expect:
      rows: 1
      data:
      - id: 2
        revision: 0
        amount: 0
        active: -1
        category: 7
        created: null
        changed: null
  - name: Named unique key remains enforced with placement and direction syntax
    sql: INSERT INTO tsql_setup_columns (tenant,label) VALUES (1,N'new')
    expect:
      error: true
  - name: Invalid later column type rejects entire declaration during compilation
    sql: ALTER TABLE tsql_setup_columns ADD should_not_exist INT DEFAULT 9, invalid DECIMAL(40,2)
    expect:
      error: true
  - name: Failed declaration publishes no earlier valid column
    sql: SELECT should_not_exist FROM tsql_setup_columns
    expect:
      error: true
  - name: Composite primary keys accept explicit placement and key direction
    sql: CREATE TABLE tsql_setup_key (tenant INT NOT NULL,id INT NOT NULL,PRIMARY KEY CLUSTERED (tenant ASC,id DESC))
    expect:
      rows: 0
  - name: Composite key accepts distinct tenants
    sql: INSERT INTO tsql_setup_key VALUES (1,1),(2,1)
    expect:
      rows: 1
  - name: Composite key rejects same tenant and record pair
    sql: INSERT INTO tsql_setup_key VALUES (1,1)
    expect:
      error: true
  - name: Setup counter advances through an ordinary update
    sql: UPDATE tsql_setup_columns SET revision=revision+1 WHERE tenant=1 AND id=1
    expect:
      rows: 1
  - name: Updated counter is isolated to the matching setup record
    sql: SELECT id,revision FROM tsql_setup_columns ORDER BY id
    expect:
      rows: 2
      data:
      - id: 1
        revision: 1
      - id: 2
        revision: 0
  - name: Multi column DDL reports a runtime failure
    sql: ALTER TABLE tsql_setup_columns ADD atomic_first INT DEFAULT 1, atomic_second INT NOT NULL DEFAULT NULL
    expect:
      error: true
  - name: Runtime DDL failure leaves no partially added column
    sql: SELECT atomic_first FROM tsql_setup_columns
    expect:
      error: true
    noncritical: true
  - name: Named primary declaration retains its native logical key identity
    sql: CREATE TABLE tsql_setup_named_key (id INT,CONSTRAINT setup_pk PRIMARY KEY CLUSTERED (id ASC))
    expect:
      rows: 0
    noncritical: true
  - name: Application procedure can declare an ordinary counter update
    sql: CREATE PROCEDURE tsql_setup_advance @tenant INT AS UPDATE tsql_setup_columns SET revision=revision+1 WHERE
      tenant=@tenant
    expect:
      rows: 0
    noncritical: true
  - name: Named procedure invocation binds the tenant argument
    sql: EXEC tsql_setup_advance @tenant=1
    expect:
      rows: 1
    noncritical: true
  - name: Procedure invocation has observable tenant scoped write effects
    sql: SELECT id,revision FROM tsql_setup_columns ORDER BY id
    expect:
      rows: 2
      data:
      - id: 1
        revision: 2
      - id: 2
        revision: 1
    noncritical: true
  - name: Read uncommitted hint parses in a composed document lookup
    sql: SELECT id,label FROM tsql_setup_columns WITH (READUNCOMMITTED) WHERE id=1
    expect:
      rows: 1
      data:
      - id: 1
        label: pending
    noncritical: true

  - name: Insert without into accepts the dialect statement spelling
    sql: INSERT tsql_native_copy (id,name) VALUES (99,N'optional keyword')
    expect: {rows: 1}
    noncritical: true
  - name: Default values inserts a native omitted-column row
    sql: INSERT INTO [dbo].[tsql_default_row] DEFAULT VALUES
    expect: {affected_rows: 1}
  - name: All-default insertion uses native defaults and identity
    sql: SELECT id,amount,label,nullable_value FROM tsql_default_row
    expect: {rows: 1, data: [{id: 1, amount: 7, label: Grüße, nullable_value: null}]}
  - name: Default values accepts an omitted into keyword
    sql: INSERT tsql_default_row DEFAULT VALUES
    expect: {affected_rows: 1}
  - name: Default rows share the ordinary native allocator
    sql: INSERT INTO tsql_default_row (label) VALUES (N'explicit')
    expect: {affected_rows: 1}
  - name: Ordinary and default inserts retain one sequence
    sql: SELECT id,amount,label FROM tsql_default_row ORDER BY id
    expect: {rows: 3, data: [{id: 1, amount: 7, label: Grüße}, {id: 2, amount: 7, label: Grüße}, {id: 3, amount: 7, label: explicit}]}
  - name: Default values rejects an explicit column list
    sql: INSERT INTO tsql_default_row (amount) DEFAULT VALUES
    expect: {error: true}
  - name: Default values rejects trailing row data
    sql: INSERT INTO tsql_default_row DEFAULT VALUES (1)
    expect: {error: true}
  - name: Default values rejects a missing values keyword
    sql: INSERT INTO tsql_default_row DEFAULT
    expect: {error: true}
  - name: All-default admission respects native required columns
    sql: INSERT INTO tsql_default_required DEFAULT VALUES
    expect: {error: true}
  - name: Rejected all-default row does not publish data
    sql: SELECT COUNT(*) AS n FROM tsql_default_required
    expect: {rows: 1, data: [{n: 0}]}
  - name: Alter adds an enforced named unique through native keys
    sql: ALTER TABLE tsql_setup_columns ADD CONSTRAINT setup_unique_revision UNIQUE (tenant ASC,revision DESC)
    expect: {rows: 0}
  - name: Added unique key rejects duplicate values
    sql: INSERT INTO tsql_setup_columns (tenant,label,revision) VALUES (1,N'duplicate revision',1)
    expect: {error: true}
  - name: Added unique key permits another key tuple
    sql: INSERT INTO tsql_setup_columns (tenant,label,revision) VALUES (2,N'another tenant',1)
    expect: {rows: 1}
  - name: Drop constraint removes the actual native key
    sql: ALTER TABLE tsql_setup_columns DROP CONSTRAINT setup_unique_revision
    expect: {rows: 0}
  - name: Dropped unique key permits the previously conflicting tuple
    sql: INSERT INTO tsql_setup_columns (tenant,label,revision) VALUES (1,N'after key drop',1)
    expect: {rows: 1}

  - name: Application catalog uses an ordinary native table
    sql: CREATE TABLE tsql_setup_catalog ([Table] NVARCHAR(80) PRIMARY KEY, Revision INT NOT NULL DEFAULT ((1)))
    expect: {rows: 0}
  - name: Setup registers both installed relations
    sql: INSERT INTO tsql_setup_catalog ([Table]) VALUES (N'tsql_setup_columns'),(N'tsql_setup_key')
    expect: {rows: 1}
  - name: Upgrade advances only the installed relation revision
    sql: UPDATE tsql_setup_catalog SET Revision=Revision+1 WHERE [Table]=N'tsql_setup_columns'
    expect: {rows: 1}
  - name: Catalog registration preserves revision and identifier text
    sql: SELECT [Table],Revision FROM tsql_setup_catalog ORDER BY [Table]
    expect:
      rows: 2
      data:
        - {Table: tsql_setup_columns, Revision: 2}
        - {Table: tsql_setup_key, Revision: 1}
  - name: Registry keys are enforced by the ordinary native primary key
    sql: INSERT INTO tsql_setup_catalog VALUES (N'tsql_setup_columns',99)
    expect: {error: true}

  - name: Text cast fixture uses native column collation options
    scm: >-
      (createtable "memcp-tests" "tsql_cast_collation"
        (list (list "column" "value" "VARCHAR" (list 40) (list "collate" "bin")))
        (list) false nil)
    expect: {result: true}
  - name: Text cast collation fixture contains distinguishable case variants
    sql: INSERT INTO tsql_cast_collation VALUES (N'foo'),(N'FOO')
    expect: {rows: 1}
  - name: Text casts inherit declared input collation for comparison
    sql: SELECT CAST(value AS NVARCHAR(20)) AS value FROM tsql_cast_collation WHERE CAST(value AS NVARCHAR(20))=N'FOO'
    expect: {rows: 1, data: [{value: FOO}]}
  - name: Text cast compiler returns its type and collation separately from code
    scm: >-
      (begin
        (define sources (list (list "c" "memcp-tests" "tsql_cast_collation" false nil)))
        (define expr (list (quote get_column) "c" true "value" true))
        (define info (sql_expr_info sources (tsql_cast_expr expr "NVARCHAR" (list 20))))
        (if (and (equal? (sql_info_type info) "NVARCHAR")
            (equal? (sql_info_collation info) (list "bin" 2))
            (equal? (car (sql_info_formula info)) (quote tsql_cast_text)))
          true (error "text conversion lost its compiler contract")))
    expect: {result: true}

  - name: Having aggregate operand binds to the second joined source before its output alias
    sql: SELECT SUM(amount) AS amount FROM tsql_having_input AS p JOIN tsql_native AS n ON p.id=n.id HAVING SUM(amount)>6
    expect: {rows: 1, data: [{amount: 7}]}
  - name: Having rejects an output alias outside its input scope
    sql: SELECT SUM(amount) AS output_alias FROM tsql_native HAVING output_alias>6
    expect: {error: true}
  - name: Having aggregate binds unqualified input columns from a derived relation
    sql: SELECT SUM(amount) AS amount FROM (SELECT amount FROM tsql_native) AS d HAVING SUM(amount)>10
    expect: {rows: 1, data: [{amount: 14}]}

  - name: cast result types come from declarations including null operands
    scm: |
      (begin
        (define types '("INT" "INTEGER" "SMALLINT" "TINYINT" "BIGINT" "FLOAT" "REAL" "BIT"))
        (reduce (map types (lambda (type) (begin
          (define info (sql_expr_info (list) (tsql_cast_expr nil type (list))))
          (and (equal? (sql_info_type info) type)
            (nil? (sql_info_collation info))
            (nil? (eval (sql_info_formula info)))))))
          (lambda (ok item) (and ok item)) true))
    expect: {result: true}
  - name: integer cast emits only its conversion without a division marker
    scm: |
      (begin
        (define info (sql_expr_info (list) (tsql_cast_expr "42" "SMALLINT" (list))))
        (and (equal? (sql_info_type info) "SMALLINT")
          (expression_equal? (sql_info_formula info) (list tsql_cast_integer "42" -32768 32767))
          (equal? (eval (sql_info_formula info)) 42)))
    expect: {result: true}
  - name: bit cast emits only its conversion without boolean markers
    scm: |
      (begin
        (define info (sql_expr_info (list) (tsql_cast_expr "1" "BIT" (list))))
        (and (equal? (sql_info_type info) "BIT")
          (expression_equal? (sql_info_formula info) (list tsql_cast_bit "1"))
          (equal? (eval (sql_info_formula info)) true)))
    expect: {result: true}
  - name: float cast emits only its conversion without type markers
    scm: |
      (begin
        (define info (sql_expr_info (list) (tsql_cast_expr 1 "FLOAT" (list))))
        (and (equal? (sql_info_type info) "FLOAT")
          (expression_equal? (sql_info_formula info) (list tsql_cast_float 1))
          (equal? (eval (sql_info_formula info)) 1)))
    expect: {result: true}
  - name: outer cast declaration determines nested conversion type
    scm: |
      (begin
        (define info (sql_expr_info (list)
          (tsql_cast_expr (tsql_cast_expr "42" "SMALLINT" (list)) "FLOAT" (list))))
        (and (equal? (sql_info_type info) "FLOAT")
          (expression_equal? (sql_info_formula info)
            (list tsql_cast_float (list tsql_cast_integer "42" -32768 32767)))
          (equal? (eval (sql_info_formula info)) 42)))
    expect: {result: true}
  - name: case and coalesce merge declared cast types rather than helper contracts
    scm: |
      (begin
        (define small (tsql_cast_expr "42" "SMALLINT" (list)))
        (define absent (tsql_cast_expr nil "SMALLINT" (list)))
        (and (equal? (sql_info_type (sql_expr_info (list) (list (quote if) false absent small))) "SMALLINT")
          (equal? (sql_info_type (sql_expr_info (list) (list coalesceNil absent small))) "SMALLINT")
          (equal? (sql_info_type (sql_expr_info (list) (list (quote +) small small))) "BIGINT")))
    expect: {result: true}
  - name: conversions inside case and isnull execute through the shared compiler
    sql: SELECT CASE WHEN 1=1 THEN CAST('12' AS SMALLINT) ELSE CAST(NULL AS SMALLINT) END AS choice, ISNULL(CAST(NULL AS INT),CAST('42' AS INT)) AS fallback
    expect: {rows: 1, data: [{choice: 12, fallback: 42}]}
  - name: conversions inside a derived source retain executable formulas
    sql: SELECT [d].[value] FROM (SELECT CAST('42' AS INT) AS [value]) AS [d]
    expect: {rows: 1, data: [{value: 42}]}
  - name: conversions inside union branches retain executable formulas
    sql: SELECT CAST('12' AS INT) AS value UNION ALL SELECT CONVERT(INT,'42') AS value
    expect: {rows: 2, data: [{value: 12}, {value: 42}]}
  - name: conversion inside aggregate input retains executable formula
    sql: SELECT SUM(CAST([amount] AS INT)) AS total FROM [tsql_native]
    expect: {rows: 1, data: [{total: 14}]}
  - name: conversion inside scalar subquery retains executable formula
    sql: SELECT (SELECT CAST('42' AS INT)) AS value
    expect: {rows: 1, data: [{value: 42}]}
  - name: conversion inside joined condition retains executable formula
    sql: SELECT a.[id] FROM [tsql_native] AS a JOIN [tsql_native] AS b ON a.[id]=CAST(b.[id] AS INT) ORDER BY a.[id]
    expect: {rows: 2, data: [{id: 1}, {id: 2}]}
  - name: conversions in insert values use the normal native insert
    sql: INSERT INTO [tsql_native_copy] ([id],[name]) VALUES (CAST('4' AS INT),N'cast value')
    expect: {rows: 1}
  - name: inserted converted value remains readable
    sql: SELECT [id] FROM [tsql_native_copy] WHERE [name]=N'cast value'
    expect: {rows: 1, data: [{id: 4}]}
  - name: cast still checks unknown column references
    sql: SELECT CAST([missing_column] AS INT) FROM [tsql_native]
    expect: {error: true}
  - name: unsupported cast target is an explicit frontend error
    sql: SELECT CAST('42' AS VARBINARY(2))
    expect: {error: true}
  - name: result metadata describes null casts and nested casts before any row
    scm: |
      (begin
        (define session (newsession))
        (session "username" "root")
        (session "schema" "memcp-tests")
        (session "wire_metadata" true)
        (define output (newsession))
        (tds_frontend "execute" session
          (list "database" "memcp-tests" "parameters" (list) "declarations" ""
            "text" "SELECT CAST(NULL AS SMALLINT) AS absent, CAST(CAST(1 AS INT) AS FLOAT) AS numeric_value, CAST(NULL AS BIT) AS flag WHERE 1=0")
          (lambda (values) (output "row" true))
          (lambda (fields) (output "fields" fields)) nil nil)
        (and (nil? (output "row"))
          (equal? (map (output "fields") (lambda (field) (field "kind"))) '(38 109 104))))
    expect: {result: true}
  - name: wire widths follow integer declarations while values stay native int64
    scm: |
      (begin
        (define session (newsession))
        (session "username" "root")
        (session "schema" "memcp-tests")
        (session "wire_metadata" true)
        (define output (newsession))
        (tds_frontend "execute" session
          (list "database" "memcp-tests" "parameters" (list) "declarations" ""
            "text" "SELECT CAST('255' AS TINYINT) AS tiny_value, CAST('-32768' AS SMALLINT) AS small_value, CAST('2147483647' AS INT) AS int_value, CAST('9223372036854775807' AS BIGINT) AS big_value")
          (lambda (values) (output "values" values))
          (lambda (fields) (output "fields" fields)) nil nil)
        (and (equal? (map (output "fields") (lambda (field) (field "size"))) '(1 2 4 8))
          (equal? (map (output "fields") (lambda (field) (field "kind"))) '(38 38 38 38))
          (reduce (map (output "values") int?) (lambda (ok value) (and ok value)) true)
          (expression_equal? (nth (output "values") 3) (tsql_parse_integer "9223372036854775807"))))
    expect: {result: true}
  - name: compiled query block records declared cast types with plain formulas
    scm: |
      (begin
        (define expr (tsql_cast_expr nil "INT" (list)))
        (define block (make_query_block "memcp-tests" (list) (list "value" expr) true nil nil nil nil nil nil nil nil))
        (define typed (sql_type_query_block block (list)))
        (define result ((qassoc_get (qb_facts typed) (quote result-types) nil) "value"))
        (and (equal? (sql_info_type result) "INT")
          (expression_equal? ((qb_fields typed) "value") (list tsql_cast_integer nil -2147483648 2147483647))))
    expect: {result: true}
  - name: conversion inside window input uses the existing window planner
    sql: SELECT [id], SUM(CAST([amount] AS INT)) OVER () AS total FROM [tsql_native] ORDER BY [id]
    expect: {rows: 2, data: [{id: 1, total: 14}, {id: 2, total: 14}]}
  - name: conversion inside group keys and having uses the shared grouping planner
    sql: SELECT CAST([amount] AS INT) AS value, COUNT(*) AS entries FROM [tsql_native] GROUP BY CAST([amount] AS INT) HAVING CAST([amount] AS INT)=7
    expect: {rows: 1, data: [{value: 7, entries: 2}]}
  - name: conversions inside ordered expressions use the common order lowering
    sql: SELECT [id] FROM [tsql_native] ORDER BY CAST([id] AS INT) DESC
    expect: {rows: 2, data: [{id: 2}, {id: 1}]}
  - name: valid conversion inside update uses the native dml plan
    sql: UPDATE [tsql_native] SET [amount]=CAST('7' AS INT) WHERE [id]=CONVERT(INT,'1')
    expect: {rows: 1}
  - name: window cast result carries the frontend integer contract
    scm: |
      (begin
        (define info (sql_expr_info (list)
          (tsql_window_expr "SUM" (list (tsql_cast_expr "42" "SMALLINT" (list))) (list))))
        (and (equal? (sql_info_type info) "INT")
          (expression_equal? (sql_info_formula info)
            (list (quote window_func) "SUM" (list (list tsql_cast_integer "42" -32768 32767)) (list)))))
    expect: {result: true}
  - name: executable window plan contains no frontend type annotations
    scm: |
      (not (regexp_test
        (string (parse_tsql "memcp-tests"
          "SELECT id,SUM(CAST(amount AS INT)) OVER () AS total FROM tsql_native ORDER BY id"
          nil nil nil)) "sql_type_expr"))
    expect: {result: true}

