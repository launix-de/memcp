  - name: conversions inside a derived source retain executable formulas
    sql: SELECT [d].[value] FROM (SELECT CAST('42' AS INT) AS [value]) AS [d]
    expect: {rows: 1, data: [{value: 42}]}
  - name: conversions inside union branches retain executable formulas
    sql: SELECT CAST('12' AS INT) AS value UNION ALL SELECT CONVERT(INT,'42') AS value
    expect: {rows: 2, data: [{value: 12}, {value: 42}]}
  - name: conversion inside aggregate input retains executable formula
    sql: SELECT SUM(CAST([amount] AS INT)) AS total FROM [tsql_native]
    expect: {rows: 1, data: [{total: 14}]}
  - name: conversion inside scalar subquery retains executable formula
    sql: SELECT (SELECT CAST('42' AS INT)) AS value
    expect: {rows: 1, data: [{value: 42}]}
  - name: conversion inside joined condition retains executable formula
    sql: SELECT a.[id] FROM [tsql_native] AS a JOIN [tsql_native] AS b ON a.[id]=CAST(b.[id] AS INT) ORDER BY a.[id]
    expect: {rows: 2, data: [{id: 1}, {id: 2}]}
  - name: conversions in insert values use the normal native insert
    sql: INSERT INTO [tsql_native_copy] ([id],[name]) VALUES (CAST('4' AS INT),N'cast value')
    expect: {rows: 1}
  - name: inserted converted value remains readable
    sql: SELECT [id] FROM [tsql_native_copy] WHERE [name]=N'cast value'
    expect: {rows: 1, data: [{id: 4}]}
  - name: cast still checks unknown column references
    sql: SELECT CAST([missing_column] AS INT) FROM [tsql_native]
    expect: {error: true}
  - name: unsupported cast target is an explicit frontend error
    sql: SELECT CAST('42' AS VARBINARY(2))
    expect: {error: true}
  - name: result metadata describes null casts and nested casts before any row
    scm: |
      (begin
        (define session (newsession))
        (session "username" "root")
        (session "schema" "memcp-tests")
        (session "wire_metadata" true)
        (define output (newsession))
        (tds_frontend "execute" session
          (list "database" "memcp-tests" "parameters" (list) "declarations" ""
            "text" "SELECT CAST(NULL AS SMALLINT) AS absent, CAST(CAST(1 AS INT) AS FLOAT) AS numeric_value, CAST(NULL AS BIT) AS flag WHERE 1=0")
          (lambda (values) (output "row" true))
          (lambda (fields) (output "fields" fields)) nil nil)
        (and (nil? (output "row"))
          (equal? (map (output "fields") (lambda (field) (field "kind"))) '(38 109 104))))
    expect: {result: true}
  - name: wire widths follow integer declarations while values stay native int64
    scm: |
      (begin
        (define session (newsession))
        (session "username" "root")
        (session "schema" "memcp-tests")
        (session "wire_metadata" true)
        (define output (newsession))
        (tds_frontend "execute" session
          (list "database" "memcp-tests" "parameters" (list) "declarations" ""
            "text" "SELECT CAST('255' AS TINYINT) AS tiny_value, CAST('-32768' AS SMALLINT) AS small_value, CAST('2147483647' AS INT) AS int_value, CAST('9223372036854775807' AS BIGINT) AS big_value")
          (lambda (values) (output "values" values))
          (lambda (fields) (output "fields" fields)) nil nil)
        (and (equal? (map (output "fields") (lambda (field) (field "size"))) '(1 2 4 8))
          (equal? (map (output "fields") (lambda (field) (field "kind"))) '(38 38 38 38))
          (reduce (map (output "values") int?) (lambda (ok value) (and ok value)) true)
          (expression_equal? (nth (output "values") 3) (tsql_parse_integer "9223372036854775807"))))
    expect: {result: true}
  - name: compiled query block records declared cast types with plain formulas
    scm: |
      (begin
        (define expr (tsql_cast_expr nil "INT" (list)))
        (define block (make_query_block "memcp-tests" (list) (list "value" expr) true nil nil nil nil nil nil nil nil))
        (define typed (sql_type_query_block block (list)))
        (define result ((qassoc_get (qb_facts typed) (quote result-types) nil) "value"))
        (and (equal? (sql_info_type result) "INT")
          (expression_equal? ((qb_fields typed) "value") (list tsql_cast_integer nil -2147483648 2147483647))))
    expect: {result: true}
  - name: conversion inside window input uses the existing window planner
    sql: SELECT [id], SUM(CAST([amount] AS INT)) OVER () AS total FROM [tsql_native] ORDER BY [id]
    expect: {rows: 2, data: [{id: 1, total: 14}, {id: 2, total: 14}]}
  - name: conversion inside group keys and having uses the shared grouping planner
    sql: SELECT CAST([amount] AS INT) AS value, COUNT(*) AS entries FROM [tsql_native] GROUP BY CAST([amount] AS INT) HAVING CAST([amount] AS INT)=7
    expect: {rows: 1, data: [{value: 7, entries: 2}]}
  - name: conversions inside ordered expressions use the common order lowering
    sql: SELECT [id] FROM [tsql_native] ORDER BY CAST([id] AS INT) DESC
    expect: {rows: 2, data: [{id: 2}, {id: 1}]}
  - name: valid conversion inside update uses the native dml plan
    sql: UPDATE [tsql_native] SET [amount]=CAST('7' AS INT) WHERE [id]=CONVERT(INT,'1')
    expect: {rows: 1}
  - name: window cast result carries the frontend integer contract
    scm: |
      (begin
        (define info (sql_expr_info (list)
          (tsql_window_expr "SUM" (list (tsql_cast_expr "42" "SMALLINT" (list))) (list))))
        (and (equal? (sql_info_type info) "INT")
          (expression_equal? (sql_info_formula info)
            (list (quote window_func) "SUM" (list (list tsql_cast_integer "42" -32768 32767)) (list)))))
    expect: {result: true}
  - name: executable window plan contains no frontend type annotations
    scm: |
      (not (regexp_test
        (string (parse_tsql "memcp-tests"
          "SELECT id,SUM(CAST(amount AS INT)) OVER () AS total FROM tsql_native ORDER BY id"
          nil nil nil)) "sql_type_expr"))
    expect: {result: true}

  - name: RPC declaration grammar uses qualified builtin types and native dimensions
    scm: |
      (expression_equal? (tds_bind_declarations "memcp-tests"
        "@id [sys].[BIGINT], @label [sys].[NVARCHAR](MAX), @amount DECIMAL(20,2)")
        (list (list "id" (list "BIGINT")) (list "label" (list "NVARCHAR" -1))
          (list "amount" (list "DECIMAL" 20 2)))))
    expect: {result: true}
  - name: RPC binding keeps declared types for null and integer values
    scm: |
      (begin
        (define s (newsession))
        (s "username" "root")
        (define output (newsession))
        (tds_frontend "execute" s
          (list "database" "memcp-tests" "text" "SELECT @big AS exact,@missing AS absent"
            "declarations" "@big BIGINT,@missing INT"
            "parameters" (list
              (list "name" "@big" "flags" 0 "type" (list "kind" 38 "size" 8)
                "value" (tsql_parse_integer "9007199254740993"))
              (list "name" "@missing" "flags" 0 "type" (list "kind" 231 "size" 2) "value" nil)))
          (lambda (values) (output "values" values))
          (lambda (fields) (output "fields" fields)) nil nil)
        (and (expression_equal? (car (output "values")) (tsql_parse_integer "9007199254740993"))
          (nil? (cadr (output "values")))
          (equal? (map (output "fields") (lambda (f) (f "sql_type"))) '("BIGINT" "INT"))))
    expect: {result: true}
  - name: RPC cached query uses current values and isolates declaration contracts
    scm: |
      (begin
        (define output (newsession))
        (define query (lambda (type value) (begin
          (define s (newsession))
          (s "username" "root")
          (tds_frontend "execute" s
            (list "database" "memcp-tests" "text" "SELECT @v AS value"
              "declarations" (concat "@v " type)
              "parameters" (list (list "name" "@v" "flags" 0 "type" (list "kind" 231 "size" 10) "value" value)))
            (lambda (row) (output "value" (car row)))
            (lambda (fields) (output "type" ((car fields) "sql_type"))) nil nil)
          (list (output "value") (output "type")))))
        (and (expression_equal? (query "INT" "7") '(7 "INT"))
          (expression_equal? (query "INT" "8") '(8 "INT"))
          (expression_equal? (query "NVARCHAR(10)" "hello") '("hello" "NVARCHAR"))
          (expression_equal? (query "INT" nil) '(nil "INT"))))
    expect: {result: true}
  - name: RPC declaration validates missing parameters before execution
    scm: '(tds_bind_parameters (newsession) (tds_bind_declarations "memcp-tests" "@v INT") (list))'
    expect: {error: true}
  - name: RPC duplicate declarations are rejected
    scm: |
      (tds_bind_parameters (newsession) (tds_bind_declarations "memcp-tests" "@v INT,@V INT")
        (list (list "name" "v" "flags" 0) (list "name" "v" "flags" 0)))
    expect: {error: true}
  - name: RPC duplicate supplied names are rejected
    scm: |
      (tds_bind_parameters (newsession) (tds_bind_declarations "memcp-tests" "@v INT,@w INT")
        (list (list "name" "v" "flags" 0) (list "name" "v" "flags" 0)))
    expect: {error: true}
  - name: Guarded parameter plans read each invocation value
    scm: |
      (begin
        (define s (newsession))
        (s "username" "root")
        (define declarations (tds_bind_declarations "memcp-tests" "@v INT"))
        (define run (lambda (value) (begin
          (tds_bind_parameters s declarations
            (list (list "name" "v" "flags" 0 "type" (list "kind" 38 "size" 4) "value" value)))
          (define output (newsession))
          (tsql_execute_statement nil "memcp-tests" "SELECT id FROM tsql_native WHERE id IN (@v)" s
            (lambda (row) (output "id" (row "id"))) (lambda fields true))
          (output "id"))))
        (equal? (map '(1 2 99 1) run) '(1 2 nil 1)))
    expect: {result: true}
  - name: RPC output parameters require an explicit implemented contract
    scm: |
      (tds_bind_parameters (newsession) (tds_bind_declarations "memcp-tests" "@v INT")
        (list (list "name" "v" "flags" 1 "type" (list "kind" 38 "size" 4) "value" 7)))
    expect: {error: true}
  - name: RPC temporal wire inputs remain explicit unsupported types
    scm: |
      (tds_bind_parameters (newsession) (tds_bind_declarations "memcp-tests" "@v DATETIME2(7)")
        (list (list "name" "v" "flags" 0 "type" (list "kind" 42 "scale" 7) "value" nil)))
    expect: {error: true}
  - name: Pure prepare description retains types without parameter values
    scm: |
      (begin
        (define s (newsession))
        (define fields (tds_describe "memcp-tests" "SELECT TOP (0) @n AS n,@label AS label"
          "@n BIGINT,@label NVARCHAR(50)" s))
        (and (equal? (map fields (lambda (f) (f "sql_type"))) '("BIGINT" "NVARCHAR"))
          (nil? (s "__tsql_parameter:n"))))
    expect: {result: true}
  - name: Pure prepare description rejects undeclared variables
    scm: '(tds_describe "memcp-tests" "SELECT @missing AS value" "" (newsession))'
    expect: {error: true}
  - name: Pure prepare description cannot execute schema changes
    scm: '(tds_describe "memcp-tests" "DROP TABLE tsql_native" "" (newsession))'
    expect: {error: true}
  - name: Qualified expression cast reuses the declaration grammar
    sql: SELECT CAST('7' AS [sys].[INT]) AS value
    expect: {rows: 1, data: [{value: 7}]}

  - name: NOCOUNT controls completion while native writes and rows remain visible
    scm: |
      (begin
        (define s (newsession))
        (s "username" "root")
        (s "schema" "memcp-tests")
        (define output (newsession))
        (define run (lambda (text) (tds_frontend "execute" s
          (list "database" "memcp-tests" "text" text "declarations" "" "parameters" (list))
          (lambda (row) (output (concat "id:" (string (car row))) true))
          (lambda fields true) nil nil)))
        (define setting (run "SET NOCOUNT ON"))
        (define write (run "UPDATE tsql_native SET amount=amount+1 WHERE id=1"))
        (define read (run "SELECT id FROM tsql_native"))
        (and (setting "no_count") (write "no_count") (equal? (write "rows") 1)
          (read "no_count") (output "id:1") (output "id:2")))
    expect: {result: true}
  - name: NOCOUNT OFF restores native affected-row completion
    scm: |
      (begin
        (define s (newsession))
        (s "username" "root")
        (define run (lambda (text) (tds_frontend "execute" s
          (list "database" "memcp-tests" "text" text "declarations" "" "parameters" (list))
          (lambda row true) (lambda fields true) nil nil)))
        (run "SET NOCOUNT ON")
        (run "SET NOCOUNT OFF")
        (define write (run "UPDATE tsql_native SET amount=amount-1 WHERE id=1"))
        (and (not (s "__tsql_nocount")) (nil? (write "no_count")) (equal? (write "rows") 1)))
    expect: {result: true}
  - name: Connection reset clears NOCOUNT using existing session replacement
    scm: |
      (begin
        (define s (newsession))
        (s "username" "root")
        (s "schema" "memcp-tests")
        (s "__tsql_nocount" true)
        (define replacement (tds_frontend "reset" s nil nil nil nil nil))
        (and (nil? (replacement "__tsql_nocount"))
          (equal? (replacement "username") "root") (equal? (replacement "schema") "memcp-tests")))
    expect: {result: true}
  - name: NOCOUNT accepts only its declared ON OFF syntax
    sql: SET NOCOUNT 1
    expect: {error: true}
  - name: Unsupported session semantics are rejected explicitly
    sql: SET ANSI_NULLS OFF
    expect: {error: true}

  - name: ANSI NULL startup setting accepts the existing three-valued semantics
    sql: SET ANSI_NULLS ON
    expect: {rows: 0}
  - name: Repeated startup declarations remain case insensitive
    sql: set ansi_nulls on
    expect: {rows: 0}
  - name: NULL equality and inequality stay unknown while IS NULL stays true
    sql: SELECT CASE WHEN NULL=NULL THEN 1 ELSE 0 END AS equal_null, CASE WHEN NULL<>1 THEN 1 ELSE 0 END AS different_null, CASE WHEN NULL IS NULL THEN 1 ELSE 0 END AS is_null
    expect: {rows: 1, data: [{equal_null: 0, different_null: 0, is_null: 1}]}
  - name: Quoted identifier startup setting accepts the existing lexical rules
    sql: SET QUOTED_IDENTIFIER ON
    expect: {rows: 0}
  - name: Quoted identifiers retain escaped quotes in native DDL
    setup:
      - sql: DROP TABLE IF EXISTS "startup identifiers"
    sql: CREATE TABLE "startup identifiers" ("quoted""column" INT, "select" NVARCHAR(20))
    expect: {rows: 0}
  - name: Quoted identifier spelling uses native insert and string literals
    sql: INSERT INTO "startup identifiers" ("quoted""column","select") VALUES (7,N'ordinary literal')
    expect: {affected_rows: 1}
  - name: Quoted projections retain their declared output names
    sql: SELECT "quoted""column","select" FROM "startup identifiers"
    expect: {rows: 1, data: [{'quoted"column': 7, select: ordinary literal}]}
  - name: Double quoted text is an identifier rather than a string literal
    sql: SELECT "absent identifier" FROM "startup identifiers"
    expect: {error: true}
  - name: Unsupported nonstandard NULL comparisons are rejected
    sql: SET ANSI_NULLS OFF
    expect: {error: true}
  - name: Unsupported double quoted string mode is rejected
    sql: SET QUOTED_IDENTIFIER OFF
    expect: {error: true}
  - name: Startup declarations reject values outside the fixed ON mode
    sql: SET ANSI_NULLS 1
    expect: {error: true}
  - name: Startup declarations reject trailing unparsed text
    sql: SET QUOTED_IDENTIFIER ON extra
    expect: {error: true}

