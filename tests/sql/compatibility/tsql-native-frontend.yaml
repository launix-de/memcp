              tx (parse_tsql "memcp-tests" sql nil s tx))
              (lambda (row) (out "row" row)) (lambda fields true))))
          (out "row"))))
        (execute "BEGIN TRANSACTION")
        (execute "INSERT INTO tsql_identity_tx(value) VALUES (7),(8)")
        (execute "ROLLBACK")
        (define count (execute "SELECT COUNT(*) AS n FROM tsql_identity_tx"))
        (if (equal? (count "n") 0) true (error "rollback retained inserted rows"))
        (execute "INSERT INTO tsql_identity_tx(value) VALUES (9)")
        (equal? ((execute "SELECT id FROM tsql_identity_tx") "id") 3))
    expect: {result: true}

