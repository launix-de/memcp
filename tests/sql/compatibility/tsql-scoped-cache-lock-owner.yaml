metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: Cache source locks retain the actual owner of a scoped temporary generation
setup:
  - sql: DROP TABLE IF EXISTS scoped_lock_new_mysql
  - sql: DROP TABLE IF EXISTS scoped_lock_new_postgresql
  - sql: DROP TABLE IF EXISTS scoped_lock_months
  - sql: DROP TABLE IF EXISTS scoped_lock_sites
  - sql: DROP TABLE IF EXISTS scoped_lock_targets
  - sql: CREATE TABLE scoped_lock_months (MDNr INT, BL INT, abrjahr INT)
  - sql: CREATE TABLE scoped_lock_sites (MDNr INT, BID INT, BNr VARCHAR(8), gueltigbis DATE)
  - sql: CREATE TABLE scoped_lock_targets (id INT PRIMARY KEY, absendernummer VARCHAR(8), EreignisDatum DATE, meldegrund INT)
  - sql: INSERT INTO scoped_lock_months VALUES (1,11,2024),(1,11,2024),(2,22,2024),(3,33,2022)
  - sql: INSERT INTO scoped_lock_sites VALUES (1,11,'123','2024-12-31'),(2,22,'456','2024-12-31'),(3,33,'999','2024-12-31')
  - sql: INSERT INTO scoped_lock_targets VALUES (1,'00000123',NULL,NULL),(2,'00000456',NULL,NULL),(3,'00000999','2020-01-01',4),(4,'00000999',NULL,NULL)
test_cases:
  - name: Transaction retains scoped sources through DISTINCT membership UPDATE
    session_id: scoped_cache_lock_owner
    sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;
      SET DATEFORMAT dmy;
      DROP TABLE IF EXISTS #BetrNr;
      DROP TABLE IF EXISTS #BSt;
      BEGIN TRANSACTION;
      SELECT DISTINCT MDNr, BL INTO #BSt FROM scoped_lock_months WHERE abrjahr>=2023;
      SELECT DISTINCT RIGHT('00000000'+LTRIM(s.BNr),8) AS BetrNr
        INTO #BetrNr
        FROM #BSt AS b INNER JOIN scoped_lock_sites AS s ON b.MDNr=s.MDNr AND b.BL=s.BID
        WHERE YEAR(s.gueltigbis)>=2023 AND s.BNr IS NOT NULL;
      UPDATE scoped_lock_targets SET EreignisDatum='30.04.2024',meldegrund=9
        WHERE EreignisDatum IS NULL AND absendernummer IN (SELECT BetrNr FROM #BetrNr);
      COMMIT TRANSACTION;
      SELECT id,CONVERT(VARCHAR(10),EreignisDatum,23) AS event_value,meldegrund AS reason FROM scoped_lock_targets ORDER BY id;
    expect:
      rows: 4
      data: [{id: 1, event_value: '2024-04-30', reason: 9}, {id: 2, event_value: '2024-04-30', reason: 9}, {id: 3, event_value: '2020-01-01', reason: 4}, {id: 4, event_value: null, reason: null}]
    cleanup:
      - session_id: scoped_cache_lock_owner
        sql: IF @@TRANCOUNT>0 ROLLBACK TRANSACTION
  - name: Warm membership retains the same committed scoped source and full target values
    session_id: scoped_cache_lock_owner
    sql: |
      UPDATE scoped_lock_targets SET EreignisDatum=NULL,meldegrund=NULL WHERE id=1;
      UPDATE scoped_lock_targets SET EreignisDatum='30.04.2024',meldegrund=9
        WHERE EreignisDatum IS NULL AND absendernummer IN (SELECT BetrNr FROM #BetrNr);
      SELECT id,CONVERT(VARCHAR(10),EreignisDatum,23) AS event_value,meldegrund AS reason FROM scoped_lock_targets ORDER BY id;
    expect:
      rows: 4
      data: [{id: 1, event_value: '2024-04-30', reason: 9}, {id: 2, event_value: '2024-04-30', reason: 9}, {id: 3, event_value: '2020-01-01', reason: 4}, {id: 4, event_value: null, reason: null}]
  - name: Another connection cannot acquire the caller temporary SQL name
    session_id: scoped_cache_lock_observer
    sql: 'SELECT BetrNr FROM #BetrNr'
    expect: {error: true, contains: 'local temporary table does not exist: #BetrNr'}
  - name: Original TDS batch retains scoped cache sources and ordinary UPDATE completion
    tds:
      statements:
        - sql: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
        - sql: SET DATEFORMAT dmy
        - sql: UPDATE scoped_lock_targets SET EreignisDatum=NULL,meldegrund=NULL WHERE id=1
        - sql: |
            DROP TABLE IF EXISTS #BetrNr;
            DROP TABLE IF EXISTS #BSt;
            BEGIN TRANSACTION;
            SELECT DISTINCT MDNr, BL INTO #BSt FROM scoped_lock_months WHERE abrjahr>=2023;
            SELECT DISTINCT RIGHT('00000000'+LTRIM(s.BNr),8) AS BetrNr
              INTO #BetrNr
              FROM #BSt AS b INNER JOIN scoped_lock_sites AS s ON b.MDNr=s.MDNr AND b.BL=s.BID
              WHERE YEAR(s.gueltigbis)>=2023 AND s.BNr IS NOT NULL;
            UPDATE scoped_lock_targets SET EreignisDatum='30.04.2024',meldegrund=9
              WHERE EreignisDatum IS NULL AND absendernummer IN (SELECT BetrNr FROM #BetrNr);
            COMMIT TRANSACTION;
            SELECT id,CONVERT(VARCHAR(10),EreignisDatum,23) AS event_value,meldegrund AS reason FROM scoped_lock_targets ORDER BY id;
          expect:
            rows: 4
            data: [{id: 1, event_value: '2024-04-30', reason: 9}, {id: 2, event_value: '2024-04-30', reason: 9}, {id: 3, event_value: '2020-01-01', reason: 4}, {id: 4, event_value: null, reason: null}]
  - name: mysql new transaction-owned relation keeps aggregate rows before and after publication
    syntax: mysql
    steps:
    - session_id: scoped_new_mysql
      sql: START ACID TRANSACTION
    - session_id: scoped_new_mysql
      sql: CREATE TABLE scoped_lock_new_mysql (id INT PRIMARY KEY,value INT)
    - session_id: scoped_new_mysql
      sql: INSERT INTO scoped_lock_new_mysql VALUES (1,10),(2,20),(3,NULL)
    - session_id: scoped_new_mysql
      sql: SELECT MAX(value) AS highest,COUNT(*) AS n FROM scoped_lock_new_mysql
      expect:
        rows: 1
        data:
        - highest: 20
          n: 3
    - session_id: scoped_new_mysql
      sql: UPDATE scoped_lock_new_mysql SET value=30 WHERE id=2
    - session_id: scoped_new_mysql
      sql: SELECT MAX(value) AS highest,COUNT(*) AS n FROM scoped_lock_new_mysql
      expect:
        rows: 1
        data:
        - highest: 30
          n: 3
    - session_id: scoped_new_mysql
      sql: COMMIT
    - session_id: scoped_new_mysql
      sql: UPDATE scoped_lock_new_mysql SET value=40 WHERE id=2
    - session_id: scoped_new_mysql
      sql: SELECT MAX(value) AS highest,COUNT(*) AS n FROM scoped_lock_new_mysql
      expect:
        rows: 1
        data:
        - highest: 40
          n: 3
    cleanup:
    - session_id: scoped_new_mysql
      sql: ROLLBACK
    - sql: DROP TABLE IF EXISTS scoped_lock_new_mysql
  - name: postgresql new transaction-owned relation keeps aggregate rows before and after publication
    syntax: postgresql
    steps:
    - session_id: scoped_new_postgresql
      sql: BEGIN
    - session_id: scoped_new_postgresql
      sql: CREATE TABLE scoped_lock_new_postgresql (id INT PRIMARY KEY,value INT)
    - session_id: scoped_new_postgresql
      sql: INSERT INTO scoped_lock_new_postgresql VALUES (1,10),(2,20),(3,NULL)
    - session_id: scoped_new_postgresql
      sql: SELECT MAX(value) AS highest,COUNT(*) AS n FROM scoped_lock_new_postgresql
      expect:
        rows: 1
        data:
        - highest: 20
          n: 3
    - session_id: scoped_new_postgresql
      sql: UPDATE scoped_lock_new_postgresql SET value=30 WHERE id=2
    - session_id: scoped_new_postgresql
      sql: SELECT MAX(value) AS highest,COUNT(*) AS n FROM scoped_lock_new_postgresql
      expect:
        rows: 1
        data:
        - highest: 30
          n: 3
    - session_id: scoped_new_postgresql
      sql: COMMIT
    - session_id: scoped_new_postgresql
      sql: UPDATE scoped_lock_new_postgresql SET value=40 WHERE id=2
    - session_id: scoped_new_postgresql
      sql: SELECT MAX(value) AS highest,COUNT(*) AS n FROM scoped_lock_new_postgresql
      expect:
        rows: 1
        data:
        - highest: 40
          n: 3
    cleanup:
    - session_id: scoped_new_postgresql
      sql: ROLLBACK
    - sql: DROP TABLE IF EXISTS scoped_lock_new_postgresql
cleanup:
  - sql: DROP TABLE IF EXISTS scoped_lock_targets
  - sql: DROP TABLE IF EXISTS scoped_lock_sites
  - sql: DROP TABLE IF EXISTS scoped_lock_months
