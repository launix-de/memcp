            value: null
          - id: 3
            value: 7
      - connection: scope_owner
        sql: SELECT @@TRANCOUNT AS depth
        expect:
          rows: 1
          data:
          - depth: 0
      - connection: scope_owner
        sql: 'DROP TABLE IF EXISTS #cache_scope_input'
      - connection: scope_owner
        sql: BEGIN TRAN
      - connection: scope_owner
        sql: 'CREATE TABLE #cache_scope_input(id INT PRIMARY KEY,value INT NULL)'
      - connection: scope_owner
        sql: 'INSERT #cache_scope_input VALUES(1,101),(2,202),(3,NULL)'
      - connection: scope_owner
        sql: 'SELECT SUM(value) AS total,COUNT(*) AS n,COUNT(value) AS populated FROM #cache_scope_input'
        expect:
          rows: 1
          data:
          - total: 303
            n: 3
            populated: 2
      - connection: scope_owner
        sql: COMMIT TRAN
      - connection: scope_owner
        sql: 'SELECT SUM(value) AS total,COUNT(*) AS n,COUNT(value) AS populated FROM #cache_scope_input'
        expect:
          rows: 1
          data:
          - total: 303
            n: 3
            populated: 2
      - connection: scope_owner
        sql: 'SELECT id,value FROM #cache_scope_input ORDER BY id'
        expect:
          rows: 3
          data:
          - id: 1
            value: 101
          - id: 2
            value: 202
          - id: 3
            value: null
      - connection: scope_owner
        sql: SELECT @@TRANCOUNT AS depth
        expect:
          rows: 1
          data:
          - depth: 0
      - connection: scope_owner
        sql: 'DROP TABLE #cache_scope_input'
  - name: Scoped IN and NOT IN NULL witnesses retain three-valued results across commit rollback and recreated generations
    tds:
      statements:
      - connection: witness_owner
        sql: 'DROP TABLE IF EXISTS #cache_probes'
      - connection: witness_owner
        sql: 'DROP TABLE IF EXISTS #cache_rhs'
      - connection: witness_owner
        sql: BEGIN TRAN
      - connection: witness_owner
        sql: 'CREATE TABLE #cache_probes(id INT PRIMARY KEY,probe INT NULL)'
      - connection: witness_owner
        sql: 'INSERT #cache_probes VALUES(1,NULL),(2,0),(3,1),(4,2),(5,9)'
      - connection: witness_owner
        sql: 'CREATE TABLE #cache_rhs(value INT NULL,enabled INT NOT NULL)'
      - connection: witness_owner
        sql: 'INSERT #cache_rhs VALUES(NULL,1),(0,1),(0,1),(9,0)'
      - connection: witness_owner
        sql: "SELECT p.id,p.probe,\n CASE WHEN p.probe IN (SELECT value FROM #cache_rhs WHERE enabled=1) THEN 1\n      WHEN\
          \ NOT (p.probe IN (SELECT value FROM #cache_rhs WHERE enabled=1)) THEN 0 ELSE -1 END AS in_value,\n CASE WHEN p.probe\
          \ NOT IN (SELECT value FROM #cache_rhs WHERE enabled=1) THEN 1\n      WHEN NOT (p.probe NOT IN (SELECT value FROM\
          \ #cache_rhs WHERE enabled=1)) THEN 0 ELSE -1 END AS not_in_value\nFROM #cache_probes p ORDER BY p.id"
        expect:
          rows: 5
          data:
          - id: 1
            probe: null
            in_value: -1
            not_in_value: -1
          - id: 2
            probe: 0
            in_value: 1
            not_in_value: 0
          - id: 3
            probe: 1
            in_value: -1
            not_in_value: -1
          - id: 4
