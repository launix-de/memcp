metadata:
  description: Declaration-based TDS nullability of complete joined operands
  syntax: tsql
  requires_tds: true
  isolated: true
setup:
  - sql: CREATE TABLE operand_metadata_parent(id INT NOT NULL PRIMARY KEY)
  - sql: CREATE TABLE operand_metadata_head(id INT NOT NULL PRIMARY KEY,parent_id INT NOT NULL)
  - sql: CREATE TABLE operand_metadata_middle(id INT NOT NULL PRIMARY KEY,head_id INT NOT NULL)
  - sql: CREATE TABLE operand_metadata_tail(id INT NOT NULL PRIMARY KEY,middle_id INT NOT NULL)
  - sql: INSERT INTO operand_metadata_parent VALUES(1),(2)
  - sql: INSERT INTO operand_metadata_head VALUES(10,1)
  - sql: INSERT INTO operand_metadata_middle VALUES(20,10)
  - sql: INSERT INTO operand_metadata_tail VALUES(30,20)
  - sql: CREATE TABLE operand_text_parent(id INT NOT NULL PRIMARY KEY,head_id INT)
  - sql: CREATE TABLE operand_text_head(id INT NOT NULL PRIMARY KEY,label VARCHAR(12))
  - sql: CREATE TABLE operand_text_child(id INT NOT NULL PRIMARY KEY,head_id INT)
  - sql: INSERT INTO operand_text_parent VALUES(1,10),(2,20),(3,30),(4,90)
  - sql: INSERT INTO operand_text_head VALUES(10,'one'),(20,'no child'),(30,NULL)
  - sql: INSERT INTO operand_text_child VALUES(100,10),(101,10),(300,30)
cleanup:
  - sql: DROP VIEW IF EXISTS operand_text_wrapper
  - sql: DROP VIEW IF EXISTS operand_text_source
  - sql: DROP VIEW IF EXISTS operand_text_view
  - sql: DROP TABLE IF EXISTS operand_text_child
  - sql: DROP TABLE IF EXISTS operand_text_head
  - sql: DROP TABLE IF EXISTS operand_text_parent
  - sql: DROP TABLE IF EXISTS operand_metadata_tail
  - sql: DROP TABLE IF EXISTS operand_metadata_middle
  - sql: DROP TABLE IF EXISTS operand_metadata_head
  - sql: DROP TABLE IF EXISTS operand_metadata_parent
test_cases:
  - name: Empty LEFT result describes every member of the nullable INNER operand
    tds:
      statements:
        - sql: >-
            SELECT TOP(0) p.id AS pid,h.id AS hid,m.id AS mid,t.id AS tid
            FROM operand_metadata_parent p
            LEFT JOIN (operand_metadata_head h
              INNER JOIN operand_metadata_middle m ON m.head_id=h.id
              INNER JOIN operand_metadata_tail t ON t.middle_id=m.id)
            ON h.parent_id=p.id
          expect:
            rows: 0
            column_types: &nullable_operand
              - {name: pid,type: INT,nullable: false}
              - {name: hid,type: INT,nullable: true}
              - {name: mid,type: INT,nullable: true}
              - {name: tid,type: INT,nullable: true}
  - name: LEFT nullable declaration agrees with complete operand null extension
    tds:
      statements:
        - sql: >-
            SELECT p.id AS pid,h.id AS hid,m.id AS mid,t.id AS tid
            FROM operand_metadata_parent p
            LEFT JOIN (operand_metadata_head h
              INNER JOIN operand_metadata_middle m ON m.head_id=h.id
              INNER JOIN operand_metadata_tail t ON t.middle_id=m.id)
            ON h.parent_id=p.id ORDER BY p.id
          expect:
            rows: 2
            data: [{pid: 1,hid: 10,mid: 20,tid: 30},{pid: 2,hid: null,mid: null,tid: null}]
            column_types: *nullable_operand
  - name: Empty RIGHT result describes its entire nullable INNER cloud
    tds:
      statements:
        - sql: >-
            SELECT TOP(0) p.id AS pid,h.id AS hid,m.id AS mid,t.id AS tid
            FROM operand_metadata_head h
            INNER JOIN operand_metadata_middle m ON m.head_id=h.id
            INNER JOIN operand_metadata_tail t ON t.middle_id=m.id
            RIGHT JOIN operand_metadata_parent p ON p.id=h.parent_id
          expect:
            rows: 0
            column_types: *nullable_operand
  - name: Ordinary INNER cloud retains its declared nonnullable columns
    tds:
      statements:
        - sql: >-
            SELECT TOP(0) p.id AS pid,h.id AS hid,m.id AS mid,t.id AS tid
            FROM operand_metadata_parent p
            INNER JOIN operand_metadata_head h ON h.parent_id=p.id
            INNER JOIN operand_metadata_middle m ON m.head_id=h.id
            INNER JOIN operand_metadata_tail t ON t.middle_id=m.id
          expect:
            rows: 0
            column_types:
              - {name: pid,type: INT,nullable: false}
              - {name: hid,type: INT,nullable: false}
              - {name: mid,type: INT,nullable: false}
              - {name: tid,type: INT,nullable: false}
  - name: Grouped view text exports retain declared ISNULL and CASE contracts
    setup:
      - sql: >-
          CREATE VIEW operand_text_view AS
          SELECT p.id,c.id AS child_id,
            CASE WHEN h.id IS NULL THEN 'missing'
              ELSE ISNULL(h.label,'blank') END AS label
          FROM operand_text_parent p
          LEFT JOIN (operand_text_head h
            INNER JOIN operand_text_child c ON c.head_id=h.id)
          ON p.head_id=h.id
    sql: SELECT id,child_id,label FROM operand_text_view ORDER BY id,child_id
    expect:
      rows: 5
      data: &operand_text_rows
        - {id: 1,child_id: 100,label: one}
        - {id: 1,child_id: 101,label: one}
        - {id: 2,child_id: null,label: missing}
        - {id: 3,child_id: 300,label: blank}
        - {id: 4,child_id: null,label: missing}
  - name: A stored joined source supplies declared text contracts to another view
    setup:
      - sql: >-
          CREATE VIEW operand_text_source AS
          SELECT p.id,h.id AS head_id,c.id AS child_id,h.label
          FROM operand_text_parent p
          LEFT JOIN (operand_text_head h
            INNER JOIN operand_text_child c ON c.head_id=h.id)
          ON p.head_id=h.id
      - sql: >-
          CREATE VIEW operand_text_wrapper AS
          SELECT s.id,s.child_id,
            CASE WHEN s.head_id IS NULL THEN 'missing'
              ELSE ISNULL(s.label,'blank') END AS label
          FROM operand_text_source s
    sql: SELECT id,child_id,label FROM operand_text_wrapper ORDER BY id,child_id
    expect:
      rows: 5
      data: *operand_text_rows
  - name: Restart after publishing the typed joined view
    action: restart
  - name: Restored grouped view text exports retain their declared wire width
    tds:
      statements:
        - sql: SELECT TOP(0) id,child_id,label FROM operand_text_view
          expect:
            rows: 0
            column_types: &operand_text_columns
              - {name: id,type: INT,nullable: false}
              - {name: child_id,type: INT,nullable: true}
              - {name: label,type: VARCHAR,length: 12}
        - sql: SELECT TOP(0) id,child_id,label FROM operand_text_wrapper
          expect:
            rows: 0
            column_types: *operand_text_columns
