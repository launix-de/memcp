metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: Legacy login catalog projects native account identity and durable SQL-login registration/change dates; historical
    accounts are adopted once without inventing prior native history
setup:
- scm: (if (has? (show) "master") true (createdatabase "master"))
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "CREATE USER login_catalog_member IDENTIFIED BY 'pw'" (lambda (tx) (mysql_run_sql_statement tx "system" "CREATE USER login_catalog_member
    IDENTIFIED BY 'pw'" s (lambda (_row) true) (lambda args true)))))
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "GRANT ALL ON `memcp-tests`.* TO login_catalog_member" (lambda (tx) (mysql_run_sql_statement tx "system" "GRANT ALL ON `memcp-tests`.*
    TO login_catalog_member" s (lambda (_row) true) (lambda args true)))))
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "CREATE USER login_catalog_other IDENTIFIED BY 'pw'" (lambda (tx) (mysql_run_sql_statement tx "system" "CREATE USER login_catalog_other
    IDENTIFIED BY 'pw'" s (lambda (_row) true) (lambda args true)))))
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "GRANT ALL ON `memcp-tests`.* TO login_catalog_other" (lambda (tx) (mysql_run_sql_statement tx "system" "GRANT ALL ON `memcp-tests`.*
    TO login_catalog_other" s (lambda (_row) true) (lambda args true)))))
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "GRANT ALL ON `master`.* TO login_catalog_member" (lambda (tx) (mysql_run_sql_statement tx "system" "GRANT ALL ON `master`.*
    TO login_catalog_member" s (lambda (_row) true) (lambda args true)))))
- sql: CREATE TABLE login_catalog_saved(name NVARCHAR(128) PRIMARY KEY,sid VARBINARY(85),created DATETIME,changed DATETIME)
- sql: INSERT login_catalog_saved SELECT name,sid,createdate,updatedate FROM sys.syslogins WHERE name IN(N'root',N'login_catalog_member',N'login_catalog_other')
cleanup:
- sql: DROP TABLE IF EXISTS login_catalog_saved
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "DROP USER IF EXISTS login_catalog_added" (lambda (tx) (mysql_run_sql_statement tx "system" "DROP USER IF EXISTS login_catalog_added"
    s (lambda (_row) true) (lambda args true)))))
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "DROP USER IF EXISTS login_catalog_other" (lambda (tx) (mysql_run_sql_statement tx "system" "DROP USER IF EXISTS login_catalog_other"
    s (lambda (_row) true) (lambda args true)))))
- scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s nil
    0 "DROP USER IF EXISTS login_catalog_member" (lambda (tx) (mysql_run_sql_statement tx "system" "DROP USER IF EXISTS login_catalog_member"
    s (lambda (_row) true) (lambda args true)))))
test_cases:
- name: Native administrator sees real account names and fixed-role membership
  sql: SELECT name,loginname,sysadmin,securityadmin,serveradmin,setupadmin,processadmin,diskadmin,dbcreator,bulkadmin,hasaccess,isntname,isntgroup,isntuser,denylogin,password
    FROM sys.syslogins WHERE name IN(N'root',N'login_catalog_member',N'login_catalog_other') ORDER BY name
  expect:
    rows: 3
    data:
    - name: login_catalog_member
      loginname: login_catalog_member
      sysadmin: 0
      securityadmin: 0
      serveradmin: 0
      setupadmin: 0
      processadmin: 0
      diskadmin: 0
      dbcreator: 0
      bulkadmin: 0
      hasaccess: 1
      isntname: 0
      isntgroup: 0
      isntuser: 0
      denylogin: 0
      password: null
    - name: login_catalog_other
      loginname: login_catalog_other
      sysadmin: 0
      securityadmin: 0
      serveradmin: 0
      setupadmin: 0
      processadmin: 0
      diskadmin: 0
      dbcreator: 0
      bulkadmin: 0
      hasaccess: 1
      isntname: 0
      isntgroup: 0
      isntuser: 0
      denylogin: 0
      password: null
    - name: root
      loginname: root
      sysadmin: 1
      securityadmin: 0
      serveradmin: 0
      setupadmin: 0
      processadmin: 0
      diskadmin: 0
      dbcreator: 0
      bulkadmin: 0
      hasaccess: 1
      isntname: 0
      isntgroup: 0
      isntuser: 0
      denylogin: 0
      password: null
- name: Nonadministrator sees only its own native account
  sql: SELECT name,loginname,sysadmin,password FROM sys.syslogins ORDER BY name
  expect:
    rows: 1
    data:
    - name: login_catalog_member
      loginname: login_catalog_member
      sysadmin: 0
      password: null
  username: login_catalog_member
  password: pw
  session_id: login-catalog-member
- name: Explicit master catalog has the same unprivileged visibility
  sql: SELECT name,sysadmin,password FROM master.sys.syslogins ORDER BY name
  expect:
    rows: 1
    data:
    - name: login_catalog_member
      sysadmin: 0
      password: null
  username: login_catalog_member
  password: pw
- name: Current login SID is the same declared native principal as the modern catalog
  sql: SELECT l.name,CASE WHEN l.sid=p.sid AND l.sid=SUSER_SID() THEN 1 ELSE 0 END AS same_sid FROM sys.syslogins l INNER JOIN
    sys.server_principals p ON l.sid=p.sid WHERE l.name=SUSER_SNAME()
  expect:
    rows: 1
    data:
    - name: root
      same_sid: 1
- name: Legacy names resolve without a sys qualifier
  sql: SELECT name,loginname FROM syslogins WHERE name=SUSER_SNAME()
  expect:
    rows: 1
    data:
    - name: root
      loginname: root
- name: Catalog lookup shares the existing declared virtual identity
  sql: SELECT OBJECT_NAME(OBJECT_ID(N'sys.syslogins',N'V')) AS catalog_name,CASE WHEN OBJECT_ID(N'sys.syslogins',N'U') IS NULL
    THEN 1 ELSE 0 END AS not_table
  expect:
    rows: 1
    data:
    - catalog_name: syslogins
      not_table: 1
- name: No password material is exposed even to the native administrator
  sql: SELECT name,password FROM sys.syslogins WHERE name IN(N'root',N'login_catalog_member',N'login_catalog_other') ORDER BY name
  expect:
    rows: 3
    data:
    - name: login_catalog_member
      password: null
    - name: login_catalog_other
      password: null
    - name: root
      password: null
- name: Absent legacy usage metrics and login defaults remain explicitly nullable
  sql: SELECT name,status,totcpu,totio,spacelimit,timelimit,resultlimit,dbname,language FROM sys.syslogins WHERE name=N'root'
  expect:
    rows: 1
    data:
    - name: root
      status: null
      totcpu: null
      totio: null
      spacelimit: null
      timelimit: null
      resultlimit: null
      dbname: null
      language: null
- name: SQL-login registration and change dates are real persisted native values
  sql: SELECT name,CASE WHEN createdate IS NOT NULL AND updatedate IS NOT NULL AND accdate=createdate AND createdate<=GETDATE()
    AND updatedate<=GETDATE() THEN 1 ELSE 0 END AS registered FROM sys.syslogins WHERE name IN(N'root',N'login_catalog_member',N'login_catalog_other')
    ORDER BY name
  expect:
    rows: 3
    data:
    - name: login_catalog_member
      registered: 1
    - name: login_catalog_other
      registered: 1
    - name: root
      registered: 1
