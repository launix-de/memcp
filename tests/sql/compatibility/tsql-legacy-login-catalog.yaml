- name: A warm catalog lookup observes an absent native account
  session_id: login-catalog-admin
  sql: SELECT name,sysadmin FROM sys.syslogins WHERE name=N'login_catalog_added'
  expect:
    rows: 0
    data: []
- name: Native account creation is visible to an already compiled catalog query
  setup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "CREATE USER login_catalog_added IDENTIFIED BY 'pw'" (lambda (tx) (mysql_run_sql_statement tx "system" "CREATE USER
      login_catalog_added IDENTIFIED BY 'pw'" s (lambda (_row) true) (lambda args true)))))
  cleanup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "DROP USER IF EXISTS login_catalog_added" (lambda (tx) (mysql_run_sql_statement tx "system" "DROP USER IF EXISTS login_catalog_added"
      s (lambda (_row) true) (lambda args true)))))
  sql: SELECT name,sysadmin FROM sys.syslogins WHERE name=N'login_catalog_added'
  expect:
    rows: 1
    data:
    - name: login_catalog_added
      sysadmin: 0
  session_id: login-catalog-admin
- name: Revoking native database membership revokes cached catalog admission
  setup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "REVOKE ALL ON `memcp-tests`.* FROM login_catalog_member" (lambda (tx) (mysql_run_sql_statement tx "system" "REVOKE
      ALL ON `memcp-tests`.* FROM login_catalog_member" s (lambda (_row) true) (lambda args true)))))
  cleanup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "GRANT ALL ON `memcp-tests`.* TO login_catalog_member" (lambda (tx) (mysql_run_sql_statement tx "system" "GRANT ALL
      ON `memcp-tests`.* TO login_catalog_member" s (lambda (_row) true) (lambda args true)))))
  username: login_catalog_member
  password: pw
  session_id: login-catalog-member
  sql: SELECT name FROM sys.syslogins
  expect:
    error: true
    contains: access denied
- name: Restored native membership reopens the same catalog with the same account
  sql: SELECT name,sysadmin FROM sys.syslogins
  expect:
    rows: 1
    data:
    - name: login_catalog_member
      sysadmin: 0
  username: login_catalog_member
  password: pw
  session_id: login-catalog-member
- name: Underlying private credential table stays inaccessible
  sql: SELECT password FROM system.user
  expect:
    error: true
    contains: access denied
  username: login_catalog_member
  password: pw
- name: Changing the actual native administrator capability refreshes catalog visibility
  setup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "UPDATE system.user SET admin=TRUE WHERE username='login_catalog_member'" (lambda (tx) (mysql_run_sql_statement tx
      "system" "UPDATE system.user SET admin=TRUE WHERE username='login_catalog_member'" s (lambda (_row) true) (lambda args true)))))
  cleanup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "UPDATE system.user SET admin=FALSE WHERE username='login_catalog_member'" (lambda (tx) (mysql_run_sql_statement tx
      "system" "UPDATE system.user SET admin=FALSE WHERE username='login_catalog_member'" s (lambda (_row) true) (lambda args true)))))
  username: login_catalog_member
  password: pw
  session_id: login-catalog-member
  sql: SELECT name,sysadmin FROM sys.syslogins WHERE name IN(N'root',N'login_catalog_member',N'login_catalog_other') ORDER BY name
  expect:
    rows: 3
    data:
    - name: login_catalog_member
      sysadmin: 1
    - name: login_catalog_other
      sysadmin: 0
    - name: root
      sysadmin: 1
- name: Removing the actual administrator capability restores current-login visibility
  username: login_catalog_member
  password: pw
  session_id: login-catalog-member
  sql: SELECT name,sysadmin FROM sys.syslogins ORDER BY name
  expect:
    rows: 1
    data:
    - name: login_catalog_member
      sysadmin: 0
- name: Repeated account metadata initialization retains registration identity and dates
  scm: (sql_initialize_account_incarnations)
  expect:
    result: true
- name: Save the actual post-change metadata before an unchanged update
  sql: DELETE FROM login_catalog_saved; INSERT login_catalog_saved SELECT name,sid,createdate,updatedate FROM sys.syslogins WHERE
    name IN(N'root',N'login_catalog_member',N'login_catalog_other'); SELECT l.name,CASE WHEN l.sid=s.sid AND l.createdate=s.created
    AND l.updatedate=s.changed THEN 1 ELSE 0 END AS unchanged FROM sys.syslogins l INNER JOIN login_catalog_saved s ON l.name=s.name
    ORDER BY l.name
  expect:
    rows: 3
    data:
    - name: login_catalog_member
      unchanged: 1
    - name: login_catalog_other
      unchanged: 1
    - name: root
      unchanged: 1
- name: An unchanged native account update does not fabricate a change instant
  setup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "UPDATE user SET admin=admin WHERE username='login_catalog_member'" (lambda (tx) (mysql_run_sql_statement tx "system"
      "UPDATE user SET admin=admin WHERE username='login_catalog_member'" s (lambda (_row) true) (lambda args true)))))
  sql: SELECT l.name,CASE WHEN l.sid=s.sid AND l.createdate=s.created AND l.updatedate=s.changed THEN 1 ELSE 0 END AS unchanged
    FROM sys.syslogins l INNER JOIN login_catalog_saved s ON l.name=s.name ORDER BY l.name
  expect:
    rows: 3
    data:
    - name: login_catalog_member
      unchanged: 1
    - name: login_catalog_other
      unchanged: 1
    - name: root
      unchanged: 1
- name: Account metadata reload uses the same durable native row
  action: restart
- name: Reauthentication after restart retains catalog registration and change times
  sql: SELECT l.name,CASE WHEN l.sid=s.sid AND l.createdate=s.created AND l.updatedate=s.changed THEN 1 ELSE 0 END AS unchanged
    FROM sys.syslogins l INNER JOIN login_catalog_saved s ON l.name=s.name ORDER BY l.name
  expect:
    rows: 3
    data:
    - name: login_catalog_member
      unchanged: 1
    - name: login_catalog_other
      unchanged: 1
    - name: root
      unchanged: 1
- name: The actual native account mutation owns its modification timestamp
  setup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "UPDATE user SET password=PASSWORD('new-pw'),sql_login_updated_at='2000-01-01 00:00:00' WHERE username='login_catalog_other'"
      (lambda (tx) (mysql_run_sql_statement tx "system" "UPDATE user SET password=PASSWORD('new-pw'),sql_login_updated_at='2000-01-01
      00:00:00' WHERE username='login_catalog_other'" s (lambda (_row) true) (lambda args true)))))
  sql: SELECT l.name,CASE WHEN l.createdate=s.created AND l.updatedate>CAST('2000-01-01 00:00:00' AS DATETIME) AND l.updatedate<=GETDATE()
    THEN 1 ELSE 0 END AS owned_change FROM sys.syslogins l INNER JOIN login_catalog_saved s ON l.name=s.name WHERE l.name=N'login_catalog_other'
  expect:
    rows: 1
    data:
    - name: login_catalog_other
      owned_change: 1
- name: A new authentication observes the actual changed credential and same incarnation
  username: login_catalog_other
  password: new-pw
  sql: SELECT l.name,CASE WHEN l.sid=s.sid AND l.createdate=s.created THEN 1 ELSE 0 END AS same_registration FROM sys.syslogins
    l INNER JOIN login_catalog_saved s ON l.name=s.name
  expect:
    rows: 1
    data:
    - name: login_catalog_other
      same_registration: 1
- name: Native rollback restores account state and its timestamp together
  sql: BEGIN TRANSACTION; UPDATE [system].[user] SET admin=1 WHERE username=N'login_catalog_member'; DECLARE @inside INT=(SELECT
    sysadmin FROM sys.syslogins WHERE name=N'login_catalog_member'); ROLLBACK; SELECT @inside AS inside_role,l.sysadmin,CASE WHEN
    l.createdate=s.created AND l.updatedate=s.changed THEN 1 ELSE 0 END AS restored_metadata FROM sys.syslogins l INNER JOIN login_catalog_saved
    s ON l.name=s.name WHERE l.name=N'login_catalog_member'
  expect:
    rows: 1
    data:
    - inside_role: 1
      sysadmin: 0
      restored_metadata: 1
- name: Dropping and recreating a native account creates a new login registration
  setup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "DROP USER login_catalog_other" (lambda (tx) (mysql_run_sql_statement tx "system" "DROP USER login_catalog_other" s
      (lambda (_row) true) (lambda args true)))))
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "CREATE USER login_catalog_other IDENTIFIED BY 'pw'" (lambda (tx) (mysql_run_sql_statement tx "system" "CREATE USER
      login_catalog_other IDENTIFIED BY 'pw'" s (lambda (_row) true) (lambda args true)))))
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "GRANT ALL ON `memcp-tests`.* TO login_catalog_other" (lambda (tx) (mysql_run_sql_statement tx "system" "GRANT ALL
      ON `memcp-tests`.* TO login_catalog_other" s (lambda (_row) true) (lambda args true)))))
  sql: SELECT l.name,CASE WHEN l.sid<>s.sid AND l.createdate IS NOT NULL AND l.updatedate IS NOT NULL AND l.accdate=l.createdate
    THEN 1 ELSE 0 END AS new_registration FROM sys.syslogins l INNER JOIN login_catalog_saved s ON l.name=s.name WHERE l.name=N'login_catalog_other'
  expect:
    rows: 1
    data:
    - name: login_catalog_other
      new_registration: 1
- name: Catalog nonnullable exports survive a direct derived projection
  tds:
    statements:
    - sql: SELECT d.name,d.loginname,d.createdate FROM (SELECT name,loginname,createdate FROM sys.syslogins) d WHERE 1=0
      expect:
        rows: 0
        column_types:
        - name: name
          type: NVARCHAR
          length: 128
          nullable: false
        - name: loginname
          type: NVARCHAR
          length: 128
          nullable: false
        - name: createdate
          type: DATETIME
          nullable: false
- name: Null-extended catalog exports remain nullable
  tds:
    statements:
    - sql: SELECT l.name,l.createdate FROM (VALUES(1)) p(id) LEFT JOIN sys.syslogins l ON 1=0 WHERE 1=0
      expect:
        rows: 0
        column_types:
        - name: name
          type: NVARCHAR
          length: 128
          nullable: true
        - name: createdate
          type: DATETIME
          nullable: true
- name: Catalog contracts do not change the native username column declaration
  scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "memcp-tests") (define field (car (tds_describe "memcp-tests"
    "SELECT username FROM [system].[user] WHERE 1=0" "" s))) (equal? (mod (field "flags") 2) 1))
  expect:
    result: true
- name: Rows without a valid native login identity are excluded from login metadata
  setup:
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "INSERT INTO user(username,password,admin) VALUES(NULL,PASSWORD('pw'),FALSE)" (lambda (tx) (mysql_run_sql_statement
      tx "system" "INSERT INTO user(username,password,admin) VALUES(NULL,PASSWORD('pw'),FALSE)" s (lambda (_row) true) (lambda
      args true)))))
  - scm: (begin (define s (newsession)) (s "username" "root") (s "schema" "system") (s "syntax" "mysql") (sql_with_statement s
      nil 0 "INSERT INTO user(username,password,admin,sql_principal_id) VALUES('login_catalog_incomplete',PASSWORD('pw'),FALSE,NULL)"
      (lambda (tx) (mysql_run_sql_statement tx "system" "INSERT INTO user(username,password,admin,sql_principal_id) VALUES('login_catalog_incomplete',PASSWORD('pw'),FALSE,NULL)"
      s (lambda (_row) true) (lambda args true)))))
  cleanup:
