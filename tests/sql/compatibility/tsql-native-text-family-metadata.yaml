metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: Existing native text families expose unbounded TSQL metadata without widening finite declarations
setup:
- scm: (eval (parse_sql "memcp-tests" "CREATE TABLE native_text_family(id INT PRIMARY KEY,small_text TINYTEXT,medium_text MEDIUMTEXT,long_text LONGTEXT) ENGINE=SAFE" nil))
- sql: CREATE TABLE native_text_finite(ansi VARCHAR(7),national NVARCHAR(9))
- sql: CREATE TABLE native_text_max(ansi VARCHAR(MAX),national NVARCHAR(MAX),raw VARBINARY(MAX))
cleanup:
- sql: DROP TABLE IF EXISTS native_text_family
- sql: DROP TABLE IF EXISTS native_text_finite
- sql: DROP TABLE IF EXISTS native_text_max
test_cases:
- name: Metadata projection preserves actual native text-family declarations
  scm: "(begin\n (define columns (get_schema \"memcp-tests\" \"native_text_family\" nil))\n (and (expression_equal? (map (cdr columns) (lambda (column) (column \"RawType\"))) '(\"TINYTEXT\" \"MEDIUMTEXT\" \"LONGTEXT\"))\n  (expression_equal? (map (cdr columns) (lambda (column) (column \"Dimensions\"))) (list (list) (list) (list)))))"
  expect:
    result: true
- name: Native text-family result descriptors preserve source types and advertise MAX
  scm: "(begin\n (define fields (tds_describe \"memcp-tests\" \"SELECT TOP(0) small_text,medium_text,long_text FROM native_text_family\" \"\" (newsession)))\n (and (expression_equal? (map fields (lambda (field) (field \"sql_type\"))) '(\"TINYTEXT\" \"MEDIUMTEXT\" \"LONGTEXT\"))\n  (expression_equal? (map fields (lambda (field) (field \"kind\"))) '(167 167 167))\n  (expression_equal? (map fields (lambda (field) (field \"size\"))) '(65535 65535 65535))))"
  expect:
    result: true
- name: Actual FMTONLY exposes native text families as unbounded ANSI fields
  tds:
    statements:
    - sql: SET FMTONLY ON
    - sql: SELECT small_text,medium_text,long_text FROM native_text_family
      expect:
        rows: 0
        column_types:
        - name: small_text
          type: VARCHAR
        - name: medium_text
          type: VARCHAR
        - name: long_text
          type: VARCHAR
    - sql: SET FMTONLY OFF
- name: sp_columns describes each native family with the existing large-text contract
  sql: EXEC sp_columns @table_name=N'native_text_family',@ODBCVer=3
  expect:
    rows: 4
    data:
    - COLUMN_NAME: id
      TYPE_NAME: int
    - COLUMN_NAME: small_text
      TYPE_NAME: text
      DATA_TYPE: -1
      PRECISION: 2147483647
      LENGTH: 2147483647
      CHAR_OCTET_LENGTH: 2147483647
    - COLUMN_NAME: medium_text
      TYPE_NAME: text
      DATA_TYPE: -1
      PRECISION: 2147483647
      LENGTH: 2147483647
      CHAR_OCTET_LENGTH: 2147483647
    - COLUMN_NAME: long_text
      TYPE_NAME: text
      DATA_TYPE: -1
      PRECISION: 2147483647
      LENGTH: 2147483647
      CHAR_OCTET_LENGTH: 2147483647
- name: Native text-family collation metadata preserves every source ordinal
  tds:
    statements:
    - sql: EXEC sys.sp_tablecollations_100 N'dbo.native_text_family'
      expect:
        rows: 4
        data:
        - colid: 1
          name: id
          tds_collation: null
        - colid: 2
          name: small_text
          tds_collation:
            binary_hex: 0904d00034
        - colid: 3
          name: medium_text
          tds_collation:
            binary_hex: 0904d00034
        - colid: 4
          name: long_text
          tds_collation:
            binary_hex: 0904d00034
- name: Unbounded text families preserve explicit UTF8 wire selection
  scm: "(reduce '(\"TINYTEXT\" \"MEDIUMTEXT\" \"LONGTEXT\") (lambda (ok type) (begin\n (define wire (tsql_wire_info_contract (sql_info nil type '(\"Latin1_General_100_CI_AS_SC_UTF8\" 2)) '()))\n (and ok (equal? (wire \"kind\") 167) (equal? (wire \"size\") 65535)\n  (equal? (wire \"collation\") (hex2bin \"0904000400\"))))) true)"
  expect:
    result: true
- name: Explicit finite VARCHAR and NVARCHAR metadata retain their declared widths
  scm: (expression_equal? (map (tds_describe "memcp-tests" "SELECT TOP(0) ansi,national FROM native_text_finite" "" (newsession)) (lambda (field) (field "size"))) '(7 18))
  expect:
    result: true
- name: Finite assignments still sanitize to their explicit SQL widths
  sql: INSERT INTO native_text_finite VALUES('abcdefghij',N'ABCDEFGHIJK')
- name: Finite assignment truncation remains visible in actual stored rows
  sql: SELECT ansi,national FROM native_text_finite
  expect:
    rows: 1
    data:
    - ansi: abcdefg
      national: ABCDEFGHI
- name: Explicit MAX declarations retain unbounded protocol sentinels
  scm: "(begin\n (define fields (tds_describe \"memcp-tests\" \"SELECT TOP(0) ansi,national,raw FROM native_text_max\" \"\" (newsession)))\n (and (expression_equal? (map fields (lambda (field) (field \"kind\"))) '(167 231 165))\n  (expression_equal? (map fields (lambda (field) (field \"size\"))) '(65535 65535 65535))))"
  expect:
    result: true
- name: Explicit MAX catalog lengths remain ODBC unlimited values
  sql: EXEC sp_columns @table_name=N'native_text_max',@ODBCVer=3
  expect:
    rows: 3
    data:
    - COLUMN_NAME: ansi
      PRECISION: 0
      LENGTH: 0
      CHAR_OCTET_LENGTH: 0
    - COLUMN_NAME: national
      PRECISION: 0
      LENGTH: 0
      CHAR_OCTET_LENGTH: 0
    - COLUMN_NAME: raw
      PRECISION: 0
      LENGTH: 0
      CHAR_OCTET_LENGTH: 0
- name: Actual bulk copy accepts long payloads in every native text family
  tds:
    statements:
    - bulk:
        table: '[memcp-tests].[dbo].[native_text_family]'
        columns:
        - id
        - small_text
        - medium_text
        - long_text
        rows:
        - - 1
          - &id001 
          - *id001
          - *id001
      expect:
        rows: 1
    - sql: SELECT small_text,medium_text,long_text FROM native_text_family WHERE id=1
      expect:
        rows: 1
        data:
        - small_text: *id001
          medium_text: *id001
          long_text: *id001
        column_types:
        - name: small_text
          type: VARCHAR
        - name: medium_text
          type: VARCHAR
        - name: long_text
          type: VARCHAR
- name: Restart retains the native family payloads
  action: restart
- name: Restarted native text families return complete unbounded values
  tds:
    statements:
    - sql: SELECT small_text,medium_text,long_text FROM native_text_family WHERE id=1
      expect:
        rows: 1
        data:
        - small_text: *id001
          medium_text: *id001
          long_text: *id001
