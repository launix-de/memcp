metadata:
  syntax: tsql
  isolated: true
  description: Parenthesized procedure headers share ordinary parameter defaults output and body execution
setup:
- sql: CREATE TABLE header_source(id INT PRIMARY KEY,value INT)
- sql: INSERT INTO header_source VALUES(1,17)
- sql: CREATE TABLE header_target(id INT,value INT)
- sql: |
    CREATE PROCEDURE dbo.header_copy(@key INT) /* header comment */ AS
      DECLARE @value INT;
      SELECT @value=value FROM header_source WHERE id=@key;
      IF @value IS NOT NULL
        INSERT INTO header_target(id,value) SELECT id,@value+1 FROM header_source WHERE id=@key;
- sql: |
    CREATE PROC dbo.header_defaults(
      @left INT,
      @right INT=5,
      @sum INT=0 OUTPUT
    ) AS SET @sum=@left+@right;
- sql: CREATE PROCEDURE dbo.header_bare @value INT AS SELECT @value AS result;
test_cases:
- name: A parenthesized single parameter accepts comments and a body without BEGIN
  sql: EXEC dbo.header_copy @key=1
- name: The conditional INSERT SELECT executes with its bound header argument
  sql: SELECT id,value FROM header_target
  expect: {rows: 1,data: [{id: 1,value: 18}]}
- name: Parenthesized declarations retain ordinary defaults and output copyback
  sql: DECLARE @answer INT=0; EXEC dbo.header_defaults @left=7,@sum=@answer OUTPUT; SELECT @answer AS result;
  expect: {rows: 1,data: [{result: 12}]}
- name: An explicit argument overrides the same declaration default
  sql: DECLARE @answer INT=0; EXEC dbo.header_defaults @left=7,@right=2,@sum=@answer OUTPUT; SELECT @answer AS result;
  expect: {rows: 1,data: [{result: 9}]}
- name: ALTER retains a parenthesized header and ordinary BEGIN END body
  sql: ALTER PROCEDURE dbo.header_defaults(@left INT,@right INT=7,@sum INT=0 OUTPUT) AS BEGIN SET @sum=@left+@right; END;
- name: Altered parenthesized defaults supply current output values
  sql: DECLARE @answer INT=0; EXEC dbo.header_defaults @left=7,@sum=@answer OUTPUT; SELECT @answer AS result;
  expect: {rows: 1,data: [{result: 14}]}
- name: CREATE OR ALTER uses the same header owner
  sql: CREATE OR ALTER PROC dbo.header_defaults(@left INT,@right INT=9,@sum INT=0 OUTPUT) AS SET @sum=@left+@right;
- name: Replaced header declarations retain output behavior
  sql: DECLARE @answer INT=0; EXEC dbo.header_defaults @left=7,@sum=@answer OUTPUT; SELECT @answer AS result;
  expect: {rows: 1,data: [{result: 16}]}
- name: The original unparenthesized declaration syntax remains executable
  sql: EXEC dbo.header_bare @value=23
  expect: {rows: 1,data: [{result: 23}]}
- name: A missing closing header delimiter is invalid SQL
  sql: CREATE PROCEDURE dbo.header_unclosed(@value INT AS SELECT @value AS result;
  expect: {error: true}
- name: Invalid headers never publish a procedure declaration
  scm: (empty_list? (showprocedures "memcp-tests" "header_unclosed" nil))
  expect: {result: true}
- name: Parenthesized headers keep duplicate parameter rejection
  sql: CREATE PROCEDURE dbo.header_duplicate(@value INT,@value INT) AS SELECT 1 AS result;
  expect: {error: true}
cleanup:
- sql: DROP PROCEDURE IF EXISTS dbo.header_duplicate
- sql: DROP PROCEDURE IF EXISTS dbo.header_unclosed
- sql: DROP PROCEDURE IF EXISTS dbo.header_defaults
- sql: DROP PROCEDURE IF EXISTS dbo.header_copy
- sql: DROP PROCEDURE IF EXISTS dbo.header_bare
- sql: DROP TABLE IF EXISTS header_target
- sql: DROP TABLE IF EXISTS header_source
