- name: Whole second precise clock default uses the native declaration
  setup:
  - sql: DROP TABLE IF EXISTS tsql_clock_declaration
  - sql: CREATE TABLE tsql_clock_declaration(id INT,value DATETIME2(7) DEFAULT ((SYSDATETIME())))
  scm: |
    (begin
      (define declaration (show (table "memcp-tests" "tsql_clock_declaration") "column" "value" false))
      (if (and (equal? (declaration "DefaultExpression") "CURRENT_TIMESTAMP")
          (equal? (declaration "RawType") "DATETIME2")
          (equal? (declaration "Dimensions") '(7))) true
        (error "precise clock default did not retain its native declaration")))
  expect:
    result: true
  cleanup:
  - sql: DROP TABLE IF EXISTS tsql_clock_declaration
- name: Precise clock default rejects arguments
  sql: CREATE TABLE tsql_invalid_clock_default(value DATETIME2 DEFAULT SYSDATETIME(1))
  expect:
    error: true

- name: Retained compiled clocks remain fresh across whole second executions
  scm: |
    (begin
      (define s (newsession))
      (define formula (sql_queryplan_compile_formula nil
        (parse_tsql "memcp-tests" "SELECT GETDATE() AS legacy,SYSDATETIME() AS precise" nil s nil)))
      (define execute (lambda () (begin
        (define output (newsession))
        (with_autocommit s nil nil "SELECT clocks" (lambda (tx)
          (sql_execute_formula s tx formula (lambda (row) (output "row" row)) (lambda fields true))))
        (output "row"))))
      (define before (execute))
      (sleep 1.05)
      (define after (execute))
      (if (and (> (- (unix_timestamp (after "legacy")) (unix_timestamp (before "legacy"))) 0)
          (> (- (unix_timestamp (after "precise")) (unix_timestamp (before "precise"))) 0)) true
        (error "compiled clock was folded into a cached literal")))
  expect:
    result: true

