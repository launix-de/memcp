- name: First weekday is an explicit session input with integer metadata
  scm: |
    (begin
      (define sess (newsession))
      (define output (newsession))
      (define execute (lambda (text) (with_autocommit sess nil nil text (lambda (tx)
        (tsql_execute_statement tx "memcp-tests" text sess
          (lambda (row) (output "row" row)) (lambda fields nil))))))
      (define query "SELECT @@DATEFIRST AS first,DATEPART(weekday,N'2026-03-15') AS weekday,DATEPART(week,N'2026-01-04') AS week,DATEPART(iso_week,N'2021-01-01') AS iso,DATEDIFF(week,N'2026-03-14',N'2026-03-15') AS difference")
      (execute query)
      (define initial (output "row"))
      (execute "SET DATEFIRST 1") (execute query)
      (define changed (output "row"))
      (execute "SET DATEFIRST 7") (execute query)
      (define restored (output "row"))
      (and (equal? (initial "first") 7) (equal? (initial "weekday") 1) (equal? (initial "week") 2)
        (equal? (changed "first") 1) (equal? (changed "weekday") 7) (equal? (changed "week") 1)
        (equal? (changed "iso") 53) (equal? (changed "difference") 1)
        (equal? (restored "weekday") 1) (equal? (restored "week") 2)))
  expect: {result: true}
- name: All seven first weekday settings retain calendar contracts
  scm: |
    (begin
      (define sess (newsession))
      (define output (newsession))
      (define execute (lambda (text) (with_autocommit sess nil nil text (lambda (tx)
        (tsql_execute_statement tx "memcp-tests" text sess
          (lambda (row) (output "row" row)) (lambda fields nil))))))
      (reduce '(1 2 3 4 5 6 7) (lambda (correct first) (begin
        (execute (concat "SET DATEFIRST " first))
        (execute "SELECT DATEPART(week,N'2007-04-21') AS week,DATEPART(dw,N'2007-04-21') AS day")
        (define row (output "row"))
        (and correct (equal? (row "week") (nth '(16 17 17 17 17 17 16) (- first 1)))
          (equal? (row "day") (nth '(6 5 4 3 2 1 7) (- first 1)))))) true))
  expect: {result: true}
