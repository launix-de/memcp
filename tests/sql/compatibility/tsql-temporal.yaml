# Fixture preparation and cleanup are explicit cases so unsupported DDL stays visible.
metadata:
  version: '1.0'
  description: T-SQL temporal conversions and calendar boundary arithmetic
  syntax: tsql
  isolated: true
setup: []
test_cases:
- sql: DROP TABLE IF EXISTS tsql_clock_defaults
  name: 'Fixture setup 001: DROP TABLE IF EXISTS tsql_clock_defaults'
- sql: DROP TABLE IF EXISTS tsql_temporal_data
  name: 'Fixture setup 002: DROP TABLE IF EXISTS tsql_temporal_data'
- sql: CREATE TABLE tsql_temporal_data (id INT PRIMARY KEY, d DATE, dt DATETIME)
  name: 'Fixture setup 003: CREATE TABLE tsql_temporal_data (id INT PRIMARY KEY, d DATE, dt DATETIME)'
- sql: INSERT INTO tsql_temporal_data VALUES (1,N'2026-03-15',N'2026-03-15 12:13:14')
  name: 'Fixture setup 004: INSERT INTO tsql_temporal_data VALUES (1,N''2026-03-15'',N''2026-03-15 12:13:14'')'
- sql: DROP TABLE IF EXISTS tsql_fractional_data
  name: 'Fixture setup 005: DROP TABLE IF EXISTS tsql_fractional_data'
- sql: CREATE TABLE tsql_fractional_data (id INT PRIMARY KEY, d2 DATETIME2(7), dt DATETIME, tm TIME(7))
  name: 'Fixture setup 006: CREATE TABLE tsql_fractional_data (id INT PRIMARY KEY, d2 DATETIME2(7), dt DATETIME,
    tm TIME(7))'
- sql: INSERT INTO tsql_fractional_data VALUES (1,N'2026-03-15 12:13:14.1234567',N'2026-03-15 12:13:14.003',N'12:13:14.1234567'),(2,N'2026-03-15
    12:13:14.1234568',N'2026-03-15 12:13:14.007',N'12:13:14.1234568')
  name: 'Fixture setup 007: INSERT INTO tsql_fractional_data VALUES (1,N''2026-03-15 12:13:14.1234567'',N''2026-03-15
    12:13:14.003'''
- name: Clock defaults are evaluated by a later insert rather than create
  scm: "(begin\n  (define s (newsession))\n  (define execute (lambda (sql) (begin\n    (define output (newsession))\n\
    \    (with_autocommit s nil nil sql (lambda (tx)\n      (sql_execute_formula s tx\n        (sql_queryplan_compile_formula\
    \ tx (parse_tsql \"memcp-tests\" sql nil s tx))\n        (lambda (row) (output \"row\" row)) (lambda fields\
    \ true))))\n    (output \"row\"))))\n  (execute \"CREATE TABLE tsql_clock_defaults (id INT PRIMARY KEY, created\
    \ DATETIME DEFAULT ((GETDATE())), precise DATETIME2(7) DEFAULT SYSDATETIME(), standard DATETIME DEFAULT CURRENT_TIMESTAMP)\"\
    )\n  (sleep 1.05)\n  (define cutoff (execute \"SELECT CONVERT(VARCHAR(30),GETDATE(),121) AS created,CONVERT(VARCHAR(30),SYSDATETIME(),121)\
    \ AS precise\"))\n  (execute \"INSERT tsql_clock_defaults (id) VALUES (1)\")\n  (define row (execute \"SELECT\
    \ CONVERT(VARCHAR(30),created,121) AS created,CONVERT(VARCHAR(30),precise,121) AS precise,CONVERT(VARCHAR(30),standard,121)\
    \ AS standard FROM tsql_clock_defaults WHERE id=1\"))\n  (if (and (>= (tsql_datediff \"second\" (cutoff \"created\"\
    ) (row \"created\")) 0)\n      (>= (tsql_datediff \"second\" (cutoff \"precise\") (row \"precise\")) 0)\n  \
    \    (>= (tsql_datediff \"second\" (cutoff \"created\") (row \"standard\")) 0)) true\n    (error \"clock default\
    \ was frozen while creating the table\")))\n"
  noncritical: true
- name: Raw current clocks preserve native temporal output
  sql: SELECT GETDATE() AS legacy,SYSDATETIME() AS precise,CURRENT_TIMESTAMP AS standard
  expect:
    rows: 1
  noncritical: true
- name: Raw inserted default clocks retain their declared temporal values
  sql: SELECT created,precise,standard FROM tsql_clock_defaults WHERE id=1
  expect:
    rows: 1
  noncritical: true
- name: Clock default expressions remain schema expressions
  scm: "(begin\n  (define cols (tsql_get_schema \"memcp-tests\" \"tsql_clock_defaults\"))\n  (define find_column\
    \ (lambda (name) (find cols (lambda (col) (equal? (col \"Field\") name)) nil)))\n  (if (and (equal? ((find_column\
    \ \"created\") \"DefaultExpression\") \"GETDATE()\")\n      (equal? ((find_column \"precise\") \"DefaultExpression\"\
    ) \"SYSDATETIME()\")\n      (equal? ((find_column \"standard\") \"DefaultExpression\") \"GETDATE()\")) true\n\
    \    (error \"clock default was serialized as a creation-time literal\")))\n"
  noncritical: true
- name: An omitted clock default accepts explicit NULL unchanged
  sql: INSERT tsql_clock_defaults (id,created,precise,standard) VALUES (2,NULL,NULL,NULL)
  noncritical: true
- name: Explicit null clocks are not replaced by defaults
  sql: SELECT created,precise,standard FROM tsql_clock_defaults WHERE id=2
  expect:
    rows: 1
    data:
    - created: null
      precise: null
      standard: null
  noncritical: true
- name: A retained compiled scalar clock is sampled on each execution
  scm: "(begin\n  (define s (newsession))\n  (define formula (sql_queryplan_compile_formula nil\n    (parse_tsql\
    \ \"memcp-tests\" \"SELECT GETDATE() AS legacy,SYSDATETIME() AS precise\" nil s nil)))\n  (define execute (lambda\
    \ () (begin\n    (define output (newsession))\n    (with_autocommit s nil nil \"SELECT clocks\" (lambda (tx)\n\
    \      (sql_execute_formula s tx formula (lambda (row) (output \"row\" row)) (lambda fields true))))\n    (output\
    \ \"row\"))))\n  (define before (execute))\n  (sleep 0.02)\n  (define after (execute))\n  (if (and (> (tsql_datediff\
    \ \"millisecond\" (before \"legacy\") (after \"legacy\")) 0)\n      (> (tsql_datediff \"microsecond\" (before\
    \ \"precise\") (after \"precise\")) 0)) true\n    (error \"compiled clock was folded into a cached literal\"\
    )))\n"
  noncritical: true
- name: Clock functions reject unexpected arguments
  sql: SELECT GETDATE(1) AS value
  expect:
    error: true
  noncritical: true
- name: Scalar subqueries cannot become default values
  sql: CREATE TABLE tsql_invalid_clock_default (value DATETIME DEFAULT (SELECT GETDATE()))
  expect:
    error: true
- name: Compound clock defaults evaluate through a generic calculator at insert time
  setup:
  - sql: DROP TABLE IF EXISTS tsql_compound_clock_default
  - sql: CREATE TABLE tsql_compound_clock_default (id INT,value DATETIME DEFAULT DATEADD(day,1,GETDATE()))
  scm: "(begin\n  (define session (newsession))\n  (define run (lambda (sql) (begin\n    (define output (newsession))\n\
    \    (with_autocommit session nil nil sql (lambda (tx)\n      (sql_execute_formula session tx (sql_queryplan_compile_formula\
    \ tx (parse_tsql \"memcp-tests\" sql nil session tx))\n        (lambda (row) (output \"row\" row)) (lambda fields\
    \ true))))\n    (output \"row\"))))\n  (sleep 1.05)\n  (define cutoff (run \"SELECT CONVERT(VARCHAR(30),DATEADD(day,1,GETDATE()),121)\
    \ AS value\"))\n  (run \"INSERT tsql_compound_clock_default(id) VALUES (1)\")\n  (define inserted (run \"SELECT\
    \ CONVERT(VARCHAR(30),value,121) AS value FROM tsql_compound_clock_default WHERE id=1\"))\n  (if (>= (tsql_datediff\
    \ \"second\" (cutoff \"value\") (inserted \"value\")) 0) true\n    (error \"compound default froze its clock\
    \ during CREATE\")))\n"
  expect:
    result: true
  noncritical: true
- sql: DROP TABLE IF EXISTS tsql_compound_clock_default
  name: Fixture cleanup for Compound clock defaults evaluate through a generic calculator at insert time (1)
- name: Calendar scalars retain integer arithmetic
  sql: SELECT YEAR(N'2026-03-15')+1 AS yr,MONTH(N'2026-03-15')+1 AS mon,DAY(N'2026-03-15')+1 AS dy,DATEPART(year,N'2026-03-15')+1
    AS part,DATEDIFF(day,N'2026-03-15',N'2026-03-16')+1 AS diff
  expect:
    rows: 1
    data:
    - yr: 2027
      mon: 4
      dy: 16
      part: 2027
      diff: 2
  noncritical: true
- name: Clock default schema survives a graceful restart
  sql: SHUTDOWN
  syntax: mysql
- name: Restarted clock defaults still evaluate during insert
  sql: INSERT tsql_clock_defaults (id) VALUES (3)
  noncritical: true
- name: Restarted stored clock values have native temporal output
  sql: SELECT created,precise,standard FROM tsql_clock_defaults WHERE id=3
  expect:
    rows: 1
  noncritical: true
