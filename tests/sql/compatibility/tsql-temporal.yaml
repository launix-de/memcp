  name: 'Fixture setup 003: CREATE TABLE tsql_temporal_data (id INT PRIMARY KEY, d DATE, dt DATETIME)'
- sql: INSERT INTO tsql_temporal_data VALUES (1,N'2026-03-15',N'2026-03-15 12:13:14')
  name: 'Fixture setup 004: INSERT INTO tsql_temporal_data VALUES (1,N''2026-03-15'',N''2026-03-15 12:13:14'')'
- sql: DROP TABLE IF EXISTS tsql_fractional_data
  name: 'Fixture setup 005: DROP TABLE IF EXISTS tsql_fractional_data'
