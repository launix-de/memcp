- name: First weekday participates in native grouping cache domains
  setup:
  - sql: DROP TABLE IF EXISTS tsql_week_domain
  - sql: CREATE TABLE tsql_week_domain (id INT,d DATE)
  - sql: INSERT INTO tsql_week_domain VALUES(1,N'2026-03-15'),(2,N'2026-03-16')
  scm: |
    (begin
      (define sess (newsession))
      (define output (newsession))
      (define execute (lambda (text) (begin
        (map '(1 2 7) (lambda (day) (output (concat "day:" day) nil)))
        (with_autocommit sess nil nil text (lambda (tx)
          (tsql_execute_statement tx "memcp-tests" text sess
            (lambda (row) (output (concat "day:" (row "day")) row)) (lambda fields nil))))
        (list (output "day:1") (output "day:2") (output "day:7")))))
      (define query "SELECT DATEPART(weekday,d) AS day,COUNT(*) AS n FROM tsql_week_domain GROUP BY DATEPART(weekday,d) ORDER BY DATEPART(weekday,d)")
      (define sunday (execute query))
      (execute "SET DATEFIRST 1")
      (define monday (execute query))
      (execute "SET DATEFIRST 7")
      (define restored (execute query))
      (and (equal? sunday (list '("day" 1 "n" 1) '("day" 2 "n" 1) nil))
        (equal? monday (list '("day" 1 "n" 1) nil '("day" 7 "n" 1))) (equal? restored sunday)))
  expect: {result: true}
  cleanup:
  - sql: DROP TABLE tsql_week_domain

