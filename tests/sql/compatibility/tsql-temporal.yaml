- name: Datepart fractional nanoseconds
  sql: SELECT DATEPART(ns,N'2026-03-15 12:00:00.1234567') AS value
  expect:
    rows: 1
    data:
    - value: 123456700
  noncritical: true
- name: Invalid calendar date rejected
  sql: SELECT CAST(N'2026-02-30' AS DATETIME)
  expect:
    error: true
- name: Repeated date separators rejected
  sql: SELECT CAST(N'2026--03-15' AS DATETIME)
  expect:
    error: true
- name: Fractional legacy datetime quantized
  sql: SELECT CONVERT(VARCHAR(30),CAST(N'2026-03-15 12:13:14.001' AS DATETIME),121) AS value
  expect:
    rows: 1
    data:
    - value: '2026-03-15 12:13:14.000'
  noncritical: true
- name: Fractional datetime2 retained
  sql: SELECT CAST(CAST(N'2026-03-15 12:13:14.1234567' AS DATETIME2(7)) AS VARCHAR(40)) AS value
  expect:
    rows: 1
    data:
    - value: '2026-03-15 12:13:14.1234567'
  noncritical: true
- name: Fractional time retained
  sql: SELECT CAST(CAST(N'12:13:14.001' AS TIME(3)) AS VARCHAR(30)) AS value
  expect:
    rows: 1
    data:
