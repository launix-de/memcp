metadata:
  version: '1.0'
  description: T-SQL database catalog uses live native metadata and durable identifiers
  syntax: tsql
  requires_tds: true
  isolated: true
setup:
- sql: CREATE DATABASE catalog_alpha
- sql: CREATE DATABASE catalog_bravo
- sql: CREATE TABLE catalog_ids (name NVARCHAR(128), database_id INT)
- scm: (eval (parse_sql "memcp-tests" "DROP USER IF EXISTS catalog_reader" nil (newsession) nil))
- scm: (eval (parse_sql "memcp-tests" "CREATE USER catalog_reader IDENTIFIED BY 'pw'" nil (newsession) nil))
- scm: (eval (parse_sql "memcp-tests" "GRANT ALL ON `memcp-tests`.* TO catalog_reader" nil))
cleanup:
- sql: DROP DATABASE IF EXISTS catalog_alpha
- sql: DROP DATABASE IF EXISTS catalog_bravo
- sql: DROP DATABASE IF EXISTS catalog_charlie
- sql: DROP TABLE IF EXISTS catalog_ids
- scm: (eval (parse_sql "memcp-tests" "DROP USER IF EXISTS catalog_reader" nil (newsession) nil))
test_cases:
- name: Unrecorded database creators are unknown rather than the current administrator
  sql: SELECT name,sid,ISNULL(SUSER_SNAME(sid),N'~~UNKNOWN~~') AS dbowner FROM sysdatabases WHERE name=N'catalog_alpha'
  expect: {rows: 1, data: [{name: catalog_alpha, sid: null, dbowner: '~~UNKNOWN~~'}]}
- name: Modern and legacy views agree on the unknown native database owner
  sql: SELECT a.name,a.sid,b.owner_sid FROM sys.sysdatabases a JOIN sys.databases b ON a.name=b.name WHERE a.name=N'catalog_alpha'
  expect: {rows: 1, data: [{name: catalog_alpha, sid: null, owner_sid: null}]}
- name: Unknown database ownership does not change with the querying member
  username: catalog_reader
  password: pw
  sql: SELECT ISNULL(SUSER_SNAME(sid),N'~~UNKNOWN~~') AS dbowner FROM dbo.sysdatabases WHERE name=DB_NAME()
  expect: {rows: 1, data: [{dbowner: '~~UNKNOWN~~'}]}
- name: Unknown database SIDs retain binary declarations on the wire
  tds:
    statements:
    - sql: SELECT sid FROM sys.sysdatabases WHERE name=N'catalog_alpha'
      expect: {rows: 1, data: [{sid: null}], column_types: [{name: sid, type: VARBINARY, length: 85}]}
    - sql: SELECT owner_sid FROM sys.databases WHERE 1=0
      expect: {rows: 0, column_types: [{name: owner_sid, type: VARBINARY, length: 85}]}
- name: Legacy sys namespace database existence query uses the native catalog
  sql: SELECT COUNT(*) AS DBCount FROM sys.sysdatabases WHERE Name=N'catalog_alpha'
  expect: {rows: 1, data: [{DBCount: 1}]}
- name: Legacy dbo qualified fallback resolves the same database catalog
  sql: SELECT COUNT(*) AS DBCount FROM [memcp-tests].dbo.sysdatabases WHERE name=N'catalog_alpha'
  expect: {rows: 1, data: [{DBCount: 1}]}
- name: Unqualified compatibility catalog preserves missing database results
  sql: SELECT COUNT(*) AS DBCount FROM sysdatabases WHERE name=N'catalog_missing'
  expect: {rows: 1, data: [{DBCount: 0}]}
- name: Legacy and modern database views share each native identity
  sql: SELECT a.name FROM sys.sysdatabases a JOIN sys.databases b ON a.dbid=b.database_id AND a.name=b.name WHERE a.name LIKE N'catalog_%' ORDER BY a.name
  expect: {rows: 2, data: [{name: catalog_alpha}, {name: catalog_bravo}]}
- name: Legacy database catalog follows current caller visibility
  username: catalog_reader
  password: pw
  sql: SELECT COUNT(*) AS total FROM sys.sysdatabases WHERE name LIKE N'catalog_%'
  expect: {rows: 1, data: [{total: 0}]}
- name: Database existence and native administrator membership agree for the administrator
  sql: SELECT IS_SRVROLEMEMBER(N'sysadmin') AS is_admin,COUNT(*) AS database_count FROM sys.sysdatabases WHERE name=N'catalog_alpha'
  expect: {rows: 1, data: [{is_admin: 1, database_count: 1}]}
- name: Legacy database result metadata keeps sysname and smallint declarations
  tds:
    statements:
    - sql: SELECT name,dbid FROM sys.sysdatabases WHERE name=@database
      prepare: true
      parameters: [{name: database, value: catalog_alpha}]
      expect:
        rows: 1
        column_types: [{name: name, type: NVARCHAR, length: 128}, {name: dbid, type: SMALLINT}]
- name: Database-qualified catalog filters and orders native names
  sql: SELECT name FROM [memcp-tests].sys.databases WHERE name LIKE N'catalog_%' ORDER BY name
  expect: {rows: 2, data: [{name: catalog_alpha}, {name: catalog_bravo}]}
- name: Default catalog supports aliases and numeric identifiers
  sql: SELECT d.name FROM sys.databases AS d WHERE d.name LIKE N'catalog_%' AND d.database_id>0 ORDER BY d.name DESC
  expect: {rows: 2, data: [{name: catalog_bravo}, {name: catalog_alpha}]}
- name: Database identifiers are unique
  sql: SELECT COUNT(*) AS total, COUNT(DISTINCT database_id) AS distinct_ids FROM sys.databases WHERE name LIKE N'catalog_%'
  expect: {rows: 1, data: [{total: 2, distinct_ids: 2}]}
- name: Preserve the identifiers for later catalog queries
  sql: INSERT INTO catalog_ids (name,database_id) SELECT name,database_id FROM sys.databases WHERE name LIKE N'catalog_%'
- name: New databases appear in a previously used catalog shape
  sql: CREATE DATABASE catalog_charlie
- name: Catalog membership is evaluated at execution time
  sql: SELECT name FROM [memcp-tests].sys.databases WHERE name LIKE N'catalog_%' ORDER BY name
  expect: {rows: 3, data: [{name: catalog_alpha}, {name: catalog_bravo}, {name: catalog_charlie}]}
- name: Adding a database does not renumber existing identities
  sql: SELECT d.name FROM sys.databases d JOIN catalog_ids c ON c.name=d.name AND c.database_id=d.database_id ORDER BY d.name
  expect: {rows: 2, data: [{name: catalog_alpha}, {name: catalog_bravo}]}
- name: Persist the identity mapping and restart the server
  syntax: mysql
  sql: SHUTDOWN
  restart_timeout: 60
  expect: {rows: 0}
- name: Native database identifiers remain stable after restart
  sql: SELECT d.name FROM sys.databases d JOIN catalog_ids c ON c.name=d.name AND c.database_id=d.database_id ORDER BY d.name
  expect: {rows: 2, data: [{name: catalog_alpha}, {name: catalog_bravo}]}
- name: Catalog is a typed TDS result with a prepared path
  tds:
    statements:
    - sql: SELECT database_id,name FROM sys.databases WHERE name=N'catalog_alpha'
      expect:
        rows: 1
        column_types: [{name: database_id, type: INT}, {name: name, type: NVARCHAR, length: 128}]
    - sql: SELECT name FROM sys.databases WHERE name=@db
      prepare: true
      parameters: [{name: db, value: catalog_bravo}]
      expect: {rows: 1, data: [{name: catalog_bravo}]}
- name: Ungranted databases are not visible through a cached catalog
  username: catalog_reader
  password: pw
  sql: SELECT name FROM sys.databases WHERE name LIKE N'catalog_%' ORDER BY name
  expect: {rows: 0}
- name: Distinct catalog aggregates retain the caller visibility filter
  username: catalog_reader
  password: pw
  sql: SELECT COUNT(DISTINCT name) AS total FROM sys.databases WHERE name LIKE N'catalog_%'
  expect: {data: [{total: 0}]}
- name: Grant access to a native database
  scm: (eval (parse_sql "memcp-tests" "GRANT ALL ON catalog_alpha.* TO catalog_reader" nil (newsession) nil))
- name: A new grant is reflected by the cached catalog
  username: catalog_reader
  password: pw
  sql: SELECT name FROM sys.databases WHERE name LIKE N'catalog_%' ORDER BY name
  expect: {rows: 1, data: [{name: catalog_alpha}]}
- name: Cached DISTINCT aggregates observe newly granted catalog membership
  username: catalog_reader
  password: pw
  sql: SELECT COUNT(DISTINCT name) AS total FROM sys.databases WHERE name LIKE N'catalog_%'
  expect: {data: [{total: 1}]}
- name: Drop a database through the native lifecycle
  sql: DROP DATABASE catalog_bravo
- name: Dropped databases disappear from the cached query
  sql: SELECT name FROM [memcp-tests].sys.databases WHERE name LIKE N'catalog_%' ORDER BY name
  expect: {rows: 2, data: [{name: catalog_alpha}, {name: catalog_charlie}]}
- name: Unsupported system relations fail explicitly
  sql: SELECT * FROM sys.unsupported_catalog
  expect: {error: true}
- name: A missing qualifier cannot be substituted by the current database
  sql: SELECT * FROM catalog_missing.sys.databases
  expect: {error: true}

- name: DB_ID omitted name identifies the actual current database
  sql: SELECT CASE WHEN DB_ID()=DB_ID(DB_NAME()) AND DB_ID()>0 THEN 1 ELSE 0 END AS matches_current
  expect: {rows: 1,data: [{matches_current: 1}]}
- name: DB_ID and the database catalog share one durable identity owner
  sql: SELECT name FROM sys.databases WHERE name=N'catalog_alpha' AND database_id=DB_ID(name)
  expect: {rows: 1,data: [{name: catalog_alpha}]}
- name: An explicit NULL database name is not the omitted argument
  sql: SELECT DB_ID(CAST(NULL AS NVARCHAR(128))) AS database_id
  expect: {rows: 1,data: [{database_id: null}]}
- name: Empty and absent database names have no visible identity
  sql: SELECT DB_ID(N'') AS empty_id,DB_ID(N'catalog_missing') AS missing_id
  expect: {rows: 1,data: [{empty_id: null,missing_id: null}]}
- name: A dropped database cannot survive through its identity registry slot
  sql: SELECT DB_ID(N'catalog_bravo') AS database_id
  expect: {rows: 1,data: [{database_id: null}]}
- name: A runtime database parameter is resolved for each completed invocation
  sql: |-
    DECLARE @name NVARCHAR(128)=N'catalog_alpha',@first SMALLINT,@missing SMALLINT;
    SET @first=DB_ID(@name);
    SET @name=N'catalog_missing';
    SET @missing=DB_ID(@name);
    SELECT CASE WHEN @first>0 THEN 1 ELSE 0 END AS first_exists,@missing AS missing_id;
  expect: {rows: 1,data: [{first_exists: 1,missing_id: null}]}
- name: Database identifiers do not reveal an ungranted database
  username: catalog_reader
  password: pw
  sql: SELECT DB_ID(N'catalog_charlie') AS database_id
  expect: {rows: 1,data: [{database_id: null}]}
- name: A granted database has a visible compatibility identifier
  username: catalog_reader
  password: pw
  sql: SELECT CASE WHEN DB_ID(N'catalog_alpha')>0 THEN 1 ELSE 0 END AS visible
  expect: {rows: 1,data: [{visible: 1}]}
- name: Revoke database membership using its native authority owner
  scm: (eval (parse_sql "memcp-tests" "REVOKE ALL ON catalog_alpha.* FROM catalog_reader" nil (newsession) nil))
- name: The same compiled DB_ID expression observes a revoked grant
  username: catalog_reader
  password: pw
  sql: SELECT CASE WHEN DB_ID(N'catalog_alpha')>0 THEN 1 ELSE 0 END AS visible
  expect: {rows: 1,data: [{visible: 0}]}
- name: DB_ID has SQL Server SMALLINT metadata for nonempty and empty results
  tds:
    statements:
    - sql: SELECT DB_ID() AS database_id
      expect: {rows: 1,column_types: [{name: database_id,type: SMALLINT}]}
    - sql: SELECT DB_ID() AS database_id WHERE 1=0
      expect: {rows: 0,column_types: [{name: database_id,type: SMALLINT}]}
- name: DB_ID rejects an extra argument before execution
  sql: SELECT DB_ID(N'catalog_alpha',N'catalog_charlie')
  expect: {error: true,contains: DB_ID requires zero or one argument}
