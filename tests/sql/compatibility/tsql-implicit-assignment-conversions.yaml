# The empty native source proves declared-type rejection before any row or
# unsupported literal-to-DATETIMEOFFSET initialization is evaluated.
# SQL Server 2022: https://dbfiddle.uk/tEZ0L22s
- name: An empty declared DATETIMEOFFSET(3) source still cannot be assigned to TINYINT
  tds:
    statements:
    - sql: DECLARE @target TINYINT; SELECT @target=stamp FROM implicit_assignment_offset; SELECT @target AS value
      expect: {error: true,contains: [unsupported implicit conversion]}
- name: An empty declared DATETIMEOFFSET(3) source still cannot be assigned to SMALLINT
  tds:
    statements:
    - sql: DECLARE @target SMALLINT; SELECT @target=stamp FROM implicit_assignment_offset; SELECT @target AS value
      expect: {error: true,contains: [unsupported implicit conversion]}
- name: An empty declared DATETIMEOFFSET(3) source still cannot be assigned to INT
  tds:
    statements:
    - sql: DECLARE @target INT; SELECT @target=stamp FROM implicit_assignment_offset; SELECT @target AS value
      expect: {error: true,contains: [unsupported implicit conversion]}
- name: An empty declared DATETIMEOFFSET(3) source still cannot be assigned to INTEGER
  tds:
    statements:
    - sql: DECLARE @target INTEGER; SELECT @target=stamp FROM implicit_assignment_offset; SELECT @target AS value
      expect: {error: true,contains: [unsupported implicit conversion]}
- name: An empty declared DATETIMEOFFSET(3) source still cannot be assigned to BIGINT
  tds:
    statements:
    - sql: DECLARE @target BIGINT; SELECT @target=stamp FROM implicit_assignment_offset; SELECT @target AS value
      expect: {error: true,contains: [unsupported implicit conversion]}
- name: A declared modern temporal NULL still cannot become an INTEGER
  tds:
    statements:
    - sql: DECLARE @source DATE=NULL; DECLARE @target INTEGER=@source; SELECT @target AS value
      expect: {error: true,contains: [unsupported implicit conversion]}
- name: Modern temporal type clashes retain their structured SQL error contract
  scm: |
    (try (lambda () (begin
      (sql_expr_info '() (tsql_implicit_cast_expr
        (list 'sql_type_expr nil "DATE" nil) "INTEGER" '()))
      false))
      (lambda (cause) (match (failure_value cause)
        '("tsql-error" number _message state) (and (equal? number 206) (equal? state 2))
        _ (error cause))))
  expect: {result: true}
- name: National assignment uses UTF16 independently of native comparison labels
  setup:
  - scm: |
      (eval (parse_sql "memcp-tests"
        "CREATE TABLE implicit_national_rows(id INT PRIMARY KEY,nv NVARCHAR(4) COLLATE en_ci,nc NCHAR(4) COLLATE en_ci)"
        nil (newsession) nil))
  sql: INSERT implicit_national_rows VALUES(1,N'é🙂',N'é🙂')
  expect: {rows: 1,data: [{affected_rows: 1}]}
- name: National assignment preserves Unicode and fixed UTF16 padding
  sql: SELECT nv,nc FROM implicit_national_rows WHERE id=1
  expect: {rows: 1,data: [{nv: 'é🙂',nc: 'é🙂 '}]}
- name: National assignment still rejects UTF16 width overflow
  sql: UPDATE implicit_national_rows SET nv=N'🙂🙂🙂' WHERE id=1
  expect: {error: true,contains: ['8152']}
- name: Rejected national assignment preserves both original values
  sql: SELECT nv,nc FROM implicit_national_rows WHERE id=1
  expect: {rows: 1,data: [{nv: 'é🙂',nc: 'é🙂 '}]}
  cleanup:
  - sql: DROP TABLE implicit_national_rows
