metadata:
  syntax: tsql
  isolated: true
  description: Invocation names retain Unicode collisions lexical state and separate function arguments
setup:
- sql: CREATE TABLE invocation_name_inputs(id INT PRIMARY KEY,amount INT)
- sql: INSERT invocation_name_inputs VALUES(1,3),(2,NULL),(3,7)
- sql: |
    CREATE FUNCTION dbo.invocation_name_total(@id INT) RETURNS INT AS BEGIN
      DECLARE @total INT=0,@outer INT=1,@inner INT=1,@part INT;
      WHILE @outer<=2 BEGIN
        SET @inner=1;
        WHILE @inner<=2 BEGIN
          SELECT @part=amount FROM invocation_name_inputs AS [__fn_ſtate_0] WHERE id=@id;
          SET @total=@total+ISNULL(@part,0);
          SET @inner=@inner+1;
        END;
        SET @outer=@outer+1;
      END;
      RETURN @total;
    END
- sql: |
    CREATE FUNCTION dbo.invocation_name_rows(@id INT) RETURNS @output TABLE(value INT) AS BEGIN
      INSERT INTO @output SELECT amount FROM invocation_name_inputs WHERE id=@id;
      RETURN;
    END
test_cases:
- name: Unicode fold collisions preserve nested state and each outer caller row
  sql: |
    SELECT [__fn_ſtate_0].id,dbo.invocation_name_total([__fn_ſtate_0].id) AS value
    FROM invocation_name_inputs AS [__fn_ſtate_0] ORDER BY [__fn_ſtate_0].id
  expect: {rows: 3,data: [{id: 1,value: 12},{id: 2,value: 0},{id: 3,value: 28}]}
- name: Sibling invocations keep their nullable missing and populated arguments separate
  sql: SELECT dbo.invocation_name_total(1) AS first,dbo.invocation_name_total(2) AS nullable,dbo.invocation_name_total(9) AS missing,dbo.invocation_name_total(3) AS last
  expect: {rows: 1,data: [{first: 12,nullable: 0,missing: 0,last: 28}]}
- name: Table function state avoids a Unicode equivalent caller alias
  sql: SELECT [__table_function_ſtate].value FROM dbo.invocation_name_rows(1) AS [__table_function_ſtate]
  expect: {rows: 1,data: [{value: 3}]}
- name: Independent table function invocations preserve values and row multiplicity
  sql: |
    SELECT a.value AS first,b.value AS second
    FROM dbo.invocation_name_rows(1) AS a CROSS JOIN dbo.invocation_name_rows(3) AS b
  expect: {rows: 1,data: [{first: 3,second: 7}]}
cleanup:
- sql: DROP FUNCTION IF EXISTS dbo.invocation_name_rows
- sql: DROP FUNCTION IF EXISTS dbo.invocation_name_total
- sql: DROP TABLE IF EXISTS invocation_name_inputs
