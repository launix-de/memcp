metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: TSQL whitespace and numeric-to-keyword token boundaries
cleanup:
- sql: DROP PROCEDURE IF EXISTS dbo.lexical_space_probe
test_cases:
- name: Unicode whitespace U+0009 separates SQL tokens
  sql: "SELECT\t1\tAS\tvalue"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+000A separates SQL tokens
  sql: "SELECT\n1\nAS\nvalue"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+000B separates SQL tokens
  sql: "SELECT\u000b1\u000bAS\u000bvalue"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+000C separates SQL tokens
  sql: "SELECT\f1\fAS\fvalue"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+000D separates SQL tokens
  sql: "SELECT\r1\rAS\rvalue"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+0020 separates SQL tokens
  sql: "SELECT 1 AS value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+0085 separates SQL tokens
  sql: "SELECT\u00851\u0085AS\u0085value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+00A0 separates SQL tokens
  sql: "SELECT\u00a01\u00a0AS\u00a0value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+1680 separates SQL tokens
  sql: "SELECT\u16801\u1680AS\u1680value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2000 separates SQL tokens
  sql: "SELECT\u20001\u2000AS\u2000value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2001 separates SQL tokens
  sql: "SELECT\u20011\u2001AS\u2001value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2002 separates SQL tokens
  sql: "SELECT\u20021\u2002AS\u2002value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2003 separates SQL tokens
  sql: "SELECT\u20031\u2003AS\u2003value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2004 separates SQL tokens
  sql: "SELECT\u20041\u2004AS\u2004value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2005 separates SQL tokens
  sql: "SELECT\u20051\u2005AS\u2005value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2006 separates SQL tokens
  sql: "SELECT\u20061\u2006AS\u2006value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2007 separates SQL tokens
  sql: "SELECT\u20071\u2007AS\u2007value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2008 separates SQL tokens
  sql: "SELECT\u20081\u2008AS\u2008value"
  expect:
    rows: 1
