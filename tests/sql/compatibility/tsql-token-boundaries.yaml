    - value: 1
- name: Unicode whitespace U+2009 separates SQL tokens
  sql: "SELECT\u20091\u2009AS\u2009value"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+200A separates SQL tokens
  sql: "SELECT\u200a1\u200aAS\u200avalue"
  expect:
    rows: 1
    data:
    - value: 1
- name: Unicode whitespace U+2028 separates SQL tokens
  sql: "SELECT\u20281\u2028AS\u2028value"
  expect:
