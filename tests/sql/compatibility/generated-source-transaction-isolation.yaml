test_cases:
- name: Metadata probes then source removal and FK share the original commit
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: SELECT name FROM sys.objects WHERE type='P' AND name='generated_commit_probe'
      expect:
        rows: 1
        data:
        - name: generated_commit_probe
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM sys.objects WHERE type='U' AND name IN ('generated_commit_parent','generated_commit_child')
      expect:
        rows: 1
        data:
        - n: 2
    - connection: owner
      sql: DROP PROCEDURE generated_commit_probe
    - connection: owner
      sql: CREATE TABLE generated_commit_owned_parent(id INT NOT NULL PRIMARY KEY,code INT NOT NULL)
    - connection: owner
      sql: INSERT generated_commit_owned_parent(id,code) SELECT id,code FROM generated_commit_parent
    - connection: owner
      sql: SELECT id,code FROM generated_commit_owned_parent ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          code: 17
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.objects WHERE type='U' AND name='generated_commit_owned_parent'
      expect:
        rows: 1
        data:
        - n: 0
    - connection: owner
      sql: ALTER TABLE generated_commit_child ADD CONSTRAINT generated_commit_reference FOREIGN KEY(parent_id) REFERENCES generated_commit_owned_parent(id)
        ON UPDATE CASCADE
    - connection: owner
      sql: INSERT generated_commit_child VALUES(2,1)
    - connection: owner
      sql: UPDATE generated_commit_owned_parent SET id=2 WHERE id=1
    - connection: owner
      sql: SELECT p.id AS parent_id,p.code,c.id AS child_id,c.parent_id AS reference_id FROM generated_commit_owned_parent p JOIN generated_commit_child
        c ON p.id=c.parent_id ORDER BY c.id
      expect:
        rows: 2
        data:
        - parent_id: 2
          code: 17
          child_id: 1
          reference_id: 2
        - parent_id: 2
          code: 17
          child_id: 2
          reference_id: 2
    - connection: observer
      sql: SELECT p.id AS parent_id,p.code,c.id AS child_id,c.parent_id AS reference_id FROM generated_commit_parent p JOIN generated_commit_child c ON
        p.id=c.parent_id ORDER BY c.id
      expect:
        rows: 1
        data:
        - parent_id: 1
          code: 17
          child_id: 1
          reference_id: 1
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM sys.objects WHERE name='generated_commit_probe'
      expect:
        rows: 1
        data:
        - n: 0
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.objects WHERE name='generated_commit_probe'
      expect:
        rows: 1
        data:
        - n: 1
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.foreign_keys WHERE name='generated_commit_reference'
      expect:
        rows: 1
        data:
        - n: 0
    - connection: owner
      sql: SELECT id,code FROM generated_commit_owned_parent ORDER BY id
      expect:
        rows: 1
        data:
        - id: 2
          code: 17
    - connection: owner
      sql: SELECT id,code FROM generated_commit_parent ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          code: 17
    - connection: observer
      sql: SELECT id,code FROM generated_commit_parent ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          code: 17
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,code FROM generated_commit_parent ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          code: 17
    - connection: observer
      sql: SELECT id,code FROM generated_commit_owned_parent ORDER BY id
      expect:
        rows: 1
        data:
        - id: 2
          code: 17
    - connection: observer
      sql: SELECT p.id AS parent_id,p.code,c.id AS child_id,c.parent_id AS reference_id FROM generated_commit_owned_parent p JOIN generated_commit_child
        c ON p.id=c.parent_id ORDER BY c.id
      expect:
        rows: 2
        data:
        - parent_id: 2
          code: 17
          child_id: 1
          reference_id: 2
        - parent_id: 2
          code: 17
          child_id: 2
          reference_id: 2
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.objects WHERE name='generated_commit_probe'
      expect:
        rows: 1
        data:
        - n: 0
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.foreign_keys WHERE name='generated_commit_reference'
      expect:
        rows: 1
        data:
        - n: 1
