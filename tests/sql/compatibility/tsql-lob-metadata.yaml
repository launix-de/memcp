metadata:
  syntax: tsql
  requires_tds: true
  isolated: true
  description: Legacy LOB declarations advertise unbounded domain-correct PLP metadata and bulk-copy values
setup:
- sql: CREATE TABLE document_lob(id INT PRIMARY KEY, document_text TEXT, document_ntext NTEXT, document_blob IMAGE)
- sql: CREATE TABLE document_lob_widths(ansi VARCHAR(7), national NVARCHAR(9), raw VARBINARY(11))
- sql: CREATE TABLE document_lob_utf8(value TEXT COLLATE Latin1_General_100_CI_AS_SC_UTF8)
- sql: CREATE VIEW document_lob_view AS SELECT document_text,document_ntext,document_blob FROM document_lob
cleanup:
- sql: DROP VIEW IF EXISTS document_lob_view
- sql: DROP TABLE IF EXISTS document_lob
- sql: DROP TABLE IF EXISTS document_lob_widths
- sql: DROP TABLE IF EXISTS document_lob_utf8
test_cases:
- name: Native declarations retain TEXT NTEXT and IMAGE domains
  scm: "(begin\n (define cols (get_schema \"memcp-tests\" \"document_lob\" nil))\n (and (expression_equal? (map cols (lambda (c) (c \"RawType\"))) '(\"INT\" \"TEXT\" \"NTEXT\" \"IMAGE\"))\n  (expression_equal? (map (cdr cols) (lambda (c) (c \"Dimensions\"))) '(() () ()))))"
  expect:
    result: true
- name: Empty LOB projection describes unbounded ANSI national and binary fields
  scm: "(begin\n (define fields (tds_describe \"memcp-tests\" \"SELECT TOP(0) document_text,document_ntext,document_blob FROM document_lob\" \"\" (newsession)))\n (and (expression_equal? (map fields (lambda (f) (f \"sql_type\"))) '(\"TEXT\" \"NTEXT\" \"IMAGE\"))\n  (expression_equal? (map fields (lambda (f) (f \"kind\"))) '(167 231 165))\n  (expression_equal? (map fields (lambda (f) (f \"size\"))) '(65535 65535 65535))))"
  expect:
    result: true
- name: Actual FMTONLY metadata exposes MAX families before rows exist
  tds:
    statements:
    - sql: SET FMTONLY ON
    - sql: SELECT document_text,document_ntext,document_blob FROM document_lob
      expect:
        rows: 0
        column_types:
        - name: document_text
          type: VARCHAR
        - name: document_ntext
          type: NVARCHAR
        - name: document_blob
          type: VARBINARY
    - sql: SET FMTONLY OFF
- name: Derived and stored view LOB metadata retain MAX contracts
  scm: "(begin\n (define derived (tds_describe \"memcp-tests\" \"SELECT TOP(0) q.document_text,q.document_ntext,q.document_blob FROM (SELECT document_text,document_ntext,document_blob FROM document_lob) q\" \"\" (newsession)))\n (define view (tds_describe \"memcp-tests\" \"SELECT TOP(0) document_text,document_ntext,document_blob FROM document_lob_view\" \"\" (newsession)))\n (and (expression_equal? (map derived (lambda (f) (list (f \"kind\") (f \"size\")))) (list (list 167 65535) (list 231 65535) (list 165 65535)))\n  (expression_equal? (map view (lambda (f) (list (f \"kind\") (f \"size\")))) (list (list 167 65535) (list 231 65535) (list 165 65535)))))"
  expect:
    result: true
- name: Bounded declarations retain their original finite byte widths
  scm: (expression_equal? (map (tds_describe "memcp-tests" "SELECT TOP(0) ansi,national,raw FROM document_lob_widths" "" (newsession)) (lambda (f) (f "size"))) '(7 18 11))
  expect:
    result: true
- name: Legacy TEXT uses the same explicit UTF8 collation contract as VARCHAR
  scm: "(begin\n (define field (car (tds_describe \"memcp-tests\" \"SELECT TOP(0) value FROM document_lob_utf8\" \"\" (newsession))))\n (and (equal? (field \"kind\") 167) (equal? (field \"size\") 65535)\n  (equal? (field \"collation\") (hex2bin \"0904000400\"))))"
  expect:
    result: true
- name: Real bulk copy exceeds old text and binary bounded widths through PLP
  tds:
    statements:
    - bulk:
        table: '[memcp-tests].[dbo].[document_lob]'
        columns:
        - id
        - document_text
        - document_ntext
        - document_blob
        keep_nulls: true
        rows:
        - - 1
          - &id001 
          - &id002 Ω🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂🙂
          - &id003
            binary_hex: 
        - - 2
          - ''
          - ''
          - binary_hex: ''
        - - 3
          - null
          - null
          - null
        - - 4
          - binary_hex: 4772fcdf652080
          - Ω
          - binary_hex: 000180ff
      expect:
        rows: 4
    - sql: SELECT document_text,document_ntext,document_blob FROM document_lob WHERE id=1
      expect:
        rows: 1
        column_types:
        - name: document_text
          type: VARCHAR
        - name: document_ntext
          type: NVARCHAR
        - name: document_blob
          type: VARBINARY
        data:
        - document_text: *id001
          document_ntext: *id002
          document_blob: *id003
    - sql: SELECT id,DATALENGTH(document_text) AS a,DATALENGTH(document_ntext) AS n,DATALENGTH(document_blob) AS b FROM document_lob WHERE id=1
      expect:
        rows: 1
        data:
        - id: 1
          a: 8001
          n: 8006
          b: 8193
- name: LOB PLP keeps NULL distinct from empty text and binary
  tds:
    statements:
    - sql: SELECT id,document_text,document_ntext,document_blob FROM document_lob WHERE id IN (2,3) ORDER BY id
      expect:
        rows: 2
        data:
        - id: 2
          document_text: ''
          document_ntext: ''
          document_blob:
            binary_hex: ''
        - id: 3
          document_text: null
          document_ntext: null
          document_blob: null
    - sql: SELECT document_text,document_ntext,document_blob FROM document_lob WHERE id=4
      expect:
        rows: 1
        data:
        - document_text: Grüße €
          document_ntext: Ω
          document_blob:
            binary_hex: 000180ff
- name: Restart preserves native LOB declarations and imported payloads
  action: restart
- name: LOB payload lengths survive restart without bounded truncation
  sql: SELECT id,DATALENGTH(document_text) AS a,DATALENGTH(document_ntext) AS n,DATALENGTH(document_blob) AS b FROM document_lob WHERE id=1
  expect:
    rows: 1
    data:
    - id: 1
      a: 8001
      n: 8006
      b: 8193
- name: Restarted empty-output wire descriptors remain MAX
  scm: (expression_equal? (map (tds_describe "memcp-tests" "SELECT TOP(0) document_text,document_ntext,document_blob FROM document_lob" "" (newsession)) (lambda (f) (list (f "kind") (f "size")))) (list (list 167 65535) (list 231 65535) (list 165 65535)))
  expect:
    result: true
