metadata:
  version: '1.0'
  syntax: tsql
  isolated: true
  requires_tds: true
  description: SQL Server key and reference views retain selected catalog dbo native grants and actual renamed declarations
setup:
- sql: DROP TABLE IF EXISTS key_catalog_child
- sql: DROP TABLE IF EXISTS key_catalog_parent
- sql: DROP DATABASE IF EXISTS key_catalog_other
- sql: DROP DATABASE IF EXISTS key_catalog_hidden
- sql: CREATE DATABASE key_catalog_other
- sql: CREATE DATABASE key_catalog_hidden
- sql: CREATE TABLE key_catalog_parent([Left] INT NOT NULL,[Right] INT NOT NULL,code INT NOT NULL,CONSTRAINT PK_key_catalog_parent PRIMARY KEY([Left],[Right]),CONSTRAINT
    UQ_key_catalog_code UNIQUE(code))
- sql: CREATE TABLE key_catalog_child(id INT NOT NULL,a INT,b INT,ref_code INT,CONSTRAINT PK_key_catalog_child PRIMARY KEY(id),CONSTRAINT FK_key_catalog_pair FOREIGN
    KEY(a,b) REFERENCES key_catalog_parent([Left],[Right]) ON UPDATE CASCADE ON DELETE SET NULL,CONSTRAINT FK_key_catalog_code FOREIGN KEY(ref_code) REFERENCES key_catalog_parent(code))
- sql: INSERT key_catalog_parent VALUES(7,8,17)
- sql: INSERT key_catalog_child VALUES(1,7,8,17)
- sql: CREATE TABLE key_catalog_other.dbo.key_catalog_parent([Left] INT NOT NULL,[Right] INT NOT NULL,code INT NOT NULL,CONSTRAINT PK_key_catalog_parent PRIMARY KEY([Left],[Right]),CONSTRAINT
    UQ_key_catalog_code UNIQUE(code))
- sql: CREATE TABLE key_catalog_other.dbo.key_catalog_child(id INT NOT NULL,a INT,b INT,ref_code INT,CONSTRAINT PK_key_catalog_child PRIMARY KEY(id),CONSTRAINT FK_key_catalog_pair
    FOREIGN KEY(a,b) REFERENCES key_catalog_other.dbo.key_catalog_parent([Left],[Right]) ON UPDATE CASCADE ON DELETE SET NULL,CONSTRAINT FK_key_catalog_code FOREIGN
    KEY(ref_code) REFERENCES key_catalog_other.dbo.key_catalog_parent(code))
- sql: INSERT key_catalog_other.dbo.key_catalog_parent VALUES(71,81,171)
- sql: INSERT key_catalog_other.dbo.key_catalog_child VALUES(11,71,81,171)
- sql: CREATE TABLE key_catalog_hidden.dbo.key_catalog_parent([Left] INT NOT NULL,[Right] INT NOT NULL,code INT NOT NULL,CONSTRAINT PK_key_catalog_parent PRIMARY
    KEY([Left],[Right]),CONSTRAINT UQ_key_catalog_code UNIQUE(code))
- sql: CREATE TABLE key_catalog_hidden.dbo.key_catalog_child(id INT NOT NULL,a INT,b INT,ref_code INT,CONSTRAINT PK_key_catalog_child PRIMARY KEY(id),CONSTRAINT FK_key_catalog_pair
    FOREIGN KEY(a,b) REFERENCES key_catalog_hidden.dbo.key_catalog_parent([Left],[Right]) ON UPDATE CASCADE ON DELETE SET NULL,CONSTRAINT FK_key_catalog_code FOREIGN
    KEY(ref_code) REFERENCES key_catalog_hidden.dbo.key_catalog_parent(code))
- sql: INSERT key_catalog_hidden.dbo.key_catalog_parent VALUES(71,81,171)
- sql: INSERT key_catalog_hidden.dbo.key_catalog_child VALUES(11,71,81,171)
- scm: (eval (parse_sql "memcp-tests" "DROP USER IF EXISTS key_catalog_reader" nil (newsession) nil))
- scm: (eval (parse_sql "memcp-tests" "CREATE USER key_catalog_reader IDENTIFIED BY 'pw'" nil (newsession) nil))
- scm: (eval (parse_sql "memcp-tests" "GRANT ALL ON `memcp-tests`.* TO key_catalog_reader" nil))
cleanup:
- sql: DROP TABLE IF EXISTS key_catalog_child
- sql: DROP TABLE IF EXISTS key_catalog_parent
- sql: DROP DATABASE IF EXISTS key_catalog_other
- sql: DROP DATABASE IF EXISTS key_catalog_hidden
- scm: (eval (parse_sql "memcp-tests" "DROP USER IF EXISTS key_catalog_reader" nil (newsession) nil))
test_cases:
- name: Key columns expose the selected catalog and dbo for composite PK unique and FK rows
  sql: SELECT constraint_catalog,constraint_schema,constraint_name,table_catalog,table_schema,table_name,column_name,ordinal_position FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE
    WHERE constraint_name IN(N'FK_key_catalog_pair',N'FK_key_catalog_code',N'PK_key_catalog_parent',N'PK_key_catalog_child',N'UQ_key_catalog_code') ORDER BY constraint_name,ordinal_position
  expect:
    rows: 7
    data:
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: FK_key_catalog_code
      table_catalog: memcp-tests
      table_schema: dbo
      table_name: key_catalog_child
      column_name: ref_code
      ordinal_position: 1
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: FK_key_catalog_pair
      table_catalog: memcp-tests
      table_schema: dbo
      table_name: key_catalog_child
      column_name: a
      ordinal_position: 1
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: FK_key_catalog_pair
      table_catalog: memcp-tests
      table_schema: dbo
      table_name: key_catalog_child
      column_name: b
      ordinal_position: 2
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: PK_key_catalog_child
      table_catalog: memcp-tests
      table_schema: dbo
      table_name: key_catalog_child
      column_name: id
      ordinal_position: 1
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: PK_key_catalog_parent
      table_catalog: memcp-tests
      table_schema: dbo
      table_name: key_catalog_parent
      column_name: Left
      ordinal_position: 1
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: PK_key_catalog_parent
      table_catalog: memcp-tests
      table_schema: dbo
      table_name: key_catalog_parent
      column_name: Right
      ordinal_position: 2
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: UQ_key_catalog_code
      table_catalog: memcp-tests
      table_schema: dbo
      table_name: key_catalog_parent
      column_name: code
      ordinal_position: 1
- name: Referential constraints use SQL Server names matching and action values
  sql: SELECT constraint_catalog,constraint_schema,constraint_name,unique_constraint_catalog,unique_constraint_schema,unique_constraint_name,match_option,update_rule,delete_rule
    FROM INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS WHERE constraint_name IN(N'FK_key_catalog_pair',N'FK_key_catalog_code',N'PK_key_catalog_parent',N'PK_key_catalog_child',N'UQ_key_catalog_code')
    ORDER BY constraint_name
  expect:
    rows: 2
    data:
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: FK_key_catalog_code
      unique_constraint_catalog: memcp-tests
      unique_constraint_schema: dbo
      unique_constraint_name: UQ_key_catalog_code
      match_option: SIMPLE
      update_rule: NO ACTION
      delete_rule: NO ACTION
    - constraint_catalog: memcp-tests
      constraint_schema: dbo
      constraint_name: FK_key_catalog_pair
      unique_constraint_catalog: memcp-tests
      unique_constraint_schema: dbo
      unique_constraint_name: PK_key_catalog_parent
      match_option: SIMPLE
      update_rule: CASCADE
      delete_rule: SET NULL
