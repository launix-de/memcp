  username: key_catalog_reader
  password: pw
  sql: SELECT constraint_catalog,constraint_schema,constraint_name,table_catalog,table_schema,table_name,column_name,ordinal_position FROM key_catalog_hidden.INFORMATION_SCHEMA.KEY_COLUMN_USAGE
    WHERE constraint_name IN(N'FK_key_catalog_pair',N'FK_key_catalog_code',N'PK_key_catalog_parent',N'PK_key_catalog_child',N'UQ_key_catalog_code') ORDER BY constraint_name,ordinal_position
  expect:
