    contains: ["access denied: database key_catalog_hidden"]
- name: Original transaction column aliases project actual key facts without changing observer or rollback rows
  tds:
    statements:
    - connection: owner
      sql: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: EXEC sp_rename N'dbo.key_catalog_parent.Left',N'left_key',N'COLUMN'
    - connection: owner
      sql: EXEC sp_rename N'dbo.key_catalog_child.a',N'parent_left',N'COLUMN'
    - connection: owner
      sql: SELECT constraint_catalog,constraint_schema,constraint_name,table_catalog,table_schema,table_name,column_name,ordinal_position FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE
        WHERE constraint_name IN(N'FK_key_catalog_pair',N'FK_key_catalog_code',N'PK_key_catalog_parent',N'PK_key_catalog_child',N'UQ_key_catalog_code') ORDER BY constraint_name,ordinal_position
