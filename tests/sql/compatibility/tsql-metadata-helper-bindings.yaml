metadata:
  syntax: tsql
  isolated: true
  description: Metadata runtime source helpers retain explicit callable values and permission gates through both
    procedure codecs
# Restore under hostile lexical helpers so receiver globals cannot hide a missing capture.
# scheme adds source locations; rebuilding only list nodes matches the ordinary
# annotation-free AST shape used by the wire decoder. This exercises source/value
# behavior, not strict-wire admission or an actual delegated worker.
setup:
- sql: CREATE TABLE metadata_capture_anchor(id INT CONSTRAINT metadata_capture_pk PRIMARY KEY,label NVARCHAR(8)
    CONSTRAINT metadata_capture_default DEFAULT(N'row'))
- sql: CREATE TABLE metadata_capture_parent(id INT PRIMARY KEY)
- sql: ALTER TABLE metadata_capture_anchor ADD CONSTRAINT metadata_capture_fk FOREIGN KEY(id) REFERENCES metadata_capture_parent(id)
- sql: ALTER TABLE metadata_capture_anchor ADD CONSTRAINT metadata_capture_check CHECK(id>0)
- sql: CREATE TRIGGER metadata_capture_trigger ON metadata_capture_anchor AFTER INSERT AS BEGIN PRINT N'unreached'; END
- sql: CREATE PROCEDURE metadata_capture_proc AS SELECT 1/0 AS hidden_value
- scm: |-
    (begin
      (define restore_metadata_rows (lambda (codec producer)
        (begin
          (define names (list 'info_schema_selected_databases 'info_schema_name_matches 'literal_false? 'info_schema_selected_tables
            'information_schema_rows 'info_schema_table_rows 'info_schema_columns_for_table 'info_schema_column_default
            'info_schema_column_character_length 'info_schema_column_collation 'info_schema_table_row 'info_schema_trigger_rows
            'info_schema_constraint_rows 'info_schema_referential_constraints_for_table 'info_schema_key_column_usage_rows 'info_schema_key_column_usage_for_table 'info_schema_fk_unique_name
            'info_schema_unique_column_rows 'info_schema_fk_column_rows 'sql_key_constraint_name 'sql_metadata_identity
            'sql_stored_view_catalog_rows 'tsql_catalog_rows_for_database 'tsql_catalog_object_tuples 'tsql_catalog_column_tuples
            'tsql_catalog_default_tuples 'tsql_catalog_trigger_tuples 'tsql_catalog_key_tuples 'tsql_catalog_lookup_object_tuples
            'tsql_catalog_metadata_rows 'tsql_catalog_public_native_row? 'tsql_catalog_object_name_matches? 'tsql_catalog_kind_selected?
            'tsql_catalog_default_tuple 'tsql_catalog_default_definition 'tsql_catalog_default_comment 'tsql_catalog_default_field
            'tsql_metadata_visible? 'internal_column_name? 'empty_list? 'NULL))
          (define source_lists (lambda (node)
            (match node '() '() (cons head tail) (cons (source_lists head) (source_lists tail)) _ node)))
          (define code (list 'lambda names (close_procedure producer)))
          (define decoded (if (equal? codec "json") (json_decode_scmer (json_encode code))
            (apply (eval (optimize (list 'lambda '() (source_lists (scheme (serialize code)))))) '())))
          (apply decoded (map names (lambda (_name) (lambda args (error (concat "unbound metadata helper: " _name)))))))))
      (globalvars "__restore_metadata_rows" (close_procedure restore_metadata_rows))
      true)
cleanup:
- scm: (globalvars "__restore_metadata_rows" nil)
- sql: DROP TRIGGER metadata_capture_trigger
- sql: DROP PROCEDURE metadata_capture_proc
- sql: DROP TABLE metadata_capture_anchor
- sql: DROP TABLE metadata_capture_parent
test_cases:
- name: json metadata producer retains nil database and actual declaration values
  scm: |-
    (begin
      (define restored ((globalvars "__restore_metadata_rows") "json" tsql_catalog_runtime_rows))
      (define rows (restored nil "objects" (tsql_session_actor session) nil (list "schema" (list "exact" "memcp-tests") "table" (list "exact" "metadata_capture_anchor") "object" (list "exact" "metadata_capture_anchor") "kinds" (list "U"))))
      (map rows (lambda (row) (list (car row) (nth row 1) (> (nth row 3) 0)))))
  expect:
    result:
    - - metadata_capture_anchor
      - U
      - true
- name: json metadata producer retains database selection and actual declaration values
