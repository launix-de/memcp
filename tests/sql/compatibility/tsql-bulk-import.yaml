- name: Ordinary bulk client preserves numeric values through wider result metadata
  setup:
  - sql: CREATE TABLE bulk_numeric_client(id INT PRIMARY KEY,amount NUMERIC(18,0))
  cleanup:
  - sql: DROP TABLE bulk_numeric_client
  tds:
    statements:
    - bulk:
        table: '[memcp-tests].[dbo].[bulk_numeric_client]'
        columns:
        - id
        - amount
        keep_nulls: true
        rows:
        - - 1
          - 42
        - - 2
          - -123456789012345678
        - - 3
          - null
      expect:
        rows: 3
    - sql: SELECT id,CONVERT(VARCHAR(30),amount) AS amount,COL_LENGTH(N'dbo.bulk_numeric_client',N'amount') AS declared
        FROM bulk_numeric_client ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          amount: '42'
          declared: 9
        - id: 2
