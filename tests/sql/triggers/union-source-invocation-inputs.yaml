metadata:
  isolated: true
  description: Native AFTER row parameters bind at each scoped UNION statement invocation
setup:
- sql: CREATE TABLE union_input_event(id INT PRIMARY KEY,first_id INT,second_id INT)
- sql: CREATE TABLE union_input_source(id INT PRIMARY KEY,amount INT)
- sql: INSERT INTO union_input_source VALUES(1,100),(2,200),(3,300),(4,400)
- sql: CREATE TABLE union_input_target(id INT PRIMARY KEY,amount INT)
- sql: INSERT INTO union_input_target VALUES(1,0),(2,0),(3,0),(4,0)
- sql: CREATE TABLE union_input_audit(event_id INT,step INT,target_id INT,amount INT,PRIMARY
    KEY(event_id,step,target_id))
- sql: "CREATE TRIGGER union_input_insert AFTER INSERT ON union_input_event FOR EACH\
    \ ROW BEGIN\nUPDATE union_input_target t JOIN union_input_source a ON t.id=a.id\
    \ JOIN\n (SELECT id FROM union_input_source WHERE id=NEW.first_id UNION SELECT\
    \ id FROM union_input_source WHERE id=NEW.first_id) p ON a.id=p.id\n SET t.amount=a.amount+NEW.id;\n\
    INSERT INTO union_input_audit(event_id,step,target_id,amount) SELECT NEW.id,1,id,amount\
    \ FROM union_input_target WHERE id=NEW.first_id;\nUPDATE union_input_target t\
    \ JOIN union_input_source a ON t.id=a.id JOIN\n (SELECT id FROM union_input_source\
    \ WHERE id=NEW.second_id UNION SELECT id FROM union_input_source WHERE id=NEW.second_id)\
    \ p ON a.id=p.id\n SET t.amount=a.amount+NEW.id;\nINSERT INTO union_input_audit(event_id,step,target_id,amount)\
    \ SELECT NEW.id,2,id,amount FROM union_input_target WHERE id=NEW.second_id;\n\
    END"
- sql: "CREATE TRIGGER union_input_update AFTER UPDATE ON union_input_event FOR EACH\
    \ ROW BEGIN\nUPDATE union_input_target t JOIN union_input_source a ON t.id=a.id\
    \ JOIN\n (SELECT id FROM union_input_source WHERE id=OLD.first_id UNION SELECT\
    \ id FROM union_input_source WHERE id=OLD.second_id) p ON a.id=p.id\n SET t.amount=t.amount+NEW.id;\n\
    END"
- sql: "CREATE TRIGGER union_input_delete AFTER DELETE ON union_input_event FOR EACH\
    \ ROW BEGIN\nUPDATE union_input_target t JOIN union_input_source a ON t.id=a.id\
    \ JOIN\n (SELECT id FROM union_input_source WHERE id=OLD.first_id UNION SELECT\
    \ id FROM union_input_source WHERE id=OLD.second_id) p ON a.id=p.id\n SET t.amount=t.amount+OLD.id;\n\
    END"
- sql: CREATE TABLE union_input_before(id INT PRIMARY KEY,chosen INT)
- sql: CREATE TABLE union_input_before_target(id INT PRIMARY KEY,amount INT)
- sql: INSERT INTO union_input_before_target VALUES(1,0),(2,0),(3,0)
- sql: 'CREATE TRIGGER union_input_before_read BEFORE INSERT ON union_input_before
    FOR EACH ROW BEGIN

    SET NEW.chosen=NEW.chosen+1;

    UPDATE union_input_before_target t JOIN union_input_source a ON t.id=a.id JOIN
    (SELECT id FROM union_input_source WHERE id=NEW.chosen UNION SELECT id FROM union_input_source
    WHERE id=NEW.chosen) p ON a.id=p.id SET t.amount=t.amount+10;

    SET NEW.chosen=NEW.chosen+1;

    UPDATE union_input_before_target t JOIN union_input_source a ON t.id=a.id JOIN
    (SELECT id FROM union_input_source WHERE id=NEW.chosen UNION SELECT id FROM union_input_source
    WHERE id=NEW.chosen) p ON a.id=p.id SET t.amount=t.amount+10;

    END'
test_cases:
- name: Consecutive native AFTER rows bind different scalar values
  sql: INSERT INTO union_input_event VALUES(11,1,2),(22,3,4)
  expect:
    affected_rows: 2
- name: Each statement retains its own complete row projection
  sql: SELECT id,amount FROM union_input_target ORDER BY id
  expect:
    data:
    - id: 1
      amount: 111
    - id: 2
      amount: 211
    - id: 3
      amount: 322
    - id: 4
      amount: 422
- name: Consecutive trigger statements publish one exact effect per target
  sql: SELECT event_id,step,target_id,amount FROM union_input_audit ORDER BY event_id,step,target_id
  expect:
    data:
    - event_id: 11
      step: 1
      target_id: 1
      amount: 111
    - event_id: 11
      step: 2
      target_id: 2
      amount: 211
    - event_id: 22
      step: 1
      target_id: 3
      amount: 322
    - event_id: 22
      step: 2
      target_id: 4
      amount: 422
- name: AFTER UPDATE binds OLD membership independently of NEW payload
  sql: UPDATE union_input_event SET first_id=3,second_id=4 WHERE id=11
  expect:
    affected_rows: 1
- name: OLD membership survives the changed event row
  sql: SELECT id,amount FROM union_input_target ORDER BY id
  expect:
    data:
    - id: 1
      amount: 122
    - id: 2
      amount: 222
    - id: 3
      amount: 322
    - id: 4
      amount: 422
- name: AFTER DELETE binds the native OLD image
  sql: DELETE FROM union_input_event WHERE id=22
  expect:
    affected_rows: 1
- name: Deleted event values still determine exactly two updates
  sql: SELECT id,amount FROM union_input_target ORDER BY id
  expect:
    data:
    - id: 1
      amount: 122
    - id: 2
      amount: 222
    - id: 3
      amount: 344
    - id: 4
      amount: 444
- name: Rollback retains the outer transaction and its trigger resource owner
  syntax: tsql
  session_id: union_input_rollback
  cleanup:
  - sql: IF @@TRANCOUNT>0 ROLLBACK TRANSACTION
  sql: 'BEGIN TRANSACTION;

    INSERT INTO union_input_event VALUES(33,1,4);

    SELECT id,amount FROM union_input_target ORDER BY id;

    SELECT COUNT(*) AS private_audit FROM union_input_audit;

    ROLLBACK TRANSACTION;

    SELECT id AS restored_id,amount AS restored_amount FROM union_input_target ORDER
    BY id;

    SELECT COUNT(*) AS restored_audit FROM union_input_audit;

    SELECT COUNT(*) AS restored_event FROM union_input_event WHERE id=33;'
  expect:
    data:
    - id: 1
      amount: 133
    - id: 2
      amount: 222
    - id: 3
      amount: 344
    - id: 4
      amount: 433
    - private_audit: 6
    - restored_id: 1
      restored_amount: 122
    - restored_id: 2
      restored_amount: 222
    - restored_id: 3
      restored_amount: 344
    - restored_id: 4
      restored_amount: 444
    - restored_audit: 4
    - restored_event: 0
- name: Reserve a genuine constraint conflict in the second trigger statement
  sql: INSERT INTO union_input_audit VALUES(99,2,4,7)
  expect:
    affected_rows: 1
- name: The second statement constraint error restores all earlier trigger effects
  sql: INSERT INTO union_input_event VALUES(99,1,4)
  expect:
    error: true
    contains: Duplicate entry
- name: A rejected trigger leaves every prior target value intact
  sql: SELECT id,amount FROM union_input_target ORDER BY id
  expect:
    data:
    - id: 1
      amount: 122
    - id: 2
      amount: 222
    - id: 3
      amount: 344
    - id: 4
      amount: 444
- name: Rejected source and first trigger insert do not escape Undo
  sql: SELECT COUNT(*) AS n FROM union_input_audit WHERE event_id=99 AND step=1
  expect:
    data:
    - n: 0
- name: The deliberate conflict is the only remaining row for that event
  sql: SELECT event_id,step,target_id,amount FROM union_input_audit WHERE event_id=99
  expect:
    data:
    - event_id: 99
      step: 2
      target_id: 4
      amount: 7
- name: The failed outer insert is rolled back too
  sql: SELECT COUNT(*) AS n FROM union_input_event WHERE id=99
  expect:
    data:
    - n: 0
- name: Remove only the deliberate conflict
  sql: DELETE FROM union_input_audit WHERE event_id=99
  expect:
    affected_rows: 1
- name: A following invocation reuses the same SQL without stale scope state
  sql: INSERT INTO union_input_event VALUES(99,1,4)
  expect:
    affected_rows: 1
- name: Successful retry uses the new invocation values
  sql: SELECT id,amount FROM union_input_target ORDER BY id
  expect:
    data:
    - id: 1
      amount: 199
    - id: 2
      amount: 222
    - id: 3
      amount: 344
    - id: 4
      amount: 499
- name: The retry publishes exactly two coherent audit tuples
  sql: SELECT event_id,step,target_id,amount FROM union_input_audit WHERE event_id=99
    ORDER BY step
  expect:
    data:
    - event_id: 99
      step: 1
      target_id: 1
      amount: 199
    - event_id: 99
      step: 2
      target_id: 4
      amount: 499
- name: Empty target setup removes all callback rows
  sql: DELETE FROM union_input_target
  expect:
    affected_rows: 4
- name: An empty target keeps the AFTER input invocation valid
  sql: INSERT INTO union_input_event VALUES(55,1,2)
  expect:
    affected_rows: 1
- name: Empty target statements introduce no target or audit effects
  sql: SELECT COUNT(*) AS n FROM union_input_audit WHERE event_id=55
  expect:
    data:
    - n: 0
- name: BEFORE statements read the current changed row independently
  noncritical: true
  sql: INSERT INTO union_input_before VALUES(1,1)
  expect:
    affected_rows: 1
- name: BEFORE current row changes reach only their matching targets
  noncritical: true
  sql: SELECT id,amount FROM union_input_before_target ORDER BY id
  expect:
    data:
    - id: 1
      amount: 0
    - id: 2
      amount: 10
    - id: 3
      amount: 10
cleanup:
- sql: DROP TRIGGER IF EXISTS union_input_before_read
- sql: DROP TRIGGER IF EXISTS union_input_delete
- sql: DROP TRIGGER IF EXISTS union_input_update
- sql: DROP TRIGGER IF EXISTS union_input_insert
- sql: DROP TABLE union_input_before
- sql: DROP TABLE union_input_before_target
- sql: DROP TABLE union_input_audit
- sql: DROP TABLE union_input_target
- sql: DROP TABLE union_input_source
- sql: DROP TABLE union_input_event
