# MySQL auth callback must stay readonly and work with tx=nil

metadata:
  version: "1.0"
  description: "mysql_auth and direct system.user lookup work without __memcp_tx"

setup:
  - sql: "DELETE FROM system.user WHERE username IN ('auth_scan_nil_repro', 'auth_scan_nil_other')"
  - sql: "INSERT INTO system.user (username, password, admin) VALUES ('auth_scan_nil_repro', PASSWORD('secret123'), FALSE)"

test_cases:
  - name: "Direct scan nil resolves password from system.user"
    scm: |
      (if
        (equal?
          (scan nil (table "system" "user")
            '("username")
            (lambda (username) (equal? username "auth_scan_nil_repro"))
      '("password")
      (lambda (acc password) password)
      nil
      (lambda (a b) b))
          (password "secret123"))
        "ok"
        (error "scan nil over system.user returned wrong password"))

  - name: "mysql_auth returns stored password hash"
    scm: |
      (if
        (equal? (mysql_auth "auth_scan_nil_repro") (password "secret123"))
        "ok"
        (error "mysql_auth returned wrong password"))

  - name: "Direct scan_lookup resolves password with nil transaction"
    scm: |
      (if
        (equal?
          (scan_lookup nil (table "system" "user")
            '("username") '("auth_scan_nil_repro") "password")
          (password "secret123"))
        "ok"
        (error "scan_lookup nil over system.user returned wrong password"))

  - name: "mysql_auth returns nil for missing user"
    scm: |
      (if
        (nil? (mysql_auth "auth_scan_nil_other"))
        "ok"
        (error "mysql_auth should return nil for missing user"))

  - name: "Authenticated constant query hot path"
    sql: "SELECT 1 AS value"
    warmup: 10
    timing_samples: 100
    threshold_ms: 2
    expect:
      rows: 1
      data:
        - value: 1

  - name: "Dashboard user authentication rejects missing credentials without evaluating an empty row"
    scm: |
      (if
        (nil? (dashboard_check_user (lambda (key) "")))
        "ok"
        (error "missing dashboard credentials should be rejected"))

  - name: "Dashboard admin authentication rejects missing credentials without evaluating an empty row"
    scm: |
      (if
        (not (dashboard_check_admin (lambda (key) "")))
        "ok"
        (error "missing dashboard admin credentials should be rejected"))

  - name: "Dashboard authentication treats an empty scan list as no user"
    scm: |
      (if
        (and
          (not (dashboard_auth_row_present? nil))
          (not (dashboard_auth_row_present? '())))
        "ok"
        (error "an empty authentication scan result must be rejected"))

cleanup:
  - sql: "DELETE FROM system.user WHERE username IN ('auth_scan_nil_repro', 'auth_scan_nil_other')"
