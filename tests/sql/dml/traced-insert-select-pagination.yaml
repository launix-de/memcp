metadata:
  version: "1.0"
  description: "Trace-derived INSERT SELECT ordering and pagination contracts"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS trace_limit_output"
  - sql: "DROP TABLE IF EXISTS trace_limit_value"
  - sql: "DROP TABLE IF EXISTS trace_limit_file"
  - sql: "DROP TABLE IF EXISTS trace_limit_parent"
  - sql: "DROP TABLE IF EXISTS trace_limit_label"
  - sql: |
      CREATE TABLE trace_limit_parent (
        id INT PRIMARY KEY,
        label_id INT,
        value_id INT
      )
  - sql: |
      CREATE TABLE trace_limit_label (
        id INT PRIMARY KEY,
        label VARCHAR(64)
      )
  - sql: |
      CREATE TABLE trace_limit_output (
        id INT PRIMARY KEY,
        label VARCHAR(64)
      )
  - sql: |
      CREATE TABLE trace_limit_value (
        id INT PRIMARY KEY,
        rank_value INT
      )
  - sql: |
      CREATE TABLE trace_limit_file (
        id INT PRIMARY KEY,
        uploaded_at INT
      )
  - sql: "INSERT INTO trace_limit_parent (id, label_id, value_id) VALUES (1, 10, 100), (2, 20, 200)"
  - sql: "INSERT INTO trace_limit_label (id, label) VALUES (10, 'zeta'), (20, 'alpha')"
  - sql: "INSERT INTO trace_limit_value (id, rank_value) VALUES (100, 1), (200, 2)"
  - sql: "INSERT INTO trace_limit_file (id, uploaded_at) VALUES (100, 500), (200, 900)"

test_cases:
  - name: "INSERT SELECT preserves a multi-source derived ORDER LIMIT relation"
    max_time: 1.0
    max_plan_size: 20000
    sql: |
      INSERT INTO trace_limit_output (id, label)
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY label.label DESC
        LIMIT 1
      ) candidate
      WHERE NOT EXISTS (
        SELECT TRUE
        FROM trace_limit_output present
        WHERE present.id = candidate.id
      )
    expect:
      affected_rows: 1
  - name: "INSERT SELECT derived ORDER LIMIT stores the selected joined row"
    sql: "SELECT id, label FROM trace_limit_output"
    expect:
      rows: 1
      data:
        - id: 1
          label: "zeta"
  - name: "INSERT SELECT streams a scalar ordered derived relation"
    max_time: 1.0
    max_plan_size: 30000
    sql: |
      INSERT INTO trace_limit_output (id, label)
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY (
          SELECT ranked.rank_value
          FROM trace_limit_value ranked
          WHERE ranked.id = parent.value_id
          LIMIT 1
        ) DESC, label.label ASC, parent.id ASC
        LIMIT 1
      ) candidate
      WHERE NOT EXISTS (
        SELECT TRUE
        FROM trace_limit_output present
        WHERE present.id = candidate.id
      )
    expect:
      affected_rows: 1
  - name: "Scalar ordered derived INSERT stores the selected row"
    sql: "SELECT id, label FROM trace_limit_output ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
          label: "zeta"
        - id: 2
          label: "alpha"
  - name: "Scalar ordered derived relation stays in ordered scan operators"
    max_time: 5.0
    sql: |
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY (
          SELECT ranked.rank_value
          FROM trace_limit_value ranked
          WHERE ranked.id = parent.value_id
          LIMIT 1
        ) DESC, label.label ASC, parent.id ASC
        LIMIT 1
      ) candidate
    expect:
      rows: 1
      data: [{id: 2, label: "alpha"}]
  - name: "INSERT SELECT reduces an ordered join with a scalar lookup key"
    max_time: 1.0
    max_plan_size: 20000
    setup:
      - sql: "DELETE FROM trace_limit_output"
    sql: |
      INSERT INTO trace_limit_output (id, label)
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY (
          SELECT file.uploaded_at
          FROM trace_limit_file file
          WHERE file.id = parent.id * 100
          LIMIT 1
        ) DESC, label.label DESC, parent.id
        LIMIT 1
      ) candidate
      WHERE NOT EXISTS (
        SELECT TRUE
        FROM trace_limit_output present
        WHERE present.id = candidate.id
      )
    expect:
      affected_rows: 1
  - name: "INSERT SELECT scalar lookup ordering stores the selected joined row"
    sql: "SELECT id, label FROM trace_limit_output"
    expect:
      rows: 1
      data:
        - id: 2
          label: "alpha"
  - name: "Multi-source derived ORDER LIMIT preserves OFFSET"
    sql: |
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY label.label ASC
        LIMIT 1 OFFSET 1
      ) candidate
    expect:
      rows: 1
      data:
        - id: 1
          label: "zeta"
  - name: "Derived pagination bounds reuse one canonical window column"
    max_time: 5.0
    setup:
      - sql: |
          INSERT INTO trace_limit_parent (id, label_id, value_id)
          VALUES (3, NULL, 300), (4, NULL, 400), (5, NULL, 500), (6, NULL, 600)
    sql: |
      SELECT page.id
      FROM (
        SELECT source.id FROM trace_limit_parent source
        ORDER BY source.value_id LIMIT 2 OFFSET 1
      ) page
      ORDER BY page.id
    expect:
      rows: 2
      data: [{id: 2}, {id: 3}]
  - name: "Renamed derived pagination retains the larger result window"
    max_time: 5.0
    sql: |
      SELECT renamed.id
      FROM (
        SELECT base.id FROM trace_limit_parent base
        ORDER BY base.value_id LIMIT 5 OFFSET 1
      ) renamed
      ORDER BY renamed.id
    expect:
      rows: 5
      data: [{id: 2}, {id: 3}, {id: 4}, {id: 5}, {id: 6}]
  - name: "Repeated derived pagination retains the smaller result window"
    max_time: 5.0
    sql: |
      SELECT page.id
      FROM (
        SELECT source.id FROM trace_limit_parent source
        ORDER BY source.value_id LIMIT 2 OFFSET 1
      ) page
      ORDER BY page.id
    expect:
      rows: 2
      data: [{id: 2}, {id: 3}]
  - name: "Empty multi-source derived LIMIT returns no row"
    sql: |
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        WHERE parent.id > 100
        ORDER BY label.label DESC
        LIMIT 1
      ) candidate
    expect:
      rows: 0
  - name: "Multi-source derived LIMIT stays a logical one-row carrier"
    max_time: 5.0
    sql: |
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY label.label DESC
        LIMIT 1
      ) candidate
    expect:
      rows: 1
      data: [{id: 1, label: "zeta"}]

cleanup:
  - sql: "DROP TABLE IF EXISTS trace_limit_output"
  - sql: "DROP TABLE IF EXISTS trace_limit_value"
  - sql: "DROP TABLE IF EXISTS trace_limit_file"
  - sql: "DROP TABLE IF EXISTS trace_limit_parent"
  - sql: "DROP TABLE IF EXISTS trace_limit_label"
