# Copyright (C) 2026  Carl-Philip Hänsch
#
# Coverage tests for range scans, scan statistics logging, EXPLAIN (printer.go),
# ordered scans with OFFSET/LIMIT, and aggregates with filters.
# Exercises: storage/scan.go, storage/scan_order.go, storage/scan_helper.go,
#            storage/index.go, scm/printer.go (SerializeEx via EXPLAIN)

metadata:
  version: "1.0"
  description: "Range scan, EXPLAIN, and scan statistics coverage"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS rs_data"
  - sql: "DROP TABLE IF EXISTS rs_multi"
  - sql: "DROP TABLE IF EXISTS rs_left"
  - sql: "DROP TABLE IF EXISTS rs_right"
  - sql: "DROP TABLE IF EXISTS perf_main"
  - sql: "DROP TABLE IF EXISTS perf_dim"
  - sql: "DROP TABLE IF EXISTS perf_tiny"
  - sql: "DROP TABLE IF EXISTS selective_text_driver"
  - sql: "DROP TABLE IF EXISTS selective_text_dim"
  - sql: "DROP TABLE IF EXISTS pushdown_main"
  - sql: "DROP TABLE IF EXISTS pushdown_lookup"
  - sql: "DROP TABLE IF EXISTS stats_contract_child"
  - sql: "DROP TABLE IF EXISTS stats_contract_parent"

test_cases:

  # ========================================================================
  # 1. Setup: create table with >50 rows to trigger scan stats logging
  # ========================================================================
  - name: "Create range scan table"
    sql: "CREATE TABLE rs_data (id INT PRIMARY KEY, val INT, category VARCHAR(20), price DOUBLE)"
    expect:
      rows: 0

  - name: "Insert 200 rows for range scans"
    scm: |
      (begin
        (set rows (map (produceN 200) (lambda (i)
          (list i
            (* i 3)
            (nth '("alpha" "beta" "gamma" "delta") (- i (* 4 (floor (/ i 4)))))
            (+ 1.0 (* i 0.5))))))
        (insert (table "memcp-tests" "rs_data") '("id" "val" "category" "price") rows)
        200)

  - name: "Unrebuilt column statistics remain explicitly unknown"
    scm: |
      (begin
        (define idcol (car (get_schema "memcp-tests" "rs_data")))
        (define categorycol (nth (get_schema "memcp-tests" "rs_data") 2))
        (and
          (equal? (idcol "StatisticsKnown") false)
          (equal? (idcol "StatisticsConfidence") 0)
          (equal? (idcol "StatisticsSource") "unknown")
          (equal? (idcol "DistinctEstimateSource") "fallback_row_count")
          (nil? (idcol "NullFraction"))
          (nil? (idcol "AverageValueBytes"))))
    expect:
      data: [true]

  - name: "EXPLAIN keeps unknown selectivity separate from its planning fallback"
    sql: "EXPLAIN REORDER SELECT a.id FROM rs_data a JOIN rs_data b ON b.id = a.id WHERE a.val > 10"
    expect:
      rows: 1
      result_contains:
        - "selectivity_estimates"
        - "range_unknown"
        - "(known false)"
        - "planning_value"

  - name: "EXPLAIN uses the explicit fallback distinct estimate before rebuild"
    sql: "EXPLAIN REORDER SELECT a.id FROM rs_data a JOIN rs_data b ON b.id = a.id WHERE a.val = 3"
    expect:
      rows: 1
      result_contains:
        - "fallback_row_count"
        - "(confidence 0)"
        - "(known true)"
        - "planning_value"

  - name: "Clear range scan statistics"
    setup:
      - scm: '(settings "ScanDebugging" false)'
      - sql: "SELECT val FROM rs_data WHERE id = 42"
      - scm: '(sleep 0.1)'
    sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'rs_data'"
    expect:
      affected_rows: 1

  - name: "Point scan stays below automatic logging threshold"
    setup:
      - sql: "SELECT val FROM rs_data WHERE id = 42"
      - scm: '(sleep 0.1)'
    sql: "SELECT COUNT(*) AS cnt FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'rs_data'"
    expect:
      rows: 1
      data:
        - cnt: 0

  - name: "Scan debugging still records point probes"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "SELECT val FROM rs_data WHERE id = 42"
      - scm: '(sleep 0.1)'
    sql: "SELECT inputCount, candidateCount, outputCount FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'rs_data' AND index_cols = 'id' ORDER BY timestamp DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - inputCount: 200
          candidateCount: 1
          outputCount: 1
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  - name: "Unordered range scan distinguishes candidates from output rows"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'rs_data'"
      - sql: "SELECT id FROM rs_data WHERE id BETWEEN 40 AND 49 AND MOD(id, 4) = 0"
      - scm: '(sleep 0.1)'
    sql: "SELECT inputCount, candidateCount, outputCount FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'rs_data' AND ordered = FALSE ORDER BY timestamp DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - inputCount: 200
          candidateCount: 200
          outputCount: 3
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  - name: "Ordered scan logs relation, candidate, and output counts"
    sql: "SELECT id FROM rs_data ORDER BY price LIMIT 5"
    expect:
      rows: 5
      data:
        - id: 0
        - id: 1
        - id: 2
        - id: 3
        - id: 4

  - name: "Performance exception: latest ordered scan statistic lookup"
    threshold_ms: 7000
    timing_samples: 1
    warmup: false
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'rs_data'"
      - sql: "SELECT id FROM rs_data ORDER BY price LIMIT 5"
      - scm: '(sleep 0.1)'
    sql: "SELECT inputCount, candidateCount, outputCount FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'rs_data' AND ordered = TRUE ORDER BY timestamp DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - inputCount: 200
          candidateCount: 200
          outputCount: 5
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  # ========================================================================
  # 2. Range scans with various operators (exercises index boundary code)
  # ========================================================================
  - name: "Range: WHERE val > 500"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE val > 500"
    expect:
      rows: 1
      data:
        - cnt: 33

  - name: "Range: WHERE val >= 300"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE val >= 300"
    expect:
      rows: 1
      data:
        - cnt: 100

  - name: "Range: WHERE val < 30"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE val < 30"
    expect:
      rows: 1
      data:
        - cnt: 10

  - name: "Range: WHERE val <= 30"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE val <= 30"
    expect:
      rows: 1
      data:
        - cnt: 11

  - name: "Range: WHERE val BETWEEN 100 AND 200"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE val BETWEEN 100 AND 200"
    expect:
      rows: 1
      data:
        - cnt: 33

  - name: "Range: WHERE id > 150 AND id < 160"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE id > 150 AND id < 160"
    expect:
      rows: 1
      data:
        - cnt: 9

  # ========================================================================
  # 3. Aggregates with range filters (exercises scan.go aggregate paths)
  # ========================================================================
  - name: "Range SUM: WHERE val > 500"
    sql: "SELECT SUM(val) AS s FROM rs_data WHERE val > 500"
    expect:
      rows: 1

  - name: "Range AVG: WHERE val BETWEEN 100 AND 300"
    sql: "SELECT AVG(val) AS a FROM rs_data WHERE val BETWEEN 100 AND 300"
    expect:
      rows: 1

  - name: "Range MIN: WHERE category = 'alpha'"
    sql: "SELECT MIN(val) AS m FROM rs_data WHERE category = 'alpha'"
    expect:
      rows: 1
      data:
        - m: 0

  - name: "Range MAX: WHERE category = 'delta'"
    sql: "SELECT MAX(val) AS m FROM rs_data WHERE category = 'delta'"
    expect:
      rows: 1

  - name: "Range SUM with price: WHERE price > 50.0"
    sql: "SELECT SUM(price) AS s FROM rs_data WHERE price > 50.0"
    expect:
      rows: 1

  - name: "Range COUNT with multiple conditions"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE val > 100 AND category = 'beta'"
    expect:
      rows: 1

  # ========================================================================
  # 4. GROUP BY with range filter (exercises aggregate2 path in scan.go)
  # ========================================================================
  - name: "GROUP BY with range filter"
    sql: "SELECT category, COUNT(*) AS cnt, SUM(val) AS s FROM rs_data WHERE val > 300 GROUP BY category ORDER BY category"
    expect:
      rows: 4

  - name: "GROUP BY with BETWEEN"
    sql: "SELECT category, AVG(price) AS avg_p FROM rs_data WHERE id BETWEEN 50 AND 99 GROUP BY category ORDER BY category"
    expect:
      rows: 4

  # ========================================================================
  # 5. Ordered range scans (exercises scan_order.go merge + OFFSET/LIMIT)
  # ========================================================================
  - name: "ORDER BY with range filter"
    sql: "SELECT id, val FROM rs_data WHERE val > 400 ORDER BY val ASC LIMIT 5"
    expect:
      rows: 5

  - name: "ORDER BY DESC with range filter"
    sql: "SELECT id, val FROM rs_data WHERE val < 50 ORDER BY val DESC LIMIT 5"
    expect:
      rows: 5

  - name: "ORDER BY with OFFSET"
    sql: "SELECT id FROM rs_data WHERE val >= 100 ORDER BY id LIMIT 10 OFFSET 5"
    expect:
      rows: 10

  - name: "ORDER BY with large OFFSET"
    sql: "SELECT id FROM rs_data WHERE val >= 0 ORDER BY id LIMIT 5 OFFSET 100"
    expect:
      rows: 5

  - name: "ORDER BY non-PK column with filter"
    sql: "SELECT id, price FROM rs_data WHERE category = 'gamma' ORDER BY price DESC LIMIT 5"
    expect:
      rows: 5

  - name: "ORDER BY with no matching rows"
    sql: "SELECT id FROM rs_data WHERE val > 99999 ORDER BY id LIMIT 10"
    expect:
      rows: 0

  # ========================================================================
  # 6. EXPLAIN queries (exercises scm/printer.go SerializeEx)
  # ========================================================================
  - name: "EXPLAIN simple SELECT"
    sql: "EXPLAIN SELECT * FROM rs_data WHERE id = 1"
    expect:
      rows: 1

  - name: "EXPLAIN range scan"
    sql: "EXPLAIN SELECT SUM(val) FROM rs_data WHERE val > 100"
    expect:
      rows: 1

  - name: "EXPLAIN with ORDER BY"
    sql: "EXPLAIN SELECT id, val FROM rs_data ORDER BY val DESC LIMIT 10"
    expect:
      rows: 1

  - name: "EXPLAIN GROUP BY"
    sql: "EXPLAIN SELECT category, COUNT(*) FROM rs_data GROUP BY category"
    expect:
      rows: 1
      result_contains:
        - "touch_keytable"
        - ".grp:rs_data:"
      result_not_contains:
        - "assoc_keys_as_dataset_rows"
        - "assoc_keys_values_as_dataset_rows"

  - name: "EXPLAIN JOIN"
    sql: "EXPLAIN SELECT a.id, b.id FROM rs_data a JOIN rs_data b ON a.val = b.val WHERE a.id < 5"
    expect:
      rows: 1

  - name: "EXPLAIN BETWEEN"
    sql: "EXPLAIN SELECT * FROM rs_data WHERE val BETWEEN 50 AND 150"
    expect:
      rows: 1

  - name: "EXPLAIN subquery"
    sql: "EXPLAIN SELECT * FROM rs_data WHERE val > (SELECT AVG(val) FROM rs_data)"
    expect:
      rows: 1

  - name: "EXPLAIN COMPILE exposes planner phase and shape metrics"
    sql: "EXPLAIN COMPILE SELECT id FROM rs_data WHERE val BETWEEN 50 AND 150 ORDER BY id LIMIT 5"
    expect:
      rows: 1
      contains:
        - "parse_ns"
        - "untangle_ns"
        - "reorder_ns"
        - "physical_prepare_ns"
        - "recipe_emit_ns"
        - "lower_ns"
        - "optimizer_ns"
        - "optimizer_wall_ns"
        - "serialize_ns"
        - "planner_total_ns"
        - "compile_total_ns"
        - "measured_total_ns"
        - "sql_bytes"
        - "ast_nodes"
        - "logical_nodes"
        - "plan_nodes"
        - "plan_bytes"
        - "optimizer_input_nodes"
        - "optimizer_output_nodes"
        - "optimizer_rewrites"
        - "optimizer_callback_analyses"
        - "query_blocks"
        - "group_stages"
        - "union_blocks"
        - "scans"
        - "ordered_scans"
        - "exists_scans"
        - "group_caches"
        - "group_carriers"

  - name: "EXPLAIN IR exposes planner stages"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: "EXPLAIN IR SELECT id FROM rs_data WHERE val BETWEEN 50 AND 150 ORDER BY id LIMIT 5"
    expect:
      rows: 1
      contains:
        - "neumann-ir"
        - "query-block"
        - "rs_data"
        - "order"
        - "limit"
      not_contains:
        - "dependent-subquery"
        - "inner_select"
        - "neumann_"
        - "scan_order"
        - ".grp:"

  - name: "EXPLAIN IR exposes table order"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: "EXPLAIN IR SELECT a.id, b.id FROM rs_data a, rs_data b WHERE a.id = b.id"
    expect:
      contains:
        - '"stage": "untangle", "kind": "tables", "value": "((\"a\" \"memcp-tests\" \"rs_data\" false nil) (\"b\" \"memcp-tests\" \"rs_data\" false nil))"'
        - '"stage": "reorder", "kind": "tables", "value": "((\"a\" \"memcp-tests\" \"rs_data\" false true) (\"b\" \"memcp-tests\" \"rs_data\" false true))"'

      not_contains:
        - "inner_select"
        - "dependent-subquery"
  - name: "Create selective join tables"
    sql: "CREATE TABLE perf_dim (cat_id INT PRIMARY KEY, label VARCHAR(20))"
    expect:
      rows: 0

  - name: "Create fact table for reorder"
    sql: "CREATE TABLE perf_main (id INT PRIMARY KEY, category INT, payload VARCHAR(20))"
    expect:
      rows: 0

  - name: "Create disconnected tiny table for reorder"
    sql: "CREATE TABLE perf_tiny (id INT PRIMARY KEY, flag INT)"
    expect:
      rows: 0

  - name: "Insert selective join dimension rows"
    sql: "INSERT INTO perf_dim VALUES (1, 'one'), (2, 'two')"
    expect:
      affected_rows: 2

  - name: "Insert fact rows for reorder"
    sql: "INSERT INTO perf_main VALUES (1,1,'a'),(2,1,'b'),(3,2,'c')"
    expect:
      affected_rows: 3

  - name: "Insert disconnected tiny row"
    sql: "INSERT INTO perf_tiny VALUES (1, 1)"
    expect:
      affected_rows: 1

  - name: "Create selective text RecSet driver"
    sql: "CREATE TABLE selective_text_driver (id INT PRIMARY KEY, dim_id INT, search VARCHAR(40))"
    expect:
      rows: 0

  - name: "Create selective text RecSet dimension"
    sql: "CREATE TABLE selective_text_dim (id INT PRIMARY KEY, label VARCHAR(20))"
    expect:
      rows: 0

  - name: "Insert selective text RecSet fixture"
    scm: |
      (begin
        (insert (table "memcp-tests" "selective_text_dim") '("id" "label")
          (map (produceN 4) (lambda (i)
            (list i (nth '("zero" "one" "two" "three") i)))))
        (insert (table "memcp-tests" "selective_text_driver") '("id" "dim_id" "search")
          (map (produceN 2048) (lambda (i)
            (list i (mod i 4)
              (if (< i 8) (concat "asset-needle-" i) (concat "asset-other-" i))))))
        (rebuild)
        2048)

  - name: "Selective local text filter becomes an exact RecSet carrier"
    sql: |
      EXPLAIN PHYSICAL
      SELECT f.id, d.label
      FROM selective_text_driver f
      LEFT JOIN selective_text_dim d ON d.id = f.dim_id
      WHERE f.search LIKE '%needle%'
      ORDER BY f.id
      LIMIT 4
    expect:
      rows: 1
      result_contains:
        - 'selective_text_filter_carrier'
        - 'chosen scan_recset'
        - 'estimated_rows 8'
        - 'input_rows 2048'

  - name: "Selective local text RecSet carrier preserves joined rows"
    sql: |
      SELECT f.id, d.label
      FROM selective_text_driver f
      LEFT JOIN selective_text_dim d ON d.id = f.dim_id
      WHERE f.search LIKE '%needle%'
      ORDER BY f.id
      LIMIT 4
    expect:
      rows: 4
      data:
        - id: 0
          label: "zero"
        - id: 1
          label: "one"
        - id: 2
          label: "two"
        - id: 3
          label: "three"

  - name: "Broad local text filter stays fused into the driver scan"
    sql: |
      EXPLAIN PHYSICAL
      SELECT f.id, d.label
      FROM selective_text_driver f
      LEFT JOIN selective_text_dim d ON d.id = f.dim_id
      WHERE f.search LIKE '%asset%'
      ORDER BY f.id
      LIMIT 4
    expect:
      rows: 1
      result_not_contains:
        - 'selective_text_filter_carrier'

  - name: "EXPLAIN IR swaps to selective driver"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: "EXPLAIN IR SELECT d.label, m.id FROM perf_main m JOIN perf_dim d ON m.category = d.cat_id WHERE d.label = 'one'"
    expect:
      contains:
        - '"stage": "untangle", "kind": "tables", "value": "((\"m\" \"memcp-tests\" \"perf_main\" false nil) (\"d\" \"memcp-tests\" \"perf_dim\" false (equal?? (get_column \"m\" false \"category\" false) (get_column \"d\" false \"cat_id\" false))))"'
        - '"stage": "reorder", "kind": "tables", "value": "((\"d\" \"memcp-tests\" \"perf_dim\" false true) (\"m\" \"memcp-tests\" \"perf_main\" false (equal?? (get_column \"m\" false \"category\" false) (get_column \"d\" false \"cat_id\" false))))"'

      not_contains:
        - "inner_select"
        - "dependent-subquery"
  - name: "EXPLAIN IR keeps already selective order"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: "EXPLAIN IR SELECT d.label, m.id FROM perf_dim d JOIN perf_main m ON m.category = d.cat_id WHERE d.label = 'one'"
    expect:
      contains:
        - '"stage": "untangle", "kind": "tables", "value": "((\"d\" \"memcp-tests\" \"perf_dim\" false nil) (\"m\" \"memcp-tests\" \"perf_main\" false (equal?? (get_column \"m\" false \"category\" false) (get_column \"d\" false \"cat_id\" false))))"'
        - '"stage": "reorder", "kind": "tables", "value": "((\"d\" \"memcp-tests\" \"perf_dim\" false true) (\"m\" \"memcp-tests\" \"perf_main\" false (equal?? (get_column \"m\" false \"category\" false) (get_column \"d\" false \"cat_id\" false))))"'
      not_contains:
        - "inner_select"
        - "dependent-subquery"

  - name: "EXPLAIN REORDER promotes a selective comma-join dimension"
    sql: "EXPLAIN REORDER SELECT d.label, m.id FROM perf_main m, perf_dim d WHERE m.category = d.cat_id AND d.label = 'one'"
    expect:
      rows: 1
      result_contains:
        - '(join_driver \"d\")'
        - 'join_plan'
      result_not_contains:
        - '(join_driver \"m\")'
      result_occurrences:
        - text: ' where nil '
          count: 2

  - name: "Selective comma-join dimension preserves results"
    sql: "SELECT d.label, m.id FROM perf_main m, perf_dim d WHERE m.category = d.cat_id AND d.label = 'one' ORDER BY m.id"
    expect:
      rows: 2
      data:
        - label: "one"
          id: 1
        - label: "one"
          id: 2

  - name: "EXPLAIN REORDER preserves an ungrouped ordered-limit driver"
    sql: "EXPLAIN REORDER SELECT m.id FROM perf_main m, perf_dim d WHERE m.category = d.cat_id AND d.label = 'one' ORDER BY m.id LIMIT 1"
    expect:
      rows: 1
      result_contains:
        - '(join_driver \"m\")'
      result_not_contains:
        - '(join_driver \"d\")'

  - name: "EXPLAIN REORDER promotes through grouped ORDER LIMIT"
    sql: "EXPLAIN REORDER SELECT d.label, COUNT(*) AS matches FROM perf_main m, perf_dim d WHERE m.category = d.cat_id AND d.label = 'one' GROUP BY d.label ORDER BY matches DESC LIMIT 1"
    expect:
      rows: 1
      result_contains:
        - '(join_driver \"d\")'
      result_not_contains:
        - '(join_driver \"m\")'

  - name: "EXPLAIN REORDER avoids a disconnected selective driver"
    sql: "EXPLAIN REORDER SELECT m.id FROM perf_main m, perf_dim d, perf_tiny x WHERE m.category = d.cat_id AND d.label = 'one' AND x.flag = 1"
    expect:
      rows: 1
      result_contains:
        - '(join_driver \"d\")'
      result_not_contains:
        - '(join_driver \"x\")'

  - name: "EXPLAIN REORDER uses DPHyp for a small join graph"
    sql: "EXPLAIN REORDER SELECT m.id FROM perf_main m, perf_dim d WHERE m.category = d.cat_id AND d.label = 'one'"
    expect:
      rows: 1
      result_contains:
        - 'join_reorder_strategy'
        - 'dphyp'

  - name: "EXPLAIN REORDER keeps a six-way chain in exact DPHyp"
    sql: |
      EXPLAIN REORDER
      SELECT a.id
      FROM perf_tiny a, perf_tiny b, perf_tiny c,
           perf_tiny d, perf_tiny e, perf_tiny f
      WHERE a.id = b.id AND b.id = c.id AND c.id = d.id
        AND d.id = e.id AND e.id = f.id
    expect:
      rows: 1
      result_contains:
        - 'join_reorder_strategy'
        - 'dphyp'
        - 'join_plan'

  - name: "EXPLAIN REORDER honors the configured DPHyp state budget"
    setup:
      - scm: '(settings "JoinReorderDPBudget" 16)'
    sql: |
      EXPLAIN REORDER
      SELECT a.id
      FROM perf_tiny a, perf_tiny b, perf_tiny c,
           perf_tiny d, perf_tiny e, perf_tiny f
      WHERE a.id = b.id AND a.id = c.id AND a.id = d.id
        AND a.id = e.id AND a.id = f.id
    expect:
      rows: 1
      result_contains:
        - 'join_reorder_strategy'
        - 'linearized-dp'
    cleanup:
      - scm: '(settings "JoinReorderDPBudget" 256)'

  - name: "EXPLAIN REORDER budgets a twelve-way star before DPHyp"
    timeout: 2
    max_time: 0.2
    sql: |
      EXPLAIN REORDER
      SELECT a.id
      FROM perf_tiny a, perf_tiny b, perf_tiny c, perf_tiny d,
           perf_tiny e, perf_tiny f, perf_tiny g, perf_tiny h,
           perf_tiny i, perf_tiny j, perf_tiny k, perf_tiny l
      WHERE a.id = b.id AND a.id = c.id AND a.id = d.id AND a.id = e.id
        AND a.id = f.id AND a.id = g.id AND a.id = h.id AND a.id = i.id
        AND a.id = j.id AND a.id = k.id AND a.id = l.id
    expect:
      rows: 1
      result_contains:
        - 'join_reorder_strategy'
        - 'linearized-dp'
        - 'join_plan'
        - 'join_estimated_cost'
        - 'join_estimated_rows'
        - 'join_cost'
        - 'startup_ns'
        - 'probe_ns'
        - 'memory_bytes'
        - 'confidence'
        - 'execution_ns'
        - 'total_ns'
        - 'join_dp_state_budget'

  - name: "Budgeted twelve-way star preserves execution results"
    timeout: 2
    sql: |
      SELECT a.id
      FROM perf_tiny a, perf_tiny b, perf_tiny c, perf_tiny d,
           perf_tiny e, perf_tiny f, perf_tiny g, perf_tiny h,
           perf_tiny i, perf_tiny j, perf_tiny k, perf_tiny l
      WHERE a.id = b.id AND a.id = c.id AND a.id = d.id AND a.id = e.id
        AND a.id = f.id AND a.id = g.id AND a.id = h.id AND a.id = i.id
        AND a.id = j.id AND a.id = k.id AND a.id = l.id
    expect:
      rows: 1
      data:
        - id: 1

  - name: "EXPLAIN REORDER linearizes a star beyond the connected-subgraph budget"
    sql: |
      EXPLAIN REORDER
      SELECT a.id
      FROM perf_tiny a, perf_tiny b, perf_tiny c, perf_tiny d, perf_tiny e,
           perf_tiny f, perf_tiny g, perf_tiny h, perf_tiny i, perf_tiny j,
           perf_tiny k, perf_tiny l, perf_tiny m, perf_tiny n, perf_tiny o
      WHERE a.id = b.id AND a.id = c.id AND a.id = d.id AND a.id = e.id
        AND a.id = f.id AND a.id = g.id AND a.id = h.id AND a.id = i.id
        AND a.id = j.id AND a.id = k.id AND a.id = l.id AND a.id = m.id
        AND a.id = n.id AND a.id = o.id
    expect:
      rows: 1
      result_contains:
        - 'join_reorder_strategy'
        - 'linearized-dp'
        - 'join_plan'

  - name: "Create physical pushdown tables"
    sql: "CREATE TABLE pushdown_main (id INT PRIMARY KEY, lookup_id INT, payload VARCHAR(20))"
    expect:
      rows: 0

  - name: "Create physical pushdown lookup"
    sql: "CREATE TABLE pushdown_lookup (id INT PRIMARY KEY, enabled BOOL, label VARCHAR(20))"
    expect:
      rows: 0

  - name: "Insert physical pushdown lookup"
    sql: |
      INSERT INTO pushdown_lookup VALUES
        (1, TRUE, 'one'), (2, FALSE, 'two'), (3, FALSE, 'three'),
        (4, FALSE, 'four'), (5, FALSE, 'five'), (6, FALSE, 'six'),
        (7, FALSE, 'seven'), (8, FALSE, 'eight'), (9, FALSE, 'nine'),
        (10, FALSE, 'ten')
    expect:
      affected_rows: 10

  - name: "Insert physical pushdown driver rows"
    scm: |
      (insert
        (table "memcp-tests" "pushdown_main")
        '("id" "lookup_id" "payload")
        (map (produceN 10000) (lambda (i)
          (list (+ i 1) (+ 1 (- i (* 2 (floor (/ i 2))))) (concat "row-" i)))))
    expect:
      data: [10000]

  - name: "Nested point selection returns one row"
    setup:
      - scm: '(settings "ScanDebugging" false)'
      - sql: |
          SELECT m.id, d.label
          FROM pushdown_main m
          JOIN pushdown_lookup d ON d.id = m.lookup_id
          WHERE m.id = 9999 AND d.enabled = TRUE
          LIMIT 1
      - scm: '(sleep 0.5)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND (`table` = 'pushdown_main' OR `table` = 'pushdown_lookup')"
      - scm: '(settings "ScanDebugging" true)'
    sql: |
      SELECT m.id, d.label
      FROM pushdown_main m
      JOIN pushdown_lookup d ON d.id = m.lookup_id
      WHERE m.id = 9999 AND d.enabled = TRUE
      LIMIT 1
    expect:
      rows: 1
      data:
        - id: 9999
          label: "one"

  - name: "Nested point selection schedules filters before maps"
    setup:
      - scm: '(sleep 0.5)'
    timeout: 2
    sql: |
      SELECT `table`, SUM(candidateCount) AS candidates, SUM(outputCount) AS outputs
      FROM `system_statistic`.`scans`
      WHERE `schema` = 'memcp-tests'
        AND (`table` = 'pushdown_main' OR `table` = 'pushdown_lookup')
      GROUP BY `table`
      ORDER BY `table`
    expect:
      rows: 2
      data:
        - table: "pushdown_lookup"
          candidates: 1
          outputs: 1
        - table: "pushdown_main"
          candidates: 1
          outputs: 1
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  # ========================================================================
  # 7. Compress and re-test (exercises range scans on compressed storage)
  # ========================================================================

  - name: "SHUTDOWN to compress"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "Post-compress: range COUNT"
    sql: "SELECT COUNT(*) AS cnt FROM rs_data WHERE val > 500"
    expect:
      rows: 1
      data:
        - cnt: 33

  - name: "Post-compress: range SUM"
    sql: "SELECT SUM(val) AS s FROM rs_data WHERE val BETWEEN 100 AND 200"
    expect:
      rows: 1

  - name: "Post-compress: ordered range"
    sql: "SELECT id FROM rs_data WHERE val >= 400 ORDER BY val ASC LIMIT 3"
    expect:
      rows: 3

  - name: "Post-compress: EXPLAIN still works"
    sql: "EXPLAIN SELECT * FROM rs_data WHERE val > 100 ORDER BY id LIMIT 5"
    expect:
      rows: 1

  - name: "Rebuild publishes confidence null fraction and min max"
    scm: |
      (begin
        (define idcol (car (get_schema "memcp-tests" "rs_data")))
        (and
          (idcol "StatisticsKnown")
          (equal? (idcol "StatisticsConfidence") 1)
          (equal? (idcol "StatisticsSource") "rebuild")
          (equal? (idcol "DistinctEstimateSource") "rebuild")
          (equal? (idcol "NullFraction") 0)
          (equal? (idcol "MinEstimate") 0)
          (equal? (idcol "MaxEstimate") 199)
          (equal? (idcol "AverageValueBytes") 0)
          (equal? (categorycol "AverageValueBytes") 4.75)))
    expect:
      data: [true]

  - name: "Create planner statistics relationship tables"
    sql: "CREATE TABLE stats_contract_parent (tenant_id INT, id INT, PRIMARY KEY(tenant_id, id))"

  - name: "Create planner statistics child table"
    sql: "CREATE TABLE stats_contract_child (id INT PRIMARY KEY, tenant_id INT, parent_id INT, nullable_value INT, FOREIGN KEY stats_contract_fk (tenant_id, parent_id) REFERENCES stats_contract_parent(tenant_id, id))"

  - name: "Insert planner statistics parent rows"
    sql: "INSERT INTO stats_contract_parent VALUES (1,10),(1,20),(2,10)"

  - name: "Insert planner statistics child rows"
    sql: "INSERT INTO stats_contract_child VALUES (1,1,10,NULL),(2,1,10,5),(3,1,20,9)"

  - name: "Rebuild planner statistics relationship tables"
    sql: "SHUTDOWN"

  - name: "Planner statistics expose nullable distribution"
    scm: |
      (begin
        (define nullablecol (nth (get_schema "memcp-tests" "stats_contract_child") 3))
        (and
          (nullablecol "StatisticsKnown")
          (> (nullablecol "NullFraction") 0.33)
          (< (nullablecol "NullFraction") 0.34)
          (equal? (nullablecol "MinEstimate") 5)
          (equal? (nullablecol "MaxEstimate") 9)))
    expect:
      data: [true]

  - name: "Planner metadata exposes composite distinct and FK fanout contracts"
    scm: |
      (begin
        (define parentmeta ((show "memcp-tests" "stats_contract_parent" true) "meta"))
        (define childmeta ((show "memcp-tests" "stats_contract_child" true) "meta"))
        (and
          (equal? (count (parentmeta "MultiColumnDistinct")) 1)
          (equal? ((car (parentmeta "MultiColumnDistinct")) "Estimate") 3)
          (equal? (count (childmeta "ForeignKeys")) 1)
          (equal? ((car (childmeta "ForeignKeys")) "Role") "referencing")
          (equal? (count (childmeta "Fanout")) 1)
          (> ((car (childmeta "Fanout")) "EstimatedFanout") 0)))
    expect:
      data: [true]

  # ========================================================================
  # 8. Multi-column range + index (exercises multi-column boundary code)
  # ========================================================================
  - name: "Create multi-column table"
    sql: "CREATE TABLE rs_multi (a INT, b INT, c INT, PRIMARY KEY(a, b))"
    expect:
      rows: 0

  - name: "Insert multi-column data"
    scm: |
      (begin
        (set rows (map (produceN 100) (lambda (i)
          (list (floor (/ i 10)) (- i (* 10 (floor (/ i 10)))) (* i i)))))
        (insert (table "memcp-tests" "rs_multi") '("a" "b" "c") rows)
        100)

  - name: "Multi-col: range on first key"
    sql: "SELECT COUNT(*) AS cnt FROM rs_multi WHERE a > 5"
    expect:
      rows: 1
      data:
        - cnt: 40

  - name: "Multi-col: range on both keys"
    sql: "SELECT COUNT(*) AS cnt FROM rs_multi WHERE a = 3 AND b > 5"
    expect:
      rows: 1
      data:
        - cnt: 4

  - name: "Multi-col: SUM with composite key range"
    sql: "SELECT SUM(c) AS s FROM rs_multi WHERE a BETWEEN 2 AND 4"
    expect:
      rows: 1

  - name: "Multi-col: ORDER BY composite"
    sql: "SELECT a, b FROM rs_multi WHERE a >= 7 ORDER BY a, b LIMIT 5"
    expect:
      rows: 5
      data:
        - a: 7
          b: 0
        - a: 7
          b: 1
        - a: 7
          b: 2
        - a: 7
          b: 3
        - a: 7
          b: 4

  # ========================================================================
  # 9. LEFT JOIN with no matches (exercises outer join NULL-row injection)
  # ========================================================================
  - name: "Create left table"
    sql: "CREATE TABLE rs_left (id INT, name VARCHAR(20))"
    expect:
      rows: 0

  - name: "Create right table (empty)"
    sql: "CREATE TABLE rs_right (id INT, ref_id INT, score INT)"
    expect:
      rows: 0

  - name: "Insert left data"
    sql: "INSERT INTO rs_left VALUES (1, 'Alice'), (2, 'Bob'), (3, 'Charlie')"
    expect:
      affected_rows: 3

  - name: "LEFT JOIN with empty right (outer join NULL injection)"
    sql: "SELECT l.name, r.score FROM rs_left l LEFT JOIN rs_right r ON l.id = r.ref_id ORDER BY l.name"
    expect:
      rows: 3
      data:
        - name: "Alice"
          score: null
        - name: "Bob"
          score: null
        - name: "Charlie"
          score: null

  - name: "LEFT JOIN with ORDER BY and no matches (outer + ordered path)"
    sql: "SELECT l.name, r.score FROM rs_left l LEFT JOIN rs_right r ON l.id = r.ref_id ORDER BY l.name LIMIT 5"
    expect:
      rows: 3

  - name: "Insert some right data"
    sql: "INSERT INTO rs_right VALUES (1, 1, 100), (2, 1, 200), (3, 3, 50)"
    expect:
      affected_rows: 3

  - name: "LEFT JOIN partial match"
    sql: "SELECT l.name, r.score FROM rs_left l LEFT JOIN rs_right r ON l.id = r.ref_id ORDER BY l.name, r.score"
    expect:
      rows: 4
      data:
        - name: "Alice"
          score: 100
        - name: "Alice"
          score: 200
        - name: "Bob"
          score: null
        - name: "Charlie"
          score: 50

  # ========================================================================
  # 10. serialize() with complex data structures (printer.go deep paths)
  # ========================================================================
  - name: "serialize: deeply nested list"
    scm: "(serialize '(if (> 'x 10) (+ 'x 1) (- 'x 1)))"
    expect:
      data: ["(if (> x 10) (+ x 1) (- x 1))"]

  - name: "serialize: empty inner list"
    scm: "(serialize '(begin '() 42))"
    expect:
      data: ["(begin '() 42)"]

  - name: "serialize: quoted list marker"
    scm: "(serialize (list (list 'list 1 2 3)))"

  - name: "serialize: string with newlines and quotes"
    scm: "(serialize \"hello\\nworld\\\"quoted\\\"\")"

  - name: "serialize: large nested expression"
    scm: "(serialize '('lambda '('a 'b) '('+ '('* 'a 'a) '('* 'b 'b))))"

  - name: "serialize roundtrip: complex expression"
    scm: |
      (begin
        (set code '('+ '('* 2 3) '('- 10 4)))
        (set s (serialize code))
        (eval (scheme s)))
    expect:
      data: [12]

  # ========================================================================
  # 11. stat() on compressed tables (deep storage stats)
  # ========================================================================
  - name: "stat: compressed table detail"
    scm: |
      (begin
        (set s (stat "memcp-tests" "rs_data"))
        (if (> (strlen s) 50) "ok" "too_short"))
    expect:
      data: ["ok"]

  - name: "stat: multi-column table detail"
    scm: |
      (begin
        (set s (stat "memcp-tests" "rs_multi"))
        (if (> (strlen s) 0) "ok" "empty"))
    expect:
      data: ["ok"]

cleanup:
  - sql: "DROP TABLE IF EXISTS rs_data"
  - sql: "DROP TABLE IF EXISTS rs_multi"
  - sql: "DROP TABLE IF EXISTS rs_left"
  - sql: "DROP TABLE IF EXISTS rs_right"
  - sql: "DROP TABLE IF EXISTS perf_main"
  - sql: "DROP TABLE IF EXISTS perf_dim"
  - sql: "DROP TABLE IF EXISTS perf_tiny"
  - sql: "DROP TABLE IF EXISTS selective_text_driver"
  - sql: "DROP TABLE IF EXISTS selective_text_dim"
  - sql: "DROP TABLE IF EXISTS pushdown_main"
  - sql: "DROP TABLE IF EXISTS pushdown_lookup"
  - sql: "DROP TABLE IF EXISTS stats_contract_child"
  - sql: "DROP TABLE IF EXISTS stats_contract_parent"
