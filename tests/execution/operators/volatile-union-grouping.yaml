metadata:
  description: Scoped volatile UNION grouping consumes delegated native branch rows
  syntax: tsql
  cluster:
    fixture: shared_analytics
    rows_per_shard: 5000
    shards: 64
    columns: 8
    nodes: 4
    gomaxprocs: 16
    ram_limit_bytes: 8388608
    coordinator_ram_limit_bytes: 131072
    shard_ram_percent: 50
    coordinator_shard_ram_percent: 1
    storage_backend: FakeRemote
    storage_bandwidth_mbps: 1000
    storage_latency_ms: 5
    cluster_bandwidth_mbps: 1000
    cluster_latency_ms: 0.1
test_cases:
- name: Whole bag COUNT DISTINCT combines delegated rows with a volatile catalog branch
  sql: |
    SELECT COUNT(DISTINCT id) AS kinds,SUM(payload) AS total
    FROM (SELECT id,CAST(v0 AS BIGINT) AS payload FROM big_items WHERE id<3 UNION ALL
      SELECT CAST(2 AS INT) AS id,CAST(7 AS BIGINT) AS payload FROM information_schema.tables
      WHERE table_catalog=DB_NAME() AND table_name=N'big_items') AS items
  expect:
    rows: 1
    data: [{kinds: 3,total: 4282061962}]
    cluster: {min_remote_shards: 1}
- name: A binding used only inside a delegated UNION branch predicate remains invocation-local
  sql: |
    DECLARE @cutoff INT=2,@kinds INT,@total BIGINT;
    SELECT @kinds=COUNT(DISTINCT id),@total=SUM(payload)
    FROM (SELECT id,CAST(v0 AS BIGINT) AS payload FROM big_items WHERE id<@cutoff UNION ALL
      SELECT CAST(2 AS INT) AS id,CAST(7 AS BIGINT) AS payload FROM information_schema.tables
      WHERE table_catalog=DB_NAME() AND table_name=N'big_items') AS items;
    SET @cutoff=3;
    SELECT @kinds=COUNT(DISTINCT id),@total=SUM(payload)
    FROM (SELECT id,CAST(v0 AS BIGINT) AS payload FROM big_items WHERE id<@cutoff UNION ALL
      SELECT CAST(2 AS INT) AS id,CAST(7 AS BIGINT) AS payload FROM information_schema.tables
      WHERE table_catalog=DB_NAME() AND table_name=N'big_items') AS items;
    SELECT @kinds AS kinds,@total AS total
  expect:
    rows: 1
    data: [{kinds: 3,total: 4282061962}]
    cluster: {min_remote_shards: 1}
