          (and (equal? (optimized -1.25 2) "-1.25"))
          (and (equal? (compiled -1.25 2) "-1.25"))))
  expect:
    result: true
- name: Fixed formatting preserves 1.5000000000000000
  scm: |-
    (begin
      (define expression (scheme "(lambda (value precision) (format_fixed value precision))"))
      (define direct (eval (scheme "(lambda (value precision) (format_fixed value precision))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct 1.5 16) "1.5000000000000000"))
