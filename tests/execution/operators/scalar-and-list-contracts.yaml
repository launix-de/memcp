metadata:
  description: Native scalar execution and bounded list scan contracts through the YAML SQL runner
test_cases:
- name: Exact large integer power
  scm: |-
    (begin
      (define expression (scheme "(lambda (base exponent) (number_power base exponent))"))
      (define direct (eval (scheme "(lambda (base exponent) (number_power base exponent))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct 3 39) 4052555153018976267) (int? (direct 3 39)))
          (and (equal? (optimized 3 39) 4052555153018976267) (int? (optimized 3 39)))
          (and (equal? (compiled 3 39) 4052555153018976267) (int? (compiled 3 39)))))
  expect:
    result: true
- name: Signed minimum integer power
  scm: |-
    (begin
      (define expression (scheme "(lambda (base exponent) (number_power base exponent))"))
      (define direct (eval (scheme "(lambda (base exponent) (number_power base exponent))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct -2 63) -9223372036854775808) (int? (direct -2 63)))
          (and (equal? (optimized -2 63) -9223372036854775808) (int? (optimized -2 63)))
          (and (equal? (compiled -2 63) -9223372036854775808) (int? (compiled -2 63)))))
  expect:
    result: true
- name: Positive overflow changes native numeric carrier
  scm: |-
    (begin
      (define expression (scheme "(lambda (base exponent) (number_power base exponent))"))
      (define direct (eval (scheme "(lambda (base exponent) (number_power base exponent))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct 2 63) 9223372036854775808.0))
          (and (equal? (optimized 2 63) 9223372036854775808.0))
          (and (equal? (compiled 2 63) 9223372036854775808.0))))
  expect:
    result: true
- name: Zero exponent power
  scm: |-
    (begin
      (define expression (scheme "(lambda (base exponent) (number_power base exponent))"))
      (define direct (eval (scheme "(lambda (base exponent) (number_power base exponent))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct 0 0) 1) (int? (direct 0 0)))
          (and (equal? (optimized 0 0) 1) (int? (optimized 0 0)))
          (and (equal? (compiled 0 0) 1) (int? (compiled 0 0)))))
  expect:
    result: true
- name: Fractional real power
  scm: |-
    (begin
      (define expression (scheme "(lambda (base exponent) (number_power base exponent))"))
      (define direct (eval (scheme "(lambda (base exponent) (number_power base exponent))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct 9.0 0.5) 3.0))
          (and (equal? (optimized 9.0 0.5) 3.0))
          (and (equal? (compiled 9.0 0.5) 3.0))))
  expect:
    result: true
- name: Negative exponent power
  scm: |-
    (begin
      (define expression (scheme "(lambda (base exponent) (number_power base exponent))"))
      (define direct (eval (scheme "(lambda (base exponent) (number_power base exponent))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct 2 -3) 0.125))
          (and (equal? (optimized 2 -3) 0.125))
          (and (equal? (compiled 2 -3) 0.125))))
  expect:
    result: true
- name: NULL native power
  scm: |-
    (begin
      (define expression (scheme "(lambda (base exponent) (number_power base exponent))"))
      (define direct (eval (scheme "(lambda (base exponent) (number_power base exponent))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct nil 2) nil))
          (and (equal? (optimized nil 2) nil))
          (and (equal? (compiled nil 2) nil))))
  expect:
    result: true
- name: Real-domain failure remains a native NaN
  scm: (equal? (concat (number_power -2 0.5)) "NaN")
  expect:
    result: true
- name: Fixed formatting preserves 12.50
  scm: |-
    (begin
      (define expression (scheme "(lambda (value precision) (format_fixed value precision))"))
      (define direct (eval (scheme "(lambda (value precision) (format_fixed value precision))")))
      (define optimized (eval (optimize expression)))
      (define compiled (jit optimized))
      (and
          (and (equal? (direct 12.5 2) "12.50"))
          (and (equal? (optimized 12.5 2) "12.50"))
          (and (equal? (compiled 12.5 2) "12.50"))))
  expect:
    result: true
