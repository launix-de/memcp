- name: Fixed formatting preserves 0.0000
  scm: |-
    (begin
      (define expression (scheme "(lambda (value precision) (format_fixed value precision))"))
      (define direct (eval (scheme "(lambda (value precision) (format_fixed value precision))")))
      (define optimized (eval (optimize expression)))
