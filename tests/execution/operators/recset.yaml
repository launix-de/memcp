#
# Query-local RecSet storage primitive tests. RecSets are intentionally SCM
# values only; the tests exercise public scans without exposing recids.

metadata:
  version: "1.0"
  description: "Query-local RecSet scans and contains probes"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS recset_items"
  - sql: "DROP TABLE IF EXISTS recset_other"
  - sql: "DROP TABLE IF EXISTS recset_link"
  - sql: "DROP TABLE IF EXISTS recset_adaptive"
  - sql: "DROP TABLE IF EXISTS recset_project_source"
  - sql: "DROP TABLE IF EXISTS recset_project_target"
  - sql: |
      CREATE TABLE recset_items (
        id INT PRIMARY KEY,
        tenant INT,
        active INT
      )
  - sql: |
      CREATE TABLE recset_other (
        id INT PRIMARY KEY,
        tenant INT
      )
  - sql: |
      CREATE TABLE recset_link (
        id INT PRIMARY KEY,
        item_id INT,
        tenant INT
      )
  - sql: "CREATE TABLE recset_adaptive (id INT PRIMARY KEY, value INT)"
  - sql: "CREATE TABLE recset_project_source (id INT PRIMARY KEY, k1 INT, k2 INT, selected INT)"
  - sql: "CREATE TABLE recset_project_target (id INT PRIMARY KEY, k1 INT, k2 INT)"
  - sql: |
      INSERT INTO recset_items VALUES
        (1, 1, 1),
        (2, 1, 0),
        (3, 2, 1),
        (4, 2, 0),
        (5, 1, 1)
  - sql: |
      INSERT INTO recset_other VALUES
        (1, 1),
        (2, 1)
  - sql: |
      INSERT INTO recset_link VALUES
        (1, 1, 1),
        (2, 5, 1),
        (3, 1, 1),
        (4, 3, 2),
        (5, NULL, 1)
  - scm: |
      (begin
        (define rows (produceN 4096 (lambda (i) (list (+ i 1) (mod i 8)))))
        (insert (table "memcp-tests" "recset_adaptive") '("id" "value") rows '() (lambda () true) false))
  - scm: |
      (begin
        (define rows (produceN 20000 (lambda (i)
          (list (+ i 1) (if (equal? (mod i 997) 0) nil (mod i 10000)) (mod i 17) (if (< i 5000) 1 0)))))
        (insert (table "memcp-tests" "recset_project_source") '("id" "k1" "k2" "selected") rows '() (lambda () true) false))
  - scm: |
      (begin
        (define rows (produceN 40000 (lambda (i) (list (+ i 1) (mod i 10000) (mod i 17)))))
        (insert (table "memcp-tests" "recset_project_target") '("id" "k1" "k2") rows '() (lambda () true) false))

cleanup:
  - sql: "DROP TABLE IF EXISTS recset_project_target"
  - sql: "DROP TABLE IF EXISTS recset_project_source"
  - sql: "DROP TABLE IF EXISTS recset_adaptive"
  - sql: "DROP TABLE IF EXISTS recset_link"
  - sql: "DROP TABLE IF EXISTS recset_other"
  - sql: "DROP TABLE IF EXISTS recset_items"

test_cases:
  - name: "scan_recset builds a query-local subset"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (if (equal? (recset_count rs) 3)
          "ok"
          (error "scan_recset returned wrong cardinality")))

  - name: "scan accepts recset as table-like source"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define sum_active
          (scan nil rs
            '("active")
            (lambda (active) (equal? active 1))
            '("id")
            (lambda (id) id)
            (lambda (acc id) (+ acc id))
            0))
        (if (equal? sum_active 6)
          "ok"
          (error "recset scan returned wrong row set")))

  - name: "recset boundary statistics count candidates before residual filtering"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'recset_items'"
      - scm: |
          (begin
            (define tbl (table "memcp-tests" "recset_items"))
            (define rs (scan_recset nil tbl
              '("tenant")
              (lambda (tenant) (equal? tenant 1))))
            (scan nil tbl
              '("$recset_contains" "active")
              (lambda (in_recset active) (and (in_recset rs) (equal? active 1)))
              '("id")
              (lambda (id) id)
              (lambda (acc id) (+ acc id))
              0))
      - scm: '(sleep 0.1)'
    sql: "SELECT inputCount, candidateCount, outputCount FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'recset_items' AND ordered = FALSE AND outputCount = 2 ORDER BY timestamp DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - inputCount: 5
          candidateCount: 5
          outputCount: 2
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  - name: "$recset_contains probes current table row without exposing recid"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define sum_active
          (scan nil tbl
            '("$recset_contains" "active")
            (lambda (in_recset active) (and (in_recset rs) (equal? active 1)))
            '("id")
            (lambda (id) id)
            (lambda (acc id) (+ acc id))
            0))
        (if (equal? sum_active 6)
          "ok"
          (error "$recset_contains returned wrong membership")))

  - name: "$recset_contains handles multiple recsets in one scan"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define active (scan_recset nil tbl
          '("active")
          (lambda (active) (equal? active 1))))
        (define sum_ids
          (scan nil tbl
            '("$recset_contains" "$recset_contains")
            (lambda (in_tenant1 in_active) (and (in_tenant1 tenant1) (in_active active)))
            '("id")
            (lambda (id) id)
            (lambda (acc id) (+ acc id))
            0))
        (if (equal? sum_ids 6)
          "ok"
          (error "$recset_contains did not switch between recset handles")))

  - name: "$recset_contains is table-scoped"
    scm: |
      (begin
        (define source (table "memcp-tests" "recset_items"))
        (define other (table "memcp-tests" "recset_other"))
        (define rs (scan_recset nil source
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define matches
          (scan nil other
            '("$recset_contains")
            (lambda (in_recset) (if (in_recset rs) true false))
            '("id")
            (lambda (id) 1)
            (lambda (acc one) (+ acc one))
            0))
        (if (equal? matches 0)
          "ok"
          (error "$recset_contains matched a different table")))

  - name: "scan_order supports $recset_contains filter"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define ordered
          (scan_order nil tbl
            '("$recset_contains" "active")
            (lambda (in_recset active) (and (in_recset rs) (equal? active 1)))
            '("id") '(<)
            0 0 10
            '("id")
            (lambda (id) (list id))
            (lambda (acc row) (append acc row))
            '()
            false))
        (if (equal? ordered (list (list 1) (list 5)))
          "ok"
          (error "scan_order $recset_contains returned wrong order")))

  - name: "ordered recset scan statistics use recset cardinality"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'recset_items'"
      - scm: |
          (begin
            (define tbl (table "memcp-tests" "recset_items"))
            (define rs (scan_recset nil tbl
              '("tenant")
              (lambda (tenant) (equal? tenant 1))))
            (scan_order nil rs
              '("active")
              (lambda (active) (equal? active 1))
              '("id") '(<)
              0 0 10
              '("id")
              (lambda (id) (list id))
              (lambda (acc row) (append acc row))
              '()
              false))
      - scm: '(sleep 0.1)'
    sql: "SELECT inputCount, candidateCount, outputCount FROM `system_statistic`.`scans` WHERE `schema` = 'memcp-tests' AND `table` = 'recset_items' AND ordered = TRUE ORDER BY timestamp DESC LIMIT 1"
    expect:
      rows: 1
      data:
        - inputCount: 3
          candidateCount: 3
          outputCount: 2
    cleanup:
      - scm: '(settings "ScanDebugging" false)'

  - name: "scan_order keeps repeated $recset_contains calls exact"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define active (scan_recset nil tbl
          '("active")
          (lambda (active) (equal? active 1))))
        (define ordered
          (scan_order nil tbl
            '("$recset_contains")
            (lambda (in_recset) (and (in_recset tenant1) (in_recset active)))
            '("id") '(<)
            0 0 10
            '("id")
            (lambda (id) (list id))
            (lambda (acc row) (append acc row))
            '()
            false))
        (if (equal? ordered (list (list 1) (list 5)))
          "ok"
          (error "scan_order repeated $recset_contains calls lost a predicate")))

  - name: "scan_order keeps $recset_contains OR semantics exact"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define active (scan_recset nil tbl
          '("active")
          (lambda (active) (equal? active 1))))
        (define ordered
          (scan_order nil tbl
            '("$recset_contains")
            (lambda (in_recset) (or (in_recset tenant1) (in_recset active)))
            '("id") '(<)
            0 0 10
            '("id")
            (lambda (id) (list id))
            (lambda (acc row) (append acc row))
            '()
            false))
        (if (equal? ordered (list (list 1) (list 2) (list 3) (list 5)))
          "ok"
          (error "scan_order $recset_contains OR semantics changed")))

  - name: "scan_exists accepts recset as table-like source"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (if (and
              (scan_exists nil rs
                '("active")
                (lambda (active) (equal? active 0)))
              (not (scan_exists nil rs
                '("id")
                (lambda (id) (equal? id 3)))))
          "ok"
          (error "scan_exists over recset returned wrong result")))

  - name: "scan_exists uses recset membership on base table"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (if (and
              (scan_exists nil tbl
                '("$recset_contains" "id")
                (lambda (in_recset id) (and (in_recset tenant1) (equal? id 5))))
              (not (scan_exists nil tbl
                '("$recset_contains" "id")
                (lambda (in_recset id) (and (in_recset tenant1) (equal? id 3))))))
          "ok"
          (error "scan_exists recset membership returned wrong result")))

  - name: "scan_recset intersects recset membership before reading columns"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define active_tenant1 (scan_recset nil tbl
          '("$recset_contains" "active")
          (lambda (in_recset active) (and (in_recset tenant1) (equal? active 1)))))
        (if (equal? (recset_count active_tenant1) 2)
          "ok"
          (error "scan_recset membership intersection returned wrong cardinality")))

  - name: "scan_batch applies recset membership to every lookup batch"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define sum_ids (scan_batch nil tbl
          '("$recset_contains" "id" "#0")
          (lambda (in_recset id wanted_id)
            (and (in_recset tenant1) (equal? id wanted_id)))
          '("id")
          (lambda (id) id)
          1 (list 1 3 5)
          (lambda (acc id) (+ acc id))
          0))
        (if (equal? sum_ids 6)
          "ok"
          (error "scan_batch recset membership returned wrong rows")))

  - name: "scan_order accepts recset as table-like source"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define ordered
          (scan_order nil rs
            '("active")
            (lambda (active) true)
            '("id") '(<)
            0 0 2
            '("id")
            (lambda (id) (list id))
            (lambda (acc row) (append acc row))
            '()
            false))
        (if (equal? ordered (list (list 1) (list 2)))
          "ok"
          (error "scan_order over recset returned wrong order")))

  - name: "scan_order_multi accepts recset branches"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define rs2 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 2))))
        (define ordered
          (scan_order_multi nil
            (list rs1 rs2)
            (list (list "active") (list "active"))
            (list
              (lambda (active) (equal? active 1))
              (lambda (active) (equal? active 1)))
            (list (list "id") (list "id"))
            '(<)
            nil nil
            0 0 10
            (list (list "id") (list "id"))
            (list
              (lambda (id) (list id))
              (lambda (id) (list id)))
            (lambda (acc row) (append acc row))
            '()
            false))
        (if (equal? ordered (list (list 1) (list 3) (list 5)))
          "ok"
          (error "scan_order_multi over recsets returned wrong order")))

  - name: "recset_project_join projects source keys to target recids"
    scm: |
      (begin
        (define links (table "memcp-tests" "recset_link"))
        (define items (table "memcp-tests" "recset_items"))
        (define link_rs (scan_recset nil links
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define item_rs (recset_project_join nil link_rs '("item_id") items '("id")))
        (define sum_ids
          (scan nil item_rs
            '()
            (lambda () true)
            '("id")
            (lambda (id) id)
            (lambda (acc id) (+ acc id))
            0))
        (if (and
              (equal? (recset_count item_rs) 2)
              (equal? sum_ids 6))
          "ok"
          (error "recset_project_join returned wrong target recset")))

  - name: "recset_project_join output can be ordered"
    scm: |
      (begin
        (define links (table "memcp-tests" "recset_link"))
        (define items (table "memcp-tests" "recset_items"))
        (define link_rs (scan_recset nil links
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define item_rs (recset_project_join nil link_rs '("item_id") items '("id")))
        (define ordered
          (scan_order nil item_rs
            '()
            (lambda () true)
            '("id") '(<)
            0 0 10
            '("id" "active")
            (lambda (id active) (list (list id active)))
            (lambda (acc row) (append acc row))
            '()
            false))
        (if (equal? ordered (list (list (list 1 1)) (list (list 5 1))))
          "ok"
          (error "recset_project_join output did not scan_order correctly")))

  - name: "EXPLAIN PHYSICAL identifies ordered RecSet intersection"
    sql: |
      EXPLAIN PHYSICAL
      SELECT i.id
      FROM recset_items i
      WHERE EXISTS (
        SELECT l.item_id
        FROM recset_link l
        WHERE l.tenant = 1 AND l.item_id = i.id
        UNION ALL
        SELECT l2.item_id
        FROM recset_link l2
        WHERE l2.tenant = 2 AND l2.item_id = i.id
      )
      ORDER BY i.id
    expect:
      rows: 1
      result_contains:
        - "ordered_recset_iterator"
        - "scan_order_recset_part"
        - "recset_contains_probe"
        - "direct_intersection_available"
        - "chosen"
        - "rejected"

  - name: "recset key index provides immutable scalar lookup"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define selected (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define lookup (recset_key_index nil selected '("id")))
        (if (and
              (lookup 1)
              (lookup 2)
              (lookup 5)
              (not (lookup 3)))
          "ok"
          (error "recset key index returned wrong membership")))

  - name: "recset key index accepts a union and composite keys"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define active (scan_recset nil tbl
          '("active")
          (lambda (value) (equal? value 1))))
        (define lookup (recset_key_index nil
          (recset_union (list tenant1 active))
          '("tenant" "active")))
        (if (and
              (lookup 1 1)
              (lookup 1 0)
              (lookup 2 1)
              (not (lookup 2 0)))
          "ok"
          (error "union composite key index returned wrong membership")))

  - name: "recset key index rejects lookup arity mismatch"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define selected (scan_recset nil tbl '() (lambda () true)))
        (define lookup (recset_key_index nil selected '("tenant" "active")))
        (lookup 1))
    expect:
      error: true

  - name: "recset_union combines same-table recsets without duplicates"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define active (scan_recset nil tbl
          '("active")
          (lambda (active) (equal? active 1))))
        (define combined (recset_union (list tenant1 active)))
        (define sum_ids
          (scan nil combined
            '()
            (lambda () true)
            '("id")
            (lambda (id) id)
            (lambda (acc id) (+ acc id))
            0))
        (if (and
              (equal? (recset_count combined) 4)
              (equal? sum_ids 11))
          "ok"
          (error "recset_union returned wrong row set")))

  - name: "adaptive recset algebra covers every representation pairing"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_adaptive"))
        (define full (scan_recset nil tbl '() (lambda () true)))
        (define empty (scan_recset nil tbl '() (lambda () false)))
        (define positive (scan_recset nil tbl '("id") (lambda (id) (> id 4086))))
        (define positive2 (scan_recset nil tbl '("id") (lambda (id) (and (>= id 4083) (<= id 4092)))))
        (define negative (scan_recset nil tbl '("id") (lambda (id) (not (> (mod id 5000) 4086)))))
        (define negative2 (scan_recset nil tbl '("id") (lambda (id)
          (not (and (>= (mod id 5000) 6) (<= (mod id 5000) 15))))))
        (define negative3 (scan_recset nil tbl '("id") (lambda (id) (not (> (mod id 5000) 4091)))))
        (define even (scan_recset nil tbl '("id") (lambda (id) (equal? (mod id 2) 0))))
        (define third (scan_recset nil tbl '("id") (lambda (id) (equal? (mod id 3) 0))))
        (if (and
              (equal? (recset_count full) 4096)
              (equal? (recset_count empty) 0)
              (equal? (recset_count positive) 10)
              (equal? (recset_count negative) 4086)
              (equal? (recset_count even) 2048)
              (equal? (recset_count (recset_union (list positive positive2))) 14)
              (equal? (recset_count (recset_intersect (list positive positive2))) 6)
              (equal? (recset_count (recset_union (list negative negative2))) 4096)
              (equal? (recset_count (recset_intersect (list negative negative2))) 4076)
              (equal? (recset_count (recset_union (list negative negative3))) 4091)
              (equal? (recset_count (recset_intersect (list negative negative3))) 4086)
              (equal? (recset_count (recset_union (list positive2 negative))) 4092)
              (equal? (recset_count (recset_intersect (list positive2 negative))) 4)
              (equal? (recset_count (recset_union (list even third))) 2731)
              (equal? (recset_count (recset_intersect (list even third))) 682)
              (equal? (recset_count (recset_union (list positive even))) 2053)
              (equal? (recset_count (recset_intersect (list positive even))) 5)
              (equal? (recset_count (recset_union (list negative even))) 4091)
              (equal? (recset_count (recset_intersect (list negative even))) 2043)
              (equal? (recset_count (recset_union (list full positive))) 4096)
              (equal? (recset_count (recset_intersect (list empty negative))) 0)
              (equal? (recset_count (recset_union (list empty positive))) 10)
              (equal? (recset_count (recset_intersect (list full negative))) 4086)
              (equal? (recset_count (recset_not positive)) 4086)
              (equal? (recset_count (recset_difference (list negative even))) 2043)
              (equal? (recset_count (recset_difference (list full positive even))) 2043))
          "ok"
          (error "adaptive recset algebra returned wrong cardinality")))

  - name: "recset_not complements against visible same-table rows"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define tenant1 (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (define complement (recset_not tenant1))
        (define sum_ids
          (scan nil complement '() (lambda () true) '("id")
            (lambda (id) id) (lambda (acc id) (+ acc id)) 0))
        (if (and (equal? (recset_count complement) 2) (equal? sum_ids 7))
          "ok"
          (error "recset_not returned wrong row set")))

  - name: "recset_difference subtracts every following operand"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define full (scan_recset nil tbl '() (lambda () true)))
        (define tenant1 (scan_recset nil tbl '("tenant") (lambda (tenant) (equal? tenant 1))))
        (define active (scan_recset nil tbl '("active") (lambda (value) (equal? value 1))))
        (define remaining (recset_difference (list full tenant1 active)))
        (define sum_ids
          (scan nil remaining '() (lambda () true) '("id")
            (lambda (id) id) (lambda (acc id) (+ acc id)) 0))
        (if (and (equal? (recset_count remaining) 1) (equal? sum_ids 4))
          "ok"
          (error "recset_difference returned wrong row set")))

  - name: "recset_difference requires a left operand"
    scm: "(recset_difference (list))"
    expect:
      error: true

  - name: "recset_union rejects recsets from different tables"
    scm: |
      (begin
        (define left (scan_recset nil (table "memcp-tests" "recset_items") '() (lambda () true)))
        (define right (scan_recset nil (table "memcp-tests" "recset_other") '() (lambda () true)))
        (recset_union (list left right)))
    expect:
      error: true

  - name: "recset_intersect rejects recsets from different tables"
    scm: |
      (begin
        (define left (scan_recset nil (table "memcp-tests" "recset_items") '() (lambda () true)))
        (define right (scan_recset nil (table "memcp-tests" "recset_other") '() (lambda () true)))
        (recset_intersect (list left right)))
    expect:
      error: true

  - name: "recset_difference rejects recsets from different tables"
    scm: |
      (begin
        (define left (scan_recset nil (table "memcp-tests" "recset_items") '() (lambda () true)))
        (define right (scan_recset nil (table "memcp-tests" "recset_other") '() (lambda () true)))
        (recset_difference (list left right)))
    expect:
      error: true

  - name: "large recset projection keeps one-column duplicates and nulls exact"
    scm: |
      (begin
        (define source (table "memcp-tests" "recset_project_source"))
        (define target (table "memcp-tests" "recset_project_target"))
        (define selected (scan_recset nil source '("selected") (lambda (v) (equal? v 1))))
        (define projected (recset_project_join nil selected '("k1") target '("k1")))
        (if (equal? (recset_count projected) 19976)
          "ok"
          (error "large one-column recset projection returned wrong cardinality")))

  - name: "large recset projection keeps composite keys exact"
    scm: |
      (begin
        (define source (table "memcp-tests" "recset_project_source"))
        (define target (table "memcp-tests" "recset_project_target"))
        (define selected (scan_recset nil source '("selected") (lambda (v) (equal? v 1))))
        (define projected (recset_project_join nil selected '("k1" "k2") target '("k1" "k2")))
        (if (equal? (recset_count projected) 4994)
          "ok"
          (error "large composite recset projection returned wrong cardinality")))

  - name: "show forwards recset to base table metadata"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (if (and
              (equal? (show rs) (show tbl))
              (equal? (show rs true) (show tbl true))
              (equal? (show rs "statistics") (show tbl "statistics")))
          "ok"
          (error "show did not forward recset to base table")))

  - name: "recset scan rejects mutation callbacks"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "recset_items"))
        (define rs (scan_recset nil tbl
          '("tenant")
          (lambda (tenant) (equal? tenant 1))))
        (scan nil rs
          '()
          (lambda () true)
          '("$update")
          (lambda (update) (update))
          (lambda (acc ignored) acc)
          nil))
    expect:
      error: true
