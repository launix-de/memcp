# Isolated scheduling and one real sampler window exclude unrelated SQL/HTTP
# traffic; the burst is client requests, never rows or a synthetic counter write.
metadata:
  requires_tds: true
  isolated: true
  description: Real TDS query admissions contribute to the existing dashboard request-rate sampler
setup:
- scm: (sleep 11)
test_cases:
- name: Prior request traffic leaves the existing ten-second averaging window
  scm: (< (requests_per_second) 1)
  expect:
    result: true
- name: A burst uses distinct real wire query admissions
  tds:
    statements:
    - &id001
      sql: SELECT 17 AS counted
      expect:
        rows: 1
        data:
