- name: Match bindings retain both transaction and source producer ownership
  scm: |
    (begin
      (define source (list 'table "memcp-tests" false "scan_source_scope_missing" false 'tx))
      (define replacement (scheme "(lambda (database database_ic name name_ic context) context)"))
      (define code (list 'match (list 'list 42 replacement)
        (list 'list 'tx 'table) (list 'list source source)))
      (define expected (list 42 42))
      (define run (lambda (program optimized) (begin
        (define frame (list 'lambda (list 'tx) program))
        (define function (eval (if optimized (optimize frame) frame)))
        (try (lambda () (function nil))
          (lambda (cause) (list "error" (failure_value cause)))))))
      (define transformed (bind_invocation_scan_sources code))
      (and (expression_equal? (run code false) expected)
        (expression_equal? (run transformed false) expected)
        (expression_equal? (run transformed true) expected)))
  expect:
    result: true
- name: A local list constructor retains selection construction and its error
  scm: |
    (begin
      (define source (list 'table "memcp-tests" false "scan_source_scope_missing" false 'tx))
      (define selection (list 'list "schema" (list 'list "exact" "memcp-tests")))
      (define metadata (list 'information_schema_rows "information_schema" "tables" 'tx selection))
      (define replacement (scheme "(lambda args (error \"selector-list-shadow\"))"))
      (define code (list (list 'lambda (list 'list) (list list metadata metadata)) replacement))
      (define expected (list "error" "selector-list-shadow"))
      (define run (lambda (program optimized) (begin
        (define frame (list 'lambda (list 'tx) program))
        (define function (eval (if optimized (optimize frame) frame)))
        (try (lambda () (function nil))
          (lambda (cause) (list "error" (failure_value cause)))))))
      (define transformed (bind_invocation_scan_sources code))
      (and (expression_equal? (run code false) expected)
        (expression_equal? (run transformed false) expected)
        (expression_equal? (run transformed true) expected)))
  expect:
    result: true
