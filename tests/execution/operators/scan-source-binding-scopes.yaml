      (define code (list 'if false (list 'list source source) "safe"))
      (define expected "safe")
      (define run (lambda (program optimized) (begin
        (define frame (list 'lambda (list 'tx) program))
        (define function (eval (if optimized (optimize frame) frame)))
        (try (lambda () (function 42))
          (lambda (cause) (list "error" (failure_value cause)))))))
      (define transformed (bind_invocation_scan_sources code))
      (and (expression_equal? (run code false) expected)
        (expression_equal? (run transformed false) expected)
        (expression_equal? (run transformed true) expected)))
  expect:
    result: true
