metadata:
  isolated: true
  syntax: mysql
  description: Upper index ranges preserve the original scalar NULL rejection across SQL frontends
setup:
- sql: DROP TABLE IF EXISTS nullable_upper_range_rows
- sql: DROP TABLE IF EXISTS nullable_range_bounds
- sql: CREATE TABLE nullable_upper_range_rows(id INT PRIMARY KEY,v INT,label VARCHAR(12),text_key VARCHAR(8),day_key
    DATE,secondary_key INT)
- sql: INSERT INTO nullable_upper_range_rows VALUES(1,NULL,'missing',NULL,NULL,0)
- sql: INSERT INTO nullable_upper_range_rows SELECT 2,-2,'negative','a',CAST('2024-01-01' AS DATE),1
- sql: INSERT INTO nullable_upper_range_rows SELECT 3,0,'zero','a',CAST('2024-01-02' AS DATE),NULL
- sql: INSERT INTO nullable_upper_range_rows SELECT 4,2,'edge','b',CAST('2024-01-03' AS DATE),0
- sql: INSERT INTO nullable_upper_range_rows SELECT 5,7,'above','c',CAST('2024-01-04' AS DATE),0
- sql: INSERT INTO nullable_upper_range_rows SELECT 6,2,'duplicate','b',CAST('2024-01-03' AS DATE),2
- scm: (rebuild (table "memcp-tests" false "nullable_upper_range_rows" false nil) true true nil true)
- sql: INSERT INTO nullable_upper_range_rows VALUES(7,NULL,'delta-null',NULL,NULL,NULL)
- sql: INSERT INTO nullable_upper_range_rows SELECT 8,-1,'delta-low','a',CAST('2024-01-01' AS DATE),1
- sql: INSERT INTO nullable_upper_range_rows SELECT 9,4,'delta-high','c',CAST('2024-01-04' AS DATE),1
- sql: CREATE TABLE nullable_range_bounds(bound_id INT PRIMARY KEY,ceiling INT)
- sql: INSERT INTO nullable_range_bounds VALUES(1,NULL),(2,0),(3,2),(4,8)
test_cases:
- name: mysql Exclusive upper range rejects NULL
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE v<2 ORDER BY id
  expect:
    data:
    - {id: 2, v: -2, label: negative}
    - {id: 3, v: 0, label: zero}
    - {id: 8, v: -1, label: delta-low}
- name: mysql Inclusive upper range rejects NULL
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE v<=2 ORDER BY id
  expect:
    data:
    - {id: 2, v: -2, label: negative}
    - {id: 3, v: 0, label: zero}
    - {id: 4, v: 2, label: edge}
    - {id: 6, v: 2, label: duplicate}
    - {id: 8, v: -1, label: delta-low}
- name: mysql Reversed exclusive comparison rejects NULL
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE 2>v ORDER BY id
  expect:
    data:
    - {id: 2, v: -2, label: negative}
    - {id: 3, v: 0, label: zero}
    - {id: 8, v: -1, label: delta-low}
- name: mysql Reversed inclusive comparison rejects NULL
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE 2>=v ORDER BY id
  expect:
    data:
    - {id: 2, v: -2, label: negative}
    - {id: 3, v: 0, label: zero}
    - {id: 4, v: 2, label: edge}
    - {id: 6, v: 2, label: duplicate}
    - {id: 8, v: -1, label: delta-low}
- name: mysql Lower range keeps its non-NULL matches
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE v>=2 ORDER BY id
  expect:
    data:
    - {id: 4, v: 2, label: edge}
    - {id: 5, v: 7, label: above}
    - {id: 6, v: 2, label: duplicate}
    - {id: 9, v: 4, label: delta-high}
- name: mysql Bounded interval retains complete duplicates
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE v>=0 AND v<=2 ORDER BY id
  expect:
    data:
    - {id: 3, v: 0, label: zero}
    - {id: 4, v: 2, label: edge}
    - {id: 6, v: 2, label: duplicate}
- name: mysql An explicit OR preserves the requested NULL rows
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE v<2 OR v IS NULL ORDER BY id
  expect:
    data:
    - {id: 1, v: null, label: missing}
    - {id: 2, v: -2, label: negative}
    - {id: 3, v: 0, label: zero}
    - {id: 7, v: null, label: delta-null}
    - {id: 8, v: -1, label: delta-low}
- name: mysql A NULL bound matches no rows
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE v<NULL ORDER BY id
  expect:
    data: []
- name: mysql Text upper range rejects NULL
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE text_key<'b' ORDER BY id
  expect:
    data:
    - {id: 2, v: -2, label: negative}
    - {id: 3, v: 0, label: zero}
    - {id: 8, v: -1, label: delta-low}
- name: mysql Date upper range rejects NULL
  syntax: mysql
  sql: SELECT id,v,label FROM nullable_upper_range_rows WHERE day_key<CAST('2024-01-03' AS DATE) ORDER BY id
  expect:
    data:
    - {id: 2, v: -2, label: negative}
    - {id: 3, v: 0, label: zero}
    - {id: 8, v: -1, label: delta-low}
