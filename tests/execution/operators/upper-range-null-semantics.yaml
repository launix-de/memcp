- name: mysql Runtime < upper bounds preserve NULL and outer matches
  syntax: mysql
  sql: SELECT b.bound_id,b.ceiling AS upper_value,r.id,r.v,r.label FROM nullable_range_bounds b LEFT JOIN nullable_upper_range_rows
    r ON r.v<b.ceiling ORDER BY b.bound_id,r.id
  expect:
    data:
    - {bound_id: 1, upper_value: null, id: null, v: null, label: null}
    - {bound_id: 2, upper_value: 0, id: 2, v: -2, label: negative}
    - {bound_id: 2, upper_value: 0, id: 8, v: -1, label: delta-low}
    - {bound_id: 3, upper_value: 2, id: 2, v: -2, label: negative}
    - {bound_id: 3, upper_value: 2, id: 3, v: 0, label: zero}
    - {bound_id: 3, upper_value: 2, id: 8, v: -1, label: delta-low}
    - {bound_id: 4, upper_value: 8, id: 2, v: -2, label: negative}
    - {bound_id: 4, upper_value: 8, id: 3, v: 0, label: zero}
    - {bound_id: 4, upper_value: 8, id: 4, v: 2, label: edge}
