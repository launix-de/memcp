      (define relation (collate "unicode-string" false))
      (define schema (scan_access_schema
        (list (scan_boundary "range" "first_key" 0 -1 true false "unicode-string" true
          -1 '() relation "unicode-string:asc" false)) '() nil false '("first_key")))
      (define run (lambda ()
        (scan_order nil target schema (list nil) '("first_key")
          (lambda (first_key) (not (relation first_key nil)))
          '("first_key" "second_key")
          (list (collate "unicode-string" false) (collate "unicode-string" false))
          0 0 -1 '("id" "first_key" "second_key")
          (lambda (acc id first_key second_key) (append acc (list id first_key second_key)))
          '() false)))
      (map (produceN 3) (lambda (_sample) (run))))
  expect:
