    - *id001
    - *id001
- name: An equality prefix with an exclusive lower range retains all three sort axes
  scm: |-
    (begin
      (define target (table "memcp-tests" false "ordered_range_three" false nil))
      (define relation (collate "unicode-string" false))
      (define schema (scan_access_schema (list
        (scan_boundary "equal" "bucket" 0 0 true true "bin" false)
        (scan_boundary "range" "major_key" 1 2 false true
          "unicode-string" true -1 '() relation "unicode-string:asc" false))
        '() nil false '("bucket" "major_key")))
      (define run (lambda ()
        (scan_order nil target schema (list 1 "A" "B") '("bucket" "major_key")
          (lambda (bucket major_key) (and (equal? bucket 1) (and (relation "A" major_key) (not (relation "B" major_key)))))
          '("major_key" "suffix_key" "ordinal_key")
          (list relation (collate "unicode-string" true) (collate "bin" false))
          0 0 -1 '("id" "major_key" "suffix_key" "ordinal_key")
          (lambda (acc id major_key suffix_key ordinal_key)
            (append acc (list id major_key suffix_key ordinal_key)))
          '() false)))
      (map (produceN 3) (lambda (_sample) (run))))
  expect:
    result:
    - &id011
      - &id012
        - 5
        - B
        - Y
        - 2
      - &id013
        - 1
        - B
        - X
        - null
    - *id011
    - *id011
- name: An equality prefix with an exclusive upper range retains NULL and descending suffixes
  scm: |-
    (begin
      (define target (table "memcp-tests" false "ordered_range_three" false nil))
      (define relation (collate "unicode-string" false))
      (define schema (scan_access_schema (list
        (scan_boundary "equal" "bucket" 0 0 true true "bin" false)
        (scan_boundary "range" "major_key" 1 2 true false
          "unicode-string" true -1 '() relation "unicode-string:asc" false))
        '() nil false '("bucket" "major_key")))
      (define run (lambda ()
        (scan_order nil target schema (list 1 "A" "C") '("bucket" "major_key")
          (lambda (bucket major_key) (and (equal? bucket 1) (and (not (relation major_key "A")) (relation major_key "C"))))
          '("major_key" "suffix_key" "ordinal_key")
          (list relation (collate "unicode-string" true) (collate "bin" false))
          0 0 -1 '("id" "major_key" "suffix_key" "ordinal_key")
          (lambda (acc id major_key suffix_key ordinal_key)
            (append acc (list id major_key suffix_key ordinal_key)))
          '() false)))
      (map (produceN 3) (lambda (_sample) (run))))
  expect:
    result:
    - &id014
      - &id015
        - 3
        - A
        - Z
        - null
      - &id016
        - 4
        - A
        - Z
        - 1
      - &id017
        - 2
        - A
        - Z
        - 3
      - *id012
      - *id013
    - *id014
    - *id014
- name: An upper-only range after equality retains the complete three-axis order
  scm: |-
    (begin
      (define target (table "memcp-tests" false "ordered_range_three" false nil))
      (define relation (collate "unicode-string" false))
      (define schema (scan_access_schema (list
        (scan_boundary "equal" "bucket" 0 0 true true "bin" false)
        (scan_boundary "range" "major_key" -1 1 true true
          "unicode-string" true -1 '() relation "unicode-string:asc" false))
        '() nil false '("bucket" "major_key")))
      (define run (lambda ()
        (scan_order nil target schema (list 1 "B") '("bucket" "major_key")
          (lambda (bucket major_key) (and (equal? bucket 1) (not (relation "B" major_key))))
          '("major_key" "suffix_key" "ordinal_key")
          (list relation (collate "unicode-string" true) (collate "bin" false))
          0 0 -1 '("id" "major_key" "suffix_key" "ordinal_key")
          (lambda (acc id major_key suffix_key ordinal_key)
            (append acc (list id major_key suffix_key ordinal_key)))
          '() false)))
      (map (produceN 3) (lambda (_sample) (run))))
  expect:
    result:
    - &id018
      - *id015
      - *id016
      - *id017
      - *id012
      - *id013
    - *id018
    - *id018
cleanup:
- sql: DROP TABLE IF EXISTS ordered_range_three
- sql: DROP TABLE IF EXISTS ordered_range_ties
