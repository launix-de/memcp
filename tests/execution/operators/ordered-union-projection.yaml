metadata:
  description: Hidden UNION ALL order exports use delegated native branch producers
  syntax: tsql
  cluster:
    fixture: shared_analytics
    rows_per_shard: 5000
    shards: 64
    columns: 8
    nodes: 4
    gomaxprocs: 16
    ram_limit_bytes: 8388608
    coordinator_ram_limit_bytes: 131072
    shard_ram_percent: 50
    coordinator_shard_ram_percent: 1
    storage_backend: FakeRemote
    storage_bandwidth_mbps: 1000
    storage_latency_ms: 5
    cluster_bandwidth_mbps: 1000
    cluster_latency_ms: 0.1
test_cases:
- name: A projected delegated UNION bag keeps hidden order and one global window
  sql: |
    SELECT CASE WHEN u.id%2=0 THEN N'even' ELSE N'odd' END AS label
    FROM(SELECT id FROM big_items WHERE id<3 UNION ALL
      SELECT CAST(3 AS INT)AS id FROM information_schema.tables
      WHERE table_catalog=DB_NAME()AND table_name=N'big_items')AS u
    ORDER BY u.id OFFSET 1 ROWS FETCH NEXT 2 ROWS ONLY
  expect:
    rows: 2
    data: [{label: odd},{label: even}]
    cluster: {min_remote_shards: 1}
- name: A parameter used only in delegated hidden order stays a declared invocation input
  sql: |
    DECLARE @direction INT=-1;
    SELECT CASE WHEN u.id%2=0 THEN N'even' ELSE N'odd' END AS label
    FROM(SELECT id FROM big_items WHERE id<3 UNION ALL
      SELECT CAST(3 AS INT)AS id FROM information_schema.tables
      WHERE table_catalog=DB_NAME()AND table_name=N'big_items')AS u
    ORDER BY @direction*u.id OFFSET 1 ROWS FETCH NEXT 2 ROWS ONLY
  expect:
    rows: 2
    data: [{label: even},{label: odd}]
    cluster: {min_remote_shards: 1}
