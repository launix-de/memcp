- name: UNION branches with the same alias preserve independent source instances
  scm: |-
    (begin
      (define runtime (newsession)) (runtime "username" "root") (runtime "schema" "memcp-tests")
      (define planning (newsession))
      (define producer (lambda () (list (list (uuid)))))
      (define declaration (list "columns" (list (list "Field" "token" "RawType" "VARCHAR" "Dimensions" (list 36) "Null" false "Collation" "utf8mb4_general_ci")) "constraints" '("Unique" () "ForeignKeys" ())))
      (define source (lambda (alias) (list alias "memcp-tests" (list 'table-function producer '() (list "token")) false nil declaration)))
      (define column (lambda (alias name) (list 'get_column alias false name false)))
      (define query (lambda (sources fields) (make_query_block "memcp-tests" sources fields true nil nil nil nil nil nil nil nil)))
      (define combine (lambda (left right) (merge (list left right))))
      (define consumer (make_result_reduction combine (lambda () '()) combine))
      (define execute (lambda (statement) (sql_with_statement runtime nil 0 "runtime table source control"
        (lambda (tx) (begin
          (define code (build_reducing_queryplan_term statement consumer planning tx nil))
          (sql_execute_formula runtime tx (sql_queryplan_compile_formula tx code)
            (lambda (row) (list row)) (lambda (_fields) true)))))))
      (define branch (query (list (source "j")) (list "token" (column "j" "token"))))
      (define rows (execute (make_union_block 'all (list branch branch) nil nil nil '())))
      (and (equal? (count rows) 2) (not (equal? ((car rows) "token") ((cadr rows) "token"))))
    )
  expect:
    result: true
- name: Rebound stored producer trees do not share an invocation token
