- name: A lexical newsession callable retains captured argument lists after later invocations
  scm: |-
    (begin
      (define syntax (scheme "(lambda (newsession seed) (begin (eval (symbol \"newsession\")) ((newsession) (list seed (+ seed 1)))))"))
