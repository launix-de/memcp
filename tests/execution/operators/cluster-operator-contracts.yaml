- name: native-scoped-memory-reference-survives-delegated-scan
  # A delegated callback serializes the native table handle by catalog identity.
  # Its runtime declaration and MEMORY rows must reach the remote holder without
  # becoming backend recovery state or an evictable planner cache.
  scm: |
    (begin
      (define owner (newsession)) (define scope (new_relation_scope owner))
      (createtable "{database}" ".scope_remote"
        (list (list "column" "key" "INT" (list) (list)) (list "column" "value" "INT" (list) (list)))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (define source (table "{database}" false ".scope_remote" false nil))
      (insert source '("key" "value") (list (list 1 11)))
      (define result (scan nil (table "{database}" false "big_items" false nil) '() '()
        '("id") (lambda (id) (< id 3)) '("id")
        (lambda (acc id)
          (+ acc id (scan_lookup nil source
            (list 372734710317056 (scan_boundary "equal" "key" 0 0 true true "" false) "value")
            (list 1)))) 0 +))
      (close_relation_scope scope) result)
  expect:
    result: 36
    cluster:
      min_remote_shards: 1

