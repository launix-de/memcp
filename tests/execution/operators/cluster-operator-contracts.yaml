metadata:
  version: '1.0'
  description: SQL operator contracts on authenticated shared-storage cluster peers
  cluster:
    fixture: shared_analytics
    rows_per_shard: 5000
    shards: 64
    columns: 8
    fixture_seed: 20261026
    nodes: 4
    ram_limit_bytes: 8388608
    coordinator_ram_limit_bytes: 131072
    shard_ram_percent: 50
    coordinator_shard_ram_percent: 1
    gomaxprocs: 16
    # Conservative synthetic in-rack profile; CLI values can override it.
    cluster_bandwidth_mbps: 1000
    cluster_latency_ms: 0.1
    storage_backend: FakeRemote
    storage_bandwidth_mbps: 1000
    storage_latency_ms: 5
setup:
- sql: DROP TABLE IF EXISTS operator_insert_counts
- sql: CREATE TABLE operator_insert_counts(id INT PRIMARY KEY) ENGINE=memory
- sql: CREATE TABLE operator_join_probe(id INT NOT NULL PRIMARY KEY,peer_id INT,label VARCHAR(12)) ENGINE=memory
- sql: INSERT INTO operator_join_probe VALUES(245000,2,'entry'),(2,1,'grouped')
- sql: CREATE TABLE operator_large_text(id INT NOT NULL PRIMARY KEY,payload TEXT) ENGINE=memory
- sql: INSERT INTO operator_large_text VALUES(245000,'remote-text')
- scm: "(begin\n (eval (parse_sql \"replica_test\" \"DROP USER IF EXISTS permission_remote_reader\" nil))\n (eval (parse_sql \"replica_test\" \"CREATE USER permission_remote_reader IDENTIFIED BY 'pw'\" nil))\n (define s (newsession)) (s \"username\" \"root\") (s \"schema\" \"replica_test\")\n (eval (parse_sql \"replica_test\" \"GRANT ALL ON `replica_test`.* TO permission_remote_reader\" nil))\n (tsql_execute_request \"replica_test\" \"CREATE TABLE IF NOT EXISTS permission_metadata_probe(id NVARCHAR(7))\" s nil 0\n  (lambda (_row) true) (lambda fields true))\n (tsql_temporary_close s))"
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_shift_marker(@value INT) RETURNS INT AS BEGIN
          DECLARE @incremented INT=@value+3;
          SET @value=@incremented+2;
          RETURN @value;
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (define execute (lambda (text)
        (tsql_execute_request "replica_test" text s nil 0
          (lambda (_row) true) (lambda fields true))))
      (execute "CREATE TABLE operator_temporal_values(id INT PRIMARY KEY,first_instant DATETIME,second_instant DATETIME)")
      (execute "INSERT operator_temporal_values VALUES
        (245000,CONVERT(DATETIME,N'20250101',112),CONVERT(DATETIME,N'20250102',112)),
        (245001,CONVERT(DATETIME,N'20250103',112),CONVERT(DATETIME,N'20250102',112)),
        (245002,CONVERT(DATETIME,N'20250101',112),NULL)")
      (execute "CREATE FUNCTION dbo.remote_choose_branch(@first DATETIME,@second DATETIME) RETURNS DATETIME
        AS BEGIN
          DECLARE @chosen DATETIME;
          IF @first>@second BEGIN SET @chosen=@second; END
          ELSE BEGIN SET @chosen=@first; END
          RETURN @chosen;
        END")
      (execute "SET QUOTED_IDENTIFIER OFF")
      (execute "CREATE FUNCTION dbo.remote_branch_label(@value INT) RETURNS NVARCHAR(8)
        AS BEGIN IF @value%2=0 RETURN \"even\"; RETURN \"odd\"; END")
      (execute "SET QUOTED_IDENTIFIER ON")
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_repeat_marker(@count INT) RETURNS VARCHAR(4)
        AS BEGIN
          DECLARE @value VARCHAR(4)='';
          WHILE @count>0
          BEGIN
            SET @value=@value+'x';
            SET @count=@count-1;
          END
          RETURN @value;
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE PROCEDURE dbo.remote_catalog_proc AS SELECT 1 AS value"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_default_instant(@year SMALLINT,@month SMALLINT,@day SMALLINT=1) RETURNS DATETIME
        AS BEGIN
          DECLARE @text VARCHAR(10),@value DATETIME;
          SET @text='1.'+LTRIM(@month)+'.'+LTRIM(@year);
          SET @value=CONVERT(DATETIME,@text,104);
          IF @day>1 SET @value=DATEADD(day,@day-1,@value);
          RETURN @value;
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (define execute (lambda (text)
        (tsql_execute_request "replica_test" text s nil 0
          (lambda (_row) true) (lambda fields true))))
      (execute "CREATE VIEW dbo.operator_subtraction_days AS
        SELECT id,RIGHT(STR(id),2) AS day_text FROM big_items WHERE id>=245005 AND id<245008")
      (execute "CREATE VIEW dbo.operator_subtraction_bounds AS
        SELECT MIN(day_text-1) AS boundary FROM dbo.operator_subtraction_days")
      (execute "CREATE VIEW dbo.operator_subtraction_formatted AS
        SELECT LTRIM(STR(boundary)) AS boundary_text FROM dbo.operator_subtraction_bounds")
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_positive_calendar(@shift INT,@target DATETIME) RETURNS INT AS
        BEGIN
          DECLARE @origin DATETIME;
          SET @origin=+DATEADD(day,@shift,CONVERT(DATETIME,N'20000103',112));
          RETURN DATEDIFF(day,@origin,@target);
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (tsql_execute_request "replica_test" "SET LANGUAGE Deutsch; SET DATEFORMAT dmy" s nil 0
        (lambda (_row) true) (lambda fields true))
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_caller_calendar(@text VARCHAR(30)) RETURNS DATETIME AS
        BEGIN
          IF ISDATE(@text)=0 RETURN NULL;
          RETURN @text;
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession))
      (s "username" "root")
      (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_relational_label(@id INT) RETURNS VARCHAR(12) AS
        BEGIN
          DECLARE @label VARCHAR(12)='missing';
          SELECT @label=label FROM operator_join_probe WHERE id=@id;
          RETURN @label;
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession)) (s "username" "root") (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_iteration_sum(@start INT) RETURNS INT AS BEGIN
          DECLARE @current INT=@start;
          DECLARE @value INT;
          DECLARE @total INT=0;
          DECLARE @ticks INT=0;
          WHILE @ticks<2 BEGIN
            SELECT TOP 1 @value=id FROM big_items WHERE id=@current;
            SET @total=@total+ISNULL(@value,0);
            SET @current=@current-1;
            SET @ticks=@ticks+1;
          END
          RETURN @total;
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
- scm: |
    (begin
      (define s (newsession)) (s "username" "root") (s "schema" "replica_test")
      (tsql_execute_request "replica_test"
        "CREATE FUNCTION dbo.remote_local_sum(@value INT) RETURNS INT AS BEGIN
          DECLARE @rows TABLE(amount INT NULL);
          DECLARE @i INT=0;
          DECLARE @result INT;
          WHILE @i<2 BEGIN
            IF @value IS NOT NULL BEGIN
              INSERT INTO @rows(amount) SELECT @value;
            END
            SET @i=@i+1;
          END
          SELECT @result=SUM(amount) FROM @rows;
          RETURN @result;
        END"
        s nil 0 (lambda (_row) true) (lambda fields true))
      (tsql_temporary_close s))
cleanup:
- sql: DROP VIEW IF EXISTS operator_subtraction_formatted
- sql: DROP VIEW IF EXISTS operator_subtraction_bounds
- sql: DROP VIEW IF EXISTS operator_subtraction_days
- sql: DROP TABLE IF EXISTS operator_insert_counts
- sql: DROP TABLE IF EXISTS operator_join_probe
- sql: DROP TABLE IF EXISTS operator_large_text
- sql: DROP VIEW IF EXISTS operator_qualified_view
- scm: (eval (parse_sql "replica_test" "DROP USER IF EXISTS permission_remote_reader" nil))
- scm: (droptable "replica_test" "permission_metadata_probe" true)
- scm: (dropprocedure "replica_test" "remote_shift_marker" true)
- sql: DROP TABLE IF EXISTS operator_temporal_values
- scm: (dropprocedure "replica_test" "remote_choose_branch" true)
- scm: (dropprocedure "replica_test" "remote_branch_label" true)
- scm: (dropprocedure "replica_test" "remote_repeat_marker" true)
- scm: (dropprocedure "replica_test" "remote_catalog_proc" true)
- scm: (dropprocedure "replica_test" "remote_default_instant" true)
test_cases:
- name: TSQL forward GOTO retains delegated relational control predicates
  syntax: tsql
  sql: |-
    DECLARE @wanted INT=245000; GOTO selected_probe; SELECT * FROM unused_control_source; selected_probe: IF EXISTS(SELECT id FROM big_items WHERE id=@wanted) SELECT id FROM big_items WHERE id=@wanted ELSE SELECT 0 AS id
  expect:
    rows: 1
    data: [{id: 245000}]
    cluster: {min_remote_shards: 1}
- name: TSQL backward GOTO binds invocation values into delegated leaves
  syntax: tsql
  sql: |-
    DECLARE @wanted INT=0; repeat_probe: SET @wanted=@wanted+1; IF @wanted<2 GOTO repeat_probe; SELECT id FROM big_items WHERE id=@wanted
  expect:
    rows: 1
    data: [{id: 2}]
    cluster: {min_remote_shards: 1}
- name: A stored view declares qualified references to its native producer
  syntax: tsql
  sql: CREATE VIEW dbo.operator_qualified_view AS SELECT dbo.big_items.id AS id FROM dbo.big_items WHERE dbo.big_items.id=245000
- name: A restored qualified view uses the ordinary delegated native scan
  syntax: tsql
  sql: SELECT dbo.operator_qualified_view.id FROM dbo.operator_qualified_view
  expect:
    rows: 1
    data: [{id: 245000}]
    cluster: {min_remote_shards: 1}
- name: Remove the qualified view before the remaining operator checks
  syntax: tsql
  sql: DROP VIEW IF EXISTS dbo.operator_qualified_view
- name: A derived full-percent TOP preserves the delegated rows and consuming order
  syntax: tsql
  sql: SELECT d.id FROM (SELECT TOP 100 PERCENT id FROM dbo.big_items WHERE id IN(175000,245000) ORDER BY v7) AS d ORDER BY d.id DESC
  expect:
    rows: 2
    data: [{id: 245000},{id: 175000}]
    cluster: {min_remote_shards: 1}
- name: A parenthesized inner join retains native delegation and exposed aliases
  syntax: tsql
  sql: |
    SELECT b.id, p.label FROM (dbo.big_items AS b
      INNER JOIN dbo.operator_join_probe AS v ON b.id=v.id)
    INNER JOIN dbo.operator_join_probe AS p ON v.peer_id=p.id
    WHERE b.id=245000
  expect: {rows: 1,data: [{id: 245000,label: grouped}],cluster: {min_remote_shards: 1}}
- name: A nested LEFT JOIN preserves its complete null row while probing a delegated head
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid FROM dbo.operator_join_probe AS a
    LEFT JOIN dbo.operator_join_probe AS b LEFT JOIN dbo.big_items AS c
      ON b.id=c.id OR b.id IS NULL ON a.id=b.id AND b.id>100000
    ORDER BY a.id
  expect:
    rows: 2
    data: [{aid: 2,bid: null,cid: null},{aid: 245000,bid: 245000,cid: 245000}]
    cluster: {min_remote_shards: 1}
- name: A nested LEFT chain retains remote matches and the head presence for every child
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid,d.label
    FROM dbo.operator_join_probe AS a LEFT JOIN dbo.operator_join_probe AS b
      LEFT JOIN dbo.big_items AS c ON b.id=c.id OR b.id IS NULL
      LEFT JOIN dbo.operator_join_probe AS d ON d.id=b.peer_id OR c.id IS NULL
      ON a.id=b.id AND b.id>100000
    ORDER BY a.id
  expect:
    rows: 2
    data: [{aid: 2,bid: null,cid: null,label: null},
      {aid: 245000,bid: 245000,cid: 245000,label: grouped}]
    cluster: {min_remote_shards: 1}
- name: A delegated CASE keeps the large text common declaration
  syntax: tsql
  sql: |
    SELECT CASE WHEN b.id=245000 THEN t.payload ELSE '' END AS value
    FROM dbo.big_items AS b INNER JOIN dbo.operator_large_text AS t ON b.id=t.id
    WHERE b.id=245000
  expect: {rows: 1,data: [{value: remote-text}],cluster: {min_remote_shards: 1}}
- name: A delegated ISNULL truncates only to its declared first argument width
  syntax: tsql
  sql: |
    SELECT ISNULL(CAST(NULL AS VARCHAR(3)),t.payload) AS value
    FROM dbo.big_items AS b INNER JOIN dbo.operator_large_text AS t ON b.id=t.id
    WHERE b.id=245000
  expect: {rows: 1,data: [{value: rem}],cluster: {min_remote_shards: 1}}
- name: A complete nullable INNER operand retains its remote match and synthetic tuple
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid FROM dbo.operator_join_probe a
    LEFT JOIN dbo.operator_join_probe b INNER JOIN dbo.big_items c
      ON b.id=c.id AND c.id>100000 ON a.id=b.id
    ORDER BY a.id
  expect:
    rows: 2
    data: [{aid: 2,bid: null,cid: null},{aid: 245000,bid: 245000,cid: 245000}]
    cluster: {min_remote_shards: 1}
- name: Complete nullable operand counts combine remote partial states
  syntax: tsql
  sql: |
    SELECT COUNT(*) AS total,COUNT(b.id) AS heads,COUNT(c.id) AS children
    FROM dbo.operator_join_probe a LEFT JOIN dbo.operator_join_probe b INNER JOIN dbo.big_items c
      ON b.id=c.id AND c.id>100000 ON a.id=b.id
  expect:
    rows: 1
    data: [{total: 2,heads: 1,children: 1}]
    cluster: {min_remote_shards: 1}
- name: Native result sorting retains the invocation of a delegated joined producer
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid FROM dbo.operator_join_probe a
    LEFT JOIN dbo.operator_join_probe b INNER JOIN dbo.big_items c
      ON b.id=c.id AND c.id>100000 ON a.id=b.id
    ORDER BY c.id DESC,a.id
  expect:
    rows: 2
    data: [{aid: 245000,bid: 245000,cid: 245000},{aid: 2,bid: null,cid: null}]
    cluster: {min_remote_shards: 1}
- name: Chained RIGHT units preserve a delegated earlier relation and whole missing tuples
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid FROM dbo.big_items a
    RIGHT JOIN dbo.operator_join_probe b ON a.id=b.id AND a.id>100000
    RIGHT JOIN dbo.operator_join_probe c ON b.id=c.id ORDER BY c.id
  expect:
    rows: 2
    data: [{aid: null,bid: 2,cid: 2},{aid: 245000,bid: 245000,cid: 245000}]
    cluster: {min_remote_shards: 1}
- name: An uncertified nested LEFT retains the complete delegated nullable unit
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid FROM dbo.operator_join_probe a
    LEFT JOIN dbo.operator_join_probe b LEFT JOIN dbo.big_items c ON b.id=c.id
      ON a.id=b.id AND c.id>100000 ORDER BY a.id
  expect:
    rows: 2
    data: [{aid: 2,bid: null,cid: null},{aid: 245000,bid: 245000,cid: 245000}]
    cluster: {min_remote_shards: 1}
- name: Unicode aliases and wire names survive delegated native execution
  syntax: tsql
  sql: SELECT данные.id AS Größe FROM dbo.big_items AS данные WHERE данные.id=245000
  expect:
    rows: 1
    data: [{Größe: 245000}]
    cluster: {min_remote_shards: 1}
- name: Recursive nullable operands preserve delegated match and complete child extension
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,d.id AS did,c.id AS cid,e.id AS eid
    FROM dbo.operator_join_probe a LEFT JOIN dbo.operator_join_probe b
      LEFT JOIN dbo.operator_join_probe d ON b.peer_id=d.id
      LEFT JOIN dbo.operator_join_probe c LEFT JOIN dbo.big_items e ON c.id=e.id
        ON b.id=c.id AND e.id>100000 ON a.id=b.id
    ORDER BY a.id
  expect:
    rows: 2
    data: [{aid: 2,bid: 2,did: null,cid: null,eid: null},
      {aid: 245000,bid: 245000,did: 2,cid: 245000,eid: 245000}]
    cluster: {min_remote_shards: 1}
- name: Recursive nullable reducers combine delegated whole-operand counts
  syntax: tsql
  sql: |
    SELECT COUNT(*) AS total,COUNT(b.id) AS heads,COUNT(d.id) AS details,
      COUNT(c.id) AS children,COUNT(e.id) AS extras
    FROM dbo.operator_join_probe a LEFT JOIN dbo.operator_join_probe b
      LEFT JOIN dbo.operator_join_probe d ON b.peer_id=d.id
      LEFT JOIN dbo.operator_join_probe c LEFT JOIN dbo.big_items e ON c.id=e.id
        ON b.id=c.id AND e.id>100000 ON a.id=b.id
  expect:
    rows: 1
    data: [{total: 2,heads: 2,details: 1,children: 1,extras: 1}]
    cluster: {min_remote_shards: 1}
- name: RIGHT INNER clouds retain delegated nullable leaf values and complete preserved tuples
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid,d.id AS did,f.id AS fid
    FROM dbo.operator_join_probe a INNER JOIN dbo.operator_join_probe b ON a.id=b.id
      INNER JOIN dbo.big_items c ON b.id=c.id AND c.id>100000
    RIGHT JOIN dbo.operator_join_probe d INNER JOIN dbo.operator_join_probe e ON d.id=e.id
      INNER JOIN dbo.operator_join_probe f ON e.id=f.id ON a.id=d.id AND c.id=f.id
    ORDER BY d.id
  expect:
    rows: 2
    data: [{aid: null,bid: null,cid: null,did: 2,fid: 2},
      {aid: 245000,bid: 245000,cid: 245000,did: 245000,fid: 245000}]
    cluster: {min_remote_shards: 1}
- name: RIGHT INNER cloud reducers combine complete delegated matches
  syntax: tsql
  sql: |
    SELECT COUNT(*) AS total,COUNT(a.id) AS left_heads,COUNT(c.id) AS left_children,COUNT(f.id) AS right_children
    FROM dbo.operator_join_probe a INNER JOIN dbo.operator_join_probe b ON a.id=b.id
      INNER JOIN dbo.big_items c ON b.id=c.id AND c.id>100000
    RIGHT JOIN dbo.operator_join_probe d INNER JOIN dbo.operator_join_probe e ON d.id=e.id
      INNER JOIN dbo.operator_join_probe f ON e.id=f.id ON a.id=d.id AND c.id=f.id
  expect:
    rows: 1
    data: [{total: 2,left_heads: 1,left_children: 1,right_children: 2}]
    cluster: {min_remote_shards: 1}
- name: Declared legacy temporal day arithmetic runs inside delegated callbacks
  syntax: tsql
  sql: |
    SELECT CONVERT(VARCHAR(30),CAST(N'2026-01-03T12:00:00.003' AS DATETIME)
      -CAST(id-244999 AS INT),121) AS value FROM dbo.big_items WHERE id=245000
  expect:
    rows: 1
    data: [{value: '2026-01-02 12:00:00.003'}]
    cluster: {min_remote_shards: 1}
- name: Delegated CASE arithmetic retains its calendar contract through grouped reduction
  syntax: tsql
  sql: |
    SELECT CAST(id-245000 AS INT) AS bucket,SUM(DATEDIFF(day,CAST(N'2026-01-01' AS DATETIME),
      CASE WHEN id=245000 THEN CAST(N'2026-01-05' AS DATETIME)-CAST(id-244999 AS INT)
        ELSE DATEADD(day,1,CAST(N'2026-01-01' AS DATETIME)) END)) AS total
    FROM dbo.big_items WHERE id IN(245000,245001) GROUP BY CAST(id-245000 AS INT) ORDER BY bucket
  expect:
    rows: 2
    data: [{bucket: 0,total: 3},{bucket: 1,total: 1}]
    cluster: {min_remote_shards: 1}
- name: Delegated numeric calendar fields preserve default and explicit style ordering
  syntax: tsql
  sql: |
    SELECT CONVERT(VARCHAR(30),CONVERT(DATETIME,STR(CAST(id-244999 AS INT))+'.'+STR(2)+'.'+STR(2026)),121) AS default_value,
      CONVERT(VARCHAR(30),CONVERT(DATETIME,STR(CAST(id-244999 AS INT))+'.'+STR(2)+'.'+STR(2026),104),121) AS styled_value
    FROM dbo.big_items WHERE id=245000
  expect:
    rows: 1
    data: [{default_value: '2026-01-02 00:00:00.000',styled_value: '2026-02-01 00:00:00.000'}]
    cluster: {min_remote_shards: 1}
- name: Delegated STR retains its closed rounding and field-width helpers
  syntax: tsql
  sql: |
    SELECT id,STR(CAST(id-245001 AS FLOAT)*1.25,5,1) AS rounded,
      STR(CAST(id AS FLOAT),2,0) AS overflowed
    FROM dbo.big_items WHERE id IN(245000,245001,245002) ORDER BY id
  expect:
    rows: 3
    data: [{id: 245000,rounded: ' -1.3',overflowed: '**'},
      {id: 245001,rounded: '  0.0',overflowed: '**'},
      {id: 245002,rounded: '  1.3',overflowed: '**'}]
    cluster: {min_remote_shards: 1}
- name: INNER over a mixed nullable operand retains delegated complete matches
  syntax: tsql
  sql: |
    SELECT a.id AS aid,b.id AS bid,c.id AS cid,e.id AS eid FROM dbo.operator_join_probe a
    INNER JOIN dbo.operator_join_probe b INNER JOIN dbo.big_items c ON b.id=c.id AND c.id>100000
      LEFT JOIN dbo.operator_join_probe e ON c.id=e.id AND e.id=2 ON a.id=b.id
  expect:
    rows: 1
    data: [{aid: 245000,bid: 245000,cid: 245000,eid: null}]
    cluster: {min_remote_shards: 1}
- name: Delegated mixed INNER operand reducers never synthesize unmatched heads
  syntax: tsql
  sql: |
    SELECT COUNT(*) AS total,COUNT(c.id) AS children,COUNT(e.id) AS extras
    FROM dbo.operator_join_probe a INNER JOIN dbo.operator_join_probe b
      INNER JOIN dbo.big_items c ON b.id=c.id AND c.id>100000
      LEFT JOIN dbo.operator_join_probe e ON c.id=e.id AND e.id=2 ON a.id=b.id
  expect:
    rows: 1
    data: [{total: 1,children: 1,extras: 0}]
    cluster: {min_remote_shards: 1}
- name: UNION numeric widening compiles delegated calendar CASE in its branch scope
  syntax: tsql
  sql: |
    SELECT CAST(id AS INT) AS id,CAST(4 AS FLOAT) AS quantity FROM dbo.big_items WHERE id=245000
    UNION ALL SELECT CAST(id AS INT),CASE WHEN id=245001 THEN DATEDIFF(day,
