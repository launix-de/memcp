# Calendar probes require the original rows 0..2, before the remote DELETE cases.
- name: Subsecond native calendar captures retain their values on delegated workers
  scm: |
    (begin
      (define first (parse_date "9999-12-31 23:59:59.1234567"))
      (define second (parse_date "9999-12-31 23:59:59.1234568"))
      (scan nil (table "{database}" false "big_items" false nil) '() '()
        '("id") (lambda (id) (< id 3)) '("id")
        (close_procedure (lambda (total id)
          (if (and (< first second) (not (equal? first second))
              (equal? (cadr (date_parts first)) 123456700)
              (equal? (cadr (date_parts second)) 123456800))
            (+ total 1) (error "delegated calendar capture lost its fractional clock")))) 0 +))
  expect: {result: 3, cluster: {min_remote_shards: 1}}
- name: Worker-created native calendar values retain nanoseconds in mapped arrays
  scm: |
    (scan nil (table "{database}" false "big_items" false nil) '() '()
      '("id") (lambda (id) (< id 3)) '("id")
      (lambda (total id) (begin
        (define clocks (map '(0 1 2) (lambda (offset)
          (date_from_parts 253402300799 (+ 100 id offset) 0))))
        (if (and (< (car clocks) (cadr clocks)) (< (cadr clocks) (nth clocks 2)))
          (+ total (cadr (date_parts (car clocks))))
          (error "worker calendar array lost subsecond precision")))) 0 +)
  expect: {result: 303, cluster: {min_remote_shards: 1}}

