        (list (list "column" "key" "INT" (list) (list "properties" (list "client.marker" 11))))
        (list "engine" "memory" "ephemeral" true "scope" scope) false nil)
      (define source (table "{database}" false ".properties_remote" false nil))
      (define result (scan nil (table "{database}" false "big_items" false nil) '() '()
