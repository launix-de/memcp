# Commit correctness needs transaction participants across all 64 shards, not
# another 32k-row throughput run. Change 32 rows per shard here so the race +
# FakeRemote scenario has headroom below the hard five-second correctness gate.
# The preceding rollback and autocommit cases retain their 32k-row bulk workload.
- name: distributed-acid-update-begin
  session_id: cluster-acid-commit
  sql: START ACID TRANSACTION
- name: distributed-acid-update
