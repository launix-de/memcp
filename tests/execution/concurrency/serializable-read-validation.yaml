- name: Serialization classification uses native type rather than a matching string
  scm: |
    (begin
      (define session (newsession)) (session "username" "root") (tx_begin_acid session)
      (try (lambda () (begin
        (define tx (session "__memcp_tx")) (tx_serializable tx)
        (define target (table "memcp-tests" false "serial_read_rows" false tx))
        (scan tx target '() '() '() (lambda () true) '() (lambda (acc) (+ acc 1)) 0 +)
        (insert target '("id" "value") (list (list 4 40)))
        (define failure (try (lambda () (begin (tx_commit session) nil)) (lambda (failure) failure)))
        (tx_rollback session)
        (and (transaction_serialization_failure? failure)
          (not (transaction_serialization_failure? "serializable read changed; retry transaction")))))
        (lambda (failure) (begin (tx_rollback session) (error failure)))))
  expect: {result: true}
- name: Serializable ownership preserves a newly created native table and key through commit
  scm: |
    (begin
      (define session (newsession)) (session "username" "root") (tx_begin_acid session)
      (try (lambda () (begin
        (define tx (session "__memcp_tx")) (tx_serializable tx)
        (createtable "memcp-tests" "serial_read_created_commit"
          (list (list "column" "id" "INT" (list) (list))) (list "engine" "safe") false tx)
        (define target (table "memcp-tests" false "serial_read_created_commit" false tx))
        (createkey target "PRIMARY" true '("id") tx)
        (define empty_before (table_empty? tx target))
        (insert target '("id") (list (list 7)) '() nil false nil tx)
        (define own (scan tx target '() '() '() (lambda () true) '("id") (lambda (acc id) (+ acc id)) 0 +))
        (tx_commit session)
        (and empty_before (equal? own 7)
          (equal? (scan nil target '() '() '() (lambda () true) '("id") (lambda (acc id) (+ acc id)) 0 +) 7))))
        (lambda (failure) (begin (tx_rollback session) (error failure)))))
  expect: {result: true}
- name: Serializable rollback retires its new table and staged key through the catalog owner
  scm: |
    (begin
      (define session (newsession)) (session "username" "root") (tx_begin_acid session)
      (try (lambda () (begin
        (define tx (session "__memcp_tx")) (tx_serializable tx)
        (createtable "memcp-tests" "serial_read_created_rollback"
          (list (list "column" "id" "INT" (list) (list))) (list "engine" "safe") false tx)
        (define target (table "memcp-tests" false "serial_read_created_rollback" false tx))
        (createkey target "PRIMARY" true '("id") tx)
        (insert target '("id") (list (list 9)) '() nil false nil tx)
        (define own (scan tx target '() '() '() (lambda () true) '("id") (lambda (acc id) (+ acc id)) 0 +))
        (tx_rollback session)
        (and (equal? own 9) (nil? (table "memcp-tests" false "serial_read_created_rollback" false nil)))))
        (lambda (failure) (begin (tx_rollback session) (error failure)))))
  expect: {result: true}
- name: Rollback-only admission cannot be reset by enabling serializable reads
  scm: |
    (begin
      (define session (newsession)) (session "username" "root") (tx_begin_acid session)
      (try (lambda () (begin
        (define tx (session "__memcp_tx"))
        (define target (table "memcp-tests" false "serial_read_doomed" false tx))
        (insert target '("id" "value") (list (list 1 99)) '() nil false nil tx)
        (try (lambda () (with_query_request session nil 0 "controlled scalar failure" "acid"
          (lambda (statement) (statement "controlled scalar failure" false (lambda (tx) (error "controlled"))
            (lambda (failure completion) "rollback-only"))))) (lambda (failure) true))
        (define denied (try (lambda () (begin (tx_serializable tx) false))
          (lambda (failure) (transaction_rollback_only_failure? failure))))
        (define own (scan tx target '() '() '() (lambda () true) '("value") (lambda (acc value) (+ acc value)) 0 +))
        (define state (tx_state tx)) (tx_rollback session)
        (and denied (equal? state "rollback-only") (equal? own 99) (table_empty? nil target))))
        (lambda (failure) (begin (tx_rollback session) (error failure)))))
  expect: {result: true}
- name: Serialization failure cannot be preserved by a scalar statement failure policy
  scm: |
    (begin
      (define session (newsession)) (session "username" "root") (tx_begin_acid session)
      (try (lambda () (begin
        (define tx (session "__memcp_tx")) (tx_serializable tx)
        (define target (table "memcp-tests" false "serial_read_policy" false tx))
        (insert target '("id" "value") (list (list 2 20)) '() nil false nil tx)
        (define own (scan tx target '() '() '() (lambda () true) '("value") (lambda (acc value) (+ acc value)) 0 +))
        (insert target '("id" "value") (list (list 3 30)))
        (define callbacks (newsession)) (callbacks "calls" 0)
        (define denied (try (lambda () (begin
          (with_query_request session nil 0 "changed serializable read" "acid" (lambda (statement)
            (statement "changed serializable read" false (lambda (tx)
              (scan tx target '() '() '() (lambda () true) '("value") (lambda (acc value) (+ acc value)) 0 +))
              (lambda (failure completion) (begin (callbacks "calls" (+ (callbacks "calls") 1)) "preserve"))))) false))
          (lambda (failure) (transaction_serialization_failure? failure))))
        (define state (tx_state tx)) (tx_rollback session)
        (and denied (equal? own 30) (equal? state "aborted") (equal? (callbacks "calls") 0)
          (equal? (scan nil target '() '() '() (lambda () true) '("value") (lambda (acc value) (+ acc value)) 0 +) 40))))
        (lambda (failure) (begin (tx_rollback session) (error failure)))))
  expect: {result: true}

- name: Failure annotations cannot hide mandatory serialization rollback from a preserve policy
  scm: |
    (begin
      (define session (newsession)) (session "username" "root") (tx_begin_acid session)
      (try (lambda () (begin
        (define tx (session "__memcp_tx")) (tx_serializable tx)
        (define target (table "memcp-tests" false "serial_read_policy" false tx))
        (insert target '("id" "value") (list (list 4 40)) '() nil false nil tx)
        (scan tx target '() '() '() (lambda () true) '("value") (lambda (acc value) (+ acc value)) 0 +)
        (insert target '("id" "value") (list (list 5 50)))
        (define callbacks (newsession)) (callbacks "calls" 0)
        (define denied (try (lambda () (begin
          (with_query_request session nil 0 "annotated changed read" "acid" (lambda (statement)
            (statement "annotated changed read" false (lambda (tx)
              (try (lambda ()
                (scan tx target '() '() '() (lambda () true) '("value") (lambda (acc value) (+ acc value)) 0 +))
                (lambda (failure) (error (failure_annotate failure "phase" "language")))))
              (lambda (_failure _completion) (begin (callbacks "calls" (+ (callbacks "calls") 1)) "preserve"))))) false))
          (lambda (failure) (transaction_serialization_failure? failure))))
        (define state (tx_state tx)) (tx_rollback session)
        (and denied (equal? state "aborted") (equal? (callbacks "calls") 0)
          (equal? (scan nil target '() '() '() (lambda () true) '("value") (lambda (acc value) (+ acc value)) 0 +) 90))))
        (lambda (failure) (begin (tx_rollback session) (error failure)))))
  expect: {result: true}

- name: Native ordered joins retain logical witnesses for inner changes
  scm: |
    (begin
      (define session (newsession)) (session "username" "root") (tx_begin_acid session)
      (try (lambda () (begin
        (define tx (session "__memcp_tx")) (tx_serializable tx)
        (define left (table "memcp-tests" false "serial_read_join_left" false tx))
        (define right (table "memcp-tests" false "serial_read_join_right" false tx))
        (define inputs (list left right))
        (define joined (lambda (owner)
          (scan_join_order owner inputs (map inputs (lambda (_) (list 369435906932736))) '()
            (list '() '()) (list (lambda () true) (lambda () true))
            (list (list (list 0 "id" "id"))) (list) nil
            (list (list 0 "id")) (list <) 0 0 -1
            (list (list 0 "value") (list 1 "value"))
            (lambda (acc l r) (+ acc l r)) 0)))
        (define before (joined tx))
        (scan nil right '() '() '() (lambda () true) '("$update") (lambda (acc update) (begin (update '("value" 23)) (+ acc 1))) 0 +)
        (define denied (try (lambda () (begin (tx_commit session) false))
          (lambda (failure) (transaction_serialization_failure? failure))))
        (tx_rollback session)
        (and (equal? before 30) denied (equal? (joined nil) 33))))
        (lambda (failure) (begin (tx_rollback session) (error failure)))))
  expect: {result: true}

