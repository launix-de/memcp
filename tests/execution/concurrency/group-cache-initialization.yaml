metadata:
  version: "1.0"
  description: "Concurrent callers wait for cold canonical group-cache initialization"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS `.creation_barrier`"
  - sql: "DROP TABLE IF EXISTS `.transactionless_cache_init`"
  - sql: "DROP TABLE IF EXISTS aggregate_source"
  - sql: |
      CREATE TABLE aggregate_source (
        id INT PRIMARY KEY,
        nullable_key INT,
        value DECIMAL(12,2)
      )

test_cases:
  - name: "Internal cache initialization needs no client query session"
    scm: |
      (begin
        (define cache
          (createtable
            "memcp-tests"
            ".transactionless_cache_init"
            (list (list "column" "id" "int" (list) (list)))
            (list "engine" "cache")
            true nil))
        (initialize_cache_table nil
          (table "memcp-tests" ".transactionless_cache_init")
          (list (table "memcp-tests" "aggregate_source"))
          (lambda () true)
          (lambda ()
            (insert
              (table "memcp-tests" ".transactionless_cache_init")
              (list "id")
              (list (list 1))
              (list)
              (lambda () true)
              false nil nil)))
        (scan nil
          (table "memcp-tests" ".transactionless_cache_init")
          (list) (lambda () true)
          (list) (lambda () 1)
          + 0))
    expect:
      data: [1]

  - name: "Duplicate logical stage IDs retain every aggregate extension"
    scm: |
      (begin
        (define narrow (make_group_stage "shared-window-carrier"
          (list "src" "memcp-tests" "aggregate_source" false nil)
          (list) (list 1) (list "count-aggregate") nil
          (list "count" "count-expression") (list) nil nil
          (list (list (quote merge-aggregate-extensions) true))))
        (define extended (make_group_stage "shared-window-carrier"
          (list "src" "memcp-tests" "aggregate_source" false nil)
          (list) (list 1) (list "count-aggregate" "sum-aggregate") nil
          (list "count" "count-expression" "sum" "sum-expression") (list) nil nil
          (list (list (quote merge-aggregate-extensions) true))))
        (define retained (unique_stages_by_id (list narrow extended)))
        (if (and (equal? (count retained) 1)
            (equal? (count (gs_aggregates (car retained))) 2))
          true
          (error "deduplicating a shared stage discarded aggregate columns")))

  - name: "Same stage ID does not merge unrelated aggregate variants"
    scm: |
      (begin
        (define retained (make_group_stage "canonical-scalar-carrier"
          (list "first" "memcp-tests" "aggregate_source" false nil)
          (list "first-domain") (list 1) (list "count-aggregate") nil
          (list "count" "count-expression") (list) 1 nil (list)))
        (define alias_variant (make_group_stage "canonical-scalar-carrier"
          (list "first" "memcp-tests" "aggregate_source" false nil)
          (list "first-domain") (list 1) (list "sum-aggregate") nil
          (list "sum" "sum-expression") (list) 1 nil (list)))
        (define stages (unique_stages_by_id (list retained alias_variant)))
        (if (and (equal? (count stages) 1)
            (equal? (gs_input (car stages)) (gs_input retained))
            (equal? (gs_aggregates (car stages)) (gs_aggregates retained)))
          true
          (error "deduplicating an alias variant changed the scalar carrier contract")))

  - name: "Creator waits for existing table initialization 1/2"
    parallel: existing_creation_barrier
    scm: &create_with_initializer |
      (begin
        (createtable
          "memcp-tests"
          ".creation_barrier"
          (list (list "column" "id" "int" (list) (list)))
          (list "engine" "memory" "oninit"
            (lambda ()
              (begin
                (sleep 0.2)
                (insert
                  (table "memcp-tests" ".creation_barrier")
                  (list "id")
                  (list (list 1))
                  (list)
                  (lambda () true)
                  false))))
          true)
        (if (table_empty? (table "memcp-tests" ".creation_barrier"))
          (error "createtable returned before oninit completed")
          true))

  - name: "Creator waits for existing table initialization 2/2"
    parallel: existing_creation_barrier
    scm: *create_with_initializer

  - name: "Initializer ran exactly once"
    sql: "SELECT COUNT(*) AS marker_count FROM `.creation_barrier`"
    expect:
      rows: 1
      data:
        - marker_count: 1

  - name: "Cold aggregate caller 1/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: &empty_sum
      rows: 1
      data:
        - total: null

  - name: "Cold aggregate caller 2/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 3/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 4/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 5/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 6/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 7/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 8/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 9/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 10/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 11/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Cold aggregate caller 12/12"
    parallel: cold_group_cache
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

  - name: "Warm aggregate remains usable"
    sql: "SELECT SUM(value) AS total FROM aggregate_source WHERE nullable_key = NULL"
    expect: *empty_sum

cleanup:
  - sql: "DROP TABLE IF EXISTS `.creation_barrier`"
  - sql: "DROP TABLE IF EXISTS `.transactionless_cache_init`"
  - sql: "DROP TABLE IF EXISTS aggregate_source"
