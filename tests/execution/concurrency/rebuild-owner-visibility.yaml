- name: Joined native writes and rebuilds retain exact private rows and commit once
  timeout: 10
  scm: |
    (begin
      (define name "rebuild_concurrent_writes")
      (createtable "memcp-tests" name
        (list (list "column" "id" "INT" (list) (list))
          (list "column" "value" "INT" (list) (list))
          (list "unique" "primary" (list "id"))) (list "engine" "memory"))
      (define target (table "memcp-tests" false name false nil))
      (define read_rows (lambda (context)
        (sort (scan context target (list) (list) (list) (lambda () true)
          (list "id" "value") (lambda (acc id value) (append acc (list id value)))
          (list) (lambda (left right) (merge (list left right))) false)
          (lambda (left right) (< (car left) (car right))))))
      (define owner (newsession))
      (owner "username" "root") (owner "schema" "memcp-tests")

      (tx_begin_acid owner)
      (define tx (owner "__memcp_tx"))
      (define put (lambda (id value)
        (insert target (list "id" "value") (list (list id value)) (list "$update")
          (lambda (update) (update (list "value" value))) false nil tx)))
      (define remove (lambda (key)
        (scan tx target (list) (list) (list "id") (lambda (id) (equal? id key))
          (list "$update") (lambda (acc update) (begin (update) nil))
          nil (lambda (left right) nil) false)))
      (try (lambda () (begin
        (insert target (list "id" "value")
          (map (produceN 64) (lambda (key) (list key key))) (list) nil false nil tx)
        (parallel
          (reduce (produceN 8) (lambda (ignored index) (rebuild target true false)) nil)
          (reduce (produceN 64) (lambda (ignored key) (put key (+ key 100))) nil))
        (define expected (map (produceN 64) (lambda (key) (list key (+ key 100)))))
        (define private (and (equal? (read_rows tx) expected) (equal? (read_rows nil) (list))))
        (tx_commit owner)
        (define result (and private (equal? (read_rows nil) expected)))
        result))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect:
    result: true
