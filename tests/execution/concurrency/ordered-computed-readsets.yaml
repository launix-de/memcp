metadata:
  description: Ordered computed projections invalidate on payload and ordering mutations
  isolated: true
setup:
- sql: CREATE TABLE ocr_parent(id INT PRIMARY KEY)
- sql: CREATE TABLE ocr_child(id INT PRIMARY KEY,owner_id INT,sort_key INT,weight INT,payload INT)
- sql: INSERT INTO ocr_parent VALUES(1),(2)
- sql: INSERT INTO ocr_child VALUES(1,1,1,1,10),(2,1,2,2,20),(3,2,1,1,30)
test_cases:
- name: Install ordinary and computed ordering callbacks without request captures
  scm: "(begin\n (createcolumn (table \"memcp-tests\" false \"ocr_parent\" false nil) \"selected\" \"int\"\
    \ '() '(\"temp\" true) '(\"id\")\n  (close_procedure (lambda (id) (scan_order nil (table \"memcp-tests\"\
    \ false \"ocr_child\" false nil)\n '() '() '(\"owner_id\") (lambda (owner_id) (equal? owner_id id))\n '(\"\
    sort_key\") '(<) 0 0 1 '(\"payload\")\n (lambda (acc payload) payload) nil false nil '() nil))))\n (createcolumn\
    \ (table \"memcp-tests\" false \"ocr_parent\" false nil) \"weighted\" \"int\" '() '(\"temp\" true) '(\"\
    id\")\n  (close_procedure (lambda (id) (scan_order nil (table \"memcp-tests\" false \"ocr_child\" false\
    \ nil)\n '() '() '(\"owner_id\") (lambda (owner_id) (equal? owner_id id))\n (list (lambda (weight) (- 0\
    \ weight))) '(<) 0 0 1 '(\"payload\")\n (lambda (acc payload) payload) nil false nil '() nil))))\n true)"
  expect:
    result: true
- name: Both cached ordered projections read their actual payload
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 10
      weighted: 20
    - id: 2
      selected: 30
      weighted: 30
- name: Changing only a projected source field invalidates the cached payload
  setup:
  - sql: UPDATE ocr_child SET payload=11 WHERE id=1
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 11
      weighted: 20
    - id: 2
      selected: 30
      weighted: 30
- name: Changing only a literal ordering field reselects the cached row
  setup:
  - sql: UPDATE ocr_child SET sort_key=0 WHERE id=2
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 20
      weighted: 20
    - id: 2
      selected: 30
      weighted: 30
- name: A computed ordering callback retains its source dependency
  setup:
  - sql: UPDATE ocr_child SET weight=5 WHERE id=1
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 20
      weighted: 11
    - id: 2
      selected: 30
      weighted: 30
- name: A projected NULL update replaces a formerly nonNULL cached value
  setup:
  - sql: UPDATE ocr_child SET payload=NULL WHERE id=1
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 20
      weighted: null
    - id: 2
      selected: 30
      weighted: 30
- name: Deleting the selected row restores the remaining ordered row
  setup:
  - sql: DELETE FROM ocr_child WHERE id=1
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 20
      weighted: 20
    - id: 2
      selected: 30
      weighted: 30
- name: An inserted earlier row invalidates both selections
  setup:
  - sql: INSERT INTO ocr_child VALUES(4,1,-1,8,40)
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 40
      weighted: 40
    - id: 2
      selected: 30
      weighted: 30
- name: Rebuild preserves payload and sort dependency invalidation
  setup:
  - scm: (rebuild)
  - sql: UPDATE ocr_child SET payload=41 WHERE id=4
  sql: SELECT id, selected, weighted FROM ocr_parent ORDER BY id
  expect:
    rows: 2
    data:
    - id: 1
      selected: 41
      weighted: 41
    - id: 2
      selected: 30
      weighted: 30
cleanup:
- sql: DROP TABLE IF EXISTS ocr_parent
- sql: DROP TABLE IF EXISTS ocr_child
