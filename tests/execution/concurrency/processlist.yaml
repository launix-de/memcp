# SHOW [FULL] PROCESSLIST and KILL QUERY

metadata:
  scan_debugging: true
  version: "1.0"
  description: "SHOW PROCESSLIST lists active sessions; KILL QUERY cancels a running query"

test_cases:
  - name: "SHOW PROCESSLIST parses and executes without error"
    sql: "SHOW PROCESSLIST"

  - name: "SHOW FULL PROCESSLIST parses and executes without error"
    sql: "SHOW FULL PROCESSLIST"

  - name: "KILL QUERY with unknown id completes without error"
    sql: "KILL QUERY 999999999"

  - name: "KILL CONNECTION with unknown id completes without error"
    sql: "KILL CONNECTION 999999999"

  # ── column structure ───────────────────────────────────────────────────────

  - name: "SHOW PROCESSLIST returns expected column names"
    sql: "SHOW PROCESSLIST"
    expect:
      contains:
        - "Id"
        - "User"
        - "Command"
        - "Time"
        - "State"
        - "Info"

  - name: "SHOW PROCESSLIST includes the running query itself"
    sql: "SHOW PROCESSLIST"
    expect:
      contains: "SHOW PROCESSLIST"

  # ── CONNECTION_ID ──────────────────────────────────────────────────────────

  - name: "CONNECTION_ID() returns a positive integer"
    sql: "SELECT CONNECTION_ID() AS id"
    expect:
      rows: 1

  - name: "CONNECTION_ID() is stable within a session"
    steps:
      - session_id: "cid-stable"
        sql: "CREATE TABLE IF NOT EXISTS cid_tmp (id BIGINT)"
      - session_id: "cid-stable"
        sql: "INSERT INTO cid_tmp VALUES (CONNECTION_ID())"
      - session_id: "cid-stable"
        sql: "SELECT COUNT(*) AS n FROM cid_tmp WHERE id = CONNECTION_ID()"
        expect:
          rows: 1
          contains: "1"
      - session_id: "cid-stable"
        sql: "DROP TABLE IF EXISTS cid_tmp"

  # Observe simultaneous requests at the server, then check their individual
  # session bindings and that a third request progresses while both wait.
  - name: "Parallel HTTP requests retain separate session bindings"
    session_id: "pc-owner"
    setup:
      - sql: "DROP TABLE IF EXISTS pc_overlap"
      - sql: "CREATE TABLE pc_overlap (id INT PRIMARY KEY) ENGINE=memory"
      - sql: "INSERT INTO pc_overlap VALUES (1), (2)"
    steps:
      - session_id: "pc-owner"
        sql: "LOCK TABLES pc_overlap WRITE"
      - session_id: "pc-left"
        sql: "SET @pc_id = 1, @pc_token = 'left-session'"
      - session_id: "pc-right"
        sql: "SET @pc_id = 2, @pc_token = 'right-session'"
      - session_id: "pc-left"
        sql: "SELECT id, @pc_token AS token FROM pc_overlap WHERE id = @pc_id"
        background: true
        timeout: 15
        expect:
          rows: 1
          contains: ["left-session", "'id': 1"]
          not_contains: "right-session"
      - session_id: "pc-right"
        sql: "SELECT id, @pc_token AS token FROM pc_overlap WHERE id = @pc_id"
        background: true
        timeout: 15
        expect:
          rows: 1
          contains: ["right-session", "'id': 2"]
          not_contains: "left-session"
      - scm: |
          (begin
            (define wait_for_both (lambda (remaining)
              (if (>= (count (filter (show_processlist true) (lambda (row)
                    (and (equal? (get_assoc row "State") "Waiting for table lock")
                      (equal? (get_assoc row "Info") "SELECT id, @pc_token AS token FROM pc_overlap WHERE id = @pc_id"))))) 2)
                true
                (if (<= remaining 0) false
                  (begin (sleep 0.01) (wait_for_both (- remaining 1)))))))
            (wait_for_both 500))
        timeout: 10
        expect:
          rows: 1
          contains: "True"
      - session_id: "pc-third"
        sql: "SET @pc_token = 'third-session'"
      - session_id: "pc-third"
        sql: "SELECT @pc_token AS token"
        expect:
          rows: 1
          contains: "third-session"
          not_contains: ["left-session", "right-session"]
      - session_id: "pc-owner"
        sql: "UNLOCK TABLES"
      - wait_for_background: true
      - session_id: "pc-left"
        sql: "SELECT @pc_token AS token"
        expect:
          rows: 1
          contains: "left-session"
          not_contains: "right-session"
      - session_id: "pc-right"
        sql: "SELECT @pc_token AS token"
        expect:
          rows: 1
          contains: "right-session"
          not_contains: "left-session"
    cleanup:
      - sql: "UNLOCK TABLES"
      - sql: "DROP TABLE IF EXISTS pc_overlap"
