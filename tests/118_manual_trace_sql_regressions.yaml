test_cases:
  - name: "COUNT lowers a grouped derived stage with an outer presence stage"
    max_plan_size: 20000
    sql: |
      SELECT COUNT(*) AS total, SUM(candidate.member_count) AS memberships
      FROM (
        SELECT reference.id, COUNT(access_row.id) AS member_count
        FROM trace_count_reference reference
        LEFT JOIN trace_count_access access_row
          ON access_row.reference_id = reference.id
        GROUP BY reference.id
      ) candidate
      WHERE EXISTS (
        SELECT TRUE
        FROM trace_count_parent parent
        WHERE parent.reference_id = candidate.id
        LIMIT 1
      )
    expect:
      rows: 1
      data:
        - total: 3
          memberships: 2

  - name: "Grouped derived COUNT keeps carriers out of logical IR"
    max_plan_size: 20000
    sql: |
      EXPLAIN IR
      SELECT COUNT(*) AS total, SUM(candidate.member_count) AS memberships
      FROM (
        SELECT reference.id, COUNT(access_row.id) AS member_count
        FROM trace_count_reference reference
        LEFT JOIN trace_count_access access_row
          ON access_row.reference_id = reference.id
        GROUP BY reference.id
      ) candidate
      WHERE EXISTS (
        SELECT TRUE
        FROM trace_count_parent parent
        WHERE parent.reference_id = candidate.id
        LIMIT 1
      )
    expect:
      contains:
        - "group-stage"
        - "stage-output"
      not_contains:
        - "legacy_materialized"
        - "inner_select"
        - "dependent-subquery"
        - ".grp:"
        - "(scan"

  - name: "INSERT SELECT preserves a multi-source derived ORDER LIMIT relation"
    max_time: 1.0
    max_plan_size: 20000
    sql: |
      INSERT INTO trace_limit_output (id, label)
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY label.label DESC
        LIMIT 1
      ) candidate
      WHERE NOT EXISTS (
        SELECT TRUE
        FROM trace_limit_output present
        WHERE present.id = candidate.id
      )
    expect:
      affected_rows: 1

  - name: "INSERT SELECT derived ORDER LIMIT stores the selected joined row"
    sql: "SELECT id, label FROM trace_limit_output"
    expect:
      rows: 1
      data:
        - id: 1
          label: "zeta"

  - name: "Multi-source derived ORDER LIMIT preserves OFFSET"
    sql: |
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY label.label ASC
        LIMIT 1 OFFSET 1
      ) candidate
    expect:
      rows: 1
      data:
        - id: 1
          label: "zeta"

  - name: "Empty multi-source derived LIMIT returns no row"
    sql: |
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        WHERE parent.id > 100
        ORDER BY label.label DESC
        LIMIT 1
      ) candidate
    expect:
      rows: 0

  - name: "Multi-source derived LIMIT stays a logical one-row carrier"
    sql: |
      EXPLAIN IR
      SELECT candidate.id, candidate.label
      FROM (
        SELECT parent.id, label.label
        FROM trace_limit_parent parent
        LEFT JOIN trace_limit_label label ON label.id = parent.label_id
        ORDER BY label.label DESC
        LIMIT 1
      ) candidate
    expect:
      contains:
        - "group-stage"
        - "cardinality_mode first"
        - "physical_max_rows 1"
      not_contains:
        - "legacy_materialized"
        - "inner_select"
        - "__mat:"

  - name: "ORDER BY RAND supports filtered table scan with IN subquery"
    sql: |
      SELECT id
      FROM trace_item
      WHERE (state = 1 OR state = 0 OR state IS NULL)
        AND group_id IN (SELECT id FROM trace_group)
      ORDER BY RAND()
    expect:
      rows: 2

  - name: "UNION ALL wrapper decorrelates scalar subqueries in branches"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      SELECT *
      FROM (
        SELECT
          b.id AS box_id,
          0 AS indent,
          CAST(b.owner_id AS VARCHAR) AS label,
          'box' AS kind,
          (SELECT f.id FROM trace_folder f WHERE f.box_id = b.id LIMIT 1) AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE NOT m.seen AND m.box_id = b.id) AS unseen
        FROM trace_box b
        WHERE (SELECT h.kind FROM trace_host h WHERE h.id = b.host_id) = 1
          AND (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
        UNION ALL
        SELECT
          f.box_id AS box_id,
          1 AS indent,
          f.name AS label,
          'folder' AS kind,
          f.id AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE m.folder_id = f.id AND NOT m.seen AND m.box_id = f.box_id) AS unseen
        FROM trace_folder f
        WHERE COALESCE((
          SELECT (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
          FROM trace_box b
          WHERE b.id = f.box_id
          LIMIT 1
        ), FALSE)
      ) t
      ORDER BY box_id ASC, indent ASC, label ASC
    expect:
      rows: 3
      data:
        - box_id: 100
          indent: 0
          label: "7"
          kind: "box"
          item_id: 1001
          unseen: 1
        - box_id: 100
          indent: 1
          label: "archive"
          kind: "folder"
          item_id: 1002
          unseen: 0
        - box_id: 100
          indent: 1
          label: "inbox"
          kind: "folder"
          item_id: 1001
          unseen: 1

  - name: "Derived doc list applies outer ID filter before expensive projection"
    max_time: 2.2
    max_plan_size: 60000
    sql: |
      SELECT t.*
      FROM (
        SELECT
          CASE
            WHEN (
              (((SELECT default_type FROM trace_config WHERE id = 1 LIMIT 1) IS NULL) AND d.type IS NULL)
              OR d.type = (SELECT default_type FROM trace_config WHERE id = 1 LIMIT 1)
            )
            THEN '#hit'
            ELSE NULL
          END AS color,
          d.id AS id,
          d.archived AS archived,
          (SELECT r.file_id FROM trace_revision r WHERE r.doc_id = d.id ORDER BY r.created DESC, r.id DESC LIMIT 1) AS file_id,
          (SELECT f.filename FROM trace_file f WHERE f.id = (
            SELECT r.file_id FROM trace_revision r WHERE r.doc_id = d.id ORDER BY r.created DESC, r.id DESC LIMIT 1
          ) LIMIT 1) AS filename,
          (SELECT MIN(r.created) FROM trace_revision r WHERE r.doc_id = d.id LIMIT 1) AS first_seen,
          (SELECT MAX(r.created) FROM trace_revision r WHERE r.doc_id = d.id LIMIT 1) AS last_seen,
          EXISTS (
            SELECT TRUE
            FROM trace_revision r
            WHERE r.doc_id = d.id
              AND (SELECT f.mime FROM trace_file f WHERE f.id = r.file_id LIMIT 1) = 'application/pdf'
            LIMIT 1
          ) AS has_pdf
        FROM trace_doc d
      ) t
      WHERE t.id IN (1)
        AND (t.archived IS NULL OR t.archived IN (FALSE))
      LIMIT 72
    expect:
      rows: 1
      data:
        - color: "#hit"
          id: 1
          archived: false
          file_id: 1
          filename: "one.txt"
          first_seen: 1
          last_seen: 1
          has_pdf: false

  - name: "UNION EXISTS projection probes only selected outer rows"
    max_time: 0.4
    max_plan_size: 60000
    sql: |
      SELECT
        a.id,
        a.filename,
        EXISTS (
          SELECT r.id FROM trace_ref_a r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_b r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_c r WHERE r.enabled AND r.asset_id = a.id
          UNION ALL
          SELECT r.id FROM trace_ref_d r WHERE r.enabled AND r.asset_id = a.id
        ) AS referenced
      FROM trace_asset a
      WHERE a.id IN (1, 2)
      ORDER BY a.id
    expect:
      rows: 2
      data:
        - id: 1
          filename: "asset-1.dat"
          referenced: true
        - id: 2
          filename: "asset-2.dat"
          referenced: false

  - name: "EXPLAIN uses one ordered scan for repeated scalar latest projections"
    sql: |
      EXPLAIN
      SELECT
        p.id,
        COALESCE((SELECT m.value_a FROM trace_metric m WHERE m.profile_id = p.id AND m.valid_from <= 4096 ORDER BY m.valid_from DESC LIMIT 1), 0) AS value_a,
