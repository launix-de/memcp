metadata:
  version: "1.0"
  description: "Anonymized SQL regressions captured from manual trace output"

setup:
  - sql: "DROP TABLE IF EXISTS trace_item"
  - sql: "DROP TABLE IF EXISTS trace_group"
  - sql: "DROP TABLE IF EXISTS trace_box"
  - sql: "DROP TABLE IF EXISTS trace_host"
  - sql: "DROP TABLE IF EXISTS trace_folder"
  - sql: "DROP TABLE IF EXISTS trace_message"
  - sql: "DROP TABLE IF EXISTS trace_share"
  - sql: |
      CREATE TABLE trace_group (
        id INT PRIMARY KEY
      )
  - sql: |
      CREATE TABLE trace_item (
        id INT PRIMARY KEY,
        group_id INT,
        state INT
      )
  - sql: |
      CREATE TABLE trace_host (
        id INT PRIMARY KEY,
        kind INT
      )
  - sql: |
      CREATE TABLE trace_box (
        id INT PRIMARY KEY,
        host_id INT,
        owner_id INT
      )
  - sql: |
      CREATE TABLE trace_folder (
        id INT PRIMARY KEY,
        box_id INT,
        name VARCHAR(64)
      )
  - sql: |
      CREATE TABLE trace_message (
        id INT PRIMARY KEY,
        box_id INT,
        folder_id INT,
        seen BOOL
      )
  - sql: |
      CREATE TABLE trace_share (
        id INT PRIMARY KEY,
        box_id INT,
        owner_id INT
      )
  - sql: "INSERT INTO trace_group (id) VALUES (10), (20)"
  - sql: "INSERT INTO trace_item (id, group_id, state) VALUES (1, 10, 1), (2, 20, NULL), (3, 30, 0)"
  - sql: "INSERT INTO trace_host (id, kind) VALUES (1, 1), (2, 2)"
  - sql: "INSERT INTO trace_box (id, host_id, owner_id) VALUES (100, 1, 7), (200, 2, 9)"
  - sql: "INSERT INTO trace_folder (id, box_id, name) VALUES (1001, 100, 'inbox'), (1002, 100, 'archive'), (2001, 200, 'other')"
  - sql: "INSERT INTO trace_message (id, box_id, folder_id, seen) VALUES (1, 100, 1001, FALSE), (2, 100, 1002, TRUE), (3, 200, 2001, FALSE)"
  - sql: "INSERT INTO trace_share (id, box_id, owner_id) VALUES (1, 100, 7)"

test_cases:
  - name: "ORDER BY RAND supports filtered table scan with IN subquery"
    sql: |
      SELECT id
      FROM trace_item
      WHERE (state = 1 OR state = 0 OR state IS NULL)
        AND group_id IN (SELECT id FROM trace_group)
      ORDER BY RAND()
    expect:
      rows: 2

  - name: "UNION ALL wrapper decorrelates scalar subqueries in branches"
    fail_comment: "query is not fully decorrelated anymore; logical IR must not contain subquery markers"
    sql: |
      SELECT *
      FROM (
        SELECT
          b.id AS box_id,
          0 AS indent,
          CAST(b.owner_id AS VARCHAR) AS label,
          'box' AS kind,
          (SELECT f.id FROM trace_folder f WHERE f.box_id = b.id LIMIT 1) AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE NOT m.seen AND m.box_id = b.id) AS unseen
        FROM trace_box b
        WHERE (SELECT h.kind FROM trace_host h WHERE h.id = b.host_id) = 1
          AND (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
        UNION ALL
        SELECT
          f.box_id AS box_id,
          1 AS indent,
          f.name AS label,
          'folder' AS kind,
          f.id AS item_id,
          (SELECT COUNT(*) FROM trace_message m WHERE m.folder_id = f.id AND NOT m.seen AND m.box_id = f.box_id) AS unseen
        FROM trace_folder f
        WHERE COALESCE((
          SELECT (CASE WHEN FALSE THEN TRUE ELSE NOT ((b.owner_id <> 7) AND NOT EXISTS (SELECT TRUE FROM trace_share s WHERE s.box_id = b.id AND s.owner_id = 7 LIMIT 1)) END)
          FROM trace_box b
          WHERE b.id = f.box_id
          LIMIT 1
        ), FALSE)
      ) t
      ORDER BY box_id ASC, indent ASC, label ASC
    expect:
      rows: 3
      data:
        - box_id: 100
          indent: 0
          label: "7"
          kind: "box"
          item_id: 1001
          unseen: 1
        - box_id: 100
          indent: 1
          label: "archive"
          kind: "folder"
          item_id: 1002
          unseen: 0
        - box_id: 100
          indent: 1
          label: "inbox"
          kind: "folder"
          item_id: 1001
          unseen: 0

cleanup:
  - sql: "DROP TABLE IF EXISTS trace_item"
  - sql: "DROP TABLE IF EXISTS trace_group"
  - sql: "DROP TABLE IF EXISTS trace_box"
  - sql: "DROP TABLE IF EXISTS trace_host"
  - sql: "DROP TABLE IF EXISTS trace_folder"
  - sql: "DROP TABLE IF EXISTS trace_message"
  - sql: "DROP TABLE IF EXISTS trace_share"
