# Blob storage and REPEAT() function tests

metadata:
  version: "1.0"
  description: "REPEAT function, TEXT/BLOB storage with short and long strings, persistence"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS blob_rc1"
  - sql: "DROP TABLE IF EXISTS blob_shared1"
  - sql: "DROP TABLE IF EXISTS blob_shared2"
  - sql: "DROP TABLE IF EXISTS blob_rcpersist"
  - sql: "DROP TABLE IF EXISTS blob_external"
  - sql: "DROP TABLE IF EXISTS blob_ram_scan"
  - sql: "DROP TABLE IF EXISTS blob_bang"
  - sql: "DROP TABLE IF EXISTS blob_test"

test_cases:
  # --- REPEAT function ---
  - name: "REPEAT basic"
    sql: "SELECT REPEAT('ab', 3) AS r"
    expect:
      rows: 1
      data:
        - r: "ababab"

  - name: "REPEAT with NULL"
    sql: "SELECT REPEAT(NULL, 5) AS r"
    expect:
      rows: 1
      data:
        - r: null

  - name: "REPEAT with zero count"
    sql: "SELECT REPEAT('x', 0) AS r"
    expect:
      rows: 1
      data:
        - r: ""

  # --- TEXT column with short strings (no blob overlay) ---
  - name: "Create blob_test table"
    sql: |
      CREATE TABLE blob_test (
        id INT PRIMARY KEY,
        payload TEXT
      )
    expect:
      rows: 0

  - name: "Insert short strings"
    sql: |
      INSERT INTO blob_test (id, payload) VALUES
      (1, 'hello'),
      (2, 'world')
    expect:
      affected_rows: 2

  - name: "Select short strings"
    sql: "SELECT id, payload FROM blob_test ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
          payload: "hello"
        - id: 2
          payload: "world"

  # --- Medium TEXT remains inline below the 2 KiB boundary ---
  - name: "Insert long string (>255 bytes)"
    sql: "INSERT INTO blob_test (id, payload) VALUES (3, REPEAT('A', 1000))"
    expect:
      affected_rows: 1

  - name: "Roundtrip: LENGTH of long string"
    sql: "SELECT LENGTH(payload) AS len FROM blob_test WHERE id = 3"
    expect:
      rows: 1
      data:
        - len: 1000

  - name: "Roundtrip: long string value check"
    sql: "SELECT payload = REPEAT('A', 1000) AS ok FROM blob_test WHERE id = 3"
    expect:
      rows: 1
      data:
        - ok: 1

  # --- Dedup: same long string twice ---
  - name: "Insert duplicate long string"
    sql: "INSERT INTO blob_test (id, payload) VALUES (4, REPEAT('A', 1000))"
    expect:
      affected_rows: 1

  - name: "Both rows return same value"
    sql: "SELECT id FROM blob_test WHERE payload = REPEAT('A', 1000) ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 3
        - id: 4

  # --- Escaping: string starting with '!' ---
  - name: "Insert string starting with exclamation mark"
    sql: "INSERT INTO blob_test (id, payload) VALUES (5, '!dangerous-prefix')"
    expect:
      affected_rows: 1

  - name: "Select string starting with exclamation mark"
    sql: "SELECT payload FROM blob_test WHERE id = 5"
    expect:
      rows: 1
      data:
        - payload: "!dangerous-prefix"

  # --- Mixed short + long strings ---
  - name: "Insert another long string"
    sql: "INSERT INTO blob_test (id, payload) VALUES (6, REPEAT('Z', 500))"
    expect:
      affected_rows: 1

  - name: "Mixed lengths: count all rows"
    sql: "SELECT COUNT(*) AS cnt FROM blob_test"
    expect:
      rows: 1
      data:
        - cnt: 6

  # --- NULL in blob column ---
  - name: "Insert NULL payload"
    sql: "INSERT INTO blob_test (id, payload) VALUES (7, NULL)"
    expect:
      affected_rows: 1

  - name: "Select NULL payload"
    sql: "SELECT payload FROM blob_test WHERE id = 7"
    expect:
      rows: 1
      data:
        - payload: null

  # --- UPDATE blob value ---
  - name: "Update short to long string"
    sql: "UPDATE blob_test SET payload = REPEAT('U', 800) WHERE id = 1"
    expect:
      affected_rows: 1

  - name: "Verify updated value length"
    sql: "SELECT LENGTH(payload) AS len FROM blob_test WHERE id = 1"
    expect:
      rows: 1
      data:
        - len: 800

  # --- DELETE row with blob ---
  - name: "Delete row with long blob"
    sql: "DELETE FROM blob_test WHERE id = 4"
    expect:
      affected_rows: 1

  - name: "Verify row deleted"
    sql: "SELECT COUNT(*) AS cnt FROM blob_test WHERE id = 4"
    expect:
      rows: 1
      data:
        - cnt: 0

  # --- Binary data via FROM_BASE64 ---
  - name: "Insert binary with null bytes"
    sql: "INSERT INTO blob_test (id, payload) VALUES (10, FROM_BASE64('AAABAP8A/w=='))"
    expect:
      affected_rows: 1

  - name: "Roundtrip binary with null bytes"
    sql: "SELECT TO_BASE64(payload) AS b FROM blob_test WHERE id = 10"
    expect:
      rows: 1
      data:
        - b: "AAABAP8A/w=="

  - name: "Insert binary with 0xFF and control chars"
    sql: "INSERT INTO blob_test (id, payload) VALUES (11, FROM_BASE64('/////w=='))"
    expect:
      affected_rows: 1

  - name: "Roundtrip binary with 0xFF"
    sql: "SELECT TO_BASE64(payload) AS b FROM blob_test WHERE id = 11"
    expect:
      rows: 1
      data:
        - b: "/////w=="

  - name: "Insert long binary blob (>255 bytes, triggers OverlayBlob)"
    sql: "INSERT INTO blob_test (id, payload) VALUES (12, FROM_BASE64(REPEAT('AAAA', 100)))"
    expect:
      affected_rows: 1

  - name: "Verify long binary length"
    sql: "SELECT LENGTH(payload) AS len FROM blob_test WHERE id = 12"
    expect:
      rows: 1
      data:
        - len: 300

  - name: "Roundtrip long binary data"
    sql: "SELECT TO_BASE64(payload) = REPEAT('AAAA', 100) AS ok FROM blob_test WHERE id = 12"
    expect:
      rows: 1
      data:
        - ok: 1

  # --- Persistence: SHUTDOWN + restart + verify ---
  - name: "SHUTDOWN memcp"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "After restart: count rows"
    sql: "SELECT COUNT(*) AS cnt FROM blob_test"
    expect:
      rows: 1
      data:
        - cnt: 9

  - name: "After restart: long string intact"
    sql: "SELECT LENGTH(payload) AS len FROM blob_test WHERE id = 3"
    expect:
      rows: 1
      data:
        - len: 1000

  - name: "After restart: short string intact"
    sql: "SELECT payload FROM blob_test WHERE id = 2"
    expect:
      rows: 1
      data:
        - payload: "world"

  - name: "After restart: binary with null bytes intact"
    sql: "SELECT TO_BASE64(payload) AS b FROM blob_test WHERE id = 10"
    expect:
      rows: 1
      data:
        - b: "AAABAP8A/w=="

  - name: "After restart: long binary blob intact"
    sql: "SELECT TO_BASE64(payload) = REPEAT('AAAA', 100) AS ok FROM blob_test WHERE id = 12"
    expect:
      rows: 1
      data:
        - ok: 1

  # --- Blob refcount: DROP TABLE releases blobs ---
  - name: "Refcount: create table with long blob"
    sql: |
      CREATE TABLE blob_rc1 (
        id INT PRIMARY KEY,
        payload TEXT
      )
    expect:
      rows: 0

  - name: "Refcount: insert long string into rc1"
    sql: "INSERT INTO blob_rc1 (id, payload) VALUES (1, REPEAT('R', 1000))"
    expect:
      affected_rows: 1

  - name: "Refcount: persist via shutdown"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "Refcount: verify blob after restart"
    sql: "SELECT payload = REPEAT('R', 1000) AS ok FROM blob_rc1 WHERE id = 1"
    expect:
      rows: 1
      data:
        - ok: 1

  - name: "Refcount: drop table releases blob"
    sql: "DROP TABLE blob_rc1"
    expect:
      rows: 0

  # --- Blob refcount: shared blob across two tables ---
  - name: "Shared blob: create first table"
    sql: |
      CREATE TABLE blob_shared1 (
        id INT PRIMARY KEY,
        payload TEXT
      )
    expect:
      rows: 0

  - name: "Shared blob: create second table"
    sql: |
      CREATE TABLE blob_shared2 (
        id INT PRIMARY KEY,
        payload TEXT
      )
    expect:
      rows: 0

  - name: "Shared blob: insert long string in first"
    sql: "INSERT INTO blob_shared1 (id, payload) VALUES (1, REPEAT('S', 4096)), (2, REPEAT('T', 4096)), (3, REPEAT('V', 4096))"
    expect:
      affected_rows: 3

  - name: "Shared blob: insert same long string in second"
    sql: "INSERT INTO blob_shared2 (id, payload) VALUES (1, REPEAT('S', 4096)), (2, REPEAT('T', 4096)), (3, REPEAT('V', 4096))"
    expect:
      affected_rows: 3

  - name: "Shared blob: rebuild both tables concurrently"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "Shared blob: both tables survive concurrent rebuild"
    sql: |
      SELECT
        (SELECT payload = REPEAT('S', 4096) FROM blob_shared1 WHERE id = 1) AS first_ok,
        (SELECT payload = REPEAT('S', 4096) FROM blob_shared2 WHERE id = 1) AS second_ok
    expect:
      rows: 1
      data:
        - first_ok: 1
          second_ok: 1

  - name: "Shared blob: drop first table"
    sql: "DROP TABLE blob_shared1"
    expect:
      rows: 0

  - name: "Shared blob: second table still has blob"
    sql: "SELECT payload = REPEAT('S', 4096) AS ok FROM blob_shared2 WHERE id = 1"
    expect:
      rows: 1
      data:
        - ok: 1

  - name: "Shared blob: drop second table"
    sql: "DROP TABLE blob_shared2"
    expect:
      rows: 0

  # --- Blob refcount persistence across restart ---
  - name: "RC persist: create table"
    sql: |
      CREATE TABLE blob_rcpersist (
        id INT PRIMARY KEY,
        payload TEXT
      )
    expect:
      rows: 0

  - name: "RC persist: insert long blob"
    sql: "INSERT INTO blob_rcpersist (id, payload) VALUES (1, REPEAT('P', 1000))"
    expect:
      affected_rows: 1

  - name: "RC persist: first shutdown to persist"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "RC persist: after restart blob still readable"
    sql: "SELECT payload = REPEAT('P', 1000) AS ok FROM blob_rcpersist WHERE id = 1"
    expect:
      rows: 1
      data:
        - ok: 1

  - name: "RC persist: drop table after restart"
    sql: "DROP TABLE blob_rcpersist"
    expect:
      rows: 0

  # --- External blobs above the 2 KiB inline boundary ---
  - name: "Create external blob boundary table"
    sql: |
      CREATE TABLE blob_external (
        id INT PRIMARY KEY,
        payload TEXT
      )
    expect:
      rows: 0

  - name: "Insert text and binary above 2 KiB"
    sql: |
      INSERT INTO blob_external (id, payload) VALUES
      (1, REPEAT('E', 3000)),
      (2, FROM_BASE64(REPEAT('AAAA', 1000))),
      (3, REPEAT('Q', 3000)),
      (4, REPEAT('E', 3000))
    expect:
      affected_rows: 4

  - name: "Persist external blobs above 2 KiB"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "External blobs survive restart"
    sql: |
      SELECT id, LENGTH(payload) AS len
      FROM blob_external
      ORDER BY id
    expect:
      rows: 4
      data:
        - id: 1
          len: 3000
        - id: 2
          len: 3000
        - id: 3
          len: 3000
        - id: 4
          len: 3000

  - name: "Repeated external reads retain exact text and binary"
    sql: "SELECT id, payload = CASE WHEN id = 1 OR id = 4 THEN REPEAT('E', 3000) WHEN id = 2 THEN FROM_BASE64(REPEAT('AAAA', 1000)) ELSE REPEAT('Q', 3000) END AS ok FROM blob_external ORDER BY id"
    repetitions: 4
    expect: {rows: 4, data: [{id: 1, ok: 1}, {id: 2, ok: 1}, {id: 3, ok: 1}, {id: 4, ok: 1}]}

  - name: "Update warmed external content"
    sql: "UPDATE blob_external SET payload = REPEAT('N', 4096) WHERE id = 1"
    expect: {affected_rows: 1}

  - name: "Warmed generation does not replace updated contents"
    sql: "SELECT payload = REPEAT('N', 4096) AS ok FROM blob_external WHERE id = 1"
    repetitions: 3
    expect: {rows: 1, data: [{ok: 1}]}

  - name: "Another row retains the shared original hash after update"
    sql: "SELECT payload = REPEAT('E', 3000) AS ok FROM blob_external WHERE id = 4"
    expect: {rows: 1, data: [{ok: 1}]}

  - name: "Persist updated external contents"
    sql: "SHUTDOWN"
    expect: {rows: 0}

  - name: "Updated external contents recover without RAM cache"
    sql: "SELECT payload = REPEAT('N', 4096) AS ok FROM blob_external WHERE id = 1"
    repetitions: 3
    expect: {rows: 1, data: [{ok: 1}]}

  - name: "Pressure during concurrent external reads"
    parallel: blob_ram_pressure
    scm: (settings "MaxRamBytes" 1024)
    expect: {}

  - name: "Concurrent reader preserves updated text under pressure"
    parallel: blob_ram_pressure
    sql: "SELECT payload = REPEAT('N', 4096) AS ok FROM blob_external WHERE id = 1"
    repetitions: 12
    expect: {rows: 1, data: [{ok: 1}]}

  - name: "Concurrent reader preserves binary under pressure"
    parallel: blob_ram_pressure
    sql: "SELECT TO_BASE64(payload) = REPEAT('AAAA', 1000) AS ok FROM blob_external WHERE id = 2"
    repetitions: 12
    expect: {rows: 1, data: [{ok: 1}]}

  - name: "Memory display must not deadlock concurrent blob readers and eviction"
    parallel: blob_ram_pressure
    scm: |
      (reduce (produceN 12) (lambda (_ i)
        (begin
          (define snapshot (show "memcp-tests" "blob_external" true))
          (if (> (snapshot "size_bytes") 0) true
            (error "memory display lost the table owner")))) true)
    expect: {result_contains: ["true"]}

  - name: "Restore RAM budget after external read pressure"
    scm: (settings "MaxRamBytes" 0)
    expect: {}

  - name: "Drop external blob boundary table"
    sql: "DROP TABLE blob_external"
    expect:
      rows: 0

  - name: "Create bang hash regression table"
    sql: "CREATE TABLE blob_bang (id INT PRIMARY KEY, payload TEXT)"
    expect: {rows: 0}
  - name: "Insert bang hash and genuine escape literals"
    sql: |
      INSERT INTO blob_bang VALUES
      (1, CONCAT('blob-prefix-66:', REPEAT('x', 5300))),
      (2, REPEAT('y', 5300)), (3, REPEAT('z', 5300)),
      (4, '!'), (5, '!!'), (6, '!b-literal')
    expect: {affected_rows: 6}
  - name: "Rebuild and reload bang hash"
    sql: "SHUTDOWN"
    expect: {rows: 0}
  - name: "Bang hash returns content and SQL length after reload"
    sql: "SELECT LENGTH(payload) AS len, payload = CONCAT('blob-prefix-66:', REPEAT('x', 5300)) AS ok FROM blob_bang WHERE id = 1"
    expect: {rows: 1, data: [{len: 5315, ok: 1}]}
  - name: "Escaped literals survive blob rebuild"
    sql: "SELECT payload FROM blob_bang WHERE id >= 4 ORDER BY id"
    expect: {rows: 3, data: [{payload: '!'}, {payload: '!!'}, {payload: '!b-literal'}]}
  - name: "Second rebuild of bang hash"
    sql: "SHUTDOWN"
    expect: {rows: 0}
  - name: "Bang hash survives second rebuild"
    sql: "SELECT LENGTH(payload) AS len, payload = CONCAT('blob-prefix-66:', REPEAT('x', 5300)) AS ok FROM blob_bang WHERE id = 1"
    expect: {rows: 1, data: [{len: 5315, ok: 1}]}

  - name: "Create anonymous repeated blob scan fixture"
    sql: "CREATE TABLE blob_ram_scan (id INT PRIMARY KEY, payload TEXT)"
    expect: {rows: 0}
  - name: "Populate anonymous repeated blob scan fixture"
    scm: |
      (begin
        (set text (reduce (produceN 1024) (lambda (acc i) (concat acc "payload-")) ""))
        (insert (table "memcp-tests" "blob_ram_scan") '("id" "payload")
          (map (produceN 256) (lambda (i) (list i (concat i ":" text)))))
        (rebuild (table "memcp-tests" "blob_ram_scan") true false))
    expect: {}
  # Per-row projections require reading payloads on every execution. Aggregates
  # would reuse a group keytable and stop exercising blob decoding after warmup.
  - name: "Repeated LIKE projection over external blobs"
    sql: "SELECT id, payload LIKE '%payload%' AS matched FROM blob_ram_scan"
    threshold_ms: 200
    performance_rows: 256
    warmup: 3
    repetitions: 7
    expect: {rows: 256}
  - name: "Repeated full content length projection"
    sql: "SELECT id, LENGTH(payload) AS bytes FROM blob_ram_scan"
    threshold_ms: 200
    performance_rows: 256
    warmup: 3
    repetitions: 7
    expect: {rows: 256}
  - name: "A different LIKE pattern reuses decoded content"
    sql: "SELECT id, payload LIKE '%absent-pattern%' AS matched FROM blob_ram_scan"
    threshold_ms: 200
    performance_rows: 256
    warmup: 3
    repetitions: 7
    expect: {rows: 256}
  - name: "Repeated point read of external content"
    sql: "SELECT LENGTH(payload) AS bytes FROM blob_ram_scan WHERE id = 123"
    threshold_ms: 200
    performance_rows: 1
    warmup: 3
    repetitions: 7
    expect: {rows: 1, data: [{bytes: 8196}]}
  - name: "Reject a conflicting write to a warmed blob row"
    sql: "INSERT INTO blob_ram_scan (id, payload) VALUES (0, REPEAT('rejected', 1024))"
    expect: {error: true}
  - name: "Failed write preserves warmed committed content"
    sql: "SELECT payload = CONCAT('0:', REPEAT('payload-', 1024)) AS ok FROM blob_ram_scan WHERE id = 0"
    expect: {rows: 1, data: [{ok: 1}]}

cleanup:
  - sql: "DROP TABLE IF EXISTS blob_ram_scan"
  - sql: "DROP TABLE IF EXISTS blob_test"
  - sql: "DROP TABLE IF EXISTS blob_rc1"
  - sql: "DROP TABLE IF EXISTS blob_shared1"
  - sql: "DROP TABLE IF EXISTS blob_shared2"
  - sql: "DROP TABLE IF EXISTS blob_rcpersist"
  - sql: "DROP TABLE IF EXISTS blob_external"
  - sql: "DROP TABLE IF EXISTS blob_bang"
