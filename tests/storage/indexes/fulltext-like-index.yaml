# Fulltext LIKE index tests
# Verifies that non-prefix LIKE patterns produce correct results with ORDER BY,
# that repeated queries remain correct after cache/index warmup, and that the
# new planner lowers aggregate LIKE shapes through deterministic group caches
# instead of relying on flaky scan timing diagnostics.

metadata:
  version: "1.0"
  description: "Fulltext LIKE boundary matching with index building"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS `ft_customers`"
  - sql: "DROP TABLE IF EXISTS `ft_large`"
  - sql: "DROP TABLE IF EXISTS `ft_matchset`"
  - sql: "DROP TABLE IF EXISTS `ft_multishard`"

test_cases:
  # --- Small table: correctness tests ---
  - name: "Create customer table"
    sql: |
      CREATE TABLE `ft_customers` (
        id INT PRIMARY KEY,
        vorname TEXT,
        nachname TEXT,
        birthdate DATE
      )
    expect:
      rows: 0

  - name: "Insert customer data"
    setup:
      - scm: |
          (begin
            (set rows (list
              (list 1 "Klaus" "Schmidt" "1980-01-15")
              (list 2 "Hans" "Müller" "1975-06-20")
              (list 3 "Klaus-Peter" "Weber" "1990-03-10")
              (list 4 "Anna" "Klaus" "1985-11-25")
              (list 5 "Heinrich" "Bauer" "1970-09-05")
              (list 6 "Klaudia" "Fischer" "1988-07-30")
              (list 7 "Peter" "Schwarz" "1992-02-14")
              (list 8 "Maria" "Hofmann" "1978-04-18")
              (list 9 "Nikolaus" "Meyer" "1983-12-06")
              (list 10 "Thomas" "Wagner" "1995-08-22")
              (list 11 "Klausine" "Braun" "1982-05-11")
              (list 12 "Frank" "Zimmermann" "1973-10-03")
              (list 13 "Erika" "Klein" "1991-01-28")
              (list 14 "Rolf" "Klausing" "1986-06-17")
              (list 15 "Sabine" "Richter" "1979-03-09")
              (list 16 "Werner" "Schuster" "1968-12-25")
              (list 17 "Gisela" "Neumann" "1994-07-04")
              (list 18 "Herbert" "Krause" "1976-11-13")
              (list 19 "Ute" "Schulze" "1989-09-21")
              (list 20 "Dieter" "Huber" "1972-02-08")))
            (insert (table "memcp-tests" "ft_customers") '("id" "vorname" "nachname" "birthdate") rows))
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_customers"
    expect:
      rows: 1
      data:
        - cnt: 20

  # --- Correctness: non-prefix LIKE with ORDER BY ---
  - name: "LIKE infix pattern matches correct rows"
    sql: "SELECT vorname, nachname FROM ft_customers WHERE vorname LIKE '%laus%' ORDER BY birthdate"
    expect:
      rows: 4
      data:
        - vorname: "Klaus"
          nachname: "Schmidt"
        - vorname: "Klausine"
          nachname: "Braun"
        - vorname: "Nikolaus"
          nachname: "Meyer"
        - vorname: "Klaus-Peter"
          nachname: "Weber"

  # --- Combined: equal + LIKE in AND ---
  - name: "AND equal + LIKE"
    sql: "SELECT vorname, nachname FROM ft_customers WHERE nachname = 'Meyer' AND vorname LIKE '%laus%'"
    expect:
      rows: 1
      data:
        - vorname: "Nikolaus"
          nachname: "Meyer"

  - name: "Exact point probes keep LIKE as a residual filter"
    scm: |
      (begin
        (define tbl (table "memcp-tests" "ft_customers"))
        (define probe (lambda (id)
          (begin
            (define condition (eval (list
              'lambda (list 'row_id 'name)
              (list 'and
                (list 'equal?? 'row_id id)
                (list 'strlike 'name "%laus%" "utf8mb4_general_ci")))))
            (scan_exists nil tbl (list "id" "vorname") condition))))
        (reduce (produceN 8) (lambda (ok i)
          (begin (probe (+ 1 i)) ok)) true)
        (define indexes ((show "memcp-tests" "ft_customers" 0 true) "indexes"))
        (define bad (reduce indexes (lambda (found index)
          (begin
            (define cols (get_assoc index "cols"))
            (or found (and
              (strlike cols "id|%vorname(like)%" "utf8mb4_bin")
              (strlike cols "%vorname(like)%" "utf8mb4_bin"))))) false))
        (if bad
          (error "point lookup built a full-table LIKE matcher index")
          true))

  # --- Incremental search pattern ---
  - name: "Incremental search step 1"
    sql: "SELECT COUNT(*) AS cnt FROM ft_customers WHERE vorname LIKE '%K%'"
    expect:
      rows: 1
      data:
        - cnt: 7

  - name: "Incremental search step 2"
    sql: "SELECT COUNT(*) AS cnt FROM ft_customers WHERE vorname LIKE '%Klaus%'"
    expect:
      rows: 1
      data:
        - cnt: 3

  # --- LIKE with ORDER BY DESC ---
  - name: "LIKE with ORDER BY DESC"
    sql: "SELECT vorname FROM ft_customers WHERE vorname LIKE '%er%' ORDER BY birthdate DESC"
    expect:
      rows: 6
      data:
        - vorname: "Peter"
        - vorname: "Erika"
        - vorname: "Klaus-Peter"
        - vorname: "Herbert"
        - vorname: "Dieter"
        - vorname: "Werner"

  # --- No matches ---
  - name: "LIKE no matches"
    sql: "SELECT vorname FROM ft_customers WHERE vorname LIKE '%zzz%'"
    expect:
      rows: 0

  # --- Large table: 30k rows (single shard) for performance self-check ---
  - name: "Create large table"
    sql: |
      CREATE TABLE `ft_large` (
        id INT PRIMARY KEY,
        name TEXT
      )
    expect:
      rows: 0

  - name: "Insert 30000 rows (needle-in-a-haystack)"
    setup:
      - scm: |
          (begin
            (set rows (map (produceN 30000) (lambda (i)
              (list i
                (match i
                  42 "Klaus Heinemann"
                  1337 "Nikolaus Weber"
                  15000 "Klausberger Fritz"
                  22777 "Hans Klausner"
                  29999 "Klausmüller Gerd"
                  _ (concat "Person_" i))))))
            (insert (table "memcp-tests" "ft_large") '("id" "name") rows))
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large"
    expect:
      rows: 1
      data:
        - cnt: 30000

  # --- Deterministic lowering gates plus repeated speedup checks ---
  # Speedup helper: run each query 8x and compare per-scan work. The cold
  # carrier build scans the base relation once, while every query performs a
  # cache scan; comparing their totals would therefore penalize the warm path
  # merely for collecting more samples. Minimum per-scan speedup: 3x.
  # A prebuilt bigram candidate may make the base and carrier totals both
  # sub-5ms; that absolute fast path is accepted because materializing a group
  # carrier cannot usefully be 3x faster than an already sub-millisecond scan.
  # early = runs 1-2, late = runs 5-8.

  # -- Test 1: LIKE needle-in-haystack (5 matches in 30k) --
  - name: "EXPLAIN LIKE aggregate uses canonical group carrier"
    sql: "EXPLAIN SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect:
      contains:
        - "touch_keytable"
        - "createcolumn"
        - ".grp:ft_large:"
        - "strlike"
      not_contains:
        - "inner_select"

  - name: "Warm LIKE bigram index outside aggregate timing"
    setup:
      - sql: "SELECT id FROM ft_large WHERE name LIKE '%laus%'"
      - sql: "SELECT id FROM ft_large WHERE name LIKE '%laus%'"
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "Enable scan debugging for LIKE test"
    setup:
      - scm: '(settings "ScanDebugging" true)'
      - scm: '(sleep 0.1)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%'"
    sql: "SELECT 1 AS ok"
    expect:
      rows: 1

  - name: "LIKE run 1"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }
  - name: "LIKE run 2"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }
  - name: "LIKE run 3"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }
  - name: "LIKE run 4"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }
  - name: "LIKE run 5"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }
  - name: "LIKE run 6"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }
  - name: "LIKE run 7"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }
  - name: "LIKE run 8"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 1, data: [{ cnt: 5 }] }

  - name: "Wait for LIKE scan logs"
    setup:
      - scm: '(sleep 0.2)'
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "LIKE speedup >= 3x"
    sql: |
      SELECT full_ns, cache_ns,
        CASE WHEN full_ns > 0 AND cache_ns > 0 AND full_scans > 0 AND cache_scans > 0 AND (
          cache_ns * full_scans * 3 <= full_ns * cache_scans * 2 OR
          (full_ns <= 5000000 * full_scans AND cache_ns <= 5000000 * cache_scans)
        ) THEN 'ok' ELSE 'FAIL' END AS result
      FROM (
        SELECT
          SUM(CASE WHEN `table` = 'ft_large' AND inputCount >= 10000 THEN exec_ns ELSE 0 END) AS full_ns,
          SUM(CASE WHEN `table` LIKE '.grp:ft_large:%' THEN exec_ns ELSE 0 END) AS cache_ns,
          SUM(CASE WHEN `table` = 'ft_large' AND inputCount >= 10000 THEN 1 ELSE 0 END) AS full_scans,
          SUM(CASE WHEN `table` LIKE '.grp:ft_large:%' THEN 1 ELSE 0 END) AS cache_scans
        FROM `system_statistic`.`scans`
        WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%'
      ) s
    expect: { rows: 1, data: [{ result: "ok" }] }
    on_fail:
      - sql: "SELECT ROW_NUMBER() OVER (ORDER BY timestamp) AS rn, `table`, index_cols, inputCount, outputCount, exec_ns FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%' ORDER BY timestamp LIMIT 16"

  - name: "LIKE carrier avoids repeated base-table work"
    sql: |
      SELECT full_rows, cache_rows,
        CASE WHEN full_rows >= 10000 AND cache_rows > 0 AND cache_rows < full_rows
          THEN 'ok' ELSE 'FAIL' END AS result
      FROM (
        SELECT
          SUM(CASE WHEN `table` = 'ft_large' AND inputCount >= 10000 THEN inputCount ELSE 0 END) AS full_rows,
          SUM(CASE WHEN `table` LIKE '.grp:ft_large:%' THEN inputCount ELSE 0 END) AS cache_rows
        FROM `system_statistic`.`scans`
        WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%'
      ) s
    expect: { rows: 1, data: [{ result: "ok" }] }
    on_fail:
      - sql: "SELECT ROW_NUMBER() OVER (ORDER BY timestamp) AS rn, `table`, index_cols, inputCount, candidateCount, outputCount, exec_ns FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%' ORDER BY timestamp LIMIT 16"

  # The aggregate above has its own query-level carrier. Exercise a normal
  # SQL row scan separately so the storage-level bigram candidate is visible.
  - name: "Clear log for direct LIKE bigram scan"
    setup:
      - scm: '(sleep 0.1)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%'"
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "Direct LIKE bigram run 1"
    sql: "SELECT id FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 5 }
  - name: "Direct LIKE bigram run 2"
    sql: "SELECT id FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 5 }
  - name: "Direct LIKE bigram run 3"
    sql: "SELECT id FROM ft_large WHERE name LIKE '%laus%'"
    expect: { rows: 5 }
  - name: "Direct LIKE absent bigram"
    sql: "SELECT id FROM ft_large WHERE name LIKE '%zzzzz%'"
    expect: { rows: 0 }

  - name: "Wait for direct LIKE scan logs"
    setup:
      - scm: '(sleep 0.2)'
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "SQL compiler reaches selective bigram candidate"
    sql: |
      SELECT matched_candidates, absent_candidates, CASE
        WHEN matched_candidates > 0 AND matched_candidates < 30000 AND absent_candidates = 0 THEN 'ok'
        ELSE 'FAIL'
      END AS result
      FROM (
        SELECT
          MIN(CASE WHEN outputCount = 5 THEN candidateCount ELSE NULL END) AS matched_candidates,
          MIN(CASE WHEN outputCount = 0 THEN candidateCount ELSE NULL END) AS absent_candidates
        FROM `system_statistic`.`scans`
        WHERE `table` = 'ft_large' AND index_cols = 'name'
      ) s
    expect: { rows: 1, data: [{ result: "ok" }] }
    on_fail:
      - sql: "SELECT ROW_NUMBER() OVER (ORDER BY timestamp) AS rn, `table`, index_cols, inputCount, candidateCount, outputCount, exec_ns FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' ORDER BY timestamp LIMIT 16"

  # -- Test 2: Equal id=42 (regression test, must not be slower) --
  - name: "EXPLAIN Equal uses direct id scan"
    sql: "EXPLAIN SELECT name FROM ft_large WHERE id = 42"
    expect:
      contains:
        - "(scan"
        - "\"ft_large\""
        - "'(\"id\")"
        - "equal??"
      not_contains:
        - ".grp:ft_large:"

  - name: "Clear log for Equal test"
    setup:
      - scm: '(sleep 0.1)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%'"
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "Equal run 1"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }
  - name: "Equal run 2"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }
  - name: "Equal run 3"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }
  - name: "Equal run 4"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }
  - name: "Equal run 5"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }
  - name: "Equal run 6"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }
  - name: "Equal run 7"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }
  - name: "Equal run 8"
    sql: "SELECT name FROM ft_large WHERE id = 42"
    expect: { rows: 1, data: [{ name: "Klaus Heinemann" }] }

  - name: "Wait for Equal scan logs"
    setup:
      - scm: '(sleep 0.2)'
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "Equal speedup >= 3x"
    sql: |
      SELECT slow_ns, fast_ns,
        CASE WHEN fast_ns > 0 AND slow_ns * 3 >= fast_ns * 10 THEN 'ok' ELSE 'FAIL' END AS result
      FROM (
        SELECT
          MAX(exec_ns) AS slow_ns,
          MIN(exec_ns) AS fast_ns
        FROM `system_statistic`.`scans`
        WHERE `table` = 'ft_large' AND index_cols = 'id'
      ) s
    expect: { rows: 1, data: [{ result: "ok" }] }
    on_fail:
      - sql: "SELECT ROW_NUMBER() OVER (ORDER BY timestamp) AS rn, `table`, index_cols, inputCount, outputCount, exec_ns FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%' ORDER BY timestamp LIMIT 16"

  # -- Test 3: LIKE + Range (must be >= 3x faster) --
  - name: "EXPLAIN LIKE+Range aggregate uses canonical group carrier"
    sql: "EXPLAIN SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect:
      contains:
        - "touch_keytable"
        - "createcolumn"
        - ".grp:ft_large:"
        - "strlike"
        - "15000"
      not_contains:
        - "inner_select"

  - name: "Warm LIKE range bigram index outside aggregate timing"
    setup:
      - sql: "SELECT id FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
      - sql: "SELECT id FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "Clear log for LIKE+Range test"
    setup:
      - scm: '(sleep 0.1)'
      - sql: "DELETE FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%'"
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "LIKE+Range run 1"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }
  - name: "LIKE+Range run 2"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }
  - name: "LIKE+Range run 3"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }
  - name: "LIKE+Range run 4"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }
  - name: "LIKE+Range run 5"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }
  - name: "LIKE+Range run 6"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }
  - name: "LIKE+Range run 7"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }
  - name: "LIKE+Range run 8"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }

  - name: "Wait for LIKE+Range scan logs"
    setup:
      - scm: '(sleep 0.2)'
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  - name: "LIKE+Range speedup >= 3x"
    sql: |
      SELECT full_ns, cache_ns,
        CASE WHEN full_ns > 0 AND cache_ns > 0 AND (
          cache_ns * 3 <= full_ns * 2 OR (full_ns <= 5000000 AND cache_ns <= 5000000)
        ) THEN 'ok' ELSE 'FAIL' END AS result
      FROM (
        SELECT
          SUM(CASE WHEN `table` = 'ft_large' AND inputCount >= 10000 THEN exec_ns ELSE 0 END) AS full_ns,
          SUM(CASE WHEN `table` LIKE '.grp:ft_large:%' THEN exec_ns ELSE 0 END) AS cache_ns
        FROM `system_statistic`.`scans`
        WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%'
      ) s
    expect: { rows: 1, data: [{ result: "ok" }] }
    on_fail:
      - sql: "SELECT ROW_NUMBER() OVER (ORDER BY timestamp) AS rn, `table`, index_cols, inputCount, outputCount, exec_ns FROM `system_statistic`.`scans` WHERE `table` = 'ft_large' OR `table` LIKE '.grp:ft_large:%' ORDER BY timestamp LIMIT 16"

  - name: "Disable scan debugging"
    setup:
      - scm: '(settings "ScanDebugging" false)'
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

  # --- Range operator corner cases (>, >=, <, <=) with LIKE ---
  # Needles at id: 42, 1337, 15000, 22777, 29999
  - name: "LIKE + id > 15000 (strict, excludes boundary)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id > 15000"
    expect: { rows: 1, data: [{ cnt: 2 }] }

  - name: "LIKE + id >= 15000 (inclusive, includes boundary)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id >= 15000"
    expect: { rows: 1, data: [{ cnt: 3 }] }

  - name: "LIKE + id < 1337 (strict, excludes boundary)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id < 1337"
    expect: { rows: 1, data: [{ cnt: 1 }] }

  - name: "LIKE + id <= 1337 (inclusive, includes boundary)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id <= 1337"
    expect: { rows: 1, data: [{ cnt: 2 }] }

  - name: "LIKE + BETWEEN (id >= 1337 AND id <= 22777)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id >= 1337 AND id <= 22777"
    expect: { rows: 1, data: [{ cnt: 3 }] }

  - name: "LIKE + id = exact needle"
    sql: "SELECT name FROM ft_large WHERE name LIKE '%laus%' AND id = 22777"
    expect: { rows: 1, data: [{ name: "Hans Klausner" }] }

  - name: "LIKE + id = non-needle"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%laus%' AND id = 100"
    expect: { rows: 1, data: [{ cnt: 0 }] }

  # --- Correctness on large table after index is built ---
  - name: "Large LIKE %laus% finds all 5 needles"
    sql: "SELECT name, id FROM ft_large WHERE name LIKE '%laus%' ORDER BY id"
    expect:
      rows: 5
      data:
        - name: "Klaus Heinemann"
          id: 42
        - name: "Nikolaus Weber"
          id: 1337
        - name: "Klausberger Fritz"
          id: 15000
        - name: "Hans Klausner"
          id: 22777
        - name: "Klausmüller Gerd"
          id: 29999

  - name: "Large LIKE no match"
    sql: "SELECT COUNT(*) AS cnt FROM ft_large WHERE name LIKE '%zzzzz%'"
    expect: { rows: 1, data: [{ cnt: 0 }] }

  - name: "Large LIKE ORDER BY DESC + LIMIT"
    sql: "SELECT name, id FROM ft_large WHERE name LIKE '%laus%' ORDER BY id DESC LIMIT 3"
    expect:
      rows: 3
      data:
        - name: "Klausmüller Gerd"
          id: 29999
        - name: "Hans Klausner"
          id: 22777
        - name: "Klausberger Fritz"
          id: 15000

  - name: "Cross-check LIKE vs total"
    sql: |
      SELECT
        (SELECT COUNT(*) FROM ft_large WHERE name LIKE '%laus%') AS like_cnt,
        (SELECT COUNT(*) FROM ft_large) AS total
    expect: { rows: 1 }

  # --- Adaptive representation stress: alternating matches ---
  # Alternating membership exceeds the compact positive/negative-list capacity
  # and must switch in place to a bitmap without changing the result.
  - name: "Create alternating table"
    sql: |
      CREATE TABLE IF NOT EXISTS `ft_alternating` (
        id INT PRIMARY KEY,
        name TEXT
      )
    expect:
      rows: 0

  - name: "Insert alternating data"
    setup:
      - scm: |
          (begin
            (set rows (map (produceN 10000) (lambda (i)
              (list i (match (mod i 3)
                0 "Animal"
                1 "Person"
                _ "Object")))))
            (insert (table "memcp-tests" "ft_alternating") '("id" "name") rows))
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM ft_alternating"
    expect:
      rows: 1
      data:
        - cnt: 10000

  - name: "Alternating LIKE correctness"
    sql: "SELECT COUNT(*) AS cnt FROM ft_alternating WHERE name LIKE '%Person%'"
    expect:
      rows: 1
      data:
        - cnt: 3333

  - name: "Alternating LIKE with ORDER BY + LIMIT"
    sql: "SELECT id FROM ft_alternating WHERE name LIKE '%Person%' ORDER BY id LIMIT 5"
    expect:
      rows: 5
      data:
        - id: 1
        - id: 4
        - id: 7
        - id: 10
        - id: 13

  # --- Cross-check alternating ---
  - name: "Cross-check alternating LIKE vs total"
    sql: |
      SELECT
        (SELECT COUNT(*) FROM ft_alternating WHERE name LIKE '%Person%') AS like_cnt,
        (SELECT COUNT(*) FROM ft_alternating) AS total
    expect:
      rows: 1
      data:
        - like_cnt: 3333
          total: 10000

  # --- Direct storage boundary regression ---
  # Keep matching values below the lexical position of the LIKE pattern. A
  # binary search on a non-sorted matcher used to start after these records,
  # so only warm scans lost rows while SQL-level aggregate tests stayed green.
  - name: "Create exact match-set table"
    sql: |
      CREATE TABLE `ft_matchset` (
        id INT PRIMARY KEY,
        name TEXT,
        tag TEXT
      )
    expect: { rows: 0 }

  - name: "Insert exact match-set data"
    scm: |
      (begin
        (set rows (map (produceN 30000) (lambda (i)
          (list i
            (if (< i 100)
              (concat "!Klaus-" i)
              (if (< i 105) (concat "Klaus-" i) (concat "Person-" i)))
            (concat "!zzzz-" i)))))
        (insert (table "memcp-tests" "ft_matchset") (list "id" "name" "tag") rows)
        (rebuild)
        30000)

  - name: "Exact match-set fixture is visible through SQL"
    sql: "SELECT COUNT(*) AS cnt FROM ft_matchset WHERE tag LIKE '%zzzz%'"
    expect: { rows: 1, data: [{ cnt: 30000 }] }

  - name: "LIKE match set remains exact through warmup"
    scm: |
      (begin
        (set tbl (table "memcp-tests" "ft_matchset"))
        (set condition (eval (list
          'lambda (list 'search)
          (list 'strlike 'search "%zzzz%" "utf8mb4_general_ci"))))
        (set count-matches (lambda ()
          (recset_count (scan_recset nil tbl (list "tag") condition))))
        (set first (count-matches))
        (set built (count-matches))
        (set warm (count-matches))
        (if (and (equal? first 30000) (equal? built 30000) (equal? warm 30000))
          true
          (error (concat "LIKE match-set counts: " first ", " built ", " warm))))

  - name: "LIKE match sets keep collation semantics separate"
    scm: |
      (begin
        (set tbl (table "memcp-tests" "ft_matchset"))
        (set binary-condition (eval (list
          'lambda (list 'name)
          (list 'strlike 'name "%klaus%" "utf8mb4_bin"))))
        (set ci-condition (eval (list
          'lambda (list 'name)
          (list 'strlike 'name "%klaus%" "utf8mb4_general_ci"))))
        (set binary-count (recset_count (scan_recset nil tbl (list "name") binary-condition)))
        (set ci-count (recset_count (scan_recset nil tbl (list "name") ci-condition)))
        (if (and (equal? binary-count 0) (equal? ci-count 105))
          true
          (error (concat "LIKE collation counts: " binary-count ", " ci-count))))

  - name: "Cached LIKE match sets still evaluate delta rows"
    setup:
      - sql: "INSERT INTO ft_matchset (id, name, tag) VALUES (30000, 'klaus-delta', 'delta')"
    scm: |
      (begin
        (set tbl (table "memcp-tests" "ft_matchset"))
        (set binary-condition (eval (list
          'lambda (list 'name)
          (list 'strlike 'name "%klaus%" "utf8mb4_bin"))))
        (set ci-condition (eval (list
          'lambda (list 'name)
          (list 'strlike 'name "%klaus%" "utf8mb4_general_ci"))))
        (set binary-count (recset_count (scan_recset nil tbl (list "name") binary-condition)))
        (set ci-count (recset_count (scan_recset nil tbl (list "name") ci-condition)))
        (if (and (equal? binary-count 1) (equal? ci-count 106))
          true
          (error (concat "LIKE delta counts: " binary-count ", " ci-count))))

  - name: "Case-insensitive prefix LIKE does not use binary range semantics"
    sql: "SELECT COUNT(*) AS cnt FROM ft_matchset WHERE name LIKE 'klaus%'"
    expect: { rows: 1, data: [{ cnt: 6 }] }

  # Keep multi-shard correctness separate from the protected 30k timing
  # fixture above: changing its shard topology makes the existing aggregate
  # carrier comparison measure unrelated scheduling work.
  - name: "Create multi-shard LIKE candidate table"
    setup:
      - scm: '(settings "ShardSize" 32)'
    sql: "CREATE TABLE ft_multishard (id INT PRIMARY KEY, search TEXT)"
    expect: { rows: 0 }

  - name: "Insert multi-shard LIKE candidate data"
    setup:
      - scm: |
          (insert (table "memcp-tests" "ft_multishard") '("id" "search")
            (map (produceN 96) (lambda (i)
              (list i (if (equal? (mod i 31) 0)
                (concat "Casino hit " i)
                (concat "ordinary document " i))))))
      - scm: '(rebuild)'
    sql: "SELECT COUNT(*) AS cnt FROM ft_multishard"
    expect: { rows: 1, data: [{ cnt: 96 }] }

  - name: "Multi-shard LIKE candidate remains exact"
    sql: "SELECT id FROM ft_multishard WHERE search LIKE '%Casino%' ORDER BY id"
    expect:
      rows: 4
      data:
        - id: 0
        - id: 31
        - id: 62
        - id: 93

  - name: "Multi-shard absent bigram remains empty after warmup"
    setup:
      - sql: "SELECT id FROM ft_multishard WHERE search LIKE '%Casino%'"
      - sql: "SELECT id FROM ft_multishard WHERE search LIKE '%Casino%'"
    sql: "SELECT id FROM ft_multishard WHERE search LIKE '%zzzzz%'"
    expect: { rows: 0 }

  - name: "Restore default shard size"
    setup:
      - scm: '(settings "ShardSize" 60000)'
    sql: "SELECT 1 AS ok"
    expect: { rows: 1 }

cleanup:
  - sql: "DROP TABLE IF EXISTS `ft_customers`"
  - sql: "DROP TABLE IF EXISTS `ft_large`"
  - sql: "DROP TABLE IF EXISTS `ft_alternating`"
  - sql: "DROP TABLE IF EXISTS `ft_matchset`"
  - sql: "DROP TABLE IF EXISTS `ft_multishard`"
