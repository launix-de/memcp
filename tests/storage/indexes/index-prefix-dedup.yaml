#
# Tests for index prefix deduplication:
# 1. iterateIndex() reuses existing longer indexes instead of creating shorter ones
# 2. rebuildIndexes() transfers indexes across rebuild with savings decay
# 3. rebuildIndexes() merges prefix indexes into longer ones
# 4. Non-overlapping indexes are preserved across rebuild
# Uses scm:(rebuild) and scm:(show_shard_indexes ...) to verify index state.

metadata:
  isolated: true
  version: "1.0"
  description: "Index prefix deduplication on rebuild and creation"

test_cases:
  # ==============================================================
  # Phase 1: iterateIndex() prefix creation prevention
  # ==============================================================

  - name: "Setup: create table for prefix prevention"
    setup:
      - sql: "DROP TABLE IF EXISTS idx_nopfx"
      - scm: "(rebuild)"
    sql: "CREATE TABLE idx_nopfx (a INT, b INT, c INT)"

  - name: "Insert rows and rebuild"
    setup:
      - scm: |
          (begin
            (insert (table "memcp-tests" "idx_nopfx") '("a" "b" "c")
              (map (produceN 200) (lambda (i) (list i (* i 2) (* i 5)))))
            (rebuild))
    sql: "SELECT COUNT(*) AS cnt FROM idx_nopfx"
    expect:
      data:
        - cnt: 200

  # Create compound index (a, b) first by querying 3 times
  - name: "Create compound index hit 1"
    sql: "SELECT c FROM idx_nopfx WHERE a = 10 AND b = 20"
    expect:
      rows: 1

  - name: "Create compound index hit 2"
    sql: "SELECT c FROM idx_nopfx WHERE a = 20 AND b = 40"
    expect:
      rows: 1

  - name: "Create compound index hit 3"
    sql: "SELECT c FROM idx_nopfx WHERE a = 30 AND b = 60"
    expect:
      rows: 1

  # Now query on (a) alone — should reuse the (a, b) index, NOT create a new one
  - name: "Single-col query reuses compound index 1"
    sql: "SELECT c FROM idx_nopfx WHERE a = 40"
    expect:
      rows: 1

  - name: "Single-col query reuses compound index 2"
    sql: "SELECT c FROM idx_nopfx WHERE a = 50"
    expect:
      rows: 1

  - name: "Single-col query reuses compound index 3"
    sql: "SELECT c FROM idx_nopfx WHERE a = 60"
    expect:
      rows: 1

  # Verify only one index exists — the shorter prefix was NOT created
  - name: "Only compound index exists (no prefix created)"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nopfx" 0 true) "indexes"))
        (if (equal? (count indexes) 1) "ok"
          (error (concat "expected 1 index, got " (count indexes)))))

  - name: "The single index is the compound (a|b)"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nopfx" 0 true) "indexes"))
        (set idx (nth indexes 0))
        (set cols (get_assoc idx "cols"))
        (if (equal? cols "a(equal)|b(equal)") "ok"
          (error (concat "expected a|b, got " cols))))

  - name: "Compound index has accumulated savings from prefix queries"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nopfx" 0 true) "indexes"))
        (set idx (nth indexes 0))
        (set savings (get_assoc idx "savings"))
        (if (> savings 5.0) "ok"
          (error (concat "expected savings > 5.0 (6 queries total), got " savings))))

  # ==============================================================
  # Phase 2: rebuildIndexes() preserves indexes with savings decay
  # Insert a row to force actual rebuild (not the no-op else branch)
  # ==============================================================

  - name: "Insert extra row to force rebuild"
    sql: "INSERT INTO idx_nopfx VALUES (999, 999, 999)"

  - name: "Rebuild with pending delta"
    scm: "(rebuild)"

  - name: "Post-rebuild: index is preserved"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nopfx" 0 true) "indexes"))
        (if (equal? (count indexes) 1) "ok"
          (error (concat "expected 1 index after rebuild, got " (count indexes)))))

  - name: "Post-rebuild: index columns preserved"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nopfx" 0 true) "indexes"))
        (set idx (nth indexes 0))
        (set cols (get_assoc idx "cols"))
        (if (equal? cols "a(equal)|b(equal)") "ok"
          (error (concat "expected a|b after rebuild, got " cols))))

  - name: "Post-rebuild: savings decayed (< pre-rebuild value)"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nopfx" 0 true) "indexes"))
        (set idx (nth indexes 0))
        (set savings (get_assoc idx "savings"))
        (if (> savings 2.0) "ok"
          (error (concat "expected savings > 2.0 after 0.9x decay, got " savings))))

  # Queries still work after rebuild (index rebuilds lazily)
  - name: "Post-rebuild: compound query still works"
    sql: "SELECT c FROM idx_nopfx WHERE a = 70 AND b = 140"
    expect:
      rows: 1

  - name: "Post-rebuild: prefix query still works"
    sql: "SELECT c FROM idx_nopfx WHERE a = 80"
    expect:
      rows: 1

  # ==============================================================
  # Phase 3: rebuildIndexes() merges prefix indexes
  # Create shorter index first, then longer — rebuild should merge
  # ==============================================================

  - name: "Setup: create table for prefix merge on rebuild"
    setup:
      - sql: "DROP TABLE IF EXISTS idx_rev"
      - scm: "(rebuild)"
    sql: "CREATE TABLE idx_rev (p INT, q INT, r INT)"

  - name: "Insert rows and rebuild"
    setup:
      - scm: |
          (begin
            (insert (table "memcp-tests" "idx_rev") '("p" "q" "r")
              (map (produceN 200) (lambda (i) (list i (* i 4) (* i 9)))))
            (rebuild))
    sql: "SELECT COUNT(*) AS cnt FROM idx_rev"
    expect:
      data:
        - cnt: 200

  # Create single-col index (p) FIRST
  - name: "Create single-col index first hit 1"
    sql: "SELECT r FROM idx_rev WHERE p = 10"
    expect:
      rows: 1

  - name: "Create single-col index first hit 2"
    sql: "SELECT r FROM idx_rev WHERE p = 20"
    expect:
      rows: 1

  - name: "Create single-col index first hit 3"
    sql: "SELECT r FROM idx_rev WHERE p = 30"
    expect:
      rows: 1

  # Now create compound index (p, q)
  - name: "Create compound index hit 1"
    sql: "SELECT r FROM idx_rev WHERE p = 40 AND q = 160"
    expect:
      rows: 1

  - name: "Create compound index hit 2"
    sql: "SELECT r FROM idx_rev WHERE p = 50 AND q = 200"
    expect:
      rows: 1

  - name: "Create compound index hit 3"
    sql: "SELECT r FROM idx_rev WHERE p = 60 AND q = 240"
    expect:
      rows: 1

  # Two indexes should exist: (p) and (p|q)
  - name: "Both indexes exist before rebuild"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_rev" 0 true) "indexes"))
        (if (equal? (count indexes) 2) "ok"
          (error (concat "expected 2 indexes, got " (count indexes)))))

  # Insert a row to force actual rebuild (needs pending delta)
  - name: "Insert extra row to trigger real rebuild"
    sql: "INSERT INTO idx_rev VALUES (999, 999, 999)"

  # Rebuild should merge (p) into (p|q) via prefix dedup
  - name: "Rebuild merges prefix into compound"
    scm: "(rebuild)"

  - name: "Post-rebuild: only compound index remains"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_rev" 0 true) "indexes"))
        (if (equal? (count indexes) 1) "ok"
          (error (concat "expected 1 index after prefix dedup, got " (count indexes)))))

  - name: "Post-rebuild: surviving index is p|q"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_rev" 0 true) "indexes"))
        (set idx (nth indexes 0))
        (set cols (get_assoc idx "cols"))
        (if (equal? cols "p(equal)|q(equal)") "ok"
          (error (concat "expected p|q, got " cols))))

  - name: "Post-rebuild: merged savings from both indexes"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_rev" 0 true) "indexes"))
        (set idx (nth indexes 0))
        (set savings (get_assoc idx "savings"))
        (if (> savings 3.0) "ok"
          (error (concat "expected merged savings > 3.0, got " savings))))

  # Queries still correct after dedup
  - name: "Post-dedup: single-col query works via compound index"
    sql: "SELECT r FROM idx_rev WHERE p = 99"
    expect:
      rows: 1

  - name: "Post-dedup: compound query works"
    sql: "SELECT r FROM idx_rev WHERE p = 100 AND q = 400"
    expect:
      rows: 1

  # ==============================================================
  # Phase 4: Non-prefix indexes are NOT merged
  # ==============================================================

  - name: "Setup: create table for non-prefix test"
    setup:
      - sql: "DROP TABLE IF EXISTS idx_nonoverlap"
      - scm: "(rebuild)"
    sql: "CREATE TABLE idx_nonoverlap (x INT, y INT, z INT)"

  - name: "Insert rows and rebuild"
    setup:
      - scm: |
          (begin
            (insert (table "memcp-tests" "idx_nonoverlap") '("x" "y" "z")
              (map (produceN 200) (lambda (i) (list i (* i 3) (* i 7)))))
            (rebuild))
    sql: "SELECT COUNT(*) AS cnt FROM idx_nonoverlap"
    expect:
      data:
        - cnt: 200

  # Create index on (x) by querying 3 times
  - name: "Create x index hit 1"
    sql: "SELECT z FROM idx_nonoverlap WHERE x = 10"
    expect:
      rows: 1

  - name: "Create x index hit 2"
    sql: "SELECT z FROM idx_nonoverlap WHERE x = 20"
    expect:
      rows: 1

  - name: "Create x index hit 3"
    sql: "SELECT z FROM idx_nonoverlap WHERE x = 30"
    expect:
      rows: 1

  # Create index on (y) by querying 3 times — different column, NOT a prefix
  - name: "Create y index hit 1"
    sql: "SELECT z FROM idx_nonoverlap WHERE y = 30"
    expect:
      rows: 1

  - name: "Create y index hit 2"
    sql: "SELECT z FROM idx_nonoverlap WHERE y = 60"
    expect:
      rows: 1

  - name: "Create y index hit 3"
    sql: "SELECT z FROM idx_nonoverlap WHERE y = 90"
    expect:
      rows: 1

  # Verify both exist before rebuild
  - name: "Two non-overlapping indexes exist"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nonoverlap" 0 true) "indexes"))
        (if (equal? (count indexes) 2) "ok"
          (error (concat "expected 2 indexes, got " (count indexes)))))

  # Insert a row to force actual rebuild, then verify both survive
  - name: "Non-prefix indexes both survive rebuild"
    setup:
      - sql: "INSERT INTO idx_nonoverlap VALUES (999, 999, 999)"
      - scm: "(rebuild)"
    scm: |
      (begin
        (set indexes ((show "memcp-tests" "idx_nonoverlap" 0 true) "indexes"))
        (if (equal? (count indexes) 2) "ok"
          (error (concat "expected 2 non-overlapping indexes after rebuild, got " (count indexes)))))

  - name: "Non-prefix queries still work after rebuild"
    sql: "SELECT z FROM idx_nonoverlap WHERE x = 50"
    expect:
      rows: 1

  # ==============================================================
  # Phase 5: Ordered auto indexes retain the complete sort relation
  # ==============================================================

  - name: "Setup ordered relation index table"
    setup:
      - sql: "DROP TABLE IF EXISTS idx_order_relation"
      - scm: "(rebuild)"
    sql: |
      CREATE TABLE idx_order_relation (
        id INT,
        tenant INT,
        label VARCHAR(40) COLLATE utf8mb4_unicode_ci
      )

  - name: "Insert deliberately unordered collated rows"
    setup:
      - sql: |
          INSERT INTO idx_order_relation VALUES
            (1, 1, 'Zulu'),
            (2, 1, NULL),
            (3, 1, 'apple'),
            (4, 1, 'Banana'),
            (5, 1, 'apricot'),
            (6, 1, 'cherry'),
            (7, 2, 'aardvark'),
            (8, 2, NULL)
      - scm: "(rebuild)"
    sql: "SELECT COUNT(*) AS cnt FROM idx_order_relation"
    expect:
      data:
        - cnt: 8

  - name: "Cold collated ASC index preserves NULL order before LIMIT"
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label ASC LIMIT 3"
    expect:
      rows: 3
      data:
        - id: 2
          label: null
        - id: 3
          label: "apple"
        - id: 5
          label: "apricot"

  - name: "Warm collated ASC index preserves NULL order before LIMIT"
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label ASC LIMIT 3"
    expect:
      rows: 3
      data:
        - id: 2
          label: null
        - id: 3
          label: "apple"
        - id: 5
          label: "apricot"

  - name: "Collated DESC uses its own relation and puts NULL last"
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label DESC LIMIT 3"
    expect:
      rows: 3
      data:
        - id: 1
          label: "Zulu"
        - id: 6
          label: "cherry"
        - id: 4
          label: "Banana"

  - name: "Warm collated DESC relation remains stable"
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label DESC LIMIT 3"
    expect:
      rows: 3
      data:
        - id: 1
          label: "Zulu"
        - id: 6
          label: "cherry"
        - id: 4
          label: "Banana"

  - name: "Delta rows merge through the stored DESC relation"
    setup:
      - sql: |
          INSERT INTO idx_order_relation VALUES
            (10, 1, 'apple'),
            (11, 1, NULL)
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label DESC LIMIT 3"
    expect:
      data:
        - id: 1
          label: "Zulu"
        - id: 6
          label: "cherry"
        - id: 4
          label: "Banana"

  - name: "Cold mixed ASC DESC order keeps NULL ties deterministic"
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label ASC, id DESC LIMIT 4"
    expect:
      data:
        - id: 11
          label: null
        - id: 2
          label: null
        - id: 10
          label: "apple"
        - id: 3
          label: "apple"

  - name: "Warm mixed ASC DESC index keeps NULL ties deterministic"
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label ASC, id DESC LIMIT 4"
    expect:
      data:
        - id: 11
          label: null
        - id: 2
          label: null
        - id: 10
          label: "apple"
        - id: 3
          label: "apple"

  - name: "Unfiltered DESC uses NULL-last semantics"
    sql: "SELECT id, label FROM idx_order_relation ORDER BY label DESC LIMIT 3"
    expect:
      data:
        - id: 7
          label: "aardvark"
        - id: 1
          label: "Zulu"
        - id: 6
          label: "cherry"

  - name: "ASC and DESC auto indexes retain distinct order metadata"
    scm: |
      (begin
        (define indexes ((show "memcp-tests" "idx_order_relation" 0 true) "indexes"))
        (define asc_count (reduce indexes (lambda (n index)
          (begin
            (define orders (get_assoc index "orders"))
            (if (and (>= (count orders) 2)
                (equal? (nth orders 0) "utf8mb4:asc")
                (equal? (nth orders 1) "utf8mb4_unicode_ci:asc")) (+ n 1) n))) 0))
        (define desc_count (reduce indexes (lambda (n index)
          (begin
            (define orders (get_assoc index "orders"))
            (if (and (>= (count orders) 2)
                (equal? (nth orders 0) "utf8mb4:asc")
                (equal? (nth orders 1) "utf8mb4_unicode_ci:desc")) (+ n 1) n))) 0))
        (if (and (> asc_count 0) (> desc_count 0))
          "ok"
          (error (concat "expected separate ASC/DESC relation indexes, got " (serialize indexes)))))

  - name: "Rebuild preserves ordered relation identity"
    setup:
      - sql: "INSERT INTO idx_order_relation VALUES (9, 1, 'blueberry')"
      - scm: "(rebuild)"
    scm: |
      (begin
        (define indexes ((show "memcp-tests" "idx_order_relation" 0 true) "indexes"))
        (define asc_count (reduce indexes (lambda (n index)
          (begin
            (define orders (get_assoc index "orders"))
            (if (and (>= (count orders) 2)
                (equal? (nth orders 0) "utf8mb4:asc")
                (equal? (nth orders 1) "utf8mb4_unicode_ci:asc")) (+ n 1) n))) 0))
        (define desc_count (reduce indexes (lambda (n index)
          (begin
            (define orders (get_assoc index "orders"))
            (if (and (>= (count orders) 2)
                (equal? (nth orders 0) "utf8mb4:asc")
                (equal? (nth orders 1) "utf8mb4_unicode_ci:desc")) (+ n 1) n))) 0))
        (if (and (> asc_count 0) (> desc_count 0))
          "ok"
          (error (concat "ordered relation metadata lost on rebuild: " (serialize indexes)))))

  - name: "Rebuilt mixed relation remains executable"
    sql: "SELECT id, label FROM idx_order_relation WHERE tenant = 1 ORDER BY label ASC, id DESC LIMIT 4"
    expect:
      data:
        - id: 11
          label: null
        - id: 2
          label: null
        - id: 10
          label: "apple"
        - id: 3
          label: "apple"

cleanup:
  - sql: "DROP TABLE IF EXISTS idx_nopfx"
  - sql: "DROP TABLE IF EXISTS idx_nonoverlap"
  - sql: "DROP TABLE IF EXISTS idx_order_relation"
  - sql: "DROP TABLE IF EXISTS idx_rev"
