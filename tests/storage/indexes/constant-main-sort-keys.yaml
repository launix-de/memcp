metadata:
  syntax: mysql
  isolated: true
  description: Main sort preparation uses only authoritative physical constants while
    bounds and delta order retain complete keys
setup:
- sql: DROP TABLE IF EXISTS constant_main_sort_keys
- sql: CREATE TABLE constant_main_sort_keys(id INT PRIMARY KEY,region VARCHAR(12),note
    VARCHAR(12),stamp INT) ENGINE=sloppy
- scm: |-
    (begin
      (define fixture (table "memcp-tests" false "constant_main_sort_keys" false nil))
      (insert fixture '("id" "region" "note" "stamp")
        (map (produceN 2000) (lambda (i) (list (+ i 1) "same" nil i))))
      (rebuild fixture true false nil true))
test_cases:
- name: A complete constant main coordinate preserves every projected value
  scm: |-
    (begin
      (define cache (newcachemap))
      (define input (newsession)) (input "username" "root") (input "schema" "memcp-tests")
      (define run (lambda (query) (begin
        (define answer (newsession)) (answer "rows" (list))
        (sql_execute_formula input nil
          (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" input true nil)
          (lambda (row) (answer "rows" (append (answer "rows") row))) (lambda args true))
        (answer "rows"))))
      (define expected (map (produceN 2000) (lambda (_i) (list "region" "same"))))
      (map (produceN 4) (lambda (_i)
        (expression_equal? (run "SELECT region FROM constant_main_sort_keys ORDER BY region") expected))))
  expect:
    result:
    - true
    - true
    - true
    - true
- name: Constant text prefix and NULL middle key retain descending tuples
  scm: |-
    (begin
      (define cache (newcachemap))
      (define input (newsession)) (input "username" "root") (input "schema" "memcp-tests")
      (define run (lambda (query) (begin
        (define answer (newsession)) (answer "rows" (list))
        (sql_execute_formula input nil
          (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" input true nil)
          (lambda (row) (answer "rows" (append (answer "rows") row))) (lambda args true))
        (answer "rows"))))
      (map (produceN 4) (lambda (_i) (run "SELECT id,region,note,stamp FROM constant_main_sort_keys WHERE region='same' ORDER BY note ASC,stamp DESC,id DESC LIMIT 4"))))
  expect:
    result:
    - &id001
      - - id
        - 2000
        - region
        - same
        - note
        - null
        - stamp
        - 1999
      - - id
        - 1999
        - region
        - same
        - note
        - null
        - stamp
        - 1998
      - - id
        - 1998
        - region
        - same
        - note
        - null
        - stamp
        - 1997
      - - id
        - 1997
        - region
        - same
        - note
        - null
        - stamp
        - 1996
    - *id001
    - *id001
    - *id001
- name: Reverse constant coordinates retain ascending suffix tuples
  scm: |-
    (begin
      (define cache (newcachemap))
      (define input (newsession)) (input "username" "root") (input "schema" "memcp-tests")
      (define run (lambda (query) (begin
        (define answer (newsession)) (answer "rows" (list))
        (sql_execute_formula input nil
          (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" input true nil)
          (lambda (row) (answer "rows" (append (answer "rows") row))) (lambda args true))
        (answer "rows"))))
      (map (produceN 4) (lambda (_i) (run "SELECT id,region,note,stamp FROM constant_main_sort_keys ORDER BY region DESC,note DESC,stamp ASC,id ASC LIMIT 4"))))
  expect:
    result:
    - &id002
      - - id
        - 1
        - region
        - same
        - note
        - null
        - stamp
        - 0
      - - id
        - 2
        - region
        - same
        - note
        - null
        - stamp
        - 1
      - - id
        - 3
        - region
        - same
        - note
        - null
        - stamp
        - 2
      - - id
        - 4
        - region
        - same
        - note
        - null
        - stamp
        - 3
    - *id002
    - *id002
    - *id002
- name: Delta values retain the full index coordinates beside constant main keys
  scm: |-
    (begin
      (define cache (newcachemap))
      (define input (newsession)) (input "username" "root") (input "schema" "memcp-tests")
      (define run (lambda (query) (begin
        (define answer (newsession)) (answer "rows" (list))
        (sql_execute_formula input nil
          (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" input true nil)
          (lambda (row) (answer "rows" (append (answer "rows") row))) (lambda args true))
        (answer "rows"))))
      (map (produceN 4) (lambda (_i) (run "SELECT id,region,note,stamp FROM constant_main_sort_keys WHERE region='same' ORDER BY note ASC,stamp DESC,id DESC LIMIT 4"))))
  expect:
    result:
    - &id003
      - - id
        - 2003
        - region
        - same
        - note
        - null
        - stamp
        - 3001
      - - id
        - 2000
        - region
        - same
        - note
        - null
        - stamp
        - 1999
      - - id
        - 1999
        - region
        - same
        - note
        - null
        - stamp
        - 1998
      - - id
        - 1998
        - region
        - same
        - note
        - null
        - stamp
        - 1997
    - *id003
    - *id003
    - *id003
  setup:
  - sql: INSERT INTO constant_main_sort_keys VALUES(2001,'other','x',-1),(2002,'same','x',3000),(2003,'same',NULL,3001),(2004,'other',NULL,3002)
- name: A native window crosses from NULL main keys to a nonconstant delta key
  scm: |-
    (begin
      (define cache (newcachemap))
      (define input (newsession)) (input "username" "root") (input "schema" "memcp-tests")
      (define run (lambda (query) (begin
        (define answer (newsession)) (answer "rows" (list))
        (sql_execute_formula input nil
          (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" input true nil)
          (lambda (row) (answer "rows" (append (answer "rows") row))) (lambda args true))
        (answer "rows"))))
      (map (produceN 4) (lambda (_i) (run "SELECT id,region,note,stamp FROM constant_main_sort_keys WHERE region='same' ORDER BY note ASC,stamp DESC,id DESC LIMIT 3 OFFSET 1999"))))
  expect:
    result:
    - &id004
      - - id
        - 2
        - region
        - same
        - note
        - null
        - stamp
        - 1
      - - id
        - 1
        - region
        - same
        - note
        - null
        - stamp
        - 0
      - - id
        - 2002
        - region
        - same
        - note
        - x
        - stamp
        - 3000
    - *id004
    - *id004
    - *id004
- name: A mismatching main prefix still selects both matching delta tuples
  scm: |-
    (begin
      (define cache (newcachemap))
      (define input (newsession)) (input "username" "root") (input "schema" "memcp-tests")
      (define run (lambda (query) (begin
        (define answer (newsession)) (answer "rows" (list))
        (sql_execute_formula input nil
          (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" input true nil)
          (lambda (row) (answer "rows" (append (answer "rows") row))) (lambda args true))
        (answer "rows"))))
      (map (produceN 4) (lambda (_i) (run "SELECT id,region,note,stamp FROM constant_main_sort_keys WHERE region='other' ORDER BY note ASC,stamp DESC,id DESC"))))
  expect:
    result:
    - &id005
      - - id
        - 2004
        - region
        - other
        - note
        - null
        - stamp
        - 3002
      - - id
        - 2001
        - region
        - other
        - note
        - x
        - stamp
        - -1
    - *id005
    - *id005
    - *id005
- name: Main replacement retains filtering and tuple order after constant-key preparation
  scm: |-
    (begin
      (define cache (newcachemap))
      (define input (newsession)) (input "username" "root") (input "schema" "memcp-tests")
      (define run (lambda (query) (begin
        (define answer (newsession)) (answer "rows" (list))
        (sql_execute_formula input nil
          (cached_parse cache "sql" (list parse_sql) "memcp-tests" query nil "root" input true nil)
          (lambda (row) (answer "rows" (append (answer "rows") row))) (lambda args true))
        (answer "rows"))))
      (map (produceN 4) (lambda (_i) (run "SELECT id,region,note,stamp FROM constant_main_sort_keys WHERE region='same' ORDER BY note ASC,stamp DESC,id DESC LIMIT 4"))))
  expect:
    result:
    - &id006
      - - id
        - 2003
        - region
        - same
        - note
        - null
        - stamp
        - 3001
      - - id
        - 1999
        - region
        - same
        - note
        - null
        - stamp
        - 1998
      - - id
        - 1998
        - region
        - same
        - note
        - null
        - stamp
        - 1997
      - - id
        - 1997
        - region
        - same
        - note
        - null
        - stamp
        - 1996
    - *id006
    - *id006
    - *id006
  setup:
  - sql: UPDATE constant_main_sort_keys SET region='other',note='x',stamp=4000 WHERE
      id=2000
cleanup:
- sql: DROP TABLE IF EXISTS constant_main_sort_keys
