metadata:
  version: "1.0"
  description: "Canonical computed lookup caches and cascading invalidation"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS lookup_cache_document"
  - sql: "DROP TABLE IF EXISTS lookup_cache_file"
  - sql: "DROP TABLE IF EXISTS lookup_cache_folder"
  - sql: "CREATE TABLE lookup_cache_folder (id INT PRIMARY KEY, stamp INT, label_code INT)"
  - sql: "CREATE TABLE lookup_cache_file (id INT PRIMARY KEY, folder_id INT)"
  - sql: "CREATE TABLE lookup_cache_document (id INT PRIMARY KEY, file_id INT)"
  - sql: "INSERT INTO lookup_cache_folder VALUES (1, 100, 7), (2, 200, 9)"
  - sql: "INSERT INTO lookup_cache_file VALUES (10, 1), (20, 2)"
  - sql: "INSERT INTO lookup_cache_document VALUES (1000, 10), (2000, 20)"

test_cases:
  - name: "Create the first canonical lookup cache"
    scm: |
      (createcolumn
        (table "memcp-tests" false "lookup_cache_file" false nil)
        ".lookup:folder_stamp" "INT" '() '("temp" true)
        '("folder_id")
        (lambda (folder_id)
          (scan nil
            (table "memcp-tests" false "lookup_cache_folder" false nil)
            (list 369436175368192 (scan_boundary "equal" "id" 0 0 true true "" false)) (list folder_id)
            '("id") (lambda (id) (equal? id (outer 1 folder_id)))
            '("stamp") (lambda (acc stamp) stamp)
            0 (lambda (old value) value) false)))

  - name: "Create a fused lookup cache reading multiple source columns"
    scm: |
      (createcolumn
        (table "memcp-tests" false "lookup_cache_file" false nil)
        ".lookup:folder_pair" "INT" '() '("temp" true)
        '("folder_id")
        (lambda (folder_id)
          (scan nil
            (table "memcp-tests" false "lookup_cache_folder" false nil)
            (list 369436175368192 (scan_boundary "equal" "id" 0 0 true true "" false)) (list folder_id)
            '("id") (lambda (id) (equal? id (outer 1 folder_id)))
            '("stamp" "label_code") (lambda (acc stamp label_code) (+ stamp label_code))
            0 (lambda (old value) value) false)))

  - name: "Create a lookup cache depending on another lookup cache"
    scm: |
      (createcolumn
        (table "memcp-tests" false "lookup_cache_document" false nil)
        ".lookup:file_folder_stamp" "INT" '() '("temp" true)
        '("file_id")
        (lambda (file_id)
          (scan nil
            (table "memcp-tests" false "lookup_cache_file" false nil)
            (list 369436175368192 (scan_boundary "equal" "id" 0 0 true true "" false)) (list file_id)
            '("id") (lambda (id) (equal? id (outer 1 file_id)))
            '(".lookup:folder_stamp") (lambda (acc folder_stamp) folder_stamp)
            0 (lambda (old value) value) false)))

  - name: "Create a nested cache from the fused lookup output"
    scm: |
      (createcolumn
        (table "memcp-tests" false "lookup_cache_document" false nil)
        ".lookup:file_folder_pair" "INT" '() '("temp" true)
        '("file_id")
        (lambda (file_id)
          (scan nil
            (table "memcp-tests" false "lookup_cache_file" false nil)
            (list 369436175368192 (scan_boundary "equal" "id" 0 0 true true "" false)) (list file_id)
            '("id") (lambda (id) (equal? id (outer 1 file_id)))
            '(".lookup:folder_pair") (lambda (acc folder_pair) folder_pair)
            0 (lambda (old value) value) false)))

  - name: "Nested lookup caches expose their initial values"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 100
          pair_value: 107
        - id: 2000
          stamp: 200
          pair_value: 209

  - name: "Mutate the source of one nested lookup branch"
    sql: "UPDATE lookup_cache_folder SET stamp = 111 WHERE id = 1"
    expect:
      affected_rows: 1

  - name: "Invalidation cascades through both lookup cache levels"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 111
          pair_value: 118
        - id: 2000
          stamp: 200
          pair_value: 209

  - name: "Point a cache row at a source key that does not exist yet"
    sql: "UPDATE lookup_cache_file SET folder_id = 3 WHERE id = 20"
    expect:
      affected_rows: 1

  - name: "The missing lookup result is cached without affecting its sibling"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 111
          pair_value: 118
        - id: 2000
          stamp: 0
          pair_value: 0

  - name: "Move a source row onto the previously missing lookup key"
    sql: "UPDATE lookup_cache_folder SET id = 3 WHERE id = 2"
    expect:
      affected_rows: 1

  - name: "Changing the source join key invalidates matches for the new key"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 111
          pair_value: 118
        - id: 2000
          stamp: 200
          pair_value: 209

  - name: "Move a lookup row to another parent"
    sql: "UPDATE lookup_cache_file SET folder_id = 1 WHERE id = 20"
    expect:
      affected_rows: 1

  - name: "Changing an intermediate lookup key invalidates its consumers"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 111
          pair_value: 118
        - id: 2000
          stamp: 111
          pair_value: 118

  - name: "Move a driver row to another cached lookup"
    sql: "UPDATE lookup_cache_document SET file_id = 20 WHERE id = 1000"
    expect:
      affected_rows: 1

  - name: "Changing the local lookup key computes the new row value"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 111
          pair_value: 118
        - id: 2000
          stamp: 111
          pair_value: 118

  - name: "Delete the nested lookup source"
    sql: "DELETE FROM lookup_cache_folder WHERE id = 1"
    expect:
      affected_rows: 1

  - name: "Deleting a lookup source invalidates all matching cache levels"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 0
          pair_value: 0
        - id: 2000
          stamp: 0
          pair_value: 0

  - name: "Reinsert the nested lookup source"
    sql: "INSERT INTO lookup_cache_folder VALUES (1, 333, 17)"
    expect:
      affected_rows: 1

  - name: "Inserting a lookup source repairs all matching cache levels"
    sql: |
      SELECT id, `.lookup:file_folder_stamp` AS stamp,
             `.lookup:file_folder_pair` AS pair_value
      FROM lookup_cache_document
      ORDER BY id
    expect:
      rows: 2
      data:
        - id: 1000
          stamp: 333
          pair_value: 350
        - id: 2000
          stamp: 333
          pair_value: 350

  - name: "Declare a complete column while preparing only selected rows"
    setup:
      - sql: "DROP TABLE IF EXISTS filtered_prepare_values"
      - sql: "CREATE TABLE filtered_prepare_values(id INT PRIMARY KEY, value INT)"
      - sql: "INSERT INTO filtered_prepare_values VALUES(1,10),(2,NULL),(3,30)"
    scm: |
      (createcolumn (table "memcp-tests" false "filtered_prepare_values" false nil)
        "prepared_value" "INT" '()
        (list "temp" true "filtercols" '("id") "filter" (lambda (id) (>= id 2)))
        '("value") (lambda (value) (* value 2)))

  - name: "Unprepared rows remain readable and cached NULL is a value"
    sql: "SELECT id,prepared_value FROM filtered_prepare_values ORDER BY id"
    expect:
      rows: 3
      data: [{id: 1, prepared_value: 20}, {id: 2, prepared_value: null}, {id: 3, prepared_value: 60}]

  - name: "Another preparation filter addresses the same complete column"
    scm: |
      (createcolumn (table "memcp-tests" false "filtered_prepare_values" false nil)
        "prepared_value" "INT" '()
        (list "temp" true "filtercols" '("id") "filter" (lambda (id) (equal? id 1)))
        '("value") (lambda (value) (* value 2)))

  - name: "Prepared values observe source mutation"
    setup:
      - sql: "UPDATE filtered_prepare_values SET value=31 WHERE id=3"
    sql: "SELECT id,prepared_value FROM filtered_prepare_values WHERE prepared_value>50"
    expect: {rows: 1, data: [{id: 3, prepared_value: 62}]}

  - name: "Filtered preparation still rejects implicit request state"
    scm: |
      (createcolumn (table "memcp-tests" false "filtered_prepare_values" false nil)
        "invalid_prepared_value" "INT" '() '("temp" true)
        '("value") (lambda (value) (session "request-only")))
    expect: {error: true}

  - name: "Register caches whose native value contract distinguishes NULL and zero"
    setup:
      - sql: "DROP TABLE IF EXISTS value_guard_target"
      - sql: "DROP TABLE IF EXISTS value_guard_source"
      - sql: "CREATE TABLE value_guard_source(id INT PRIMARY KEY, value INT, independent INT)"
      - sql: "CREATE TABLE value_guard_target(id INT PRIMARY KEY, note INT)"
      - sql: "INSERT INTO value_guard_source VALUES(1,NULL,101),(2,0,202)"
      - sql: "INSERT INTO value_guard_target VALUES(10,700)"
    scm: |
      (begin
        (createcolumn (table "memcp-tests" false "value_guard_target" false nil)
          "null_rows" "INT" (list) (list "temp" true) (list)
          (lambda ()
            (scan nil (table "memcp-tests" false "value_guard_source" false nil)
              (scan_access_schema (list) (list) nil false (list "value")) (list)
              (list "value") (lambda (value) (nil? value))
              (list) (lambda (acc) (+ acc 1)) 0 + false)))
        (createcolumn (table "memcp-tests" false "value_guard_target" false nil)
          "value_marker" "INT" (list) (list "temp" true) (list)
          (lambda ()
            (scan nil (table "memcp-tests" false "value_guard_source" false nil)
              (scan_access_schema (list (scan_boundary "equal" "id" 0 0 true true "bin" false))
                (list) nil false (list "id")) (list 1)
              (list "id") (lambda (id) (equal? id 1))
              (list "value") (lambda (acc value) (if (nil? value) 11 22))
              nil (lambda (left right) (coalesceNil left right)) false)))
        true)
    expect: {result: true}

  - name: "Warm complete native aggregate and value caches before a NULL update"
    sql: "SELECT id,note,null_rows,value_marker FROM value_guard_target"
    expect: {rows: 1, data: [{id: 10, note: 700, null_rows: 1, value_marker: 11}]}

  - name: "A stored NULL becomes zero on its original source row"
    sql: "UPDATE value_guard_source SET value=0 WHERE id=1"
    expect: {affected_rows: 1}

  - name: "The actual source retains all independent values after NULL to zero"
    sql: "SELECT id,value,independent FROM value_guard_source ORDER BY id"
    expect: {rows: 2, data: [{id: 1, value: 0, independent: 101}, {id: 2, value: 0, independent: 202}]}

  - name: "NULL to zero refreshes both warmed native dependency results"
    sql: "SELECT id,note,null_rows,value_marker FROM value_guard_target"
    expect: {rows: 1, data: [{id: 10, note: 700, null_rows: 0, value_marker: 22}]}

  - name: "Assigning the same non-NULL value remains a valid update"
    sql: "UPDATE value_guard_source SET value=0 WHERE id=1"

  - name: "An independent source column can change without altering the cached value contract"
    sql: "UPDATE value_guard_source SET independent=111 WHERE id=1"
    expect: {affected_rows: 1}

  - name: "No-op value updates preserve both sources and their unrelated columns"
    sql: "SELECT id,value,independent FROM value_guard_source ORDER BY id"
    expect: {rows: 2, data: [{id: 1, value: 0, independent: 111}, {id: 2, value: 0, independent: 202}]}

  - name: "Unchanged dependency values retain complete aggregate and marker results"
    sql: "SELECT id,note,null_rows,value_marker FROM value_guard_target"
    expect: {rows: 1, data: [{id: 10, note: 700, null_rows: 0, value_marker: 22}]}

  - name: "A stored zero becomes NULL on the same source row"
    sql: "UPDATE value_guard_source SET value=NULL WHERE id=1"
    expect: {affected_rows: 1}

  - name: "The actual source retains its independent values after zero to NULL"
    sql: "SELECT id,value,independent FROM value_guard_source ORDER BY id"
    expect: {rows: 2, data: [{id: 1, value: null, independent: 111}, {id: 2, value: 0, independent: 202}]}

  - name: "Zero to NULL refreshes the aggregate and native value projection"
    sql: "SELECT id,note,null_rows,value_marker FROM value_guard_target"
    expect: {rows: 1, data: [{id: 10, note: 700, null_rows: 1, value_marker: 11}]}

  - name: "Assigning the same NULL value remains a valid update"
    sql: "UPDATE value_guard_source SET value=NULL WHERE id=1"

  - name: "An unchanged NULL retains the warmed results and independent target value"
    sql: "SELECT id,note,null_rows,value_marker FROM value_guard_target"
    expect: {rows: 1, data: [{id: 10, note: 700, null_rows: 1, value_marker: 11}]}

cleanup:
  - sql: "DROP TABLE IF EXISTS value_guard_target"
  - sql: "DROP TABLE IF EXISTS value_guard_source"
  - sql: "DROP TABLE IF EXISTS filtered_prepare_values"
  - sql: "DROP TABLE IF EXISTS lookup_cache_document"
  - sql: "DROP TABLE IF EXISTS lookup_cache_file"
  - sql: "DROP TABLE IF EXISTS lookup_cache_folder"
