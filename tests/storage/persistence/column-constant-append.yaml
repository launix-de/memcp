# https://learn.microsoft.com/sql/t-sql/statements/alter-table-transact-sql
metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: Constant column append preserves historical values and the original transaction decision
setup:
- sql: CREATE TABLE constant_append_rows(id INT PRIMARY KEY,value INT)
- sql: INSERT constant_append_rows VALUES(1,11),(2,22)
- scm: (rebuild (table "memcp-tests" false "constant_append_rows" false nil) true false)
- sql: INSERT constant_append_rows VALUES(3,33)
- sql: CREATE TABLE constant_append_other(id INT PRIMARY KEY,value INT)
- sql: INSERT constant_append_other VALUES(1,7)
- sql: CREATE TABLE constant_append_rollback(id INT PRIMARY KEY)
- sql: INSERT constant_append_rollback VALUES(5)
- sql: CREATE TABLE constant_append_savepoint(id INT PRIMARY KEY)
- sql: INSERT constant_append_savepoint VALUES(6)
- sql: CREATE TABLE constant_append_nullable(id INT PRIMARY KEY)
- sql: INSERT constant_append_nullable VALUES(7)
- sql: CREATE TABLE constant_append_values(id INT PRIMARY KEY)
- sql: INSERT constant_append_values VALUES(8)
- sql: CREATE TABLE constant_append_pg(id INT PRIMARY KEY,value INT)
- sql: INSERT constant_append_pg VALUES(9,90)
- sql: CREATE TABLE constant_append_mysql(id INT PRIMARY KEY,value INT)
- sql: INSERT constant_append_mysql VALUES(10,100)
- sql: CREATE TABLE constant_append_text(id INT PRIMARY KEY)
- sql: INSERT constant_append_text VALUES(11)
- sql: CREATE TYPE constant_append_required FROM INT NOT NULL
- sql: CREATE TABLE constant_append_alias(id INT PRIMARY KEY)
- sql: INSERT constant_append_alias VALUES(12)
test_cases:
- name: Prior writes main and delta prefixes and later writes share the original decision
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE constant_append_rows SET value=12 WHERE id=1
    - connection: owner
      sql: INSERT constant_append_rows VALUES(5,55)
    - connection: owner
      sql: UPDATE constant_append_other SET value=8 WHERE id=1
    - connection: owner
      sql: ALTER TABLE constant_append_rows ADD amount FLOAT NOT NULL CONSTRAINT constant_amount_default DEFAULT ((0))
    - connection: owner
      sql: SELECT id,value,amount FROM constant_append_rows ORDER BY id
      expect: {rows: 4,data: [{id: 1,value: 12,amount: 0},{id: 2,value: 22,amount: 0},{id: 3,value: 33,amount: 0},{id: 5,value: 55,amount: 0}]}
    - connection: observer
      sql: SELECT id,value FROM constant_append_rows ORDER BY id
      expect: {rows: 3,data: [{id: 1,value: 11},{id: 2,value: 22},{id: 3,value: 33}]}
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(N'constant_append_rows') AND name=N'amount'
      expect: {rows: 1,data: [{n: 0}]}
    - connection: owner
      sql: SELECT COUNT(*) AS n,SUM(value) AS total FROM constant_append_rows WHERE amount=0
      expect: {rows: 1,data: [{n: 4,total: 122}]}
    - connection: owner
      sql: UPDATE constant_append_rows SET amount=7 WHERE id=2
    - connection: owner
      sql: INSERT constant_append_rows(id,value) VALUES(4,44)
    - connection: owner
      sql: SELECT amount,COUNT(*) AS n FROM constant_append_rows GROUP BY amount ORDER BY amount
      expect: {rows: 2,data: [{amount: 0,n: 4},{amount: 7,n: 1}]}
    - connection: owner
      sql: CREATE VIEW constant_append_view AS SELECT id,amount FROM constant_append_rows
    - connection: owner
      sql: SELECT id,amount FROM constant_append_view ORDER BY id
      expect: {rows: 5,data: [{id: 1,amount: 0},{id: 2,amount: 7},{id: 3,amount: 0},{id: 4,amount: 0},{id: 5,amount: 0}]}
    - connection: observer
      sql: SELECT OBJECT_ID(N'constant_append_view',N'V') AS id
      expect: {rows: 1,data: [{id: null}]}
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,value,amount FROM constant_append_rows ORDER BY id
      expect: {rows: 5,data: [{id: 1,value: 12,amount: 0},{id: 2,value: 22,amount: 7},{id: 3,value: 33,amount: 0},{id: 4,value: 44,amount: 0},{id: 5,value: 55,amount: 0}]}
    - connection: observer
      sql: SELECT value FROM constant_append_other
      expect: {rows: 1,data: [{value: 8}]}
- name: The named default and new ordinal are actual catalog declarations
  sql: SELECT name,parent_column_id FROM sys.default_constraints WHERE parent_object_id=OBJECT_ID(N'constant_append_rows')
  expect: {rows: 1,data: [{name: constant_amount_default,parent_column_id: 3}]}
- name: A later ordinary UPDATE copies a historical initialized cell correctly
  sql: UPDATE constant_append_rows SET value=34 WHERE id=3
- name: Replacement of another field preserves the complete initialized row
  sql: SELECT id,value,amount FROM constant_append_rows WHERE id=3
  expect: {rows: 1,data: [{id: 3,value: 34,amount: 0}]}
- name: Restore the original payload independently of the historical cell
  sql: UPDATE constant_append_rows SET value=33 WHERE id=3
- name: NOT NULL remains enforced for later explicit assignments
  sql: UPDATE constant_append_rows SET amount=NULL WHERE id=1
  expect: {error: true}
- name: Rollback removes both the constant column and original endpoint writes
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: INSERT constant_append_rollback VALUES(15)
    - connection: owner
      sql: ALTER TABLE constant_append_rollback ADD flag INT NOT NULL DEFAULT (3)
    - connection: owner
      sql: UPDATE constant_append_rollback SET flag=4 WHERE id=5
    - connection: owner
      sql: SELECT id,flag FROM constant_append_rollback ORDER BY id
      expect: {rows: 2,data: [{id: 5,flag: 4},{id: 15,flag: 3}]}
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: observer
      sql: SELECT id FROM constant_append_rollback ORDER BY id
      expect: {rows: 1,data: [{id: 5}]}
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(N'constant_append_rollback') AND name=N'flag'
      expect: {rows: 1,data: [{n: 0}]}
- name: Savepoint rewind retains the first constant and retires only the suffix
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE constant_append_savepoint ADD retained INT NOT NULL DEFAULT (2)
    - connection: owner
      sql: SAVE TRANSACTION constant_prefix
    - connection: owner
      sql: ALTER TABLE constant_append_savepoint ADD discarded INT NOT NULL DEFAULT (9)
    - connection: owner
      sql: SELECT id,retained,discarded FROM constant_append_savepoint
      expect: {rows: 1,data: [{id: 6,retained: 2,discarded: 9}]}
    - connection: owner
      sql: ROLLBACK TRANSACTION constant_prefix
    - connection: owner
      sql: SELECT id,retained FROM constant_append_savepoint
      expect: {rows: 1,data: [{id: 6,retained: 2}]}
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,retained FROM constant_append_savepoint
      expect: {rows: 1,data: [{id: 6,retained: 2}]}
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(N'constant_append_savepoint') AND name=N'discarded'
      expect: {rows: 1,data: [{n: 0}]}
- name: Nullable default without WITH VALUES retains historical NULL
  sql: BEGIN TRANSACTION; ALTER TABLE constant_append_nullable ADD flag INT NULL DEFAULT (5); COMMIT TRANSACTION
- name: Future nullable rows still receive their actual default
  sql: INSERT constant_append_nullable(id) VALUES(17)
- name: Historical NULL and future default are distinct stored values
  sql: SELECT id,flag FROM constant_append_nullable ORDER BY id
  expect: {rows: 2,data: [{id: 7,flag: null},{id: 17,flag: 5}]}
- name: WITH VALUES initializes historical nullable rows
  sql: BEGIN TRANSACTION; ALTER TABLE constant_append_values ADD flag INT NULL DEFAULT (6) WITH VALUES; COMMIT TRANSACTION
- name: WITH VALUES retains the complete historical row
  sql: SELECT id,flag FROM constant_append_values
  expect: {rows: 1,data: [{id: 8,flag: 6}]}
- name: An empty string remains an actual nonnull constant default
  sql: BEGIN TRANSACTION; ALTER TABLE constant_append_text ADD label VARCHAR(4) NOT NULL CONSTRAINT constant_label_default DEFAULT (''); COMMIT TRANSACTION
- name: Empty historical values are distinct from SQL NULL and absent defaults
  sql: SELECT id,label,CASE WHEN label IS NULL THEN 1 ELSE 0 END AS null_flag FROM constant_append_text
  expect: {rows: 1,data: [{id: 11,label: '',null_flag: 0}]}
- name: Effective alias nullability determines historical initialization
  sql: ALTER TABLE constant_append_alias ADD flag constant_append_required DEFAULT (4)
- name: An omitted syntactic NOT NULL still preserves the required alias default
  sql: SELECT id,flag FROM constant_append_alias
  expect: {rows: 1,data: [{id: 12,flag: 4}]}
- name: WITH VALUES requires a default declaration
  sql: ALTER TABLE constant_append_alias ADD invalid_values INT NULL WITH VALUES
  expect: {error: true}
- name: Duplicate WITH VALUES is invalid
  sql: ALTER TABLE constant_append_alias ADD duplicate_values INT NULL DEFAULT (3) WITH VALUES WITH VALUES
  expect: {error: true}
- name: CREATE does not admit ADD-only WITH VALUES syntax
  sql: CREATE TABLE constant_append_invalid_create(id INT DEFAULT (3) WITH VALUES)
  expect: {error: true}
- name: Invalid declarations do not publish any extra column
  sql: SELECT name FROM sys.columns WHERE object_id=OBJECT_ID(N'constant_append_alias') ORDER BY column_id
  expect: {rows: 2,data: [{name: id},{name: flag}]}
- name: Replacing the future default does not rewrite historical initial values
  sql: ALTER TABLE constant_append_rows DROP CONSTRAINT constant_amount_default; ALTER TABLE constant_append_rows ADD CONSTRAINT constant_amount_replacement DEFAULT (9) FOR amount
- name: Future inserts use the replacement default
  sql: INSERT constant_append_rows(id,value) VALUES(14,144)
- name: Actual initial values and later writes remain independent of the new default
  sql: SELECT id,value,amount FROM constant_append_rows ORDER BY id
  expect: {rows: 6,data: [{id: 1,value: 12,amount: 0},{id: 2,value: 22,amount: 7},{id: 3,value: 33,amount: 0},{id: 4,value: 44,amount: 0},{id: 5,value: 55,amount: 0},{id: 14,value: 144,amount: 9}]}
- name: Removing a future default preserves all historical cells
  sql: ALTER TABLE constant_append_rows DROP CONSTRAINT constant_amount_replacement
- name: Explicit later values remain admissible after default removal
  sql: INSERT constant_append_rows(id,value,amount) VALUES(24,244,12)
- name: The native physical rebuild retains initial prefixes and later explicit values
  scm: (rebuild (table "memcp-tests" false "constant_append_rows" false nil) true false)
- name: Complete rebuilt values do not depend on a still-declared default
  sql: SELECT id,value,amount FROM constant_append_rows ORDER BY id
  expect: {rows: 7,data: [{id: 1,value: 12,amount: 0},{id: 2,value: 22,amount: 7},{id: 3,value: 33,amount: 0},{id: 4,value: 44,amount: 0},{id: 5,value: 55,amount: 0},{id: 14,value: 144,amount: 9},{id: 24,value: 244,amount: 12}]}
- name: PostgreSQL ACID append preserves prior DML and the original transaction
  syntax: postgresql
  steps:
  - {session_id: constant_append_pg_owner, sql: START ACID TRANSACTION}
  - {session_id: constant_append_pg_owner, sql: 'UPDATE constant_append_pg SET value=91 WHERE id=9'}
  - {session_id: constant_append_pg_owner, sql: 'ALTER TABLE constant_append_pg ADD COLUMN flag INTEGER NOT NULL DEFAULT 4'}
  - {session_id: constant_append_pg_owner, sql: COMMIT}
- name: PostgreSQL sees its complete committed data and declaration
  syntax: postgresql
  sql: SELECT id,value,flag FROM constant_append_pg
  expect: {rows: 1,data: [{id: 9,value: 91,flag: 4}]}
- name: MySQL append preserves preceding DML and the declared default
  syntax: mysql
  steps:
  - {session_id: constant_append_mysql_owner, sql: BEGIN}
  - {session_id: constant_append_mysql_owner, sql: 'UPDATE constant_append_mysql SET value=101 WHERE id=10'}
  - {session_id: constant_append_mysql_owner, sql: 'ALTER TABLE constant_append_mysql ADD COLUMN flag INT NOT NULL DEFAULT 6'}
  - {session_id: constant_append_mysql_owner, sql: COMMIT}
- name: MySQL sees its complete committed data and declaration
  syntax: mysql
  sql: SELECT id,value,flag FROM constant_append_mysql
  expect: {rows: 1,data: [{id: 10,value: 101,flag: 6}]}
- name: Crash after committed append retains its actual decision
  scm: (crash)
  expect: {interrupted_ok: true}
- name: Recover original committed declarations and initial values
  action: restart
- name: Recovered complete cells retain all historical and explicit values
  sql: SELECT id,value,amount FROM constant_append_rows ORDER BY id
  expect: {rows: 7,data: [{id: 1,value: 12,amount: 0},{id: 2,value: 22,amount: 7},{id: 3,value: 33,amount: 0},{id: 4,value: 44,amount: 0},{id: 5,value: 55,amount: 0},{id: 14,value: 144,amount: 9},{id: 24,value: 244,amount: 12}]}
- name: Recovery retains nullable historical and future defaults separately
  sql: SELECT id,flag FROM constant_append_nullable ORDER BY id
  expect: {rows: 2,data: [{id: 7,flag: null},{id: 17,flag: 5}]}
- name: Recovery retains the historical constant without an explicit rebuild
  sql: SELECT id,flag FROM constant_append_values
  expect: {rows: 1,data: [{id: 8,flag: 6}]}
- name: Recovery does not restore the removed default declaration
  sql: SELECT COUNT(*) AS n FROM sys.default_constraints WHERE parent_object_id=OBJECT_ID(N'constant_append_rows')
  expect: {rows: 1,data: [{n: 0}]}
- name: Recovery retains an actual empty constant and its named default
  sql: SELECT id,label FROM constant_append_text
  expect: {rows: 1,data: [{id: 11,label: ''}]}
- name: The same original decision recovered the consuming SQL view participant
  sql: SELECT id,amount FROM constant_append_view ORDER BY id
  expect: {rows: 7,data: [{id: 1,amount: 0},{id: 2,amount: 7},{id: 3,amount: 0},{id: 4,amount: 0},{id: 5,amount: 0},{id: 14,amount: 9},{id: 24,amount: 12}]}
cleanup:
- sql: DROP VIEW IF EXISTS constant_append_view
- sql: DROP TABLE IF EXISTS constant_append_rows
- sql: DROP TABLE IF EXISTS constant_append_other
- sql: DROP TABLE IF EXISTS constant_append_rollback
- sql: DROP TABLE IF EXISTS constant_append_savepoint
- sql: DROP TABLE IF EXISTS constant_append_nullable
- sql: DROP TABLE IF EXISTS constant_append_values
- sql: DROP TABLE IF EXISTS constant_append_pg
- sql: DROP TABLE IF EXISTS constant_append_mysql
- sql: DROP TABLE IF EXISTS constant_append_text
- sql: DROP TABLE IF EXISTS constant_append_alias
- sql: DROP TYPE IF EXISTS constant_append_required
