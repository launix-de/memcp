metadata:
  version: "1.0"
  description: "Memory pressure management"
  isolated: true

setup:
  - sql: "DROP TABLE IF EXISTS mp_pressure"
  - sql: "CREATE TABLE mp_pressure (id INT, a INT, b INT, c INT, d INT, e INT, f TEXT)"
  - sql: "DROP TABLE IF EXISTS mp_scan_lifetime"
  - sql: "CREATE TABLE mp_scan_lifetime (id INT PRIMARY KEY, mandant INT, standort INT)"
  - sql: "INSERT INTO mp_scan_lifetime VALUES (1, 7, NULL), (2, NULL, 9)"

test_cases:
  - name: "MP: persist the scan lifetime fixture"
    scm: '(rebuild (table "memcp-tests" "mp_scan_lifetime") true false)'

  # A table-lock wait pauses scan_exists after column preparation and before
  # index access. The normal cache budget forces the same eviction as external
  # memory pressure, without privileged cgroups or scheduler-dependent races.
  - name: "MP: prepared EXISTS survives eviction during a table-lock wait"
    session_id: "mp-scan-owner"
    steps:
      - session_id: "mp-scan-owner"
        sql: "LOCK TABLES mp_scan_lifetime WRITE"
      - scm: |
          (begin
            (define predicate (scheme "(lambda (mandant standort) (and (equal?? mandant 7) (nil? standort)))"))
            (define access (eval (compile_scan_access '("mandant" "standort") predicate)))
            (with_autocommit session (req "__session_state") (req "__query_seq") "mp prepared EXISTS"
              (lambda (tx)
                (scan_exists tx (table "memcp-tests" "mp_scan_lifetime")
                  (car access) (cadr access) '("mandant" "standort") (eval predicate)))))
        background: true
        timeout: 15
        expect:
          rows: 1
          contains: "True"
      - scm: |
          (begin
            (define wait_for_reader (lambda (remaining)
              (if (not (empty_list? (filter (show_processlist) (lambda (row)
                    (and (equal? (get_assoc row "State") "Waiting for table lock")
                      (equal? (get_assoc row "Info") "mp prepared EXISTS"))))))
                true
                (if (<= remaining 0) (error "EXISTS reader did not reach its table-lock wait")
                  (begin (sleep 0.01) (wait_for_reader (- remaining 1)))))))
            (wait_for_reader 500))
        timeout: 10
        expect:
          rows: 1
          contains: "True"
      # Shard registrations have a one-second minimum idle lifetime. The
      # process-list barrier above proves preparation has already completed.
      - scm: '(begin (sleep 1.1) (settings "MaxPersistBytes" 1) (settings "MaxPersistBytes" 0) true)'
        expect:
          rows: 1
          contains: "True"
      - session_id: "mp-scan-owner"
        sql: "UNLOCK TABLES"
      - wait_for_background: true
    cleanup:
      - sql: "UNLOCK TABLES"
      - scm: '(settings "MaxPersistBytes" 0)'

  - name: "MP: EXISTS remains correct after releasing its scan"
    sql: "SELECT EXISTS(SELECT 1 FROM mp_scan_lifetime WHERE mandant = 7 AND standort IS NULL) AS found"
    expect:
      rows: 1
      data:
        - found: true

  - name: "MP: failing EXISTS unwinds its read lease"
    scm: |
      (begin
        (define predicate (scheme "(lambda (id) (if (equal?? id 1) (error \"expected scan failure\") false))"))
        (define access (eval (compile_scan_access '("id") predicate)))
        (scan_exists nil (table "memcp-tests" "mp_scan_lifetime")
          (car access) (cadr access) '("id") (eval predicate)))
    expect:
      error: true

  - name: "MP: durable rows survive pressure after failed EXISTS"
    setup:
      - scm: '(begin (sleep 1.1) (settings "MaxPersistBytes" 1) (settings "MaxPersistBytes" 0))'
    sql: "SELECT id, mandant, standort FROM mp_scan_lifetime ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
          mandant: 7
          standort: null
        - id: 2
          mandant: null
          standort: 9

  - name: "MP: insert 4k rows with ~2MB hash payload"
    scm: |
      (begin
        (set imod (lambda (a b) (- a (* (floor (/ a b)) b))))
        (set payload
          (lambda (i)
            (concat
              (sha256 (concat "s1:" i))
              (sha256 (concat "s2:" i))
              (sha256 (concat "s3:" i))
              (sha256 (concat "s4:" i))
              (sha256 (concat "s5:" i))
              (sha256 (concat "s6:" i))
              (sha256 (concat "s7:" i))
              (sha256 (concat "s8:" i)))))
        (insert (table "memcp-tests" "mp_pressure") '("id" "a" "b" "c" "d" "e" "f")
          (parallelN 4001 (lambda (i) (list i
            (imod (* i 54321) 999983)
            (imod (* i 12347) 999979)
            (imod (* i 98765) 999961)
            (imod (* i 33331) 999953)
            (imod (* i 77773) 999931)
            (payload i)))))
        "ok")
    expect: {}

  # --- 3 queries on id to trigger index creation (threshold=2.0, +1.0 per query) ---

  - name: "MP: query 1 on id (Savings=1, no index yet)"
    sql: "SELECT id, a FROM `memcp-tests`.mp_pressure WHERE id = 1000"
    expect:
      rows: 1
      data:
        - id: 1000
          a: 321918

  - name: "MP: query 2 on id (Savings=2, triggers index build)"
    sql: "SELECT id, a FROM `memcp-tests`.mp_pressure WHERE id = 2000"
    expect:
      rows: 1
      data:
        - id: 2000
          a: 643836

  - name: "MP: query 3 on id (uses built index)"
    sql: "SELECT id, a FROM `memcp-tests`.mp_pressure WHERE id = 3000"
    expect:
      rows: 1
      data:
        - id: 3000
          a: 965754

  - name: "MP: stat before pressure (shards+indexes registered)"
    scm: (stat)
    expect: {}

  # --- Tier 1: persisted budget eviction (shards + indexes only) ---

  - name: "MP: set MaxPersistBytes to 1MB (trigger persisted eviction)"
    scm: (settings "MaxPersistBytes" 1048576)
    expect: {}

  - name: "MP: stat after persisted pressure (shards+indexes evicted)"
    scm: (stat)
    expect: {}

  - name: "MP: select after persisted eviction (forces shard+index reload)"
    sql: "SELECT id, a, b FROM `memcp-tests`.mp_pressure WHERE id = 2000"
    expect:
      rows: 1
      data:
        - id: 2000
          a: 643836
          b: 694504

  - name: "MP: reset MaxPersistBytes to 0"
    scm: (settings "MaxPersistBytes" 0)
    expect: {}

  # --- Tier 2: total budget eviction (all types) ---

  - name: "MP: set MaxRamBytes to 1MB (trigger total eviction)"
    scm: (settings "MaxRamBytes" 1048576)
    expect: {}

  - name: "MP: select after total eviction"
    sql: "SELECT id, a, b FROM `memcp-tests`.mp_pressure WHERE id = 2000"
    expect:
      rows: 1
      data:
        - id: 2000
          a: 643836
          b: 694504

  - name: "MP: reset MaxRamBytes to 0"
    scm: (settings "MaxRamBytes" 0)
    expect: {}

  # --- Tier 3: temp keytable + temp column eviction ---
  # GROUP BY creates a temp keytable (`.mp_pressure:a`) and computed temp columns on it.

  - name: "MP: GROUP BY creates temp keytable + computed columns"
    sql: "SELECT a, SUM(b) AS sb FROM `memcp-tests`.mp_pressure GROUP BY a ORDER BY a LIMIT 5"
    timeout: 300
    expect:
      rows: 5

  - name: "MP: stat after GROUP BY (keytables+temp columns registered)"
    scm: (stat)
    expect: {}

  - name: "MP: let planner cache entries become evictable"
    scm: (sleep 1.1)
    expect: {}

  - name: "MP: set MaxRamBytes to 1MB (evict temp keytables + columns)"
    scm: (settings "MaxRamBytes" 1)
    expect: {}

  - name: "MP: stat after temp eviction"
    scm: (stat)
    expect: {}

  - name: "MP: reset MaxRamBytes to 0 (before recovery test)"
    scm: (settings "MaxRamBytes" 0)
    expect: {}

  - name: "MP: base-table mutation ignores evicted aggregate dependencies"
    sql: "UPDATE `memcp-tests`.mp_pressure SET b = b + 10 WHERE id = 1000"
    expect:
      affected_rows: 1

  - name: "MP: aggregate is rebuilt correctly after eviction and mutation"
    sql: "SELECT a, SUM(b) AS sb FROM `memcp-tests`.mp_pressure WHERE a = 321918 GROUP BY a"
    expect:
      rows: 1
      data:
        - a: 321918
          sb: 347262

  - name: "MP: GROUP BY still works after temp keytable eviction"
    sql: "SELECT a, SUM(b) AS sb FROM `memcp-tests`.mp_pressure GROUP BY a ORDER BY a LIMIT 3"
    timeout: 300
    expect:
      rows: 3

  # --- Tier 4: persisted eviction + reload + GROUP BY (combined path) ---

  - name: "MP: set MaxPersistBytes to 1MB (evict shards)"
    scm: (settings "MaxPersistBytes" 1048576)
    expect: {}

  - name: "MP: reset MaxPersistBytes to 0 (before recovery test)"
    scm: (settings "MaxPersistBytes" 0)
    expect: {}

  - name: "MP: GROUP BY after shard eviction (forces reload + temp keytable)"
    sql: "SELECT a, COUNT(*) AS cnt FROM `memcp-tests`.mp_pressure GROUP BY a ORDER BY a LIMIT 3"
    timeout: 300
    expect:
      rows: 3

  # --- Tier 5: explicit temp column via createcolumn + eviction ---

  - name: "MP: create temp computed column"
    scm: |
      (begin
        (createcolumn (table "memcp-tests" "mp_pressure") "tmp_sum" "any" '() '("temp" true)
          '("a" "b") (lambda (a b) (+ a b)))
        "ok")
    expect: {}

  - name: "MP: read from temp column"
    sql: "SELECT id, tmp_sum FROM `memcp-tests`.mp_pressure WHERE id = 1000 LIMIT 1"
    expect:
      rows: 1

  - name: "MP: set MaxRamBytes to 1MB (evict temp column)"
    scm: (settings "MaxRamBytes" 1048576)
    expect: {}

  - name: "MP: stat after temp column eviction"
    scm: (stat)
    expect: {}

  - name: "MP: reset MaxRamBytes to 0 (after temp col eviction)"
    scm: (settings "MaxRamBytes" 0)
    expect: {}

  # --- Tier 6: DropTable cleans up temp keytable from cache ---

  - name: "MP: GROUP BY to create temp keytable for drop test"
    sql: "SELECT a, SUM(c) AS sc FROM `memcp-tests`.mp_pressure GROUP BY a ORDER BY a LIMIT 1"
    timeout: 300
    expect:
      rows: 1

  - name: "MP: drop table cleans up all cache entries"
    sql: "DROP TABLE IF EXISTS `memcp-tests`.mp_pressure"
    expect: {}

  - name: "MP: stat after drop (orphaned entries cleared)"
    scm: (stat)
    expect: {}

cleanup:
  - sql: "DROP TABLE IF EXISTS mp_pressure"
  - sql: "DROP TABLE IF EXISTS mp_scan_lifetime"
