  - sql: DROP TABLE IF EXISTS cat_aggregate_owner
  - sql: DROP TABLE IF EXISTS cat_tx_renamed
  - sql: DROP TABLE IF EXISTS cat_tx_created
  - sql: DROP TABLE IF EXISTS cat_tx_progress
  - sql: DROP TABLE IF EXISTS sc_rename_old
  - sql: DROP TABLE IF EXISTS sc_rename_new
  - sql: DROP TABLE IF EXISTS sc_log
  - sql: DROP TABLE IF EXISTS sc_child
  - sql: DROP TABLE IF EXISTS sc_parent
