test_cases:
- name: Unmarked stored GUID columns retain their complete declaration flags
  sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
  expect:
    data: [{name: id, marked: 0}, {name: guid_a, marked: 0}, {name: guid_b, marked: 0}]
- name: A private claim is visible only to its original transaction and rolls back with prior rows
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION; UPDATE property_claim_prefix SET value=7 WHERE id=1
    - connection: owner
      sql: ALTER TABLE property_claim_rows ALTER COLUMN guid_a ADD ROWGUIDCOL
    - connection: owner
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
      expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 1}, {name: guid_b, marked: 0}]}
    - connection: observer
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
      expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 0}, {name: guid_b, marked: 0}]}
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: observer
      sql: SELECT value FROM property_claim_prefix
      expect: {data: [{value: 0}]}
- name: Ordered claims and retirements rewind to the actual savepoint without losing earlier DML
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION; UPDATE property_claim_prefix SET value=9 WHERE id=1; SAVE TRANSACTION before_claim
    - connection: owner
      sql: ALTER TABLE property_claim_rows ALTER COLUMN guid_a ADD ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_a DROP ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_b ADD ROWGUIDCOL
    - connection: owner
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
      expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 0}, {name: guid_b, marked: 1}]}
    - connection: owner
      sql: ROLLBACK TRANSACTION before_claim
    - connection: owner
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
      expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 0}, {name: guid_b, marked: 0}]}
    - connection: owner
      sql: SELECT value FROM property_claim_prefix
      expect: {data: [{value: 9}]}
    - connection: owner
      sql: COMMIT TRANSACTION
- name: A property claim and the original data prefix commit through one native decision
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION; UPDATE property_claim_prefix SET value=12 WHERE id=1; ALTER TABLE property_claim_rows ALTER COLUMN guid_a ADD ROWGUIDCOL
    - connection: observer
      sql: SELECT CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows') AND name=N'guid_a'
      expect: {data: [{marked: 0}]}
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows') AND name=N'guid_a'
      expect: {data: [{marked: 1}]}
- name: Reclaiming an occupied marker reports its semantic SQL error and preserves a valid prefix
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; BEGIN TRANSACTION; UPDATE property_claim_prefix SET value=14 WHERE id=1
    - connection: owner
      sql: BEGIN TRY ALTER TABLE property_claim_rows ALTER COLUMN guid_a ADD ROWGUIDCOL; END TRY BEGIN CATCH SELECT ERROR_NUMBER() AS code,XACT_STATE() AS active_state,@@TRANCOUNT AS depth; END CATCH
      expect: {data: [{code: 4925, active_state: 1, depth: 1}]}
    - connection: owner
      sql: SELECT value FROM property_claim_prefix
      expect: {data: [{value: 14}]}
    - connection: observer
      sql: SELECT value FROM property_claim_prefix
      expect: {data: [{value: 12}]}
    - connection: owner
      sql: COMMIT TRANSACTION
- name: A second column cannot claim the same table-scoped marker
  sql: BEGIN TRY ALTER TABLE property_claim_rows ALTER COLUMN guid_b ADD ROWGUIDCOL; END TRY BEGIN CATCH SELECT ERROR_NUMBER() AS code; END CATCH
  expect: {data: [{code: 4925}]}
- name: A claimed GUID marker changes neither actual values nor nullable duplicate semantics
  sql: SELECT id,guid_a,guid_b FROM property_claim_rows ORDER BY id
  expect:
    data:
    - {id: 1, guid_a: '00000000-0000-0000-0000-000000000001', guid_b: null}
    - {id: 2, guid_a: '00000000-0000-0000-0000-000000000001', guid_b: null}
    - {id: 3, guid_a: null, guid_b: null}
- name: Claiming one property retains unrelated scalar metadata and its existing default
  scm: |
    (begin
      (define col (show (table "memcp-tests" false "property_claim_rows" false nil) "column" "guid_a" false))
      (list ((col "Properties") "client.marker") ((col "Properties") "client.label")
        ((col "Properties") "tsql.rowguidcol") (col "Default") (col "Null")))
  expect: {result: [7, unchanged, true, '00000000-0000-0000-0000-000000000009', true]}
- name: Marker claims do not replace independently declared future defaults
  sql: INSERT property_claim_rows(id) VALUES(4)
  expect: {affected_rows: 1}
- name: Both actual default values remain available after claiming the marker
  sql: SELECT id,guid_a,guid_b FROM property_claim_rows WHERE id=4
  expect: {data: [{id: 4, guid_a: '00000000-0000-0000-0000-000000000009', guid_b: '00000000-0000-0000-0000-000000000008'}]}
- name: Moving a committed marker remains private and full rollback restores its original owner
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION; ALTER TABLE property_claim_rows ALTER COLUMN guid_a DROP ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_b ADD ROWGUIDCOL
    - connection: owner
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
      expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 0}, {name: guid_b, marked: 1}]}
    - connection: observer
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
      expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 1}, {name: guid_b, marked: 0}]}
    - connection: owner
      sql: ROLLBACK TRANSACTION
- name: Ordered DROP claim DROP claim commits the final exact marker owner
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION; ALTER TABLE property_claim_rows ALTER COLUMN guid_a DROP ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_b ADD ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_b DROP ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_a ADD ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_a DROP ROWGUIDCOL; ALTER TABLE property_claim_rows ALTER COLUMN guid_b ADD ROWGUIDCOL; COMMIT TRANSACTION
    - connection: observer
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
      expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 0}, {name: guid_b, marked: 1}]}
- name: The retired property owner has no implicit marker
  sql: BEGIN TRY ALTER TABLE property_claim_rows ALTER COLUMN guid_a DROP ROWGUIDCOL; END TRY BEGIN CATCH SELECT ERROR_NUMBER() AS code; END CATCH
  expect: {data: [{code: 4926}]}
- name: A missing property endpoint reports the actual missing column
  sql: BEGIN TRY ALTER TABLE property_claim_rows ALTER COLUMN absent_guid ADD ROWGUIDCOL; END TRY BEGIN CATCH SELECT ERROR_NUMBER() AS code; END CATCH
  expect: {data: [{code: 4924}]}
- name: An integer column cannot acquire a SQL GUID marker
  sql: ALTER TABLE property_claim_rows ALTER COLUMN id ADD ROWGUIDCOL
  expect: {error: true, contains: ROWGUIDCOL requires the native UNIQUEIDENTIFIER declaration}
- name: Create a genuine GUID alias and an ordinary alias-typed column
  sql: CREATE TYPE property_claim_alias FROM UNIQUEIDENTIFIER; CREATE TABLE property_claim_alias_rows(id INT PRIMARY KEY,guid property_claim_alias NULL)
- name: A GUID alias is not a direct GUID declaration for marker eligibility
  sql: ALTER TABLE property_claim_alias_rows ALTER COLUMN guid ADD ROWGUIDCOL
  expect: {error: true, contains: ROWGUIDCOL requires the native UNIQUEIDENTIFIER declaration}
- name: Generic native property claims preserve scalar values and the unchanged descriptor
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (try (lambda () (begin
        (define h (table "memcp-tests" false "property_claim_rows" false (owner "__memcp_tx")))
        (define expected (lambda (name) (tsql_column_declaration_tuple (show h "column" name true (owner "__memcp_tx")))))
        (altercolumn h "guid_a" "claim_property" (list "client.version" 1.0 (expected "guid_a")) (owner "__memcp_tx"))
        (altercolumn h "guid_b" "claim_property" (list "client.version" 2 (expected "guid_b")) (owner "__memcp_tx"))
        (tx_commit owner)
        (list (((show h "column" "guid_a" false) "Properties") "client.version")
          (((show h "column" "guid_b" false) "Properties") "client.version"))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [1.0, 2]}
- name: The accepted original data and ordered property decisions survive a hard interruption
  scm: (crash)
  restart_timeout: 60
  expect: {interrupted_ok: true}
- name: Restart the accepted ordered property history
  action: restart
- name: Recovered marker metadata names only the final actual owner
  sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_rows',N'U') ORDER BY column_id
  expect: {data: [{name: id, marked: 0}, {name: guid_a, marked: 0}, {name: guid_b, marked: 1}]}
- name: Recovery retains the original data prefix and unrelated properties
  scm: |
    (begin
      (define h (table "memcp-tests" false "property_claim_rows" false nil))
      (define col (show h "column" "guid_a" false))
      (list (scan nil (table "memcp-tests" false "property_claim_prefix" false nil) '() '() '() (lambda () true)
          '("value") (lambda (total value) (+ total value)) 0 + false)
        ((col "Properties") "client.marker") ((col "Properties") "client.label")
        ((col "Properties") "client.version")))
  expect: {result: [14, 7, unchanged, 1.0]}
- name: Recovered numeric ownership retains its semantic scalar value
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (try (lambda () (begin
        (define h (table "memcp-tests" false "property_claim_rows" false (owner "__memcp_tx")))
        (define before (show h "column" "guid_a" true (owner "__memcp_tx")))
        (altercolumn h "guid_a" "drop_property" "client.version" (owner "__memcp_tx"))
        (altercolumn h "guid_a" "claim_property" (list "client.version" 1.0 (tsql_column_declaration_tuple before)) (owner "__memcp_tx"))
        (tx_commit owner) true)) (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: true}
- name: The recovered marker still permits NULL and duplicate GUID data
  sql: INSERT property_claim_rows(id,guid_a,guid_b) VALUES(5,NULL,NULL),(6,NULL,'00000000-0000-0000-0000-000000000008')
  expect: {affected_rows: 2}
- name: Recovery and later writes retain all stored values without a generator or extra key
  sql: SELECT id,guid_b FROM property_claim_rows ORDER BY id
  expect:
    data:
    - {id: 1, guid_b: null}
    - {id: 2, guid_b: null}
    - {id: 3, guid_b: null}
    - {id: 4, guid_b: '00000000-0000-0000-0000-000000000008'}
    - {id: 5, guid_b: null}
    - {id: 6, guid_b: '00000000-0000-0000-0000-000000000008'}
- name: Claim a marker on a nullable declaration with no default
  sql: ALTER TABLE property_claim_plain ALTER COLUMN guid ADD ROWGUIDCOL
- name: A marker alone supplies no implicit GUID value
  sql: INSERT property_claim_plain(id) VALUES(1),(2)
  expect: {affected_rows: 2}
- name: An omitted marked nullable value stays NULL
  sql: SELECT id,guid FROM property_claim_plain ORDER BY id
  expect: {data: [{id: 1, guid: null}, {id: 2, guid: null}]}
- name: A same-endpoint type declaration and marker claim share one ordered decision
  noncritical: true
  tds:
    statements:
    - connection: mixed_type
      sql: BEGIN TRANSACTION; ALTER TABLE property_claim_mix_type ALTER COLUMN guid UNIQUEIDENTIFIER NOT NULL; ALTER TABLE property_claim_mix_type ALTER COLUMN guid ADD ROWGUIDCOL; COMMIT TRANSACTION
    - connection: mixed_type
      sql: SELECT name,CAST(is_rowguidcol AS INT) AS marked,CAST(is_nullable AS INT) AS nullable FROM sys.columns WHERE object_id=OBJECT_ID(N'property_claim_mix_type') ORDER BY column_id
      expect: {data: [{name: id, marked: 0, nullable: 0}, {name: guid, marked: 1, nullable: 0}]}
- name: A marker claim and fresh nullable append share one ordered endpoint history
  noncritical: true
  tds:
    statements:
