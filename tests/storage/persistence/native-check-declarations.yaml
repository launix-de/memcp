- name: ACID nested savepoints restore staged versions repeatedly and retain earlier work
  scm: |-
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx"))
      (define h (table "memcp-tests" false "check_acid_versions" false nil))
      (try (lambda () (begin
        (with_table_mutation (list h) (list "insert" '()) tx owner (lambda (tx)
          (insert h '("id" "v") (list (list 4 40)) '() nil false nil tx)))
        (define outer (tx_savepoint tx))
        (with_table_mutation (list h) (list "update" '("v")) tx owner (lambda (tx)
          (scan tx h '() '() '("id") (lambda (id) (equal? id 4)) '("$update")
            (lambda (acc update) (begin (update (list "v" 41)) (+ acc 1))) 0 +)))
        (define inner (tx_savepoint tx))
        (with_table_mutation (list h) (list "delete" '()) tx owner (lambda (tx)
          (scan tx h '() '() '("id") (lambda (id) (equal? id 4)) '("$update")
            (lambda (acc update) (begin (update) (+ acc 1))) 0 +)))
        (tx_rollback_to_savepoint tx inner)
        (define restored_inner (scan tx h '() '() '("id") (lambda (id) (equal? id 4)) '("v") + 0 +))
        (tx_rollback_to_savepoint tx inner)
        (tx_rollback_to_savepoint tx outer)
        (define restored_outer (scan tx h '() '() '("id") (lambda (id) (equal? id 4)) '("v") + 0 +))
        (tx_commit owner)
        (and (equal? restored_inner 41) (equal? restored_outer 40))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: true}
