- name: Ordinary committed physical rebuild preserves the CHECK declaration identity
  scm: |-
    (begin
      (define h (table "memcp-tests" false "check_native_values" false nil))
      (rebuild h true false)
      (and (identical? h (table "memcp-tests" false "check_native_values" false nil))
        (equal? ((car ((show h "constraints") "Checks")) "Id") "CK_native_range")))
  expect:
    result: true
- name: Restart through the existing real server lifecycle
