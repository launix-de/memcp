- name: An unrelated computed cache remains available on a CHECK table
  scm: |-
    (begin
      (createcolumn (table "memcp-tests" false "check_native_values" false nil)
        "check_native_derived" "INT" '() '() '("other_value")
        (lambda (other_value) (+ other_value 1)))
      true)
  expect:
    result: true
- name: A real read prepares the derived cache without a base-row CHECK mutation
  sql: SELECT id,check_native_derived FROM check_native_values WHERE id=1
