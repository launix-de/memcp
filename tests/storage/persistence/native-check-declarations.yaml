- name: ACID checked failure restores previously staged UPDATE and DELETE versions
  scm: |-
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define h (table "memcp-tests" false "check_acid_versions" false nil))
      (try (lambda () (begin
        (with_autocommit owner nil 0 "prior ACID inserts" (lambda (tx)
          (with_table_mutation (list h) (list "insert" '()) tx owner (lambda (tx)
            (insert h '("id" "v") (list (list 1 10) (list 2 20)) '() nil false nil tx)))))
        (with_autocommit owner nil 0 "prior ACID update" (lambda (tx)
          (with_table_mutation (list h) (list "update" '("v")) tx owner (lambda (tx)
            (scan tx h '() '() '("id") (lambda (id) (equal? id 0)) '("$update")
              (lambda (acc update) (begin (update (list "v" 6)) (+ acc 1))) 0 +)))))
        (define rejected (try (lambda () (begin
          (with_autocommit owner nil 0 "failed ACID statement" (lambda (tx)
            (with_table_mutation (list h) (list "insert" '()) tx owner (lambda (tx) (begin
              (scan tx h '() '() '() (lambda () true) '("v" "$update")
                (lambda (acc v update) (begin (update (list "v" (+ v 1))) (+ acc 1))) 0 +)
              (scan tx h '() '() '("id") (lambda (id) (equal? id 1)) '("$update")
                (lambda (acc update) (begin (update) (+ acc 1))) 0 +)
              (insert h '("id" "v") (list (list 3 -1)) '() nil false nil tx))))))
          false)) (lambda (failure) (strlike (string failure) "%check constraint CK_acid_versions failed%"))))
        (define tx (owner "__memcp_tx"))
        (define count_rows (lambda (reader)
          (scan reader h '() '() '() (lambda () true) '("id") (lambda (acc id) (+ acc 1)) 0 +)))
        (define total_rows (lambda (reader)
          (scan reader h '() '() '() (lambda () true) '("id" "v")
            (lambda (acc id v) (+ acc (* id 100) v)) 0 +)))
        (define restored (and rejected (equal? (owner "transaction") true)
          (equal? (count_rows tx) 3) (equal? (total_rows tx) 336)
          (equal? (count_rows nil) 1) (equal? (total_rows nil) 5)))
        (tx_commit owner) restored))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: true}
