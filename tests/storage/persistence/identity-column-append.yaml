- sql: CREATE TABLE identity_add_parallel(code INT NOT NULL PRIMARY KEY,payload INT NOT NULL)
- sql: CREATE TABLE identity_add_crash(code INT NOT NULL PRIMARY KEY,payload INT NOT NULL)
- sql: CREATE TABLE identity_add_uncommitted(code INT NOT NULL PRIMARY KEY,payload INT NOT NULL)
- sql: CREATE TABLE identity_add_mixed(code INT NOT NULL PRIMARY KEY,payload INT NOT NULL)
- sql: INSERT identity_add_rows VALUES(1,10),(2,20),(3,30)
- sql: INSERT identity_add_rollback VALUES(1,10),(2,20),(3,30)
