- name: Mixed V30 replacement remains selected after V31 recovery
  sql: SELECT COUNT(*) AS n,MIN(ID) AS lo,MAX(ID) AS hi,IDENT_SEED(N'identity_add_mixed') AS seed FROM identity_add_mixed
  expect:
    rows: 1
    data:
    - n: 3
      lo: 40
      hi: 42
