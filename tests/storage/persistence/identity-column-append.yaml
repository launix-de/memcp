- sql: DROP TABLE IF EXISTS identity_add_rows
- sql: DROP TABLE IF EXISTS identity_add_empty
- sql: CREATE TABLE identity_add_empty(code INT NOT NULL PRIMARY KEY,payload INT NOT NULL)
