- name: A checked producer drains old callbacks before a same-target key addition
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_checked" false tx))
      (define saved (newsession))
      (try (lambda () (begin
        (with_table_mutation (list target) (list "update" '("value")) tx owner (lambda (bound)
          (scan bound target '() '() '() (lambda () true) '("$update")
            (lambda (n update) (begin (saved "update" update) (update '("value" 13)) (+ n 1))) 0 +)))
        (createkey target "checked_key" true '("id") tx)
        (define retired (try (lambda () (begin ((saved "update") '("value" 99)) false)) (lambda (failure) true)))
        (define observed (scan nil target '() '() '() (lambda () true) '("value") + 0 +))
        (tx_commit owner)
        (list retired observed (count ((show target "constraints" nil) "Unique"))
          (scan nil target '() '() '() (lambda () true) '("value") + 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [true, 7, 1, 13]}
- name: An unrelated raw writer keeps its transaction while a new target validates UNIQUE
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define rows (table "memcp-tests" false "public_key_other_raw" false tx))
      (define target (table "memcp-tests" false "public_key_other_target" false tx))
      (try (lambda () (begin
        (scan tx rows '() '() '() (lambda () true) '("$update")
          (lambda (n update) (begin (update '("value" 11)) (+ n 1))) 0 +)
        (createkey target "other_key" true '("id") tx)
        (define observed (scan nil rows '() '() '() (lambda () true) '("value") + 0 +))
        (tx_commit owner)
        (list observed (count ((show target "constraints" nil) "Unique"))
          (scan nil rows '() '() '() (lambda () true) '("value") + 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [7, 1, 11]}
- name: SDK-shaped earlier heartbeat rows and a new target UNIQUE share the original TSQL decision
  tds:
    statements:
    - {connection: owner, sql: BEGIN TRANSACTION}
    - {connection: owner, sql: UPDATE dbo.public_key_heartbeat SET value=13 WHERE id=1}
    - {connection: owner, sql: CREATE UNIQUE INDEX public_key_late_code ON dbo.public_key_late_unique(code)}
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM sys.indexes WHERE name=N'public_key_late_code'
      expect: {rows: 1, data: [{n: 1}]}
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.indexes WHERE name=N'public_key_late_code'
      expect: {rows: 1, data: [{n: 0}]}
    - connection: owner
      sql: SELECT id,value FROM dbo.public_key_heartbeat
      expect: {rows: 1, data: [{id: 1, value: 13}]}
    - connection: observer
      sql: SELECT id,value FROM dbo.public_key_heartbeat
      expect: {rows: 1, data: [{id: 1, value: 1}]}
    - {connection: owner, sql: COMMIT TRANSACTION}
    - connection: observer
      sql: SELECT id,value FROM dbo.public_key_heartbeat
      expect: {rows: 1, data: [{id: 1, value: 13}]}
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.indexes WHERE name=N'public_key_late_code'
      expect: {rows: 1, data: [{n: 1}]}
- name: The SDK-shaped committed new UNIQUE enforces real rows
  sql: INSERT INTO public_key_late_unique VALUES(3,5)
  expect: {error: true}
- name: A missing MySQL SHOW INDEX target retains its actual failure instead of an empty success
  syntax: mysql
  sql: SHOW INDEX FROM public_key_missing_relation
  expect: {error: true}
- name: Default-borrowed raw callbacks retain their actual capability without blocking unrelated native row semantics
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_default_raw" false tx))
      (define receipt (newsession))
      (try (lambda () (begin
        (altercolumn target "value" "default" 9 tx)
        (scan tx target '() '() '() (lambda () true) '("$update")
          (lambda (n update) (begin
            (receipt "denied" (try (lambda () (begin (createkey target "default_raw_key" true '("id") tx) false)) (lambda (failure) true)))
            (update '("value" 13)) (+ n 1))) 0 +)
        (define values (list (receipt "denied") (count ((show target "constraints" tx) "Unique"))
          (scan tx target '() '() '() (lambda () true) '("value") + 0 +)
          (scan nil target '() '() '() (lambda () true) '("value") + 0 +)))
        (tx_rollback owner)
        (list values (scan nil target '() '() '() (lambda () true) '("value") + 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [[true, 0, 13, 7], 7]}
- name: Rewinding an empty default phase cannot erase a raw capability from the same active transaction
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_rewind_raw" false tx))
      (define escaped (newsession))
      (try (lambda () (begin
        (define boundary (tx_savepoint tx))
        (altercolumn target "value" "default" 9 tx)
        (scan tx target '() '() '() (lambda () true) '("$update")
          (lambda (n update) (begin (escaped "update" update) (+ n 1))) 0 +)
        (tx_rollback_to_savepoint tx boundary)
        (define denied (try (lambda () (begin (createkey target "rewind_raw_key" true '("id") tx) false)) (lambda (failure) true)))
        (define before (list denied (count ((show target "constraints" tx) "Unique"))
          (scan tx target '() '() '() (lambda () true) '("value") + 0 +)
          (scan nil target '() '() '() (lambda () true) '("value") + 0 +)))
        (tx_rollback owner)
        (tx_begin_acid owner)
        (createkey target "rewind_raw_key" true '("id") (owner "__memcp_tx"))
        (tx_commit owner)
        (list before (count ((show target "constraints" nil) "Unique"))
          (scan nil target '() '() '() (lambda () true) '("value") + 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [[true, 0, 7, 7], 1, 7]}
- name: A hard crash retains the committed ordered key and foreign decisions
  scm: (crash)
  expect: {interrupted_ok: true}
- name: Restart the same store after the native crash
  action: restart
- name: Participant-first recovery retains its complete committed row
  sql: SELECT id,value FROM public_key_participant
  expect: {rows: 1, data: [{id: 1, value: 13}]}
- name: Recovery retains the actual view metadata participant and its committed row
  sql: SELECT id,value FROM public_key_participant_view
  expect: {rows: 1, data: [{id: 1, value: 13}]}
- name: Restart preserves the replacement parent and child values
  sql: SELECT c.id,c.parent_id,p.id AS parent_id_value,p.code FROM public_key_child c JOIN public_key_parent p ON p.code=c.parent_id ORDER BY c.id
  expect: {rows: 2, data: [{id: 1, parent_id: 1, parent_id_value: 11, code: 1}, {id: 2, parent_id: 7, parent_id_value: 2, code: 7}]}
- name: Restart preserves final native keys and descriptive primary flags
  scm: |
    (begin (define target (table "memcp-tests" false "public_key_durable" false nil))
      (list (map ((show target "constraints" nil) "Unique") (lambda (key) (list (key "Id") (key "Cols"))))
        (map (show target "columns" nil) (lambda (column) (list (column "Field") (column "Key"))))))
  expect: {result: [[[PRIMARY, [id]]], [[id, PRI], [code, '']]]}
- name: Restart retains rows committed after complete public-phase savepoint retirement
  sql: SELECT id,value FROM public_key_empty ORDER BY id
  expect: {rows: 2, data: [{id: 1, value: 17}, {id: 2, value: 19}]}
- name: Restart retains rows written before the original key declaration
  sql: SELECT id,value FROM public_key_prefix ORDER BY id
  expect: {rows: 1, data: [{id: 1, value: 23}]}
- name: Restart keeps UQ retirement while preserving its complete committed rows
  sql: SELECT id,code FROM public_key_drop ORDER BY id
  expect: {rows: 3, data: [{id: 1, code: 10}, {id: 2, code: 20}, {id: 3, code: 10}]}
- name: Restart retains the checked producer and unrelated writer values from the original decisions
  sql: SELECT c.value AS checked_value,r.value AS other_value FROM public_key_checked c CROSS JOIN public_key_other_raw r
  expect: {rows: 1, data: [{checked_value: 13, other_value: 11}]}
- name: Restart retains the exact heartbeat and new target rows from one TSQL decision
  sql: SELECT h.value AS heartbeat,k.id,k.code FROM public_key_heartbeat h CROSS JOIN public_key_late_unique k ORDER BY k.id
  expect: {rows: 2, data: [{heartbeat: 13, id: 1, code: 5}, {heartbeat: 13, id: 2, code: 7}]}
- name: Restart retains the SDK-shaped unique enforcement
  sql: INSERT INTO public_key_late_unique VALUES(3,5)
  expect: {error: true}
- name: Restart enforces the replacement foreign endpoint
  sql: INSERT INTO public_key_child VALUES(3,2)
  expect: {error: true, contains: foreign key constraint}
- name: Restart enforces the committed key independently of metadata reads
  sql: INSERT INTO public_key_durable VALUES(1,99)
  expect: {error: true}
