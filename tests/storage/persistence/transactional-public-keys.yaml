metadata:
  isolated: true
  requires_tds: true
  description: Public native key and foreign declarations retain one ordered transaction history and decision
setup:
- sql: DROP VIEW IF EXISTS public_key_participant_view
- sql: CREATE TABLE public_key_rows(id INT NOT NULL,code INT,value INT) ENGINE=safe
- sql: INSERT INTO public_key_rows VALUES(1,10,7),(2,20,11)
- syntax: tsql
  sql: CREATE TABLE public_key_drop(id INT NOT NULL,code INT,CONSTRAINT public_key_drop_pk PRIMARY KEY(id),CONSTRAINT public_key_drop_uq UNIQUE(code))
- sql: INSERT INTO public_key_drop VALUES(1,10),(2,20)
- sql: CREATE TABLE public_key_duplicates(id INT,value INT) ENGINE=safe
- sql: INSERT INTO public_key_duplicates VALUES(1,7),(2,7)
- scm: (rebuild (table "memcp-tests" false "public_key_duplicates" false nil) true false)
- sql: INSERT INTO public_key_duplicates VALUES(3,7)
- sql: CREATE TABLE public_key_nulls(id INT,value INT) ENGINE=safe
- sql: INSERT INTO public_key_nulls VALUES(1,NULL),(2,NULL),(3,7)
- sql: CREATE TABLE public_key_equal_nulls(id INT,value INT) ENGINE=safe
- sql: INSERT INTO public_key_equal_nulls VALUES(1,NULL),(2,NULL)
- syntax: tsql
  sql: CREATE TABLE public_key_parent(id INT NOT NULL,code INT NOT NULL,CONSTRAINT public_key_parent_pk PRIMARY KEY(id))
- sql: INSERT INTO public_key_parent VALUES(1,1),(2,7)
- sql: CREATE TABLE public_key_child(id INT PRIMARY KEY,parent_id INT) ENGINE=safe
- sql: INSERT INTO public_key_child VALUES(1,1)
- sql: ALTER TABLE public_key_child ADD CONSTRAINT public_key_reference FOREIGN KEY(parent_id) REFERENCES public_key_parent(id)
- sql: CREATE TABLE public_key_progress(id INT PRIMARY KEY,value INT) ENGINE=safe
- sql: INSERT INTO public_key_progress VALUES(1,1)
- sql: CREATE TABLE public_key_durable(id INT NOT NULL,code INT) ENGINE=safe
- sql: INSERT INTO public_key_durable VALUES(1,10),(2,20)
- sql: CREATE TABLE public_key_index(id INT NOT NULL,code INT) ENGINE=safe
- sql: INSERT INTO public_key_index VALUES(1,10),(2,20)
- sql: CREATE TABLE public_key_empty(id INT NOT NULL,value INT) ENGINE=safe
- sql: CREATE TABLE public_key_prefix(id INT NOT NULL,value INT) ENGINE=safe
- sql: CREATE TABLE public_key_unicode(id INT NOT NULL) ENGINE=safe
- sql: INSERT INTO public_key_unicode VALUES(1),(2)
- sql: CREATE TABLE public_key_raw(id INT NOT NULL,value INT) ENGINE=safe
- sql: INSERT INTO public_key_raw VALUES(1,7)
- sql: CREATE TABLE public_key_checked(id INT NOT NULL,value INT) ENGINE=safe
- sql: INSERT INTO public_key_checked VALUES(1,7)
- sql: CREATE TABLE public_key_other_raw(id INT NOT NULL,value INT) ENGINE=safe
- sql: INSERT INTO public_key_other_raw VALUES(1,7)
- sql: CREATE TABLE public_key_other_target(id INT NOT NULL,value INT) ENGINE=safe
- sql: INSERT INTO public_key_other_target VALUES(1,7)
- sql: CREATE TABLE public_key_heartbeat(id INT PRIMARY KEY,value INT) ENGINE=safe
- sql: INSERT INTO public_key_heartbeat VALUES(1,1)
- sql: CREATE TABLE public_key_late_unique(id INT NOT NULL,code INT) ENGINE=safe
- sql: INSERT INTO public_key_late_unique VALUES(1,5),(2,7)
- sql: CREATE TABLE public_key_default_raw(id INT NOT NULL,value INT) ENGINE=safe
- sql: INSERT INTO public_key_default_raw VALUES(1,7)
- sql: CREATE TABLE public_key_rewind_raw(id INT NOT NULL,value INT) ENGINE=safe
- sql: INSERT INTO public_key_rewind_raw VALUES(1,7)
- sql: CREATE TABLE public_key_participant(id INT PRIMARY KEY,value INT) ENGINE=safe
test_cases:
- name: An added public key is private and rollback preserves rows and the old declaration
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx"))
      (define target (table "memcp-tests" false "public_key_rows" false tx))
      (try (lambda () (begin
        (define added (createkey target "PRIMARY" true '("id") tx '("constraint_name" "public_key_rows_pk")))
        (define pending (list added (count ((show target "constraints" tx) "Unique"))
          (count ((show target "constraints" nil) "Unique"))
          (map (show target "columns" tx) (lambda (c) (list (c "Field") (c "Key"))))))
        (tx_rollback owner)
        (list pending (count ((show target "constraints" nil) "Unique"))
          (scan nil target '() '() '() (lambda () true) '("value") + 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [[true, 1, 0, [[id, PRI], [code, ''], [value, '']]], 0, 18]}
- name: TSQL primary addition is absent to an observer and remains absent after rollback
  tds:
    statements:
    - {connection: owner, sql: BEGIN TRANSACTION}
    - {connection: owner, sql: 'ALTER TABLE dbo.public_key_rows ADD CONSTRAINT public_key_rows_pk PRIMARY KEY(id)'}
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM sys.key_constraints WHERE name=N'public_key_rows_pk'
      expect: {rows: 1, data: [{n: 1}]}
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.key_constraints WHERE name=N'public_key_rows_pk'
      expect: {rows: 1, data: [{n: 0}]}
    - {connection: owner, sql: ROLLBACK TRANSACTION}
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.key_constraints WHERE name=N'public_key_rows_pk'
      expect: {rows: 1, data: [{n: 0}]}
- name: Savepoints restore exact key columns and allow a fresh declaration attempt
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_drop" false tx))
      (try (lambda () (begin
        (define before (tx_savepoint tx))
        (dropkey target "public_key_drop_pk" tx)
        (createkey target "PRIMARY" true '("code") tx '("constraint_name" "public_key_drop_pk"))
        (define replaced ((car ((show target "constraints" tx) "Unique")) "Cols"))
        (tx_rollback_to_savepoint tx before)
        (define restored (map ((show target "constraints" tx) "Unique") (lambda (k) (list (k "Id") (k "Cols")))))
        (define retry (dropkey target "public_key_drop_pk" tx))
        (tx_rollback owner)
        (list replaced restored retry (map ((show target "constraints" nil) "Unique") (lambda (k) (list (k "Id") (k "Cols")))))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [[code], [[PRIMARY, [id]], [public_key_drop_uq, [code]]], true, [[PRIMARY, [id]], [public_key_drop_uq, [code]]]]}
- name: Historical duplicate values reject the addition without changing earlier private rows
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_duplicates" false tx))
      (define progress (table "memcp-tests" false "public_key_progress" false tx))
      (try (lambda () (begin
        (insert progress '("id" "value") (list (list 2 7)) '() nil false nil tx)
        (define denied (try (lambda () (createkey target "duplicate_value" true '("value") tx)) (lambda (failure) true)))
        (define before (list denied (count ((show target "constraints" tx) "Unique"))
          (scan tx progress '() '() '() (lambda () true) '("value") + 0 +)
          (scan nil progress '() '() '() (lambda () true) '("value") + 0 +)))
        (tx_rollback owner)
        (list before (scan nil progress '() '() '() (lambda () true) '("value") + 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [[true, 0, 8, 1], 1]}
- name: NULL-distinct keys validate historical NULLs and enforce nonNULL uniqueness after commit
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_nulls" false tx))
      (try (lambda () (begin
        (createkey target "nullable_value" true '("value") tx)
        (tx_commit owner)
        (define duplicate (try (lambda () (begin (insert target '("id" "value") (list (list 4 7))) false)) (lambda (failure) true)))
        (insert target '("id" "value") (list (list 5 nil)))
        (list duplicate (scan nil target '() '() '() (lambda () true) '() (lambda (n) (+ n 1)) 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [true, 4]}
- name: NULL-not-distinct historical validation rejects an identical NULL tuple
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_equal_nulls" false tx))
      (define denied (try (lambda () (createkey target "equal_nulls" true '("value") tx '("nulls_not_distinct" true))) (lambda (failure) true)))
      (tx_rollback owner)
      (list denied (count ((show target "constraints" nil) "Unique"))
        (scan nil target '() '() '() (lambda () true) '() (lambda (n) (+ n 1)) 0 +)))
  expect: {result: [true, 0, 2]}
- name: An effective foreign dependency prevents retiring its final supporting parent key
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define target (table "memcp-tests" false "public_key_parent" false tx))
      (define denied (try (lambda () (dropkey target "public_key_parent_pk" tx)) (lambda (failure) true)))
      (tx_rollback owner)
      (list denied (count ((show target "constraints" nil) "Unique"))
        (count ((show target "constraints" nil) "ForeignKeys"))))
  expect: {result: [true, 1, 1]}
- name: The same warm join text has its original result before ordered replacement
  sql: SELECT c.id FROM public_key_child c JOIN public_key_parent p ON p.id=c.parent_id ORDER BY c.id
  expect: {rows: 1, data: [{id: 1}]}
- name: DROP foreign DROP key ADD key ADD foreign uses one private ordered history and rollback
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define parent (table "memcp-tests" false "public_key_parent" false tx))
      (define child (table "memcp-tests" false "public_key_child" false tx))
      (try (lambda () (begin
        (define boundary (tx_savepoint tx))
        (dropforeignkey child "public_key_reference" tx)
        (dropkey parent "public_key_parent_pk" tx)
        (createkey parent "PRIMARY" true '("code") tx '("constraint_name" "public_key_parent_pk"))
        (createforeignkey child "public_key_reference" '("parent_id") parent '("code") "restrict" "restrict" tx)
        (define own (list ((car ((show parent "constraints" tx) "Unique")) "Cols")
          ((car ((show child "constraints" tx) "ForeignKeys")) "OtherColumns")))
        (define observed (list ((car ((show parent "constraints" nil) "Unique")) "Cols")
          ((car ((show child "constraints" nil) "ForeignKeys")) "OtherColumns")))
        (tx_rollback_to_savepoint tx boundary)
        (define restored (list ((car ((show parent "constraints" tx) "Unique")) "Cols")
          ((car ((show child "constraints" tx) "ForeignKeys")) "OtherColumns")))
        (tx_rollback owner)
        (list own observed restored)))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [[[code], [code]], [[id], [id]], [[id], [id]]]}
- name: Committed replacement retains earlier row writes and a foreign row participant
  scm: |
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx")) (define parent (table "memcp-tests" false "public_key_parent" false tx))
      (define child (table "memcp-tests" false "public_key_child" false tx))
      (define progress (table "memcp-tests" false "public_key_progress" false tx))
      (define participant (table "memcp-tests" false "public_key_participant" false tx))
      (try (lambda () (begin
        (insert progress '("id" "value") (list (list 3 11)) '() nil false nil tx)
        (insert participant '("id" "value") (list (list 1 13)) '() nil false nil tx)
        /* A normal SQL view enlists the actual system.views owner without
           creating fixture tables outside the owned test database. */
        (define create_view (sql_queryplan_compile_formula tx
          (parse_sql "memcp-tests"
            "CREATE VIEW public_key_participant_view AS SELECT id,value FROM public_key_participant"
            (lambda (_schema _table _write) true) (newsession) tx)))
        (sql_execute_formula owner tx create_view (lambda (_row) true) (lambda (_fields) true))
        (if (and (not (nil? (sql_find_view tx "memcp-tests" "public_key_participant_view")))
          (nil? (sql_find_view nil "memcp-tests" "public_key_participant_view"))) true
          (error "the actual metadata participant lost private view visibility"))
        (dropforeignkey child "public_key_reference" tx)
        (dropkey parent "public_key_parent_pk" tx)
        (createkey parent "PRIMARY" true '("code") tx '("constraint_name" "public_key_parent_pk"))
        (createforeignkey child "public_key_reference" '("parent_id") parent '("code") "restrict" "restrict" tx)
        (define hidden (list (scan nil progress '() '() '() (lambda () true) '("value") + 0 +)
          (scan nil participant '() '() '() (lambda () true) '("value") + 0 +)))
        (tx_commit owner)
        (list hidden ((car ((show parent "constraints" nil) "Unique")) "Cols")
          ((car ((show child "constraints" nil) "ForeignKeys")) "OtherColumns")
          (scan nil progress '() '() '() (lambda () true) '("value") + 0 +)
          (scan nil participant '() '() '() (lambda () true) '("value") + 0 +))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect: {result: [[1, 0], [code], [code], 12, 13]}
