test_cases:
- name: Original transaction prefix rolls back while exact trigger suffix and nested procedure commit without user
    triggers
  tds:
    statements:
    - sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
      connection: owner
    - sql: UPDATE abort_prefix SET value=12 WHERE id=1
      connection: owner
    - sql: UPDATE abort_core SET value=11 WHERE id=1
      connection: owner
    - sql: UPDATE abort_core SET value=50,mode=1 WHERE id=1; UPDATE abort_prefix SET value=999 WHERE id=1
      expect:
        error: true
        messages:
        - text: before rollback
        - text: after rollback
      connection: owner
    - sql: SELECT id,value,mode FROM abort_core ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 77
          mode: 0
        - id: 2
          value: 20
          mode: 0
      connection: observer
    - sql: SELECT id,value FROM abort_prefix ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 7
      connection: observer
    - sql: SELECT id,kind,old_value,new_value,local_value FROM abort_audit ORDER BY id
      expect:
        rows: 2
        data:
        - id: 201
          kind: 2
          old_value: 11
          new_value: 50
          local_value: 41
        - id: 301
          kind: 3
          old_value: 0
          new_value: 0
          local_value: 41
      connection: observer
    - sql: SELECT COUNT(*) AS n FROM abort_user_log
      expect:
        rows: 1
        data:
        - n: 0
      connection: observer
    - sql: SELECT XACT_STATE() AS state,@@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - state: 0
          depth: 0
      connection: owner
    - sql: UPDATE abort_core SET value=78 WHERE id=1
      connection: owner
    - sql: SELECT COUNT(*) AS n FROM abort_user_log
      expect:
        rows: 1
        data:
        - n: 1
      connection: owner
- name: Empty source transitions remain actual zero row relations after rollback
  tds:
    statements:
    - sql: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
      connection: owner
    - sql: UPDATE abort_zero SET value=99 WHERE id=999
      expect:
        error: true
      connection: owner
    - sql: SELECT id,value FROM abort_zero ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 10
      connection: observer
    - sql: SELECT id,kind,old_value,new_value,local_value FROM abort_audit WHERE id=400
      expect:
        rows: 1
        data:
        - id: 400
          kind: 4
          old_value: 0
          new_value: 0
          local_value: 0
      connection: observer
    - sql: SELECT XACT_STATE() AS state,@@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - state: 0
          depth: 0
      connection: owner
- name: Real suffix CHECK failure preserves earlier committed leaves and suppresses the later sentinel
  tds:
    statements:
    - sql: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
      connection: owner
    - sql: UPDATE abort_check_source SET value=50 WHERE id=1
      expect:
        error: true
      connection: owner
    - sql: SELECT id,value FROM abort_check_source ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 10
      connection: observer
    - sql: SELECT id,value FROM abort_checked ORDER BY id
      expect:
        rows: 2
        data:
        - id: 10
          value: 10
        - id: 11
          value: 20
      connection: observer
    - sql: SELECT XACT_STATE() AS state,@@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - state: 0
          depth: 0
      connection: owner
    - sql: INSERT abort_checked VALUES(14,-1)
      expect:
        error: true
      connection: owner
    - sql: SELECT id,value FROM abort_checked ORDER BY id
      expect:
        rows: 2
        data:
        - id: 10
          value: 10
        - id: 11
          value: 20
      connection: owner
- name: Internal FK and uniqueness enforcement survive the user trigger suppression profile
  tds:
    statements:
    - sql: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
      connection: owner
    - sql: UPDATE abort_fk_source SET value=50 WHERE id=1
      expect:
        error: true
      connection: owner
    - sql: SELECT id,value FROM abort_fk_source ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 10
      connection: observer
    - sql: SELECT id,parent_id FROM abort_fk_child ORDER BY id
      expect:
        rows: 1
        data:
        - id: 20
          parent_id: 1
      connection: observer
    - sql: SELECT id,value FROM abort_unique_target ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 5
        - id: 2
          value: 7
      connection: observer
    - sql: INSERT abort_fk_child VALUES(22,999)
      expect:
        error: true
      connection: owner
    - sql: INSERT abort_unique_target VALUES(3,7)
      expect:
        error: true
      connection: owner
    - sql: SELECT id,parent_id FROM abort_fk_child ORDER BY id
      expect:
        rows: 1
        data:
        - id: 20
          parent_id: 1
      connection: owner
    - sql: SELECT id,value FROM abort_unique_target ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 5
        - id: 2
          value: 7
      connection: owner
- name: Process crash after continuation leaves keeps their ordinary durable decisions
  scm: (crash)
  expect:
    interrupted_ok: true
- name: Restart after hard process failure uses the same native fixture store
  action: restart
- name: Restart restores original rows and every safe or logged suffix commit
  steps:
  - sql: SELECT id,value,mode FROM abort_core ORDER BY id
    expect:
      rows: 2
      data:
      - id: 1
        value: 78
        mode: 0
      - id: 2
        value: 20
        mode: 0
  - sql: SELECT id,value FROM abort_prefix ORDER BY id
    expect:
      rows: 1
      data:
      - id: 1
        value: 7
  - sql: SELECT id,kind,old_value,new_value,local_value FROM abort_audit ORDER BY id
    expect:
      rows: 3
      data:
      - id: 201
        kind: 2
        old_value: 11
        new_value: 50
        local_value: 41
      - id: 301
        kind: 3
        old_value: 0
        new_value: 0
        local_value: 41
      - id: 400
        kind: 4
        old_value: 0
        new_value: 0
        local_value: 0
  - sql: SELECT id,value FROM abort_checked ORDER BY id
    expect:
      rows: 2
      data:
      - id: 10
        value: 10
      - id: 11
        value: 20
  - sql: SELECT id,parent_id FROM abort_fk_child ORDER BY id
    expect:
      rows: 1
      data:
      - id: 20
        parent_id: 1
- name: Original cleanup failure prevents resume until the same owner retires its resource
  scm: |
    (begin
     (define owner (newsession)) (owner "username" "root")
     (define external (newsession)) (external "username" "root")
     (define signals (newsession))
     (define await (lambda (key tx remaining)
      (if (signals "failed") (error (signals "failed"))
       (signals key) true
       (<= remaining 0) (error "native continuation cleanup rendezvous timed out")
       (begin (sleep tx 0.0001) (await key tx (- remaining 1))))))
     (define held (new_relation_scope external nil "independent"))
     (define private_name (concat ".abort-cleanup:" (uuid)))
     (createtable "memcp-tests" private_name (list (list "column" "id" "INT" '() '()))
      (list "engine" "memory" "ephemeral" true "scope" held) false nil)
     (define private (table "memcp-tests" false private_name false nil))
     (define target (table "memcp-tests" false "abort_before_source" false nil))
     (define audit (table "memcp-tests" false "abort_before_audit" false nil))
     (registertriggerlanguage "abort-before-cleanup-observer"
      (close_procedure (lambda (_source _context)
       (lambda (OLD NEW session completion)
        (request_transaction_abort completion (lambda () (begin
        (define fresh (newsession)) (fresh "username" "root")
        (signals "fresh" fresh)
        (list
         (lambda (execute OLD NEW payload) (begin
          (signals "callback_n" (+ 1 (coalesceNil (signals "callback_n") 0)))
          (signals "held_cap" execute) (signals "held_old" OLD)
          (execute fresh (lambda (leaf) (begin
           (signals "leaf" leaf)
           true
           (signals "producer_n" (+ 1 (coalesceNil (signals "producer_n") 0)))
           (define old_value (scan leaf OLD '() '() '() (lambda () true) '("value") (lambda (n v) (+ n v)) 0 +))
           (define new_value (scan leaf NEW '() '() '() (lambda () true) '("value") (lambda (n v) (+ n v)) 0 +))
           (with_table_mutation (list audit) (list "insert" '()) leaf fresh (lambda (bound)
            (insert audit '("id" "old_value" "new_value") (list (list 71 old_value new_value)) '() nil false nil bound))))))))
         '("inert" 41)))))))) false false true)
     (tx_begin_acid owner)
     (createstatementtrigger target "native_abort_probe" "after_statement" "abort-before-cleanup-observer" "observe" '("update") false false (owner "__memcp_tx"))
     (tx_commit owner)
     (tx_begin_acid owner) (define tx (owner "__memcp_tx"))
     (tx_get_or_compute_resource tx "original-cleanup-observer" (lambda () held))
     (define anchor (table "memcp-tests" false "abort_anchor" false nil))
     (parallel
      (try (lambda () (begin
       (tx_begin_acid external)
       (with_table_mutation (list anchor) (list "update" '("value")) (external "__memcp_tx") external
        (lambda (bound)
         (with_table_mutation (list private) (list "insert" '()) bound external
          (lambda (_private) (begin (signals "ready" true) (await "release" bound 10000) true)))))
       (tx_rollback external)
       (signals "done" true)))
       (lambda (cause) (begin (signals "failed" (string (failure_value cause))) (signals "done" true) (error cause))))
      (try (lambda () (begin
       (await "ready" tx 10000)
       (define failed (try (lambda () (begin
        (with_table_mutation (list target) (list "update" '("value")) tx owner (lambda (bound)
         (scan bound target '() '() '("id") (lambda (id) (equal? id 1)) '("$update")
          (lambda (n update) (begin (update '("value" 40)) (+ n 1))) 0 +))) false))
         (lambda (_cause) true)))
       (signals "first_failed" failed)
       (signals "before_calls" (coalesceNil (signals "callback_n") 0))
       (signals "before_rows" (scan nil target '() '() '() (lambda () true) '("id" "value")
        (lambda (rows id value) (merge rows (list (list id value)))) '() merge))
       (signals "release" true)
       (await "done" tx 10000)
       (tx_rollback owner)))
       (lambda (cause) (begin (signals "release" true) (signals "failed" (string (failure_value cause))) (error cause)))))
     (define stale (newsession)) (stale "username" "root") (stale "__memcp_tx" (signals "leaf"))
     (define no_reset (try (lambda () (begin (tx_begin stale) false)) (lambda (_cause) true)))
     (define no_write (try (lambda () (begin
      (with_table_mutation (list audit) (list "insert" '()) (signals "leaf") owner (lambda (_bound) true)) false)) (lambda (_cause) true)))
     (define no_cap (try (lambda () (begin ((signals "held_cap") (signals "fresh") (lambda (_tx) true)) false)) (lambda (_cause) true)))
     (define no_old (try (lambda () (begin
      (scan nil (signals "held_old") '() '() '() (lambda () true) '("id") (lambda (n _id) (+ n 1)) 0 +) false)) (lambda (_cause) true)))
     (list (signals "first_failed") (signals "before_calls")
      (sort (signals "before_rows") (lambda (a b) (< (car a) (car b))))
      (signals "callback_n") (signals "producer_n") (tx_state tx) (nil? (owner "transaction"))
      no_reset no_write no_cap no_old
      (sort (scan nil audit '() '() '() (lambda () true) '("id" "old_value" "new_value")
       (lambda (rows id old new) (merge rows (list (list id old new)))) '() merge)
       (lambda (a b) (< (car a) (car b))))))
  expect:
    result:
    - true
    - 0
    - - - 1
        - 10
    - 1
    - 1
    - aborted
    - true
    - true
    - true
    - true
    - true
    - - - 71
        - 10
        - 40
