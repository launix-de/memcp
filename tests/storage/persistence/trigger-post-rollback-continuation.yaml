- sql: CREATE TABLE abort_core(id INT NOT NULL PRIMARY KEY,value INT NOT NULL,mode INT NOT NULL)
- sql: INSERT abort_core VALUES(1,10,0),(2,20,0)
- sql: CREATE TABLE abort_prefix(id INT NOT NULL PRIMARY KEY,value INT NOT NULL)
- sql: INSERT abort_prefix VALUES(1,7)
- sql: CREATE TABLE abort_audit(id INT NOT NULL PRIMARY KEY,kind INT,old_value INT,new_value INT,local_value INT)
- sql: CREATE TABLE abort_user_log(id INT IDENTITY(1,1) NOT NULL PRIMARY KEY,kind INT)
- sql: CREATE TABLE abort_zero(id INT NOT NULL PRIMARY KEY,value INT)
- sql: INSERT abort_zero VALUES(1,10)
- sql: CREATE TABLE abort_checked(id INT NOT NULL PRIMARY KEY,value INT)
- sql: ALTER TABLE abort_checked ADD CONSTRAINT CK_abort_checked CHECK(value>=0)
- sql: CREATE TABLE abort_check_source(id INT NOT NULL PRIMARY KEY,value INT)
- sql: INSERT abort_check_source VALUES(1,10)
- sql: CREATE TABLE abort_fk_parent(id INT NOT NULL PRIMARY KEY)
- sql: INSERT abort_fk_parent VALUES(1)
- sql: CREATE TABLE abort_fk_child(id INT NOT NULL PRIMARY KEY,parent_id INT)
- sql: ALTER TABLE abort_fk_child ADD CONSTRAINT FK_abort_child FOREIGN KEY(parent_id) REFERENCES abort_fk_parent(id)
- sql: CREATE TABLE abort_unique_target(id INT NOT NULL PRIMARY KEY,value INT NOT NULL UNIQUE)
- sql: INSERT abort_unique_target VALUES(1,5)
- sql: CREATE TABLE abort_fk_source(id INT NOT NULL PRIMARY KEY,value INT)
- sql: INSERT abort_fk_source VALUES(1,10)
- sql: CREATE TABLE abort_before_source(id INT NOT NULL PRIMARY KEY,value INT)
- sql: INSERT abort_before_source VALUES(1,10)
- sql: CREATE TABLE abort_leaf_source(id INT NOT NULL PRIMARY KEY,value INT)
- sql: INSERT abort_leaf_source VALUES(1,10)
- sql: CREATE TABLE abort_before_audit(id INT NOT NULL PRIMARY KEY,old_value INT,new_value INT)
- sql: CREATE TABLE abort_leaf_audit(id INT NOT NULL PRIMARY KEY,old_value INT,new_value INT)
- sql: CREATE TABLE abort_anchor(id INT NOT NULL PRIMARY KEY,value INT)
- sql: INSERT abort_anchor VALUES(1,1)
- sql: CREATE PROCEDURE abort_suffix_procedure @saved INT AS INSERT abort_audit VALUES(301,3,0,0,@saved)
- sql: CREATE TRIGGER abort_audit_user ON abort_audit AFTER INSERT AS INSERT abort_user_log(kind) VALUES(2)
- sql: CREATE TRIGGER abort_core_user ON abort_core AFTER UPDATE AS INSERT abort_user_log(kind) VALUES(1)
- sql: |-
    CREATE TRIGGER abort_core_rollback ON abort_core AFTER UPDATE AS BEGIN
     IF EXISTS(SELECT 1 FROM inserted WHERE mode=1)
     BEGIN
      DECLARE @saved INT=41;
      INSERT abort_audit VALUES(100,1,0,0,@saved);
      IF @saved=41
      BEGIN
       RAISERROR('trigger continuation witness',16,7);
       PRINT 'before rollback';
       ROLLBACK TRANSACTION;
      END;
      PRINT 'after rollback';
      IF UPDATE(value)
      BEGIN
       INSERT abort_audit SELECT 200+i.id,2,d.value,i.value,@saved FROM inserted i JOIN deleted d ON i.id=d.id;
       EXEC abort_suffix_procedure @saved;
       UPDATE abort_core SET value=77,mode=0 WHERE id=1;
      END;
     END;
    END
- sql: |-
    CREATE TRIGGER abort_zero_rollback ON abort_zero AFTER UPDATE AS BEGIN
     ROLLBACK TRANSACTION;
     DECLARE @old_count INT;
     SELECT @old_count=COUNT(*) FROM deleted;
     INSERT abort_audit SELECT 400,4,@old_count,COUNT(*),0 FROM inserted;
    END
- sql: |-
    CREATE TRIGGER abort_check_rollback ON abort_check_source AFTER UPDATE AS BEGIN
     ROLLBACK TRANSACTION;
     INSERT abort_checked VALUES(10,10);
     INSERT abort_checked VALUES(11,20);
     INSERT abort_checked VALUES(12,-1);
     INSERT abort_checked VALUES(13,30);
    END
- sql: |-
    CREATE TRIGGER abort_fk_rollback ON abort_fk_source AFTER UPDATE AS BEGIN
     ROLLBACK TRANSACTION;
     INSERT abort_fk_child VALUES(20,1);
     INSERT abort_unique_target VALUES(2,7);
     INSERT abort_fk_child VALUES(21,999);
     INSERT abort_unique_target VALUES(3,9);
    END
- scm: (altertable (table "memcp-tests" false "abort_audit" false nil) "engine" "logged")
- sql: CREATE TABLE abort_prepare_sql(id INT NOT NULL PRIMARY KEY,value INT)
