- name: Caught native preparation failures still abort the entire original transaction without retrying preparation
  scm: |
    (begin
     (registertriggerlanguage "abort-preparation-observer"
      (close_procedure (lambda (mode _context)
       (lambda (OLD NEW session completion) (begin
        (define probe (session "abort_preparation_probe"))
        (define prepare (lambda () (begin
         (probe "prepare_n" (+ 1 (coalesceNil (probe "prepare_n") 0)))
         (if (equal? mode "opaque") (error (probe "cause"))
          (list (lambda (_execute _OLD _NEW _payload) (probe "suffix" true)) session)))))
        (try (lambda () (request_transaction_abort completion prepare))
         (lambda (failure) (probe "first_cause" (transaction_abort_failure failure))))
        (try (lambda () (request_transaction_abort completion (lambda () (begin
          (probe "replayed" true) (error "repeated abort preparation executed")))))
         (lambda (failure) (probe "second_cause" (transaction_abort_failure failure))))
        true)))) false false true)
     (define run (lambda (mode) (begin
      (define owner (newsession)) (owner "username" "root")
      (define probe (newsession)) (owner "abort_preparation_probe" probe)
      (define marker (list "opaque preparation witness" 73)) (probe "cause" marker)
      (define target (table "memcp-tests" false (concat "abort_prepare_" mode) false nil))
      (define prefix (table "memcp-tests" false "abort_prefix" false nil))
      (tx_begin_acid owner)
      (createstatementtrigger target (concat "native_abort_prepare_" mode) "after_statement"
       "abort-preparation-observer" mode '("update") false false (owner "__memcp_tx"))
      (tx_commit owner)
      (tx_begin_acid owner) (define tx (owner "__memcp_tx"))
      (with_table_mutation (list prefix) (list "update" '("value")) tx owner (lambda (bound)
       (scan bound prefix '() '() '("id") (lambda (id) (equal? id 1)) '("$update")
        (lambda (n update) (begin (update '("value" 99)) (+ n 1))) 0 +)))
      (try (lambda ()
       (with_table_mutation (list target) (list "update" '("value")) tx owner (lambda (bound)
        (scan bound target '() '() '("id") (lambda (id) (equal? id 1)) '("$update")
         (lambda (n update) (begin (update '("value" 50)) (+ n 1))) 0 +))))
       (lambda (failure) (begin
        (probe "terminal" (transaction_abort_transfer? failure))
        (probe "final_cause" (transaction_abort_failure failure)))))
      (define same_cause (lambda (cause)
       (if (equal? mode "opaque") (identical? (failure_value cause) marker)
        (equal? (string (failure_value cause)) "native continuation payload requires immutable scalar or list data"))))
      (list (probe "prepare_n") (nil? (probe "replayed")) (nil? (probe "suffix"))
       (probe "terminal") (same_cause (probe "first_cause"))
       (same_cause (probe "second_cause")) (same_cause (probe "final_cause"))
       (tx_state tx) (nil? (owner "transaction"))
       (scan nil prefix '() '() '() (lambda () true) '("id" "value")
        (lambda (rows id value) (merge rows (list (list id value)))) '() merge)
       (scan nil target '() '() '() (lambda () true) '("id" "value")
        (lambda (rows id value) (merge rows (list (list id value)))) '() merge)))))
     (map '("unsealable" "opaque") run))
  expect:
    result:
    - &id001
      - 1
      - true
      - true
      - true
      - true
      - true
      - true
      - aborted
      - true
      - - - 1
          - 7
      - - - 1
          - 10
    - *id001
