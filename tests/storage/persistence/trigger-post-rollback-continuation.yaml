- sql: CREATE TABLE abort_prepare_identity(id INT IDENTITY(1,1) NOT NULL PRIMARY KEY,value INT)
- sql: CREATE TRIGGER abort_prepare_sql_rollback ON abort_prepare_sql AFTER UPDATE AS BEGIN ROLLBACK; INSERT abort_audit VALUES(902,9,0,0,0); END
