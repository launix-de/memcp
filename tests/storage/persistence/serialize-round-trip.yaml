# Serialize round-trip test for computed columns (StorageComputeProxy).
# Verifies that GROUP BY cache survives SHUTDOWN/restart and that
# invalidation still works after deserialization.

metadata:
  version: "1.0"
  description: "StorageComputeProxy serialize round-trip: persist, restart, verify"
  isolated: true

test_cases:
  - name: Drop leftover fractional dates
    sql: DROP TABLE IF EXISTS sr_date_ns
  - name: Create native fractional date storage
    sql: CREATE TABLE sr_date_ns (id INT PRIMARY KEY, stamp DATETIME)
  - name: Insert exact native fractional dates
    scm: |
      (insert (table "memcp-tests" false "sr_date_ns" false) '("id" "stamp")
        (list (list 1 (date_from_parts 1700000000 1 17))
          (list 2 (date_from_parts 1700000000 2 17))
          (list 3 (date_from_parts -1 999999999 2047))))
  - name: Date column coercion preserves supplied nanoseconds
    sql: INSERT INTO sr_date_ns VALUES (4, '2023-11-14 22:13:20.000000003')
  - name: Crash with native fractional dates in WAL
    scm: (crash)
    expect: {interrupted_ok: true}
  - name: Restart native fractional date WAL
    action: restart
  - name: Complete native date rows after WAL replay
    sql: SELECT id, stamp FROM sr_date_ns ORDER BY id
    expect:
      rows: 4
      data:
      - {id: 1, stamp: '2023-11-14 22:13:20.000000001'}
      - {id: 2, stamp: '2023-11-14 22:13:20.000000002'}
      - {id: 3, stamp: '1969-12-31 23:59:59.999999999'}
      - {id: 4, stamp: '2023-11-14 22:13:20.000000003'}
  - name: Rebuild retains native fractional date parts
    scm: (rebuild true false)
  - name: Complete native date rows before restart
    sql: SELECT id, stamp FROM sr_date_ns ORDER BY id
    expect: &native_date_rows
      rows: 4
      data:
      - {id: 1, stamp: '2023-11-14 22:13:20.000000001'}
      - {id: 2, stamp: '2023-11-14 22:13:20.000000002'}
      - {id: 3, stamp: '1969-12-31 23:59:59.999999999'}
      - {id: 4, stamp: '2023-11-14 22:13:20.000000003'}
  - name: Native date sort keeps adjacent nanoseconds distinct
    sql: SELECT id FROM sr_date_ns ORDER BY stamp
    expect: {rows: 4, data: [{id: 3}, {id: 1}, {id: 2}, {id: 4}]}
  - name: Nanosecond group equality does not collapse adjacent dates
    sql: SELECT COUNT(DISTINCT stamp) AS n FROM sr_date_ns
    expect: {rows: 1, data: [{n: 4}]}
  - name: Invalid fractional date parts fail
    scm: (date_from_parts 1700000000 1000000000 0)
    expect: {error: true}

  # --- Setup ---
  - name: "Drop leftover table"
    sql: "DROP TABLE IF EXISTS sr_data"

  - name: "Create base table"
    sql: "CREATE TABLE sr_data (id INT PRIMARY KEY, category VARCHAR(20), amount INT)"

  - name: "Insert initial data"
    sql: |
      INSERT INTO sr_data (id, category, amount) VALUES
        (1, 'Alpha', 100),
        (2, 'Alpha', 200),
        (3, 'Beta', 150),
        (4, 'Beta', 50),
        (5, 'Gamma', 300)

  - name: "Create persistent scalar computed column"
    scm: |
      (createcolumn (table "memcp-tests" false "sr_data" false) "doubled" "INT" '() '()
        '("amount") (lambda (amount) (* amount 2)))

  - name: "Baseline: scalar computed values are cached"
    sql: "SELECT id, doubled FROM sr_data ORDER BY id"
    expect:
      rows: 5
      data: [{id: 1, doubled: 200}, {id: 2, doubled: 400}, {id: 3, doubled: 300}, {id: 4, doubled: 100}, {id: 5, doubled: 600}]

  - name: "Create hidden sloppy table"
    scm: |
      (createtable "memcp-tests" ".sr_hidden"
        (list
          (list "column" "id" "int" (list "primary") (list))
          (list "column" "note" "text" (list) (list)))
        (list "engine" "sloppy")
        true)

  - name: "Insert hidden sloppy rows"
    sql: |
      INSERT INTO `.sr_hidden` (id, note) VALUES
        (1, 'ephemeral-a'),
        (2, 'ephemeral-b')

  - name: "Baseline: hidden sloppy table readable"
    sql: "SELECT COUNT(*) AS c FROM `.sr_hidden`"
    expect:
      rows: 1
      data:
        - c: 2

  # --- Baseline GROUP BY (creates keytable + StorageComputeProxy) ---
  - name: "Baseline: SUM per category"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 300
        - category: "Beta"
          s: 200
        - category: "Gamma"
          s: 300

  - name: "Baseline: COUNT per category"
    sql: "SELECT category, COUNT(*) AS c FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          c: 2
        - category: "Beta"
          c: 2
        - category: "Gamma"
          c: 1

  # --- SHUTDOWN to persist computed columns ---
  - name: "SHUTDOWN to persist StorageComputeProxy"
    sql: "SHUTDOWN"
    restart_timeout: 300
    expect:
      rows: 0

  # --- Re-query after restart: must return identical results ---
  - name: Complete native date rows after restart
    sql: SELECT id, stamp FROM sr_date_ns ORDER BY id
    expect: *native_date_rows
  - name: Exact date parts remain native after restart
    scm: |
      (scan nil (table "memcp-tests" false "sr_date_ns" false) '() '() '("id")
        (lambda (id) (equal? id 1)) '("stamp")
        (lambda (acc stamp)
          (if (equal? (date_parts stamp) '(1700000000 1 17))
            (+ acc 1) (error "native date parts changed"))) 0 + false)
    expect: {data: [1]}

  - name: "After restart: persisted scalar values unchanged"
    sql: "SELECT id, doubled FROM sr_data ORDER BY id"
    expect:
      rows: 5
      data: [{id: 1, doubled: 200}, {id: 2, doubled: 400}, {id: 3, doubled: 300}, {id: 4, doubled: 100}, {id: 5, doubled: 600}]

  - name: "After restart: SUM per category unchanged"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 300
        - category: "Beta"
          s: 200
        - category: "Gamma"
          s: 300

  - name: "After restart: COUNT per category unchanged"
    sql: "SELECT category, COUNT(*) AS c FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          c: 2
        - category: "Beta"
          c: 2
        - category: "Gamma"
          c: 1

  - name: "After restart: hidden sloppy table survived shutdown rebuild"
    sql: "SELECT id, note FROM `.sr_hidden` ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
          note: "ephemeral-a"
        - id: 2
          note: "ephemeral-b"

  # --- DML after restart: verify invalidation still works ---
  - name: "Insert new row after restart"
    sql: "INSERT INTO sr_data (id, category, amount) VALUES (6, 'Alpha', 400)"

  - name: "After post-restart INSERT: SUM updated"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 700
        - category: "Beta"
          s: 200
        - category: "Gamma"
          s: 300

  - name: "Update row after restart"
    sql: "UPDATE sr_data SET amount = 999 WHERE id = 3"

  - name: "After post-restart UPDATE: restored scalar procedure executes"
    sql: "SELECT id, doubled FROM sr_data ORDER BY id"
    expect:
      rows: 6
      data: [{id: 1, doubled: 200}, {id: 2, doubled: 400}, {id: 3, doubled: 1998}, {id: 4, doubled: 100}, {id: 5, doubled: 600}, {id: 6, doubled: 800}]

  - name: "After post-restart UPDATE: SUM reflects change"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 700
        - category: "Beta"
          s: 1049
        - category: "Gamma"
          s: 300

  - name: "Delete row after restart"
    sql: "DELETE FROM sr_data WHERE id = 5"

  - name: "After post-restart DELETE: Gamma removed (no source rows)"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 2
      data:
        - category: "Alpha"
          s: 700
        - category: "Beta"
          s: 1049

  - name: "Insert new hidden sloppy row after restart"
    sql: "INSERT INTO `.sr_hidden` (id, note) VALUES (3, 'ephemeral-c')"

  - name: "Second SHUTDOWN keeps hidden sloppy table durable"
    sql: "SHUTDOWN"
    restart_timeout: 300
    expect:
      rows: 0

  - name: "After second restart: hidden sloppy rows still present"
    sql: "SELECT COUNT(*) AS c FROM `.sr_hidden`"
    expect:
      rows: 1
      data:
        - c: 3

  - name: Complete native date rows after second restart
    sql: SELECT id, stamp FROM sr_date_ns ORDER BY id
    expect: *native_date_rows
  - name: Cleanup fractional dates
    sql: DROP TABLE sr_date_ns

  # --- Cleanup ---
  - name: "After second restart: recomputed scalar value survived"
    sql: "SELECT doubled FROM sr_data WHERE id = 3"
    expect: {rows: 1, data: [{doubled: 1998}]}

  - name: "Cleanup sr_data"
    sql: "DROP TABLE IF EXISTS sr_data"
  - name: "Cleanup hidden sloppy table"
    scm: '(droptable "memcp-tests" ".sr_hidden" true)'
