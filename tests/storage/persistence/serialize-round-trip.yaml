# Serialize round-trip test for computed columns (StorageComputeProxy).
# Verifies that GROUP BY cache survives SHUTDOWN/restart and that
# invalidation still works after deserialization.

metadata:
  version: "1.0"
  description: "StorageComputeProxy serialize round-trip: persist, restart, verify"
  isolated: true

test_cases:
  # --- Setup ---
  - name: "Drop leftover table"
    sql: "DROP TABLE IF EXISTS sr_data"

  - name: "Create base table"
    sql: "CREATE TABLE sr_data (id INT PRIMARY KEY, category VARCHAR(20), amount INT)"

  - name: "Insert initial data"
    sql: |
      INSERT INTO sr_data (id, category, amount) VALUES
        (1, 'Alpha', 100),
        (2, 'Alpha', 200),
        (3, 'Beta', 150),
        (4, 'Beta', 50),
        (5, 'Gamma', 300)

  - name: "Create persistent scalar computed column"
    scm: |
      (createcolumn (table "memcp-tests" false "sr_data" false nil) "doubled" "INT" '() '()
        '("amount") (lambda (amount) (* amount 2)))

  - name: "Baseline: scalar computed values are cached"
    sql: "SELECT id, doubled FROM sr_data ORDER BY id"
    expect:
      rows: 5
      data: [{id: 1, doubled: 200}, {id: 2, doubled: 400}, {id: 3, doubled: 300}, {id: 4, doubled: 100}, {id: 5, doubled: 600}]

  - name: "Create hidden sloppy table"
    scm: |
      (createtable "memcp-tests" ".sr_hidden"
        (list
          (list "column" "id" "int" (list "primary") (list))
          (list "column" "note" "text" (list) (list)))
        (list "engine" "sloppy")
        true)

  - name: "Insert hidden sloppy rows"
    sql: |
      INSERT INTO `.sr_hidden` (id, note) VALUES
        (1, 'ephemeral-a'),
        (2, 'ephemeral-b')

  - name: "Baseline: hidden sloppy table readable"
    sql: "SELECT COUNT(*) AS c FROM `.sr_hidden`"
    expect:
      rows: 1
      data:
        - c: 2

  # --- Baseline GROUP BY (creates keytable + StorageComputeProxy) ---
  - name: "Baseline: SUM per category"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 300
        - category: "Beta"
          s: 200
        - category: "Gamma"
          s: 300

  - name: "Baseline: COUNT per category"
    sql: "SELECT category, COUNT(*) AS c FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          c: 2
        - category: "Beta"
          c: 2
        - category: "Gamma"
          c: 1

  # --- SHUTDOWN to persist computed columns ---
  - name: "SHUTDOWN to persist StorageComputeProxy"
    sql: "SHUTDOWN"
    restart_timeout: 300
    expect:
      rows: 0

  # --- Re-query after restart: must return identical results ---
  - name: "After restart: persisted scalar values unchanged"
    sql: "SELECT id, doubled FROM sr_data ORDER BY id"
    expect:
      rows: 5
      data: [{id: 1, doubled: 200}, {id: 2, doubled: 400}, {id: 3, doubled: 300}, {id: 4, doubled: 100}, {id: 5, doubled: 600}]

  - name: "After restart: SUM per category unchanged"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 300
        - category: "Beta"
          s: 200
        - category: "Gamma"
          s: 300

  - name: "After restart: COUNT per category unchanged"
    sql: "SELECT category, COUNT(*) AS c FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          c: 2
        - category: "Beta"
          c: 2
        - category: "Gamma"
          c: 1

  - name: "After restart: hidden sloppy table survived shutdown rebuild"
    sql: "SELECT id, note FROM `.sr_hidden` ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
          note: "ephemeral-a"
        - id: 2
          note: "ephemeral-b"

  # --- DML after restart: verify invalidation still works ---
  - name: "Insert new row after restart"
    sql: "INSERT INTO sr_data (id, category, amount) VALUES (6, 'Alpha', 400)"

  - name: "After post-restart INSERT: SUM updated"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 700
        - category: "Beta"
          s: 200
        - category: "Gamma"
          s: 300

  - name: "Update row after restart"
    sql: "UPDATE sr_data SET amount = 999 WHERE id = 3"

  - name: "After post-restart UPDATE: restored scalar procedure executes"
    sql: "SELECT id, doubled FROM sr_data ORDER BY id"
    expect:
      rows: 6
      data: [{id: 1, doubled: 200}, {id: 2, doubled: 400}, {id: 3, doubled: 1998}, {id: 4, doubled: 100}, {id: 5, doubled: 600}, {id: 6, doubled: 800}]

  - name: "After post-restart UPDATE: SUM reflects change"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 3
      data:
        - category: "Alpha"
          s: 700
        - category: "Beta"
          s: 1049
        - category: "Gamma"
          s: 300

  - name: "Delete row after restart"
    sql: "DELETE FROM sr_data WHERE id = 5"

  - name: "After post-restart DELETE: Gamma removed (no source rows)"
    sql: "SELECT category, SUM(amount) AS s FROM sr_data GROUP BY category ORDER BY category"
    expect:
      rows: 2
      data:
        - category: "Alpha"
          s: 700
        - category: "Beta"
          s: 1049

  - name: "Insert new hidden sloppy row after restart"
    sql: "INSERT INTO `.sr_hidden` (id, note) VALUES (3, 'ephemeral-c')"

  - name: "Second SHUTDOWN keeps hidden sloppy table durable"
    sql: "SHUTDOWN"
    restart_timeout: 300
    expect:
      rows: 0

  - name: "After second restart: hidden sloppy rows still present"
    sql: "SELECT COUNT(*) AS c FROM `.sr_hidden`"
    expect:
      rows: 1
      data:
        - c: 3

  # --- Cleanup ---
  - name: "After second restart: recomputed scalar value survived"
    sql: "SELECT doubled FROM sr_data WHERE id = 3"
    expect: {rows: 1, data: [{doubled: 1998}]}

  - name: "Cleanup sr_data"
    sql: "DROP TABLE IF EXISTS sr_data"
  - name: "Cleanup hidden sloppy table"
    scm: '(droptable "memcp-tests" ".sr_hidden" true)'

  - name: Create mixed native scalar computation fixture
    sql: CREATE TABLE sr_mixed_clock (id INT PRIMARY KEY, base INT)

  - name: Seed mixed computation inputs
    sql: INSERT INTO sr_mixed_clock VALUES (1,1),(2,2),(3,3)

  - name: Declare mixed calendar text and NULL computation
    scm: |
      (createcolumn (table "memcp-tests" false "sr_mixed_clock" false nil) "derived" "ANY" '() '()
        '("base") (lambda (base)
          (if (equal? base 1) (parse_date "9999-12-31 23:59:59.1234567")
            (equal? base 2) "ordinary text" nil)))

  - name: Warm and check mixed computed scalar values
    scm: |
      (scan nil (table "memcp-tests" false "sr_mixed_clock" false nil) '() '() '() (lambda () true)
        '("base" "derived") (lambda (total base derived)
          (if (if (equal? base 1) (and (number? derived) (equal? (date_parts derived) '(253402300799 123456700 0)))
                (equal? base 2) (equal? derived "ordinary text") (nil? derived))
            (+ total 1) (error "mixed computed value changed"))) 0 +)
    expect: {result: 3}

  - name: Rebuild warmed mixed computation
    scm: (rebuild (table "memcp-tests" false "sr_mixed_clock" false nil) true false)

  - name: Persist mixed computation and its enclosing validity state
    sql: SHUTDOWN

  - name: Restart retains mixed calendar text NULL and enclosing validity
    scm: |
      (scan nil (table "memcp-tests" false "sr_mixed_clock" false nil) '() '() '() (lambda () true)
        '("base" "derived") (lambda (total base derived)
          (if (if (equal? base 1) (and (number? derived) (equal? (date_parts derived) '(253402300799 123456700 0)))
                (equal? base 2) (equal? derived "ordinary text") (nil? derived))
            (+ total 1) (error "reloaded mixed computation changed"))) 0 +)
    expect: {result: 3}

  - name: Invalidate a reloaded mixed computation
    sql: UPDATE sr_mixed_clock SET base=2 WHERE id=1
    expect: {affected_rows: 1}

  - name: Reloaded recipe recomputes after its source changes
    sql: SELECT derived FROM sr_mixed_clock WHERE id=1
    expect: {data: [{derived: ordinary text}]}

  - name: Drop mixed computation fixture
    sql: DROP TABLE sr_mixed_clock

  - name: Create bounded computed tuple inputs
    sql: CREATE TABLE sr_tuple_data (id INT PRIMARY KEY, value INT)

  - name: Seed distinct bounded tuple inputs
    sql: INSERT INTO sr_tuple_data VALUES (1,10),(2,20)

  - name: Rebuild scalar inputs before declaring the tuple computation
    scm: (rebuild (table "memcp-tests" false "sr_tuple_data" false nil) true false)

  - name: Declare a computed tuple with a nullable field
    scm: |
      (createcolumn (table "memcp-tests" false "sr_tuple_data" false nil) "packet" "ANY" '() '()
        '("value") (lambda (value) (list true value (if (equal? value 10) "ten" nil))))

  - name: Computed tuple values preserve all fields before rebuild
    sql: SELECT id,packet FROM sr_tuple_data ORDER BY id
    expect: {rows: 2,data: [{id: 1,packet: [true,10,ten]},{id: 2,packet: [true,20,null]}]}

  - name: Rebuild the warmed computed tuples
    scm: (rebuild (table "memcp-tests" false "sr_tuple_data" false nil) true false)

  - name: Rebuilt computed tuples preserve complete values and NULL fields
    sql: SELECT id,packet FROM sr_tuple_data ORDER BY id
    expect: {rows: 2,data: [{id: 1,packet: [true,10,ten]},{id: 2,packet: [true,20,null]}]}

  - name: Persist the rebuilt computed tuples
    sql: SHUTDOWN

  - name: Reloaded computed tuples preserve complete values and NULL fields
    sql: SELECT id,packet FROM sr_tuple_data ORDER BY id
    expect: {rows: 2,data: [{id: 1,packet: [true,10,ten]},{id: 2,packet: [true,20,null]}]}

  - name: Invalidate one reloaded computed tuple
    sql: UPDATE sr_tuple_data SET value=30 WHERE id=1
    expect: {affected_rows: 1}

  - name: Updated tuples preserve recomputed values and untouched tuple fields
    sql: SELECT id,packet FROM sr_tuple_data ORDER BY id
    expect: {rows: 2,data: [{id: 1,packet: [true,30,null]},{id: 2,packet: [true,20,null]}]}

  - name: Drop the computed tuple fixture
    sql: DROP TABLE sr_tuple_data
