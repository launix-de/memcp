test_cases:
- name: An unrelated row prefix and a new AFTER program share the original decision
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE late_trigger_unrelated_prior SET value=11 WHERE id=1
    - connection: owner
      sql: CREATE TRIGGER late_trigger_unrelated_program ON late_trigger_unrelated AFTER UPDATE AS BEGIN INSERT late_trigger_unrelated_audit(id,old_value,new_value,phase)
        SELECT i.id,d.value,i.value,10 FROM inserted i INNER JOIN deleted d ON i.id=d.id; END
    - connection: owner
      sql: UPDATE late_trigger_unrelated SET value=2 WHERE id=1
    - connection: owner
      sql: SELECT id,value FROM late_trigger_unrelated ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 2
    - connection: owner
      sql: SELECT id,old_value,new_value,phase FROM late_trigger_unrelated_audit ORDER BY old_value,phase
      expect:
        rows: 1
        data:
        - id: 1
          old_value: 1
          new_value: 2
          phase: 10
    - connection: observer
      sql: SELECT id,value FROM late_trigger_unrelated ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 1
    - connection: observer
      sql: SELECT id,old_value,new_value,phase FROM late_trigger_unrelated_audit ORDER BY old_value,phase
      expect:
        rows: 0
        data: []
    - connection: observer
      sql: SELECT OBJECT_ID(N'late_trigger_unrelated_program',N'TR') AS trigger_id
      expect:
        rows: 1
        data:
        - trigger_id: null
    - connection: owner
      sql: SELECT XACT_STATE() AS state,@@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - state: 1
          depth: 1
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,value FROM late_trigger_unrelated ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 2
    - connection: observer
      sql: SELECT id,old_value,new_value,phase FROM late_trigger_unrelated_audit ORDER BY old_value,phase
      expect:
        rows: 1
        data:
        - id: 1
          old_value: 1
          new_value: 2
          phase: 10
    - connection: owner
      sql: SELECT XACT_STATE() AS state,@@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - state: 0
          depth: 0
- name: Earlier writes on the same endpoint do not fire a later trigger retroactively
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE late_trigger_same SET value=2 WHERE id=1
    - connection: owner
      sql: CREATE TRIGGER late_trigger_same_program ON late_trigger_same AFTER UPDATE AS BEGIN INSERT late_trigger_same_audit(id,old_value,new_value,phase)
        SELECT i.id,d.value,i.value,10 FROM inserted i INNER JOIN deleted d ON i.id=d.id; END
    - connection: owner
      sql: SELECT id,old_value,new_value,phase FROM late_trigger_same_audit ORDER BY old_value,phase
      expect:
        rows: 0
        data: []
    - connection: owner
      sql: UPDATE late_trigger_same SET value=3 WHERE id=1
    - connection: owner
      sql: SELECT id,old_value,new_value,phase FROM late_trigger_same_audit ORDER BY old_value,phase
      expect:
        rows: 1
        data:
        - id: 1
          old_value: 2
          new_value: 3
          phase: 10
    - connection: observer
      sql: SELECT id,value FROM late_trigger_same ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 1
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,value FROM late_trigger_same ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 3
    - connection: observer
      sql: SELECT id,old_value,new_value,phase FROM late_trigger_same_audit ORDER BY old_value,phase
      expect:
        rows: 1
        data:
        - id: 1
          old_value: 2
          new_value: 3
          phase: 10
