metadata:
  version: "1.0"
  description: "ENGINE=MEMORY table and ALTER TABLE ENGINE= transitions"
  isolated: true

setup:
  - sql: DROP TABLE IF EXISTS engine_tx_original
  - sql: DROP TABLE IF EXISTS engine_tx_promoted
  - sql: "DROP TABLE IF EXISTS mem_t"
  - sql: "DROP TABLE IF EXISTS alter_safe_to_mem"
  - sql: "DROP TABLE IF EXISTS alter_mem_to_safe"
  - sql: "DROP TABLE IF EXISTS alter_sloppy_to_safe"
  - sql: "DROP TABLE IF EXISTS alter_noop"
  - sql: "CREATE TABLE mem_t (id INT, v TEXT) ENGINE=MEMORY"

test_cases:
  # --- Original MEMORY engine tests ---

  - name: "Insert data into MEMORY table"
    sql: "INSERT INTO mem_t (id, v) VALUES (1, 'x'), (2, 'y')"
    expect:
      affected_rows: 2

  - name: "Select returns inserted rows"
    sql: "SELECT id, v FROM mem_t ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
          v: "x"
        - id: 2
          v: "y"

  - name: "SHUTDOWN memcp"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "Table exists after restart"
    sql: "SHOW FULL COLUMNS FROM mem_t"
    expect:
      rows: 2

  - name: "Select after restart returns no rows"
    sql: "SELECT id, v FROM mem_t ORDER BY id"
    expect:
      rows: 0

  # --- ALTER TABLE ENGINE= SAFE to MEMORY ---

  - name: "Create SAFE table for engine change"
    sql: "CREATE TABLE alter_safe_to_mem (id INT, v TEXT) ENGINE=SAFE"
    expect:
      rows: 0

  - name: "Insert data into SAFE table"
    sql: "INSERT INTO alter_safe_to_mem (id, v) VALUES (1, 'a'), (2, 'b')"
    expect:
      affected_rows: 2

  - name: "ALTER TABLE ENGINE=MEMORY"
    sql: "ALTER TABLE alter_safe_to_mem ENGINE=MEMORY"
    expect:
      rows: 0

  - name: "Data still readable after SAFE to MEMORY"
    sql: "SELECT id, v FROM alter_safe_to_mem ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
          v: "a"
        - id: 2
          v: "b"

  - name: "SHUTDOWN after SAFE to MEMORY"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "Data gone after restart (now MEMORY)"
    sql: "SELECT id, v FROM alter_safe_to_mem ORDER BY id"
    expect:
      rows: 0

  # --- ALTER TABLE ENGINE= MEMORY to SAFE ---

  - name: "Create MEMORY table for engine change"
    sql: "CREATE TABLE alter_mem_to_safe (id INT, v TEXT) ENGINE=MEMORY"
    expect:
      rows: 0

  - name: "Insert data into MEMORY table for conversion"
    sql: "INSERT INTO alter_mem_to_safe (id, v) VALUES (10, 'x'), (20, 'y')"
    expect:
      affected_rows: 2

  - name: "ALTER TABLE ENGINE=SAFE from MEMORY"
    sql: "ALTER TABLE alter_mem_to_safe ENGINE=SAFE"
    expect:
      rows: 0

  - name: "Data still readable after MEMORY to SAFE"
    sql: "SELECT id, v FROM alter_mem_to_safe ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 10
          v: "x"
        - id: 20
          v: "y"

  - name: "SHUTDOWN after MEMORY to SAFE"
    sql: "SHUTDOWN"
    expect:
      rows: 0

  - name: "Data survives restart (now SAFE)"
    sql: "SELECT id, v FROM alter_mem_to_safe ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 10
          v: "x"
        - id: 20
          v: "y"

  # --- ALTER TABLE ENGINE= SLOPPY to SAFE ---

  - name: "Create SLOPPY table for engine change"
    sql: "CREATE TABLE alter_sloppy_to_safe (id INT, v TEXT) ENGINE=SLOPPY"
    expect:
      rows: 0

  - name: "Insert data into SLOPPY table"
    sql: "INSERT INTO alter_sloppy_to_safe (id, v) VALUES (3, 'c')"
    expect:
      affected_rows: 1

  - name: "ALTER TABLE ENGINE=SAFE from SLOPPY"
    sql: "ALTER TABLE alter_sloppy_to_safe ENGINE=SAFE"
    expect:
      rows: 0

  - name: "Data readable after SLOPPY to SAFE"
    sql: "SELECT id, v FROM alter_sloppy_to_safe ORDER BY id"
    expect:
      rows: 1
      data:
        - id: 3
          v: "c"

  # --- No-op: same engine ---

  - name: "Create table for no-op test"
    sql: "CREATE TABLE alter_noop (id INT) ENGINE=SAFE"
    expect:
      rows: 0

  - name: "ALTER TABLE ENGINE=SAFE on already-SAFE table"
    sql: "ALTER TABLE alter_noop ENGINE=SAFE"
    expect:
      rows: 0

  # --- Error: non-existent table ---

  - name: "ALTER TABLE ENGINE on non-existent table"
    sql: "ALTER TABLE no_such_table ENGINE=MEMORY"
    expect:
      error: true

  - name: Create a persistent fixture for transactional engine changes
    sql: CREATE TABLE engine_tx_original (id INT PRIMARY KEY, value INT)
  - name: Populate the persistent engine fixture
    sql: INSERT INTO engine_tx_original VALUES (1, 10)
  - name: START ACID TRANSACTION rolls back engine declarations and earlier data together
    steps:
    - session_id: engine_tx_owner
      sql: START ACID TRANSACTION
    - session_id: engine_tx_owner
      sql: UPDATE engine_tx_original SET value = 20 WHERE id = 1
    - session_id: engine_tx_owner
      sql: ALTER TABLE engine_tx_original ENGINE=MEMORY
    - session_id: engine_tx_owner
      sql: INSERT INTO engine_tx_original VALUES (2, 30)
    - session_id: engine_tx_owner
      sql: SELECT id, value FROM engine_tx_original ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 20
        - id: 2
          value: 30
    - session_id: engine_tx_owner
      sql: SELECT persistency_mode FROM system_schema.tables WHERE schema_name = 'memcp-tests' AND name = 'engine_tx_original'
      expect:
        rows: 1
        data:
        - persistency_mode: memory
    - session_id: engine_tx_owner
      sql: ROLLBACK
  - name: START ACID TRANSACTION retains the original persistent rows after rollback
    sql: SELECT id, value FROM engine_tx_original ORDER BY id
    expect:
      rows: 1
      data:
      - id: 1
        value: 10
  - name: BEGIN rolls back engine declarations and earlier data together
    steps:
    - session_id: engine_tx_owner
      sql: BEGIN
    - session_id: engine_tx_owner
      sql: UPDATE engine_tx_original SET value = 20 WHERE id = 1
    - session_id: engine_tx_owner
      sql: ALTER TABLE engine_tx_original ENGINE=MEMORY
    - session_id: engine_tx_owner
      sql: INSERT INTO engine_tx_original VALUES (2, 30)
    - session_id: engine_tx_owner
      sql: SELECT id, value FROM engine_tx_original ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 20
        - id: 2
          value: 30
    - session_id: engine_tx_owner
      sql: SELECT persistency_mode FROM system_schema.tables WHERE schema_name = 'memcp-tests' AND name = 'engine_tx_original'
      expect:
        rows: 1
        data:
        - persistency_mode: memory
    - session_id: engine_tx_owner
      sql: ROLLBACK
  - name: BEGIN retains the original persistent rows after rollback
    sql: SELECT id, value FROM engine_tx_original ORDER BY id
    expect:
      rows: 1
      data:
      - id: 1
        value: 10
  - name: Restart after rolling back an engine downgrade
    action: restart
  - name: Rollback of the engine downgrade retains the original disk data
    sql: SELECT id, value FROM engine_tx_original ORDER BY id
    expect:
      rows: 1
      data:
      - id: 1
        value: 10
  - name: Create a volatile fixture for transactional promotion
    sql: CREATE TABLE engine_tx_promoted (id INT PRIMARY KEY, value INT) ENGINE=MEMORY
  - name: Populate the volatile promotion fixture
    sql: INSERT INTO engine_tx_promoted VALUES (1, 10)
  - name: Commit earlier and later data with a persistent engine promotion
    steps:
    - session_id: engine_tx_owner
      sql: START ACID TRANSACTION
    - session_id: engine_tx_owner
      sql: UPDATE engine_tx_promoted SET value = 11 WHERE id = 1
    - session_id: engine_tx_owner
      sql: ALTER TABLE engine_tx_promoted ENGINE=SAFE
    - session_id: engine_tx_owner
      sql: INSERT INTO engine_tx_promoted VALUES (2, 22)
    - session_id: engine_tx_owner
      sql: COMMIT
  - name: Restart after accepting the engine promotion
    action: restart
  - name: The accepted engine promotion recovers every original transaction row
    sql: SELECT id, value FROM engine_tx_promoted ORDER BY id
    expect:
      rows: 2
      data:
      - id: 1
        value: 11
      - id: 2
        value: 22
  - name: The accepted engine promotion recovers its matching declaration
    sql: SELECT persistency_mode FROM system_schema.tables WHERE schema_name = 'memcp-tests' AND name = 'engine_tx_promoted'
    expect:
      rows: 1
      data:
      - persistency_mode: safe
cleanup:
  - sql: DROP TABLE IF EXISTS engine_tx_original
  - sql: DROP TABLE IF EXISTS engine_tx_promoted
  - sql: "DROP TABLE IF EXISTS mem_t"
  - sql: "DROP TABLE IF EXISTS alter_safe_to_mem"
  - sql: "DROP TABLE IF EXISTS alter_mem_to_safe"
  - sql: "DROP TABLE IF EXISTS alter_sloppy_to_safe"
  - sql: "DROP TABLE IF EXISTS alter_noop"
