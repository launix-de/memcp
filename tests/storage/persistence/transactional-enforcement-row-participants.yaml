metadata:
  syntax: tsql
  requires_tds: true
  isolated: true
  description: Enforcing declarations share their native decision with unaffected row participants
setup:
- sql: DROP VIEW IF EXISTS enforcement_fk_view
- sql: DROP TABLE IF EXISTS enforcement_fk_only
- sql: DROP VIEW IF EXISTS enforcement_checked_view
- sql: DROP VIEW IF EXISTS enforcement_default_view
- sql: DROP VIEW IF EXISTS enforcement_accepted_view
- sql: DROP VIEW IF EXISTS enforcement_abandoned_view
- sql: DROP TABLE IF EXISTS enforcement_child
- sql: DROP TABLE IF EXISTS enforcement_parent
- sql: DROP TABLE IF EXISTS enforcement_defaults
- sql: DROP VIEW IF EXISTS enforcement_view
- sql: DROP VIEW IF EXISTS enforcement_suffix
- sql: DROP TABLE IF EXISTS enforcement_input
- sql: DROP TABLE IF EXISTS enforcement_audit
- sql: DROP TABLE IF EXISTS enforcement_other
- sql: CREATE TABLE enforcement_input(id INT PRIMARY KEY,value INT)
- sql: CREATE TABLE enforcement_audit(id INT,value INT)
- sql: CREATE TABLE enforcement_other(id INT PRIMARY KEY,value INT)
- sql: INSERT enforcement_input VALUES(1,7)
- sql: CREATE TABLE enforcement_parent(id INT PRIMARY KEY)
- sql: INSERT enforcement_parent VALUES(1)
- sql: CREATE TABLE enforcement_child(id INT PRIMARY KEY,parent_id INT,value INT)
- sql: INSERT enforcement_child VALUES(1,1,3)
- sql: CREATE TABLE enforcement_defaults(id INT PRIMARY KEY,value INT CONSTRAINT DF_enforcement_default_before DEFAULT
    3)
- sql: CREATE TABLE enforcement_fk_only(id INT PRIMARY KEY,parent_id INT)
- sql: INSERT enforcement_fk_only VALUES(1,1)
- sql: DROP VIEW IF EXISTS late_endpoint_view
- sql: DROP VIEW IF EXISTS late_endpoint_rollback_view
- sql: DROP VIEW IF EXISTS late_endpoint_suffix_view
- sql: DROP VIEW IF EXISTS late_endpoint_accepted_view
- sql: DROP TABLE IF EXISTS late_endpoint_commit
- sql: DROP TABLE IF EXISTS late_endpoint_rewrite
- sql: DROP TABLE IF EXISTS late_endpoint_parent
- sql: DROP TABLE IF EXISTS late_endpoint_audit
- sql: DROP TABLE IF EXISTS late_endpoint_other
- sql: CREATE TABLE late_endpoint_parent(id INT PRIMARY KEY)
- sql: INSERT late_endpoint_parent VALUES(1)
- sql: CREATE TABLE late_endpoint_commit(id INT PRIMARY KEY,parent_id INT,value INT)
- sql: INSERT late_endpoint_commit VALUES(1,1,1)
- sql: CREATE TABLE late_endpoint_rewrite(id INT PRIMARY KEY,parent_id INT,value INT)
- sql: INSERT late_endpoint_rewrite VALUES(1,1,1)
- sql: CREATE TABLE late_endpoint_audit(id INT,value INT)
- sql: CREATE TABLE late_endpoint_other(id INT PRIMARY KEY,value INT)
- sql: CREATE TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
    id,value+10 AS value FROM inserted
test_cases:
- name: A trigger and view catalog row retain owner isolation and roll back together
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: CREATE TRIGGER enforcement_hook ON enforcement_input AFTER INSERT AS INSERT enforcement_audit SELECT
        id,value FROM inserted
    - connection: owner
      sql: CREATE VIEW enforcement_view AS SELECT id,value FROM enforcement_input
    - connection: owner
      sql: SELECT id,value FROM enforcement_view
      expect:
        rows: 1
        data:
        - id: 1
          value: 7
    - connection: observer
      sql: SELECT name FROM sys.objects WHERE type=N'V' AND name=N'enforcement_view'
      expect:
        rows: 0
        data: []
    - connection: owner
      sql: INSERT enforcement_other VALUES(1,11)
    - connection: observer
      sql: SELECT id,value FROM enforcement_other
      expect:
        rows: 0
        data: []
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: observer
      sql: SELECT name FROM sys.objects WHERE type IN (N'V',N'TR') AND name IN (N'enforcement_view',N'enforcement_hook')
      expect:
        rows: 0
        data: []
    - connection: observer
      sql: SELECT id,value FROM enforcement_other
      expect:
        rows: 0
        data: []
- name: Unrelated original rows commit with a real trigger and view declaration
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: CREATE TRIGGER enforcement_hook ON enforcement_input AFTER INSERT AS INSERT enforcement_audit SELECT
        id,value FROM inserted
    - connection: owner
      sql: INSERT enforcement_other VALUES(1,11)
    - connection: owner
      sql: CREATE VIEW enforcement_view AS SELECT id,value FROM enforcement_input
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: INSERT enforcement_input VALUES(2,20)
    - connection: observer
      sql: SELECT id,value FROM enforcement_audit ORDER BY id
      expect:
        rows: 1
        data:
        - id: 2
          value: 20
    - connection: observer
      sql: SELECT id,value FROM enforcement_view ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 7
        - id: 2
          value: 20
    - connection: observer
      sql: SELECT id,value FROM enforcement_other ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 11
- name: Savepoint removes only row and view suffix while retaining the trigger prefix
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TRIGGER enforcement_hook ON enforcement_input AFTER INSERT AS INSERT enforcement_audit SELECT id,value+1
        AS value FROM inserted
    - connection: owner
      sql: INSERT enforcement_other VALUES(2,22)
    - connection: owner
      sql: SAVE TRANSACTION before_view
    - connection: owner
      sql: CREATE VIEW enforcement_suffix AS SELECT id,value FROM enforcement_other
    - connection: owner
      sql: INSERT enforcement_other VALUES(3,33)
    - connection: owner
      sql: ROLLBACK TRANSACTION before_view
    - connection: owner
      sql: SELECT name FROM sys.objects WHERE type=N'V' AND name=N'enforcement_suffix'
      expect:
        rows: 0
        data: []
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: INSERT enforcement_input VALUES(3,30)
    - connection: observer
      sql: SELECT id,value FROM enforcement_audit ORDER BY id
      expect:
        rows: 2
        data:
        - id: 2
          value: 20
        - id: 3
          value: 31
    - connection: observer
      sql: SELECT id,value FROM enforcement_other ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 11
        - id: 2
          value: 22
- name: Foreign and check declarations recover their actual enforcement after cross database row admission
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE enforcement_child ADD CONSTRAINT FK_enforcement FOREIGN KEY(parent_id) REFERENCES enforcement_parent(id)
    - connection: owner
      sql: ALTER TABLE enforcement_child ADD CONSTRAINT CK_enforcement CHECK(value>=0)
    - connection: owner
      sql: CREATE VIEW enforcement_checked_view AS SELECT id,value FROM enforcement_child
    - connection: owner
      sql: INSERT enforcement_other VALUES(4,44)
    - connection: owner
      sql: ALTER TABLE enforcement_child WITH CHECK CHECK CONSTRAINT FK_enforcement
    - connection: owner
      sql: ALTER TABLE enforcement_child WITH CHECK CHECK CONSTRAINT CK_enforcement
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,value FROM enforcement_checked_view
      expect:
        rows: 1
        data:
        - id: 1
          value: 3
    - connection: observer
      sql: INSERT enforcement_child VALUES(2,999,3)
      expect:
        error: true
    - connection: observer
      sql: INSERT enforcement_child VALUES(3,1,-1)
      expect:
        error: true
    - connection: observer
      sql: SELECT id,parent_id,value FROM enforcement_child ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          parent_id: 1
          value: 3
- name: A default endpoint retains its row right when a different table has staged enforcement
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TRIGGER enforcement_hook ON enforcement_input AFTER INSERT AS INSERT enforcement_audit SELECT id,value+2
        AS value FROM inserted
    - connection: owner
      sql: ALTER TABLE enforcement_defaults DROP CONSTRAINT DF_enforcement_default_before
    - connection: owner
      sql: ALTER TABLE enforcement_defaults ADD CONSTRAINT DF_enforcement_default_after DEFAULT (7) FOR value
    - connection: owner
      sql: INSERT enforcement_defaults(id) VALUES(1)
    - connection: owner
      sql: CREATE VIEW enforcement_default_view AS SELECT id,value FROM enforcement_defaults
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,value FROM enforcement_default_view
      expect:
        rows: 1
        data:
        - id: 1
          value: 7
    - connection: observer
      sql: INSERT enforcement_input VALUES(4,40)
    - connection: observer
      sql: SELECT id,value FROM enforcement_audit WHERE id=4
      expect:
        rows: 1
        data:
        - id: 4
          value: 42
- name: A pure foreign key authority commits its unaffected row participant inventory
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE enforcement_fk_only ADD CONSTRAINT FK_enforcement_only FOREIGN KEY(parent_id) REFERENCES
        enforcement_parent(id)
    - connection: owner
      sql: CREATE VIEW enforcement_fk_view AS SELECT id,parent_id FROM enforcement_fk_only
    - connection: owner
      sql: INSERT enforcement_other VALUES(7,77)
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT id,parent_id FROM enforcement_fk_view
      expect:
        rows: 1
        data:
        - id: 1
          parent_id: 1
- name: An accepted enforcement and row decision has complete durable values
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TRIGGER enforcement_hook ON enforcement_input AFTER INSERT AS INSERT enforcement_audit SELECT id,value+3
        AS value FROM inserted
    - connection: owner
      sql: CREATE VIEW enforcement_accepted_view AS SELECT id,value FROM enforcement_other
    - connection: owner
      sql: INSERT enforcement_other VALUES(5,55)
    - connection: owner
      sql: COMMIT TRANSACTION
- name: Crash after accepting enforcement and row participants
  scm: (crash)
  expect:
    interrupted_ok: true
- name: Restart the accepted enforcement and row decision
  action: restart
- name: View and data recover before invoking the retained statement source
  sql: SELECT id,value FROM enforcement_accepted_view WHERE id=5
  expect:
    rows: 1
    data:
    - id: 5
      value: 55
- name: Recovered trigger executes its accepted source
  sql: INSERT enforcement_input VALUES(5,50); SELECT id,value FROM enforcement_audit WHERE id=5
  expect:
    rows: 1
    data:
    - id: 5
      value: 53
- name: Recovered pure foreign key authority retains actual enforcement and exact rows
  tds:
    statements:
    - sql: INSERT enforcement_fk_only VALUES(2,999)
      expect:
        error: true
    - sql: SELECT id,parent_id FROM enforcement_fk_view ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          parent_id: 1
    - sql: SELECT id,value FROM enforcement_other WHERE id=7
      expect:
        rows: 1
        data:
        - id: 7
          value: 77
- name: Abandoned enforcement and row changes retain the actual original owner
  steps:
  - session_id: enforcement-abandoned
    sql: BEGIN TRANSACTION
  - session_id: enforcement-abandoned
    sql: ALTER TRIGGER enforcement_hook ON enforcement_input AFTER INSERT AS INSERT enforcement_audit SELECT id,value+9
      AS value FROM inserted
  - session_id: enforcement-abandoned
    sql: CREATE VIEW enforcement_abandoned_view AS SELECT id,value FROM enforcement_other
  - session_id: enforcement-abandoned
    sql: INSERT enforcement_other VALUES(6,66)
  - session_id: enforcement-abandoned
    sql: SELECT id,value FROM enforcement_abandoned_view WHERE id=6
    expect:
      rows: 1
      data:
      - id: 6
        value: 66
- name: Crash before accepting enforcement and row participants
  scm: (crash)
  expect:
    interrupted_ok: true
- name: Restart without accepting the enforcement suffix
  action: restart
- name: Abandoned row and view are absent after recovery
  sql: SELECT id,value FROM enforcement_other WHERE id=6; SELECT name FROM sys.objects WHERE type=N'V' AND name=N'enforcement_abandoned_view'
  expect:
    rows: 0
    data: []
- name: Unaccepted trigger source does not replace the accepted program
  sql: INSERT enforcement_input VALUES(6,60); SELECT id,value FROM enforcement_audit WHERE id=6
  expect:
    rows: 1
    data:
    - id: 6
      value: 63
- name: Late new trigger reuses both staged constraint endpoints after view and row work
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE late_endpoint_commit ADD CONSTRAINT FK_late_endpoint_commit FOREIGN KEY(parent_id) REFERENCES
        late_endpoint_parent(id)
    - connection: owner
      sql: ALTER TABLE late_endpoint_commit ADD CONSTRAINT CK_late_endpoint_commit CHECK(value>=0)
    - connection: owner
      sql: CREATE VIEW late_endpoint_view AS SELECT id,parent_id,value FROM late_endpoint_commit
    - connection: owner
      sql: INSERT late_endpoint_other VALUES(101,11)
    - connection: owner
      sql: CREATE TRIGGER late_endpoint_new ON late_endpoint_commit AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+10 AS value FROM inserted
    - connection: observer
      sql: SELECT name FROM sys.objects WHERE name IN(N'late_endpoint_view',N'late_endpoint_new')
      expect:
        rows: 0
        data: []
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_other WHERE id=101
      expect:
        rows: 0
        data: []
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: INSERT late_endpoint_commit VALUES(101,1,2)
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_audit WHERE id=101
      expect:
        rows: 1
        data:
        - id: 101
          value: 12
    - connection: observer
      sql: SELECT id,parent_id,value FROM late_endpoint_view ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          parent_id: 1
          value: 1
        - id: 101
          parent_id: 1
          value: 2
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_other WHERE id=101
      expect:
        rows: 1
        data:
        - id: 101
          value: 11
- name: Full rollback restores the old trigger after a late protected replacement
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+20 AS value FROM inserted
    - connection: owner
      sql: CREATE VIEW late_endpoint_rollback_view AS SELECT id,value FROM late_endpoint_other
    - connection: owner
      sql: INSERT late_endpoint_other VALUES(201,21)
    - connection: owner
      sql: ALTER TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+30 AS value FROM inserted
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: observer
      sql: INSERT late_endpoint_rewrite VALUES(201,1,3)
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_audit WHERE id=201
      expect:
        rows: 1
        data:
        - id: 201
          value: 13
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_other WHERE id=201
      expect:
        rows: 0
        data: []
    - connection: observer
      sql: SELECT name FROM sys.objects WHERE name=N'late_endpoint_rollback_view'
      expect:
        rows: 0
        data: []
- name: Savepoint keeps the protected trigger prefix and discards its late replacement
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+20 AS value FROM inserted
    - connection: owner
      sql: INSERT late_endpoint_other VALUES(301,31)
    - connection: owner
      sql: SAVE TRANSACTION late_endpoint_before_suffix
    - connection: owner
      sql: CREATE VIEW late_endpoint_suffix_view AS SELECT id,value FROM late_endpoint_other
    - connection: owner
      sql: INSERT late_endpoint_other VALUES(302,32)
    - connection: owner
      sql: ALTER TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+30 AS value FROM inserted
    - connection: owner
      sql: ROLLBACK TRANSACTION late_endpoint_before_suffix
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: INSERT late_endpoint_rewrite VALUES(301,1,4)
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_audit WHERE id=301
      expect:
        rows: 1
        data:
        - id: 301
          value: 24
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_other WHERE id IN(301,302) ORDER BY id
      expect:
        rows: 1
        data:
        - id: 301
          value: 31
    - connection: observer
      sql: SELECT name FROM sys.objects WHERE name=N'late_endpoint_suffix_view'
      expect:
        rows: 0
        data: []
- name: Late CHECK consumes the already protected trigger endpoint and enforces committed rows
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+20 AS value FROM inserted
    - connection: owner
      sql: INSERT late_endpoint_other VALUES(401,41)
    - connection: owner
      sql: ALTER TABLE late_endpoint_rewrite ADD CONSTRAINT CK_late_endpoint_bound CHECK(value<=100)
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: INSERT late_endpoint_rewrite VALUES(401,1,5)
    - connection: observer
      sql: INSERT late_endpoint_rewrite VALUES(402,1,101)
      expect:
        error: true
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_audit WHERE id IN(401,402) ORDER BY id
      expect:
        rows: 1
        data:
        - id: 401
          value: 25
    - connection: observer
      sql: SELECT id,parent_id,value FROM late_endpoint_rewrite WHERE id IN(401,402) ORDER BY id
      expect:
        rows: 1
        data:
        - id: 401
          parent_id: 1
          value: 5
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_other WHERE id=401
      expect:
        rows: 1
        data:
        - id: 401
          value: 41
- name: Late foreign key consumes both endpoints already protected by this owner
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE late_endpoint_parent ADD CONSTRAINT CK_late_endpoint_parent CHECK(id>0)
    - connection: owner
      sql: ALTER TABLE late_endpoint_rewrite ADD CONSTRAINT CK_late_endpoint_child CHECK(id>0)
    - connection: owner
      sql: INSERT late_endpoint_other VALUES(501,51)
    - connection: owner
      sql: ALTER TABLE late_endpoint_rewrite ADD CONSTRAINT FK_late_endpoint_rewrite FOREIGN KEY(parent_id) REFERENCES
        late_endpoint_parent(id)
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: INSERT late_endpoint_rewrite VALUES(501,1,6)
    - connection: observer
      sql: INSERT late_endpoint_rewrite VALUES(502,999,6)
      expect:
        error: true
    - connection: observer
      sql: SELECT id,parent_id,value FROM late_endpoint_rewrite WHERE id IN(501,502) ORDER BY id
      expect:
        rows: 1
        data:
        - id: 501
          parent_id: 1
          value: 6
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_audit WHERE id IN(501,502) ORDER BY id
      expect:
        rows: 1
        data:
        - id: 501
          value: 26
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_other WHERE id=501
      expect:
        rows: 1
        data:
        - id: 501
          value: 51
- name: A late protected trigger replacement accepts the original row and view decision
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+40 AS value FROM inserted
    - connection: owner
      sql: CREATE VIEW late_endpoint_accepted_view AS SELECT id,value FROM late_endpoint_other
    - connection: owner
      sql: INSERT late_endpoint_other VALUES(601,61)
    - connection: owner
      sql: ALTER TRIGGER late_endpoint_old ON late_endpoint_rewrite AFTER INSERT AS INSERT late_endpoint_audit SELECT
        id,value+50 AS value FROM inserted
    - connection: owner
      sql: COMMIT TRANSACTION
- name: Crash after accepting a late protected trigger replacement
  scm: (crash)
  expect:
    interrupted_ok: true
- name: Restart the accepted late protected trigger decision
  action: restart
- name: Recovered late trigger executes its actual source with recovered rows and view
  tds:
    statements:
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_accepted_view WHERE id=601
      expect:
        rows: 1
        data:
        - id: 601
          value: 61
    - connection: observer
      sql: INSERT late_endpoint_rewrite VALUES(601,1,7)
    - connection: observer
      sql: SELECT id,value FROM late_endpoint_audit WHERE id=601
      expect:
        rows: 1
        data:
        - id: 601
          value: 57
    - connection: observer
      sql: SELECT id,parent_id,value FROM late_endpoint_rewrite WHERE id=601
      expect:
        rows: 1
        data:
        - id: 601
          parent_id: 1
          value: 7
cleanup:
- sql: DROP VIEW IF EXISTS enforcement_fk_view
- sql: DROP TABLE IF EXISTS enforcement_fk_only
- sql: DROP VIEW IF EXISTS enforcement_checked_view
- sql: DROP VIEW IF EXISTS enforcement_default_view
- sql: DROP VIEW IF EXISTS enforcement_accepted_view
- sql: DROP VIEW IF EXISTS enforcement_abandoned_view
- sql: DROP VIEW IF EXISTS enforcement_suffix
- sql: DROP VIEW IF EXISTS enforcement_view
- sql: DROP TABLE IF EXISTS enforcement_input
- sql: DROP TABLE IF EXISTS enforcement_audit
- sql: DROP TABLE IF EXISTS enforcement_other
- sql: DROP TABLE IF EXISTS enforcement_child
- sql: DROP TABLE IF EXISTS enforcement_parent
- sql: DROP TABLE IF EXISTS enforcement_defaults
- sql: DROP VIEW IF EXISTS late_endpoint_view
- sql: DROP VIEW IF EXISTS late_endpoint_rollback_view
- sql: DROP VIEW IF EXISTS late_endpoint_suffix_view
- sql: DROP VIEW IF EXISTS late_endpoint_accepted_view
- sql: DROP TABLE IF EXISTS late_endpoint_commit
- sql: DROP TABLE IF EXISTS late_endpoint_rewrite
- sql: DROP TABLE IF EXISTS late_endpoint_parent
- sql: DROP TABLE IF EXISTS late_endpoint_audit
- sql: DROP TABLE IF EXISTS late_endpoint_other
