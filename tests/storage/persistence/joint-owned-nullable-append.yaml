- name: Native retained target handles cannot combine append with their own whole-table retirement in either order
  scm: |
    (begin
      (define run (lambda (append_first) (begin
        (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
        (define tx (owner "__memcp_tx"))
        (define target (table "memcp-tests" false "joint_append_bare_target" false tx))
        (if append_first (createcolumn target "probe" "INT" (list) (list "null" true) nil nil tx)
          (droptable "memcp-tests" "joint_append_bare_target" false tx))
        (define rejected (try (lambda () (begin
          (if append_first (droptable "memcp-tests" "joint_append_bare_target" false tx)
            (createcolumn target "probe" "INT" (list) (list "null" true) nil nil tx)) false))
          (lambda (cause) (strlike (string (failure_value cause))
            (if append_first "%retirement of its endpoint%" "%nullable append requires a local committed native table%")))))
        (define state (tx_state tx))
        (define observed (scan nil target (list) (list) (list) (lambda () true) '("id" "value")
          (lambda (rows id value) (set_assoc rows id value)) (list) merge_assoc))
        (tx_rollback owner)
        (list rejected state (nil? (show target "column" "probe" false nil))
          (get_assoc observed 1) (get_assoc observed 2)))))
      (list (run true) (run false)))
  expect:
    result:
    - - true
      - active
      - true
      - 10
      - 20
    - - true
      - active
      - true
      - 10
      - 20
