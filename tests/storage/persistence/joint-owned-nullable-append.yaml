test_cases:
- name: Two unrelated replacement programs and a public nullable append publish one original decision
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: UPDATE joint_append_progress SET value=1 WHERE id=1
    - connection: owner
      sql: CREATE TABLE joint_append_commit_new_a(id INT PRIMARY KEY,value INT)
    - connection: owner
      sql: INSERT joint_append_commit_new_a SELECT id,value FROM joint_append_commit_old_a
    - connection: owner
      sql: UPDATE joint_append_commit_new_a SET value=111
    - connection: owner
      sql: DROP TABLE joint_append_commit_old_a
    - connection: owner
      sql: EXEC sp_rename N'joint_append_commit_new_a',N'joint_append_commit_old_a',N'OBJECT'
    - connection: owner
      sql: CREATE TABLE joint_append_commit_new_b(id INT PRIMARY KEY,value INT)
    - connection: owner
      sql: INSERT joint_append_commit_new_b SELECT id,value FROM joint_append_commit_old_b
    - connection: owner
      sql: UPDATE joint_append_commit_new_b SET value=222
    - connection: owner
      sql: DROP TABLE joint_append_commit_old_b
    - connection: owner
      sql: EXEC sp_rename N'joint_append_commit_new_b',N'joint_append_commit_old_b',N'OBJECT'
    - connection: owner
      sql: ALTER TABLE joint_append_commit_target ADD link UNIQUEIDENTIFIER NULL
    - connection: owner
      sql: SELECT id,value,CONVERT(VARCHAR(36),link) AS link FROM joint_append_commit_target ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          value: 10
          link: null
        - id: 2
          value: 20
          link: null
    - connection: owner
      sql: UPDATE joint_append_commit_target SET link=(SELECT token FROM joint_append_source WHERE joint_append_source.id=joint_append_commit_target.id)
        WHERE link IS NULL
    - connection: owner
      sql: INSERT joint_append_commit_target(id,value) VALUES(3,30)
    - connection: owner
      sql: INSERT joint_append_commit_target(id,value,link) VALUES(4,40,'00000000-0000-4000-8000-000000000002')
    - connection: owner
      sql: SELECT id,value,CONVERT(VARCHAR(36),link) AS link FROM joint_append_commit_target ORDER BY id
      expect:
        rows: 4
        data:
        - id: 1
          value: 10
          link: 00000000-0000-4000-8000-000000000001
        - id: 2
          value: 20
          link: null
        - id: 3
          value: 30
          link: null
        - id: 4
          value: 40
          link: 00000000-0000-4000-8000-000000000002
    - connection: observer
      sql: SELECT COL_LENGTH(N'joint_append_commit_target',N'link') AS width
      expect:
        rows: 1
        data:
        - width: null
    - connection: observer
      sql: SELECT id,value FROM joint_append_commit_old_a ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 11
    - connection: observer
      sql: SELECT id,value FROM joint_append_commit_old_b ORDER BY id
      expect:
        rows: 1
        data:
        - id: 2
          value: 22
    - connection: owner
      sql: SELECT value,@@TRANCOUNT AS depth FROM joint_append_progress
      expect:
        rows: 1
        data:
        - value: 1
          depth: 1
    - connection: observer
      sql: SELECT value FROM joint_append_progress
      expect:
        rows: 1
        data:
        - value: 0
    - connection: owner
      sql: COMMIT TRAN
    - connection: observer
      sql: SELECT id,value,CONVERT(VARCHAR(36),link) AS link FROM joint_append_commit_target ORDER BY id
      expect:
        rows: 4
        data:
        - id: 1
          value: 10
          link: 00000000-0000-4000-8000-000000000001
        - id: 2
          value: 20
          link: null
        - id: 3
          value: 30
          link: null
        - id: 4
          value: 40
          link: 00000000-0000-4000-8000-000000000002
    - connection: observer
      sql: SELECT id,value FROM joint_append_commit_old_a ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 111
    - connection: observer
      sql: SELECT id,value FROM joint_append_commit_old_b ORDER BY id
      expect:
        rows: 1
        data:
        - id: 2
          value: 222
    - connection: owner
      sql: SELECT default_object_id,CAST(is_nullable AS INT) AS nullable_flag FROM sys.columns WHERE object_id=OBJECT_ID(N'joint_append_commit_target')
        AND name=N'link'
      expect:
        rows: 1
        data:
        - default_object_id: 0
          nullable_flag: 1
