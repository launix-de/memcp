- name: A real generator failure drains and undoes the full ADD batch while retaining genuine prior private creation
  scm: |-
    (begin
     (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
     (define tx (owner "__memcp_tx"))
     (define target (table "memcp-tests" false "generated_joint_failure" false tx))
     (define calls (newsession)) (calls "n" 0)
     (define gate (mutex))
     (try (lambda () (begin
      (createtable "memcp-tests" "generated_joint_failure_created"
       (list (list "column" "id" "INT" '() '("null" false))) '("engine" "safe") false tx)
      (define created (table "memcp-tests" false "generated_joint_failure_created" false tx))
      (createkey created "generated_joint_failure_pk" true '("id") tx)
      (insert created '("id") (list (list 7)) '() nil false nil tx)
      (with_table_mutation (list target) (list "update" '("value")) tx owner (lambda (bound)
       (scan bound target '() '() '("id") (lambda (id) (equal? id 1)) '("$update")
        (lambda (n update) (begin (update '("value" 11)) (+ n 1))) 0 +)))
      (define failed (try (lambda () (createcolumns target
       (list (list "prefix" "INT" '() '("null" false "default" 7) nil)
        (list "token" "INT" '() '("null" false "default_expression" "1" "default_deferred" true)
         (lambda () (gate (lambda () (begin
          (define n (+ (calls "n") 1)) (calls "n" n)
          (if (equal? n 3) (error (list "tsql-error" 50001 "generator fixture" 1)) n))))))) tx))
        (lambda (cause) (equal? (failure_value cause) '("tsql-error" 50001 "generator fixture" 1)))))
      (define own (scan tx target '() '() '() (lambda () true) '("id" "value")
       (lambda (rows id value) (merge rows (list (list id value)))) '() merge))
      (define observed (scan nil target '() '() '() (lambda () true) '("id" "value")
       (lambda (rows id value) (merge rows (list (list id value)))) '() merge))
      (define absent (and (nil? (show target "column" "prefix" false tx)) (nil? (show target "column" "token" false tx))))
      (define created_rows (scan tx created '() '() '() (lambda () true) '("id")
       (lambda (items id) (merge items (list (list id)))) '() merge))
      (define created_absent (nil? (table "memcp-tests" false "generated_joint_failure_created" false nil)))
      (define state (tx_state tx)) (tx_commit owner)
      (define committed_created (scan nil (table "memcp-tests" false "generated_joint_failure_created" false nil) '() '() '() (lambda () true) '("id")
       (lambda (items id) (merge items (list (list id)))) '() merge))
      (list failed (calls "n") state absent (sort own (lambda (a b) (< (car a) (car b)))) (sort observed (lambda (a b) (< (car a) (car b)))) created_rows created_absent committed_created)))
      (lambda (cause) (begin (tx_rollback owner) (error cause)))))
  expect:
    result:
    - true
    - 3
    - active
    - true
    - *id004
    - *id005
    - - - 7
    - true
    - - - 7
