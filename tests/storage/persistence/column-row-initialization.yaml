     (define tx (owner "__memcp_tx"))
     (define target (table "memcp-tests" false "generated_native_masks" false tx))
     (define calls (newsession)) (calls "n" 0) (define gate (mutex))
     (try (lambda () (begin
      (with_table_mutation (list target) (list "update" '("value")) tx owner (lambda (bound)
       (scan bound target '() '() '("id") (lambda (id) (equal? id 1)) '("$update")
        (lambda (n update) (begin (update '("value" 11)) (+ n 1))) 0 +)))
      (with_table_mutation (list target) (list "delete" '()) tx owner (lambda (bound)
       (scan bound target '() '() '("id") (lambda (id) (equal? id 2)) '("$update")
        (lambda (n update) (begin (update) (+ n 1))) 0 +)))
      (with_table_mutation (list target) (list "insert" '()) tx owner (lambda (bound)
       (insert target '("id" "value") (list (list 4 40)) '() nil false nil bound)))
      (createcolumns target
       (list (list "token" "INT" '() '("null" false "default_expression" "1" "default_deferred" true)
        (lambda () (gate (lambda () (begin (define n (+ (calls "n") 1)) (calls "n" n) n)))))) tx)
      (define rows (scan tx target '() '() '() (lambda () true) '("id" "value" "token")
       (lambda (rows id value token) (merge rows (list (list id value token)))) '() merge))
      (define observer (scan nil target '() '() '() (lambda () true) '("id" "value")
       (lambda (rows id value) (merge rows (list (list id value)))) '() merge))
      (define same (identical? tx (owner "__memcp_tx")))
      (tx_commit owner)
      (list same (calls "n") (sort (map rows (lambda (row) (list (car row) (cadr row)))) (lambda (a b) (< (car a) (car b))))
       (sort (map rows (lambda (row) (nth row 2))) <) (sort observer (lambda (a b) (< (car a) (car b)))))))
      (lambda (cause) (begin (tx_rollback owner) (error cause)))))
  expect:
    result:
    - true
    - 3
