test_cases:
- name: Historical main delta and original-T rows receive distinct stable UUID values without DML trigger events
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE generated_history SET value=11 WHERE id=1
    - connection: owner
      sql: INSERT generated_history VALUES(7,70)
    - connection: owner
      sql: DELETE generated_history WHERE id=2
    - connection: owner
      sql: ALTER TABLE generated_history ADD token UNIQUEIDENTIFIER ROWGUIDCOL NOT NULL CONSTRAINT DF_generated_token DEFAULT NEWID()
    - connection: owner
      sql: SELECT id,value,CASE WHEN token IS NULL THEN 0 ELSE 1 END AS materialized FROM generated_history ORDER BY id
      expect:
        rows: 6
        data:
        - id: 1
          value: 11
          materialized: 1
        - id: 3
          value: 30
          materialized: 1
        - id: 4
          value: 40
          materialized: 1
        - id: 5
          value: 50
          materialized: 1
        - id: 6
          value: 60
          materialized: 1
        - id: 7
          value: 70
          materialized: 1
    - connection: owner
      sql: SELECT COUNT(*) AS n,COUNT(DISTINCT token) AS distinct_tokens FROM generated_history
      expect:
        rows: 1
        data:
        - n: 6
          distinct_tokens: 6
    - connection: owner
      sql: SELECT kind,n FROM generated_audit ORDER BY kind
      expect:
        rows: 3
        data:
        - kind: 1
          n: 1
        - kind: 2
          n: 1
        - kind: 3
          n: 1
    - connection: observer
      sql: SELECT id,value FROM generated_history ORDER BY id
      expect:
        rows: 6
        data:
        - id: 1
          value: 10
        - id: 2
          value: 20
        - id: 3
          value: 30
        - id: 4
          value: 40
        - id: 5
          value: 50
        - id: 6
          value: 60
    - connection: observer
      sql: SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(N'generated_history') AND name=N'token'
      expect:
        rows: 1
        data:
        - n: 0
    - connection: owner
      sql: INSERT generated_capture SELECT id,token FROM generated_history
    - connection: owner
      sql: COMMIT TRANSACTION
    - connection: observer
      sql: SELECT COUNT(*) AS n,COUNT(DISTINCT h.token) AS distinct_tokens FROM generated_history h JOIN generated_capture c ON h.id=c.id AND
        h.token=c.token
      expect:
        rows: 1
        data:
        - n: 6
          distinct_tokens: 6
- name: Fresh generated declaration exposes its actual default ordinal and row-guid marker
  sql: SELECT c.name,CAST(c.is_nullable AS INT) AS nullable,CAST(c.is_rowguidcol AS INT) AS row_guid,c.max_length,d.name AS default_name,d.parent_column_id
    FROM sys.columns c JOIN sys.default_constraints d ON d.parent_object_id=c.object_id AND d.parent_column_id=c.column_id WHERE c.object_id=OBJECT_ID(N'generated_history')
    AND c.name=N'token'
  expect:
    rows: 1
    data:
    - name: token
      nullable: 0
      row_guid: 1
      max_length: 16
      default_name: DF_generated_token
      parent_column_id: 3
- name: Later real UPDATE preserves realized UUIDs and invokes only its own transition event
  tds:
    statements:
    - connection: owner
      sql: UPDATE generated_history SET value=31 WHERE id=3
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM generated_history h JOIN generated_capture c ON h.id=c.id AND h.token=c.token
      expect:
        rows: 1
        data:
        - n: 6
    - connection: owner
      sql: SELECT kind,SUM(n) AS changed FROM generated_audit GROUP BY kind ORDER BY kind
      expect:
        rows: 3
        data:
        - kind: 1
          changed: 2
        - kind: 2
          changed: 1
        - kind: 3
          changed: 1
- name: Future INSERT evaluates the original generator per missing cell
  tds:
    statements:
    - connection: owner
      sql: INSERT generated_history(id,value) VALUES(8,80),(9,90)
    - connection: owner
      sql: SELECT id,value,CASE WHEN token IS NULL THEN 0 ELSE 1 END AS materialized FROM generated_history WHERE id>=8 ORDER BY id
      expect:
        rows: 2
        data:
        - id: 8
          value: 80
          materialized: 1
        - id: 9
          value: 90
          materialized: 1
    - connection: owner
      sql: SELECT COUNT(*) AS n,COUNT(DISTINCT token) AS distinct_tokens FROM generated_history
      expect:
        rows: 1
        data:
        - n: 8
          distinct_tokens: 8
    - connection: owner
      sql: INSERT generated_capture SELECT id,token FROM generated_history WHERE id>=8
- name: Explicit NULL assignment remains rejected without changing any realized historical value
  tds:
    statements:
    - connection: owner
      sql: UPDATE generated_history SET token=NULL WHERE id=1
      expect:
        error: true
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM generated_history h JOIN generated_capture c ON h.id=c.id AND h.token=c.token
      expect:
        rows: 1
        data:
        - n: 8
- name: Rollback restores complete pre-ADD rows and removes generated metadata
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE generated_rollback SET value=11 WHERE id=1
    - connection: owner
      sql: INSERT generated_rollback VALUES(4,40)
    - connection: owner
      sql: ALTER TABLE generated_rollback ADD token UNIQUEIDENTIFIER NOT NULL DEFAULT NEWID()
    - connection: owner
      sql: SELECT COUNT(*) AS n,COUNT(DISTINCT token) AS distinct_tokens FROM generated_rollback
      expect:
        rows: 1
        data:
        - n: 4
          distinct_tokens: 4
    - connection: observer
      sql: SELECT id,value FROM generated_rollback ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          value: 10
        - id: 2
          value: 20
        - id: 3
          value: 30
    - connection: owner
      sql: ROLLBACK TRANSACTION
    - connection: owner
      sql: SELECT id,value FROM generated_rollback ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          value: 10
        - id: 2
          value: 20
        - id: 3
          value: 30
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(N'generated_rollback') AND name=N'token'
      expect:
        rows: 1
        data:
        - n: 0
- name: Savepoint before ADD restores only its suffix then permits the same native column name again
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE generated_savepoint SET value=11 WHERE id=1
    - connection: owner
      sql: SAVE TRANSACTION generated_before_add
    - connection: owner
      sql: ALTER TABLE generated_savepoint ADD token UNIQUEIDENTIFIER NOT NULL DEFAULT NEWID()
    - connection: owner
      sql: UPDATE generated_savepoint SET value=21 WHERE id=2
    - connection: owner
      sql: ROLLBACK TRANSACTION generated_before_add
    - connection: owner
      sql: SELECT id,value FROM generated_savepoint ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          value: 11
        - id: 2
          value: 20
        - id: 3
          value: 30
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(N'generated_savepoint') AND name=N'token'
      expect:
        rows: 1
        data:
        - n: 0
    - connection: owner
      sql: ALTER TABLE generated_savepoint ADD token UNIQUEIDENTIFIER NOT NULL DEFAULT NEWID()
    - connection: owner
      sql: SELECT COUNT(*) AS n,COUNT(DISTINCT token) AS distinct_tokens FROM generated_savepoint
      expect:
        rows: 1
        data:
        - n: 3
          distinct_tokens: 3
    - connection: owner
      sql: COMMIT TRANSACTION
- name: Savepoint after ADD retains exact generated cells while removing later DML
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE generated_prefix ADD token UNIQUEIDENTIFIER NOT NULL DEFAULT NEWID()
    - connection: owner
      sql: INSERT generated_capture SELECT id+100,token FROM generated_prefix
    - connection: owner
      sql: SAVE TRANSACTION generated_after_add
    - connection: owner
      sql: UPDATE generated_prefix SET token=NEWID(),value=99 WHERE id=1
    - connection: owner
      sql: INSERT generated_prefix(id,value) VALUES(4,40)
    - connection: owner
      sql: ROLLBACK TRANSACTION generated_after_add
    - connection: owner
      sql: SELECT p.id,p.value,CASE WHEN p.token=c.token THEN 1 ELSE 0 END AS original_token FROM generated_prefix p JOIN generated_capture c
        ON c.id=p.id+100 ORDER BY p.id
      expect:
        rows: 3
        data:
        - id: 1
          value: 10
          original_token: 1
        - id: 2
          value: 20
          original_token: 1
        - id: 3
          value: 30
          original_token: 1
    - connection: owner
      sql: COMMIT TRANSACTION
- name: Nullable UUID default without WITH VALUES preserves historical NULL and only generates future cells
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE generated_nullable ADD token UNIQUEIDENTIFIER NULL DEFAULT NEWID()
    - connection: owner
      sql: SELECT id,value,token FROM generated_nullable ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          value: 10
          token: null
        - id: 2
          value: 20
          token: null
        - id: 3
          value: 30
          token: null
    - connection: owner
      sql: INSERT generated_nullable(id,value) VALUES(4,40)
    - connection: owner
      sql: SELECT COUNT(token) AS generated,COUNT(*) AS n FROM generated_nullable
      expect:
        rows: 1
        data:
        - generated: 1
          n: 4
    - connection: owner
      sql: COMMIT TRANSACTION
- name: Nullable WITH VALUES materializes a distinct UUID for every historical visible row
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
    - connection: owner
      sql: ALTER TABLE generated_values ADD token UNIQUEIDENTIFIER NULL DEFAULT NEWID() WITH VALUES
    - connection: owner
      sql: SELECT COUNT(*) AS n,COUNT(DISTINCT token) AS distinct_tokens FROM generated_values
      expect:
        rows: 1
        data:
        - n: 3
          distinct_tokens: 3
    - connection: owner
      sql: COMMIT TRANSACTION
- name: One implicit statement retains ordinary autocommit semantics for generated ADD
  tds:
    statements:
    - connection: owner
      sql: ALTER TABLE generated_auto ADD token UNIQUEIDENTIFIER NOT NULL DEFAULT NEWID()
    - connection: owner
      sql: SELECT COUNT(*) AS n,COUNT(DISTINCT token) AS distinct_tokens FROM generated_auto
      expect:
        rows: 1
        data:
        - n: 3
          distinct_tokens: 3
- name: A later column-name conflict restores the complete multi-ADD statement and preserves prior DML
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF; SET TRANSACTION ISOLATION LEVEL SERIALIZABLE; BEGIN TRANSACTION
    - connection: owner
      sql: UPDATE generated_batch SET value=11 WHERE id=1
    - connection: owner
      sql: BEGIN TRY ALTER TABLE generated_batch ADD prefix INT NOT NULL DEFAULT(7),token UNIQUEIDENTIFIER NOT NULL DEFAULT NEWID(),value INT
        NULL; SELECT 0 AS duplicate_column; END TRY BEGIN CATCH SELECT ERROR_NUMBER() AS duplicate_column; END CATCH
      expect:
        rows: 1
        data:
        - duplicate_column: 2705
    - connection: owner
      sql: SELECT XACT_STATE() AS state,@@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - state: 1
          depth: 1
    - connection: owner
      sql: SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(N'generated_batch') AND name IN(N'prefix',N'token')
      expect:
        rows: 1
        data:
        - n: 0
    - connection: owner
      sql: SELECT id,value FROM generated_batch ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          value: 11
        - id: 2
          value: 20
        - id: 3
          value: 30
    - connection: observer
      sql: SELECT id,value FROM generated_batch ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          value: 10
        - id: 2
          value: 20
        - id: 3
          value: 30
    - connection: owner
      sql: COMMIT TRANSACTION
- name: A real third-row generator exception restores all batch columns and retains its original committable prefix
  scm: |-
    (begin
     (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
     (define tx (owner "__memcp_tx"))
     (define target (table "memcp-tests" false "generated_failure" false tx))
     (define calls (newsession)) (calls "n" 0)
     (define gate (mutex))
     (try (lambda () (begin
      (with_table_mutation (list target) (list "update" '("value")) tx owner (lambda (bound)
       (scan bound target '() '() '("id") (lambda (id) (equal? id 1)) '("$update")
        (lambda (n update) (begin (update '("value" 11)) (+ n 1))) 0 +)))
      (define failed (try (lambda () (createcolumns target
       (list (list "prefix" "INT" '() '("null" false "default" 7) nil)
        (list "token" "INT" '() '("null" false "default_expression" "1" "default_deferred" true)
         (lambda () (gate (lambda () (begin
          (define n (+ (calls "n") 1)) (calls "n" n)
          (if (equal? n 3) (error (list "tsql-error" 50001 "generator fixture" 1)) n))))))) tx))
        (lambda (cause) (equal? (failure_value cause) '("tsql-error" 50001 "generator fixture" 1)))))
      (define own (scan tx target '() '() '() (lambda () true) '("id" "value")
       (lambda (rows id value) (merge rows (list (list id value)))) '() merge))
      (define observed (scan nil target '() '() '() (lambda () true) '("id" "value")
       (lambda (rows id value) (merge rows (list (list id value)))) '() merge))
      (define absent (and (nil? (show target "column" "prefix" false tx)) (nil? (show target "column" "token" false tx))))
      (define state (tx_state tx)) (tx_commit owner)
      (list failed (calls "n") state absent (sort own (lambda (a b) (< (car a) (car b)))) (sort observed (lambda (a b) (< (car a) (car b)))))))
      (lambda (cause) (begin (tx_rollback owner) (error cause)))))
  expect:
    result:
