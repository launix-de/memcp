metadata:
  isolated: true
  description: New native SQL tables persist complete empty column retirement history
setup:
- sql: DROP TABLE IF EXISTS column_history_fresh
- sql: CREATE TABLE column_history_fresh(id INT PRIMARY KEY,value INT)
- sql: INSERT INTO column_history_fresh VALUES(1,17)
cleanup:
- sql: DROP TABLE IF EXISTS column_history_fresh
test_cases:
- name: The SQL constructor persists known empty retirement history
  scm: |
    (begin
      (define stored (((json_decode (readfile (concat (arg "data" "data" "data")
        "/memcp-tests/schema.json"))) "tables") "column_history_fresh"))
      (define history (stored "dropped_columns"))
      (and (not (nil? history)) (equal? (json_encode history) "{}")))
  expect: {result: true}
- name: Restart the new table without changing its history provenance
  action: restart
- name: History remains known and empty after restart
  scm: |
    (begin
      (define stored (((json_decode (readfile (concat (arg "data" "data" "data")
        "/memcp-tests/schema.json"))) "tables") "column_history_fresh"))
      (define history (stored "dropped_columns"))
      (and (not (nil? history)) (equal? (json_encode history) "{}")))
  expect: {result: true}
- name: Stored values remain unchanged across the provenance round trip
  sql: SELECT id,value FROM column_history_fresh
  expect: {rows: 1,data: [{id: 1,value: 17}]}
