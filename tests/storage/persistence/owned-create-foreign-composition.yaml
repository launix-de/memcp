    - connection: owner
      sql: ALTER TABLE joint_source_child ADD CONSTRAINT joint_source_code UNIQUE(code)
    - connection: owner
      sql: ALTER TABLE joint_source_child ADD CONSTRAINT joint_source_reference FOREIGN KEY(parent_id) REFERENCES joint_existing(id)
    - connection: owner
      sql: INSERT joint_source_child VALUES(12,1,47)
    - connection: owner
      sql: EXEC joint_source
      expect:
        rows: 1
        data:
        - value: 37
    - connection: owner
      sql: COMMIT TRANSACTION
