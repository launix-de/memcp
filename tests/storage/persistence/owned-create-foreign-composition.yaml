- name: Failed first public FK validation preserves earlier private key undo and original rows
  scm: "(begin\n  (define owner (newsession)) (owner \"username\" \"root\") (tx_begin_acid owner)\n  (define tx (owner \"__memcp_tx\"))\n  (try\
    \ (lambda () (begin\n    (createtable \"memcp-tests\" \"joint_failed\" (list\n      (list \"column\" \"id\" \"INT\" (list) (list))\n     \
    \ (list \"column\" \"parent_id\" \"INT\" (list) (list))\n      (list \"column\" \"code\" \"INT\" (list) (list))) '(\"engine\" \"safe\") false\
    \ tx)\n    (define child (table \"memcp-tests\" false \"joint_failed\" false tx))\n    (define parent (table \"memcp-tests\" false \"joint_existing\"\
    \ false tx))\n    (define boundary (tx_savepoint tx))\n    (createkey child \"joint_failed_code\" true '(\"code\") tx)\n    (insert child\
    \ '(\"id\" \"parent_id\" \"code\") (list (list 1 999 7)) '() nil false nil tx)\n    (define rejected (try (lambda () (begin\n      (createforeignkey\
    \ child \"joint_failed_reference\" '(\"parent_id\") parent '(\"id\") \"restrict\" \"restrict\" tx)\n      false)) (lambda (failure) (strlike\
    \ (concat failure) \"%existing child row has no parent%\"))))\n    (define before (list rejected (tx_state tx) (count ((show child \"constraints\"\
    \ tx) \"Unique\"))\n      (scan tx child '() '() '() (lambda () true) '(\"parent_id\") + 0 +)))\n    (tx_rollback_to_savepoint tx boundary)\n\
    \    (insert child '(\"id\" \"parent_id\" \"code\") (list (list 2 1 7) (list 3 1 7)) '() nil false nil tx)\n    (define after (list (count\
    \ ((show child \"constraints\" tx) \"Unique\"))\n      (scan tx child '() '() '() (lambda () true) '(\"id\") + 0 +)\n      (scan tx child\
    \ '() '() '() (lambda () true) '(\"code\") + 0 +)\n      (count ((show child \"constraints\" tx) \"ForeignKeys\"))))\n    (tx_rollback owner)\n\
    \    (list before after (nil? (table \"memcp-tests\" false \"joint_failed\" false nil)))))\n    (lambda (failure) (begin (tx_rollback owner)\
    \ (error failure)))))"
  expect:
    result:
    - - true
      - active
      - 1
      - 999
    - - 0
      - 5
      - 14
      - 0
    - true
- name: Unaccepted original HTTP owner retains its private generation until crash
  session_id: joint-unaccepted-crash
  steps:
  - sql: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    session_id: joint-unaccepted-crash
  - sql: BEGIN TRANSACTION
    session_id: joint-unaccepted-crash
  - sql: CREATE TABLE joint_unaccepted(id INT NOT NULL PRIMARY KEY,parent_id INT)
    session_id: joint-unaccepted-crash
  - sql: ALTER TABLE joint_unaccepted ADD CONSTRAINT joint_unaccepted_reference FOREIGN KEY(parent_id) REFERENCES joint_existing(id)
    session_id: joint-unaccepted-crash
  - sql: INSERT joint_unaccepted VALUES(9,1)
    session_id: joint-unaccepted-crash
  - sql: SELECT id,parent_id FROM joint_unaccepted
    expect:
      rows: 1
      data:
      - id: 9
        parent_id: 1
    session_id: joint-unaccepted-crash
- name: Observer cannot see the still-active original owner before crash
