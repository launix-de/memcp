- name: A current committed violating row cannot hide behind an earlier original-T read
  scm: |-
    (begin
      (define owner (newsession)) (owner "username" "root") (tx_begin_acid owner)
      (define tx (owner "__memcp_tx"))
      (define target (table "memcp-tests" false "check_row_probe" false tx))
      (define marker (table "memcp-tests" false "check_row_marker" false tx))
      (define request (lambda (text body) (with_query_request owner nil 0 text "acid" (lambda (statement)
        (statement text false body (lambda (_cause _completion) "preserve"))))))
      (define write (lambda (handle columns values) (request "checked input insert" (lambda (input)
        (with_table_mutation (list handle) (list "insert" '()) input owner
          (lambda (bound) (insert handle columns values '() nil false nil bound)))))))
      (define rows (lambda (handle input fields) (sort (scan input handle '() '() '() (lambda () true) fields
        (lambda (acc id value) (append acc (list id value))) '() (lambda (left right) (merge (list left right))) false)
        (lambda (left right) (< (car left) (car right))))))
      (try (lambda () (begin
        (write marker '("id" "value") (list (list 2 7)))
        (define target (table "memcp-tests" false "check_row_unconstrained" false tx))
        (define before_read (rows target tx '("id" "v")))
        (insert target '("id" "v") (list (list 9 -9)) '() nil false nil nil)
        (define rejected (try (lambda () (begin
          (createcheck target "CK_check_row_current" "tsql-check" "v>=0" '("v") tx owner) false))
          (lambda (failure) (if (strlike (concat failure) "%check constraint CK_check_row_current failed%") true (error failure)))))
        (define before (list rejected before_read (tx_state tx) (rows target tx '("id" "v"))
          (count (coalesceNil ((show target "constraints" tx) "Checks") '()))))
        (tx_rollback owner)
        (list before (rows target nil '("id" "v")) (rows marker nil '("id" "value")))))
        (lambda (failure) (begin (tx_rollback owner) (error failure)))))
  expect:
    result:
    - - true
      - - - 1
          - 1
      - active
      - - - 1
          - 1
        - - 9
          - -9
      - 0
    - - - 1
        - 1
      - - 9
        - -9
    - - - 1
        - 3
- name: CHECK publication uses the admitted appended header and enforces its selected stored column
  tds:
    statements:
    - sql: DROP TABLE IF EXISTS check_row_appended
    - sql: CREATE TABLE check_row_appended(id INT PRIMARY KEY)
    - sql: BEGIN TRAN
    - sql: INSERT check_row_appended VALUES(1)
    - sql: ALTER TABLE check_row_appended ADD checked_v INT NULL DEFAULT(7)
    - sql: ALTER TABLE check_row_appended ADD CONSTRAINT CK_check_row_appended CHECK(checked_v IS NULL OR checked_v>=0)
    - sql: COMMIT TRAN
    - sql: SELECT id,checked_v FROM check_row_appended ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          checked_v: 7
    - sql: INSERT check_row_appended(id) VALUES(2)
    - sql: INSERT check_row_appended VALUES(3,-1)
      expect:
        error: true
        error_contains: CK_check_row_appended
    - sql: SELECT id,checked_v FROM check_row_appended ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          checked_v: 7
        - id: 2
          checked_v: 7
    - sql: DROP TABLE check_row_appended
- name: Repeated valid SQL replacement cycles retain their requested final data and CHECK recipe
  noncritical: true
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: UPDATE check_row_marker SET value=19 WHERE id=1
    - connection: owner
      sql: ALTER TABLE check_row_probe DROP CONSTRAINT CK_check_row_probe
    - connection: owner
      sql: INSERT check_row_probe VALUES(3,-7)
    - connection: owner
      sql: UPDATE check_row_probe SET v=7 WHERE id=3
    - connection: owner
      sql: ALTER TABLE check_row_probe ADD CONSTRAINT CK_check_row_probe CHECK(v>0)
    - connection: owner
      sql: ALTER TABLE check_row_probe DROP CONSTRAINT CK_check_row_probe
    - connection: owner
      sql: ALTER TABLE check_row_probe ADD CONSTRAINT CK_check_row_probe CHECK(v>=0)
    - connection: owner
      sql: COMMIT TRAN
    - connection: owner
      sql: SELECT id,v FROM check_row_probe ORDER BY id
      expect:
        rows: 3
        data:
        - id: 1
          v: 1
        - id: 2
          v: 2
        - id: 3
          v: 7
    - connection: owner
      sql: SELECT name,CAST(is_not_trusted AS INT) AS untrusted FROM sys.check_constraints WHERE name='CK_check_row_probe'
      expect:
        rows: 1
        data:
        - name: CK_check_row_probe
          untrusted: 0
