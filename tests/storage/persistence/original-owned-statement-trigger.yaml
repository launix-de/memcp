test_cases:
- name: Conditional dynamic trigger on an original constructor observes fresh rows and commits with both tables
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: CREATE TABLE owned_trigger_unused(id INT)
    - connection: owner
      sql: CREATE TABLE owned_trigger_commit(id INT PRIMARY KEY,value INT)
    - connection: owner
      sql: INSERT owned_trigger_commit VALUES(1,7)
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: COMMIT TRAN
    - connection: owner
      sql: SELECT @@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - depth: 1
    - connection: owner
      sql: IF OBJECT_ID(N'owned_trigger_commit_tr',N'TR') IS NULL EXEC sp_executesql N'CREATE TRIGGER owned_trigger_commit_tr ON owned_trigger_commit FOR
        UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value) SELECT 1,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id
        END'
    - connection: observer
      sql: SELECT OBJECT_ID(N'owned_trigger_commit',N'U') AS target,(SELECT COUNT(*) FROM sys.triggers WHERE name=N'owned_trigger_commit_tr') AS recipes
      expect:
        rows: 1
        data:
        - target: null
          recipes: 0
    - connection: owner
      sql: UPDATE owned_trigger_commit SET value=11
    - connection: owner
      sql: UPDATE owned_trigger_commit SET value=17
    - connection: owner
      sql: SELECT id,value FROM owned_trigger_commit ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 17
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=1 ORDER BY new_value,old_value
      expect:
        rows: 2
        data:
        - id: 1
          old_value: 7
          new_value: 11
        - id: 1
          old_value: 11
          new_value: 17
    - connection: owner
      sql: COMMIT TRAN
    - connection: observer
      sql: SELECT id,value FROM owned_trigger_commit ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 17
    - connection: observer
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=1 ORDER BY new_value,old_value
      expect:
        rows: 2
        data:
        - id: 1
          old_value: 7
          new_value: 11
        - id: 1
          old_value: 11
          new_value: 17
- name: Full rollback removes constructor trigger and its effects while restoring prior public work
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: UPDATE owned_trigger_public SET value=20
    - connection: owner
      sql: CREATE TABLE owned_trigger_rollback(id INT PRIMARY KEY,value INT)
    - connection: owner
      sql: INSERT owned_trigger_rollback VALUES(1,5)
    - connection: owner
      sql: CREATE TRIGGER owned_trigger_rollback_tr ON owned_trigger_rollback FOR UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value)
        SELECT 2,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id END
    - connection: owner
      sql: UPDATE owned_trigger_rollback SET value=6
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=2 ORDER BY new_value,old_value
      expect:
        rows: 1
        data:
        - id: 1
          old_value: 5
          new_value: 6
    - connection: owner
      sql: ROLLBACK TRAN
    - connection: owner
      sql: SELECT OBJECT_ID(N'owned_trigger_rollback',N'U') AS target,(SELECT COUNT(*) FROM sys.triggers WHERE name=N'owned_trigger_rollback_tr') AS recipes,@@TRANCOUNT
        AS depth
      expect:
        rows: 1
        data:
        - target: null
          recipes: 0
          depth: 0
    - connection: owner
      sql: SELECT id,value FROM owned_trigger_public ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 10
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=2 ORDER BY new_value,old_value
      expect:
        rows: 0
        data: []
- name: A savepoint retains its constructor while rewinding and retrying the exact trigger name
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: CREATE TABLE owned_trigger_rewind(id INT PRIMARY KEY,value INT)
    - connection: owner
      sql: INSERT owned_trigger_rewind VALUES(1,30)
    - connection: owner
      sql: SAVE TRAN before_trigger
    - connection: owner
      sql: CREATE TRIGGER owned_trigger_rewind_tr ON owned_trigger_rewind FOR UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value) SELECT
        3,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id END
    - connection: owner
      sql: UPDATE owned_trigger_rewind SET value=40
    - connection: owner
      sql: ROLLBACK TRAN before_trigger
    - connection: owner
      sql: SELECT id,value FROM owned_trigger_rewind ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 30
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=3 ORDER BY new_value,old_value
      expect:
        rows: 0
        data: []
    - connection: owner
      sql: SELECT COUNT(*) AS recipes FROM sys.triggers WHERE name=N'owned_trigger_rewind_tr'
      expect:
        rows: 1
        data:
        - recipes: 0
    - connection: owner
      sql: UPDATE owned_trigger_rewind SET value=31
    - connection: owner
      sql: CREATE TRIGGER owned_trigger_rewind_tr ON owned_trigger_rewind FOR UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value) SELECT
        4,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id END
    - connection: owner
      sql: UPDATE owned_trigger_rewind SET value=42
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=4 ORDER BY new_value,old_value
      expect:
        rows: 1
        data:
        - id: 1
          old_value: 31
          new_value: 42
    - connection: owner
      sql: COMMIT TRAN
    - connection: observer
      sql: SELECT id,value FROM owned_trigger_rewind ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 42
