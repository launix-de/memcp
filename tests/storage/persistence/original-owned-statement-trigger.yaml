- name: Table retirement before an original constructor trigger retains its unsupported profile without aborting the prefix
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: CREATE TABLE owned_trigger_drop_before(id INT PRIMARY KEY,value INT)
    - connection: owner
      sql: INSERT owned_trigger_drop_before VALUES(1,70)
    - connection: owner
      sql: DROP TABLE owned_trigger_retire_before
    - connection: owner
      sql: CREATE TRIGGER owned_trigger_drop_before_tr ON owned_trigger_drop_before FOR UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value)
        SELECT 11,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id END
      expect:
        error: true
        contains:
        - table removal phase admits only default or source declarations
    - connection: owner
      sql: SELECT id,value FROM owned_trigger_drop_before ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 70
    - connection: owner
      sql: SELECT @@TRANCOUNT AS depth
      expect:
        rows: 1
        data:
        - depth: 1
    - connection: observer
      sql: SELECT id,value FROM owned_trigger_retire_before ORDER BY id
      expect:
        rows: 1
        data:
        - id: 7
          value: 70
    - connection: owner
      sql: ROLLBACK TRAN
    - connection: owner
      sql: SELECT OBJECT_ID(N'owned_trigger_drop_before',N'U') AS target
      expect:
        rows: 1
        data:
        - target: null
    - connection: owner
      sql: SELECT id,value FROM owned_trigger_retire_before ORDER BY id
      expect:
        rows: 1
        data:
        - id: 7
          value: 70
