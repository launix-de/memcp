- name: Original constructor trigger ALTER state and deletion rewind to the exact earlier source
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: CREATE TABLE owned_trigger_state(id INT PRIMARY KEY,value INT)
    - connection: owner
      sql: INSERT owned_trigger_state VALUES(1,1)
    - connection: owner
      sql: CREATE TRIGGER owned_trigger_state_tr ON owned_trigger_state FOR UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value) SELECT
        8,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id END
    - connection: owner
      sql: UPDATE owned_trigger_state SET value=2
    - connection: owner
      sql: SAVE TRAN before_alter
    - connection: owner
      sql: ALTER TRIGGER owned_trigger_state_tr ON owned_trigger_state FOR UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value) SELECT
        9,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id END
    - connection: owner
      sql: DISABLE TRIGGER owned_trigger_state_tr ON owned_trigger_state
    - connection: owner
      sql: UPDATE owned_trigger_state SET value=3
    - connection: owner
      sql: ENABLE TRIGGER owned_trigger_state_tr ON owned_trigger_state
    - connection: owner
      sql: UPDATE owned_trigger_state SET value=4
    - connection: owner
      sql: DROP TRIGGER owned_trigger_state_tr
    - connection: owner
      sql: UPDATE owned_trigger_state SET value=5
    - connection: owner
      sql: ROLLBACK TRAN before_alter
    - connection: owner
      sql: SELECT id,value FROM owned_trigger_state ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 2
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=9 ORDER BY new_value,old_value
      expect:
        rows: 0
        data: []
    - connection: owner
      sql: UPDATE owned_trigger_state SET value=6
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=8 ORDER BY new_value,old_value
      expect:
        rows: 2
        data:
        - id: 1
          old_value: 1
          new_value: 2
        - id: 1
          old_value: 2
          new_value: 6
    - connection: owner
      sql: COMMIT TRAN
    - connection: observer
      sql: SELECT id,value FROM owned_trigger_state ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          value: 6
