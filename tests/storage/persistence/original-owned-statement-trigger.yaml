- name: An original trigger then unrelated public key and owned foreign declaration share one accepted decision
  tds:
    statements:
    - connection: owner
      sql: SET XACT_ABORT OFF
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: CREATE TABLE owned_trigger_fk_child(id INT PRIMARY KEY,parent_id INT,value INT)
    - connection: owner
      sql: INSERT owned_trigger_fk_child VALUES(1,1,10)
    - connection: owner
      sql: CREATE TRIGGER owned_trigger_fk_tr ON owned_trigger_fk_child FOR UPDATE AS BEGIN INSERT owned_trigger_audit(phase,id,old_value,new_value) SELECT
        40,i.id,d.value,i.value FROM inserted i JOIN deleted d ON d.id=i.id END
    - connection: owner
      sql: ALTER TABLE owned_trigger_key_target ADD CONSTRAINT owned_trigger_key_pk PRIMARY KEY(id)
    - connection: owner
      sql: ALTER TABLE owned_trigger_fk_child ADD CONSTRAINT owned_trigger_fk FOREIGN KEY(parent_id) REFERENCES owned_trigger_parent(id)
    - connection: owner
      sql: UPDATE owned_trigger_fk_child SET value=11
    - connection: owner
      sql: UPDATE owned_trigger_fk_child SET parent_id=999,value=120
      expect:
        error: true
        contains:
        - owned_trigger_fk
    - connection: owner
      sql: SELECT id,parent_id,value FROM owned_trigger_fk_child ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          parent_id: 1
          value: 11
    - connection: owner
      sql: SELECT id,old_value,new_value FROM owned_trigger_audit WHERE phase=40 ORDER BY new_value,old_value
      expect:
        rows: 1
        data:
        - id: 1
          old_value: 10
          new_value: 11
    - connection: observer
      sql: SELECT OBJECT_ID(N'owned_trigger_fk_child',N'U') AS target,(SELECT COUNT(*) FROM sys.key_constraints WHERE name=N'owned_trigger_key_pk') AS key_count
      expect:
        rows: 1
        data:
        - target: null
          key_count: 0
    - connection: owner
      sql: COMMIT TRAN
    - connection: observer
      sql: SELECT id,parent_id,value FROM owned_trigger_fk_child ORDER BY id
      expect:
        rows: 1
        data:
        - id: 1
          parent_id: 1
          value: 11
    - connection: owner
      sql: SELECT is_disabled,is_not_trusted FROM sys.foreign_keys WHERE name=N'owned_trigger_fk'
      expect:
        rows: 1
        data:
        - is_disabled: false
          is_not_trusted: false
