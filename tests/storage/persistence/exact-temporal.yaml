# Fixture preparation and cleanup are explicit cases so unsupported DDL stays visible.
metadata:
  version: '1.0'
  description: Exact temporal SQL values survive WAL replay, compression, updates and clean restart
  syntax: tsql
  isolated: true
setup: []
test_cases:
- sql: DROP TABLE IF EXISTS tsql_clock_recovery
  name: 'Fixture setup 001: DROP TABLE IF EXISTS tsql_clock_recovery'
- sql: CREATE TABLE tsql_clock_recovery (id INT PRIMARY KEY,d2 DATETIME2(7),dt DATETIME,tm TIME(7))
  name: 'Fixture setup 002: CREATE TABLE tsql_clock_recovery (id INT PRIMARY KEY,d2 DATETIME2(7),dt DATETIME,tm
    TIME(7))'
- sql: INSERT INTO tsql_clock_recovery VALUES (1,N'2026-03-15 12:13:14.1234567',N'2026-03-15 12:13:14.003',N'12:13:14.1234567'),(2,N'2026-03-15
    12:13:14.1234568',N'2026-03-15 12:13:14.007',N'12:13:14.1234568'),(3,NULL,NULL,NULL)
  name: 'Fixture setup 003: INSERT INTO tsql_clock_recovery VALUES (1,N''2026-03-15 12:13:14.1234567'',N''2026-03-15
    12:13:14.003'','
- name: Fractional columns before recovery
  sql: SELECT id,CONVERT(VARCHAR(40),d2,121) AS d2,CONVERT(VARCHAR(40),dt,121) AS dt,CAST(tm AS VARCHAR(40)) AS
    tm FROM tsql_clock_recovery ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      d2: '2026-03-15 12:13:14.1234567'
      dt: '2026-03-15 12:13:14.003'
      tm: '12:13:14.1234567'
    - id: 2
      d2: '2026-03-15 12:13:14.1234568'
      dt: '2026-03-15 12:13:14.007'
      tm: '12:13:14.1234568'
    - id: 3
      d2: null
      dt: null
      tm: null
  noncritical: true
- name: Crash with exact clock deltas
  scm: (crash)
  expect:
    interrupted_ok: true
- name: Restart exact clock WAL
  action: restart
- name: Fractional columns after WAL replay
  sql: SELECT id,CONVERT(VARCHAR(40),d2,121) AS d2,CONVERT(VARCHAR(40),dt,121) AS dt,CAST(tm AS VARCHAR(40)) AS
    tm FROM tsql_clock_recovery ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      d2: '2026-03-15 12:13:14.1234567'
      dt: '2026-03-15 12:13:14.003'
      tm: '12:13:14.1234567'
    - id: 2
      d2: '2026-03-15 12:13:14.1234568'
      dt: '2026-03-15 12:13:14.007'
      tm: '12:13:14.1234568'
    - id: 3
      d2: null
      dt: null
      tm: null
  noncritical: true
- name: Force exact clock compression
  scm: (rebuild (table "memcp-tests" false "tsql_clock_recovery" false nil) true false)
- name: Publish exact clock column files
  syntax: mysql
  sql: SHUTDOWN
- name: Fractional columns after compressed restart
  sql: SELECT id,CONVERT(VARCHAR(40),d2,121) AS d2,CONVERT(VARCHAR(40),dt,121) AS dt,CAST(tm AS VARCHAR(40)) AS
    tm FROM tsql_clock_recovery ORDER BY id
  expect:
    rows: 3
    data:
    - id: 1
      d2: '2026-03-15 12:13:14.1234567'
      dt: '2026-03-15 12:13:14.003'
      tm: '12:13:14.1234567'
    - id: 2
      d2: '2026-03-15 12:13:14.1234568'
      dt: '2026-03-15 12:13:14.007'
      tm: '12:13:14.1234568'
    - id: 3
      d2: null
      dt: null
      tm: null
  noncritical: true
- name: Update retains one 100ns tick
  sql: UPDATE tsql_clock_recovery SET d2=DATEADD(nanosecond,100,d2) WHERE id=1
  noncritical: true
- name: Updated exact clock result
  sql: SELECT CAST(d2 AS VARCHAR(40)) AS value FROM tsql_clock_recovery WHERE id=1
  expect:
    rows: 1
    data:
    - value: '2026-03-15 12:13:14.1234568'
  noncritical: true
- name: Reject excess fractional precision after replay
  sql: UPDATE tsql_clock_recovery SET d2=N'2026-03-15 12:13:14.12345678' WHERE id=1
  expect:
    error: true
  noncritical: true
- name: Crash with updated clock WAL
  scm: (crash)
  expect:
    interrupted_ok: true
- name: Restart updated exact clock WAL
  action: restart
- name: Updated exact clock survives crash
  sql: SELECT CAST(d2 AS VARCHAR(40)) AS value FROM tsql_clock_recovery WHERE id=1
  expect:
    rows: 1
    data:
    - value: '2026-03-15 12:13:14.1234568'
  noncritical: true
- name: Join exact clocks after replay
  sql: SELECT COUNT(*) AS value FROM tsql_clock_recovery a JOIN tsql_clock_recovery b ON a.d2=b.d2
  expect:
    rows: 1
    data:
    - value: 4
  noncritical: true
- sql: DROP TABLE IF EXISTS tsql_clock_recovery
  name: 'Fixture cleanup 001: DROP TABLE IF EXISTS tsql_clock_recovery'
- name: Create native precise calendar fixture
  syntax: mysql
  sql: CREATE TABLE native_precise_clock(id INT PRIMARY KEY,value DATETIME)
- name: Insert distinct nanoseconds and a nullable calendar
  syntax: mysql
  sql: INSERT INTO native_precise_clock VALUES(1,'2026-03-15 12:13:14.1234567'),(2,'2026-03-15 12:13:14.1234568'),(3,NULL)
- name: Native precise delta values
  syntax: mysql
  sql: SELECT id,value FROM native_precise_clock ORDER BY id
  expect:
    data:
    - {id: 1, value: '2026-03-15 12:13:14.1234567'}
    - {id: 2, value: '2026-03-15 12:13:14.1234568'}
    - {id: 3, value: null}
- name: Crash native precise calendar deltas
  scm: (crash)
  expect: {interrupted_ok: true}
- name: Recover native precise calendar deltas
  action: restart
- name: Native precise values after WAL replay
  syntax: mysql
  sql: SELECT id,value FROM native_precise_clock ORDER BY id
  expect:
    data:
    - {id: 1, value: '2026-03-15 12:13:14.1234567'}
    - {id: 2, value: '2026-03-15 12:13:14.1234568'}
    - {id: 3, value: null}
- name: A calendar update retains recovered subsecond values
  syntax: mysql
  sql: UPDATE native_precise_clock SET value=DATE_ADD(value,INTERVAL 0 SECOND)
- name: Compress native precise calendar columns
  scm: (rebuild (table "memcp-tests" false "native_precise_clock" false nil) true false)
- name: Persist native precise calendar columns
  syntax: mysql
  sql: SHUTDOWN
- name: Native precise values after column compression
  syntax: mysql
  sql: SELECT id,value FROM native_precise_clock ORDER BY id
  expect:
    data:
    - {id: 1, value: '2026-03-15 12:13:14.1234567'}
    - {id: 2, value: '2026-03-15 12:13:14.1234568'}
    - {id: 3, value: null}
- name: Compressed precise calendar join retains distinct nanoseconds
  syntax: mysql
  sql: SELECT COUNT(*) AS count FROM native_precise_clock a JOIN native_precise_clock b ON a.value=b.value
  expect: {data: [{count: 2}]}
- name: Drop native precise calendar fixture
  syntax: mysql
  sql: DROP TABLE native_precise_clock
- name: Create opaque JSON collision fixture beside precise calendars
  syntax: mysql
  sql: CREATE TABLE precise_json_collision(id INT PRIMARY KEY,payload JSON,stamp DATETIME)
- name: Store JSON fields that resemble reserved native scalar encodings
  syntax: mysql
  sql: >-
    INSERT INTO precise_json_collision VALUES
    (1,'{"scmer_date_v1":[0,100,0]}','2026-03-15 12:13:14.1234567'),
    (2,'{"scmer_bson_v1":[3,"AA=="]}','2026-03-15 12:13:14.1234568'),
    (3,'{"nested":{"scmer_date_v1":[0,100,0]}}',NULL)
- name: Crash opaque JSON and precise calendar deltas
  scm: (crash)
  expect: {interrupted_ok: true}
- name: Recover opaque JSON and precise calendar deltas
  action: restart
- name: Versioned WAL retains opaque JSON marker keys and native clocks
  syntax: mysql
  sql: SELECT id,payload,stamp FROM precise_json_collision ORDER BY id
  expect:
    data:
    - {id: 1, payload: {scmer_date_v1: [0,100,0]}, stamp: '2026-03-15 12:13:14.1234567'}
    - {id: 2, payload: {scmer_bson_v1: [3,'AA==']}, stamp: '2026-03-15 12:13:14.1234568'}
    - {id: 3, payload: {nested: {scmer_date_v1: [0,100,0]}}, stamp: null}
- name: Rebuild opaque JSON and calendar columns
  scm: (rebuild (table "memcp-tests" false "precise_json_collision" false nil) true false)
- name: Persist opaque JSON and calendar columns
  syntax: mysql
  sql: SHUTDOWN
- name: Scalar column formats retain JSON keys and precise clocks
  syntax: mysql
  sql: SELECT id,payload,stamp FROM precise_json_collision ORDER BY id
  expect:
    data:
    - {id: 1, payload: {scmer_date_v1: [0,100,0]}, stamp: '2026-03-15 12:13:14.1234567'}
    - {id: 2, payload: {scmer_bson_v1: [3,'AA==']}, stamp: '2026-03-15 12:13:14.1234568'}
    - {id: 3, payload: {nested: {scmer_date_v1: [0,100,0]}}, stamp: null}
- name: Drop opaque JSON collision fixture
  syntax: mysql
  sql: DROP TABLE precise_json_collision
cleanup: []
