- name: Future national assignment accepts a whole surrogate pair at the exact UTF16 boundary
  sql: INSERT projection_characters(id,first_name) VALUES(3,REPLICATE(N'A',33)+N'😀'); SELECT id,first_name FROM
    projection_characters WHERE id=3
  expect:
    rows: 1
    data:
    - id: 3
      first_name: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA😀
- name: Future national assignment rejects values exceeding UTF16 width
  sql: INSERT projection_characters(id,first_name) VALUES(4,REPLICATE(N'A',34)+N'😀')
  expect:
    error: true
