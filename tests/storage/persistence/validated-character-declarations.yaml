metadata:
  syntax: tsql
  isolated: true
  requires_tds: true
  description: Guarded value projections validate character declarations in their original native transaction
setup:
- sql: DROP TABLE IF EXISTS projection_nondefault
- sql: DROP TABLE IF EXISTS projection_bound_default
- sql: DROP TABLE IF EXISTS projection_characters
- sql: DROP TABLE IF EXISTS projection_text_a
- sql: DROP TABLE IF EXISTS projection_text_b
- sql: DROP TABLE IF EXISTS projection_marker
- sql: DROP TABLE IF EXISTS projection_constants
- sql: DROP TABLE IF EXISTS projection_loss
- sql: CREATE TABLE projection_characters(id INT PRIMARY KEY,first_name VARCHAR(35) NULL,last_name VARCHAR(35) NULL,street
    VARCHAR(50) NULL,birth_name VARCHAR(35) NULL,birth_place VARCHAR(35) NULL,mailbox VARCHAR(35) NULL,city VARCHAR(35)
    NULL)
- sql: CREATE TABLE projection_text_a(id INT PRIMARY KEY,payload TEXT NULL)
- sql: CREATE TABLE projection_text_b(id INT PRIMARY KEY,payload TEXT NULL)
- sql: CREATE TABLE projection_marker(id INT PRIMARY KEY,value INT)
- sql: CREATE TABLE projection_constants(value VARCHAR(2) NULL)
- sql: CREATE TABLE projection_loss(value VARCHAR(2) NULL)
- sql: INSERT projection_characters VALUES(1,'Müller €','Doe','Am Markt 1','Müller','Zürich','001','Berlin'),(2,NULL,NULL,NULL,NULL,NULL,NULL,NULL)
- sql: INSERT projection_marker VALUES(1,0)
- sql: INSERT projection_text_a VALUES(1,REPLICATE(CAST('x' AS VARCHAR(MAX)),9001)+'€'),(2,NULL)
- sql: INSERT projection_text_b VALUES(1,'Ä €'),(2,NULL)
- sql: CREATE TABLE projection_bound_default(value VARCHAR(10) NULL CONSTRAINT DF_projection_bound_default DEFAULT
    NULL)
- sql: CREATE TABLE projection_nondefault(value VARCHAR(10) COLLATE latin1_general_ci NULL)
test_cases:
- name: Seven national text changes preserve original transaction savepoint values and observer metadata
  tds:
    statements:
    - connection: owner
      sql: BEGIN TRAN
    - connection: owner
      sql: UPDATE projection_marker SET value=9 WHERE id=1
    - connection: owner
      sql: SAVE TRAN before_characters
    - connection: owner
      sql: ALTER TABLE projection_characters ALTER COLUMN first_name NVARCHAR(35) NULL
    - connection: owner
      sql: ALTER TABLE projection_characters ALTER COLUMN last_name NVARCHAR(35) NULL
    - connection: owner
      sql: ALTER TABLE projection_characters ALTER COLUMN street NVARCHAR(50) NULL
    - connection: owner
      sql: ALTER TABLE projection_characters ALTER COLUMN birth_name NVARCHAR(35) NULL
    - connection: owner
      sql: ALTER TABLE projection_characters ALTER COLUMN birth_place NVARCHAR(35) NULL
    - connection: owner
      sql: ALTER TABLE projection_characters ALTER COLUMN mailbox NVARCHAR(35) NULL
    - connection: owner
      sql: ALTER TABLE projection_characters ALTER COLUMN city NVARCHAR(35) NULL
    - connection: owner
      sql: UPDATE projection_marker SET value=10 WHERE id=1
    - connection: owner
      sql: SELECT max_length,is_nullable FROM sys.columns WHERE object_id=OBJECT_ID(N'projection_characters') AND
        name=N'first_name'
      expect:
        rows: 1
        data:
        - max_length: 70
          is_nullable: true
    - connection: owner
      sql: SELECT TOP 0 first_name AS observed FROM projection_characters
      expect:
        rows: 0
        column_types:
        - name: observed
          type: NVARCHAR
          nullable: true
    - connection: owner
      sql: SELECT id,first_name,last_name,street,birth_name,birth_place,mailbox,city FROM projection_characters
        ORDER BY id
      expect:
        rows: 2
        data:
        - id: 1
          first_name: Müller €
          last_name: Doe
          street: Am Markt 1
          birth_name: Müller
          birth_place: Zürich
          mailbox: '001'
          city: Berlin
        - id: 2
          first_name: null
          last_name: null
          street: null
          birth_name: null
          birth_place: null
          mailbox: null
          city: null
    - connection: observer
      sql: SELECT max_length,is_nullable FROM sys.columns WHERE object_id=OBJECT_ID(N'projection_characters') AND
        name=N'first_name'
      expect:
        rows: 1
        data:
        - max_length: 35
          is_nullable: true
    - connection: observer
      sql: SELECT TOP 0 first_name AS observed FROM projection_characters
      expect:
        rows: 0
        column_types:
        - name: observed
          type: VARCHAR
          nullable: true
    - connection: owner
      sql: ROLLBACK TRAN before_characters
    - connection: owner
      sql: SELECT TOP 0 first_name AS observed FROM projection_characters
      expect:
        rows: 0
        column_types:
        - name: observed
          type: VARCHAR
          nullable: true
    - connection: owner
      sql: SELECT value,@@TRANCOUNT AS depth FROM projection_marker WHERE id=1
      expect:
        rows: 1
        data:
        - value: 9
          depth: 1
    - connection: owner
      sql: ROLLBACK TRAN
    - connection: observer
      sql: SELECT value FROM projection_marker WHERE id=1
      expect:
        rows: 1
        data:
        - value: 0
