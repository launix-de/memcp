- name: Native projection rejects invalid UTF16 extent before effects without losing original rows or transaction
  scm: |-
    (begin
     (define owner (newsession)) (owner "username" "root")
     (tx_begin_acid owner) (define tx (owner "__memcp_tx"))
     (define target (table "memcp-tests" false "projection_loss" false tx))
     (insert target '("value") (list (list "😀😀")) '() nil false nil tx)
     (define previous (show target "column" "value" true tx))
     (define collation (coalesceNil (previous "Collation") ""))
     (define before (list "VARCHAR" '(2) true collation))
     (define projection (lambda (value) (if (or (nil? value) (<= (utf16_length value) 2)) value (error "value exceeds projection domain"))))
     (define rejected (try (lambda () (begin
      (altercolumn target "value" "validated_declaration" (list (list "NVARCHAR" '(2) true collation) before projection) tx)
      false)) (lambda (cause) (if (strlike (string (failure_value cause)) "%value exceeds projection domain%") true (error cause)))))
     (define current (show target "column" "value" true tx))
     (define local_count (scan tx target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +))
     (define active (equal? (tx_state tx) "active"))
     (tx_rollback owner)
     (and rejected active (equal? (current "RawType") "VARCHAR") (equal? local_count 1)
      (equal? (scan nil target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +) 0)))
  expect:
    result: true
- name: Native projection cannot replace a value while claiming unchanged storage
  scm: |-
    (begin
     (define owner (newsession)) (owner "username" "root")
     (tx_begin_acid owner) (define tx (owner "__memcp_tx"))
     (define target (table "memcp-tests" false "projection_loss" false tx))
     (insert target '("value") (list (list "😀😀")) '() nil false nil tx)
     (define previous (show target "column" "value" true tx))
     (define collation (coalesceNil (previous "Collation") ""))
     (define before (list "VARCHAR" '(2) true collation))
     (define projection (lambda (value) (if (nil? value) value "changed")))
     (define rejected (try (lambda () (begin
      (altercolumn target "value" "validated_declaration" (list (list "NVARCHAR" '(2) true collation) before projection) tx)
      false)) (lambda (cause) (if (strlike (string (failure_value cause)) "%column value projection would convert an existing native value%") true (error cause)))))
     (define current (show target "column" "value" true tx))
     (define local_count (scan tx target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +))
     (define active (equal? (tx_state tx) "active"))
     (tx_rollback owner)
     (and rejected active (equal? (current "RawType") "VARCHAR") (equal? local_count 1)
      (equal? (scan nil target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +) 0)))
  expect:
    result: true
- name: National projection counts supplementary characters as two units
  scm: (begin (define p (tsql_column_value_projection (list "Default" nil "DefaultName" "" "DefaultExpression" "")
    "NVARCHAR" '(2) "utf8mb4_general_ci")) (equal? (p "😀") "😀"))
  expect:
    result: true
- name: ANSI projection retains representable accents and euro sign
  scm: (begin (define p (tsql_column_value_projection (list "Default" nil "DefaultName" "" "DefaultExpression" "")
    "VARCHAR" '(-1) "utf8mb4_general_ci")) (equal? (p "Ä €") "Ä €"))
  expect:
    result: true
- name: Native domain proof examines unmaterialized literal defaults before accepting a new descriptor
  scm: |-
    (begin
     (define target (table "memcp-tests" false "projection_constants"))
     (altercolumn target "value" "default" "😀😀")
     (define owner (newsession)) (owner "username" "root")
     (tx_begin_acid owner) (define tx (owner "__memcp_tx"))
     (define previous (show target "column" "value" true tx))
     (define collation (coalesceNil (previous "Collation") ""))
     (define projection (lambda (value) (if (or (nil? value) (<= (utf16_length value) 2)) value (error "constant exceeds projection domain"))))
     (define rejected (try (lambda () (begin
      (altercolumn target "value" "validated_declaration"
       (list (list "NVARCHAR" '(2) true collation) (list "VARCHAR" '(2) true collation) projection) tx)
      false)) (lambda (cause) (if (strlike (string (failure_value cause)) "%constant exceeds projection domain%") true (error cause)))))
     (define current (show target "column" "value" true tx))
     (define active (equal? (tx_state tx) "active"))
     (tx_rollback owner)
     (define after (show target "column" "value" true))
     (altercolumn target "value" "default" nil)
     (and rejected active (equal? (current "RawType") "VARCHAR") (equal? (current "Default") "😀😀")
      (equal? (after "RawType") "VARCHAR") (equal? (after "Default") "😀😀")
      (equal? (scan nil target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +) 0)))
  expect:
    result: true
- name: A bound default definition must be dropped before changing a SQL datatype
  sql: ALTER TABLE projection_bound_default ALTER COLUMN value NVARCHAR(10) NULL
  expect:
    error: true
- name: Rejected bound-default alteration preserves the original descriptor
  tds:
    statements:
    - sql: SELECT TOP 0 value AS observed FROM projection_bound_default
      expect:
        rows: 0
        column_types:
        - name: observed
          type: VARCHAR
          nullable: true
- name: Native character projection rejects a legacy-codepage loss before effects and retains the original transaction
  scm: |-
    (begin
     (define target (table "memcp-tests" false "projection_loss"))
     (define owner (newsession)) (owner "username" "root")
     (tx_begin_acid owner) (define tx (owner "__memcp_tx"))
     (insert target '("value") (list (list "😀")) '() nil false nil tx)
     (define previous (show target "column" "value" true tx))
     (define collation (coalesceNil (previous "Collation") ""))
     (define projection (tsql_column_value_projection
      (list "Default" nil "DefaultName" "" "DefaultExpression" "") "VARCHAR" '(-1) collation))
     (define rejected (try (lambda () (begin
      (altercolumn target "value" "validated_declaration"
       (list (list "VARCHAR" '(-1) true collation) (list "VARCHAR" '(2) true collation) projection) tx)
      false)) (lambda (cause) (if (strlike (string (failure_value cause)) "%not representable in single-byte encoding%") true (error cause)))))
     (define current (show target "column" "value" true tx))
     (define active (equal? (tx_state tx) "active"))
     (define values (scan tx target '() '() '() (lambda () true) '("value")
      (lambda (values value) (append values value)) '() append))
     (tx_rollback owner)
     (and rejected active (expression_equal? (current "Dimensions") '(2))
      (expression_equal? values '("😀"))
      (equal? (scan nil target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +) 0)))
  expect:
    result: true
- name: A recursive DEFAULT fails busy before waiting while the original first declaration completes
  scm: |-
    (begin
     true
     (define owner (newsession)) (owner "username" "root")
     (tx_begin_acid owner) (define tx (owner "__memcp_tx"))
     (define target (table "memcp-tests" false "projection_loss" false tx))
     (define marker (table "memcp-tests" false "projection_marker" false tx))
     (insert target '("value") (list (list "ok")) '() nil false nil tx)
     (define previous (show target "column" "value" true tx))
     (define collation (coalesceNil (previous "Collation") ""))
     (define caught (newsession)) (caught "busy" false)
     (define projection (lambda (value) (begin
      (define busy (try (lambda () (begin (altercolumn marker "value" "default" 42 tx) false))
       (lambda (cause) (if (strlike (string (failure_value cause)) "%native mutation is still active; retry public declaration construction%") true (error cause)))))
      (caught "busy" busy)
      value)))
     (define accepted (try (lambda () (begin
      (altercolumn target "value" "validated_declaration"
       (list (list "NVARCHAR" '(2) true collation) (list "VARCHAR" '(2) true collation) projection) tx)
      true)) (lambda (cause) (if (strlike (string (failure_value cause)) "%native mutation is still active; retry public declaration construction%") false (error cause)))))
     (define current (show target "column" "value" true tx))
     (define default_unchanged (nil? ((show marker "column" "value" true tx) "Default")))
     (define own_value (scan tx target '() '() '() (lambda () true) '("value") (lambda (_ value) value) nil (lambda (left right) (coalesceNil left right))))
     (define outside_count (scan nil target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +))
     (define active (and (equal? (tx_state tx) "active") (identical? tx (owner "__memcp_tx"))))
     (define source_absent (empty_list? (showprocedures "memcp-tests" "projection_reentrant_source" tx)))
     (tx_rollback owner)
     (and (and accepted (caught "busy")) active default_unchanged source_absent
      (equal? (current "RawType") "NVARCHAR") (equal? own_value "ok") (equal? outside_count 0)
      (equal? ((show target "column" "value" true) "RawType") "VARCHAR")
      (nil? ((show marker "column" "value" true) "Default"))
      (empty_list? (showprocedures "memcp-tests" "projection_reentrant_source" nil))
      (equal? (scan nil target '() '() '() (lambda () true) '() (lambda (count) (+ count 1)) 0 +) 0)))
  expect:
    result: true
- name: A recursive source declaration fails busy without retiring the original first factory
