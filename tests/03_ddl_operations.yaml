# DDL Operations Test Suite
# Data Definition Language: CREATE, DROP, ALTER operations with affected_rows

metadata:
  version: "1.0"
  description: "DDL operations (CREATE, DROP, ALTER) with affected_rows validation"

setup:
  # Ensure user rows don't pre-exist from earlier runs
  - sql: "DELETE FROM system.user WHERE username = 'testuser'"
  - sql: "DELETE FROM system.user WHERE username = 'testuser2'"
  - sql: "DROP VIEW IF EXISTS ddl_view_nested"
  - sql: "DROP VIEW IF EXISTS ddl_view_totals"
  - sql: "DROP VIEW IF EXISTS ddl_view_base"
  - sql: "DROP VIEW IF EXISTS ddl_view_cycle_a"
  - sql: "DROP VIEW IF EXISTS ddl_view_cycle_b"
  - sql: "DROP VIEW IF EXISTS ddl_view_shadow"
  - sql: "DROP TABLE IF EXISTS ddl_view_shadow"
  - sql: "DROP TABLE IF EXISTS ddl_view_copy"
  - sql: "DROP TABLE IF EXISTS ddl_view_source"
  - sql: "CREATE TABLE ddl_view_source (id INT, category VARCHAR(20), amount INT)"
  - sql: "CREATE TABLE ddl_view_copy (id INT, amount INT)"
  - sql: "INSERT INTO ddl_view_source (id, category, amount) VALUES (1, 'a', 10), (2, 'a', 20), (3, 'b', 30)"

test_cases:

  # === CREATE TABLE OPERATIONS ===
  - name: "CREATE TABLE basic structure"
    sql: "CREATE TABLE users (id INT, name VARCHAR(50))"
    expect:
      affected_rows: 1

  - name: "CREATE TABLE with multiple columns"
    sql: "CREATE TABLE products (id INT, name VARCHAR(100), price DECIMAL(10,2), description TEXT)"
    expect:
      affected_rows: 1

  - name: "CREATE TABLE with constraints"
    sql: "CREATE TABLE orders (id INT PRIMARY KEY, user_id INT, total DECIMAL(10,2), status VARCHAR(20))"
    expect:
      affected_rows: 1

  - name: "CREATE TABLE with IF NOT EXISTS"
    sql: "CREATE TABLE IF NOT EXISTS customers (id INT, name VARCHAR(100))"
    expect:
      affected_rows: 1

  - name: "CREATE TABLE with IF NOT EXISTS (already exists)"
    sql: "CREATE TABLE IF NOT EXISTS users (id INT, email VARCHAR(200))"
    expect:
      affected_rows: 1

  - name: "CREATE TABLE with various data types"
    sql: |
      CREATE TABLE test_types (
        id INT,
        name VARCHAR(100),
        price DECIMAL(10,2),
        active BOOLEAN,
        created_at TIMESTAMP,
        notes TEXT
      )
    expect:
      affected_rows: 1

  - name: "CREATE TABLE with ENGINE specification"
    sql: "CREATE TABLE memory_table (id INT, data VARCHAR(100)) ENGINE=MEMORY"
    expect:
      affected_rows: 1

  # === SHOW OPERATIONS ===
  - name: "SHOW DATABASES"
    sql: "SHOW DATABASES"
    expect: {}  # Environment dependent, just check it runs

  - name: "SHOW TABLES"
    sql: "SHOW TABLES"
    expect: {}  # Environment dependent, just check it runs

  - name: "SHOW TABLES FROM specific database"
    sql: "SHOW TABLES FROM ddl_test"
    expect: {}  # Environment dependent, just check it runs

  - name: "DESCRIBE table structure"
    sql: "DESCRIBE users"
    expect: {}  # Just check it runs successfully

  - name: "SHOW FULL COLUMNS"
    sql: "SHOW FULL COLUMNS FROM users"
    expect: {}  # Just check it runs successfully

  - name: "SHOW TABLE STATUS"
    sql: "SHOW TABLE STATUS"
    expect: {}  # Just check it runs successfully

  - name: "SHOW VARIABLES"
    sql: "SHOW VARIABLES"
    expect: {}  # Environment dependent, just check it runs

  # === SESSION VARIABLES ===
  - name: "SET session variable"
    sql: "SET @test_var = 'hello'"
    expect: {}  # Session variables return assigned value, not affected_rows

  - name: "SET session variable with SESSION keyword"
    sql: "SET SESSION @another_var = 42"
    expect: {}  # Session variables return assigned value, not affected_rows

  - name: "SET session variable with expression"
    sql: "SET @calculated = 5 + 3 * 2"
    expect: {}  # Session variables return assigned value

  - name: "SET session variable with MySQL assignment operator"
    session_id: "mysql-set-assign"
    sql: "SET @mysql_assign := 105"
    expect: {}

  - name: "Read variable assigned with MySQL assignment operator"
    session_id: "mysql-set-assign"
    sql: "SELECT @mysql_assign AS assigned_value"
    expect:
      rows: 1
      data:
        - assigned_value: 105

  - name: "SET multiple session variables"
    sql: "SET @var1 = 'test', @var2 = 123"
    expect: {}  # Multiple session variables

  # === GLOBAL VARIABLES ===
  - name: "SET complex expression"
    sql: "SET @complex = 5 + 3 * 2"
    expect: {}  # Just check it runs successfully

  - name: "SET string concatenation"
    sql: "SET @text = 'hello'"
    expect: {}  # Just check it runs successfully

  - name: "MATCH AGAINST compatibility"
    setup:
      - sql: "DROP TABLE IF EXISTS match_against_compat"
      - sql: "CREATE TABLE match_against_compat (id INT PRIMARY KEY, title TEXT, body TEXT)"
      - sql: "INSERT INTO match_against_compat (id, title, body) VALUES (1, 'Alpha title', 'middle'), (2, 'Beta title', 'Alpha body'), (3, 'Beta only', 'none')"
    cleanup:
      - sql: "DROP TABLE IF EXISTS match_against_compat"
    sql: "SELECT id FROM match_against_compat WHERE MATCH (body) AGAINST ('Alpha' IN NATURAL LANGUAGE MODE)"
    expect:
      rows: 1
      data:
        - id: 2

  - name: "MATCH AGAINST checks multiple columns"
    setup:
      - sql: "DROP TABLE IF EXISTS match_against_compat_multi"
      - sql: "CREATE TABLE match_against_compat_multi (id INT PRIMARY KEY, title TEXT, body TEXT)"
      - sql: "INSERT INTO match_against_compat_multi (id, title, body) VALUES (1, 'Alpha title', 'middle'), (2, 'Beta title', 'Alpha body'), (3, 'Beta only', 'none')"
    cleanup:
      - sql: "DROP TABLE IF EXISTS match_against_compat_multi"
    sql: "SELECT id FROM match_against_compat_multi WHERE MATCH (title, body) AGAINST ('Alpha') ORDER BY id"
    expect:
      rows: 2
      data:
        - id: 1
        - id: 2

  # TODO: DROP TABLE operations (when DROP functionality is stable)
  # - name: "DROP TABLE with IF EXISTS"
  #   sql: "DROP TABLE IF EXISTS test_drop"
  #   expect:
  #     affected_rows: 0  # Table doesn't exist

  # - name: "DROP existing TABLE"
  #   sql: "DROP TABLE memory_table"
  #   expect:
  #     affected_rows: 1

  # TODO: ALTER TABLE operations (when ALTER functionality is stable)
  # - name: "ALTER TABLE add column"
  #   sql: "ALTER TABLE users ADD COLUMN email VARCHAR(200)"
  #   expect:
  #     affected_rows: 1

  # - name: "ALTER TABLE modify column"
  #   sql: "ALTER TABLE users MODIFY COLUMN name VARCHAR(200)"
  #   expect:
  #     affected_rows: 1

  # TODO: CREATE INDEX operations
  # - name: "CREATE INDEX"
  #   sql: "CREATE INDEX idx_name ON users (name)"
  #   expect:
  #     affected_rows: 1

  # === CREATE USER OPERATIONS ===
  - name: "CREATE USER basic"
    sql: "CREATE USER testuser"
    expect:
      affected_rows: 1

  - name: "CREATE USER with password"
    sql: "CREATE USER testuser2 IDENTIFIED BY 'password123'"
    expect:
      affected_rows: 1

  # === ALTER TABLE and INDEX syntax coverage ===
  - name: "ALTER TABLE MODIFY COLUMN"
    sql: "ALTER TABLE users MODIFY COLUMN name VARCHAR(255)"
    expect:
      affected_rows: 1

  - name: "ALTER TABLE CHANGE COLUMN"
    sql: "ALTER TABLE users CHANGE name name VARCHAR(128)"
    expect:
      affected_rows: 1

  - name: "ALTER TABLE DROP INDEX noop"
    sql: "ALTER TABLE users DROP INDEX idx_name"
    expect:
      affected_rows: 1

  - name: "CREATE UNIQUE INDEX with prefix length"
    sql: "CREATE UNIQUE INDEX name_prefix_unique ON users (name(16))"
    expect: {}

  - name: "DROP INDEX noop"
    sql: "DROP INDEX name_prefix_unique ON users"
    expect: {}

  - name: "ALTER TABLE ADD FOREIGN KEY"
    sql: "ALTER TABLE users ADD FOREIGN KEY (id) REFERENCES users(id) ON UPDATE CASCADE ON DELETE RESTRICT"
    expect: {}

  - name: "ALTER TABLE DROP FOREIGN KEY noop"
    sql: "ALTER TABLE users DROP FOREIGN KEY fk_dummy"
    expect:
      affected_rows: 1

  # === LOGICAL VIEW OPERATIONS ===
  - name: "CREATE VIEW stores and expands a logical SELECT"
    sql: |
      CREATE VIEW ddl_view_base (key_id, category, doubled)
      AS SELECT id, category, amount * 2
      FROM ddl_view_source
      WHERE amount >= 20
    expect:
      affected_rows: 1

  - name: "SELECT reads an expanded view without materialization"
    sql: "SELECT key_id, category, doubled FROM ddl_view_base ORDER BY key_id"
    expect:
      rows: 2
      data:
        - { key_id: 2, category: "a", doubled: 40 }
        - { key_id: 3, category: "b", doubled: 60 }

  - name: "system.views keeps raw SQL and parsed IR"
    sql: |
      SELECT dialect, sql LIKE 'SELECT%' AS has_sql, ir IS NOT NULL AS has_ir
      FROM system.views
      WHERE database = 'memcp-tests' AND name = 'ddl_view_base'
    expect:
      rows: 1
      data:
        - { dialect: "sql", has_sql: true, has_ir: true }

  - name: "Nested views are recursively expanded"
    sql: "CREATE VIEW ddl_view_nested AS SELECT key_id, doubled + 1 AS result FROM ddl_view_base"
    expect:
      affected_rows: 1

  - name: "Nested view query sees the complete logical query"
    sql: "SELECT key_id, result FROM ddl_view_nested ORDER BY key_id"
    expect:
      rows: 2
      data:
        - { key_id: 2, result: 41 }
        - { key_id: 3, result: 61 }

  - name: "Duplicate CREATE VIEW fails"
    sql: "CREATE VIEW ddl_view_base AS SELECT id FROM ddl_view_source"
    expect:
      error: true

  - name: "CREATE VIEW IF NOT EXISTS preserves the definition"
    sql: "CREATE VIEW IF NOT EXISTS ddl_view_base AS SELECT id FROM ddl_view_source"
    expect:
      affected_rows: 0

  - name: "CREATE OR REPLACE VIEW invalidates cached plans"
    sql: |
      CREATE OR REPLACE VIEW ddl_view_base (key_id, category, doubled)
      AS SELECT id, category, amount * 3 FROM ddl_view_source
    expect:
      affected_rows: 1

  - name: "Repeated SELECT uses the replaced view definition"
    sql: "SELECT key_id, category, doubled FROM ddl_view_base ORDER BY key_id"
    expect:
      rows: 3
      data:
        - { key_id: 1, category: "a", doubled: 30 }
        - { key_id: 2, category: "a", doubled: 60 }
        - { key_id: 3, category: "b", doubled: 90 }

  - name: "Aggregate view supports the TPC-H Q15 query shape"
    sql: |
      CREATE VIEW ddl_view_totals (supplier_no, total_revenue)
      AS SELECT id, SUM(amount)
      FROM ddl_view_source
      GROUP BY id
    expect:
      affected_rows: 1

  - name: "Aggregate view can be referenced by an aggregate subquery"
    sql: |
      SELECT supplier_no, total_revenue
      FROM ddl_view_totals
      WHERE total_revenue = (SELECT MAX(total_revenue) FROM ddl_view_totals)
    expect:
      rows: 1
      data:
        - { supplier_no: 3, total_revenue: 30 }

  - name: "INSERT SELECT compiles views as logical sources"
    sql: "INSERT INTO ddl_view_copy (id, amount) SELECT key_id, doubled FROM ddl_view_base"
    expect:
      affected_rows: 3

  - name: "INSERT SELECT copied the expanded view rows"
    sql: "SELECT id, amount FROM ddl_view_copy ORDER BY id"
    expect:
      rows: 3
      data:
        - { id: 1, amount: 30 }
        - { id: 2, amount: 60 }
        - { id: 3, amount: 90 }

  - name: "View output alias count must match"
    sql: "CREATE VIEW ddl_bad_view (only_one) AS SELECT id, amount FROM ddl_view_source"
    expect:
      error: true

  - name: "Circular view definitions can be recorded"
    sql: "CREATE VIEW ddl_view_cycle_a AS SELECT * FROM ddl_view_cycle_b"
    expect:
      affected_rows: 1

  - name: "Second half of circular view can be recorded"
    sql: "CREATE VIEW ddl_view_cycle_b AS SELECT * FROM ddl_view_cycle_a"
    expect:
      affected_rows: 1

  - name: "Circular view expansion fails explicitly"
    sql: "SELECT * FROM ddl_view_cycle_a"
    expect:
      error: true

  - name: "Physical table shadows a view with the same name"
    setup:
      - sql: "CREATE VIEW ddl_view_shadow AS SELECT amount FROM ddl_view_source WHERE id = 1"
      - sql: "CREATE TABLE ddl_view_shadow (amount INT)"
      - sql: "INSERT INTO ddl_view_shadow (amount) VALUES (99)"
    sql: "SELECT amount FROM ddl_view_shadow"
    expect:
      rows: 1
      data:
        - { amount: 99 }

  - name: "DROP VIEW removes the catalog entry"
    sql: "DROP VIEW ddl_view_nested"
    expect:
      affected_rows: 1

  - name: "DROP missing VIEW fails"
    sql: "DROP VIEW ddl_view_nested"
    expect:
      error: true

  - name: "DROP VIEW IF EXISTS accepts a missing view"
    sql: "DROP VIEW IF EXISTS ddl_view_nested"
    expect:
      affected_rows: 0

  # TODO: ALTER USER operations
  # - name: "ALTER USER password"
  #   sql: "ALTER USER testuser IDENTIFIED BY 'newpassword'"
  #   expect:
  #     affected_rows: 1

cleanup:
  # Clean up created users to keep suite idempotent
  - sql: "DELETE FROM system.user WHERE username = 'testuser'"
  - sql: "DELETE FROM system.user WHERE username = 'testuser2'"
  - sql: "DROP TABLE IF EXISTS ddl_view_shadow"
  - sql: "DROP VIEW IF EXISTS ddl_view_shadow"
  - sql: "DROP VIEW IF EXISTS ddl_view_cycle_b"
  - sql: "DROP VIEW IF EXISTS ddl_view_cycle_a"
  - sql: "DROP VIEW IF EXISTS ddl_view_totals"
  - sql: "DROP VIEW IF EXISTS ddl_view_base"
  - sql: "DROP TABLE IF EXISTS ddl_view_copy"
  - sql: "DROP TABLE IF EXISTS ddl_view_source"
