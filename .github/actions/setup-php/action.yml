name: Build external ZTS PHP
description: Build the released embedded PHP runtime outside the repository
runs:
  using: composite
  steps:
  - name: Install external PHP build and runtime dependencies
    env:
      PHP_VERSION: 8.5.10
      PHP_SHA256: 6a8bebaa4d5a979a38db29a9373e9851f60c6b11f72172c585947e78f3081957
    shell: bash
    run: |
      set -euo pipefail
      if command -v dnf >/dev/null 2>&1; then
        # The RPM job runs as root inside its target Fedora distribution.
        dnf install -y gcc gcc-c++ make autoconf automake libtool pkgconf-pkg-config \
          bison re2c sqlite-devel oniguruma-devel libzip-devel libicu-devel \
          libpng-devel libjpeg-turbo-devel freetype-devel libwebp-devel libxml2-devel \
          libcurl-devel openssl-devel gmp-devel ImageMagick-devel curl-minimal tar xz
      else
        PACKAGES="build-essential pkg-config bison re2c libsqlite3-dev libonig-dev libzip-dev libicu-dev libpng-dev libjpeg-dev libfreetype6-dev libwebp-dev libxml2-dev libcurl4-openssl-dev libssl-dev libgmp-dev libmagickwand-dev php-cli php-imap" \
          bash "$GITHUB_ACTION_PATH/../setup-apt/install.sh"
      fi
  - name: Identify PHP runtime ABI
    id: php-abi
    shell: bash
    run: |
      . /etc/os-release
      echo "image=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      source_hash=$(sha256sum "$GITHUB_ACTION_PATH/action.yml")
      echo "source=${source_hash%% *}" >> "$GITHUB_OUTPUT"
  - name: Restore external PHP ZTS runtime
    id: php-cache
    uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
    with:
      path: ${{ runner.temp }}/php-zts
      key: php-zts-${{ runner.os }}-${{ runner.arch }}-${{ steps.php-abi.outputs.image }}-${{ steps.php-abi.outputs.source }}
  - name: Compile external PHP ZTS runtime
    if: steps.php-cache.outputs.cache-hit != 'true'
    env:
      PHP_VERSION: 8.5.10
      PHP_SHA256: 6a8bebaa4d5a979a38db29a9373e9851f60c6b11f72172c585947e78f3081957
    shell: bash
    run: |
      cd "$RUNNER_TEMP"
      curl --connect-timeout 30 --max-time 180 --retry 2 --retry-max-time 360 -fsSL "https://www.php.net/distributions/php-${PHP_VERSION}.tar.xz" -o php.tar.xz
      echo "$PHP_SHA256  php.tar.xz" | sha256sum --check
      tar -xf php.tar.xz
      cd "php-${PHP_VERSION}"
      ./configure --prefix="$RUNNER_TEMP/php-zts" \
        --disable-all --enable-cli --enable-embed=shared --enable-zts \
        --disable-zend-signals --enable-zend-max-execution-timers \
        --with-gettext --enable-mbstring --enable-mbregex --enable-intl --with-zip --with-gmp \
        --with-curl --with-openssl --with-zlib --with-iconv \
        --with-libxml --enable-dom --enable-xml --enable-xmlreader --enable-xmlwriter --enable-simplexml \
        --enable-fileinfo --enable-filter --enable-tokenizer --enable-ctype \
        --enable-gd --with-jpeg --with-freetype --with-webp \
        --enable-pdo --with-pdo-sqlite --with-pdo-mysql=mysqlnd --enable-mysqlnd --enable-session
      make -j2
      make install
      cd "$RUNNER_TEMP"
      curl --connect-timeout 30 --max-time 180 --retry 2 --retry-max-time 360 -fsSL https://pecl.php.net/get/imagick-3.8.1.tgz -o imagick.tgz
      echo "3a3587c0a524c17d0dad9673a160b90cd776e836838474e173b549ed864352ee  imagick.tgz" | sha256sum --check
      tar -xf imagick.tgz
      cd imagick-3.8.1
      "$RUNNER_TEMP/php-zts/bin/phpize"
      ./configure --with-php-config="$RUNNER_TEMP/php-zts/bin/php-config"
      make -j2
      make install
      echo 'extension=imagick.so' > "$RUNNER_TEMP/php-zts/lib/php.ini"

      mkdir -p "$RUNNER_TEMP/php-zts/share/licenses/php"
      cd "$RUNNER_TEMP/php-${PHP_VERSION}"
      find . -type f \( -name LICENSE -o -name 'LICENSE.*' -o -name COPYING -o -name 'COPYING.*' -o -name NOTICE \) \
        -exec install -D -m 644 '{}' "$RUNNER_TEMP/php-zts/share/licenses/php/{}" \;
      install -D -m 644 "$RUNNER_TEMP/imagick-3.8.1/LICENSE" "$RUNNER_TEMP/php-zts/share/licenses/php/imagick/LICENSE"
  - name: Export PHP runtime configuration
    shell: bash
    run: echo "PHP_CONFIG=$RUNNER_TEMP/php-zts/bin/php-config" >> "$GITHUB_ENV"
