name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: recovery-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: |
          pip install requests PyYAML
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Run tests
        run: bash git-pre-commit

      - name: Verify dump and restore compatibility
        env:
          MEMCP_RECOVERY_MARIADB_PASSWORD: recovery-test
        run: >-
          python3 tools/test_mysqldump_recovery.py
          --mariadb-host=127.0.0.1
          --mariadb-port=3306
          --mysqldump=mariadb-dump
