name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  test:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: recovery-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: |
          pip install requests PyYAML
          # Browser repositories are unrelated to these Ubuntu build dependencies.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Run tests
        timeout-minutes: 30
        env:
          MEMCP_TEST_LOGDIR: ${{ runner.temp }}/memcp-test-diagnostics
        run: bash git-pre-commit

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/memcp-test-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify dump and restore compatibility
        env:
          MEMCP_RECOVERY_MARIADB_PASSWORD: recovery-test
        run: >-
          python3 tools/test_mysqldump_recovery.py
          --mariadb-host=127.0.0.1
          --mariadb-port=3306
          --mysqldump=mariadb-dump

  php:
    needs: [changes, test]
    if: ${{ needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/php.yml

  rpm:
    needs: [changes, test]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    uses: ./.github/workflows/rpm.yml

  packaging:
    needs: [changes, test]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install package tooling
        run: |
          # Browser repositories are unrelated to these Ubuntu build dependencies.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y lintian mariadb-client rpm

      - name: Test package lifecycle helpers
        run: python3 tools/test_packaging.py

      - uses: ./.github/actions/setup-php

      - name: Build and inspect DEB artifacts
        run: |
          make memcp.deb
          python3 tools/test_packaging.py --artifacts --format deb
          lintian --fail-on error,warning "dist/memcp_$(make -s version)_amd64.deb"

      - name: Test DEB install, upgrade, remove, reinstall, and purge
        run: |
          # The installed package must not borrow PHP from the CI build prefix.
          mv "$RUNNER_TEMP/php-zts" "$RUNNER_TEMP/php-zts.build-only"
          tools/test_deb_lifecycle.sh "dist/memcp_$(make -s version)_amd64.deb"

      - name: Validate container definition without building it
        run: docker build --check .

  alternative-storage:
    needs: [changes, test]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MINIO_ROOT_USER: memcp-ci
      MINIO_ROOT_PASSWORD: memcp-ci-password
      MEMCP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEMCP_TEST_S3_BUCKET: memcp-test
      MEMCP_TEST_S3_ACCESS_KEY: memcp-ci
      MEMCP_TEST_S3_SECRET_KEY: memcp-ci-password

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build latest MinIO release from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve every run: new upstream releases must exercise our S3 contract.
          # Build outside the checkout with MinIO's own go.mod and go.sum.
          release=$(gh api repos/minio/minio/releases/latest --jq .tag_name)
          test -n "$release" && test "$release" != null
          echo "Testing MinIO $release" | tee "$RUNNER_TEMP/minio-version.txt"
          mkdir -p "$RUNNER_TEMP/minio-source"
          curl --fail --location --retry 3 \
            "https://codeload.github.com/minio/minio/tar.gz/refs/tags/$release" \
            --output "$RUNNER_TEMP/minio-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/minio-source.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/minio-source"
          cd "$RUNNER_TEMP/minio-source"
          go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/minio" .
          sha256sum "$RUNNER_TEMP/minio" | tee -a "$RUNNER_TEMP/minio-version.txt"

      - name: Start S3-compatible storage
        run: |
          "$RUNNER_TEMP/minio" server --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 "$RUNNER_TEMP/minio-data" \
            >"$RUNNER_TEMP/minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/minio.pid"
          for attempt in $(seq 1 60); do
            kill -0 "$(cat "$RUNNER_TEMP/minio.pid")" || break
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1

      - name: Stress the S3 persistence contract
        run: go test ./storage -run TestS3PersistenceStress -count=1 -v

      - name: Build MemCP
        run: go build -o memcp .

      - name: Exercise S3 multi-shard crash recovery
        env:
          MEMCP_S3_CONFIG: >-
            {"backend":"s3","access_key_id":"memcp-ci","secret_access_key":"memcp-ci-password","region":"us-east-1","endpoint":"http://127.0.0.1:9000","bucket":"memcp-test","prefix":"reliability-${{ github.run_id }}-${{ github.run_attempt }}","force_path_style":true}
        run: >-
          python3 tools/reliability_drill.py
          --mode atomicity
          --atomicity-rows 201
          --commit-crashes 5
          --database-config-json "$MEMCP_S3_CONFIG"

      - name: Print S3 server log after failure
        if: failure()
        run: cat "$RUNNER_TEMP/minio.log"

      - name: Stop S3-compatible storage
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/minio.pid"; then
            kill "$(cat "$RUNNER_TEMP/minio.pid")" || true
          fi

      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alternative-storage-reliability
          path: |
            /tmp/memcp-reliability-*/
            ${{ runner.temp }}/minio.log
            ${{ runner.temp }}/minio-version.txt
          if-no-files-found: warn
          retention-days: 7
