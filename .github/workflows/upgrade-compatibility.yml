name: Upgrade Compatibility

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_refs:
        description: 'JSON list of extra old refs; previous master and every upgrade-release-* tag are always tested.'
        required: false
        default: '[]'
        type: string

permissions:
  contents: read

concurrency:
  group: upgrade-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  versions:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      predecessors: ${{ steps.refs.outputs.predecessors }}
    steps:
      - name: Check out refs and release pins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: refs
        name: Select predecessor revisions
        env:
          REQUESTED_REFS: ${{ inputs.base_refs || '[]' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.run(
                  ['git', *args], check=True, capture_output=True,
                  text=True).stdout.strip()

          def commit(ref):
              return git('rev-parse', '--verify', ref + '^{commit}')

          refs = json.loads(os.environ['REQUESTED_REFS'])
          if not isinstance(refs, list) or any(not isinstance(ref, str) or not ref.strip() for ref in refs):
              raise ValueError('base_refs must be a JSON list of nonempty Git refs')
          if len(refs) > 16:
              raise ValueError('at most 16 additional predecessor refs per run')

          base = os.environ.get('PR_BASE_REF') or 'origin/master'
          selected = [(base, 'previous-master')]
          tags = git('tag', '--list', 'upgrade-release-*').splitlines()
          selected.extend((tag, tag) for tag in sorted(tags))
          selected.extend((ref, 'requested:' + ref) for ref in refs)

          predecessors = []
          seen = set()
          for ref, label in selected:
              sha = commit(ref)
              if sha in seen:
                  continue
              seen.add(sha)
              predecessors.append({
                  'ref': sha,
                  'label': label,
              })
          if len(predecessors) > 256:
              raise ValueError('GitHub matrix supports at most 256 pinned predecessors')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('predecessors=' + json.dumps(predecessors, separators=(',', ':')) + '\n')
          PY

  check-upgrade:
    name: upgrade (${{ matrix.predecessor.label }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        predecessor: ${{ fromJSON(needs.versions.outputs.predecessors) }}
    steps:
      - name: Check out merge candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          path: candidate

      - name: Check out predecessor revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.predecessor.ref }}
          path: base

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: candidate/go.mod

      - name: Install SQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Build base and candidate
        shell: bash
        run: |
          set -euo pipefail
          (cd base && go build -o memcp)
          (cd candidate && go build -o memcp)
          printf 'UPGRADE_BASE_SHA=%s\n' "$(git -C base rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compare all values before and after a clean upgrade
        shell: bash
        run: bash candidate/tests/storage/persistence/upgrade-run.sh

      - name: Prove the public upgrade workload detects incompatible cache layouts
        if: ${{ matrix.predecessor.label == 'previous-master' }}
        run: python3 candidate/tests/storage/persistence/upgrade-helper-negative.py candidate upgrade-negative-controls

      - name: Upload references and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-compatibility-${{ env.UPGRADE_BASE_SHA }}-${{ strategy.job-index }}
          path: |
            upgrade-oracles/
            upgrade-logs/
            upgrade-negative-controls/*/run.log
            upgrade-negative-controls/*/upgrade-logs/
          retention-days: 7

      - name: Upload data on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-data-${{ env.UPGRADE_BASE_SHA }}-${{ strategy.job-index }}
          path: upgrade-test-data/
          retention-days: 3

  upgrade-compatibility:
    name: upgrade-compatibility
    needs: [changes, versions, check-upgrade]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected predecessor to pass
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          VERSION_RESULT: ${{ needs.versions.result }}
          UPGRADE_RESULT: ${{ needs.check-upgrade.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$CHANGE_RESULT" = success
          if [ "$RELEVANT" != true ] && [ "$EVENT_NAME" != workflow_dispatch ]; then
            test "$VERSION_RESULT" = skipped
            test "$UPGRADE_RESULT" = skipped
          else
            test "$VERSION_RESULT" = success
            test "$UPGRADE_RESULT" = success
          fi
