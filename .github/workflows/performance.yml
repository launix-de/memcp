name: Performance A/B

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: memcp-performance
  cancel-in-progress: false

jobs:
  discover:
    name: discover-performance-suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}

    steps:
      - name: Check out exact base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install discovery dependency
        run: pip install PyYAML

      - name: Discover trusted CI performance suites
        id: suites
        shell: bash
        run: |
          suites=$(python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          selected = []
          for path in sorted(Path("base/tests/performance").rglob("*.yaml")):
              with path.open(encoding="utf-8") as handle:
                  document = yaml.safe_load(handle) or {}
              if document.get("metadata", {}).get("ci", True) is not False:
                  selected.append({
                      "id": len(selected),
                      "suite": path.relative_to("base").as_posix(),
                  })
          if not selected:
              raise SystemExit("trusted base contains no CI performance suites")
          print(json.dumps(selected, separators=(",", ":")))
          PY
          )
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  measure:
    name: performance-ab / ${{ matrix.entry.suite }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.discover.outputs.suites) }}

    steps:
      - name: Check out merge candidate
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate

      - name: Check out exact base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: candidate/go.mod

      - name: Install benchmark dependencies
        run: pip install requests PyYAML

      - name: Build base
        working-directory: base
        run: go build -o memcp

      - name: Build merge candidate
        working-directory: candidate
        run: go build -o memcp

      - name: Run independent performance assertion
        shell: bash
        run: |
          harness=base/tools/perf_ab.py
          harness_tests=base/tools/test_perf_ab.py
          runner=base/run_sql_tests.py
          if [ ! -f "$harness" ]; then
            harness=candidate/tools/perf_ab.py
            harness_tests=candidate/tools/test_perf_ab.py
            runner=candidate/run_sql_tests.py
          fi
          python3 "$harness_tests"
          python3 "$harness" \
            --base-tree base \
            --candidate-tree candidate \
            --runner "$runner" \
            --suite "${{ matrix.entry.suite }}" \
            --samples 5 \
            --output perf-results.json

      - name: Upload performance comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-ab-${{ matrix.entry.id }}
          path: perf-results.json
          if-no-files-found: warn

  performance-ab:
    name: performance-ab
    if: always()
    needs: [discover, measure]
    runs-on: ubuntu-latest
    steps:
      - name: Require every performance comparison
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: |
          test "$DISCOVER_RESULT" = success
          test "$MEASURE_RESULT" = success
