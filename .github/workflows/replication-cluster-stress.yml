name: Replication Cluster Stress test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replication-cluster-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  replication-cluster-stress:
    name: Replication Cluster Stress test
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out MemCP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install SQL client
        uses: ./.github/actions/setup-apt
        with:
          packages: mariadb-client

      - name: Build MemCP
        run: go build -tags=nophp -o "$RUNNER_TEMP/memcp-replication" .

      - name: Check process runner and write oracle
        run: python3 tools/test_reliability_drill.py

      - name: Run remote reductions, generation GC, crash, reclaim and isolation scenarios
        run: >-
          python3 -u tools/replication_cluster_stress.py
          --binary "$RUNNER_TEMP/memcp-replication"
          --artifacts "$RUNNER_TEMP/replication-stress"
          --seed 20261023 --rounds 5 --workers 4 --operations 25

      - name: Build race-instrumented servers
        run: go build -race -tags=nophp -o "$RUNNER_TEMP/memcp-replication-race" .

      - name: Check MOSI state-machine and publication units for races
        run: >-
          go test -race -tags=nophp ./storage/mosi ./storage ./scm
          -run 'TestReplication|TestMosi|TestRemoteScan|TestScanDelegation|TestProcedureWire|TestCreateTableRefreshesInvalidatedPlannerCacheOnInit'
          -count=1

      - name: Check generation GC and dedicated-listener scenarios with the Go race detector
        env:
          GORACE: halt_on_error=1 exitcode=66
        run: >-
          python3 -u tools/replication_cluster_stress.py
          --binary "$RUNNER_TEMP/memcp-replication-race"
          --artifacts "$RUNNER_TEMP/replication-stress-race"
          --seed 20261025 --rounds 1 --workers 3 --operations 12
          --dedicated-replication-port

      - name: Upload node logs and write oracle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replication-cluster-stress
          path: |
            ${{ runner.temp }}/replication-stress
            ${{ runner.temp }}/replication-stress-race

  cluster-stress:
    name: Cluster Stress test
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out MemCP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install SQL client
        uses: ./.github/actions/setup-apt
        with:
          packages: mariadb-client
      - name: Build servers
        id: build_cluster
        run: go build -tags=nophp -o "$RUNNER_TEMP/memcp-cluster" .
      - name: Check authenticated placement and shared-budget units
        run: >-
          go test -race -tags=nophp ./storage ./scm
          -run '^Test(Cluster|RemoteScan|ScanDelegation|ProcedureWire)' -count=1
      - name: Check four-node placement, mutable MOSI and tenant isolation
        run: >-
          python3 -u tools/replication_cluster_stress.py
          --binary "$RUNNER_TEMP/memcp-cluster"
          --artifacts "$RUNNER_TEMP/cluster-placement" --cluster-only --seed 20261026
      - name: Build race-instrumented servers
        id: build_cluster_race
        if: ${{ !cancelled() && steps.build_cluster.outcome == 'success' }}
        run: go build -race -tags=nophp -o "$RUNNER_TEMP/memcp-cluster-race" .
      - name: Check cluster processes with race detector
        if: ${{ !cancelled() && steps.build_cluster_race.outcome == 'success' }}
        env:
          GORACE: halt_on_error=1 exitcode=66
        run: >-
          python3 -u tools/replication_cluster_stress.py
          --binary "$RUNNER_TEMP/memcp-cluster-race"
          --artifacts "$RUNNER_TEMP/cluster-placement-race" --cluster-only --seed 20261026
          --fixture-binary "$RUNNER_TEMP/memcp-cluster"
      - name: Check SQL session and transaction contexts
        if: ${{ !cancelled() && steps.build_cluster.outcome == 'success' }}
        run: >-
          python3 -u tools/replication_cluster_stress.py
          --binary "$RUNNER_TEMP/memcp-cluster"
          --artifacts "$RUNNER_TEMP/cluster-contexts" --cluster-context-only --seed 20261027
      - name: Check SQL runtime contexts with race detector
        if: ${{ !cancelled() && steps.build_cluster_race.outcome == 'success' }}
        env:
          GORACE: halt_on_error=1 exitcode=66
        run: >-
          python3 -u tools/replication_cluster_stress.py
          --binary "$RUNNER_TEMP/memcp-cluster-race"
          --artifacts "$RUNNER_TEMP/cluster-contexts-race" --cluster-context-only --seed 20261027
          --fixture-binary "$RUNNER_TEMP/memcp-cluster"
      - name: Upload cluster logs, budgets and result oracle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cluster-placement
          path: |
            ${{ runner.temp }}/cluster-placement
            ${{ runner.temp }}/cluster-placement-race
            ${{ runner.temp }}/cluster-contexts
            ${{ runner.temp }}/cluster-contexts-race
