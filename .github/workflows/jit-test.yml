name: JIT Test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jit-test-${{ github.ref }}
  cancel-in-progress: true

env:
  JIT_GO_REF: jit-foreign-frames-go1.27.0

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  jit-test:
    name: jit-test
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: recovery-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out MemCP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out patched Go compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: launix-de/go
          ref: ${{ env.JIT_GO_REF }}
          path: .third_party/go-jit

      - name: Read patched Go version
        id: jit-go-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^go\([0-9].*\)$/\1/p' .third_party/go-jit/VERSION | head -n 1)
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up matching bootstrap Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.jit-go-version.outputs.version }}
          cache: false

      - uses: ./.github/actions/setup-php

      - name: Build MemCP with patched Go compiler
        run: make jit

      - name: Select patched Go compiler
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_WORKSPACE/.third_party/go-jit/bin" >> "$GITHUB_PATH"
          printf 'GOROOT=%s\n' "$GITHUB_WORKSPACE/.third_party/go-jit" >> "$GITHUB_ENV"
          printf 'GOEXPERIMENT=jit\n' >> "$GITHUB_ENV"

      - name: Verify compiler identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOROOT)" = "$GITHUB_WORKSPACE/.third_party/go-jit"
          jit_go_revision=$(git -C "$GITHUB_WORKSPACE/.third_party/go-jit" rev-parse HEAD)
          printf 'Patched Go revision: `%s`\n' "$jit_go_revision" >> "$GITHUB_STEP_SUMMARY"
          go version
          go env GOEXPERIMENT

      - name: Install test dependencies
        timeout-minutes: 5
        run: |
          pip install --timeout 30 --retries 3 requests PyYAML

      - name: Install SQL client
        timeout-minutes: 9
        uses: ./.github/actions/setup-apt
        with:
          packages: mariadb-client

      - name: Run concurrent tests with JIT enabled
        timeout-minutes: 30
        env:
          MEMCP_TEST_LOGDIR: ${{ runner.temp }}/memcp-test-diagnostics
        run: bash git-pre-commit

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jit-test-diagnostics
          path: ${{ runner.temp }}/memcp-test-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify dump and restore compatibility with JIT enabled
        env:
          MEMCP_RECOVERY_MARIADB_PASSWORD: recovery-test
        run: >-
          python3 tools/test_mysqldump_recovery.py
          --mariadb-host=127.0.0.1
          --mariadb-port=3306
          --mysqldump=mariadb-dump

  jit-cross-test:
    name: jit-cross-test (${{ matrix.arch }})
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, riscv64]
    steps:
      - name: Check out MemCP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out patched Go compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: launix-de/go
          ref: ${{ env.JIT_GO_REF }}
          path: .third_party/go-jit
      - name: Read bootstrap version
        id: bootstrap
        run: |
          version=$(sed -n 's/^go\([0-9].*\)$/\1/p' .third_party/go-jit/VERSION | head -n 1)
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up bootstrap Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.bootstrap.outputs.version }}
          cache: false
      - name: Install CPU emulators
        uses: ./.github/actions/setup-apt
        with:
          packages: qemu-user-static
      - name: Execute native JIT and storage suites under QEMU
        run: make jit-cross-test JIT_CROSS_ARCH=${{ matrix.arch }}
