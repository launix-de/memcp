name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(make -s version)
          test "${GITHUB_REF_NAME}" = "v${version}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian rpm

      - name: Run fast release checks
        run: python3 tools/test_packaging.py

      - name: Build release artifacts
        run: |
          make memcp.deb
          make memcp.rpm RPMBUILD_FLAGS=--nodeps
          cp memcp "dist/memcp_${VERSION}_linux_amd64"
          chmod 0755 "dist/memcp_${VERSION}_linux_amd64"

      - name: Inspect package contents
        run: |
          make package-check
          lintian --fail-on error,warning "dist/memcp_${VERSION}_amd64.deb"
          rpm -K "dist/memcp_${VERSION}_x86_64.rpm"

      - name: Create checksums
        working-directory: dist
        run: sha256sum memcp_* > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/memcp_*
            dist/SHA256SUMS

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: carli2/memcp
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "MemCP ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
